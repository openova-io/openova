# docs/ledger/stability.yaml - the stability register.
#
# One entry per surface of the repository: its paths, its class, its change policy and the evidence for the class.
# Only the architect changes this file. scripts/check-frozen-paths.py reads it; its head states the format and the rules.
#
#   class          stable     fewer than 5 human commits in 90 days and a green gate check that exercises the surface
#                  settling   changing, or quiet without a function proof
#                  thrashing  at least 10 human commits in 90 days of which 60 percent or more are fixes, or redesigned
#                             in the last 30 days, or its end-to-end check is red
#                  frozen     passed its soak; a change needs a decision record
#   change_policy  open             any package may change the paths
#                  closed           only the packages in allowed_packages may change the paths
#                  fix-only         only packages of type fix, test, guard, delete or doc may change the paths
#                  decision-record  a change carries "Decision: ADR-NNNN" and that record unfreezes the entry
#
# The first seven entries are the topology surface. They are closed to every package but FND-900 until their soak
# checks have passed in two gate records; then they become frozen. The numbers of an entry of kind churn are those of
# "python3 scripts/check-frozen-paths.py classify" at the commit named in its ref.
schema: openova.io/stability/v1
