# Values of lab test AIP-030 (agent runtime proof). The measurement record is docs/ledger/plan/spikes/AIP-030.md.
# Every value below was measured in the runs listed under evidence; later packages copy them and choose none.
id: AIP-030
date: "2026-11-14"
verdict: fail
failedMandatory: [T1]
passedMandatoryOnK3s135WithGates: [T1, T3, T4, T5, T6, T9, T10]
passedWithAdditions: [T2]
kagentChart: oci://ghcr.io/kagent-dev/kagent/helm/kagent
kagentVersion: 1.0.1          # published 2026-11-12; meets the 30-day age rule from 2026-12-12
substrateVersion: v1.0.0      # charts 1.0.0, pinned by the kagent 1.0.1 installer; published 2026-11-06; age rule met from 2026-12-06
workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.0
minimumKubernetes: "1.35"     # measured v1.35.10+k3s1 and v1.36.6+k3s1; v1.31.8, v1.33.13 and v1.34.13 cannot serve the API
nodePreparation:
  - "k3s v1.35 or later on every node (measured v1.35.10+k3s1)"
  - "kube-apiserver, kube-controller-manager, kube-scheduler and kubelet with --feature-gates=ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true"
  - "kube-apiserver with --runtime-config=certificates.k8s.io/v1beta1=true"
  - "nothing else on the node: no runsc binary, no containerd handler, no RuntimeClass, no sysctl"
policyExceptions:
  - "Pod Security baseline, namespace ate-system only: atelet DaemonSet, hostPath /var/lib/ate, /var/lib/kubelet/plugins, /var/lib/kubelet/device-plugins, /dev"
  - "Pod Security baseline, the namespace of the WorkerPool (measured: the Organization's namespace): gVisor worker Deployment (one per WorkerPool), added capabilities NET_ADMIN, SYS_ADMIN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, CHOWN, NET_RAW, SETFCAP; seccomp and AppArmor Unconfined; hostPath /var/lib/ate"
  - "Enforce: flux-managed and harbor-proxy-pull refuse every workload of the install as upstream ships it; the worker Deployment is created by Substrate's controller, not by Flux"
  - "Enforce: probes-present (10 workloads); resource-requests (the worker and ate-idp-server)"
  - "Audit only: multi-replica-drainability, otel-injected, prometheus-scrape, runasnonroot-readonlyrootfs, resource-limits, secret-not-in-env, topology-spread"
harnessYAML: |
  apiVersion: api.kagent.dev/v1alpha3
  kind: Harness
  metadata: {name: kagent-default, namespace: "{organization}"}
  spec:
    kagent: {}
    substrate:
      workerPoolRef: {name: kagent-default}
      snapshotPolicy: {location: "s3://ate-snapshots/kagent/"}
workerPoolYAML: |
  apiVersion: ate.dev/v1
  kind: WorkerPool
  metadata:
    name: kagent-default
    namespace: "{organization}"
    labels: {kagent.dev/worker-pool-name: kagent-default, kagent.dev/worker-pool-namespace: "{organization}"}
  spec:
    replicas: 1
    workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.0
    sandboxClasses: [{name: gvisor, configRef: {name: gvisor-default}}]
    template: {serviceAccountName: kagent-default}
snapshotLocation: s3://ate-snapshots/kagent/   # the bundled RustFS of the substrate in ate-system
placement: host-namespace     # every mandatory test was measured here; vcluster passed T2 only with six additions
databaseCredentialRoute: file # Pod Certificates (signer postgres.podcert.ate.dev/identity); URLs in a ConfigMap
a2aURLTemplate: http://kagent-controller.{organization}.svc.cluster.local:8083/agents/{organization}/{agent}
a2aProtocol: "A2A 1.0 JSON-RPC: SendMessage, GetTask, CancelTask; role ROLE_USER; text parts"
substrateScope: per-cluster   # one ate-system per cluster; only kagent is per Organization
workerNamespace: organization # the WorkerPool and its gVisor worker pod ran in each Organization's namespace (org-a, org-b, org-v); a pool in ate-system was not measured
controllerOwnership: global   # every Organization's controller is a bootstrap owner, so a global owner; see AIP-031
actorJwt:
  issuer: https://idp.ate-system.svc
  jwks: https://idp.ate-system.svc/openid/v1/jwks
  alg: ES256
  audience: [model-gateway]
  lifetimeSeconds: 900
  agentNameClaim: false
  upgradeTriggerMet: false
localPack: not-measured
evidence:
  branch: spike/AIP-030
  commit: 612bae143d38f89d22d430186efed49c22ff1abf
  runs: [43585483487, 43586571222, 43589792811, 43591317705]
  runtimeJob: 132436443768
  artifact: 14113067098
