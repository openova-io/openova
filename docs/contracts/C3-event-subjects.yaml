# Contract C3: the event subjects of the JetStream stream CATALYST_ORG. The rules are at the head of
# scripts/check-event-subjects.py (guard G4). An area registers a subject by adding an entry in its own
# pull request. A new subject is catalyst.<domain>.<event>.v<major>; a breaking payload change is a new
# subject. Components: catalyst-api, a service by its folder under core/services, a controller as
# <folder under core/controllers>-controller. Empty producers: a reserved subject, or a legacy subject
# that no component publishes on this stream. payload is the Go type or JSON Schema of the payload.
schema: openova.io/event-subjects/v1
stream: CATALYST_ORG
subjects:
  - {subject: catalyst.billing.order.placed, envelope: legacy, owner: BSS, producers: [billing], consumers: [notification, organization-controller, provisioning], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.domain.registered, envelope: legacy, owner: BSS, producers: [domain], consumers: [notification], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.domain.removed, envelope: legacy, owner: BSS, producers: [], consumers: [notification], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.domain.verified, envelope: legacy, owner: BSS, producers: [], consumers: [notification], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.member.invited, envelope: legacy, owner: BSS, producers: [], consumers: [notification], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.payment.received, envelope: legacy, owner: BSS, producers: [], consumers: [notification], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.provision.app_failed, envelope: legacy, owner: BSS, producers: [provisioning], consumers: [notification, tenant], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.provision.app_ready, envelope: legacy, owner: BSS, producers: [provisioning], consumers: [notification, tenant], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.provision.app_removed, envelope: legacy, owner: BSS, producers: [provisioning], consumers: [notification, tenant], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.provision.completed, envelope: legacy, owner: BSS, producers: [provisioning], consumers: [notification, tenant], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.provision.failed, envelope: legacy, owner: BSS, producers: [provisioning], consumers: [notification, tenant], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.provision.org_create_failed, envelope: legacy, owner: BSS, producers: [provisioning], consumers: [], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.provision.org_created, envelope: legacy, owner: BSS, producers: [provisioning], consumers: [], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.provision.started, envelope: legacy, owner: BSS, producers: [provisioning], consumers: [notification], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.provision.step, envelope: legacy, owner: BSS, producers: [provisioning], consumers: [], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.provision.tenant_failed, envelope: legacy, owner: BSS, producers: [provisioning], consumers: [], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.provision.tenant_removed, envelope: legacy, owner: BSS, producers: [provisioning], consumers: [tenant], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.tenant.app_install_requested, envelope: legacy, owner: BSS, producers: [tenant], consumers: [provisioning], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.tenant.app_uninstall_requested, envelope: legacy, owner: BSS, producers: [tenant], consumers: [provisioning], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.tenant.created, envelope: legacy, owner: BSS, producers: [tenant], consumers: [organization-controller, provisioning], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.tenant.deleted, envelope: legacy, owner: BSS, producers: [organization-controller, tenant], consumers: [billing, domain, provisioning, tenant], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.tenant.sandbox_requested, envelope: legacy, owner: BSS, producers: [catalyst-api, tenant], consumers: [sandbox-controller, tenant], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.usage.recorded, envelope: legacy, owner: BSS, producers: [metering-sidecar], consumers: [billing], payload: core/services/shared/events/nats.go, delivery: at-least-once}
  - {subject: catalyst.user.login, envelope: legacy, owner: BSS, producers: [], consumers: [notification], payload: core/services/shared/events/events.go, delivery: at-least-once}
  - {subject: catalyst.audit.recorded.v1, envelope: cloudevents, owner: CTL, producers: [], consumers: [], payload: products/catalyst/bootstrap/api/internal/audit/audit.go, delivery: at-least-once}
  - {subject: catalyst.alert.changed.v1, envelope: cloudevents, owner: FND, producers: [], consumers: [], payload: docs/contracts/C3-alert-changed-v1.schema.json, delivery: at-least-once}
