# organization-controller ClusterRole.
#
# Minimum-permission grants for the reconciler:
#
#  - get/list/watch + status patch on Organization CRs
#  - get/list/watch + create/update/patch on UserAccess CRs
#    (so the per-owner UserAccesses can be (re)written)
#  - get on Secrets in the Keycloak SA + Gitea SA Secret namespaces
#    (the deployment mounts these directly via env-from-secret-ref;
#     get is sufficient — no list/watch since we don't subscribe)
#
# Per ADR-0001 §2.7 the controller does NOT touch Namespace, Pod,
# Deployment, or any other workload resource — those are reconciled by
# Flux on the host cluster from the manifests we write into the per-Org
# Gitea repo.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: organization-controller
  labels:
    app.kubernetes.io/name: organization-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: catalyst
rules:
  - apiGroups: ["orgs.openova.io"]
    resources: ["organizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["orgs.openova.io"]
    resources: ["organizations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["orgs.openova.io"]
    resources: ["organizations/finalizers"]
    verbs: ["update"]
  - apiGroups: ["access.openova.io"]
    resources: ["useraccesses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # #3376 fix: the reconciler renders a per-Organization Gateway-API
  # HTTPRoute for `console.<slug>.<parentDomain>` (tenant_route.go,
  # issue #1629 follow-up) AND the per-Org vCluster Flux loop
  # (per_org_flux.go, PR #3700 §4.3) writes Flux GitRepository +
  # Kustomization CRs in flux-system. Both were authored by the
  # controller via the runtime client but had NO matching RBAC grant —
  # so `r.Create`/`r.Update` on a live Sovereign returned 403 and the
  # per-Org serving + vCluster loop silently stalled. Grant the minimum:
  #   - httproutes: render the per-tenant public route on cilium-gateway
  #   - gitrepositories/kustomizations: author the per-Org vCluster source
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leader-election lease — required when --leader-elect=true.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Event recorder — controller-runtime managers emit Events for failed
  # reconciles. Read access on configmaps is the controller-runtime
  # leader election fallback path.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Slice F2 (#1098): read the OIDC client secret referenced by
  # spec.identity.federationConfig.clientSecretRef. Plaintext values
  # stay in memory only long enough to be PUT/POSTed onto Keycloak.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: organization-controller
  labels:
    app.kubernetes.io/name: organization-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: catalyst
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: organization-controller
subjects:
  - kind: ServiceAccount
    name: organization-controller
    namespace: catalyst-controllers
