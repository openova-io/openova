# The customer's quota. Scoped to every pod that is NOT PriorityClass
# catalyst-org-platform - the purchase and every Application synced out
# of the Organization vCluster. The per-Org vCluster control plane (vcluster-0)
# and the per-Organization platform stack carry that class and are admitted
# against platform-quota, so nothing OpenOva runs eats into what the
# customer bought, and nothing the customer runs can starve OpenOva's pods.
# The plan term is the headline on limits and the guaranteed share (headline
# over the CPU 6x / memory 3x overcommit) on requests; the vCluster's synced
# coredns is the one overhead in this scope and is added on top.
#   plan m headline (limits): cpu=2 memory=4Gi
#   plan m guaranteed (requests): cpu=334m memory=1366Mi
#   vcluster coredns (synced): requests cpu=20m memory=64Mi; limits cpu=1 memory=170Mi
apiVersion: v1
kind: ResourceQuota
metadata:
  name: plan-quota
  namespace: acme
  labels:
    openova.io/organization: acme
    openova.io/plan: m
    openova.io/managed-by: catalyst
    openova.io/quota-scope: customer
  annotations:
    openova.io/quota-formula: "purchased plan + the vCluster's synced coredns (every pod not in PriorityClass catalyst-org-platform)"
    openova.io/plan-cap: "cpu=2 memory=4Gi"
    openova.io/plan-guaranteed-cpu: "334m"
    openova.io/plan-guaranteed-memory: "1366Mi"
    openova.io/plan-overcommit-cpu: "6"
    openova.io/plan-overcommit-memory: "3"
    openova.io/vcluster-coredns-overhead: "requests cpu=20m memory=64Mi; limits cpu=1 memory=170Mi"
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: NotIn
        values:
          - catalyst-org-platform
  hard:
    requests.cpu: "354m"
    requests.memory: "1430Mi"
    limits.cpu: "3"
    limits.memory: "4266Mi"
