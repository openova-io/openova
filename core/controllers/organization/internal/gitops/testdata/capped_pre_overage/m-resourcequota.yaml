# The customer's quota. Scoped to every pod that is NOT PriorityClass
# catalyst-org-platform - the website and mail server every Organization
# is given, every Application the customer adds and every pod synced out of
# the Organization vCluster. The per-Org vCluster control plane (vcluster-0)
# and the per-Organization platform stack carry that class and are admitted
# against platform-quota, so nothing OpenOva runs eats into what the
# customer bought, and nothing the customer runs can starve OpenOva's pods.
# The plan term is the headline on limits and the guaranteed share (headline
# over the CPU 6x / memory 3x overcommit) on requests; the vCluster's synced
# coredns and the given website and mail server are added on top, so the
# plan's part is left as sold for what the customer adds.
#   plan m headline (limits): cpu=2 memory=4Gi
#   plan m guaranteed (requests): cpu=334m memory=1366Mi
#   vcluster coredns (synced): requests cpu=20m memory=64Mi; limits cpu=1 memory=170Mi
#   given to every Organization (bp-wordpress-tenant, bp-stalwart-tenant): pods requests cpu=294m memory=855Mi; limits cpu=1750m memory=2560Mi; helm operations requests cpu=134m memory=299Mi; limits cpu=750m memory=768Mi
#     (the website and mail server the funnel installs for every
#     Organization, not chosen by the customer: their pods, the largest hook
#     pod and one surge replica, so the plan's part stays as sold)
#   classless platform credit: requests cpu=0 memory=0; limits cpu=0 memory=0; pods=0
#     (platform pods admitted before the platform scope existed carry no
#     class and are charged here; their usage is added back so they never eat
#     the plan. It shrinks to zero as they are replaced - every new platform
#     pod is stamped and charged to platform-quota)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: plan-quota
  namespace: acme
  labels:
    openova.io/organization: acme
    openova.io/plan: m
    openova.io/managed-by: catalyst
    openova.io/quota-scope: customer
  annotations:
    openova.io/quota-formula: "purchased plan + the vCluster's synced coredns + what every Organization is given + the classless platform credit (every pod not in PriorityClass catalyst-org-platform)"
    openova.io/included-applications-credit: "pods requests cpu=294m memory=855Mi; limits cpu=1750m memory=2560Mi; helm operations requests cpu=134m memory=299Mi; limits cpu=750m memory=768Mi"
    openova.io/classless-platform-credit: "requests cpu=0 memory=0; limits cpu=0 memory=0; pods=0"
    openova.io/plan-cap: "cpu=2 memory=4Gi"
    openova.io/plan-guaranteed-cpu: "334m"
    openova.io/plan-guaranteed-memory: "1366Mi"
    openova.io/plan-overcommit-cpu: "6"
    openova.io/plan-overcommit-memory: "3"
    openova.io/vcluster-coredns-overhead: "requests cpu=20m memory=64Mi; limits cpu=1 memory=170Mi"
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: NotIn
        values:
          - catalyst-org-platform
  hard:
    requests.cpu: "782m"
    requests.memory: "2584Mi"
    limits.cpu: "5500m"
    limits.memory: "7594Mi"
