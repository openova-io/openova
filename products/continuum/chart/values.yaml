# bp-continuum values — ADR-0015 D8 (native topology transitions).
#
# Continuum is reduced to: the cross-region lease (a file in Git), region-loss
# detection, and committing the next phase of a topology transition to the
# per-region Application files. It runs in EVERY region (bootstrap-kit slot 62
# renders per region). It never writes a workload object: Flux, CNPG and the
# chart's own rendering carry out each phase.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) every value below is
# overridable per Sovereign. Per #4a `image.tag` is stamped by CI on every
# push to main (.github/workflows/build-continuum-controller.yaml); the chart
# fails the render when it is empty.

# ─── Global registry rewrite (matches catalyst chart pattern) ──────────
global:
  imageRegistry: ""

continuum:
  # Default-OFF. Slot 62 sets ${CONTINUUM_ENABLED} (true on a multi-region
  # Sovereign). A single-region Sovereign has nothing to transition.
  enabled: false

  image:
    repository: "ghcr.io/openova-io/openova/continuum-controller"
    # CI stamps the SHA on every push to main.
    tag: "904f0fe"
    pullPolicy: IfNotPresent

  # In-region replicas; one is elected per region (in-region Lease). The
  # CROSS-region fence is the Git lease, not this.
  replicas: 1
  leaderElection:
    enabled: true

  # This region's canonical id (bootstrap-kit SOVEREIGN_REGION_CANONICAL_LABEL).
  # REQUIRED when enabled.
  region: ""

  # The Sovereign's region registry (bootstrap-kit SOVEREIGN_REGIONS_JSON,
  # `[{"cloudRegion":"<id>",...}]`). Renders one continuum-<region-id>
  # ClusterMesh Service per region (this region's selects the local pods; the
  # others are selector-less stubs).
  regionsJson: "[]"

  git:
    # The region whose Gitea is the WRITER (bootstrap-kit
    # SOVEREIGN_PRIMARY_REGION). When it is not this region, Continuum writes
    # through gitea-<writer-id> over ClusterMesh (ADR-0015 D1).
    writerRegionID: ""
    # Explicit override of the Gitea API base URL.
    apiURL: ""
    # Token with write access to every Org's catalyst-tenant repo. In a
    # follower region the shared PAT must be distributed into this namespace.
    tokenSecret:
      name: catalyst-gitea-token
      key: token

  observations:
    # Port of GET /v1/observations (read-only native status for the peers).
    port: 8082

  # Evaluation interval.
  tickSeconds: 10

  lease:
    # Git lease TTL: a region that stops renewing for this long loses the
    # right to act; another region resumes the transition from the record.
    ttlSeconds: 60

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  metrics:
    enabled: true
    port: 9090

  health:
    port: 8081

  # Free-form extra env vars.
  env: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ─── NetworkPolicy ────────────────────────────────────────────────────
networkPolicy:
  enabled: true
