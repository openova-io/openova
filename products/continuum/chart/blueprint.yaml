apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-continuum
  labels:
    catalyst.openova.io/section: pts-9-disaster-recovery
    openova.io/category: customer-facing-capability
spec:
  version: 0.2.1
  card:
    title: Continuum
    summary: |
      Native topology transitions for Applications placed across
      regions: commits each phase of a primary move to the per-region
      Git files and waits on CNPG / Flux / Application status. Runs in
      every region with a Git lease and region-loss detection.
    icon: continuum.svg
    category: disaster-recovery
  visibility: listed

  # ADR-0015 D8 — enabled by slot 62 on a multi-region Sovereign; one release
  # per region (bootstrap-kit renders every region).
  configSchema:
    type: object
    properties:
      continuum:
        type: object
        properties:
          enabled:
            type: boolean
            default: false
            description: Default-OFF gate (slot 62 sets ${CONTINUUM_ENABLED}).
          region:
            type: string
            description: This region's canonical id. Required when enabled.
          regionsJson:
            type: string
            description: The Sovereign's region registry (SOVEREIGN_REGIONS_JSON).
          git:
            type: object
            properties:
              writerRegionID:
                type: string
                description: The region whose Gitea is the writer (reached as gitea-<id> over ClusterMesh).
              apiURL:
                type: string
              tokenSecret:
                type: object
          replicas:
            type: integer
            default: 1
            minimum: 1
            description: In-region replicas; one is elected per region.
          tickSeconds:
            type: integer
            default: 10
          lease:
            type: object
            properties:
              ttlSeconds:
                type: integer
                default: 60

  placementSchema:
    # One release per region: every region runs its own Continuum (ADR-0015
    # D8). Each release is region-local; the regions coordinate through the
    # Git lease, not through a shared control plane.
    modes: [single-region]
    minRegions: 1
    maxRegions: 1

  manifests:
    chart: ./

  # Continuum calls no other Blueprint: it commits to Git and reads native
  # status (CNPG, Flux, Application) through the Kubernetes API.
  depends: []

  upgrades:
    from: []
