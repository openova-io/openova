{{- /*
NetworkPolicy for continuum-controller — ADR-0015 D8.

Ingress: metrics (monitoring), health (kubelet), observations (the other
regions' Continuum over ClusterMesh — read-only native status, so the port is
open to any peer; the source is a pod in another cluster of the mesh, which a
namespace/pod selector does not reliably match across clusters).
Egress: Kubernetes API, DNS, the writer Gitea (local gitea-http, or
gitea-<writer-id> over ClusterMesh), peers' observations port. Nothing else:
Continuum calls no PowerDNS, CNPG or NATS endpoint.
*/ -}}
{{- if and .Values.continuum.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "continuum.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuum.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "continuum.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: metrics
          protocol: TCP
    - ports:
        - port: health
          protocol: TCP
    - ports:
        - port: observations
          protocol: TCP
  egress:
    # Kubernetes API server.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Writer Gitea (gitea-http locally; gitea-<writer-id> over ClusterMesh).
    - ports:
        - port: 3000
          protocol: TCP
    # Peer regions' observations (continuum-<region-id> over ClusterMesh).
    - ports:
        - port: {{ .Values.continuum.observations.port }}
          protocol: TCP
{{- end }}
