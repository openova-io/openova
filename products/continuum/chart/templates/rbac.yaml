{{- /*
ClusterRole + ClusterRoleBinding for continuum-controller — ADR-0015 D8.

Continuum acts through Git only. Its Kubernetes access is READ of the native
status it waits on, plus the status subresource of its own CRs and of the
Application it mirrors the transition onto:

  resource                                     verbs
  ──────────────────────────────────────────────────────────────────
  continuums.dr.openova.io                     get,list,watch
  continuums.dr.openova.io/status              get,patch
  applications.apps.openova.io                 get,list,watch
  applications.apps.openova.io/status          get,patch
  helmreleases.helm.toolkit.fluxcd.io          get,list,watch   (applied primary + Ready)
  clusters.postgresql.cnpg.io                  get,list,watch   (demotionToken, lastPromotionToken, Ready)
  coordination.k8s.io/leases                   get,list,watch,create,update,patch (in-region leader election
                                                                 between this region's replicas only)
  ""/events                                    create,patch

No workload write verb: scripts/check-continuum-no-workload-mutation.sh fails
CI if one is added here or in the Go source.
*/ -}}
{{- if .Values.continuum.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "continuum.fullname" . }}
  labels:
    {{- include "continuum.labels" . | nindent 4 }}
rules:
  - apiGroups: ["dr.openova.io"]
    resources: ["continuums"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dr.openova.io"]
    resources: ["continuums/status"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps.openova.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps.openova.io"]
    resources: ["applications/status"]
    verbs: ["get", "patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  # /v1/serving — the functional endpoint probe (core/controllers/pkg/serving)
  # for this region's legs: the app's HTTPRoutes and the gateway Service they
  # attach to. Read-only.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "continuum.fullname" . }}
  labels:
    {{- include "continuum.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "continuum.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "continuum.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
