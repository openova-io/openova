{{- /*
ClusterRole + ClusterRoleBinding for continuum-controller.

K-Cont-1 shipped the SKELETON least-privilege grants. K-Cont-2
EXTENDS with the verbs needed by the per-CR reconciler + 7-step
switchover sequencer (#1101):

  resource                                                       verbs
  ────────────────────────────────────────────────────────────────────
  continuums.dr.openova.io                                       get,list,watch,update,patch
  continuums.dr.openova.io/status                                get,update,patch
  continuums.dr.openova.io/finalizers                            update
  applications.apps.openova.io                                   get,list,watch
  clusters.postgresql.cnpg.io                                    get,list,watch,update,patch (CNPG status read + primary-flip + replica.enabled flip — K-Cont-2)
  clusters.postgresql.cnpg.io/status                             get                          (lag observation — K-Cont-2)
  httproutes.gateway.networking.k8s.io                           get,list,watch,update,patch  (drain step-3 — K-Cont-2)
  coordination.k8s.io/leases                                     get,list,watch,create,update,patch,delete
  ""/namespaces                                                  get,list,watch
  ""/events                                                      create,patch
  ""/configmaps                                                  get,list,watch,create,update,patch,delete (per-CR state for dns-quorum lease impl — K-Cont-3)
  ""/secrets                                                     get                          (CF KV token, PDM token — K-Cont-3 wires SealedSecret refs)
*/ -}}
{{- if .Values.continuum.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "continuum.fullname" . }}
  labels:
    {{- include "continuum.labels" . | nindent 4 }}
rules:
  - apiGroups: ["dr.openova.io"]
    resources: ["continuums"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["dr.openova.io"]
    resources: ["continuums/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["dr.openova.io"]
    resources: ["continuums/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps.openova.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  # CNPG cluster-pair access — K-Cont-2 reads status + patches
  # primary annotation + flips spec.replica.enabled at switchover.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters/status"]
    verbs: ["get"]
  # Gateway API HTTPRoute — read for discovery, update for drain
  # (step-3 of the switchover sequence sets backendRef weight=0).
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # #3492 — raft-transition mechanism (bp-openbao). The switchover
  # sequence's promote step is OpenBao OSS peers.json RECOVERY: it execs
  # (optionally `bao operator raft snapshot restore`, then) a peers.json
  # rewrite inside the surviving openbao standby Pod, resolves a podSelector
  # to a Ready Pod, then DELETEs the Pod so openbao re-reads peers.json on
  # boot and self-elects as the sole leader. cnpg-pair switchovers never use
  # these; the grant ships up-front per Inviolable Principle #1 (target-state
  # shape). pods/exec is the create-verb subresource the SPDY exec stream
  # requires; `delete` on pods restarts the survivor for the peers.json
  # recovery (transition-to-primary is NOT an OSS command — openbao PR #996).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Per-CR state ConfigMaps — K-Cont-3's dns-quorum lease impl
  # uses a per-CR ConfigMap as a cache layer. K-Cont-2 reads/writes
  # ConfigMaps for the same purpose during in-cluster bootstrap.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Secrets read — K-Cont-3 reads the CF API token from a
  # SealedSecret-decrypted Secret. K-Cont-2 doesn't use this yet but
  # ships the grant up-front per Inviolable Principle #1
  # (target-state shape first time).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "continuum.fullname" . }}
  labels:
    {{- include "continuum.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "continuum.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "continuum.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
