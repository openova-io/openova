{{- /*
ClusterRole + ClusterRoleBinding for continuum-controller — ADR-0015 D8.

Continuum acts through Git only. Its Kubernetes access is READ of the native
status it waits on, plus the status subresource of its own CRs and of the
Application it mirrors the transition onto:

  resource                                     verbs
  ──────────────────────────────────────────────────────────────────
  continuums.dr.openova.io                     get,list,watch
  continuums.dr.openova.io/status              get,patch
  applications.apps.openova.io                 get,list,watch
  applications.apps.openova.io/status          get,patch
  helmreleases.helm.toolkit.fluxcd.io          get,list,watch   (applied primary + Ready)
  clusters.postgresql.cnpg.io                  get,list,watch   (demotionToken, lastPromotionToken, Ready)
  coordination.k8s.io/leases                   get,list,watch,create,update,patch (in-region leader election
                                                                 between this region's replicas only)
  ""/events                                    create,patch
  ""/nodes                                     get,list,watch   (which node the reboot agent cordons)
  apps/daemonsets kured (Role, in the reboot   get,patch        (the reboot agent's own lock annotation:
  agent's namespace)                                             held while a transition of this region
                                                                 runs, so kured starts no drain — a lock,
                                                                 like the leases; internal/reboot)

No workload write verb: scripts/check-continuum-no-workload-mutation.sh fails
CI if one is added here or in the Go source. The kured lock is the one
exception it allows, by name.
*/ -}}
{{- if .Values.continuum.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "continuum.fullname" . }}
  labels:
    {{- include "continuum.labels" . | nindent 4 }}
rules:
  - apiGroups: ["dr.openova.io"]
    resources: ["continuums"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dr.openova.io"]
    resources: ["continuums/status"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps.openova.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps.openova.io"]
    resources: ["applications/status"]
    verbs: ["get", "patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "continuum.fullname" . }}
  labels:
    {{- include "continuum.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "continuum.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "continuum.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.continuum.rebootAgent.hold }}
---
# The reboot agent's lock: kured (bp-kured, DaemonSet named kured whatever the
# release) locks in an annotation of its own DaemonSet before it drains a
# node. Continuum holds that lock while a transition of this region runs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "continuum.fullname" . }}-reboot-hold
  namespace: {{ .Values.continuum.rebootAgent.namespace }}
  labels:
    {{- include "continuum.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "patch"]
    resourceNames: ["kured"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "continuum.fullname" . }}-reboot-hold
  namespace: {{ .Values.continuum.rebootAgent.namespace }}
  labels:
    {{- include "continuum.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "continuum.fullname" . }}-reboot-hold
subjects:
  - kind: ServiceAccount
    name: {{ include "continuum.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
