{{- /*
continuum-controller Deployment — ADR-0015 D8.

Rendered in EVERY region (bootstrap-kit slot 62 is per region). Each region's
Continuum observes its own region natively, serves those observations to the
other regions on the observations port, and — when it holds the group's Git
lease — commits the next phase of a topology transition to the writer Gitea.
All configuration is env-driven (Inviolable Principle #4).
*/ -}}
{{- if .Values.continuum.enabled }}
{{- $region := include "continuum.region" . -}}
{{- $writer := .Values.continuum.git.writerRegionID | default "" | trim -}}
{{- $giteaURL := .Values.continuum.git.apiURL | default "" | trim -}}
{{- if and (eq $giteaURL "") (ne $writer "") (ne $writer $region) -}}
{{- $giteaURL = printf "http://gitea-%s.gitea.svc.cluster.local:3000" $writer -}}
{{- end -}}
{{- if eq $giteaURL "" -}}
{{- $giteaURL = "http://gitea-http.gitea.svc.cluster.local:3000" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "continuum.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuum.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.continuum.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "continuum.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "continuum.labels" . | nindent 8 }}
        openova.io/region: {{ $region | quote }}
    spec:
      serviceAccountName: {{ include "continuum.fullname" . }}
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "continuum.image" (dict "root" .) | quote }}
          imagePullPolicy: {{ .Values.continuum.image.pullPolicy | default "IfNotPresent" }}
          args:
            - "--leader-elect={{ .Values.continuum.leaderElection.enabled }}"
            - "--metrics-bind-address=:{{ .Values.continuum.metrics.port | default 9090 }}"
            - "--health-probe-bind-address=:{{ .Values.continuum.health.port | default 8081 }}"
          env:
            - name: LEADER_ELECT_NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SOVEREIGN_REGION_ID
              value: {{ $region | quote }}
            - name: SOVEREIGN_REGIONS_JSON
              value: {{ include "continuum.regionsJson" . | quote }}
            - name: GITEA_API_URL
              value: {{ $giteaURL | quote }}
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.continuum.git.tokenSecret.name | quote }}
                  key: {{ .Values.continuum.git.tokenSecret.key | quote }}
                  optional: true
            - name: OBSERVATIONS_ADDR
              value: ":{{ .Values.continuum.observations.port }}"
            - name: PEER_URL_TEMPLATE
              value: {{ printf "http://continuum-{region}.%s.svc.cluster.local:%v" .Release.Namespace .Values.continuum.observations.port | quote }}
            - name: TICK_SECONDS
              value: {{ .Values.continuum.tickSeconds | quote }}
            - name: LEASE_TTL_SECONDS
              value: {{ .Values.continuum.lease.ttlSeconds | quote }}
            {{- range $k, $v := .Values.continuum.env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.continuum.metrics.port | default 9090 }}
            - name: health
              containerPort: {{ .Values.continuum.health.port | default 8081 }}
            - name: observations
              containerPort: {{ .Values.continuum.observations.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.continuum.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      {{- with .Values.continuum.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.continuum.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.continuum.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 15
{{- end }}
