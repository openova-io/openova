{{- /*
continuum-controller Deployment (slice K-Cont-1 of EPIC-6 #1101).

K-Cont-1 ships the SKELETON: a controller-runtime Manager wired to a
no-op Reconcile() over Continuum.dr.openova.io/v1 CRs. K-Cont-2 fills
in the reconcile loop (lease + replication watch + switchover
sequencer); K-Cont-3 wires the lease witness; K-Cont-4 ships the
Cloudflare Worker source.

All configuration env-driven per Inviolable Principle #4.
*/ -}}
{{- if .Values.continuum.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "continuum.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "continuum.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.continuum.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "continuum.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "continuum.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "continuum.fullname" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.continuum.prerequisiteCheck.enabled }}
      # #2922 PR-B prerequisite-guard initContainer — see values.yaml
      # comment block on continuum.prerequisiteCheck for full rationale.
      initContainers:
        - name: prerequisite-check
          image: {{ .Values.continuum.prerequisiteCheck.image | default "harbor.openova.io/proxy-dockerhub/alpine/k8s:1.30.0" | quote }}
          imagePullPolicy: {{ .Values.continuum.image.pullPolicy | default "IfNotPresent" }}
          command:
            - sh
            - -c
            - |
              set -eu
              echo "[prerequisite-check] probing for bp-cnpg-pair audit ConfigMap cluster-wide..."
              pair_count="$(kubectl get cm -A -l catalyst.openova.io/audit-config=true --no-headers 2>/dev/null | wc -l)"
              if [ "$pair_count" -eq 0 ]; then
                echo "[prerequisite-check] FAIL: no bp-cnpg-pair installation detected."
                echo "[prerequisite-check] bp-continuum reconcile loop requires bp-cnpg-pair (Pillar-3 #2840 AC#1)."
                echo "[prerequisite-check] Either install bp-cnpg-pair OR set continuum.enabled=false."
                echo "[prerequisite-check] Sleeping 5 min before retry (operator can scale Deployment to 0 to silence)."
                sleep 300
                exit 1
              fi
              echo "[prerequisite-check] PASS: found $pair_count bp-cnpg-pair installation(s); main container will start."
          resources:
            {{- toYaml (.Values.continuum.prerequisiteCheck.resources | default (dict "requests" (dict "cpu" "10m" "memory" "32Mi") "limits" (dict "cpu" "100m" "memory" "64Mi"))) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: controller
          image: {{ include "continuum.image" (dict "root" .) | quote }}
          imagePullPolicy: {{ .Values.continuum.image.pullPolicy | default "IfNotPresent" }}
          args:
            - "--leader-elect={{ .Values.continuum.leaderElection.enabled }}"
            - "--metrics-bind-address=:{{ .Values.continuum.metrics.port | default 9090 }}"
            - "--health-probe-bind-address=:{{ .Values.continuum.health.port | default 8081 }}"
          env:
            - name: LEADER_ELECT_NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # K-Cont-2 / K-Cont-3 seams (sketched here; values currently
            # unused by the no-op Reconcile but part of the target-state
            # shape per Inviolable Principle #1).
            - name: PDM_API_URL
              value: {{ .Values.continuum.pdmURL | default "" | quote }}
            - name: NATS_URL
              value: {{ .Values.continuum.natsURL | default "" | quote }}
            - name: LEASE_TTL_SECONDS
              value: {{ .Values.continuum.lease.ttlSeconds | default 30 | quote }}
            - name: LEASE_RENEW_SECONDS
              value: {{ .Values.continuum.lease.renewSeconds | default 10 | quote }}
            # Slice F-2 + F-3 — dry-run + post-switchover health
            # endpoints. Empty CONTINUUM_API_ADDR disables the HTTP
            # server entirely.
            - name: CONTINUUM_API_ADDR
              value: ":{{ .Values.continuum.api.port | default 8082 }}"
            {{- if .Values.continuum.api.tokenSecretRef }}
            - name: CONTINUUM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.continuum.api.tokenSecretRef.name | quote }}
                  key: {{ .Values.continuum.api.tokenSecretRef.key | quote }}
            {{- end }}
            - name: CONTINUUM_HEALTH_DELAY_SECONDS
              value: {{ .Values.continuum.health.postSwitchoverDelaySeconds | default 30 | quote }}
            {{- range $k, $v := .Values.continuum.env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.continuum.metrics.port | default 9090 }}
            - name: health
              containerPort: {{ .Values.continuum.health.port | default 8081 }}
            - name: api
              containerPort: {{ .Values.continuum.api.port | default 8082 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.continuum.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      {{- with .Values.continuum.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.continuum.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.continuum.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 15
{{- end }}
