apiVersion: v2
name: bp-continuum
description: |
  OpenOva Continuum — native topology transitions (ADR-0015 D8). Runs in
  every region; holds the cross-region Git lease, detects region loss, and
  commits the next phase of a primary move to the per-region Application
  files (traffic-off, data-primary with the CNPG demotion token, peers,
  traffic-on), waiting on native CNPG / Flux / Application status. It writes
  no workload object.
type: application
# 0.1.3 (#2922 PR-B, 2026-06-03): prerequisite-check initContainer.
# bp-continuum's reconcile loop assumes bp-cnpg-pair has been
# installed (Pillar-3 acceptance criterion #1 of #2840). If an
# operator overlay flips continuum.enabled=true without bp-cnpg-pair,
# the controller would crash on missing CNPG Cluster CR pairs. New
# initContainer probes for bp-cnpg-pair's audit ConfigMap (label
# catalyst.openova.io/audit-config=true) cluster-wide; if absent it
# sleeps 5 min + exits non-zero with a clear log line so `kubectl
# logs` surfaces the missing prerequisite instead of a confusing
# controller stack trace. Pairs with PR #2923 (cloud-init auto-emit
# of CONTINUUM_ENABLED on multi-region) — fresh multi-region provs
# that DO have bp-cnpg-pair installed pass through immediately.
# Operators can disable the guard via
# .Values.continuum.prerequisiteCheck.enabled=false (e.g. for
# chart unit tests or air-gapped offline evaluation). Pure additive
# template; no values-default change for existing consumers.
# Refs #2922 #2840.
# 0.1.2 (TBD-V34, 2026-05-20): re-publish after PR #2072's Blueprint
# Release run (#26144858280) failed the hollow-chart guard. 0.1.1 was
# tagged in-tree but never landed in GHCR because this chart declares
# NO `dependencies:` (controller-only chart, no upstream helm subchart
# to bundle). Same shape as bp-kyverno-policies (PR #2023) and bp-
# crossplane-claims — opt out via `catalyst.openova.io/no-upstream:
# "true"` (added to annotations below in this same edit). Bumping
# 0.1.1 → 0.1.2 forces a fresh publish; bootstrap-kit slot 62 pin
# moves to 0.1.2 in lockstep (Inviolable Principle #13).
#
# 0.1.1 (Pillar-3 unblock #2065, 2026-05-20): first attempt at a
# PUBLISHED version — never reached GHCR; see above.
# 0.1.0 sat in-tree without a bootstrap-kit slot to pin it, so the
# blueprint-release workflow's `detect changed paths` step never had
# reason to re-run and the chart was never pushed to GHCR.
# 0.1.7 (#3492, 2026-06-15): CORRECT the raft-transition promote step to the
# real OpenBao OSS mechanism. `bao operator raft transition-to-primary` does
# NOT exist in OSS (openbao PR #996 — OSS raft has only promote/demote
# voter-state, useless when all voters are dead), so the 0.1.6 RaftExecPromoter
# would have failed on a real region-kill. Replaced with OSS peers.json
# RECOVERY: (optional snapshot restore →) write a single-voter peers.json into
# <raftDataPath>/raft/ on the survivor → RESTART the Pod (new PodRestarter
# seam; openbao re-reads peers.json on boot and self-elects as sole leader).
# RBAC adds pods `delete` (the restart). The chart-side cross-region replication
# (region-B as a retry_join non-voter holding region-A's live KV) ships in
# bp-openbao 1.2.41. Slot-62 pin moves to 0.1.7 in lockstep (Principle #13).
# 0.1.6 (#3492, 2026-06-14): the switchover sequencer gains a
# per-mechanism Promoter seam — cnpg-pair (default, byte-identical) +
# raft-transition (bp-openbao). (Promote step corrected in 0.1.7 —
# transition-to-primary is not an OSS command.) RBAC adds pods + pods/exec for
# the raft promotion. Slot-62 pin moves to 0.1.6 in lockstep (Principle #13).
# 0.1.8 (#3829, #3375): the continuum-controller image gains the
# `k8s-lease` witness (native coordination.k8s.io/v1 Lease, air-gappable
# default) + a CATALYST_REGION fallback to the CR's primaryRegion so a
# healthy 2-region pair self-bootstraps leaseHolder=<region-a> even when
# the deployment never wired CATALYST_REGION (the live omantel.biz case).
# Before this the cnpg-pair Continuum CR sat Degraded/LeaseHeld=False
# forever (dns-quorum POC never acquired) → the console Topology tab had
# no live lease/standby/lag to render and fell back to "singleton". RBAC
# already grants coordination.k8s.io/leases — no chart RBAC change. New
# CATALYST_LEASE_NS env (defaults to the controller namespace). Slot-62
# pin moves to 0.1.8 in lockstep (Inviolable Principle #13).
# 0.1.9 (#4257): NO source change — pure version bump to force Flux to
# re-pull. The deploy-bot patched values.yaml image cf33522->9c91a7e
# (the #4254 build) WITHOUT bumping the chart version, so GHCR
# bp-continuum:0.1.8 was overwritten in place (digest 8207b07->c8e32e59).
# Flux's ChartVersion reconcileStrategy already recorded release v2 at
# 0.1.8 and refuses to re-pull the changed digest under the same version
# (suspend/resume does not force it). The live omantel.biz Sovereign was
# left running the stale cf33522 controller -> Continuum CR stuck
# Degraded/leaseHolder-empty -> Topology DR undeliverable. Bumping to
# 0.1.9 (image still 9c91a7e) forces the re-pull. Slot-62 pin moves to
# 0.1.9 in lockstep (Inviolable Principle #13).
# 0.1.10 (#4901): the continuum-controller now surfaces a lost REQUIRED
# synchronous hot-standby on the cnpg-pair Continuum CR status it owns:
# phase Healthy->Degraded, status.standbyAvailable=false,
# status.hotStandbyAbsent=true, and a StandbyAvailable=False /
# StandbyUnreachable condition when the pair's replica-role Cluster
# half is not Ready (or reports readyInstances=0 — the proven G12
# region-kill state on hw232 where the CR sat phase=Healthy /
# replicationLagSeconds=0 for the whole outage while writes stalled on
# SyncRep). Field + condition naming matches the catalyst-api DR-panel
# projection (#4905) so the stored and observed statuses agree. A
# Ready-but-lagging standby is NEVER flagged (lag rides its own field);
# dr-spine/raft continuums (no spec.cnpgPair) and unresolvable pairs
# are left untouched — no false alarms. Chart templates unchanged
# (controller-image change); the version bump forces the Flux re-pull
# once the deploy-bot stamps the new image SHA (the 0.1.9 lesson).
# Slot-62 pin + catalog-seed source.version move to 0.1.10 in lockstep
# (Inviolable Principle #13).
#
# 0.1.11 (#5125 Defect-2): step-8 re-clone-on-divergence. On region-a
# resume post-region-kill, the returning cnpg-pair half's walreceiver
# can crash-loop with "highest timeline N of the primary is behind
# recovery timeline N+1" (its own recovery history advanced past what
# the new primary can serve — no plain reconnect can fix this). The
# controller's per-CR reconcile loop now detects this exact signature
# (standby un-Ready + TimelineID strictly ahead of the acting primary —
# never on a healthy rejoin or ordinary catch-up lag) and drives the
# proven manual heal (delete + re-create the diverged Cluster CR to
# force a pg_basebackup re-clone), bounded to 3 attempts with linear
# backoff and failing loud (continuum-error audit + a False/
# RejoinRepairBounded condition) rather than looping forever. Surfaced
# on status.rejoinRepair + condition type RejoinRepair. Chart templates
# unchanged (controller-image change only); the version bump forces the
# Flux re-pull once the deploy-bot stamps the new image SHA (the 0.1.9
# lesson). Slot-62 pin + blueprint.yaml version move to 0.1.11 in
# lockstep (Inviolable Principle #13).
#
# 0.1.12 (#4901 follow-up): standby-GONE detection + flap-grace. The
# 0.1.10 standby-absent fix covered a replica Cluster CR that is
# present but not Ready; a replica CR DELETED outright (cluster
# deleted / region wiped) made FindPair fail -> "no determination" ->
# the prior StandbyAvailable=True condition was preserved forever
# (false-green). The reconcile loop now remembers the last-resolved
# replica (seeded from status.standbyReplicaCluster across controller
# restarts): a previously-seen replica that becomes unresolvable
# degrades the CR with reason StandbyAbsent, while present-but-not-
# Ready keeps StandbyUnreachable. Both degrade paths are gated behind
# a continuous-unavailability grace window (spec.standbyGraceSeconds,
# default 30s) so one flapped probe never flips the CR; recovery
# surfaces immediately. Chart templates unchanged (controller-image
# change only); the version bump forces the Flux re-pull once the
# deploy-bot stamps the new image SHA (the 0.1.9 lesson). Slot-62 pin
# + blueprint.yaml version move to 0.1.12 in lockstep (Inviolable
# Principle #13).
# 0.1.13: cross-region cnpg-pair PLANNED switchover — the controller drives a
# pair split across two API servers through the per-region bootstrap-kit
# Kustomization substitutes (CNPG distributed topology, bp-cnpg-pair 0.2.29),
# reaching region B via the existing cutover-secondary-kubeconfigs Secret.
# RBAC: kustomizations get+patch pinned to resourceNames [bootstrap-kit].
# Slot-62 pin + blueprint.yaml + catalog-seed move to 0.1.13 in lockstep.
# 0.1.14: ship the cross-region switchover image (86b0daa). 0.1.13 was published
#   before the #7048 Containerfile fix and still carries 6e23bf2; the deploy-bot
#   image bump does not republish a chart, so this version bump does.
# 0.1.15: ship the #7050 image (3e23910) — DB-only switchover skips flip-dns and
#   the request is cleared from a stale copy. The deploy-bot image bump does not
#   republish a chart, so this version bump does.
# 0.1.16: ship the #7052 image (e635e94: audit publish ensures CATALYST_ORG),
#   default natsURL to the bp-nats-jetstream Service (was empty, so every
#   switchover failed at step-7 and rolled back), and point the NATS egress
#   rule at nats-system (was openova-system, which matched nothing).
# 0.1.17: ship #7054 + #7055 (c39ba75). Promotion is the point of no return;
#   a switchover honours its target and starts from the observed writer; a
#   switchback adopts a DR-failed-over pair into the planned topology.
# 0.1.18: ship #7058 (e81b012) — desired-state convergence. The writer is
#   observed from the pair, never from the declared value; the controller runs
#   the switchover when spec.desiredPrimaryRegion (from the Application's
#   placement) differs from it; the imperative switchover request is gone.
# 0.1.19: ship #7063 (cbd4f28) — one Converged condition; a writer in the
#   declared non-home region is Healthy with the home half as its standby;
#   the lease identity is the observed writer.
# 0.1.20: ship #7065 (ddd6e05) — a DB-only switchover is not UNHEALTHY for
#   lack of DNS; each post-switchover check is logged by name.
# 0.2.0 (ADR-0015 D8, Refs #7067) — BREAKING: the imperative 7-step switchover
#   sequencer (CNPG/HTTPRoute/PowerDNS patches, pod exec/delete, NATS audit,
#   k8s-lease/cloudflare-kv/dns-quorum witnesses, dry-run API) is DELETED. The
#   controller is a phase committer: Git lease (compare-and-swap through the
#   writer Gitea), region-loss detection (peer observations over the
#   continuum-<region-id> ClusterMesh Service, ClusterIP), ordered commits to
#   regions/<region-id>/apps/<app>.yaml. Runs in every region; ships the
#   Continuum CRD in crds/. RBAC reduced to reads + continuums/status +
#   applications/status. Values: region, regionsJson, git.*, observations.*,
#   tickSeconds; removed pdmURL, natsURL, api.*, prerequisiteCheck.*.
# 0.2.1 (ADR-0015 D8, Refs #7067): Continuum CRD gains
#   spec.transition.repo.{path,folder} and spec.transition.helmRelease, so a
#   PLATFORM pair (bp-cnpg-pair, bp-postgres shared-pg*, installed by a
#   bootstrap-kit slot) is Git-delivered from the Sovereign region repo
#   (clusters/<fqdn>/regions/<r>/platform/<app>.yaml, lease under
#   clusters/<fqdn>/continuum/transitions/) and moved by the same phase
#   machine. Values unchanged (the controller image follows the deploy-bot).
