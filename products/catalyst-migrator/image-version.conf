# The version tag this image is published under, read by
# scripts/check-appversion-bumped-with-source.sh (Refs #7938). A build never
# pushes a version tag that exists, so a change of the Dockerfile must bump
# DEFAULT_RELEASE_TAG in the build workflow, or it is never published.
version-file: .github/workflows/build-catalyst-migrator.yaml
version-key: DEFAULT_RELEASE_TAG
