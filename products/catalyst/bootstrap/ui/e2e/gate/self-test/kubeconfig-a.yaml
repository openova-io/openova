# A stand-in kubeconfig of the harness self-test (FND-161): kubectl reads it; nothing dials its server.
apiVersion: v1
kind: Config
clusters:
- name: self-test-region-a
  cluster:
    server: https://127.0.0.1:9
contexts:
- name: self-test-region-a
  context:
    cluster: self-test-region-a
current-context: self-test-region-a
