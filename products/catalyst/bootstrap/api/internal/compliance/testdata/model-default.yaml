# The fallback compliance model of the read model, used while no
# ComplianceModel object named "default" is installed on a cluster.
# One group and one axis, both "all". Every severity weighs 1. No check is
# mandatory, and the cap of 100 never lowers a score. It lists no check.
apiVersion: compliance.openova.io/v1alpha1
kind: ComplianceModel
metadata:
  name: default
spec:
  version: "0.0.0"
  levels:
    - name: L5
      min: 90
    - name: L4
      min: 75
    - name: L3
      min: 60
    - name: L2
      min: 40
    - name: L1
      min: 0
  mandatoryCap:
    value: 100
    environmentTypes: []
  severityWeights:
    critical: 1
    high: 1
    medium: 1
    low: 1
  groups:
    - id: all
      title: All checks
      weight: 1
  axes:
    - id: all
      title: All checks
      group: all
      type: checks
      naText: No check has a result in view.
  checks: []
  exemptions: []
