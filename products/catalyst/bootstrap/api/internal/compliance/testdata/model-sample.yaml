# A complete compliance model for the loader tests. It also carries fields
# that later readers add (waivable, vulnerability); the loader ignores them.
apiVersion: compliance.openova.io/v1alpha1
kind: ComplianceModel
metadata:
  name: default
spec:
  version: "1.0.0"
  levels:
    - name: L5
      min: 90
    - name: L4
      min: 75
    - name: L3
      min: 60
    - name: L2
      min: 40
    - name: L1
      min: 0
  mandatoryCap:
    value: 74
    environmentTypes: [prod]
  severityWeights:
    critical: 8
    high: 4
    medium: 2
    low: 1
  groups:
    - id: run
      title: Build and run
      weight: 1
    - id: security
      title: Security
      weight: 1
  axes:
    - id: reliability
      title: Reliability
      group: run
      type: checks
      naText: No workload in view declares replicas.
    - id: exposure
      title: Exposure
      group: security
      type: checks
      naText: No Service in view.
    - id: runtime
      title: Runtime
      group: security
      type: measure
      measure: runtime-clean
      naText: The runtime sensor has not reported.
  checks:
    - id: multi-replica-drainability
      title: Workloads declare two or more replicas
      source: kyverno
      axis: reliability
      severity: medium
      weight: 2
      ownerSide: organization
      valuesKey: multiReplica
      waivable: true
      description: Deployments and StatefulSets declare at least two replicas.
      remediation: Set spec.replicas to 2 or more.
    - id: probes-present
      title: Containers declare probes
      source: kyverno
      axis: reliability
      severity: high
      ownerSide: organization
      valuesKey: probesPresent
      description: Every container declares a readiness and a liveness probe.
      remediation: Add a readinessProbe and a livenessProbe to each container.
    - id: hpa-effective
      title: Autoscalers can act
      source: evaluator
      axis: reliability
      severity: low
      weight: 0
      ownerSide: organization
      description: A HorizontalPodAutoscaler targets a workload that declares requests.
      remediation: Declare CPU requests on the workload the autoscaler targets.
    - id: forbid-nodeport-service
      title: No Service of type NodePort
      source: kyverno
      axis: exposure
      severity: critical
      mandatory: true
      switchable: false
      ownerSide: sovereign
      valuesKey: forbidNodePort
      description: No Service has the type NodePort.
      remediation: Change the Service type to ClusterIP or LoadBalancer.
  exemptions:
    - namespace: kube-system
      checks: ["*"]
      reason: Cluster system namespace owned by the Kubernetes distribution.
      owner: sovereign-admin
  vulnerability:
    onlyFixable: true
