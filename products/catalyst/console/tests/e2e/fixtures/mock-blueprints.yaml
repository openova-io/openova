# G117 mock fixtures — matches docs/api/catalyst-api-openapi.yaml shapes.
#
# The console dev-server reads this when MOCK_API=1 is set in the env. The
# fixture is also imported by the Wave-1 Playwright specs as a deterministic
# data source.
#
# Keep this file in lockstep with:
#   - docs/api/catalyst-api-openapi.yaml (CatalogBlueprint / Application / Endpoint shapes)
#   - examples/blueprint-grafana-fully-declared.yaml (grafana fixture mirror)

blueprints:
  grafana:
    name: grafana
    version: "1.0.4"
    title: Grafana
    description: Visualization and dashboarding for the LGTM observability stack.
    family: insights
    section: pts-3-observability
    instanceCount: 2
    supportedTopologies: [active-hot-standby, singleton]
    defaultTopology: active-hot-standby
    multiInstance:
      enabled: true
      maxPerOrg: 5
    sso:
      realm: sovereign
      silentLogin: true
    # #3373 — instance-level placement declared on the Blueprint CR.
    defaultPlacement:
      vcluster: mgmt
    allowedPlacements: [mgmt, rtz]
    endpoints:
      - name: ui
        hostnameTemplate: "grafana.{{.SovereignFQDN}}"
        port: 443
        protocol: https
        tls: true
        visibility: public
        launchDefault: true
        ssoEnabled: true

  harbor:
    name: harbor
    version: "1.5.0"
    title: Harbor
    description: OCI registry with Trivy scanning + Cosign signing.
    family: registry
    section: pts-2-platform
    instanceCount: 1
    supportedTopologies: [active-hot-standby, singleton]
    defaultTopology: active-hot-standby
    multiInstance:
      enabled: false
    sso:
      realm: sovereign
      silentLogin: true
    endpoints:
      # Harbor's UI + API are served on the SAME host as the registry
      # (registry.<fqdn>): the live bootstrap-kit overlay sets BOTH gateway.host
      # AND externalURL to registry.${SOVEREIGN_FQDN}, and platform/harbor/
      # blueprint.yaml renders BOTH endpoints from registry.{{.SovereignFQDN}}.
      # The earlier harbor.<fqdn> value pointed at a host with NO HTTPRoute → the
      # console launch-url 404'd. Keep this mock aligned with the live blueprint.
      - name: ui
        hostnameTemplate: "registry.{{.SovereignFQDN}}"
        port: 443
        protocol: https
        tls: true
        visibility: public
        launchDefault: true
        ssoEnabled: true
      - name: registry
        hostnameTemplate: "registry.{{.SovereignFQDN}}"
        port: 443
        protocol: https
        tls: true
        visibility: public
        ssoEnabled: false

  gitea:
    name: gitea
    version: "1.4.9"
    title: Gitea
    description: Self-hosted Git server.
    family: source
    section: pts-2-platform
    instanceCount: 1
    supportedTopologies: [active-hot-standby, singleton]
    defaultTopology: active-hot-standby
    multiInstance:
      enabled: false
    sso:
      realm: sovereign
      silentLogin: true
    # #3373 — instance-level placement declared on the Blueprint CR.
    defaultPlacement:
      vcluster: rtz
    allowedPlacements: [host, mgmt, dmz, rtz]
    endpoints:
      - name: ui
        hostnameTemplate: "gitea.{{.SovereignFQDN}}"
        port: 443
        protocol: https
        tls: true
        visibility: public
        launchDefault: true
        ssoEnabled: true

  openbao:
    name: openbao
    version: "1.2.21"
    title: OpenBao
    description: Vault-compatible secret store.
    family: security
    section: pts-2-platform
    instanceCount: 1
    supportedTopologies: [active-hot-standby, singleton]
    defaultTopology: active-hot-standby
    multiInstance:
      enabled: false
    sso:
      realm: sovereign
      silentLogin: true
    endpoints:
      - name: ui
        hostnameTemplate: "vault.{{.SovereignFQDN}}"
        port: 443
        protocol: https
        tls: true
        visibility: public
        launchDefault: true
        ssoEnabled: true

