# 1.4.901 — #4482 (Refs #3642, 2026-06-26): unblock the Pillar-4 agentic
# Sandbox+MCP journey. bp-sandbox's sandbox-controller CrashLoopBackOff'd on
# every Sovereign — main.go calls mustEnv("CATALYST_GITEA_TOKEN") (hard
# os.Exit(2) on empty) and sources the env from `catalyst-gitea-token` via an
# `optional: true` secretKeyRef, but this template minted that Secret ONLY in
# catalyst-system with NO reflector annotations, so it never reached the
# `sandbox` host ns (split out by the #4325 de-vcluster). Empty env →
# CrashLoop → 0 Sandboxes reconcile → no openova-sandbox-mcp process anywhere
# (the bp-sandbox HR Ready=True masked the dead workload). Same de-vcluster
# reflector-allowlist class as #4382/#4361/#4448. FIX: add emberstack
# reflector annotations (reflection-allowed + reflection-auto, comma-free
# `catalyst-system,sandbox` literals to dodge the comma-quantifier split trap)
# to the catalyst-gitea-token Secret so it mirrors into `sandbox` and stays in
# sync on PAT rotation. Live-proven on prov 91dc05917e44d1c1 (omantel.biz):
# annotating the source reflected into `sandbox` within one reflector tick →
# sandbox-controller 1/1 Running (0 restarts) → reconciled a Sandbox CR (12
# files pushed to catalyst-tenant Gitea, status Ready=True/GitopsReconciled).
# Additive-only (annotations on an existing Secret); no data/render change for
# any other consumer; on contabo where gitea is host-side the gate is
# unchanged. Bootstrap-kit slot-13 pin 1.4.900 → 1.4.901 lockstep.
# 1.4.761 — #4061 (2026-06-22): stop a PERMANENT Sovereign from auto-firing the
# self-sovereignty cutover the moment the mothership completes handover. The
# child catalyst-api's ReceiveTofuArchive (handover.go) seals the
# tofu-phase0-archive THEN fires the cutover engine with source="handover",
# which the require-handover gate (cutover_internal.go) deliberately EXEMPTS —
# and the in-code env default CATALYST_FIRE_CUTOVER_ON_HANDOVER is TRUE and was
# set NOWHERE in any chart. Result: a converged customer-facing Sovereign
# auto-entered the finite 8-step cutover (incl the 10-min deny-egress
# NetworkPolicy hold) UNATTENDED. New knob `catalystApi.fireCutoverOnHandover`
# (default false) wires CATALYST_FIRE_CUTOVER_ON_HANDOVER=false into the child
# catalyst-api on Sovereign installs, making cutover a DELIBERATE BSS-menu
# action ("Achieve True Sovereignty", source="operator"). NO-REGRESS: the
# operator/BSS-initiated cutover is untouched and still fires; a throwaway test
# prov sets fireCutoverOnHandover=true to drive the full unattended walk.
# 1.4.722 — #3946 (Refs #3296 #3297 #3201, 2026-06-20): unblock console install
# on every Sovereign where the Kyverno `flux-managed` ClusterPolicy is Enforce.
# The `catalyst-gitea-token-mint` pre-install hook Job is created directly by
# Helm (helm.sh/hook: pre-install), so it carries NONE of Flux's HR-applied
# labels. It lands in .Release.Namespace = `catalyst-system`, which is NOT in
# the policy's excludeNamespaces list (only `catalyst` is). flux-managed
# (Enforce) therefore DENIES the hook at admission → bp-catalyst-platform
# install fails pre-install → Flux uninstalls + retries → console never serves
# (root-caused live hw172, dep b50ba61d9cb9e157, 1.4.721). FIX: add
# `app.kubernetes.io/managed-by: flux` (the policy's own documented remediation)
# to metadata.labels of every Helm-hook Job in templates/ that lands in
# catalyst-system — catalyst-gitea-token-mint (pre-install),
# qa-fixtures/qa-finalizer-strip (pre-install), and
# migrate-applications-instance-id (post-install; its previous
# `{{ .Release.Service }}` value rendered to `Helm`, also rejected). Mirrors the
# sibling hooks catalyst-gitea-admin-secret-bridge.yaml +
# catalog-sovereign-repo-bootstrap-job.yaml that already carry it. NOT a chart
# regression: the missing-label state is unchanged since 2026-06-09 (a7fb48245);
# the token-secret template did not change in the 1.4.711→1.4.721 window — the
# denial is environmental (catalyst-system gated by the Enforce policy).
# 1.4.707 — #3906 (Refs #3642, #3848, #3813, 2026-06-19): FIX the passwordless
# PIN-login secret catalyst-openova-kc-credentials hitting the SAME intra-release
# lookup-ordering trap #3848 already fixed for the org-controller secret. Post-#3642
# keycloak/catalyst-kc-sa-credentials is created by the keycloak host-bridge (block 1)
# on the SAME helm apply, so templates/catalyst-openova-kc-credentials-secret.yaml's
# render-time `lookup keycloak/catalyst-kc-sa-credentials` returned nil → the PIN
# secret rendered EMPTY → never created → catalyst-api PIN-issue 503'd
# "CATALYST_OPENOVA_KC_SA_CLIENT_SECRET not set" on every fresh prov (HR shows
# Ready/InstallSucceeded yet the Secret absent — root-caused live hw170, deployment
# 7dafca226f5bb7ae). FIX (the #3848 pattern, applied identically): the host-bridge
# now emits catalyst-openova-kc-credentials DIRECTLY into catalyst-system from the
# deterministic $saSecret (KC fields) + a sovereign-smtp-credentials lookup (SMTP,
# seeded earlier — no intra-release ordering issue), landing on the SAME apply that
# creates the source. The lookup template is gated `if not keycloakHostBridge.enabled`
# (FALLBACK for contabo / host-side keycloak only) so exactly one Secret renders. New
# values knob openovaKcSecretNamespace (default catalyst-system). Template-only.
# 1.4.667 — #3763 (Refs #3749, 2026-06-17): FIX the catalyst-gitea-flux-auth-sync
# hook crashloop that degraded the live hw158 spine. The post-install/post-upgrade
# hook read catalyst-gitea-token.token ONCE and `exit 1` FATAL'd on empty →
# crashloop → BackoffLimitExceeded → bp-catalyst-platform upgrade failed + rolled
# back + oscillated (held bp-continuum/bp-sandbox/sovereign-tls non-Ready). The
# PAT is minted by the pre-* mint hook, but pre-/post-* hook weights are
# INDEPENDENT phases (no weight can sequence post after pre's mint) AND the mint
# Secret's `before-hook-creation` delete-policy re-creates it each upgrade →
# transient empty-read window. FIX: the auth-sync job now POLLS the Secret for a
# non-empty `.token` (bounded, default 60 × 5s = 300s) before failing, instead of
# FATAL-on-first-empty — survives ANY mint-vs-sync ordering on fresh-install OR
# upgrade. Also raised the hook's own RBAC weight 5→20 (intra-phase determinism).
# PAT still off argv. Template-only; rendered only on a Sovereign +
# ingress.marketplace.enabled — Catalyst-Zero render byte-unchanged.
# 1.4.663 — #3687 / #3376 (2026-06-17): per-Org vCluster repo clone now
# AUTHENTICATES — default controllers.organization.fluxGiteaSecretRef to
# `openova-org-tenants-git-auth`. PR #3718 wired the per-Org Flux loop
# (org-controller reconcilePerOrgFlux → catalyst-tenant-<slug> GitRepository
# → ./vcluster Kustomization → vCluster HelmRelease) but left the secretRef
# default empty. The per-Org `<slug>/catalyst-tenant` repo is private
# (EnsureOrg/EnsureRepo private=true) AND bp-gitea sets REQUIRE_SIGNIN_VIEW
# =true, so the source-controller's anonymous clone 401'd → Kustomization
# "Source artifact not found" → the committed vCluster HR never reconciled →
# the tenant namespace + purchased app (WordPress) never came up → the
# funnel's terminal acceptance failed (proven live hw158 by the #3687/#3376
# walkers). `openova-org-tenants-git-auth` holds the gitea_admin PAT (clones
# every Org's private repo) and is guaranteed in flux-system by the
# org-tenants auth-secret template + #3749's gitea-flux-auth-secrets-sync-job
# (the deterministic runtime creator). Catalyst-Zero render byte-unchanged
# (the value only reaches the org-controller env, which is sovereign-only).
# Refs #3687 #3376.
# 1.4.654 — #3376 FUNNEL (voucher→running-app) — three folded fixes so a
# stranger with a voucher ends signed-in in their own Org console with the
# app running, on a cut-over Sovereign, zero-touch:
#   (a) provisioning init gate is now a token-DATA probe, not a brittle
#       annotation (templates/org-services/provisioning.yaml +
#       provisioning-github-token.yaml). The cutover Step-09 no-op path
#       skipped the annotation stamp + the chart's bootstrap branch stripped
#       it, so both `sme/provisioning` replicas stuck Init:0/1 forever on a
#       fully cut-over Sovereign (hw150). The init now GETs Gitea
#       /api/v1/user with the token and proceeds on HTTP 200 — immune to
#       both. The bootstrap branch also no longer strips the token-source
#       annotation when the live Secret carries it (artifacts stay in sync).
#   (a2) gitea-tenants-repo-bootstrap-job.yaml seeds an EMPTY parent
#       kustomization at clusters/<fqdn>/org-tenants/ so the Flux
#       Kustomization org-tenants path exists + reconciles Ready from first
#       convergence (was NotReady "path not found" → silently excluded from
#       the cutover egress proof as baseline noise — PRINCIPLES A1/A2).
#   (b) cutover-driver ClusterRole gains `namespaces: [create]` (folds
#       PR #3664 / #3663): ensureOrgNamespace (namespace_ensure.go, #3598)
#       Get-then-Creates the Org namespace; #3598 added the Create call but
#       not the RBAC, so EVERY Org create 403'd (ZERO tenant Orgs creatable
#       on a fresh prov — caught live hw150).
# Refs #3376 #3689 #3663 #3664 #3598 #3379.
# 1.4.619 — #3374 (2026-06-14) — baseline-default-deny: allow ingress
# from the `oidc-gate` host namespace. The bp-oidc-gate auth-proxy (slot 13c)
# reverse-proxies authenticated traffic to its upstream Service in
# catalyst-system; openova-flow's gate dials
# `openova-flow-server.catalyst-system.svc:80`. baseline-default-deny
# (endpointSelector {} → every catalyst-system Pod, incl. flow-server) did NOT
# list `oidc-gate` in allowedIngressNamespaces, so the proxied request was
# dropped at flow-server's Cilium ingress hook — oidc-gate authenticated the
# User (oauth2 callback succeeded) but openova-flow 502'd because the ClusterIP
# Service AND the direct pod-IP both timed out from oidc-gate. Same isolation
# class as the sme→NATS block (#3423). Added `oidc-gate` to both the values
# default and the template fallback list. Diagnosed live on hw133 (both Pods
# co-resident on cp1 → ruled out cross-node datapath; flow-server endpoint
# ingress=Enabled while oidc-gate ns absent from the allow-list). Refs #3374.
