# 1.4.249 — Wave 5.7 / #2140 (2026-05-23) comprehensive HCS audit +
# single-pass fixes for the Huawei OpenTofu module. After 6 incremental
# 1-line fix PRs (#2146 #2148 #2149 #2150 #2152 #2153 — each surfacing
