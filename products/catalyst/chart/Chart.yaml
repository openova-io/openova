# 1.4.1151 — #5187 (Refs #5187, region-b sovereign-tls Kustomization
#   Ready=False on a 2-region Sovereign): DELETES
#   templates/sovereign-tls-vars-cm.yaml. Root cause: this chart's HR is
#   PRIMARY-ONLY (`suspend: ${SECONDARY_HR_SUSPEND:=false}`, G2 #2574), so
#   the sovereign-tls-vars ConfigMap it used to render never existed on a
#   secondary (DR-standby) region — but the sovereign-tls Kustomization
#   that CONSUMES it (postBuild.substituteFrom, optional:false) reconciles
#   on EVERY region with no region-role gate. Result (caught live on hw268,
#   dep 7e7a0a1f42b2fdf4, region-b me-east-215-b): the secondary region's
#   sovereign-tls Kustomization sat Ready=False forever (`configmaps
#   "sovereign-tls-vars" not found`) and its wildcard Certificate + Gateway
#   never warmed up ahead of a region-kill promotion. Fix: the SAME
#   ConfigMap-rendering logic (byte-for-byte) now lives in its own
#   dedicated, always-on chart (platform/sovereign-tls-vars/chart/,
#   bootstrap-kit slot 12a) with NO region-role/suspend gate, so BOTH
#   regions get the ConfigMap. Deleting the template here (rather than
#   leaving a dead duplicate) avoids a two-Helm-release ownership conflict
#   on the identically-named `sovereign-tls-vars` ConfigMap on the primary
#   region, where BOTH this chart's HR and the new chart's HR are active.
#   No other template/value changed — `global.sovereignFQDN` / `parentZones`
#   / `consoleGateway` stay wired exactly as before for the OTHER templates
#   in this chart that still consume them (sovereign-wildcard-certs.yaml,
#   sovereign-fqdn-configmap.yaml). Lockstep w/ bootstrap-kit slot 13 pin.
# 1.4.1083 — #4971 (Pillar-5 cutover): keep catalyst-api OFF the driverless
#   control-plane node during a Recreate roll. catalyst-api mounts two RWO
#   Huawei-EVS PVCs (catalyst-api-deployments, catalyst-api-cache) whose CSI
#   node-plugin (evs.csi.huaweicloud.com) runs ONLY on workers. On hw237
#   (2026-07-10) sovereignty-cutover step-07 (catalyst-api-env-patch) rolled the
#   Pod onto the control-plane node (cp1), where AttachVolume.Attach failed x30
#   over 45m ("CSINode cp1 does not contain driver evs.csi.huaweicloud.com") →
#   ContainerCreating deadlock → step-07 rollout wait timed out → cutover wedged.
#   New gated knob catalystApi.avoidControlPlane (values.yaml default FALSE —
#   mothership / catalyst-zero on contabo unaffected); when true, api-deployment
#   .yaml emits a hard worker-only nodeAffinity (node-role.kubernetes.io/
#   control-plane DoesNotExist). An explicit catalystApi.affinity still wins. The
#   Sovereign bootstrap-kit slot 13 sets avoidControlPlane: true so every fresh
#   Sovereign is zero-touch-correct. Lockstep w/ Chart.yaml.
# 1.4.1058 — #4919 (Refs #4749): the REAL hw233 funnel row-84 fix (Pillar-1) —
#   deterministically roll org-services/{auth,notification} onto the SMTP relay when
#   the seed lands. Those Pods read SMTP_* from org-services-secrets via secretKeyRef,
#   which the kubelet freezes at Pod start; sovereign_smtp_seed.go seeds the relay
#   (mail.openova.io) ASYNC, so on a fresh prov a Pod can start before it and keep
#   stale-EMPTY SMTP env even after org-services-secrets is baked correct on the next
#   reconcile (#934) — POST /auth/magic-link then silently no-sends the anonymous
#   signup PIN until an unrelated reconcile happens to roll the Pod. New helper
#   catalyst.orgSmtpChecksum (_smtp-helpers.tpl) hashes the seed and is stamped as a
#   checksum/smtp-config Pod annotation on auth + notification so Flux rolls them the
#   moment the seed appears. Gated by tests/org-services-smtp-autoroll-contract.sh.
#   (1.4.1055 shipped the sibling marketplace-api SMTP repoint.)
# 1.4.1055 — #4919 (Refs #4749): marketplace-api SMTP env now sources the durable
#   catalyst-system/sovereign-smtp-credentials seed (#4748/#4749 → mail.openova.io:587)
#   via secretKeyRef (smtp-host/-port/-from/-user/-pass, all optional:true) instead of
#   the hardcoded stalwart-mail.stalwart.svc.cluster.local — which resolves to nothing on
#   a fresh Sovereign (Sovereigns run no in-cluster Stalwart), silently black-holing the
#   anonymous signup PIN (hw233 walk, funnel row 84). Same durable relay the org-services
#   auth service (#934) and catalyst-api CATALYST_SMTP_* already consume. optional:true
#   keeps the render safe where the seed is absent (empty env → code no-send default).
