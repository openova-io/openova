# 1.4.215 — TBD-V8 / #1999 (2026-05-20): fix sme/notification 401 on
# billing→notification voucher-email dispatch. The notification service's
# HTTP surface is gated by the shared HS256 JWTAuth middleware
# (core/services/shared/middleware/jwt.go), but billing's
# sendVoucherIssuedEmail (core/services/billing/handlers/vouchers.go)
# carried only Content-Type — no Authorization header. notification
# 401'd silently; the voucher row persisted and the operator saw HTTP
# 200, but no email ever landed. Symptom on t38 canonical walk
# (agent a550281a, 2026-05-19 21:37:33Z): voucher issued OK, recipient
# IMAP empty, catalyst-api logs showed sme/notification 401 on the
# downstream dispatch.
#
# Investigation showed both Pods already read the SAME sme-secrets/
# JWT_SECRET (see chart templates/org-services/billing.yaml line 67-71
# and notification.yaml line 47-51) — the TBD's hypothesis of a
# secret-name mismatch was incorrect. The real gap was that
# billing never used those bytes to mint an outbound service token.
#
# Fix: thread the JWT_SECRET bytes through the billing Handler struct
# (already in scope on main.go for the inbound JWTAuth middleware) and
# use sharedauth.MintSMEAccessToken — the SAME mint helper catalyst-api
# uses for its RS256→HS256 bridge — to sign a short-lived service token
# on the billing→notification hop. sub="sme-billing",
# role="superadmin", 5-minute TTL. Empty JWTSecret falls back to the
# legacy no-header path so a stale chart that doesn't wire JWT_SECRET
# into billing doesn't crash the voucher upsert (mirrors the optional:
# true contract on catalyst-api's CATALYST_ORG_JWT_SECRET secretKeyRef).
#
# Validation: TestIssueVoucher_SendsAuthorizationHeader exercises the
# round-trip — billing mints with the test bytes, then we re-parse the
# captured token with the SAME bytes (the exact path notification's
# JWTAuth middleware takes) and assert claim shape. Pre-#1999 the
# captured request had no Authorization header so the assertion would
# have failed the moment notification's middleware ran. Companion test
# TestIssueVoucher_NoAuthHeader_WhenJWTSecretUnset guards the back-
# compat fallback path. No chart-template change — the symmetric
# JWT_SECRET wiring was already in place; this PR is a Go-side fix.
# Bumped on rebase 1.4.214 → 1.4.215 to claim the next version slot
# above TBD-V11/#2002 (also 1.4.214 on main). Refs #1999, #1842 D28,
# #1829 D29.
# 1.4.214 — TBD-V11 / #2002 (2026-05-20): add init container
# `wait-for-cutover-token` to the Organization provisioning Deployment so the
# Pod does NOT accept tenant requests until bp-self-sovereign-cutover
# Step 09 (gitea-token-mint) has minted a real Gitea API token and
# patched Secret `sme/provisioning-github-token` with the annotation
# `catalyst.openova.io/token-source: self-sovereign-cutover-step-09`.
# Pre-fix on t38 (2026-05-19): provisioning Pod started with the
# first-install placeholder (gitea-admin-secret.password) under
# GITHUB_TOKEN, tenant Org CR creation fired BEFORE Step 09 had
# patched, gitea returned `HTTP 401 user does not exist [uid: 0,
# name: ""]`, Org CR stuck at Ready=False/GiteaOrgFailed. Step 09's
# `rollout restart deploy/provisioning` eventually recovers — but
# the FIRST tenant journey after install always 401'd.
#
# Fix design rationale: HelmRelease.dependsOn between bp-catalyst-
# platform and bp-self-sovereign-cutover would NOT solve this — the
# cutover HR is dormant (`disableWait: true`) and goes Ready=True at
# install time, BEFORE Step 09's Job actually runs. Per Inviolable
# Principle #14 we also can't depend on Kustomizations from HRs.
# Pod-level init gating is the only correct waitpoint: the init
# container kubectl-polls the Secret in `sme` ns for the cutover
# annotation, exits 0 once present, and the main provisioning
# container starts with a guaranteed-valid token.
#
# Configurable knobs in values.yaml under
# `orgServices.provisioning.waitForCutoverToken`:
#   enabled (true default; set false on Catalyst-Zero/contabo where
#     the SealedSecret-provisioned token carries no cutover annotation
#     and Step 09 never runs)
#   image (alpine/k8s:1.31.4 — tracks platform/self-sovereign-cutover
#     values.yaml so platform-wide bumps land in one place)
#   intervalSeconds (10s default)
#   timeoutSeconds (1800s = 30m default; covers the slowest cutover
#     observed on Hetzner cold-start ~18 min with 12 min safety margin)
#
# RBAC: re-uses the existing `provisioning` ServiceAccount in `sme`,
# which already carries `secrets: [get, list, watch]` via the
# `sme-provisioning` ClusterRole. No new RBAC.
#
# Validation: `helm template` shows the initContainers block on
# Sovereign installs; smoke render unaffected on contabo (where
# `waitForCutoverToken.enabled: false` is the canonical overlay).
# On t38 (or fresh prov) the sme/provisioning Pod stays in
# `Init:0/1` until Step 09 stamps the annotation, then starts the
# main container with the minted token; first tenant Org CR
# materialises Ready=True/Materialized without retry.
