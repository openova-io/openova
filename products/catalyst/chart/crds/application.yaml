apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.apps.openova.io
  labels:
    app.kubernetes.io/name: catalyst
    app.kubernetes.io/component: application
spec:
  group: apps.openova.io
  scope: Namespaced
  names:
    kind: Application
    listKind: ApplicationList
    singular: application
    plural: applications
    shortNames:
      - app
      - apps
    categories:
      - catalyst
      - openova
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Blueprint
          type: string
          jsonPath: .spec.blueprintRef.name
        - name: Version
          type: string
          jsonPath: .spec.blueprintRef.version
        - name: Environment
          type: string
          jsonPath: .spec.environmentRef
        - name: Placement
          type: string
          jsonPath: .spec.placement
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Primary
          type: string
          jsonPath: .status.primaryRegion
          priority: 1
        - name: Instance
          type: string
          jsonPath: .spec.instanceId
          priority: 1
        - name: Isolation
          type: string
          jsonPath: .spec.isolationLevel
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: |
            Application is an installed instance of a Blueprint, owned by an
            Organization, deployed into one or more regions per its Placement,
            managed by Flux.

            One Application = one Gitea repo at
            gitea.{location-code}.{sovereign-domain}/{org}/{app}; branches
            develop/staging/main map to dev/stg/prod Environments.

            See docs/EPICS-1-6-unified-design.md §3.2.3 and
            docs/BLUEPRINT-AUTHORING.md §3 for the contract.
          required: [spec]
          properties:
            spec:
              type: object
              # G93.2 (Refs #2667) — `placement` OPTIONAL on the wire.
              # The application-controller derives the effective default
              # from the Blueprint's placementSchema.{default,
              # defaultOnMultiRegion} + the Sovereign-wide BCP topology
              # (SOVEREIGN_BCP_TOPOLOGY env, G93.1) when the field is
              # omitted. Operator-supplied placement is preserved
              # verbatim — this only changes the empty-wire behaviour,
              # from "controller fails the Application" to
              # "controller picks the Blueprint's declared default".
              #
              # #3370 — `environmentRef` + `regions` moved out of the
              # static `required` list into the CEL rule below: a
              # bootstrap-owned instance (spec.bootstrap=true, the
              # Application CR a bootstrap-kit chart self-registers for
              # its slot-installed HelmRelease) has no Environment CR
              # and no per-Org region targeting — the install is owned
              # by the bootstrap-kit HR; the CR is the canonical
              # representation only. For every non-bootstrap
              # Application the CEL rule enforces the exact same
              # contract as before.
              required: [blueprintRef]
              x-kubernetes-validations:
                - rule: '(has(self.bootstrap) && self.bootstrap == true) || (has(self.environmentRef) && has(self.regions))'
                  message: 'spec.environmentRef and spec.regions are required unless spec.bootstrap=true (bootstrap-owned instance)'
              properties:
                environmentRef:
                  type: string
                  description: |
                    Name of the Environment CR (e.g. acme-prod) this Application
                    belongs to. Environment determines vCluster targets and
                    Gitea branch.
                  pattern: '^[a-z][a-z0-9-]{2,63}$'
                blueprintRef:
                  type: object
                  required: [name, version]
                  properties:
                    name:
                      type: string
                      description: Blueprint name (e.g. bp-wordpress).
                      pattern: '^bp-[a-z][a-z0-9-]{1,62}$'
                    version:
                      type: string
                      description: Semver of the Blueprint OCI artifact.
                      pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$'
                placement:
                  # #3373 — DUAL-FORM field (founder-ratified placement law).
                  #
                  # Form 1 (legacy string): the DR-posture enum
                  #   single-region | active-active | active-hotstandby.
                  #   Existing CRs + writers keep working verbatim.
                  #
                  # Form 2 (object): WHERE this instance runs —
                  #   { vcluster: host|mgmt|dmz|rtz,
                  #     regions:  [<host-cluster>, ...],
                  #     clusters: [<canonical-cluster-id>, ...],
                  #     mode:     <the legacy DR-posture enum> }
                  #   Every field optional; omitted fields default from the
                  #   Blueprint (spec.defaultPlacement + the legacy
                  #   placementSchema seams). The application-controller
                  #   validates vcluster against {host,mgmt,dmz,rtz} and the
                  #   Blueprint's spec.allowedPlacements at reconcile time.
                  #
                  # Written by the provisioning journey's advanced view OR
                  # edited DIRECTLY in Git by an advanced user — both equally
                  # valid: the Git-committed IaC is the single source of
                  # truth; the console reflects it (status.placement), never
                  # fights it.
                  #
                  # Structural-schema note: a node with
                  # x-kubernetes-preserve-unknown-fields:true may omit `type`
                  # (the int-or-string-style exception) — that is what makes
                  # the string|object dual form admissible.
                  x-kubernetes-preserve-unknown-fields: true
                  description: |
                    Placement of this instance (#3373). String form = the
                    legacy DR posture (single-region = one cluster only;
                    active-active = manifests fan out to all regions[];
                    active-hotstandby = primary in regions[0], standby in
                    regions[1..] with replica:0; failover managed by the
                    Continuum controller). Object form =
                    {vcluster, regions, clusters, mode} — WHERE the instance
                    runs; defaulted from the Blueprint's defaultPlacement;
                    gated by the Blueprint's allowedPlacements.
                regions:
                  type: array
                  minItems: 1
                  maxItems: 5
                  description: |
                    Host clusters this Application targets, in priority order.
                    For active-hotstandby, regions[0] is the primary.
                  items:
                    type: string
                    # #3370 — relaxed from '^[a-z]+-[a-z]+-[a-z]+-[a-z]+$'
                    # (4 letter-only labels): the old pattern rejected
                    # BOTH the instance-create default region key
                    # ("primary") AND every real kom4dc region label
                    # (me-east-215-a — digits), so no console-created
                    # Application CR could ever pass admission on a
                    # real apiserver. Same relax the Continuum CRD took
                    # in #3195 G6 for the kom4dc digit codes.
                    pattern: '^[a-z][a-z0-9-]{0,62}$'
                parameters:
                  type: object
                  description: |
                    User-supplied values, validated against the Blueprint's
                    spec.configSchema (BLUEPRINT-AUTHORING.md §3-§4).
                    Free-form here; the application-controller and the
                    blueprint-controller's admission webhook enforce the
                    schema match at admission.
                  x-kubernetes-preserve-unknown-fields: true
                healthCheck:
                  type: object
                  required: [path, port]
                  properties:
                    path:
                      type: string
                      description: HTTP(S) path probed for liveness from outside the cluster.
                      pattern: '^/.*'
                    port:
                      x-kubernetes-int-or-string: true
                      description: Service port name or numeric port.
                    intervalSeconds:
                      type: integer
                      minimum: 5
                      maximum: 300
                      default: 30
                    timeoutSeconds:
                      type: integer
                      minimum: 1
                      maximum: 60
                      default: 5
                owners:
                  type: array
                  description: Per-Application owner list. Roles materialize as UserAccess via useraccess-controller.
                  items:
                    type: object
                    required: [email, role]
                    properties:
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        enum: [owner, admin, developer, viewer]
                topology:
                  type: object
                  description: DR / scaling knobs read by the Continuum controller (#1101).
                  properties:
                    autoFailover:
                      type: boolean
                      default: false
                      description: Only meaningful for placement=active-hotstandby.
                    rto:
                      type: string
                      # #2936 hardening (ATTACK#5): bound the numeric prefix to
                      # 1-4 digits — max 9999 of any unit (e.g. 9999h ≈ 416 days).
                      # Rejects unbounded values like "999999h" while still
                      # accepting "60s"/"5m"/"24h".
                      pattern: '^[0-9]{1,4}(s|m|h)$'
                      description: Recovery Time Objective (e.g. "60s", "5m").
                    rpo:
                      type: string
                      # #2936 hardening (ATTACK#5): same 1-4 digit bound as rto.
                      pattern: '^[0-9]{1,4}(s|m|h)$'
                      description: Recovery Point Objective (e.g. "5s", "1m").
                    minReplicas:
                      type: integer
                      minimum: 1
                      # #2936 hardening (ATTACK#5): a single Application
                      # replicating beyond 9 instances is not a real Catalyst
                      # topology — cap the previously-unbounded upper end.
                      maximum: 9
                      description: Lower bound for any HPA the Blueprint declares.
                  x-kubernetes-preserve-unknown-fields: true
                # ── G117.2 W2.C2 — multi-instance fields ─────────────────
                # Backwards-compatible: all three fields are optional.
                # Legacy Applications (without them) keep reconciling.
                # The admission package + tools/migrate-applications-instanceId.py
                # backfill defaults on first reconcile / on cluster upgrade.
                instanceId:
                  type: string
                  description: |
                    Stable per-instance identifier. Immutable after
                    creation — the admission webhook rejects any update
                    that changes it. Defaults to the first 8 chars of
                    metadata.uid when unset.
                  pattern: '^[a-z0-9]{4,32}$'
                  # x-kubernetes-validations enforces immutability at
                  # admission time (k8s >= 1.25 CEL). The legacy CR set
                  # without instanceId is permitted (oldSelf check skips
                  # when the prior value was unset).
                  x-kubernetes-validations:
                    - rule: 'oldSelf == "" || self == oldSelf'
                      message: 'spec.instanceId is immutable after creation'
                isolationLevel:
                  type: string
                  enum:
                    - namespace
                    - vcluster
                  default: namespace
                  description: |
                    `namespace` (default) — every Application instance
                    is a distinct Namespace within the Org's host
                    cluster(s); HelmReleases target that namespace.
                    `vcluster` — instances land inside the Org's
                    existing vCluster (one vCluster per Org per host
                    cluster); HR names differ via namingTemplate, the
                    namespace inside the vCluster is shared. New
                    isolation modes require an ADR.
                namingTemplate:
                  type: string
                  description: |
                    Go-template syntax. Default depends on
                    isolationLevel: `{{.AppName}}-{{.InstanceID}}` for
                    `namespace`, `{{.AppName}}` for `vcluster`. Template
                    context: `.AppName` (metadata.name), `.InstanceID`
                    (spec.instanceId), `.OrgSlug` (label
                    catalyst.openova.io/organization), `.Blueprint`
                    (blueprintRef.name without `bp-` prefix).
                  maxLength: 256
                # ── #3370 — bootstrap adoption + backing-service wiring ──
                bootstrap:
                  type: boolean
                  default: false
                  description: |
                    True for bootstrap-owned instances: slot-installed
                    HelmReleases whose chart self-registers this
                    Application CR as the canonical representation
                    (#3370). The application-controller ADOPTS such an
                    instance — it skips every render / fan-out / Gitea
                    path (the install is already owned by the
                    bootstrap-kit HR; rendering would duplicate it) and
                    only reconciles status by observing
                    spec.helmRelease's Ready condition.
                helmRelease:
                  type: object
                  description: |
                    The owning Flux HelmRelease of a bootstrap-owned
                    instance (spec.bootstrap=true). The controller's
                    adoption path observes its Ready condition for
                    status; console projections dedupe HR-derived rows
                    against it.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                dependsOn:
                  type: array
                  description: |
                    Backing-service wiring (#3370). Each entry names
                    another Application (the backing instance) this
                    Application consumes, optionally with the Context it
                    occupies on that instance. The
                    application-controller resolves each entry to the
                    backing instance's HelmRelease(s) and stamps Flux
                    `spec.dependsOn` on every HR it renders — the
                    runtime wiring is purely Flux, no controller magic.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: Backing Application metadata.name.
                      namespace:
                        type: string
                        description: |
                          Backing Application namespace. Defaults to
                          this Application's own namespace.
                      context:
                        type: string
                        description: |
                          The Context this Application occupies on the
                          backing instance, as `<kind>/<name>` (e.g.
                          `db/gitea`). Display + provenance only — the
                          Flux wiring uses the resolved HelmRelease.
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioning
                    - Ready
                    - Degraded
                    - Failed
                    - Uninstalling
                primaryRegion:
                  type: string
                  description: Currently-primary host cluster. Switched by the Continuum controller on failover.
                regions:
                  type: array
                  description: Per-region rollout state.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      role:
                        type: string
                        enum: [primary, standby, active]
                      replicas:
                        type: integer
                        minimum: 0
                      ready:
                        type: integer
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                giteaRepo:
                  type: string
                  description: Full URL of the per-Application Gitea repo (e.g. gitea.hfmp.omantel.openova.io/acme/marketing-site).
                installedBlueprint:
                  type: object
                  description: Snapshot of the Blueprint actually rendered (post upgrade-resolve).
                  properties:
                    name:
                      type: string
                    version:
                      type: string
                    digest:
                      type: string
                      description: OCI artifact digest for reproducibility.
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                placement:
                  type: object
                  description: |
                    #3373 — the EFFECTIVE placement the last reconcile
                    resolved + rendered (instance > Blueprint default >
                    legacy seams). The console reflects this — it mirrors
                    the Git-committed truth, never fights it.
                  properties:
                    vcluster:
                      type: string
                      enum: [host, mgmt, dmz, rtz]
                    source:
                      type: string
                      description: |
                        Which declaration won the resolution: instance |
                        blueprint-default | blueprint-placementSchema |
                        host-default.
                    regions:
                      type: array
                      items:
                        type: string
                    clusters:
                      type: array
                      items:
                        type: string
              x-kubernetes-preserve-unknown-fields: true
