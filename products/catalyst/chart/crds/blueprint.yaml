apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: blueprints.catalyst.openova.io
  labels:
    app.kubernetes.io/name: catalyst
    app.kubernetes.io/component: blueprint
spec:
  group: catalyst.openova.io
  scope: Cluster
  names:
    kind: Blueprint
    listKind: BlueprintList
    singular: blueprint
    plural: blueprints
    shortNames:
      - bp
      - bps
    categories:
      - catalyst
      - openova
  # Two versions served from identical inline schemas. v1 is storage. v1alpha1
  # stays served so the 38 existing v1alpha1 files validate as-is. Future
  # tightening / migration to v1 is a follow-up slice.
  versions:
    - &VERSION_v1
      name: v1alpha1
      served: true
      storage: false
      additionalPrinterColumns: &PRINTER_COLS
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Visibility
          type: string
          jsonPath: .spec.visibility
        - name: Title
          type: string
          jsonPath: .spec.card.title
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema: &SCHEMA
          type: object
          description: |
            Blueprint is the unified unit of installable software. See
            docs/BLUEPRINT-AUTHORING.md §3 for the contract.

            Schema is intentionally permissive (x-kubernetes-preserve-unknown-fields
            on free-form sub-trees: configSchema, manifests.values, depends[].values,
            and the spec root) because:
              - configSchema is per-Blueprint JSON Schema — its shape is
                arbitrary by design.
              - 58 existing blueprint.yaml files (38 v1alpha1 + 20 v1) carry
                a union of card variants (summary|description, category|family,
                docs|documentation), optional manifests blocks for catalog-
                metadata-only entries, and one-off fields (outputs, etc.).
              - Tightening happens via follow-up slices that author specific
                ClusterPolicies or schema bumps.

            Required at this layer: spec.version, spec.card.title. Everything
            else is optional / preserve-unknown.
          required: [spec]
          properties:
            spec:
              type: object
              required: [version, card]
              properties:
                version:
                  type: string
                  pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$'
                card:
                  type: object
                  required: [title]
                  properties:
                    title:
                      type: string
                      minLength: 1
                    summary:
                      type: string
                    description:
                      type: string
                    tagline:
                      type: string
                    icon:
                      type: string
                    category:
                      type: string
                    family:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
                    documentation:
                      type: string
                    docs:
                      type: string
                    license:
                      type: string
                    screenshots:
                      type: array
                      items:
                        type: string
                  x-kubernetes-preserve-unknown-fields: true
                visibility:
                  type: string
                  enum: [listed, unlisted, private]
                owner:
                  type: object
                  properties:
                    team:
                      type: string
                    contact:
                      type: string
                  x-kubernetes-preserve-unknown-fields: true
                configSchema:
                  type: object
                  description: |
                    Per-Blueprint JSON Schema that drives the install form
                    in the console. Free-form by design — preserve-unknown.
                  x-kubernetes-preserve-unknown-fields: true
                consoleUI:
                  type: object
                  description: |
                    Wave 5.69 (#2370) — Sovereign-console UI registration
                    contract for third-party Blueprints (bp-chepherd is
                    the first consumer; see docs/INTEGRATION-OPENOVA-MCP.md
                    §5). When sidebarEntry=true the SovereignSidebar.tsx
                    appends a nav entry between the hardcoded last entry
                    (BSS) and Settings, in sidebarOrder order. RBAC is
                    inherited from existing tier-gate.
                  properties:
                    sidebarEntry:
                      type: boolean
                      default: false
                      description: When true, register a top-level Sovereign-console sidebar nav entry.
                    sidebarLabel:
                      type: string
                      description: Display label (operator-overridable per Sovereign overlay).
                    sidebarRoute:
                      type: string
                      description: Route path the nav link navigates to (e.g. /apps/bp-chepherd/dashboard).
                    sidebarOrder:
                      type: integer
                      minimum: 0
                      maximum: 100
                      description: |
                        Insert-order between BSS (last hardcoded, order=60) and Settings
                        (order=99 pinned). Higher = closer to Settings. Default 50.
                      default: 50
                    sidebarIcon:
                      type: string
                      description: |
                        SVG path string for the icon (single-stroke, Tabler-style;
                        see existing FLAT_NAV entries in SovereignSidebar.tsx for
                        the conventional shape). Default uses the blueprint card
                        icon.
                placementSchema:
                  type: object
                  properties:
                    modes:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        # Two tiers of placement modes coexist (see
                        # core/controllers/blueprint/internal/validate/validate.go
                        # canonicalPlacementModes):
                        #   - Application-tier (marketplace 99%):
                        #     single-region / active-active / active-hotstandby
                        #   - Bootstrap-topology tier (bp-*-vcluster +
                        #     bp-vcluster-helmrepo, per
                        #     docs/SOVEREIGN-MULTI-REGION-DOD.md A4):
                        #     primary-only / secondary-only / every-region
                        enum:
                          - single-region
                          - active-active
                          - active-hotstandby
                          - primary-only
                          - secondary-only
                          - every-region
                    default:
                      type: string
                      enum:
                        - single-region
                        - active-active
                        - active-hotstandby
                        - primary-only
                        - secondary-only
                        - every-region
                    # G93.2 (Refs #2667) — defaultOnMultiRegion is the
                    # Blueprint author's declarative preferred default
                    # when the Sovereign is multi-region (BCP topology =
                    # active-hotstandby or active-active). The
                    # application-controller consults this when the
                    # Application CR's spec.placement is empty:
                    #   - Multi-region Sovereign + defaultOnMultiRegion
                    #     set → use it (target-state Pillar 3 zero-
                    #     touch for CNPG-backed Blueprints).
                    #   - Otherwise → fall back to `default` (single-
                    #     knob backwards-compat).
                    # When set, MUST be in modes[] (validator enforces).
                    defaultOnMultiRegion:
                      type: string
                      enum:
                        - single-region
                        - active-active
                        - active-hotstandby
                        - primary-only
                        - secondary-only
                        - every-region
                    minRegions:
                      type: integer
                      minimum: 1
                      maximum: 5
                    maxRegions:
                      type: integer
                      minimum: 1
                      maximum: 5
                    vcluster:
                      type: string
                      # G92.1 #2660 (2026-06-01) — Blueprint authors
                      # declare WHICH per-region vCluster the rendered
                      # HelmRelease installs INTO. Empty / unset =
                      # install onto the host k3s (substrate
                      # Blueprints per G92.6 #2665 — Cilium-agent,
                      # Flux, Kyverno, cert-manager, ESO,
                      # CNPG-operator). The application-controller
                      # reads this field and stamps
                      # spec.kubeConfig.secretRef on the rendered HR
                      # so Flux helm-controller pivots into the
                      # vCluster apiserver. Per
                      # docs/SOVEREIGN-MULTI-REGION-DOD.md §A4 the
                      # three vClusters partition workloads:
                      #   dmz  — Cilium-Gateway, WAF-Coraza,
                      #          HTTPRoutes, Stalwart (#2663)
                      #   mgmt — catalyst-api/ui, Keycloak, OpenBao,
                      #          NATS, gitea, harbor (#2661 + #2662)
                      #   rtz  — Tenant Applications, Sandbox,
                      #          per-Org CNPG (#2664)
                      enum:
                        - dmz
                        - mgmt
                        - rtz
                  x-kubernetes-preserve-unknown-fields: true
                depends:
                  type: array
                  items:
                    type: object
                    required: [blueprint]
                    properties:
                      blueprint:
                        type: string
                        pattern: '^(bp-)?[a-z][a-z0-9-]{1,62}$'
                      version:
                        type: string
                      alias:
                        type: string
                      when:
                        type: string
                      values:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    x-kubernetes-preserve-unknown-fields: true
                manifests:
                  type: object
                  properties:
                    chart:
                      type: string
                    source:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum: [HelmChart, Kustomize, OAM]
                        ref:
                          type: string
                      x-kubernetes-preserve-unknown-fields: true
                    overlays:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    values:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  x-kubernetes-preserve-unknown-fields: true
                upgrades:
                  type: object
                  properties:
                    from:
                      type: array
                      items:
                        type: string
                    blocks:
                      type: array
                      items:
                        type: string
                  x-kubernetes-preserve-unknown-fields: true
                rotation:
                  type: array
                  items:
                    type: object
                    required: [kind]
                    properties:
                      kind:
                        type: string
                      name:
                        type: string
                      ttl:
                        type: string
                        pattern: '^[0-9]+(s|m|h|d)$'
                    x-kubernetes-preserve-unknown-fields: true
                observability:
                  type: object
                  properties:
                    metrics:
                      type: string
                    logs:
                      type: string
                    traces:
                      type: string
                  x-kubernetes-preserve-unknown-fields: true
                outputs:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                # ── G117 EPIC fields — promoted from JSON schema ────────
                # Source of truth: platform/_schemas/blueprint-topology.json
                # Go types: core/pkg/apis/blueprint/v1alpha1/topology_types.go
                # G117.E2E-B3 (#2740 #2745 #2737): W1.B1 + W2.C2 landed
                # the Go-types + JSON-schema gate but the CRD manifest
                # never gained these fields, so runtime admission did
                # NOT gate them — preserve-unknown silently swallowed
                # them. This block makes admission see + validate the
                # G117 contract on every Sovereign (hw86 + downstream).
                topology:
                  type: object
                  description: |
                    Per-Blueprint multi-region declaration. Admission
                    enforces defaults.multi-region + defaults.single-region
                    are members of supported, and every key in perTopology
                    is in supported.
                  required: [supported, defaults]
                  # #2936 (2026-06-03): cross-field CEL validation. Pre-fix
                  # blueprint-controller surfaced these mismatches at reconcile
                  # time as Ready=False reason=ValidationFailed. Promoting to
                  # CRD admission means the apiserver rejects the CR at submit
                  # time with HTTP 422 — operator gets immediate feedback
                  # instead of "applied but stuck Pending".
                  x-kubernetes-validations:
                    - rule: "self.defaults['multi-region'] in self.supported"
                      message: "topology.defaults.multi-region must be a member of topology.supported[]"
                    - rule: "self.defaults['single-region'] in self.supported"
                      message: "topology.defaults.single-region must be a member of topology.supported[]"
                    - rule: "!has(self.perTopology) || self.perTopology.all(k, k in self.supported)"
                      message: "every key in topology.perTopology must be a member of topology.supported[]"
                  properties:
                    supported:
                      type: array
                      minItems: 1
                      # K8s structural-schema forbids `uniqueItems: true`
                      # (quadratic-complexity ban); use the structural-
                      # schema equivalent x-kubernetes-list-type: set
                      # which the API server enforces in O(n) via hash.
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        enum:
                          - active-active
                          - active-hot-standby
                          - active-passive
                          - singleton
                    defaults:
                      type: object
                      required: [multi-region, single-region]
                      properties:
                        multi-region:
                          type: string
                          enum:
                            - active-active
                            - active-hot-standby
                            - active-passive
                            - singleton
                        single-region:
                          type: string
                          enum:
                            - active-active
                            - active-hot-standby
                            - active-passive
                            - singleton
                    perTopology:
                      type: object
                      description: |
                        Per-variant replication / switchover / placement
                        knobs. Each variant repeats the same three
                        sub-schemas — K8s structural CRD schemas forbid
                        $ref so each variant is inlined via YAML anchor.
                      properties:
                        active-active:
                          type: object
                          required: [replication, placement]
                          properties:
                            replication: &REPLICATION_SPEC
                              type: object
                              required: [backend]
                              properties:
                                backend:
                                  type: string
                                  enum:
                                    - cnpg-pair
                                    - raft
                                    - mirrormaker2
                                    - s3-bucket-replication
                                    - ccr
                                    - sentinel
                                    - velero
                                    - filer-remote-storage
                                    - openbao-perf-replication
                                    - flux-git
                                    - none
                                mode:
                                  type: string
                                  enum: [sync, async, none]
                                lagSloSeconds:
                                  type: integer
                                  minimum: 0
                                  maximum: 86400
                            switchover: &SWITCHOVER_SPEC
                              type: object
                              required: [mechanism]
                              properties:
                                mechanism:
                                  type: string
                                  enum:
                                    - bp-continuum
                                    - manual
                                    - bp-velero-restore
                                    - lua-record
                                    - mm2-symmetric
                                    - ccr-promote
                                    - raft-transition
                                    - sentinel-failover
                                    - none
                                rtoSeconds:
                                  type: integer
                                  minimum: 0
                                  maximum: 86400
                                rpoSeconds:
                                  type: integer
                                  minimum: 0
                                  maximum: 86400
                            placement: &PLACEMENT_SPEC
                              type: object
                              properties:
                                tier:
                                  type: string
                                  enum: [mgmt, dmz, rtz, ""]
                                clusters:
                                  type: array
                                  x-kubernetes-list-type: set
                                  items:
                                    type: string
                                    pattern: '^(mgmt|dmz|rtz)-[A-Z0-9]+$'
                                roles:
                                  type: object
                                  additionalProperties:
                                    type: string
                                    enum: [active, passive, singleton]
                        active-hot-standby:
                          type: object
                          required: [replication, switchover, placement]
                          properties:
                            replication: *REPLICATION_SPEC
                            switchover: *SWITCHOVER_SPEC
                            placement: *PLACEMENT_SPEC
                        active-passive:
                          type: object
                          required: [replication, switchover, placement]
                          properties:
                            replication: *REPLICATION_SPEC
                            switchover: *SWITCHOVER_SPEC
                            placement: *PLACEMENT_SPEC
                        singleton:
                          type: object
                          required: [placement]
                          properties:
                            replication: *REPLICATION_SPEC
                            switchover: *SWITCHOVER_SPEC
                            placement: *PLACEMENT_SPEC
                endpoints:
                  type: array
                  description: |
                    Named external endpoints surfaced by this Blueprint.
                    The Endpoints tab UI (G117.3) renders one card per
                    entry; the Launch button UI (G117.4) starts from
                    launchDefault=true (else first ssoEnabled https).
                  items:
                    type: object
                    required: [name, hostnameTemplate]
                    properties:
                      name:
                        type: string
                        pattern: '^[a-z][a-z0-9-]{0,30}[a-z0-9]$'
                      hostnameTemplate:
                        type: string
                        minLength: 1
                        maxLength: 253
                        description: |
                          Go text/template emitting an RFC-1123 hostname
                          after evaluation. Tokens: {{.AppName}}
                          {{.InstanceID}} {{.OrgSlug}} {{.SovereignFQDN}}
                          {{.ClusterID}}.
                      port:
                        type: integer
                        minimum: 1
                        maximum: 65535
                      protocol:
                        type: string
                        enum: [https, http, grpc, tcp, udp]
                      tls:
                        type: boolean
                      visibility:
                        type: string
                        enum: [public, private, internal]
                      launchDefault:
                        type: boolean
                      ssoEnabled:
                        type: boolean
                sso:
                  type: object
                  description: |
                    Blueprint-level SSO declaration. Tier-1/2 use realm
                    `sovereign`; Tier-3 use per-Org realm via
                    `{{.OrgSlug}}` template token.
                  required: [realm]
                  properties:
                    realm:
                      type: string
                      enum: [sovereign, '{{.OrgSlug}}']
                    protocolMapper:
                      type: string
                      enum: [oidc, saml]
                    groupsClaim:
                      type: string
                    rolesFromGroup:
                      type: object
                      additionalProperties:
                        type: string
                    silentLogin:
                      type: boolean
                multiInstance:
                  type: object
                  description: |
                    When enabled, a Blueprint may have >1 Application
                    instance per Organization. Catalog cards show the
                    instance-count badge + "+ New instance" button.
                    When absent / enabled=false, a Blueprint is
                    singleton-per-Org.
                  required: [enabled]
                  properties:
                    enabled:
                      type: boolean
                    maxPerOrg:
                      type: integer
                      minimum: 0
                      maximum: 1000
                    namingTemplate:
                      type: string
                    isolationLevel:
                      type: string
                      enum: [namespace, vcluster]
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Draft, Published, Deprecated, Withdrawn]
                publishedAt:
                  type: string
                  format: date-time
                deprecatedAt:
                  type: string
                  format: date-time
                ociDigest:
                  type: string
                  description: cosign-signed OCI artifact digest (set by CI on publish).
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                observedGeneration:
                  type: integer
                  format: int64
              x-kubernetes-preserve-unknown-fields: true
    - <<: *VERSION_v1
      name: v1
      storage: true
