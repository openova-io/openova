apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: blueprints.catalyst.openova.io
  labels:
    app.kubernetes.io/name: catalyst
    app.kubernetes.io/component: blueprint
spec:
  group: catalyst.openova.io
  scope: Cluster
  names:
    kind: Blueprint
    listKind: BlueprintList
    singular: blueprint
    plural: blueprints
    shortNames:
      - bp
      - bps
    categories:
      - catalyst
      - openova
  # Two versions served from identical inline schemas. v1 is storage. v1alpha1
  # stays served so the 38 existing v1alpha1 files validate as-is. Future
  # tightening / migration to v1 is a follow-up slice.
  versions:
    - &VERSION_v1
      name: v1alpha1
      served: true
      storage: false
      additionalPrinterColumns: &PRINTER_COLS
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Visibility
          type: string
          jsonPath: .spec.visibility
        - name: Title
          type: string
          jsonPath: .spec.card.title
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema: &SCHEMA
          type: object
          description: |
            Blueprint is the unified unit of installable software. See
            docs/BLUEPRINT-AUTHORING.md §3 for the contract.

            Schema is intentionally permissive (x-kubernetes-preserve-unknown-fields
            on free-form sub-trees: configSchema, manifests.values, depends[].values,
            and the spec root) because:
              - configSchema is per-Blueprint JSON Schema — its shape is
                arbitrary by design.
              - 58 existing blueprint.yaml files (38 v1alpha1 + 20 v1) carry
                a union of card variants (summary|description, category|family,
                docs|documentation), optional manifests blocks for catalog-
                metadata-only entries, and one-off fields (outputs, etc.).
              - Tightening happens via follow-up slices that author specific
                ClusterPolicies or schema bumps.

            Required at this layer: spec.version, spec.card.title. Everything
            else is optional / preserve-unknown.
          required: [spec]
          properties:
            spec:
              type: object
              required: [version, card]
              properties:
                version:
                  type: string
                  pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$'
                card:
                  type: object
                  required: [title]
                  properties:
                    title:
                      type: string
                      minLength: 1
                    summary:
                      type: string
                    description:
                      type: string
                    tagline:
                      type: string
                    icon:
                      type: string
                    category:
                      type: string
                    family:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
                    documentation:
                      type: string
                    docs:
                      type: string
                    license:
                      type: string
                    screenshots:
                      type: array
                      items:
                        type: string
                  x-kubernetes-preserve-unknown-fields: true
                visibility:
                  type: string
                  enum: [listed, unlisted, private]
                owner:
                  type: object
                  properties:
                    team:
                      type: string
                    contact:
                      type: string
                  x-kubernetes-preserve-unknown-fields: true
                configSchema:
                  type: object
                  description: |
                    Per-Blueprint JSON Schema that drives the install form
                    in the console. Free-form by design — preserve-unknown.
                  x-kubernetes-preserve-unknown-fields: true
                consoleUI:
                  type: object
                  description: |
                    Wave 5.69 (#2370) — Sovereign-console UI registration
                    contract for third-party Blueprints (bp-agenity is
                    the first consumer; see docs/INTEGRATION-OPENOVA-MCP.md
                    §5). When sidebarEntry=true the SovereignSidebar.tsx
                    appends a nav entry between the hardcoded last entry
                    (BSS) and Settings, in sidebarOrder order. RBAC is
                    inherited from existing tier-gate.
                  properties:
                    sidebarEntry:
                      type: boolean
                      default: false
                      description: When true, register a top-level Sovereign-console sidebar nav entry.
                    sidebarLabel:
                      type: string
                      description: Display label (operator-overridable per Sovereign overlay).
                    sidebarRoute:
                      type: string
                      description: Route path the nav link navigates to (e.g. /apps/bp-agenity/dashboard).
                    sidebarOrder:
                      type: integer
                      minimum: 0
                      maximum: 100
                      description: |
                        Insert-order between BSS (last hardcoded, order=60) and Settings
                        (order=99 pinned). Higher = closer to Settings. Default 50.
                      default: 50
                    sidebarIcon:
                      type: string
                      description: |
                        SVG path string for the icon (single-stroke, Tabler-style;
                        see existing FLAT_NAV entries in SovereignSidebar.tsx for
                        the conventional shape). Default uses the blueprint card
                        icon.
                placementSchema:
                  type: object
                  properties:
                    modes:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        # Two tiers of placement modes coexist (see
                        # core/controllers/blueprint/internal/validate/validate.go
                        # canonicalPlacementModes):
                        #   - Application-tier (marketplace 99%) — ONE
                        #     canonical vocabulary (#3375 DoD-1, defined by
                        #     core/controllers/internal/placement.CanonicalModes):
                        #     singleton / active-active / active-hot-standby /
                        #     active-passive. Legacy spellings
                        #     single-region / active-hotstandby remain in the
                        #     enum for back-compat (folded via
                        #     placement.Canonicalize); new authors emit the
                        #     canonical token.
                        #   - Bootstrap-topology tier (bp-*-vcluster +
                        #     bp-vcluster-helmrepo, per
                        #     docs/SOVEREIGN-MULTI-REGION-DOD.md A4):
                        #     primary-only / secondary-only / every-region
                        enum:
                          - singleton
                          - active-active
                          - active-hot-standby
                          - active-passive
                          - single-region
                          - active-hotstandby
                          - primary-only
                          - secondary-only
                          - every-region
                    default:
                      type: string
                      enum:
                        - singleton
                        - active-active
                        - active-hot-standby
                        - active-passive
                        - single-region
                        - active-hotstandby
                        - primary-only
                        - secondary-only
                        - every-region
                    # G93.2 (Refs #2667) — defaultOnMultiRegion is the
                    # Blueprint author's declarative preferred default
                    # when the Sovereign is multi-region (BCP topology =
                    # active-hot-standby or active-active). The
                    # application-controller consults this when the
                    # Application CR's spec.placement is empty:
                    #   - Multi-region Sovereign + defaultOnMultiRegion
                    #     set → use it (target-state Pillar 3 zero-
                    #     touch for CNPG-backed Blueprints).
                    #   - Otherwise → fall back to `default` (single-
                    #     knob backwards-compat).
                    # When set, MUST be in modes[] (validator enforces;
                    # membership is checked on the canonical token).
                    defaultOnMultiRegion:
                      type: string
                      enum:
                        - singleton
                        - active-active
                        - active-hot-standby
                        - active-passive
                        - single-region
                        - active-hotstandby
                        - primary-only
                        - secondary-only
                        - every-region
                    minRegions:
                      type: integer
                      minimum: 1
                      maximum: 5
                    maxRegions:
                      type: integer
                      minimum: 1
                      maximum: 5
                    vcluster:
                      type: string
                      # G92.1 #2660 (2026-06-01) — Blueprint authors
                      # declare WHICH per-region vCluster the rendered
                      # HelmRelease installs INTO. Empty / unset =
                      # install onto the host k3s (substrate
                      # Blueprints per G92.6 #2665 — Cilium-agent,
                      # Flux, Kyverno, cert-manager, ESO,
                      # CNPG-operator). The application-controller
                      # reads this field and stamps
                      # spec.kubeConfig.secretRef on the rendered HR
                      # so Flux helm-controller pivots into the
                      # vCluster apiserver. Per
                      # docs/SOVEREIGN-MULTI-REGION-DOD.md §A4 the
                      # three vClusters partition workloads:
                      #   dmz  — Cilium-Gateway, WAF-Coraza,
                      #          HTTPRoutes, Stalwart (#2663)
                      #   mgmt — catalyst-api/ui, Keycloak, OpenBao,
                      #          NATS, gitea, harbor (#2661 + #2662)
                      #   rtz  — Tenant Applications, Sandbox,
                      #          per-Org CNPG (#2664)
                      enum:
                        - dmz
                        - mgmt
                        - rtz
                  x-kubernetes-preserve-unknown-fields: true
                # ── #3373 PLACEMENT — class-level SUGGESTION + allow-list ──
                # Founder-ratified law: placement is an INSTANCE property
                # (Application.spec.placement); the Blueprint declares the
                # DEFAULT the user accepts silently and the set of tiers an
                # instance MAY choose in the provisioning journey's generic
                # advanced selector. Supersedes (but coexists with) the
                # legacy single-knob placementSchema.vcluster above:
                # resolution order in the application-controller is
                #   instance > defaultPlacement.vcluster >
                #   placementSchema.vcluster > host.
                defaultPlacement:
                  type: object
                  description: |
                    #3373 — the placement every instance of this Blueprint
                    inherits unless its own Application.spec.placement
                    overrides a field. Mirrors the object form of
                    Application.spec.placement.
                  properties:
                    vcluster:
                      type: string
                      enum: [host, mgmt, dmz, rtz]
                    regions:
                      type: array
                      items:
                        type: string
                    clusters:
                      type: array
                      items:
                        type: string
                  x-kubernetes-preserve-unknown-fields: true
                allowedPlacements:
                  type: array
                  description: |
                    #3373 — vCluster tiers an instance of this Blueprint MAY
                    be placed in. Empty/absent = unrestricted. The
                    application-controller fails an Application whose
                    effective vcluster is not in this list; the console's
                    generic advanced selector renders its options from it.
                  items:
                    type: string
                    enum: [host, mgmt, dmz, rtz]
                depends:
                  type: array
                  items:
                    type: object
                    required: [blueprint]
                    properties:
                      blueprint:
                        type: string
                        pattern: '^(bp-)?[a-z][a-z0-9-]{1,62}$'
                      version:
                        type: string
                      alias:
                        type: string
                      when:
                        type: string
                      values:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    x-kubernetes-preserve-unknown-fields: true
                manifests:
                  type: object
                  properties:
                    chart:
                      type: string
                    source:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum: [HelmChart, Kustomize, OAM]
                        ref:
                          type: string
                      x-kubernetes-preserve-unknown-fields: true
                    overlays:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    values:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    helmRelease:
                      type: object
                      description: |
                        Flux HelmRelease install/upgrade behaviour the
                        application-controller stamps on the rendered HR (#4246).
                      properties:
                        disableWait:
                          type: boolean
                          description: |
                            Stamp install.disableWait + upgrade.disableWait on the
                            rendered HelmRelease so helm-controller does NOT block on
                            workload readiness before running post-install/post-upgrade
                            hooks. Required by charts whose Pod gates on a value one of
                            the chart's own post-install hooks populates (e.g. bp-newapi
                            DSN-gate). Default false.
                      x-kubernetes-preserve-unknown-fields: true
                  x-kubernetes-preserve-unknown-fields: true
                upgrades:
                  type: object
                  properties:
                    from:
                      type: array
                      items:
                        type: string
                    blocks:
                      type: array
                      items:
                        type: string
                  x-kubernetes-preserve-unknown-fields: true
                rotation:
                  type: array
                  items:
                    type: object
                    required: [kind]
                    properties:
                      kind:
                        type: string
                      name:
                        type: string
                      ttl:
                        type: string
                        pattern: '^[0-9]+(s|m|h|d)$'
                    x-kubernetes-preserve-unknown-fields: true
                observability:
                  type: object
                  properties:
                    metrics:
                      type: string
                    logs:
                      type: string
                    traces:
                      type: string
                  x-kubernetes-preserve-unknown-fields: true
                outputs:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                # ── G117 EPIC fields — promoted from JSON schema ────────
                # Source of truth: platform/_schemas/blueprint-topology.json
                # Go types: core/pkg/apis/blueprint/v1alpha1/topology_types.go
                # G117.E2E-B3 (#2740 #2745 #2737): W1.B1 + W2.C2 landed
                # the Go-types + JSON-schema gate but the CRD manifest
                # never gained these fields, so runtime admission did
                # NOT gate them — preserve-unknown silently swallowed
                # them. This block makes admission see + validate the
                # G117 contract on every Sovereign (hw86 + downstream).
                topology:
                  type: object
                  description: |
                    Per-Blueprint multi-region declaration. Admission
                    enforces defaults.multi-region + defaults.single-region
                    are members of supported, and every key in perTopology
                    is in supported.
                  required: [supported, defaults]
                  # #2936 (2026-06-03): cross-field CEL validation. Pre-fix
                  # blueprint-controller surfaced these mismatches at reconcile
                  # time as Ready=False reason=ValidationFailed. Promoting to
                  # CRD admission means the apiserver rejects the CR at submit
                  # time with HTTP 422 — operator gets immediate feedback
                  # instead of "applied but stuck Pending".
                  #
                  # #2936 follow-up (2026-06-04): the first form of these rules
                  # (shipped via PR #2958) FAILED to compile on a real
                  # kube-apiserver — the CRD itself was rejected at apply time.
                  # Two CEL-modelling traps caused it, neither of which the
                  # jsonschema-based blueprint-admission-validate.yml CI job can
                  # catch (jsonschema does NOT evaluate x-kubernetes-validations
                  # CEL at all). Fixes:
                  #   1. `defaults` is declared with named `properties`, so the
                  #      CEL type-checker treats it as a STRUCT, not a map.
                  #      Struct fields whose names are not valid CEL identifiers
                  #      (the hyphenated `multi-region` / `single-region`) cannot
                  #      be reached with `['...']` bracket indexing — that
                  #      overload only exists for map/dyn types. Kubernetes
                  #      escapes such names for dot-access: `-` → `__dash__`.
                  #      Hence `self.defaults.multi__dash__region`.
                  #   2. `perTopology` is likewise declared with named
                  #      `properties` → STRUCT, so `.all(k, ...)` is illegal
                  #      ("cannot be range of a comprehension"). Its key-set is
                  #      the fixed 4-value topology enum, so each variant is
                  #      checked explicitly under a `has()` guard instead.
                  # Verified compiling + accepting/rejecting against a real
                  # kind v1.30 apiserver — see PR body.
                  x-kubernetes-validations:
                    - rule: "self.defaults.multi__dash__region in self.supported"
                      message: "topology.defaults.multi-region must be a member of topology.supported[]"
                    - rule: "self.defaults.single__dash__region in self.supported"
                      message: "topology.defaults.single-region must be a member of topology.supported[]"
                    # perTopology key ⊆ supported[]. Struct (named-properties)
                    # type forbids comprehension ranging, so each of the 4
                    # topology-enum keys is checked explicitly under a has()
                    # guard. A key present in perTopology but absent from
                    # supported[] is rejected at admission.
                    # The outer `has(self.perTopology)` guard is required: CEL
                    # cannot traverse into `self.perTopology.<key>` when
                    # `perTopology` itself is absent (it raises "no such key"
                    # rather than short-circuiting), so each rule must first
                    # confirm the parent exists.
                    - rule: "!has(self.perTopology) || !has(self.perTopology.active__dash__active) || ('active-active' in self.supported)"
                      message: "topology.perTopology.active-active requires 'active-active' in topology.supported[]"
                    - rule: "!has(self.perTopology) || !has(self.perTopology.active__dash__hot__dash__standby) || ('active-hot-standby' in self.supported)"
                      message: "topology.perTopology.active-hot-standby requires 'active-hot-standby' in topology.supported[]"
                    - rule: "!has(self.perTopology) || !has(self.perTopology.active__dash__passive) || ('active-passive' in self.supported)"
                      message: "topology.perTopology.active-passive requires 'active-passive' in topology.supported[]"
                    - rule: "!has(self.perTopology) || !has(self.perTopology.singleton) || ('singleton' in self.supported)"
                      message: "topology.perTopology.singleton requires 'singleton' in topology.supported[]"
                  properties:
                    supported:
                      type: array
                      minItems: 1
                      # K8s structural-schema forbids `uniqueItems: true`
                      # (quadratic-complexity ban); use the structural-
                      # schema equivalent x-kubernetes-list-type: set
                      # which the API server enforces in O(n) via hash.
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        enum:
                          - active-active
                          - active-hot-standby
                          - active-passive
                          - singleton
                    defaults:
                      type: object
                      required: [multi-region, single-region]
                      properties:
                        multi-region:
                          type: string
                          enum:
                            - active-active
                            - active-hot-standby
                            - active-passive
                            - singleton
                        single-region:
                          type: string
                          enum:
                            - active-active
                            - active-hot-standby
                            - active-passive
                            - singleton
                    perTopology:
                      type: object
                      description: |
                        Per-variant replication / switchover / placement
                        knobs. Each variant repeats the same three
                        sub-schemas — K8s structural CRD schemas forbid
                        $ref so each variant is inlined via YAML anchor.
                      properties:
                        active-active:
                          type: object
                          required: [replication, placement]
                          properties:
                            replication: &REPLICATION_SPEC
                              type: object
                              required: [backend]
                              properties:
                                backend:
                                  type: string
                                  enum:
                                    - cnpg-pair
                                    - raft
                                    - mirrormaker2
                                    - s3-bucket-replication
                                    - ccr
                                    - sentinel
                                    - velero
                                    - filer-remote-storage
                                    - openbao-perf-replication
                                    - flux-git
                                    - none
                                mode:
                                  type: string
                                  enum: [sync, async, none]
                                lagSloSeconds:
                                  type: integer
                                  minimum: 0
                                  maximum: 86400
                            switchover: &SWITCHOVER_SPEC
                              type: object
                              required: [mechanism]
                              properties:
                                mechanism:
                                  type: string
                                  enum:
                                    - bp-continuum
                                    - manual
                                    - bp-velero-restore
                                    - lua-record
                                    - mm2-symmetric
                                    - ccr-promote
                                    - raft-transition
                                    - sentinel-failover
                                    - none
                                rtoSeconds:
                                  type: integer
                                  minimum: 0
                                  maximum: 86400
                                rpoSeconds:
                                  type: integer
                                  minimum: 0
                                  maximum: 86400
                            placement: &PLACEMENT_SPEC
                              type: object
                              properties:
                                tier:
                                  type: string
                                  enum: [mgmt, dmz, rtz, ""]
                                clusters:
                                  type: array
                                  x-kubernetes-list-type: set
                                  items:
                                    type: string
                                    pattern: '^(mgmt|dmz|rtz)-[A-Z0-9]+$'
                                roles:
                                  type: object
                                  additionalProperties:
                                    type: string
                                    enum: [active, passive, singleton]
                        active-hot-standby:
                          type: object
                          required: [replication, switchover, placement]
                          properties:
                            replication: *REPLICATION_SPEC
                            switchover: *SWITCHOVER_SPEC
                            placement: *PLACEMENT_SPEC
                        active-passive:
                          type: object
                          required: [replication, switchover, placement]
                          properties:
                            replication: *REPLICATION_SPEC
                            switchover: *SWITCHOVER_SPEC
                            placement: *PLACEMENT_SPEC
                        singleton:
                          type: object
                          required: [placement]
                          properties:
                            replication: *REPLICATION_SPEC
                            switchover: *SWITCHOVER_SPEC
                            placement: *PLACEMENT_SPEC
                endpoints:
                  type: array
                  description: |
                    Named external endpoints surfaced by this Blueprint.
                    The Endpoints tab UI (G117.3) renders one card per
                    entry; the Launch button UI (G117.4) starts from
                    launchDefault=true (else first ssoEnabled https).
                  items:
                    type: object
                    required: [name, hostnameTemplate]
                    properties:
                      name:
                        type: string
                        pattern: '^[a-z][a-z0-9-]{0,30}[a-z0-9]$'
                      hostnameTemplate:
                        type: string
                        minLength: 1
                        maxLength: 253
                        description: |
                          Go text/template emitting an RFC-1123 hostname
                          after evaluation.

                          Tokens the resolver ACTUALLY implements
                          (catalyst-api resolveHostnameTemplate):
                          {{.SovereignFQDN}} {{.OrgSlug}} {{.AppName}}
                          {{.OrgDomain}}.

                          {{.OrgDomain}} (#5389) is the Organization's own
                          domain suffix — <subdomain>.<tenantPublic.parentDomain>
                          for a pool Org, falling back to
                          <slug>.<SovereignFQDN> for a single-domain Org. It is
                          the ONLY correct way to name a per-Org app host: live
                          per-Org HTTPRoutes are served on the pool domain
                          (agenity.uatco.omani.homes), never on
                          <app>.<org>.<SovereignFQDN>. Composing {{.OrgSlug}}
                          with {{.SovereignFQDN}} yields a host with no
                          HTTPRoute, no DNS and no certificate.

                          {{.InstanceID}} and {{.ClusterID}} were documented
                          here but were NEVER implemented by the resolver. Since
                          #5389 an unimplemented token is a hard resolution
                          FAILURE: the endpoint reports status Unresolved with
                          no hostname and no launchURL, rather than emitting a
                          URL with the literal braces still in it.
                        # Reject the two documented-but-never-implemented tokens
                        # at ADMISSION rather than at resolve time (#5389).
                        #
                        # Without this a Blueprint authored through the Git
                        # surface is admitted happily and only degrades later —
                        # the endpoint goes Unresolved and its Open button dies,
                        # far from the edit that caused it. platform/sandbox
                        # shipped `sandbox-{{.InstanceID}}.{{.OrgDomain}}` on a
                        # `visibility: listed` Blueprint exactly this way.
                        #
                        # Deliberately a DENYLIST of the two named tokens, not an
                        # allowlist: RE2 has no negative lookahead and CEL cannot
                        # iterate regex matches, so "every {{...}} is one of the
                        # four" is not expressible here. The general case is
                        # covered one layer out by
                        # TestEveryBlueprintHostnameTemplateResolves_5389, which
                        # feeds every on-disk template through the real resolver,
                        # and one layer in by the resolver itself failing closed.
                        # This rule closes the specific hole that actually shipped.
                        #
                        # Character classes instead of backslash escapes so the
                        # expression survives YAML quoting unchanged.
                        x-kubernetes-validations:
                          - rule: "!self.matches('[{][{][ ]*[.](InstanceID|ClusterID)')"
                            message: "endpoints[].hostnameTemplate references {{.InstanceID}} or {{.ClusterID}}, which the resolver has never implemented — it substitutes only SovereignFQDN, OrgSlug, AppName and OrgDomain. For a per-instance host use {{.AppName}}: multiInstance.namingTemplate already makes the Application CR name instance-unique."
                      port:
                        type: integer
                        minimum: 1
                        maximum: 65535
                      protocol:
                        type: string
                        enum: [https, http, grpc, tcp, udp]
                      tls:
                        type: boolean
                      visibility:
                        type: string
                        enum: [public, private, internal]
                      launchDefault:
                        type: boolean
                      ssoEnabled:
                        type: boolean
                      ssoInitPath:
                        type: string
                        maxLength: 512
                        description: |
                          App-local OIDC-init route the console "Open"
                          launch lands the browser on (e.g. Grafana
                          `/login/generic_oauth`, Harbor `/c/oidc/login`),
                          which 302s to Keycloak with the app's pre-baked
                          kc_idp_hint for silent SSO. Empty/absent →
                          legacy app-root launch. (#3150)
                sso:
                  type: object
                  description: |
                    Blueprint-level SSO declaration. Tier-1/2 use realm
                    `sovereign`; Tier-3 use per-Org realm via
                    `{{.OrgSlug}}` template token.
                  required: [realm]
                  properties:
                    realm:
                      type: string
                      enum: [sovereign, '{{.OrgSlug}}']
                    protocolMapper:
                      type: string
                      enum: [oidc, saml]
                    groupsClaim:
                      type: string
                    rolesFromGroup:
                      type: object
                      additionalProperties:
                        type: string
                    silentLogin:
                      type: boolean
                    adminGroup:
                      type: string
                      description: |
                        #3648 — the STANDARD, app-agnostic Sovereign-realm
                        GROUP whose members are elevated to the app's admin
                        role. Every Blueprint that needs a first admin
                        seeded via the Sovereign SSO names the group HERE
                        instead of in a chart-bespoke values key. Elevation
                        always keys on the group, never a per-user identity
                        (#3374 §5). Default `sovereign-admins`.
                    bootstrap:
                      type: object
                      description: |
                        #3648 — the STANDARD sso-bootstrap stanza: when set,
                        the platform seeds the app's FIRST admin via the
                        Sovereign SSO (Pattern B — apps with no group→role
                        config knob, honoured by the chart's own seeding
                        mechanism, never keyed on the app name in the
                        engine).
                      properties:
                        enabled:
                          type: boolean
                        providerSlug:
                          type: string
                        enforceAdminGroup:
                          type: boolean
                # #3656 (founder #6) — declared user-UI capability. When a
                # Blueprint fronts a user-facing UI (an OIDC-login front
                # door the operator opens), the console's AppCard renders a
                # confident disabled "Open…" placeholder while the live
                # externalURL resolves — so the Open chip never pops in late
                # (the faithful-view law: never assert-then-retract). A
                # headless Blueprint (controller / operator / OCI registry /
                # API-only backend) declares false (or omits this) and the
                # card shows NO transient chip.
                #
                # Authoritative source remains spec.endpoints[]: the catalog
                # projector (build-catalog.mjs) and the BE
                # (blueprintHasUserUIEndpoint) both derive the signal from
                # any endpoint with ssoEnabled / launchDefault / name="ui".
                # This explicit field lets a Blueprint author document /
                # override the capability at admission time and makes it
                # visible on the CR.
                hasUserUIEndpoint:
                  type: boolean
                  description: |
                    True when this Blueprint exposes a user-facing UI front
                    door (drives the console AppCard's "Open…" placeholder).
                    Defaults from spec.endpoints[] (ssoEnabled / launchDefault
                    / name="ui") when omitted.
                multiInstance:
                  type: object
                  description: |
                    When enabled, a Blueprint may have >1 Application
                    instance per Organization. Catalog cards show the
                    instance-count badge + "+ New instance" button.
                    When absent / enabled=false, a Blueprint is
                    singleton-per-Org.
                  required: [enabled]
                  properties:
                    enabled:
                      type: boolean
                    maxPerOrg:
                      type: integer
                      minimum: 0
                      maximum: 1000
                    namingTemplate:
                      type: string
                    isolationLevel:
                      type: string
                      enum: [namespace, vcluster]
                producesInstances:
                  type: object
                  description: |
                    #3648 — declares this Blueprint is an OPERATOR/engine
                    that PRODUCES shareable data-instances of another
                    (instance) Blueprint. The DECLARED, app-agnostic
                    replacement for hardcoded "postgres operator"
                    knowledge: any operator Blueprint that sets this gets
                    the engine-class-card / instance-creation treatment and
                    the backing-service generator resolves a consumer's
                    `backingServices[].type: <kind>` to
                    `<instanceBlueprint>-<instance>` — no engine-name
                    literal in the platform engine.
                  required: [kind, instanceBlueprint]
                  properties:
                    kind:
                      type: string
                      description: |
                        The engine-class id the instances are OF (e.g.
                        `postgres`) — the value a consumer Blueprint names
                        in backingServices[].type.
                    instanceBlueprint:
                      type: string
                      description: |
                        The instance Blueprint id this operator provisions
                        (e.g. `bp-postgres`); the dependsOn HR prefix.
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Draft, Published, Deprecated, Withdrawn]
                publishedAt:
                  type: string
                  format: date-time
                deprecatedAt:
                  type: string
                  format: date-time
                ociDigest:
                  type: string
                  description: cosign-signed OCI artifact digest (set by CI on publish).
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                observedGeneration:
                  type: integer
                  format: int64
              x-kubernetes-preserve-unknown-fields: true
