# Valid sample — ADR-0015 D8. The Continuum of a WordPress placed
# active-hot-standby across two regions, as the application-controller renders
# it into every region file of the Org repo. Continuum commits the transition
# phases to acme/catalyst-tenant regions/<region-id>/apps/wordpress.yaml.
apiVersion: dr.openova.io/v1
kind: Continuum
metadata:
  name: dr-wordpress
  namespace: acme
spec:
  applicationRef: acme/wordpress
  desiredPrimaryRegion: hw-me-east-215-b-rtz-prod
  regions:
    - hw-me-east-215-a-rtz-prod
    - hw-me-east-215-b-rtz-prod
  transition:
    repo:
      owner: acme
      name: catalyst-tenant
      branch: main
    app: wordpress
    stateful: true
    dependsOn: []
    autoPromoteOnRegionLoss: false
    regionLossSeconds: 300
    phaseTimeoutSeconds: 900
  rto: 60s
  rpo: 0s
