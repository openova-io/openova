apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: continuums.dr.openova.io
  labels:
    app.kubernetes.io/name: catalyst
    app.kubernetes.io/component: continuum
spec:
  group: dr.openova.io
  scope: Namespaced
  names:
    kind: Continuum
    listKind: ContinuumList
    singular: continuum
    plural: continuums
    shortNames:
      - dr
    categories:
      - catalyst
      - openova
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Application
          type: string
          jsonPath: .spec.applicationRef
        - name: Primary
          type: string
          jsonPath: .status.primaryRegion
        - name: Lease
          type: string
          jsonPath: .status.leaseHolder
        - name: Lag
          type: string
          jsonPath: .status.maxReplicationLag
          priority: 1
        - name: RTO
          type: string
          jsonPath: .spec.rto
          priority: 1
        - name: RPO
          type: string
          jsonPath: .spec.rpo
          priority: 1
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: |
            Continuum is the declarative DR contract for an Application
            running with placement: active-hotstandby across two or more
            regions. Watched by the continuum-controller (EPIC-6 #1101).

            Per docs/SRE.md §2.4 + docs/MULTI-REGION-DNS.md, switchover
            is gated by a lease witness (Cloudflare KV or 3-DNS quorum)
            and effected by flipping a PowerDNS lua-record probe target
            via PDM /v1/commit. ClusterMesh carries the replication
            traffic; Application.spec.placement remains the single
            source of truth for which regions exist.

            See docs/EPICS-1-6-unified-design.md §3.2.8 and §9.
          required: [spec]
          properties:
            spec:
              type: object
              required: [applicationRef, primaryRegion, hotStandbyRegions, leaseClient]
              properties:
                applicationRef:
                  type: string
                  description: |
                    Name of the Application CR this Continuum governs.
                    Application.spec.placement MUST be active-hotstandby
                    (the controller refuses other modes at admission).
                primaryRegion:
                  type: string
                  description: Currently-primary host cluster name. Switched on failover.
                  pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+){3,}$'
                hotStandbyRegions:
                  type: array
                  minItems: 1
                  maxItems: 4
                  description: Host clusters running standby replicas. Promoted on failover.
                  items:
                    type: string
                    pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+){3,}$'
                leaseClient:
                  type: object
                  required: [kind]
                  properties:
                    kind:
                      type: string
                      enum: [cloudflare-kv, dns-quorum]
                      description: |
                        cloudflare-kv = lease in a Cloudflare Worker KV
                        namespace (recommended per SRE.md §2.4).
                        dns-quorum = 2-of-3 DNS resolver quorum
                        (fallback when CF KV is unavailable).
                    config:
                      type: object
                      description: |
                        Kind-specific config. cloudflare-kv expects
                        kvNamespaceId + accountId + tokenSecretRef.
                        dns-quorum expects resolvers[] (2-of-3 voting set).
                      properties:
                        kvNamespaceId:
                          type: string
                        accountId:
                          type: string
                        tokenSecretRef:
                          type: object
                          required: [name, key]
                          description: SealedSecret reference; plaintext NEVER on the CR.
                          properties:
                            name:
                              type: string
                            key:
                              type: string
                              default: token
                          x-kubernetes-preserve-unknown-fields: true
                        resolvers:
                          type: array
                          minItems: 3
                          maxItems: 5
                          items:
                            type: string
                            description: IPv4 resolver address.
                            pattern: '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$'
                        ttlSeconds:
                          type: integer
                          minimum: 5
                          maximum: 600
                          description: Lease TTL. Default applied by controller (30s).
                        renewSeconds:
                          type: integer
                          minimum: 1
                          maximum: 60
                          description: Lease renewal interval (must be < ttlSeconds/2). Default 10s.
                      x-kubernetes-preserve-unknown-fields: true
                  x-kubernetes-preserve-unknown-fields: true
                luaRecord:
                  type: object
                  description: |
                    Per docs/MULTI-REGION-DNS.md, the controller writes
                    the Application's HTTPRoute hostnames as PowerDNS
                    lua-records via PDM /v1/commit. selector picks the
                    behaviour; healthCheck drives the probe target.
                  properties:
                    selector:
                      type: string
                      enum: [ifurlup, pickclosest, pickfirst, pickwhashed]
                      default: ifurlup
                    healthCheck:
                      type: object
                      required: [url]
                      properties:
                        url:
                          type: string
                          pattern: '^https?://.+'
                        intervalSeconds:
                          type: integer
                          minimum: 1
                          maximum: 60
                          default: 5
                        timeoutSeconds:
                          type: integer
                          minimum: 1
                          maximum: 30
                          default: 2
                rto:
                  type: string
                  description: Recovery Time Objective. Format `^[0-9]+(s|m|h)$`.
                  pattern: '^[0-9]+(s|m|h)$'
                rpo:
                  type: string
                  description: Recovery Point Objective. Format `^[0-9]+(s|m|h)$`.
                  pattern: '^[0-9]+(s|m|h)$'
                autoFailover:
                  type: boolean
                  default: false
                  description: |
                    If true, controller initiates switchover when health
                    check fails for ≥3 consecutive intervals + lease
                    quorum confirms primary unreachable. If false,
                    controller surfaces alarm only and waits for manual
                    switchover via the Application page (UI in #1101).
                switchover:
                  type: object
                  description: |
                    Switchover orchestration knobs. `mechanism` selects the
                    state-store-promotion strategy for the two
                    mechanism-specific steps of the switchover sequence
                    (cordon + promote); the other five steps (lease /
                    drain-HTTP / flip-DNS / audit) are mechanism-agnostic.
                    Mirrors the Blueprint topology declaration's
                    switchover.mechanism column (docs/topology-matrix.md).
                    Also carries the operator-initiated switchover request
                    flags (requested / targetRegion / requestedBy / reason)
                    patched by catalyst-api's POST .../switchover.
                  properties:
                    mechanism:
                      type: string
                      enum: [cnpg-pair, raft-transition]
                      default: cnpg-pair
                      description: |
                        cnpg-pair (default) = bp-cnpg-pair promotion
                        (cordon annotation + replica.enabled flip on the two
                        Cluster CR halves). raft-transition = bp-openbao
                        promotion (`bao operator raft snapshot restore` of
                        the staged snapshot + `transition-to-primary` via
                        Pod exec on the surviving standby; #3492).
                    raftTransition:
                      type: object
                      description: |
                        Openbao standby target for the raft-transition
                        mechanism. Filled by the bp-openbao bootstrap-kit
                        slot from the topology declaration. Ignored for
                        cnpg-pair.
                      properties:
                        namespace:
                          type: string
                          description: openbao release namespace on the standby cluster.
                        pod:
                          type: string
                          description: |
                            Explicit standby Raft member Pod to promote
                            (e.g. openbao-0). When empty, podSelector is
                            used to discover the Ready Pod.
                        podSelector:
                          type: string
                          description: |
                            Label selector to find the standby Pod when pod
                            is empty (e.g. app.kubernetes.io/name=openbao).
                            The lexically-first Ready match is promoted.
                        container:
                          type: string
                          default: openbao
                          description: openbao container name inside the Pod.
                        raftDataPath:
                          type: string
                          default: /openbao/data
                          description: |
                            openbao raft store directory inside the container
                            (upstream chart default /openbao/data). The OSS
                            peers.json recovery file is written to
                            <raftDataPath>/raft/peers.json on the survivor.
                        snapshotPath:
                          type: string
                          description: |
                            OPTIONAL last-resort staged snapshot to restore
                            BEFORE the peers.json recovery — only for the
                            degenerate non-stretched topology where region-B was
                            fed periodic snapshots instead of being a live
                            retry_join non-voter. Empty (the common stretched-
                            raft case) promotes from the survivor's live
                            replicated state (no restore).
                        baoBinary:
                          type: string
                          default: bao
                          description: openbao CLI name in the image (bao | vault).
                      x-kubernetes-preserve-unknown-fields: true
                  x-kubernetes-preserve-unknown-fields: true
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Healthy
                    - Degraded
                    - SwitchingOver
                    - FailedOver
                    - Failed
                primaryRegion:
                  type: string
                leaseHolder:
                  type: string
                  description: Cluster that currently holds the lease.
                leaseExpiresAt:
                  type: string
                  format: date-time
                replicationLag:
                  type: object
                  description: 'Per-standby-region replication lag — keyed by host-cluster name, value is a duration string.'
                  additionalProperties:
                    type: string
                maxReplicationLag:
                  type: string
                  description: Convenience printer column = max(replicationLag values).
                lastSwitchover:
                  type: object
                  properties:
                    at:
                      type: string
                      format: date-time
                    from:
                      type: string
                    to:
                      type: string
                    reason:
                      type: string
                    rtoObserved:
                      type: string
                    rpoObserved:
                      type: string
                    initiatedBy:
                      type: string
                      description: User email or 'auto-failover'.
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                lastLuaRecord:
                  type: object
                  description: |
                    Slice Z1 follow-up — last lua-record body Continuum
                    committed to PowerDNS via PDM /v1/lua/commit. The UI
                    (U-DR-1 LuaRecordView) reads `records[].body` to
                    render. Always reflects what is currently published
                    in PowerDNS — re-emitted on every successful PDM
                    commit (forward and rollback).
                  properties:
                    records:
                      type: array
                      items:
                        type: object
                        properties:
                          hostname:
                            type: string
                          body:
                            type: string
                            description: Lua expression PowerDNS evaluates at query time.
                          ttl:
                            type: integer
                            format: int64
                          primaryRegion:
                            type: string
                        x-kubernetes-preserve-unknown-fields: true
                  x-kubernetes-preserve-unknown-fields: true
                lastLuaRecordAt:
                  type: string
                  format: date-time
                  description: RFC3339 timestamp of the last successful PDM lua-record commit.
                observedGeneration:
                  type: integer
                  format: int64
              x-kubernetes-preserve-unknown-fields: true
