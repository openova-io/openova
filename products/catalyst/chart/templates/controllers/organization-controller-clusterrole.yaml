{{- /*
ClusterRole for organization-controller.

Least-privilege grants per CC3 audit (#1095):

  agent's deploy/rbac/role.yaml grants                         keep?  why
  ----------------------------------------------------------------------------
  organizations:get/list/watch                                 yes    primary watch
  organizations/status:get/update/patch                        yes    status writes
  organizations/finalizers:update                              yes    finalizer add/remove
  useraccesses:get/list/watch/create/update/patch              yes    per-owner UA writes
  leases:get/list/watch/create/update/patch/delete             yes    leader election
  events:create/patch                                          yes    controller-runtime emits Events
  configmaps:get/list/watch/create/update/patch/delete         TIGHTEN — controller-runtime LE fallback ONLY needs these in
                                                                       its own namespace, not cluster-wide. Moved to a
                                                                       Role (see organization-controller-role.yaml).

Net delta vs the agent's original ClusterRole shape:
  - REMOVED cluster-wide configmaps {get,list,watch,create,update,patch,delete}
    (moved to namespace-scoped Role for leader election)
*/ -}}
{{- if .Values.controllers.organization.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "controllers.fullname" "organization" }}
  labels:
    {{- include "controllers.labels" (dict "name" "organization" "root" .) | nindent 4 }}
rules:
  - apiGroups: ["orgs.openova.io"]
    resources: ["organizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["orgs.openova.io"]
    resources: ["organizations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["orgs.openova.io"]
    resources: ["organizations/finalizers"]
    verbs: ["update"]
  - apiGroups: ["access.openova.io"]
    resources: ["useraccesses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Slice F2 (#1098): per-Org Azure-SSO / Okta / generic-OIDC
  # federation requires the controller to read the OIDC client secret
  # from a K8s Secret referenced via spec.identity.federationConfig.clientSecretRef.
  # The controller is configured to read these from a single namespace
  # (default: catalyst-controllers — its own namespace) so this rule is
  # cluster-wide-get-only by necessity (controller-runtime's Secret
  # client cache is cluster-scoped). Plaintext secret values stay in
  # memory only long enough to be PUT/POSTed onto Keycloak — never
  # logged, never written to disk (Inviolable Principle #5).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # #3687 (fold #3669): the controller reads back the vCluster
  # HelmRelease it wrote into the per-Org Gitea repo + the per-Org
  # Namespace so status.vcluster.phase and the Ready condition derive
  # from the LIVE reconcile state (never "I PUT the file → Ready=True").
  # Read-only — the manifests are authored in Git, applied by Flux.
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # PR #3700 §4.3 (deferred half of #3687): the controller now
  # find-or-creates the host-cluster Flux GitRepository + Kustomization
  # that reconcile the per-Org `catalyst-tenant` repo's ./vcluster tree
  # onto the host cluster — so the vCluster HelmRelease it authored in
  # Gitea actually gets APPLIED (previously assumed a manual one-off
  # Kustomization that never ran on a fresh prov, leaving the manifest as
  # orphaned bytes / phase=Pending forever). These CRs live in
  # flux-system; the controller create/update/delete-s them (delete on Org
  # teardown — they carry no cross-namespace ownerRef per the Fix #42
  # GC-trap idiom). source-controller + kustomize-controller own the
  # spec.*.status writes.
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
