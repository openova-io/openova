{{- /*
ClusterRole for organization-controller.

Least-privilege grants per CC3 audit (#1095):

  agent's deploy/rbac/role.yaml grants                         keep?  why
  ----------------------------------------------------------------------------
  organizations:get/list/watch                                 yes    primary watch
  organizations/status:get/update/patch                        yes    status writes
  organizations/finalizers:update                              yes    finalizer add/remove
  useraccesses:get/list/watch/create/update/patch              yes    per-owner UA writes
  leases:get/list/watch/create/update/patch/delete             yes    leader election
  events:create/patch                                          yes    controller-runtime emits Events
  configmaps:get/list/watch/create/update/patch/delete         TIGHTEN — controller-runtime LE fallback ONLY needs these in
                                                                       its own namespace, not cluster-wide. Moved to a
                                                                       Role (see organization-controller-role.yaml).

Net delta vs the agent's original ClusterRole shape:
  - REMOVED cluster-wide configmaps {get,list,watch,create,update,patch,delete}
    (moved to namespace-scoped Role for leader election)
*/ -}}
{{- if .Values.controllers.organization.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "controllers.fullname" "organization" }}
  labels:
    {{- include "controllers.labels" (dict "name" "organization" "root" .) | nindent 4 }}
rules:
  # #4471/#4462: the controller adds + removes the tenant-networking,
  # iac-bootstrap, and per-org-realm finalizers via client.Update on the
  # MAIN Organization object (organization_controller.go ~L455/469/484 add,
  # ~L399/413/431 remove). controller-runtime's client.Update writes the
  # parent resource — k8s only routes to the `organizations/finalizers`
  # subresource when the request explicitly targets `.../finalizers`, which
  # it does not here. So `organizations/finalizers:update` is NOT sufficient;
  # the controller needs `update` (and `patch` for any SSA path) on the
  # `organizations` resource itself, otherwise EVERY reconcile bails on the
  # first finalizer-add with `cannot update resource "organizations"` and no
  # per-Org boundary is ever produced (#4462 delete-cascade regression).
  - apiGroups: ["orgs.openova.io"]
    resources: ["organizations"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["orgs.openova.io"]
    resources: ["organizations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["orgs.openova.io"]
    resources: ["organizations/finalizers"]
    verbs: ["update"]
  - apiGroups: ["access.openova.io"]
    resources: ["useraccesses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # #3376 fix: the reconciler renders a per-Organization Gateway-API
  # HTTPRoute for `console.<slug>.<parentDomain>` (tenant_route.go,
  # issue #1629 follow-up) attached to cilium-gateway/kube-system. It
  # was authored via the runtime client (r.Create/r.Update) but this
  # ClusterRole granted NO `gateway.networking.k8s.io` verbs — so on a
  # live Sovereign every per-tenant route write 403'd and the customer's
  # `console.<slug>.<pool-tld>` host never attached to a route (it fell
  # through to the Sovereign-wide tenant-wildcard / connection-refused).
  # The Flux GitRepository + Kustomization grants below (per_org_flux.go)
  # were already present; the HTTPRoute grant was the missing peer.
  #
  # #4471/#4462: `delete` added — teardownTenantNetworking
  # (tenant_networking_teardown.go:127) DELETEs the per-Org console
  # HTTPRoute on Org deletion. Without it the tenant-networking finalizer
  # teardown 403s (`cannot delete resource "httproutes"`), the finalizer
  # never drops, and the Org CR is stuck Terminating forever (orphaning
  # its console route + wildcard cert).
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # #4075: a customer Org that picks a free-subdomain hostname under a
  # pool parent zone (e.g. console.<slug>.omani.homes) needs a
  # `*.<parentDomain>` TLS listener appended to the dedicated console
  # Gateway (cilium-gateway-console, #4053) AND a matching cert-manager
  # Certificate (tenant_console_tls.go). Without these the customer-Org
  # console URL fails ERR_CONNECTION_CLOSED (no SNI match → no cert → TLS
  # handshake closed). The controller reads+patches the (existing,
  # bootstrap-rendered) console Gateway to APPEND the listener — it never
  # creates/deletes Gateways — and create/updates the shared per-pool
  # Certificate. Strictly additive: the apex `*.<sovFQDN>` listener is
  # never touched.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # #4471/#4462: `delete` added — teardownTenantNetworking
  # (tenant_networking_teardown.go:122) DELETEs the per-Org wildcard
  # Certificate (org-wildcard-tls-<slug>-<pool>) in kube-system on Org
  # deletion. Without it the tenant-networking finalizer teardown 403s
  # (`cannot delete resource "certificates"`), the finalizer never drops,
  # and the Org CR is stuck Terminating forever.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Slice F2 (#1098): per-Org Azure-SSO / Okta / generic-OIDC
  # federation requires the controller to read the OIDC client secret
  # from a K8s Secret referenced via spec.identity.federationConfig.clientSecretRef.
  # The controller is configured to read these from a single namespace
  # (default: catalyst-controllers — its own namespace) so this rule is
  # cluster-wide-get-only by necessity (controller-runtime's Secret
  # client cache is cluster-scoped). Plaintext secret values stay in
  # memory only long enough to be PUT/POSTed onto Keycloak — never
  # logged, never written to disk (Inviolable Principle #5).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # #3687 (fold #3669): the controller reads back the vCluster
  # HelmRelease it wrote into the per-Org Gitea repo + the per-Org
  # Namespace so status.vcluster.phase and the Ready condition derive
  # from the LIVE reconcile state (never "I PUT the file → Ready=True").
  # Read-only — the manifests are authored in Git, applied by Flux.
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # #5395: the controller VERIFIES ITS OWN POSTCONDITIONS before reporting an
  # Organization Ready (provisioning_postconditions.go). Two of the artifacts it
  # authors into the per-Org repo land as plain core/v1 objects in the `<slug>`
  # boundary namespace — the plan `plan-quota` ResourceQuota and the
  # `plan-limits` LimitRange — and until this grant nothing ever read them back,
  # so an Org whose boundary tree was never applied by Flux still reported
  # Ready=True with no cap on the namespace the customer paid for.
  # Read-only: the manifests are authored in Git and applied by Flux; the
  # controller only reads them back to decide whether its own work landed.
  #
  # A missing grant here is NOT interpreted as a missing artifact — the verifier
  # separates NotFound (evidence of absence) from any other read error
  # (unverifiable), so a partially-rolled-out RBAC cannot red-flag every
  # Organization on the Sovereign at once.
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  # Issue #4077: the controller find-or-creates the parent Environment CR
  # (`<slug>-<envType>`) once the Org's vCluster is Ready, so Applications
  # installed into the Org resolve their Environment instead of wedging at
  # Ready=False:EnvironmentMissing. Get to short-circuit when present;
  # create to fill the gap. NO update/delete — the controller never
  # clobbers operator/funnel-authored regions (the OwnerReference GCs it on
  # Org teardown). The environment-controller owns the status writes.
  - apiGroups: ["catalyst.openova.io"]
    resources: ["environments"]
    verbs: ["get", "list", "watch", "create"]
  # PR #3700 §4.3 (deferred half of #3687): the controller now
  # find-or-creates the host-cluster Flux GitRepository + Kustomization
  # that reconcile the per-Org `catalyst-tenant` repo's ./vcluster tree
  # onto the host cluster — so the vCluster HelmRelease it authored in
  # Gitea actually gets APPLIED (previously assumed a manual one-off
  # Kustomization that never ran on a fresh prov, leaving the manifest as
  # orphaned bytes / phase=Pending forever). These CRs live in
  # flux-system; the controller create/update/delete-s them (delete on Org
  # teardown — they carry no cross-namespace ownerRef per the Fix #42
  # GC-trap idiom). source-controller + kustomize-controller own the
  # spec.*.status writes.
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
