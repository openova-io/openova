{{- /*
application-controller Deployment.

Reconciles Application.apps.openova.io/v1 CRs:
  - Resolves parent Environment + grandparent Organization
  - Renders per-region Kustomization + HelmRelease manifests for the
    referenced Blueprint
  - Idempotently commits manifests into the per-Org Gitea repo via HTTP
  - Writes status (conditions + giteaRepo + commitSHA) on the Application

All configuration env-driven per Inviolable Principle #4.
*/ -}}
{{- if .Values.controllers.application.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "controllers.fullname" "application" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "controllers.labels" (dict "name" "application" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.controllers.application.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "controllers.selectorLabels" (dict "name" "application") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "controllers.labels" (dict "name" "application" "root" .) | nindent 8 }}
      annotations:
        # G117 #2742-followup (2026-06-03): roll on runtime-config CM
        # change. Same rationale as organization-controller — see
        # that template's comment block for full context.
        checksum/runtime-config: {{ include (print $.Template.BasePath "/configmap-catalyst-runtime-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "controllers.fullname" "application" }}
      automountServiceAccountToken: true
      # GHCR image is private — same pattern as catalyst-api / catalyst-ui.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "controllers.image" (dict "name" "application" "cfg" .Values.controllers.application "root" .) | quote }}
          imagePullPolicy: {{ .Values.controllers.application.image.pullPolicy | default "IfNotPresent" }}
          args:
            - "--leader-elect={{ .Values.controllers.application.leaderElection.enabled }}"
            - "--metrics-bind-address=:8080"
            - "--health-probe-bind-address=:8081"
          env:
            - name: LEADER_ELECT_NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GITEA_API_URL
              value: {{ .Values.controllers.application.giteaURL | default "http://gitea-http.gitea.svc.cluster.local:3000" | quote }}
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalyst-gitea-token
                  key: token
                  optional: true
            - name: GITEA_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: catalyst-runtime-config
                  key: gitea-public-url
                  optional: true
            - name: SOURCE_NAMESPACE
              value: {{ .Values.controllers.application.sourceNamespace | default "flux-system" | quote }}
            - name: CATALOG_SOURCE_REF
              value: {{ .Values.controllers.application.catalogSourceRef | default "openova-catalog" | quote }}
            - name: HELMRELEASE_INTERVAL
              value: {{ .Values.controllers.application.helmReleaseIntervalSeconds | default 600 | quote }}
            - name: REQUEUE_AFTER_SECONDS
              value: {{ .Values.controllers.application.requeueAfterSeconds | default 300 | quote }}
            # qa-loop iter-8 Fix #42 bug 3 — host-side Flux bootstrap.
            # Without these env vars the per-Application manifests sit
            # in Gitea forever and no Pod is ever scheduled. Default
            # values match the canonical Sovereign topology.
            - name: HOST_FLUX_NAMESPACE
              value: {{ .Values.controllers.application.hostFluxNamespace | default "flux-system" | quote }}
            - name: GITEA_IN_CLUSTER_URL
              value: {{ .Values.controllers.application.giteaInClusterURL | default "http://gitea-http.gitea.svc.cluster.local:3000" | quote }}
            - name: HOST_FLUX_INTERVAL_SECONDS
              value: {{ .Values.controllers.application.hostFluxIntervalSeconds | default 60 | quote }}
            - name: FLUX_GITEA_SECRET_REF
              value: {{ .Values.controllers.application.fluxGiteaSecretRef | default "" | quote }}
            # G93.2 (Refs #2667) — Sovereign-wide BCP topology. Read
            # from the sovereign-fqdn ConfigMap which the chart stamps
            # from the cloud-init Kustomization postBuild.substitute
            # SOVEREIGN_BCP_TOPOLOGY key (G93.1, Refs #2666). When the
            # Sovereign is multi-region (active-hotstandby or
            # active-active) the application-controller uses each
            # Blueprint's placementSchema.defaultOnMultiRegion when
            # spec.placement is empty so Pillar 3 zero-tx-loss holds
            # zero-touch on every fresh marketplace install.
            - name: SOVEREIGN_BCP_TOPOLOGY
              valueFrom:
                configMapKeyRef:
                  name: sovereign-fqdn
                  key: bcpTopology
                  optional: true
            {{- range $k, $v := .Values.controllers.application.env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controllers.application.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      {{- with .Values.controllers.application.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllers.application.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllers.application.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 15
{{- end }}
