{{- /*
organization-controller Deployment.

Reconciles Organization.orgs.openova.io/v1 CRs:
  - Provisions/updates per-Org Keycloak realm coordinates (via the
    in-cluster Keycloak Admin API)
  - Creates/updates the per-Org Gitea Org slug (via Gitea API)
  - Maintains the per-Org owner UserAccess CR
  - Surfaces ready/error state via .status.conditions

Configuration (no hardcoded values per docs/INVIOLABLE-PRINCIPLES.md #4):
  - Keycloak coords come from .Values.controllers.organization.env.* in the
    chart values, which the operator threads from the per-Sovereign overlay.
  - Gitea coords come from the same `catalyst-gitea-token` Secret that
    catalyst-api uses (single source of truth — issue #957/#1052 trail).
*/ -}}
{{- if .Values.controllers.organization.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "controllers.fullname" "organization" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "controllers.labels" (dict "name" "organization" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.controllers.organization.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "controllers.selectorLabels" (dict "name" "organization") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "controllers.labels" (dict "name" "organization" "root" .) | nindent 8 }}
      annotations:
        # G117 #2742-followup (2026-06-03): roll the Pod whenever
        # catalyst-runtime-config ConfigMap content changes. Without
        # this, env.valueFrom.configMapKeyRef bindings stay frozen at
        # the value read at Pod start — so when bp-catalyst-platform
        # ships a new chart with updated keycloak-addr (PR #2895:
        # `http://keycloak.keycloak.svc.cluster.local:80`) the
        # ConfigMap reconciles cleanly but the controller Pod keeps
        # reading the OLD address until manually restarted. Caught
        # live on hw86 H22 verifier walk: organization-controller
        # tried `keycloak-x-keycloak-x-mgmt-vcluster.mgmt.svc.cluster.local`
        # for 90+ min after the chart-side fix landed because the Pod
        # never rolled. checksum-annotation rolls automatically on any
        # CM content change.
        checksum/runtime-config: {{ include (print $.Template.BasePath "/configmap-catalyst-runtime-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "controllers.fullname" "organization" }}
      automountServiceAccountToken: true
      # GHCR image is private — same pattern as catalyst-api / catalyst-ui
      # / org-services. The `ghcr-pull` Secret is rendered by the chart's
      # cloud-init / bootstrap-kit path on every Sovereign.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "controllers.image" (dict "name" "organization" "cfg" .Values.controllers.organization "root" .) | quote }}
          imagePullPolicy: {{ .Values.controllers.organization.image.pullPolicy | default "IfNotPresent" }}
          args:
            - "--leader-elect={{ .Values.controllers.organization.leaderElection.enabled }}"
            - "--metrics-bind-address=:8080"
            - "--health-probe-bind-address=:8081"
          env:
            - name: LEADER_ELECT_NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CATALYST_HOST_CLUSTER
              value: {{ .Values.global.sovereignFQDN | default "catalyst-zero" | quote }}
            - name: CATALYST_KC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: catalyst-runtime-config
                  key: keycloak-addr
                  optional: true
            - name: CATALYST_KC_REALM
              valueFrom:
                configMapKeyRef:
                  name: catalyst-runtime-config
                  key: keycloak-realm
                  optional: true
            - name: CATALYST_KC_SA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: catalyst-organization-controller-keycloak
                  key: client-id
                  optional: true
            - name: CATALYST_KC_SA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalyst-organization-controller-keycloak
                  key: client-secret
                  optional: true
            - name: CATALYST_GITEA_URL
              # Gitea client (core/controllers/pkg/gitea/client.go) appends
              # `/api/v1/<endpoint>` to BaseURL — the env value MUST NOT include
              # `/api/v1` itself or the request URL becomes
              # `<host>/api/v1/api/v1/<endpoint>` and 404s on EnsureOrg /
              # EnsureRepo, blocking application-controller from creating per-Org
              # Gitea repos for any qa-fixtures-seeded Application (Fix #40).
              value: {{ .Values.controllers.organization.giteaURL | default "http://gitea-http.gitea.svc.cluster.local:3000" | quote }}
            - name: CATALYST_GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalyst-gitea-token
                  key: token
                  optional: true
            # PR #3700 §4.3 (deferred half of #3687) — per-Org vCluster Flux
            # loop. The in-cluster Gitea URL the per-Org Flux GitRepository
            # clones from (same Service the application-controller's
            # GiteaInClusterURL uses). Drives per_org_flux.go: on Org
            # creation the controller find-or-creates a Flux GitRepository +
            # Kustomization that reconcile the per-Org `catalyst-tenant`
            # repo's ./vcluster tree onto the host cluster, so the vCluster
            # HelmRelease authored in Gitea actually gets APPLIED (no longer
            # orphaned bytes / phase=Pending). MUST NOT include `/api/v1`
            # (this is the git clone URL, not the Gitea REST base).
            - name: CATALYST_GITEA_INCLUSTER_URL
              value: {{ .Values.controllers.organization.giteaInClusterURL | default "http://gitea-http.gitea.svc.cluster.local:3000" | quote }}
            - name: CATALYST_FLUX_NAMESPACE
              value: {{ .Values.controllers.organization.fluxNamespace | default "flux-system" | quote }}
            - name: CATALYST_FLUX_INTERVAL_SECONDS
              value: {{ .Values.controllers.organization.fluxIntervalSeconds | default 60 | quote }}
            # Flux basic-auth Secret (in CATALYST_FLUX_NAMESPACE) holding the
            # Gitea PAT the per-Org GitRepository uses to clone — bp-gitea
            # REQUIRE_SIGNIN_VIEW=true makes anonymous clone 401. Empty ==
            # anonymous (parity with application-controller FLUX_GITEA_SECRET_REF).
            - name: CATALYST_FLUX_GITEA_SECRET_REF
              value: {{ .Values.controllers.organization.fluxGiteaSecretRef | default "" | quote }}
            # Per-Org UserAccess Claim CRs are namespace-scoped on the
            # live API server (qa-loop iter-8 Fix #42 root cause: the
            # controller previously called Get/Create with an empty
            # namespace and the apiserver rejected with `an empty
            # namespace may not be set when a resource name is
            # provided`). Default `catalyst-system` matches the
            # qa-fixtures convention at
            # products/catalyst/chart/templates/qa-fixtures/useraccess-qa-user1.yaml.
            - name: CATALYST_USERACCESS_NAMESPACE
              value: {{ .Values.controllers.organization.userAccessNamespace | default "catalyst-system" | quote }}
            # Organizations Enter-org support model (issue #3378 DoD 6):
            # gates the per-Org Keycloak realm auto-wiring (reconcilePerOrgRealm,
            # #3101). Defaults FALSE — the realm path is merged-dormant until
            # an operator validates it on a live env and flips
            # perOrgRealmEnabled=true in the per-Sovereign values overlay.
            # cmd/main.go reads CATALYST_PER_ORG_REALM_ENABLED; a sub-org
            # with a realm is the precondition for the Enter-org walk.
            - name: CATALYST_PER_ORG_REALM_ENABLED
              value: {{ .Values.controllers.organization.perOrgRealmEnabled | default false | quote }}
            # #3760 (Refs #3376 #3754) MIRROR-EVERYTHING: the Sovereign-local
            # Harbor host the per-Org vCluster images (the loft-sh/kubernetes
            # k8s-distro initContainer + the loft-sh/vcluster-oss syncer) pull
            # through. The harbor-proxy-pull Kyverno ClusterPolicy (Enforce)
            # DENIES any vcluster image still on ghcr.io, so the per-Org
            # vCluster StatefulSet never installs and the customer's app never
            # runs. gitops.Render re-tags both to `<registry>/proxy-ghcr/
            # loft-sh/...` (matches the */proxy-*/* glob), lockstep with
            # bp-dmz/mgmt/rtz-vcluster. Default harbor.openova.io for bootstrap;
            # cutover Step-04 (ADR-0002) flips a per-Sovereign overlay to
            # harbor.<sovereign-fqdn> post-handover.
            - name: CATALYST_VCLUSTER_IMAGE_REGISTRY
              value: {{ .Values.controllers.organization.vclusterImageRegistry | default "harbor.openova.io" | quote }}
            {{- range $k, $v := .Values.controllers.organization.env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controllers.organization.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      {{- with .Values.controllers.organization.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllers.organization.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllers.organization.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 15
{{- end }}
