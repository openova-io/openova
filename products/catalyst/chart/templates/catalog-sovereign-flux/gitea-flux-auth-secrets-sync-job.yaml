{{- /*
post-install/post-upgrade hook Job that CREATES the Flux basic-auth Secrets
for the local-Gitea GitRepository sources — issue #3668 (catalog-sovereign)
+ the same race that left the org-tenants source's Secret absent.

WHY THIS FILE EXISTS (the `lookup`-on-fresh-install race)
========================================================
Both Flux basic-auth Secrets — `openova-catalog-sovereign-git-auth` (#3668)
and `openova-org-tenants-git-auth` (#3454) — were previously rendered ONLY by
LOOKUP-based templates (catalog-sovereign-gitrepo-auth-secret.yaml /
org-tenants-gitrepo-auth-secret.yaml). Those templates read the PAT via
`lookup "v1" "Secret" <ns> catalyst-gitea-token` at TEMPLATE-RENDER time and
emit nothing while the PAT is empty.

But the PAT is minted by the catalyst-gitea-token mint Job, a `pre-install`
HOOK (catalyst-gitea-token-secret.yaml, weight 10). Helm evaluates ALL
`lookup` calls during the render phase — which runs BEFORE pre-install hooks
execute. So on a fresh install `catalyst-gitea-token.token` is still empty
when the two auth-secret templates render → NEITHER Secret is emitted. The
mint hook then populates the PAT, but the manifest already omitted both
Secrets, and the HelmRelease never re-renders on its own (it sits at revision
v1) → both Flux sources sit "authentication required" / "Source artifact not
found" forever. PROVEN live on hw158 (openova-catalog-sovereign + org-tenants
GitRepositories READY=False; neither *-git-auth Secret present).

FIX
===
A `post-install,post-upgrade` hook Job (this file) that runs AFTER the
pre-install mint hook has populated catalyst-gitea-token. It reads the PAT at
RUNTIME via secretKeyRef (NOT a render-time lookup — no race) and idempotently
`kubectl apply`s BOTH Flux basic-auth Secrets in flux-system in the
`username`+`password` shape source-controller embeds in the clone URL. Because
post-* hooks fire on every install AND every upgrade, a fresh prov gets the
Secrets the first time, and any later chart bump re-asserts them.

This SUPERSEDES the two lookup-based auth-secret templates as the reliable
creator; those templates are left in place as a harmless redundant fallback
(they only ever emit when the lookup happens to succeed, which never occurs at
fresh-install render time, so they do not fight this Job — both paths write
byte-identical `username`+`password` content).

Per docs/PRINCIPLES.md #3 (no kubectl apply of WORKLOADS) this Job only
applies a leaf Secret, exactly as the mint Job patches a Secret — credential
bootstrap that requires the runtime-minted PAT, not a pure-template value.
Per #10 (no plaintext creds): the PAT is read from catalyst-gitea-token via
secretKeyRef and never echoed; the bytes never appear in chart source.
Per #4: the Secret names + username + the PAT source flow through .Values.

GATING
======
Rendered ONLY when BOTH .Values.global.sovereignFQDN non-empty (a Sovereign;
the Catalyst-Zero mothership has no local-Gitea Flux sources) AND
.Values.ingress.marketplace.enabled — the same discriminator the catalog-
sovereign + org-tenants GitRepositories use.

References:
  - Issue #3668 (catalog-sovereign source), #3454 (org-tenants source)
  - catalyst-gitea-token-secret.yaml (the pre-install PAT mint, weight 10)
  - catalog-sovereign-gitrepository.yaml / org-tenants-gitrepository.yaml
    (the secretRef consumers)
*/}}
{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
{{- if .Values.global.sovereignFQDN -}}
{{- $namespace := .Release.Namespace -}}
{{- $catGR := (.Values.catalogSovereign).gitRepository | default dict -}}
{{- $catSR := $catGR.secretRef | default dict -}}
{{- $catSecretName := $catSR.name | default "openova-catalog-sovereign-git-auth" -}}
{{- $catSecretNS := $catGR.namespace | default "flux-system" -}}
{{- $catUser := $catSR.username | default "gitea_admin" -}}
{{- $smeGR := (.Values.orgTenants).gitRepository | default dict -}}
{{- $smeSR := $smeGR.secretRef | default dict -}}
{{- $orgSecretName := $smeSR.name | default "openova-org-tenants-git-auth" -}}
{{- $orgSecretNS := $smeGR.namespace | default "flux-system" -}}
{{- $orgUser := $smeSR.username | default "gitea_admin" -}}
{{- $patSecret := $catSR.patSourceSecretName | default "catalyst-gitea-token" -}}
{{- $patKey := $catSR.patSourceKey | default "token" -}}
{{- $patNS := $catSR.patSourceNamespace | default $namespace -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalyst-gitea-flux-auth-sync
  namespace: {{ $namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
    catalyst.openova.io/component: gitea-flux-auth-sync
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 15 < the Job's weight 20 (#4447). The SA + both RBAC pairs MUST
    # be created (and authorizer-effective) BEFORE the Job pod starts polling.
    # Helm applies a lower-weight hook batch fully and waits for it Ready
    # before the next-higher batch, so a strictly-lower weight guarantees the
    # RoleBinding exists when the Job's `kubectl get secret` first fires —
    # otherwise the read is a silent 403 for the whole poll budget and the
    # Job exit-0's having created nothing (the #4447 fresh-prov failure).
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
{{- /* Read the PAT from catalyst-gitea-token in the release namespace. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalyst-gitea-flux-auth-sync-pat-reader
  namespace: {{ $patNS }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 15 < Job weight 20 (#4447) — bind the PAT-read grant BEFORE the
    # Job polls, else the read 403s silently for the whole budget.
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $patSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalyst-gitea-flux-auth-sync-pat-reader
  namespace: {{ $patNS }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 15 < Job weight 20 (#4447).
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: catalyst-gitea-flux-auth-sync
    namespace: {{ $namespace }}
roleRef:
  kind: Role
  name: catalyst-gitea-flux-auth-sync-pat-reader
  apiGroup: rbac.authorization.k8s.io
---
{{- /* Create/patch the two Flux basic-auth Secrets in flux-system. The Role
       is namespaced to flux-system and scoped to the two Secret names. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalyst-gitea-flux-auth-sync-writer
  namespace: flux-system
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 15 < Job weight 20 (#4447) — bind the secret-write grant BEFORE
    # the Job applies the two flux-system auth Secrets.
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalyst-gitea-flux-auth-sync-writer
  namespace: flux-system
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 15 < Job weight 20 (#4447).
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: catalyst-gitea-flux-auth-sync
    namespace: {{ $namespace }}
roleRef:
  kind: Role
  name: catalyst-gitea-flux-auth-sync-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: catalyst-gitea-flux-auth-sync
  namespace: {{ $namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
    catalyst.openova.io/component: gitea-flux-auth-sync
    # Required by the kyverno `flux-managed` Enforce policy on converged
    # Sovereigns (the release ns is NOT namespace-excluded).
    app.kubernetes.io/managed-by: flux
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 20 — STRICTLY GREATER than this Job's own SA + RBAC (weight 15,
    # #4447). Helm installs hooks in ascending weight batches and waits for
    # each batch Ready before the next, so weight-15 RBAC is created AND
    # authorizer-effective before this Job's pod issues its first
    # `kubectl get secret`. Pre-#4447 the RBAC was ALSO weight 20 (same batch,
    # applied together, no ordering guarantee) → the Job frequently started
    # polling before its RoleBinding bound → every read was a silent 403 for
    # the full poll budget → the FATAL branch exit-0'd having created neither
    # *-git-auth Secret (the fresh-prov b9f9590b558262b6 failure).
    #
    # Cross-phase ordering vs the pre-* mint (catalyst-gitea-token-secret.yaml)
    # is NOT a weight concern — pre-/post-* are independent phases, so no
    # weight can sequence this after the mint. The guard against the mint
    # landing a beat late is the bounded poll loop in the container args
    # (#3763): the Job WAITS for a non-empty token rather than FATAL-on-empty.
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 8
  template:
    metadata:
      labels:
        catalyst.openova.io/blueprint: bp-catalyst-platform
        catalyst.openova.io/component: gitea-flux-auth-sync
    spec:
      serviceAccountName: catalyst-gitea-flux-auth-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          # Explicit harbor.openova.io/proxy-dockerhub prefix per CLAUDE.md
          # MIRROR-EVERYTHING rule (matches the mint + repo-bootstrap Jobs).
          image: harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4
          env:
            # Bounded poll budget for the runtime-minted PAT to appear (the
            # mint hook may land a beat after this post-* hook starts; #3763).
            # Default 60 × 5s = 300s, inside the HR's 30m upgrade timeout.
            - name: POLL_ATTEMPTS
              value: {{ ($catSR.patPollAttempts | default 60) | quote }}
            - name: POLL_INTERVAL
              value: {{ ($catSR.patPollIntervalSeconds | default 5) | quote }}
            - name: PAT_NAMESPACE
              value: {{ $patNS | quote }}
            - name: PAT_SECRET
              value: {{ $patSecret | quote }}
            - name: PAT_KEY
              value: {{ $patKey | quote }}
            - name: CAT_SECRET_NAME
              value: {{ $catSecretName | quote }}
            - name: CAT_SECRET_NS
              value: {{ $catSecretNS | quote }}
            - name: CAT_USER
              value: {{ $catUser | quote }}
            - name: ORG_SECRET_NAME
              value: {{ $orgSecretName | quote }}
            - name: ORG_SECRET_NS
              value: {{ $orgSecretNS | quote }}
            - name: ORG_USER
              value: {{ $orgUser | quote }}
            # #4286 mechanism D — the reflector allow-list applied to the ORG
            # secret (the one env-controller GitRepository.spec.secretRef points
            # at). emberstack/reflector then mirrors openova-org-tenants-git-auth
            # into every env-controller source-bearing namespace so the secretRef
            # always RESOLVES (else 401 "secret not found"). Empty disables it
            # (the flux-system mint still happens). The CATALOG secret is
            # consumed only by the flux-system catalog source, so it is NOT
            # reflected. Operator-overridable (Inviolable Principle #4) via
            # orgTenants.gitRepository.secretRef.reflectNamespaces.
            - name: ORG_REFLECT_NAMESPACES
              value: {{ ($smeSR.reflectNamespaces | default "") | quote }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # Read the runtime-minted PAT (NOT a render-time lookup — this is
              # the whole point: the mint hook has already populated it). Write
              # the username + PAT to files under /tmp (the emptyDir, writable
              # with readOnlyRootFilesystem) so neither value ever lands in
              # this Job's argv — `--from-file` keys the Secret on the filename
              # and reads the value from the file content. NEVER echo the PAT.
              #
              # POLL, don't FATAL-on-first-empty (#3763 — proven on hw158).
              # ===========================================================
              # The PAT lives in the pre-install/pre-upgrade-minted Secret
              # catalyst-gitea-token. `pre-*` and `post-*` hook weights are
              # INDEPENDENT phases, so a hook-weight cannot order this job
              # after the mint; and the mint Secret carries
              # `helm.sh/hook-delete-policy: before-hook-creation` (no
              # hook-succeeded) so on every upgrade it is deleted-then-
              # recreated → there is a transient window where `.data.token`
              # reads empty even though the PAT is established. On a fresh
              # install the mint Job patches the token a beat after the Secret
              # is created, so the same window exists. The original code did a
              # SINGLE read and `exit 1` FATAL on empty → the pod crashlooped
              # (restartPolicy: OnFailure burns backoffLimit) and every retry
              # could land inside the bad window → BackoffLimitExceeded → the
              # whole bp-catalyst-platform upgrade failed + rolled back +
              # oscillated, holding bp-continuum/bp-sandbox/sovereign-tls
              # non-Ready (the live hw158 spine degradation). FIX: poll the
              # Secret for a non-empty `.token` up to a bounded budget
              # (POLL_ATTEMPTS × POLL_INTERVAL, default 60 × 5s = 300s, well
              # inside the HR's 30m upgrade timeout) before failing. Survives
              # ANY mint-vs-sync ordering, fresh-install OR upgrade.
              POLL_ATTEMPTS="${POLL_ATTEMPTS:-240}"
              POLL_INTERVAL="${POLL_INTERVAL:-5}"
              # #4447 — DISTINGUISH "RBAC/API read FAILING" from "token genuinely
              # empty". Pre-fix the read swallowed every error with
              # `2>/dev/null … || true`, so a 403 (RBAC not bound yet) was
              # indistinguishable from an empty `.data.token`. The budget then
              # exhausted on a SILENT 403 and the FATAL branch exit-0'd having
              # created NOTHING — the fresh-prov failure. We now:
              #   (a) preflight `kubectl auth can-i get secret/<PAT>` — fail
              #       LOUD (exit 1, retry) if RBAC is genuinely missing, so the
              #       hook never "succeeds" without ever being able to read;
              #   (b) on each poll, capture the read's stderr + exit code so a
              #       transient API/authorizer-propagation error is logged and
              #       retried, NOT misread as "token empty";
              #   (c) only treat a CLEAN read of empty `.data.token` as the
              #       benign mint-race (self-heals next reconcile, exit 0);
              #       any other terminal state is exit 1 (fail-loud).
              #
              # (a) Preflight: with the weight-15 RBAC (< this Job's 20) the
              # RoleBinding is created before this pod starts, but authorizer
              # cache propagation can lag a beat — so we POLL can-i briefly
              # rather than asserting once. If it never resolves, the grant is
              # genuinely absent (a chart/RBAC bug) → fail loud.
              rbac_ok=""
              j=1
              while [ "$j" -le 12 ]; do
                if kubectl -n "$PAT_NAMESPACE" auth can-i get \
                     "secret/${PAT_SECRET}" >/dev/null 2>/tmp/canierr; then
                  rbac_ok=1
                  break
                fi
                echo "[gitea-flux-auth-sync] waiting for PAT-read RBAC to bind on ${PAT_NAMESPACE}/${PAT_SECRET} ($j/12): $(cat /tmp/canierr 2>/dev/null)"
                j=$((j + 1))
                sleep 5
              done
              if [ -z "$rbac_ok" ]; then
                echo "[gitea-flux-auth-sync] FATAL(#4447): cannot 'get secret/${PAT_SECRET}' in ${PAT_NAMESPACE} after RBAC wait — the pat-reader Role/RoleBinding (hook-weight 15) did not bind. This is an RBAC bug, NOT a benign mint-race; failing LOUD so the Job retries and the umbrella install surfaces it rather than silently creating zero auth Secrets." >&2
                exit 1
              fi
              # (b)+(c) Poll the token. A non-zero kubectl exit = a READ ERROR
              # (API/authorizer/connection) → retry, never confuse with empty.
              read_errors=0
              i=1
              while [ "$i" -le "$POLL_ATTEMPTS" ]; do
                # errexit-safe: a non-zero kubectl exit in a `var=$(...)`
                # assignment would trip `set -e` BEFORE we can inspect rc, so
                # capture rc with `|| rc=$?` and default rc=0 on success.
                rc=0
                rawb64="$(kubectl -n "$PAT_NAMESPACE" get secret "$PAT_SECRET" \
                  -o jsonpath="{.data.${PAT_KEY}}" 2>/tmp/readerr)" || rc=$?
                if [ "$rc" -ne 0 ]; then
                  read_errors=$((read_errors + 1))
                  echo "[gitea-flux-auth-sync] read error on ${PAT_NAMESPACE}/${PAT_SECRET} (attempt $i/${POLL_ATTEMPTS}, rc=$rc): $(cat /tmp/readerr 2>/dev/null) — retrying"
                else
                  printf '%s' "$rawb64" | base64 -d > /tmp/password 2>/dev/null || true
                  if [ -s /tmp/password ]; then
                    echo "[gitea-flux-auth-sync] ${PAT_NAMESPACE}/${PAT_SECRET}.${PAT_KEY} populated (attempt $i/${POLL_ATTEMPTS})"
                    break
                  fi
                  echo "[gitea-flux-auth-sync] ${PAT_NAMESPACE}/${PAT_SECRET}.${PAT_KEY} present but empty ($i/${POLL_ATTEMPTS}) — mint hook not landed yet"
                fi
                i=$((i + 1))
                sleep "$POLL_INTERVAL"
              done
              if [ ! -s /tmp/password ]; then
                # Budget exhausted with no usable PAT. Two terminal cases:
                #   - reads were ERRORING (API/RBAC/connection) → fail LOUD
                #     (exit 1) so backoffLimit retries + the install surfaces
                #     the real fault; NEVER mask a read failure as success.
                #   - reads were CLEAN but `.data.token` stayed empty → the
                #     benign mint-race (#3781): the mint genuinely hasn't
                #     populated the token; the 2 auth Secrets self-heal on the
                #     next reconcile once it does → exit 0.
                if [ "$read_errors" -gt 0 ]; then
                  echo "[gitea-flux-auth-sync] FATAL(#4447): ${read_errors} read error(s) on ${PAT_NAMESPACE}/${PAT_SECRET} across ${POLL_ATTEMPTS} attempts — the PAT was never readable (API/RBAC fault), so ZERO auth Secrets were created. Failing LOUD (exit 1) so the Job retries; last error: $(cat /tmp/readerr 2>/dev/null)" >&2
                  exit 1
                fi
                echo "[gitea-flux-auth-sync] ${PAT_NAMESPACE}/${PAT_SECRET}.${PAT_KEY} still empty after ${POLL_ATTEMPTS} attempts (~$((POLL_ATTEMPTS * POLL_INTERVAL))s) but READABLE — benign mint-race; the 2 Flux auth Secrets self-heal next reconcile once the mint lands (#3781). exit 0." >&2
                exit 0
              fi
              # Idempotent create-or-update of one Flux basic-auth Secret.
              # source-controller reads `username` + `password` and embeds them
              # in the HTTP(S) clone URL; a Gitea PAT is a valid HTTP password
              # for git operations (REQUIRE_SIGNIN_VIEW makes anonymous clone
              # 401, this makes it 200). `create --dry-run | apply` is the
              # canonical idempotent-apply idiom and keeps the bytes off argv.
              # apply_secret NS NAME USER [REFLECT_NS]
              # When REFLECT_NS (a comma-separated emberstack-reflector
              # allow-list) is non-empty, the Secret is also annotated with the
              # 4 reflector keys so the reflector mirrors it into every matching
              # namespace (#4286 mechanism D — the env-controller leg). When
              # empty (the catalog secret, or operator-disabled), the secret is
              # written flux-system-local only, exactly as before.
              apply_secret() {
                NS="$1"; NAME="$2"; USER="$3"; REFLECT_NS="${4:-}"
                printf '%s' "$USER" > /tmp/username
                kubectl create secret generic "$NAME" -n "$NS" \
                  --from-file=username=/tmp/username \
                  --from-file=password=/tmp/password \
                  --dry-run=client -o yaml \
                  | kubectl label --local -f - -o yaml \
                      catalyst.openova.io/blueprint=bp-catalyst-platform \
                      catalyst.openova.io/component=gitea-flux-auth \
                      app.kubernetes.io/managed-by=flux \
                  > /tmp/secret.yaml
                if [ -n "$REFLECT_NS" ]; then
                  # `kubectl annotate --local` keys must be quoted for the dots;
                  # annotate the rendered manifest in place before apply so the
                  # reflector (emberstack) picks the secret up as mirror-eligible
                  # and auto-creates+syncs it into every REFLECT_NS namespace.
                  kubectl annotate --local -f /tmp/secret.yaml -o yaml \
                      "reflector.v1.k8s.emberstack.com/reflection-allowed=true" \
                      "reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces=${REFLECT_NS}" \
                      "reflector.v1.k8s.emberstack.com/reflection-auto-enabled=true" \
                      "reflector.v1.k8s.emberstack.com/reflection-auto-namespaces=${REFLECT_NS}" \
                    > /tmp/secret.annotated.yaml
                  mv /tmp/secret.annotated.yaml /tmp/secret.yaml
                  echo "[gitea-flux-auth-sync] ${NS}/${NAME} marked reflect → ${REFLECT_NS}"
                fi
                kubectl apply -f /tmp/secret.yaml
                rm -f /tmp/secret.yaml
                echo "[gitea-flux-auth-sync] applied ${NS}/${NAME} (user=${USER})"
              }
              apply_secret "$CAT_SECRET_NS" "$CAT_SECRET_NAME" "$CAT_USER"
              apply_secret "$ORG_SECRET_NS" "$ORG_SECRET_NAME" "$ORG_USER" "${ORG_REFLECT_NAMESPACES:-}"
              rm -f /tmp/password /tmp/username
              # #4447 (task 4 — defense in depth): READ BACK both Secrets with a
              # non-empty `password` key. The Kyverno floor (#4286
              # inject-gitea-source-secretref) guarantees the GitRepository's
              # secretRef.name is non-empty, but name-set != secret-EXISTS — the
              # exact gap that left both sources stuck "Source artifact not
              # found". This Job is the sole creator, so it MUST confirm its own
              # output landed; fail LOUD (exit 1, retry) if either is absent or
              # empty rather than reporting Succeeded on a phantom secret.
              verify_secret() {
                VNS="$1"; VNAME="$2"
                # Read the base64 `password` value into a var FIRST (errexit-safe
                # via `|| vrc=$?`) so a kubectl failure is captured directly,
                # NOT masked by a trailing `| wc -c` whose exit hides kubectl's.
                vrc=0
                vpw="$(kubectl -n "$VNS" get secret "$VNAME" \
                  -o jsonpath='{.data.password}' 2>/tmp/verifyerr)" || vrc=$?
                if [ "$vrc" -ne 0 ] || [ -z "$vpw" ]; then
                  echo "[gitea-flux-auth-sync] FATAL(#4447): post-apply verify FAILED for ${VNS}/${VNAME} (rc=$vrc, password-empty=$([ -z "$vpw" ] && echo yes || echo no)) — the GitRepository secretRef would point at a missing/empty Secret. Failing LOUD so the Job retries; err: $(cat /tmp/verifyerr 2>/dev/null)" >&2
                  return 1
                fi
                echo "[gitea-flux-auth-sync] verified ${VNS}/${VNAME} present with non-empty password"
                return 0
              }
              verify_secret "$CAT_SECRET_NS" "$CAT_SECRET_NAME" || exit 1
              verify_secret "$ORG_SECRET_NS" "$ORG_SECRET_NAME" || exit 1
              echo "[gitea-flux-auth-sync] done — both Flux basic-auth Secrets present + verified"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
