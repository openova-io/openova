{{- /*
post-install/post-upgrade hook Job that CREATES the Flux basic-auth Secrets
for the local-Gitea GitRepository sources — issue #3668 (catalog-sovereign)
+ the same race that left the sme-tenants source's Secret absent.

WHY THIS FILE EXISTS (the `lookup`-on-fresh-install race)
========================================================
Both Flux basic-auth Secrets — `openova-catalog-sovereign-git-auth` (#3668)
and `openova-sme-tenants-git-auth` (#3454) — were previously rendered ONLY by
LOOKUP-based templates (catalog-sovereign-gitrepo-auth-secret.yaml /
sme-tenants-gitrepo-auth-secret.yaml). Those templates read the PAT via
`lookup "v1" "Secret" <ns> catalyst-gitea-token` at TEMPLATE-RENDER time and
emit nothing while the PAT is empty.

But the PAT is minted by the catalyst-gitea-token mint Job, a `pre-install`
HOOK (catalyst-gitea-token-secret.yaml, weight 10). Helm evaluates ALL
`lookup` calls during the render phase — which runs BEFORE pre-install hooks
execute. So on a fresh install `catalyst-gitea-token.token` is still empty
when the two auth-secret templates render → NEITHER Secret is emitted. The
mint hook then populates the PAT, but the manifest already omitted both
Secrets, and the HelmRelease never re-renders on its own (it sits at revision
v1) → both Flux sources sit "authentication required" / "Source artifact not
found" forever. PROVEN live on hw158 (openova-catalog-sovereign + sme-tenants
GitRepositories READY=False; neither *-git-auth Secret present).

FIX
===
A `post-install,post-upgrade` hook Job (this file) that runs AFTER the
pre-install mint hook has populated catalyst-gitea-token. It reads the PAT at
RUNTIME via secretKeyRef (NOT a render-time lookup — no race) and idempotently
`kubectl apply`s BOTH Flux basic-auth Secrets in flux-system in the
`username`+`password` shape source-controller embeds in the clone URL. Because
post-* hooks fire on every install AND every upgrade, a fresh prov gets the
Secrets the first time, and any later chart bump re-asserts them.

This SUPERSEDES the two lookup-based auth-secret templates as the reliable
creator; those templates are left in place as a harmless redundant fallback
(they only ever emit when the lookup happens to succeed, which never occurs at
fresh-install render time, so they do not fight this Job — both paths write
byte-identical `username`+`password` content).

Per docs/PRINCIPLES.md #3 (no kubectl apply of WORKLOADS) this Job only
applies a leaf Secret, exactly as the mint Job patches a Secret — credential
bootstrap that requires the runtime-minted PAT, not a pure-template value.
Per #10 (no plaintext creds): the PAT is read from catalyst-gitea-token via
secretKeyRef and never echoed; the bytes never appear in chart source.
Per #4: the Secret names + username + the PAT source flow through .Values.

GATING
======
Rendered ONLY when BOTH .Values.global.sovereignFQDN non-empty (a Sovereign;
the Catalyst-Zero mothership has no local-Gitea Flux sources) AND
.Values.ingress.marketplace.enabled — the same discriminator the catalog-
sovereign + sme-tenants GitRepositories use.

References:
  - Issue #3668 (catalog-sovereign source), #3454 (sme-tenants source)
  - catalyst-gitea-token-secret.yaml (the pre-install PAT mint, weight 10)
  - catalog-sovereign-gitrepository.yaml / sme-tenants-gitrepository.yaml
    (the secretRef consumers)
*/}}
{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
{{- if .Values.global.sovereignFQDN -}}
{{- $namespace := .Release.Namespace -}}
{{- $catGR := (.Values.catalogSovereign).gitRepository | default dict -}}
{{- $catSR := $catGR.secretRef | default dict -}}
{{- $catSecretName := $catSR.name | default "openova-catalog-sovereign-git-auth" -}}
{{- $catSecretNS := $catGR.namespace | default "flux-system" -}}
{{- $catUser := $catSR.username | default "gitea_admin" -}}
{{- $smeGR := (.Values.smeTenants).gitRepository | default dict -}}
{{- $smeSR := $smeGR.secretRef | default dict -}}
{{- $smeSecretName := $smeSR.name | default "openova-sme-tenants-git-auth" -}}
{{- $smeSecretNS := $smeGR.namespace | default "flux-system" -}}
{{- $smeUser := $smeSR.username | default "gitea_admin" -}}
{{- $patSecret := $catSR.patSourceSecretName | default "catalyst-gitea-token" -}}
{{- $patKey := $catSR.patSourceKey | default "token" -}}
{{- $patNS := $catSR.patSourceNamespace | default $namespace -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalyst-gitea-flux-auth-sync
  namespace: {{ $namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
    catalyst.openova.io/component: gitea-flux-auth-sync
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
{{- /* Read the PAT from catalyst-gitea-token in the release namespace. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalyst-gitea-flux-auth-sync-pat-reader
  namespace: {{ $patNS }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $patSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalyst-gitea-flux-auth-sync-pat-reader
  namespace: {{ $patNS }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: catalyst-gitea-flux-auth-sync
    namespace: {{ $namespace }}
roleRef:
  kind: Role
  name: catalyst-gitea-flux-auth-sync-pat-reader
  apiGroup: rbac.authorization.k8s.io
---
{{- /* Create/patch the two Flux basic-auth Secrets in flux-system. The Role
       is namespaced to flux-system and scoped to the two Secret names. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalyst-gitea-flux-auth-sync-writer
  namespace: flux-system
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalyst-gitea-flux-auth-sync-writer
  namespace: flux-system
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: catalyst-gitea-flux-auth-sync
    namespace: {{ $namespace }}
roleRef:
  kind: Role
  name: catalyst-gitea-flux-auth-sync-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: catalyst-gitea-flux-auth-sync
  namespace: {{ $namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
    catalyst.openova.io/component: gitea-flux-auth-sync
    # Required by the kyverno `flux-managed` Enforce policy on converged
    # Sovereigns (the release ns is NOT namespace-excluded).
    app.kubernetes.io/managed-by: flux
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 5 — the only ordering constraint is "after the pre-install mint
    # hook", which is automatic (post-* hooks run after the install action
    # that includes the pre-install mint). Weight orders this Job's own
    # RBAC (also weight 5) deterministically before the Job pod starts.
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 8
  template:
    metadata:
      labels:
        catalyst.openova.io/blueprint: bp-catalyst-platform
        catalyst.openova.io/component: gitea-flux-auth-sync
    spec:
      serviceAccountName: catalyst-gitea-flux-auth-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          # Explicit harbor.openova.io/proxy-dockerhub prefix per CLAUDE.md
          # MIRROR-EVERYTHING rule (matches the mint + repo-bootstrap Jobs).
          image: harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4
          env:
            - name: PAT_NAMESPACE
              value: {{ $patNS | quote }}
            - name: PAT_SECRET
              value: {{ $patSecret | quote }}
            - name: PAT_KEY
              value: {{ $patKey | quote }}
            - name: CAT_SECRET_NAME
              value: {{ $catSecretName | quote }}
            - name: CAT_SECRET_NS
              value: {{ $catSecretNS | quote }}
            - name: CAT_USER
              value: {{ $catUser | quote }}
            - name: SME_SECRET_NAME
              value: {{ $smeSecretName | quote }}
            - name: SME_SECRET_NS
              value: {{ $smeSecretNS | quote }}
            - name: SME_USER
              value: {{ $smeUser | quote }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # Read the runtime-minted PAT (NOT a render-time lookup — this is
              # the whole point: the mint hook has already populated it). Write
              # the username + PAT to files under /tmp (the emptyDir, writable
              # with readOnlyRootFilesystem) so neither value ever lands in
              # this Job's argv — `--from-file` keys the Secret on the filename
              # and reads the value from the file content. NEVER echo the PAT.
              kubectl -n "$PAT_NAMESPACE" get secret "$PAT_SECRET" \
                -o jsonpath="{.data.${PAT_KEY}}" 2>/dev/null | base64 -d > /tmp/password 2>/dev/null || true
              if [ ! -s /tmp/password ]; then
                echo "[gitea-flux-auth-sync] FATAL: ${PAT_NAMESPACE}/${PAT_SECRET}.${PAT_KEY} empty (mint hook did not populate the PAT)" >&2
                exit 1
              fi
              # Idempotent create-or-update of one Flux basic-auth Secret.
              # source-controller reads `username` + `password` and embeds them
              # in the HTTP(S) clone URL; a Gitea PAT is a valid HTTP password
              # for git operations (REQUIRE_SIGNIN_VIEW makes anonymous clone
              # 401, this makes it 200). `create --dry-run | apply` is the
              # canonical idempotent-apply idiom and keeps the bytes off argv.
              apply_secret() {
                NS="$1"; NAME="$2"; USER="$3"
                printf '%s' "$USER" > /tmp/username
                kubectl create secret generic "$NAME" -n "$NS" \
                  --from-file=username=/tmp/username \
                  --from-file=password=/tmp/password \
                  --dry-run=client -o yaml \
                  | kubectl label --local -f - -o yaml \
                      catalyst.openova.io/blueprint=bp-catalyst-platform \
                      catalyst.openova.io/component=gitea-flux-auth \
                      app.kubernetes.io/managed-by=flux \
                  | kubectl apply -f -
                echo "[gitea-flux-auth-sync] applied ${NS}/${NAME} (user=${USER})"
              }
              apply_secret "$CAT_SECRET_NS" "$CAT_SECRET_NAME" "$CAT_USER"
              apply_secret "$SME_SECRET_NS" "$SME_SECRET_NAME" "$SME_USER"
              rm -f /tmp/password /tmp/username
              echo "[gitea-flux-auth-sync] done — both Flux basic-auth Secrets present"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
