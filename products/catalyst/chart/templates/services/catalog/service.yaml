{{- if .Values.services.catalog.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "catalog.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "catalog.labels" (dict "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "catalog.selectorLabels" . | nindent 4 }}
{{- end }}
