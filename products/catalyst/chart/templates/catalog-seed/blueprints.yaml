apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-postgres
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/companion: bp-cnpg
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: 0.2.37
  card:
    title: PostgreSQL
    summary: A reusable, shareable PostgreSQL data-instance. Each install is ONE CNPG Cluster — the engine — and a first-class App card. Consumers SHARE it via isolated databases + per-consumer roles (ADR-0010).
    description: "The binding is pure declarative YAML (a CNPG Database CR + a managed.roles entry + a reflected connection Secret + a Flux dependsOn edge) reconciled by Flux + the CNPG operator. NO custom controller and NO Crossplane. topology: active-hot-standby renders the Pillar-3 synchronous-replication shape (ADR-0004)."
    icon: postgres.svg
    license: Apache-2.0
    tags: [database, postgres, sql, data, shareable, cnpg, adr-0010]
    docs: https://cloudnative-pg.io/documentation/
  visibility: listed
  class: data-service
  lifecycle: experimental
  shareable: true
  contextSchema:
    kind: db
    valuesKey: databases
    needs: [name, owner]
    produces: [credentialSecret]
  configSchema:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
        description: "Master gate. false → the install renders ZERO resources (an\nempty Ready release). The bootstrap-kit slot 16a wires this to\n${SOVEREIGN_ENABLE_SHARED_PG:=false} so a non-sharing Sovereign\ngets a Ready bp-postgres-shared HR without deploying an unused\nshared-pg Cluster.\n"
      instance:
        type: object
        description: "The data instance (one CNPG Cluster). name surfaces as the\nApp-card title and the dependsOn target consumers reference.\n"
        properties:
          name:
            type: string
            default: postgres
            description: Cluster name = the data-instance identity.
          storageSize:
            type: string
            default: 5Gi
            description: Per-instance PVC size (k8s resource quantity).
          pgVersion:
            type: string
            default: "16"
            description: PostgreSQL major version (CNPG image tag).
      topology:
        type: object
        properties:
          mode:
            type: string
            enum: [singleton, active-hot-standby]
            default: singleton
            description: "singleton = single-instance Cluster (no cross-region HA).\nactive-hot-standby = multi-instance Cluster with synchronous\nreplication across regions (ADR-0004 Pillar-3 zero-tx-loss).\n"
          instances:
            type: integer
            minimum: 1
            maximum: 5
            default: 1
          primary:
            type: object
            description: "#5639 — the OTHER HALF of `mode: active-hot-standby`. Declared\nhere because the per-Org install door now emits it alongside the\nmode; a mode without a region renders an unsatisfiable\nnodeAffinity and the primary never schedules.\n"
            properties:
              region:
                type: string
                default: ""
                description: "The canonical `openova.io/region` NODE LABEL the primary\nCluster pins its required nodeAffinity on (e.g.\nhz-fsn-rtz-prod). NOT the cloud region and NOT\nApplication.spec.regions[0], which carry different spellings\n(#5482). Stamped from the Sovereign's SOVEREIGN_PRIMARY_REGION\n— by the bootstrap-kit slot substitutes for the host shared\ninstances, and by catalyst-api for a per-Org install. REQUIRED\nin active-hot-standby: chart 0.2.17+ refuses to render without\nit rather than emitting `openova.io/region In [\"\"]`.\n"
  placementSchema:
    modes: [singleton, active-active, active-hot-standby, active-passive]
    default: singleton
  manifests:
    chart: bp-postgres
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-postgres
    version: 0.2.37
  topology:
    supported: [singleton, active-hot-standby]
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: rtz
          clusters: [rtz-A]
          roles:
            rtz-A: singleton
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 10
          rpoSeconds: 0
        placement:
          tier: rtz
          clusters: [rtz-A, rtz-B]
          roles:
            rtz-A: active
            rtz-B: passive
  multiInstance:
    enabled: true
    maxPerOrg: 0
    namingTemplate: "{{ "{{" }}.AppName{{ "}}" }}-{{ "{{" }}.InstanceID{{ "}}" }}"
    isolationLevel: namespace
  endpoints: []
