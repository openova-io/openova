    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: platform
    catalyst.openova.io/section: pts-1-control-plane
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: "1.2.48"
  visibility: unlisted
  card:
    title: "Gitea"
    category: platform
    summary: "Gitea — per-Sovereign Git server. Hosts catalog (public Blueprint mirror), catalog-sovereign (curated private Blueprints), one Gitea Org per Catalyst Organization, and system scope."
    icon: gitea.svg
  # placementSchema aligned with spec.topology below (#4212 Seam 3) — the
  # catalog-seed copy the application-controller resolves by name. modes[]
  # must admit active-hot-standby AND defaultOnMultiRegion must name it so
  # the spine producer's explicit multi-region placement is accepted and the
  # Continuum CR is minted. Mirrors platform/<chart>/blueprint.yaml.
  placementSchema:
    modes: [singleton, active-hot-standby]
    default: singleton
    defaultOnMultiRegion: active-hot-standby
  manifests:
    chart: bp-gitea
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-gitea
    version: "1.2.48"
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          # #4402 (#4325 de-vcluster fallout): spine lands host-native (own host
          # ns); the #4334 producer drives this via the app-controller fan-out
          # which resolved tier:mgmt → absent host ns mgmt → no Continuum. Empty
          # tier = host placement; keep mgmt-A/-B region designators. (#4375/#4379)
          tier: ''
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ''
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  endpoints:
    - name: ui
      hostnameTemplate: "gitea.{{ "{{" }}.SovereignFQDN{{ "}}" }}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
      # #3150 (2026-06-10) — gitea's OAuth-initiate route. The launch-url
      # must land here, not the gitea ROOT: root renders the login page
      # with a manual "Sign in with OpenOva SSO" button (operator UAT
      # 2026-06-09 FAIL — no auto-redirect), whereas this provider-login
      # path (auth source name "openova-sso") makes gitea 307 to KC's
      # authorize endpoint, which the sovereign-realm IDR
      # (defaultProvider=catalyst-pin) silently delegates → operator lands
      # inside Gitea authenticated, no login form. Mirrors harbor
      # /c/oidc/login and openbao /ui/vault/auth?with=oidc.
      ssoInitPath: "/user/oauth2/openova-sso"
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
      gitea-admins: admin
    silentLogin: true
