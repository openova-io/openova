{{- /*
templates/catalog-seed/blueprints.yaml — baseline Blueprint CRs always
rendered on every Sovereign so /api/v1/catalog returns a non-empty
items[] from handover onward. See _README.txt for full rationale.

WBS row: TBD-E8 (C4-015) — "Apps grid published=true returns items".
Pre-fix: empty catalog (`items: []`) on every fresh Sovereign because
Gitea has no `catalog` / `catalog-sovereign` Orgs and qa-fixtures is
default-OFF on production Sovereigns (cf.
platform/self-sovereign-cutover/chart/templates/01-gitea-mirror-job.yaml
only mirrors `openova-io/openova`).

Post-fix: chained catalog client
(products/catalyst/bootstrap/api/internal/handler/catalog_client_cluster_fallback.go)
picks these in-cluster CRs up via the v1 GVR LIST fallback.

Per docs/INVIOLABLE-PRINCIPLES.md #1 every entry below references a
REAL OCI chart published by .github/workflows/blueprint-release.yaml
(no placeholders, no fake versions). Per #4 the entire block is gated
on `.Values.catalogSeed.enabled` (default true). Per #5 every CR
carries `catalyst.openova.io/managed-by: catalog-seed` so the operator
can distinguish chart-seeded entries from curated entries.
*/ -}}
{{- if .Values.catalogSeed.enabled }}
{{- /*
Common label set + chart-ref helper. The chart-ref URL mirrors what
catalog_client.go's catalogBlueprintChartRef constant builds at runtime
(`ghcr.io/openova-io/bp-<name>:<version>`).
*/ -}}
{{- $managedBy := .Release.Service -}}
{{- $instance := .Release.Name -}}
---
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-wordpress-tenant
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: organization-app
    catalyst.openova.io/section: pts-7-org-tenant
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  # 2026-06-23: lockstep with platform/wordpress-tenant/blueprint.yaml spec.version
  # 0.4.12 + the published chart ghcr.io/openova-io/bp-wordpress-tenant:0.4.12. The
  # seed pin lagged at 0.4.4 while the chart shipped the per-Org WordPress
  # convergence chain — 0.4.10 (init perms/PHP/URLs #4151, pg-driver image #4153),
  # 0.4.11 (imagePullSecrets #4154), 0.4.12 (DROP the empty WORDPRESS_DB_PASSWORD
  # seed so bp-reflector populates it from the CNPG <cluster>-app source #4155). A
  # fresh prov on the stale 0.4.4 pin re-hits the empty-password 500. Earlier
  # lineage: 0.4.1 defaulted wpContent.storageClass: local-path (DENIED by the
  # #3971 forbid-local-path Kyverno ENFORCE policy); 0.4.4 moved active-hot-standby
  # CNPG sync to the native spec.postgresql.synchronous block. (#3870: 0.2.0→0.4.1;
  # #4139: →0.4.4.)
  # #4936: →0.4.21 — direct CNPG-secret DB-password bind (kills the reflector
  # race vs Helm --wait) + orgDomain/adminUser made non-required (controller-
  # derived). Lockstep with platform/wordpress-tenant/blueprint.yaml.
  # #4951: →0.4.22 — right-size the per-Org footprint (runtime CPU limit
  # 1→500m; oidc-config + admin-user hook Jobs 500m→250m) so the post-install
  # hook pod fits the 4-CPU `plan-quota` headroom and actually schedules; the
  # 0.4.21 hook was rejected `exceeded quota: plan-quota` → never created → HR
  # timeout → no external HTTPRoute → host 404.
  version: "0.4.22"
  visibility: listed
  card:
    title: "WordPress (per-Organization)"
    category: organization-app
    family: cms
    summary: "Turnkey, SSO-pre-wired WordPress per Organization. Postgres + cert-manager TLS pre-wired."
    description: "Runs in the Organization's vcluster, namespace = Organization namespace. SSO via the Organization-vcluster Keycloak realm. Default theme + admin user pre-seeded at install time."
    icon: wordpress.svg
    license: "GPL-2.0-or-later"
    tags: [wordpress, cms, org, organization, sso, keycloak, postgres]
    docs: "https://wordpress.org/documentation/"
  # placementSchema aligned with spec.topology (#4212 Seam 4) — the
  # catalog-seed copy the application-controller resolves by name for the
  # per-Org WordPress install. modes[] must admit active-passive AND
  # defaultOnMultiRegion must name it so a multi-region Org install resolves
  # to a primary+standby plan and the generic per-app Continuum producer
  # mints the per-Org Continuum CR. Mirrors platform/wordpress-tenant/blueprint.yaml.
  placementSchema:
    modes: [single-region, singleton, active-passive]
    default: single-region
    defaultOnMultiRegion: active-passive
  manifests:
    chart: bp-wordpress-tenant
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-wordpress-tenant
    version: "0.4.22"
  # G117.1+G117.4+G117.5 #2744-followup (2026-06-03): lockstep with
  # platform/wordpress-tenant/blueprint.yaml. Uses {{.AppName}} so
  # multi-instance tenants get distinct hostnames per Application.
  topology:
    supported:
      - active-passive
      - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          tier: ''
          clusters: [rtz-A, rtz-B]
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: ''
          clusters: [rtz-A]
          roles:
            rtz-A: singleton
  endpoints:
    - name: ui
      hostnameTemplate: "{{ "{{" }}.AppName{{ "}}" }}.{{ "{{" }}.OrgSlug{{ "}}" }}.{{ "{{" }}.SovereignFQDN{{ "}}" }}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
  sso:
    realm: "{{ "{{" }}.OrgSlug{{ "}}" }}"
    protocolMapper: oidc
    silentLogin: true
  multiInstance:
    enabled: true
    maxPerOrg: 10
  configSchema:
    type: object
    # #4936: orgDomain + adminUser are NOT customer-required. The console
    # 'New instance' dialog + marketplace funnel collect neither, so
    # requiring them failed Application admission
    # (`missing properties: 'orgDomain','adminUser'`). The Organization
    # controller DERIVES both from Org context (orgDomain from the Org
    # domain, adminUser.email from the Org owner) and injects them into the
    # Application config before render — a customer never types them. They
    # stay accepted (with nested validation) for explicit operator overlays.
    properties:
      orgDomain:
        type: string
        description: "Organization domain (e.g. acme.<sov-fqdn>)."
      replicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 8
      adminUser:
        type: object
        required: [email]
        properties:
          email:
            type: string
            description: "Admin email (must match Keycloak realm email claim)."
---
{{- if not $.Values.qaFixtures.enabled }}
# bp-wordpress — production alias for the bare `wordpress` / `bp-wordpress`
# slug (2026-06-19, #3870 / #3376). The customer-facing marketplace funnel
# NOTE (2026-06-30, #4655): gated `not qaFixtures.enabled` — on a qaTestEnabled
# prov the templates/qa-fixtures/blueprint-bp-wordpress.yaml fixture ALSO seeds a
# `bp-wordpress` Blueprint, so rendering this alias too registers the id twice →
# Helm post-render "may not add resource with an already registered id:
# Blueprint/bp-wordpress" → bp-catalyst-platform install fails → fresh qa provs
# wedge at ~59/65 HRs. Production (qaFixtures off) still gets this alias.
# (core/marketplace AppsStep.svelte) sells WordPress under `slug: wordpress`,
# and operator docs + the qa-loop matrix POST `"blueprint":"bp-wordpress"`.
# The console resolves both via the catalog-client bare→`bp-` prefix retry
# (catalog_client_cluster_fallback.go) → it looks up a CR named `bp-wordpress`.
# Pre-fix that CR was seeded ONLY by templates/qa-fixtures/blueprint-bp-wordpress.yaml,
# which is gated on qaFixtures.enabled (default FALSE on production Sovereigns).
# Result: on a fresh production prov, `GET /api/v1/catalog/wordpress` 404'd
# ("Couldn't load wordpress / catalog get: HTTP 404", caught live hw167).
# Seeding the alias here (always-on via catalogSeed.enabled) makes the bare
# slug resolve to the REAL bp-wordpress-tenant chart on every Sovereign. The
# canonical `bp-wordpress-tenant` entry above remains the operator-grid card;
# this alias is the marketplace/funnel/literal-install entrypoint pointing at
# the same OCI chart bytes (no separate chart). Per INVIOLABLE-PRINCIPLES #1
# the chart ref is the published 0.4.1 — not a placeholder.
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-wordpress
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: organization-app
    catalyst.openova.io/section: pts-7-org-tenant
    catalyst.openova.io/alias-of: bp-wordpress-tenant
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: "0.4.22"
  visibility: listed
  card:
    title: "WordPress"
    category: organization-app
    family: cms
    summary: "Turnkey, SSO-pre-wired WordPress. Postgres + cert-manager TLS pre-wired. The marketplace funnel's flagship CMS."
    description: "Runs in the Org's vcluster. SSO via the per-Org Keycloak realm (openid-connect-generic). Default theme + admin user pre-seeded at install time so the first browser hit lands on /wp-admin authenticated. Aliases the bp-wordpress-tenant chart."
    icon: wordpress.svg
    license: "GPL-2.0-or-later"
    tags: [wordpress, cms, org, tenant, sso, keycloak, postgres]
    docs: "https://wordpress.org/documentation/"
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-wordpress-tenant
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-wordpress-tenant
    version: "0.4.22"
  # Lockstep with the bp-wordpress-tenant entry above + platform/wordpress-tenant/
  # blueprint.yaml. Same chart bytes; this is the bare-slug entrypoint only.
  topology:
    supported:
      - active-passive
      - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          tier: ''
          clusters: [rtz-A, rtz-B]
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: ''
          clusters: [rtz-A]
          roles:
            rtz-A: singleton
  endpoints:
    - name: ui
      hostnameTemplate: "{{ "{{" }}.AppName{{ "}}" }}.{{ "{{" }}.OrgSlug{{ "}}" }}.{{ "{{" }}.SovereignFQDN{{ "}}" }}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
  sso:
    realm: "{{ "{{" }}.OrgSlug{{ "}}" }}"
    protocolMapper: oidc
    silentLogin: true
  multiInstance:
    enabled: true
    maxPerOrg: 10
  configSchema:
    type: object
    # #4936: orgDomain + adminUser are NOT customer-required. The console
    # 'New instance' dialog + marketplace funnel collect neither, so
    # requiring them failed Application admission
    # (`missing properties: 'orgDomain','adminUser'`). The Organization
    # controller DERIVES both from Org context (orgDomain from the Org
    # domain, adminUser.email from the Org owner) and injects them into the
    # Application config before render — a customer never types them. They
    # stay accepted (with nested validation) for explicit operator overlays.
    properties:
      orgDomain:
        type: string
        description: "Org domain (e.g. acme.<sov-fqdn>)."
      replicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 8
      adminUser:
        type: object
        required: [email]
        properties:
          email:
            type: string
            description: "Admin email (must match Keycloak realm email claim)."
{{- end }}
---
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-cnpg
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: database
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: "1.0.14"
  visibility: listed
  # #3648 — DECLARED operator→instance edge (lockstep with
  # platform/cnpg/blueprint.yaml). bp-cnpg is the engine that produces
  # bp-postgres data-instances; the platform reads this instead of
  # inferring the pairing from a "postgres" literal.
  producesInstances:
    kind: postgres
    instanceBlueprint: bp-postgres
  card:
    title: "CloudNativePG"
    category: database
    family: postgres
    summary: "PostgreSQL operator for Kubernetes (HA primary/replica, automated backups, point-in-time recovery)."
    description: "Production-grade Postgres operator. Provisions a Cluster CR per database with streaming replication, scheduled backups, and S3 PITR."
    icon: postgres.svg
    license: "Apache-2.0"
    tags: [database, postgres, sql, operator, ha]
    docs: "https://cloudnative-pg.io/documentation/"
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-cnpg
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-cnpg
    version: "1.0.14"
  # G117.1+G117.4+G117.5 #2744-followup (2026-06-03): lockstep with
  # platform/cnpg/blueprint.yaml. Operator pattern: each region runs its
  # own controller (singleton everywhere); HA happens at the per-Cluster
  # CR level rendered by bp-cnpg-pair. No user-facing endpoint, no SSO
  # (the operator authenticates intra-cluster via ServiceAccount tokens).
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ""
          clusters: [mgmt-A, mgmt-B, dmz-A, dmz-B, rtz-A, rtz-B]
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  endpoints: []
  configSchema:
    type: object
    properties:
      instances:
        type: integer
        default: 3
        minimum: 1
        maximum: 5
        description: "Number of Postgres replicas (incl. primary)."
      storage:
        type: object
        properties:
          size:
            type: string
            default: 10Gi
---
# bp-cnpg-pair — D31 active-hot-standby CNPG cluster-pair (companion to
# bp-cnpg). Catalyst-curated Blueprint chart published at
# oci://ghcr.io/openova-io/bp-cnpg-pair (Chart.yaml: platform/cnpg-pair/
# chart/Chart.yaml @ 0.1.1). Renders TWO postgresql.cnpg.io/v1.Cluster
# CRs (primary + replica) pinned to two regions, WAL streaming over
# Cilium ClusterMesh per ADR-0001 §9 (never public TLS). Per Wave 28-B
# discovery this Blueprint was missing from the catalog-seed even
# though the chart is published and the wordpress-tenant chart's
# `pg.activeHotStandby.enabled` knob already renders the same shape
# inline (DoD D31). Seeding here lets operators install the pair
# standalone (companion DB for any organization-app) AND lets the install
# flow render a stable reference target when wordpress-tenant.db.mode
# = active-hot-standby. Refs TBD-E8b, TBD-B31.
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-cnpg-pair
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: database
    catalyst.openova.io/section: pts-9-disaster-recovery
    catalyst.openova.io/companion: bp-cnpg
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  # 0.2.22 (#5311): NetworkPolicy carve-out admitting the continuum-controller
  # to the primary -rw:5432 so its standby probe surfaces status.standbyAvailable
  # on a TRUE 2-region topology (hw287 residual after the #5335 Secret-RBAC fix).
  # Keep this display-version in lockstep with delivery source.version +
  # blueprint.yaml (the #4988 precedent).
  version: "0.2.22"
  visibility: listed
  card:
    title: "CNPG Cluster-Pair (Active-Hotstandby DR)"
    category: database
    family: postgres
    summary: "Active-hot-standby CNPG cluster-pair across two regions. WAL streams over Cilium ClusterMesh for cross-region DR."
    description: "Catalyst-curated Blueprint that renders a primary postgresql.cnpg.io/v1.Cluster CR in region A + a replica Cluster CR in region B configured as a CNPG replica cluster (replica.enabled=true + externalCluster) streaming WAL over a Cilium ClusterMesh-shared Service. Failover-readiness probe Pod flips Ready when WAL lag < threshold so Continuum K-Cont-2 can promote on operator-triggered switchover."
    icon: cnpg-pair.svg
    license: "Apache-2.0"
    tags: [database, postgres, ha, dr, disaster-recovery, multi-region, active-hot-standby, clustermesh, cnpg]
    docs: "https://cloudnative-pg.io/documentation/"
  placementSchema:
    # The cluster-pair IS the placement — primary + replica are the
    # two regions. CNPG's replication model is asynchronous-streaming
    # primary + 1 replica region; multi-replica-region is out of scope.
    # #3856 — ONE canonical DR vocabulary (#3375 DoD-1): the canonical
    # hyphenated `active-hot-standby` token (never the banned un-hyphenated
    # form) so the operator console's Instances table renders the clean chip.
    modes: [active-hot-standby]
    default: active-hot-standby
    minRegions: 2
    maxRegions: 2
  manifests:
    chart: bp-cnpg-pair
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-cnpg-pair
    version: "0.2.22"
  # G117.1+G117.4+G117.5 #2744-followup (2026-06-03): cluster-pair IS
  # active-hot-standby by construction. Only one topology variant —
  # active-passive — because the chart renders 2 Cluster CRs (primary +
  # replica streaming WAL). Replication backend = CNPG streaming over
  # Cilium ClusterMesh per ADR-0001 §9. switchover via bp-continuum
  # K-Cont-2 (operator-triggered promotion).
  topology:
    supported:
      - active-hot-standby
    defaults:
      multi-region: active-hot-standby
      single-region: active-hot-standby
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: async
          lagSloSeconds: 30
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 30
        placement:
          # 1.4.489 (hw91): the seed predated the Blueprint CRD's
          # canonical placement vocabulary (pattern
          # ^(mgmt|dmz|rtz)-[A-Z0-9]+$, enforced server-side since
          # #2958/#3007) — 'primary-region'/'replica-region' failed
          # admission and blocked the ENTIRE bp-catalyst-platform
          # install ("Blueprint bp-cnpg-pair is invalid"). Canonical
          # form per platform/bp-rtz-vcluster/blueprint.yaml: the CNPG
          # pair lives in the runtime zone of each region, active in A,
          # passive (replica) in B.
          tier: ""
          clusters: [rtz-A, rtz-B]
          roles:
            rtz-A: active
            rtz-B: passive
  endpoints: []
  configSchema:
    type: object
    required: [primary, replica, image]
    properties:
      primary:
        type: object
        required: [region]
        properties:
          region:
            type: string
            description: "Region key for the primary CNPG Cluster (e.g. hz-fsn-rtz-prod). Must differ from replica.region."
          instances:
            type: integer
            default: 3
            minimum: 3
            maximum: 5
          storage:
            type: object
            properties:
              size:
                type: string
                default: "100Gi"
              storageClass:
                type: string
                default: hcloud-volumes
      replica:
        type: object
        required: [region]
        properties:
          region:
            type: string
            description: "Region key for the replica CNPG Cluster. Must differ from primary.region."
          instances:
            type: integer
            default: 3
            minimum: 3
            maximum: 5
          storage:
            type: object
            properties:
              size:
                type: string
                default: "100Gi"
              storageClass:
                type: string
                default: hcloud-volumes
      walStreaming:
        type: object
        properties:
          targetLagSeconds:
            type: integer
            default: 30
            minimum: 1
            maximum: 600
          timeoutSeconds:
            type: integer
            default: 60
            minimum: 5
            maximum: 600
      clusterMesh:
        type: object
        properties:
          enabled:
            type: boolean
            default: true
            description: "Cilium ClusterMesh transport for WAL. Disabling is FORENSIC ONLY — public-TLS replication is unsupported per ADR-0001 §9."
          affinity:
            type: string
            default: local
            description: "ClusterMesh affinity hint (local|remote|none)."
      image:
        type: object
        required: [tag]
        properties:
          repository:
            type: string
            default: ghcr.io/cloudnative-pg/postgresql
          tag:
            type: string
            description: "REQUIRED — empty triggers a template-time fail-fast. Example: '16.3-23' or 'sha256:<digest>'."
---
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-keycloak
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: identity
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: "1.5.6"
  visibility: listed
  card:
    title: "Keycloak"
    category: identity
    family: iam
    summary: "Open-source Identity and Access Management. OIDC + SAML + social login + realm-per-Organization."
    description: "Per-Organization Keycloak realm with pre-seeded OIDC client. Pairs with bp-wordpress-tenant for SSO."
    icon: keycloak.svg
    license: "Apache-2.0"
    tags: [identity, sso, oidc, saml, iam, keycloak]
    docs: "https://www.keycloak.org/documentation"
  # placementSchema aligned with spec.topology below (#4212 Seam 3) — the
  # catalog-seed copy the application-controller resolves by name. modes[]
  # must admit active-hot-standby AND defaultOnMultiRegion must name it so
  # the spine producer's explicit multi-region placement is accepted and the
  # Continuum CR is minted. Mirrors platform/<chart>/blueprint.yaml.
  placementSchema:
    modes: [singleton, active-hot-standby]
    default: singleton
    defaultOnMultiRegion: active-hot-standby
  manifests:
    chart: bp-keycloak
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-keycloak
    version: "1.5.6"
  # G117.1+G117.4+G117.6 #2744-followup (2026-06-03): bp-keycloak
  # catalog-seed needs topology + endpoints + sso so application-
  # controller can fan out HRs and operator console can mint silent-SSO
  # URLs. Mirrors platform/keycloak/blueprint.yaml. Same class fix as
  # PR #2883 (grafana endpoints) + PR #2893 (grafana topology).
  # Helm-escape {{.SovereignFQDN}} per PR #2888 pattern.
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          # #4402 (#4325 de-vcluster fallout): spine lands host-native (own host
          # ns); the #4334 producer drives this via the app-controller fan-out
          # which resolved tier:mgmt → absent host ns mgmt → no Continuum. Empty
          # tier = host placement; keep mgmt-A/-B region designators. (#4375/#4379)
          tier: ''
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ''
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  endpoints:
    - name: ui
      hostnameTemplate: "auth.{{ "{{" }}.SovereignFQDN{{ "}}" }}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      # KC is itself the IdP — silent SSO from another app TO KC would
      # be circular. The Launch button still routes to /admin/master/
      # console/ but does NOT append prompt=none+kc_idp_hint. catalyst-api
      # honors ssoEnabled=false by skipping the silent-SSO query string.
      ssoEnabled: false
  sso:
    realm: sovereign
    protocolMapper: oidc
    silentLogin: false
  configSchema:
    type: object
    required: [realmName]
    properties:
      realmName:
        type: string
        description: "Keycloak realm name (e.g. org-<orgslug>)."
      adminUser:
        type: string
        default: admin
