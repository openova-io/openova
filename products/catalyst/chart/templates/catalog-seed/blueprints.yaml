apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-wordpress-tenant
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: 0.6.6
  card:
    title: WordPress (per-Organization)
    summary: Turnkey, SSO-pre-wired WordPress per Organization. Postgres + cert-manager TLS pre-wired.
    description: Runs in the Organization's vcluster, namespace = Organization namespace. SSO via the Organization-vcluster Keycloak realm. Default theme + admin user pre-seeded at install time.
    icon: wordpress.svg
    license: GPL-2.0-or-later
    tags: [wordpress, cms, org, organization, sso, keycloak, postgres]
    docs: https://wordpress.org/documentation/
  visibility: listed
  class: application
  lifecycle: experimental
  configSchema:
    type: object
    properties:
      orgDomain:
        type: string
        description: Organization domain (e.g. acme.<sov-fqdn>).
      replicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 8
      adminUser:
        type: object
        required: [email]
        properties:
          email:
            type: string
            description: Admin email (must match Keycloak realm email claim).
  placementSchema:
    modes: [single-region, singleton, active-passive, active-hot-standby]
    default: single-region
    defaultOnMultiRegion: active-passive
  manifests:
    chart: bp-wordpress-tenant
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-wordpress-tenant
    version: 0.6.6
  regionLocalVolumes:
  - name: wp-content
    template: chart/templates/pvc.yaml
    mountPath: /var/www/html/wp-content
    contents: [themes, plugins, mu-plugins]
    replication: none-needed
  - name: uploads
    mountPath: /var/www/html/wp-content/uploads
    contents: [uploads]
    replication: s3-replicated
    bucket: replicated
  topology:
    supported: [active-passive, active-hot-standby, singleton]
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          tier: ""
          clusters: [rtz-A, rtz-B]
          roles:
            rtz-A: active
            rtz-B: passive
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          tier: ""
          clusters: [rtz-A, rtz-B]
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: ""
          clusters: [rtz-A]
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: "{{ "{{" }}.AppName{{ "}}" }}.{{ "{{" }}.OrgDomain{{ "}}" }}"
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: "{{ "{{" }}.OrgSlug{{ "}}" }}"
    protocolMapper: oidc
    silentLogin: true
  multiInstance:
    enabled: true
    maxPerOrg: 10
{{- end }}
