# bp-postgres — the operator-facing, SHAREABLE PostgreSQL data-instance
# App card (ADR-0010). Each install is ONE CNPG Cluster (the engine,
# operated by bp-cnpg) exposed as a first-class App. Consumers SHARE it
# via isolated databases + per-consumer roles, all pure declarative YAML
# (a CNPG Database CR + a managed.roles entry + a reflected connection
# Secret + a Flux dependsOn edge) — NO custom controller, NO Crossplane.
#
# Seeded verbatim from platform/postgres/blueprint.yaml (#3191/#3196).
# Was the lone catalog-404 for the data-instance card on a fresh Sovereign
# (GET /api/v1/catalog/bp-postgres returned 404 while bp-cnpg/bp-cnpg-pair
# resolved) — #3191 added it to blueprints.json but not this in-cluster
# seed, which is the source the catalog API actually serves. The engine
# OPERATOR (bp-cnpg) stays unlisted; the N data-instances (gitea-pg,
# harbor-pg, shared-pg, …) are bp-postgres App cards → visibility: listed.
# No user-facing endpoint + no SSO on the source (connection is intra-
# cluster via the reflected role Secret), so endpoints[] is empty and no
# sso block — matching platform/postgres/blueprint.yaml keeps the lockstep
# guard green. Refs #3188.
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-postgres
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: data
    catalyst.openova.io/section: pts-4-1-data-services
    catalyst.openova.io/companion: bp-cnpg
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  # 0.2.8 (#4460): -mesh/-mesh-rw global Service aliases decoupled from the
  # cnpg-pair flip (region-B cross-region consumer DB host NXDOMAIN fix).
  # 0.2.12 (#4987/#4988): continuum.yaml mints dr-<instance> for AHS DR panel;
  # keep this display-version in lockstep with delivery source.version + blueprint.yaml.
  # 0.2.13 (#5224): role-secrets side-gate — replica-role region never mints
  # role/hub Secrets; pair password set single-sourced from the primary region.
  version: "0.2.13"
  visibility: listed
  # Shareability + Contexts (#3370) — seeded verbatim from
  # platform/postgres/blueprint.yaml (lockstep-guarded). One instance
  # serves many consumers, each via a Context (db = isolated database +
  # role + reflected credential Secret).
  shareable: true
  contextSchema:
    kind: db
    valuesKey: databases
    needs:
      - name
      - owner
    produces:
      - credentialSecret
  card:
    title: "PostgreSQL"
    category: data
    family: postgres
    summary: "A reusable, shareable PostgreSQL data-instance. Each install is ONE CNPG Cluster — the engine — and a first-class App card. Consumers SHARE it via isolated databases + per-consumer roles (ADR-0010)."
    description: "The binding is pure declarative YAML (a CNPG Database CR + a managed.roles entry + a reflected connection Secret + a Flux dependsOn edge) reconciled by Flux + the CNPG operator. NO custom controller and NO Crossplane. topology: active-hot-standby renders the Pillar-3 synchronous-replication shape (ADR-0004)."
    icon: postgres.svg
    license: "Apache-2.0"
    tags: [database, postgres, sql, data, shareable, cnpg, adr-0010]
    docs: "https://cloudnative-pg.io/documentation/"
  # Seeded verbatim from platform/postgres/blueprint.yaml spec.configSchema
  # (#3784, commit 509a6ec8e). The topology block is what the bp-postgres
  # Blueprint CR validates a picked mode against — the seed previously
  # lacked it, so a multi-region active-hot-standby pick was rejected
  # before anything built (#4282, shared-pg-e Failed). singleton =
  # single-instance Cluster; active-hot-standby = synchronous replication
  # across regions (ADR-0004 Pillar-3 zero-tx-loss).
  configSchema:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
        description: |
          Master gate. false → the install renders ZERO resources (an
          empty Ready release). The bootstrap-kit slot 16a wires this to
          ${SOVEREIGN_ENABLE_SHARED_PG:=false} so a non-sharing Sovereign
          gets a Ready bp-postgres-shared HR without deploying an unused
          shared-pg Cluster.
      instance:
        type: object
        description: |
          The data instance (one CNPG Cluster). name surfaces as the
          App-card title and the dependsOn target consumers reference.
        properties:
          name:
            type: string
            default: postgres
            description: Cluster name = the data-instance identity.
          storageSize:
            type: string
            default: "5Gi"
            description: Per-instance PVC size (k8s resource quantity).
          pgVersion:
            type: string
            default: "16"
            description: PostgreSQL major version (CNPG image tag).
      topology:
        type: object
        properties:
          mode:
            type: string
            enum: [singleton, active-hot-standby]
            default: singleton
            description: |
              singleton = single-instance Cluster (no cross-region HA).
              active-hot-standby = multi-instance Cluster with synchronous
              replication across regions (ADR-0004 Pillar-3 zero-tx-loss).
          instances:
            type: integer
            minimum: 1
            maximum: 5
            default: 1
  placementSchema:
    # Canonical placement vocabulary (#3375 / #3768 / #3784). The catalog
    # New-instance picker reads these modes off the wire; the seed
    # previously served the BANNED legacy dialect single-region /
    # active-active. Aligned to placement.CanonicalModes so the picker
    # offers all four canonical classes and never a banned spelling.
    modes: [singleton, active-active, active-hot-standby, active-passive]
    default: singleton
  manifests:
    chart: bp-postgres
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-postgres
    # 0.2.8 (#4460): -mesh/-mesh-rw global Service aliases decoupled from the
    # cnpg-pair flip (render on the multi-region signal so cross-region consumer
    # DB hosts resolve the moment the mesh peers; region-B NXDOMAIN fix).
    # 0.2.12 (#4986): active-hot-standby emits the dr-<instance> Continuum CR so
    # the per-app Topology DR panel renders (shared-pg #3375 rows 51/52/56/57/64).
    # 0.2.13 (#5224): role-secrets side-gate (replica-role region mints nothing).
    version: "0.2.13"
  # Seeded verbatim from platform/postgres/blueprint.yaml spec.topology.
  # singleton = single-instance Cluster; active-hot-standby = sync
  # replication across regions (ADR-0004 Pillar-3 zero-tx-loss) via the
  # cnpg-pair backend, switchover by bp-continuum.
  topology:
    supported:
      - singleton
      - active-hot-standby
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: rtz
          clusters:
            - rtz-A
          roles:
            rtz-A: singleton
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 10
          rpoSeconds: 0
        placement:
          tier: rtz
          clusters:
            - rtz-A
            - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
  # No public endpoint — consumers connect intra-cluster via the
  # CNPG-reflected role Secret. Empty endpoints[] + no sso block matches
  # the platform/ source (keeps the lockstep guard green).
  endpoints: []
  # multiInstance — N distinct data-instances per Org (gitea-pg, harbor-pg,
  # shared-pg, …). maxPerOrg 0 = unlimited. Mirrors the platform/ source.
  multiInstance:
    enabled: true
    maxPerOrg: 0
    namingTemplate: "{{ "{{" }}.AppName{{ "}}" }}-{{ "{{" }}.InstanceID{{ "}}" }}"
    isolationLevel: namespace
---
# bp-agenity (#4010) — Agenity as an installable Application Blueprint.
# A User installs this into their own Organization from the catalog, chats
# with the built-in solo agent (Claude Opus 4.7, token pre-configured), and
# the agent creates more Applications in the User's Org via the RBAC-scoped
# openova MCP. The north-star self-service journey (UAT rows 218-223).
# Lockstep with products/agenity/chart/Chart.yaml version 0.5.13 + the
# published chart ghcr.io/openova-io/bp-agenity:0.5.13 (appVersion 0.9.7 — the
# image whose /app mounts the WORKSPACES dashboard rather than the archaic
# single-column one, built from agenity#752, #4180). 0.5.10 (#4362, #4325
# fallout) flips the topology singleton placement.tier `rtz` -> '' (host-native)
# so a fresh Org's agenity Application lands on the HOST in its own Org
# namespace (#4297) — #4325 de-vclustered mgmt/rtz/dmz into native host
# namespaces and removed the `rtz` plane vCluster, so a `tier: rtz` resolves
# to the absent `rtz` namespace -> Degraded `namespaces "rtz" not found`.
# Fresh provs seed THIS pin,
# so the chart-version here gates which image a new Sovereign installs — bump
# in lockstep with the chart on every agenity release. (The per-Org install
# in organization_gitops.go pins the BOUNDED range `>=0.5.0 <0.6.0`
# (agenityChartConstraint), NOT `*`: the bp-agenity CHART repo was historically
# squatted by the dashboard IMAGE tag (appVersion 0.9.7) before #4706 moved the
# image to ghcr.io/openova-io/agenity, and an unbounded `*` wrongly resolved
# that 1-descriptor image over the chart → "manifest does not contain minimum
# number of descriptors (2), found: 1" (#4922). The bound resolves to the
# newest 0.5.x chart deterministically. This seed pin is the catalog-card
# version a fresh prov shows + installs.)
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-agenity
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: ai-runtime
    catalyst.openova.io/section: pts-7-org-tenant
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  # 0.5.19 (#4624): chart self-wires the OPENOVA_MCP_BEARER + RS256-pubkey
  # projection from the enabled per-Org mcpBearer ExternalSecret (no door has to
  # hand-couple bearerSecret.name) so a fresh Org's agenity MCP tools/list
  # surfaces create_application. Lockstep with products/agenity/chart.
  version: "0.5.20"
  visibility: listed
  card:
    title: "Agenity"
    category: ai-runtime
    family: agent-runtime
    summary: "Your AI engineering team — chat with a built-in solo agent (Claude Opus 4.7) that creates Applications in your Organization for you."
    description: "Install Agenity into your Organization and chat with its solo agent (Claude Opus 4.7, token pre-configured). The agent reaches the OpenOva MCP — scoped to exactly what you can do in the console — to create and manage Applications in YOUR Organization on your behalf."
    icon: agenity.svg
    license: "MIT"
    tags: [agenity, agent, multi-agent, claude, opus, mcp, self-service]
    docs: "https://github.com/openova-io/openova"
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-agenity
    helmRelease:
      # disableWait — the large agenity image (appVersion 0.9.7) cold-pulls
      # slowly on a fresh Org node; without this the helm install times out
      # waiting for the Pod, helm-controller uninstalls + retries, and the
      # image pull restarts from zero every cycle so the Pod never converges
      # (live on the omantel.biz demo Org post-#4325, #4362). Lockstep with
      # products/agenity/blueprint.yaml.
      disableWait: true
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-agenity
    version: 0.5.20
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          # #4325 de-vclustered mgmt/rtz/dmz → native host namespaces and
          # removed the `rtz` plane vCluster. A per-Org agentic dashboard
          # lands on the HOST in its own Org namespace (#4297), so tier MUST
          # be '' (host-native); a non-empty tier resolves through the
          # controller's VClusterPlacements → HR upsert into the removed
          # `rtz` namespace → `namespaces "rtz" not found` (Degraded). The
          # `rtz-A` cluster ID is the region designator, NOT a vCluster.
          # Lockstep with products/agenity/blueprint.yaml.
          tier: ''
          clusters: [rtz-A]
          roles:
            rtz-A: singleton
  endpoints:
    - name: console
      hostnameTemplate: "agenity.{{ "{{" }}.OrgSlug{{ "}}" }}.{{ "{{" }}.SovereignFQDN{{ "}}" }}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
  sso:
    realm: "{{ "{{" }}.OrgSlug{{ "}}" }}"
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  multiInstance:
    enabled: false
{{- end }}
