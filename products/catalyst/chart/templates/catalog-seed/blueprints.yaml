# bp-powerdns-admin (#3150): the PowerDNS-Admin web UI was the LONE
# catalog-404 on a fresh Sovereign — slot 11a installs the HR but this
# seed entry was missing, so /api/v1/catalog/bp-powerdns-admin returned
# 404 blueprint_not_found while every sibling resolved. Shape mirrors the
# bp-powerdns entry above + platform/powerdns-admin/blueprint.yaml.
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-powerdns-admin
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: infrastructure
    catalyst.openova.io/section: pts-2-3-per-sovereign-supporting-services
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: "0.1.18"
  visibility: unlisted
  card:
    title: "PowerDNS-Admin"
    category: infrastructure
    summary: "Web UI for per-Sovereign PowerDNS zone + record management. CNPG-backed metadata, Catalyst SSO via Keycloak, drives the authoritative server via the bp-powerdns REST API."
    icon: powerdns.svg
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-powerdns-admin
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-powerdns-admin
    version: "0.1.18"
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  endpoints:
    - name: ui
      hostnameTemplate: "pdns-admin.{{ "{{" }}.SovereignFQDN{{ "}}" }}"
      port: 443
      protocol: https
      tls: true
      visibility: private
      launchDefault: true
      ssoEnabled: true
      # #3150 — silent-SSO OIDC-init path. PowerDNS-Admin (ngoduykhanh) is a
      # Flask/authlib app whose generic-OIDC provider registers its login
      # view at /oidc/login. GET pdns-admin.<sov>/oidc/login 302s to Keycloak
      # (auth.<sov>/realms/sovereign/...?kc_idp_hint=catalyst-pin — the hint
      # is baked into PDA's synced OIDC_OAUTH_AUTHORIZE_URL by the chart's
      # sso-oauth-source-externalsecret) → silent PIN re-use → operator lands
      # inside PDA with no login form. Without these two endpoint fields the
      # launch-url handler emits no LaunchURL → the FE falls back to the app
      # root → PDA shows its own login form (the #3150 gap). Lockstep with
      # platform/powerdns-admin/blueprint.yaml endpoint[0].
      ssoInitPath: "/oidc/login"
  # SSO block kept lockstep with platform/powerdns-admin/blueprint.yaml
  # (catalog-seed-lockstep CI compares sso.realm + sso.silentLogin).
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
