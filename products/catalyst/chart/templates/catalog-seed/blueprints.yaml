# bp-cnpg-pair — D31 active-hot-standby CNPG cluster-pair (companion to
# bp-cnpg). Catalyst-curated Blueprint chart published at
# oci://ghcr.io/openova-io/bp-cnpg-pair (Chart.yaml: platform/cnpg-pair/
# chart/Chart.yaml @ 0.1.1). Renders TWO postgresql.cnpg.io/v1.Cluster
# CRs (primary + replica) pinned to two regions, WAL streaming over
# Cilium ClusterMesh per ADR-0001 §9 (never public TLS). Per Wave 28-B
# discovery this Blueprint was missing from the catalog-seed even
# though the chart is published and the wordpress-tenant chart's
# `pg.activeHotStandby.enabled` knob already renders the same shape
# inline (DoD D31). Seeding here lets operators install the pair
# standalone (companion DB for any tenant-app) AND lets the install
# flow render a stable reference target when wordpress-tenant.db.mode
# = active-hot-standby. Refs TBD-E8b, TBD-B31.
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-cnpg-pair
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: database
    catalyst.openova.io/section: pts-9-disaster-recovery
    catalyst.openova.io/companion: bp-cnpg
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: "0.1.1"
  visibility: listed
  card:
    title: "CNPG Cluster-Pair (Active-Hotstandby DR)"
    category: database
    family: postgres
    summary: "Active-hot-standby CNPG cluster-pair across two regions. WAL streams over Cilium ClusterMesh for cross-region DR."
    description: "Catalyst-curated Blueprint that renders a primary postgresql.cnpg.io/v1.Cluster CR in region A + a replica Cluster CR in region B configured as a CNPG replica cluster (replica.enabled=true + externalCluster) streaming WAL over a Cilium ClusterMesh-shared Service. Failover-readiness probe Pod flips Ready when WAL lag < threshold so Continuum K-Cont-2 can promote on operator-triggered switchover."
    icon: cnpg-pair.svg
    license: "Apache-2.0"
    tags: [database, postgres, ha, dr, disaster-recovery, multi-region, active-hotstandby, clustermesh, cnpg]
    docs: "https://cloudnative-pg.io/documentation/"
  placementSchema:
    # The cluster-pair IS the placement — primary + replica are the
    # two regions. CNPG's replication model is asynchronous-streaming
    # primary + 1 replica region; multi-replica-region is out of scope.
    modes: [active-hotstandby]
    default: active-hotstandby
    minRegions: 2
    maxRegions: 2
  manifests:
    chart: bp-cnpg-pair
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-cnpg-pair
    version: 0.1.1
  configSchema:
    type: object
    required: [primary, replica, image]
    properties:
      primary:
        type: object
        required: [region]
        properties:
          region:
            type: string
            description: "Region key for the primary CNPG Cluster (e.g. hz-fsn-rtz-prod). Must differ from replica.region."
          instances:
            type: integer
            default: 3
            minimum: 3
            maximum: 5
          storage:
            type: object
            properties:
              size:
                type: string
                default: "100Gi"
              storageClass:
                type: string
                default: hcloud-volumes
      replica:
        type: object
        required: [region]
        properties:
          region:
            type: string
            description: "Region key for the replica CNPG Cluster. Must differ from primary.region."
          instances:
            type: integer
            default: 3
            minimum: 3
            maximum: 5
          storage:
            type: object
            properties:
              size:
                type: string
                default: "100Gi"
              storageClass:
                type: string
                default: hcloud-volumes
      walStreaming:
        type: object
        properties:
          targetLagSeconds:
            type: integer
            default: 30
            minimum: 1
            maximum: 600
          timeoutSeconds:
            type: integer
            default: 60
            minimum: 5
            maximum: 600
      clusterMesh:
        type: object
        properties:
          enabled:
            type: boolean
            default: true
            description: "Cilium ClusterMesh transport for WAL. Disabling is FORENSIC ONLY — public-TLS replication is unsupported per ADR-0001 §9."
          affinity:
            type: string
            default: local
            description: "ClusterMesh affinity hint (local|remote|none)."
      image:
        type: object
        required: [tag]
        properties:
          repository:
            type: string
            default: ghcr.io/cloudnative-pg/postgresql
          tag:
            type: string
            description: "REQUIRED — empty triggers a template-time fail-fast. Example: '16.3-23' or 'sha256:<digest>'."
---
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-keycloak
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: identity
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: "1.0.0"
  visibility: listed
  card:
    title: "Keycloak"
    category: identity
    family: iam
    summary: "Open-source Identity and Access Management. OIDC + SAML + social login + realm-per-tenant."
    description: "Per-tenant Keycloak realm with pre-seeded OIDC client. Pairs with bp-wordpress-tenant for SSO."
    icon: keycloak.svg
    license: "Apache-2.0"
    tags: [identity, sso, oidc, saml, iam, keycloak]
    docs: "https://www.keycloak.org/documentation"
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-keycloak
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-keycloak
    version: 1.0.0
  # G117.1+G117.4+G117.6 #2744-followup (2026-06-03): bp-keycloak
  # catalog-seed needs topology + endpoints + sso so application-
  # controller can fan out HRs and operator console can mint silent-SSO
  # URLs. Mirrors platform/keycloak/blueprint.yaml. Same class fix as
  # PR #2883 (grafana endpoints) + PR #2893 (grafana topology).
  # Helm-escape {{.SovereignFQDN}} per PR #2888 pattern.
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  endpoints:
    - name: ui
      hostnameTemplate: "auth.{{ "{{" }}.SovereignFQDN{{ "}}" }}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      # KC is itself the IdP — silent SSO from another app TO KC would
      # be circular. The Launch button still routes to /admin/master/
      # console/ but does NOT append prompt=none+kc_idp_hint. catalyst-api
      # honors ssoEnabled=false by skipping the silent-SSO query string.
      ssoEnabled: false
  sso:
    realm: sovereign
    protocolMapper: oidc
    silentLogin: false
  configSchema:
    type: object
    required: [realmName]
    properties:
      realmName:
        type: string
        description: "Keycloak realm name (e.g. sme-<tenant>)."
      adminUser:
        type: string
        default: admin
---
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-grafana
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: observability
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: "1.0.0"
  visibility: listed
  card:
    title: "Grafana"
    category: observability
    family: dashboards
    summary: "Open-source observability dashboards. Pre-wired to Prometheus + Loki sources."
    description: "Multi-source observability platform with dashboards, alerting, and Keycloak SSO."
    icon: grafana.svg
    license: "AGPL-3.0"
    tags: [observability, monitoring, dashboards, grafana]
    docs: "https://grafana.com/docs/grafana/latest/"
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-grafana
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-grafana
    version: 1.0.0
  # G117.1+G117.6 #2745-followup (2026-06-03): application-controller
  # fan-out reads spec.topology.perTopology[choice].placement.clusters[]
  # to render per-cluster HelmReleases. Without this block the controller
  # silently exits with an empty cluster list → Application stays
  # Phase=Pending forever. Mirrors platform/grafana/blueprint.yaml.
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  # G117.4 #2882-followup (2026-06-03): launch-url endpoint needs
  # endpoints[] + sso{} to mint the silent-SSO URL with prompt=none
  # &kc_idp_hint=catalyst-pin. Mirrors platform/grafana/blueprint.yaml
  # — chart-seed is the only Blueprint source on Sovereigns whose gitea
  # catalog-sovereign Org isn't bootstrapped, so the endpoints/sso
  # contract MUST be co-located here. Caught live on hw86 walk
  # 2026-06-03: launch-url returned 404 "Blueprint grafana has no
  # endpoint" after PR #2882 fixed the cluster-fallback bp- prefix
  # lookup but exposed this gap.
  endpoints:
    - name: ui
      # Helm-escape the runtime template token. The `{{ "{{" }}` and
      # `{{ "}}" }}` Helm actions output literal `{{` and `}}` so the
      # rendered CR carries `grafana.{{.SovereignFQDN}}` verbatim;
      # the runtime template is evaluated later by
      # endpoint_handler.go:evaluateHostnameTemplate at request time.
      # PR #2886 used backtick-raw-string which Helm rejected with
      # "unexpected backticks in operand". Without ANY escape, Helm
      # interprets `{{.SovereignFQDN}}` at chart-render time —
      # `.SovereignFQDN` isn't in the chart values context → renders
      # empty → CR ends up with hostnameTemplate="grafana." and the
      # launch-url URL renders as "https://grafana./?..." (caught
      # live on hw86 2026-06-03 walk).
      hostnameTemplate: "grafana.{{ "{{" }}.SovereignFQDN{{ "}}" }}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    silentLogin: true
  configSchema:
    type: object
    properties:
      adminUser:
        type: string
        default: admin
      persistence:
        type: object
        properties:
          size:
            type: string
            default: 10Gi
---
