    summary: "Clientless HTML5 remote-desktop gateway. Browser-based RDP / VNC / SSH and kubectl-exec into Pods, with Keycloak SSO and full session recording to SeaweedFS. One Guacamole per Sovereign per ADR-0001 §11."
    description: "Clientless HTML5 remote-desktop gateway. Browser-based RDP / VNC / SSH and kubectl-exec into Pods, with Keycloak SSO and full session recording to SeaweedFS. One Guacamole per Sovereign per ADR-0001 §11."
    icon: "guacamole.svg"
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-guacamole
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-guacamole
    version: "0.2.1"
  topology:
    supported:
    - active-hot-standby
    - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: mgmt
          clusters:
          - mgmt-A
          - mgmt-B
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters:
          - mgmt-A
          roles:
            mgmt-A: singleton
  endpoints:
  - name: ui
    # #3150 — Guacamole is served at guacamole.<sov>:
    # clusters/_template/bootstrap-kit/52-bp-guacamole.yaml sets the HTTPRoute
    # hostname to guacamole.${SOVEREIGN_FQDN}. The earlier guac.<sov> value
    # pointed at a host with NO HTTPRoute → the console launch-url landed on a
    # dead host. Keep this aligned with the live HTTPRoute.
    #
    # ssoInitPath is intentionally OMITTED: Guacamole's UI is an Angular SPA
    # and OIDC is driven by the OpenID extension, which auto-starts the redirect
    # from the app root (POST /api/tokens) — there is no clean server GET route
    # to land on. The legacy app-root launch is correct for it. (On hw124 the
    # guacamole backend currently 404s /api/tokens and its OIDC env points at
    # the stale realm `catalyst`/host `keycloak.*` rather than `sovereign`/
    # `auth.*` — a separate config-drift defect, not a launch-url gap.)
    hostnameTemplate: guacamole.{{ "{{" }}.SovereignFQDN{{ "}}" }}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
