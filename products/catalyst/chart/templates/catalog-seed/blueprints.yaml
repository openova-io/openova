    # pointed at a host with NO HTTPRoute → the console launch-url landed on a
    # dead host. Keep this aligned with the live HTTPRoute.
    #
    # ssoInitPath: /guacamole/ (#3150, 2026-06-10) — the Apache Guacamole WAR
    # is served under Tomcat's `/guacamole/` context path; the bare host root
    # `/` returns a Tomcat 404 ROOT page. Without ssoInitPath the launch-url
    # builder (buildLaunchURL, endpoint_handler.go) returns
    # `https://guacamole.<sov>/?prompt=none&kc_idp_hint=catalyst-pin` → the
    # operator lands on the Tomcat 404 root, NOT the webapp, so the OpenID
    # extension never auto-initiates and silent-SSO never fires. Pointing
    # ssoInitPath at `/guacamole/` lands the operator on the webapp root where
    # the guacamole-auth-sso-openid extension auto-starts the OIDC implicit
    # redirect to Keycloak. The prior "intentionally OMITTED" note was wrong —
    # the app-root launch lands on Tomcat's 404, not the app.
    hostnameTemplate: guacamole.{{ "{{" }}.SovereignFQDN{{ "}}" }}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
    ssoInitPath: "/guacamole/"
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
