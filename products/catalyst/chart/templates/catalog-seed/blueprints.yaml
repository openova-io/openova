# #3150 — Harbor in-cluster Blueprint CR seed. Harbor installs as a bare
# HelmRelease with NO companion Application CR, and on a fresh Sovereign the
# catalyst-catalog returns items:[] (Gitea catalog Org not yet mirrored), so
# the ONLY blueprint-resolution path the launch-url handler has is this
# in-cluster CR (via catalog_client_cluster_fallback.go). Without this entry,
# GET /apps/bp-harbor/launch-url 404s "Blueprint harbor has no endpoint".
# Mirrors platform/harbor/blueprint.yaml.
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-harbor
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: platform
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: "1.2.44"
  visibility: unlisted
  card:
    title: "Harbor"
    category: platform
    summary: "Per-Sovereign OCI registry. Keycloak SSO via OIDC. One Harbor per Catalyst control plane."
    description: "Per-Sovereign OCI registry mirroring Catalyst Blueprint OCI artefacts + container images. Keycloak OIDC SSO; blobs in Object Storage, metadata in CNPG."
    icon: "harbor.svg"
  # placementSchema aligned with spec.topology below (#4212 Seam 3) — the
  # catalog-seed copy the application-controller resolves by name. modes[]
  # must admit active-hot-standby AND defaultOnMultiRegion must name it so
  # the spine producer's explicit multi-region placement is accepted and the
  # Continuum CR is minted. Mirrors platform/<chart>/blueprint.yaml.
  placementSchema:
    modes: [singleton, active-hot-standby]
    default: singleton
    defaultOnMultiRegion: active-hot-standby
  manifests:
    chart: bp-harbor
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-harbor
    version: "1.2.44"
  topology:
    supported:
    - active-hot-standby
    - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          # #4402 (#4325 de-vcluster fallout): spine lands host-native (own host
          # ns); the #4334 producer drives this via the app-controller fan-out
          # which resolved tier:mgmt → absent host ns mgmt → no Continuum. Empty
          # tier = host placement; keep mgmt-A/-B region designators. (#4375/#4379)
          tier: ''
          clusters:
          - mgmt-A
          - mgmt-B
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ''
          clusters:
          - mgmt-A
          roles:
            mgmt-A: singleton
  endpoints:
  - name: ui
    # Harbor UI + API + OIDC are served on the registry.<sov> host (the overlay
    # sets BOTH gateway.host AND externalURL to registry.${SOVEREIGN_FQDN}); the
    # KC OIDC redirect_uri is registry.<sov>/c/oidc/callback. The runtime token
    # `{{ "{{" }}.SovereignFQDN{{ "}}" }}` is Helm-escaped so the rendered CR
    # carries it verbatim for endpoint_handler.go to evaluate at request time.
    hostnameTemplate: registry.{{ "{{" }}.SovereignFQDN{{ "}}" }}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
    # #3150 — silent-SSO OIDC-init path. GET /c/oidc/login (no code) 302s to
    # Keycloak (auth.<sov>/realms/sovereign/...?kc_idp_hint=catalyst-pin) →
    # silent PIN re-use → operator lands inside Harbor with no login form.
    # Verified live on hw124: GET /c/oidc/login → 302 auth.hw124.omani.works.
    ssoInitPath: "/c/oidc/login"
  - name: registry
    hostnameTemplate: registry.{{ "{{" }}.SovereignFQDN{{ "}}" }}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: false
    ssoEnabled: false
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
---
# #3150 — OpenBao in-cluster Blueprint CR seed (same rationale as bp-harbor
# above: bare HelmRelease, no Application CR, empty catalyst-catalog on a fresh
# Sovereign). Mirrors platform/openbao/blueprint.yaml.
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-openbao
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: platform
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: "1.2.64"
  visibility: unlisted
  card:
    title: "OpenBao"
    category: platform
    summary: "Per-Sovereign secret backend. 3-node Raft per region. Keycloak OIDC SSO. MPL-2.0 Vault replacement."
    description: "OpenBao secret backend (Raft per region, async perf-replication across regions). UI + CLI login via the Keycloak OIDC auth method."
    icon: "openbao.svg"
  # placementSchema aligned with spec.topology below (#4212 Seam 3). This is
  # the catalog-seed copy the application-controller resolves by name when it
  # reconciles a spine Application CR — modes[] must admit active-passive AND
  # defaultOnMultiRegion must name it, else the spine producer's explicit
  # multi-region placement is rejected (blueprintAllowedModes) and no Continuum
  # CR is minted. Mirrors platform/openbao/blueprint.yaml.
  placementSchema:
    modes: [singleton, active-passive]
    default: singleton
    defaultOnMultiRegion: active-passive
  manifests:
    chart: bp-openbao
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-openbao
    version: "1.2.64"
  topology:
    supported:
    - active-passive
    - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: openbao-perf-replication
          mode: async
          lagSloSeconds: 30
        switchover:
          mechanism: raft-transition
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          # #4402 (#4325 de-vcluster fallout): spine lands host-native (own host
          # ns); the #4334 producer drives this via the app-controller fan-out
          # which resolved tier:mgmt → absent host ns mgmt → no Continuum. Empty
          # tier = host placement; keep mgmt-A/-B region designators. (#4375/#4379)
          tier: ''
          clusters:
          - mgmt-A
          - mgmt-B
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ''
          clusters:
          - mgmt-A
          roles:
            mgmt-A: singleton
  endpoints:
  - name: api
    # OpenBao is served at bao.<sov> (overlay sets gateway.host to
    # bao.${SOVEREIGN_FQDN}). Helm-escaped runtime token below.
    hostnameTemplate: bao.{{ "{{" }}.SovereignFQDN{{ "}}" }}
    port: 8200
    protocol: https
    tls: true
    visibility: private
    launchDefault: true
    ssoEnabled: true
    # #3626 — the console "Open" button window.open()s this launch target as a
    # TOP-LEVEL tab. OpenBao's Vault-UI OIDC callback is POPUP-ONLY (its
    # afterModel does an unconditional window.opener.postMessage), so any target
    # that drives the Vault-UI OIDC flow directly (the old
    # /ui/vault/auth?with=oidc deep-link, or the #3226 server-side shim) lands on
    # a top-level callback with window.opener=null → "Cannot read properties of
    # null (reading 'postMessage')" + the token form, never signed-in.
    # Repointed (#3374 fix) at the on-origin /sso/landing page (chart
    # templates/sso-landing.yaml) which runs the OIDC round-trip as a TOP-LEVEL
    # window and lands /ui/vault/secrets signed-in — the SAME flow the bare-URL
    # HTTPRoute redirect uses. The OIDC role allow-lists https://bao.<fqdn>/sso/
    # landing (sso-configure-deployment.yaml). MUST stay in lockstep with
    # platform/openbao/blueprint.yaml (check-catalog-seed-lockstep.sh).
    ssoInitPath: "/sso/landing"
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
{{/*
─────────────────────────────────────────────────────────────────────────
#3159 catalog-completeness (2026-06-09, part 2): EVERY installed bp-* app
must resolve at GET /api/v1/catalog/{name} so its operator-console catalog
page (/catalog/bp-<app>) renders — not just the curated user-facing subset.
Founder: "The catalog page is selectively created only for grafana. harbor
etc. Each and every single app must have their catalog page by default."

Before this block the seed carried ~37 CRs but a fresh Sovereign installs
~54 bp-* HelmReleases; the ~38 installed-but-unseeded apps (platform/
control-plane + bootstrap-kit plumbing) 404'd at their catalog page because
the in-cluster CR fallback (catalog_client_cluster_fallback.go) found no CR.
These are seeded `visibility: unlisted` so each app's DETAIL page resolves
(getFromCluster matches by metadata.name regardless of visibility) while
staying OUT of the user-facing apps grid (which filters on listed/public).

Every entry references a REAL published OCI chart version (probed via
`gh api /orgs/openova-io/packages/container/<pkg>/versions` AND cross-checked
against the LIVE hw124 HelmRelease chart versions). topology.supported[] +
endpoints[].name/launchDefault + sso.realm/silentLogin are copied VERBATIM
from each platform/<x>/blueprint.yaml so the catalog-seed-lockstep guard
(scripts/check-catalog-seed-lockstep.sh) stays green; runtime
{{ "{{" }}.X{{ "}}" }} tokens are Helm-escaped.

vcluster apps (bp-dmz/mgmt/rtz-vcluster, bp-vcluster-helmrepo) live at
platform/bp-<name>/ (already bp-prefixed), so `bp_short=<name>` maps to a
non-existent platform/<name>/ and the lockstep guard SKIPS them (no source)
— minimal singleton blocks are authored here for them, same as bp-continuum
and the bp-openova-flow-* pair which have no platform/<short>/blueprint.yaml.
─────────────────────────────────────────────────────────────────────────
*/}}
---
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-catalyst-platform
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    catalyst.openova.io/category: platform
    catalyst.openova.io/section: pts-1-control-plane
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  # #4432: this catalog-seed template renders INSIDE the bp-catalyst-platform
  # umbrella chart, whose version auto-increments on EVERY deploy commit
  # (products/catalyst/chart/Chart.yaml). A hard-pinned display version can
  # therefore never stay in lockstep — it re-drifts the moment the next deploy
  # bumps the umbrella. Rendering .Chart.Version makes the card ALWAYS report
  # the exact shipping umbrella version, self-maintaining by construction.
  version: {{ .Chart.Version | quote }}
  visibility: unlisted
  card:
    title: "Catalyst Platform"
    category: platform
    summary: "Umbrella Blueprint for the Catalyst control plane — console, marketplace, admin, catalog-svc, projector, provisioning, environment/blueprint controllers, billing. Once Ready the Sovereign is self-sufficient."
    description: "Umbrella Blueprint for the Catalyst control plane. Brings up the console, marketplace, admin, catalog-svc, projector, provisioning, environment-controller, blueprint-controller, and billing services. See docs/ARCHITECTURE.md §11 (Catalyst-on-Catalyst) and bootstrap-kit slot 13."
    icon: catalyst.svg
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-catalyst-platform
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-catalyst-platform
    version: {{ .Chart.Version | quote }}
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  endpoints:
    - name: console
      hostnameTemplate: "console.{{ "{{" }}.SovereignFQDN{{ "}}" }}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
    - name: api
      hostnameTemplate: "api.{{ "{{" }}.SovereignFQDN{{ "}}" }}"
      port: 443
      protocol: https
      tls: true
