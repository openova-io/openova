    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: 0.1.2
  visibility: unlisted
  class: platform-component
  lifecycle: experimental
  card:
    title: Velero (HCS)
    description: "HCS-native Velero — Kubernetes backup + disaster recovery for Huawei Cloud Sovereigns. Per ADR-0001 §13 (S3-aware app rule) writes backups DIRECTLY to Huawei OBS (S3-compatible endpoint), mirroring the Hetzner bp-velero pattern but with the `flux-system/object-storage` Secret pointing at OBS. Wave 6 follow-up to PR #2846 which suspended Hetzner-flavored bp-velero on HCS Sovereigns — this Blueprint closes the resulting backup-engine gap (#2847). "
    icon: velero-hcs.svg
    docs: https://velero.io/docs/
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        replication:
          backend: s3-bucket-replication
          mode: async
        placement:
          tier: ""
          clusters: [mgmt-A, mgmt-B, dmz-A, dmz-B, rtz-A, rtz-B]
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-velero-hcs
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-velero-hcs
    version: 0.1.2
  endpoints: []
---
apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-vllm
  labels:
    catalyst.openova.io/managed-by: catalog-seed
    catalyst.openova.io/origin: openova-public
    catalyst.openova.io/curation: openova-public
    app.kubernetes.io/managed-by: {{ $managedBy }}
    app.kubernetes.io/instance: {{ $instance }}
spec:
  version: 1.0.1
  card:
    title: vLLM
    summary: High-throughput LLM inference engine with PagedAttention. OpenAI-compatible API. GPU-accelerated when nvidia.com/gpu is available; CPU fallback for non-GPU dev Sovereigns.
    description: High-throughput LLM inference engine with PagedAttention. OpenAI-compatible API. GPU-accelerated when nvidia.com/gpu is available; CPU fallback for non-GPU dev Sovereigns.
    icon: vllm.svg
    license: Apache-2.0
    tags: [llm, inference, openai-compatible, gpu, ai]
    docs: https://docs.vllm.ai/
  visibility: listed
  class: ai-service
  lifecycle: experimental
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-vllm
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-vllm
    version: 1.0.1
  topology:
    supported: [active-active, singleton]
    defaults:
      multi-region: active-active
      single-region: singleton
    perTopology:
      active-active:
        replication:
          backend: none
          mode: none
        switchover:
          mechanism: none
        placement:
          tier: rtz
          clusters: [rtz-A, rtz-B]
          roles:
            rtz-A: active
            rtz-B: active
      singleton:
        placement:
          tier: rtz
          clusters: [rtz-A]
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: vllm.{{ "{{" }}.OrgDomain{{ "}}" }}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: "{{ "{{" }}.OrgSlug{{ "}}" }}"
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
