  version: "0.1.12"
  visibility: unlisted
  card:
    title: "Continuum"
    category: platform
    summary: "Cross-region failover orchestrator — promotes CNPG replicas, flips DNS lua-records, and drives switchover for active-hot-standby Blueprints on operator-triggered region-kill."
    icon: continuum.svg
  placementSchema:
    # #3856 — ONE canonical DR vocabulary (#3375 DoD-1): canonical
    # hyphenated `active-hot-standby` (never the banned un-hyphenated form).
    modes: [active-hot-standby]
    default: active-hot-standby
    minRegions: 2
    maxRegions: 2
  manifests:
    chart: bp-continuum
  source:
    kind: HelmRepository
    type: oci
    url: oci://ghcr.io/openova-io
    chart: bp-continuum
    version: "0.1.12"
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: none
          mode: none
        switchover:
          # CRD enum for switchover.mechanism does NOT include
          # `leader-election` (valid: bp-continuum/manual/bp-velero-restore/
          # lua-record/mm2-symmetric/ccr-promote/raft-transition/
          # sentinel-failover/none). The stateless controller's leader-flip
          # is driven by bp-continuum on region-kill, same as every other
          # active-hot-standby seed entry — the platform/<x> source's
          # informational `leader-election` value is v1alpha1-lax and fails
          # the v1 CRD admission used by the in-cluster seed (caught live on
          # hw124: the whole bp-catalyst-platform@1.4.540 upgrade aborted
          # atomically on this one invalid CR). Refs #3159.
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  endpoints: []
