{{- /*
CiliumNetworkPolicy — baseline default-deny for the catalyst-system namespace.

WHY THIS EXISTS (issue #1746, WBS row TBD-Cov-12 / C12-009)
─────────────────────────────────────────────────────────────────────
Cov-bench audit confirmed that the live Sovereign cluster ships only 2
CiliumNetworkPolicies cluster-wide, and ZERO of them target the two
namespaces that carry the public-facing traffic plane:
  - catalyst-system (catalyst-api, catalyst-ui, marketplace-api,
    organization-controller, sme-orchestrator) — every public Console
    hit lands here.
  - kube-system (the cilium-gateway Gateway resource + Cilium DaemonSet
    that terminates *.<sovereignFQDN>) — every public request enters
    here before it is fanned out to backends.

Without a baseline default-deny CNP scoped to catalyst-system, the
matrix row C12-009 fails (no namespaced CNP coverage on the primary
traffic plane) AND any compromised Pod in catalyst-system can reach
arbitrary in-cluster Pods via L3/L4 east-west traffic.

DESIGN — defense-in-depth, two-tier
─────────────────────────────────────────────────────────────────────
This template renders TWO CiliumNetworkPolicies:

  1. `baseline-default-deny` — a default-deny CNP with empty
     endpointSelector ({}) matching every Pod in catalyst-system.
     The rule set defines an explicit (but minimal) allow list:
       - ingress from the cilium-gateway endpoint in kube-system
         (the HTTPRoute → backend Service traffic path; without
         this every public-facing API + UI returns 403 at the
         envoy gateway because L7-policy denies forwarding)
       - ingress from same-namespace Pods (controllers ↔ APIs,
         sme-orchestrator ↔ catalyst-api intra-control-plane
         calls)
       - egress to kube-apiserver (every controller informer)
       - egress to kube-dns (every Pod resolves DNS)
       - egress to same-namespace (intra-control-plane)
       - egress to platform namespaces that catalyst-system
         legitimately needs to reach: keycloak (OIDC), gitea
         (Application gitops pulls), powerdns (DNS record CRUD),
         cnpg-system (smePostgres connection), openbao (secrets),
         harbor (registry pulls), nats-system (event bus),
         observability (loki/mimir/tempo/alloy), mgmt (#2745 —
         loki/mimir/tempo run INSIDE the mgmt vCluster; their
         host-side synced Service endpoints are Pods in host ns
         `mgmt`, e.g. the CATALYST_MIMIR_URL query-frontend).
     Anything else is dropped. This is the "namespaced CNP only"
     posture the issue prescribed — no CiliumClusterwideNetworkPolicy.

DESIGN — mirror the working external-dns + qa-fixtures patterns
─────────────────────────────────────────────────────────────────────
This baseline mirrors the structure of the two CNPs that already work
in production:
  - platform/external-dns/chart/templates/ciliumnetworkpolicy.yaml
    (bp-external-dns-apiserver — toEntities: [kube-apiserver])
  - products/catalyst/chart/templates/qa-fixtures/
    cilium-network-policies.yaml (the qaFixtures bundle — same
    namespace-scoped allow patterns, same toEntities egress, same
    label conventions)

The chart-render is GATED on `.Values.security.baselineCnp.enabled`
(default true) so operators may disable the baseline if they ship
their own policy bundle. Per Inviolable Principle #4 (never hardcode),
the platform-namespace allow list is operator-tunable via
`.Values.security.baselineCnp.allowedPlatformNamespaces`.

OPERATING CONVENTION
─────────────────────────────────────────────────────────────────────
This CNP IS independent of the qaFixtures bundle. qaFixtures ships a
cluster-wide default-deny + per-tenant allow templates aimed at the
qa-omantel test matrix. This baseline-default-deny CNP ships
unconditionally on every Sovereign and protects catalyst-system even
when qaFixtures is disabled.
*/}}
{{- if .Values.security.baselineCnp.enabled }}
{{- /* #2745: "mgmt" added — loki/mimir/tempo re-homed INSIDE the mgmt
     vCluster; their synced host-side endpoints (the Pods backing
     <svc>-x-<ns>-x-mgmt-vcluster Services) live in host ns `mgmt`.
     The plain loki/mimir/tempo entries stay for Sovereigns that keep
     the host-side placement via per-Sovereign overlay. */}}
{{- /* #3859: ns `sme` → `org-services` (#3383). org-services hosts the
     BSS/funnel control-plane Deployments; the legacy `sme` entry stays one
     release for back-compat / any not-yet-migrated Sovereign. */}}
{{- $allowedPlatform := .Values.security.baselineCnp.allowedPlatformNamespaces | default (list "keycloak" "gitea" "powerdns" "cnpg-system" "openbao" "harbor" "nats-system" "loki" "mimir" "tempo" "alloy" "opentelemetry" "external-secrets-system" "cert-manager" "org-services" "sme" "newapi" "mgmt") }}
{{- /* #3934 (Refs #3642): "mgmt" added to the INGRESS allow-list. The #3642
     host-bridge promotes guacamole INTO the mgmt vCluster — its webapp Pod
     now runs in host ns `mgmt` (synced `guacamole-server-x-catalyst-system-x-
     mgmt-vcluster`) while its CNPG DB `guacamole-pg` stays host-rendered in
     `catalyst-system`. With `mgmt` absent here this baseline default-deny
     dropped the webapp→guacamole-pg:5432 connection → the postgresql auth
     provider halted → /guacamole/api/session 403, blank page (caught live
     hw171 2026-06-19). gitea-pg / harbor-pg sit in their OWN host namespaces
     (gitea/harbor), already in $allowedPlatform's EGRESS list, so this single
     INGRESS add covers the only DB that re-homed to catalyst-system. */}}
{{- $allowedIngressNs := .Values.security.baselineCnp.allowedIngressNamespaces | default (list "catalyst" "flux-system" "kube-system" "oidc-gate" "mgmt") }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: baseline-default-deny
  namespace: catalyst-system
  labels:
    openova.io/managed-by: catalyst-baseline
    openova.io/policy-tier: baseline
    catalyst.openova.io/component: baseline-cnp
  annotations:
    policies.openova.io/title: Catalyst-System Baseline Default-Deny
    policies.openova.io/description: |
      Default-deny baseline for the catalyst-system namespace. Allows
      explicit ingress from cilium-gateway (kube-system) + same-namespace,
      and explicit egress to kube-apiserver, kube-dns, same-namespace, and
      the platform namespaces catalyst-system legitimately needs to reach.
spec:
  description: "Baseline default-deny for catalyst-system — allow gateway ingress + control-plane egress only."
  endpointSelector: {}
  ingress:
    # 1. Allow ingress from cilium-gateway in kube-system. Every public
    #    Console / API / Admin / Marketplace request enters via the
    #    Cilium Gateway listener (port 30443) in kube-system and is
    #    forwarded to a Service in catalyst-system via HTTPRoute. The
    #    selector matches the gateway endpoint labelled by Cilium with
    #    `reserved.ingress: ""`. Without this allow, all public traffic
    #    is dropped at the catalyst-system ingress hook even though
    #    envoy itself accepted the request.
    - fromEndpoints:
        - matchLabels:
            reserved.ingress: ""
    # 2. Allow ingress from same-namespace Pods (catalyst-api ↔
    #    catalyst-ui, sme-orchestrator ↔ catalyst-api, organization-
    #    controller ↔ catalyst-api etc. — all intra-control-plane).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: catalyst-system
    # 3. Allow ingress from kube-system (Cilium operator probes, kubelet
    #    liveness checks via host-network on the same node). Without
    #    this, readiness + liveness probes from the kubelet (host
    #    identity) are dropped and Pods loop-restart.
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
    # 4. Allow ingress from operator-tunable adjacent namespaces.
    #    Defaults cover three load-bearing senders:
    #
    #      - `catalyst` (the cutover namespace) — the
    #        bp-self-sovereign-cutover chart stamps Jobs into this
    #        namespace, INCLUDING the 10-auto-trigger Job whose Pod
    #        curls `catalyst-api.catalyst-system.svc.cluster.local:8080`
    #        to fire /api/v1/internal/cutover/trigger. Without this
    #        allow the auto-trigger Pod cannot reach the API service,
    #        the trigger never fires, handoverFiredAt stays null, and
    #        D0 auto-redirect to the Sovereign Console never happens —
    #        the operator is stuck on mothership /jobs forever
    #        (regression caught by t24 zero-touch verification, fresh
    #        prov 2026-05-18).
    #
    #      - `flux-system` (the Flux controllers) — Helm Controller,
    #        Kustomize Controller, and Source Controller probe the
    #        backend Services they reconcile (e.g. catalyst-api
    #        readinessProbes for HelmRelease health rollups). Pre-#1785
    #        this worked implicitly because no CNP existed.
    #
    #      - `kube-system` (the Cilium operator + kube-proxy + CCM) —
    #        beyond the kubelet-host probes already covered by
    #        rule 3, kube-system Pods (cilium-operator, hcloud-ccm,
    #        coredns recursive probes) need to be allowed for cluster
    #        introspection. The reserved.ingress endpoint that handles
    #        public traffic is also in kube-system but is matched by
    #        rule 1's `reserved.ingress: ""` selector — this rule
    #        covers the non-gateway kube-system Pods.
    #
    #      - `oidc-gate` (the bp-oidc-gate auth-proxy host namespace,
    #        placement.yaml slot 13c, #3374) — the per-app oauth2-proxy
    #        Pods front the host-Gateway routes for zero-click SSO and
    #        reverse-proxy authenticated traffic to their upstream
    #        Service. openova-flow's gate
    #        (`--upstream=http://openova-flow-server.catalyst-system.
    #        svc.cluster.local:80`) lives in `oidc-gate` and dials
    #        flow-server in catalyst-system. Without this allow the
    #        ingress hook on every catalyst-system upstream drops the
    #        proxied request → oidc-gate authenticates the User but
    #        every page 502s (upstream timeout). Regression caught on
    #        hw133 (#813, fresh prov 2026-06-14): SSO callback
    #        succeeded but openova-flow never served because the
    #        ClusterIP Service AND the direct pod-IP both timed out
    #        from oidc-gate — same isolation class as the sme→NATS
    #        block (#3423).
    #
    #    Operators may extend or shrink this list via
    #    `.Values.security.baselineCnp.allowedIngressNamespaces`.
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
{{- range $allowedIngressNs }}
                - {{ . | quote }}
{{- end }}
  egress:
    # 1. kube-apiserver — every controller informer (organization,
    #    application, environment, useraccess, blueprint, tenant)
    #    watches the apiserver. Same pattern as
    #    bp-external-dns-apiserver.
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
    # 2. kube-dns — every Pod resolves DNS for service discovery and
    #    external API calls (powerdns, keycloak, gitea).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # 3. Same-namespace egress (intra-control-plane).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: catalyst-system
    # 4. Platform namespaces — operator-tunable list. Defaults cover
    #    every namespace catalyst-system legitimately reaches in a
    #    canonical Sovereign install.
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
{{- range $allowedPlatform }}
                - {{ . | quote }}
{{- end }}
    # 5. World egress — catalyst-api MAY call out to public APIs
    #    (Dynadot for parent-domain registration, S3 for backup seed,
    #    GitHub for blueprint fetch, ghcr/harbor pulls) on TCP/443
    #    AND submit PIN-issue / notification emails to the operator
    #    Stalwart SMTP relay (mail.openova.io) over TCP/587
    #    (submission, the production path) with TCP/465 (SMTPS) and
    #    TCP/25 (legacy SMTP) as fallbacks
    #    AND reach SECONDARY-REGION kube-apiservers on TCP/6443 for
    #    multi-region fan-out (D5/D16/D20 cloud-nodes treemap dashboard).
    #
    #    Regression context — DO NOT NARROW THIS BLOCK WITHOUT REVIEW
    #    ────────────────────────────────────────────────────────────
    #    The original CNP (chart 1.4.171, PR #1785) allowed only
    #    443/TCP world. The catalyst-api PIN-issue handler reaches
    #    mail.openova.io:587 to send the verification email at
    #    customer-journey step 11/12 — that call timed out as soon
    #    as this CNP rolled out, surfacing as a 502 at
    #    /api/v1/auth/pin-request and blocking every fresh onboarding
    #    flow. Diagnostic evidence: a catalyst-system Pod cannot
    #    `nc 45.151.123.50 587` (timeout) while a default-namespace
    #    Pod on the SAME node connects fine (220 Stalwart ESMTP banner).
    #    See chart 1.4.177 changelog above and the fix PR body.
    #
    #    TCP/6443 regression context — issue #1908 (TBD-A45)
    #    ────────────────────────────────────────────────────────────
    #    After PRs #1579/#1580/#1581/#1800 implemented multi-region
    #    fan-out, `/api/v1/sovereign/cloud?kind=nodes` (D5),
    #    `/api/v1/sovereign/dashboard` (D16), and per-region jobs
    #    queries (D20) all returned PRIMARY-ONLY results on a fresh
    #    multi-region prov (t31, 3 regions). A152 diagnostic isolated
    #    the cause:
    #
    #      kubectl -n catalyst-system exec deploy/catalyst-api -- \
    #        nc -zvw 3 49.12.210.78 6443
    #      nc: connect to 49.12.210.78 port 6443 (tcp) timed out
    #
    #    while the SAME endpoint from the bastion connected fine.
    #    The k8sCache.Factory registered the secondary-region API
    #    servers from the kubeconfig PVC but the informer reflector
    #    silently failed on the first apiserver List() because this
    #    baseline CNP blocked egress to non-443 world. Fan-out
    #    returned len(clusters)==1 (primary only) and the dashboard
    #    silently grouped everything under the primary region.
    #
    #    The inter-region apiserver path matches the OpenOva
    #    ClusterMesh model (memory: "inter-region link = DMZ
    #    WireGuard over PUBLIC IPs ALWAYS") — every secondary
    #    api-server is reachable only over its public LB IP (Hetzner
    #    or AWS or Huawei). FQDN-scoping is impractical because the
    #    LB FQDNs are per-prov (`api.<region>.<sovereign-fqdn>`) and
    #    not predictable at chart-render time; world-on-6443 matches
    #    the public-IP exposure surface the ClusterMesh already
    #    requires. Attack surface is bounded — :6443 only accepts
    #    TLS client-cert-authenticated requests, and only the
    #    secondary-region kubeconfigs (mounted on the catalyst-api
    #    Pod's PVC) hold valid client certs.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "587"
              protocol: TCP
            - port: "465"
              protocol: TCP
            - port: "25"
              protocol: TCP
            - port: "6443"
              protocol: TCP
{{- end }}
