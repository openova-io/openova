apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalyst-ui
  labels:
    app.kubernetes.io/name: catalyst-ui
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  # #6079 (2026-08-11): explicit maxUnavailable so a 1-replica Deployment can
  # actually roll on a node with no spare Pod slot. The k8s DEFAULT strategy is
  # RollingUpdate{maxSurge: 25%, maxUnavailable: 25%}, and those percentages
  # round in OPPOSITE directions against replicas=1:
  #     maxSurge       = ceil (0.25 * 1) = 1   -> the new Pod IS created
  #     maxUnavailable = floor(0.25 * 1) = 0   -> the old Pod may NEVER leave
  # so the roll demands two Pods at once. On the mothership (kubelet maxPods=110,
  # 110 non-terminal Pods bound) the replacement Pod sat Unschedulable "Too many
  # pods" while the old Pod could not be evicted to make room for it: catalyst-ui
  # served fad88bd for ten days while its spec advanced to 5f40184 then e6c1533,
  # stuck in ProgressDeadlineExceeded, holding bp-catalyst-platform in Progressing
  # and UAT rows W1/W2 red. Reaping dead Pods does NOT help — terminal Pods hold
  # no scheduling slot (measured: deleting all 3 Succeeded Pods left Running
  # pinned at 110 and Pending at 7).
  # maxUnavailable: 1 lets the controller scale the old ReplicaSet to 0 first, so
  # the roll frees the very slot it needs and requires ZERO spare capacity.
  # Preferred over `type: Recreate` (used by the catalyst-api sibling, which needs
  # it for its RWO EVS PVC) because catalyst-ui is stateless: keeping
  # RollingUpdate means that if the replica count ever grows this rolls gracefully
  # instead of taking a full outage on every deploy.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalyst-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalyst-ui
        policy.cilium.io/enforced: "true"  # Wave 5.121 #2466 — kyverno cilium-l7-mtls policy
    spec:
      # #6079 follow-up (2026-08-11): keep in lockstep with the Kustomize
      # sibling (ui-deployment-kustomize.yaml), which carries the full
      # rationale. Short version: the strategy above lets the old Pod leave
      # first, but on a node at its max-pods cap the freed slot goes to the
      # highest-priority pending Pod. catalyst-ui ran at priority 0 while
      # catalyst-api carried catalyst-control-plane (1e8), so the console lost
      # every race and sat Pending for 8 days, serving /sovereign as a Traefik
      # 503. The console is control plane and must outrank reschedulable
      # co-tenant Pods (#4231 rationale).
      # Same expression api-priorityclass.yaml uses to NAME the object, so an
      # operator overriding catalystApi.priorityClassName cannot leave this
      # reference dangling at a class that was never rendered.
      priorityClassName: {{ .Values.catalystApi.priorityClassName | default "catalyst-control-plane" }}
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: catalyst-ui
          # G61-followup #4563 (2026-06-27): templated image ref so
          # Sovereign-Helm honours `global.imageRegistry` override.
          # Post-cutover step-07 patches HelmRelease.spec.values.global.
          # imageRegistry = registry.<sovereign-fqdn> on bp-catalyst-
          # platform → this catalyst-ui Pod restarts pulling through the
          # local Harbor (image natively pushed there by cutover step-03
          # harbor-prewarm). Pre-#4563 the literal `ghcr.io/...` ref did
          # NOT honour the pivot, so under the 600s deny-egress hold the
          # ghcr.io ref's anonymous-token fetch was blocked → 401
          # ImagePullBackOff → step-08 fresh-pull proof FATALed.
          # Mirrors api-deployment.yaml L219.
          #
          # Contabo-mkt Kustomize path consumes ui-deployment-kustomize.
          # yaml (literal ghcr.io ref, .helmignore'd from the Sovereign
          # bundle) because kustomize-controller can't render Helm
          # templates. CI auto-bumps both the literal in the kustomize
          # file AND the values.yaml `images.catalystUi.tag` so contabo
          # and Sovereigns roll together.
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}{{ else }}{{ .Values.images.registry }}{{ end }}/{{ .Values.images.organization }}/catalyst-ui:{{ .Values.images.catalystUi.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
