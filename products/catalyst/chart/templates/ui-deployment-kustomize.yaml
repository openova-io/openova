# G61-followup #4563 (Refs #2612 #4563, 2026-06-27): Kustomize-mode
# sibling of ui-deployment.yaml. Contabo-mkt applies this via raw
# Kustomize (kustomize-controller does not render Helm templates). The
# Helm sibling (ui-deployment.yaml) uses {{ .Values.global.imageRegistry }}
# so Sovereign-Helm honours the post-cutover registry override.
#
# This file uses a literal `ghcr.io/...` image ref so Kustomize on
# contabo applies it unchanged. CI auto-bumps the literal here AND the
# values.yaml `images.catalystUi.tag` so contabo + Sovereigns roll to
# the same SHA. Same Kustomize-vs-Helm split pattern as
# api-deployment-kustomize.yaml (issue #2612).
#
# Kept out of the Helm-rendered bundle via .helmignore.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalyst-ui
  labels:
    app.kubernetes.io/name: catalyst-ui
    app.kubernetes.io/component: frontend
  annotations:
    # REQUIRED here, not merely mirrored from the Helm sibling: this is
    # the file contabo-mkt (the mothership) actually applies, and its
    # live catalyst-ui Deployment already carries the default
    # RollingUpdate block. Applying `strategy: Recreate` over it fails
    # validating admission with
    #   spec.strategy.rollingUpdate: Forbidden:
    #     may not be specified when strategy `type` is 'Recreate'
    # unless Flux is told to force-replace the object. See the identical
    # block in api-deployment-kustomize.yaml, docs/CHART-AUTHORING.md
    # §"Strategy flips on existing Deployments", and the CI fixture
    # tests/integration/strategy-flip.yaml.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate (#6157). For `replicas: 1`
  # Kubernetes rounds maxSurge UP (25% -> 1) and maxUnavailable DOWN
  # (25% -> 0); maxUnavailable=0 forbids retiring the old Pod before the
  # new one is Ready, so the roll needs a second Pod slot. On the
  # mothership's single node at its 110-Pod ceiling that slot never
  # appears, so from 2026-08-03 to 2026-08-11 the new Pod stayed Pending
  # ("Too many pods") and the console served an 8-day-old bundle while
  # the Deployment reported Available=True. Kept byte-identical in
  # intent to the Helm sibling (ui-deployment.yaml) so contabo and
  # Sovereigns roll the same way.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: catalyst-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalyst-ui
        policy.cilium.io/enforced: "true"  # Wave 5.121 #2466 — kyverno cilium-l7-mtls policy
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: catalyst-ui
          # Literal image ref — required for the contabo-mkt Kustomize
          # path (kustomize-controller doesn't render Helm templates).
          # Auto-bumped by .github/workflows/catalyst-build.yaml's deploy
          # step on every push to main, so contabo rolls to the latest
          # catalyst-ui SHA. Sovereigns consume the Helm sibling.
          image: "ghcr.io/openova-io/openova/catalyst-ui:d8aac60"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
