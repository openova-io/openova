# 7/19 — disallow-capabilities
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-capabilities
  labels:
    openova.io/managed-by: qa-fixtures
    pod-security.kubernetes.io/profile: baseline
spec:
  validationFailureAction: {{ $auditMode }}
  background: true
  rules:
    - name: capabilities
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
{{- range $ns := $excludedNamespaces }}
          - resources:
              namespaces: [{{ $ns | quote }}]
{{- end }}
      validate:
        message: "Adding Linux capabilities beyond the baseline set is forbidden."
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                all:
                  - key: "{{`{{ element.securityContext.capabilities.add[] || [] }}`}}"
                    operator: AnyNotIn
                    value:
                      - AUDIT_WRITE
                      - CHOWN
                      - DAC_OVERRIDE
                      - FOWNER
                      - FSETID
                      - KILL
                      - MKNOD
                      - NET_BIND_SERVICE
                      - SETFCAP
                      - SETGID
                      - SETPCAP
                      - SETUID
                      - SYS_CHROOT
---
