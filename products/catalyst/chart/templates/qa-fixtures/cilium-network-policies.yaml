{{- if .Values.qaFixtures.enabled }}
{{- /*
  Cilium NetworkPolicy baseline for the qa-omantel matrix
  (qa-loop iter-11 Fix #48). Ships:

    1. CiliumClusterwideNetworkPolicy `default-deny` — deny ALL
       ingress + egress at the cluster scope. The matrix asserts
       on TC-278 (`default-deny`, `Ingress`, `Egress` tokens) +
       TC-280 (egress to `blocked.example.com` blocked → timeout).
       Excludes platform namespaces that legitimately egress
       (kube-system, cilium, flux-system, catalyst-system, …) so
       the platform itself stays reachable.

    2. Per-namespace CiliumNetworkPolicy "allow templates" in
       qa-omantel that re-grant specific egresses (DNS, Keycloak,
       NATS, Postgres) for the qa-wp Application. The matrix
       asserts on TC-279 (`CiliumNetworkPolicy` token) + TC-294
       (>=10 CNPs total across all namespaces).

  Per `feedback_no_mvp_no_workarounds.md` rule #1 (target-state)
  this ships a real default-deny baseline + working allow
  templates — NOT a placeholder file with TODO comments. Operators
  who want fewer policies disable the bundle by flipping
  `qaFixtures.networkPolicies.enabled` to false.
*/ -}}
{{- /*
  catalyst — bp-self-sovereign-cutover ships Jobs into this NS that legitimately
  call catalyst-api.catalyst-system.svc (auto-trigger, gitea-mirror, harbor-projects,
  registry-pivot, etc.). Without inclusion, the default-deny CCNP blocks them and
  bp-catalyst-platform's --wait never completes. Caught on prov #72 (omantel.biz):
  auto-trigger Job stuck 20m on "catalyst-api not ready HTTP 000000" (DNS+egress denied).
  newapi — bp-newapi ships an Application namespace whose pods need DNS/apiserver.
*/ -}}
{{- /*
  #4657 (2026-06-30): huawei-evs-csi + dragonfly + org-services were MISSING — on a
  qaTestEnabled prov this default-deny denied the EVS CSI provisioner egress to the
  apiserver → catalyst-api PVCs never bind → catalyst-api Pending → handover/cutover
  never fire (the exact wedge on cutover-validation provs; NOT a Cilium MTU bug — this
  policy only exists on qaFixtures provs, which is why production never hit it). Storage
  CSI drivers + the Dragonfly registry layer + the org-services provisioning plane are
  platform infra that legitimately need apiserver/DNS egress. (hcloud-csi / other-provider
  CSI namespaces belong here too if a provider runs its CSI in a dedicated ns.)
*/ -}}
{{- $excludedNamespaces := list "kube-system" "cilium" "flux-system" "catalyst-system" "catalyst" "newapi" "kyverno" "openbao" "keycloak" "gitea" "powerdns" "external-dns" "external-secrets-system" "cert-manager" "harbor" "grafana" "loki" "mimir" "tempo" "alloy" "opentelemetry" "trivy-system" "syft-grype" "sigstore-system" "falco" "vpa" "cluster-autoscaler" "cnpg-system" "valkey" "nats-system" "velero" "guacamole" "coraza" "crossplane-system" "huawei-evs-csi" "dragonfly" "org-services" }}
{{- $qaNs := .Values.qaFixtures.namespace | default "qa-omantel" }}
{{- if .Values.qaFixtures.networkPolicies.enabled | default true }}
---
# 1/12 — Default-deny baseline (CiliumClusterwideNetworkPolicy)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
  labels:
    openova.io/managed-by: qa-fixtures
    openova.io/policy-tier: baseline
    pod-security.kubernetes.io/profile: baseline
  annotations:
    policies.kyverno.io/title: Default-Deny Cluster-Wide
    policies.kyverno.io/description: |
      Deny ALL ingress + egress traffic at the cluster scope, except
      for platform namespaces that legitimately need egress (DNS,
      registry, observability backplane). Sovereign-internal traffic
      flows through per-namespace allow templates that re-grant the
      specific scopes each Application needs.
spec:
  description: "Default-deny baseline; allow templates re-grant specific scopes."
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
{{- range $excludedNamespaces }}
          - {{ . | quote }}
{{- end }}
  ingress:
    - {}
  egress:
    - {}
---
# 1b/12 — Allow external traffic into Cilium Gateway (reserved:ingress).
#
# Root cause: Cilium Gateway API (gatewayAPI.hostNetwork.enabled=true)
# creates a special endpoint with identity `reserved:ingress` (8) that
# represents the gateway listener. By default this endpoint has
# policy-enabled=both, allowed-ingress-identities=[1 (host)], and an
# empty L4 rule set — i.e. world traffic that arrives at the gateway
# is dropped by cilium.l7policy with a 403 "Access denied" before any
# HTTPRoute is evaluated.
#
# Symptom: every public Sovereign host (console, auth, gitea, api, …)
# returns `HTTP/1.1 403 Forbidden` body=`Access denied` server=envoy
# even though the HTTPRoutes are Programmed, the Gateway is Accepted,
# and the backend services are healthy in-cluster. Caught live on
# prov #80 (omantel.biz, 2026-05-14): TLS handshake OK with the
# correct cert, envoy reachable on :30443, but every request 403'd.
# Confirmed via `cilium-dbg endpoint get 3282 -o json` showing
# `l4.ingress: []` and `allowed-ingress-identities: [1]` only.
#
# Fix: a CCNP scoped to the `reserved:ingress` endpoint that allows
# ingress from `world`, `cluster`, `host`, `remote-node` (multi-region
# CP-to-CP), and `kube-apiserver`, plus egress to `all` so envoy can
# forward to any backend service. This is the canonical Cilium pattern
# for hostNetwork Gateway-API zero-trust — without it the gateway
# becomes a black hole the moment a default-deny CCNP is present.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-gateway-world-ingress
  labels:
    openova.io/managed-by: qa-fixtures
    openova.io/policy-tier: gateway-allow
spec:
  description: "Allow world + cluster traffic to reach the Cilium Gateway listener; default-deny would otherwise drop all public requests at the gateway."
  endpointSelector:
    matchLabels:
      reserved.ingress: ""
  ingress:
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
        - kube-apiserver
  egress:
    - toEntities:
        - all
---
# 2/12 — qa-omantel: allow DNS egress (kube-dns)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ $qaNs }}
  labels:
    openova.io/managed-by: qa-fixtures
    openova.io/policy-tier: allow-template
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
