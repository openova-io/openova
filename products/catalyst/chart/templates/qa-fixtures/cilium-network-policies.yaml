---
# 6/12 — qa-omantel: allow Harbor egress (registry pulls)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-harbor
  namespace: {{ $qaNs }}
  labels:
    openova.io/managed-by: qa-fixtures
    openova.io/policy-tier: allow-template
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: harbor
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# 7/12 — qa-omantel: allow Loki/Mimir/Tempo (observability)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-observability
  namespace: {{ $qaNs }}
  labels:
    openova.io/managed-by: qa-fixtures
    openova.io/policy-tier: allow-template
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values: ["loki", "mimir", "tempo", "alloy", "opentelemetry"]
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "4317"
              protocol: TCP
---
# 8/12 — qa-omantel: allow OpenBao (secret fetch via External Secrets)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-openbao
  namespace: {{ $qaNs }}
  labels:
    openova.io/managed-by: qa-fixtures
    openova.io/policy-tier: allow-template
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
# 9/12 — qa-omantel: allow Gitea (Application-controller flux pulls)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gitea
  namespace: {{ $qaNs }}
  labels:
    openova.io/managed-by: qa-fixtures
    openova.io/policy-tier: allow-template
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: gitea
      toPorts:
