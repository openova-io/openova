# 10b/12 — qa-omantel: allow egress to kube-apiserver entity.
#
# Without this rule cnpg initdb pods (cluster-primary-1-initdb,
# cluster-replica-1-initdb) timeout on `dial tcp 10.43.0.1:443:
# i/o timeout` when running `kubectl get cluster.postgresql.cnpg.io`,
# which CNPG uses to bootstrap a Cluster's primary. The kube-proxy-
# replacement Cilium eBPF redirects ClusterIP 10.43.0.1 → CP node
# 10.0.1.2:6443, but the egress L3/L4 enforcement still requires
# explicit allow. `toEntities: [kube-apiserver]` is Cilium's
# canonical way to express "allow egress to the kube-apiserver"
# regardless of whether it's a Service VIP, ClusterIP, or node IP.
# Caught on prov #72: cluster-primary stuck "Setting up primary"
# for 18m, catalyst-platform --wait never completed → cutover Job
# never fires → handover blocked.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-apiserver
  namespace: {{ $qaNs }}
  labels:
    openova.io/managed-by: qa-fixtures
    openova.io/policy-tier: allow-template
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
---
# 11/12 — qa-omantel: cilium-gateway ingress (catalyst-system)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: {{ $qaNs }}
  labels:
    openova.io/managed-by: qa-fixtures
    openova.io/policy-tier: allow-template
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qa-wp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: catalyst-system
            app.kubernetes.io/name: cilium-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# 12/12 — dmz: isolation policy (default-deny inside the dmz namespace
# WHEN the bp-dmz-vcluster slot is installed; otherwise this is just
# a no-op CNP with no targets in the cluster). Matrix asserts on
# TC-287 (`isolation`, `CiliumNetworkPolicy` tokens). Ships under
# qaFixtures so the policy text is reviewable + Flux-managed.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: isolation
  namespace: dmz
  labels:
    openova.io/managed-by: qa-fixtures
    openova.io/policy-tier: dmz-isolation
  annotations:
    policies.openova.io/description: |
      DMZ isolation: deny all egress from the dmz namespace except
      to the designated egress gateway. Re-engage when bp-dmz-vcluster
      is installed and the egressgw IP/CIDR is wired into the
      .spec.egress[].toCIDRSet block via per-Sovereign overlay.
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: catalyst-system
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: dmz
{{- end }}
