spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: nats-system
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
---
# 5/12 — qa-omantel: allow CNPG egress (postgres)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cnpg
  namespace: {{ $qaNs }}
  labels:
