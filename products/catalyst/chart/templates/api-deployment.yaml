apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalyst-api
  labels:
    app.kubernetes.io/name: catalyst-api
    app.kubernetes.io/component: api
  annotations:
    # `kustomize.toolkit.fluxcd.io/force: enabled` is the durable
    # remediation for the `RollingUpdate -> Recreate` strategy-flip
    # collision documented in docs/CHART-AUTHORING.md §"Strategy flips
    # on existing Deployments".
    #
    # Failure mode this addresses
    # ---------------------------
    # On 2026-04-29 the `catalyst` Flux Kustomization on contabo-mkt
    # stuck at Ready=False with:
    #
    #   Deployment.apps "catalyst-api" is invalid:
    #     spec.strategy.rollingUpdate: Forbidden:
    #       may not be specified when strategy `type` is 'Recreate'
    #
    # Root cause: the live Deployment had been previously created with
    # the default `RollingUpdate` strategy (so `rollingUpdate.maxSurge=25%`
    # and `maxUnavailable=25%` were present on the live object, owned
    # by the `kubectl-client-side-apply` field manager). Flux's
    # kustomize-controller submits this manifest via Server-Side Apply
    # with field manager `kustomize-controller`. SSA's contract is
    # "set the fields you declare" — it does NOT remove fields owned
    # by other managers. Result: post-merge object had `type: Recreate`
    # AND the residual `rollingUpdate.*` block, which the API server's
    # validator rejects as invalid (Recreate forbids any rollingUpdate
    # keys). SSA is REQUIRED to reject the merge. No SSA-only chart
    # change can fix this.
    #
    # Why `$patch: replace` does NOT solve this
    # -----------------------------------------
    # The Strategic Merge Patch directive `$patch: replace` would tell
    # an SMP-aware merger to REPLACE the strategy block instead of
    # merging into it. But:
    #   - SSA rejects `$patch` outright with "field not declared in
    #     schema" (it's not in apps/v1 Deployment).
    #   - kubectl strict-decoding rejects `$patch` on CREATE under any
    #     mode with "unknown field spec.strategy.$patch" — so adding
    #     it to the chart manifest BREAKS fresh installs.
    # `$patch: replace` is a runtime SMP directive, never a chart-spec
    # value. It belongs in a Kustomize `patches:` entry (where the
    # kustomize binary consumes it at build time and emits a clean
    # output) — never inline in a base resource.
    #
    # Why the Flux force annotation IS the right fix
    # ----------------------------------------------
    # When kustomize-controller's SSA submission fails dry-run with an
    # Invalid response, this annotation directs the controller to
    # recover by deleting and recreating THIS resource specifically
    # (not the whole Kustomization). The recreated Deployment has no
    # residual `rollingUpdate.*` fields — the regression cannot
    # recur on the rebuilt object.
    #
    # That is NOT a "kubectl delete bandaid": the annotation is part
    # of the IaC manifest, version-controlled, applied declaratively
    # via Flux on every reconciliation, scoped to this single
    # Deployment, and removed only by editing the chart. Per
    # docs/INVIOLABLE-PRINCIPLES.md #3 (Follow the documented
    # architecture, exactly — Flux is the ONLY GitOps reconciler) and
    # #4 (Never hardcode — runtime configuration in Git, not in shell
    # history): the remediation lives in source control.
    #
    # Why this Deployment in particular tolerates a recreate: the
    # spec declares `strategy.type: Recreate`, so the steady-state
    # update path is delete-and-recreate anyway. Flux falling back to
    # delete-and-recreate on a strategy-flip is a no-op relative to a
    # normal pod-spec change. The deployments PVC is ReadWriteOnce;
    # the recreate flow detaches it from the old Pod before mounting
    # it on the new one, which is exactly the contract `Recreate`
    # enforces. State persistence is maintained because the PVC
    # itself is NOT recreated by this annotation — only the
    # Deployment resource is.
    kustomize.toolkit.fluxcd.io/force: enabled
    # Reloader watches the sovereign-fqdn + handover-jwt-public ConfigMaps/Secrets
    # this Pod reads via valueFrom. On Sovereigns, those resources are applied
    # by the sovereign-tls Kustomization concurrently with the bp-catalyst-platform
    # HelmRelease. If the Pod started first, optional valueFrom resolves to ""
    # and SOVEREIGN_FQDN stays empty for the lifetime of the Pod — every handover
    # then fails the audience check with 401 "invalid audience" (caught live on
    # otech62, 2026-05-03). Reloader rolls the Deployment when those resources
    # land, fixing the race without requiring strict Flux dependsOn ordering.
    # provisioning-github-token added (#3122): same pattern — the gitea-PAT mirror
    # populates GITHUB_TOKEN only after the PAT mint (a later Flux reconcile), so the
    # Pod must restart then to pick up CATALYST_GITOPS_TOKEN, else Org-creation
    # (POST /sme/tenants) fails "gitops token unconfigured" (caught live hw104 2026-06-08).
    # catalyst-pin-broker-credentials added (#5277): SAME race, cold-SSO edition.
    # CATALYST_PIN_BROKER_CLIENT_SECRET reads that reflector-mirrored Secret via an
    # optional valueFrom; when catalyst-api starts (or is rolled by the cutover
    # catalyst-api-env-patch step) before the Secret lands, the value resolves ""
    # and main.go silently skips the whole /oidc/* provider route set for the
    # Pod's lifetime. Keycloak's cold catalyst-pin broker roundtrip then 404s
    # ("Unexpected error when authenticating with identity provider"); warm SSO
    # (an existing realm session, which skips the broker) is unaffected — the exact
    # hw278 signature across harbor/openbao/guacamole/pdns-admin/hubble. Reloader
    # rolls the Pod when the Secret is reflected, so the routes wire on the restart.
    configmap.reloader.stakater.com/reload: "sovereign-fqdn"
    secret.reloader.stakater.com/reload: "handover-jwt-public,provisioning-github-token,catalyst-pin-broker-credentials"
spec:
  replicas: 1
  # Recreate strategy is required because the deployments PVC is RWO
  # (single-attach). A rolling update would try to schedule a second
  # Pod that mounts the same PVC, which Kubernetes rejects as a
  # MultiAttachError. RWX with a multi-writer-aware filesystem
  # (NFS, CephFS) is the path to HA, but Catalyst-Zero today is
  # single-replica by design — the wizard is interactive and PDM owns
  # cross-tenant isolation, so a single API server is sufficient.
  #
  # The strategy-flip regression that bit contabo-mkt on 2026-04-29
  # (apply over a pre-existing RollingUpdate Deployment fails with
  # `spec.strategy.rollingUpdate: Forbidden`) is recovered by the
  # `kustomize.toolkit.fluxcd.io/force: enabled` annotation above —
  # see that annotation's comment for the full failure-mode analysis
  # and the docs/CHART-AUTHORING.md §"Strategy flips on existing
  # Deployments" entry. Do NOT add an inline `$patch: replace` here:
  # it BREAKS fresh installs (kubectl strict-decoding rejects
  # `spec.strategy.$patch` on create), and Flux's SSA path strips it
  # anyway. The integration test at tests/integration/strategy-flip.yaml
  # asserts both the recovery path works and the regression mode is
  # still detected.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: catalyst-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalyst-api
        # Wave 5.121 (#2466): kyverno cilium-l7-mtls policy requires this
        # label on the Pod template so catalyst-network controller attaches
        # the Pod to the Cilium L7 mTLS mesh. Without it, Helm install was
        # blocked by admission webhook on every fresh prov.
        policy.cilium.io/enforced: "true"
    spec:
      # serviceAccountName — bind the Pod to the dedicated cutover-driver
      # ServiceAccount so the /api/v1/sovereign/cutover/start handler can
      # read/patch the cutover ConfigMaps + create/watch Jobs in the
      # `catalyst` namespace. See serviceaccount-cutover-driver.yaml +
      # clusterrole-cutover-driver.yaml + clusterrolebinding-cutover-
      # driver.yaml for the full RBAC graph (issue #830 P0 Bug 1).
      #
      # The SA is created by THIS chart in the same namespace catalyst-api
      # runs in (catalyst-system) and bound at cluster scope (the cutover
      # endpoint is namespace-configurable via CATALYST_CUTOVER_NAMESPACE).
      # Without this, the Pod runs as system:serviceaccount:catalyst-
      # system:default and every cutover-status read returns 502
      # "configmaps is forbidden" (caught live on otech102, 2026-05-04).
      serviceAccountName: catalyst-api-cutover-driver
      # ── Survive a co-tenant disk/memory-pressure storm (#4231) ───────────
      # catalyst-api is pinned to its EVS node (nodeName below, #4102) so it
      # CANNOT reschedule off a pressured node. Without a priority it is an
      # ordinary priority-0 Pod competing with co-tenant Day-2 trivy/syft
      # scanners + convergence image-pulls; when that node hit DiskPressure the
      # kubelet evicted the control-plane API (11+ Evicted tombstones → ~17min
      # console outage, omantel.biz 2026-06-24). priorityClassName puts it far
      # above those reschedulable Day-2 Pods, so the kubelet sheds THEM first
      # under node pressure and the pinned API stays Running. The class itself
      # is shipped by this chart (api-priorityclass.yaml) — a custom class
      # because the built-in system-cluster-critical is admission-restricted to
      # the kube-system namespace and catalyst-api runs in catalyst-system.
      priorityClassName: {{ .Values.catalystApi.priorityClassName | default "catalyst-control-plane" }}
      # ── Zero-downtime roll: pin to the EVS volume's node (#4100) ──────────
      # catalyst-api mounts two RWO Huawei-EVS PVCs (catalyst-api-deployments,
      # catalyst-api-cache). The EVS PV nodeAffinity is ZONE-scoped
      # (topology.evs.csi.huaweicloud.com/zone), NOT node-scoped — every worker
      # in the zone satisfies it. With strategy: Recreate and no scheduling
      # constraint, a roll can place the new Pod on a DIFFERENT node than the one
      # holding the live EVS attachment. Huawei EVS then has to detach the volume
      # from the old node and reattach it across nodes — a ~10-min stall during
      # which console/api 503 (live-confirmed on omantel.biz dep
      # 4635277cae4ffed9, 2026-06-22). Same-node reattach is seconds.
      #
      # catalystApi.nodeName (default empty) pins the Deployment to the node
      # currently holding the volumes so the replacement Pod reattaches
      # same-node. Empty on fresh installs — WaitForFirstConsumer binds the RWO
      # PVs to the first consumer's node at install time, so the very first Pod
      # has nothing to collide with; the operator sets nodeName on the
      # per-Sovereign HelmRelease overlay (or it is patched live) to the bound
      # node ONCE, after which every future roll is same-node and fast.
      # catalystApi.affinity is an additional passthrough for operators who
      # prefer a soft/zone nodeAffinity over a hard nodeName pin. Both default
      # empty so fresh installs keep today's behaviour (no regression).
      {{- with .Values.catalystApi.nodeName }}
      nodeName: {{ . | quote }}
      {{- end }}
      {{- if .Values.catalystApi.affinity }}
      affinity:
        {{- toYaml .Values.catalystApi.affinity | nindent 8 }}
      {{- else if .Values.catalystApi.avoidControlPlane }}
      # ── Keep catalyst-api OFF the driverless control-plane node (#4971) ────
      # The two RWO Huawei-EVS PVCs mounted above are served by the
      # evs.csi.huaweicloud.com CSI node-plugin, whose DaemonSet runs ONLY on
      # workers — the control-plane node has NO CSINode entry for that driver.
      # With strategy: Recreate, a roll (e.g. cutover step-07's
      # catalyst-api-env-patch) could otherwise land the replacement Pod on the
      # control-plane node, where AttachVolume.Attach fails forever ("CSINode
      # <cp1> does not contain driver evs.csi.huaweicloud.com") → the Pod hangs
      # ContainerCreating, step-07's rollout wait times out, and the cutover
      # wedges (live on hw237, 2026-07-10). This hard worker-only nodeAffinity
      # forces every roll onto a worker that runs the EVS node plugin. Gated by
      # catalystApi.avoidControlPlane (default false in values.yaml so
      # mothership / catalyst-zero on contabo is unaffected; the Sovereign
      # bootstrap-kit turns it on). An explicit catalystApi.affinity wins over
      # this default — that is the `if` branch above; this is the `else`.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      {{- end }}
      imagePullSecrets:
        - name: ghcr-pull
      # fsGroup applies to the volumes mounted into the Pod so the
      # non-root container UID (65534) can write to the deployments
      # PVC. Without this, Hetzner Cloud Volumes default to root:root
      # and the catalyst-api process gets EACCES on every store.Save —
      # surfacing as the "deployment store unavailable" warning at
      # startup and silent persistence failures at runtime.
      #
      # fsGroupChangePolicy: OnRootMismatch limits the chown traversal
      # to first start (where the volume is freshly provisioned with
      # the wrong UID). Subsequent restarts skip the recursive chown
      # if the root dir already matches, keeping Pod start times
      # bounded as the deployments directory grows.
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: catalyst-api
          # G61 (Refs #2612, 2026-05-30): templated image ref so
          # Sovereign-Helm honours `global.imageRegistry` override
          # (post-cutover patches HelmRelease.spec.values.global.
          # imageRegistry = harbor.<sovereign>/proxy-ghcr/openova-io/
          # openova → catalyst-api restart pulls through Harbor →
          # admission policy harbor-proxy-pull allows the Pod).
          # Pre-G61 literal `ghcr.io/...` was incompatible with the
          # post-handover enforce-mode harbor-proxy-pull policy.
          #
          # Contabo-mkt Kustomize path uses api-deployment-kustomize.
          # yaml (literal ghcr.io ref, .helmignore'd from Sovereign
          # bundle). CI auto-bumps both the literal in the kustomize
          # file AND the values.yaml `images.catalystApi.tag` so
          # contabo and Sovereigns roll together.
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}{{ else }}{{ .Values.images.registry }}{{ end }}/{{ .Values.images.organization }}/catalyst-api:{{ .Values.images.catalystApi.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            # OPENOVA_FLOW_SERVER_URL — catalyst-api proxy upstream for
            # /api/v1/flows/{deploymentId}/snapshot|stream|events. When
            # set, the proxy short-circuits per-deployment FQDN lookup
            # (see openova_flow_proxy.go resolveFlowServerURL) and uses
            # this URL for every flow id. Used by the mothership
            # (contabo) and by Sovereign chroots that install the
            # openova-flow chart in the same cluster — both can reach
            # their LOCAL openova-flow-server via in-cluster Service DNS
            # without needing the public HTTPRoute. Empty on Sovereigns
            # that rely on per-deployment FQDN resolution.
            #
            # Without this env, the proxy returns 502 on every
            # /api/v1/flows/{id}/snapshot because the resolver tries to
            # reach https://openova-flow.<sovereignFQDN> which only
            # exists on a Sovereign that has installed bootstrap-kit
            # slot 56 with httproute.enabled=true.
            - name: OPENOVA_FLOW_SERVER_URL
              # Service lives in catalyst-system namespace (see
              # clusters/_template/bootstrap-kit/56-bp-openova-flow-server.yaml
              # `spec.targetNamespace: catalyst-system`). The previous
              # value `.catalyst.svc.cluster.local` failed DNS resolution
              # (TBD-A56 / #1948, t34 T3 walk 2026-05-19) because that
              # Service does not exist in the `catalyst` namespace.
              value: "http://openova-flow-server.catalyst-system.svc.cluster.local"
            # CATALYST_BUILD_SHA / CATALYST_CHART_VERSION — qa-loop iter-3
            # Fix #18 (TC-261). The /api/v1/version handler resolves these
            # env vars first (envOrTrim) before falling back to the ldflag
            # defaults `dev` / `0.0.0`. Without this injection the live
            # version probe returned `{"sha":"dev","version":"0.0.0"}` on
            # every Sovereign — masking which image was actually live.
            #
            # LITERAL values (not Helm template directives) are mandatory
            # here: this file is consumed by both Helm (per-Sovereign
            # install via bp-catalyst-platform OCI) AND Kustomize
            # (clusters/contabo-mkt/apps/catalyst-platform). Helm
            # directives in `value:` fields break the Kustomize build
            # with `yaml: invalid map key` (see DUAL-MODE CONTRACT note
            # on CATALYST_POWERDNS_API_URL below).
            #
            # The CATALYST_BUILD_SHA literal is bumped by the same CI
            # sed-pass that bumps the catalyst-api image tag literal in
            # this file — see .github/workflows/catalyst-build.yaml's
            # "Bump literal image refs in chart templates" step. Both
            # sides converge on the same SHA on every push to main, so
            # /api/v1/version returns the SHA the Pod is actually
            # running (no drift between image tag and reported SHA).
            #
            # CATALYST_CHART_VERSION mirrors Chart.yaml's `version:` —
            # bumped manually whenever the chart shape changes, per the
            # existing bp-catalyst-platform release discipline. The
            # value carries through to /api/v1/version's `chartVersion`
            # field so dashboards can correlate api-version <-> chart-
            # version on a single probe.
            - name: CATALYST_BUILD_SHA
              value: "d197d74"
            - name: CATALYST_CHART_VERSION
              value: "1.4.95"
            # #2940 (2026-06-03): was hardcoded "https://console.openova.io".
            # Now sourced from catalyst-runtime-config ConfigMap so per-
            # Sovereign overlays can set sovereignConsoleURL once and
            # have both CORS_ORIGIN + CATALYST_SOVEREIGN_URL pick it up.
            # Falls back to the legacy mothership URL when the CM key is
            # absent (optional: true) for back-compat with pre-#2940
            # Sovereigns where the bp-catalyst-platform chart hasn't
            # reconciled the new key yet. Pod auto-rolls on CM content
            # change via checksum/runtime-config annotation (PR #2928).
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: catalyst-runtime-config
                  key: sovereign-console-url
                  optional: true
            - name: DYNADOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dynadot-api-credentials
                  key: api-key
                  # optional=true: Sovereign clusters don't hold Dynadot
                  # credentials — their tenant DNS is served by the
                  # Sovereign's own PowerDNS instance, not the parent
                  # account. Catalyst-Zero (contabo-mkt) supplies the
                  # real secret; Sovereigns use an empty stub or omit it
                  # entirely. Without optional=true the pod refuses to
                  # start when the secret is absent (issue #547).
                  optional: true
            - name: DYNADOT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: dynadot-api-credentials
                  key: api-secret
                  optional: true
            # DYNADOT_MANAGED_DOMAINS — comma-separated list of pool domains
            # the same Dynadot account manages. Per docs/INVIOLABLE-PRINCIPLES.md
            # #4, this is runtime configuration so adding a third pool domain
            # (e.g. acme.io) does NOT require a code change — only a secret
            # update. The Dynadot API is account-scoped (one api-key/api-secret
            # pair covers every domain owned by the account); this list scopes
            # which domains the catalyst-api is *allowed* to write records for,
            # defending against misconfiguration that would let a wizard-
            # supplied poolDomain trigger writes against an unrelated domain.
            - name: DYNADOT_MANAGED_DOMAINS
              valueFrom:
                secretKeyRef:
                  name: dynadot-api-credentials
                  key: domains
                  # optional=true so deployments using the legacy single-value
                  # `domain` key (pre-#108) keep working until the secret is
                  # migrated; the dynadot package falls through to DYNADOT_DOMAIN
                  # then to its built-in defaults if neither key is present.
                  optional: true
            - name: DYNADOT_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: dynadot-api-credentials
                  key: domain
                  optional: true
            # CATALYST_TOFU_WORKDIR — provisioner runs `tofu init/plan/apply`
            # inside this directory. PVC-backed (catalyst-api-deployments) so
            # in-progress tofu state survives Pod restarts. Without this,
            # any catalyst-api Pod roll mid-apply (e.g. an unrelated chart
            # bump that triggers rolling restart on Catalyst-Zero, or a
            # node reboot) leaks Hetzner resources because partial apply
            # state is in emptyDir. Caught live on otech64, 2026-05-03:
            # contabo's catalyst-api was rolled at 21:40:11 (3 minutes
            # into otech64's tofu apply), terminal_LB created without its
            # control_plane target, and otech64 came up with an unreachable
            # 49.12.16.160 LB. Reasonable for fsGroup=65534 above to
            # provide write access to /var/lib/catalyst (PVC mountPath).
            - name: CATALYST_TOFU_WORKDIR
              value: /var/lib/catalyst/tofu
            # CATALYST_HUAWEI_NAT_EIP_STATE — on-PVC store for the LEARNED
            # poisoned-NAT-EIP blocklist (#3722). The kom4dc EIP free-pool
            # gets poisoned by repeated wipe→re-prov cycles: released EIPs
            # stay reputation-blocklisted / un-routable to harbor.openova.io
            # (45.151.123.50) "for hours". The static seed only knows
            # .48/.14, so a fresh prov that draws a freshly-poisoned address
            # (.8/.59/.43/.29/.46) used to wedge (0 HelmReleases, kubeconfig
            # never PUT). The nat-eip preflight now RECORDS every EIP it
            # rotates away from here, and merges the store back on the next
            # prov — so prov N's poison becomes prov N+1's auto-avoid set
            # with NO operator env toggle and NO flux suspend. SIBLING of
            # the tofu workdir (not inside it) so it SURVIVES a wipe — which
            # is exactly when the pool gets poisoned. TTL-pruned (default
            # 24h, CATALYST_HUAWEI_NAT_EIP_TTL) so a recovered EIP ages back
            # in. LITERAL value (dual-mode Helm/Kustomize contract — no Helm
            # template directives in this file's `value:` fields).
            - name: CATALYST_HUAWEI_NAT_EIP_STATE
              value: /var/lib/catalyst/tofu/nat-eip-blocklist.json
            # CATALYST_TF_PLUGIN_CACHE_DIR — OpenTofu provider plugin cache
            # (#3126). Exported as TF_PLUGIN_CACHE_DIR on every `tofu` exec
            # so provider binaries (huaweicloud, hetznercloud, dynadot, ...)
            # are downloaded from github release-assets ONCE and reused by
            # every later prov. The catalyst-api uses a FRESH per-deployment
            # workdir, so WITHOUT a shared cache every prov cold-downloads
            # every provider from github — and a transient
            # release-assets.githubusercontent.com CDN 504 (OpenTofu retries
            # only 2× internally then aborts) fails the whole 2-region prov
            # at `tofu init`. Caught live: the CDN edge returned intermittent
            # 504s to the mothership.
            #
            # Sub-directory of the SAME catalyst PVC mount (/var/lib/catalyst,
            # claim catalyst-api-deployments) that already backs the tofu
            # workdir above — persistent across Pod rolls, no extra
            # volumeMount needed. The provisioner MkdirAll's it before init.
            # LITERAL value (dual-mode Helm/Kustomize contract — no Helm
            # template directives in this file's `value:` fields; see the
            # SOVEREIGN_FQDN block below). Runtime-overridable per
            # docs/PRINCIPLES.md #4.
            - name: CATALYST_TF_PLUGIN_CACHE_DIR
              value: /var/lib/catalyst/tofu-plugin-cache
            # CATALYST_DEPLOYMENTS_DIR — flat-file store for deployment
            # records (one JSON file per deployment id). Backed by the
            # PVC mount below so deployments persist across Pod
            # restarts. Each record is the full Deployment state with
            # credentials redacted; see internal/store/store.go.
            - name: CATALYST_DEPLOYMENTS_DIR
              value: /var/lib/catalyst/deployments
            # CATALYST_PHASE1_MIN_BOOTSTRAP_KIT_HRS — defensive floor
            # only. The load-bearing termination gate is now the
            # informer's HasSynced signal (after WaitForCacheSync the
            # full bp-* HelmRelease set is in the cache, regardless of
            # cardinality). Set to 1 so the watch still refuses to
            # terminate when the cache is completely empty (the
            # "bootstrap-kit Kustomization never reconciled at all"
            # footgun, classified as OutcomeFluxNotReconciling).
            #
            # Earlier values (11, then 38) tied this to the kit count;
            # that coupling is brittle — otech48 (2026-05-03) sat
            # phase1-watching forever because the env was 38 but the
            # kit had drifted to 37. The HasSynced gate is drift-proof.
            - name: CATALYST_PHASE1_MIN_BOOTSTRAP_KIT_HRS
              value: "1"
            # CATALYST_PHASE1_WATCH_TIMEOUT — overall budget for the
            # Phase-1 HelmRelease watch (helmwatch.DefaultWatchTimeout).
            # F8 fix (2026-05-12, prov #44 RCA): the previous 60m default
            # was tighter than the inner bp-catalyst-platform HR install
            # × retries chain after that chart's timeout was raised
            # 15m → 30m. With retries=3 and strategy=rollback, worst-case
            # inner HR is 30m × 3 = 90m; the outer watch budget MUST be
            # larger so it never terminates while helm-controller still
            # has remediation attempts left. Per docs/INVIOLABLE-
            # PRINCIPLES.md #4 the knob is runtime-configurable here so
            # capacity-bounded sandboxes can dial it down without a
            # code change. Parsed by helmwatch.CompileWatchTimeout —
            # accepts any time.ParseDuration value (e.g. "120m", "2h").
            - name: CATALYST_PHASE1_WATCH_TIMEOUT
              value: "120m"
            # CATALYST_KUBECONFIGS_DIR — sibling directory on the same
            # PVC for the plaintext kubeconfigs the new Sovereign POSTs
            # back via the bearer-token endpoint (issue #183, Option D).
            # One <id>.yaml per deployment, mode 0600. The store JSON
            # record carries only the file path + a SHA-256 hash of
            # the bearer; the plaintext kubeconfig is NEVER serialized
            # into the JSON.
            - name: CATALYST_KUBECONFIGS_DIR
              value: /var/lib/catalyst/kubeconfigs
            # CATALYST_API_PUBLIC_URL — the public origin the new
            # Sovereign's cloud-init PUTs its kubeconfig back to. The
            # OpenTofu module templates this into the Sovereign's
            # user_data so the Sovereign knows where to call. Per
            # docs/INVIOLABLE-PRINCIPLES.md #4 this is runtime
            # configuration; air-gapped franchises override it
            # without code change.
            # #2940 (2026-06-03, VERIFIED-PARTIAL reviewer catch): the
            # prior revision carried a fix-comment claiming the host was
            # "sourced from catalyst-runtime-config" while the value:
            # below was still the inline mothership literal — an
            # aspirational-comment-over-unfixed-value anti-pattern. Now
            # genuinely a configMapKeyRef: the key is
            # sovereign-api-public-url in catalyst-runtime-config
            # (default runtime.sovereignAPIPublicURL — the mothership
            # URL survives ONLY as the back-compat default), and
            # bp-self-sovereign-cutover Step 07 Phase 3 pivots it to the
            # Sovereign's own console URL at cutover with a read-back
            # assert. Operator override seam unchanged (per-Sovereign
            # HelmRelease overlay sets runtime.sovereignAPIPublicURL).
            - name: CATALYST_API_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: catalyst-runtime-config
                  key: sovereign-api-public-url
            # CATALYST_NATS_URL — TBD-D35c (issue #1776). When set, the
            # catalyst-api dials this NATS endpoint and publishes the
            # `catalyst.tenant.sandbox_requested` envelope on every
            # successful Sandbox CR Create. sandbox-controller's
            # NATSBridge (consume leg) is already wired against the
            # same subject; setting this env closes the D35 round-trip.
            # The default in-cluster URL matches every other NATS-aware
            # workload on the Sovereign (sme-billing, projector, etc.):
            # nats://nats-jetstream.nats-system.svc.cluster.local:4222.
            # When unset OR the dial fails, the handler runs in
            # publish-disabled mode — the CR Create still succeeds + the
            # FE still observes the new sandbox, but no audit envelope
            # is emitted (matching the pre-PR-#1918 behaviour).
            # Egress allow: `nats-system` is in baselineCnp's
            # allowedPlatformNamespaces (see network-policies/
            # baseline-catalyst-system.yaml) so no extra CNP is needed.
            - name: CATALYST_NATS_URL
              # G105 #2697 default flipped to the syncer-mangled name —
              # post-G92.2 nats-jetstream runs INSIDE the mgmt vCluster
              # and the host's `nats-system` namespace no longer exists.
              value: '{{ .Values.catalystApi.natsURL | default "nats://nats-jetstream.nats-system.svc.cluster.local:4222" }}'
            # CLUSTERMESH_APISERVER_DIAL_PORT — #4784. The etcd port a peer
            # dials for the clustermesh-apiserver endpoint (clustermesh.go
            # clusterMeshDialPort). Default 2379 (Hetzner hcloud-ccm LB IP —
            # no k3s-etcd host collision). On no-CCM Huawei the CP-node EIP is
            # a 1:1 NAT whose host :2379 is bound by k3s' OWN etcd, so peers
            # dialing <EIP>:2379 hit k3s etcd, not Cilium (proven live hw225);
            # the catalyst bootstrap-kit slot sets catalystApi.clusterMeshDialPort
            # to the clustermesh-proxy hostPort (matches
            # cilium.clustermeshProxy.hostPort + infra clustermesh_proxy_port).
            - name: CLUSTERMESH_APISERVER_DIAL_PORT
              value: '{{ .Values.catalystApi.clusterMeshDialPort | default "2379" }}'
            # CATALYST_K8SCACHE_KUBECONFIGS_DIR — issue #321. Directory
            # the k8scache.Factory reads kubeconfigs from at startup.
            # The data-plane SharedInformerFactory opens one informer
            # per kubeconfig file; the cloud-init postback handler
            # (PUT /api/v1/deployments/{id}/kubeconfig) writes here on
            # Phase-1 attach so a fresh Sovereign id is automatically
            # picked up at next catalyst-api restart. The same PVC
            # (catalyst-api-deployments) backs the existing
            # deployments store; the data-plane reads the kubeconfigs/
            # subdirectory directly.
            - name: CATALYST_K8SCACHE_KUBECONFIGS_DIR
              value: /var/lib/catalyst/kubeconfigs
            # CATALYST_K8SCACHE_SNAPSHOT_DIR — issue #321 cold-start
            # mitigation. Backed by a separate 5Gi PVC
            # (catalyst-api-cache) so its size is independent of the
            # deployments store. See api-cache-pvc.yaml for the sizing
            # rationale + the cold-start latency contract.
            - name: CATALYST_K8SCACHE_SNAPSHOT_DIR
              value: /var/cache/sov-cache
            # CATALYST_K8SCACHE_KINDS_CONFIGMAP — optional ConfigMap
            # extending the built-in kinds registry. Per docs/
            # INVIOLABLE-PRINCIPLES.md #4 a new watched GVR (e.g.
            # HelmRelease, Kustomization) is a runtime configuration
            # change, not a code change. Empty disables ConfigMap
            # loading; built-in DefaultKinds is used.
            - name: CATALYST_K8SCACHE_KINDS_CONFIGMAP
              value: catalyst-k8scache-kinds
            - name: CATALYST_K8SCACHE_KINDS_CONFIGMAP_NAMESPACE
              value: catalyst
            # CATALYST_GHCR_PULL_TOKEN — long-lived GHCR pull token that
            # the provisioner stamps onto every Request and the OpenTofu
            # cloud-init template writes into the new Sovereign's
            # flux-system/ghcr-pull Secret so Flux source-controller
            # can pull private bp-* OCI artifacts from
            # ghcr.io/openova-io/. Without this, Phase 1 stalls at
            # bp-cilium with "secrets ghcr-pull not found" — verified
            # live on omantel.omani.works pre-fix.
            #
            # optional: true — when the Secret or key is missing the
            # Pod still starts (with the env var unset). The
            # provisioner's Validate() rejects deployments that need
            # the token (Phase 1 bootstrap-kit pulls private bp-*
            # charts) with a clear pointer to docs/SECRET-ROTATION.md,
            # so a misconfigured catalyst-api fails fast on
            # /api/v1/deployments POST instead of silently mid-apply.
            # /healthz, /api/v1/credentials/validate, and the BYO
            # registrar proxy keep working — they don't read the
            # token at all.
            #
            # Rotation: yearly, see docs/SECRET-ROTATION.md. The Secret
            # is created out-of-band by an operator (never via Flux,
            # never committed to git) — the chart references it but
            # does not template it.
            - name: CATALYST_GHCR_PULL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalyst-ghcr-pull-token
                  key: token
                  optional: true
            # CATALYST_HARBOR_ROBOT_TOKEN — central Harbor proxy-cache
            # robot account secret (issue #557 + #557 follow-up). The
            # value is interpolated into the new Sovereign's
            # /etc/rancher/k3s/registries.yaml at cloud-init time so
            # containerd authenticates against harbor.openova.io's proxy
            # projects (proxy-dockerhub etc).
            #
            # Provisioning seam (catalyst-system Pod gets the Secret):
            #   1. Tofu var.harbor_robot_token enters cloud-init
            #      (infra/hetzner/cloudinit-control-plane.tftpl).
            #   2. Cloud-init writes /var/lib/catalyst/harbor-robot-
            #      token-secret.yaml into flux-system ns with the
            #      auto-mirror Reflector annotations
            #      (reflection-auto-enabled: "true").
            #   3. runcmd applies it BEFORE flux-bootstrap, so the
            #      Secret exists before any Helm release runs.
            #   4. bp-reflector (slot 05a) propagates it into every
            #      namespace (incl. catalyst-system) on first reconcile.
            #   5. This Pod's secretKeyRef resolves once the mirror lands.
            # Mirrors the canonical pattern that flux-system/ghcr-pull
            # already uses (PR #543).
            #
            # NOT optional — provisioner.Validate() rejects deployments
            # with an empty token. The architecture mandate is that every
            # Sovereign image pull goes through harbor.openova.io; falling
            # through to docker.io is forbidden (rate-limit makes a fresh
            # Hetzner IP unbootable within minutes). When `optional: true`
            # was previously contemplated we chose against it: a missing
            # token must surface immediately as a Pod start failure
            # (CreateContainerConfigError), not silently mid-provision.
            #
            # Rotation: yearly. Re-render Tofu plan → re-apply cloud-init
            # → kubectl apply runs against the existing Secret with
            # rotated bytes; bp-reflector propagates the rotation to all
            # mirrored copies on the next watch tick. Plaintext NEVER
            # lives in git.
            - name: CATALYST_HARBOR_ROBOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-token
                  key: token
            # CATALYST_HUAWEI_ACCESS_KEY / _SECRET_KEY / _PROJECT_ID / _REGION
            # — Huawei Cloud Stack (HCS) operator IAM credentials used by the
            # Huawei provider adapter (Wave 3, PR #2142). Server-side-only:
            # the wizard payload never carries these — Request.Huawei* are
            # json:"-" — so the only path AK/SK reach catalyst-api is via this
            # Secret. Mirrors the GHCR/Harbor/Dynadot/PowerDNS/PDM pattern.
            #
            # Required Secret shape (operator creates manually on each
            # mothership during cloud-onboarding, NOT auto-rotated):
            #   apiVersion: v1
            #   kind: Secret
            #   metadata: { name: huawei-operator-creds, namespace: catalyst }
            #   type: Opaque
            #   stringData:
            #     access_key: <Huawei IAM access key>
            #     secret_key: <Huawei IAM secret key>
            #     project_id: <region-scoped project ID>
            #     region:     me-east-215  # canonical HCS region; omit for public Huawei
            #
            # optional: true so mothership Sovereigns that never provision Huawei
            # deployments don't require the Secret at all (Hetzner-only stays
            # backward-compatible). If the Secret is missing, the Huawei branch
            # of Validate() fails fast at /api/v1/deployments POST.
            - name: CATALYST_HUAWEI_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: huawei-operator-creds
                  key: access_key
                  optional: true
            - name: CATALYST_HUAWEI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: huawei-operator-creds
                  key: secret_key
                  optional: true
            - name: CATALYST_HUAWEI_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: huawei-operator-creds
                  key: project_id
                  optional: true
            - name: CATALYST_HUAWEI_REGION
              valueFrom:
                secretKeyRef:
                  name: huawei-operator-creds
                  key: region
                  optional: true
            # CATALYST_POWERDNS_API_KEY — contabo PowerDNS API key (PR
            # #681 followup). The value is interpolated into the new
            # Sovereign's `cert-manager/powerdns-api-credentials` Secret
            # at cloud-init time so bp-cert-manager-powerdns-webhook
            # can write DNS-01 challenge TXT records to contabo's
            # authoritative omani.works zone.
            #
            # Provisioning seam:
            #   1. Source: contabo's `openova-system/powerdns-api-
            #      credentials` Secret (created by bp-powerdns chart).
            #   2. Reflector mirrors it into every namespace incl.
            #      catalyst (annotations on the source: reflection-
            #      auto-enabled: "true", reflection-auto-namespaces: "").
            #   3. This Pod resolves it via secretKeyRef.
            #   4. provisioner.New() reads CATALYST_POWERDNS_API_KEY at
            #      startup, stamps onto every Request.
            #   5. cloud-init writes the Sovereign-side Secret in
            #      cert-manager namespace BEFORE Flux reconciles
            #      bp-cert-manager-powerdns-webhook.
            #
            # optional=true: Catalyst-Zero pods on Sovereigns don't have
            # this Secret reflected (their PowerDNS is local) so the
            # bootstrap shape stays clean across both contabo+Sovereign
            # catalyst-api deployments.
            - name: CATALYST_POWERDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: powerdns-api-credentials
                  key: api-key
                  optional: true
            # CATALYST_POWERDNS_API_URL — base URL of the per-Sovereign
            # PowerDNS REST API (issue #827). Used by:
            #   - the Organization-tenant pipeline's PATCH-RRset writer
            #     (sme_tenant_dns.go) for free-subdomain provisioning
            #   - the multi-zone parent-domain handler
            #     (parent_domains.go) for runtime add-zone
            # Default is the in-cluster Service FQDN of the Sovereign's
            # own PowerDNS (the Helm chart targets namespace `powerdns`
            # with default release name `powerdns`). Operators in
            # non-standard layouts override via the Helm values overlay
            # at clusters/<sovereign>/bootstrap-kit/13-bp-catalyst-
            # platform.yaml.
            #
            # NOTE — DUAL-MODE CONTRACT (see SOVEREIGN_FQDN block below
            # for the canonical explanation): this file is consumed BOTH
            # by Helm (per-Sovereign install) AND by Kustomize (contabo-
            # mkt's flux Kustomization at path: ./products/catalyst/chart/
            # templates). Helm template syntax (double-curly directives)
            # in this file BREAKS the Kustomize build with
            # "yaml: invalid map key" and stalls every contabo
            # reconciliation. The 1.4.0 version of this block used
            # {{ default "..." .Values.catalystApi.powerdnsURL }} — that
            # broke contabo's catalyst-platform Kustomization until this
            # follow-up landed. Issue #830 follow-up.
            #
            # Solution: the in-cluster Service URL is a non-secret
            # constant on every Sovereign that ships bp-powerdns at its
            # canonical release name (powerdns/powerdns). Hardcode the
            # literal here so the Kustomize build stays clean. Per-
            # Sovereign overrides are still possible via the per-
            # Sovereign HelmRelease overlay's `catalystApi.env`
            # additional-env patch that takes precedence over the
            # default below.
            - name: CATALYST_POWERDNS_API_URL
              value: "http://powerdns.powerdns.svc.cluster.local:8081"
            # CATALYST_POWERDNS_SERVER_ID — virtually always "localhost"
            # per the PowerDNS REST API contract. Operator-overridable
            # for multi-tenant PowerDNS deployments where a single
            # PowerDNS instance hosts multiple servers (override via the
            # HelmRelease overlay env patch — same pattern as
            # CATALYST_POWERDNS_API_URL above).
            - name: CATALYST_POWERDNS_SERVER_ID
              value: "localhost"
            # ── #4218 — CENTRAL pool-domain PowerDNS (pdns.openova.io) ─────────
            # The org-tenant DNS provisioner writes each new Org's pool
            # subdomain A-record `console.<slug>.<omani-pool>` so the
            # fresh-signup redirect lands on a host that RESOLVES (the #4179
            # funnel landing). That record belongs to the SHARED omani.*
            # subdomain pool, authoritative on the CENTRAL PowerDNS at
            # pdns.openova.io — NOT the Sovereign-LOCAL powerdns.powerdns.svc
            # above (which hosts only the Sovereign's own FQDN zone and 404s a
            # PATCH against an omani.works zone it doesn't have). These POOL env
            # vars are INDEPENDENT of the LOCAL CATALYST_POWERDNS_API_* pair —
            # the provisioner prefers the pool writer for free-subdomain writes
            # and keeps the local writer for the #827/#829 multi-zone admin
            # flow. When the pool env is unset (a single-PowerDNS Sovereign
            # where the pool IS the local zone) the provisioner falls back to
            # the local writer automatically (main.go org-tenant wiring).
            #
            # DUAL-MODE CONTRACT — a literal value (NOT a Helm directive) so the
            # contabo Kustomize build of this file stays clean; per-Sovereign
            # override via the HelmRelease overlay env patch (same pattern as
            # CATALYST_POWERDNS_API_URL above).
            - name: CATALYST_POOL_POWERDNS_API_URL
              value: "https://pdns.openova.io"
            # CATALYST_POOL_POWERDNS_API_KEY — the CENTRAL pdns.openova.io key,
            # mirrored into catalyst-system as `pool-powerdns-api-credentials`
            # by the #4218 reflector PULL-stub (templates/pool-powerdns-
            # credentials-host-bridge.yaml; source cert-manager/powerdns-api-
            # credentials). optional=true so the Pod schedules pre-reflection;
            # an empty key degrades the org-tenant write to the no-op DNS
            # provisioner (logged) until reflector lands the key — self-healing
            # on the next reconcile, never a wedge.
            - name: CATALYST_POOL_POWERDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pool-powerdns-api-credentials
                  key: api-key
                  optional: true
            # ── /auth/handover Keycloak service-account (issue #606) ──────────
            # CATALYST_KC_ADDR — Keycloak base URL. Defaults to in-cluster
            # service FQDN in code; override here for non-standard Sovereign
            # Keycloak deployments.
            # optional=true: Catalyst-Zero pods don't run Keycloak locally.
            - name: CATALYST_KC_ADDR
              valueFrom:
                secretKeyRef:
                  name: catalyst-kc-sa-credentials
                  key: addr
                  optional: true
            - name: CATALYST_KC_REALM
              valueFrom:
                secretKeyRef:
                  name: catalyst-kc-sa-credentials
                  key: realm
                  optional: true
            - name: CATALYST_KC_SA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: catalyst-kc-sa-credentials
                  key: client-id
                  optional: true
            - name: CATALYST_KC_SA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalyst-kc-sa-credentials
                  key: client-secret
                  optional: true
            # ── G113 Option B (#2725) OIDC IDP provider wiring ──────────
            # The catalyst-api OIDC provider package (internal/oidcprovider/
            # provider.go) is wired in main.go behind the
            # CATALYST_OIDC_PROVIDER_ENABLED flag. On a Sovereign with
            # SOVEREIGN_FQDN set, after HandlePinVerify mints the
            # catalyst_session cookie it ALSO returns a `kcBrokerURL`
            # pointing the browser through KC's identity-broker. The
            # broker server-side calls /oidc/token on this Pod with the
            # client_secret below; we match it against the value in the
            # catalyst-pin-broker-credentials Secret (created by
            # bp-keycloak templates/pin-broker-secret.yaml and mirrored
            # into catalyst-system via the reflector annotation). When
            # the Secret is absent (e.g. mothership / catalyst-zero)
            # CATALYST_PIN_BROKER_CLIENT_SECRET is empty and the OIDC
            # provider routes are skipped in main.go (logged as
            # "env set but signer / issuer / secret missing").
            - name: CATALYST_OIDC_PROVIDER_ENABLED
              value: "true"
            # CATALYST_OIDC_PROVIDER_ISSUER_URL intentionally omitted:
            # main.go derives it from SOVEREIGN_FQDN (sovereign-fqdn
            # ConfigMap, set later in this env list) — `https://api.<fqdn>`.
            # The earlier `.Values.sovereign.fqdn` template was broken —
            # no such Values path; rendered as `%!s(<nil>)` live, which
            # was overridden via `kubectl set env` on hw86 (2026-06-02).
            # On catalyst-zero SOVEREIGN_FQDN is empty so the OIDC routes
            # short-circuit, matching the prior behaviour.
            - name: CATALYST_PIN_BROKER_CLIENT_ID
              value: "catalyst-pin"
            - name: CATALYST_PIN_BROKER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalyst-pin-broker-credentials
                  key: client-secret
                  optional: true
            # ── Gitea client (qa-loop iter-12 Fix #53B) ──────────────────
            # CATALYST_GITEA_URL + CATALYST_GITEA_TOKEN feed
            # internal/handler/blueprints.go giteaClientFromEnv() so the
            # /api/v1/sovereigns/.../blueprints/{publish,curatable,curate,
            # edit-pr} endpoints can proxy into the Sovereign's in-cluster
            # Gitea. Without these env vars every blueprint-CRUD endpoint
            # returned the 503 "Gitea client unconfigured" error documented
            # at blueprints.go:184 + blueprints.go:493 (matrix TC-081, TC-082,
            # TC-083, TC-085 FAIL).
            #
            # Mirrors the wiring already used by blueprint-controller,
            # application-controller, environment-controller, organization-
            # controller (see controllers/blueprint-controller-deployment.yaml
            # for the canonical pattern). The catalyst-gitea-token Secret
            # is materialised by the bp-gitea chart's post-install Job and
            # mirrored into catalyst-system by emberstack/reflector.
            #
            # optional=true: Catalyst-Zero (contabo) doesn't run a local
            # Gitea — these endpoints return 503 there, which is the
            # intended behaviour (only Sovereigns curate blueprints).
            # CATALYST_GITEA_URL: in-cluster Gitea service FQDN. Identical
            # across every Sovereign (the bp-gitea chart always lands in
            # `gitea` ns with the same Service name). Hardcoded literal
            # rather than .Values lookup because this file is consumed by
            # BOTH Helm AND Kustomize (see SOVEREIGN_FQDN comment ~line 550)
            # — Helm template directives break the Kustomize parse.
            # Catalyst-Zero (contabo) doesn't run a local Gitea; the
            # endpoint is unreachable there which the blueprints handler
            # treats as "Gitea unconfigured" (returns 503 on blueprint
            # CRUD endpoints — intended behaviour, only Sovereigns curate).
            - name: CATALYST_GITEA_URL
              value: "http://gitea-http.gitea.svc.cluster.local:3000"
            - name: CATALYST_GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalyst-gitea-token
                  key: token
                  optional: true
            # CATALYST_ORG_JWT_SECRET — bridge secret for /api/v1/org/*
            # proxies (PR #1625 follow-up). The Organization microservice mesh
            # (core/services/{gateway,billing,catalog,...}) validates HS256
            # tokens signed with org-services-secrets/JWT_SECRET; catalyst-api's
            # operator session is RS256 Keycloak. proxySMEVoucher (and
            # future siblings) mint a short-lived HS256 token from the
            # operator's already-validated session via
            # core/services/shared/auth.MintSMEAccessToken and forward
            # the bridged token to the Organization gateway.
            #
            # Source Secret is org-services-secrets in the `org-services`
            # namespace (#3383 — was `sme-secrets` in `sme`); the
            # reflector annotation block on
            # products/catalyst/chart/templates/org-services/org-services-secrets.yaml
            # mirrors it into catalyst-system at the SAME secret name so
            # the secretKeyRef below resolves to the same JWT_SECRET
            # bytes the Organization gateway validates against.
            #
            # optional: true — Sovereigns without marketplace
            # (ingress.marketplace.enabled=false) never materialise
            # org-services-secrets; proxySMEVoucher surfaces 503
            # `sme-jwt-bridge-unwired` for those clusters so the FE
            # renders an actionable "marketplace not enabled" message
            # rather than the pre-bridge silent 401.
            - name: CATALYST_ORG_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: JWT_SECRET
                  optional: true
            # ── NewAPI admin client (ADR-0003 §3.2, TBD-V15 / #2021) ─────
            # CATALYST_NEWAPI_ADDR + CATALYST_NEWAPI_ADMIN_TOKEN feed the
            # NewAPI admin-API client in
            # products/catalyst/bootstrap/api/cmd/api/main.go around the
            # `if addr != "" && token != ""` guard. Both env vars must
            # land non-empty for the Organization-user create hook (step 2:
            # POST /api/v1/admin/users) to actually fire — when token
            # is empty catalyst-api logs `CATALYST_NEWAPI_ADMIN_TOKEN
            # unset; NewAPI hook step 2 will fail-closed` at startup
            # and `POST /api/v1/sme/users` returns terminal
            # `newapi client not wired`. Pre-fix BOTH envs were unset
            # by default → the operator UsersPage `Add User` flow on
            # `/console/sme/users` never actually provisioned an
            # upstream NewAPI user, even though the surface returned
            # 200 (with a sentinel error in LastError).
            #
            # CATALYST_NEWAPI_ADDR — canonical in-cluster Service URL.
            # `newapi-bp-newapi` (NOT `newapi`) because the bp-newapi
            # chart helper renders `<Release.Name>-<Chart.Name>` and
            # bootstrap-kit slot 80 sets `releaseName: newapi` against
            # chart `bp-newapi`. Same root cause as TBD-V14 / PR #2017
            # which fixed the identical mistake in bp-sandbox's
            # NEWAPI_BASE_URL default.
            #
            # LITERAL value (not Helm template directive) — dual-mode
            # contract: this file is consumed by BOTH Helm AND Kustomize
            # (contabo-mkt's clusters/contabo-mkt/apps/catalyst-platform).
            # Helm directives in `value:` fields break the Kustomize
            # build (`yaml: invalid map key`). Operator override path
            # is the `catalystApi.env` additional-env patch on the
            # per-Sovereign HelmRelease overlay (Helm-only codepath,
            # takes precedence at template-render time).
            - name: CATALYST_NEWAPI_ADDR
              value: "http://newapi-bp-newapi.newapi.svc.cluster.local:3000"
            # CATALYST_NEWAPI_ADMIN_TOKEN — admin bearer from the
            # `catalyst-newapi-admin-token` Secret rendered by the
            # bp-newapi chart's ExternalSecret (key ADMIN_API_TOKEN,
            # source ClusterSecretStore `vault-region1`, OpenBao path
            # `catalyst/newapi/admin-token` — written by catalyst-api's
            # seedNewapiAdminToken seam, #4477).
            #
            # Same cross-namespace pattern as `org-services-secrets` above: the
            # ExternalSecret lands the Secret in the `newapi` namespace
            # (bp-newapi targetNamespace), and emberstack/reflector
            # mirrors it into catalyst-system. The mirror annotations
            # live on the bp-newapi-side ExternalSecret.target.template
            # so the catalyst-system copy resolves the secretKeyRef
            # below at Pod-start.
            #
            # optional: true — Sovereigns that haven't yet seeded the
            # OpenBao path won't have the admin token materialised; in
            # that case the env var lands empty, the main.go guard
            # short-circuits, and `POST /api/v1/sme/users` surfaces
            # `newapi client not wired` to the operator UI (intended
            # fail-closed behaviour per ADR-0003 §3.2).
            - name: CATALYST_NEWAPI_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalyst-newapi-admin-token
                  key: ADMIN_API_TOKEN
                  optional: true
            # KEYCLOAK_BOOTSTRAP_TIER_ROLES — EPIC-3 slice T2 (#1098/#1146).
            # When "true", a goroutine on catalyst-api startup calls
            # EnsureTierRealmRoles (internal/keycloak/realm_bootstrap.go)
            # against the Sovereign realm to materialise the 5 catalog-
            # tier composite realm-roles (catalyst-{viewer,developer,
            # operator,admin,owner}) per docs/EPICS-1-6-unified-design.md
            # §6.2. Re-runs are idempotent no-ops.
            #
            # Source-of-truth is `.Values.keycloak.bootstrap.ensureTierRoles`
            # (default "true" per qa-loop iter-1 cluster
            # `controllers-and-kc-bootstrap-gates`). Per-Sovereign HelmRelease
            # overlays may set it to "false" on the contabo mothership (whose
            # `openova` realm has its own role taxonomy and should not gain
            # catalyst-* tier roles). The goroutine waits up to ~30s for KC
            # to be reachable, then retries up to 5 times with capped backoff
            # before giving up; the next catalyst-api restart picks the
            # bootstrap up again. Orthogonal to the chart-install-time
            # keycloak-config-cli Job (which seeds the realm itself) — this
            # env var only flips the runtime tier-role bootstrap.
            # LITERAL value (not Helm template directive) — dual-mode contract:
            # this file is consumed by both Helm AND Kustomize (contabo-mkt's
            # clusters/contabo-mkt/apps/catalyst-platform). Helm directives in
            # `value:` fields break the Kustomize build with `yaml: invalid map
            # key` (caught live on contabo 2026-05-10 from #1311 regression at
            # commit 92228bc — Flux Kustomization stuck for 2 days, blocking
            # catalyst-api roll on contabo). Default OFF; per-Sovereign
            # HelmRelease overlays MAY set this to "true" via the
            # `catalystApi.env` additional-env patch (Helm-only codepath, takes
            # precedence over this default at template-render time).
            # NB: env name was KEYCLOAK_BOOTSTRAP_TIER_ROLES until 2026-06-03.
            # Renamed because the substring "KEY" (in KEYCLOAK) matches
            # Kyverno cluster-policy `secret-not-in-env/deny-plaintext-secret-env`'s
            # regex `(?i)(PASSWORD|TOKEN|KEY|SECRET)` and the plaintext value
            # "false" triggered a PolicyViolation. Go-side reads both names
            # (new first, legacy as fallback) — see cmd/api/main.go.
            - name: KC_BOOTSTRAP_TIER_ROLES
              value: "false"
            # CATALYST_HANDOVER_JWT_PUBLIC_PATH — path to the JWK file that
            # holds the RS256 public key for validating one-time handover JWTs.
            # The K8s Secret `catalyst-handover-jwt-public` (created by
            # cloud-init at provision time, see infra/hetzner/cloudinit-control-
            # plane.tftpl) is mounted as a directory at /etc/catalyst/handover-
            # jwt-public/, so the JWK lives at /etc/catalyst/handover-jwt-public/
            # public.jwk. We deliberately mount the Secret as a directory rather
            # than using subPath: the catalyst-api PVC at /var/lib/catalyst is
            # ReadWriteOnce and a leftover empty directory at the legacy path
            # /var/lib/catalyst/handover-jwt-public.jwk/ from earlier installs
            # (where the Secret was missing and Kubernetes created an empty
            # directory in the volume) collides with the subPath file mount on
            # re-provisioning. Mounting under /etc/ keeps the JWK off the PVC
            # entirely so the conflict cannot recur. Caught live on otech48,
            # 2026-05-03.
            #
            # NB: env name was CATALYST_HANDOVER_JWT_PUBLIC_KEY_PATH until
            # 2026-06-03. Renamed for the same Kyverno reason as above
            # (substring "KEY" → secret-shaped name). Go-side reads both
            # (new first, legacy as fallback) — see internal/handler/auth_handover.go.
            - name: CATALYST_HANDOVER_JWT_PUBLIC_PATH
              value: /etc/catalyst/handover-jwt-public/public.jwk
            # CATALYST_OPENBAO_ADDR (#3374) — in-cluster OpenBao address for
            # the bare-URL SSO shim (HandleOpenBaoSSOInit). The shim calls
            # ONLY the unauthenticated /v1/auth/oidc/oidc/auth_url login-flow
            # endpoint, so NO token is needed for that path; without this env
            # the shim silently degraded to the one-click deep-link on every
            # Sovereign (hw130, measured 2026-06-13). Sovereign-only (empty on
            # Catalyst-Zero, where catalyst-api is the SENDER not the
            # receiver). Address matches the canonical autoUnseal.baoAddress /
            # sso-configure BAO_ADDR value in bp-openbao.
            - name: CATALYST_OPENBAO_ADDR
              value: '{{ if .Values.global.sovereignFQDN }}{{ .Values.catalystApi.openbaoAddr | default "http://openbao.openbao.svc.cluster.local:8200" }}{{ end }}'
            # CATALYST_OPENBAO_K8S_AUTH_ROLE (#3376) — Sovereign handover-
            # archive receiver auth. When set, catalyst-api logs in to
            # OpenBao via the Kubernetes auth method using this Pod's
            # projected SA token, mints a short-lived Vault token, and
            # re-logs before the lease expires. bp-openbao's auth-bootstrap
            # Job (kubernetesAuth.catalystApi) binds this role to the
            # catalyst-api SA + a write policy on secret/catalyst/*, so
            # ReceiveTofuArchive can seal secret/catalyst/tofu-phase0-archive
            # at handover — the durable marker the cutover's 425 gate keys on.
            # Without it the receiver 503s ("not handover target") and the
            # tenant-Org funnel never un-wedges (#3376). No long-lived static
            # token at rest. Sovereign-only (empty on Catalyst-Zero).
            - name: CATALYST_OPENBAO_K8S_AUTH_ROLE
              value: '{{ if .Values.global.sovereignFQDN }}{{ .Values.catalystApi.openbaoK8sAuthRole | default "catalyst-api" }}{{ end }}'
            # CATALYST_FIRE_CUTOVER_ON_HANDOVER (#4061) — gates whether the
            # child catalyst-api auto-fires the self-sovereignty cutover engine
            # the instant the mothership completes handover. ReceiveTofuArchive
            # (handover.go) seals the tofu-phase0-archive THEN fires the engine
            # with source="handover", which the require-handover gate
            # (cutover_internal.go) deliberately EXEMPTS — so without this env
            # the in-code default TRUE makes a converged, permanent Sovereign
            # auto-enter the finite 8-step cutover (incl the 10-min deny-egress
            # NetworkPolicy hold) UNATTENDED. For a permanent customer-facing
            # Sovereign the cutover MUST be a DELIBERATE, observed BSS-menu
            # action ("Achieve True Sovereignty" CTA, source="operator"). So we
            # render "false" by DEFAULT here (catalystApi.fireCutoverOnHandover).
            #
            # NO-REGRESS: this only changes the auto-on-handover DEFAULT. The
            # operator/BSS-initiated cutover (HandleCutoverStart, source=
            # "operator", behind RequireSession) is untouched and still fires.
            # A throwaway test prov that wants the full unattended cutover walk
            # sets catalystApi.fireCutoverOnHandover=true.
            #
            # Sovereign-only (gated on global.sovereignFQDN). Empty on
            # Catalyst-Zero / the mothership, which is the handover SENDER, never
            # a cutover subject — fireCutoverOnHandover never runs there.
            - name: CATALYST_FIRE_CUTOVER_ON_HANDOVER
              # #4061 keeps PERMANENT customer Sovereigns operator-gated (explicit
              # BSS "Achieve True Sovereignty" CTA). A qa/test prov (qaFixtures.enabled,
              # e.g. omantel.biz with qaTestEnabled=true) drives the FULL unattended
              # zero-touch walk — handover auto-fires the cutover. Customer provs
              # (qaFixtures.enabled=false, fireCutoverOnHandover=false) stay gated.
              value: '{{ if .Values.global.sovereignFQDN }}{{ if or .Values.catalystApi.fireCutoverOnHandover .Values.qaFixtures.enabled }}true{{ else }}false{{ end }}{{ end }}'
            # CATALYST_CUTOVER_ACK_TOLERANCE (#3379 / #4674) — how many
            # registry-pivot (step-04) nodes may miss their v2 local-Harbor
            # ack before the ack-gate (cutover.go waitForRegistryPivotNodeAcks)
            # still proceeds. A control-plane node whose dragonfly dfdaemon is
            # dead (the known kom4dc cp1 fault) never writes its v2 ack, and the
            # in-code strict default (0) wedged the ENTIRE sovereignty cutover on
            # that one node for the full 10-min timeout — observed live on hw228
            # (5/6 workers acked, cp1 control-plane laggard → registry-pivot
            # Failed). A control-plane node runs NO harbor-pulling workloads so
            # its pivot is immaterial; the true local-only proof is the step-08
            # deny-egress hold, which still fails fast if a real WORKER can't
            # pull. Default 1 tolerates a single laggard (the #4635 reconciler +
            # un-acked-node Warn log keep it visible); a genuine multi-node
            # outage exceeds 1 and fails. Rendered directly (no `default` — the
            # sprig int-default gotcha maps an explicit 0 back to the default).
            # Sovereign-only; empty on the mothership (never a cutover subject).
            - name: CATALYST_CUTOVER_ACK_TOLERANCE
              value: '{{ if .Values.global.sovereignFQDN }}{{ .Values.catalystApi.cutoverAckTolerance }}{{ end }}'
            # SOVEREIGN_FQDN — Sovereign's public FQDN. The /auth/handover
