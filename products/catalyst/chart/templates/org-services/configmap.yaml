{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
{{- /*
Event-bus default — issue #942 (2026-05-05).

On Catalyst-Zero (contabo, global.sovereignFQDN empty) the Organization services
historically point at a cross-namespace Redpanda in `talentmesh` (migration
tracked in #68). On franchised Sovereigns the talentmesh namespace does
not exist and the OpenOva architecture uses NATS JetStream as the only
local bus per ADR-0001 — slot 09 ships bp-nats-jetstream into namespace
`nats-jetstream`. Pre-#942 the value was hardcoded to the talentmesh
Service, which made every Organization service crashloop on a fresh Sovereign at
startup with `lookup redpanda.talentmesh.svc.cluster.local: no such host`,
blocking alice signup gate 3 (tenant ready).

Per Inviolable Principle #4 (never hardcode), the broker target is
data-driven via .Values.orgServices.eventBus.brokers. Defaults differ per
topology so the contabo + Sovereign render paths both work out of the box:

  - Sovereign install (global.sovereignFQDN non-empty) defaults to the
    in-cluster NATS JetStream Service.
  - Catalyst-Zero install (global.sovereignFQDN empty) defaults to the
    legacy Redpanda Service in talentmesh so contabo keeps working.

Per-Sovereign overlays MAY override either default to wire Organization services
at any NATS-protocol or Kafka-protocol broker without forking the chart.

The ConfigMap key name stays REDPANDA_BROKERS for backwards-compatibility
with existing Organization service Go env wiring (the env name is historical; the
value is whatever broker is actually wired). A future ticket may rename
the env to EVENT_BUS_BROKERS once every Organization service binary reads the new
name; that rename can ship without re-touching this template because the
key name is the only thing this template promises to its consumers.
*/ -}}
{{- /*
Convergence fix 2026-05-18 — Sovereign event bus wiring:

(1) Sovereign default of REDPANDA_BROKERS is now EMPTY (not the NATS URL
    poked into a Kafka env). The Organization services' Kafka client cannot speak
    the NATS wire protocol; the previous default value of
    `nats-jetstream.nats-jetstream.svc.cluster.local:4222` made every
    franz-go dial fail at startup, which on the publish side silently
    dropped tenant.created / order.placed and blocked convergence end
    to end.
(2) NATS_URL is now exported as a separate ConfigMap key and wired into
    the tenant + billing Deployments (see tenant.yaml / billing.yaml).
    Services use the JetStream-native MultiPublisher (see
    core/services/shared/events/bridge.go) to write to
    `catalyst.<domain>.<event>` per ADR-0001 §6.
(3) Note also the NATS namespace: `bp-nats-jetstream` reconciles into
    namespace `nats-system` (see clusters/_template/bootstrap-kit/
    07-nats-jetstream.yaml), NOT `nats-jetstream`. Earlier defaults that
    pointed at `.nats-jetstream.svc` resolved to NXDOMAIN.

Catalyst-Zero (contabo, global.sovereignFQDN empty) keeps the legacy
Redpanda default so contabo's existing Organization consumers keep functioning.
*/ -}}
{{- $defaultBrokers := "redpanda.talentmesh.svc.cluster.local:9092" -}}
{{- $defaultNATS := "" -}}
{{- if .Values.global.sovereignFQDN -}}
  {{- /* Sovereign default: no Redpanda exists in cluster — leave empty
       so the Organization services skip the legacy Kafka transport entirely. */ -}}
  {{- $defaultBrokers = "" -}}
  {{- /* Sovereign default NATS URL (#3376 funnel fix). #3373/#2697 moved
       bp-nats-jetstream INSIDE the mgmt vCluster (placement.yaml:
       `bp-nats-jetstream → vcluster: mgmt, namespace: nats-system`). The
       bp-mgmt-vcluster syncer reflects the in-vCluster Service to the
       HOST under the syncer-mangled name
       `nats-jetstream-x-nats-system-x-mgmt-vcluster.mgmt.svc`, so the
       host `nats-system` namespace no longer carries a `nats-jetstream`
       Service — the old default `nats-jetstream.nats-system.svc`
       resolves NXDOMAIN and EVERY Organization service (billing/tenant/
       provisioning/domain/notification) CrashLoops on `nats connect:
       no such host`, wedging the funnel (measured live hw130
       2026-06-13: provisioning Init:0/1, billing/tenant/domain/
       notification CrashLoopBackOff). The catalyst-api/continuum config
       (values.yaml catalystApi.nats.url) was already updated to the
       synced name in #2697; the Organization default was missed in the move.
       Align it here. Override via orgServices.eventBus.natsURL for a
       host-placed NATS. */ -}}
  {{- $defaultNATS = "nats://nats-jetstream.nats-system.svc.cluster.local:4222" -}}
{{- end -}}
{{- $brokers := default $defaultBrokers (index (default (dict) .Values.orgServices.eventBus) "brokers") -}}
{{- $natsURL := default $defaultNATS (index (default (dict) .Values.orgServices.eventBus) "natsURL") -}}
{{- /*
TBD-A68 (issue #1994, 2026-05-19) — derive the marketplace host from the
per-Sovereign FQDN instead of hardcoding `openova.io`. Pre-fix every
CORS_ORIGIN_* / PUBLIC_BASE_URL / CHECKOUT_*_URL key emitted
`https://openova.io`, which on a franchised Sovereign (e.g.
omani.homes) made:
  - storefront fetches mis-match CORS preflight (mothership host
    advertised, real host `marketplace.omani.homes` rejected),
  - PUBLIC_BASE_URL render absolute links pointing at the mothership
    instead of the local sovereign,
  - Stripe / payment-success redirects bounce tenants OFF their
    Sovereign back to Catalyst-Zero.

Resolution order, longest-match wins:
  1. .Values.ingress.hosts.marketplace.host — explicit overlay value
     (e.g. `marketplace.omani.homes`). Already canonical, kept as-is.
  2. else fall back to `marketplace.<sovereignFQDN>` when sovereignFQDN
     is set (canonical franchised-Sovereign convention).
  3. else fall back to the legacy `openova.io` so contabo's
     Catalyst-Zero render (sovereignFQDN unset, host unset) keeps
     working.

Admin storefront prefix `admin.` and console prefix `console.` mirror
the platform subdomain plan (catalyst/chart/values.yaml: ingress.hosts
keys). No other CORS rule lives off these prefixes today.
*/ -}}
{{- /* Marketplace + sibling-platform hosts.
       - $marketplaceHost — the buyer-facing storefront
       - $platformZone — the parent zone admin/console/portal live in
       Selection rules (longest-match wins):
         1. Operator pinned `.Values.ingress.hosts.marketplace.host` →
            keep that exact host; platform-zone = parent of the host
            (drop one label). Vanity / A-B-test setups can colocate
            siblings cleanly.
         2. global.sovereignFQDN set → marketplaceHost =
            `marketplace.<sov>`, platformZone = `<sov>`. Canonical
            franchised-Sovereign layout (admin.<sov> / console.<sov> /
            portal.<sov>).
         3. Neither set → preserve historical Catalyst-Zero layout
            (openova.io for marketplace, admin.openova.io for
            admin, etc.). Pre-A68 default — kept byte-identical so
            contabo's existing CORS / public URLs don't drift. */ -}}
{{- $marketplaceHost := default "" (((.Values.ingress).hosts).marketplace).host -}}
{{- $platformZone := "" -}}
{{- if $marketplaceHost -}}
  {{- if contains "." $marketplaceHost -}}
    {{- $platformZone = (index (splitn "." 2 $marketplaceHost) "_1") -}}
  {{- else -}}
    {{- $platformZone = $marketplaceHost -}}
  {{- end -}}
{{- else if .Values.global.sovereignFQDN -}}
  {{- $marketplaceHost = printf "marketplace.%s" .Values.global.sovereignFQDN -}}
  {{- $platformZone = .Values.global.sovereignFQDN -}}
{{- else -}}
  {{- /* Legacy Catalyst-Zero default — siblings share the
         `openova.io` parent so admin.openova.io etc. stay
         resolvable, matching pre-A68 emit. */ -}}
  {{- $marketplaceHost = "openova.io" -}}
  {{- $platformZone = "openova.io" -}}
{{- end -}}
{{- $marketplaceOrigin := printf "https://%s" $marketplaceHost -}}
{{- $adminOrigin := printf "https://admin.%s" $platformZone -}}
{{- $consoleOrigin := printf "https://console.%s" $platformZone -}}
{{- $portalOrigin := printf "https://portal.%s" $platformZone -}}
{{- /*
#4525 — configuredRegions for the org-services catalog Deployment.

The catalog pod's CATALYST_CONFIGURED_REGIONS env (catalog.yaml) reads
this key so GET /catalog/regions returns the Sovereign's REAL configured
region set (the marketplace BCP picker must offer these, not a hardcoded
Hetzner list). The value is computed from the SAME provision-time source
as the `sovereign-fqdn` ConfigMap (sovereign-fqdn-configmap.yaml) — the
catalog pod lives in `org-services`, but `sovereign-fqdn` lives in
`catalyst-system`, and a configMapKeyRef resolves only within the pod's
own namespace; reading the cross-namespace key silently resolved to ""
with optional=true → endpoint `[]`. Carrying the same value HERE (the
ConfigMap the catalog pod already mounts same-namespace) closes that gap.

Resolution order mirrors sovereign-fqdn-configmap.yaml exactly:
  1. .Values.sovereign.configuredRegions (operator-set, canonical)
  2. .Values.qaFixtures.configuredRegions WHEN qaFixtures.enabled
  3. empty string — endpoint returns [] and the frontend keeps its
     static fallback (Catalyst-Zero / legacy Sovereigns).
*/ -}}
{{- $cfgRegions := default (list) .Values.sovereign.configuredRegions -}}
{{- if and (eq (len $cfgRegions) 0) (and .Values.qaFixtures .Values.qaFixtures.enabled) -}}
{{-   $cfgRegions = default (list) .Values.qaFixtures.configuredRegions -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: org-services-config
  namespace: org-services
  annotations:
    description: |
      Central source of truth for Organization service URLs, DB URIs, and external
      dependencies. All Organization Deployments reference keys here via
      envFrom/valueFrom.configMapKeyRef — see issue #87.

      Forking this manifest to a new environment (staging, other clusters)
      should require editing only THIS file, not every service YAML.
data:
  # ---- cluster-internal service endpoints -----------------------------------
  # The Organization microservice mesh. All services run in the `org-services` namespace and
  # expose their own ports. Gateway fan-out uses these URLs; services call
  # each other directly using these too.
  AUTH_URL: "http://auth.org-services.svc.cluster.local:8081"
  CATALOG_URL: "http://catalog.org-services.svc.cluster.local:8082"
  TENANT_URL: "http://tenant.org-services.svc.cluster.local:8083"
  PROVISIONING_URL: "http://provisioning.org-services.svc.cluster.local:8084"
  BILLING_URL: "http://billing.org-services.svc.cluster.local:8085"
  DOMAIN_URL: "http://domain.org-services.svc.cluster.local:8086"
  NOTIFICATION_URL: "http://notification.org-services.svc.cluster.local:8087"

  # ---- shared backing-store endpoints ---------------------------------------
  # FerretDB (MongoDB-wire) — Catalyst-curated Deployment in `org-services` ns
  # (see ferretdb.yaml, issue #861). Operator-overridable via
  # .Values.orgServices.ferretdb.{host,port} so a per-Sovereign overlay
  # MAY swap to an external MongoDB endpoint without forking the chart.
  MONGODB_URI: "mongodb://{{ .Values.orgServices.ferretdb.host | default "ferretdb.org-services.svc.cluster.local" }}:{{ .Values.orgServices.ferretdb.port | default 27017 }}"
  # Valkey — bp-valkey 1.0.0 deploys to `valkey` namespace (slot 17,
  # see 17-valkey.yaml). Bitnami valkey 5.5.1 with architecture:replication
  # renders Services `valkey-primary` (read/write), `valkey-replicas`,
  # `valkey-headless` — NO plain `valkey` Service exists. Default points
  # at the primary; per-Sovereign overlays MAY override via
  # .Values.orgServices.valkey.host (e.g. for HA replicas read-only or
  # to swap to an external Redis-compatible cache). Cross-ns reachability
  # is granted by templates/org-services/valkey-cross-ns-policy.yaml.
  VALKEY_ADDR: "{{ .Values.orgServices.valkey.host | default "valkey-primary.valkey.svc.cluster.local" }}:{{ .Values.orgServices.valkey.port | default 6379 }}"
  # #3370 — orgPostgres.externalHost (set by slot 13 in shared mode)
  # points the whole mesh at the shared-pg-c instance; empty = the
  # bundled org-pg-rw Service (byte-identical default).
  POSTGRES_HOST: "{{ .Values.orgPostgres.externalHost | default (printf "%s-rw.%s.svc.cluster.local" (.Values.orgPostgres.cluster.name | default "org-pg") (.Values.orgPostgres.cluster.namespace | default "org-services")) }}"
  POSTGRES_PORT: "{{ .Values.orgServices.ferretdb.postgresPort | default 5432 }}"

  # ---- event bus ------------------------------------------------------------
  # See header comment for the topology-aware default selection (issue #942
  # + 2026-05-18 convergence fix). On Sovereigns REDPANDA_BROKERS is
  # intentionally empty — the Organization services treat empty as "skip the
  # legacy Kafka transport" (NATS-only mode).
  REDPANDA_BROKERS: {{ $brokers | quote }}
  # NATS JetStream URL — canonical event bus per ADR-0001 §6. Wired
  # into tenant + billing Deployments (and any future Organization service
  # publishing `catalyst.<domain>.<event>` subjects via
  # events.MultiPublisher). Empty on Catalyst-Zero (no NATS yet);
  # populated on Sovereigns by the default above.
  NATS_URL: {{ $natsURL | quote }}
  # Protocol hint for Organization services that want to switch wire formats per
  # broker without re-reading the URL — `kafka` for Redpanda (legacy
  # contabo), `nats` for NATS JetStream (Sovereign default). Operator-
  # overridable via .Values.orgServices.eventBus.protocol.
  EVENT_BUS_PROTOCOL: {{ default (ternary "nats" "kafka" (ne (toString .Values.global.sovereignFQDN) "")) (index (default (dict) .Values.orgServices.eventBus) "protocol") | quote }}

  # ---- public / CORS endpoints ----------------------------------------------
  CORS_ORIGIN_PUBLIC: {{ $marketplaceOrigin | quote }}
  CORS_ORIGIN_ADMIN: {{ printf "%s,%s" $marketplaceOrigin $adminOrigin | quote }}
  CORS_ORIGIN_GATEWAY: {{ printf "%s,%s,%s,%s" $marketplaceOrigin $adminOrigin $consoleOrigin $portalOrigin | quote }}
  PUBLIC_BASE_URL: {{ $marketplaceOrigin | quote }}
  PUBLIC_API_BASE_URL: {{ printf "%s/api" $marketplaceOrigin | quote }}
  CNAME_TARGET: {{ $marketplaceHost | quote }}

  # ---- checkout redirect targets --------------------------------------------
  CHECKOUT_SUCCESS_URL: {{ printf "%s/checkout/success" $marketplaceOrigin | quote }}
  CHECKOUT_CANCEL_URL: {{ printf "%s/checkout/cancel" $marketplaceOrigin | quote }}

  # ---- BCP region picker (#4525) --------------------------------------------
  # configuredRegions — comma-separated region set this Sovereign was
  # provisioned with. Consumed by the catalog Deployment's
  # CATALYST_CONFIGURED_REGIONS env (catalog.yaml) so GET /catalog/regions
  # returns the REAL regions the marketplace BCP picker must offer. See the
  # resolution-order comment above the data block — same source as the
  # `sovereign-fqdn` ConfigMap, but emitted in THIS namespace so the
  # catalog pod's same-namespace configMapKeyRef actually resolves it
  # (the GET /catalog/regions endpoint then returns the real region set).
  configuredRegions: {{ join "," $cfgRegions | quote }}
{{- end }}
