{{- /*
post-install/post-upgrade hook Job that RELIABLY materialises the
`org-services/provisioning-github-token` Secret (key GITHUB_TOKEN) — #3376
(Refs #3689 #3122 #866).

WHY THIS FILE EXISTS (the `lookup`-on-fresh-install race)
========================================================
The provisioning service Deployment init-gates on a Gitea token Gitea accepts
(wait-for-gitea-token, provisioning.yaml). That token must live in
`org-services/provisioning-github-token` under key GITHUB_TOKEN. The sibling
template provisioning-github-token.yaml mirrors it from the PAT minted into
`catalyst-gitea-token` (key `token`) — but it reads that PAT via
`lookup "v1" "Secret" <ns> catalyst-gitea-token` at TEMPLATE-RENDER time and
emits NOTHING while the PAT is still the empty placeholder.

The PAT is minted by the catalyst-gitea-token mint Job, a `pre-install`/
`pre-upgrade` HOOK (catalyst-gitea-token-secret.yaml, weight 10). Helm
evaluates every `lookup` during the render phase, which runs BEFORE the
pre-install hooks execute AND before the mint Job can reach the (often 10-15m
cold-start) Gitea API to mint. So on a fresh install the lookup sees the empty
placeholder → provisioning-github-token.yaml emits NO Secret → the init
container's secretKeyRef reads empty (optional:true) → the provisioning Pod
sits Init:0/1. The mint hook then populates the PAT, but the HelmRelease sits
at revision v1 and does NOT re-render on its own (a no-op reconcile re-runs the
SAME render with the SAME values → Helm skips it → the lookup never re-fires) →
provisioning-github-token never materialises without a manual `helm upgrade`.
This is the EXACT race #3668/#3454 hit for the Flux auth Secrets; PROVEN live
again on hw174 (the funnel-driving walker had to mirror the token by hand).

FIX
===
A `post-install,post-upgrade` hook Job (this file) that runs AFTER the
pre-install mint hook has populated catalyst-gitea-token. It reads the PAT at
RUNTIME via kubectl (NOT a render-time lookup — no race), POLLS up to a bounded
budget for the mint to land, then idempotently `kubectl apply`s the
provisioning-github-token Secret in org-services with the GITHUB_TOKEN key.
post-* hooks fire on EVERY install AND EVERY upgrade, so a fresh prov gets the
Secret the first time and any later chart bump re-asserts it — independent of
whether the lookup-based sibling ever succeeds.

This is the reliable CREATOR; provisioning-github-token.yaml is left in place
as a harmless redundant fallback (it only ever emits when the render-time
lookup happens to succeed — which never occurs at fresh-install render time —
and writes byte-identical GITHUB_TOKEN content, so the two never fight).

CUTOVER OWNERSHIP (load-bearing — do NOT clobber Step-09)
=========================================================
bp-self-sovereign-cutover Step 09 mints a fresh per-Sovereign Gitea token and
PATCHes provisioning-github-token.GITHUB_TOKEN + stamps
`catalyst.openova.io/token-source=self-sovereign-cutover-step-09`. This Job
MUST NOT overwrite that. Before applying, it checks the live destination
Secret: if it already carries the cutover annotation AND a non-empty
GITHUB_TOKEN, the Job is a no-op (preserves the cutover credential — the same
contract the sibling template's `$cutoverOwned` branch encodes). Otherwise it
(re-)mirrors the bootstrap PAT so a freshly-franchised Sovereign authenticates
before Step 09 runs.

Per docs/PRINCIPLES.md #3 (no kubectl apply of WORKLOADS): this Job only
applies a leaf Secret, exactly as the mint + flux-auth-sync Jobs do —
credential bootstrap that requires the runtime-minted PAT, not a pure-template
value. Per #10 (no plaintext creds): the PAT is read via kubectl into an
emptyDir file and never echoed; the bytes never land on argv or in chart
source. Per #4: namespaces + Secret names + keys flow through .Values.

GATING
======
Rendered ONLY when .Values.ingress.marketplace.enabled (the same discriminator
provisioning-github-token.yaml + the provisioning Deployment use) — the
provisioning service only exists on a marketplace-enabled Sovereign.
*/}}
{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
{{- $namespace := .Release.Namespace -}}
{{- $gt := .Values.orgServices.provisioning.gitToken -}}
{{- $patNS := $gt.patSourceNamespace | default $namespace -}}
{{- $patSecret := $gt.patSourceSecretName | default "catalyst-gitea-token" -}}
{{- $patKey := $gt.patSourceKey | default "token" -}}
{{- $destNS := $gt.destNamespace | default "org-services" -}}
{{- $destSecret := $gt.destSecretName | default "provisioning-github-token" -}}
{{- $destKey := $gt.destKey | default "GITHUB_TOKEN" -}}
{{- $srcNS := $gt.patSourceNamespace | default $namespace -}}
{{- $mirroredFrom := printf "%s/%s" $srcNS $patSecret -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioning-github-token-sync
  namespace: {{ $namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
    catalyst.openova.io/component: provisioning-github-token-sync
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 15 < the Job's weight 20 (#4447). The SA + both RBAC pairs MUST
    # be created (and authorizer-effective) BEFORE the Job pod starts polling.
    # Helm applies a lower-weight hook batch fully and waits for it Ready
    # before the next-higher batch, so a strictly-lower weight guarantees the
    # RoleBinding exists when the Job's `kubectl get secret` first fires —
    # otherwise the read is a silent 403 for the whole poll budget and the
    # Job exit-0's having created nothing → org-services/provisioning-github-
    # token never lands → the provisioning service hangs Init:0/1 forever (the
    # #4447 fresh-prov failure; sibling of the gitea-flux-auth-sync collapse
    # fixed in #4452, which this Job missed).
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
{{- /* Read the PAT from catalyst-gitea-token in the source namespace. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provisioning-github-token-sync-pat-reader
  namespace: {{ $patNS }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 15 < Job weight 20 (#4447) — bind the PAT-read grant BEFORE the
    # Job polls, else the read 403s silently for the whole budget.
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $patSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provisioning-github-token-sync-pat-reader
  namespace: {{ $patNS }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 15 < Job weight 20 (#4447).
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: provisioning-github-token-sync
    namespace: {{ $namespace }}
roleRef:
  kind: Role
  name: provisioning-github-token-sync-pat-reader
  apiGroup: rbac.authorization.k8s.io
---
{{- /* Read the EXISTING dest Secret (cutover-ownership check) + create/patch
       it in the destination namespace. Scoped to the one Secret name. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provisioning-github-token-sync-writer
  namespace: {{ $destNS }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 15 < Job weight 20 (#4447) — bind the secret-write grant BEFORE
    # the Job applies the provisioning-github-token Secret in org-services.
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provisioning-github-token-sync-writer
  namespace: {{ $destNS }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 15 < Job weight 20 (#4447).
    helm.sh/hook-weight: "15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: provisioning-github-token-sync
    namespace: {{ $namespace }}
roleRef:
  kind: Role
  name: provisioning-github-token-sync-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: provisioning-github-token-sync
  namespace: {{ $namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
    catalyst.openova.io/component: provisioning-github-token-sync
    # Required by the kyverno `flux-managed` Enforce policy on converged
    # Sovereigns (the release ns is NOT namespace-excluded) — mirrors the
    # sibling mint + flux-auth-sync Jobs.
    app.kubernetes.io/managed-by: flux
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Weight 20 — STRICTLY GREATER than this Job's own SA + RBAC (weight 15,
    # #4447). Helm installs hooks in ascending weight batches and waits for
    # each batch Ready before the next, so weight-15 RBAC is created AND
    # authorizer-effective before this Job's pod issues its first
    # `kubectl get secret`. Pre-#4447 the RBAC was ALSO weight 20 (same batch,
    # applied together, no ordering guarantee) → the Job frequently started
    # polling before its RoleBinding bound → every read was a silent 403 for
    # the full poll budget → the FATAL branch exit-0'd having created NO
    # Secret → org-services/provisioning-github-token never landed → the
    # provisioning service hung Init:0/1 (the fresh-prov failure #4452 fixed
    # for the sibling flux-auth-sync Job but missed for this one).
    #
    # Cross-phase ordering vs the pre-* mint (catalyst-gitea-token-secret.yaml)
    # is NOT a weight concern — pre-/post-* are independent phases, so no
    # weight can sequence this after the mint. The guard against the mint
    # landing a beat late is the bounded poll loop in the container args
    # (#3763): the Job WAITS for a non-empty token rather than FATAL-on-empty.
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 8
  template:
    metadata:
      labels:
        catalyst.openova.io/blueprint: bp-catalyst-platform
        catalyst.openova.io/component: provisioning-github-token-sync
    spec:
      serviceAccountName: provisioning-github-token-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          # Explicit harbor.openova.io/proxy-dockerhub prefix per CLAUDE.md
          # MIRROR-EVERYTHING rule (matches the mint + flux-auth-sync Jobs).
          image: harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4
          env:
            # Bounded poll budget for the runtime-minted PAT to appear (the
            # mint hook may land a beat after this post-* hook starts; #3763).
            # Default 60 × 5s = 300s, well inside the HR's 30m upgrade timeout.
            - name: POLL_ATTEMPTS
              value: {{ ($gt.patPollAttempts | default 60) | quote }}
            - name: POLL_INTERVAL
              value: {{ ($gt.patPollIntervalSeconds | default 5) | quote }}
            - name: PAT_NAMESPACE
              value: {{ $patNS | quote }}
            - name: PAT_SECRET
              value: {{ $patSecret | quote }}
            - name: PAT_KEY
              value: {{ $patKey | quote }}
            - name: DEST_NAMESPACE
              value: {{ $destNS | quote }}
            - name: DEST_SECRET
              value: {{ $destSecret | quote }}
            - name: DEST_KEY
              value: {{ $destKey | quote }}
            - name: MIRRORED_FROM
              value: {{ $mirroredFrom | quote }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # ── Cutover-ownership guard (do NOT clobber Step-09) ──────────
              # If the dest Secret already carries the cutover token-source
              # annotation AND a non-empty GITHUB_TOKEN, bp-self-sovereign-
              # cutover Step 09 owns it — preserve it verbatim and exit.
              SRC=$(kubectl -n "$DEST_NAMESPACE" get secret "$DEST_SECRET" \
                -o jsonpath='{.metadata.annotations.catalyst\.openova\.io/token-source}' \
                2>/dev/null || true)
              EXISTING=$(kubectl -n "$DEST_NAMESPACE" get secret "$DEST_SECRET" \
                -o jsonpath="{.data.${DEST_KEY}}" 2>/dev/null || true)
              if [ "$SRC" = "self-sovereign-cutover-step-09" ] && [ -n "$EXISTING" ]; then
                echo "[provisioning-github-token-sync] dest carries cutover Step-09 token — preserving, no-op"
                exit 0
              fi
              # ── Poll for the runtime-minted PAT (don't FATAL-on-first-empty;
              #    #3763) ─────────────────────────────────────────────────────
              # `pre-*` and `post-*` hook weights are INDEPENDENT phases, so no
              # weight can order this after the mint; and the mint Secret uses
              # before-hook-creation (no hook-succeeded) so on every upgrade it
              # is deleted-then-recreated → a transient empty window exists. A
              # SINGLE read + exit-1 would crashloop (OnFailure burns
              # backoffLimit) → BackoffLimitExceeded → the bp-catalyst-platform
              # upgrade fails + rolls back + oscillates (the hw158 spine
              # degradation). So poll up to POLL_ATTEMPTS × POLL_INTERVAL.
              POLL_ATTEMPTS="${POLL_ATTEMPTS:-60}"
              POLL_INTERVAL="${POLL_INTERVAL:-5}"
              # #4447 — DISTINGUISH "RBAC/API read FAILING" from "PAT genuinely
              # empty". Pre-fix the read swallowed every error with
              # `2>/dev/null … || true`, so a 403 (RBAC not bound yet) was
              # indistinguishable from an empty `.data.token`. The budget then
              # exhausted on a SILENT 403 and the FATAL branch exit-0'd having
              # created NOTHING — the fresh-prov failure that left
              # org-services/provisioning-github-token absent → provisioning
              # Init:0/1. This Job missed #4452's fix; we mirror it here:
              #   (a) preflight `kubectl auth can-i get secret/<PAT>` — fail
              #       LOUD (exit 1, retry) if RBAC is genuinely missing, so the
              #       hook never "succeeds" without ever being able to read;
              #   (b) on each poll, capture the read's exit code so a transient
              #       API/authorizer-propagation error is logged and retried,
              #       NOT misread as "PAT empty";
              #   (c) only treat a CLEAN read of empty `.data.token` as the
              #       benign mint-race (self-heals next reconcile, exit 0);
              #       any other terminal state is exit 1 (fail-loud).
              #
              # (a) Preflight: with the weight-15 RBAC (< this Job's 20) the
              # RoleBinding is created before this pod starts, but authorizer
              # cache propagation can lag a beat — so we POLL can-i briefly
              # rather than asserting once. If it never resolves, the grant is
              # genuinely absent (a chart/RBAC bug) → fail loud.
              rbac_ok=""
              j=1
              while [ "$j" -le 12 ]; do
                if kubectl -n "$PAT_NAMESPACE" auth can-i get \
                     "secret/${PAT_SECRET}" >/dev/null 2>/tmp/canierr; then
                  rbac_ok=1
                  break
                fi
                echo "[provisioning-github-token-sync] waiting for PAT-read RBAC to bind on ${PAT_NAMESPACE}/${PAT_SECRET} ($j/12): $(cat /tmp/canierr 2>/dev/null)"
                j=$((j + 1))
                sleep 5
              done
              if [ -z "$rbac_ok" ]; then
                echo "[provisioning-github-token-sync] FATAL(#4447): cannot 'get secret/${PAT_SECRET}' in ${PAT_NAMESPACE} after RBAC wait — the pat-reader Role/RoleBinding (hook-weight 15) did not bind. This is an RBAC bug, NOT a benign mint-race; failing LOUD so the Job retries and the umbrella install surfaces it rather than silently creating zero auth Secrets." >&2
                exit 1
              fi
              # (b)+(c) Poll the token. A non-zero kubectl exit = a READ ERROR
              # (API/authorizer/connection) → retry, never confuse with empty.
              read_errors=0
              i=1
              while [ "$i" -le "$POLL_ATTEMPTS" ]; do
                # errexit-safe: a non-zero kubectl exit in a `var=$(...)`
                # assignment would trip `set -e` BEFORE we can inspect rc, so
                # capture rc with `|| rc=$?` and default rc=0 on success.
                rc=0
                rawb64="$(kubectl -n "$PAT_NAMESPACE" get secret "$PAT_SECRET" \
                  -o jsonpath="{.data.${PAT_KEY}}" 2>/tmp/readerr)" || rc=$?
                if [ "$rc" -ne 0 ]; then
                  read_errors=$((read_errors + 1))
                  echo "[provisioning-github-token-sync] read error on ${PAT_NAMESPACE}/${PAT_SECRET} (attempt $i/${POLL_ATTEMPTS}, rc=$rc): $(cat /tmp/readerr 2>/dev/null) — retrying"
                else
                  printf '%s' "$rawb64" | base64 -d > /tmp/token 2>/dev/null || true
                  if [ -s /tmp/token ]; then
                    echo "[provisioning-github-token-sync] ${PAT_NAMESPACE}/${PAT_SECRET}.${PAT_KEY} populated (attempt $i/${POLL_ATTEMPTS})"
                    break
                  fi
                  echo "[provisioning-github-token-sync] ${PAT_NAMESPACE}/${PAT_SECRET}.${PAT_KEY} present but empty ($i/${POLL_ATTEMPTS}) — mint hook not landed yet"
                fi
                i=$((i + 1))
                sleep "$POLL_INTERVAL"
              done
              if [ ! -s /tmp/token ]; then
                # Budget exhausted with no usable PAT. Two terminal cases:
                #   - reads were ERRORING (API/RBAC/connection) → fail LOUD
                #     (exit 1) so backoffLimit retries + the install surfaces
                #     the real fault; NEVER mask a read failure as success.
                #   - reads were CLEAN but `.data.token` stayed empty → the
                #     benign mint-race (#3763/#3781): the mint genuinely hasn't
                #     populated the token; provisioning-github-token self-heals
                #     on the next reconcile once it does → exit 0.
                if [ "$read_errors" -gt 0 ]; then
                  echo "[provisioning-github-token-sync] FATAL(#4447): ${read_errors} read error(s) on ${PAT_NAMESPACE}/${PAT_SECRET} across ${POLL_ATTEMPTS} attempts — the PAT was never readable (API/RBAC fault), so the dest Secret was NOT created. Failing LOUD (exit 1) so the Job retries; last error: $(cat /tmp/readerr 2>/dev/null)" >&2
                  exit 1
                fi
                echo "[provisioning-github-token-sync] WARN: ${PAT_NAMESPACE}/${PAT_SECRET}.${PAT_KEY} still empty after ${POLL_ATTEMPTS} attempts (~$((POLL_ATTEMPTS * POLL_INTERVAL))s) but READABLE — benign mint-race; catalyst-platform NOT wedged; provisioning-github-token self-heals on the next reconcile once the mint lands (#3763/#3781). exit 0." >&2
                exit 0
              fi
              # ── Idempotent create-or-update of the dest Secret with the PAT
              #    under the GITHUB_TOKEN key. `create --dry-run | apply` keeps
              #    the bytes off argv and is the canonical idempotent-apply
              #    idiom. The reflector annotations mirror the sibling template
              #    so catalyst-api (catalyst-system) can read GITHUB_TOKEN via
              #    secretKeyRef for CATALYST_GITOPS_TOKEN (TBD-C18). ───────────
              kubectl create secret generic "$DEST_SECRET" -n "$DEST_NAMESPACE" \
                --from-file="${DEST_KEY}=/tmp/token" \
                --dry-run=client -o yaml \
                | kubectl annotate --local -f - -o yaml \
                    "catalyst.openova.io/mirrored-from=${MIRRORED_FROM}" \
                    "helm.sh/resource-policy=keep" \
                    "reflector.v1.k8s.emberstack.com/reflection-allowed=true" \
                    "reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces=catalyst-system" \
                    "reflector.v1.k8s.emberstack.com/reflection-auto-enabled=true" \
                    "reflector.v1.k8s.emberstack.com/reflection-auto-namespaces=catalyst-system" \
                | kubectl label --local -f - -o yaml \
                    catalyst.openova.io/blueprint=bp-catalyst-platform \
                    catalyst.openova.io/component=provisioning-github-token \
                    app.kubernetes.io/part-of=org \
                | kubectl apply -f -
              rm -f /tmp/token
              echo "[provisioning-github-token-sync] applied ${DEST_NAMESPACE}/${DEST_SECRET}.${DEST_KEY}"
              # #4447 (defense in depth, mirroring #4452's verify-back): READ
              # BACK the dest Secret with a non-empty ${DEST_KEY}. This Job is
              # the sole reliable creator; an apply that silently produced an
              # empty/absent Secret would leave the provisioning init-gate
              # reading nothing → Init:0/1 with no signal. Fail LOUD (exit 1,
              # retry) rather than report Succeeded on a phantom Secret.
              vrc=0
              vtok="$(kubectl -n "$DEST_NAMESPACE" get secret "$DEST_SECRET" \
                -o jsonpath="{.data.${DEST_KEY}}" 2>/tmp/verifyerr)" || vrc=$?
              if [ "$vrc" -ne 0 ] || [ -z "$vtok" ]; then
                echo "[provisioning-github-token-sync] FATAL(#4447): post-apply verify FAILED for ${DEST_NAMESPACE}/${DEST_SECRET} (rc=$vrc, token-empty=$([ -z "$vtok" ] && echo yes || echo no)) — the provisioning init-gate would read an absent/empty ${DEST_KEY}. Failing LOUD so the Job retries; err: $(cat /tmp/verifyerr 2>/dev/null)" >&2
                exit 1
              fi
              echo "[provisioning-github-token-sync] verified ${DEST_NAMESPACE}/${DEST_SECRET} present with non-empty ${DEST_KEY}"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
