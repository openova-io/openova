{{- /*
Provisioning service GitHub-token Secret for franchised Sovereigns
(issue #866).

Why this template exists:
  The Organization `provisioning` service Deployment references
  `secret/provisioning-github-token` with key `GITHUB_TOKEN` as a
  required env (provisioning.yaml). On contabo-mkt this Secret is
  pre-provisioned via SealedSecret. On a freshly franchised Sovereign
  nothing equivalent existed — caught live on otech103 (2026-05-04)
  where the provisioning Pod was the last 1/13 still in
  CreateContainerConfigError after #859 + #861 + #863 cleared the
  other 12 pods.

  This template materialises the Secret as part of the chart so any
  Sovereign that flips MARKETPLACE_ENABLED=true gets a working
  provisioning Pod out of the box, completing the Organization stack
  (12/13 → 13/13 Running 1/1).

Approach (issue #866 Option C — local Gitea target; corrected by #3122):
  Post-cutover the canonical Git target on a Sovereign IS the local
  Gitea instance (the GitRepository CRs already point there), not
  upstream GitHub. We mirror a REAL Gitea PAT into the `org-services` namespace
  under the canonical key name `GITHUB_TOKEN` that the provisioning
  service + catalyst-api read. The env-var name stays GITHUB_TOKEN
  because the provisioning service code (core/services/provisioning/
  main.go) reads that exact env name; renaming it to GIT_TOKEN would
  ripple through provisioning.yaml + main.go + provisioning Go
  packages without changing behaviour.

  Source of the PAT (#3122 fix): the `catalyst-gitea-token` Secret
  (key `token`) minted by this same chart's
  templates/catalyst-gitea-token-secret.yaml pre-install hook (it POSTs
  /api/v1/users/{admin}/tokens with scopes:["all"]). The PRE-#3122
  source was gitea-admin-secret's PASSWORD — but a Gitea admin password
  is NOT a Gitea API token: Gitea rejects password-auth for git
  operations ("Password authentication is not supported for Git
  operations"), so the first tenant gitops push 401'd. Proven live on
  hw101 (operator POST /api/v1/organizations, deployment e19b083c): the 32-char
  admin password -> 401 vs Gitea /api/v1/user; the 40-char
  catalyst-gitea-token PAT -> 200 as gitea_admin.

  Per docs/INVIOLABLE-PRINCIPLES.md #3 (no workarounds): full Gitea
  REST-API target support in core/services/provisioning/github/
  client.go (which currently hardcodes https://api.github.com) is a
  separate follow-up. This Secret unblocks the Pod reaching Running
  1/1 — completing the Organization stack — and now carries a credential that
  actually authenticates against the local Gitea.

Why a lookup-and-mirror (not Reflector on catalyst-gitea-token)?
  The lookup-and-mirror pattern keeps the cross-namespace coupling
  local to bp-catalyst-platform (where it belongs) and matches the
  precedent set by valkey-cross-ns-secret.yaml (#863) and
  org-services-secrets.yaml (#859). It also lets us mirror ONLY the PAT byte
  under the GITHUB_TOKEN key (Reflector would mirror the entire source
  Secret, including catalyst-gitea-token's `url` key).

First-install ordering:
  The PAT source `catalyst-gitea-token` is minted by this SAME chart's
  templates/catalyst-gitea-token-secret.yaml as a pre-install hook
  (helm.sh/hook-weight 5 for the Secret, 10 for the mint Job). Helm
  applies pre-install hooks BEFORE the regular release resources — and
  this provisioning-github-token Secret is a regular resource — so the
  PAT bytes are populated in catalyst-gitea-token by the time this
  template's lookup runs. (Both templates also gate on the same source,
  gitea-admin-secret: the minter needs the admin password to call the
  Gitea token API, this template needs the PAT the minter produced.)

  In the rare degraded path where the minter Job has created the
  catalyst-gitea-token Secret but not yet patched the real PAT in (the
  Secret carries an empty `token` placeholder), the non-empty guard
  below renders NO Secret. The provisioning Pod stays in
  CreateContainerConfigError and Flux's 15m reconcile picks up the
  mirror once the PAT is patched. Restart-on-config-error backoff
  handles that gracefully (steady state ~2-5 min after the mint Job).

Per docs/INVIOLABLE-PRINCIPLES.md #10: NO plaintext credentials in this
template. The PAT lives only in catalyst-gitea-token and is read back
via lookup; the bytes never appear in chart source or rendered
manifests on disk.

Per #4 (never hardcode): source/destination namespace + Secret names
flow through .Values.orgServices.provisioning.gitToken.* with sensible
defaults (the PAT source defaults to the release namespace +
catalyst-gitea-token/token; an operator pointing provisioning at a
non-Gitea Git host overrides patSource* without forking).

Cutover ownership handover (TBD-C18b, 2026-05-18):
  bp-self-sovereign-cutover Step 09 (09-gitea-token-mint-job.yaml) mints
  a fresh per-Sovereign Gitea API token via POST /api/v1/users/{user}/
  tokens, then PATCHes this Secret's GITHUB_TOKEN field with the new
  bytes and stamps two annotations onto the Secret:
    catalyst.openova.io/token-minted-at:  <RFC3339 timestamp>
    catalyst.openova.io/token-source:     "self-sovereign-cutover-step-09"
  Pre-#3122 the first-install placeholder was the gitea ADMIN PASSWORD,
  which is NOT a valid API token (Gitea treats Bearer credentials as
  sha1-hashed access-token rows in the `users` table, not as the admin
  password) — so it booted the Pod past CreateContainerConfigError but
  could NOT actually mint tenant repos in Gitea. #3122 swaps the
  first-install source to the real catalyst-gitea-token PAT, so the
  bootstrap credential authenticates too; Step 09's token then takes
  over post-cutover as the canonical per-Sovereign credential.

  Without the lookup-persistence guard added below, every chart reconcile
  (every 15 min by default Flux interval) overwrites the minted token
  back to the bootstrap token, undoing Step 09 silently. Verified live
  on t22 (2026-05-18): Step 09 ran 13:43:33Z setting GITHUB_TOKEN to a
  fresh API token, then ~5 min later helm reconcile of catalyst-platform
  rewrote GITHUB_TOKEN back. C18 fix was ephemeral until this guard
  landed.

  Guard semantics: lookup the destination Secret first. If it exists
  AND has the `catalyst.openova.io/token-source` annotation set to
  "self-sovereign-cutover-step-09", preserve the existing GITHUB_TOKEN
  bytes verbatim (re-emit the b64 byte string from the live Secret).
  Otherwise fall through to the first-install bootstrap branch that
  mirrors the catalyst-gitea-token PAT (so a freshly-franchised
  Sovereign's first tenant gitops push authenticates against Gitea
  before Step 09 has had a chance to run).
*/}}
{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
{{- /* Source (issue #3122): the REAL Gitea PAT minted into
       catalyst-gitea-token (key `token`) by THIS chart's
       templates/catalyst-gitea-token-secret.yaml pre-install hook —
       NOT the gitea admin PASSWORD. The hook runs at hook-weight 5/10,
       i.e. before this regular (non-hook) resource is applied, so the
       PAT is already populated by the time this lookup runs. An empty
       patSourceNamespace resolves to the release namespace where the
       minter writes the Secret (catalyst-system). */ -}}
{{- $sourceNamespace := .Values.orgServices.provisioning.gitToken.patSourceNamespace | default .Release.Namespace -}}
{{- $sourceSecretName := .Values.orgServices.provisioning.gitToken.patSourceSecretName | default "catalyst-gitea-token" -}}
{{- $sourcePatKey := .Values.orgServices.provisioning.gitToken.patSourceKey | default "token" -}}
{{- $destNamespace := .Values.orgServices.provisioning.gitToken.destNamespace | default "org-services" -}}
{{- $destSecretName := .Values.orgServices.provisioning.gitToken.destSecretName | default "provisioning-github-token" -}}
{{- $destKey := .Values.orgServices.provisioning.gitToken.destKey | default "GITHUB_TOKEN" -}}
{{- /* Lookup the destination Secret first to detect whether Step 09 of
       bp-self-sovereign-cutover has already taken ownership. If yes,
       preserve the minted token bytes verbatim — the chart MUST NOT
       clobber the cutover-issued credential. */ -}}
{{- $destSecret := lookup "v1" "Secret" $destNamespace $destSecretName -}}
{{- $cutoverOwned := false -}}
{{- $existingTokenB64 := "" -}}
{{- $preservedMintedAt := "" -}}
{{- /* #3376 (Refs #3689): track the cutover annotation INDEPENDENTLY of
       $cutoverOwned so the bootstrap branch never STRIPS it. Previously
       the token-source annotation was re-emitted only inside the
       $cutoverOwned branch (which requires both the annotation AND the
       data key present at lookup time); any reconcile that fell through to
       the bootstrap branch dropped the annotation, breaking the
       provisioning-github-token.yaml ↔ cutover Step-09 contract and the
       reflector-backed CATALYST_GITOPS_TOKEN provenance. We now preserve
       the annotation whenever the LIVE Secret carries it, on either
       branch. */ -}}
{{- $annotCutover := false -}}
{{- if and $destSecret $destSecret.metadata $destSecret.metadata.annotations -}}
  {{- $tokenSource := index $destSecret.metadata.annotations "catalyst.openova.io/token-source" -}}
  {{- if eq $tokenSource "self-sovereign-cutover-step-09" -}}
    {{- $annotCutover = true -}}
    {{- $preservedMintedAt = index $destSecret.metadata.annotations "catalyst.openova.io/token-minted-at" -}}
    {{- if and $destSecret.data (index $destSecret.data $destKey) -}}
      {{- $cutoverOwned = true -}}
      {{- $existingTokenB64 = index $destSecret.data $destKey -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- /* Bootstrap (pre-cutover) source: the PAT in catalyst-gitea-token.
       Only mirror when the PAT key is present AND non-empty — the minter
       creates the Secret with an empty `token` placeholder before its
       mint Job patches the real bytes in, and mirroring an empty token
       would write a useless GITHUB_TOKEN (no better than the old
       password). Guarding on non-empty keeps the destination Secret out
       of the way until the real PAT exists, so Flux's reconcile fills it
       once the minter completes. */ -}}
{{- $sourceSecret := lookup "v1" "Secret" $sourceNamespace $sourceSecretName -}}
{{- $haveBootstrap := false -}}
{{- $bootstrapTokenB64 := "" -}}
{{- if and $sourceSecret $sourceSecret.data (index $sourceSecret.data $sourcePatKey) -}}
  {{- $patB64 := index $sourceSecret.data $sourcePatKey -}}
  {{- if not (empty ($patB64 | b64dec)) -}}
    {{- $haveBootstrap = true -}}
    {{- $bootstrapTokenB64 = $patB64 -}}
  {{- end -}}
{{- end -}}
{{- if or $cutoverOwned $haveBootstrap -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $destSecretName }}
  namespace: {{ $destNamespace }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
    catalyst.openova.io/component: provisioning-github-token
    app.kubernetes.io/part-of: org
  annotations:
    # Identifies the upstream source for ops visibility — `kubectl describe
    # secret provisioning-github-token -n org-services` makes the provenance obvious
    # without tribal knowledge.
    catalyst.openova.io/mirrored-from: {{ printf "%s/%s" $sourceNamespace $sourceSecretName | quote }}
    # Survive helm uninstall — the Secret outlives the release. A
    # subsequent helm install picks the bytes back up via lookup, so
    # the provisioning Pod stays Running across reinstalls without a
    # restart-storm.
    helm.sh/resource-policy: keep
    # Reflector mirror into `catalyst-system` (TBD-C18, issue #1745):
    # the catalyst-api Pod (in catalyst-system) reads GITHUB_TOKEN via
    # secretKeyRef to source CATALYST_GITOPS_TOKEN — the real Gitea
    # API token minted by bp-self-sovereign-cutover Step 09. Without
    # this mirror, catalyst-api's POST /api/v1/sovereigns/{id}/
    # marketplace and the Organization tenant gitops writer both return 503
    # "gitops token unconfigured — set CATALYST_GITOPS_TOKEN" because
    # K8s secretKeyRef is same-namespace-only and Step 09's destination
    # lives in `org-services`.
    #
    # Pattern mirrors org-services-secrets.yaml's reflector block (same chart,
    # same destination namespace) — see that file for the field-by-
    # field rationale.
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "catalyst-system"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "catalyst-system"
    {{- if $annotCutover }}
    # bp-self-sovereign-cutover Step 09 has stamped this Secret. Preserve
    # the token-source + token-minted-at annotations on EVERY branch
    # (#3376) so a reconcile that falls through to the bootstrap branch
    # below — e.g. the cutover token bytes momentarily absent at lookup —
    # never STRIPS the cutover provenance and re-triggers the split
    # contract. The $cutoverOwned data branch additionally re-emits the
    # existing token bytes verbatim; here we only guarantee the annotation
    # survives.
    catalyst.openova.io/token-source: "self-sovereign-cutover-step-09"
    {{- if $preservedMintedAt }}
    catalyst.openova.io/token-minted-at: {{ $preservedMintedAt | quote }}
    {{- end }}
    {{- end }}
type: Opaque
data:
  {{- if $cutoverOwned }}
  # Preserve the cutover-minted token bytes verbatim. Do NOT overwrite
  # with the bootstrap PAT — the cutover Step 09 token is the canonical
  # post-cutover credential. See TBD-C18b for the live regression this
  # guard prevents.
  {{ $destKey }}: {{ $existingTokenB64 | quote }}
  {{- else }}
  # First-install bootstrap (issue #3122): emit the REAL Gitea PAT from
  # catalyst-gitea-token verbatim under the env-name the provisioning
  # service + catalyst-api read. Unlike the pre-#3122 gitea admin
  # PASSWORD this is a valid Gitea API token, so the very first tenant
  # gitops push authenticates (Gitea rejects password-auth for git ops).
  # bp-self-sovereign-cutover Step 09 later mints its own per-Sovereign
  # token and takes ownership via the cutover annotation above.
  {{ $destKey }}: {{ $bootstrapTokenB64 | quote }}
  {{- end }}
{{- end }}
{{- end }}
