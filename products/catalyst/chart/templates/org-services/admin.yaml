{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: org-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: org-admin
  template:
    metadata:
      labels:
        policy.cilium.io/enforced: "true"  # Wave 5.121 #2466
        app: org-admin
    spec:
      serviceAccountName: admin
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: admin
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}{{ else }}{{ .Values.images.registry }}{{ end }}/{{ .Values.images.organization }}/admin:{{ default .Values.images.orgTag (default "" .Values.images.admin.tag) }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: org-services
  {{- if (((.Values.multiRegion).enabled)) }}
  # #5289 multi-region: publish the Organization back-office (BSS admin) as a
  # Cilium ClusterMesh global Service so region-b's edge stub (marketplace.
  # <fqdn> /back-office/*) resolves to this region-a pod. Gated → byte-unchanged.
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/shared: "true"
  {{- end }}
spec:
  selector:
    app: org-admin
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
