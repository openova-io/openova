{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: org-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: org-catalog
  template:
    metadata:
      labels:
        policy.cilium.io/enforced: "true"  # Wave 5.121 #2466
        app: org-catalog
    spec:
      serviceAccountName: catalog
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: catalog
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}{{ else }}{{ .Values.images.registry }}{{ end }}/{{ .Values.images.organization }}/services-catalog:{{ .Values.images.orgTag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: MONGODB_URI
            - name: MONGODB_DB
              value: "catalog"
            - name: REDPANDA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: REDPANDA_BROKERS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: JWT_SECRET
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: CORS_ORIGIN_PUBLIC
            # #4525 — the Sovereign's configured regions (comma-separated)
            # so GET /catalog/regions returns the REAL region set the
            # marketplace BCP picker must offer (not hardcoded Hetzner
            # names). Same source the fleet handler trusts — the
            # `sovereign-fqdn` ConfigMap's `configuredRegions` key, written
            # at provision time. optional=true so Sovereigns without the
            # key (legacy / Catalyst-Zero) start cleanly with the env
            # empty; /catalog/regions then returns [] and the frontend
            # keeps its static fallback.
            - name: CATALYST_CONFIGURED_REGIONS
              valueFrom:
                configMapKeyRef:
                  name: sovereign-fqdn
                  key: configuredRegions
                  optional: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: org-services
spec:
  selector:
    app: org-catalog
  ports:
    - port: 8082
      targetPort: 8082
{{- end }}
