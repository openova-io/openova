{{- /*
Auto-create the `org-services` namespace on Sovereigns where the
marketplace is enabled.

#3383: this namespace was named `sme` (after a single persona). It is
now `org-services` — one Organization machinery, persona-neutrally named.
The chart roll CREATES `org-services` and Flux reconciles every workload
template into it; the old `sme` namespace (pre-#3383) is fully retired (#3985).

Why: every other template under templates/org-services/* (billing.yaml,
auth.yaml, ferretdb.yaml, valkey-cross-ns-secret.yaml,
org-services-secrets.yaml, provisioning-github-token.yaml, ...) emits
resources with `namespace: org-services`. On Catalyst-Zero (contabo) the
namespace is pre-provisioned by clusters/contabo-mkt/apps/sme/* — so the
chart never needed to create it. On a freshly franchised Sovereign nothing
else provisions it, so without this template Helm install fails with
`failed to create resource: namespaces "org-services" not found`.

Kustomize-mode contabo build is unaffected: this template is
excluded from `templates/org-services/kustomization.yaml`'s
`resources:` list (the contabo build manages its namespace
via clusters/contabo-mkt/apps/sme/namespace.yaml).

helm.sh/resource-policy: keep — never delete the namespace on a
chart uninstall (would cascade-delete every Organization workload).

Issue #1943 (TBD-A51, 2026-05-19): the marketplace.enabled gate
removed here so `org-services-secrets` (sibling template) has a
namespace to land in on every fresh prov. The Organization microservice
mesh (billing.yaml, auth.yaml, gateway.yaml, ...) remains gated behind
`ingress.marketplace.enabled` (operator opt-in); only the
namespace + reflector-source Secret materialise unconditionally,
which is what catalyst-api's CATALYST_ORG_JWT_SECRET secretKeyRef
mirror needs.
*/ -}}
apiVersion: v1
kind: Namespace
metadata:
  name: org-services
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: catalyst-platform
    catalyst.openova.io/sovereign: {{ .Values.global.sovereignFQDN | quote }}
  annotations:
    helm.sh/resource-policy: keep
    catalyst.openova.io/created-by: bp-catalyst-platform
