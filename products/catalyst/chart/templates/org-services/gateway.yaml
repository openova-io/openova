{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: org-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: org-gateway
  template:
    metadata:
      labels:
        policy.cilium.io/enforced: "true"  # Wave 5.121 #2466
        app: org-gateway
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: gateway
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}{{ else }}{{ .Values.images.registry }}{{ end }}/{{ .Values.images.organization }}/services-gateway:{{ .Values.images.orgTag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: JWT_SECRET
            - name: VALKEY_ADDR
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: VALKEY_ADDR
            {{- /* #5487 — VALKEY_PASSWORD is rendered ONLY when the operator
                 has declared that Valkey wants a password. bp-valkey ships
                 `auth.enabled: false` since 1.0.2 (TBD-V12 #2003), so bitnami
                 creates no `valkey` Secret, the lookup in
                 valkey-cross-ns-secret.yaml finds nothing, and
                 `org-valkey-auth` never exists — verified live on hw291. The
                 previous unconditional `optional: true` ref therefore READ as
                 authenticated while RESOLVING to anonymous on every Sovereign.
                 Default (auth off) now emits no env at all: the manifest says
                 exactly what the connection does, and
                 core/services/shared/db/valkey.go takes its no-auth path on the
                 empty value as before. With auth on, `optional: false` makes a
                 missing mirror a LOUD CreateContainerConfigError (kubelet
                 retries until the mirror lands) rather than a silent
                 anonymous connect. The `default` ACL user uses requirepass, so
                 VALKEY_USERNAME stays empty either way. Issue #863. */}}
            {{- if .Values.orgServices.valkey.auth.enabled }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orgServices.valkey.destSecretName | default "org-valkey-auth" }}
                  key: {{ .Values.orgServices.valkey.sourcePasswordKey | default "valkey-password" }}
                  optional: false
            {{- end }}
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: CORS_ORIGIN_GATEWAY
            - name: AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: AUTH_URL
            - name: CATALOG_URL
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: CATALOG_URL
            - name: TENANT_URL
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: TENANT_URL
            - name: PROVISIONING_URL
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: PROVISIONING_URL
            - name: BILLING_URL
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: BILLING_URL
            - name: DOMAIN_URL
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: DOMAIN_URL
            - name: NOTIFICATION_URL
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: NOTIFICATION_URL
            - name: RATE_LIMIT_RPM
              # A single console tab polls /tenant/orgs + /provisioning/jobs
              # every 1.5s during active work (=80 rpm) plus incidental
              # /catalog/* + /provisioning/backing-services calls; 120 rpm
              # was tight enough that a logged-in user saw intermittent
              # 429s during normal use (issue #106). 600 rpm = 10 req/s
              # per IP, still tight enough to throttle abuse.
              value: "600"
            # Trusted-proxy allowlist: only X-Forwarded-For / X-Real-IP headers
            # received from these CIDRs are honoured. 10.42.0.0/16 is the k3s
            # pod CIDR, which Traefik (the only legitimate upstream) sits in.
            # Direct callers from outside the cluster are untrusted — their
            # XFF headers are ignored so they cannot rotate rate-limit buckets.
            - name: GATEWAY_TRUSTED_PROXIES
              value: "10.42.0.0/16"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: org-services
  {{- if (((.Values.multiRegion).enabled)) }}
  # #5289 multi-region: publish the Organization BSS gateway as a Cilium
  # ClusterMesh global Service so region-b's edge stub (marketplace.<fqdn>
  # /api/*) resolves to this region-a pod. Gated → single-region byte-unchanged.
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/shared: "true"
  {{- end }}
spec:
  selector:
    app: org-gateway
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
