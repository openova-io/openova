{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: org-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: org-auth
  template:
    metadata:
      annotations:
        # Auto-roll when the Sovereign SMTP seed flips empty→populated (#4919).
        # SMTP_* below are secretKeyRef env, frozen by the kubelet at Pod start.
        # sovereign_smtp_seed.go seeds the relay (mail.openova.io) asynchronously,
        # so on a fresh prov this Pod can start BEFORE the seed lands →
        # org-services-secrets is baked correct on the next reconcile but this Pod
        # keeps stale-empty SMTP env → POST /auth/magic-link silently no-sends the
        # anonymous signup PIN. This checksum changes when the seed appears,
        # forcing Flux to roll auth onto the populated env. See _smtp-helpers.tpl.
        checksum/smtp-config: {{ include "catalyst.orgSmtpChecksum" . | quote }}
      labels:
        policy.cilium.io/enforced: "true"  # Wave 5.121 #2466
        app: org-auth
    spec:
      serviceAccountName: auth
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: auth
          # Templated through global.imageRegistry so the #4885 cutover step-07 HR
          # patch pivots this Pod to the Sovereign's local Harbor during the
          # deny-egress hold — identical form to its 9 org-services siblings
          # (catalog/gateway/domain/…). The SHA comes from values.yaml
          # `images.orgTag` (the shared Organization-services bundle tag), which
          # the services-build deploy-bot already bumps in lockstep — so the
          # workflow's now-inert `services-auth:<sha>` literal sed is a documented
          # no-op (see services-build.yaml). This is the auth-template flip that
          # workflow anticipated.
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}{{ else }}{{ .Values.images.registry }}{{ end }}/{{ .Values.images.organization }}/services-auth:{{ .Values.images.orgTag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orgPostgres.credentialSecret | default "org-pg-app" }}
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orgPostgres.credentialSecret | default "org-pg-app" }}
                  key: password
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: POSTGRES_PORT
            - name: DATABASE_URL
              value: "postgres://$(PG_USER):$(PG_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/org_auth?sslmode=disable"
            - name: VALKEY_ADDR
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: VALKEY_ADDR
            {{- /* #5487 — VALKEY_PASSWORD is rendered ONLY when the operator
                 has declared that Valkey wants a password. bp-valkey ships
                 `auth.enabled: false` since 1.0.2 (TBD-V12 #2003), so bitnami
                 creates no `valkey` Secret, the lookup in
                 valkey-cross-ns-secret.yaml finds nothing, and
                 `org-valkey-auth` never exists — verified live on hw291. The
                 previous unconditional `optional: true` ref therefore READ as
                 authenticated while RESOLVING to anonymous on every Sovereign.
                 Default (auth off) now emits no env at all: the manifest says
                 exactly what the connection does, and
                 core/services/shared/db/valkey.go takes its no-auth path on the
                 empty value as before. With auth on, `optional: false` makes a
                 missing mirror a LOUD CreateContainerConfigError (kubelet
                 retries until the mirror lands) rather than a silent
                 anonymous connect. The `default` ACL user uses requirepass, so
                 VALKEY_USERNAME stays empty either way. Issue #863. */}}
            {{- if .Values.orgServices.valkey.auth.enabled }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orgServices.valkey.destSecretName | default "org-valkey-auth" }}
                  key: {{ .Values.orgServices.valkey.sourcePasswordKey | default "valkey-password" }}
                  optional: false
            {{- end }}
            - name: REDPANDA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: REDPANDA_BROKERS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: JWT_REFRESH_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: PUBLIC_API_BASE_URL
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: SMTP_PORT
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: SMTP_FROM
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: SMTP_PASS
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: org-services-config
                  key: CORS_ORIGIN_ADMIN
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: org-services-secrets
                  key: ADMIN_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: org-services
spec:
  selector:
    app: org-auth
  ports:
    - port: 8081
      targetPort: 8081
{{- end }}
