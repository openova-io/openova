{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
# Dedicated ServiceAccount per Organization microservice.
#
# The `default` SA was being used by everything (see issue #76), which means
# a token compromise on any single pod would grant the same default-SA
# permissions to the attacker everywhere. By giving each service its own SA
# we get (a) isolated identities for audit, (b) a per-service blast radius
# for any future RoleBinding, and (c) a clear invariant: only the
# provisioning SA may talk to the Kubernetes API.
#
# All SAs below set automountServiceAccountToken: false at the SA level.
# None of these services (except provisioning — handled in provisioning.yaml)
# talk to the Kubernetes API, so they don't need a mounted SA token and the
# `default` SA's token was pure blast-radius expansion.
#
# Note: `automountServiceAccountToken: false` on the SA is overridden at the
# pod spec level if the pod sets it to true. For defence in depth the pod
# spec is also being set to false in each deployment manifest. SA-level flag
# protects against a future deployment that forgets to set it.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth
  namespace: org-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: org-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: org-services
automountServiceAccountToken: false
---
# organizations SA (renamed from `tenant`, #5435 / UAT row 121 — the
# workload identity is renamed in lockstep with the Deployment so a
# `kubectl get sa -n org-services` read carries no banned entity-noun
# either). The service does not talk to the Kubernetes API, so no token
# is mounted (mirrored at pod spec in organization.yaml). The Sandbox
# orchestrator that needed one was removed with the withdrawn Sandbox
# (decision record 0023), and with it the Role and RoleBinding that let
# it create Sandbox objects.
#
# UAT row 121 / #3383 — renamed off `tenant` in lockstep with the
# Deployment + Service in organization.yaml. The Go source directory
# core/services/tenant/ keeps its path (it is not an object name and
# reaches no console surface); the RUNTIME object names are what the
# showback table reads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: organizations
  namespace: org-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: domain
  namespace: org-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: billing
  namespace: org-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification
  namespace: org-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: marketplace
  namespace: org-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console
  namespace: org-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin
  namespace: org-services
automountServiceAccountToken: false
{{- end }}
