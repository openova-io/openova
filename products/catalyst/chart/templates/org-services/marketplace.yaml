{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace
  namespace: org-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: org-marketplace
  template:
    metadata:
      labels:
        policy.cilium.io/enforced: "true"  # Wave 5.121 #2466
        app: org-marketplace
    spec:
      serviceAccountName: marketplace
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: marketplace
          # SHA-pinned tag bumped by .github/workflows/marketplace-build.yaml.
          # This file is applied as raw YAML by the contabo-mkt Flux Kustomization
          # (`./products/catalyst/chart/templates/org-services`), so it must contain
          # concrete strings — Helm template syntax silently produces an
          # InvalidImageName when Kustomize-applied. Sovereigns skip via .helmignore.
          image: ghcr.io/openova-io/openova/marketplace:34ff594
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: marketplace
  namespace: org-services
spec:
  selector:
    app: org-marketplace
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
