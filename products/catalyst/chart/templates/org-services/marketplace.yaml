{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace
  namespace: org-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: org-marketplace
  template:
    metadata:
      labels:
        policy.cilium.io/enforced: "true"  # Wave 5.121 #2466
        app: org-marketplace
    spec:
      serviceAccountName: marketplace
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: marketplace
          # Registry honours global.imageRegistry so the #4885 cutover step-07 HR
          # patch pivots this Pod to the Sovereign's local Harbor during the
          # deny-egress hold (matching the 9 templated org-services siblings +
          # catalyst-ui #4563). The mutable SHA tag lives in values.yaml
          # `images.marketplaceTag`, bumped by .github/workflows/marketplace-build.yaml
          # (it no longer sed-rewrites this line — see that workflow's comment).
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}{{ else }}{{ .Values.images.registry }}{{ end }}/{{ .Values.images.organization }}/marketplace:{{ .Values.images.marketplaceTag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: marketplace
  namespace: org-services
  {{- if (((.Values.multiRegion).enabled)) }}
  # #5289 multi-region: publish the marketplace storefront as a Cilium
  # ClusterMesh global Service so region-b's edge stub (marketplace.<fqdn> /)
  # resolves to this region-a pod. Gated → single-region byte-unchanged.
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/shared: "true"
  {{- end }}
spec:
  selector:
    app: org-marketplace
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
