{{- /*
The bindings of the intent lock: one per stage of intentLock.stages, named
catalyst-intent-lock-<stage>. A binding limits the policy of policy.yaml to
the kinds of its stage (intentLock.resources.<stage>) and carries the stage's
action: ["Deny"] for deny, ["Audit", "Warn"] for audit. A binding without
Deny rejects nothing, an evaluation error included. policy.yaml checks the
two maps.
*/ -}}
{{- range $stage, $action := .Values.intentLock.stages }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: catalyst-intent-lock-{{ $stage }}
  labels:
    app.kubernetes.io/name: catalyst-intent-lock
    app.kubernetes.io/component: intent-lock
    catalyst.openova.io/intent-lock-stage: {{ $stage }}
spec:
  policyName: catalyst-intent-lock
  validationActions: {{ if eq $action "deny" }}["Deny"]{{ else }}["Audit", "Warn"]{{ end }}
  matchResources:
    resourceRules:
{{- range (index $.Values.intentLock.resources $stage) }}
      - apiGroups: [{{ .apiGroup | quote }}]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: {{ .resources | toJson }}
{{- end }}
{{- end }}
