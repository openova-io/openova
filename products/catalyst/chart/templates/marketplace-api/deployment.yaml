{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-api
  labels:
    app.kubernetes.io/name: marketplace-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marketplace-api
  template:
    metadata:
      labels:
        policy.cilium.io/enforced: "true"  # Wave 5.121 #2466
        app.kubernetes.io/name: marketplace-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: marketplace-api
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}{{ else }}{{ .Values.images.registry }}{{ end }}/{{ .Values.images.organization }}/marketplace-api:{{ .Values.images.marketplaceApi.tag }}"
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: marketplace-api-secrets
                  key: jwt-secret
            # SMTP relay for marketplace signup PIN/OTP delivery (#4919).
            # Source the durable Phase-1 relay seed
            # catalyst-system/sovereign-smtp-credentials (#4748/#4749 →
            # mail.openova.io:587) — the SAME seed the org-services auth
            # service (#934) and catalyst-api CATALYST_SMTP_* consume. The
            # former hardcoded stalwart-mail.stalwart.svc.cluster.local
            # resolved to nothing on a fresh Sovereign (Sovereigns run no
            # in-cluster Stalwart), so the signup PIN silently never sent.
            # The seed Secret lives in this same namespace (catalyst-system),
            # so a plain secretKeyRef resolves it — no reflector hop needed.
            # All optional:true so a Sovereign/contabo without the seed still
            # renders cleanly (absent key → unset env → code default = no send
            # attempt, no CreateContainerConfigError).
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: sovereign-smtp-credentials
                  key: smtp-host
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: sovereign-smtp-credentials
                  key: smtp-port
                  optional: true
            - name: FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: sovereign-smtp-credentials
                  key: smtp-from
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: sovereign-smtp-credentials
                  key: smtp-user
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: sovereign-smtp-credentials
                  key: smtp-pass
                  optional: true
            - name: CORS_ORIGIN
              value: "https://openova.io"
            - name: GIT_REPO_PATH
              value: "/data/repo"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
{{- end }}
