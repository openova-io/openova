{{- /*
Pre-install/pre-upgrade hook that bootstraps the local Sovereign Gitea
`openova/openova` repo + `sme-tenants` branch the SME-tenant gitops chain
targets — issue #3454 (Refs #3376 / #3378 FUNNEL).

WHY THIS FILE EXISTS
====================
#3122 wired BOTH ends of the SME-tenant gitops chain at the local Gitea
on a Sovereign, intended to work PRE-cutover:

  - catalyst-api push target (templates/api-deployment.yaml):
      CATALYST_GITOPS_REPO_URL = http://gitea-http.gitea.svc.cluster.local:3000/openova/openova
      CATALYST_GITOPS_BRANCH   = sme-tenants
      CATALYST_GITOPS_USER     = gitea_admin
      CATALYST_GITOPS_TOKEN    = catalyst-gitea-token PAT (via the mirrored
                                 provisioning-github-token Secret)
    consumed by internal/handler/sme_tenant_gitops.go WriteTenantOverlay.

  - Flux source (templates/sme-services/sme-tenants-gitrepository.yaml):
      GitRepository openova-sme-tenants → same URL, branch sme-tenants.

  - Flux reconciler (templates/sme-services/sme-tenants-kustomization.yaml):
      Kustomization sme-tenants → sourceRef openova-sme-tenants.

The token is correct (the catalyst-gitea-token PAT authenticates 200 as
gitea_admin). The MISSING prerequisite is the repo + branch THEMSELVES.

ROOT CAUSE (hw133, deployment 40c4e17667b600eb, 2026-06-14)
===========================================================
The ONLY thing that creates the local Gitea `openova/openova` repo is
bp-self-sovereign-cutover Step 01 (platform/self-sovereign-cutover/chart/
templates/01-gitea-mirror-job.yaml), which runs POST-handover (gated by
#3379 — the tofu-phase0-archive is sealed in OpenBao only at handover, so
self-sovereign-cutover-status.cutoverComplete=false, currentStepIndex=0
on a fresh prov). PRE-cutover:

  - GET /api/v1/repos/openova/openova → 404 even with the admin PAT.
  - The gitea-mirror-resync CronJob logs "local repo openova/openova not
    present — Step-01 hasn't completed; skipping".
  - Flux GitRepository openova-sme-tenants → Ready=False:
      "unable to clone '.../openova/openova': authentication required"
    (Gitea returns 401/403 for a NON-EXISTENT private path — the
    "authentication required" is a missing-repo symptom, NOT a missing
    credential; the GitRepository correctly needs no secretRef because
    cutover Step 01 creates the repo as private:false / public).

So every sub-org sits in Provisioning and the funnel hangs — NOT because
the gitops token is unconfigured, but because there is no repo to push to
or clone from until handover. The catalog-seed _README.txt already
documents the same gap ("Gitea has no catalog/openova orgs ... 01-gitea-
mirror-job only mirrors openova-io/openova").

FIX
===
Create the repo + branch PRE-cutover, independent of the cutover engine,
so the SME-tenant gitops chain is live from first convergence exactly as
#3122 intended. This pre-install/pre-upgrade hook Job (modeled on the
proven catalyst-gitea-token-secret.yaml mint Job — same gitea-admin-secret
source, same Gitea API surface) idempotently:

  1. ensures org `openova` exists  (POST /api/v1/orgs, visibility public);
  2. ensures repo `openova/openova` exists with auto_init=true so it has
     a default branch + initial commit (a non-empty repo Flux can clone);
  3. ensures the `sme-tenants` branch exists  (POST .../branches from the
     default branch).

Cutover Step 01 later runs `git push --mirror --force` from upstream,
which OVERWRITES this seed content with the full catalog — fully
idempotent with this Job (Step 01 creates the org/repo with the SAME
coordinates if absent, or refreshes content if present). The dedicated
`sme-tenants` branch is the one the catalyst-api writer keeps appending
tenant commits to; the TBD-C18e mirror-clobber concern is about `main`
(which Step 01 force-pushes), NOT this branch — the auto-init seed here
only establishes the branch so the FIRST tenant push + the GitRepository
clone both succeed pre-cutover.

GATING
======
Rendered ONLY when BOTH:
  - .Values.global.sovereignFQDN non-empty  → Sovereign, not the
    Catalyst-Zero mothership (which pushes to github.com/openova-io and
    has no local Gitea). Same discriminator the #3122 REPO_URL override,
    the openova-sme-tenants GitRepository, and the sme-tenants
    Kustomization already use.
  - .Values.ingress.marketplace.enabled  → the SME tenant pipeline is on.
    Non-marketplace Sovereigns don't run the pipeline, so they don't need
    the repo.

Per docs/INVIOLABLE-PRINCIPLES.md #3 (no kubectl apply of workloads): the
chart templates a Helm hook Job; the Job calls the Gitea REST API. Per
#10 (no plaintext creds): the admin password is read at runtime from
gitea/gitea-admin-secret and fed to curl via an Authorization: Basic
header; it never appears in chart source or rendered manifests. Per #4
(never hardcode): org/repo/branch + the in-cluster Gitea URL all flow
through operator-overridable values with the same defaults the rest of
the SME bundle uses.

CREDENTIAL (no kubectl, no RBAC)
================================
The Gitea admin PAT from catalyst-gitea-token (key `token`), minted by
catalyst-gitea-token-secret.yaml's hook-weight-10 hook (this Job is
weight 12). It is injected as the GITEA_TOKEN env via secretKeyRef —
resolved by the kubelet at Pod start from a SAME-namespace Secret, so
there is NO kubectl call and NO Role/RoleBinding. An earlier design read
gitea/gitea-admin-secret via kubectl, which needed a cross-namespace Role
in `gitea`; that Role was a Helm hook resource that helm-controller
DELETED (hook-delete-policy before-hook-creation) on upgrade re-attempt
while the OnFailure-retrying Job pod was still running → the pod lost its
RBAC → FATAL "missing username/password" (observed live on hw133). The
secretKeyRef approach removes that race entirely.

References:
  - Issue #3454 (this fix), Refs #3376 / #3378
  - templates/catalyst-gitea-token-secret.yaml (PAT source, hook-weight 10)
  - templates/sme-services/sme-tenants-gitrepository.yaml (consumer)
  - templates/sme-services/sme-tenants-gitrepo-auth-secret.yaml (Flux clone auth)
  - platform/self-sovereign-cutover/chart/templates/01-gitea-mirror-job.yaml
    (the post-cutover full-mirror that this seed front-runs, idempotently)
*/}}
{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
{{- if .Values.global.sovereignFQDN -}}
{{- $bs := (.Values.smeTenants).repoBootstrap | default dict -}}
{{- $giteaURL := $bs.giteaInternalURL | default "http://gitea-http.gitea.svc.cluster.local:3000" -}}
{{- $org := $bs.org | default "openova" -}}
{{- $repo := $bs.repo | default "openova" -}}
{{- $branch := $bs.branch | default "sme-tenants" -}}
{{- $patSecret := $bs.patSourceSecretName | default "catalyst-gitea-token" -}}
{{- $patKey := $bs.patSourceKey | default "token" -}}
{{- $namespace := .Release.Namespace -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: catalyst-gitea-tenants-repo-bootstrap
  namespace: {{ $namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
    catalyst.openova.io/component: gitea-tenants-repo-bootstrap
    # Required by the kyverno `flux-managed` Enforce policy on converged
    # Sovereigns (the release ns catalyst-system is NOT namespace-excluded).
    app.kubernetes.io/managed-by: flux
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    # Weight 12: AFTER the catalyst-gitea-token mint Job (weight 10) so the
    # PAT this Job reads (via secretKeyRef below) is definitely populated,
    # BEFORE the regular release resources (the openova-sme-tenants
    # GitRepository + sme-tenants Kustomization) reconcile against the repo
    # this Job creates.
    helm.sh/hook-weight: "12"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 8
  template:
    metadata:
      labels:
        catalyst.openova.io/blueprint: bp-catalyst-platform
        catalyst.openova.io/component: gitea-tenants-repo-bootstrap
    spec:
      # #3454 — NO ServiceAccount/Role/RoleBinding. The earlier design read
      # gitea/gitea-admin-secret via kubectl, which needed a cross-namespace
      # Role in the `gitea` ns; that Role was a Helm hook resource with
      # delete-policy before-hook-creation,hook-succeeded, and when
      # helm-controller re-attempted the upgrade it DELETED the Role while the
      # OnFailure-retrying Job pod was still running → the pod lost its RBAC →
      # `kubectl get secret gitea-admin-secret` returned empty → FATAL
      # "missing username/password" (observed live on hw133). Sourcing the PAT
      # via env secretKeyRef removes ALL kubectl/RBAC: the credential is
      # resolved by the kubelet at pod start from a same-namespace Secret —
      # no API call, no Role, no cross-namespace race. Uses the default SA.
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          # Explicit harbor.openova.io/proxy-dockerhub prefix per CLAUDE.md
          # MIRROR-EVERYTHING rule (matches the mint Job's image choice).
          image: harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4
          env:
            - name: GITEA_URL
              value: {{ $giteaURL | quote }}
            - name: GITEA_ORG
              value: {{ $org | quote }}
            - name: GITEA_REPO
              value: {{ $repo | quote }}
            - name: TENANTS_BRANCH
              value: {{ $branch | quote }}
            # #3376: the Sovereign FQDN seeds the clusters/<fqdn>/sme-tenants
            # parent-index path (Step 5). Same source the GitRepository ignore
            # filter + the Kustomization path use (global.sovereignFQDN).
            - name: SOVEREIGN_FQDN
              value: {{ .Values.global.sovereignFQDN | quote }}
            - name: ITERATIONS
              value: {{ .Values.giteaWait.iterations | default 168 | quote }}
            - name: INTERVAL
              value: {{ .Values.giteaWait.intervalSeconds | default 5 | quote }}
            # The Gitea admin PAT minted by catalyst-gitea-token-secret.yaml
            # (hook-weight 10, runs before this weight-12 Job). secretKeyRef
            # with empty .value passes the kyverno `secret-not-in-env` policy
            # (it only denies plaintext values), same pattern catalyst-api uses
            # for CATALYST_GITOPS_TOKEN. optional:false — the Job MUST have the
            # PAT to do anything; if absent the Pod stays ContainerCreating and
            # helm-controller's hook wait surfaces it (better than a 401 storm).
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $patSecret | quote }}
                  key: {{ $patKey | quote }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              API="${GITEA_URL}/api/v1"

              if [ -z "${GITEA_TOKEN:-}" ]; then
                echo "[repo-bootstrap] FATAL: GITEA_TOKEN empty (catalyst-gitea-token PAT not yet minted)" >&2
                exit 1
              fi
              # All calls use Gitea token auth (Authorization: token <PAT>).
              # The PAT authenticates as the Gitea admin (gitea_admin) — proven
              # 200 against this Gitea. NEVER echo the token.

              # Step 1: wait for the Gitea API to be reachable. Same budget knob
              # the token-mint Job uses (default 168 x 5s = 14m) — covers the
              # autoscaler-cold-start worst case on a fresh prov.
              #
              # #3454 — the probe MUST authenticate: bp-gitea sets
              # service.REQUIRE_SIGNIN_VIEW=true (platform/gitea values.yaml), so
              # the UNAUTHENTICATED /api/v1/version returns 403, not 200 (it
              # burned all 168 loop passes on hw133 before falling through). Send
              # the token so a healthy Gitea answers 200.
              for i in $(seq 1 "$ITERATIONS"); do
                code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 \
                  -H "Authorization: token ${GITEA_TOKEN}" "${API}/version" || echo 000)
                if [ "$code" = "200" ]; then
                  echo "[repo-bootstrap] gitea api reachable (authed /version=200)"
                  break
                fi
                echo "[repo-bootstrap] waiting for gitea api ($i/$ITERATIONS, /version=${code})"
                sleep "$INTERVAL"
              done

              # Step 2: ensure the org exists (idempotent).
              ORG_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: token ${GITEA_TOKEN}" "${API}/orgs/${GITEA_ORG}")
              if [ "$ORG_CODE" = "200" ]; then
                echo "[repo-bootstrap] org ${GITEA_ORG} already present"
              else
                echo "[repo-bootstrap] creating org ${GITEA_ORG} (GET was ${ORG_CODE})"
                curl -sS -o /dev/null -w '[repo-bootstrap] POST /orgs -> %{http_code}\n' \
                  -H "Authorization: token ${GITEA_TOKEN}" -H "Content-Type: application/json" \
                  -X POST "${API}/orgs" \
                  -d "{\"username\":\"${GITEA_ORG}\",\"visibility\":\"public\"}" || true
              fi

              # Step 3: ensure the repo exists with an initial commit so it has a
              # default branch (auto_init=true). private=false matches cutover
              # Step 01's create.
              REPO_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: token ${GITEA_TOKEN}" "${API}/repos/${GITEA_ORG}/${GITEA_REPO}")
              if [ "$REPO_CODE" = "200" ]; then
                echo "[repo-bootstrap] repo ${GITEA_ORG}/${GITEA_REPO} already present"
              else
                echo "[repo-bootstrap] creating repo ${GITEA_ORG}/${GITEA_REPO} (GET was ${REPO_CODE})"
                curl -sS -o /dev/null -w '[repo-bootstrap] POST /orgs/repos -> %{http_code}\n' \
                  -H "Authorization: token ${GITEA_TOKEN}" -H "Content-Type: application/json" \
                  -X POST "${API}/orgs/${GITEA_ORG}/repos" \
                  -d "{\"name\":\"${GITEA_REPO}\",\"auto_init\":true,\"private\":false,\"default_branch\":\"main\",\"description\":\"Sovereign-local clone of openova-io/openova (SME-tenant gitops target; seeded pre-cutover by bp-catalyst-platform #3454, full content mirrored by cutover Step 01)\"}" || true
                # Verify the repo is now visible + non-empty before branching.
                for i in $(seq 1 30); do
                  META=$(curl -sS -H "Authorization: token ${GITEA_TOKEN}" "${API}/repos/${GITEA_ORG}/${GITEA_REPO}" 2>/dev/null || echo '{}')
                  if printf '%s' "$META" | grep -q '"empty":false'; then
                    echo "[repo-bootstrap] repo created + non-empty"
                    break
                  fi
                  echo "[repo-bootstrap] waiting for repo to materialise ($i/30)"
                  sleep 2
                done
              fi

              # Step 4: ensure the sme-tenants branch exists (the catalyst-api
              # tenant gitops writer pushes to HEAD:sme-tenants and the
              # openova-sme-tenants GitRepository tracks this branch).
              BR_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: token ${GITEA_TOKEN}" \
                "${API}/repos/${GITEA_ORG}/${GITEA_REPO}/branches/${TENANTS_BRANCH}")
              if [ "$BR_CODE" = "200" ]; then
                echo "[repo-bootstrap] branch ${TENANTS_BRANCH} already present"
              else
                # Resolve the repo's actual default branch (auto_init names it
                # per the instance default, usually "main").
                DEFAULT_BRANCH=$(curl -sS -H "Authorization: token ${GITEA_TOKEN}" \
                  "${API}/repos/${GITEA_ORG}/${GITEA_REPO}" 2>/dev/null \
                  | grep -oE '"default_branch":"[^"]*"' | head -1 | cut -d'"' -f4)
                [ -n "$DEFAULT_BRANCH" ] || DEFAULT_BRANCH=main
                echo "[repo-bootstrap] creating branch ${TENANTS_BRANCH} from ${DEFAULT_BRANCH} (GET was ${BR_CODE})"
                curl -sS -o /dev/null -w '[repo-bootstrap] POST /branches -> %{http_code}\n' \
                  -H "Authorization: token ${GITEA_TOKEN}" -H "Content-Type: application/json" \
                  -X POST "${API}/repos/${GITEA_ORG}/${GITEA_REPO}/branches" \
                  -d "{\"new_branch_name\":\"${TENANTS_BRANCH}\",\"old_branch_name\":\"${DEFAULT_BRANCH}\"}" || true
                FINAL=$(curl -sS -o /dev/null -w '%{http_code}' \
                  -H "Authorization: token ${GITEA_TOKEN}" \
                  "${API}/repos/${GITEA_ORG}/${GITEA_REPO}/branches/${TENANTS_BRANCH}")
                if [ "$FINAL" = "200" ]; then
                  echo "[repo-bootstrap] branch ${TENANTS_BRANCH} present"
                else
                  echo "[repo-bootstrap] FATAL: branch ${TENANTS_BRANCH} not present after create (HTTP ${FINAL})" >&2
                  exit 1
                fi
              fi

              # Step 5: seed an EMPTY parent kustomization.yaml at
              # clusters/${SOVEREIGN_FQDN}/sme-tenants/ on the tenants branch
              # — #3376 (Refs #3689).
              #
              # WHY: the Flux Kustomization `sme-tenants` (sibling template
              # sme-tenants-kustomization.yaml) watches
              # ./clusters/<fqdn>/sme-tenants. That directory does NOT exist
              # on the branch until the FIRST tenant POST runs catalyst-api's
              # WriteTenantOverlay (which writes the parent index via
              # writeParentKustomization). Until then Flux reports
              # `kustomization path not found: ... no such file or directory`
              # → Kustomization sme-tenants=False (caught live hw150). That
              # NotReady was then accepted as "baseline noise" by the cutover
              # egress-block proof — sovereignty declared GREEN while the
              # customer-onboarding reconciler was dead (PRINCIPLES A1/A2).
              #
              # Seeding a VALID empty kustomize root (resources: []) makes the
              # path exist + reconcile Ready from first convergence, zero
              # tenants required. WriteTenantOverlay OVERWRITES this file with
              # the helmrepositories.yaml + per-tenant subdir list on the
              # first signup, so this seed is purely the empty-state index.
              # Idempotent: only create when absent (GET 404) — never clobber
              # a real tenant index. Uses the Gitea contents API
              # (POST /repos/{org}/{repo}/contents/{path}) so there is no git
              # clone/push (no extra tooling, no RBAC).
              SEED_PATH="clusters/${SOVEREIGN_FQDN}/sme-tenants/kustomization.yaml"
              if [ -z "${SOVEREIGN_FQDN:-}" ]; then
                echo "[repo-bootstrap] WARN: SOVEREIGN_FQDN empty — skipping sme-tenants path seed"
              else
                SEED_GET=$(curl -sS -o /dev/null -w '%{http_code}' \
                  -H "Authorization: token ${GITEA_TOKEN}" \
                  "${API}/repos/${GITEA_ORG}/${GITEA_REPO}/contents/${SEED_PATH}?ref=${TENANTS_BRANCH}")
                if [ "$SEED_GET" = "200" ]; then
                  echo "[repo-bootstrap] sme-tenants parent index already present (${SEED_PATH}@${TENANTS_BRANCH})"
                else
                  echo "[repo-bootstrap] seeding empty sme-tenants parent index ${SEED_PATH}@${TENANTS_BRANCH} (GET was ${SEED_GET})"
                  # Empty-but-valid kustomize root. base64 with no line wrap so
                  # Gitea's contents API accepts the `content` field. busybox
                  # base64 wraps at 76 cols by default → strip newlines with tr.
                  SEED_BODY=$(printf '%s\n' \
                    "# Seeded empty by bp-catalyst-platform repo-bootstrap (#3376)." \
                    "# The catalyst-api SME-tenant pipeline (WriteTenantOverlay)" \
                    "# OVERWRITES this file on the first tenant signup with the" \
                    "# helmrepositories.yaml + per-tenant overlay subdirectories." \
                    "# Present so the Flux Kustomization sme-tenants path exists" \
                    "# + reconciles Ready from first convergence (zero tenants)." \
                    "apiVersion: kustomize.config.k8s.io/v1beta1" \
                    "kind: Kustomization" \
                    "resources: []" \
                    | base64 | tr -d '\n')
                  curl -sS -o /dev/null -w '[repo-bootstrap] PUT contents -> %{http_code}\n' \
                    -H "Authorization: token ${GITEA_TOKEN}" -H "Content-Type: application/json" \
                    -X POST "${API}/repos/${GITEA_ORG}/${GITEA_REPO}/contents/${SEED_PATH}" \
                    -d "{\"branch\":\"${TENANTS_BRANCH}\",\"content\":\"${SEED_BODY}\",\"message\":\"chore(sme-tenants): seed empty parent index so Flux path exists pre-first-tenant (#3376)\"}" || true
                  SEED_FINAL=$(curl -sS -o /dev/null -w '%{http_code}' \
                    -H "Authorization: token ${GITEA_TOKEN}" \
                    "${API}/repos/${GITEA_ORG}/${GITEA_REPO}/contents/${SEED_PATH}?ref=${TENANTS_BRANCH}")
                  if [ "$SEED_FINAL" = "200" ]; then
                    echo "[repo-bootstrap] sme-tenants parent index seeded"
                  else
                    echo "[repo-bootstrap] WARN: sme-tenants parent index not present after seed (HTTP ${SEED_FINAL}); Flux will report path-not-found until the first tenant signup writes it"
                  fi
                fi
              fi

              echo "[repo-bootstrap] done — ${GITEA_ORG}/${GITEA_REPO}@${TENANTS_BRANCH} ready for SME-tenant gitops"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
