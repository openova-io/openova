{{- if and .Values.ingress .Values.ingress.marketplace .Values.ingress.marketplace.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: domain
  namespace: sme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sme-domain
  template:
    metadata:
      labels:
        policy.cilium.io/enforced: "true"  # Wave 5.121 #2466
        app: sme-domain
    spec:
      serviceAccountName: domain
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: domain
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}{{ else }}{{ .Values.images.registry }}{{ end }}/{{ .Values.images.organization }}/services-domain:{{ .Values.images.smeTag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          env:
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: sme-services-config
                  key: MONGODB_URI
            - name: MONGODB_DB
              value: "domains"
            - name: REDPANDA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: sme-services-config
                  key: REDPANDA_BROKERS
            # NATS JetStream URL — canonical event bus per ADR-0001 §6.
            # PR #1627 wired domain's tenant.deleted subscriber to
            # NATS subject `catalyst.tenant.deleted` so subdomain +
            # BYOD records are reclaimed on Sovereigns (was Kafka-only
            # and silently dropping every cascade).
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: sme-services-config
                  key: NATS_URL
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: sme-services-config
                  key: CORS_ORIGIN_PUBLIC
            - name: CNAME_TARGET
              valueFrom:
                configMapKeyRef:
                  name: sme-services-config
                  key: CNAME_TARGET
            - name: TENANT_URL
              valueFrom:
                configMapKeyRef:
                  name: sme-services-config
                  key: TENANT_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sme-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8086
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: domain
  namespace: sme
spec:
  selector:
    app: sme-domain
  ports:
    - port: 8086
      targetPort: 8086
{{- end }}
