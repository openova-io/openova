{{- /*
Host-side plain-name bridge for gitea-admin-secret (#3811, Refs #3642).

WHY THIS FILE EXISTS
====================
#3642 relocated bp-gitea INTO the mgmt vCluster (vc-mgmt). The gitea
chart's `gitea-admin-secret` (platform/gitea/chart/templates/admin-secret.yaml
— random `randAlphaNum 32` password, lookup-stable after first install)
now lives in vc-mgmt namespace `gitea`. On the HOST the vCluster syncer
(`vcluster.sync.toHost.secrets.enabled: true` in bp-mgmt-vcluster) mirrors
it ONLY under the syncer-mangled name
`gitea-admin-secret-x-gitea-x-mgmt-vcluster` in the syncer host namespace
`mgmt` (and the gitea chart's emberstack-reflector annotation copies that
SAME mangled name into ns `catalyst`).

bp-catalyst-platform installs HOST-side (catalyst-system). Its
`catalyst-gitea-token` bootstrap (templates/catalyst-gitea-token-secret.yaml)
gates its ENTIRE render on the pre-#3642 host contract:

    {{`{{- $giteaSrc := lookup "v1" "Secret" "gitea" "gitea-admin-secret" -}}`}}

After #3642 the host `gitea` ns holds only the CNPG DB — plain
`gitea/gitea-admin-secret` does NOT exist — so the gate returns nil and the
WHOLE template renders nothing: no `catalyst-gitea-token` Secret, no mint
Job. The downstream pre-install hooks that `secretKeyRef`
`catalyst-gitea-token` (catalyst-gitea-tenants-repo-bootstrap +
catalyst-catalog-sovereign-repo-bootstrap) then hit
`CreateContainerConfigError: secret "catalyst-gitea-token" not found` →
bp-catalyst-platform pre-install times out (30m) → install→fail→uninstall
→retry loop → the console never comes up (root-caused live on hw163,
deployment 83674048ff592704, 2026-06-18 — the env stuck 56/64, console 000).

WHY A HELM-LOOKUP-AND-MIRROR (not a vCluster sync mapping, not reflector)
=========================================================================
The plain-named host secret CANNOT be produced by either of the two
mechanisms #3642 already wired:
  - vCluster `sync.toHost.secrets` ALWAYS mangles the name
    (`<name>-x-<inner-ns>-x-<vcluster-release>`); vcluster 0.23.0's
    toHost.secrets has NO `mappings.byName` rename (only `sync.fromHost.*`
    does — verified against the vendored 0.23.0 subchart values schema).
  - The emberstack reflector mirrors a secret to OTHER namespaces under the
    SAME name — it cannot rename `gitea-admin-secret-x-gitea-x-mgmt-vcluster`
    back to plain `gitea-admin-secret`.

So this template Helm-`lookup`s the syncer-ORIGIN mangled host secret
(`mgmt/gitea-admin-secret-x-gitea-x-mgmt-vcluster` by default) and
re-publishes a plain `gitea/gitea-admin-secret`, restoring the pre-#3642
host contract that the mint hook's render gate, its `catalyst-gitea-admin-
reader` Role (resourceNames: ["gitea-admin-secret"] in ns `gitea`), and its
runtime `kubectl -n gitea get secret gitea-admin-secret` all expect — with
NO change to the mint Job, its RBAC, or catalyst-api. Same Helm-lookup-and-
mirror seam already proven by provisioning-github-token.yaml (#3122) and
valkey-cross-ns-secret.yaml (#863). Reading the syncer ORIGIN (ns `mgmt`),
not the reflector copy (ns `catalyst`), keeps the bridge independent of the
gitea chart's reflector allow-namespaces config.

ORDERING (the load-bearing piece)
=================================
This is a `pre-install,pre-upgrade` hook at weight 1 — BEFORE the
catalyst-gitea-token Secret (weight 5) and the mint Job (weight 10) in
catalyst-gitea-token-secret.yaml, and well before the weight-12 consumer
hooks. Helm applies lower-weight hooks first, so the plain
`gitea/gitea-admin-secret` is created on the host before the mint Job RUNS
and reads it via kubectl (the kubelet/kubectl read live cluster state at
Job-run time, after this hook applies).

NOTE on the mint render gate: a Helm `lookup` does NOT see resources
created earlier in the SAME render pass — it queries the live cluster at
template-render time. So on a truly fresh install the mint template's gate
cannot rely on the plain secret THIS template creates. The companion change
in catalyst-gitea-token-secret.yaml therefore widens its gate to ALSO
accept the mangled host secret (the same source this bridge reads), so the
catalyst-gitea-token Secret + mint Job render on the first install — and
the mint Job then reads the plain secret this hook has already applied.

GATING
======
Rendered ONLY when:
  - .Values.giteaAdminBridge.enabled (default true; flip false on
    Catalyst-Zero / contabo where gitea is host-side + hand-rolled), AND
  - the syncer-origin mangled source secret exists on the host (lookup
    non-nil). On a fresh prov bp-mgmt-vcluster + bp-gitea (HR dependsOn)
    converge BEFORE bp-catalyst-platform installs, so the mangled host
    secret is present by the time this chart renders. If it is somehow
    absent (e.g. contabo with no vCluster), this template no-ops and the
    pre-#3642 host-side gitea-admin-secret (if any) is untouched.

Per docs/INVIOLABLE-PRINCIPLES.md #10: NO plaintext credentials here. The
admin password bytes are read back via lookup from the syncer-mirrored host
Secret and re-emitted base64; they never appear in chart source or rendered
manifests on disk. Per #4 (never hardcode): source/destination namespace +
names flow through .Values.giteaAdminBridge.* with the observed defaults.
*/}}
{{- if .Values.giteaAdminBridge.enabled -}}
{{- $srcNs := .Values.giteaAdminBridge.sourceNamespace | default "mgmt" -}}
{{- $srcName := .Values.giteaAdminBridge.sourceSecretName | default "gitea-admin-secret-x-gitea-x-mgmt-vcluster" -}}
{{- $destNs := .Values.giteaAdminBridge.destNamespace | default "gitea" -}}
{{- $destName := .Values.giteaAdminBridge.destSecretName | default "gitea-admin-secret" -}}
{{- $src := lookup "v1" "Secret" $srcNs $srcName -}}
{{- if and $src $src.data (index $src.data "password") (index $src.data "username") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $destName }}
  namespace: {{ $destNs }}
  labels:
    catalyst.openova.io/blueprint: bp-catalyst-platform
    catalyst.openova.io/component: gitea-admin-secret-bridge
    app.kubernetes.io/part-of: catalyst
    # Required by the kyverno `flux-managed` Enforce policy if the dest ns
    # is not namespace-excluded — the bridged Secret is helm/Flux-owned.
    app.kubernetes.io/managed-by: flux
  annotations:
    # Provenance for ops: `kubectl describe secret gitea-admin-secret -n gitea`
    # makes it obvious this is the #3811 host bridge of the vCluster-synced
    # mangled secret, not a stray hand-rolled credential.
    catalyst.openova.io/mirrored-from: {{ printf "%s/%s" $srcNs $srcName | quote }}
    catalyst.openova.io/bridge: "gitea-admin-secret-host-bridge-3811"
    # pre-install,pre-upgrade weight 1: create the plain host secret BEFORE
    # the catalyst-gitea-token mint Secret (weight 5) + mint Job (weight 10)
    # so the mint Job reads it via kubectl at run time.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
    # Survive helm uninstall — the bridged Secret outlives the release so a
    # re-install (and the in-vCluster gitea chart's own lookup-stable admin
    # password) stays consistent across reconciles. Re-emitted verbatim from
    # the live source on every reconcile (source-wins), so a vCluster
    # password rotation propagates on the next Flux tick.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Verbatim copy of the syncer-mirrored admin credential. username is
  # `gitea_admin`; password is the gitea chart's randAlphaNum-32 (never
  # echoed). Both keys match the upstream gitea `existingSecret` schema +
  # the mint hook's `jsonpath='{.data.username}'` / `{.data.password}` reads.
  username: {{ index $src.data "username" | quote }}
  password: {{ index $src.data "password" | quote }}
{{- end }}
{{- end }}
