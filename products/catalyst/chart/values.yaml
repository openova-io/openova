      tag: "8b7fc3b"
      pullPolicy: IfNotPresent
    replicas: 1
    leaderElection:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    giteaURL: ""
    logLevel: "info"
