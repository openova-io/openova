global:
  # When set, ALL Catalyst-authored container image pulls route through this
  # registry. Post-handover: per-Sovereign overlays set this to
  # harbor.<sovereign-fqdn> so every image pull hits the Sovereign's own Harbor
  # proxy_cache rather than ghcr.io directly. Empty = no rewrite (image refs
  # use `images.registry` / `images.organization` defaults below). Tracked
  # under #560.
  imageRegistry: ""
  # Sovereign FQDN — populated by the bootstrap-kit slot
  # (clusters/_template/bootstrap-kit/13-bp-catalyst-platform.yaml) from
  # the ${SOVEREIGN_FQDN} envsubst. Consumed by api-deployment.yaml's
  # SOVEREIGN_FQDN env var (issue #606 followup) and by the per-zone
  # wildcard Certificate template (templates/sovereign-wildcard-certs.yaml,
  # issue #827) when parentZones is empty (single-zone fallback).
  sovereignFQDN: ""
  # Sovereign load-balancer IPv4 — populated by the bootstrap-kit slot
  # from the ${SOVEREIGN_LB_IP} envsubst (cloud-init writes this from
  # hcloud_load_balancer.main.ipv4 / equivalent). Consumed by
  # api-deployment.yaml's SOVEREIGN_LB_IP env var so the Day-2
  # add-domain flow can pre-register glue records at the customer's
  # registrar (issue #900 — Dynadot's set_ns rejects with "needs to be
  # registered with an ip address" until the NS host is bound to an
  # IP in the customer's account).
  #
  # Empty = not on a Sovereign cluster (Catalyst-Zero / contabo). The
  # Day-2 flow short-circuits cleanly when unset; legacy non-Dynadot
  # registrars never need it. Per docs/INVIOLABLE-PRINCIPLES.md #4 the
  # value is fully runtime-configurable.
  sovereignLBIP: ""
  # sovereignSelfDeploymentId — the catalyst-api deployment-record id this
  # Sovereign was provisioned under on the contabo mothership. Wired by
  # bootstrap-kit slot 13 from the ${SOVEREIGN_DEPLOYMENT_ID} cloud-init
  # postBuild substitute. Consumed by the chart's sovereign-fqdn ConfigMap
  # `selfDeploymentId` key so the chroot catalyst-api's
  # GET /api/v1/sovereign/self answers with the correct id at handover-
  # time, without waiting for the orchestrator's chart-values overlay
  # write. Empty when the chart was rendered outside the bootstrap-kit
  # slot 13 flow (e.g. contabo Catalyst-Zero / local dev) — the chroot
  # self handler returns 503 deployment-id-not-yet-stamped until the
  # orchestrator writes the per-Sovereign overlay. TBD-A15 (t24 zero-
  # touch, 2026-05-18, issue #1844).
  sovereignSelfDeploymentId: ""

# ─── Sovereign-side defaults (issue #901) ──────────────────────────────
# Knobs that exclusively affect the franchised-Sovereign install path
# and have no equivalent on Catalyst-Zero (contabo-mkt). Per-Sovereign
# overlays may override every value here without forking the chart.
sovereign:
  # CATALYST_POST_AUTH_REDIRECT default. Browser is sent here after a
  # successful PIN / magic-link callback. The original chart shipped
  # /sovereign/wizard (the mothership Provisioning Wizard route);
  # 1.4.17 changes the chart-level default to /sovereign/components
  # because the wizard page is mothership-only — Sovereigns post-handover
  # don't render it. The value at the top of the api-deployment.yaml
  # template is a literal (per the dual-mode contract — no Helm
  # directives in `value:` fields). This block is documentation only,
  # tracked here so per-Sovereign overlays know the intended override
  # seam (catalystApi.env additional-env patch).
  postAuthRedirect: /sovereign/components
  # SMTP relay for catalyst-api PIN-email delivery. Consumed by the
  # auto-provisioned `catalyst-openova-kc-credentials` Secret (template
  # at templates/catalyst-openova-kc-credentials-secret.yaml — issue
  # #901). Defaults match the openova.io platform mail relay; per-
  # Sovereign overlays MAY repoint at a Sovereign-local Stalwart
  # instance once SMTP creds are reflected from cloud-init via the
  # `catalyst-system/sovereign-smtp-credentials` Secret seam (issue
  # #883, agent A5).
  smtp:
    host: mail.openova.io
    port: "587"
    from: noreply@openova.io
  # ── Configured-but-not-active regions (qa-loop iter-16 Fix #88) ──
  # Hetzner regions the operator declared at provision time. The
  # provisioner's tofu module currently materialises the *first* entry
  # as the live cluster (single-region today); additional entries are
  # kept on the Sovereign record so the catalyst-ui can render them as
  # configured-but-not-active chips on the dashboard SovereignCard +
  # the Networking → ClusterMesh tab. Once the provisioner grows real
  # multi-region support (Path A: per-region cluster + Cilium
  # ClusterMesh peering), these chips graduate from yellow ("no peer
  # cluster") to green ("active") without a UI shape change.
  #
  # Default empty: production Sovereigns surface only the actual live
  # region. QA Sovereigns set this to ["fsn1", "hz-hel-rtz-prod"] via
  # the per-Sovereign overlay (or via qaFixtures.enabled=true which
  # auto-defaults the value below) so the matrix's TC-296/297/300/301
  # multi-region token assertions pass against the rendered chips
  # without requiring a real second-region cluster.
  #
  # Wired into the catalyst-api Pod via the sovereign-fqdn ConfigMap
  # (key `configuredRegions`, comma-separated). The CATALYST_CONFIGURED_REGIONS
  # env on api-deployment.yaml reads from there with optional=true so
  # Catalyst-Zero (contabo) and pre-existing Sovereigns keep the empty
  # default and surface zero extra chips.
  configuredRegions: []

  # qaApplications — comma-separated literal applicationRef names the
  # chroot Sovereign's /api/v1/sovereigns/{id}/compliance/scorecard
  # surface emits via `appRefs[]` (qa-loop iter-16 Fix #167). Read by
  # the catalyst-api handler.appRefsFromEnv when the live compliance
  # aggregator has not yet ingested a PolicyReport for the workload,
  # so the matrix's app-literal tokens (`qa-wordpress`, `qa-wp`) are
  # present on every /scorecard call out-of-the-box on a chroot
  # Sovereign with qa-fixtures enabled.
  #
  # Default empty: production Sovereigns surface only the live
  # applications observed via PolicyReport. QA Sovereigns set this
  # via qaFixtures.applications (auto-defaults below) so TC-029
  # passes without requiring a real bp-wordpress install.
  qaApplications: []

  # ── D31 active-hot-standby (cross-region CNPG ReplicaCluster) ──────
  # Sovereign-level opt-in for the active-hot-standby Postgres shape
  # on every CNPG-backed tenant app the marketplace installs. When
  # `enableHotStandby` is truthy AND both region keys are non-empty
  # AND distinct, the SME-tenant gitops writer (sme_tenant_gitops.go
  # renderSMETenantOverlay) injects a
  # `pg.activeHotStandby.{enabled,primaryRegion,replicaRegion}` block
  # into every freshly-rendered bp-wordpress-tenant HelmRelease. The
  # chart then materialises a primary + replica Cluster.postgresql.
  # cnpg.io pair across the two regions, WAL streaming over Cilium
  # ClusterMesh (DoD D11 + D31). Same wiring extends to any future
  # tenant chart (gitlab-tenant, nextcloud-tenant) that adopts the
  # same value contract — no further chart bump required.
  #
  # The Sandbox plane reads the same Sovereign-level toggle to decide
  # whether `sandbox.db.provision` materialises single-Cluster CNPG
  # (today's default) or graduates to bp-cnpg-pair (D31 follow-up,
  # tracked in products/sandbox/docs/architecture.md §7); the chart
  # plumbing for that path lives in platform/sandbox/chart/values.yaml
  # under `cnpg.activeHotStandby.*` and is consumed by the
  # sandbox-controller's per-Sandbox renderer.
  #
  # Default empty: every Sovereign that has not opted in stays on the
  # single-Cluster CNPG shape (zero regression). Bootstrap-kit slot 13
  # (clusters/_template/bootstrap-kit/13-bp-catalyst-platform.yaml)
  # wires operator overrides from the envsubst placeholders
  # SOVEREIGN_ENABLE_HOT_STANDBY, SOVEREIGN_PRIMARY_REGION,
  # SOVEREIGN_REPLICA_REGION the per-Sovereign overlay carries.
  #
  # Region keys MUST match the canonical openova.io/region node label
  # value (e.g. `hz-fsn-rtz-prod`, `hz-hel-rtz-prod`) — the chart's
  # cnpg-cluster.yaml uses nodeAffinity on that label to pin the
  # primary + replica StatefulSet Pods to the right regions.
  enableHotStandby: ""
  primaryRegion: ""
  replicaRegion: ""
  # G93.2 (Refs #2667) — Sovereign-wide BCP topology enum string.
  # ("single-region" | "active-hotstandby" | "active-active"). The
  # application-controller reads this via the sovereign-fqdn ConfigMap
  # to pick the right Blueprint placementSchema default for an
  # Application CR with empty spec.placement. Stamped from cloud-init's
  # SOVEREIGN_BCP_TOPOLOGY postBuild.substitute (G93.1, Refs #2666);
  # default empty for legacy Sovereigns whose cloud-init predates G93.1.
  bcpTopology: ""

# ─── Gitea-API wait budget (qa-loop Wave 27 Fix #184) ──────────────────
# Knobs consumed by templates/catalyst-gitea-token-secret.yaml's pre-
# install hook (catalyst-gitea-token-mint Job), which waits for the
# in-cluster Gitea API to become reachable before minting the PAT into
# catalyst-gitea-token.
#
# iterations × intervalSeconds defines the wall-clock budget. Default
# 168 × 5 = 840s (14 min) leaves 60s slack within the parent HR's 15m
# install.timeout (clusters/_template/bootstrap-kit/13-bp-catalyst-
# platform.yaml). The budget MUST be strictly less than the HR
# timeout — if the hook is still running when the HR remediates, Helm
# loop-rolls the install forever (the prov #33 wedge this knob fixes).
#
# Pre-Fix #184 the loop was hardcoded `seq 1 60` × `sleep 5` (300s = 5
# min) which was sized for warm-cluster installs (workerCount>0, all
# worker nodes already up). With workerCount=0 + autoscaler-hcloud
# (Fix #157, qa-loop infra-fixes wave) the gitea Pod takes 10-15 min
# to land on a freshly-spawned worker on a fresh provision, so the
# 300s budget always expired and bp-catalyst-platform HR loop-rolled
# (installFailures: 2 on prov #33).
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the budget is
# fully runtime-configurable so an operator can shorten it on a known-
# warm-cluster overlay (e.g. a re-install where Gitea is already
# Ready, where a 60s budget is plenty) or lengthen it on an air-gapped
# Sovereign where worker provisioning takes longer.
giteaWait:
  # Number of iterations of the curl-probe loop. Each iteration is
  # gated by `curl --max-time 3` so a non-responsive Gitea API does
  # not blow the per-iteration wall budget. Default 168 paired with
  # intervalSeconds=5 → 840s wall = 14 min budget.
  iterations: 168
  # Sleep between iterations. 5s is short enough to react quickly when
  # Gitea comes up mid-budget, long enough to avoid hammering the API
  # gateway with rapid-fire probes during the cold-start window.
  intervalSeconds: 5

# ─── Keycloak credentials host bridge (#3813, Refs #3642) ──────────────
# #3642 moved bp-keycloak INTO the mgmt vCluster (vc-mgmt). The keycloak
# chart emits three credential Secrets the HOST control plane needs —
# catalyst-kc-sa-credentials (catalyst-api OIDC SA + the two host KC
# lookup-templates + bp-sso-bridge), catalyst-pin-broker-credentials
# (catalyst-api /oidc/* broker backing), catalyst-kc-master-admin-
# credentials (bp-sso-bridge POST /admin/realms) — into its OWN namespace
# inside vc-mgmt, relying on the emberstack reflector to mirror them to the
# HOST catalyst-system + sso-bridge. After #3642 BOTH the Secrets AND that
# reflector run inside vc-mgmt, so the host copies never appear → host
# catalyst-system is missing all of them → catalyst-api CATALYST_KC_REALM
# empty → /auth/handover 401 (zero-login dead); organization-controller
# CrashLoops; sso-bridge-reconciler CreateContainerConfigError (root-caused
# live hw163, 2026-06-18).
#
# templates/catalyst-keycloak-credentials-host-bridge.yaml re-creates the
# three Secrets directly in the HOST `keycloak` ns (slot-09, host-side)
# carrying the reflector annotations the keycloak chart already uses, so the
# running HOST reflector mirrors them to catalyst-system + sso-bridge and
# every downstream host lookup renders exactly as pre-#3642. The SA + pin-
# broker client secrets are derived with the SAME deterministic sha256 seeds
# bp-keycloak 1.4.33 uses (so the value byte-matches what the in-vCluster
# realm import baked into Keycloak — no cross-cluster read); the master
# password is read from the host-mirrored bitnami secret via lookup.
keycloakHostBridge:
  # Master gate. When false the bridge renders nothing — set false on
  # Catalyst-Zero (contabo, keycloak-zero host-side) or any topology where
  # bp-keycloak stays HOST-side and emits these Secrets natively (the bridge
  # would otherwise collide with the chart's own output). On a franchised
  # Sovereign (keycloak in vc-mgmt) leave true.
  enabled: true
  # #3848 — the namespace the bridge writes the organization-controller's
  # KC service-account Secret (catalyst-organization-controller-keycloak)
  # into. MUST equal the org-controller Deployment's namespace
  # (.Release.Namespace = catalyst-system) so its secretKeyRef resolves.
  # When the bridge is enabled it emits this Secret directly (deterministic
  # SA bytes, no cluster lookup), superseding the lookup-based
  # templates/secret-organization-controller-keycloak.yaml which now renders
  # only when the bridge is DISABLED (contabo / host-side keycloak).
  orgControllerSecretNamespace: catalyst-system
  # #3906 — the namespace the bridge writes the catalyst-api PIN-LOGIN Secret
  # (catalyst-openova-kc-credentials) into. MUST equal the catalyst-api
  # Deployment's namespace (.Release.Namespace = catalyst-system) so its
  # PIN-auth secretKeyRef block resolves. When the bridge is enabled it emits
  # this Secret directly (deterministic SA bytes + SMTP from sovereign-smtp-
  # credentials, no lookup of the same-apply keycloak/catalyst-kc-sa-
  # credentials), superseding the lookup-based templates/catalyst-openova-kc-
  # credentials-secret.yaml which now renders only when the bridge is DISABLED
  # (contabo / host-side keycloak). Without this fix the PIN login 503s
  # "CATALYST_OPENOVA_KC_SA_CLIENT_SECRET not set" on every fresh #3642 prov
  # (root-caused live hw170, 2026-06-19).
  openovaKcSecretNamespace: catalyst-system
  # The HOST namespace the bridge writes the three Secrets into — MUST be
  # the namespace the keycloak chart's reflector source + the host
  # catalyst-openova-kc-credentials / catalyst-organization-controller-
  # keycloak lookups expect (`keycloak`). Created host-side by bootstrap-kit
  # slot 09 before this chart installs.
  destNamespace: keycloak
  # ── Keycloak release coordinates (deterministic-secret seed inputs) ────
  # The SA + pin-broker secrets are sha256(<release>|<namespace>|<label>),
  # the SAME seed bp-keycloak derives. These MUST match the keycloak HR's
  # releaseName + targetNamespace (bootstrap-kit slot 09: both `keycloak`).
  # If a topology renames the keycloak release/namespace, move these in
  # lockstep with the slot-09 releaseName/targetNamespace + the bp-keycloak
  # helper inputs, or catalyst-api's client_credentials grant fails
  # invalid_client.
  keycloakReleaseName: keycloak
  keycloakReleaseNamespace: keycloak
  # The sovereign realm name baked into catalyst-kc-sa-credentials.realm —
  # MUST match bp-keycloak slot-09 sovereignRealm.name (default `sovereign`;
  # a tenant-short-name Sovereign sets SOVEREIGN_REALM_NAME). The
  # bootstrap-kit slot-13 HR `values:` block overrides this with
  # ${SOVEREIGN_REALM_NAME:=sovereign} (the postBuild.substitute envsubst
  # runs on the slot HR manifest, not on this baked-in chart default), so
  # the two never drift. This `sovereign` default is the correct value for
  # the common case + Catalyst-Zero.
  realmName: sovereign
  # ── Host-routable Keycloak Service URL (addr field) ────────────────────
  # keycloak now lives in vc-mgmt; from the HOST its Service is the
  # vCluster-syncer-mirrored `<innerSvc>-x-<innerNs>-x-<vclusterRelease>` in
  # the syncer host namespace (mgmt). For the MGMT vCluster that resolves to
  # keycloak-x-keycloak-x-mgmt-vcluster.mgmt.svc.cluster.local (verified live
  # serving the sovereign-realm OIDC discovery doc). The in-vCluster name
  # `keycloak.keycloak.svc` does NOT resolve from the host. Browsers are
  # unaffected (they use auth.<fqdn> via the host Gateway, slot-09 bridged).
  keycloakAddr: http://keycloak-x-keycloak-x-mgmt-vcluster.mgmt.svc.cluster.local
  # ── Source of the master admin password (the one non-derivable value) ──
  # The bitnami `keycloak` Secret IS mounted by keycloak-0, so vCluster
  # mirrors it host-side under the syncer-mangled name in ns `mgmt`. The
  # bridge looks it up for `admin-password`.
  bitnamiSecretNamespace: mgmt
  bitnamiSecretName: keycloak-x-keycloak-x-mgmt-vcluster
  masterAdminUser: admin
# ─── Gitea admin-secret host bridge (#3811, Refs #3642) ────────────────
# #3642 moved bp-gitea INTO the mgmt vCluster (vc-mgmt). The gitea chart's
# `gitea-admin-secret` (templates/admin-secret.yaml, random `randAlphaNum
# 32` password, lookup-stable) now lives in vc-mgmt ns `gitea`; on the
# HOST the vCluster syncer (`sync.toHost.secrets.enabled: true`) mirrors it
# ONLY under the mangled name `<name>-x-<inner-ns>-x-<vcluster-release>`
# (e.g. `gitea-admin-secret-x-gitea-x-mgmt-vcluster`) in the syncer's host
# namespace (`mgmt`). Plain `gitea/gitea-admin-secret` — the name the
# catalyst-gitea-token mint hook's render gate + RBAC + runtime kubectl all
# expect (the pre-#3642 contract) — no longer exists on the host.
#
# Result on a fresh prov (hw163, 2026-06-18): the mint template's gate
# `lookup "v1" "Secret" "gitea" "gitea-admin-secret"` returns nil → the
# WHOLE catalyst-gitea-token-secret.yaml renders nothing (no Secret, no
# mint Job) → the tenants-repo-bootstrap + catalog-sovereign-repo-bootstrap
# pre-install hooks `secretKeyRef catalyst-gitea-token` hit
# CreateContainerConfigError → bp-catalyst-platform pre-install times out →
# console never comes up.
#
# Neither the vCluster syncer (toHost always MANGLES the name — vcluster
# 0.23.0 `sync.toHost.secrets` has no `mappings.byName` rename, only
# fromHost does) NOR the emberstack reflector (mirrors the SAME name to
# other namespaces, can't rename) can produce a PLAIN-named host secret. So
# templates/catalyst-gitea-admin-secret-bridge.yaml Helm-`lookup`s the
# syncer-origin mangled host secret and re-publishes plain
# `gitea/gitea-admin-secret`, restoring the pre-#3642 host contract with
# zero per-secret special-casing. Same Helm-lookup-and-mirror seam as
# provisioning-github-token.yaml / valkey-cross-ns-secret.yaml.
giteaAdminBridge:
  # Master gate. When false the bridge template renders nothing — set
  # false on Catalyst-Zero (contabo, no vCluster, gitea-admin-secret is
  # hand-rolled) or any topology where bp-gitea stays host-side. On a
  # franchised Sovereign (gitea in vc-mgmt) leave true.
  enabled: true
  # The host namespace the bridge writes the PLAIN gitea-admin-secret into
  # — MUST be where the mint hook's RBAC (catalyst-gitea-admin-reader Role)
  # + its runtime `kubectl -n gitea get secret gitea-admin-secret` look.
  destNamespace: gitea
  # The plain Secret name the mint hook + the pre-#3642 contract expect.
  destSecretName: gitea-admin-secret
  # ── Source: the vCluster-syncer-mirrored mangled host secret ──────────
  # The syncer writes the in-vCluster `gitea/gitea-admin-secret` to the
  # host as `<name>-x-<inner-ns>-x-<vcluster-release>` in the syncer host
  # namespace. For the MGMT vCluster (bp-mgmt-vcluster HR releaseName
  # `mgmt-vcluster`, hostNamespace `mgmt`, inner ns `gitea`) that resolves
  # to `mgmt/gitea-admin-secret-x-gitea-x-mgmt-vcluster`. Reading the
  # syncer ORIGIN (ns `mgmt`) — not the reflector copy (ns `catalyst`) —
  # makes the bridge independent of the gitea chart's reflector
  # allow-namespaces config.
  sourceNamespace: mgmt
  sourceSecretName: gitea-admin-secret-x-gitea-x-mgmt-vcluster

# ─── Multi-zone parent domains (issue #827, parent epic #825) ──────────
# A franchised Sovereign supports N parent zones, NOT one. The operator
# brings 1+ parent domains at signup (`omani.works` for own use,
# `omani.trade` for the SME pool, etc.) and may add more post-handover
# via the admin console (#829). The wildcard Certificate template
# (templates/sovereign-wildcard-certs.yaml) renders ONE Certificate
# resource per entry below, each requesting `*.<zone>` + apex from the
# `letsencrypt-dns01-prod-powerdns` ClusterIssuer (shipped by
# bp-cert-manager-powerdns-webhook). Each cert renews independently;
# a stalled DNS-01 challenge on `omani.trade` does not block the
# `omani.works` cert from rolling.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the zones list
# is fully data-driven. Default empty: when parentZones is empty the
# chart renders ZERO per-zone Certificates and the legacy
# clusters/_template/sovereign-tls/cilium-gateway-cert.yaml owns the
# single-zone wildcard cert. This avoids the helm-controller vs
# kustomize-controller ownership flap on `sovereign-wildcard-tls`.
# Once every active Sovereign has migrated to multi-zone overlays the
# legacy file is deletable.
#
# Each entry:
#   - name (required): apex domain. The Certificate is requested for
#     `*.<name>` + `<name>` (apex).
#   - role (optional): operator-meaningful tag — "primary" or
#     "sme-pool". Carried in resource labels for ops visibility.
#   - secretName (optional): K8s Secret name the Cert is written to.
#     Defaults to `sovereign-wildcard-tls-<sanitised-name>` when
#     unset. The Cilium Gateway listener for that zone references
#     this secret in its certificateRefs block.
parentZones: []

# ─── Per-zone wildcard Certificate (issue #827) ───────────────────────
# Rendered into templates/sovereign-wildcard-certs.yaml. One Certificate
# per entry in `parentZones` (or single fallback from
# global.sovereignFQDN). Each Certificate uses the
# `letsencrypt-dns01-prod-powerdns` ClusterIssuer shipped by
# bp-cert-manager-powerdns-webhook (bootstrap-kit slot 49).
wildcardCert:
  # Toggle the entire render. Default true so a Sovereign install
  # gets its wildcard certs out of the box. Operators that wire certs
  # via an external mechanism (e.g. a centralised cert-manager in a
  # different namespace) flip this off.
  enabled: true
  # Namespace the Certificate(s) land in. MUST match the namespace
  # the Cilium Gateway lives in so the resulting Secret is readable
  # by the Gateway's listener. kube-system is the canonical home of
  # cilium-gateway (clusters/_template/sovereign-tls/cilium-gateway.yaml).
  namespace: kube-system
  # ClusterIssuer to request from. `letsencrypt-dns01-prod-powerdns`
  # is shipped by bp-cert-manager-powerdns-webhook. Operators may
  # override to a per-cluster issuer (e.g. a private ACME) via
  # cluster overlay.
  issuerName: letsencrypt-dns01-prod-powerdns
  # ─── Let's Encrypt staging fallback (Fix #123) ─────────────────────
  # When `useStaging: true`, the rendered Certificate(s) reference the
  # staging issuer (`issuerNameStaging`, default
  # `letsencrypt-dns01-staging-powerdns` shipped by
  # bp-cert-manager-powerdns-webhook 1.1.0+) instead of `issuerName`.
  # The staging issuer hits Let's Encrypt's staging ACME directory
  # (https://acme-staging-v02.api.letsencrypt.org/directory), which
  # has separate, generous rate limits — the production 5-certs/168h
  # ceiling per registered domain is wholly bypassed. The cert is
  # signed by Fake LE Intermediate X1 so browsers reject without an
  # explicit exception, but `curl -sk` and Playwright
  # (ignoreHTTPSErrors:true) accept it. Intended for QA Sovereigns
  # whose wipe + re-provision cadence would otherwise exhaust LE
  # production within hours.
  #
  # Default false — customer Sovereigns issue real-trusted production
  # certs. The bootstrap-kit slot 13-bp-catalyst-platform.yaml flips
  # this to true on QA Sovereigns via the
  # ${WILDCARD_CERT_USE_STAGING:-false} envsubst seam (same pattern
  # as ${QA_FIXTURES_ENABLED:-false}). Per
  # docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every Sovereign
  # may flip this independently from a per-cluster overlay.
  useStaging: false
  # Name of the staging ClusterIssuer. Defaults to the canonical name
  # shipped by bp-cert-manager-powerdns-webhook 1.1.0+. Operators that
  # wire a private staging ACME (e.g. internal Smallstep CA) override
  # both this and the bp-cert-manager-powerdns-webhook staging block
  # via the per-cluster overlay.
  issuerNameStaging: letsencrypt-dns01-staging-powerdns
  # Cert renew window. cert-manager defaults are conservative; we
  # match the per-Sovereign cilium-gateway-cert.yaml legacy values.
  duration: ""        # empty = cert-manager default (90d for LE)
  renewBefore: ""     # empty = cert-manager default (~1/3 of duration)

# ─── Catalyst image coordinates ───────────────────────────────────────────────
# Default registry + org point at ghcr.io/openova-io/openova. Per-Sovereign
# overlays leave these untouched and set global.imageRegistry to the local
# Harbor mirror instead.
images:
  registry: "ghcr.io"
  organization: "openova-io/openova"
  # SHA tags — bump these via CI when building new images.
  catalystApi:
    # 2026-06-03: bumped 2ae493f → ff778a36. Binary 2ae493f predates
    # PR #2854 env rename (CATALYST_HANDOVER_KEY_PATH →
    # CATALYST_HANDOVER_SIGNER_PATH) and only reads the legacy name;
    # new chart emits only the new name, so handoverSigner never
    # initialises and /api/v1/auth/pin/issue returns 503 "handover
    # signer unavailable". ff778a36 reads both names with fallback.
    tag: "3a1bb63"
  catalystUi:
    tag: "3a1bb63"
  marketplaceApi:
    tag: "3c2f7e4"
  console:
    tag: "3c2f7e4"
  # Admin pod has a separate tag from the smeTag bundle because the admin
  # image build is decoupled from the SME microservices CI run — when
  # smeTag is bumped, admin may not have published for that SHA. Caught
  # live on t132 2026-05-16 (ImagePullBackOff on admin:b0ed216 — admin
  # image for that SHA never landed in GHCR even though the other 10
  # SME services did). Default to a known-published tag; bump in lockstep
  # with marketplaceApi/console when admin's UI changes.
  admin:
    tag: "3c2f7e4"
  # All 10 SME microservices share one SHA tag (built from the same mono-repo commit).
  # 2026-06-09: 41e02c8 → c96f998 (#3157 merge SHA). 41e02c8 (built 2026-06-05)
  # predates the #3157 marketplace-plans fix, so services-catalog:41e02c8 lacks
  # filterPlansByProduct → the generic Org-provisioning picker rendered all 8
  # plans (5 generic + 3 Sandbox dupes) instead of 5. A later catalyst-platform
  # roll had re-pinned the stale 41e02c8, reverting the live filter. c96f998
  # carries the server-side filter and is published for every services-* image
  # (verified: services-auth, unchanged by #3157, also has c96f998 → the SME
  # build is all-services, not path-filtered). Refs #3156.
  smeTag: "c068e6a"

# ─── Runtime service coordinates (qa-loop iter-1, cluster
# `catalyst-runtime-config-missing`) ────────────────────────────────────
# Single source of truth for the in-cluster Service URLs the Group C
# controllers (organization, environment, application) consume via the
# `catalyst-runtime-config` ConfigMap (templates/configmap-catalyst-
# runtime-config.yaml). Each controller deployment references this CM
# with `optional: true`; before this block was added, the CM did not
# exist on any Sovereign and `mustEnv("CATALYST_KC_ADDR")` in
# core/controllers/organization/cmd/main.go fail-fasted on every Pod
# start. Caught live on omantel 2026-05-09.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) every value here
# is operator-overridable from the per-Sovereign overlay. Defaults match
# the canonical in-cluster Service FQDNs that bp-keycloak / bp-gitea
# register on every Sovereign (see clusters/_template/bootstrap-kit/
# 11-bp-keycloak.yaml + 12-bp-gitea.yaml).
runtime:
  # Keycloak admin API base URL. Consumed as CATALYST_KC_ADDR by
  # organization-controller (per-Org realm provisioning via the KC
  # Admin API) AND by catalyst-api (operator PIN-issue → KC EnsureUser).
  #
  # G105 #2697 (2026-06-01): post-G92.2 #2687, bp-keycloak's HR carries
  # `placementSchema.vcluster: mgmt` so application-controller (G92.1
  # #2674) routes the chart INSIDE the mgmt vCluster via Flux's
  # `kubeConfig.secretRef`. The chart's Service `Service keycloak.keycloak`
  # then lives inside the vCluster apiserver, NOT on host k3s. The
  # bp-mgmt-vcluster `sync.toHost.services.enabled: true` syncer reflects
  # the Service back to the host with the canonical syncer-mangled name
  # `<service>-x-<inner-ns>-x-<vcluster-name>.<host-ns>.svc.cluster.local`.
  # Pre-G92.2 default `keycloak.keycloak.svc.cluster.local:80` returns
  # NXDOMAIN because the host's `keycloak` namespace no longer exists —
  # PIN sign-in fails with `could not provision user record` (caught
  # live on hw86 2026-06-01).
  #
  # 2026-06-03 (#2856 Gap 3): default reverted to host-level KC SVC
  # `keycloak.keycloak.svc.cluster.local:80`. The G92.2 vCluster pivot
  # was REVERTED in G105-followup #2697 (bp-keycloak runs back on host
  # k3s, not inside mgmt vCluster) but the runtime config's default
  # stayed pointed at the now-non-resolvable vCluster-synced name
  # → org-controller logs spammed "dial tcp: lookup keycloak-x-keycloak
  # -x-mgmt-vcluster.mgmt.svc.cluster.local: no such host" on every
  # Organization create (live on hw86 2026-06-03). Host-level SVC name
  # always resolves regardless of vCluster topology choice. Per-
  # Sovereign overlays MAY override (e.g. to a Catalyst-Zero contabo
  # URL, or to a public auth gateway hostname, or back to the syncer-
  # mangled name on Sovereigns that DO run KC inside the vCluster).
  keycloakAddr: "http://keycloak.keycloak.svc.cluster.local:80"
  # Keycloak realm the per-Org realms are nested under. Default
  # `sovereign` matches the bp-keycloak chart's auto-provisioned
  # tenant realm (the contabo mothership uses `openova` instead).
  keycloakRealm: "sovereign"
  # Gitea public base URL stamped on Application/Environment per-Org
  # repos. Consumed as GITEA_PUBLIC_URL by application-controller and
  # environment-controller. Default points at the in-cluster Service;
  # operators MAY override to the public Gitea host
  # (https://gitea.<sovereign-fqdn>) once the parent zone's HTTPRoute
  # is reconciled.
  giteaPublicURL: "http://gitea-http.gitea.svc.cluster.local:3000"
  # #2940 (2026-06-03): Pillar 5 anti-tether — public-facing console URL.
  # Per-Sovereign overlays MUST override to https://console.<sov-fqdn>.
  # Consumed as CORS_ORIGIN and CATALYST_SOVEREIGN_URL by catalyst-api
  # via the runtime-config ConfigMap (G117.E2E followup pattern, same
  # seam as keycloak-addr + gitea-public-url). Default keeps the
  # mothership URL for back-compat on pre-#2940 Sovereigns; cutover
  # process MUST patch this value as part of bp-self-sovereign-cutover
  # Step 7 (catalyst-api env patch). When this var is overridden, the
  # api-deployment's CORS_ORIGIN + CATALYST_SOVEREIGN_URL envs pick up
  # the new value via the checksum/runtime-config rolling restart
  # mechanism (PR #2928).
  sovereignConsoleURL: "https://console.openova.io"
  # #2940 (2026-06-03): Pillar 5 anti-tether — public origin a
  # provisioning Sovereign's cloud-init PUTs its kubeconfig back to
  # (CATALYST_API_PUBLIC_URL). Same seam pattern as sovereignConsoleURL
  # directly above: mothership URL is ONLY the back-compat default;
  # per-Sovereign overlays override to https://console.<sov-fqdn>/sovereign,
  # and bp-self-sovereign-cutover Step 7 Phase 3 pivots it at cutover
  # with a read-back assert.
  sovereignAPIPublicURL: "https://console.openova.io/sovereign"

# ─── Group C controllers (slice CC3 of EPIC-0 #1095) ────────────────────────
# The 5 K8s-native reconcilers consolidated by CC1 (#1135) + CC2 (#1136):
#
#   organization  — Organization.orgs.openova.io       → KC realm + Gitea Org + per-Org UserAccess
#   environment   — Environment.catalyst.openova.io    → per-vCluster Flux GitRepository in Gitea
#   blueprint     — Blueprint.catalyst.openova.io      → mirror canonical Blueprint into per-Org Gitea repo
#   application   — Application.apps.openova.io        → per-region Kustomization+HelmRelease into Gitea
#   useraccess    — UserAccess.access.openova.io       → RoleBinding + ClusterRoleBinding objects
#
# Every controller is DEFAULT OFF — operators flip the per-Sovereign overlay's
# `controllers.<name>.enabled: true` ONLY after the legacy reconciliation
# path on that surface is ready to retire. Flipping `controllers.useraccess.
# enabled: true` is what RETIRES the broken Crossplane Composition path
# (provider-kubernetes is not installed on any production Sovereign — silent
# P0 bug per docs/EPICS-1-6-unified-design.md §3.5).
#
# Image references SHA-pinned per docs/INVIOLABLE-PRINCIPLES.md #4 + #4a.
# CI stamps `image.tag` on every push to main; a literal SHA (`abcd123`)
# appears here once the per-controller build workflow has run at least once
# against a commit that matches Containerfile bytes. Until then the value
# is `""` and the chart fail-fasts at render time when `enabled: true`
# (see templates/controllers/_helpers.tpl `controllers.image`).
controllers:
  organization:
    # Flipped ON per qa-loop iter-1 (cluster `controllers-and-kc-bootstrap-gates`):
    # the EPIC-3 RBAC reconciliation loop (UserAccess CR → RoleBinding +
    # composite realm-role) is dormant unless the 5 Group C controllers are
    # running. Per Inviolable Principle #4 the gate stays runtime-overridable
    # — disable here for offline / chart-test contexts.
    enabled: true
    image:
      repository: "ghcr.io/openova-io/openova/organization-controller"
      # 32050f0 = H9-walk follow-up (#2745, 2026-06-03) — bumped from
      # 7ff7ea8 (2026-06-02) which itself superseded c9b58ea (TBD-A68
      # / #1997, 2026-05-20). Picks up the latest organization-
      # controller main-HEAD push including G117.2/G117.3b iac-bootstrap.
      # #2851 (2026-06-03): controller pins are now auto-bumped by
      # (a) each build-*-controller.yaml's own auto-bump step and
      # (b) the catalyst-build.yaml #2851 sweep step on every catalyst
      # rebuild, plus (c) the controller-image-tag freshness guard
      # (scripts/check-controller-image-tag-freshness.sh) fails any PR
      # that lets a controller pin drift > 50 commits behind GHCR.
      # Previously: c9b58ea = TBD-A68 fix (#1997, 2026-05-20) — picks
      # up PR #1910's gitea-client fix (POST /api/v1/orgs instead of
      # the admin-only /api/v1/admin/orgs endpoint that returned HTTP
      # 405 to the in-cluster SA). 72e3f08 = qa-loop iter-8 Fix #42
      # (#1252 + Containerfile fix-up #1253), fixed Bug 1 (UserAccess
      # Claim namespace).
      # 300d853 (2026-06-19) — controller-image-tag freshness sweep: the
      # pinned fc38403 had drifted 139 commits behind latest GHCR; bumped to
      # the current organization-controller GHCR tag to clear the staleness gate.
      tag: "300d853"
      pullPolicy: IfNotPresent
    replicas: 1
    leaderElection:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Optional Gitea base URL override. Empty = in-cluster default.
    giteaURL: ""
    # Namespace where per-Org UserAccess Claim CRs are written. Crossplane
    # Claims are namespace-scoped on the live API server even when the
    # backing XR is cluster-scoped — the controller's Get/Create calls
    # MUST carry a namespace or the apiserver rejects with `an empty
    # namespace may not be set when a resource name is provided` (qa-loop
    # iter-8 Fix #42 root cause). Default matches the qa-fixtures
    # convention at templates/qa-fixtures/useraccess-qa-user1.yaml.
    userAccessNamespace: "catalyst-system"
    # Organizations Enter-org support model (issue #3378 DoD 6). When true
    # the org-controller's reconcilePerOrgRealm (#3101) auto-wires a
    # dedicated Keycloak realm per Organization — the precondition for the
    # Enter-org support session (impersonation into a sub-org's own realm).
    # Defaults FALSE: the realm path is merged-dormant until an operator
    # validates it on a live env and flips this in the per-Sovereign values
    # overlay. Stays runtime-overridable per Inviolable Principle #4.
    perOrgRealmEnabled: false
    # PR #3700 §4.3 (deferred half of #3687) — per-Org vCluster Flux loop.
    # On Organization-CR creation the org-controller now find-or-creates a
    # host-cluster Flux GitRepository + Kustomization that reconcile the
    # per-Org `catalyst-tenant` repo's ./vcluster tree onto the host
    # cluster, so the vCluster HelmRelease the controller authored in Gitea
    # actually gets APPLIED (previously assumed a manual one-off
    # Kustomization that never ran on a fresh prov → orphaned bytes /
    # phase=Pending). Per Inviolable Principle #4 every knob is overridable.
    #
    # giteaInClusterURL: the git clone URL the per-Org Flux GitRepository
    # uses. Empty here = in-cluster default (the bp-gitea Service). MUST NOT
    # carry `/api/v1` (that's the REST base, this is the clone URL).
    giteaInClusterURL: ""
    # Namespace the per-Org Flux GitRepository + Kustomization land in.
    # Empty = flux-system (matches the chart's other Flux sources).
    fluxNamespace: ""
    # Reconcile interval (seconds) stamped on the per-Org Flux CRs. Empty/0
    # = 60s default.
    fluxIntervalSeconds: ""
    # Name of a Flux basic-auth Secret (in fluxNamespace) holding the Gitea
    # PAT the per-Org GitRepository clones with.
    #
    # WHY THIS IS NON-EMPTY BY DEFAULT (#3687 / #3376 — hw158 funnel blocker)
    # ---------------------------------------------------------------------
    # The per-Org `<slug>/catalyst-tenant` repo the org-controller creates is
    # ALWAYS private (organization_controller.go EnsureOrg/EnsureRepo pass
    # private=true), and bp-gitea additionally sets REQUIRE_SIGNIN_VIEW=true —
    # so an anonymous git clone returns 401 "authentication required". With an
    # empty secretRef the per-Org GitRepository (catalyst-tenant-<slug>,
    # per_org_flux.go) carries NO `spec.secretRef`, source-controller clones
    # anonymously, Gitea 401s, the catalyst-tenant-<slug>-vcluster
    # Kustomization reports "Source artifact not found", the committed vCluster
    # HelmRelease never reconciles, and the tenant namespace + purchased app
    # (e.g. WordPress) never come up — the funnel's terminal acceptance fails
    # (proven live on hw158 by the #3687 + #3376 walkers).
    #
    # `openova-sme-tenants-git-auth` is a Flux basic-auth Secret in flux-system
    # holding the `gitea_admin` PAT (sourced from catalyst-gitea-token). Because
    # gitea_admin is the Gitea admin it can clone EVERY Org's private
    # catalyst-tenant repo, so this single shared secret authenticates the
    # per-Org GitRepository for all Organizations — no per-Org secret needed.
    # It is the exact credential the top-level openova-sme-tenants
    # GitRepository already clones with successfully on every Sovereign (the
    # proven #3454 pattern). The Secret is guaranteed to exist in flux-system
    # by the catalog-sovereign-flux/gitea-flux-auth-secrets-sync-job.yaml
    # post-install/post-upgrade hook (#3749 / #3668), which reads the
    # runtime-minted catalyst-gitea-token PAT via secretKeyRef (NOT a render-
    # time `lookup`) and idempotently applies BOTH openova-sme-tenants-git-auth
    # and openova-catalog-sovereign-git-auth — so a fresh prov gets it the
    # first time and any chart bump re-asserts it. The PAT never touches argv.
    #
    # Per Inviolable Principle #4 the secret name stays operator-overridable;
    # set to "" to force anonymous clone (only valid if bp-gitea ever drops
    # REQUIRE_SIGNIN_VIEW AND the per-Org repo is made public).
    fluxGiteaSecretRef: "openova-sme-tenants-git-auth"
    # MIRROR-EVERYTHING (#3760, Refs #3376 #3754 — hw158 funnel blocker)
    # ---------------------------------------------------------------------
    # The Sovereign-local Harbor host the per-Org vCluster images pull
    # through (proxy-cache). vcluster 0.33.x renders TWO ghcr.io images in
    # the StatefulSet initContainers — the `loft-sh/kubernetes` k8s distro
    # AND the `loft-sh/vcluster-oss` syncer — both of which the
    # harbor-proxy-pull Kyverno ClusterPolicy (Enforce) DENIES because they
    # don't match the `*/proxy-*/*` glob. gitops.Render re-tags both to
    # `<vclusterImageRegistry>/proxy-ghcr/loft-sh/...`, lockstep with the
    # platform's own bp-dmz/mgmt/rtz-vcluster charts (proven live: without
    # this the StatefulSet is blocked at `/spec/template/spec/initContainers/
    # 0/image/` and the customer's purchased app never runs). Default
    # `harbor.openova.io` for bootstrap; cutover Step-04 (ADR-0002) flips a
    # per-Sovereign overlay to `harbor.<sovereign-fqdn>` post-handover. Per
    # Inviolable Principle #4 it stays operator-overridable.
    vclusterImageRegistry: "harbor.openova.io"
    # Free-form extra env vars threaded into the Pod (advanced; for one-off
    # operator-side knobs not yet promoted to a top-level value).
    env: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  environment:
    # Flipped ON per qa-loop iter-1 — see organization controller above.
    enabled: true
    image:
      repository: "ghcr.io/openova-io/openova/environment-controller"
      # 32050f0 = H9-walk follow-up (#2745, 2026-06-03) — bumped from
      # 8d01e2f (2026-05-31) to the latest environment-controller main-
      # HEAD push (2026-06-02). #2851 sweep + freshness guard now
      # keeps this pin in sync — see organization-controller note above.
      # Previously: a3ba200 = qa-loop iter-8 Fix #42 follow-up (#1257)
      # — adds EnsureBranch before PutFile so Gitea's branch-missing
      # 404 (mapped to ErrRepoNotFound by the client) no longer dead-
      # loops the env-controller.
      tag: "01db043"
      pullPolicy: IfNotPresent
    replicas: 1
    leaderElection:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    giteaURL: ""
    giteaSecretRef: "gitea-flux-token"
    fluxNamespace: "flux-system"
    fluxIntervalSeconds: 60
    commitAuthor:
      name: "environment-controller"
      email: "environment-controller@openova.io"
    envRepoSuffix: "-environment"
    requeueAfterSeconds: 300
    env: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  blueprint:
    # NOTE: blueprint-controller image is not yet published to GHCR — the
    # build-blueprint-controller workflow scaffolding lands in this same PR
    # (qa-loop iter-1). Stays `enabled: false` until the first push-on-main
    # build of core/controllers/blueprint completes. Per Inviolable
    # Principle #4a: never reference an image that wasn't built by CI from
    # a committed git SHA.
    enabled: false
    image:
      repository: "ghcr.io/openova-io/openova/blueprint-controller"
      # 100a213 = H9-walk follow-up (#2745, 2026-06-03) — bumped from
      # 8d01e2f to the latest blueprint-controller main-HEAD push
      # (2026-06-02). enabled remains false until the bp-controller
      # surfaces are wired end-to-end; the pin matches the latest
      # successful push-on-main build per Inviolable Principle #4a.
      tag: "01db043"
      pullPolicy: IfNotPresent
    replicas: 1
    leaderElection:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    giteaURL: ""
    logLevel: "info"
    resyncPeriod: "5m"
    env: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  application:
    # Flipped ON per qa-loop iter-1 — see organization controller above.
    enabled: true
    image:
      repository: "ghcr.io/openova-io/openova/application-controller"
      # 44dedf2 = H9-walk follow-up (#2745, 2026-06-03) — bumped from
      # 8d01e2f (G93.2 era, pre-G117.6). 44dedf2 is the latest main-
      # HEAD push (2026-06-02) and contains G117.6 PR #2790 (commit
      # 67e23a55) + G117.2 multi-instance fields. #2851 closed the
      # drift gap — see organization-controller note above for the
      # 3-layer defense (own auto-bump + catalyst-build sweep + guard).
      # Previously: a3ba200 = qa-loop iter-8 Fix #42 follow-up (#1257)
      # — drops cross-namespace ownerRef on the host-side Flux CRs
      # (was being silently GC'd by the K8s collector because
      # Application lives in a different namespace from flux-system).
      tag: "01db043"
      pullPolicy: IfNotPresent
    replicas: 1
    leaderElection:
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    giteaURL: ""
    sourceNamespace: "flux-system"
    catalogSourceRef: "openova-catalog"
    helmReleaseIntervalSeconds: 600
    requeueAfterSeconds: 300
    # qa-loop iter-8 Fix #42 bug 3 — host-side Flux bootstrap. The
    # controller upserts a per-Application Flux GitRepository +
    # per-region Kustomization in this namespace so Flux on the HOST
    # cluster reconciles the per-app manifests we commit to Gitea.
    # Without these, the per-app manifests sit in Gitea forever.
    hostFluxNamespace: "flux-system"
    # In-cluster Gitea URL (used by Flux on the host to clone the
    # per-app repo). Distinct from giteaURL (operator-facing) — defaults
    # to the in-cluster service so no external DNS dependency.
    giteaInClusterURL: "http://gitea-http.gitea.svc.cluster.local:3000"
    # Flux poll interval on the per-Application GitRepository +
    # Kustomization (seconds). Defaults to 60s for fast initial Pod
    # spin-up; operators with hundreds of Apps may raise this.
    hostFluxIntervalSeconds: 60
    # Optional Secret in HostFluxNamespace holding the Gitea token Flux
    # uses to clone. Empty = anonymous (acceptable for in-cluster Gitea).
    fluxGiteaSecretRef: ""
    env: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  useraccess:
    # Flipping this to true RETIRES the broken Crossplane UserAccess Composition
    # path (per docs/EPICS-1-6-unified-design.md §3.5 — provider-kubernetes not
    # installed on any production Sovereign). MUST be paired with a delete of
    # the Crossplane UserAccess Composition on the same Sovereign — see
    # core/controllers/README.md §"useraccess cutover playbook".
    #
    # Flipped ON per qa-loop iter-1 (cluster `controllers-and-kc-bootstrap-gates`):
    # this is the controller that materialises UserAccess CRs (created by
    # /api/v1/sovereigns/{id}/rbac/assign) into RoleBindings + ClusterRoleBindings.
    # Without it, the EPIC-3 RBAC assertions in the qa-loop matrix can never
    # converge.
    enabled: true
    image:
      repository: "ghcr.io/openova-io/openova/useraccess-controller"
      # SHA pinned to the latest GHCR-published push-on-main build per
      # docs/INVIOLABLE-PRINCIPLES.md #4a. dcd2bb3 = H9-walk follow-up
      # (#2745, 2026-06-03) — bumped from 8d01e2f (2026-05-31) to the
      # latest useraccess-controller main-HEAD push (2026-06-02).
      # #2851 closed the drift gap (auto-bump + sweep + freshness guard).
      tag: "01db043"
      pullPolicy: IfNotPresent
    replicas: 1
    leaderElection:
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    logLevel: "info"
    env: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

# ─── catalyst-catalog HTTP service (EPIC-2 Slice L, #1097) ───────────────
# Multi-source Blueprint catalog backed by Gitea (3 sources: public mirror,
# sovereign-curated, per-Org private). Fed by the unified Gitea client at
# core/controllers/pkg/gitea (CC2 #1136). REPLACES the per-Org SME catalog
# per ADR-0001 §4.3 (different scope: SME's was Org-bound; catalyst-catalog
# is Sovereign-wide multi-source).
#
# Default OFF per docs/INVIOLABLE-PRINCIPLES.md (operators flip on per-
# Sovereign once Gitea Orgs are provisioned). When OFF, helm template
# emits ZERO catalog-related resources.

# ─── Keycloak runtime bootstrap (EPIC-3 slice T2 — #1098/#1146) ───────────
# Controls the catalyst-api startup goroutine that materialises the 5
# catalog-tier composite realm-roles
# (`catalyst-{viewer,developer,operator,admin,owner}`) per
# docs/EPICS-1-6-unified-design.md §6.2. The goroutine is gated by the
# pod env var `KC_BOOTSTRAP_TIER_ROLES` (see api-deployment.yaml; renamed
# 2026-06-03 from `KEYCLOAK_BOOTSTRAP_TIER_ROLES` to avoid the substring
# "KEY" matching Kyverno's deny-plaintext-secret-env regex — Go side
# reads both new and legacy names for backward-compat) which sources its
# default from `.Values.keycloak.bootstrap.ensureTierRoles`.
#
# Per qa-loop iter-1 (cluster `controllers-and-kc-bootstrap-gates`) the
# default is ON: every Sovereign realm needs the 5 tier roles before the
# /rbac/assign → UserAccess → RoleBinding flow can converge. Re-runs of
# the bootstrap are idempotent no-ops. Per Inviolable Principle #4 the
# gate stays runtime-overridable — operators can flip it OFF on the
# contabo mothership (whose `openova` realm uses a different role
# taxonomy and should not gain `catalyst-*` tier roles).
keycloak:
  bootstrap:
    ensureTierRoles: true

services:
  catalog:
    # Flipped ON per qa-loop iter-1 (TC-035..037 surfaced
    # /api/v1/sovereigns/{id}/catalog* 404s — the catalog HTTPRoute
    # was never rendered because this gate was off). Default-ON is
    # safe: catalyst-api treats a 502/503 from the catalog upstream
    # as a clean error path (handler/applications.go surfaces the
    # "catalog upstream" detail). Per Inviolable Principle #4 the
    # gate stays runtime-overridable — disable here for offline /
    # CI render checks that don't have a Gitea backend wired.
    enabled: true
    image:
      repository: "ghcr.io/openova-io/openova/catalyst-catalog"
      # SHA-pinned per Inviolable Principle #4a (no :latest). Stamped
      # from the latest SUCCESS run of the catalyst-catalog
      # GitHub Actions workflow at PR-author time. Future CI bumps
      # land via the catalyst-catalog-image-built repository_dispatch
      # hop (catalyst-catalog-build.yaml notify job → downstream
      # bumper PR).
      # 2026-06-03: bumped 9763286 → 973094b to ship PR #2889 (#2879
      # Sovereign source monorepo-layout fallback). PR #2890 originally
      # stamped 3e05e85 (PR-branch SHA) but catalyst-catalog-build.yaml
      # tags images with the SQUASH-MERGE SHA on main, not the PR-branch
      # SHA — caught live as ImagePullBackOff on hw86 (3e05e85 NotFound
      # on GHCR; only 973094b was published). Stamp the actual on-main
      # SHA. Auto-bump didn't fire because the catalyst-catalog-image-
      # built repository_dispatch hop isn't wired into catalyst-build.yaml's
      # sweep step (same #2851 class of bug — followup tracked).
      tag: "973094b"
      pullPolicy: IfNotPresent
    replicas: 1
    # Gitea endpoint — empty defaults to in-cluster Service URL.
    giteaURL: ""
    # Secret + key holding the Gitea admin access token. Reuses the same
    # secret as the Group C controllers — one rotation surface.
    giteaSecretRef: "catalyst-gitea-token"
    # Per-Org private blueprint repo name. One repo per Org (e.g.
    # "acme/shared-blueprints").
    orgPrivateRepo: "shared-blueprints"
    # Public-mirror Gitea Org (always visible to every caller).
    publicOrg: "catalog"
    # Sovereign-curated Gitea Org (always visible to every caller).
    sovereignOrg: "catalog-sovereign"
    # Session cookie name (must match catalyst-api's IssueSessionCookie
    # name; default matches catalyst-api 1.4.x).
    sessionCookieName: "catalyst_session"
    # When true, anonymous callers may list public + sovereign-curated
    # blueprints (no per-Org private). Default false (closed).
    anonymousReads: false
    # In-memory LRU cache for blueprint.yaml reads.
    cache:
      ttlSeconds: 30
      capacity: 1024
    # Gateway API HTTPRoute — exposes /api/v1/catalog on the api.<sov>
    # hostname. Disable here if the operator prefers to proxy catalog
    # calls through catalyst-api instead (follow-up).
    httpRoute:
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    env: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # ── catalyst-projector (EPIC-4 P1, #1099) ─────────────────────────
  # Subscribes to NATS catalyst.events JetStream and writes to Valkey
  # under the `cluster:{c}:kind:{k}:{ns}/{name}` key shape, fan-out
  # for cross-replica catalyst-api SSE consumers. See
  # core/cmd/projector/DESIGN.md for the wire contract.
  #
  # Default-OFF gate. When OFF, `helm template` emits ZERO
  # projector-related resources. Operator opts in once
  # bp-nats-jetstream + bp-valkey are reconciled.
  projector:
    enabled: false
    image:
      repository: "ghcr.io/openova-io/openova/projector"
      # Empty `tag` fail-fasts at render time per Inviolable Principle #4a.
      tag: "9f6017b"
      pullPolicy: IfNotPresent
    replicas: 1
    # Sovereign cluster id used as the prefix in every projected
    # Valkey key (`cluster:{clusterID}:kind:...`). Each Sovereign
    # sets this to its canonical id (matches kubeconfig stem in
    # k8scache.Factory).
    clusterID: ""
    nats:
      # In-cluster NATS JetStream Service URL.
      #
      # G105 #2697 (2026-06-01): post-G92.2 #2687, bp-nats-jetstream's
      # HR carries `placementSchema.vcluster: mgmt` so the chart lives
      # INSIDE the mgmt vCluster (Service `nats-jetstream.nats-system`
      # in vCluster apiserver). The bp-mgmt-vcluster syncer reflects
      # it to the host as the syncer-mangled name
      # `nats-jetstream-x-nats-system-x-mgmt-vcluster.mgmt.svc.cluster.local:4222`.
      # Pre-G92.2 default `nats-jetstream.nats-system.svc.cluster.local:4222`
      # returned NXDOMAIN because the `nats-system` namespace no longer
      # exists on the host k3s.
      url: "nats://nats-jetstream-x-nats-system-x-mgmt-vcluster.mgmt.svc.cluster.local:4222"
      stream: "catalyst.events"
      subject: "catalyst.events.>"
    valkey:
      # #3373 Batch A (2026-06-14): bp-valkey moved INSIDE the rtz
      # vCluster (placement.yaml: `bp-valkey → vcluster: rtz, namespace:
      # valkey`). The bp-rtz-vcluster syncer reflects the in-vCluster
      # `valkey-primary` Service to the HOST under the syncer-mangled
      # name `valkey-primary-x-valkey-x-rtz-vcluster.rtz.svc`, so the host
      # `valkey` namespace no longer carries a `valkey-primary` Service —
      # the old `valkey-primary.valkey.svc` resolves NXDOMAIN. Align the
      # projector addr to the synced name (lockstep with the nats.url move
      # above). Override via this key for a host-placed valkey.
      addr: "valkey-primary-x-valkey-x-rtz-vcluster.rtz.svc.cluster.local:6379"
      username: ""
      # Optional Secret reference for the Valkey password.
      passwordSecret: {}
      ttl: "24h"
    coldStart: true
    logLevel: info
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

# bp-catalyst-platform umbrella values
#
# As of 1.1.9 this umbrella ships ONLY the Catalyst-Zero control-plane
# workloads (catalyst-ui, catalyst-api, ProvisioningState CRD, Sovereign
# HTTPRoute). The 10 foundation Blueprints (cilium, cert-manager, flux,
# crossplane, sealed-secrets, spire, nats-jetstream, openbao, keycloak,
# gitea) are installed independently by clusters/_template/bootstrap-kit/
# at slots 01..10. There are no subchart values to thread here.
#
# Historic note: 1.1.4 set `bp-keycloak.keycloak.postgresql.fullnameOverride`
# and `bp-gitea.gitea.postgresql.fullnameOverride` to deconflict bitnami
# postgresql `<release>-postgresql` collisions when both Blueprints were
# subcharts of this umbrella (issue #252). Now that they're top-level
# Flux HelmReleases under separate namespaces (bp-keycloak →
# `keycloak`, bp-gitea → `gitea`), the collision is gone and the
# overrides are unnecessary.

# ProvisioningState CRD — the canonical persistence shape for Sovereign
# provisioning runs (issue #88). Keeps observability of in-flight wizard
# runs on the K8s plane (`kubectl get provisioningstates -A`) in addition
# to the catalyst-api Pod's local flat-file store at
# /var/lib/catalyst/deployments. The two stores compose: the flat file is
# authoritative (full event log, fsync-rename atomic), the CRD is the
# coarse-grained projection (state machine pending → ... → ready | failed)
# that operators and sibling controllers consume.
provisioningState:
  crd:
    # Default true: the CRD is part of the bp-catalyst-platform contract.
    # Disable only if the cluster has the CRD installed by an out-of-band
    # mechanism (test envtest harness, sibling Catalyst instance) and a
    # second install would conflict.
    enabled: true

# ─── catalyst-api runtime config ──────────────────────────────────────────
# Knobs the api-deployment.yaml template threads as env vars. Empty values
# fall back to in-code defaults (see the deployment template). Per
# docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) every URL is
# operator-overridable from the per-Sovereign overlay without rebuilding
# the chart.
catalystApi:
  # OpenBao address for the bare-URL SSO shim (#3374). Rendered into
  # CATALYST_OPENBAO_ADDR on Sovereign installs only (gated on
  # global.sovereignFQDN in api-deployment.yaml). Empty = the canonical
  # in-cluster default http://openbao.openbao.svc.cluster.local:8200
  # (same value as bp-openbao autoUnseal.baoAddress / sso-configure
  # BAO_ADDR). The shim uses only the unauthenticated oidc auth_url
  # endpoint — no token is wired here.
  openbaoAddr: ""
  # OpenBao Kubernetes-auth role (#3376) the catalyst-api logs in with to
  # seal the phase0 tofu archive (ReceiveTofuArchive). Rendered into
  # CATALYST_OPENBAO_K8S_AUTH_ROLE on Sovereign installs only. Must match
  # bp-openbao kubernetesAuth.catalystApi.role. Empty falls back to the
  # canonical "catalyst-api" role bound by bp-openbao's auth-bootstrap Job.
  openbaoK8sAuthRole: ""
  # PowerDNS REST API base URL used by:
  #   - SME-tenant pipeline's PATCH-RRset writer (sme_tenant_dns.go)
  #   - Multi-zone parent-domain handler (parent_domains.go, issue #827)
  # Empty = in-code default (in-cluster Service FQDN of the Sovereign's
  # own PowerDNS, http://powerdns.powerdns.svc.cluster.local:8081).
  powerdnsURL: ""
  # PowerDNS server identifier per the REST API contract. Empty = "localhost".
  powerdnsServerID: ""
  # NATS endpoint catalyst-api dials at startup to publish
  # `catalyst.tenant.sandbox_requested` (TBD-D35c, issue #1776). Empty
  # = the canonical in-cluster default
  # `nats://nats-jetstream.nats-system.svc.cluster.local:4222`. Override
  # at Sovereign level only when running an out-of-cluster NATS
  # (uncommon; the bp-nats-jetstream Blueprint deploys an in-cluster
  # broker by default).
  natsURL: ""

# ─── Sovereign HTTPRoute (Cilium Gateway API, issue #387) ─────────────────
# Renders templates/httproute.yaml when `ingress.gateway.enabled=true`
# (default) AND per-Sovereign overlay supplies `ingress.hosts.console.host`
# and `ingress.hosts.api.host`. The legacy contabo Ingress templates
# (templates/ingress.yaml, templates/ingress-console-tls.yaml) are
# excluded from Sovereign installs via .helmignore — Sovereigns ingress
# exclusively through Cilium Gateway API per ADR-0001 §9.4.
ingress:
  gateway:
    enabled: true
    parentRef:
      name: cilium-gateway
      namespace: kube-system
      # sectionName intentionally EMPTY (issue #1884, TBD-A30).
      #
      # The Cilium Gateway template
      # (clusters/_template/sovereign-tls/cilium-gateway.yaml +
      # bp-catalyst-platform's templates/sovereign-tls-vars-cm.yaml
      # — formerly infra/hetzner/main.tf locals.parent_domains_listeners_yaml
      # before #2118 / TBD-V48 hoisted the render into the chart)
      # names HTTPS listeners as follows:
      #   - SINGLE parent zone → bare `https` / `http`
      #   - MULTIPLE parent zones (SME pool present) → unique
      #     `https-<sanitised-zone>` / `http-<sanitised-zone>`
      #     (e.g. `https-omani-works`, `https-omani-homes`)
      # Pinning `sectionName: https` here broke every catalyst-system
      # HTTPRoute on multi-zone Sovereigns because the listener name was
      # `https-<sanitised-primary-zone>`, never bare `https` →
      # `Accepted=False NoMatchingListener` → 404 / connection refused
      # on console.<sov>, api.<sov>, marketplace.<sov>, *.<sov>
      # (caught on t28 by A107 D29 walk, 2026-05-19).
      #
      # Leaving `sectionName` empty delegates listener attachment to the
      # Cilium Gateway hostname matcher: each listener carries
      # `hostname: *.<zone>` so a route hostname like `console.<sov-fqdn>`
      # auto-attaches to exactly the listener(s) whose hostname filter
      # matches. This is the canonical pattern already in use by
      # core/controllers/sandbox/internal/gitops/manifests.go (sandbox),
      # core/controllers/organization/internal/controller/tenant_route.go
      # (per-tenant routes), and the chart's own
      # templates/org-services/organization-public-routes.yaml — every other
      # Cilium Gateway HTTPRoute on a Sovereign omits sectionName.
      #
      # Operators with an unusual topology (e.g. internal-only Gateway,
      # preflight workflow with HTTP-only listener named `http`) may
      # still override via per-Sovereign values:
      #   --set ingress.gateway.parentRef.sectionName=http
      # The httproute.yaml / services/catalog/httproute.yaml /
      # org-services/marketplace-routes.yaml templates all guard with
      # `{{- with .Values.ingress.gateway.parentRef.sectionName }}`,
      # so the field renders only when explicitly set.
      sectionName: ""
    # #3373 fix (a): when bp-catalyst-platform installs inside a vCluster
    # (Flux kubeConfig pivot), the slot overrides these with the host-side
    # syncer-mangled Service names (<svc>-x-<ns>-x-<vcluster>, e.g.
    # catalyst-api-x-catalyst-system-x-mgmt-vcluster) so the HOST Cilium
    # Gateway — which serves the toHost-mirrored HTTPRoute — resolves the
    # backendRef. Empty = chart-literal catalyst-api / catalyst-ui (host
    # install, byte-identical render).
    backendServiceApi: ""
    backendServiceUi: ""
  # Hosts populated by the bootstrap-kit slot
  # (clusters/_template/bootstrap-kit/13-bp-catalyst-platform.yaml).
  # Empty here so `helm template` without a per-Sovereign overlay fails
  # closed (Inviolable Principle #4).
  hosts:
    console:
      host: ""
    api:
      host: ""
    admin:
      host: ""
    marketplace:
      host: ""
  # Marketplace mode toggle (issue #710). When enabled, the chart renders
  # templates/org-services/marketplace-routes.yaml exposing
  # marketplace.<sov>/{,api/,back-office/} (storefront + BSS) and one
  # HTTPRoute per entry in `tenantSlugs` (each scoped to
  # `<slug>.<sov>` exactly — NO wildcard) via Cilium Gateway. Default
  # OFF — non-marketplace Sovereigns get the SME workloads but no
  # public ingress.
  #
  # TBD-A42 (issue #1905, 2026-05-19): tenant-wildcard previously
  # claimed `*.<sov>`, which on Cilium Gateway shadowed exact-match
  # platform HTTPRoutes (auth.<sov> → Keycloak, console.<sov> →
  # catalyst-ui, api.<sov> → catalyst-api, etc.) — even though Gateway
  # API spec §5.2.1 says more-specific hostnames win, the wildcard's
  # admission-order-dependent precedence on Cilium meant
  # `auth.t31.omani.works` returned the SPA console HTML instead of
  # Keycloak's login page, breaking D4 SSO. Fix: replace the single
  # `*.<sov>` hostname with one exact `<slug>.<sov>` HTTPRoute per
  # slug listed in `tenantSlugs`. Operator stamps the slug list at
  # provision time (e.g. `["acme","beta","gamma"]`); the runtime
  # organization-controller writes per-tenant HTTPRoutes for any new
  # Org created post-provision (see tenant-public-routes.yaml below).
  # `tenantSlugs` defaults to empty: no wildcard catch-all is emitted
  # so platform subdomains can NEVER be shadowed.
  marketplace:
    enabled: false
    # Explicit list of marketplace tenant slugs that should receive a
    # public HTTPRoute pointing at the SME `console` Service (which
    # host-routes per tenant by `<slug>.<sov>`). One HTTPRoute per
    # entry, hostname=`<slug>.<global.sovereignFQDN>` exact. Examples:
    #   tenantSlugs: ["acme", "beta", "gamma"]
    # Each emitted HTTPRoute is name=`tenant-<slug>` in the chart
    # release namespace, parent=cilium-gateway/kube-system. Defaults
    # to empty so no SaaS-tenant route is emitted until an operator
    # opts a slug in — protects platform-reserved subdomains by
    # construction.
    tenantSlugs: []

# ─── Organization overlay reconciler (issue #882) ─────────────────────────
# Flux Kustomization shipped by templates/org-services/org-repo-
# kustomization.yaml. Watches the path the catalyst-api Organization
# orchestrator (organization_gitops.go::WriteTenantOverlay) commits
# per-tenant overlays to:
#
#   ./clusters/<global.sovereignFQDN>/sme-tenants
#
# Without it, every POST /api/v1/sme/tenants reaches state=done
# optimistically but the per-tenant K8s resources (Namespace, vCluster,
# bp-keycloak / bp-cnpg / bp-wordpress-tenant / bp-openclaw /
# bp-stalwart-tenant HRs) never materialise. Caught live on otech103,
# 2026-05-04.
#
# Gated on ingress.marketplace.enabled (non-marketplace Sovereigns
# don't run the SME tenant pipeline).
#
# Per Inviolable Principle #4 (never hardcode), every operationally-
# meaningful value is operator-overridable. Defaults match the
# canonical bootstrap-kit conventions documented in
# clusters/_template/bootstrap-kit/03-flux.yaml + the cloud-init
# flux-bootstrap.yaml block (which seeds flux-system/openova
# GitRepository).
smeTenants:
  kustomization:
    # Resource name. Default `sme-tenants` — short, ops-readable,
    # appears in `kubectl get kustomization -n flux-system`.
    name: sme-tenants
    # Lives in flux-system alongside the cluster's other Kustomizations
    # (bootstrap-kit, sovereign-tls, infrastructure-config) so operator
    # tooling can discover it via the standard `-n flux-system` flag.
    namespace: flux-system
    # TBD-C18e (2026-05-18): default flipped from `openova` to the
    # dedicated `openova-sme-tenants` GitRepository (rendered by sibling
    # template sme-tenants-gitrepository.yaml), tracking the
    # `sme-tenants` branch. The bootstrap GitRepository (`openova`)
    # continues to read `main` so chart upgrades + infra fixes reconcile
    # as before — only this Kustomization reads from the protected
    # branch. Operator may flip back to `openova` for a single-branch
    # debug session without losing the rest of the SME-tenant pipeline.
    sourceRef:
      name: openova-sme-tenants
      namespace: flux-system
    # Reconcile cadence. 1m matches the orchestrator's documented
    # "Flux on the OTECH cluster reconciles within ~1 min" SLA at the
    # top of sme_tenant_gitops.go.
    interval: 1m
    # Same as interval — failed reconciles release the revision lock
    # quickly so a per-tenant fix lands on the next poll.
    retryInterval: 1m
    # Per-tenant overlays each install ~5 bp-* HelmReleases that take
    # multiple minutes to roll. 5m bounds the apply attempt without
    # falsely declaring readiness or holding the lock too long. Each
    # tenant's full readiness is owned by the orchestrator's watcher
    # loop, not this Kustomization (wait: false below).
    timeout: 5m
    # DELETE /api/v1/sme/tenants/<id> removes the per-tenant overlay
    # directory. Flux GCs the corresponding K8s resources via the
    # Kustomization's prune contract.
    prune: true
    # Each tenant overlay's HelmReleases install asynchronously and
    # have their own readiness watcher in the SME-tenant orchestrator.
    # Blocking this top-level Kustomization on every tenant's full
    # readiness would let one stuck tenant gate every other tenant's
    # reconcile — a single CrashLooping bp-keycloak in tenant A would
    # prevent tenant B from being created.
    wait: false
  # ─── Dedicated GitRepository for tenant overlays (TBD-C18e) ─────────
  # Rendered by templates/org-services/org-repo-gitrepository.yaml.
  # Tracks a SEPARATE branch from the bootstrap GitRepository so the
  # cutover-gitea-mirror Job (which `git push --mirror --force`s `main`
  # from upstream every ≤10 min) cannot clobber per-tenant overlays
  # committed by the provisioning service. The sme-tenants Kustomization
  # above defaults to sourceRef.name = `openova-sme-tenants` to consume
  # this CR; flip it back to `openova` for a single-branch debug session.
  gitRepository:
    name: openova-sme-tenants
    namespace: flux-system
    # Branch the provisioning service writes per-tenant overlays to and
    # this GitRepository pulls from. MUST stay in sync with the
    # provisioning Deployment's GITHUB_BRANCH env (see
    # templates/org-services/provisioning.yaml — defaults to
    # `sme-tenants` on Sovereign install, `main` on Catalyst-Zero).
    branch: sme-tenants
    # In-cluster Gitea base URL. Matches what
    # platform/self-sovereign-cutover/chart/templates/
    # 05-flux-gitrepository-patch-job.yaml patches into the existing
    # `openova` GitRepository at cutover time. Hardcoded here so the
    # new CR is correct on first apply (no second cutover step
    # required).
    apiURL: "http://gitea-http.gitea.svc.cluster.local:3000"
    org: openova
    repo: openova
    interval: 1m
    # #3454 — Flux MUST authenticate to clone the local Gitea even when
    # openova/openova is PUBLIC, because bp-gitea sets
    # service.REQUIRE_SIGNIN_VIEW=true (platform/gitea/chart/values.yaml)
    # which makes ANONYMOUS git clone return 401 (proven live on hw133: a
    # fresh public repo's info/refs?service=git-upload-pack = 401 anon, 200
    # authed). The bp-gitea values comment confirms the intent: "Git/Flux/
    # API clients are unaffected (token auth)". So the openova-sme-tenants
    # GitRepository carries a secretRef to a Flux basic-auth Secret holding
    # the catalyst-gitea-token PAT (rendered by sme-tenants-gitrepo-auth-
    # secret.yaml). Without this the GitRepository sits "authentication
    # required" forever and every sub-org hangs in Provisioning.
    secretRef:
      # Name of the Flux basic-auth Secret in this GitRepository's namespace
      # (flux-system). Rendered by sme-tenants-gitrepo-auth-secret.yaml.
      name: openova-sme-tenants-git-auth
      # Gitea account the PAT belongs to (matches CATALYST_GITOPS_USER in
      # api-deployment.yaml). The PAT is sourced from catalyst-gitea-token.
      username: gitea_admin
      patSourceSecretName: catalyst-gitea-token
      patSourceKey: token
  # ─── Pre-cutover local-Gitea repo bootstrap (#3454, Refs #3376) ─────
  # The SME-tenant gitops chain (catalyst-api push target + the
  # openova-sme-tenants GitRepository above) targets the local Gitea
  # repo `openova/openova`@`sme-tenants`. PRE-cutover that repo does not
  # exist — bp-self-sovereign-cutover Step 01 (the gitea-mirror Job)
  # creates it only POST-handover, so the GitRepository sits in
  # "authentication required" (missing-repo → Gitea 401) and every
  # sub-org hangs in Provisioning. The pre-install hook Job rendered by
  # templates/org-services/gitea-org-repo-bootstrap-job.yaml seeds
  # the org/repo/branch via the Gitea API (admin creds from
  # gitea/gitea-admin-secret) so the chain is live from first
  # convergence; cutover Step 01 later mirrors the full upstream content
  # over the same coordinates (idempotent). MUST stay in sync with
  # gitRepository.{org,repo,branch} above and the catalyst-api
  # CATALYST_GITOPS_REPO_URL/BRANCH env (templates/api-deployment.yaml).
  repoBootstrap:
    giteaInternalURL: "http://gitea-http.gitea.svc.cluster.local:3000"
    org: openova
    repo: openova
    branch: sme-tenants

# ─── Per-Organization public HTTPRoutes (issue #1629 follow-up) ───────
# PowerDNS now resolves `<slug>.<parentDomain>` for every Org that maps
# onto a Sovereign's role=sme-pool parent domain, but without a
# corresponding HTTPRoute the Cilium Gateway terminates TLS on the
# wildcard cert and falls through to the marketplace tenant-wildcard
# route (which sends the request to the marketplace `console` Service).
# End result: `acme.omani.homes` renders the storefront landing page
# instead of the tenant's installed WordPress / Nextcloud / GitLab.
#
# Each entry in tenantRoutes[] is rendered by
# templates/org-services/organization-public-routes.yaml as one HTTPRoute in
# the Org's namespace, attached to cilium-gateway/kube-system. The
# runtime organization-controller produces the same HTTPRoute shape
# live for every Organization whose spec.tenantPublic.parentDomain is
# set — operators may rely on the controller's reconcile loop OR
# stamp static fixtures here (the two paths produce byte-identical
# manifests so they don't conflict on `helm diff`).
#
# Default empty: Sovereigns without any public-hostname-bearing Orgs
# render zero per-tenant HTTPRoutes. Entry shape:
#
#   - slug: "acme"
#     subdomain: "acme"           # optional; defaults to slug
#     parentDomain: "omani.homes" # required
#     product: "wordpress"        # optional; operator tag
#     namespace: "acme"           # optional; defaults to slug
#     backend:
#       service: "wordpress-x-acme-x-vcluster"   # required
#       port: 80                                  # optional; defaults to 80
#     gateway:
#       name: cilium-gateway      # optional; defaults to cilium-gateway
#       namespace: kube-system    # optional; defaults to kube-system
tenantRoutes: []

# Marketplace operator branding + payment + signup config (issue #710).
# Operator-supplied at provision time; rendered into ConfigMaps consumed
# by templates/org-services/marketplace.yaml + admin.yaml. Defaults are
# safe placeholders so non-marketplace Sovereigns render without input.
marketplace:
  brand:
    name: ""              # Display name in storefront header (e.g. "Otech Cloud")
    tagline: ""           # Sub-headline (e.g. "Cloud + SaaS for Oman")
    logo: ""              # Logo URL (data: or remote)
    primaryColor: ""      # Hex (#RRGGBB) — falls back to chart default if empty
  currency: "USD"          # ISO-4217 (OMR / USD / EUR / SAR / AED / ...)
  paymentProvider:
    stripe:
      enabled: false
      publishableKey: ""              # safe to render in storefront JS
      secretKeyRef:                   # Secret + key holding STRIPE_SECRET_KEY
        name: ""                      # default: "" — disabled
        key: "secret-key"
      webhookSecretRef:
        name: ""
        key: "webhook-secret"
  signupPolicy:
    requireVoucher: false             # if true, /redeem must succeed before signup
    googleOAuth:
      enabled: false
      clientId: ""
      clientSecretRef:
        name: ""
        key: "client-secret"

# ─── SME Postgres cluster (issue #859) ────────────────────────────────────
# When ingress.marketplace.enabled=true the chart renders a
# CloudNativePG `Cluster` resource backing the SME microservice mesh. CNPG
# auto-creates the `<cluster>-app` Secret (basic-auth shape: username +
# password) the SME services consume via secretKeyRef.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value flows through .Values.smePostgres so per-Sovereign
# overlays can right-size storage / instances / pgVersion without forking
# the chart.
smePostgres:
  # ── #3370 embedded-DB elimination seams ───────────────────────────────
  # externalHost — when set (slot 13 in shared mode), every SME service
  # + FerretDB dials this host instead of the bundled sme-pg-rw Service
  # (e.g. shared-pg-c-rw.shared-data.svc.cluster.local). Empty = the
  # bundled Cluster (byte-identical default).
  externalHost: ""
  # credentialSecret — when set, the SME services + FerretDB read
  # username/password from this Secret instead of the CNPG-generated
  # sme-pg-app (the slot-16d hub `sme-database-secret`, reflector-PUSHED
  # into ns sme, carries the same keys). Empty = sme-pg-app.
  credentialSecret: ""
  cluster:
    # false → the bundled sme-pg Cluster is skipped entirely (#3370
    # shared mode: the mesh runs on shared-pg-c's sme_* Contexts).
    enabled: true
    name: sme-pg                    # produces sme-pg-rw / sme-pg-app / sme-pg-superuser (wire-stable persisted data — #3383 keeps the CNPG cluster + secret names)
    namespace: org-services         # the Organization services live here too (#3383: was `sme`)
    instances: 1                    # single-node by default; HA is a per-overlay decision
    # CNPG postgres image. Defaults to the mothership Harbor proxy cache
    # (harbor.openova.io/proxy-ghcr) so fresh-prov bootstrap pulls the
    # ~300MB image through Harbor instead of throttling on anonymous ghcr
    # (#3058). PUBLIC image → proxy-ghcr serves it cred-free. Post-cutover
    # Step-04's containerd mirror redirects harbor.openova.io → local Harbor.
    # The tag is set separately via pgVersion.
    imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql
    pgVersion: "16"                 # tracks contabo data/postgresql.yaml + ADR-0003
    database: sme_auth              # primary DB owned by the `sme` user; secondary DBs below
    owner: sme                      # role name + secret username
    # Secondary DBs created via postInitApplicationSQL (1.4.4 — added
    # sme_documents for FerretDB, see ferretdb.yaml + cnpg-cluster.yaml).
    # Adding a new SME service is a values-only change.
    additionalDatabases:
      - sme_billing                 # billing service primary DB
      - sme_documents               # FerretDB (MongoDB-wire) backing DB — issue #861
    storageSize: 10Gi
    storageClass: local-path        # k3s default; per-Sovereign overlays may override
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi

# ─── SME secrets bundle (issue #859) ──────────────────────────────────────
# When ingress.marketplace.enabled=true the chart renders a `sme-secrets`
# Kubernetes Secret in the `sme` namespace consumed by 10 of the 11 SME
# service Deployments (auth, billing, catalog, console, domain, gateway,
# marketplace, notification, provisioning, tenant).
#
# JWT_SECRET / JWT_REFRESH_SECRET / ADMIN_PASSWORD are auto-generated on
# first install via sprig randAlphaNum and PERSIST across reconciles via
# Helm `lookup` (same pattern as platform/gitea/chart/templates/
# admin-secret.yaml — see issue #830 Bug 2). Without lookup every
# reconcile would invalidate every active SME session and lock out every
# admin.
#
# GOOGLE_CLIENT_* and SMTP_* are operator-supplied at provision time
# (typically via the per-Sovereign overlay or admin-console signup).
# Defaults are safe placeholders so the chart renders cleanly even when
# the operator hasn't wired OAuth or SMTP yet — non-marketplace
# Sovereigns simply don't render this Secret.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 + #10: no hardcoded plaintext
# credentials; every value flows from .Values.smeSecrets or via lookup'd
# external Secret refs.
smeSecrets:
  secretName: org-services-secrets   # #3383: was `sme-secrets`; chart dual-renders the legacy name for one release
  namespace: org-services            # #3383: was `sme`
  smtp:
    # ─── Sovereign source-Secret (issue #934) ────────────────────────
    # On a freshly franchised Sovereign the SMTP creds are seeded by
    # cloud-init / A5's provisioner (#883/#905) into
    # `catalyst-system/sovereign-smtp-credentials`. The sme-secrets
    # template reads from there with source-wins precedence so any
    # non-empty bytes override the chart-level defaults below. Empty
    # source falls back to the defaults so non-Sovereign (contabo)
    # installs keep working unchanged.
    sovereignNamespace: catalyst-system
    sovereignSecretName: sovereign-smtp-credentials
    # Defaults match `.Values.sovereign.smtp.*` (the catalyst-api PIN
    # delivery path) so the SME auth service uses the same mothership
    # relay coordinates as the catalyst Console PIN flow until the
    # Sovereign-local Stalwart relay (slot 95 bp-stalwart-sovereign)
    # lands. The SMTP source-Secret (catalyst-system/sovereign-smtp-
    # credentials) is layered on top via source-wins precedence in
    # sme-secrets.yaml — when A5's provisioner (#883/#905) seeds the
    # canonical key shape (smtp-host/port/from), those bytes win over
    # these fallbacks. Until A5 ships full host/port/from coverage
    # the chart-level fallback keeps gate 2 (PIN delivery) working.
    # Issue #934 follow-up.
    host: "mail.openova.io"
    port: "587"
    from: "noreply@openova.io"
    user: "noreply@openova.io"                # SMTP submission username (often == from)
    # SMTP_PASS is sensitive — never inline it. Reference an existing
    # Secret in the `sme` namespace (the per-Sovereign overlay typically
    # creates this from cloud-init or via OpenBao + ExternalSecret).
    # Empty `name` skips the lookup and renders SMTP_PASS as empty.
    passwordSecretRef:
      name: ""                                # default: "" — no SMTP auth
      key: "password"
  admin:
    # Bootstrap admin email rendered into Secret as ADMIN_EMAIL. The
    # paired ADMIN_PASSWORD is auto-generated via lookup-persisted
    # randAlphaNum (32 chars) on first install — never settable from
    # values per Inviolable Principle #10.
    email: "admin@openova.io"

# ─── SME service backing-store endpoints (issue #861) ─────────────────────
# When ingress.marketplace.enabled=true the chart renders:
#   - templates/org-services/ferretdb.yaml — FerretDB Deployment + Service
#     in `sme` ns, MongoDB-wire-compatible front end backed by sme-pg.
#   - templates/org-services/valkey-cross-ns-policy.yaml —
#     CiliumNetworkPolicy in `valkey` ns allowing ingress from `sme` ns.
#   - templates/org-services/configmap.yaml — MONGODB_URI + VALKEY_ADDR
#     populated from the values below.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every URL,
# image ref, and resource value is operator-overridable. Defaults match
# the known-working contabo-mkt shape (FerretDB v1.24 against vanilla
# CNPG postgres:16; valkey-primary as the bp-valkey 1.0.0 read/write
# Service name).
smeServices:
  # ─── Event bus (issue #942) ────────────────────────────────────────────
  # Per ADR-0001 the OpenOva architecture uses NATS JetStream as the only
  # local bus on Sovereigns. On Catalyst-Zero (contabo) the legacy SME
  # services still target a Redpanda Service in the talentmesh namespace
  # (migration #68). The configmap.yaml template selects the default at
  # render time based on .Values.global.sovereignFQDN:
  #   - non-empty (Sovereign)  → REDPANDA_BROKERS="" + NATS_URL=
  #       nats://nats-jetstream.nats-system.svc.cluster.local:4222
  #       (services run in NATS-only mode per ADR-0001 §6)
  #   - empty (Catalyst-Zero) → REDPANDA_BROKERS=redpanda.talentmesh.svc:9092
  #       (legacy Kafka transport remains the bus on contabo)
  # `brokers` overrides the default outright — operator MAY wire any
  # NATS-protocol or Kafka-protocol broker without forking the chart.
  # `protocol` is an explicit hint for SME services that want to switch
  # wire format independently (e.g. a Sovereign with a Kafka-compatible
  # broker outside the cluster).
  eventBus:
    brokers: ""
    protocol: ""
    # Canonical NATS JetStream URL per ADR-0001 §6. Empty = use the
    # topology default from configmap.yaml (Sovereign:
    # nats://nats-jetstream.nats-system.svc.cluster.local:4222 ;
    # Catalyst-Zero: empty). Per-Sovereign overlays MAY override to
    # wire a different NATS endpoint (e.g. a leaf-node connection) or
    # set explicitly empty to force NATS-disabled mode.
    natsURL: ""
  ferretdb:
    namespace: org-services          # #3383: was `sme`
    # FerretDB v1.24 — works against vanilla CNPG postgres:16. v2.x
    # requires PostgreSQL with the DocumentDB extension which the
    # sme-pg cluster does not ship; bumping is a separate change that
    # also needs a custom CNPG image. See Chart.yaml 1.4.4 changelog.
    # 1.4.600 — kyverno harbor-proxy-pull (Enforce): raw ghcr.io denied on
    # tonight's umbrella reinstall (hw130 live). Same proxy-ghcr pattern as
    # every other upstream image (#3296/#3297 family).
    image: harbor.openova.io/proxy-ghcr/ferretdb/ferretdb
    tag: "1.24"
    imagePullPolicy: IfNotPresent
    replicas: 1
    # Postgres connection target — sme-pg-rw read/write Service in
    # `sme` ns, sme_documents DB created by sme-pg's
    # postInitApplicationSQL block (see smePostgres.cluster.
    # additionalDatabases above).
    postgresPort: 5432
    postgresDatabase: sme_documents
    sslmode: disable                          # ClusterIP traffic is overlay-encrypted; CNPG default issuer chain not bundled
    # Service FQDN exposed to other SME services via configmap MONGODB_URI.
    # Per-Sovereign overlays MAY swap to an external MongoDB endpoint.
    host: ferretdb.org-services.svc.cluster.local
    port: 27017
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  valkey:
    # bp-valkey (slot 17) renders bitnami valkey 5.5.1 + architecture:
    # replication. In-vCluster Service names (inner `valkey` ns):
    #   - valkey-primary.valkey.svc (read/write)
    #   - valkey-replicas.valkey.svc (read-only)
    #   - valkey-headless.valkey.svc (StatefulSet headless)
    #
    # #3373 Batch A (2026-06-14): bp-valkey moved INSIDE the rtz vCluster
    # (placement.yaml: `bp-valkey → vcluster: rtz, namespace: valkey`).
    # The bp-rtz-vcluster syncer reflects the in-vCluster `valkey-primary`
    # Service to the HOST under the syncer-mangled name
    # `valkey-primary-x-valkey-x-rtz-vcluster.rtz.svc`, so the host
    # `valkey` namespace no longer carries a `valkey-primary` Service. The
    # SME control-plane services (host ns `sme`, still host-placed in
    # Batch A) consume valkey across the vCluster boundary → pin to the
    # synced name. SME services pin to the primary so writes succeed; per-
    # Sovereign overlays MAY split read traffic to -replicas via a second
    # VALKEY_READ_ADDR (separate ticket). Override `host` for a
    # host-placed valkey.
    host: valkey-primary-x-valkey-x-rtz-vcluster.rtz.svc.cluster.local
    port: 6379
    namespace: valkey
    # ─── Cross-ns auth Secret mirror (issue #863) ──────────────────────
    # bp-valkey 1.0.0 ships auth.enabled=true; bitnami auto-generates a
    # random password and exposes it via the `valkey` Secret in the
    # `valkey` namespace. The catalyst chart renders templates/
    # org-services/valkey-cross-ns-secret.yaml which uses Helm `lookup`
    # to read that password and re-emit it as `sme-valkey-auth` in
    # `sme` ns — auth.yaml + gateway.yaml then wire VALKEY_PASSWORD via
    # secretKeyRef. Each knob below is operator-overridable in case a
    # Sovereign uses a forked bp-valkey with a different Secret name
    # or key.
    sourceSecretName: valkey
    sourcePasswordKey: valkey-password
    destNamespace: org-services       # #3383: was `sme`
    destSecretName: sme-valkey-auth
    crossNsPolicy:
      # Render templates/org-services/valkey-cross-ns-policy.yaml — a
      # CiliumNetworkPolicy in the `valkey` namespace allowing ingress
      # from the `sme` namespace on Valkey's port.
      #
      # #3373 Batch A (2026-06-14): DISABLED. bp-valkey moved INSIDE the
      # rtz vCluster, so its pods are syncer-reflected into the HOST `rtz`
      # namespace (the host `valkey` namespace no longer carries the
      # workload). This CNP (endpointSelector in ns `valkey`) would select
      # zero endpoints. The cross-ns wire is now governed by the
      # bp-rtz-vcluster isolation NetworkPolicy, which carves out the `sme`
      # namespace in allowedIngressNamespaces (mirrors the #3423 sme→NATS
      # carve-out). Re-enable + override `namespace` only for a
      # host-placed valkey.
      enabled: false
      sourceNamespace: org-services   # #3383: was `sme`
  # ─── provisioning service GitHub token (issue #866) ──────────────────
  # The SME `provisioning` service Deployment references
  # `secret/provisioning-github-token` with key `GITHUB_TOKEN`. On
  # contabo-mkt this is pre-provisioned via SealedSecret. On a freshly
  # franchised Sovereign, templates/org-services/provisioning-github-
  # token.yaml mirrors the gitea-admin password (already generated by
  # platform/gitea/chart/templates/admin-secret.yaml with the same
  # lookup-persistence pattern) into `sme` ns under the canonical
  # GITHUB_TOKEN key the provisioning service reads. This unblocks the
  # provisioning Pod reaching Running 1/1 on a fresh Sovereign — the
  # last 1/13 SME pod that #859 + #861 + #863 didn't already cover.
  #
  # Per Inviolable Principle #4 (never hardcode), every source/dest
  # name + key is operator-overridable so a Sovereign that points
  # provisioning at a non-Gitea Git host (e.g. a per-Sovereign
  # GitHub PAT delivered via OpenBao + ExternalSecret) can wire the
  # source-side ref without forking the chart.
  provisioning:
    gitToken:
      # Source (issue #3122): the REAL Gitea PAT minted by THIS chart's
      # own templates/catalyst-gitea-token-secret.yaml pre-install hook
      # (Secret `catalyst-gitea-token`, key `token`, in the release
      # namespace). That hook runs at helm.sh/hook-weight 5/10 — i.e.
      # BEFORE this regular (non-hook) resource is applied — so the PAT
      # is already populated by the time this template's lookup runs.
      #
      # Why NOT gitea-admin-secret.password (the pre-#3122 source): a
      # Gitea ADMIN PASSWORD is not a Gitea API token. Gitea rejects
      # password-auth for git operations ("Password authentication is
      # not supported for Git operations"), so the prior mirror produced
      # a GITHUB_TOKEN that 401'd on the very first tenant gitops push.
      # Proven live on hw101 (operator POST /sme/tenants, deployment
      # e19b083c): 32-char password -> 401 vs Gitea; the 40-char
      # catalyst-gitea-token PAT -> 200 as gitea_admin.
      #
      # patSourceNamespace empty => resolves to the release namespace
      # (.Release.Namespace, i.e. catalyst-system) where the minter
      # writes catalyst-gitea-token. Operators pointing provisioning at
      # a non-Gitea Git host (e.g. a per-Sovereign GitHub PAT delivered
      # via OpenBao + ExternalSecret) override these three keys without
      # forking the chart (Inviolable Principle #4).
      patSourceNamespace: ""
      patSourceSecretName: catalyst-gitea-token
      patSourceKey: token
      # Destination: the Secret + key shape that the provisioning
      # Deployment's secretKeyRef in
      # templates/org-services/provisioning.yaml reads.
      destNamespace: org-services     # #3383: was `sme`
      destSecretName: provisioning-github-token
      destKey: GITHUB_TOKEN
    # ─── Provisioning service GitOps env (issues #940 + #944) ──────────
    # The SME provisioning service Deployment env block is rendered from
    # these keys. Every value is operator-overridable per Inviolable
    # Principle #4. Defaults are topology-aware:
    #   - Sovereign install (global.sovereignFQDN non-empty) defaults
    #     gitBasePath to clusters/<sovereignFQDN>/sme-tenants and points
    #     git.{apiURL,owner} at the local Gitea bp-gitea installs.
    #   - Catalyst-Zero install (global.sovereignFQDN empty) keeps the
    #     legacy contabo-mkt write target.
    #
    # gitBasePath: filesystem prefix under the cloned repo root. When
    # non-empty, takes precedence over the topology default. The
    # provisioning binary's startup guard (validateGitBasePath in
    # core/services/provisioning/main.go) rejects values that don't
    # start with `clusters/<SOVEREIGN_FQDN>/` on Sovereigns — the
    # cross-cluster pollution defence (#944 critical).
    gitBasePath: ""
    # tenantParentDomain (#3859, Refs #3376): the Sovereign's tenant-pool
    # parent domain that seeds spec.tenantPublic.{parentDomain,subdomain} on
    # every per-Org Organization CR → the per-Org console + app HTTPRoutes
    # (`console.<slug>.<parentDomain>`, `<app>.<slug>.<parentDomain>`). WITHOUT
    # it the provisioning consumer mints the Org with NO TenantPublic route and
    # the customer's own console + purchased app return ERR_CONNECTION_REFUSED
    # (the funnel-terminal failure on every prior env; first root-caused on
    # walkorg/hw167). Domains-canon default is `omani.homes`; set per-Sovereign
    # via the bootstrap-kit postBuild substitute (the same pool TLD the
    # marketplace wizard offers). Empty preserves Catalyst-Zero/contabo (no
    # per-Org public route).
    tenantParentDomain: ""
    # vclusterImageRegistry (#3760, Refs #3376 #3754): the Sovereign-local
    # Harbor host the per-tenant vCluster images pull through (proxy-cache).
    # vcluster 0.33.x renders TWO ghcr.io images in the StatefulSet
    # initContainers — the loft-sh/kubernetes k8s distro AND the
    # loft-sh/vcluster-oss syncer — both DENIED by the harbor-proxy-pull
    # Kyverno ClusterPolicy (Enforce, */proxy-*/* glob). The provisioning
    # generator re-tags both to `<registry>/proxy-ghcr/loft-sh/...`, lockstep
    # with bp-dmz/mgmt/rtz-vcluster (without it the tenant vCluster
    # StatefulSet is blocked and the tenant's app never runs). Default
    # harbor.openova.io for bootstrap; cutover Step-04 (ADR-0002) flips it to
    # harbor.<sovereign-fqdn> post-handover. Operator-overridable (Principle #4).
    vclusterImageRegistry: "harbor.openova.io"
    # githubToken: Secret name + key the Deployment reads GITHUB_TOKEN
    # from. Defaults match the chart-emitted
    # templates/org-services/provisioning-github-token.yaml output
    # (issue #866). Operator may swap to a per-Sovereign ExternalSecret
    # by setting both fields here.
    githubToken:
      secretName: provisioning-github-token
      secretKey: GITHUB_TOKEN
    # waitForCutoverToken: gate the provisioning Pod on the GITHUB_TOKEN in
    # provisioning-github-token being a Gitea token Gitea ACCEPTS — a DATA
    # probe (#3376, Refs #3689), NOT the old annotation probe (#2002/TBD-V11).
    # Without this gate, the Pod could start with a token Gitea rejects →
    # 401 on the FIRST tenant Org CR creation. The init container GETs
    # ${giteaInternalURL}/api/v1/user with the token and proceeds only on
    # HTTP 200.
    #
    # WHY a DATA probe and not the annotation: the previous gate polled for
    # `catalyst.openova.io/token-source: self-sovereign-cutover-step-09`,
    # but that contract was SPLIT (the cutover Step-09 mint Job's re-run
    # no-op path exits BEFORE stamping the annotation since #3122 made the
    # bootstrap token a valid PAT, and the chart's bootstrap branch strips
    # it) → the Pod stuck Init:0/1 forever on a fully cut-over Sovereign
    # (hw150). Validating the token directly is immune to both: the
    # bootstrap catalyst-gitea-token PAT and the cutover-minted token are
    # BOTH real 200-valid Gitea tokens, so the Pod boots zero-touch on a
    # fresh prov AND a cut-over Sovereign.
    #
    # On Sovereigns: leave enabled. On Catalyst-Zero (contabo): set
    # enabled=false in clusters/contabo-mkt/ overlay — there the
    # SealedSecret-provisioned token is already valid, so the gate is a
    # harmless one-shot 200 either way, but disabling skips the init.
    waitForCutoverToken:
      enabled: true
      # image: kubectl/curl client used by the init container. Default tracks
      # platform/self-sovereign-cutover/chart/values.yaml's kubectl image
      # so a platform-wide bump only needs to land in one place at a time.
      image: harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4
      # giteaInternalURL: the in-cluster Gitea REST base the probe hits.
      # Same default as the rest of the SME bundle's Gitea coordinates.
      giteaInternalURL: "http://gitea-http.gitea.svc.cluster.local:3000"
      # intervalSeconds + timeoutSeconds: poll cadence + wall-clock cap.
      # Default 10s × 180 iters = 1800s (30m) — covers the slowest cutover
      # observed on Hetzner cold-start (~18 min) with 12 min safety margin.
      # The Pod stays in Init: until a valid token lands; failing closed is
      # the correct behaviour because serving 401s blocks every tenant journey.
      intervalSeconds: 10
      timeoutSeconds: 1800
    # git.{apiURL,owner,repo,branch}: Git host coordinates. The
    # provisioning binary uses GITHUB_API_URL when non-empty (Sovereign
    # path → in-cluster Gitea REST API) and otherwise falls back to the
    # canonical https://api.github.com (contabo path). All four values
    # are operator-overridable.
    git:
      apiURL: ""
      owner: ""
      repo: openova
      # branch: leave empty to inherit topology-aware default from the
      # provisioning Deployment template (TBD-C18e, 2026-05-18):
      #   - Sovereign install (global.sovereignFQDN non-empty) → "sme-tenants"
      #   - Catalyst-Zero install (global.sovereignFQDN empty)  → "main"
      # The dedicated `sme-tenants` branch on Sovereigns prevents the
      # cutover-gitea-mirror Job's force-push of main from clobbering
      # per-tenant overlays committed by this service. The paired
      # Flux GitRepository (openova-sme-tenants) + Kustomization read
      # the same branch.
      branch: ""

# ─── Catalog (qa-loop iter-16 Fix #65) ─────────────────────────────────
# `openova-catalog` Flux HelmRepository — the named source ref every
# Application's rendered HelmRelease points at by default.
#
# The application-controller (core/controllers/application/) renders
# per-region HelmReleases with `sourceRef.name` = `controllers.application.
# catalogSourceRef` (env: CATALOG_SOURCE_REF, default `openova-catalog`)
# in `controllers.application.sourceNamespace` (env: SOURCE_NAMESPACE,
# default `flux-system`). Without a HelmRepository CR at that
# namespace/name pair, Flux's helm-controller cannot resolve the chart
# bytes and the workload Pod is never scheduled — the qa-wp Application
# CR sits at status.phase=Pending forever, blocking ~30 qa-loop TCs.
#
# This block ships the missing CR. Per Inviolable Principle #4 every
# field is operator-overridable via per-Sovereign overlays (e.g. a
# Sovereign with a local Harbor proxy_cache flips `url:` to its own
# `oci://harbor.<sovereign-fqdn>` mirror without forking the chart).
catalog:
  helmRepository:
    enabled: true
    # MUST equal controllers.application.catalogSourceRef (default
    # "openova-catalog"). Operators that re-target the controller's
    # source ref (e.g. "openova-catalog-mirror") must also bump this so
    # the HelmRepository name and the controller's render output stay
    # in lockstep.
    name: openova-catalog
    # MUST equal controllers.application.sourceNamespace (default
    # "flux-system"). Same lockstep rule as `name`.
    namespace: flux-system
    # `oci` — matches blueprint-release.yaml publish path (`helm push
    # <chart>.tgz oci://ghcr.io/openova-io`). Default `http` would 404
    # on a chart pull.
    type: oci
    # Canonical OpenOva blueprint registry. Per-Sovereign overlays may
    # override to a local Harbor mirror (cutover.go re-targets every
    # bp-* HelmRepository to `oci://harbor.<sovereign-fqdn>`; this CR
    # follows the same convention).
    url: oci://ghcr.io/openova-io
    # `ghcr-pull` Secret is bootstrapped in flux-system by every
    # Sovereign's bootstrap-kit (clusters/_template/bootstrap-kit/
    # 03-flux.yaml et al). Empty disables auth (public packages only).
    secretRef: ghcr-pull
    # 15m matches sibling bootstrap-kit HelmRepositories
    # (kyverno/grafana/trivy/cert-manager-powerdns-webhook). Tighter
    # wastes GHCR API quota; looser delays new chart-version
    # propagation post blueprint-release.yaml.
    interval: 15m

# catalogSeed — baseline Blueprint CRs rendered at chart install/upgrade
# so /api/v1/catalog returns a non-empty items[] from the moment
# catalyst-api comes up at handover-time. (WBS row TBD-E8, C4-015,
# fix(catalog): seed published Blueprints on Sovereign handover.)
#
# Pre-fix: a freshly-handed-over Sovereign has NO Blueprints anywhere —
# Gitea has neither `catalog` nor `catalog-sovereign` Org (self-sovereign-
# cutover step-01 only mirrors `openova-io/openova` → `openova/openova`),
# AND qa-fixtures' Blueprint CRs are gated on qaFixtures.enabled which
# defaults false on production. Result: the Apps grid in Sovereign
# Console is empty until the operator manually publishes via
# `POST /blueprints/publish`. Test C4-015 FAILed on t22 for this reason.
#
# Post-fix: 13 baseline Blueprint CRs render unconditionally so the
# chained catalog client (catalog_client_cluster_fallback.go) surfaces
# them via in-cluster LIST. Each CR references a REAL OCI chart
# published by .github/workflows/blueprint-release.yaml. Operator can
# override entries by pushing curated Blueprints to the
# `catalog-sovereign` Gitea Org — source priority is PRIVATE > SOVEREIGN
# > PUBLIC, so a curated entry wins on collision and the seeded CR is
# shadowed (but kept in place as a fallback if the operator later
# removes the curated entry).
#
# Per docs/INVIOLABLE-PRINCIPLES.md #1 (target-state) every Blueprint
# carries a REAL chart reference + REAL configSchema mirroring the
# upstream blueprint.yaml of each platform/<name>/chart. Per #4 the
# whole seed set can be disabled by setting `enabled: false` in a
# per-Sovereign overlay if the operator curates day-zero. Per #5 every
# CR is labeled `catalyst.openova.io/managed-by: catalog-seed` so the
# operator can distinguish chart-seeded entries from curated entries
# in `kubectl get blueprints` output.
catalogSeed:
  enabled: true

# qaFixtures — qa-loop iter-6 Cluster-F seeder for the test-matrix
# fixtures (qa-omantel namespace, disposable-cm, qa-wp-creds, qa-user1
# UserAccess + RoleBinding, bp-qa-custom Blueprint). DEFAULT-OFF;
# enable only on test Sovereigns. Production Sovereigns must keep
# `enabled: false` so test resources never leak into customer clusters.
# See templates/qa-fixtures/_README.txt for the full rationale.
qaFixtures:
  enabled: false
  # ── Tier-scoped test-session minting (qa-loop iter-11 Cluster-A) ─
  # `testSessionEnabled` switches on POST /api/v1/auth/test-session
  # in catalyst-api. This endpoint mints a session JWT for a synthetic
  # `qa-test-{tier}@openova.io` user with the requested tier so the
  # 5-agent QA executor can assert tier-boundary 403/200 contracts on
  # privileged endpoints without going through PIN-via-IMAP (which
  # always lands tier=owner). Default is `false` (production-safe);
  # enabled on QA/chroot Sovereigns only. The endpoint returns 404 to
  # the public when this is false — wire-indistinguishable from a
  # missing route, so customer Sovereigns expose nothing about the
  # existence of QA hooks in the catalyst-api binary.
  # See products/catalyst/bootstrap/api/internal/handler/auth_test_session.go
  # and templates/qa-fixtures/useraccess-qa-test-{tier}.yaml.
  testSessionEnabled: false
  namespace: qa-omantel
  appName: qa-wp
  # `sovereignRef` MUST be a FQDN per Organization CRD validation
  # (pattern '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]...)+$').
  # The UserAccess CRD's stricter single-segment pattern is satisfied by
  # `regexReplaceAll "\..*$" ""` in templates/qa-fixtures/useraccess-qa-user1.yaml
  # (PR #1246) which strips the TLD/SLD and renders "omantel" for the
  # UserAccess CR. Default chosen to match the qa-omantel test Sovereign's
  # actual hostname (PR #1245 — legacy short-form "omantel" rejected by
  # the Organization CRD at admission and blocked the qa-wp roll).
  sovereignRef: omantel.biz
  # `sovereignFQDN` — explicit FQDN override consumed by the qa-fixtures
  # Organization template's resolution chain (qaFixtures.sovereignFQDN
  # → global.sovereignFQDN → qaFixtures.sovereignRef-if-FQDN →
  # "omantel.biz"). Empty default lets the chain fall through to
  # global.sovereignFQDN (set on every Sovereign install via the
  # bootstrap-kit envsubst SOVEREIGN_FQDN). Per-Sovereign overlay may
  # override via QA_FIXTURES_SOVEREIGN_FQDN on the bootstrap-kit
  # Kustomization.
  sovereignFQDN: ""
  organization: omantel-platform
  # Environment region — split into the 3 CRD-required subfields.
  # The Environment CRD validates `regions[].region` against
  # `^[a-z]{3}[a-z0-9]?$` (3-4 char region code) and refuses the
  # full 4-segment `hz-fsn-rtz-prod` label as a single string.
  # Defaults below reflect the canonical hz-fsn-rtz-prod target so
  # an Environment renders without per-Sovereign overrides.
  envRegionProvider: hetzner
  envRegionCode: fsn
  envRegionBuildingBlock: rtz
  qaUser:
    email: qa-user1@openova.io
    name: qa-user1
    keycloakSubject: qa-user1
  # qaWpPassword: optional explicit value for qa-wp-creds Secret.
  # When empty the template derives a deterministic placeholder from
  # the release name + namespace so the chart never bakes a hard-coded
  # credential into the manifest stream. The matrix only checks for
  # the Secret's existence, not the password value.
  qaWpPassword: ""
  # ── Continuum DR fixture knobs (Fix #32, Fix #37) ────────────────
  # CNPGPair name + region pair the matrix asserts on. The default pair
  # (hz-fsn-rtz-prod ↔ hz-hel-rtz-prod) reflects the omantel test
  # Sovereign's ClusterMesh peering. Override on a per-Sovereign basis.
  #
  # Region values MUST match the canonical 4-segment region label
  # `^[a-z]+-[a-z]+-[a-z]+-[a-z]+$` enforced by Application + Continuum
  # CRD validation (Fix #38 follow-up — Fix #36's qa-wp Application
  # rejected at admission with `spec.regions[0]: Invalid value: "fsn1"`
  # which blocked the chart upgrade and pinned omantel on the prior
  # image SHA, preventing TC-141/TC-090/TC-383 from rolling).
  continuumName: cont-omantel
  # Default name embeds the literal "cnpgpair" substring so the matrix's
  # `kubectl get cnpgpair -n qa-omantel` stdout (TC-306 must_contain
  # ["cnpgpair", "fsn1", "hz-hel-rtz-prod"]) round-trips against the
  # rendered NAME column. Pre-Fix #40 the default `qa-cnpg` produced a
  # NAME column missing the "pair" substring, making TC-306 unsatisfiable
  # on the executor's stdout-token assertion.
  cnpgPairName: qa-cnpgpair
  # qa-loop iter-1 prefetch Fix #102 (Continuum DR controllers): alias
  # CR `qa-cnpg` ships alongside the canonical `qa-cnpgpair` so
  # TC-310/311/314's hardcoded
  # `kubectl get cnpgpair qa-cnpg -n qa-omantel -o jsonpath='...'`
  # resolves. Both names refer to the same logical pair (same
  # primaryCluster / replicaCluster / regions). Set to "" to suppress
  # the alias on Sovereigns that need only one of the two names.
  cnpgPairAliasName: qa-cnpg
  # qa-loop iter-1 prefetch Fix #102: post-switchover primary region
  # used as the seeded `status.currentPrimary` value on the cnpgpair
  # CR. Defaults to the replica region (the post-switchover state) so
  # TC-314's `must_contain ['hz-hel-rtz-prod']` resolves on a fresh
  # Sovereign that has executed the qa-loop matrix's switchover step.
  # Override to `cnpgPairPrimaryRegion` for a pre-switchover baseline.
  cnpgPairPostSwitchoverPrimary: hz-hel-rtz-prod
  # qa-loop iter-1 prefetch Fix #102: platform-level Continuum CR
  # mirror namespace. The per-Application Continuum lives in
  # qaFixtures.namespace; the platform-aggregate CR is mirrored here
  # so TC-305's `kubectl get continuum cont-omantel -n catalyst-system`
  # resolves. Set to "" to suppress the mirror.
  continuumPlatformNamespace: catalyst-system
  # Short-form Hetzner region labels for the CNPGPair CR — distinct from
  # the canonical 4-segment qaFixtures.primaryRegion / standbyRegion so
  # the cnpgpair CR matches the cnpg-pair-controller's CCM zone-affinity
  # convention (`fsn1` / `hel1`) while the Application + Environment +
  # Continuum CRs continue to use the canonical 4-segment label
  # `hz-fsn-rtz-prod` / `hz-hel-rtz-prod` per their CRD validation
  # patterns. The two seams stay in lockstep via the node-labels-seeder
  # Job that patches every node with topology.kubernetes.io/region=<short>
  # derived from openova.io/region=<canonical> (Fix #40 Cluster-B).
  cnpgPairPrimaryRegion: fsn1
  cnpgPairReplicaRegion: hz-hel-rtz-prod
  primaryRegion: hz-fsn-rtz-prod
  standbyRegion: hz-hel-rtz-prod
  # ── Configured-but-not-active regions for the QA Sovereign UI ───
  # qa-loop iter-16 Fix #88 (Path B). When qaFixtures is enabled the
  # sovereign-fqdn ConfigMap's configuredRegions key falls back to
  # this list (sovereign.configuredRegions takes precedence when
  # explicitly set). The default mirrors the cnpgPair regions so the
  # dashboard SovereignCard renders fsn1 + hz-hel-rtz-prod chips and
  # the matrix's TC-296/TC-297/TC-300/TC-301 multi-region tokens
  # resolve on a single-region QA cluster without provisioning a real
  # second cluster (multi-cluster ClusterMesh = Path A follow-up).
  configuredRegions:
    - fsn1
    - hz-hel-rtz-prod
  # ── Configured-but-not-policy-reported applications for QA Sovereign ─
  # qa-loop iter-16 Fix #167. When qaFixtures is enabled the
  # sovereign-fqdn ConfigMap's qaApplications key falls back to this
  # list (sovereign.qaApplications takes precedence when explicitly
  # set). Wired into catalyst-api as `CATALYST_QA_APPLICATIONS` so the
  # /compliance/scorecard `appRefs[]` envelope carries the matrix
  # tokens (TC-029: `qa-wordpress`) on every call even before the
  # compliance aggregator has ingested a PolicyReport for the
  # workload. Mirrors configuredRegions' fallback pattern.
  applications:
    - qa-wordpress
    - qa-wp
  pdmZone: openova.io
  publicHost: openova.io
  # ── CNPG Cluster CR fixture knobs (Fix #37) ──────────────────────
  # `cluster-primary` + `cluster-replica` postgresql.cnpg.io Cluster
  # CRs the cnpgpair `qa-cnpg` references. Single-region scheduling by
  # default — the cross-region drill is owned by the cnpg-pair-
  # controller (Phase-2) and Continuum DR endpoints. Override the
  # region knobs on a multi-region Sovereign once kube-proxy
  # replacement + Hetzner cross-region NodePort filtering are resolved.
  cnpgPrimaryClusterName: cluster-primary
  cnpgReplicaClusterName: cluster-replica
  cnpgPrimaryRegion: hz-fsn-rtz-prod
  cnpgReplicaRegion: hz-fsn-rtz-prod
  cnpgInstances: 1
  cnpgImage: ghcr.io/cloudnative-pg/postgresql:16.4-1
  cnpgStorageSize: 1Gi
  cnpgStorageClass: local-path
  cnpgDatabase: app
  # qa-loop iter-1 prefetch Fix #110: terminal phase string seeded onto
  # cluster-primary + cluster-replica `status.phase`. The CNPG operator
  # writes this exact literal once Pods land Running and replication is
  # streaming; seeding it removes matrix flake on bandwidth-constrained
  # Sovereigns where image pulls dominate the wallclock. Closes TC-307
  # + TC-348 (kubectl get cluster.postgresql.cnpg.io ... must contain
  # 'Cluster in healthy state'). Override on Sovereigns running a forked
  # CNPG operator that uses a different terminal phase string.
  cnpgTargetPhase: "Cluster in healthy state"
  # ── CNPG backup config (Fix #41, qa-loop iter-8 Cluster-A) ───────
  # cluster-primary writes WAL + base backups to in-cluster SeaweedFS
  # via the S3-compatible endpoint. The cnpg-backup-s3-seeder Job in
  # cnpg-clusters-qa.yaml copies the seaweedfs admin keys into the
  # qa-omantel namespace so cluster-primary's spec.backup resolves.
  # Override these for off-cluster S3 (R2 / B2 / native AWS).
  cnpgBackupBucket: qa-fixtures
  # #3373 Batch A (2026-06-14): bp-seaweedfs moved INSIDE the rtz vCluster →
  # the host-synced S3 Service carries the syncer-mangled name below (qa-fixtures
  # only; override for off-cluster S3).
  cnpgBackupEndpointURL: http://seaweedfs-s3-x-seaweedfs-x-rtz-vcluster.rtz.svc.cluster.local:8333
  cnpgBackupS3SecretName: qa-cnpg-backup-s3
  cnpgBackupSourceSecretNamespace: seaweedfs
  cnpgBackupSourceSecretName: seaweedfs-s3-secret
  # qa-loop iter-1 Fix #138 (chart 1.4.138): qa-cnpg-backup-s3-seed Job
  # is no longer a post-install hook (was wedging bp-catalyst-platform
  # install at 15m on fresh Sovereign — circular dep, see Chart.yaml
  # changelog top entry). Job runs concurrently with bp-seaweedfs install
  # in bootstrap-kit slot 18 and waits up to 30 min (900×2s) for the
  # source seaweedfs-s3-secret to materialise. Override on bandwidth-
  # constrained Sovereigns where bp-seaweedfs install takes longer.
  s3SeedWaitIterations: 900
  # ── Kyverno baseline policies (Fix #37) ──────────────────────────
  # disallow-privileged-containers ships in Enforce mode by default
  # (target-state hard block); other 18 baseline policies ship in
  # Audit mode so the matrix sees ClusterPolicyReports without
  # blocking platform pods. Override to "Audit" to soft-launch the
  # Enforce policy on a fresh Sovereign while migrating workloads.
  kyvernoEnforceMode: Enforce

  # ── Cilium NetworkPolicy baseline (qa-loop iter-11 Fix #48) ──────
  # Default-deny CCNP + 11 per-namespace allow templates ship as part
  # of the qa-fixtures bundle. Per `feedback_no_mvp_no_workarounds.md`
  # rule #1 (target-state) the matrix asserts on
  #   - TC-278 default-deny CCNP exists with Ingress + Egress denied
  #   - TC-279 per-namespace CiliumNetworkPolicy templates rendered
  #   - TC-294 ≥10 CNPs total across all namespaces
  # Disable on a per-Sovereign basis if the operator wants to author
  # their own policy bundle.
  networkPolicies:
    enabled: true

# ─── Security — baseline CNP bundle (issue #1746, WBS row C12-009) ────────
# Two-CNP baseline shipped on EVERY Sovereign install, independent of
# qaFixtures. Both CNPs are NAMESPACED (no CiliumClusterwideNetworkPolicy)
# per the architecture ruling on issue #1746 — Sovereign uses namespaced
# CNP only.
#
#   - templates/network-policies/baseline-catalyst-system.yaml renders a
#     CiliumNetworkPolicy in catalyst-system with default-deny + explicit
#     allow for cilium-gateway ingress + control-plane egress.
#   - templates/network-policies/baseline-cilium-gateway.yaml renders a
#     CiliumNetworkPolicy in kube-system scoped to the cilium-gateway
#     reserved:ingress endpoint allowing world ingress + envoy egress.
#
# Operators may disable the bundle by flipping `enabled: false`, or tune
# the platform-namespace allow list on the catalyst-system CNP via
# `allowedPlatformNamespaces`.
security:
  baselineCnp:
    enabled: true
    # Platform namespaces catalyst-system Pods are allowed to egress to.
    # Override to add tenant-specific or per-Sovereign namespaces.
    #
    # `sme` — the bp-sme-platform chart deploys the SME control-plane
    # (auth, billing, catalog, console, domain, gateway, marketplace,
    # notification, provisioning, tenant) into namespace `sme`. Console
    # in catalyst-system reaches `gateway.org-services.svc.cluster.local:8080`
    # for every voucher list/issue/redeem call (and admin reaches the
    # same gateway for tenant onboarding). Without this allow, console
    # requests time out at 5s and return 503 `context deadline exceeded`
    # — surfaced on t32 (2026-05-19) as the masquerading root cause of
    # issues #1748 (voucher list) and #1749 (voucher issue). See
    # TBD-A38 / #1917 for the full reproduction.
    allowedPlatformNamespaces:
      - keycloak
      - gitea
      - powerdns
      - cnpg-system
      - openbao
      - harbor
      - nats-system
      # #2745 (2026-06-12): loki/mimir/tempo run INSIDE the mgmt
      # vCluster; their host-side synced Service endpoints
      # (<svc>-x-<ns>-x-mgmt-vcluster) are Pods in host ns `mgmt` —
      # the `mgmt` entry below carries that traffic (e.g. the
      # CATALYST_MIMIR_URL query-frontend). The plain loki/mimir/tempo
      # entries stay for Sovereigns that keep host-side placement via
      # per-Sovereign overlay.
      - loki
      - mimir
      - tempo
      - mgmt
      - alloy
      - opentelemetry
      - external-secrets-system
      - cert-manager
      # TBD-A38 (issue #1917, PR #1919): catalyst-system → org-services
      # east-west for voucher list / issue / redeem + Organization
      # onboarding. The Organization mesh lives in `org-services` (#3383:
      # was `sme`); Console hits `gateway.org-services.svc:8080`. Without
      # the entry the CNP dropped the traffic and the Console 503'd with
      # `context deadline exceeded`.
      - org-services
      # TBD-A43 (issue #1920): catalyst-system → newapi east-west for
      # the customer-journey D29 NewAPI v2 calls (`newapi-*.newapi.svc`).
      # Companion fix to #1919 — PR #1912 was titled "fix catalyst-system
      # → sme/newapi egress" but only touched the world-egress TCP/6443
      # block; this PR closes the `newapi` half of that theater.
      - newapi
    # Adjacent namespaces whose Pods are allowed to INGRESS into
    # catalyst-system. Defaults cover:
    #   - catalyst — bp-self-sovereign-cutover Jobs (incl. the
    #     10-auto-trigger Pod that fires /api/v1/internal/cutover/
    #     trigger; without this allow handover NEVER FIRES on a
    #     fresh prov — regression caught by t24 zero-touch).
    #   - flux-system — Helm/Kustomize/Source controllers probing
    #     Service readiness for HelmRelease health rollups.
    #   - kube-system — Cilium operator + hcloud-ccm + CoreDNS that
    #     do cluster introspection calls into catalyst-system. The
    #     reserved.ingress gateway endpoint also in kube-system is
    #     matched by a separate rule via reserved.ingress: "" label.
    #   - oidc-gate — the bp-oidc-gate auth-proxy host namespace
    #     (placement.yaml slot 13c, #3374). The per-app oauth2-proxy
    #     reverse-proxies authenticated traffic to its upstream Service
    #     in catalyst-system (openova-flow's gate dials
    #     `openova-flow-server.catalyst-system.svc:80`). Without this
    #     allow the baseline-default-deny ingress hook drops the
    #     proxied request — oidc-gate authenticates the User but the
    #     app 502s on upstream timeout (hw133 #813, fresh prov
    #     2026-06-14; same isolation class as the sme→NATS #3423 block).
    #   - mgmt (#3934 / Refs #3642) — the #3642 host-bridge promotes
    #     guacamole INTO the mgmt vCluster: its webapp Pod runs in host ns
    #     `mgmt` (synced `guacamole-server-x-catalyst-system-x-mgmt-vcluster`)
    #     while its CNPG DB `guacamole-pg` stays host-rendered in
    #     catalyst-system. Without `mgmt` here the baseline default-deny
    #     dropped webapp→guacamole-pg:5432 → the postgresql auth provider
    #     halted → /guacamole/api/session 403, blank page (caught live hw171
    #     2026-06-19). The other re-homed apps' DBs (gitea-pg, harbor-pg)
    #     live in their own host namespaces, not catalyst-system, so this
    #     single ingress entry is the complete fix for the catalyst-system DB.
    allowedIngressNamespaces:
      - catalyst
      - flux-system
      - kube-system
      - oidc-gate
      - mgmt

# ── Migrations (post-install / post-upgrade Helm-hook Jobs) ──────────────
# Per PR #2795 (G117.2 multi-instance Application CRD): backfill spec.instanceId
# on legacy Application CRs that pre-date the immutable-id field.
#
# Defaults align with the chart-side Job emitter at
# templates/migrate-applications-instanceId-job.yaml. Operators can disable
# specific migrations via per-Sovereign valuesFrom overlay if they want to
# defer the backfill to a separate ops window.
# NOTE: this block appears twice in this file because PR #2795 + PR #2823
# both added it; Helm keeps the last definition, so both must stay aligned.
# Default is `enabled: false` because the image
# `ghcr.io/openova-io/catalyst-migrator:0.1.0` is NOT (yet) published to GHCR
# (#2830). Operators that have built+published the migrator image can flip
# this to true via per-Sovereign valuesFrom overlay. Once #2830 closes
# (image published + imagePullSecrets wired into the Pod template), flip
# this default back to true.
migrations:
  applicationsInstanceId:
    enabled: false
    dryRun: false
    serviceAccountName: catalyst-application-migrator
    image: ghcr.io/openova-io/catalyst-migrator:0.1.0

# ── Migrations (post-install / post-upgrade Helm-hook Jobs) ──────────────
# Per PR #2795 (G117.2 multi-instance Application CRD): backfill spec.instanceId
# on legacy Application CRs that pre-date the immutable-id field.
#
# Duplicate of the block above — Helm keeps the LAST `migrations:` map seen
# (per YAML merge semantics) so this is the effective default. Flipped to
# `enabled: false` per #2830 — see comment above the previous block.
migrations:
  applicationsInstanceId:
    enabled: false
    dryRun: false
    serviceAccountName: catalyst-application-migrator
    image: ghcr.io/openova-io/catalyst-migrator:0.1.0
