{{- /*
Dedicated ServiceAccount with ZERO RBAC — deliberately.

The openova-mcp server is a THIN HTTP facade over the live catalyst-api
(#3988 §3): it forwards the CALLER's bearer to the same REST endpoints the
console UI uses and reads NOTHING from the Kubernetes API (no client-go,
no kubeconfig — see products/openova-mcp/internal/*). Granting it any
Role/ClusterRole would hand the facade a privileged path the design
forbids ("the MCP holds NO god-token and cannot exceed the endpoint").
automountServiceAccountToken false here AND on the pod spec (belt and
suspenders) so no API credential ever reaches the container.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openova-mcp.serviceAccountName" . }}
  labels:
    {{- include "openova-mcp.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
