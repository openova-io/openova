apiVersion: v2
name: bp-openova-mcp
# 0.1.3 / appVersion 0.2.3 (#5167, north-star unblock): verify=rs256 now WORKS
# on a fresh Sovereign. Root cause of the every-fresh-prov DEGRADED mode was a
# two-fold mismatch, silent behind optional:true — (a) values referenced the
# never-created PEM Secret `catalyst-handover-jwt` / `handover-jwt-public.pem`
# while a Sovereign only seeds the JWK mirror `catalyst-handover-jwt-public` /
# `public.jwk`; (b) the binary rejected JWKs outright. The 0.2.3 binary parses
# RSA JWKs natively (PEM still supported) and the values default now targets
# the seeded mirror. tools/call RBAC-gating (Agenity→MCP create_application)
# activates out-of-the-box; the #5114 degrade-never-crash posture is unchanged.
# Lockstep: blueprint.yaml + slot 13d → 0.1.3 (not in catalog-seed).
description: |
  OpenOva MCP server — the RBAC-scoped-per-user thin facade that exposes
  the OpenOva product surface (Applications, Environments, Organizations)
  as MCP tools whose surface is IDENTICAL to what the same user can do in
  the Catalyst console UI (#3988). Same binary in every context; the
  chart's `mode` value selects the trusted realm + pinned scope + tool
  subset per the #3988 §4.3 topology table: mode=sovereign (the
  bootstrap-kit slot 13d instance, full Sovereign surface) or
  mode=organization (a per-Org instance, Org-pinned subset). It is a THIN
  facade: every data tool forwards the caller's bearer to the live
  catalyst-api, whose own authz is the final word — the server holds NO
  privileged token and reads NOTHING from the Kubernetes API.
type: application
# 0.1.2 (#5114 hw258 live-proven, CHAIN-BLOCKER): the openova-mcp binary
# no longer CrashLoops when verify=rs256 but the OPTIONAL pubkey Secret is
# ABSENT. The chart already wires OPENOVA_MCP_RS256_PUBKEY_PEM from
# `catalyst-handover-jwt`/`handover-jwt-public.pem` (optional:true) — but
# that PEM Secret is NOT created on a Sovereign (only the JWK mirror
# `catalyst-handover-jwt-public` exists in catalyst-system, #4228), so the
# optional ref resolves to unset and the 0.2.1 binary FATALed
# (`verify=rs256 requires OPENOVA_MCP_RS256_PUBKEY_PEM`). The 0/1 Deployment
# tripped the harbor-prewarm cutover settle-gate (#4982) and FATALed the
# sovereignty cutover at step-3. appVersion 0.2.2 degrades instead: the pod
# reaches Ready, serves /healthz + /readyz + the empty unauthenticated
# tools/list, and rejects tools/call 401 until the verify key is wired — a
# missing OPTIONAL verify key must NEVER CrashLoop the pod.
# 0.1.1 (#5114 hw256 live-proven fixes): pod securityContext gains NUMERIC
# runAsUser/runAsGroup 65532 beside runAsNonRoot — image 0.2.0 declared
# the STRING `USER nonroot`, which the kubelet cannot prove non-root, so
# the hw256 pod died at `CreateContainerConfigError: container has
# runAsNonRoot and image has non-numeric user (nonroot)`. appVersion
# 0.2.1: the Containerfile states the same identity numerically
# (USER 65532:65532 — belt and braces). Companion (same train, not a chart
# change): bootstrap-kit slot 13d goes primary-only via
# SECONDARY_HR_SUSPEND so secondaries stop fanning out a permanently-False
# HR behind the suspended bp-catalyst-platform dependency.
# 0.1.0 (#5114, Refs #3988): first release — the Pillar-4 install path.
# Deployment (streamable-HTTP transport, OPENOVA_MCP_LISTEN) + ClusterIP
# Service + Gateway-API HTTPRoute (mcp.<sovereign-fqdn>; never a Traefik
# Ingress, never a NodePort — §854) + ServiceAccount (automount OFF — the
# server needs zero k8s API access, so it carries zero RBAC) + Cilium
# ingress/egress CNPs (gateway-entity admit + default-deny-safe egress with
# load-bearing DNS carve-out) + an optional values-gated chepherd-attach
# ConfigMap (#3988 §4.4 deviation: no bp-chepherd exists in this kit, so
# the dependency is an OPTIONAL seam and the chart is standalone-capable).
# Lockstep: blueprint.yaml 0.1.1 + bootstrap-kit slot 13d pin 0.1.1 +
# catalog-seed (blueprints.json) 0.1.1. Image = ghcr.io/openova-io/
# openova-mcp:<appVersion> (build-openova-mcp.yaml; plain image repo per
# the #4706 chart-repo-collision lesson).
version: 0.1.3
# appVersion is the default image tag (openova-mcp.image in _helpers.tpl).
# 0.2.2 (#5114): buildResolver degrades instead of exiting when the rs256
# verify pubkey (or the hs256 secret) is absent/unparseable — see the 0.1.2
# note above. 0.2.1 rebuilds 0.2.0 with a NUMERIC USER (65532:65532) — see
# the 0.1.1 note above; that binary was unchanged. 0.2.0 is the FIRST image
# with the
# streamable-HTTP transport
# (OPENOVA_MCP_LISTEN + /healthz + /readyz + Authorization-header bearer +
# the OPENOVA_MCP_EXPECTED_ISSUER / OPENOVA_MCP_ORG_SCOPE instance pins) —
# the 0.1.x binary was stdio-only (the agenity in-pod child, #4010/#4097)
# and cannot back a Service.
appVersion: "0.2.3"
keywords:
  - mcp
  - agent
  - rbac
  - thin-facade
  - openova-blueprint
maintainers:
  - name: OpenOva
    url: https://github.com/openova-io/openova
sources:
  - https://github.com/openova-io/openova
# Opt out of the hollow-chart guard (Blueprint-Release workflow / #181):
# this is a first-party product chart deploying a single Go service image
# with Catalyst-authored resources (Deployment + Service + HTTPRoute +
# ServiceAccount + CNPs). No bundled upstream Helm subchart — same shape as
# products/agenity, bp-continuum, bp-kyverno-policies.
annotations:
  catalyst.openova.io/no-upstream: "true"
