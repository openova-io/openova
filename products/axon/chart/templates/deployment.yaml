{{- /*
One Axon in the primary region and none elsewhere (secondary true): two
instances would be two refreshers of one login and two sets of parked runs, so
the strategy is Recreate.

Port 3000 serves the model contract (/v1/*), port 3001 the admin routes:
/healthz (liveness: the event loop runs), /health (readiness: both listeners
are up, whatever the credential state) and /stats.

The root filesystem is read-only. HOME and TMPDIR are one memory-backed
emptyDir: below TMPDIR the child processes share one empty HOME, made at the
first run. The credential
document is the CSI file /var/run/secrets/openova/model-credential, read once at
start; the write-back logs in to OpenBao with the projected token of audience
openbao at /var/run/secrets/openova-token/token.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axon
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axon.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.secondary }}0{{ else }}1{{ end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "axon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "axon.labels" . | nindent 8 }}
    spec:
      serviceAccountName: axon
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: axon
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: model
              containerPort: 3000
              protocol: TCP
            - name: admin
              containerPort: 3001
              protocol: TCP
          env:
            - name: HOME
              value: /home/axon
            - name: TMPDIR
              value: /home/axon
            - name: AXON_PORT
              value: "3000"
            - name: AXON_ADMIN_PORT
              value: "3001"
            - name: AXON_MODEL_MAP
              value: {{ toJson .Values.axon.modelMap | quote }}
            - name: AXON_MAX_ACTIVE
              value: {{ toString .Values.axon.maxActive | quote }}
            - name: AXON_MAX_PARKED
              value: {{ toString .Values.axon.maxParked | quote }}
            - name: AXON_CREDENTIAL_FILE
              value: /var/run/secrets/openova/model-credential
            - name: AXON_CREDENTIAL_KV_PATH
              value: {{ include "axon.credentialPath" . }}
            - name: AXON_CREDENTIAL_ROLE
              value: axon-credential
            - name: OPENBAO_ADDR
              value: {{ .Values.openbao.address | quote }}
          volumeMounts:
            - name: credential
              mountPath: /var/run/secrets/openova
              readOnly: true
            - name: openbao-token
              mountPath: /var/run/secrets/openova-token
              readOnly: true
            - name: home
              mountPath: /home/axon
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: {{ include "axon.memoryMi" . }}Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: credential
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: axon
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: openbao
                  expirationSeconds: 3600
                  path: token
        - name: home
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
