{{- /*
Service account axon: the identity of the CSI mount (OpenBao role workload,
read) and of the write-back (OpenBao role axon-credential). Its token reaches
the Pod only as the projected file of audience openbao (deployment.yaml).
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axon
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axon.labels" . | nindent 4 }}
automountServiceAccountToken: false
