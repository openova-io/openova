{{- /*
The credential document as a file, with no Secret object: the Secrets Store CSI
driver (kit slot 15b) mounts key document of the credential's path through the
OpenBao provider as /var/run/secrets/openova/model-credential.
spec.secretObjects is never set. Until the real document is stored, the path
holds the empty placeholder of kit slot 82 (generatedSecrets), so the mount
succeeds and Axon reports the credential state absent.
*/ -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: axon
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "axon.labels" . | nindent 4 }}
spec:
  provider: openbao
  parameters:
    openbaoAddress: {{ .Values.openbao.address | quote }}
    roleName: workload
    audience: openbao
    objects: |
      - objectName: model-credential
        secretPath: {{ include "axon.credentialPath" . }}
        secretKey: document
