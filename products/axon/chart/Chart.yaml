apiVersion: v2
name: bp-axon
description: |
  Catalyst Blueprint chart for Axon, the simulation back end of the model
  plane (products/axon). It serves the model contract on port 3000 to the
  model gateway's meter only, and its admin routes on port 3001. Kit slot 82
  installs it in every region: one replica in the primary region, zero
  elsewhere. The credential is a file mounted from OpenBao; the chart renders
  no Secret object. See README.md.
type: application
version: 0.1.13
appVersion: "0.1.8"

# The library of the platform's secrets (SEC-200, SEC-201): its birth Job
# creates the empty placeholder of the credential that the SecretProviderClass
# mounts, so the Pod starts before the real document is stored.
dependencies:
  - name: secrets-lib
    version: 0.1.0
    repository: "file://../../../platform/secrets-lib/chart"
