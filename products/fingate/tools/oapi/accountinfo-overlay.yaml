# The account information document reuses names in two ways that would give two Go types
# the same name. It names a parameter and a schema AccountId, and a parameter and a schema
# StatementId: the two parameters get the Go names AccountIdParameter and
# StatementIdParameter. It names two pairs of schemas that differ only by an underscore,
# OBRate1_0 and OB_Rate1_0, OBRate1_1 and OB_Rate1_1, and Go names drop the underscore: the
# two underscore schemas keep their name as written in the document. This overlay changes
# only the generator's copy in memory. The document itself is never edited.
overlay: 1.0.0
info:
  title: Go names for account-info-openapi.yaml
  version: 1.0.0
actions:
  - target: $.components.parameters.AccountId
    update:
      x-go-name: AccountIdParameter
  - target: $.components.parameters.StatementId
    update:
      x-go-name: StatementIdParameter
  - target: $.components.schemas.OB_Rate1_0
    update:
      x-go-name: OB_Rate1_0
  - target: $.components.schemas.OB_Rate1_1
    update:
      x-go-name: OB_Rate1_1
