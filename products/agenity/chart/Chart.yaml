apiVersion: v2
name: bp-agenity
description: |
  Agenity — multi-agent runtime + dashboard, packaged as an installable
  OpenOva Application Blueprint. A User installs Agenity into their own
  Organization from the catalog, then chats with its solo agent (Claude
  Opus 4.7, token pre-configured). The agent reaches the openova MCP server
  (RBAC-scoped to the User's rights) to create more Applications in the
  User's own Organization — the north-star self-service journey.
type: application
# 0.5.12 -> 0.5.13 (#4111): default `imagePullSecrets` to `[{name: ghcr-pull}]`
# so EVERY image-pulling Pod (the seed-claude-creds init container AND the
# chepherd main container) references the reflected ghcr-pull dockerconfigjson
# Secret. The agenity image is a PRIVATE ghcr.io/openova-io/* package, so an
# anonymous pull 401s. The Sovereign emberstack-reflector already reflects
# `ghcr-pull` into every per-Org `org-*`/pool namespace, but a reflected Secret
# is INERT unless the Pod spec references it — with the prior empty default the
# StatefulSet rendered `imagePullSecrets: []` and the Pod wedged at
# Init:ImagePullBackOff on a fresh Org (live root-cause on the omantel.biz demo
# Org `uatwalk91` namespace 2026-06-27: pod agenity-rtz-a-bp-agenity-0 0/1
# Init:ImagePullBackOff with ghcr-pull PRESENT in the ns — the missing piece was
# the pod-spec reference, exactly the reflected-secret-is-inert trap). The
# per-Org install pins `*` so this re-reconciles live via Flux; no fresh prov
# needed for the chart-level half. Values-only change; chart templates already
# render `{{- with .Values.imagePullSecrets }}` (no template edit). appVersion
# (dashboard image) stays 0.9.7 — image bytes UNCHANGED.
# 0.5.11 -> 0.5.12 (#4362, #4325 fallout): declare manifests.helmRelease.
# disableWait=true so the application-controller stamps install.disableWait +
# upgrade.disableWait on the rendered HR. The large agenity image (appVersion
# 0.9.7) cold-pulls slowly on a fresh Org node; with Flux's default --wait the
# helm install times out waiting for the Pod, helm-controller UNINSTALLS the
# release (deleting the StatefulSet + Pod) and retries — restarting the image
# pull from zero every cycle, so the Pod never converges (live on the
# omantel.biz demo Org post-#4325). disableWait lets the release reach Released
# so the StatefulSet survives and the Pod finishes pulling on its own schedule;
# the dashboard SPA has zero dependsOn so nothing needs the readiness gate.
# blueprint-metadata-only; chart TEMPLATES + appVersion image UNCHANGED.
# 0.5.10 -> 0.5.11 (#4362, #4325 fallout): set the chepherd container
# resources requests == limits (Guaranteed QoS, 1:1 ratio). Once #4325 moved
# agenity host-native into the per-Org namespace (above), the namespace's plan
# `plan-limits` LimitRange (maxLimitRequestRatio cpu:1/memory:1 — the Sovereign
# sells Guaranteed quota) REJECTED the prior Burstable spec (cpu 200m->2 = 10:1,
# memory 512Mi->4Gi = 8:1) at pod admission: `max limit to request ratio per
# Container is 1, but provided ratio is N`. The StatefulSet then never created a
# Pod and the Application wedged Provisioning. requests == limits (cpu 1 / mem
# 2Gi) keeps the pod admissible and right-sizes the singleton dashboard + one
# solo claude REPL. Values-only change; appVersion image UNCHANGED.
# 0.5.9 -> 0.5.10 (#4362, #4325 fallout): flip blueprint.yaml topology
# singleton placement.tier `rtz` -> '' (host-native). #4325 de-vclustered the
# platform planes (mgmt/rtz/dmz) into native host namespaces and removed the
# `rtz` plane vCluster; the application-controller resolved the agenity
# Application's `tier: rtz` through VClusterPlacements and upserted the
# per-cluster HelmRelease into the now-absent `rtz` namespace -> Ready=False
# `namespaces "rtz" not found` (Degraded on the omantel.biz demo Org). A per-Org
# agentic dashboard lands on the HOST in its own Org namespace (#4297 keystone),
# so tier '' is correct: no vCluster pivot, HR renders in the App's own
# namespace. The `rtz-A` cluster ID stays (region designator, not a vCluster).
# blueprint-metadata-only change; chart TEMPLATES + appVersion image UNCHANGED.
# 0.5.8 -> 0.5.9 (#4276 hop 7/7b): add the per-Org openova-MCP Catalyst-bearer
# seam — templates/externalsecret-mcp-bearer.yaml + the openovaMCP.mcpBearer
# values block. The catalyst-api org-pipeline producer (seedMCPBearer) mints an
# Org-scoped session JWT (tier=org-admin, org_id=<slug>, role=openova-user,
# typ=session, RS256-signed by the Sovereign handover signer) AND the matching
# RS256 verify PUBKEY (PKIX PEM), writing BOTH to secret/catalyst/agenity/
# <slug>/mcp-bearer. This ExternalSecret pulls them into the per-Org Secret
# agenity-mcp-bearer; the org-gitops emitter points openovaMCP.bearerSecret +
# rs256PubkeySecret at it so the StatefulSet projects OPENOVA_MCP_BEARER +
# OPENOVA_MCP_RS256_PUBKEY_PEM. Closes the hop-7 gap: without a bearer the
# spawned claude-code agent reached the openova MCP unauthenticated (-32001),
# even after the Anthropic key (#4277) was seeded. externalSecret defaults to
# DISABLED (no producer outside a Sovereign Org-pipeline); the emitter enables
# it. Template-only change; appVersion unchanged.
# 0.5.7 -> 0.5.8 (#4277): the anthropic ExternalSecret remoteKey moves from the
# bare `anthropic/token` to `catalyst/anthropic/token`. A Sovereign has NO
# writer for `secret/anthropic/*` (the external-secrets role vault-region1
# reads with is read-only), so the bare path stayed SecretSyncedError on every
# fresh Org. The catalyst/ prefix is the only KV sub-tree a Sovereign CAN write
# (catalyst-api-write policy), and the new catalyst-api producer
# (seedAnthropicToken) writes it at Org-create — making the agentic journey
# zero-touch by construction. Template-only change; appVersion unchanged.
# 0.5.6 -> 0.5.7 (#4180 + #4111, combined on rebase): two ADDITIVE changes land
# together — the workspaces dashboard image (appVersion 0.9.7, #4180) AND the
# seed-claude-creds expired-OAuth detector (#4111). Both documented below.
# 0.5.5 -> 0.5.6 (#4180): publish the bp-agenity build from agenity#752 —
# /app now serves the WORKSPACES (v0.9.4) multi-pane dashboard (Work/Terminal/
# Talk/Board tabs + Sessions/Terminal/Details panes), NOT the archaic
# single-column Dashboard.svelte. The prior images (<= 0.9.6) built the
# workspaces dashboard at /v0.9.4 but left /app wired to the old one. A FRESH
# appVersion 0.9.7 (below) is the first image whose /app mounts Dashboardws;
# the chart version bump publishes it so a fresh-Org install (HR pins `*`)
# auto-resolves to it. ADDITIVE over 0.5.5 (no chart-template change — the
# delta is the image bytes the new appVersion points at).
# 0.5.5 -> 0.5.6 (#4111): the seed-claude-creds init container now parses the
# seeded credentialsJson's claudeAiOauth.expiresAt and emits a LOUD, greppable
# WARNING when the OAuth token is ALREADY expired. Live root-cause on
# omantel.biz 2026-06-24: the seeded blob was correctly shaped (full
# claudeAiOauth pair) but its accessToken had expired ~45h prior, and
# claude-code's headless BareExec spawn does NOT reliably refresh from the
# refreshToken — so every "+ spawn agent" failed "401 Invalid authentication
# credentials" while the dashboard still served (the silent "runtime offline /
# 0 workers" symptom). The check is diagnostic-only: it never blocks the pod
# (the dashboard must still serve) and never mutates the blob (claude-code owns
# rotation) — it converts an invisible auth failure into an actionable
# re-seed cue. README gains the OAuth-token-expiry reality + the "agent went
# offline → re-seed" operator step. appVersion (dashboard image) stays 0.9.6 —
# image bytes UNCHANGED; 0.5.6 is ADDITIVE (chart-only) over 0.5.5. (The
# image's claude-code binary + the chart's forceLocalSpawner/authMode/
# runAsUser/creds-seed wiring — the issue's three named blockers — all already
# landed in #4115/#4138/#4173/#4225/#4233 and are confirmed present live.)
# 0.5.4 -> 0.5.5 (#4228): make the OPENOVA_MCP_RS256_PUBKEY_PEM secretKeyRef
# optional:true. Its source Secret (catalyst-handover-jwt-public, #4114) lives
# in the host catalyst-system namespace, NOT the per-Org namespace this
# Application installs into — so a non-optional ref stuck the chepherd
# container at CreateContainerConfigError and the whole pod (dashboard AND
# chat) never started on an Org install. With optional:true the pod schedules
# even when the Secret is absent; the openova-mcp falls back to its inherited
# process env (bearer_fallback). README gains the operator-driven openbao
# anthropic/token seeding runbook (the chat-runtime credential). No placeholder
# is Helm-seeded (reflector empty-seed trap). appVersion (dashboard image)
# stays 0.9.6 — image bytes unchanged; 0.5.5 is ADDITIVE over 0.5.4.
# 0.5.3 -> 0.5.4 (#4180): add templates/cilium-ingress-networkpolicy.yaml so a
# per-Org (pool-domain) install is REACHABLE through the Cilium Gateway. The
# HTTPRoute alone routed the host but the gateway traffic carries the reserved
# `ingress` entity that no K8s NetworkPolicy can admit — without the CNP every
# external hit to agenity.<slug>.<pool> returned envoy 503 "upstream connect
# error". appVersion (dashboard image) stays 0.9.6 — image bytes unchanged.
# 0.5.15 (#4553/#4556, durable zero-click SSO gate): render a bp-oidc-gate
# COMPANION (templates/oidc-gate.yaml) in front of EVERY per-Org agenity host,
# gated behind oidcGate.enabled (default true). The agnstar North-Star walk
# hand-created a drift-disabled `oidc-gate-agenity-agnstar` HelmRelease, so a
# fresh agenity Org / a re-prov got NO gate (the host served the dashboard
# UN-gated). Templating the gate AS PART OF the agenity install makes the gate
# arrive WITH agenity — chart-managed, drift-detected, zero hand-creation. The
# companion renders the proven #3374 resource set (cookie Secret +
# AppRegistration ConfigMap for bp-sso-bridge + client-secret ExternalSecret +
# oauth2-proxy Deployment + Service + HTTPRoute owning the agenity host with the
# #4556 spaTokenSeed bare-root -> /app/?token=sso redirect + a gateway-ingress
# CNP). The gate's upstream is the agenity Service; when it renders, the chart's
# OWN HTTPRoute (templates/httproute.yaml) is SUPPRESSED (two routes on one host
# is undefined routing). Hostname + clientId derive from httpRoute.hostnames[0]
# / sovereignFqdn (fail-closed per Inviolable #4 — no host -> no gate). The
# org-gitops emitter pins oidcGate.clientId=agenity-<slug> per Org. Template +
# values + helper change; appVersion (image) UNCHANGED.
# 0.5.14 (#4553, Pillar-4 North-Star walk on omantel.biz dep 91dc05917e44d1c1):
# httpRoute.parentRef default catalyst-gateway/catalyst-system -> the REAL
# Sovereign console gateway cilium-gateway-console/kube-system. There is NO
# `catalyst-gateway` on a Catalyst Sovereign — the per-Org agenity host
# (agenity.<slug>.<pool>) is a customer host on the console-ELB gateway (the
# same gateway bp-wordpress-tenant + the org console route attach to, #4054).
# The old default rendered Accepted=False/InvalidHTTPRoute and the host 404'd
# until the parentRef was hand-overridden. appVersion (image) unchanged.
version: 0.5.15
# Bumped appVersion 0.9.6 -> 0.9.7 (#4180): 0.9.7 is the FIRST image whose
# /app/ mounts the WORKSPACES dashboard (Dashboardws bundle) rather than the
# archaic single-column Dashboard.svelte. It is built from agenity#752
# (AGENITY_REF in agenity-build.yaml), which restored the workspaces tree the
# #750/#751 "lean cleanup" deleted and wired app.astro → Dashboardws. The
# <= 0.9.6 images served the archaic /app even though their bundle md5'd clean
# (they shipped the OLD route wiring). A distinct tag forces the per-Org HR
# (`*` pin) to pull NEW bytes — never re-tag 0.9.6 (the #4118 stale-layer
# trap). The hardened smoke gate now asserts /app mounts Dashboardws before
# the image is pushed, so an archaic-/app build can never publish again.
# Bumped appVersion 0.9.5 -> 0.9.6 (#4118): the 0.9.5 image bytes are correct
# (its /app dashboard bundle is byte-identical to a fresh build of the #745
# source — verified by md5 on omantel.biz), but 0.9.5 was published BEFORE
# the agenity-build workflow gained the no-cache rebuild + the post-build
# smoke gate. A distinct 0.9.6 tag is the first image produced by the
# hardened pipeline — never reuse 0.9.5, whose build predated the guard.
# appVersion is the default image tag (agenity.image in _helpers.tpl), so a
# distinct value keeps the hardened-pipeline image from masquerading under the
# old tag. Chart version bumped 0.5.2 -> 0.5.3 to publish the no-cache-HTML
# HTTPRoute change (the durable fix for the founder's stale-browser-cache view).
appVersion: "0.9.7"
keywords:
  - agenity
  - agent-runtime
  - multi-agent
  - solo-agent
  - openova-blueprint
maintainers:
  - name: OpenOva
    url: https://github.com/openova-io/openova
sources:
  # Upstream multi-agent daemon built from source by this Blueprint (runtime
  # base — see Containerfile AGENITY_REF). The Agenity brand is OpenOva's;
  # the runtime daemon it packages is the public upstream project below.
  - https://github.com/agenity-org/agenity
  - https://github.com/openova-io/openova
# Opt out of the hollow-chart guard (Blueprint-Release workflow / issue #181):
# this is a product chart deploying a single upstream daemon image with
# Catalyst-authored resources (StatefulSet + Service + HTTPRoute + MCP
# ConfigMap + ExternalSecret). No bundled upstream Helm subchart — same
# shape as products/axon (PR), bp-continuum, bp-kyverno-policies.
annotations:
  catalyst.openova.io/no-upstream: "true"
  openova.io/blueprint-type: thirdparty
