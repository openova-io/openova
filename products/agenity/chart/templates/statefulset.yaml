apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agenity.fullname" . }}
  labels:
    {{- include "agenity.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "agenity.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "agenity.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agenity.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # The workspace runs as its own account (templates/serviceaccount.yaml),
      # the account catalyst-api admits on the token route for this
      # Organization. Its token is mounted only into the tool-identity
      # containers, never into the workspace container where the agent runs.
      serviceAccountName: {{ .Values.toolIdentity.serviceAccount }}
      automountServiceAccountToken: false
      {{- if .Values.podSecurityContext.runAsNonRoot }}
      # ── Run the chepherd daemon + forked agents as ONE uid (#4111) ──────────
      # chepherd's BareExec spawner runs the daemon as the container uid but
      # forks each claude-code agent after DROPPING to a non-root uid (it sets a
      # syscall.Credential). When the daemon runs as root it creates the
      # per-session dir (…/sessions/<name>) mode 0700 OWNED BY ROOT, so the
      # non-root agent gets EACCES reading its own --mcp-config .mcp.json and
      # exits code 1 ("Invalid MCP configuration: EACCES"). Pinning the whole
      # pod to runAsUser:1000 (the chepherd user the agent forks to) makes the
      # daemon, the session dirs, and the agent all the same uid — the agent can
      # read its .mcp.json and stays alive to service chat. fsGroup:1000 makes
      # the CSI state/repo PVCs group-writable so the non-root daemon can still
      # persist runtime state. Verified live on agenity-demo: as root the agent
      # exits at 113 B; as uid 1000 it reaches 1000+ B and stays live=true.
      securityContext:
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
      {{- end }}
      {{- if .Values.agent.forceLocalSpawner }}
      # chepherd writes each spawned agent's chepherd-MCP server URL as
      # ws://host.containers.internal:9090 (the podman-pod gateway name). In
      # BareExec/local-spawner mode the agent forks ON the chepherd host, where
      # that name is NXDOMAIN — so the chepherd MCP never connects and the agent
      # reports "/mcp not connected, can't reach peers" (#4111). Pin it to the
      # loopback the daemon's MCP listener actually binds (0.0.0.0:9090).
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: ["host.containers.internal"]
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # ── The workspace home on its persistent volume (AIP-250) ───────────
        # Claude Code keeps the Organization's own sign-in in
        # ~/.claude/.credentials.json and refreshes it there, under its own
        # lock; that file is the credential's only copy. The home therefore
        # lives on the workspace's persistent volume (the `state` claim, folder
        # claude-home), so a restart keeps the sign-in. No Secret, no
        # ExternalSecret and no copy of a credential from the Sovereign exist:
        # a person signs in inside the workspace with the Organization's own
        # plan. This container writes no credential. It writes:
        #   1. the onboarding file ~/.claude.json, only when it is absent
        #      (Claude Code owns the file once it exists): the first-run gates
        #      that would end every spawned --dangerously-skip-permissions
        #      session (#4111: the folder-trust dialog per project, the
        #      bypass-permissions warning globally) and the `openova` tool
        #      server for a claude started by hand in the pod (#4604);
        #   2. the daemon's lookup file (CHEPHERD_CLAUDE_CREDS_PATH below): an
        #      access token placeholder that expires in 2100 and NO refresh
        #      token. The daemon checks for a credential before each spawn and
        #      refreshes one that expires within 60 s itself, without writing
        #      the new pair back, which spent the Organization's refresh token
        #      (AIP-250, E4). Pointed at this file it finds a credential, never
        #      refreshes, and the agent uses the home file (E4B).
        - name: workspace-home
          image: {{ include "agenity.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              h=/workspace-state/claude-home
              mkdir -p "$h/.claude"
              if [ -s "$h/.claude.json" ]; then
                echo "kept ~/.claude.json: Claude Code owns it once it exists"
              else
                {{- if .Values.openovaMCP.enabled }}
                printf '%s' '{"hasCompletedOnboarding":true,"bypassPermissionsModeAccepted":true,"autoPermissionsNotificationCount":99,"mcpServers":{"openova":{{ include "agenity.mcpServer" . }}},"projects":{"/var/chepherd/repo":{"hasTrustDialogAccepted":true,"hasCompletedProjectOnboarding":true},"/home/chepherd":{"hasTrustDialogAccepted":true,"hasCompletedProjectOnboarding":true}}}' > "$h/.claude.json"
                {{- else }}
                printf '%s' '{"hasCompletedOnboarding":true,"bypassPermissionsModeAccepted":true,"autoPermissionsNotificationCount":99,"projects":{"/var/chepherd/repo":{"hasTrustDialogAccepted":true,"hasCompletedProjectOnboarding":true},"/home/chepherd":{"hasTrustDialogAccepted":true,"hasCompletedProjectOnboarding":true}}}' > "$h/.claude.json"
                {{- end }}
                echo "wrote the onboarding file ~/.claude.json (it holds no credential)"
              fi
              printf '%s' '{"claudeAiOauth":{"accessToken":"daemon-lookup-placeholder","expiresAt":4102444800000}}' > /daemon-lookup/credentials.json
              echo "wrote the daemon's lookup file: a placeholder with no refresh token"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: state
              mountPath: /workspace-state
            - name: daemon-lookup
              mountPath: /daemon-lookup
        {{- if .Values.openovaMCP.enabled }}
        # ── The tool identity's first pass ──────────────────────────────────
        # One pass of the sidecar below before the workspace starts, so the
        # first tool server already finds the signer key set and the bearer.
        # It never fails the Pod: when catalyst-api cannot be reached the
        # sidecar keeps asking.
        - name: tool-identity-init
          image: {{ include "agenity.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              {{- include "agenity.toolIdentityPass" . | nindent 14 }}
              pass || echo "[tool-identity] no bearer yet; the sidecar keeps asking"
          env:
            {{- include "agenity.toolIdentityEnv" . | nindent 12 }}
          # The workspace's uid: the files it writes (mode 600) are read by
          # the workspace container, which runs as 1000.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: agenity-tools
              mountPath: {{ include "agenity.toolsDir" . }}
            - name: tool-identity-account
              mountPath: /var/run/secrets/agenity
              readOnly: true
        {{- end }}
      containers:
        - name: chepherd
          image: {{ include "agenity.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            - --headless          # Pod mode: no TUI, runtime + WS + MCP HTTP
            - --listen
            - "0.0.0.0:{{ .Values.service.port }}"
            {{- if .Values.agent.solo }}
            - --no-shepherd       # solo: a single worker agent, no supervisor
            {{- end }}
            - --agent
            - {{ .Values.agent.flavor | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            {{- if .Values.agent.forceLocalSpawner }}
            # ── Force the in-pod (BareExec/podman-sidecar) spawner ──────────
            # The chepherd daemon auto-detects KUBERNETES_SERVICE_HOST and picks
            # the `operator` spawner (K8s-Job-per-agent), which needs an
            # unshipped bp-chepherd-operator + CHEPHERD_OPERATOR_NAMESPACE
            # (upstream #130) — without it every "+ spawn agent" returns
            # `runtime.Spawn: operator spawner not yet wired`. Blanking the
            # in-cluster service-host env makes the daemon fall through to the
            # podman-sidecar→BareExecRuntime path, which forks the agent on the
            # chepherd host directly — the intended solo-agent demo runtime
            # (#4111). The spawned agent reaches catalyst-api over the PUBLIC
            # OPENOVA_MCP_CATALYST_API_URL, so it needs no in-cluster apiserver.
            - name: KUBERNETES_SERVICE_HOST
              value: ""
            - name: KUBERNETES_SERVICE_PORT
              value: ""
            - name: KUBERNETES_PORT
              value: ""
            {{- end }}
            # ── Solo-agent model — NORTH STAR: Claude Opus 4.7 ──────────────
            # chepherd passes this as `--model` to the spawned claude-code so
            # the User's solo agent runs on Opus 4.7.
            - name: CHEPHERD_DEFAULT_MODEL
              value: {{ .Values.agent.model | quote }}
            {{- if .Values.daemon.authMode }}
            # ── Daemon HTTP auth mode (browser chat-box trust mode, #4122) ──
            # "none" (or any non-{local,oidc} value) makes chepherd's
            # auth.New() error → rs.AuthToken stays empty → authMiddleware is a
            # no-op → the in-browser dashboard chat box no longer 401s on
            # GET /api/v1/*. Safe here: the Application is per-Org-isolated
            # behind the sign-in gate + the Org host, reachable only by a
            # signed-in User. The tool server's calls to catalyst-api carry the
            # separate tool identity, unaffected by this.
            - name: CHEPHERD_AUTH_MODE
              value: {{ .Values.daemon.authMode | quote }}
            {{- end }}
            {{- if .Values.agent.systemPrompt }}
            - name: CHEPHERD_DEFAULT_SYSTEM_PROMPT
              value: {{ .Values.agent.systemPrompt | quote }}
            {{- end }}
            # ── The daemon's credential lookup (AIP-250, E4B) ───────────────
            # The placeholder the workspace-home init container wrote: the
            # daemon finds a credential before each spawn and never refreshes
            # it, so the only refresher of the Organization's sign-in is
            # Claude Code, on the home file. No ANTHROPIC_API_KEY is set: the
            # agent authenticates from ~/.claude/.credentials.json.
            - name: CHEPHERD_CLAUDE_CREDS_PATH
              value: /var/chepherd/daemon-lookup/credentials.json
            {{- if not .Values.agent.toolSearch }}
            # ── The tool server's tools up front (AIP-250, T3) ──────────────
            # On a plan sign-in Claude Code offers the model a search tool
            # instead of each tool server's tools; "false" offers the openova
            # tools directly, so the agent reaches them in one step.
            - name: ENABLE_TOOL_SEARCH
              value: "false"
            {{- end }}
            {{- if .Values.openovaMCP.enabled }}
            # ── openova MCP injection seam (chepherd #4010) ─────────────────
            # chepherd merges this JSON into every spawned agent's .mcp.json,
            # so the solo agent discovers the `openova` MCP server alongside
            # chepherd's own. chepherd writes it VERBATIM (#4111): it holds no
            # credential. The launcher's `$(cat …)` names no variable of this
            # container, so the kubelet leaves it as it stands, and /bin/sh
            # runs it when a tool server starts.
            - name: CHEPHERD_EXTRA_MCP_JSON
              value: {{ printf "{\"mcpServers\":{\"openova\":%s}}" (include "agenity.mcpServer" .) | quote }}
            {{- $tenantHost := include "agenity.mcpTenantHost" . }}
            {{- if $tenantHost }}
            # OPENOVA_MCP_TENANT_HOST (#4610) — the Org console host the MCP
            # forwards as X-Tenant-Host on the org-scoped install path. Set as a
            # container env so a STANDALONE claude ALSO gets it. The api-URL
            # host is the SOVEREIGN host and is NOT a registered tenant, so
            # without this the org-scoped create 404s `tenant-not-registered`.
            - name: OPENOVA_MCP_TENANT_HOST
              value: {{ $tenantHost | quote }}
            {{- end }}
            # ── The tool identity (AIP-152, AIP-155) ─────────────────────────
            # The tool server reads its bearer from this file at every
            # tools/list and tools/call, so the tool-identity sidecar renews it
            # with no restart. The bearer is an agent token of at most one
            # hour for this Organization, never a long-lived one. Every tool
            # server the agent starts inherits this from the container.
            - name: OPENOVA_MCP_BEARER_FILE
              value: {{ printf "%s/bearer" (include "agenity.toolsDir" .) | quote }}
            {{- end }}
            - name: CHEPHERD_STATE_DIR
              value: /var/chepherd/state
          volumeMounts:
            - name: state
              mountPath: /var/chepherd/state
            - name: repo
              mountPath: /var/chepherd/repo
            # The home Claude Code signs in to and refreshes in: on the
            # persistent volume, never an emptyDir.
            - name: state
              mountPath: /home/chepherd/.claude
              subPath: claude-home/.claude
            - name: state
              mountPath: /home/chepherd/.claude.json
              subPath: claude-home/.claude.json
            - name: daemon-lookup
              mountPath: /var/chepherd/daemon-lookup
              readOnly: true
            {{- if .Values.openovaMCP.enabled }}
            - name: agenity-tools
              mountPath: {{ include "agenity.toolsDir" . }}
              readOnly: true
            {{- end }}
            {{- if .Values.podman.inPod }}
            - name: fuse
              mountPath: /dev/fuse
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.podman.inPod }}
          securityContext:
            # rootless podman-in-pod needs the SYS_ADMIN cap + device access
            # for the ContainerRuntime that hosts per-agent claude REPLs.
            seccompProfile:
              type: Unconfined
            capabilities:
              add: ["SYS_ADMIN"]
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
        {{- if .Values.openovaMCP.enabled }}
        # ── The tool identity: a short-lived bearer, renewed in place ───────
        # Every third of the bearer's life this container asks catalyst-api
        # (POST /api/v1/internal/agent-tokens) for an agent token of this
        # Organization with the projected token of the account agenity, which
        # the default entry of agentTokens.callers admits for its own
        # Organization only. It writes the token to the bearer file by rename,
        # so the tool server reads the old bearer or the new one, never half a
        # file. The acting person, when there is one, is the Organization's
        # owner: catalyst-api checks that person's role at every issue, and a
        # token acting for an admin is the only one that may call
        # create_application. Only this container mounts the account token;
        # the workspace container, where the agent runs, cannot read it.
        - name: tool-identity
          image: {{ include "agenity.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              {{- include "agenity.toolIdentityPass" . | nindent 14 }}
              # A renewal, not a watch: the token route pushes nothing, and
              # the bearer must be replaced before half its life has passed.
              trap 'exit 0' TERM INT
              while true; do
                if pass; then wait_s=$renew; else wait_s=30; fi
                sleep "$wait_s" &
                wait $!
              done
          env:
            {{- include "agenity.toolIdentityEnv" . | nindent 12 }}
          volumeMounts:
            - name: agenity-tools
              mountPath: {{ include "agenity.toolsDir" . }}
            - name: tool-identity-account
              mountPath: /var/run/secrets/agenity
              readOnly: true
          resources:
            {{- toYaml .Values.toolIdentity.resources | nindent 12 }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          # The kyverno probes-present policy (#6513) admits a StatefulSet only
          # when every container has both probes. Neither may hide the
          # dashboard while catalyst-api cannot be reached, so readiness asks
          # only that the folder it writes is writable, and liveness that the
          # container runs (its one process is the renewal loop).
          readinessProbe:
            exec:
              command: ["test", "-w", {{ include "agenity.toolsDir" . | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 10
            periodSeconds: 30
        {{- end }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: state
          emptyDir: {}
        - name: repo
          emptyDir: {}
        {{- end }}
        - name: daemon-lookup
          emptyDir: {}
        {{- if .Values.openovaMCP.enabled }}
        # The bearer and the key set, in memory only.
        - name: agenity-tools
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # The account's own token, for the TokenReview of the token route;
        # the kubelet renews it before it expires.
        - name: tool-identity-account
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
        {{- end }}
        {{- if .Values.podman.inPod }}
        - name: fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.persistence.state.size }}
        {{- if .Values.persistence.state.storageClass }}
        storageClassName: {{ .Values.persistence.state.storageClass }}
        {{- end }}
    - metadata:
        name: repo
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.persistence.repo.size }}
        {{- if .Values.persistence.repo.storageClass }}
        storageClassName: {{ .Values.persistence.repo.storageClass }}
        {{- end }}
  {{- end }}
