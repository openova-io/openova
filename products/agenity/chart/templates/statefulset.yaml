apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agenity.fullname" . }}
  labels:
    {{- include "agenity.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "agenity.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "agenity.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agenity.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.podSecurityContext.runAsNonRoot }}
      # ── Run the chepherd daemon + forked agents as ONE uid (#4111) ──────────
      # chepherd's BareExec spawner runs the daemon as the container uid but
      # forks each claude-code agent after DROPPING to a non-root uid (it sets a
      # syscall.Credential). When the daemon runs as root it creates the
      # per-session dir (…/sessions/<name>) mode 0700 OWNED BY ROOT, so the
      # non-root agent gets EACCES reading its own --mcp-config .mcp.json and
      # exits code 1 ("Invalid MCP configuration: EACCES"). Pinning the whole
      # pod to runAsUser:1000 (the chepherd user the agent forks to) makes the
      # daemon, the session dirs, and the agent all the same uid — the agent can
      # read its .mcp.json and stays alive to service chat. fsGroup:1000 makes
      # the CSI state/repo PVCs group-writable so the non-root daemon can still
      # persist runtime state. Verified live on agenity-demo: as root the agent
      # exits at 113 B; as uid 1000 it reaches 1000+ B and stays live=true.
      securityContext:
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
      {{- end }}
      {{- if .Values.agent.forceLocalSpawner }}
      # chepherd writes each spawned agent's chepherd-MCP server URL as
      # ws://host.containers.internal:9090 (the podman-pod gateway name). In
      # BareExec/local-spawner mode the agent forks ON the chepherd host, where
      # that name is NXDOMAIN — so the chepherd MCP never connects and the agent
      # reports "/mcp not connected, can't reach peers" (#4111). Pin it to the
      # loopback the daemon's MCP listener actually binds (0.0.0.0:9090).
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: ["host.containers.internal"]
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.anthropic.credentialsKey }}
      initContainers:
        # ── Seed claude-code OAuth credentials (#4111) ──────────────────────
        # The spawned claude-code (BareExec) reads ~/.claude/.credentials.json
        # on the chepherd host. Materialize it from the Secret's full
        # credentials.json blob into a shared emptyDir mounted at
        # /home/chepherd/.claude (writable so claude-code can rotate the OAuth
        # pair). No-op when the Secret lacks the credentials key (key-only
        # mode). Runs as uid 1000 to match the chepherd user the agent forks
        # as. The Secret is mounted read-only at /creds.
        - name: seed-claude-creds
          image: {{ include "agenity.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /claudehome/.claude/projects
              if [ -s /creds/{{ .Values.anthropic.credentialsKey }} ]; then
                cp /creds/{{ .Values.anthropic.credentialsKey }} /claudehome/.claude/.credentials.json
                chmod 600 /claudehome/.claude/.credentials.json
                echo "seeded ~/.claude/.credentials.json ($(wc -c < /claudehome/.claude/.credentials.json) bytes)"
                # ── OAuth VALIDITY pre-flight (#4111, corrected by #5956) ────
                # The seeded blob is a claudeAiOauth pair whose accessToken has
                # a SHORT lifetime (hours). claude-code's headless BareExec
                # spawn path does NOT reliably refresh it from the refreshToken
                # — verified live on omantel.biz 2026-06-24: a token expired
                # ~45h prior left every spawn failing "401 Invalid
                # authentication credentials" while the dashboard still served,
                # i.e. the exact "runtime offline · 0 workers" symptom with no
                # other signal.
                #
                # 🛑 WHY THIS IS NO LONGER AN expiresAt COMPARISON (#5956):
                # this check used to parse expiresAt and print
                #   "claude-code OAuth token valid (~7h remaining)."
                # That line was emitted VERBATIM on hw292 2026-08-10 over a
                # credential the API was already answering
                #   401 "OAuth access token has been revoked"
                # for. Expiry is a NECESSARY condition for a working
                # credential and never a sufficient one — a token can be
                # killed upstream at any instant without one local byte
                # changing. So the word "valid" is now spoken ONLY after the
                # Anthropic API accepts the token, and the unprobed case says
                # NOT VERIFIED rather than borrowing the healthy wording.
                #
                # Still diagnostic ONLY: we never block the pod (the dashboard
                # must still serve) and never mutate the blob (claude-code owns
                # rotation). Both parsers are single-line python3 -c (no
                # heredoc) so the YAML block scalar stays whitespace-robust
                # across Helm renders.
                EXP=$(python3 -c 'import json,time;o=json.load(open("/claudehome/.claude/.credentials.json")).get("claudeAiOauth",{});e=int(o.get("expiresAt",0) or 0);n=int(time.time()*1000);print(("EXPIRED %d"%((n-e)//3600000)) if e and e<n else ("UNEXPIRED %d"%((e-n)//3600000)) if e else "NOEXP")' 2>/dev/null || echo "")
                case "$EXP" in
                  EXPIRED*) echo "🛑 WARNING (#4111): seeded claude-code OAuth token is EXPIRED (~${EXP#EXPIRED }h ago) — the spawned agent will fail '401 Invalid authentication credentials' and the dashboard will show 'runtime offline / 0 workers'. RE-SEED openbao catalyst/anthropic/token with a FRESH credentialsJson and force-sync the ExternalSecret (see README: Seeding the catalyst/anthropic/token openbao path)." ;;
                  NOEXP)    echo "claude-code credentials.json has no expiresAt — expiry unknown." ;;
                  *)        echo "could not parse claude-code OAuth expiry from credentials.json (non-fatal)." ;;
                esac
                {{- if .Values.anthropic.validityProbe.enabled }}
                # VALIDITY PROBE — one authenticated GET against the Anthropic
                # API. This is the only thing in the pod that can distinguish a
                # live credential from a revoked one. It is bounded, best-effort
                # and never fatal; if the per-Org egress policy denies the call
                # (the default-deny namespace class, #5617) the outcome is
                # NOT VERIFIED — an honest "we do not know", never a green.
                # `revoked` vs `invalid` is the API's own wording and drives a
                # different operator cue: re-seed vs fix the credential.
                # The opener below installs a no-op HTTPErrorProcessor so a 401
                # comes back as a RESPONSE instead of an exception — that is
                # what keeps the whole probe on ONE physical line (a try/except
                # would need continuation lines, and a de-indented continuation
                # silently terminates this YAML block scalar). It prints
                # "<status> <True|False revoked>" on success and NOTHING when
                # the endpoint is unreachable; the shell classifies below, so
                # an empty result can only ever become NOT VERIFIED.
                PROBE=$(python3 -c 'import json,urllib.request;o=json.load(open("/claudehome/.claude/.credentials.json")).get("claudeAiOauth",{});t=(o.get("accessToken") or "").strip();h={"anthropic-version":"2023-06-01"};h.update({"Authorization":"Bearer "+t,"anthropic-beta":"oauth-2025-04-20"} if t.startswith("sk-ant-oat") else {"x-api-key":t});N=type("N",(urllib.request.HTTPErrorProcessor,),{"http_response":lambda s,q,r:r,"https_response":lambda s,q,r:r});p=urllib.request.build_opener(N).open(urllib.request.Request("{{ .Values.anthropic.validityProbe.baseUrl }}/v1/models?limit=1",headers=h),timeout={{ .Values.anthropic.validityProbe.timeoutSeconds }});print(p.getcode(),"revoked" in p.read(4096).decode("utf-8","replace").lower())' 2>/dev/null || true)
                set -- $PROBE
                CODE="${1:-0}"
                WASREVOKED="${2:-False}"
                case "$CODE" in
                  2*|429)
                    echo "claude-code OAuth token VERIFIED VALID by the Anthropic API (HTTP $CODE)." ;;
                  401|403)
                    if [ "$WASREVOKED" = "True" ]; then
                      echo "🛑 WARNING (#5956): the seeded claude-code OAuth token is REVOKED upstream — it is unexpired and correctly delivered, and every inference will still fail 401. RE-SEED openbao catalyst/anthropic/token with a FRESH credentialsJson and force-sync the ExternalSecret (see README: Seeding the catalyst/anthropic/token openbao path)."
                    else
                      echo "🛑 WARNING (#5956): the Anthropic API REJECTED the seeded credential (HTTP $CODE, not reported as revoked) — the agent will fail every inference. Check the credential kind (an sk-ant-oat OAuth access token is NOT a bare API key) and re-seed."
                    fi ;;
                  *)
                    echo "claude-code OAuth token NOT VERIFIED (probe result: HTTP $CODE) — expiry looked fine, but an unexpired token can still be REVOKED (#5956). Treat the runtime as unproven until an inference succeeds." ;;
                esac
                {{- end }}
              else
                echo "no credentials.json key in Secret — key-only mode"
              fi
              # Onboarding stub so claude-code does not re-run the first-run
              # /login flow AND does not block on the two interactive first-run
              # gates that otherwise make every spawned --dangerously-skip-
              # permissions session exit immediately on chepherd's PTY (#4111):
              #   1. "Is this a project you trust?" folder-trust dialog
              #      → suppressed per-project via projects.<cwd>.hasTrustDialogAccepted
              #   2. "WARNING: running in Bypass Permissions mode … 1.No,exit
              #      2.Yes,I accept" → suppressed GLOBALLY via the top-level
              #      bypassPermissionsModeAccepted:true key.
              # Verified live on agenity-demo: without bypassPermissionsModeAccepted
              # the agent prints 113 bytes then exits ("No,exit" is the default);
              # with it the REPL boots to the prompt and stays alive to receive
              # the operator's chat message. The projects map marks the chepherd
              # agent/session working dirs trusted so no per-cwd dialog fires.
              #
              # ── openova MCP at USER level (#4604) ────────────────────────────
              # chepherd's CHEPHERD_EXTRA_MCP_JSON seam (main container, below)
              # merges the `openova` MCP server into each chepherd-SPAWNED
              # agent's per-session .mcp.json. But a claude invoked STANDALONE in
              # the pod (`claude -p "…"`, the North-Star verifier path) reads
              # ~/.claude.json's `mcpServers` + a project ./.mcp.json — NEITHER
              # of which carries the openova entry, so a bare claude reports "no
              # MCP tools" (verified live on nstar2: ~/.claude.json mcpServers:[]
              # + no .mcp.json). Seeding the `openova` mcpServers entry HERE, into
              # the same ~/.claude.json the onboarding stub already writes, makes
              # EVERY claude in the pod (spawned OR standalone) discover the
              # openova MCP with zero per-session config. The bearer + RS256
              # pubkey are deliberately OMITTED: the openova-mcp child is launched
              # by claude inside the chepherd container and INHERITS
              # OPENOVA_MCP_BEARER / OPENOVA_MCP_RS256_PUBKEY_PEM from the
              # container env (set on the main container) — the same
              # env-inheritance contract CHEPHERD_EXTRA_MCP_JSON relies on. Only
              # the non-secret knobs (catalyst-api URL, context pin, verify mode)
              # are pinned. Path + knobs mirror openovaMCP.* so the two discovery
              # seams agree.
              {{- if .Values.openovaMCP.enabled }}
              {{- $apiURL := .Values.openovaMCP.catalystApiUrl }}
              {{- if not $apiURL }}{{ $apiURL = printf "https://console.%s" (.Values.sovereignFqdn | default "openova.io") }}{{- end }}
              printf '%s' '{"hasCompletedOnboarding":true,"bypassPermissionsModeAccepted":true,"autoPermissionsNotificationCount":99,"mcpServers":{"openova":{"command":{{ .Values.openovaMCP.binaryPath | quote }},"env":{"OPENOVA_MCP_CATALYST_API_URL":{{ $apiURL | quote }},"OPENOVA_MCP_CONTEXT":{{ .Values.openovaMCP.context | quote }},"OPENOVA_MCP_VERIFY":{{ .Values.openovaMCP.verify | quote }}}}},"projects":{"/var/chepherd/repo":{"hasTrustDialogAccepted":true,"hasCompletedProjectOnboarding":true},"/home/chepherd":{"hasTrustDialogAccepted":true,"hasCompletedProjectOnboarding":true}}}' > /claudehome/.claude.json
              {{- else }}
              printf '%s' '{"hasCompletedOnboarding":true,"bypassPermissionsModeAccepted":true,"autoPermissionsNotificationCount":99,"projects":{"/var/chepherd/repo":{"hasTrustDialogAccepted":true,"hasCompletedProjectOnboarding":true},"/home/chepherd":{"hasTrustDialogAccepted":true,"hasCompletedProjectOnboarding":true}}}' > /claudehome/.claude.json
              {{- end }}
              chmod 644 /claudehome/.claude.json
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: claude-home
              mountPath: /claudehome
            - name: anthropic-creds
              mountPath: /creds
              readOnly: true
      {{- end }}
      containers:
        - name: chepherd
          image: {{ include "agenity.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            - --headless          # Pod mode: no TUI, runtime + WS + MCP HTTP
            - --listen
            - "0.0.0.0:{{ .Values.service.port }}"
            {{- if .Values.agent.solo }}
            - --no-shepherd       # solo: a single worker agent, no supervisor
            {{- end }}
            - --agent
            - {{ .Values.agent.flavor | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            {{- if .Values.agent.forceLocalSpawner }}
            # ── Force the in-pod (BareExec/podman-sidecar) spawner ──────────
            # The chepherd daemon auto-detects KUBERNETES_SERVICE_HOST and picks
            # the `operator` spawner (K8s-Job-per-agent), which needs an
            # unshipped bp-chepherd-operator + CHEPHERD_OPERATOR_NAMESPACE
            # (upstream #130) — without it every "+ spawn agent" returns
            # `runtime.Spawn: operator spawner not yet wired`. Blanking the
            # in-cluster service-host env makes the daemon fall through to the
            # podman-sidecar→BareExecRuntime path, which forks the agent on the
            # chepherd host directly — the intended solo-agent demo runtime
            # (#4111). The spawned agent reaches catalyst-api over the PUBLIC
            # OPENOVA_MCP_CATALYST_API_URL, so it needs no in-cluster apiserver.
            - name: KUBERNETES_SERVICE_HOST
              value: ""
            - name: KUBERNETES_SERVICE_PORT
              value: ""
            - name: KUBERNETES_PORT
              value: ""
            {{- end }}
            # ── Solo-agent model — NORTH STAR: Claude Opus 4.7 ──────────────
            # chepherd passes this as `--model` to the spawned claude-code so
            # the User's solo agent runs on Opus 4.7.
            - name: CHEPHERD_DEFAULT_MODEL
              value: {{ .Values.agent.model | quote }}
            {{- if .Values.daemon.authMode }}
            # ── Daemon HTTP auth mode (browser chat-box trust mode, #4122) ──
            # "none" (or any non-{local,oidc} value) makes chepherd's
            # auth.New() error → rs.AuthToken stays empty → authMiddleware is a
            # no-op → the in-browser dashboard chat box no longer 401s on
            # GET /api/v1/*. Safe here: the Application is per-Org-isolated
            # behind the Cilium Gateway + the Org host, reachable only by the
            # signed-in User. The MCP→catalyst-api create_application path uses
            # the separate RS256 OPENOVA_MCP_BEARER seam, unaffected by this.
            - name: CHEPHERD_AUTH_MODE
              value: {{ .Values.daemon.authMode | quote }}
            {{- end }}
            {{- if .Values.agent.systemPrompt }}
            - name: CHEPHERD_DEFAULT_SYSTEM_PROMPT
              value: {{ .Values.agent.systemPrompt | quote }}
            {{- end }}
            {{- if not .Values.anthropic.credentialsKey }}
            # ── Anthropic API token (from Secret — never hardcoded) ─────────
            # KEY-ONLY MODE: when there is no OAuth credentials.json blob, the
            # spawned agent authenticates with a bare ANTHROPIC_API_KEY.
            #
            # 🛑 NEVER set this alongside credentialsKey (#4111): an
            # sk-ant-oat01 OAuth access-token is NOT a valid bare API key, and
            # claude-code PREFERS $ANTHROPIC_API_KEY over ~/.claude/.credentials.json
            # when both are present — so an inherited ANTHROPIC_API_KEY makes the
            # spawned agent fail with "Invalid API key · Fix external API key"
            # even though the seeded OAuth blob is valid. Verified live on
            # agenity-demo: unset → claude-code authenticates via the OAuth
            # credentials.json; set → "Invalid API key". So in OAuth mode we omit
            # this env entirely and let the seeded credentials.json drive auth.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anthropic.secretName }}
                  key: {{ .Values.anthropic.secretKey }}
            {{- end }}
            {{- if .Values.openovaMCP.enabled }}
            # ── openova MCP injection seam (chepherd #4010) ─────────────────
            # chepherd merges this JSON into every spawned agent's .mcp.json,
            # so the solo agent discovers the `openova` MCP server alongside
            # chepherd's own. The agent then calls create_application etc. on
            # the User's Org, RBAC-scoped (the openova MCP forwards the
            # caller's session bearer to the live catalyst-api).
            {{- $apiURL := .Values.openovaMCP.catalystApiUrl }}
            {{- if not $apiURL }}{{ $apiURL = printf "https://console.%s" (.Values.sovereignFqdn | default "openova.io") }}{{- end }}
            # 🛑 Do NOT embed "$(OPENOVA_MCP_BEARER)" / "$(…PUBKEY_PEM)" here
            # (#4111): chepherd writes CHEPHERD_EXTRA_MCP_JSON VERBATIM into each
            # session's .mcp.json — it does NOT shell-`$( )`-expand it — so the
            # openova-mcp child would receive the literal string "$(OPENOVA_MCP_
            # BEARER)" as its bearer and every create_application call would fail
            # RS256 verification at the catalyst-api. Instead we OMIT the bearer +
            # pubkey from the mcp.json env: the openova-mcp process is forked from
            # the chepherd daemon and INHERITS the container's OPENOVA_MCP_BEARER
            # and OPENOVA_MCP_RS256_PUBKEY_PEM env vars (set below), which it reads
            # natively (verified: `openova-mcp` logs `bearer_fallback=true` and
            # reads OPENOVA_MCP_* from its environment). Only the non-secret,
            # MCP-specific knobs are pinned in the JSON.
            {{- $tenantHost := include "agenity.mcpTenantHost" . }}
            - name: CHEPHERD_EXTRA_MCP_JSON
              value: |-
                {"mcpServers":{"openova":{
                  "command":{{ .Values.openovaMCP.binaryPath | quote }},
                  "env":{
                    "OPENOVA_MCP_CATALYST_API_URL":{{ $apiURL | quote }},
                    {{- if $tenantHost }}
                    "OPENOVA_MCP_TENANT_HOST":{{ $tenantHost | quote }},
                    {{- end }}
                    "OPENOVA_MCP_CONTEXT":{{ .Values.openovaMCP.context | quote }},
                    "OPENOVA_MCP_VERIFY":{{ .Values.openovaMCP.verify | quote }}
                  }
                }}}
            {{- if $tenantHost }}
            # OPENOVA_MCP_TENANT_HOST (#4610) — the Org console host the MCP
            # forwards as X-Tenant-Host on the org-scoped install path. Set as a
            # container env so a STANDALONE claude (whose ~/.claude.json carries
            # only the non-secret MCP knobs) ALSO gets it via the same env
            # inheritance the bearer/pubkey use. The api-URL host is the
            # SOVEREIGN host and is NOT a registered tenant, so without this the
            # org-scoped create 404s `tenant-not-registered`.
            - name: OPENOVA_MCP_TENANT_HOST
              value: {{ $tenantHost | quote }}
            {{- end }}
            {{- $mcpBearerSecretName := include "agenity.mcpBearerSecretName" . }}
            {{- if $mcpBearerSecretName }}
            # Interim per-call bearer (#4111) — an admin-tier, Org-pinned,
            # handover-RS256-signed session JWT the MCP forwards to the
            # catalyst-api. Production seam is the chat UI per-call _auth.token.
            # #4624: the Secret is SELF-WIRED via agenity.mcpBearerSecretName —
            # an explicit bearerSecret.name wins, else the projection follows the
            # materialised mcpBearer ExternalSecret, so the bearer is never
            # materialised-but-unread (the fresh-Org tools/list-empty gap).
            - name: OPENOVA_MCP_BEARER
              valueFrom:
                secretKeyRef:
                  name: {{ $mcpBearerSecretName }}
                  key: {{ include "agenity.mcpBearerSecretKey" . }}
            {{- end }}
            {{- if eq .Values.openovaMCP.verify "rs256" }}
            # The RS256 public key the MCP verifies caller bearers against,
            # sourced from the Sovereign's handover-jwt-public secret. Surfaced
            # as an env var that the forked openova-mcp inherits and reads
            # natively (bearer_fallback=true).
            #
            # 🛑 optional:true is LOAD-BEARING for the chat runtime (#4228): the
            # handover pubkey Secret (`catalyst-handover-jwt-public`, published
            # by catalyst-api #4114) lives in the host catalyst-system namespace,
            # NOT in the per-Org namespace this Application installs into — so a
            # NON-optional secretKeyRef makes the chepherd container stick
            # CreateContainerConfigError ("secret not found") and the whole pod —
            # dashboard AND chat — never starts. The dashboard render does not
            # use this key; only the MCP→catalyst-api create_application bearer
            # verification does. With optional:true the pod schedules even when
            # the Secret is absent (the env var is simply unset), so the
            # dashboard always serves and the MCP bearer-verifies once the pubkey
            # is reflected/seeded into the Org ns (rs256PubkeySecret override) or
            # the openova-mcp falls back to its env (bearer_fallback). We do NOT
            # Helm-seed a placeholder value here — an empty PEM would pin a bad
            # key forever under the reflector empty-seed trap; absent-and-optional
            # is the correct state until the real pubkey is reflected in.
            # #4624: SELF-WIRED via agenity.mcpPubkeySecretName — when the
            # per-Org mcpBearer ExternalSecret is enabled and rs256PubkeySecret
            # is still the chart-default host Secret (catalyst-handover-jwt, a
            # JWK that is absent in the per-Org ns), the projection follows the
            # PKIX PEM the producer seeds ALONGSIDE the bearer in the SAME
            # materialised Secret — sidestepping the JWK-vs-PEM mismatch.
            - name: OPENOVA_MCP_RS256_PUBKEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenity.mcpPubkeySecretName" . }}
                  key: {{ include "agenity.mcpPubkeySecretKey" . }}
                  optional: true
            {{- end }}
            {{- end }}
            - name: CHEPHERD_STATE_DIR
              value: /var/chepherd/state
          volumeMounts:
            - name: state
              mountPath: /var/chepherd/state
            - name: repo
              mountPath: /var/chepherd/repo
            {{- if .Values.anthropic.credentialsKey }}
            # claude-code reads ~/.claude/.credentials.json + ~/.claude.json;
            # the init container seeded them into this writable emptyDir (#4111).
            - name: claude-home
              mountPath: /home/chepherd/.claude
              subPath: .claude
            - name: claude-home
              mountPath: /home/chepherd/.claude.json
              subPath: .claude.json
            {{- end }}
            {{- if .Values.podman.inPod }}
            - name: fuse
              mountPath: /dev/fuse
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.podman.inPod }}
          securityContext:
            # rootless podman-in-pod needs the SYS_ADMIN cap + device access
            # for the ContainerRuntime that hosts per-agent claude REPLs.
            seccompProfile:
              type: Unconfined
            capabilities:
              add: ["SYS_ADMIN"]
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: state
          emptyDir: {}
        - name: repo
          emptyDir: {}
        {{- end }}
        {{- if .Values.anthropic.credentialsKey }}
        # Writable home for claude-code creds/onboarding, seeded by the
        # init container from the anthropic Secret (#4111).
        - name: claude-home
          emptyDir: {}
        - name: anthropic-creds
          secret:
            secretName: {{ .Values.anthropic.secretName }}
            optional: true
        {{- end }}
        {{- if .Values.podman.inPod }}
        - name: fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.persistence.state.size }}
        {{- if .Values.persistence.state.storageClass }}
        storageClassName: {{ .Values.persistence.state.storageClass }}
        {{- end }}
    - metadata:
        name: repo
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.persistence.repo.size }}
        {{- if .Values.persistence.repo.storageClass }}
        storageClassName: {{ .Values.persistence.repo.storageClass }}
        {{- end }}
  {{- end }}
