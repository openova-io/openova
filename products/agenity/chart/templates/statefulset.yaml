apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agenity.fullname" . }}
  labels:
    {{- include "agenity.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "agenity.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "agenity.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agenity.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.anthropic.credentialsKey }}
      initContainers:
        # ── Seed claude-code OAuth credentials (#4111) ──────────────────────
        # The spawned claude-code (BareExec) reads ~/.claude/.credentials.json
        # on the chepherd host. Materialize it from the Secret's full
        # credentials.json blob into a shared emptyDir mounted at
        # /home/chepherd/.claude (writable so claude-code can rotate the OAuth
        # pair). No-op when the Secret lacks the credentials key (key-only
        # mode). Runs as uid 1000 to match the chepherd user the agent forks
        # as. The Secret is mounted read-only at /creds.
        - name: seed-claude-creds
          image: {{ include "agenity.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /claudehome/.claude/projects
              if [ -s /creds/{{ .Values.anthropic.credentialsKey }} ]; then
                cp /creds/{{ .Values.anthropic.credentialsKey }} /claudehome/.claude/.credentials.json
                chmod 600 /claudehome/.claude/.credentials.json
                echo "seeded ~/.claude/.credentials.json ($(wc -c < /claudehome/.claude/.credentials.json) bytes)"
              else
                echo "no credentials.json key in Secret — key-only mode"
              fi
              # Onboarding stub so claude-code does not re-run the first-run
              # /login flow and auto-approves Bypass-permissions.
              printf '%s' '{"hasCompletedOnboarding":true,"autoPermissionsNotificationCount":99}' > /claudehome/.claude.json
              chmod 644 /claudehome/.claude.json
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: claude-home
              mountPath: /claudehome
            - name: anthropic-creds
              mountPath: /creds
              readOnly: true
      {{- end }}
      containers:
        - name: chepherd
          image: {{ include "agenity.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            - --headless          # Pod mode: no TUI, runtime + WS + MCP HTTP
            - --listen
            - "0.0.0.0:{{ .Values.service.port }}"
            {{- if .Values.agent.solo }}
            - --no-shepherd       # solo: a single worker agent, no supervisor
            {{- end }}
            - --agent
            - {{ .Values.agent.flavor | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            # ── Solo-agent model — NORTH STAR: Claude Opus 4.7 ──────────────
            # chepherd passes this as `--model` to the spawned claude-code so
            # the User's solo agent runs on Opus 4.7.
            - name: CHEPHERD_DEFAULT_MODEL
              value: {{ .Values.agent.model | quote }}
            {{- if .Values.agent.systemPrompt }}
            - name: CHEPHERD_DEFAULT_SYSTEM_PROMPT
              value: {{ .Values.agent.systemPrompt | quote }}
            {{- end }}
            # ── Anthropic API token (from Secret — never hardcoded) ─────────
            # chepherd seeds its vault `anthropic-api` provider from this env;
            # the spawned agent inherits ANTHROPIC_API_KEY at spawn time.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anthropic.secretName }}
                  key: {{ .Values.anthropic.secretKey }}
            {{- if .Values.openovaMCP.enabled }}
            # ── openova MCP injection seam (chepherd #4010) ─────────────────
            # chepherd merges this JSON into every spawned agent's .mcp.json,
            # so the solo agent discovers the `openova` MCP server alongside
            # chepherd's own. The agent then calls create_application etc. on
            # the User's Org, RBAC-scoped (the openova MCP forwards the
            # caller's session bearer to the live catalyst-api).
            {{- $apiURL := .Values.openovaMCP.catalystApiUrl }}
            {{- if not $apiURL }}{{ $apiURL = printf "https://console.%s" (.Values.sovereignFqdn | default "openova.io") }}{{- end }}
            - name: CHEPHERD_EXTRA_MCP_JSON
              value: |-
                {"mcpServers":{"openova":{
                  "command":{{ .Values.openovaMCP.binaryPath | quote }},
                  "env":{
                    "OPENOVA_MCP_CATALYST_API_URL":{{ $apiURL | quote }},
                    "OPENOVA_MCP_CONTEXT":{{ .Values.openovaMCP.context | quote }},
                    "OPENOVA_MCP_VERIFY":{{ .Values.openovaMCP.verify | quote }},
                    "OPENOVA_MCP_RS256_PUBKEY_PEM":"$(OPENOVA_MCP_RS256_PUBKEY_PEM)"{{ if .Values.openovaMCP.bearerSecret.name }},
                    "OPENOVA_MCP_BEARER":"$(OPENOVA_MCP_BEARER)"{{ end }}
                  }
                }}}
            {{- if .Values.openovaMCP.bearerSecret.name }}
            # Interim per-call bearer (#4111) — an admin-tier, Org-pinned,
            # handover-RS256-signed session JWT the MCP forwards to the
            # catalyst-api. Production seam is the chat UI per-call _auth.token.
            - name: OPENOVA_MCP_BEARER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openovaMCP.bearerSecret.name }}
                  key: {{ .Values.openovaMCP.bearerSecret.key }}
            {{- end }}
            {{- if eq .Values.openovaMCP.verify "rs256" }}
            # The RS256 public key the MCP verifies caller bearers against,
            # reflected from the Sovereign's handover-jwt secret. Surfaced as
            # an env var so the EXTRA_MCP_JSON above can $(…)-expand it into
            # the per-agent MCP server stanza.
            - name: OPENOVA_MCP_RS256_PUBKEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openovaMCP.rs256PubkeySecret.name }}
                  key: {{ .Values.openovaMCP.rs256PubkeySecret.key }}
            {{- end }}
            {{- end }}
            - name: CHEPHERD_STATE_DIR
              value: /var/chepherd/state
          volumeMounts:
            - name: state
              mountPath: /var/chepherd/state
            - name: repo
              mountPath: /var/chepherd/repo
            {{- if .Values.anthropic.credentialsKey }}
            # claude-code reads ~/.claude/.credentials.json + ~/.claude.json;
            # the init container seeded them into this writable emptyDir (#4111).
            - name: claude-home
              mountPath: /home/chepherd/.claude
              subPath: .claude
            - name: claude-home
              mountPath: /home/chepherd/.claude.json
              subPath: .claude.json
            {{- end }}
            {{- if .Values.podman.inPod }}
            - name: fuse
              mountPath: /dev/fuse
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.podman.inPod }}
          securityContext:
            # rootless podman-in-pod needs the SYS_ADMIN cap + device access
            # for the ContainerRuntime that hosts per-agent claude REPLs.
            seccompProfile:
              type: Unconfined
            capabilities:
              add: ["SYS_ADMIN"]
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: state
          emptyDir: {}
        - name: repo
          emptyDir: {}
        {{- end }}
        {{- if .Values.anthropic.credentialsKey }}
        # Writable home for claude-code creds/onboarding, seeded by the
        # init container from the anthropic Secret (#4111).
        - name: claude-home
          emptyDir: {}
        - name: anthropic-creds
          secret:
            secretName: {{ .Values.anthropic.secretName }}
            optional: true
        {{- end }}
        {{- if .Values.podman.inPod }}
        - name: fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.persistence.state.size }}
        {{- if .Values.persistence.state.storageClass }}
        storageClassName: {{ .Values.persistence.state.storageClass }}
        {{- end }}
    - metadata:
        name: repo
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.persistence.repo.size }}
        {{- if .Values.persistence.repo.storageClass }}
        storageClassName: {{ .Values.persistence.repo.storageClass }}
        {{- end }}
  {{- end }}
