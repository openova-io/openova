{{- /*
The workspace's own account (AIP-153, AIP-155). The default entry of
agentTokens.callers in bp-catalyst-platform admits the account agenity of every
namespace of an Organization on POST /api/v1/internal/agent-tokens, for that
Organization only and at tier developer at most. Only the workspace runs as it.
It is bound to no role, so its token reaches nothing in the cluster; its token
is not mounted by default, and the StatefulSet projects it into the
tool-identity containers alone.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.toolIdentity.serviceAccount }}
  labels:
    {{- include "agenity.labels" . | nindent 4 }}
automountServiceAccountToken: false
