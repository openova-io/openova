{{- /*
#4553 — when the oidc-gate companion is enabled (the default for a per-Org
install) the gate (templates/oidc-gate.yaml) OWNS the agenity hostname and
carries the bare-root → /app/?token=<sentinel> spaTokenSeed redirect. Two
HTTPRoutes on one hostname is undefined routing, so suppress this route then.
It renders ONLY for a non-gated test install (oidcGate.enabled=false), serving
the host un-gated with the chart's own bare-root → /app/ redirect (pre-#4553).
*/ -}}
{{- if and .Values.httpRoute.enabled (not (include "agenity.gateEnabled" .)) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agenity.fullname" . }}
  labels:
    {{- include "agenity.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name }}
      namespace: {{ .Values.httpRoute.parentRef.namespace }}
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.httpRoute.dashboardRedirect.enabled }}
    # ── Rule 1: bare root → the dashboard SPA (#4122) ──────────────────────
    # The Agenity (chepherd) daemon serves its Astro static build at
    # `--web-dir`: `/` is the upstream MARKETING landing (dist/index.html),
    # while the actual multi-agent chat-to-provision DASHBOARD is the
    # dist/app/index.html SPA at `/app/`. The User opens the bare Org host
    # (https://<app>.<org>.<pool>/) and MUST land on the dashboard — never
    # the marketing page. An EXACT `/` match (not a prefix) redirects ONLY
    # the bare root: every other path (/_astro/* assets, /api/*, /healthz,
    # the WebSocket, /app/* itself) falls through to Rule 2 and is served
    # verbatim by the daemon. statusCode 302 (not 301) keeps the redirect
    # un-cached so a future dashboard-at-root daemon flag can retire this
    # rule cleanly.
    #
    # `port` is pinned (default 443) so the Location header carries the
    # EXTERNAL HTTPS port, not the Gateway listener's internal NodePort
    # (e.g. 31443 behind a cloud ELB) — without it Cilium emits
    # `Location: https://<host>:31443/app/`, which is unreachable through
    # the ELB and hangs the browser (#4122 live finding on omantel.biz).
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: {{ .Values.httpRoute.dashboardRedirect.port }}
            statusCode: {{ .Values.httpRoute.dashboardRedirect.statusCode }}
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ .Values.httpRoute.dashboardRedirect.path | quote }}
    {{- end }}
    {{- if .Values.httpRoute.noCacheHtml }}
    # ── Rule 2a: SPA HTML entry points → daemon, but NEVER browser-cached ──
    # The dashboard JS/CSS under /_astro/* are CONTENT-HASHED (immutable —
    # the filename changes on every rebuild), so they are safe to cache
    # forever. The HTML entry points (`/app/`, `/app/index.html`, bare `/`)
    # are NOT hashed: a browser that cached an OLD /app/index.html keeps
    # referencing the OLD asset hashes and renders the ARCHAIC dashboard
    # even after a fresh image rolls (the omantel.biz #4118 symptom: the
    # served bundle WAS the new #745 build, byte-identical to source, yet the
    # founder's browser served a stale cached index.html — the daemon sets
    # no Cache-Control, so browsers heuristic-cache the HTML). Stamp
    # `Cache-Control: no-cache` on the HTML document so the browser always
    # revalidates the entry point and picks up new asset hashes immediately,
    # while the hashed assets stay long-lived. EXACT matches only — asset and
    # API paths fall through to Rule 2b untouched.
    - matches:
        - path:
            type: Exact
            value: /app/
        - path:
            type: Exact
            value: /app/index.html
        - path:
            type: Exact
            value: /index.html
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: "no-cache, must-revalidate"
      backendRefs:
        - name: {{ include "agenity.fullname" . }}
          port: {{ .Values.service.port }}
    {{- end }}
    # ── Rule 2b: everything else → the daemon (assets, API, /app/*, WS) ────
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "agenity.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
