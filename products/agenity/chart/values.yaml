# bp-agenity — default values
#
# Deploys Agenity as an OpenOva Application into a User's Organization /
# Environment. The User installs this from the catalog; its solo agent
# (Claude Opus 4.7) then creates more Applications in the User's own Org
# via the RBAC-scoped openova MCP server.
#
# Agenity packages the upstream chepherd multi-agent runtime daemon; the
# runtime env-var names (CHEPHERD_*) + CLI (`chepherd run`) below are the
# daemon's own contract and are passed through unchanged.
#
# Inviolable Principle #4: no hardcoded secrets/config in code — every knob
# flows through values → env → the runtime daemon; the Anthropic token
# comes from a Secret (ExternalSecret/openbao), NEVER a literal here.

# Sovereign primary FQDN (e.g. omantel.biz). Used to derive the public
# console URL the openova MCP forwards calls to when openovaMCP.catalystApiUrl
# is empty (#4111). The provisioning/install path stamps this per-Sovereign.
sovereignFqdn: ""

# ── Agenity runtime image (upstream chepherd daemon + openova-mcp) ─────────
image:
  repository: ghcr.io/openova-io/agenity
  tag: ""                 # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# ── Private-registry pull secret (#4111) ──────────────────────────────────
# The agenity image (`ghcr.io/openova-io/agenity`) is a PRIVATE
# ghcr.io/openova-io/* package, so both the seed-claude-creds init container
# and the chepherd main container must pull it WITH credentials. The Sovereign
# emberstack-reflector reflects a `ghcr-pull` dockerconfigjson Secret into
# every per-Org `org-*` / pool namespace, but a reflected Secret is INERT
# unless the Pod spec references it — without this default the StatefulSet
# rendered `imagePullSecrets: []`, the Pod pulled anonymously, ghcr returned
# 401, and the Pod wedged at Init:ImagePullBackOff on a fresh Org (live on the
# omantel.biz demo Org `uatwalk91` namespace, 2026-06-27: pod
# agenity-rtz-a-bp-agenity-0 0/1 Init:ImagePullBackOff while `ghcr-pull` WAS
# reflected into the ns — the missing piece was the pod-spec reference).
# Defaulting to `ghcr-pull` makes both containers reference the already-
# reflected Secret so the private image pulls. An install into a Sovereign
# that mirrors the image into a public/custom registry can override this list.
imagePullSecrets:
  - name: ghcr-pull

# ── Solo-agent profile ────────────────────────────────────────────────────
# chepherd boots with a single solo worker agent the User chats with. The
# journey requires Claude Opus 4.7: `agent.model` is passed to the spawned
# claude-code as `--model`, so the agent runs on Opus 4.7.
agent:
  flavor: claude-code      # the spawned agent CLI flavor
  model: claude-opus-4-7   # NORTH-STAR: the solo agent runs on Claude Opus 4.7
  # Optional system-prompt the solo agent boots with. Empty = chepherd default.
  systemPrompt: ""
  # When true, NO shepherd/supervisor is spawned — a single solo agent only
  # (matches the catalog/solo recipe). The journey is a 1:1 chat with one agent.
  solo: true
  # When true, blank the in-cluster KUBERNETES_SERVICE_HOST/PORT env so the
  # chepherd daemon does NOT auto-select the `operator` (K8s-Job) spawner —
  # which requires an unshipped bp-chepherd-operator (upstream #130) and makes
  # every "+ spawn agent" fail with "operator spawner not yet wired". With it
  # blanked the daemon falls through to the in-pod podman-sidecar→BareExec
  # spawner that forks the agent on the chepherd host directly (#4111). The
  # spawned agent talks to catalyst-api over the PUBLIC console URL, so it
  # needs no in-cluster apiserver access.
  forceLocalSpawner: true

# ── Anthropic API token (the "token already configured" requirement) ──────
# The solo agent authenticates to Anthropic with this token. It is sourced
# from a Kubernetes Secret — sk-ant-... is NEVER written into the chart.
# Two delivery modes:
#   externalSecret.enabled=true (default, production): an ExternalSecret
#     pulls the key from openbao (path `anthropic/<org>`) into the Secret.
#   externalSecret.enabled=false: the operator pre-creates a Secret named
#     `secretName` with key `anthropicApiKey` out-of-band (e.g. sealed-secret).
anthropic:
  secretName: agenity-anthropic-token
  secretKey: anthropicApiKey
  # ── claude-code OAuth credentials (#4111) ───────────────────────────────
  # The spawned claude-code agent authenticates via a FULL credentials.json
  # ({claudeAiOauth:{accessToken,refreshToken,expiresAt,scopes}}), NOT a bare
  # ANTHROPIC_API_KEY — an OAuth token (sk-ant-oat01-…) in ANTHROPIC_API_KEY
  # is rejected by claude-code, and the chepherd spawn path strips
  # ANTHROPIC_API_KEY anyway. chepherd resolves claude-code creds from
  # ~/.claude/.credentials.json on the chepherd host (BareExec) or the vault
  # claude-oauth provider. When credentialsKey is present in the Secret, the
  # chart's init container seeds ~/.claude/.credentials.json from it so the
  # solo agent can call Claude. Empty = key-only mode (only works for a real
  # sk-ant-api03 API key, which the OAuth journey does not use).
  credentialsKey: credentialsJson
  externalSecret:
    enabled: true
    refreshInterval: 1h
    # ClusterSecretStore that fronts the Org's openbao (region1 default).
    secretStoreRef: vault-region1
    secretStoreKind: ClusterSecretStore
    # openbao path + property holding the sk-ant-... token.
    #
    # #4277 — the PRODUCER (catalyst-api seedAnthropicToken) writes this
    # path at Org-create. It lives under the `catalyst/` prefix because
    # that is the ONLY KV sub-tree a Sovereign can WRITE: the catalyst-api
    # holds the `catalyst-api-write` OpenBao policy (secret/{data,metadata}/
    # catalyst/*), whereas the `external-secrets` role `vault-region1`
    # reads with is read-only. A bare `anthropic/token` path has no writer
    # on a Sovereign, so the ExternalSecret stayed SecretSyncedError on
    # every fresh Org. The path is cluster-shared — one seed serves every
    # Org's agenity install.
    remoteKey: catalyst/anthropic/token
    remoteProperty: apiKey
    # openbao property holding the full claude-code credentials.json blob.
    remoteCredentialsProperty: credentialsJson

# ── openova MCP integration ───────────────────────────────────────────────
# The chepherd image bundles the `openova-mcp` binary at /usr/local/bin.
# chepherd injects this MCP-server stanza into EVERY spawned agent's
# .mcp.json via the CHEPHERD_EXTRA_MCP_JSON seam (chepherd #4010), so the
# solo agent's app-creation tools == the User's UI rights, RBAC-scoped to
# the User's Org.
#
# RBAC parity: the openova MCP holds NO privileged token; it forwards the
# caller's session bearer to the live catalyst-api, whose own authz is the
# final word. The bearer is presented per-call by the agent (the chat UI
# supplies the User's session token), so create_application is gated to
# tier-admin-or-higher and pinned to the User's own Org.
openovaMCP:
  enabled: true
  binaryPath: /usr/local/bin/openova-mcp
  # catalyst-api base URL the MCP forwards calls to. The agenity Application
  # runs INSIDE the Org's vCluster, which cannot resolve the host
  # catalyst-api.catalyst-system.svc name (#4111) — the host Service is not
  # mirrored into the vCluster DNS. Use the Sovereign's public console FQDN
  # (the Cilium Gateway routes /api/v1/* to catalyst-api and terminates
  # session auth). Empty = the chart derives https://console.<sovereign-fqdn>
  # from the Sovereign FQDN. Override for a host-namespace (non-vCluster)
  # install where the in-cluster Service name resolves.
  catalystApiUrl: ""
  # tenantHost — the Organization console host (console.<slug>.<pool>) the
  # MCP forwards as X-Tenant-Host on the org-scoped install path
  # (POST /api/v1/org/applications, #4116) so the catalyst-api resolves the
  # caller's OWN Org namespace from the tenant registry. CRITICAL (#4610): the
  # catalyst-api base URL (catalystApiUrl) is the SOVEREIGN host
  # (console.<sovereign-fqdn>, e.g. console.omantel.biz) — the Cilium Gateway
  # routes /api/v1/* there — but that host is NOT a registered TENANT, so if
  # the MCP defaults X-Tenant-Host to the api-URL host the org-scoped install
  # 404s `tenant-not-registered`. This value pins the Org console host
  # instead. Empty → the chart derives it from httpRoute.hostnames[0] (the
  # agenity.<slug>.<pool> host) by swapping the leading `agenity` label for
  # `console`; a non-empty value wins. Falls back to OPENOVA_MCP_TENANT_HOST
  # unset (the MCP then derives from the api-URL host) only when no Org host
  # is resolvable.
  tenantHost: ""
  # Pins the MCP to the Organization context so even a wider token cannot
  # widen the surface beyond the User's Org (defense in depth).
  context: organization
  # Bearer verification mode for the MCP (rs256 against the Sovereign
  # handover signer pubkey). The pubkey MUST match the key catalyst-api
  # SIGNS sessions with (#4114: catalyst-api publishes its runtime signer
  # pubkey to the catalyst-handover-jwt-public Secret, the source of truth).
  #
  # 🛑 The secretKeyRef driven by rs256PubkeySecret is rendered optional:true
  # in the StatefulSet (#4228): the source Secret lives in the host
  # catalyst-system namespace, not the per-Org namespace this Application
  # installs into, so a non-optional ref would block the pod from starting
  # (dashboard AND chat) in an Org install. Absent → the env var is simply
  # unset and the openova-mcp falls back to reading it from its inherited
  # process env (bearer_fallback=true). To pin a real per-Org pubkey, reflect
  # catalyst-handover-jwt-public into the Org ns and override name/key here —
  # never Helm-seed a placeholder value (reflector empty-seed trap).
  verify: rs256
  rs256PubkeySecret:
    name: catalyst-handover-jwt
    key: handover-jwt-public.pem
  # ── Per-call bearer injection (#4111 / #4116 / #4110) ────────────────────
  # The openova MCP needs the User's session bearer per tools/call (via
  # _auth.token or the OPENOVA_MCP_BEARER env). The production seam is the
  # chat UI forwarding the signed-in User's session token into each call;
  # that chepherd-side injection is tracked separately. As an interim, an
  # operator may supply a bearer Secret the chart wires as OPENOVA_MCP_BEARER.
  #
  # 🛑 For an ORG-deployed agenity (the customer's own Organization, e.g. the
  # demo Org on omantel.biz) the bearer MUST be ORG-SCOPED, NOT sovereign-admin:
  #   - tier: "org-admin"  (auth.OrgScopedTier — the top-of-OWN-Org marker)
  #   - org_id / org: "<org-slug>"  (e.g. "demo")
  #   - role: "openova-user"; typ: "session"; iss: <CATALYST_PIN_ISSUER>
  #   - RS256-signed by the Sovereign's handover signer
  #     (/var/lib/catalyst/handover-jwt-private.pem — the SAME key whose pubkey
  #      is in catalyst-handover-jwt/handover-jwt-public.pem, what the MCP
  #      verifies against in rs256 mode).
  # This shape resolves in the openova-mcp to (context=organization, tier=admin,
  # org_id=<org>) — so create_application (MinTier=Admin) is allowed and routes
  # to the own-org POST /api/v1/org/applications path (OrgScopeGuard-allowlisted,
  # #4116), and the #4110 confinement holds (no Sovereign signal in the token).
  # A sovereign-admin bearer (tier=owner / role=sovereign-admin) is WRONG here:
  # the MCP would resolve context=sovereign and create_application falls through
  # to POST /api/v1/sovereigns/{id}/applications, which the #4110 OrgScopeGuard
  # 403s because the MCP also host-scopes the session (X-Tenant-Host) → the
  # "org-scoped-forbidden" wedge this seam exists to avoid.
  #
  # MUST pair with openovaMCP.context=organization (the default below). Empty =
  # rely on per-call _auth.token from the UI seam.
  bearerSecret:
    name: ""
    key: bearer

  # ── Per-Org MCP bearer + verify-pubkey ExternalSecret (#4276 hop 7/7b) ───
  # The PRODUCER side of the OPENOVA_MCP_BEARER + OPENOVA_MCP_RS256_PUBKEY_PEM
  # wiring. The catalyst-api org-pipeline (seedMCPBearer, #4276) mints an
  # Org-scoped Catalyst session JWT (tier=org-admin, org_id=<slug>,
  # role=openova-user, typ=session, RS256-signed by the Sovereign handover
  # signer) AND the matching RS256 verify PUBKEY (PKIX PEM), and writes BOTH
  # to the per-Org OpenBao path `secret/catalyst/agenity/<slug>/mcp-bearer`
  # (properties `bearer` + `pubkeyPem`). With externalSecret.enabled, this
  # chart pulls them into the per-Org K8s Secret `secretName`, and the
  # org-gitops emitter (organization_gitops.go) points
  # openovaMCP.bearerSecret + openovaMCP.rs256PubkeySecret at it so the
  # StatefulSet projects OPENOVA_MCP_BEARER and OPENOVA_MCP_RS256_PUBKEY_PEM.
  #
  # Why bearer + pubkey travel together: the pubkey that VERIFIES the bearer
  # is the public half of the SAME handover signer that MINTED it. Seeding
  # them through one path/ExternalSecret sidesteps the JWK-vs-PEM
  # cross-namespace mismatch (the only published mirror,
  # catalyst-handover-jwt-public in catalyst-system, holds a JWK, while the
  # MCP wants PKIX PEM and lives in the per-Org ns, #4228).
  #
  # Disabled by default (no producer outside a Sovereign Org-pipeline). When
  # enabled, the org-gitops emitter sets remoteKey to the per-Org path.
  mcpBearer:
    secretName: agenity-mcp-bearer
    externalSecret:
      enabled: false
      refreshInterval: 1h
      secretStoreRef: vault-region1
      secretStoreKind: ClusterSecretStore
      # Per-Org OpenBao KV-v2 key — set by the org-gitops emitter to
      # `catalyst/agenity/<slug>/mcp-bearer`.
      remoteKey: ""
      # KV-v2 property names the producer writes (seedMCPBearer).
      remoteBearerProperty: bearer
      remotePubkeyProperty: pubkeyPem
    # K8s Secret keys the StatefulSet's bearerSecret/rs256PubkeySecret read.
    bearerKey: bearer
    pubkeyKey: pubkeyPem

# ── Daemon HTTP auth (browser chat-box trust mode) ────────────────────────
# The chepherd daemon's default auth mode is "local": it mints a bootstrap
# Bearer token and the authMiddleware enforces it on every /api/v1/* path.
# The dashboard SPA's fetch() calls do NOT carry that token (only the SSE
# stream gets it as a ?token= query param), so the browser chat box 401s on
# GET /api/v1/sessions, /teams, /inbox … and the User cannot drive the chat
# hands-on (#4122).
#
# This Agenity Application is already isolated per-Org behind the Cilium
# Gateway + the Org's own host (agenity.<org>.<sovereign-fqdn>), reachable
# only by the signed-in User — so the daemon's own per-request Bearer is
# redundant defense. Setting authMode to a non-{local,oidc} value makes
# chepherd's auth.New() return an error, the daemon logs "server is
# unauthenticated", rs.AuthToken stays empty, and authMiddleware becomes a
# no-op — the browser chat box works with zero 401s. The openova-mcp →
# catalyst-api create_application path is UNAFFECTED (it uses the separate
# RS256 OPENOVA_MCP_BEARER / _auth.token seam, not this daemon token).
daemon:
  # "none" → daemon runs unauthenticated so the in-browser chat box works.
  # Set to "local" to restore the per-request Bearer (chat box then 401s in
  # the browser until the SPA is taught to attach the token). "oidc" requires
  # CHEPHERD_OIDC_ISSUER.
  authMode: none

# ── Service (Agenity web UI + dashboard WS + MCP) ─────────────────────────
service:
  type: ClusterIP
  port: 8080            # Agenity web UI + dashboard WS + MCP HTTP
  metricsPort: 9090     # Prometheus scrape

# ── Zero-click SSO gate (bp-oidc-gate companion, #4553/#4556) ─────────────
# Every per-Org agenity install lands behind a bp-oidc-gate oauth2-proxy that
# brings the agenity host under the Sovereign zero-click SSO contract (fresh
# browser → bare URL → Keycloak sovereign realm, silent via catalyst-pin →
# signed in) AND seeds the SPA bootstrap token so the User lands on the
# workspace with NO paste prompt.
#
# WHY this lives in the bp-agenity chart (not a hand-created live instance):
# the agnstar North-Star walk (#4553) hand-created a drift-disabled
# `oidc-gate-agenity-agnstar` HelmRelease, so a fresh agenity Org or a re-prov
# got NO gate (the host served the dashboard un-gated, anyone reaching it saw
# it). Templating the gate AS PART OF the agenity install makes EVERY per-Org
# agenity install automatically get its companion gate — chart-managed, drift
# detected, zero hand-creation.
#
# The companion renders the SAME proven resource set as a bp-oidc-gate
# instances[] entry (#3374): a gate-local cookie Secret, an AppRegistration
# ConfigMap (bp-sso-bridge mints/adopts the KC client + publishes the live
# secret to OpenBao sso/<realm>/<clientId>), an ExternalSecret pulling that
# client secret, the oauth2-proxy Deployment (the WALKED hubble-ui arg set),
# a Service, an HTTPRoute that OWNS the agenity hostname with the spaTokenSeed
# bare-root redirect, and a CiliumNetworkPolicy admitting the gateway entity to
# the gate pod. The gate's upstream is the agenity Service.
#
# When enabled, the agenity chart's OWN HTTPRoute (templates/httproute.yaml)
# is SUPPRESSED — two HTTPRoutes on one hostname is undefined routing; the gate
# owns the host and the spaTokenSeed redirect replaces the chart's bare-root →
# /app/ redirect. The agenity pod stays reachable ONLY via the gate (its own
# CNP still admits the gateway entity, but the gate proxies all traffic, so the
# gate is the single ingress door).
oidcGate:
  # true (default) → render the oidc-gate companion in front of the agenity
  # host and suppress the chart's own HTTPRoute. Set false for a non-SSO test
  # install (the chart's own bare-root → /app/ HTTPRoute then serves the host
  # un-gated, the pre-#4553 shape). Auto-no-ops on a clusterless render if
  # neither hostnames nor sovereignFqdn is set (fail-closed, Inviolable #4).
  enabled: true
  # KC client id the gate registers (sovereign realm). Empty → derived
  # `agenity-<orgSlug>` from the gate hostname's first label's parent, falling
  # back to `agenity-gate`. The org-gitops emitter pins it explicitly to
  # `agenity-<slug>` so each Org gets a distinct client (matches the live
  # agnstar instance `agenity-agnstar`).
  clientId: ""
  # oauth2-proxy image (rendered <registryMirror>/<repository>:<tag>, matching
  # the harbor-proxy-pull `*/proxy-*/*` glob — same as bp-oidc-gate).
  image:
    registryMirror: harbor.openova.io
    repository: proxy-quay/oauth2-proxy/oauth2-proxy
    tag: v7.6.0
    pullPolicy: IfNotPresent
  # Keycloak realm the gated client lives in (the Sovereign shared realm).
  realm: sovereign
  # In-cluster Keycloak base URL for the BACKCHANNEL OIDC legs (#3844): the
  # gate SKIPS discovery against the public issuer EIP (unhairpinnable from
  # inside the cluster on Huawei/kom4dc → CrashLoop) and dials the in-cluster
  # keycloak Service for redeem/jwks/userinfo, keeping the browser-facing
  # login/redirect URLs public. Empty → restore public-discovery behaviour.
  keycloakInternalURL: "http://keycloak.keycloak.svc.cluster.local"
  # ClusterSecretStore the gate's client-secret ExternalSecret resolves through.
  externalSecretStoreName: vault-region1
  refreshInterval: 1h
  # ── Egress targets for the gate's CiliumNetworkPolicy (#5617) ────────────
  # The per-Org namespace is default-deny, and the gate used to ship an
  # INGRESS-only CNP — so its DNS lookups and the Keycloak token-exchange dial
  # were dropped and every OAuth callback 500'd after a successful login
  # (live on hw292 Org uatco: `lookup keycloak.keycloak.svc.cluster.local on
  # 10.96.0.10:53: i/o timeout`, oauthproxy.go:881). These knobs point the
  # egress CNP at the Keycloak backchannel; keep them in lockstep with
  # keycloakInternalURL above (namespace + Service port of that URL).
  networkPolicy:
    # Namespace the in-cluster Keycloak Service lives in.
    keycloakNamespace: keycloak
    # Keycloak SERVICE port (the port in keycloakInternalURL; no port = 80).
    # The template additionally always allows the Pod target port 8080 — under
    # Cilium the policy verdict runs AFTER the Service DNAT, so the Pod port is
    # the load-bearing one (the #4437 port trap: allowing only 80 drops it).
    keycloakPort: 80
  # The SPA bootstrap-token seed (#4556): 302 the bare root, AFTER the full KC
  # SSO, to `<dashboardPath>?token=<value>` so the agenity `/app/` SPA seeds
  # localStorage and lands authenticated with NO paste. value is a SENTINEL
  # (the daemon runs authMode=none, so it is never verified — it only satisfies
  # the SPA's localStorage presence-check). VERIFIED live on agnstar (#4556).
  spaTokenSeed:
    dashboardPath: /app/
    value: sso
    port: 443
  # requests == limits (Guaranteed QoS, 1:1 ratio) — REQUIRED for a per-Org
  # install. The per-Org namespace carries the plan `plan-limits` LimitRange
  # with maxLimitRequestRatio cpu:1/memory:1 (the Sovereign sells Guaranteed
  # quota), so a Burstable gate spec (e.g. cpu 10m->100m = 10:1) is REJECTED at
  # pod admission: `max limit to request ratio per Container is 1, but provided
  # ratio is N` → the gate Deployment's ReplicaSet FailedCreate and the gate
  # never serves (live on the agnstar Org 2026-06-27, same trap the agenity
  # StatefulSet hit in #4362). 1:1 keeps the oauth2-proxy admissible and is
  # plenty for a single-Org auth proxy.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 50m
      memory: 64Mi

# ── HTTPRoute (Cilium Gateway) — the User reaches the Agenity console ──────
# When oidcGate.enabled (the default), the bp-oidc-gate companion OWNS the
# agenity hostname and this HTTPRoute is suppressed (two routes on one host is
# undefined routing). It renders only for a non-gated test install
# (oidcGate.enabled=false).
httpRoute:
  enabled: true
  hostnames: []         # default: discovered from the Org/Sovereign FQDN
  # The per-Org agenity host (agenity.<slug>.<pool>) is a CUSTOMER host, so it
  # lands on the Sovereign's CONSOLE gateway (cilium-gateway-console in
  # kube-system) — the dedicated console-ELB EIP that owns every *.{<pool>}
  # listener (#4054 console-isolation; the same gateway bp-wordpress-tenant /
  # the org console route attach to). The cilium-ingress-networkpolicy.yaml
  # CNP comment in this chart already names cilium-gateway-console as the
  # attach point; this default now matches it. There is NO `catalyst-gateway`
  # on a Catalyst Sovereign — the old default attached to a non-existent
  # Gateway, so the route was Accepted=False/InvalidHTTPRoute and the host
  # 404'd until the parentRef was hand-overridden (agnstar North-Star walk,
  # #4553). Override per-install only for a non-isolated single-gateway test
  # cluster.
  parentRef:
    name: cilium-gateway-console
    namespace: kube-system
  # Stamp Cache-Control: no-cache on the SPA HTML entry points (/app/, /,
  # index.html) so a browser ALWAYS revalidates the document and picks up
  # newly-rolled content-hashed assets. Without it the daemon sets no
  # Cache-Control header, browsers heuristic-cache the HTML, and a User who
  # opened the dashboard before a fresh image rolled keeps rendering the OLD
  # (archaic) dashboard from cache even though the pod serves the new build
  # (the #4118 omantel.biz symptom). The hashed /_astro/* assets are
  # untouched (immutable, safe to cache forever). Disable only if a CDN in
  # front already manages document caching.
  noCacheHtml: true
  # Bare-root → dashboard redirect (#4122). The chepherd daemon serves its
  # upstream MARKETING landing at `/` and the real chat-to-provision
  # DASHBOARD SPA at `/app/`. The User opens the bare Org host, so the route
  # redirects EXACT `/` to the dashboard; all other paths (assets, /api,
  # /healthz, WS, /app/*) pass through untouched. Disable only if a future
  # daemon build serves the dashboard at root itself.
  dashboardRedirect:
    enabled: true
    path: /app/         # the dashboard SPA path the daemon serves
    statusCode: 302     # un-cached temporary redirect
    # External HTTPS port for the Location header. MUST be the public port
    # (443), never the Gateway listener NodePort (e.g. 31443) — a NodePort
    # in Location is unreachable behind a cloud ELB and hangs the browser.
    port: 443

# ── NetworkPolicy (Cilium Gateway ingress carve-out) ──────────────────────
# The HTTPRoute alone routes `agenity.<slug>.<pool>` to this Service, but on
# a Cilium Sovereign the gateway traffic arrives with the reserved `ingress`
# ENTITY identity that NO K8s NetworkPolicy selector can match — so without a
# CiliumNetworkPolicy fromEntities:[ingress] the gateway→agenity hop is
# default-denied and the browser sees envoy 503 "upstream connect error ...
# connection timeout" (the #4180 / #3785 / #3374 failure class). This block
# drives templates/cilium-ingress-networkpolicy.yaml, which is ADDITIVE
# (unions with any K8s NetworkPolicy) and gated on the cilium.io/v2
# Capabilities check so the chart still renders on a CRD-less kind cluster.
networkPolicy:
  enabled: true
  ingress:
    # allowGatewayEntity → emit the CiliumNetworkPolicy that admits the
    # reserved `ingress` entity (the Cilium Gateway Envoy) to service.port.
    # Disable only on a non-Cilium overlay that fronts agenity differently.
    allowGatewayEntity: true
  # ── External-HTTPS egress (#4604) ────────────────────────────────────────
  # The solo agent (claude-code) calls api.anthropic.com and the openova-mcp
  # child forwards create_application to the public Sovereign console — both
  # off-cluster :443 hops to an external EIP no K8s selector can name. On a
  # Cilium Sovereign that needs a CiliumNetworkPolicy `toEntities:[world]:443`
  # egress carve-out (templates/cilium-egress-networkpolicy.yaml). DEFAULT-ON
  # for the agentic app: without it a fresh Org / re-prov silently loses
  # Anthropic + catalyst-api reachability (the nstar2 North-Star walk only
  # worked after a hand-applied stopgap CNP — this makes it chart-durable).
  egress:
    # allowExternalHttps → emit the egress CNP (world:443 + DNS preserved).
    # Disable only on an air-gapped Sovereign that mirrors Anthropic + the
    # console behind an in-cluster proxy the agent reaches without world egress.
    allowExternalHttps: true
    # External HTTPS port for both the Anthropic + console hops (443).
    httpsPort: 443

# ── Persistence — chepherd runtime state + per-agent repo/cache ───────────
# CSI-backed PVCs. storageClass empty = the cluster's default CSI class.
# NEVER local-path (#3971): leaving storageClass empty resolves to the
# per-provider CSI default the platform installs.
persistence:
  enabled: true
  state:
    size: 5Gi
    storageClass: ""    # "" = cluster default CSI class (NEVER local-path)
  repo:
    size: 10Gi
    storageClass: ""

# ── Resources ─────────────────────────────────────────────────────────────
# chepherd itself is a light coordinator; the per-agent claude REPLs are the
# heavy users and run as sidecar/podman children inside the pod.
#
# requests == limits (Guaranteed QoS, 1:1 ratio). A per-Org namespace carries
# the plan `plan-limits` LimitRange with maxLimitRequestRatio cpu:1/memory:1
# (the Sovereign sells Guaranteed quota — every reserved vCPU/GB is committed),
# so a Burstable spec (e.g. cpu 200m->2 = 10:1, memory 512Mi->4Gi = 8:1) is
# REJECTED at pod admission: `max limit to request ratio per Container is 1,
# but provided ratio is N` → the StatefulSet never creates a Pod and the
# Application wedges Provisioning (live on the omantel.biz demo Org post-#4325
# de-vcluster, when agenity moved host-native into the Org namespace under the
# plan LimitRange). Pinning requests == limits keeps the pod admissible AND
# right-sizes the singleton dashboard + one solo claude REPL.
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "1"
    memory: 2Gi

# ── Pod security / scheduling ─────────────────────────────────────────────
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Run the daemon + the forked claude-code agents as the SAME non-root uid so the
# agent can read the per-session .mcp.json the daemon writes (#4111). chepherd
# forks agents as uid 1000 (the "chepherd" user); pinning the pod there avoids
# the root-owned-0700 session-dir EACCES that otherwise kills every spawn.
# fsGroup makes the CSI state/repo PVCs group-writable for the non-root daemon.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# rootless podman-in-pod needs /dev/fuse + relaxed seccomp; gated so a
# locked-down cluster can disable the in-pod spawner and use an external one.
podman:
  inPod: true
