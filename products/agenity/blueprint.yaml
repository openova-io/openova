apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-agenity
  labels:
    catalyst.openova.io/category: ai-runtime
    catalyst.openova.io/section: pts-7-org-tenant
spec:
  # 0.5.16 (#4553): the oidc-gate companion's default resources are now
  # requests == limits (Guaranteed QoS) so the gate pod is admissible under the
  # per-Org plan-limits LimitRange (cpu:1/mem:1 ratio) — the prior Burstable
  # spec was rejected, no gate pod, no SSO (live on agnstar). Lockstep with
  # products/agenity/chart/Chart.yaml + the catalog-seed pin.
  # 0.5.17 (#4604): chart adds a default-on external-HTTPS egress CNP +
  # seeds the openova MCP into ~/.claude.json for a standalone claude (durable
  # Pillar-4 North-Star wiring). Lockstep with products/agenity/chart.
  version: 0.5.21
  card:
    title: Agenity
    summary: |
      Your AI engineering team — a multi-agent runtime + dashboard you
      install into your own Organization. Chat with the built-in solo
      agent (Claude Opus 4.7, token pre-configured); it creates and
      manages Applications in YOUR Organization on your behalf through the
      OpenOva MCP, scoped to exactly what you can do in the console.
    icon: agenity.svg
    category: ai-runtime
    family: agent-runtime
    tags: [agenity, agent, multi-agent, claude, opus, mcp, self-service]
    documentation: https://github.com/openova-io/openova
    license: MIT
  visibility: listed
  owner:
    team: ai-platform
    contact: ai-platform@openova.io
  configSchema:
    type: object
    properties:
      agent:
        type: object
        description: The solo agent the User chats with.
        properties:
          model:
            type: string
            default: claude-opus-4-7
            description: |
              The Claude model the solo agent runs on. The north-star
              journey ships Claude Opus 4.7 ("token already configured").
            enum:
              - claude-opus-4-7
              - claude-opus-4-8
              - claude-sonnet-4-6
          solo:
            type: boolean
            default: true
            description: |
              true = a single solo agent (no shepherd/supervisor) — the
              1:1 chat journey. false = also spawn a shepherd watcher.
          systemPrompt:
            type: string
            default: ""
            description: Optional system prompt the solo agent boots with.
      anthropic:
        type: object
        description: |
          Anthropic API token wiring. The token is read from a Kubernetes
          Secret (ExternalSecret/openbao by default) — never entered here.
        properties:
          secretName:
            type: string
            default: agenity-anthropic-token
          externalSecret:
            type: object
            properties:
              enabled:
                type: boolean
                default: true
                description: |
                  true = pull the sk-ant-... token from the Org's openbao
                  via an ExternalSecret. false = the operator pre-creates
                  the Secret out-of-band (e.g. a sealed-secret).
      openovaMCP:
        type: object
        description: |
          Wires the solo agent to the OpenOva MCP server so it can create
          Applications in the User's own Organization, RBAC-scoped to the
          User's rights (the MCP forwards the caller's session bearer to
          the live catalyst-api; the endpoint's authz is the final word).
        properties:
          enabled:
            type: boolean
            default: true
          context:
            type: string
            enum: [organization, sovereign]
            default: organization
            description: |
              Pins the MCP to the Organization context so the agent can
              only act within the User's own Org (defense in depth).
      persistence:
        type: object
        properties:
          enabled:
            type: boolean
            default: true
          state:
            type: object
            properties:
              size:
                type: string
                default: 5Gi
            description: |
              Agenity runtime state PVC. Backed by the cluster's default
              CSI StorageClass — local-path is forbidden (#3971).
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: ./chart
    helmRelease:
      # disableWait — do NOT block the helm install on workload (pod)
      # readiness. The agenity image (chepherd + claude-code + node runtime,
      # appVersion 0.9.7) is large and cold-pulls slowly on a fresh Org node;
      # with Flux's default --wait the install burns its timeout waiting for
      # the Pod, then helm-controller UNINSTALLS the release (deleting the
      # StatefulSet + Pod) and retries — restarting the image pull from zero
      # every cycle, so the Pod never converges (live on the omantel.biz demo
      # Org post-#4325, #4362). disableWait lets the release reach Released so
      # the StatefulSet survives and the Pod finishes pulling on its own
      # schedule. The dashboard SPA has zero dependsOn (it must serve while
      # keycloak/cnpg converge), so nothing downstream needs the readiness gate.
      disableWait: true
  depends:
    - blueprint: bp-external-secrets
      version: ^1.0
      alias: eso
  upgrades:
    from: ["0.x"]
  observability:
    metrics: prometheus
    logs: stdout
  topology:
    supported:
      - singleton
    defaults:
      # Agenity is a region-pinned singleton coordinator/agent console — it
      # does not replicate across regions, so both BCP defaults resolve to the
      # single in-region instance (schema requires both keys; G116).
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          # #4325 de-vclustered the platform planes (mgmt/rtz/dmz → native
          # host namespaces) and removed the `rtz` plane vCluster. A per-Org
          # agentic dashboard is NOT a platform-plane workload — it lands on
          # the HOST in its own Org namespace (#4297 keystone). tier MUST be
          # '' (host-native, no vCluster pivot); a non-empty tier resolves
          # through the controller's VClusterPlacements and the rendered HR
          # is upserted into the removed `rtz` namespace → `namespaces "rtz"
          # not found` (Degraded). The `rtz-A` cluster ID is the
          # region-cluster designator (kept for the region pin), NOT a
          # vCluster name.
          tier: ''
          clusters:
            - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
    - name: console
      hostnameTemplate: agenity.{{.OrgSlug}}.{{.SovereignFQDN}}
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
  sso:
    realm: '{{.OrgSlug}}'
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  multiInstance:
    enabled: false
