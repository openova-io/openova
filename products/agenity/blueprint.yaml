apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-agenity
  labels:
    catalyst.openova.io/category: ai-runtime
    catalyst.openova.io/section: pts-7-org-tenant
spec:
  # 0.5.16 (#4553): the oidc-gate companion's default resources are now
  # requests == limits (Guaranteed QoS) so the gate pod is admissible under the
  # per-Org plan-limits LimitRange (cpu:1/mem:1 ratio) — the prior Burstable
  # spec was rejected, no gate pod, no SSO (live on agnstar). Lockstep with
  # products/agenity/chart/Chart.yaml + the catalog-seed pin.
  # 0.5.17 (#4604): chart adds a default-on external-HTTPS egress CNP +
  # seeds the openova MCP into ~/.claude.json for a standalone claude (durable
  # Pillar-4 North-Star wiring). Lockstep with products/agenity/chart.
  # 0.5.22 (#5617): the oidc-gate companion gains its egress CNP (kube-dns +
  # Keycloak backchannel + upstream) — the per-Org namespace is default-deny
  # and the gate's ingress-only CNP left the OAuth callback 500ing on a DNS
  # timeout. Lockstep with products/agenity/chart + the catalog-seed pin.
  # 0.5.32 (#6513): the creds-resync sidecar gains a liveness + readiness probe
  # so the StatefulSet passes the kyverno probes-present policy — 0.5.31 shipped
  # it probe-less and every per-Org install was DENIED at admission (proven live
  # hw302). Lockstep with products/agenity/chart/Chart.yaml + the catalog-seed pin.
  # 0.5.33 (#6723 lane C): registers Agenity's Sovereign-console sidebar entry via
  # spec.consoleUI (below) — no chart-template change; the bump exists because the
  # published artifact packages this file. Lockstep with products/agenity/chart/
  # Chart.yaml + the catalog-seed card and source pins + the funnel pin.
  # 0.5.34 (#6374): the numeric credentialWait / credentialResync knobs resolve by
  # key presence — an explicit 0 no longer renders as the default (300/5/120).
  # Lockstep with products/agenity/chart/Chart.yaml + the catalog-seed pins +
  # the funnel pin.
  version: 0.5.34
  # EPIC #6723 lane C (founder 2026-08-31: "the left menu or sub-menus of the
  # sovereign console can be connected to the respective applications, like
  # Agenity"). Agenity is the first Blueprint that registers its own
  # Sovereign-console sidebar entry through the Wave 5.69 (#2370) consoleUI
  # contract: the console's former static "Agenity" row (SovereignSidebar.tsx
  # FLAT_NAV `sandbox`) is gone and THIS block is what the rail renders, merged
  # with the sovereign-admin's per-Sovereign overrides from Settings → Menu
  # (ConfigMap catalyst-system/console-ui-sidebar: rename / re-route / re-order /
  # nest under a top-level item / hide). The icon is the same terminal glyph the
  # static row used. Lockstep with the catalog-seed card in
  # products/catalyst/chart/templates/catalog-seed/blueprints.yaml.
  consoleUI:
    sidebarEntry: true
    sidebarLabel: Agenity
    sidebarRoute: /apps/bp-agenity/dashboard
    sidebarOrder: 40
    sidebarIcon: 'M3 4a1 1 0 011-1h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm5 5l3 3-3 3m5 0h4M8 21h8'
  card:
    title: Agenity
    category: ai-runtime
    family: agent-runtime
    summary: Your AI engineering team — chat with a built-in solo agent (Claude Opus 4.7) that creates Applications in your Organization for you.
    description: Install Agenity into your Organization and chat with its solo agent (Claude Opus 4.7, token pre-configured). The agent reaches the OpenOva MCP — scoped to exactly what you can do in the console — to create and manage Applications in YOUR Organization on your behalf.
    icon: agenity.svg
    license: MIT
    tags: [agenity, agent, multi-agent, claude, opus, mcp, self-service]
    docs: https://github.com/openova-io/openova
  visibility: listed
  owner:
    team: ai-platform
    contact: ai-platform@openova.io
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-agenity
    helmRelease:
      disableWait: true
  upgrades:
    from: ["0.x"]
  observability:
    metrics: prometheus
    logs: stdout
  topology:
    supported:
      - singleton
    defaults:
      # Agenity is a region-pinned singleton coordinator/agent console — it
      # does not replicate across regions, so both BCP defaults resolve to the
      # single in-region instance (schema requires both keys; G116).
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          # #4325 de-vclustered the platform planes (mgmt/rtz/dmz → native
          # host namespaces) and removed the `rtz` plane vCluster. A per-Org
          # agentic dashboard is NOT a platform-plane workload — it lands on
          # the HOST in its own Org namespace (#4297 keystone). tier MUST be
          # '' (host-native, no vCluster pivot); a non-empty tier resolves
          # through the controller's VClusterPlacements and the rendered HR
          # is upserted into the removed `rtz` namespace → `namespaces "rtz"
          # not found` (Degraded). The `rtz-A` cluster ID is the
          # region-cluster designator (kept for the region pin), NOT a
          # vCluster name.
          tier: ''
          clusters:
            - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
    - name: console
      hostnameTemplate: agenity.{{.OrgDomain}}
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
  sso:
    realm: '{{.OrgSlug}}'
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  multiInstance:
    enabled: false
