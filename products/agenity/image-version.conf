# What the agenity image is built from, read by
# scripts/check-appversion-bumped-with-source.sh (Refs #7938). The image embeds
# the openova-mcp binary (which imports the shared auth module) and the agenity
# source at the pinned AGENITY_REF, so a change of any of them must bump the
# appVersion in chart/Chart.yaml, or it is never published.
sources: products/agenity products/openova-mcp core/services/shared/auth
pins: .github/workflows/agenity-build.yaml:AGENITY_REF
