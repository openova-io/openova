{{- /*
Dedicated ServiceAccount with ZERO RBAC — deliberately. The renderer talks to
nothing: no Kubernetes API, no database, no external endpoint. There is no
Role and no RoleBinding in this chart, and there should never be one; if a
future change needs cluster state, that change belongs in the BSS, which
already has the credentials for it.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "docrender.serviceAccountName" . }}
  labels:
    {{- include "docrender.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
