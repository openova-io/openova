# bp-chargeback — default values (EPIC #6723, ADR-0014).
#
# Inviolable Principle #4: no hardcoded secrets. The database DSN is
# composed at runtime from CNPG's own `<cluster>-app` Secret by the
# post-install sync Job; the APP_ENCRYPTION_KEY is generated once by the
# pre-install key Job and never rendered by Helm. Nothing sensitive is a
# literal here.

# Sovereign primary FQDN (e.g. hw305.omani.works). The bootstrap-kit slot
# stamps ${SOVEREIGN_FQDN}. Derives the HTTPRoute host chargeback.<fqdn>
# and the default PUBLIC_URL (https://chargeback.<fqdn>).
sovereignFqdn: ""

# ── Image ───────────────────────────────────────────────────────────────
# Built by .github/workflows/build-chargeback.yaml; the tag defaults to
# .Chart.AppVersion. Plain image repo per the #4706 lesson — never the
# bp-chargeback chart OCI repo.
image:
  repository: ghcr.io/openova-io/chargeback
  tag: ""                 # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Cutover step-07 image-registry pivot seam (#4885/#4892): when the
# post-handover cutover pivots the Sovereign onto its local Harbor it
# patches global.imageRegistry and the image helper re-prefixes every
# repository with it. Empty = verbatim upstream (byte-identical pre-cutover).
global:
  imageRegistry: ""

# ghcr.io/openova-io/* packages are PRIVATE — the reflected `ghcr-pull`
# dockerconfigjson Secret must be REFERENCED by the pod spec (#4111).
imagePullSecrets:
  - name: ghcr-pull

# Two stateless replicas by default: the collector and rater are
# idempotent on (source, resource, sku, window_start) (spec §3) and the
# session/PIN state lives in Postgres, so either replica can serve any
# request. strategy below keeps a 1-replica override rollable (#6079).
replicaCount: 2

# ── Application configuration (spec §6 env) ─────────────────────────────
config:
  # OPERATOR_EMAILS — comma-separated; a PIN sign-in from one of these
  # addresses gets the operator role (spec §4 auth). Empty = no operator.
  operatorEmails: ""
  # PUBLIC_URL — used in invite links and mail. Empty = derived
  # https://chargeback.<sovereignFqdn> (or "" when no FQDN is known).
  publicUrl: ""
  # HUAWEI_ENDPOINT_TEMPLATE — printf pattern (svc, region) for the HCSO
  # Kom4DC endpoints (spec §3).
  huaweiEndpointTemplate: "https://%s.%s.kom4dc.nationalcloud.om"
  # HUAWEI_INSECURE_TLS — the on-prem CA is not in the distroless bundle.
  huaweiInsecureTls: true
  # COLLECT_INTERVAL / CTS_POLL_INTERVAL — Go duration strings (spec §3).
  collectInterval: 15m
  ctsPollInterval: 5m
  # PROFILE — sovereign | operator-central (spec §6; Phase 0 only affects
  # the /auth/me payload and the UI banner).
  profile: sovereign
  # LISTEN_ADDR — must agree with service.port (the container port `http`).
  listenAddr: ":8080"

# ── Optional SMTP (spec §6 SMTP_HOST/PORT/USER/PASS/FROM) ────────────────
# Name of a pre-created Secret whose keys are the SMTP_* env names. Empty =
# dev mode: the binary logs the PIN / invite URL instead of mailing them.
# Referenced with optional:true so the chart schedules either way.
smtp:
  existingSecret: ""
  # TCP port of the submission host named in that Secret's SMTP_PORT. The
  # binary reads the port from the Secret; the chart cannot, so this value
  # is what the egress CiliumNetworkPolicy opens toward `world` whenever
  # existingSecret is set (hw307: mail on 587 timed out behind a policy that
  # only allowed 443/8080/5432 — statements, budget alerts and reports were
  # all silently undeliverable). Keep the two in step.
  port: 587

# ── APP_ENCRYPTION_KEY (spec §1 credentials envelope) ────────────────────
# Generated ONCE by templates/app-key-job.yaml (pre-install hook,
# create-if-absent, never regenerated — rotating it would orphan every
# stored AK/SK envelope). Empty name = <fullname>-app-key.
encryptionKey:
  secretName: ""
  key: APP_ENCRYPTION_KEY

# ── Database (private CNPG Cluster, platform/newapi pattern A) ───────────
cnpg:
  enabled: true
  database: chargeback
  # DATABASE_URL placeholder Secret name. Empty = <fullname>-db-dsn.
  dsnSecretName: ""
  sslMode: require
  cluster:
    instances: 1
    imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql:16.4
    storage: 5Gi
    # Empty = the Sovereign's default (durable cloud CSI) StorageClass.
    # local-path is FORBIDDEN (#3971).
    storageClassName: ""
    owner: chargeback
    # Copied verbatim by the CNPG operator onto the postgres container of
    # every instance Pod it creates from this spec — which is where the
    # Sovereign's Kyverno `resource-requests` (Enforce) and `resource-limits`
    # (Audit) policies look. hw307 2026-09-11: Pod/chargeback-pg-1 was
    # BestEffort (`requests-pod` fail) because this was `{}`. Requests size
    # the ledger's steady state; the limits leave the rater's month-end
    # statement pass headroom. Changing them rolls the instance.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    affinity: {}
  # Init-container gate: the binary applies migrations at startup (spec §1)
  # so it must not start on the empty placeholder DSN. Polls the mounted
  # Secret file until the sync Job has populated it.
  dsnGate:
    image: harbor.openova.io/proxy-dockerhub/curlimages/curl:8.10.1
    timeoutSeconds: 600

# ── Service (ClusterIP — NEVER NodePort, §854) ───────────────────────────
service:
  type: ClusterIP
  port: 8080

# ── HTTPRoute (Cilium Gateway — the ONLY external door) ──────────────────
# ── Sovereign SSO (#6841) ─────────────────────────────────────────────────
# When the app sits behind bp-oidc-gate (slot 13c), the gate has already
# authenticated the browser against the Keycloak sovereign realm and passes
# the verified address upstream. Naming that header here makes chargeback
# accept it INSTEAD of prompting for its own PIN — the zero-click contract of
# docs/SECURITY.md §6. Empty (default) = off and the header is ignored.
#
# The header is trusted WITHOUT verification, so it is only safe when the app
# cannot be reached except through the gate. Setting this while httpRoute is
# also enabled would leave a public door that bypasses the gate and accepts a
# spoofed identity — the chart REFUSES to render that combination.
forwardAuth:
  header: ""
  # Cilium endpoint selector for the gate allowed to reach the app when
  # `header` is set. With a trusted header, ANY pod that can open a socket to
  # the Service could otherwise set it and assume any identity — including the
  # operator's — so networkPolicy.ingress.allowClusterEntity is refused while
  # forwardAuth is on, and only these endpoints are admitted.
  fromEndpointSelector:
    app.kubernetes.io/name: bp-oidc-gate
  fromNamespace: oidc-gate

httpRoute:
  enabled: true
  # Empty → derived chargeback.<sovereignFqdn>. No hostname resolvable →
  # the route renders NOTHING (fail-closed, Inviolable #4).
  hostnames: []
  # The Sovereign host rides the canonical kube-system/cilium-gateway. A
  # per-Org install (chargeback.<slug>.<pool>) overrides to the console
  # gateway (cilium-gateway-console, #4054) via its install values.
  parentRef:
    name: cilium-gateway
    namespace: kube-system

# ── Network policy (Cilium) ──────────────────────────────────────────────
# Rendered only when the cilium.io/v2 CRD is present. Gateway traffic
# reaches the pod as the reserved `ingress` ENTITY (#4180) — the CNP
# fromEntities carve-out is the canonical admit.
networkPolicy:
  enabled: true
  ingress:
    allowGatewayEntity: true
    allowClusterEntity: true
  egress:
    # world:443 — the Huawei HCSO endpoints (spec §3) + PUBLIC_URL self
    # checks; cluster/host/remote-node:443/8080/5432 — CNPG in this
    # namespace, the catalyst-api adapter (lane D) and any in-cluster hop.
    # DNS to kube-dns is LOAD-BEARING (#4604 / #5617).
    enabled: true
    allowExternalHttps: true
    httpsPort: 443
    # Extra TCP ports to open toward the same entity set — e.g. 587 when
    # smtp.existingSecret points at an external submission host.
    extraPorts: []

# ── ServiceAccount ────────────────────────────────────────────────────────
# Phase 0 reads NOTHING from the Kubernetes API (the platform collector's
# informers are lane D), so the pod's ServiceAccount carries ZERO RBAC and
# no token mount. The two hook Jobs use their own scoped SAs.
serviceAccount:
  create: true
  name: ""

# ── OpenOva adapter (ADR-0014 D5, lane D) ───────────────────────────────
# When enabled the binary syncs Organizations as customers and runs the
# in-cluster platform collector, so it needs a read-only ClusterRole and a
# mounted ServiceAccount token. Default OFF: the standalone/operator-central
# profiles never touch the cluster. `Decide()` still gates at runtime.
adapter:
  enabled: false
  # ADAPTER_ENABLED env override (empty = follow profile + in-cluster).
  billingHook:
    # BILLING_HOOK_URL — post issued real-billing statement totals to the
    # catalyst billing service (D6). Empty = hook off.
    url: ""
    # Name of a Secret with key BILLING_HOOK_TOKEN. Empty = no hook auth.
    tokenSecret: ""
    # Name of a Secret with key BILLING_HOOK_CALLBACK_SECRET — the shared
    # secret the billing service signs its payment callbacks with
    # (POST /api/v1/gateways/stripe/callback, DESIGN.md §9.2). Empty = the
    # binary refuses every callback for the stripe gateway; on a Sovereign
    # that means a gateway payment never reaches the customer's account.
    callbackSecret: ""

# ── Platform enforcement (DESIGN.md §9.6, EPIC #6867) ────────────────────
# Where a collections escalation, a prepaid balance at zero, an operator
# decision or the external billing system's command becomes a suspended
# Organization AT THE PLATFORM: chargeback POSTs the Sovereign's sovereign-
# admin API (/api/v1/internal/organizations/{slug}/suspend | /resume), which
# stamps spec.suspended on the Organization CR, and the org-controller parks
# the per-Org Flux Kustomizations. Empty url = enforcement records only: the
# customer flips here, the audit says "not executed at the platform" (Nop).
#
# The bearer is a PROJECTED ServiceAccount token (never a literal): when url
# is set the Deployment mounts a serviceAccountToken projection at
# /var/run/secrets/platform-api/token (expirationSeconds 3600; the kubelet
# rotates it and the binary re-reads the file on every call) and sets
# PLATFORM_API_BEARER_FILE to that path (the name was PLATFORM_API_TOKEN_FILE
# through chart 0.1.32: a path is not a secret, but the Sovereign's Kyverno
# `secret-not-in-env` policy flags any env whose NAME matches
# `(?i)(PASSWORD|TOKEN|KEY|SECRET)` and carries a literal `value:`; the
# binary still reads the old name as a deprecated alias for one release).
# The sovereign-admin API verifies it
# with a TokenReview and admits system:serviceaccount:<namespace>:<sa> — the
# Sovereign slot's release is `chargeback` in namespace `chargeback`, which
# is the API's default allow-list entry.
platformApi:
  # URL of the Sovereign's sovereign-admin API for suspend/resume on command
  # (DESIGN.md §9.6). Empty = enforcement records only (Nop). The Sovereign
  # slot sets http://catalyst-api.catalyst-system.svc.cluster.local:8080 —
  # the in-cluster catalyst-api Service, the same one the cutover
  # auto-trigger dials.
  url: ""
  # Audience of the projected ServiceAccount token presented as the bearer;
  # must match what the API's TokenReview expects. The API reviews the token
  # with NO audience set, i.e. the apiserver's default audience — the same
  # default-audience token the cutover runner presents from its standard
  # /var/run/secrets/kubernetes.io/serviceaccount mount — so this stays
  # empty (the projection omits `audience`). Set it only if the API is ever
  # reconfigured to review against a named audience.
  tokenAudience: ""

# ── Sovereign compliance seams (bp-kyverno-policies) ─────────────────────
# Every workload on a Sovereign is audited by the ClusterPolicies in
# platform/kyverno-policies/chart/templates/baseline/ and the PolicyReports
# feed the console's Compliance view. hw307 2026-09-11: Deployment/chargeback
# failed prometheus-scrape, otel-injected and topology-spread. Each block
# below renders the exact shape the policy's own pattern accepts, and
# chart/tests/kyverno-policies.sh runs the whole policy set against the
# rendered chart with the kyverno CLI so a regression fails at PR time.
metrics:
  # prometheus-scrape / workload-must-be-scrape-targeted: the pod template
  # carries `prometheus.io/scrape: "true"` (+ port/path). The binary serves
  # the Prometheus text exposition at GET /metrics on the `http` port
  # (internal/api/ops.go) — no exporter sidecar. false = annotations off.
  scrape: true
  path: /metrics

otel:
  # otel-injected / workload-must-be-otel-instrumented: the pod template
  # names, in the `instrumentation.opentelemetry.io/inject-go` annotation
  # the OTel Operator's webhook keys on, the Instrumentation CR this Go
  # workload belongs to. "opentelemetry/default" is the CR
  # bp-opentelemetry-operator renders (defaultInstrumentation, namespace
  # `opentelemetry`) — the cross-namespace form the policy documents.
  # Empty = annotation off.
  #
  # What the annotation does NOT do: the operator's Go auto-instrumentation
  # is an eBPF sidecar that additionally requires the
  # `instrumentation.opentelemetry.io/otel-go-auto-target-exe` annotation;
  # this chart deliberately never sets it, so the webhook injects nothing
  # into this pod (that sidecar runs privileged, which the runAsNonRoot /
  # read-only-rootfs posture forbids). Telemetry flows through the
  # Prometheus scrape above.
  instrumentation: opentelemetry/default

# The public cost calculator (DESIGN.md §12) serves an unauthenticated,
# rate-limited catalog and estimate surface from the price book an operator
# marked public. It is inert until such a book exists, so these values are
# safe to carry on every Sovereign.
publicCalculator:
  # Origins allowed to EMBED /estimate in an iframe (frame-ancestors) and to
  # call the public routes cross-origin — the operator's marketing site.
  # Empty = same origin only; every other path keeps X-Frame-Options: DENY.
  origins: []
  # Token bucket per client address on the public routes; 429 + Retry-After
  # above it. Behind the gateway the address is the last X-Forwarded-For hop.
  ratePerMinute: 60

# topology-spread / workload-must-declare-spread: a >=2-replica Deployment
# must declare a spread across kubernetes.io/hostname or
# topology.kubernetes.io/zone. ScheduleAnyway keeps a single-node Sovereign
# schedulable — the spread is a preference, never a fence.
topologySpread:
  enabled: true
  topologyKey: kubernetes.io/hostname
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
# ── Document renderer (EPIC #6867) ─────────────────────────────────────
# The invoice / credit-note / statement / quote PDF service, shipped as an
# OPTIONAL sub-chart (products/chargeback/docrender/chart). Turning it on
# renders that chart AND points the application's DOCRENDER_URL at its
# ClusterIP Service, which is what makes GET /api/v1/statements/{id}.pdf
# answer with a document instead of 503.
#
# Everything under this key belongs to the sub-chart itself — see its own
# values.yaml. The two keys the PARENT reads are `enabled` (does the seam get
# wired) and `auth.existingSecret` (does the BSS send the shared-secret
# header). Off by default: a Sovereign that does not offer invoice downloads
# should not run a second workload for them.
docrender:
  enabled: false
  auth:
    # Name of a Secret holding the shared secret under key RENDER_TOKEN. Both
    # sides reference the SAME Secret: the renderer requires the header, the
    # application sends it. Empty = no header, and the renderer's
    # NetworkPolicy is the only perimeter (it admits these pods alone).
    existingSecret: ""
    key: RENDER_TOKEN

# E-invoicing (DESIGN.md §17). OFF unless `profile` names an authority's
# profile: an empty profile changes nothing about issuing, which is why it is
# the default. A profile makes issue build the document, validate it, sign it
# with the mounted key, archive it with the hash of exactly the signed bytes,
# and submit it where the authority publishes a channel to submit to.
einvoice:
  # profile is the authority profile, e.g. "oman". Empty = off.
  profile: ""
  signingKey:
    # Name of a Secret holding the PEM private key (RSA, ECDSA or Ed25519).
    # Empty leaves the document unsigned, which validation refuses, so a
    # profile that must sign needs this set. The key is mounted as a file and
    # only its PATH becomes an env var.
    existingSecret: ""
    key: tls.key
  # keyId names the key on the document so a rotation stays traceable against
  # documents already archived. A NAME, never key material.
  keyId: ""

# requests == limits (Guaranteed QoS, 1:1 ratio) — REQUIRED for a per-Org
# install under the plan-limits LimitRange (#4362/#4553).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 100m
    memory: 256Mi

# Object-name stem. Empty = "chargeback" (the bp- prefix belongs to the
# chart/catalog, not to the workload names).
nameOverride: ""
