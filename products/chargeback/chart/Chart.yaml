apiVersion: v2
name: bp-chargeback
description: |
  Chargeback — the OpenOva usage ledger, rating and statements application
  (EPIC #6723, ADR-0014). Standalone by design (ADR-0014 D4): its own
  customers, its own CNPG Postgres, its own JSON API (/api/v1) and its own
  UI served at /, PIN sign-in, and a Huawei (HCSO Kom4DC) cloud collector.
  One chart, three placements (ADR-0014 D5): the Sovereign BSS component
  (bootstrap-kit slot 13f, chargeback.<sovereign-fqdn>), a per-Organization
  install, or a central instance on bare Kubernetes — the same binary with
  PROFILE selecting the banner and the /auth/me payload.
type: application
# 0.1.0 (#6723, lane B): first release — Deployment (2 replicas, distroless
# non-root 65532, read-only rootfs) + ClusterIP Service + Gateway-API
# HTTPRoute chargeback.<fqdn> (never a Traefik Ingress, never a NodePort —
# §854) + zero-RBAC ServiceAccount + Cilium ingress/egress CNPs with the
# load-bearing kube-dns carve-out + a private CNPG Cluster wired through
# the placeholder-DSN Secret + post-install sync Job (the platform/newapi
# pattern A — never a Helm `lookup`) + a create-if-absent APP_ENCRYPTION_KEY
# Job (generated once, never regenerated). Lockstep: blueprint.yaml 0.1.0 +
# bootstrap-kit slot 13f pin 0.1.0 + catalog-seed (blueprints.yaml) 0.1.0.
# Image = ghcr.io/openova-io/chargeback:<appVersion>
# (build-chargeback.yaml; plain image repo per the #4706 chart-repo-collision
# lesson — never the bp-chargeback chart OCI repo).
# 0.1.58 (#6971): chart only — the Sovereign's storefront origin
# (https://marketplace.<sovereignFqdn>) is always among the public-route
# CORS origins, so the storefront's package table can read the document.
# 0.1.61 (#6971, DESIGN.md §22): the package LADDER — a feature is boolean,
# quantity (with a metered / hard-cap / unlimited overage policy), level (an
# ordered list of labels, the next purchasable as an add-on) or access (a
# platform door); every feature sits in a group (capacity · features · access
# · ops · scope · resilience · service) over a FLOOR of platform-wide items;
# a not-offered cell can tease the first package that has it; package
# settings per (book, plan) carry tagline, recommended, the term rule and
# the shape with guaranteed floors; the step-up rule is computed and
# published; PACKAGE_INCLUDED_LINES (config.packageIncludedLines) turns the
# included 0.000 lines off; the seeder writes the ladder at the pricing
# workbook's numbers. Migration: features.feature_group / levels / teaser,
# package_entitlements.overage / level, package_settings.
# 0.1.62 (#6971): the calculator's package ladder fits the family card — a
# FIXED table layout (feature column 28 %, four packages 18 % each), the
# header wrapping in sentence case, the add-on as one line "+ 1.500 / mo"
# over its "included from XL" hint, a scroll container under 1100 px (floor
# strip and footer outside it), and the catalogue's grid items shrinking
# (min-width 0) instead of widening past the page — measured at 1400 / 1280
# / 1600 / 900 px by tests/e2e/playwright/tests/chargeback-calculator-ladder.spec.ts.
# Seeder: the derived-price cells (backup, AI SEO, AI builder, domain) and
# the dedicated IP are written with NO note — a cell note is published with
# the document (§22.4) and the 0.1.61 operator remarks ("derived from the
# step-up rule; confirm", "EIP list price; discount to be decided") reached
# the storefront; the remarks live in the seeder's source and DESIGN.md
# §22.7, and the seeder's integration test refuses any published note that
# says so. The image is the appVersion; no chart template changed.
# 0.1.63 (#6971, DESIGN.md §22.10): icons and branding, defined in BSS and
# published through the packages document — the storefront hardcodes none.
# A content-addressed icon store (POST/GET/DELETE /api/v1/icons, the bytes
# public at GET /api/v1/public/icons/{sha256}, immutable, nosniff, a
# sandboxing CSP; an SVG with script, foreignObject, an on* handler, an
# external href or a DTD is refused, a PNG / WebP must carry its magic); an
# icon and tile colour on a feature, an icon per group (PUT
# /feature-groups/{key}), an icon, accent and badge on a package's settings;
# groups[] / floor[] / features[] / packages[] carry `icon` {src, alt, bg}
# and packages[] `accent` / `badge`, each omitted when unset. The console
# edits them from the feature, settings and group modals and draws them on
# the Packages tab; the calculator's comparison table draws them. The
# seeder uploads the vendored Lucide / Simple Icons SVGs and writes the
# ladder's icons, tiles, accents and the recommended package's badge;
# scripts/apply-package-icons.py does the same to a running BSS.
# Migration: icons, feature_group_settings, features.icon_id / icon_bg,
# package_settings.icon_id / accent / badge. No chart template changed.
version: 0.1.63
# appVersion is the default image tag (chargeback.image in _helpers.tpl);
# build-chargeback.yaml derives the pushed tag from this field so the two
# can never drift.
appVersion: 0.1.63
# The document renderer (EPIC #6867) ships as an OPTIONAL sub-chart, gated on
# `docrender.enabled` (default false), so a Sovereign that does not offer
# invoice downloads runs no second workload. The repository is a `file://`
# URL into the sibling source directory — never a remote repo — so
# `helm dependency build` resolves it from the LOCAL committed bytes with the
# network unreachable, the same idiom platform/seaweedfs uses for its
# vendored subchart.
dependencies:
  - name: docrender
    version: "0.1.0"
    repository: "file://../docrender/chart"
    condition: docrender.enabled
keywords:
  - chargeback
  - showback
  - usage-ledger
  - rating
  - statements
  - bss
  - openova-blueprint
maintainers:
  - name: OpenOva
    url: https://github.com/openova-io/openova
sources:
  - https://github.com/openova-io/openova
# Opt out of the hollow-chart guard (Blueprint-Release workflow / #181):
# first-party product chart deploying a single Go service image with
# Catalyst-authored resources — no bundled upstream Helm subchart (same shape
# as bp-openova-mcp, bp-agenity, bp-continuum).
annotations:
  catalyst.openova.io/no-upstream: "true"
