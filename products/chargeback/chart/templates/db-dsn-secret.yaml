{{- /*
DATABASE_URL placeholder Secret (platform/newapi pattern A).

Rendered with an EMPTY DATABASE_URL so the Deployment's secretKeyRef names
a Secret that already exists at first Pod schedule (kubelet checks that the
KEY exists, not that it is non-empty — no CreateContainerConfigError). The
post-install/post-upgrade sync Job composes the real DSN from CNPG's
`<cluster>-app` password and PATCHes it into this key; the Deployment's
wait-for-database-url initContainer holds the Pod until that has happened.

Deliberately NO Helm `lookup` (the task's hard rule and the #1834 lesson):
a re-render on upgrade re-applies the empty placeholder and the
post-upgrade hook immediately re-patches it — the initContainer gate makes
that window harmless (a Pod restarted inside it waits instead of crashing).
`helm.sh/resource-policy: keep` — the Job owns the bytes; never deleted on
uninstall.
*/ -}}
{{- if .Values.cnpg.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chargeback.dsnSecretName" . }}
  labels:
    {{- include "chargeback.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  DATABASE_URL: ""
{{- end }}
