{{- /*
Dedicated ServiceAccount with ZERO RBAC — deliberately. Phase 0 of the
chargeback binary talks to Postgres and to the Huawei endpoints only; the
Kubernetes-informer platform collector (ADR-0014 D5, lane D) arrives with
its own Role when it lands. automountServiceAccountToken false here AND on
the pod spec so no API credential reaches the container.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chargeback.serviceAccountName" . }}
  labels:
    {{- include "chargeback.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.adapter.enabled }}
{{- end }}
