{{- /*
Egress for the chargeback outbound legs (mirrors bp-openova-mcp / bp-agenity
#4604):

  - `world` :httpsPort (gated) — the Huawei HCSO Kom4DC endpoints the cloud
    collector signs against (spec §3) and the PUBLIC_URL self-reference.
  - `cluster`/`host`/`remote-node` :{httpsPort,8080,5432} — the private CNPG
    Cluster in this namespace (:5432), the catalyst-api adapter seam (:8080,
    lane D) and any in-cluster HTTPS hop. remote-node covers a multi-region
    Sovereign where the CNPG primary may sit on the other region's node.

🛑 DNS IS LOAD-BEARING: a CiliumNetworkPolicy with ANY egress rule flips the
pod to default-deny egress — without the explicit :53 allow to kube-dns the
CNPG service name NXDOMAINs and the binary never reaches Postgres
(#4604 / #5617 — the class scripts/check-netpol-egress-completeness.py gates).

Gated on the cilium.io/v2 Capabilities check and networkPolicy.egress.enabled.
*/ -}}
{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.egress.enabled (.Capabilities.APIVersions.Has "cilium.io/v2") }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "chargeback.fullname" . }}-egress
  labels:
    {{- include "chargeback.labels" . | nindent 4 }}
    catalyst.openova.io/component: chargeback-egress-netpol
spec:
  endpointSelector:
    matchLabels:
      {{- include "chargeback.selectorLabels" . | nindent 6 }}
  egress:
    - toEntities:
        {{- if .Values.networkPolicy.egress.allowExternalHttps }}
        - world
        {{- end }}
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: {{ .Values.networkPolicy.egress.httpsPort | quote }}
              protocol: TCP
            # the in-cluster catalyst-api adapter seam (lane D).
            - port: "8080"
              protocol: TCP
            # the private CNPG Cluster (<fullname>-pg-rw).
            - port: "5432"
              protocol: TCP
            {{- range .Values.networkPolicy.egress.extraPorts }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    # DNS — LOAD-BEARING (see header).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
{{- end }}
