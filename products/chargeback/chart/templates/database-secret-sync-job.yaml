{{- /*
Helm post-install/post-upgrade Job that composes DATABASE_URL from the
CNPG-emitted `<cluster>-app` Secret (the rotating Postgres password) and
PATCHes it into the placeholder Secret templates/db-dsn-secret.yaml renders.

WHY A JOB INSTEAD OF HELM `lookup` — on every freshly-franchised Sovereign
CNPG materialises the source Secret only AFTER this HelmRelease applies, so
a render-time lookup returns nil and commits an empty password (#1834 on
t32: 21x CrashLoopBackOff). The Job polls until the source exists, PATCHes
the destination, exits 0 — event-deterministic and idempotent across
upgrades (CNPG never rotates the password without operator action).

Pattern lifted verbatim from platform/newapi/chart/templates/
database-secret-sync-job.yaml (canonical seam — issue #830 Bug 2 +
ADR-0001 §11.3 anti-duplication). The RBAC is scoped to the two Secrets by
name (get) and to the destination (patch); `create` is not needed because
the placeholder is a chart resource.
*/ -}}
{{- if .Values.cnpg.enabled }}
{{- $clusterName := include "chargeback.cnpgClusterName" . }}
{{- $cnpgSecretName := printf "%s-app" $clusterName }}
{{- $dsnSecretName := include "chargeback.dsnSecretName" . }}
{{- $pgUser := .Values.cnpg.cluster.owner | default "chargeback" }}
{{- $pgHost := printf "%s-rw.%s.svc.cluster.local" $clusterName .Release.Namespace }}
{{- $database := .Values.cnpg.database | default "chargeback" }}
{{- $sslMode := .Values.cnpg.sslMode | default "require" }}
{{- $jobName := printf "%s-db-dsn-sync" (include "chargeback.fullname" .) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chargeback.hookLabels" . | nindent 4 }}
    catalyst.openova.io/component: chargeback-db-dsn-sync
  annotations:
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "chargeback.hookLabels" . | nindent 8 }}
        catalyst.openova.io/component: chargeback-db-dsn-sync
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $jobName }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: {{ include "chargeback.pivotImage" (dict "repo" .Values.cnpg.dsnGate.image "tag" "" "root" .) | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: SOURCE_SECRET
              value: {{ $cnpgSecretName | quote }}
            - name: DEST_SECRET
              value: {{ $dsnSecretName | quote }}
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: PG_USER
              value: {{ $pgUser | quote }}
            - name: PG_HOST
              value: {{ $pgHost | quote }}
            - name: PG_DB
              value: {{ $database | quote }}
            - name: PG_SSLMODE
              value: {{ $sslMode | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              APISERVER="https://kubernetes.default.svc"
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              echo "Waiting for ${SOURCE_SECRET} in ${NAMESPACE}..."
              for i in $(seq 1 120); do
                code=$(curl -s -o /tmp/src.json -w '%{http_code}' --cacert "${CA}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  "${APISERVER}/api/v1/namespaces/${NAMESPACE}/secrets/${SOURCE_SECRET}")
                if [ "${code}" = "200" ]; then
                  echo "Found ${SOURCE_SECRET}"; break
                fi
                if [ "$i" = "120" ]; then
                  echo "Timeout: ${SOURCE_SECRET} not present after 10 min" >&2
                  exit 1
                fi
                sleep 5
              done
              PWD_B64=$(tr -d '\n' < /tmp/src.json | grep -oE '"password"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
              if [ -z "${PWD_B64}" ]; then
                echo "Source ${SOURCE_SECRET} has empty password" >&2
                exit 1
              fi
              PWD=$(echo -n "${PWD_B64}" | base64 -d)
              if [ -z "${PWD}" ]; then
                echo "Source ${SOURCE_SECRET} decoded to empty password" >&2
                exit 1
              fi
              # The password is never echoed: it only ever lives in these
              # two variables and the PATCH body.
              DSN="postgres://${PG_USER}:${PWD}@${PG_HOST}:5432/${PG_DB}?sslmode=${PG_SSLMODE}"
              DSN_B64=$(echo -n "${DSN}" | base64 -w 0)
              PATCH=$(printf '{"data":{"DATABASE_URL":"%s"}}' "${DSN_B64}")
              PWD=""; DSN=""; DSN_B64=""
              code=$(curl -s -o /tmp/patch.json -w '%{http_code}' --cacert "${CA}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/strategic-merge-patch+json" \
                -X PATCH --data "${PATCH}" \
                "${APISERVER}/api/v1/namespaces/${NAMESPACE}/secrets/${DEST_SECRET}")
              PATCH=""
              if [ "${code}" != "200" ] && [ "${code}" != "201" ]; then
                echo "PATCH ${DEST_SECRET} returned HTTP ${code}:" >&2
                cat /tmp/patch.json >&2
                exit 1
              fi
              echo "Synced ${DEST_SECRET} DATABASE_URL from ${SOURCE_SECRET} password"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chargeback.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": "before-hook-creation"
  {{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chargeback.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": "before-hook-creation"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $cnpgSecretName | quote }}, {{ $dsnSecretName | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $dsnSecretName | quote }}]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chargeback.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": "before-hook-creation"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $jobName }}
subjects:
  - kind: ServiceAccount
    name: {{ $jobName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
