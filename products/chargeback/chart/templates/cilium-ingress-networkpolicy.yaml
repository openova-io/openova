{{- /*
Gateway-ingress admit — the Cilium Gateway path is DEAD without this CNP:
external hits reach the backend with the reserved `ingress` ENTITY
identity (the Envoy proxy embedded in the cilium agent), which NO K8s
NetworkPolicy selector can express — every hit returns envoy 503 under a
default-deny posture (#3374 / #3785 / #4180). `cluster` additionally admits
in-cluster callers (the console's BSS adapter, lane D).

Gated on the cilium.io/v2 Capabilities check (the #2988/#3102 idiom) so
the chart still installs on CRD-less clusters (kind CI).
*/ -}}
{{- if and .Values.networkPolicy.enabled (.Capabilities.APIVersions.Has "cilium.io/v2") }}
{{- if or .Values.forwardAuth.header .Values.networkPolicy.ingress.allowGatewayEntity .Values.networkPolicy.ingress.allowClusterEntity }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "chargeback.fullname" . }}-ingress
  labels:
    {{- include "chargeback.labels" . | nindent 4 }}
    catalyst.openova.io/component: chargeback-ingress-netpol
spec:
  endpointSelector:
    matchLabels:
      {{- include "chargeback.selectorLabels" . | nindent 6 }}
  ingress:
    {{- if .Values.forwardAuth.header }}
    # #6841 — the app trusts an identity header, so the ONLY admitted caller is
    # the OIDC gate that sets it. `cluster` is deliberately absent here: with a
    # trusted header, any pod able to open a socket to this Service could set
    # it and assume any identity, including the operator's. The public door is
    # the gate's HTTPRoute, so nothing else needs ingress.
    - fromEndpoints:
        - matchLabels:
            {{- toYaml .Values.forwardAuth.fromEndpointSelector | nindent 12 }}
            k8s:io.kubernetes.pod.namespace: {{ .Values.forwardAuth.fromNamespace }}
      toPorts:
        - ports:
            - port: {{ .Values.service.port | quote }}
              protocol: TCP
    {{- else }}
    - fromEntities:
        {{- if .Values.networkPolicy.ingress.allowGatewayEntity }}
        - ingress
        {{- end }}
        {{- if .Values.networkPolicy.ingress.allowClusterEntity }}
        - cluster
        {{- end }}
      toPorts:
        - ports:
            - port: {{ .Values.service.port | quote }}
              protocol: TCP
    {{- end }}
    {{- range .Values.networkPolicy.ingress.publicReaders }}
    # #6971 — an in-cluster reader of the public document (the marketplace
    # billing service pricing an order). L7-scoped to GET ^/api/v1/public/:
    # those routes ignore the identity header by construction, so admitting
    # this pod opens no identity door — #6841 holds with forwardAuth on.
    - fromEndpoints:
        - matchLabels:
            {{- toYaml .matchLabels | nindent 12 }}
            k8s:io.kubernetes.pod.namespace: {{ .namespace }}
      toPorts:
        - ports:
            - port: {{ $.Values.service.port | quote }}
              protocol: TCP
          rules:
            http:
              - method: "GET"
                path: "^/api/v1/public/.*"
    {{- end }}
{{- end }}
{{- end }}
