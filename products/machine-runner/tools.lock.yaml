schema: openova.io/machine-runner-tools/v1
# The tools of the machine-runner image. A tool enters the image only through this file.
# The fetch stage of products/machine-runner/Containerfile downloads every source and stops
# when its SHA-256 is not the one written here. An upgrade changes version, source and
# sha256 of an entry together. Every entry keeps the key order name, version, source,
# sha256, licence, use: the Containerfile reads the file line by line.
# use is separate-process (a program the runner starts) or data (files a program reads).
