# Provider pack declaration (contract C2). The schema is
# infra/providers/_contract/pack.schema.json. The local pack runs every
# machine as a container on one host, with no cloud account: it is the
# hermetic environment of the conformance proof on a CI runner.
apiVersion: catalyst.openova.io/v1alpha1
kind: ProviderPack
metadata:
  name: local
spec:
  contractVersion: "1"
  module: infra/providers/local
  overlay: clusters/_template/providers/local
  adapter: products/catalyst/bootstrap/api/internal/providers/local
  tofuProviders:
    - source: registry.opentofu.org/hashicorp/random
    - source: registry.opentofu.org/kreuzwerker/docker
  leakTokens: [kreuzwerker]
