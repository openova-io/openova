# Cloud profile of the Huawei pack (contract C2). The schema is
# infra/providers/_contract/cloudprofile.schema.json. The pack targets a
# Huawei Cloud Stack installation (ADR-0016, K11). It holds no value of an
# installation: regions, image, flavors, endpoints and address ranges come
# from an installation document that is kept outside this repository.
apiVersion: catalyst.openova.io/v1alpha1
kind: CloudProfile
metadata:
  name: huawei
spec:
  displayName: Huawei Cloud Stack
  lifecycle: unproven
  contractVersion: "1"
  requiresInstallation: true
  credentials:
    source: either
    fields:
      - {key: access_key, label: Access key ID, secret: false, required: true}
      - {key: secret_key, label: Secret access key, secret: true, required: true}
      - {key: project_id, label: Project ID, secret: false, required: true}
  regions: []
  compute:
    image: ""
    flavors: []
    minWorkerCount: 3
    minimumFlavor:
      controlPlane: {vcpu: 4, memoryGiB: 32}
      worker: {vcpu: 8, memoryGiB: 64}
  storage: {defaultClass: evs-ssd, driver: evs.csi.huaweicloud.com}
  objectStorage: {checksumAlgorithm: ""}
  network:
    loadBalancer: {mode: external-hostport}
  bootstrap: {userDataLimitBytes: 0}
  capabilities: {multiRegion: true, multiCloudRegion: false}
  day2: {contracts: []}
