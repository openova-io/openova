# Provider pack declaration (contract C2). The schema is
# infra/providers/_contract/pack.schema.json.
apiVersion: catalyst.openova.io/v1alpha1
kind: ProviderPack
metadata:
  name: huawei
spec:
  contractVersion: "1"
  module: infra/providers/huawei
  overlay: clusters/_template/providers/huawei
  adapter: products/catalyst/bootstrap/api/internal/providers/huawei
  charts: [huawei-evs-csi, velero-hcs]
  tofuProviders:
    - source: registry.opentofu.org/hashicorp/aws
    - source: registry.opentofu.org/hashicorp/random
    - source: registry.opentofu.org/hashicorp/time
    - source: registry.opentofu.org/huaweicloud/huaweicloud
  leakTokens: [huawei, huaweicloud, myhuaweicloud, hcso, evs, elb, eip, ecs, cce, hcs, obs]
