# Provider pack declaration (contract C2). The schema is
# infra/providers/_contract/pack.schema.json.
apiVersion: catalyst.openova.io/v1alpha1
kind: ProviderPack
metadata:
  name: hetzner
spec:
  contractVersion: "1"
  module: infra/providers/hetzner
  overlay: clusters/_template/providers/hetzner
  adapter: products/catalyst/bootstrap/api/internal/providers/hetzner
  charts: [hcloud-ccm, hcloud-csi, cluster-autoscaler-hcloud]
  tofuProviders:
    - source: registry.opentofu.org/hashicorp/aws
    - source: registry.opentofu.org/hashicorp/random
    - source: registry.opentofu.org/hetznercloud/hcloud
  leakTokens: [hetzner, hcloud, fsn1, nbg1, hel1]
