- generic [ref=e2]: "{\"count\":19,\"items\":[{\"name\":\"backup-configured\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":21,\"source\":\"kyverno\",\"description\":\"PVCs must declare a Velero backup binding via either annotation `velero.io/backup-volumes` on the owning Pod template OR label `velero.io/managed-by-schedule` on the PVC itself.\",\"severity\":\"medium\",\"rules\":[\"pvc-must-be-velero-backed\"],\"title\":\"Stateful workloads must have a Velero backup configured\",\"category\":\"catalyst-compliance\"},{\"name\":\"cilium-l7-mtls\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":45,\"source\":\"kyverno\",\"description\":\"Pod templates must declare the `policy.cilium.io/enforced: \\\"true\\\"` label so the catalyst-network controller routes them under the zero-trust mesh. The runtime \\\"is there an actual selecting CNP/CCNP\\\" check lives in the W2 hubble evaluator.\",\"severity\":\"high\",\"rules\":[\"cilium-enforced-label\"],\"title\":\"Workloads must be covered by a Cilium L7 policy\",\"category\":\"catalyst-compliance\"},{\"name\":\"flux-managed\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":6,\"source\":\"kyverno\",\"description\":\"Workload-rendering resources must carry `app.kubernetes.io/managed-by: flux` (the upstream Flux label) OR have an ownerReference pointing at a HelmRelease / Kustomization. Direct kubectl apply is rejected — IaC-first per docs/INVIOLABLE-PRINCIPLES.md #3.\",\"severity\":\"high\",\"rules\":[\"workload-must-be-flux-managed\"],\"title\":\"Workloads must be managed by Flux\",\"category\":\"catalyst-compliance\"},{\"name\":\"harbor-proxy-pull\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":0,\"source\":\"kyverno\",\"description\":\"Container images must reference a Sovereign-local Harbor proxy registry. Operator configures the allowed regex via .Values.compliancePolicies.harborProxyPull.allowedRegistryRegex.\",\"severity\":\"high\",\"rules\":[\"image-must-be-from-harbor-proxy\"],\"title\":\"Container images must pull through the Sovereign Harbor proxy\",\"category\":\"catalyst-compliance\"},{\"name\":\"hpa-effective\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":0,\"source\":\"kyverno\",\"description\":\"When a HorizontalPodAutoscaler is admitted, its spec.minReplicas must be \\u003e= 1 and the targeted workload's declared replicas should not be below the HPA floor. Runtime effectiveness (current ready Pod count) is checked by the compliance-aggregator's hpa.go evaluator (slice W2).\",\"severity\":\"low\",\"rules\":[\"hpa-minreplicas-positive\"],\"title\":\"HPA minReplicas must not exceed workload spec.replicas\",\"category\":\"catalyst-compliance\"},{\"name\":\"image-tag-pinned\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":2,\"source\":\"kyverno\",\"description\":\"Container images must reference an explicit, non-:latest tag (or a @sha256: digest). Floating tags break SHA-pinned audit trails and reproducibility.\",\"severity\":\"high\",\"rules\":[\"image-must-have-explicit-tag\"],\"title\":\"Container images must be tag-pinned (no :latest)\",\"category\":\"catalyst-compliance\"},{\"name\":\"multi-replica-drainability\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":39,\"source\":\"kyverno\",\"description\":\"Deployments and StatefulSets must declare spec.replicas \\u003e= 2 so voluntary disruptions (node drains, rolling updates) can preserve at least one healthy replica.\",\"severity\":\"medium\",\"rules\":[\"replicas-at-least-two\"],\"title\":\"Workloads must declare 2+ replicas\",\"category\":\"catalyst-compliance\"},{\"name\":\"networkpolicy-present\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":0,\"source\":\"kyverno\",\"description\":\"Namespaces must contain at least one NetworkPolicy or CiliumNetworkPolicy so east-west traffic is mediated.\",\"severity\":\"medium\",\"rules\":[\"namespace-must-have-networkpolicy\"],\"title\":\"Namespaces must declare at least one NetworkPolicy\",\"category\":\"catalyst-compliance\"},{\"name\":\"otel-injected\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":45,\"source\":\"kyverno\",\"description\":\"Workloads should declare OpenTelemetry instrumentation via either an `otel-collector` sidecar container OR `instrumentation.opentelemetry.io/inject-*: \\\"true\\\"` annotation on the Pod template (auto-injection by the OTel operator).\",\"severity\":\"low\",\"rules\":[\"workload-must-be-otel-instrumented\"],\"title\":\"Workloads should be OTel-instrumented\",\"category\":\"catalyst-compliance\"},{\"name\":\"pdb-permits-eviction\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":0,\"source\":\"kyverno\",\"description\":\"A PodDisruptionBudget with maxUnavailable=0 (or minAvailable equal to the workload's full replica count) wedges every voluntary disruption. This policy rejects PDBs whose maxUnavailable is 0.\",\"severity\":\"medium\",\"rules\":[\"pdb-maxunavailable-not-zero\"],\"title\":\"PodDisruptionBudgets must permit eviction\",\"category\":\"catalyst-compliance\"},{\"name\":\"probes-present\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":45,\"source\":\"kyverno\",\"description\":\"Every primary container in a Deployment / StatefulSet / DaemonSet must declare both livenessProbe and readinessProbe. Without probes, kubelet can't detect a wedged process and Service can't gate traffic during startup.\",\"severity\":\"high\",\"rules\":[\"containers-must-have-liveness-and-readiness\"],\"title\":\"Containers must declare liveness and readiness probes\",\"category\":\"catalyst-compliance\"},{\"name\":\"prometheus-scrape\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":45,\"source\":\"kyverno\",\"description\":\"Pod template should carry prometheus.io/scrape=\\\"true\\\" annotation, OR the workload labels declare monitoring.coreos.com/managed=true indicating an operator-managed PodMonitor / ServiceMonitor exists.\",\"severity\":\"low\",\"rules\":[\"workload-must-be-scrape-targeted\"],\"title\":\"Workloads should be Prometheus-scrape-targeted\",\"category\":\"catalyst-compliance\"},{\"name\":\"pvc-volume-expansion\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":0,\"source\":\"kyverno\",\"description\":\"PersistentVolumeClaims should reference a StorageClass with allowVolumeExpansion=true so storage can grow without rebuilding the volume.\",\"severity\":\"medium\",\"rules\":[\"storageclass-must-allow-expansion\"],\"title\":\"PVC StorageClass must allow volume expansion\",\"category\":\"catalyst-compliance\"},{\"name\":\"resource-limits\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":26,\"source\":\"kyverno\",\"description\":\"Every container should declare resources.limits.cpu AND resources.limits.memory. Without limits, a single Pod can exhaust a node and starve neighbors.\",\"severity\":\"low\",\"rules\":[\"containers-must-declare-cpu-memory-limits\"],\"title\":\"Containers should declare CPU and memory limits\",\"category\":\"catalyst-compliance\"},{\"name\":\"resource-requests\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":8,\"source\":\"kyverno\",\"description\":\"Every container must declare resources.requests.cpu AND resources.requests.memory. BestEffort Pods evict first under pressure and can't be reasoned about for capacity planning or per-Org cost rollups.\",\"severity\":\"high\",\"rules\":[\"containers-must-declare-cpu-memory-requests\"],\"title\":\"Containers must declare CPU and memory requests\",\"category\":\"catalyst-compliance\"},{\"name\":\"runasnonroot-readonlyrootfs\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":27,\"source\":\"kyverno\",\"description\":\"Pods must declare runAsNonRoot=true at Pod or container level AND every container must set readOnlyRootFilesystem=true.\",\"severity\":\"medium\",\"rules\":[\"pod-level-or-container-level-runasnonroot\",\"container-readonlyrootfilesystem\"],\"title\":\"Workloads must run non-root with read-only rootfs\",\"category\":\"catalyst-compliance\"},{\"name\":\"secret-not-in-env\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":6,\"source\":\"kyverno\",\"description\":\"Container env entries with names matching *PASSWORD* / *TOKEN* / *KEY* / *SECRET* must use valueFrom.secretKeyRef, not a plaintext value.\",\"severity\":\"high\",\"rules\":[\"deny-plaintext-secret-env\"],\"title\":\"Plaintext secrets must not appear in container env\",\"category\":\"catalyst-compliance\"},{\"name\":\"topology-spread\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":2,\"source\":\"kyverno\",\"description\":\"Deployments / StatefulSets with replicas \\u003e= 2 must declare topologySpreadConstraints with topologyKey of kubernetes.io/hostname or topology.kubernetes.io/zone, so a single host or AZ failure can't take down every replica.\",\"severity\":\"medium\",\"rules\":[\"workload-must-declare-spread\"],\"title\":\"Multi-replica workloads must spread across hostname or zone\",\"category\":\"catalyst-compliance\"},{\"name\":\"useraccess-boundary\",\"weight\":0,\"scope\":\"\",\"mode\":\"permissive\",\"violations\":0,\"source\":\"kyverno\",\"description\":\"Denies UserAccess CRs whose openova.io/org scope differs from the requesting user's org claim, unless the requester is a member of the management Organization with tier=owner. Permissive Audit by default; per-Sovereign overlay flips to Enforce.\",\"severity\":\"high\",\"rules\":[\"deny-cross-org-grants\"],\"title\":\"Internal-vs-customer Org boundary on UserAccess\",\"category\":\"catalyst-rbac\"}]}"