- generic [ref=e2]: "{\"service\":\"openova-flow-server\",\"description\":\"OpenovaFlow HTTP+SSE event router. No UI is served from this binary — the React canvas library is consumed by the openova-console product.\",\"docs\":\"https://docs.openova.io/openova-flow\",\"endpoints\":{\"healthz\":\"GET /healthz\",\"readyz\":\"GET /readyz\",\"ingest\":\"POST /v1/flows/{flowId}/events\",\"snapshot\":\"GET /v1/flows/{flowId}/snapshot\",\"stream\":\"GET /v1/flows/{flowId}/stream (SSE)\",\"logLinesAppend\":\"POST /v1/flows/{flowId}/log-lines\",\"logLinesList\":\"GET /v1/flows/{flowId}/log-lines\",\"delete\":\"DELETE /v1/flows/{flowId}\"}}"