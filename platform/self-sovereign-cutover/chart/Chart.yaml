# 0.1.65 (#3588, Refs #3568 #3379 #3526, hw144 step-06 loops-forever 2026-06-15;
# rebased over 0.1.64's step-01 PAT fix #3584):
# Step-06 Phase-3a (the readiness-gated mothership-auth strip, 0.1.63) waited
# FOREVER at `0/0` and FATAL-refused the strip → cutover wedged at step-06.
# ROOT CAUSE: the Phase-3a success test was `total>0 && not_ready==0`. On hw144
# the local-Harbor HelmRepository set converged `61/61 not-Ready → … → 1/1
# (openova-catalog) → 0/0 not-Ready: <none>` and then looped forever: once the
# tracked set emptied to total=0 (every pivoted HR Ready, then a Flux re-render
# window transiently dropped the local-Harbor match count to zero) the `total>0`
# guard could never be satisfied again, so the loop spun out the full
# stripReadinessSeconds deadline and then exited non-zero (REFUSING the strip).
# FIX: introduce a `seen_local_ready` latch (set the first poll in which a
# non-empty local-Harbor set is fully Ready) and change the success test to
# `not_ready==0 && (total>0 || seen_local_ready)`. This terminates-success on
# the post-convergence 0/0 case while NEVER succeeding on a first-poll 0/0 where
# the pivot never happened (which would reintroduce the 0.1.63 half-pivot the
# strip-before-pivot fix exists to prevent). A genuine half-pivot (HRs stuck
# not-Ready, latch never set) still spins to the deadline and correctly REFUSES
# the strip. Smallest correct fix; no step-count / RBAC / timeout change.
# 0.1.66 (#3606, Refs #3568 #3379, hw144 step-01 loops-forever at G75 2026-06-16):
# Cutover step-01 (gitea-mirror) wedged in a retry loop at sub-step G75 (sever
# upstream git tether). The G75 finalize block ran an IMPERATIVE
# `kubectl patch hr -n flux-system bp-self-sovereign-cutover ...
# mirrorResync.enabled=false`. Flux OWNS that HelmRelease from git, where
# values.yaml mirrorResync.enabled defaulted to `true`, so Flux REVERTED the
# patch on its next reconcile (~4 min) and re-rendered the gitea-mirror-resync
# CronJob (gated `{{- if .Values.mirrorResync.enabled }}` in template
# 11-mirror-resync-cronjob.yaml). G75's 6-min post-verify hold then saw the
# CronJob present again → "G75 FATAL: cronjob reappeared" → step-01 failed and
# auto-retried forever; steps 02-11 never ran. A 5-min github re-clone CronJob
# is ALSO fundamentally incompatible with Pillar 5 — it would breach the
# step-08 600s deny-egress hold.
# FIX (chart-only, no step-count / RBAC / timeout change):
#   (1) values.yaml mirrorResync.enabled default flips `true` → `false`. The
#       IaC default `false` IS the severance — template 11 renders nothing, so
#       there is no CronJob for Flux to revert (Principle 14: severance lives
#       in git, irreversible). A pre-cutover Sovereign that wants the
#       upstream-resync loop opts IN via an operator overlay.
#   (2) Step-01 G75 block (template 01-gitea-mirror-job.yaml) becomes
#       idempotent/fast-path: if the gitea-mirror-resync CronJob does not
#       exist it logs "already severed at IaC layer" and skips the wasteful
#       6-min hold; the imperative patch + live-delete + post-verify dance is
#       preserved INSIDE the else branch for any rendered remnant (overlay
#       opt-in). Step-01 no longer self-defeatingly patches the Flux-owned HR
#       on the default path.
# 0.1.67 (#3608, Refs #3568 #3379, hw145 step-03 unschedulable 2026-06-16):
# Step-03 (harbor-prewarm) could not schedule. Its Pod requested 500m CPU
# (G66, when the step gained skopeo image-copy work), but on a tight Sovereign
# every node ran 89–99% CPU-requested (only ~424m free on the best node) → the
# Pod sat Pending 22+ min with FailedScheduling "Insufficient cpu" and the
# cutover stalled at step-03. harbor-prewarm is a skopeo image-copy Job —
# I/O-bound (streaming image layers), NOT CPU-bound; every OTHER cutover step
# Job requests only 25–100m CPU. FIX (chart-only, template
# 03-harbor-prewarm-job.yaml): right-size requests.cpu 500m → 100m. Memory
# stays 512Mi (skopeo needs the RAM for layer buffers) and the limits block is
# unchanged. No step-count / RBAC / timeout change.
# 0.1.68 (#TBD, Refs #3568 #3379, hw146 step-03 FATAL on transient large-image
# copy resets 2026-06-16): Step-03 (harbor-prewarm) skopeo-copies every
# ghcr.io/openova-io/* image into local Harbor. On hw146's cutover, 27/29 copies
# succeeded but the two LARGE guacamole images (guacamole-server:1.5.5 +
# guacd:1.5.5, ~50MB blobs) FAILED on TRANSIENT mid-blob connection resets over
# the freshly-bootstrapped network — skopeo logged `Reading blob ... failed
# (unexpected EOF), reconnecting ...` then `writing blob ... use of closed
# network connection`. 2/29 failed -> push_fail>0 -> `FATAL: 2 openova-io
# image(s) failed to push` -> cutover never reached step-04+. The single
# `skopeo copy` per image carried only `--retry-times 3` (retries the blob fetch
# INSIDE one copy) and FATALd if ANY image failed. FIX (chart-only, template
# 03-harbor-prewarm-job.yaml): (1) bump `--retry-times 3` -> `--retry-times 5`
# on the copy; (2) wrap each `skopeo copy` in an OUTER per-image retry loop
# (PREWARM_COPY_ATTEMPTS, default 3) — if a full copy still fails after
# `--retry-times`, the whole copy is re-attempted up to 3 times with a 5s
# backoff before the image counts as push_fail; each attempt is logged. The
# FATAL-on-failure contract is PRESERVED (Pillar 5 requires ALL openova-io
# images local for the deny-egress hold) — the step only FATALs once BOTH retry
# layers are exhausted. No step-count / RBAC / timeout change.
#
# 0.1.74 (#3379 — cutover-PROOF integrity, the five faces): (1) #3667 — the
# status ConfigMap is now INIT-ONLY (lookup guard) so a `helm upgrade` never
# re-asserts cutoverComplete:"false"/registriesYamlActive:"v1" over the live
# values and can no longer re-fire the 600s hold; the durable fact is sealed
# by catalyst-api in OpenBao (secret/catalyst/cutover-complete). (2) #3671 —
# step-04 registry-pivot DaemonSet writes a per-node v2 ack
# (node.<name>.registriesYaml) which step-04's daemonset-wait now COUNTS
# (acks == DesiredNumberScheduled), so a node held at v1 fails the cutover. (3)
# #3678 — step-08's CCNP is now a TRUE default-deny egress (enableDefaultDeny.
# egress:true + intra-cluster allow-list 10.42/10.43/10.96 + DNS/apiserver/host/
# remote-node entities) instead of a subtractive 4-CIDR block, plus an ACTIVE
# call-home assertion that fails the proof if console.openova.io (or any
# blockedDomains host) is reachable from a pod under the hold. (4) #3695 —
# step-10's sso-bridge image override is MERGED with yq into the EXISTING
# values: mapping (no more duplicate-key BuildFailed that killed bootstrap-kit),
# host-less so global.registryMirror stays the single source of truth; step-08
# now HARD-gates on bootstrap-kit + sovereign-tls + org-tenants Ready and rolls
# EVERY external-registry workload under deny-egress (not one hand-picked).
# RBAC adds daemonsets/statefulsets {update,patch} for the generalized roll.
#
# 0.1.75 (#3376 FUNNEL): step-08 egress-block-test ALSO asserts flux-system/
# org-tenants Ready BEFORE the 600s hold (woven with #3695's host-GitOps-loop
# gate; no baseline exclusion of the customer path — hw150 declared
# cutoverComplete while the customer journey was dead, PRINCIPLES A1/A2);
# step-09 mint stamps the token-source annotation on the no-op path too.
# Refs #3689 #3379.
# 0.1.77 (#3944, Refs #3379 #3642 #3927): step-03 harbor-prewarm stalled
# "active" for HOURS post-#3642 right after #3927 unstuck step-02. Root cause:
# every `skopeo copy` in Phase A (openova-io container images) + Phase A2
# (openova-io helm chart OCI artifacts) ran with NO `--command-timeout`. A copy
# whose TCP connection is ESTABLISHED but then silently STALLS mid-blob (no
# bytes, no reset — common on a freshly-bootstrapped/throttled Sovereign network
# or against the registry.<fqdn> front door that accepts the connect but stops
# responding) hangs INDEFINITELY: `--retry-times` only fires on an ERROR, never
# on a stuck-but-alive connection. With no command timeout the worker never
# drains, the parent `wait` blocks forever, the Job sits "active" until the
# 5400s activeDeadlineSeconds kills it, and catalyst-api auto-re-runs the
# DeadlineExceeded step (cutover.go) → back-to-back 90-min hangs = "active for
# hours". Fix: add `skopeo --command-timeout ${PREWARM_SKOPEO_TIMEOUT}` (GLOBAL
# flag, before `copy`) to BOTH copy loops, new tunable
# prewarm.skopeoCommandTimeout (default 1200s/20m). A stalled connection now
# FAILS FAST → the per-image outer retry loop (PREWARM_COPY_ATTEMPTS) self-heals,
# the exact path that was unreachable while the copy hung. Validated:
# `helm template` + `sh -n`/`dash -n` clean. Live confirmation deferred to the
# hw172 cutover walk reaching step-03. Lockstep: 06a pin + blueprint.yaml.
# 0.1.78 (#3944 root-cause-2, Refs #3379 #3642): step-03 harbor-prewarm Phase A
# enumerated openova-io images from RUNNING Pods ONLY (`kubectl get pods -A`).
# After #3642 moved the front-door apps (gitea/harbor/keycloak/openbao/grafana/
# newapi/guacamole) INTO the vClusters, a running-Pod-only list is INCOMPLETE on
# two paths: (a) a vCluster NOT in pod-syncing mode never materialises its pods
# in a host namespace, so a host-side enumeration cannot see them; (b) even with
# pod-syncing, an openova-io workload that is momentarily down / scaled-to-zero /
# not-yet-rolled-out (a CronJob between fires, an HR mid-reconcile) has no running
# Pod, so its image is missed. A missed image never lands in local Harbor → post-
# cutover ImagePullBackOff the moment step-06 strips the ghcr.io fallback, or the
# deny-egress hold passes over an un-mirrored image. Fix (chart-only): UNION the
# running-Pod image set with the DECLARED workload-template image set
# (Deployments + StatefulSets + DaemonSets + CronJob/Job pod templates) across
# every namespace before the skopeo push. Declared templates are present
# regardless of replica count or schedule, so the union is COMPLETE on any
# vCluster sync mode and can only WIDEN the prewarm list (every entry is still
# pushed idempotently) — a strict superset of the prior behaviour. No RBAC change
# (the runner ClusterRole already holds get/list on those kinds). Validated:
# `helm template` + `sh -n`/`dash -n` clean; live host-view enumeration on the
# permanent omantel.biz Sovereign confirmed the union covers all 35 openova-io
# images. Lockstep: 06a pin + blueprint.yaml + generated catalog.
# 0.1.78 -> 0.1.79 (#3379, omantel.biz 2026-06-24): hoist the egress-deny
# `kubectl apply` into a SHARED path so the SHIPPED `defaultDenyEgress: true`
# (#3678) mode actually APPLIES the default-deny CCNP. The apply previously
# lived only in the legacy subtractive `else` branch, so under the default the
# manifest was written but never applied → POLICY_APPLIED empty → the #3678
# call-home + #3647 fresh-pull proofs skipped → the 600s hold was assertion-only
# and cutoverComplete=true could be earned WITHOUT a witnessed deny-egress.
# Lockstep: blueprint.yaml bumped in step.
# 0.1.79 -> 0.1.80 (#4325 de-vcluster fallout, Refs #3379 #4291 #4293): the platform
# planes stopped being vClusters — gitea/harbor/openbao are now native HOST namespaces,
# each behind a per-component bp-plane-isolation default-deny CiliumNetworkPolicy
# (slot 26b) whose allow-list admits catalyst-system/flux-system but NOT `catalyst`
# (the cutover Job namespace). The pre-existing `00-mgmt-isolation-carveout.yaml`
# opened only `catalyst -> mgmt`; post-de-vcluster the `mgmt` namespace is gone, so
# that single policy went INERT and the cutover Jobs (step-01 gitea-mirror, 02/03
# harbor-projects/prewarm, 09 gitea-token-mint) are silently dropped at the Cilium
# verdict reaching gitea-http.gitea.svc / harbor-core.harbor.svc — the SAME wedge
# #3821 fixed for the mgmt-vCluster topology, regressed by #4325 with a new owner.
# The carve-out now emits ONE additive allow-ingress NetworkPolicy per target plane
# namespace (mgmtIsolationCarveOut.targetNamespaces, default [gitea,harbor,openbao]),
# keeping the legacy single `mgmtNamespace` as a backward-compat override that folds
# into the set. Step-10 (10-vcluster-registry-pivot-job) already skip-if-absent guards
# every bp-{mgmt,rtz,dmz}-vcluster HR patch + slot 54/58/59 git-edit, so the retired
# plane HRs/slots no-op without tripping the residual-tether FATAL. Chart-only +
# additive; render byte-identical on a pre-#4325 Sovereign that sets mgmtNamespace.
# Lockstep: 06a pin + blueprint.yaml bumped in step.
# 0.1.81 (#4488): step-11 crossplane-provider-pivot now ALSO pivots a Provider
# whose spec.package is already on the mothership proxy-xpkg prefix
# (`harbor.openova.io/proxy-xpkg/...`) → `harbor.<sov-fqdn>/proxy-xpkg/...`.
# A Huawei fresh prov ships provider-opentofu pointed at the mothership Harbor's
# proxy-xpkg (the Crossplane xpkg fetcher bypasses the node containerd mirror and
# `xpkg.upbound.io` dials the poisoned kom4dc NAT EIP — see
# clusters/_template/infrastructure/base/provider-opentofu.yaml), so without this
# the harbor.openova.io host literal would survive the cutover (Principle #11
# violation). New value crossplaneProviderPivot.mothershipProxyPrefix +
# MOTHERSHIP_PROXY_PREFIX env; Hetzner ships the upstream host so the new prefix
# simply never matches there (render-additive, behaviour-identical on Hetzner).
# Lockstep: 06a pin bumped in step.
# 0.1.82 (#4529, Refs #3379): step-03 harbor-prewarm skopeo-copied the openova-io
# container images + helm chart OCI artifacts INTO the in-cluster Harbor
# (`registry.<sov-fqdn>` = HARBOR_PUBLIC_URL → HARBOR_HOST) with a HARDCODED
# `--dest-tls-verify=true`. On a fresh prov that Harbor's wildcard `*.<sov-fqdn>`
# cert is served by the BOOTSTRAP issuer `letsencrypt-dns01-staging-powerdns`
# (LE-STAGING, untrusted by the public CA bundle), and a Job-Pod skopeo carries
# no node trust store even with production LE — so `x509: certificate signed by
# unknown authority` FAILED every push: `push_ok=0 push_fail=30` → step-03 FATAL
# → the cutover never reached the 600s deny-egress hold → cutoverComplete never
# set. Live on keystone prov 25aadcfc (registry.kv160729.omani.works), wedging
# Pillar 5 at step 2/11 whenever LE-rate-limited onto the staging issuer.
#
# THE FIX (chart-only, template 03-harbor-prewarm-job.yaml + values.yaml): both
# the Phase A (container image) and Phase A2 (helm chart OCI) skopeo copies now
# drive `--dest-tls-verify` from a new env `PREWARM_DEST_TLS_VERIFY`
# (.Values.prewarm.destTLSVerify, DEFAULT false). The copy DESTINATION is the
# Sovereign's OWN in-cluster Harbor over the pod network — trust is the cluster
# network, NOT a public CA — exactly the rationale the cold-start registries.yaml
# v1 already uses `tls.insecure_skip_verify: true` for the bastion Harbor mirror
# (04-registry-pivot-daemonset.yaml). `--src-tls-verify` STAYS `true`
# unconditionally: the ghcr.io SOURCE is an external public-CA host that MUST be
# authenticated. This does NOT weaken the cutover's security intent — that intent
# is severing EXTERNAL tethers + pivoting to the LOCAL registry, and the witnessed
# 600s deny-egress hold (step-08) remains the real security gate, entirely
# untouched (step-08 unchanged; the egressDeny CCNP + call-home assertion stay
# intact). Operators with a public-CA-trusted internal cert AND a skopeo trust
# store may set prewarm.destTLSVerify=true via overlay.
#
# No step-count / RBAC / deadline change (still 11 steps). New contract Case 30
# locks the wiring: no hardcoded --dest-tls-verify=true survives, both copies
# drive it from the env (default false), src stays true, and an overlay can flip
# it back to true. Live 11-step→cutoverComplete=true validation is DEFERRED to a
# fresh prov whose cutover reaches the 600s egress hold (roll-gated; not run on
# the permanent env).
#
# 0.1.137 — #5191 (2026-07-18): step-04 registry-pivot toolchain (curl+jq) is
# no longer acquired via a silent `apk add ... || true`. It now retries apk 6×
# with backoff, then VERIFIES `command -v jq && command -v curl`, and if either
# is still absent EXITS 1 (fail-loud → visible CrashLoopBackOff that self-heals
# when apk succeeds) instead of silently proceeding tool-less. Root cause: on
# hw268 two rebooted nodes lost the apk toolchain with no egress to reinstall;
# `|| true` let the pivot run jq-less, every per-node `registriesYaml=v2` ack
# failed silently, the step-04 daemonset-wait never reached N/N, and the WHOLE
# cutover wedged at 27% with failedStep="" (no signal). A cutover (egress-
# severing) tool must never silently depend on public-CDN egress for its own
# toolchain. No step-count / RBAC / deadline change (still 11 steps). New
# contract Case 61 asserts the fail-loud guard replaced `|| true`.
#
# 0.1.138 — #5194 (Refs #4975 #5191): step-08 egress-block-test's PRE-HOLD
# offline-mirror completeness gate (#4975) now SELF-HEALS a miss instead of
# FATALing the whole step. Root cause (live hw269, dep a47b82b25fbd5baf): a
# funnel Org (`hw269uatwalk`) provisioned MID-CUTOVER, after step-03
# harbor-prewarm had already enumerated the workload set, so its images
# (harbor.openova.io/proxy-dockerhub/mariadb:11 + wordpress:6-apache) were
# never mirrored — pods stayed Running (they pulled fine pre-hold) but the
# completeness HEAD 404'd on the missing NATIVE local manifest, looping
# `cutoverComplete=false` forever. Egress is still OPEN when the gate runs,
# so the gap is recoverable: on a miss, step-08 now auto-warms the missing
# image into local Harbor by reusing step-03's EXACT skopeo proxy-copy
# mechanism (HOST_PROJECT_MAP host->project mapping, the ghcr.io PAT +
# mothership-proxy direct-source fallback, PREWARM_PROXY_COPY_ATTEMPTS /
# PREWARM_PROXY_BACKOFF_BASE_SECONDS), then re-HEADs the exact path; only a
# warm that itself fails (or a still-missing manifest afterward) fails the
# gate. New env: MIRROR_SELF_HEAL_ENABLED (offlineMirror.selfHeal.enabled,
# default true), MOTHERSHIP_HOST, GHCR_DOCKERCONFIG(_NAMESPACE),
# PREWARM_SKOPEO_TIMEOUT, PREWARM_DEST_TLS_VERIFY, PREWARM_PROXY_COPY_ATTEMPTS,
# PREWARM_PROXY_BACKOFF_BASE_SECONDS — all sourced from the SAME
# values.yaml keys step-03 already reads (harbor.ghcrSecretRef,
# prewarm.skopeoCommandTimeout/destTLSVerify/proxyCopyAttempts/
# proxyBackoffBaseSeconds), so no new operator-facing knob was invented. No
# step-count / RBAC / deadline change (still 11 steps). New contract Case 62
# asserts the self-heal warm + re-HEAD path is present in the rendered
# script.
version: 0.1.151
description: |
  Catalyst Self-Sovereignty Cutover Blueprint. Installs DORMANT — this
  chart ships eight step ConfigMaps (PodSpec ConfigMaps, one per step),
  the registry-pivot DaemonSet, the mutable cutover-status ConfigMap,
  plus ServiceAccount/RBAC scoped to the cutover work. NO Helm
  post-install hooks fire any of the steps; the catalyst-api cutover
  endpoint (issue #792) reads each step ConfigMap by label selector,
  stamps a real batch/v1 Job from the embedded PodSpec, and updates
  the status ConfigMap as each step completes.

  Trigger semantics (post-handover, per #790 scope-correction comment):
  the operator clicks "Achieve True Sovereignty" in admin console (or
  catalyst-api auto-fires after first successful operator login on the
  new Sovereign). The handed-over Sovereign starts soft-tethered to
  harbor.openova.io for image-pull rate-limit safety, then becomes
  hard-independent only after this cutover sequence completes.

  Step inventory (label app.kubernetes.io/component=cutover-step):
    01  cutover-step-01-gitea-mirror               mode=job
        git push --mirror github.com/openova-io/openova into local Gitea.
    02  cutover-step-02-harbor-projects            mode=job
        Create 7 proxy-cache projects in local Harbor.
    03  cutover-step-03-harbor-prewarm             mode=job
        HEAD-pull every image referenced by the bootstrap-kit through
        the proxy-cache.
    04  cutover-step-04-registry-pivot             mode=daemonset-wait
        DaemonSet runs on every node + writes /etc/rancher/k3s/registries.yaml
        v2 once the status ConfigMap key registriesYamlActive flips to v2.
    05  cutover-step-05-flux-gitrepository-patch   mode=job
        Patch flux-system/openova GitRepository.url → local Gitea.
    06  cutover-step-06-helmrepository-patches     mode=job
        Patch every OCI HelmRepository → oci://harbor.<sov-fqdn>/openova-io.
    07  cutover-step-07-catalyst-api-env-patch     mode=job
        kubectl set env deploy/catalyst-api CATALYST_GITOPS_REPO_URL=...
    08  cutover-step-08-egress-block-test          mode=job
        Apply CiliumNetworkPolicy denying egress to github.com / ghcr.io
        / harbor.openova.io for 10 min, assert all reconciles stay Ready.
    09  cutover-step-09-gitea-token-mint           mode=job
        POST /api/v1/users/gitea_admin/tokens, capture .sha1, patch
        Secret org-services/provisioning-github-token.GITHUB_TOKEN with the real
        API token (the chart previously mirrored the admin password
        verbatim — Gitea then 401s on `Authorization: token <PWD>`,
        blocking tenant voucher checkout at journey step 16). Rolls
        the provisioning Deployment so the new token takes effect
        immediately. (TBD-C18)
    10  cutover-step-10-vcluster-registry-pivot    mode=job
        Patch the bp-mgmt-vcluster / bp-rtz-vcluster / bp-dmz-vcluster
        HelmReleases' image.repository from harbor.openova.io →
        harbor.<SOVEREIGN_FQDN> so vCluster control-plane Pods pull
        from the Sovereign-local Harbor mirror post-cutover. Phase-1
        kubectl patch; Phase-2 git push to local Gitea so the
        bootstrap-kit Kustomization doesn't revert the override.
        (TBD-V24 MISS-1)
    11  cutover-step-11-crossplane-provider-pivot  mode=job
        Patch every `pkg.crossplane.io/v1.Provider` CR's spec.package
        from `xpkg.upbound.io/...` → `harbor.<SOVEREIGN_FQDN>/
        proxy-xpkg/...` so the Crossplane package manager fetches
        Provider packages from Sovereign-local Harbor, NOT from
        xpkg.upbound.io. Phase-1 kubectl patch (skip if CRD absent or
        already-pivoted); Phase-2 git push to local Gitea so the
        bootstrap-kit Kustomization doesn't revert the override.
        Crossplane bypasses containerd (uses go-containerregistry
        directly), so Step 04's registries.yaml mirror does NOT catch
        Provider package fetches. (TBD-V24 MISS-3)

  Plus:
    self-sovereign-cutover-status                  ConfigMap
        Initial state machine state (cutoverComplete: "false" + per-step
        empty fields). catalyst-api updates this ConfigMap as each step
        advances.
    registry-pivot                                 DaemonSet
        Always-on per-node reconcile loop; idempotent.
    gitea-mirror-resync                            CronJob (post-cutover)
        Re-runs Step 01's idempotent bare-clone + push --mirror every
        5 min so upstream chart bumps merged AFTER cutover continue
        crossing the seam into local Gitea. Pre-cutover fires are
        no-ops. (TBD-A37, chart 0.1.33)
    bp-self-sovereign-cutover-runner               ServiceAccount + ClusterRole +
                                                   ClusterRoleBinding for the
                                                   stamped Jobs and the DaemonSet.

  This Blueprint legitimately ships NO upstream subchart — the entire
  payload is Catalyst-authored ConfigMaps, ServiceAccount, RBAC, and one
  DaemonSet. The blueprint-release CI hollow-chart guard reads the
  annotation below and skips the dependencies-required rule.
type: application
keywords:
  - catalyst
  - blueprint
  - self-sovereignty
  - cutover
  - gitea
  - harbor
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

annotations:
  catalyst.openova.io/no-upstream: "true"
