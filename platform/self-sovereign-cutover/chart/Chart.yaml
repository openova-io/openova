# 0.1.73 (#3647 Refs #3379, BULLETPROOF cutover — registry-pivot effective on a
# RUNNING node + fresh-pull proof under deny-egress, 2026-06-16): two real
# post-cutover defects, both reproduced live on hw149.
#   FIX (a) — Step-04 registry-pivot was INERT for new pulls. The DaemonSet
#   wrote /etc/rancher/k3s/registries.yaml, but k3s reads that file ONLY at
#   process startup (it generates the containerd certs.d/<host>/hosts.toml
#   mirror dir from it then). So after cutover a freshly-rolled Pod still
#   resolved ghcr.io and 401'd (Init:ImagePullBackOff on hw149). The pivot
#   loop (template 04) now ALSO regenerates the certs.d/<host>/hosts.toml
#   files itself — exactly what k3s does at boot, but on the live node —
#   which containerd re-reads PER PULL, so the pivot takes effect with NO
#   node reboot. registries.yaml is still written (keeps the node correct
#   across a future genuine restart). New hostPath mount of the certs.d dir
#   (/var/lib/rancher/k3s/agent/etc/containerd/certs.d, k3s default data-dir).
#   v1/rollback points the host-dir back at mothership Harbor so rollback is
#   also effective live.
#   FIX (b) — Step-08 egress-block gate only watched ALREADY-RUNNING pods stay
#   Ready; it never exercised a FRESH image pull, the one path that breaks
#   post-cutover. Now, WHILE the egressDeny CCNP is applied, Step-08
#   force-deletes ONE openova-io-imaged Pod (auto-discovered, catalyst-api
#   excluded) and REQUIRES its replacement to reach Running by pulling from
#   local Harbor; ImagePullBackOff/ErrImagePull or no-Running-within-timeout
#   FAILS the proof → policy torn down → exit 1 → cutoverComplete stays false.
#   Fail-safe: only runs when the deny policy is actually up; missing target
#   Deployment falls back to the survival-poll (never wedges on a tooling gap).
#   PRESERVES the #3640 apiserver-strand fix: the deny CCNP keeps
#   enableDefaultDeny.egress:false (subtractive — only the 4 tether CIDRs
#   blocked; apiserver/DNS/intra-cluster, incl. the in-cluster Harbor pull,
#   stay reachable). New RBAC: pods{delete} + replicasets{get,list,watch}.
#   New values: egressTest.freshPullProof.{enabled,namespace,deployment,
#   excludeDeploymentSubstring,timeoutSeconds}. Step count / labels / modes
#   unchanged (cutover-contract.sh stays green). Runtime validation pends a
#   fresh hw150 prov driving all 11 steps to cutoverComplete=true.
# 0.1.72 (#3643 Refs #3584 #3379, step-09 gitea-token-mint BasicAuth resilience
# 2026-06-16): step-09 (gitea-token-mint) is the FIRST never-run step after the
# #3640 step-08 fix lets the engine reach it. It mints the provisioning token via
# POST /api/v1/users/gitea_admin/tokens. Gitea MANDATES BasicAuth for token
# creation (a token cannot mint a token), so the #3584 PAT remedy can't apply —
# but Gitea's apiAuth consults the openova-sso OAuth2 source on BasicAuth password
# validation, which BLOCKS ~130s then 401s while Keycloak is still re-converging
# in the cutover window (step-07 just rolled catalyst-api + pivoted the issuer).
# The bare `curl -fsS -u` mint (no --max-time, no retry, FATAL on fail) would
# wedge step-09. FIX (template 09-gitea-token-mint-job.yaml): wrap the mint in a
# 6-attempt retry loop with --max-time 40 (under the ~130s hang) + 15s backoff
# (~5.5min, within the 600s giteaTokenMintSeconds deadline) so it survives the
# transient slowness until the OAuth2 lookup is fast. Idempotent existing-token
# probe + validation unchanged. No step-count / RBAC / deadline change.
# 0.1.71 (#3640 Refs #3379, hw148 step-08 egress-block CCNP cluster-wide
# default-deny 2026-06-16): the cutover reached step-08 (egress-block-test) for
# the FIRST time on hw148 (27b443cca00a0fab) — furthest in the #3379 saga (hw146
# wedged 06, hw147 07; step-07 catalyst-api-env-patch PASSED here via the #3638
# console-url derive). step-08 then WEDGED: the Job applied the
# cutover-egress-block CiliumClusterwideNetworkPolicy, then its own kubectl
# (capturing the baseline NotReady set) hung on `dial tcp 10.96.0.1:443: i/o
# timeout` repeating to the deadline -> no cutoverComplete.
#
# ROOT CAUSE: the emitted CCNP is `endpointSelector: {}` (ALL pods cluster-wide)
# + ONE egressDeny rule (the 4 tether CIDRs) but NO `enableDefaultDeny` field and
# ZERO egress(allow) rules. Cilium defaults enableDefaultDeny.egress=true for any
# policy carrying egress rules, so the empty-selector policy flipped EVERY pod
# into default-deny egress with nothing allowed -> TOTAL cluster-wide egress loss
# (apiserver 10.96.0.1, DNS, inter-pod), NOT the intended deny-only-the-4-tethers.
# The step-08 Job is itself a pod, so its own apiserver dials died. (#3201-class
# Cilium apiserver-entity bug — a deny-egress that doesn't preserve control-plane
# reachability strands the cluster.)
#
# THE FIX (chart-only, template 08-egress-block-test-job.yaml): emit
# `enableDefaultDeny: { egress: false }` on the CCNP so the egressDeny is purely
# SUBTRACTIVE — it denies ONLY the 4 resolved tether /32s (the sovereignty proof
# ADR-0002 demands) while leaving all other egress (apiserver/DNS/inter-pod)
# intact. The "hidden runtime tethers surface as NotReady" semantics are
# unchanged (the github/ghcr/harbor.openova.io/xpkg dials are still denied). No
# step-count / RBAC / timeout change. Live 11-step -> cutoverComplete=true + 600s
# deny-egress validation lands on the next fresh prov (hw149) — hw148 is
# mid-step-08 on this buggy chart and cannot receive the fix.
# 0.1.70 (#3634 Refs #3379, step-08 bashism under busybox-ash /bin/sh,
# 2026-06-16): the cutoverComplete gate (step-08 egress-block-test) would die
# on a PARSE-time syntax error the FIRST time it is reached. Found auditing the
# NEVER-RUN steps 08-11 (the saga has wedged at 01/03/05/06 every prior prov;
# steps 04-11 have never executed) to pre-empt hw147's next cutover wedge.
#
# THE DEFECT — step-08's survival-window regression diff used bash PROCESS
# SUBSTITUTION:
#     new_hr=$(comm -13 <(echo "${baseline_hr}") <(echo "${hr_not_ready}"))
# The container runs `command: ["/bin/sh", "-c"]` and on the alpine/k8s step
# image `/bin/sh` is busybox ash, which does NOT support `<(...)`. busybox ash
# parses the WHOLE script before executing, so `<(` is a parse-time
# `syntax error: unexpected "("` → the container exits non-zero having run
# NOTHING: no local-URL assertion, no cutover-egress-block CCNP applied, no
# 600s survival window, no PASS → cutoverComplete stays false and the cutover
# wedges at step-08. (busybox ash -n AND dash -n both REJECT `<(...)`; bash -n
# accepts it — proving a bash-only construct, not a typo. The contract test only
# `helm template`s; it never sh -n / dash -n-checks the rendered step scripts,
# so this slipped through. Every OTHER cutover step script is dash -n clean —
# step-08 was the sole offender, verified across all 11 in this audit.)
#
# THE FIX (chart-only, template 08-egress-block-test-job.yaml): `comm -13 A B`
# (lines in B not in A) is exactly `grep -vxF -f A B`, which is POSIX (passes
# dash -n AND busybox ash -n) and needs the baseline as a FILE. Persist the two
# baseline sets to the existing writable /work emptyDir (added #3379 hw139) once
# before the survival window, write the current sets there each poll, and diff
# with `grep -vxF -f`. Byte-identical output to the old `comm -13` across every
# case (empty baseline → all current items count as new; empty current → none),
# verified. No step-count / RBAC / timeout / value change; contract test stays
# green (11 steps). Live 11-step → cutoverComplete=true + 600s deny-egress
# validation DEFERRED to the next clean fresh prov (operator drives the cutover;
# this is the chart fix only).
# 0.1.69 (#3627 Refs #3379, hw146 missing-chart-mirror + wrong-Ready gate,
# 2026-06-16): TWO stacked defects that wedged the Pillar-5 cutover at
# step-06, both root-caused live on hw146 (531e6908e606d11d).
#
#   DEFECT A — no step ever mirrored the openova-io helm CHART OCI artifacts
#   into local Harbor. Step-06 Phase-1 repoints every HelmRepository to
#   oci://registry.<sov-fqdn>/openova-io and Phase-3 strips the ghcr.io
#   fallback, but step-03 (harbor-prewarm) only skopeo-pushed the CONTAINER
#   images enumerated from running Pods — NOT the charts. On hw146 the local
#   Harbor openova-io project held 29 container repos and ZERO chart repos;
#   the HelmReleases survived only because they were installed from ghcr.io
#   at bootstrap and the strip had not yet run. The moment Phase-3 strips
#   ghcr.io, any HR needing a (re)pull 404s. FIX: step-03 gains Phase A2 —
#   it reads (chart,version,sourceRef) off every HelmRelease whose
#   sourceRef.kind=HelmRepository and whose sourceRef.name is in the cutover
#   pivot set (.Values.helmRepositories.names), then skopeo-copies each chart
#   OCI artifact ghcr.io/openova-io/<chart>:<ver> → local Harbor BEFORE
#   egress is cut. Same retry discipline as Phase A (--insecure-policy +
#   --retry-times 3 + captured real exit status + parallel fan-out). The
#   chart name+version come from the consuming HelmRelease's
#   spec.chart.spec, NOT the HelmRepository (whose spec.url is only the
#   project pointer). Template 03-harbor-prewarm-job.yaml.
#
#   DEFECT B — step-06 Phase-3a gated the strip on each pivoted
#   HelmRepository reporting .status.conditions[Ready]==True. But for
#   spec.type=oci HelmRepositories Flux source-controller does NOT reconcile
#   them and sets NO conditions at all (they are static pointers consumed
#   lazily by HelmReleases; no HelmChart/OCIRepository is ever created). On
#   hw146 (source-controller v1.4.1) all 61 pivoted HRs were type=oci with
#   EMPTY conditions (Ready=<none>), so the gate's Ready could never become
#   True → it FATAL-refused the strip every run → cutover wedged at step-06
#   forever (also the hw144 "loops at 0/0" shape, #3588 — same wrong-object
#   read; this supersedes #3568's seen_local_ready latch). FIX: Phase-3a now
#   performs a DIRECT authenticated `helm pull` of a representative sample of
#   the pivoted charts from registry.<fqdn> (helm 3.16.3 ships in
#   alpine/k8s:1.31.4; HOME + HELM_*_HOME point at the writable /tmp
#   emptyDir). A successful pull proves Harbor serves the chart AND the
#   Phase-0 auth works — the exact precondition for stripping ghcr.io. The
#   strip-before-pivot INVARIANT is preserved: if the probe does not succeed
#   within STRIP_READINESS_TIMEOUT_SECONDS the strip is REFUSED and the Job
#   exits non-zero with mothership auth INTACT (recoverable). Phase-3b strip
#   + idempotency unchanged. New value helmReadinessProbe.sampleSize (5) +
#   HELM_PROBE_SAMPLE_SIZE env. Template 06-helmrepository-patches-job.yaml.
#
# No catalyst-api change, no step-count change (still 11 steps — step-03 is
# extended, step-06's gate is replaced). Contract test Case 17b stays green
# (the strip remains in Phase 3, fail-closed, after the pivot) + is extended
# to assert the helm-pull probe replaces the .status.Ready read. New Case 26
# locks the step-03 chart-mirror. Live 11-step→cutoverComplete=true + 600s
# deny-egress validation DEFERRED to the next clean fresh prov (hw146 is
# post-step-05 + pulls this chart from its own local Harbor OCI, so it cannot
# receive a GitHub-main fix).
# 0.1.64 (#3584 Refs #3379, hw144 step-01 gitea-mirror 401, 2026-06-15):
# Step-01 (gitea-mirror) authenticated to the Gitea REST API with the admin
# username+password as BasicAuth (`Authorization: Basic base64(user:pwd)`).
# bp-gitea configures an `openova-sso` OAuth2 login source + REQUIRE_SIGNIN_VIEW
# =true; Gitea's apiAuth (v1/api.go:748) consults that EXTERNAL OAuth2 source
# when validating a BasicAuth PASSWORD. During the cutover window (Keycloak
# still converging) the external lookup BLOCKS ~130s then returns 401 — proven
# live on hw144: every step-01 API call (`GET /orgs/openova`, `POST /orgs`,
# `POST /orgs/openova/repos`) logged `401 Unauthorized in ~130000ms @
# v1/api.go:748` while an authenticated TOKEN call returned 200 in <30ms. The
# repo-create POST 401'd → `FATAL: repo create failed — not visible after POST`
# → cutover wedged at step-01 (steps 02-11 never reached). Same root-cause
# family as #3536 (step-05): bp-gitea's SSO config breaks the naive credential
# path; the canonical remedy is the bootstrap-minted `catalyst-gitea-token` PAT.
#
# THE FIX (chart-only, template 01-gitea-mirror-job.yaml):
#   (1) All Gitea API calls switch from BasicAuth → `Authorization: token
#       <PAT>` (curl). A PAT is a direct local sha1 lookup that NEVER touches
#       the external OAuth2 source → fast + immune to the convergence-window
#       hang.
#   (2) The git push embeds `gitea_admin:<PAT>@` in the URL (a Gitea PAT is
#       accepted as the HTTP git password).
#   (3) The PAT (`catalyst-gitea-token`, minted at BOOTSTRAP by bp-catalyst-
#       platform in catalyst-system) is read cross-namespace via kubectl with
#       a bounded 150s wait — identical pattern + values block (gitRepository
#       SecretRef.{patSourceNamespace,patSourceSecretName,patSourceKey,username})
#       to step-05's #3536 fix.
#   (4) Step image flips images.git (alpine/git, wget-only) → images.kubectl
#       (alpine/k8s — bundles kubectl+curl+git; steps 05/06/07/09/10 already
#       git clone/push from it).
# No RBAC change (the runner SA already has `secrets get/list/watch`
# cluster-wide). No step-count change (still 11 steps). The git clone+push
# (step 3) + the G75 tether-severance finalize block are unchanged. Live
# 11-step→cutoverComplete=true validation remains DEFERRED to the next clean
# fresh prov (the operator drives the cutover; this PR is the chart fix only).
# 0.1.63 (Refs #3379 #3526, hw139 strip-before-pivot half-pivot, 2026-06-15):
# THE ROOT-CAUSE FIX for the cutover half-pivot that froze 8 HRs on the live
# hw139 for 10h (and blocked the unrelated merged bp-newapi #3564 from
# rolling). Verified live: every namespace's `ghcr-pull` Secret held ONLY
# `registry.hw139.omani.works` (the `ghcr.io` key was stripped) while the
# HelmRepository sources still resolved to `ghcr.io` — so 8 HRs
# (bp-catalyst-platform, bp-openbao, bp-self-sovereign-cutover itself,
# bp-continuum, bp-external-secrets-stores, bp-newapi, bp-sso-bridge,
# bp-sandbox) wedged on `failed to configure login options: no auth config
# for 'ghcr.io' in the docker-registry Secret 'ghcr-pull'`.
#
# ROOT CAUSE: Step-06 (helmrepository-patches) ran the DESTRUCTIVE
# `ghcr.io` / `harbor.openova.io` auth STRIP in Phase-0 — which executes
# BEFORE Phase-1's live HelmRepository URL pivot and Phase-2's durable Gitea
# push. The instant Phase-0 stripped the creds, the cluster entered a lethal
# intermediate state (ghcr.io creds GONE, HR sources still ghcr.io). If ANY
# later cutover step wedged (step-05/08/10 have all wedged at points across
# the #3379 saga), the half-pivot was permanent and unrecoverable zero-touch:
# every reconcile failed for lack of ghcr.io auth, and because the strip + add
# were one jq pass the engine re-stripped on every re-run.
#
# THE FIX (chart 06-helmrepository-patches-job.yaml):
#   (1) Phase-0 is now PURELY ADDITIVE — it MERGES the local Harbor auth into
#       ghcr-pull and nothing else. The ghcr.io fallback stays intact through
#       the whole pivot.
#   (2) The destructive strip MOVED to a NEW Phase 3 at the END of Step-06,
#       AFTER Phase-1 (live URL pivot) + Phase-2 (durable Gitea push). The two
#       former "nothing to push" early `exit 0`s now FALL THROUGH to Phase 3
#       (the live pivot may have happened even with no Gitea edit).
#   (3) Phase 3 is GATED: Phase-3a bounded-waits (stripReadinessSeconds, 600s)
#       for EVERY HelmRepository now pointing at local Harbor to report
#       Ready=True (source-controller fetched + verified the OCI artifact —
#       proving registry.<fqdn> serves the chart AND the Phase-0 Harbor auth
#       works). Only THEN does Phase-3b run the `del(.auths[ghcr.io,...])`
#       strip. If the pivot does NOT converge, Phase-3a EXITS NON-ZERO with the
#       mothership auth INTACT — the cluster keeps pulling from ghcr.io and the
#       step is recoverable on the next engine re-run.
# INVARIANT: ghcr.io creds are never stripped until every HR is already
# pulling Ready from registry.<fqdn>. A strip-before-pivot wedge is now
# structurally impossible.
#
# Lockstep: stepTimeouts.helmRepositoryPatchesSeconds raised 600 → 2400 (40m)
# so the Job-level deadline covers the SUM of the in-Job waits (Phase -1
# gateway-wait up to 1800s + Phase-3a strip-readiness up to 600s + buffer) —
# catalyst-api honors this per-step value (cutover.go cutoverStepDeadline). New
# stepTimeouts.stripReadinessSeconds (600s) + STRIP_READINESS_TIMEOUT_SECONDS
# env. Contract test Case 17 renamed (merge→ADD) + new Case 17b locks the
# strip into Phase 3 (readiness-gated, fail-closed, after the pivot). No
# catalyst-api code change, no step-count change (still 11 steps). Live
# 11-step→cutoverComplete=true validation DEFERRED to the next clean fresh prov
# (kom4dc infra-gated; hw139 is already half-pivoted + must NOT be hand-patched).
# 0.1.62 (#3379, hw139 step-08 + step-10 catches, 2026-06-15): the cutover
# reached 9/11 on hw139 (registry + git tethers pivoted) and stalled on TWO
