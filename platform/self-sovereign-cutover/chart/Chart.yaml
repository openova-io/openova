#
# Paired catalyst-api change (cutover.go): an OPERATOR-initiated
# POST /api/v1/sovereign/cutover/start (source="operator", behind
# RequireSession) now DELETES + RE-RUNS a step whose prior Job failed
# GENUINELY (BackoffLimitExceeded) — the zero-touch operator-retry path that
# lets a fixed chart re-drive a step the auto-resume (#3558, timeouts-only)
# refuses to. The auto-resume + in-cluster auto-trigger keep fail-closed
# (jobFailedTransiently unchanged), so a real bug never auto-loops. No step
