# stop EXCLUDING the customer-onboarding path, 2026-06-17): two changes.
#   (1) Step-08 egress-block-test (template 08) now ASSERTS
#       flux-system/sme-tenants Ready BEFORE the 600s hold (bounded 300s
#       poll), instead of letting its NotReady be swallowed as "baseline
#       noise". On hw150 cutoverComplete=true was declared while
#       sme-tenants=False ("path not found") — i.e. the customer journey was
