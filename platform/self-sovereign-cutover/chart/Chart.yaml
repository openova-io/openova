#   CiliumClusterwideNetworkPolicy was never created; the 600s window elapsed
#   as a passive local-URL assertion, NOT the WITNESSED deny-egress hold
#   ADR-0002 demands ("no cutover claim without the egress-block proof"). FIX:
#   the CCNP manifest is now written to a WRITABLE emptyDir at /work (the
#   former read-only `cilium-policy` configMap mount carried only a no-op
#   placeholder the script never consumed — dropped) so it is genuinely
