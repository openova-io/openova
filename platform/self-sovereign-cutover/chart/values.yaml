    # openova-catalog (TBD-C19, 2026-05-18) — the named Flux v1
    # HelmRepository the application-controller renders every
    # per-Application HelmRelease against (catalogSourceRef default).
    # Unlike the bp-* HRs above which are rendered directly from
    # clusters/_template/bootstrap-kit/*.yaml slot files, this HR is
    # rendered by the bp-catalyst-platform Helm chart itself
    # (products/catalyst/chart/templates/openova-catalog-helmrepository
    # .yaml) from `.Values.catalog.helmRepository.url`. Step-06 phase-1
    # patches the live HR; phase-1.6 patches the parent HelmRelease's
    # spec.values override; phase-2 makes the override durable in
    # local Gitea by sed-injecting it into
    # clusters/_template/bootstrap-kit/13-bp-catalyst-platform.yaml.
    # Without this entry step-08 catches `openova-catalog` as the only
    # remaining ghcr.io offender ~1 min after step-06 (the catalyst-
    # platform chart's next reconcile re-renders the HR back to
    # ghcr.io). Caught live on t22.omantel.biz 2026-05-18.
    - "openova-catalog"

  # ── #5436: region-A pivot READ-BACK assert ────────────────────────────
  #
  # Step-06 used to report `success` whenever every `kubectl patch` CALL
  # returned zero — it never read the cluster back. An HelmRepository the
  # Phase-0.9 enumeration missed (org-tenant pipeline seeds one AFTER the
  # enumeration ran) or one Flux reverted from a durable source Phase-2/2b
  # did not rewrite was invisible: the step exited 0 and catalyst-api
  # recorded `step.helmrepository-patches.result=success` on a Sovereign
  # whose charts still resolved to the mothership (live hw290 2026-07-27,
  # six flux-system HRs on oci://ghcr.io/openova-io with the step green).
  # Step-06 now read-back-asserts region-A the same way the #5359
  # secondary-region leg already asserted every secondary.
  #
  # Names tolerated by the read-back. This MUST mirror the slot-managed
  # self-reference whitelist step-08's own offender scan applies
  # (08-egress-block-test-job.yaml, count_offenders' `grep -vE`) — the
  # step-06 assert must never be STRICTER than the step-08 gate that
  # follows it, or a cutover step-08 would pass dies at step-06 instead.
  readbackExcludeNames:
    - "bp-newapi"
    - "bp-self-sovereign-cutover"
  # Kustomizations re-poked (alongside the `openova` GitRepository) inside
  # the read-back's bounded convergence window, so a durable Phase-2/2b
  # rewrite is pulled + re-applied rather than waited out at the polling
  # interval. `bootstrap-kit` carries the slot HelmRepositories;
  # `org-tenants` carries the per-Org tenant HelmRepositories Phase-2b
  # rewrites. All are in flux-system; a name that does not exist is a
  # harmless no-op (the annotate is `|| true`).
  readbackReconcileKustomizations:
    - "bootstrap-kit"
    - "org-tenants"

  # ── #5650: vcluster loft chart-source pivot (step-06 Phase-2c) ──────────
  #
  # The ONE Flux source the URL-pivot above cannot reach. The
  # bp-vcluster-helmrepo slot installs HelmRepository vcluster-system/loft at
  # https://charts.loft.sh — a TRADITIONAL index.yaml source (spec.type
  # default, NOT oci) in the vcluster-system namespace (NOT flux-system =
  # helmRepositories.namespace), which the org-controller renders every
  # per-Org vcluster boundary HelmRelease against
  # (core/controllers/organization/internal/gitops/manifests.go, sourceRef
  # name=loft namespace=vcluster-system, chart=vcluster version=0.33.*). The
  # Phase-1 URL-pivot walks flux-system and matches only the openova-io OCI
  # UPSTREAM_PREFIX, so it misses loft on BOTH axes → post-cutover the loft
  # source keeps re-fetching charts.loft.sh on its 15m interval. That interval
  # can straddle the 600s step-08 hold entirely, so the timed deny-egress
  # proof never observes it (the residual tether #5650 found live on hw292,
  # artifact re-fetched ~10h after cutoverComplete=true).
  #
  # This leg closes it. Because charts.loft.sh is an index.yaml repo that no
  # OpenOva registry mirrors, and the source default must stay upstream for
  # non-Sovereign / pre-cutover installs (the step-10 philosophy — keep chart
  # defaults, rewrite POST-handover), the pivot is a runtime cutover step, not
  # a source-chart change:
  #   1. MIRROR — `helm pull` the upstream vcluster chart (egress still open at
  #      step-06) and `helm push` it OCI into the Sovereign-local Harbor
  #      `openova-io` project (the loft-canonical air-gapped pattern).
  #   2. PIVOT  — live-patch the loft HelmRepository to spec.type=oci,
  #      spec.url=oci://registry.<fqdn>/openova-io, spec.secretRef=ghcr-pull
  #      (Phase-0 already added the registry.<fqdn> auth) + spec.certSecretRef
  #      to the in-cluster Harbor CA (both replicated into vcluster-system,
  #      where source-controller reads them). The tenant HRs resolve
  #      chart=vcluster version=0.33.* against the mirrored OCI tag unchanged.
  #   3. DURABLE — suspend the bp-vcluster-helmrepo HelmRelease (live + a
  #      spec.suspend:true edit to the Gitea slot file) so the next 15m
  #      reconcile does not re-render the loft HR back to charts.loft.sh.
  #
  # FAIL-CLOSED: any sub-step that cannot complete leaves the loft HR on
  # charts.loft.sh and FATALs — step-08's fluxSourceHostLint (allowHosts now
  # empty) then fails the cutover on it, loudly, rather than stamping a false
  # cutoverComplete=true. That is the property the #5652 lint exists to
  # enforce; this leg is what makes it pass honestly.
  #
  # ── PER-REGION as of 0.1.172 (#5650) ────────────────────────────────────
  # 0.1.168 shipped this leg PRIMARY-ONLY — every kubectl in Phase-2c ran
  # against the Job's own in-cluster context. Slot 60 installs the loft
  # HelmRepository in EVERY region, so on a 2-region Sovereign the tether is
  # TWO objects. Live on hw292 (dep 1c56518035a83e03), sampled 2026-08-06 over
  # 75 minutes — deliberately longer than the actor's 15m period, because one
  # sample inside a window cannot characterise a periodic actor:
  #   region-a 23:36:44Z / region-b 23:24:43Z
  #     "stored fetched index of size 3.893MB from 'https://charts.loft.sh'"
  # both ~63h AFTER cutoverComplete=true. Region-b's copy is referenced by no
  # HelmRelease and still reconciles — source-controller drives a
  # HelmRepository on its own interval regardless of consumers.
  # Phase-2c now runs loft_pivot_region() for the primary and every mounted
  # secondary kubeconfig — the SAME target list step-08's per-region
  # fluxSourceHostLint builds, so the pivot covers exactly what the lint
  # measures. Sovereign-wide work (Harbor chart mirror, durable Gitea slot
  # suspend) still runs once. Each region ends with a read-back, and a region
  # that cannot be READ fails the step rather than being skipped (#5359).
  vclusterLoftPivot:
    # Default true — the residual tether is present on every fresh prov by
    # construction, so the keystone cc=true path needs the pivot. Set false
    # only on a Sovereign whose bp-vcluster-helmrepo overlay ALREADY points
    # loft at a Sovereign-local OCI mirror (then there is nothing to pivot and
    # the empty-allowHosts lint passes on the pre-set local URL).
    enabled: true
    # The HelmRepository the bp-vcluster-helmrepo slot installs (matches the
    # org-controller CATALYST_VCLUSTER_HELMREPO_{NAME,NAMESPACE} defaults).
    # Present in EVERY region, which is why the pivot loops the region set.
    helmRepositoryName: "loft"
    namespace: "vcluster-system"
    # The HelmRelease that reconciles the loft HR — suspended so it stops
    # reverting the live pivot. Lives in flux-system (bootstrap-kit slot 60)
    # in EVERY region, so the suspend is issued per-region too.
    helmReleaseName: "bp-vcluster-helmrepo"
    helmReleaseNamespace: "flux-system"
    # The slot file in the local Gitea mirror where the durable suspend lands
    # (the Phase-2 clone's bootstrap-kit tree — the same durable source the
    # other HR pivots write to).
    slotFile: "clusters/_template/bootstrap-kit/60-bp-vcluster-helmrepo.yaml"
    # Upstream index.yaml chart coordinates to mirror. version is a helm
    # constraint that MUST match the org-controller's
    # CATALYST_VCLUSTER_CHART_VERSION default so the tag helm resolves +
    # pushes is the tag Flux resolves the same constraint against.
    upstreamRepoURL: "https://charts.loft.sh"
    chartName: "vcluster"
    chartVersion: "0.33.*"
    # Local Harbor push project — the SAME openova-io project the other HR
    # pivots target and Phase-0 already added registry.<fqdn> auth for, so the
    # pivoted loft url reuses ghcr-pull + the cutover-harbor-ca trust ref.
    localProject: "openova-io"
    # Bounded upstream-pull retries (absorb a transient charts.loft.sh blip;
    # a genuine failure still FATALs fail-closed).
    pullAttempts: 3

# ── HelmRepository TLS-trust for the in-cluster Harbor (Refs #3379) ──────
#
# THE LAST LEG OF THE CUTOVER CERT-TAIL. Step-06 Phase-1 pivots every
# openova-io HelmRepository's spec.url from oci://ghcr.io/openova-io to
# oci://registry.<sov-fqdn>/openova-io. The Flux SOURCE-CONTROLLER then
# pulls those OCI charts from the in-cluster Harbor — whose wildcard
# `*.<sov-fqdn>` cert is served by the BOOTSTRAP issuer
# `letsencrypt-dns01-staging-powerdns` (LE-STAGING, untrusted by the public
# CA bundle) on a fresh / qaTestEnabled prov. source-controller runs with
# only the public CA bundle, so EVERY pivoted pull fails
# `tls: x509: certificate signed by unknown authority` → the pivot never
# reconciles → step-06 Phase-3a's strip-readiness gate never converges →
# the cutover never reaches the 600s deny-egress hold → cutoverComplete
# never set (live on dep 00720a7a).
#
# WHY certSecretRef (not a skip flag): unlike skopeo (#4529 --dest-tls-
# verify=false), the helm CLI (#4557 --insecure-skip-tls-verify) and
# containerd (step-04 skip_verify), the Flux OCI HelmRepository API has NO
# `insecure`/`insecureSkipVerify` field for spec.type=oci — the ONLY trust
# mechanism source-controller honors is `spec.certSecretRef` pointing at a
# Secret whose `ca.crt` key holds the CA to verify the registry against
# (host-scoped to registry.<sov-fqdn>, same scoping #4573 F2's
# disableRedirect relies on). Step-06 extracts the in-cluster Harbor
# serving cert's CA from the wildcard TLS Secret and patches every pivoted
# HelmRepository's certSecretRef to it (live HR patch + durable Gitea edit),
# so source-controller trusts the LE-staging registry over the cluster
# network without trusting it publicly.
#
# This is a per-leg trust path consistent with the rest of the cert-tail;
# it does NOT widen source-controller's trust for any external host (the
# CA bundle here verifies ONLY the cluster's own registry cert chain).
helmRepositoryTrust:
  # Master switch. Default true — every fresh / qaTestEnabled prov serves
  # the in-cluster Harbor on an LE-staging (or otherwise node-untrusted)
  # wildcard, so source-controller needs the certSecretRef trust path. An
  # operator whose in-cluster Harbor presents a public-CA-trusted cert AND
  # whose source-controller already trusts it may set this false via
  # overlay (then the pivoted HRs pull with the default public trust store).
  enabled: true
  # The cert-manager TLS Secret backing the in-cluster Harbor's wildcard
  # serving cert. Lives in `kube-system` (clusters/_template/sovereign-tls/
  # cilium-gateway-cert.yaml: secretName sovereign-wildcard-tls-<fqdn-
  # dashed>). Step-06 reads its `ca.crt` (the issuing CA — LE-staging
  # intermediate on a fresh prov) and, if absent, falls back to `tls.crt`
  # (the served leaf+chain used as a self-trust bundle). The `<fqdn-dashed>`
  # suffix is computed at runtime from sovereign.fqdn ('.'->'-').
  sourceSecretNamespace: "kube-system"
  sourceSecretNamePrefix: "sovereign-wildcard-tls-"
  # Destination Secret created/updated by step-06 in the HelmRepository
  # namespace (flux-system) carrying ONLY the `ca.crt` key. Every pivoted
  # HelmRepository's spec.certSecretRef.name is patched to this. A
  # source-controller-only object — never exposes the cert's private key.
  destSecretName: "cutover-harbor-ca"

# catalyst-api Deployment to patch in step 07 (catalyst-api-env-patch).
# Sovereign-side namespace is `catalyst-system`, NOT `catalyst-platform`
# — caught live on otech103 2026-05-04 (Step-7 'deployment catalyst-api
# not found' in catalyst-platform). Verified `kubectl get deploy -A` →
# catalyst-system/catalyst-api.
catalystAPI:
  deploymentName: "catalyst-api"
  namespace: "catalyst-system"
  # The env var that catalyst-api reads for its GitOps source URL.
  envVar: "CATALYST_GITOPS_REPO_URL"

  # #4996 (Refs #4972 #4885) — pre-roll safety gates. Step-07 pivots
  # catalyst-api's imageRegistry to the local Harbor then rolls the Deployment
  # (Recreate). On kom4dc that WEDGED the cutover two ways (hw240 dep
  # 0f1aac5431e6a436): (a) the pivoted image was momentarily unpullable from the
  # local Harbor during a transient gateway blip → ImagePullBackOff cascade; (b)
  # the old Recreate pod's RWO-EVS PVCs did not detach — worse on a broken-CSI
  # node with no topology.evs.csi.huaweicloud.com/zone (#4972 wd2ab90) — so the
  # new pod hit Multi-Attach and never scheduled (succeeded=0 failed=4). These
  # gates make the roll bounded + self-healing + idempotent, and never leave the
  # Sovereign half-pivoted. All FAIL-OPEN (a tooling gap never wedges worse than
  # the prior blind `kubectl rollout status --timeout=300s`).
  rollSafety:
    # Master switch. false = revert to the blind `rollout status --timeout=300s`.
    enabled: true
    # Total budget (seconds) for the deadlock-aware rollout wait, replacing the
    # blind 300s. Covers image pull + EVS attach/detach on a slow Huawei prov.
    rollBudgetSeconds: 600
    # (a) image-warmed gate — before pivoting catalyst-api's imageRegistry,
    # confirm the local-Harbor catalyst-api manifest is present + servable
    # (authenticated HEAD, bounded poll). A genuine miss FATALs the step PRE-PIVOT
    # (recoverable re-run) instead of a blind pivot onto an unpullable image.
    imageWarmedGate:
      enabled: true
      pollSeconds: 240
    # (b/c) EVS detach + broken-CSI node gate. On a Recreate roll of an RWO-EVS-
    # backed catalyst-api, a stale VolumeAttachment / broken-CSI node deadlocks
    # the new pod on Multi-Attach (#4972). The gate cordons every node MISSING the
    # EVS zone label (broken CSI can't attach EVS) before the roll, drains
    # catalyst-api off such a node, and force-deletes VolumeAttachments that bind
    # catalyst-api's OWN PVs to a node with no live catalyst-api pod (provably
    # stale). NO-OP off Huawei (no node carries zoneLabel → Hetzner hcloud-csi).
    evsGate:
      enabled: true
      # The node label a correctly-registered Huawei EVS CSI publishes. A Ready
      # node LACKING it (while others carry it) is broken-CSI and is cordoned.
      # Empty disables the broken-CSI cordon (the detach-gate still runs).
      zoneLabel: "topology.evs.csi.huaweicloud.com/zone"

# #5527 — step-07 Phase 3d: the org-services provisioning Deployment (the
# per-Org GitOps tree generator, core/services/provisioning) is NOT covered by
# the catalyst-api env stamps above, yet its emitters declare the bp-* catalog
# OCI base in every tree they regenerate. Without a pivot fact readable from
# that process, the NEXT org mutation after cutover regenerates HelmRepository
# blocks pointing at oci://ghcr.io/openova-io and Flux drift-corrects the
# step-06 object pivot straight back — the hw291 step-08 OFFENDER wedge,
# recurring silently post-cutover (Pillar 5). Phase 3d stamps
# CATALYST_LOCAL_REGISTRY_URL=oci://<registry-host>/openova-io (derived from
# sovereign.harborPublicURL — the SAME value shape step-06 patches the live
# objects to) onto this Deployment via `kubectl set env`; the generator's
# explicit-override seam (cutover_aware_5527.go) flips on it. The set-env
# rolls the Deployment, so every subsequent regeneration carries the fact.
orgProvisioning:
  deploymentName: "provisioning"
  namespace: "org-services"

# #5439 — step-07 Phase 3e: the organization-controller Deployment. It renders
# the per-Org `vcluster/vcluster.yaml` (core/controllers/organization/internal/
# gitops/manifests.go) on EVERY Organization reconcile, and the IMAGE registry
# host it declares was never pivoted by any cutover step — the chart always
# stamps CATALYST_VCLUSTER_IMAGE_REGISTRY=harbor.openova.io (the MOTHERSHIP
# Harbor) and no step overrode it. Live on hw292 with cutoverComplete=true,
# HelmRelease uatco/vcluster still carried `image.registry: harbor.openova.io`
# in three places. Phase 3e stamps CATALYST_LOCAL_IMAGE_REGISTRY_HOST=
# harbor.<sovereign.fqdn> — byte-identical to step-10's target_host — onto this
# Deployment, the provisioning Deployment and catalyst-api. The var is absent
# from every chart manifest, so it survives the helm/Flux 3-way merge that
# would revert a set-env on CATALYST_VCLUSTER_IMAGE_REGISTRY itself.
orgController:
  deploymentName: "catalyst-organization-controller"
  namespace: "catalyst-system"

# #4885 (Refs #3379 #4563): step-07 image-registry pivot — the CURATED set of
# ADDITIONAL openova-io HelmReleases whose chart HONOURS global.imageRegistry
# and must be pivoted to the local Harbor at cutover.
#
# THE BUG (#4885 Defect 3, live wedge hw232): step-07 hard-coded the
# global.imageRegistry pivot to ONLY bp-catalyst-platform (~L71) +
# bp-openova-flow-server (#4563, ~L224). Every OTHER openova-io-image HR whose
# chart honours global.imageRegistry stayed on ghcr.io → under the step-08
# deny-egress hold its image ref 401s → the hold never goes green →
# cutoverComplete never set. bp-continuum is such a chart (its
# templates/_helpers.tpl `continuum.image` honours global.imageRegistry, same
# mechanism bp-catalyst-platform uses).
#
# Each entry is pivoted with the IDENTICAL live-HR-patch + durable-Gitea-edit
# pattern step-07 already applies to bp-catalyst-platform / bp-openova-flow-
# server: `kubectl patch hr <name> --type=merge -p
# '{"spec":{"values":{"global":{"imageRegistry":"<registry.fqdn>"}}}}'` plus a
# sed of the slot file's `imageRegistry: ''` seam (6-space indent) so Flux
# Kustomization doesn't revert the live patch. So every slotFile below MUST
# carry a `global.imageRegistry: ''` seam at 6-space indent (added to
# 62-bp-continuum.yaml in lockstep with this chart bump).
#
# ⚠️ ONLY list charts VERIFIED to template their images through
# global.imageRegistry. Patching an HR whose chart does NOT read the value is a
# SILENT NO-OP — the workload stays on ghcr.io and step-08 still FATALs, but the
# cutover log falsely reports the pivot "OK".
#
# #4892 (Refs #4885): bp-guacamole / bp-huawei-evs-csi / bp-newapi / bp-sandbox
# were FORMERLY excluded (their openova-io images were literal ghcr.io refs). The
# per-chart templating fix landed in #4892 — each image helper now host-swaps the
# leading registry segment when global.imageRegistry is set (verbatim ghcr.io when
# empty, byte-identical pre-cutover) — so they are now VERIFIED to honour the value
# and are listed below. Their bootstrap-kit slot files each carry a
# `global.imageRegistry: ''` seam at 6-space indent (added in lockstep with this
# chart bump) so the durable Gitea edit sticks.
#
# #4899 (Refs #4885, commit af60a2438): org-services marketplace.yaml + auth.yaml
# — FORMERLY the residual offender listed here — now template their image through
# `{{ if .Values.global.imageRegistry }}…{{ end }}`, so they pivot via the
# bp-catalyst-platform HR patch step-07 already applies. That residual is CLOSED;
# no org-services entry is needed here.
#
# #4961 (Refs #4885): the LAST residual — the two bootstrap-kit DaemonSets
# bp-openova-flow-emitter (slot 57) + bp-k8s-ws-proxy (slot 51) — carried literal
# ghcr.io images because their image helpers ignored global.imageRegistry. Under
# the step-08 generalized fresh-pull they rolled under the ghcr.io deny-egress →
# 401 → cutoverComplete stayed false (hw235). This bump makes both helpers
# registry-aware AND lists their HRs in additionalHRs below, so step-07 pivots
# them with the identical live-HR-patch + durable-Gitea-edit pattern. With that,
# NO openova-io-image HR is left un-pivoted — there is no remaining residual.
# #4975 (Refs #3379 #3695 #4885): DEMOTED to an OPTIONAL fallback. step-07's
# global.imageRegistry pivot (this list) is now a BELT to the step-04 offline
# mirror's SUSPENDERS: even an openova-io-image HR whose chart does NOT honour
# global.imageRegistry — so step-07 leaves it on a literal ghcr.io/openova-io ref
# — survives the step-08 deny-egress hold, because step-03 Phase A3 pushed that
# image into registry.<fqdn>/proxy-ghcr/openova-io/<path> and step-04 rewrites
# ghcr.io → that local path. So a chart missing from this list no longer FATALs
# the cutover (the old whack-a-mole). The list is KEPT because pivoting the HR to
# global.imageRegistry is still the CLEANER end-state (the pod ref reads
# registry.<fqdn> directly, no containerd rewrite dependency) — but it is no
# longer the sole thing standing between a new chart and a wedged cutover.
imageRegistryPivot:
  additionalHRs:
    - name: bp-continuum
      namespace: flux-system
      slotFile: clusters/_template/bootstrap-kit/62-bp-continuum.yaml
    # #4892 (Refs #4885): the charts formerly excluded above now honour
    # global.imageRegistry, so their HRs pivot cleanly (no longer silent no-ops).
    # Each metadata.name matches the live HelmRelease the cutover patches, and
    # each slotFile carries the 6-space `global.imageRegistry: ''` seam.
    # #5215: bp-huawei-evs-csi is DELIBERATELY NOT in this pivot list — pivoting
    # its HR imageRegistry rolls the csi-evs-node DaemonSet, which drops the
    # node-side NodeStage globalmount for already-attached EVS volumes → every
    # EVS-backed pod that remounts hits `globalmount does not exist` (exit 32)
    # and catalyst-api (2 RWO-EVS PVCs, also rolling in step-07) wedges
    # ContainerCreating → the #4996 rollout-wait errors → cutover wedges. step-04's
    # containerd certs.d rewrite ALREADY pivots its images to local WITHOUT a roll,
    # so the pivot is redundant AND harmful. Enforced by excludeHelmReleases below
    # (step-08 excludes the same driver for the identical reason — #5074).
    - name: bp-guacamole
      namespace: flux-system
      slotFile: clusters/_template/bootstrap-kit/52-bp-guacamole.yaml
    - name: bp-newapi
      namespace: flux-system
      slotFile: clusters/_template/bootstrap-kit/80-newapi.yaml
    - name: bp-sandbox
      namespace: flux-system
      slotFile: clusters/_template/bootstrap-kit/19a-bp-sandbox.yaml
    # #4961 (Refs #4885): the two remaining un-pivoted bootstrap-kit DaemonSets.
    # Both carried a literal ghcr.io image (their image helpers ignored
    # global.imageRegistry), so under the step-08 generalized fresh-pull
    # (egressTest.rollAllExternalRegistryWorkloads) they rolled under the ghcr.io
    # deny-egress → 401 → step-08 exited 1 → cutoverComplete stayed false (the
    # #4885 residual, hw235). Each image helper now host-swaps the leading registry
    # segment when global.imageRegistry is set (verbatim ghcr.io when empty), so
    # their HRs pivot cleanly. Each slotFile carries the 6-space
    # `global.imageRegistry: ''` seam so the durable Gitea edit sticks.
    - name: bp-openova-flow-emitter
      namespace: flux-system
      slotFile: clusters/_template/bootstrap-kit/57-bp-openova-flow-emitter.yaml
    - name: bp-k8s-ws-proxy
      namespace: flux-system
      slotFile: clusters/_template/bootstrap-kit/51-bp-k8s-ws-proxy.yaml

  # #5215 — storage/CSI-driver HelmReleases that step-07 MUST NEVER pivot, even
  # if an overlay (or a future edit) re-adds one to additionalHRs above. Deny
  # wins over allow: the additionalHRs loop skips any HR whose name is listed
  # here. Patching a CSI driver's global.imageRegistry rolls its node plugin
  # (csi-evs-node DaemonSet); the rolled plugin loses the node-side NodeStage
  # `globalmount` for already-attached EVS volumes, so any EVS-backed pod that
  # remounts on that node fails `MountVolume.SetUp ... globalmount does not
  # exist ... exit status 32`. catalyst-api (Recreate, 2 RWO-EVS PVCs) rolls in
  # the SAME step-07 window and wedges ContainerCreating → the #4996 rollout
  # wait errors → cutover wedges (live hw271, cutoverComplete never re-set after
  # a re-fire). step-04's registry-pivot DaemonSet ALREADY rewrites the node
  # containerd certs.d so the CSI images resolve to the local registry WITHOUT a
  # roll, so the HR pivot is redundant AND harmful. This is the step-07 twin of
  # step-08's CSI exclusion (#5074: never bounce the mechanism every stateful
  # mount depends on). Auditable + overlay-extensible.
  excludeHelmReleases:
    - bp-huawei-evs-csi

  # #4973 #4975 #4961 — COMPREHENSIVE pod-spec image sweep (step-07 Phase 4).
  #
  # THE WHACK-A-MOLE, ROOTED. additionalHRs above pivots an HR's
  # spec.values.global.imageRegistry — which only reaches images the chart
  # renders THROUGH that value. Three classes slip through and keep a NON-local
  # pod-spec ref, which step-08's roll-set then rolls under the deny-egress hold
  # → ImagePullBackOff → cutoverComplete never sets:
  #   • #4973 — evs-csi CSI SIDECARS (csi-provisioner/attacher/resizer/
  #     snapshotter/livenessprobe/node-driver-registrar) pinned by full ref;
  #   • #4975 — continuum's prerequisite-check INITCONTAINER, whose image is a
  #     hardcoded harbor.openova.io/proxy-dockerhub/alpine/k8s ref set OUTSIDE
  #     global.imageRegistry, AND the continuum-controller ghcr tether;
  #   • #4961 — bp-openova-flow-emitter (+ siblings) whose helper ignores the
  #     value on some paths.
  # Rather than chase each chart-helper (the shallow per-workload allowlist that
  # keeps missing the NEXT un-pivoted image), step-07 Phase 4 sweeps EVERY
  # container + initContainer of every external-registry workload and rewrites
  # its registry host to registry.<fqdn> using the SAME offline-mirror resolver
  # step-03 (push) / step-04 (containerd) / step-08 (completeness gate) share —
  # so the sweep target is byte-identical to where the image actually lives
  # locally. This is the SUSPENDERS to the HR-pivot BELT and the step-04
  # containerd-rewrite (which remains the durable steady-state safety net after a
  # Flux reconcile reverts a non-honouring chart's pod-spec ref).
  podSpecSweep:
    # Default ON — the deny-egress proof cannot go green while any pod-spec still
    # carries a non-local ref; disabling this re-opens the whack-a-mole.
    enabled: true
    # Never sweep the cutover engine's own catalyst-api (step-07 pivots it via the
    # bp-catalyst-platform HR + env roll above). Substring match on workload name.
    excludeWorkloadSubstring: "catalyst-api"
    # #5215 — storage/CSI-driver workloads ("<namespace>/<name>") the sweep MUST
    # NEVER touch. Rewriting a CSI driver's pod-spec image rolls its node plugin
    # (csi-evs-node DaemonSet), which drops the node-side NodeStage `globalmount`
    # for already-attached EVS volumes → every EVS-backed pod that remounts on
    # that node fails `globalmount does not exist` (exit 32) and catalyst-api (2
    # RWO-EVS PVCs) wedges ContainerCreating → the #4996 rollout wait errors →
    # cutover wedges (live hw271). This is the second step-07 vector that rolls
    # the driver (the additionalHRs HR pivot is the first — see
    # excludeHelmReleases above); both are closed for the same root cause. step-04's
    # containerd certs.d rewrite already resolves the CSI images to local WITHOUT a
    # roll, and step-08 excludes the same drivers by name (#5074) + never rolls a
    # DaemonSet in an infra namespace (#5081 rule b). Covers Huawei EVS + Hetzner
    # hcloud CSI (driver + controller); auditable + overlay-extensible.
    excludeWorkloads:
      - "huawei-evs-csi/csi-evs-node"
      - "huawei-evs-csi/csi-evs-controller"
      - "kube-system/hcloud-csi-node"
      - "kube-system/hcloud-csi-controller"
    # Refuse to pivot a pod-spec image onto a ref the local Harbor does not yet
    # serve — leave it as-is so step-08's completeness gate names the REAL offender
    # instead of a sweep-induced ImagePullBackOff. Keep ON.
    presenceGate: true

# Step container images. The first three steps (01..03) + the
# registry-pivot DaemonSet use upstream-public images because they run
# BEFORE registries.yaml v2 takes effect on the node containerd.
# Post-pivot steps (≥ 05) MAY use the local Harbor copy via
# global.imageRegistry — defaulted off so smoke render is clean.
#
# Fix #163 (2026-05-11, MIRROR-EVERYTHING): every default repository
# is now the explicit Harbor proxy-cache path per CLAUDE.md inviolable
# rule. The Sovereign's k3s cloudinit (infra/hetzner/cloudinit-control-
# plane.tftpl line 706) ALWAYS configures containerd with
# /etc/rancher/k3s/registries.yaml routing docker.io → harbor.openova.io
# BEFORE k3s starts, so the pre-cutover Jobs can reach the explicit
# Harbor URL just fine. Post-cutover overlay via global.imageRegistry
# remains the operator override for true air-gap mode.
images:
  kubectl:
    # alpine/k8s is the canonical alpine-based image carrying kubectl +
    # helm + the standard k8s CLI surface (replaced bitnami/kubectl in
    # 2025 after Bitnami's deprecation on Docker Hub).
    repository: "harbor.openova.io/proxy-dockerhub/alpine/k8s"
    tag: "1.31.4"
  git:
    repository: "harbor.openova.io/proxy-dockerhub/alpine/git"
    tag: "v2.45.2"
  curl:
    repository: "harbor.openova.io/proxy-dockerhub/curlimages/curl"
    tag: "8.10.1"
  # registry-pivot writes to /etc/rancher/k3s/registries.yaml on every
  # node. Uses alpine + `chroot /host` invocation pattern (kubectl not
  # required — direct file write via host mount).
  hostExec:
    repository: "harbor.openova.io/proxy-dockerhub/library/alpine"
    tag: "3.20"

# registry-pivot DaemonSet — runs from chart install to converge each node's
# containerd registry mirror onto the local Dragonfly dfdaemon (#4639). The
# DaemonSet starts DORMANT and only acts when catalyst-api updates the
# cutover-status ConfigMap key `registriesYamlActive` to "v2" — see template
# 04-registry-pivot-daemonset.yaml. Operators can disable the always-on
# DaemonSet shape via overlay; in that case catalyst-api stamps the DaemonSet
# on demand at trigger time.
registryPivot:
  enabled: true
  # #4639 (Refs #4637) — Dragonfly P2P registry-pivot. THE GENERIC HAIRPIN KILL.
  #
  # Every node's containerd already mirrors through the node-LOCAL dfdaemon
  # proxy on 127.0.0.1:<proxyPort> (bp-dragonfly, slot 06). The cutover does
  # two generic moves (no per-cloud branches):
  #   1. write the containerd `_default/hosts.toml` catch-all → the dfdaemon
  #      proxy (effective on the running node, containerd re-reads per pull);
  #   2. flip the dfdaemon (+ seed-peer) `proxy.registryMirror.addr` from
  #      https://ghcr.io → the cluster-LOCAL Harbor external host
  #      https://registry.<fqdn> (implicit :443, via the Gateway LoadBalancer).
  # #4682: the registry is reached over its external routable host
  #      https://registry.<fqdn> on :443 (the Cilium Gateway `Service
  #      type=LoadBalancer` ExternalIP), so the old hostAlias→cilium-gateway
  #      ClusterIP hairpin (move 3), the coredns-custom registry-local.server
  #      rewrite, and the per-cloud `/etc/hosts`/`30443`/DNAT surgery are all
  #      gone. The node→127.0.0.1 dfdaemon path is identical on Huawei + Hetzner.
  dragonfly:
    # The dfdaemon proxy port every node's containerd mirrors through. Matches
    # bp-dragonfly client.config.proxy.server.port (127.0.0.1:4001 on the 2.x
    # client this Sovereign runs).
    proxyPort: "4001"
    # The bp-dragonfly mesh namespace + the per-node dfdaemon DaemonSet, the
    # seed-peer StatefulSet, and their config ConfigMaps the cutover patches
    # for the upstream flip + hostAlias. These are the upstream dragonfly chart
    # resource names (releaseName `dragonfly`). Seed names empty-string-safe:
    # a Sovereign without a seed peer leaves them blank and the cutover skips
    # the seed patch.
    namespace: "dragonfly"
    clientDaemonSet: "dragonfly-client"
    clientConfigMap: "dragonfly-client"
    seedStatefulSet: "dragonfly-seed-client"
    seedConfigMap: "dragonfly-seed-client"
    # Bounce dfdaemon (+ seed) after the upstream flip so it reloads the new
    # registryMirror.addr. DEFAULT false: the addr-only ConfigMap change is
    # picked up by the next dfdaemon/seed roll. Operators who pin the dfdaemon
    # config via an immutable ConfigMap (no auto-reload) can flip this true via
    # overlay to force a restartedAt bump.
    #
    # #4682: the old hostAlias→cilium-gateway-ClusterIP machinery
    # (gatewayServiceName/gatewayServiceNamespace), the :30443 gateway-HTTPS-port
    # append (gatewayHTTPSPort), and the coredns registry-local.server rewrite
    # are all removed. The dfdaemon dials the registry over its EXTERNAL routable
    # host https://registry.<fqdn> on :443 (the Cilium Gateway `Service
    # type=LoadBalancer` ExternalIP) — no in-cluster ClusterIP, no NodePort, no
    # CoreDNS override.
    restartOnFlip: false

    # ── #4652 cert trust: dfdaemon registryMirror.cert ─────────────────────
    # Post-flip the dfdaemon back-to-sources to the LE-staging in-cluster Harbor
    # over TLS; the Rust resolver does real x509 verification → fail. The
    # dragonfly-client `proxy.registryMirror.cert` PEM path is the trust anchor.
    # The registry-pivot reads the in-cluster Harbor wildcard TLS Secret and
    # creates a `dragonfly`-namespace Opaque Secret carrying tls.crt; bp-dragonfly
    # (0.1.1) mounts it OPTIONALLY at certMountPath; the cutover sets
    # registryMirror.cert = <certMountPath>/tls.crt in the same ConfigMap patch
    # that flips registryMirror.addr.
    harborCA:
      enabled: true
      # Source wildcard TLS Secret (cert-manager) — name = <prefix><fqdn-dashed>
      # in sourceNamespace; mirrors helmRepositoryTrust.sourceSecret* (#3379).
      sourceNamespace: "kube-system"
      sourceNamePrefix: "sovereign-wildcard-tls-"
      # The Opaque Secret the pivot creates in the dragonfly namespace; matches
      # the bp-dragonfly 0.1.1 optional extraVolume secretName.
      destSecretName: "dragonfly-harbor-ca"
      # The path bp-dragonfly mounts the cert at; registryMirror.cert is set to
      # <certMountPath>/<certFileName>. The pivot writes the wildcard tls.crt
      # under the `tls.crt` data key, so the mounted file is <path>/tls.crt.
      certMountPath: "/etc/dragonfly-ca"
      certFileName: "tls.crt"

  # ── #5007 (Refs #4682 #3379) — NODE /etc/hosts pin for the local registry ────
  #
  # ROOT CAUSE (hw241 live cutover, step-07 catalyst-api roll onto a fresh node):
  # post-pivot every image ref is registry.<sov-fqdn>/... A NEW pod that must pull
  # the image fresh (a roll onto a node that had not cached it) failed
  #   Failed to pull "registry.hw241.omantel.biz/openova-io/openova/catalyst-api:
  #   <tag>": dial tcp 49.12.16.160:443: connect: connection refused
  # 49.12.16.160 is a DEAD Hetzner IP from a wiped Hetzner-era env that the public
  # `*.omantel.biz` WILDCARD still points at. A specific `registry.<fqdn>` A record
  # (the live gateway VIP) exists and SHOULD win over the wildcard at the
  # authoritative NS, but the cluster NODES' resolver returns the dead wildcard IP
  # for registry.<fqdn>, so containerd dials the dead IP → ImagePullBackOff → the
  # step-07 roll (and every post-pivot fresh pull) wedges. The pod path is fine
  # (CoreDNS resolves the specific record); only the NODE/containerd path breaks.
  #
  # THE FIX (robustness — eliminate DNS from the local-registry datapath). The
  # registry-pivot DaemonSet already runs privileged on every node and writes the
  # containerd certs.d. It now ALSO maintains a NODE `/etc/hosts` pin
  # `<gateway-VIP> registry.<fqdn>` so containerd resolves the local registry
  # DIRECTLY to the Harbor gateway VIP the platform already knows — NEVER via the
  # public wildcard-vs-specific race. The VIP is derived AT RUNTIME (no hardcoded
  # IP, Principle #4): the cilium-gateway `type=LoadBalancer` Service's
  # status.loadBalancer.ingress[0].ip (the hcloud-ccm ExternalIP on Hetzner / the
  # CiliumLoadBalancerIPPool VIP on no-CCM Huawei); on the hostNetwork-gateway
  # provider (Huawei #4706 — cilium-envoy binds node:443 directly, so there is NO
  # LB Service VIP) it falls back to the node's OWN IP (status.hostIP), which
  # serves :443 locally. The Host header / SNI stay registry.<fqdn> so the Gateway
  # HTTPRoute still matches — only DNS resolution is pinned. Idempotent, reconciled
  # every sweep, removed on rollback (v1). Fail-OPEN: if NO VIP can be derived the
  # pin is skipped (never wedges worse than the prior DNS-dependent behaviour).
  localRegistryHostPin:
    enabled: true
    # The cilium-gateway LoadBalancer Service whose ingress VIP serves
    # registry.<fqdn> (LB-Service gateway model — Hetzner hcloud-ccm / Huawei
    # CiliumLoadBalancerIPPool). Cilium auto-creates it as
    # `cilium-gateway-<gateway-name>` in kube-system; the Sovereign Gateway is
    # named `cilium-gateway`, so the Service is `cilium-gateway-cilium-gateway`.
    # Empty name disables the Service lookup — the pin then uses the node's own IP
    # (status.hostIP), correct for the hostNetwork gateway model.
    gatewayServiceName: "cilium-gateway-cilium-gateway"
    gatewayServiceNamespace: "kube-system"

# CiliumNetworkPolicy for step 08 (egress-block-test). Operator
# overrides duration via overlay if 10 min isn't enough.
egressTest:
  durationSeconds: 600
  # #2940 — real egress-block enforcement. OFF by default: a mis-resolved
  # upstream CIDR overlapping a live dependency would FAIL Step-08 → the
  # cutover engine aborts → half-pivoted unrecoverable prov. So this stays
  # opt-in until validated on a cutover walk, after which the default
  # flips to true. When false, Step-08 keeps its current behavior (local-
  # URL assertion + survival-window poll). When true, Step-08 also resolves
  # blockedDomains → public IPs and applies a scoped CiliumNetworkPolicy
  # egressDeny toCIDR for the survival window, catching hidden runtime
  # tethers the declarative assertion can't see.
  #
  # 0.1.57 (#3379, 2026-06-14): default flipped false → true. The real
  # 10-min deny-egress hold was validated live on the hw136 cutover walk
  # (Pillar-5 proof): all four blockedDomains (github.com, ghcr.io,
  # harbor.openova.io, xpkg.upbound.io) resolve to PUBLIC IPs that never
  # overlap a Sovereign's pod (10.42/43.x) or service (10.96/97.x) CIDR,
  # and the Step-08 Job skips private/loopback IPs + is fail-safe (any
  # resolve/apply error falls back to assertion-only, the egressDeny
  # policy is torn down on every pass/fail/abort path). So the egress-
  # block proof — `cutoverComplete=true` earned ONLY with a real deny-
  # egress hold, per ADR-0002 — is now the default for every Sovereign,
  # not just those whose 06a overlay opts in. The 06a slot overlay's
  # explicit `egressTest.enforceCIDRBlock: true` is now redundant-but-
  # harmless (overlay still wins; both agree).
  enforceCIDRBlock: true
  # #3647 (hw149 live repro) — FRESH-PULL proof under deny-egress. The
  # legacy Step-08 only watched that ALREADY-RUNNING pods stayed Ready, so
  # it certified "no external deps" WITHOUT ever exercising the one path
  # that breaks post-cutover: a brand-new image pull. With the egressDeny
  # CCNP applied (4 tether CIDRs blocked, apiserver/DNS/intra-cluster
  # untouched via enableDefaultDeny.egress:false), Step-08 now FORCE-rolls
  # one openova-io-imaged workload (deletes a single Pod) and REQUIRES the
  # replacement Pod to reach Running by pulling its image from local Harbor
  # — proving the registry-pivot certs.d mirror (Step-04) actually serves
  # openova-io images with external egress denied. If the new Pod lands in
  # ImagePullBackOff/ErrImagePull (mirror inert → still resolving ghcr.io)
  # the proof FAILS and cutoverComplete stays false. Fail-safe: only runs
  # when the egressDeny policy was actually applied; if NO suitable
  # openova-io Deployment is found, or the bounce can't be performed, it
  # logs and falls back to the survival-poll only (never wedges the cutover
  # on a tooling gap). Tune/disable per-Sovereign via overlay.
  freshPullProof:
    # Master switch. Default true so every cutover earns cutoverComplete
    # only with a witnessed fresh pull under deny-egress (ADR-0002 intent).
    enabled: true
    # Optional explicit target. Empty = auto-discover an openova-io-imaged
    # Deployment at runtime (any namespace, excluding catalyst-api so the
    # cutover engine's own API is never bounced). Set both to pin a
    # specific workload if auto-discovery picks a poor candidate.
    namespace: ""
    deployment: ""
    # Deployment name substring NEVER selected by auto-discovery (the
    # cutover runs inside catalyst-api; bouncing it mid-hold is unsafe).
    excludeDeploymentSubstring: "catalyst-api"
    # How long to wait for the freshly-rolled workload's rollout to settle.
    # 240 → 600 (#5022, hw242 run 3): a Deployment's pull is seconds (local
    # mirror), but `kubectl rollout status` on a MULTI-NODE DaemonSet under
    # RollingUpdate(maxUnavailable:1) is SEQUENTIAL — 6 nodes x (pull +
    # start + ready) blew the 240s budget and FAILed registry-pivot + falco
    # spuriously. 600s covers a 6-node Sovereign; DaemonSets additionally
    # get a per-node budget below. Any ImagePull error observed still FAILS
    # immediately regardless of the budget.
    timeoutSeconds: 600
    # Per-node rollout budget for DaemonSets (#5022): the effective per-DS
    # timeout is max(timeoutSeconds, desiredNumberScheduled x
    # dsPerNodeSeconds), so a wide cluster scales its budget with node
    # count instead of failing on a constant.
    dsPerNodeSeconds: 120
    # Workloads NEVER rolled by step-08's fresh-pull sweep, as "<ns>/<name>"
    # pairs (#5022, hw242 run 3). catalyst/registry-pivot IS the pivot
    # mechanism itself — the certs.d/hosts mirror every OTHER fresh pull
    # depends on. Rolling it mid-hold is recursive: a mid-roll node briefly
    # loses its registry pivot exactly while the proof pulls images on that
    # node, and its readiness (first-reconcile-pass gate) was already
    # proven by the step-04 daemonset-wait + per-node v2 ACK assertions.
    excludeWorkloads:
      - "catalyst/registry-pivot"
      # kube-system/hubble-ui-oauth2-proxy (#5059): oauth2-proxy does a BLOCKING
      # OIDC discovery to the PUBLIC issuer at boot; under the deny-egress hold
      # that hairpin (pod→gateway EIP→keycloak) intermittently exceeds its 30s
      # timeout → CrashLoop → a freshly-rolled pod blows the roll budget → the
      # whole sweep restarts (hw250 looped ~5x/3h). Rolling it proves nothing
      # about mirror completeness (image already HEAD'd); exclude it by ns/name.
      - "kube-system/hubble-ui-oauth2-proxy"
      # falco/falco (#5065): the falcoctl-artifact-install init pulls the rules
      # OCI artifact per-pod, so a 6-node DaemonSet roll takes ~9min under
      # deny-egress — it blows the step deadline for ZERO added sovereignty (the
      # completeness HEAD gate + ref-host lint already prove falco's image is in
      # local Harbor). Skip the synthetic roll; #5063 keeps falco genuinely
      # recreatable (Kyverno resource-requests exempt) for real node-replace /
      # region-kill.
      - "falco/falco"
      # CSI drivers (#5074): rolling the CSI DRIVER mid-hold is self-defeating —
      # the csi-evs-node DaemonSet restart desyncs NodeStage/NodePublish, so every
      # OTHER stateful EVS/PV-backed workload rolled in the same sweep (gitea,
      # grafana, …) gets NodePublishVolume against a globalmount the restarted
      # plugin never re-staged → `special device .../globalmount does not exist`
      # (exit 32) → blows the roll budget → step-08 FAILs. Recursive, exactly like
      # registry-pivot: never bounce the mechanism every other stateful mount
      # depends on. CSI image-locality is already proven (running from local
      # post-pivot + the completeness HEAD gate). Caught live hw251 step-08.
      - "huawei-evs-csi/csi-evs-node"
      - "huawei-evs-csi/csi-evs-controller"
      - "kube-system/hcloud-csi-node"
      - "kube-system/hcloud-csi-controller"
    # ── #5074/#5065/#5059 ROLL-SET MODE (the treadmill-breaker) ──────────
    # The per-workload excludeWorkloads list above is whack-a-mole: each prov
    # surfaced ONE more infra workload that breaks when force-rolled under the
    # deny-egress hold (oauth2-proxy #5059 → falco #5065 → CSI drivers #5074).
    # "minimal" (the new default) replaces name-by-name exclusion with a RULE:
    # the forced fresh-pull roll targets only ORDINARY APP workloads —
    #   (a) nothing in infraNamespaces (kube-system / huawei-evs-csi /
    #       catalyst) unless explicitly named in infraRepresentativeAllowlist;
    #   (b) NEVER a DaemonSet in an infra namespace (its restart risks the
    #       hold's own machinery: CSI mounts, CNI, the registry pivot) — rule
    #       (b) is unconditional, an allowlist entry cannot re-include one;
    # and rolls a REPRESENTATIVE SAMPLE rather than all ~130 workloads: every
    # candidate in representativeNamespaces (the stateful-PVC / gitops / auth /
    # registry / observability classes: flux-system, gitea, harbor, keycloak,
    # grafana) plus a top-up of other candidate Deployments to at least
    # minRepresentativesPerRegion x <node-region-count>. Image locality for
    # everything NOT rolled stays HARD-gated by the #4975 pre-hold completeness
    # HEAD gate (every workload image HEADed against local Harbor) + the #5026
    # pre-hold ref-host lint (every pod-spec ref host local or step-04
    # redirect-covered) — both prove locality WITHOUT rolling. The deny-egress
    # curl call-home proof (github/ghcr/harbor.openova.io/console must be
    # unreachable) is UNTOUCHED in both modes — that is the sovereignty proof.
    # "full" keeps the legacy behaviour byte-for-byte: roll EVERY workload
    # whose pod-spec references a non-local registry host, minus the
    # name-based excludeWorkloads above (which stay honoured in BOTH modes
    # for back-compat).
    rollSetMode: "minimal"
    # Namespaces treated as INFRA by minimal mode's rule (a)/(b). These host
    # the hold's own machinery (CNI/CSI/oauth2-proxy sidecars in kube-system,
    # the EVS CSI driver, the cutover engine + registry-pivot in catalyst).
    infraNamespaces:
      - "kube-system"
      - "huawei-evs-csi"
      - "catalyst"
    # Explicit "<ns>/<name>" workloads inside infraNamespaces that minimal
    # mode MAY still roll (a representative infra Deployment, if an operator
    # wants one proven by roll). Empty by default. DaemonSets in infra
    # namespaces are excluded UNCONDITIONALLY (rule b) even if listed here.
    infraRepresentativeAllowlist: []
    # Floor of the representative sample, PER REGION (node
    # topology.kubernetes.io/region labels; 1 when unlabeled). If the
    # representativeNamespaces candidates number fewer than
    # minRepresentativesPerRegion x regions, minimal mode tops the roll set
    # up with other (non-infra) candidate Deployments to the floor.
    minRepresentativesPerRegion: 12
    # Namespaces whose candidate workloads are ALWAYS in the minimal roll
    # set — one per image-registry-dependent workload class: gitops engine
    # (flux-system), stateful-PVC git (gitea), the registry itself (harbor),
    # auth (keycloak), observability (grafana — the bootstrap-kit slot-25
    # targetNamespace; the task-name "grafana-stack" class).
    representativeNamespaces:
      - "flux-system"
      - "gitea"
      - "harbor"
      - "keycloak"
      - "grafana"
    # ── #5091 rule c: exclude stateful RWO-EVS singletons from the ROLL set ─
    # The #5081 minimal roll-set (rules a/b) correctly excludes the infra
    # namespaces + infra DaemonSets, but a REPRESENTATIVE-namespace stateful
    # singleton — gitea (RWO evs-ssd 20Gi, Recreate strategy), keycloak-
    # postgresql, harbor-database/redis, cnpg, … — is still selected and
    # force-rolled. Rolling such a workload under the deny-egress hold triggers
    # the UNRECOVERABLE CSI NodeStage/VolumeAttachment desync: the Recreate
    # roll's NodeUnstage removes the EVS globalmount, the VolumeAttachment
    # persists unchanged, so the CSI node driver never re-fires NodeStage and
    # NodePublish then fails `special device .../globalmount does not exist`
    # (exit 32) → the replacement pod hangs Init:0/3 past the roll budget →
    # ROLL_FAIL → step-08 fails forever (proven LIVE on hw253 gitea, #5091).
    # The image locality of every such workload is ALREADY proven by the #4975
    # pre-hold completeness HEAD gate + the #5026 ref-host lint (both prove
    # locality WITHOUT rolling), so the synthetic roll adds ZERO image-proof
    # value. rule c therefore SKIPS any Deployment/StatefulSet mounting an RWO
    # PVC whose storageClass is in storageClasses OR whose bound-PV CSI driver
    # is in csiDrivers. This ONLY narrows the ROLL set — the fresh-pull ROLL
    # proof rolls STATELESS representative workloads only; rule a/b, the
    # completeness gate, the ref-host lint, the 600s deny-egress hold and the
    # curl call-home proof are all untouched. The ≥minRepresentativesPerRegion
    # floor is still met from the STATELESS pool: rule c filters the candidate
    # universe BEFORE both the representative selection AND the Deployment
    # top-up, so the top-up naturally draws only stateless workloads (a real
    # Sovereign has dozens of stateless non-infra Deployments — far above the
    # 12/region floor).
    rwoEvsExclusion:
      # Master switch (default true — the keystone cc=true path needs it).
      enabled: true
      # StorageClass names treated as EVS-backed RWO block storage. Huawei EVS
      # by default; add hcloud-volumes (Hetzner) or another block CSI's class
      # via overlay for provider parity (matches the excludeWorkloads pattern
      # that carries hcloud-csi names as a harmless no-op when absent).
      storageClasses:
        - "evs-ssd"
      # Bound-PV CSI driver names treated as EVS-backed RWO block storage —
      # the second, storageClass-independent detection leg (a PVC with an empty
      # storageClassName but a bound PV on this driver is still caught).
      csiDrivers:
        - "evs.csi.huaweicloud.com"
  # #5026 — PRE-HOLD ref-host lint (treadmill-breaker). The completeness gate
  # above proves image CONTENT is in local Harbor; this lint proves every
  # rolled workload's pod-spec image REF HOST is the local registry
  # (registry.<fqdn>). A ref still pointing at a tether host (harbor.openova.io
  # mothership, ghcr.io, quay.io, …) that step-07's sweep failed to pivot is a
  # latent deny-egress ImagePullBackOff — and, worse, discovered ONE HOST PER
  # PROV (the serialized-discovery treadmill #5010/#5017/#5020-25 walked, 3
  # provs tonight). This lint fails LOUD listing EVERY offender at once so the
  # NEXT prov surfaces the whole un-pivoted set in one shot. Implicit-docker.io
  # refs (bare name / ns/name with no dotted first segment) and the
  # offlineMirror excluded hosts/substrings are NOT offenders (the sweep skips
  # them by design). Default ON — the class-breaker for #5026.
  podspecRefHostLint:
    enabled: true
  # #5650 — Flux SOURCE host lint. The companion to podspecRefHostLint, and the
  # timing-independent half of the Pillar-5 proof.
  #
  # The deny-egress hold below applies a cluster-wide default-deny CCNP, holds
  # for durationSeconds, and is then TORN DOWN. That proves nothing external was
  # REACHABLE during the window. It does NOT prove the Sovereign has no external
  # DEPENDENCY, and ADR-0002 asserts the second. Live hw292 (2026-08-04):
  # HelmRepository vcluster-system/loft -> https://charts.loft.sh, interval 15m,
  # not suspended, referenced by a live HelmRelease. A 15m interval can straddle
  # a 600s hold entirely, so it never dialled while the policy was up; its
  # artifact was then re-fetched from the public internet ~10h AFTER
  # cutoverComplete=true. The hold passed, and was right to pass — nothing
  # asserted over the object graph.
  #
  # This lint asserts the property directly: every non-suspended HelmRepository,
  # GitRepository and OCIRepository must resolve to a Sovereign-local host.
  #
  # NOTE the exemption set is deliberately NARROWER than podspecRefHostLint's.
  # That lint exempts step-04 HOST_PROJECT_MAP hosts because containerd rewrites
  # IMAGE pulls via certs.d. Flux's source-controller fetches these URLs itself
  # and never traverses containerd, so a certs.d redirect cannot cover a source
  # object — only genuinely local hosts count.
  #
  # allowHosts is EMPTY by default so the lint fails closed: an external host is
  # a tether until a human declares otherwise here, in Git, under review. Adding
  # an entry is a reviewable sovereignty exception, not a config tweak.
  fluxSourceHostLint:
    enabled: true
    # allowHosts is EMPTY — the #5650 instance fix has landed, so there is no
    # longer a residual external Flux source to declare an exception for, and an
    # external host is a tether until a human declares otherwise here, in Git,
    # under review.
    #
    # HISTORY. This key formerly carried `charts.loft.sh`, a SHIPPED EXCEPTION
    # for the one Flux source the step-06 URL-pivot missed:
    # `clusters/_template/bootstrap-kit/60-bp-vcluster-helmrepo.yaml` installs
    # HelmRepository vcluster-system/loft at https://charts.loft.sh (a
    # traditional index.yaml source the org-controller renders per-Org vcluster
    # HelmReleases against). The URL-pivot walked flux-system OCI
    # HelmRepositories only, so it missed loft on BOTH axes — wrong namespace
    # (vcluster-system) and wrong kind (index.yaml, not the openova-io OCI
    # prefix). The exception was the honest stop-gap: convert an UNKNOWN
    # residual tether into a DECLARED one until the mirror+repoint landed.
    #
    # It has landed. `helmRepositories.vclusterLoftPivot` (step-06 Phase-2c)
    # now mirrors the upstream vcluster chart into the Sovereign's local Harbor
    # while egress is still open, repoints the loft HelmRepository to that
    # Sovereign-local OCI copy (oci://registry.<fqdn>/openova-io), and suspends
    # the bp-vcluster-helmrepo HelmRelease (live + durably in the Gitea slot)
    # so the pivot is not reverted. By the time this step-08 lint runs the loft
    # source already resolves to a Sovereign-local host and passes with an
    # EMPTY allowHosts — the lint now proves the tether is GONE, not merely
    # declared. Every host nobody has declared still fails closed (#5650).
    allowHosts: []
  # #5359 — the SOURCE-HEALTH half of the same gate. fluxSourceHostLint above
  # asserts what every Flux source DECLARES (spec.url); this asserts whether the
  # controller ever CONVERGED on that declaration (observedGeneration ==
  # generation on a Ready source).
  #
  # Why both are needed, from the live hw292 failure. Step-05's secondary leg
  # patched region-b's GitRepository url to the local Gitea and recorded
  # result=success. source-controller then failed every fetch from that URL
  # ("pkt-line 3: EOF") and never advanced observedGeneration past 1, so it kept
  # serving main@sha1:4cc85ad9... — the artifact it had fetched from PUBLIC
  # github.com minutes earlier. region-b's kustomize-controller re-applied that
  # pre-cutover content every 5m and reverted all 64 HelmRepositories the
  # step-06 leg had pivoted. A host lint reading spec.url sees a clean local URL
  # and passes; only the convergence check separates a real pivot from a
  # cosmetic one.
  #
  # SCOPE is deliberately narrow and was MEASURED, not assumed: only kinds a
  # controller actually reconciles (GitRepository, OCIRepository). `type: oci`
  # HelmRepositories are static config for helm-controller and carry `status: {}`
  # with no observedGeneration at all — 70/70 in hw292 region-a and 65/65 in
  # region-b — so including them would fail every region of every Sovereign and
  # wedge the flow this guard protects (the #5505 blast-radius shape). With that
  # scope the live blast radius on hw292 is exactly one object: region-b's
  # flux-system/openova GitRepository, i.e. the defect itself.
  fluxSourceHealthLint:
    enabled: true
  # #3678 — TRUE deny-egress shape. defaultDenyEgress flips the Step-08
  # CCNP from a SUBTRACTIVE 4-CIDR block (default-allow, deny only the
  # listed hosts — which left console.openova.io + every un-enumerated
  # mothership host reachable, so a residual call-home kept every HR Ready
  # and the proof passed over a live tether) to a TRUE default-deny:
  # `enableDefaultDeny.egress: true` + an explicit allow-list of the
  # Sovereign's OWN intra-cluster CIDRs (pods/services/DNS/node). EVERYTHING
  # public — incl. console.openova.io and any host NOT in the allow-list —
  # is denied for the whole survival window. The #3640 apiserver-strand is
  # avoided by ALLOWING 10.96.0.0/12 (services, covers the 10.96.0.1
  # apiserver ClusterIP) + 10.42/10.43 (pods) + DNS, NOT by retreating to
  # enableDefaultDeny.egress:false. blockedDomains is retained only for the
  # active call-home assertion (the hosts we PROVE are unreachable from a
  # pod under the policy); the policy itself no longer enumerates them.
  defaultDenyEgress: true
  # Intra-cluster CIDRs that stay reachable under the default-deny hold.
  # These are the standard k3s ranges; a Sovereign on non-default CIDRs
  # overrides via the 06a overlay. toCIDR allow-rules for these plus a
  # toEntities allow for DNS/host/remote-node (added inline in the script)
  # keep the apiserver, CoreDNS, and pod-to-pod paths up so the cluster
  # keeps reconciling while every PUBLIC destination is black-holed.
  allowIntraClusterCIDRs:
    - "10.42.0.0/16"   # k3s pod CIDR (Cilium cluster-pool default)
    - "10.43.0.0/16"   # k3s service CIDR
    - "10.96.0.0/12"   # k8s default service CIDR (apiserver 10.96.0.1, CoreDNS)
  # #4596 / #5017 keystone (hw242, 2026-07-12) — IaaS PROVIDER control-plane
  # API CIDR allow-list for the deny-egress hold. The hold must black-hole
  # the MOTHERSHIP, NOT the cloud the Sovereign runs ON: the CSI driver
  # needs the provider API (Huawei ECS/EVS, …) to attach volumes for any
  # pod that (re)schedules DURING the hold — step-08's own force-roll
  # guarantees such pods. On hw242 this list was EMPTY (the #4596 comment
  # claimed "cloud-init populates per region" but the population site was
  # never built) → the CCNP omitted the kom4dc API /24 (212.72.2.0/24,
  # where ecs/evs/obs/iam/vpc/elb.me-east-215.kom4dc.nationalcloud.om all
  # resolve) → every EVS attach froze for the whole hold. NOW POPULATED
  # end-to-end: infra/providers/<cloud>/variables.tf `provider_api_cidrs`
  # (Huawei default ["212.72.2.0/24"], Hetzner default []) → templatefile →
  # cloud-init postBuild substitute PROVIDER_API_CIDRS_YAML → 06a slot
  # `egressTest.allowProviderCIDRs`. Empty default here = no-op on
  # providers whose CSI/control-plane rides the cluster/host paths. These
  # are the provider API ranges ONLY — the mothership + bastion live in
  # different ranges and stay denied.
  allowProviderCIDRs: []
  # #3678 — active call-home assertion. During the hold, the Step-08 Job
  # curls each of these hosts FROM a pod under the policy; if ANY connects,
  # the deny-egress is leaky and the proof FAILS (cutoverComplete stays
  # false). This catches an arbitrary mothership tether (e.g. a catalyst-api
  # still issuing tokens with iss=console.openova.io) that the
  # HR-readiness-only survival poll never exercises. console.openova.io is
  # FIRST because #2940 enumerated ~18 openova.io endpoints the subtractive
  # 4-CIDR block left wide open.
  callHomeAssertion:
    enabled: true
    timeoutSeconds: 5
    hosts:
      - "https://console.openova.io/healthz"
      - "https://github.com/openova-io"
      - "https://ghcr.io/v2/"
      - "https://harbor.openova.io/v2/"
  # #3695 — the host GitOps loop MUST be healthy for cutoverComplete=true.
  # On hw150 the cutover's OWN step-10 awk injector corrupted
  # 13b-bp-sso-bridge.yaml (duplicate `values:` key) → bootstrap-kit went
  # BuildFailed → the root Kustomization that owns all 63 bp-* HRs could no
  # longer apply ANY git change → the Sovereign was no longer operable as a
  # GitOps-driven cluster, yet cutoverComplete flipped true. These host
  # Kustomizations are checked as a HARD pre-window gate (NOT subject to the
  # baseline-exclude that hid bootstrap-kit's BuildFailed): if any is
  # NotReady, the proof FAILS before the survival window even starts.
  hostKustomizationGate:
    enabled: true
    namespace: "flux-system"
    names:
      - "bootstrap-kit"
      - "sovereign-tls"
      - "org-tenants"
  # #3695 — the fresh-pull proof must roll EVERY workload whose image host is
  # NOT the local registry, not one hand-picked openova-io Deployment. When
  # true, Step-08 enumerates all Deployments/DaemonSets/StatefulSets across
  # all namespaces whose container images reference a NON-local registry
  # (ghcr.io/openova-io, harbor.openova.io, etc.) and force-rolls EACH under
  # deny-egress; any that ImagePullBackOff fails the proof. This generalizes
  # the #3647 single-workload roll into the cross-cutting guarantee #3379 §7
  # demands. localRegistryHostSubstr identifies the local registry so a
  # Sovereign on a non-harbor.<fqdn> registry name overrides via 06a.
  rollAllExternalRegistryWorkloads: true
  # #4975 (Refs #3379 #3695) — the substring that identifies the LOCAL Sovereign
  # registry so the roll-set EXCLUDES local refs and INCLUDES the mothership
  # tether. DEFAULT "" → step-08 DERIVES it at runtime from the host of
  # sovereign.harborPublicURL (registry.<fqdn>) via the
  # bp-self-sovereign-cutover.localRegistryHost helper.
  #
  # WHY the old value was doubly wrong. The chart default was "harbor." and the
  # 06a overlay set "registry." — BOTH misclassify:
  #   • "harbor." EXCLUDED harbor.openova.io/proxy-* workloads (the #4975 gitea
  #     leg — the DOMINANT mothership tether) from the roll-set, so the tether
  #     was never proven severed, AND it did NOT match the real local host
  #     registry.<fqdn> so genuine local refs WERE needlessly rolled;
  #   • "registry." matched registry.k8s.io (an EXTERNAL upstream that MUST be
  #     rolled) as if it were local, so k8s-registry workloads were skipped.
  # The FULL host registry.<fqdn> classifies correctly in every case. An
  # operator on a non-registry.<fqdn> local registry name overrides here.
  localRegistryHostSubstr: ""
  blockedDomains:
    - "github.com"
    - "ghcr.io"
    - "harbor.openova.io"
    # console.openova.io (#3678): the mothership front door. The subtractive
    # 4-CIDR block NEVER included it, so a catalyst-api still issuing tokens
    # with iss=console.openova.io survived the hold. Under default-deny it is
    # blocked by omission from the allow-list; this entry drives the active
    # call-home assertion that PROVES it is unreachable.
    - "console.openova.io"
    # TBD-V24 MISS-3 (chart 0.1.37): xpkg.upbound.io is the Crossplane
    # Provider package upstream. Step 11 pivots every Provider's
    # spec.package literal off this host, so the deny-egress hold proof
    # MUST also block xpkg.upbound.io — otherwise a Provider revision
    # reconcile during the hold window could silently fall through to
    # the upstream xpkg host and break the proof. Under default-deny this
    # is blocked by omission from the allow-list.
    - "xpkg.upbound.io"

# Status sentinel ConfigMap — initial state machine state. catalyst-api
# updates the per-step fields as each Job completes.
status:
  configMapName: "self-sovereign-cutover-status"

# Post-cutover continuous mirror re-sync CronJob (TBD-A37, issue #1899,
# chart 0.1.33).
#
# Step 01 (gitea-mirror) runs EXACTLY ONCE at cutover and produces a
# STANDALONE local repo (PR #1029 — pull-mirror semantics block Step-
# 06's HelmRepository URL rewrite push, so the cutover migrated off
# Gitea's built-in pull-mirror). Without a re-sync mechanism, upstream
# chart bumps that land AFTER cutover never reach the Sovereign.
#
# A45 t31 verifier 2026-05-19 caught the live regression: sandbox-
# controller stuck at image :8017700 (PR #1690, 2026-05-16) even
# though PR #1862 had merged 2 days earlier with the NATS consume-leg
# update — the upstream values.yaml bump never crossed the seam.
#
# This block configures the gitea-mirror-resync CronJob (template
# 11-mirror-resync-cronjob.yaml) which re-runs the same idempotent
# bare-clone + push --mirror --force every 5 min. Pre-cutover fires
# are no-ops (the script detects the local repo is missing and exits
# 0). Post-cutover fires close the upstream → local Gitea loop.
mirrorResync:
  # G75 #2622 / #3606 (2026-06-16): MASTER SEVERANCE SWITCH. When
  # `enabled: false`, the entire 11-mirror-resync-cronjob.yaml template
  # renders to nothing — no `gitea-mirror-resync` CronJob ever exists on
  # the Sovereign. THE IaC DEFAULT `false` IS THE SEVERANCE: per
  # Principle 14 severance must live in git and be irreversible, and a
  # CronJob that is never rendered cannot drift back. There is nothing
  # for Flux to revert.
  #
  # #3606 root-cause: the old default was `true` and cutover Step 01's
  # G75 finalize block ran an IMPERATIVE `kubectl patch hr ... mirror
  # Resync.enabled=false`. Flux OWNS this HelmRelease from git (where the
  # value was `true`), so it REVERTED the patch on its very next
  # reconcile (~4 min) and re-rendered the CronJob → Step 01's 6-min
  # post-verify hold then saw the CronJob present again → G75 FATAL →
  # step-01 looped forever and the cutover never advanced past step-01.
  # A 5-min github re-clone CronJob is ALSO fundamentally incompatible
  # with Pillar 5 — it would breach the Step-08 600s deny-egress hold.
  # So the resync CronJob is now OFF by default; a pre-cutover Sovereign
  # that wants the upstream-resync loop opts IN via an operator overlay
  # (`mirrorResync.enabled: true`), and Step 01 no longer patches the HR.
  enabled: false
  # Cron schedule. */5 = every 5 minutes. Short enough that chart-bump
  # → upstream-merge → Sovereign-reconcile completes in ~10 min end-
  # to-end (5 min for this CronJob to fire + the bp-* HelmRepository's
  # 15m interval — but Flux source-controller picks up new commits on
  # the GitRepository within seconds of the push). Long enough that
  # GitHub anonymous-clone rate limits aren't a concern even with
  # hundreds of Sovereigns (300 req/hr per IP for anonymous clone;
  # one Sovereign clones at 12/hr).
  schedule: "*/5 * * * *"
  # Suspended? Default false (active). Operator overlay may flip true
  # for a sandboxed soak Sovereign that intentionally lags upstream.
  # NOTE: per G75 #2622, prefer `enabled: false` over `suspended: true`
  # for post-cutover Sovereigns — severance must be irreversible at
  # the IaC layer (Principle 14).
  suspended: false
  # Per-Job activeDeadlineSeconds. 900s = 15 min covers slow GitHub
  # days; well under typical 5 min cycle so jobs don't pile up.
  jobTimeoutSeconds: 900

# #5265 + #5640 — POST-CUTOVER DAY-2 local-Harbor reconciler (template
# 12-daytwo-harbor-pin-reconciler.yaml).
#
# THE GAP. step-03 harbor-prewarm pushes every pinned chart AND every workload
# image into local Harbor EXACTLY ONCE at cutover. Post-cutover the local Harbor
# is the ONLY registry that matters (step-04 pivots node containerd certs.d,
# step-06 repoints every HelmRepository), so anything published upstream AFTER
# step-03 ran cannot reach the Sovereign. Two live proofs of one structure:
#   • #5265 CHART half — the local Gitea mirror re-syncs upstream pin bumps on
#     the operator's schedule and Flux moves the HR to the new pin, but local
#     Harbor still holds only the cutover-time versions, so the HelmChart cannot
#     reconcile and the HR upgrade wedges (hw277: region-b bp-continuum HR wanted
#     chart 0.1.12 that local Harbor lacked).
#   • #5640 IMAGE half — a chart version that DOES reconcile installs workload
#     templates pinned to image tags published after cutover (hw292 2026-08-03:
#     registry.<fqdn>/v2/openova-io/openova/catalyst-ui/tags/list returned only
#     ["fad88bd"]; the freshly-pinned d674a94 404'd and its Pod sat in
#     ImagePullBackOff). merge → build → publish → deploy-bot pin is complete for
#     a PRE-cutover Sovereign and silently incomplete for a post-cutover one.
# The Git leg has a companion (step-01's re-runnable mirror); the Harbor leg had
# none. This is that companion for BOTH artifact kinds — a Deployment (NOT a
# CronJob: region-kill canon #5157 — the loop must survive the control-plane
# region dying) that enumerates the frozen bootstrap-kit chart pins via the SAME
# 03b `bootstrapkit_pins` extractor step-03/step-06 use AND the declared image
# set via the SAME 03a `offlinemirror_local_paths` resolver step-03/step-08 use,
# diffs both against local Harbor, and closes the drift.
#
# SOVEREIGNTY. #5640 flips `enabled` to TRUE by default. The property that
# mattered was never "no Deployment" — it was "no upstream egress by default",
# and mode=detect (the default) holds that literally: the loop reaches ONLY the
# local Gitea mirror and the local Harbor, never downloads skopeo, never dials an
# upstream registry. What it DOES do is publish the exact missing set to a
# durable ConfigMap + loud logs, which is what "today nothing notices" (#5640)
# needed. Reaching upstream stays opt-in behind mode=warm, exactly as before.
daytwoReconciler:
  # Master switch. false => the whole template renders to nothing.
  #
  # #5640 flipped the default false -> true. Shipping OFF meant shipping a knob
  # nobody turns on, leaving the post-cutover delivery gap exactly as silent as
  # the issue describes. Default mode is detect (zero external egress), so a
  # canonical fresh-prov Sovereign gains the SIGNAL without gaining a tether;
  # the step-08 deny-egress proof and the "no automatic upstream tether"
  # contract are untouched. Operators who want nothing at all still set false.
  enabled: true
  # Reconcile loop interval (seconds). 300 = 5 min, matching the mirrorResync
  # cadence so a Git pin bump and its Harbor artifact land in the same window.
  intervalSeconds: 300
  # detect | request | warm.
  #
  #   detect — reaches ONLY the local Gitea mirror + local Harbor (ZERO
  #     external egress). Reports the exact pinned (chart, version) artifacts
  #     and declared IMAGE refs MISSING from local Harbor to the manifest
  #     ConfigMap + logs. That set IS the air-gapped Sovereign's offline-media
  #     side-load list, and it turns the previously-SILENT strand into a
  #     visible, actionable signal. It delivers NOTHING.
  #
  #   request (DEFAULT, #5640) — detect's behaviour EXACTLY, plus a delivery
  #     path the operator opens deliberately, one request at a time. With no
  #     request present the mode is byte-for-byte detect: no upstream host is
  #     dialled, skopeo is never downloaded, the step-08 deny-egress proof and
  #     the no-automatic-tether contract are untouched. It is therefore a safe
  #     DEFAULT in a way `warm` is not — and it means an operator who needs one
  #     stale image does NOT have to edit the chart, roll the reconciler, and
  #     remember to turn it off again.
  #
  #     To deliver, the operator creates ONE ConfigMap naming the exact refs:
  #
  #       kubectl -n <release-ns> create configmap \
  #         self-sovereign-cutover-daytwo-request \
  #         --from-literal=requestId=2026-08-04-catalyst-api-leak-fix \
  #         --from-literal=requestedBy=ops@customer.example \
  #         --from-literal=scope='ghcr.io/openova-io/openova/catalyst-api:e3342f9'
  #
  #     The loop consumes that requestId ONCE — scope-bounded (only the listed
  #     refs, capped at request.maxRefsPerRequest), audited (every attempt is
  #     appended to the delivery ConfigMap with timestamp, requestId,
  #     requestedBy, source, destination and outcome), and then CLOSED: the
  #     same requestId never fires again, so the egress window does not stay
  #     open because someone forgot. `scope=ALL_MISSING` delivers the whole
  #     current missing set for operators who want that, and is still one-shot.
  #
  #   warm — an ALWAYS-ON managed-update posture: every cycle, forever,
  #     unbounded in scope, with a standing credential. It is a legitimate
  #     choice for an operator who has decided to track upstream continuously,
  #     but be clear-eyed that it IS a standing outbound tether and is NOT the
  #     sovereignty-preserving option. Prefer `request` unless you specifically
  #     want continuous tracking.
  #
  # Both delivery modes are fail-SOFT: a failed fetch is logged + left in the
  # missing manifest; the loop never crash-loops and workloads keep running on
  # the installed version.
  mode: request
  # #5640 — the operator-gated delivery request (mode=request only).
  request:
    # ConfigMap the operator creates to open ONE delivery window. Absent =>
    # zero egress. Keys: requestId (required, the one-shot key), requestedBy
    # (recorded in the audit trail), scope (newline-separated refs, or the
    # literal ALL_MISSING).
    configMapName: "self-sovereign-cutover-daytwo-request"
    # Durable append-only audit + one-shot state. `state` carries the last
    # consumed requestId (so consumption survives a Pod restart); `audit.log`
    # carries the per-ref outcome lines. Never deleted by the loop.
    auditConfigMapName: "self-sovereign-cutover-daytwo-delivery"
    # Upper bound on refs ONE request may deliver. A scope this size is an
    # operator mistake, not an intent; the request is refused rather than
    # silently truncated (truncation is how a bounded window becomes an
    # unbounded one nobody notices).
    maxRefsPerRequest: 50
    # Audit lines retained in the ConfigMap (it is capped at 1 MiB by the
    # apiserver). Oldest lines roll off; the Pod log keeps the full history.
    auditMaxLines: 500
  # Durable ConfigMap (release namespace) the loop writes the missing-artifact
  # manifest into each cycle. An empty manifest (ALL_PINS_PRESENT) is the
  # all-clear. Air-gapped operators consume this as the offline-media manifest.
  # Lines are `CHART\t<chart>\t<version>`, `IMAGE\t<upstream-ref>\t<local-path>
  # \t<http-code>` and `UNMAPPED\t<ref>\t<host>`.
  missingManifestConfigMapName: "self-sovereign-cutover-daytwo-missing"
  # #5640 leg 0 — the CATALOG (git) pin. THE HEAD OF THE CHAIN.
  #
  # THE GAP THIS CLOSES. The chart leg below enumerates its pin set from the
  # LOCAL GITEA MIRROR. Post-cutover that mirror is FROZEN — `mirrorResync
  # .enabled: false` above is the deliberate Principle-14 severance, and
  # nothing else re-runs step-01. So on a steady-state cut-over Sovereign the
  # chart and image legs are STRUCTURALLY a no-op: they can only ever deliver
  # artifacts for pins that ALREADY EXIST in the frozen mirror, and the frozen
  # mirror by definition never names a version published after cutover. The
  # chart leg then correctly reports ALL_PINS_PRESENT forever — every frozen
  # pin genuinely IS present — which is precisely why #5640 was invisible.
  #
  # Measured on hw292 (dep 1c56518035a83e03, cutoverComplete=true, 2026-08-06):
  # local Gitea main@7bcd1d59 with bootstrap-kit slot 06a still pinning
  # bp-self-sovereign-cutover 0.1.159 while upstream main had reached 0.1.169.
  # Ten chart versions published, zero arrived, nothing reported wrong.
  #
  # SOVEREIGNTY. This leg is NOT a re-tether and NOT a revival of the banned
  # */5 resync CronJob. It fires ONLY inside the same operator-gated window the
  # artifact legs use — one-shot, scope-bounded, audited — and only when the
  # request scope names the literal `CATALOG`. It writes INTO the local Gitea
  # mirror; it does NOT repoint any Flux source. After the window closes Flux
  # still reconciles EXCLUSIVELY from local Gitea + local Harbor, so Principle
  # #11 / ADR-0002 hold literally: what P11 forbids is "reconciling Flux from
  # github.com/openova-io/openova", not an operator refreshing their own mirror
  # on their own schedule — which CLAUDE.md §Customer-Sync makes canon
  # ("Sovereigns pull on their own schedule"). What #3606 correctly killed was
  # the UNATTENDED CronJob, which was a standing tether and also breached the
  # step-08 600s deny-egress hold. An air-gapped Sovereign simply never files a
  # CATALOG request; its offline-media list stays the missing manifest.
  #
  # `ALL_MISSING` deliberately does NOT imply `CATALOG` — see the reconciler's
  # catalog_in_scope comment. Different blast radius, so a separate opt-in.
  catalog:
    # Master switch for the leg. false => the loop never syncs the mirror even
    # when a request names CATALOG. The upstream it syncs FROM is
    # `upstream.repoURL` (the same value step-01 uses), so an operator who
    # mirrors the catalog into their OWN forge points that at it and this leg
    # follows without further configuration.
    enabled: true
  # #5265 leg — the frozen bootstrap-kit CHART pins.
  charts:
    enabled: true
  # #5640 leg — the declared IMAGE set. Enumerates running Pods ∪ declared
  # workload templates (the #3944 completeness union step-03 Phase A performs;
  # the declared half is load-bearing because the hw292 offender was in
  # ImagePullBackOff and had no running container), maps each ref through the
  # SAME 03a offlinemirror_local_paths resolver step-03/step-08 use, and asserts
  # local Harbor serves it.
  images:
    enabled: true
    # Per-image copy attempts for a NON-proxy source in warm mode. Mirrors
    # step-03's PREWARM_COPY_ATTEMPTS default; proxy-sourced refs use
    # prewarm.proxyCopyAttempts (single-source with step-03/step-08).
    copyAttempts: 3
    # The pinned skopeo static build step-03 harbor-prewarm and step-08's #5194
    # self-heal already download. Fetched LAZILY and ONLY in warm mode, so
    # detect keeps its zero-external-egress contract literally.
    skopeoStaticURL: "https://github.com/lework/skopeo-binary/releases/download/v1.15.2/skopeo-linux-amd64"
    # Upper bound on refs probed per cycle, so a Sovereign with hundreds of
    # per-Org workloads cannot make one cycle unbounded. Raise on a large
    # Sovereign; the cycle is idempotent so the remainder is picked up next pass.
    maxRefsPerCycle: 400
  warm:
    # Upstream OCI prefix missing charts are pulled from in warm mode. Default
    # is the public openova-io catalog; an operator who mirrors the catalog to
    # their OWN registry points this (and registryHost) at that mirror instead
    # — the workloads still pull EXCLUSIVELY from local Harbor either way.
    upstreamOciPrefix: "oci://ghcr.io/openova-io"
    # Bare host of upstreamOciPrefix — the `helm registry login` target.
    registryHost: "ghcr.io"
    # OPERATOR-SUPPLIED upstream credential for the delivery modes (request and
    # warm). The cutover strips its own ghcr auth from ghcr-pull (step-06
    # mothershipAuthsToStrip lists ghcr.io / harbor.openova.io / xpkg.upbound.io,
    # by design), so on a cutover Sovereign there is NO inherited credential and
    # NO path for one to appear without the operator provisioning it. That is
    # the intended shape: delivery is credential-scoped to something the
    # operator owns, chose to create, and can revoke by deleting this Secret.
    # Empty name => anonymous pulls only (openova-io packages are PRIVATE, so
    # they stay in the missing manifest until a credential is supplied or the
    # operator side-loads via that manifest).
    # The credential applies to warm.registryHost — it is NOT hard-wired to
    # ghcr.io, so an operator mirroring the catalog into their OWN registry
    # points registryHost + upstreamOciPrefix there and this Secret authenticates
    # BOTH the chart leg and the image leg against it.
    credentialSecret:
      name: ""
      # Defaults to the release namespace when empty (the reconciler Pod's own
      # namespace, so a secretKeyRef would resolve — but the loop reads it via
      # kubectl, so any namespace the runner SA can `secrets get` works).
      namespace: ""
      usernameKey: "username"
      passwordKey: "password"

# Gateway readiness gate (issue #1871, chart 0.1.32).
#
# Step-06 (helmrepository-patches) rewrites every HelmRepository URL
# `oci://ghcr.io/openova-io` → `oci://registry.<sov-fqdn>/openova-io`.
# That rewrite MUST NOT fire until the Cilium Gateway in `kube-system`
# is `Programmed=True` (= listener bound to `*.<sov-fqdn>:443` with a
# valid TLS cert). Without the wait, source-controller's very next
# pull hits TLS handshake EOF against `registry.<sov-fqdn>` and the
# whole bootstrap-kit Kustomization deadlocks — see Chart.yaml 0.1.32
# header for the full chicken-and-egg chain (t26 99bb823cb0513f4b
# A55 diagnostic).
#
# The wait is implemented inside the Step-06 Job (Phase -1) rather
# than as a Flux HelmRelease `dependsOn` because dependsOn can only
# reference other HelmReleases — sovereign-tls is a Kustomization, so
# the previous attempt (PR #1875) was an unresolvable cross-kind
# reference and helm-controller logged
# `helmreleases.helm.toolkit.fluxcd.io "sovereign-tls" not found`
# forever (A84 empirical test on t27).
gateway:
  # The single per-Sovereign Gateway lives in `kube-system` — installed
  # by `clusters/_template/sovereign-tls/cilium-gateway.yaml`. Every
  # other bootstrap-kit HTTPRoute (gitea, auth, grafana, harbor, openbao,
  # powerdns, console/catalyst-platform) attaches here; this is the same
  # Gateway whose TLS listener Step-06 implicitly depends on.
  namespace: "kube-system"
  name: "cilium-gateway"
  # 30 min covers the slowest observed cold-start (Hetzner ≈18 min:
  # bootstrap-kit Ks reconcile → sovereign-tls Ks reconcile → cert-
  # manager issues wildcard cert → cilium-agent wires listener) with
  # comfortable headroom. Exceeding the timeout exits the Job with a
  # clear failure (NOT exit-0-and-continue) — better to surface the
  # Gateway block to operators than silently rewrite URLs that won't
  # answer.
  waitTimeoutSeconds: 1800

# Step-06 Phase-3a chart-pullability probe (Refs #3627 #3379, root-caused
# live on hw146). The strip-before-pivot fix (#3568) gates the destructive
# ghcr.io / harbor.openova.io auth strip behind a proof that the pivoted
# charts reconcile from local Harbor. The ORIGINAL gate read each pivoted
# HelmRepository's `.status.conditions[Ready]` — but for spec.type=oci
# HelmRepositories Flux source-controller sets NO conditions at all (they are
# static pointers consumed lazily by HelmReleases; no HelmChart/OCIRepository
# is ever created). On hw146 all 61 pivoted HRs were type=oci with EMPTY
# conditions, so the gate's Ready could never become True and the strip was
# FATAL-refused on every run → cutover wedged at step-06. The corrected gate
# performs a DIRECT authenticated `helm pull` of a representative sample of
# the pivoted charts from registry.<fqdn>; success proves Harbor serves the
# chart artifact (step-03 Phase A2 mirrored it) AND the Phase-0 Harbor auth
# works. The charts are skopeo-prewarmed into local Harbor at step-03, so a
# pull is typically seconds.
helmReadinessProbe:
  # Number of pivoted charts (besides bp-catalyst-platform, which is always
  # probed when present) to pull in the Phase-3a proof. A successful pull of
  # any pivoted chart already proves Harbor + auth; a small sample keeps the
  # gate fast while remaining a genuine end-to-end pull. Operators may raise
  # this to probe more charts.
  sampleSize: 5
  # #5237 (Refs #5007): union-warm-on-drift. Phase-3a samples the LIVE chart
  # version off each pivoted HelmRelease. If a `bp-catalyst-platform` release
  # is published to ghcr AFTER step-03 harbor-prewarm finishes (a mid-cutover
  # merge's deploy-bot bump), flux redeploys the umbrella to the newer concrete
  # pin BEFORE this step runs, so the sampled tag is one bump ahead of what
  # prewarm mirrored (catalog-latest drift) → the local pull 404s → step-06
  # stalls stripReadinessSeconds and the cutover parks (LIVE hw274, dep
  # d51a69f8). When true (default), a sampled chart absent from local Harbor is
  # top-up-warmed from the still-reachable upstream (this step runs BEFORE the
  # step-08 deny-egress hold) into local Harbor, then re-probed — self-healing
  # the drift with no hand-skopeo. A chart genuinely unpullable from BOTH local
  # AND upstream still FATALs at the deadline (fail-loud preserved). Set false
  # to restore pure fail-loud (no upstream top-up).
  unionWarmOnDrift: true
  # #5237 round 2 (Refs #5007) — step-06 Phase 3a-pin: BEFORE the sampled
  # pull-probe (and therefore before the irreversible Phase-3b mothership-auth
  # strip), assert EVERY bootstrap-kit-pinned chart version — enumerated from
  # the step-06 Phase-2 clone of the local Gitea mirror (the frozen commit
  # flux consumes post-pivot) via the SAME cutover-bootstrap-kit-pins
  # extractor step-03 mirrors from — is durably present in local Harbor
  # (artifact-API probe on the in-cluster Harbor Service, the #5030
  # never-pull-through discipline). A missing version is first top-up-warmed
  # from the still-reachable upstream (the #5237 union-warm helper; egress is
  # open until step-08); anything STILL missing FATALs with the full missing
  # list and the ghcr.io auth intact — a clear, recoverable step-06 failure
  # instead of HelmReleases wedging on `does not have an artifact` after the
  # strip. The Phase-3a sample probe only proves a SAMPLE pulls; this gate
  # proves the WHOLE frozen pin set exists. Set false only to restore the
  # pre-#5237-round-2 sample-only gating.
  pinPresenceGate: true
  # #4557 (Refs #3379): TLS verification on the helm-CLI probe DESTINATION —
  # the IN-CLUSTER Harbor reached as `registry.<sov-fqdn>` (HARBOR_PUBLIC_URL
  # → harbor_host). DEFAULT false (skip verify for the in-cluster target).
  #
  # WHY false is correct (the same rationale as prewarm.destTLSVerify #4529).
  # Step-06 Phase-3a proves the pivoted charts are pullable from the cluster's
  # OWN in-cluster Harbor over the cluster pod network — `helm registry login`
  # + `helm pull oci://registry.<sov-fqdn>/...`. On a fresh prov that Harbor's
  # wildcard `*.<sov-fqdn>` cert is served by the BOOTSTRAP issuer
  # `letsencrypt-dns01-staging-powerdns` (LE-STAGING, untrusted by the public
  # CA bundle), and even with production LE certs the helm binary in a Job Pod
  # carries no node trust store → every probe raises `x509: certificate signed
  # by unknown authority` → the strip-readiness gate never converges → it
  # FATALs at stripReadinessSeconds → the cutover never reaches the 600s
  # deny-egress hold → cutoverComplete never set (live keystone re-prov
  # c39f0cd4455b7a46 on registry.kv202251.omani.works, #4557). The destination
  # is the cluster's OWN registry — trust is established by the cluster
  # network, NOT a public CA — exactly the seam #4529 (skopeo
  # --dest-tls-verify=false) and the cold-start registries.yaml v1
  # (tls.insecure_skip_verify) already use. The witnessed 600s deny-egress
  # hold (step-08) is the real security gate and is wholly untouched by this
  # flag. This skip is IN-CLUSTER-ONLY: external ghcr/upstream calls keep
  # verify (they are public-CA-signed hosts that MUST be authenticated).
  #
  # Operators with a public-CA-trusted internal registry cert AND a helm
  # trust store may set this true via overlay; default false is the correct
  # fresh-prov behaviour.
  inClusterTLSVerify: false

# Per-step Job-stamp tuning. Each value lands inside the corresponding
# PodSpec ConfigMap; catalyst-api copies it onto the stamped Job.
stepTimeouts:
  giteaMirrorSeconds: 1200
  harborProjectsSeconds: 600
  # #3379 step-03 DeadlineExceeded (hw139, 2026-06-15): Step-03 skopeo-
  # native-pushes ~29 multi-layer PRIVATE openova-io images ghcr.io→local
  # Harbor (the ONLY working route — Harbor's anonymous proxy-cache 404s
  # these private packages, #3534). On kom4dc's throttled egress the
  # STRICTLY-SERIAL copies blew the old 1800s and pushed only 6/29 →
  # incomplete Harbor → post-cutover ImagePullBackOff → Step-08 deny-egress
  # proof never ran. The template now fans the copies out
  # (PREWARM_PARALLELISM=6, ~6x wall-clock collapse) AND this ceiling is
  # raised to 5400s (90m) so a worst-case slow-egress run still finishes
  # inside budget rather than re-tripping the deadline. The Job stays
  # event-driven (catalyst-api watches to completion), so a fast run does
  # NOT wait out the ceiling. Honored end-to-end only because catalyst-api
  # now stamps the Job/watch deadline from THIS per-step value (cutover.go
  # createCutoverJob / watchJobToCompletion) rather than the old global
  # 15m cap that silently bounded every long step.
  #
  # #5298 (Refs #5095 #3379) — DIRECT-fallback push blows the 90m ceiling
  # (hw281, 2026-07-20). The 5400s (90m) ceiling above was sized for the
  # FAST path (bastion harbor-proxy fan-out). #5095 added a DIRECT-source
  # fallback: when the mothership proxy path is unreachable, each image is
  # pushed straight from its canonical upstream (ghcr.io / docker.io / …).
  # That route is the SLOWEST — a full 140-image census at ~0.75 min/image
  # DIRECT ≈ 105 min, plus the #5095 per-image exponential-backoff spacing
  # (~15 min inside a transit flap) and one catalyst-api re-poll — legitimately
  # past 90m. On hw281 the Job was still settling (log "Phase A progress:
  # 100/140 settled (still copying)") when BOTH the K8s Job activeDeadlineSeconds
  # AND catalyst-api's watch context (each stamped from this same value) expired
  # at 90m: failedStep=harbor-prewarm, lastError="watch Job … context deadline
  # exceeded" — a still-progressing prewarm killed as failed. Raised 5400 → 9600
  # (160m) so the worst-case DIRECT-fallback push finishes inside budget. This
  # single value flows to BOTH deadlines (K8s Job + catalyst-api watch), so the
  # ceiling can never again undercut the DIRECT-fallback runtime. The step stays
  # event-driven + resumable (prewarm.skipIfAlreadyPresent #4994 skips already-
  # mirrored tags on a re-fire via a manifest-digest HEAD), so a fast proxy-path
  # run returns in minutes and never waits out the larger ceiling, and a re-run
  # resumes rather than re-transferring from 0. No other step's deadline changes.
  # #5095 round 2 keeps this 9600s ceiling: proxy-DOWN direct-first routing only
  # removes the per-image proxy timeout tax on top of the DIRECT wave; the DIRECT
  # census itself is still the ~105-min slow path this ceiling was sized for, and
  # a slow-but-reachable-egress run needs the same headroom regardless.
  harborPrewarmSeconds: 9600
  # #5359 — raised 600 -> 1800. The step-05 secondary leg walks a CANDIDATE
  # URL CHAIN, giving each candidate its own secondaryRegions.
  # gitRepositoryReadySeconds (300s) window to converge. The 0.1.166 default
  # chain is ONE candidate (the Sovereign's own external Gitea door — the
  # doomed in-cluster mesh candidate is retired), so the default worst case is
  # regions x 1 x 300s on top of the region-A patch; the ceiling must exceed
  # that sum or the Job is killed mid-chain and the failure reads as a deadline
  # rather than as the unreachable-Gitea diagnosis the leg was about to print.
  # 1800 keeps headroom for a 3-region topology AND for an operator-supplied
  # multi-candidate chain. The step stays event-driven (catalyst-api watches
  # to completion), so a converging run still returns in seconds and never
  # waits out the ceiling.
  fluxGitRepositoryPatchSeconds: 1800
  # Step 06 (helmrepository-patches) activeDeadlineSeconds. This step now
  # has FOUR potentially-slow waits inside one Job and the deadline must
  # cover their SUM in the worst case:
  #   Phase -1  gateway-wait        up to gateway.waitTimeoutSeconds (1800s/30m)
  #   Phase 0/1/2  auth-add + URL pivot + Gitea push   (seconds)
  #   Phase 3a  strip-readiness wait up to stripReadinessSeconds (600s/10m)
  # Raised 600 → 2400 (40m) by the strip-before-pivot fix (Refs #3379
  # #3526) so the new Phase-3 readiness gate can run to convergence
  # without the Job-level deadline killing it mid-wait (which would be a
  # DeadlineExceeded = transient, so the engine re-runs — but a clean
  # 40m ceiling avoids needless churn). Honored end-to-end because
  # catalyst-api stamps the Job/watch deadline from this per-step value
  # (cutover.go cutoverStepDeadline → createCutoverJob /
  # watchJobToCompletion), taking the MAX of it and the global default.
  # Event-driven: a fast run (gateway already Programmed, HRs reconcile
  # in seconds) returns immediately and never waits out the ceiling.
  helmRepositoryPatchesSeconds: 2400
  # Step 06 Phase-3a (strip-before-pivot fix, Refs #3379 #3526). After the
  # Phase-1 URL pivot + Phase-2 durable Gitea push, Step-06 waits up to
  # this long for EVERY HelmRepository now pointing at local Harbor to
  # report Ready=True (source-controller fetched + verified the OCI
  # artifact — proving registry.<fqdn> serves the chart AND the Phase-0
  # Harbor auth works) BEFORE it strips the ghcr.io / harbor.openova.io
  # fallback from ghcr-pull. If the pivot does not converge within this
  # budget the strip is REFUSED and the Job exits non-zero with the
  # mothership auth INTACT — the cluster keeps pulling from ghcr.io and
  # the step is recoverable on the next engine re-run (the prior fail is a
  # genuine exit, so an operator /cutover/start re-fire re-drives it; a
  # DeadlineExceeded variant re-runs automatically). 600s (10m) is
  # generous: the charts were skopeo-prewarmed into local Harbor at
  # Step-03, so a pivoted HR's first authenticated pull is typically
  # seconds. The re-poke-reconcile inside the loop means a fast converge
  # returns well under the ceiling.
  stripReadinessSeconds: 600
  # Step 06 Phase-3 pre-strip read-back (#5436). Bounded convergence budget
  # for the region-A "zero HelmRepositories left on the upstream prefix"
  # assert placed at the head of Phase 3. It exists purely to absorb the
  # #3526 revert-race: Phase-2/2b pushed the durable rewrite to local Gitea,
  # but the `openova` GitRepository has to pull it and the bootstrap-kit /
  # org-tenants Kustomizations have to re-apply it before a Flux-reverted
  # URL settles back on local Harbor. Same 300s the step-08 pivot-poll uses,
  # for the same race. Reconciles are re-poked every 15s inside the window,
  # so a converged cluster returns on the FIRST pass and never waits this
  # out; the budget only costs wall-clock on a genuinely un-pivoted
  # Sovereign, where spending 5 minutes before failing loud is exactly the
  # right trade. Set 0 to make the assert single-shot.
  # NB: this is inside helmRepositoryPatchesSeconds (2400s) alongside the
  # gateway-wait + stripReadinessSeconds worst-case sum.
  pivotReadbackSeconds: 300
  catalystAPIEnvPatchSeconds: 600
  # 600s deny survival window + up to 300s #3526 bounded pivot-poll
  # (force-reconcile GitRepository + bootstrap-kit Kustomization and wait
  # for Step-06's durable git-push to converge BEFORE the window opens)
  # + buffer for the assert sweep / policy teardown. Was 900s before
  # #3526 added the pivot-poll (-> 1200s). #4723-family (2026-07-03,
  # live hw220): the fresh-pull rollout proof over EVERY external-registry
  # workload on a 2-region 12-node prov needs >1200s — the Job hit
  # DeadlineExceeded at exactly +1200s mid-proof (NOT an egress failure)
  # and the engine looped 20-minute failures. 3600s gives the proof room;
  # the deny-egress window itself stays 600s.
  # #5065 (2026-07-14, live hw250): 3600s ALSO too short on a larger 2-region
  # prov — full ~130-workload roll (~45min) + 600s hold + one engine sweep-
  # restart > 60min → DeadlineExceeded ×2 (NOT an egress failure). 7200s covers
  # roll+hold+one restart; paired with the oauth2-proxy + falco excludeWorkloads.
  egressBlockTestSeconds: 7200
  # Step 09 (gitea-token-mint, TBD-C18) — short-lived: a single
  # Gitea API mint + validate + Secret patch + best-effort rollout.
  # 600s leaves generous headroom for the provisioning Deployment
  # rollout (which can take a few minutes on a cold-start cluster).
  giteaTokenMintSeconds: 600
  # Step 10 (vcluster-registry-pivot, TBD-V24 MISS-1) — three HR patches
  # + one git clone/push to local Gitea. Bounded by the Gitea push
  # round-trip; 600s is generous (typical run completes in <60s).
  vclusterRegistryPivotSeconds: 600
  # Step 11 (crossplane-provider-pivot, TBD-V24 MISS-3) — Provider CR
  # patch loop + one git clone/push to local Gitea. Bounded by the
  # Gitea push round-trip + the Provider revision reconcile triggered
  # by the patch (Crossplane is typically <30s to re-fetch from local
  # Harbor); 600s is generous (typical run completes in <60s).
  crossplaneProviderPivotSeconds: 600

# Step 10 (vcluster-registry-pivot, TBD-V24 MISS-1, issue #2034) — pivot
# the three bp-*-vcluster HelmReleases' image.repository from
# `harbor.openova.io/proxy-ghcr/loft-sh/vcluster` to
# `harbor.<SOVEREIGN_FQDN>/proxy-ghcr/loft-sh/vcluster` so the
# MGMT/RTZ/DMZ vCluster control-plane Pods pull from the Sovereign-local
# Harbor mirror post-cutover. Without this step the vCluster image-pull
# remains tethered to mothership Harbor indefinitely — a Pillar-5
# (Sovereign independence) violation. See 10-vcluster-registry-pivot-job.yaml
# for the full protocol.
vclusterRegistryPivot:
  # Namespace where the 3 bp-*-vcluster HelmReleases live. The
  # bootstrap-kit's slots 54/58/59 all install into flux-system, so the
  # default here matches the canonical layout. Per-Sovereign overlay
  # can change this if a future topology splits the HRs elsewhere.
  helmReleaseNamespace: "flux-system"
  # vCluster image tag — must match the tag pinned in each bp-*-vcluster
  # chart's values.yaml (currently 0.20.0 across all three). This is
  # NOT used by the merge-patch directly (the chart's existing
  # image.tag value is preserved untouched); it's threaded through
  # only for the YAML-edit comment so the injected block is
  # self-documenting. Override via per-Sovereign overlay if you've
  # pinned a different upstream vCluster version.
  imageTag: "0.20.0"

# Step 11 (crossplane-provider-pivot, TBD-V24 MISS-3, issue #2034) —
# pivot every `pkg.crossplane.io/v1.Provider` CR's `spec.package` host
# literal from `xpkg.upbound.io/...` to
# `harbor.<SOVEREIGN_FQDN>/proxy-xpkg/...` so the Crossplane package
# manager fetches Provider packages from the Sovereign-local Harbor
# `proxy-xpkg` project. Without this step the Provider package fetch
# remains tethered to xpkg.upbound.io indefinitely post-handover —
# Step 04 (containerd registries.yaml.v2 mirror for xpkg.upbound.io)
# does NOT catch it because Crossplane's `internal/xpkg/fetch.go` uses
# go-containerregistry's `remote.Image()` DIRECTLY, NOT through the
# kubelet/containerd CRI client. See 11-crossplane-provider-pivot-job.yaml
# for the full protocol.
crossplaneProviderPivot:
  # Upstream package host literal to match in `spec.package`. The
  # cutover-step script swaps this prefix for `harbor.<sov-fqdn>/
  # ${registryPath}` while preserving the rest of the package path
  # and tag. Per-Sovereign overlay can override if a future Crossplane
  # release ships from a different upstream OCI host.
  upstreamHost: "xpkg.upbound.io"
  # Sovereign-local Harbor proxy-cache project path that proxies
  # `xpkg.upbound.io`. Step 02 (harbor-projects) creates this project
  # from `.Values.harbor.proxyProjects[name=proxy-xpkg]`. Do NOT
  # diverge from that project name unless the proxyProjects list is
  # updated in lockstep.
  registryPath: "proxy-xpkg"
  # #4488 — the SECOND upstream prefix to pivot. On Huawei a fresh prov
  # ships provider-opentofu's `spec.package` already pointed at the
  # MOTHERSHIP Harbor's proxy-xpkg (`harbor.openova.io/proxy-xpkg/...`),
  # because the Crossplane xpkg fetcher bypasses the node containerd
  # mirror and `xpkg.upbound.io` dials the poisoned kom4dc NAT EIP (see
  # clusters/_template/infrastructure/base/provider-opentofu.yaml +
  # infra/providers/_shared/cloudinit-control-plane.tftpl XPKG_REGISTRY).
  # That `harbor.openova.io` host is a mothership tether Principle #11
  # forbids post-cutover, so the live-patch ALSO rewrites this prefix to
  # `harbor.<sov-fqdn>/${registryPath}`. Must equal mothershipHarborURL's
  # host + "/" + registryPath. Hetzner Sovereigns ship the upstream host
  # so this prefix simply never matches there (harmless).
  mothershipProxyPrefix: "harbor.openova.io/proxy-xpkg"
  # #5204 (Refs #3379) — package-pull AUTHENTICATION for the Sovereign-local
  # Harbor. Pivoting spec.package to `harbor.<sov-fqdn>/proxy-xpkg` is NOT
  # sufficient on its own: `proxy-xpkg` is a Harbor PROXY-CACHE project, and
  # Harbor requires an AUTHENTICATED pull from a proxy-cache project even when
  # the project is public (unlike the push-mode offline-mirror projects
  # proxy-ghcr/proxy-dockerhub/… which serve anonymous pulls). The Crossplane
  # package manager fetches packages with go-containerregistry's remote.Image()
  # and its OWN registry-auth path — it does NOT read the node containerd
  # certs.d (step 04) NOR the flux-system/ghcr-pull dockerconfigjson
  # (step 06 wired that for source-controller, not for Crossplane). With no
  # credential wired for the package manager, EVERY post-cutover Provider
  # package re-pull / version upgrade / inactive-revision reconcile 401s
  # against the local Harbor (live hw270 dep b2f0a9b0585f6781: provider-opentofu
  # Installed=False, reason UnpackingPackage, `401 Unauthorized` — the existing
  # revision keeps running so live adoption is unaffected TODAY, but the
  # Sovereign can never upgrade its own providers post-severance → a Pillar-5
  # durability gap).
  #
  # THE FIX (Crossplane 1.18 native mechanism). Step 11 wires an
  # `ImageConfig` (pkg.crossplane.io/v1beta1) whose spec.matchImages prefixes
  # cover the pivoted host(s) and whose spec.registry.authentication.pullSecretRef
  # points at a dockerconfigjson Secret it also creates in the Crossplane
  # install namespace. The package manager then authenticates package pulls
  # against the local Harbor with the SAME `admin:<HARBOR_ADMIN_PASSWORD>`
  # credential step 02/03/06 use (read from harbor.adminSecretRef). The auth
  # entry is keyed on BOTH `harbor.<sov-fqdn>` (the spec.package pivot host)
  # AND the canonical `registry.<sov-fqdn>` (sovereign.harborPublicURL host,
  # the gateway.aliasHarborHost alias) — go-containerregistry auth lookup is an
  # exact host[:port] match, so covering both aliases is robust regardless of
  # which literal a Provider carries.
  packagePullAuth:
    # Master switch. Default true — the fix is active on every cutover. Flip
    # false ONLY on a Sovereign whose local Harbor serves proxy-xpkg with
    # anonymous pull already permitted (then the Provider re-pull needs no
    # credential). Per docs/INVIOLABLE-PRINCIPLES.md #4 (operator-tunable).
    enabled: true
    # Namespace where Crossplane's package manager runs — the pullSecretRef +
    # ImageConfig both resolve here (bootstrap-kit slot 04 installs bp-crossplane
    # into crossplane-system). Override per-Sovereign if a future topology moves
    # the Crossplane control plane.
    crossplaneNamespace: "crossplane-system"
    # dockerconfigjson Secret step 11 creates in crossplaneNamespace, carrying
    # the local-Harbor pull credential the ImageConfig references.
    pullSecretName: "cutover-harbor-xpkg-pull"
    # ImageConfig (pkg.crossplane.io/v1beta1) name step 11 applies to bind the
    # matchImages prefixes to the pullSecretRef.
    imageConfigName: "cutover-harbor-xpkg"
  # #5204 (Refs #5209) — verify-before-pivot gate. Step 11 rewrites a
  # Provider's spec.package onto harbor.<sov-fqdn>/proxy-xpkg/<path> ONLY
  # after the local Harbor ARTIFACT API (Harbor CORE DB — durable, never
  # pull-through: the #5030 probe discipline, dialed via the in-cluster
  # harborInternalURL per #5036) confirms the package artifact is durably
  # present locally (step-03 Phase A4 / prewarm.xpkgPackages warms it).
  # An ALREADY-pivoted Provider is re-verified too — that is exactly the
  # hw270 latent shape (pivoted ref, cold cache). A miss FAILS the step
  # LOUD naming the package (before the durable Gitea rewrite, so nothing
  # is half-pivoted) instead of silently pointing spec.package at a ref the
  # local registry cannot serve post-severance. Set false to restore the
  # unverified pivot.
  verifyLocalArtifact:
    enabled: true

# Step 09 (gitea-token-mint, TBD-C18) — bootstrap the Gitea API token
# that the Organization provisioning service uses for tenant repo materialisation.
#
# Root cause this addresses: the catalyst-platform chart's
# `provisioning-github-token.yaml` template mirrors gitea-admin-secret's
# PASSWORD into org-services/provisioning-github-token.GITHUB_TOKEN. The
# provisioning service sends `Authorization: token <X>` to Gitea, which
# resolves the credential as an API access token (sha1 lookup) — the
# admin password is NOT a valid access token. Result: 401 "user does
# not exist", tenant materialisation silently fails, customer voucher
# checkout completes but no Organization CR is created.
#
# This step mints a real Gitea API token at cutover time and patches
# the destination Secret. See 09-gitea-token-mint-job.yaml for the full
# protocol.
giteaTokenMint:
  # Name of the Gitea API token created under gitea_admin. Surfaced in
  # the Gitea UI under Settings → Applications so an operator can audit
  # / revoke it. The step is idempotent on this name (DELETE-then-POST)
  # so re-running the cutover (chart upgrade, manual replay) rotates
  # the token cleanly.
  tokenName: "catalyst-platform-bootstrap"
  # Comma-separated Gitea API scope list. `all` is broadest — the Organization
  # provisioning service needs to create orgs/repos/branches/commits/
  # webhooks under arbitrary tenant paths the marketplace wizard
  # generates. Narrowing scopes (e.g. `write:repository,write:user`)
  # is tracked as a follow-up and requires aligning every
  # core/services/provisioning/* gitea call with a minimum-privilege
  # mapping. Shipping broad here so the journey-step-16 unblock lands
  # today; narrowing follows in TBD-C18-narrow.
  tokenScopes: "all"
  # Destination Secret coordinates — must match the catalyst-platform
  # chart's orgServices.provisioning.gitToken.* defaults.
  # NB: This Secret is created by the catalyst-platform chart with
  # helm.sh/resource-policy: keep, so it survives chart uninstall and
  # this Step's patch is non-destructive on re-run.
  destSecretNamespace: "org-services"
  destSecretName: "provisioning-github-token"
  destSecretKey: "GITHUB_TOKEN"

# Trigger configuration — surface here so operators see it in
# `helm get values`. When trigger.auto=true, the chart's Helm
# post-install hook (templates/10-auto-trigger-job.yaml) POSTs
# /api/v1/sovereign/cutover/start on catalyst-api after the chart's
# ConfigMaps + RBAC land. catalyst-api handles idempotency via the
# durable status ConfigMap, so the hook is safe to fire on every
# install AND every upgrade.
trigger:
  # Default true (founder rule per #933): handover is not "done" until
  # cutover has run; the operator must NOT have to click a CTA on
  # console.<sov-fqdn>/console/dashboard. Set to false in per-Sovereign
  # overlay if a sandboxed test Sovereign should stay tethered.
  auto: true
  # #4885 (Refs #3379 #4061): COUPLE the auto-trigger hook to the operator's
  # fireCutoverOnHandover gate. Before this, the auto-trigger hook Job
  # rendered whenever trigger.auto=true (default) and POSTed
  # /api/v1/internal/cutover/trigger — a path gated ONLY by the handover-seal
  # 425, NOT by the operator flag. So an operator who set
  # fireCutoverOnHandover=false (honoured by the catalyst-api reconciler:
  # `[CUTOVER-RECONCILE] dormant: fireCutoverOnHandover=false`, #4061
  # operator-gated Sovereign) STILL got an auto-fired cutover — the two gates
  # were uncoupled. The hook now renders only when trigger.auto AND
  # fireCutoverOnHandover are BOTH true (see templates/10-auto-trigger-job.yaml
  # `{{ if and .Values.trigger.auto .Values.trigger.fireCutoverOnHandover }}`).
  #
  # DEFAULT false — fail-closed / operator-gated, CONSISTENT with the source
  # catalyst-api reads: the catalyst chart plumbs
  # CATALYST_FIRE_CUTOVER_ON_HANDOVER from catalystApi.fireCutoverOnHandover =
  # ${FIRE_CUTOVER_ON_HANDOVER:-false} (13-bp-catalyst-platform.yaml), so a
  # Sovereign auto-fires ONLY when the operator opted in (tofu var
  # fire_cutover_on_handover=true → FIRE_CUTOVER_ON_HANDOVER=true). The 06a
  # slot overlay (clusters/_template/bootstrap-kit/06a-bp-self-sovereign-
  # cutover.yaml) wires this value from the SAME ${FIRE_CUTOVER_ON_HANDOVER:-
  # false} postBuild substitution so both gates always agree. When false the
  # cutover fires via the operator's BSS CTA (or the #4669 level-triggered
  # reconciler once the operator flips the flag). Overlay always wins.
  fireCutoverOnHandover: false
  # Optional pre-flight delay before the hook POSTs /start. 0 = fire
  # immediately. Useful for soak Sovereigns where the operator wants a
  # short window to inspect the freshly-handed-over dashboard before
  # the cutover starts.
  autoDelaySeconds: 0
  # In-cluster URL the auto-trigger Job hits. Default points at the
  # catalyst-api Service in `catalyst-system` (the post-handover
  # Sovereign-side namespace per .Values.catalystAPI.namespace), which
  # is reachable by the Job's catalyst-runner SA without any cross-
  # namespace egress concerns. Override per-Sovereign if catalyst-api
  # is exposed under a different Service name.
  catalystAPIURL: "http://catalyst-api.catalyst-system.svc.cluster.local:8080"
  # How long the auto-trigger Job will wait for catalyst-api to be
  # reachable before giving up (and exiting 0 so the operator can fire
  # manually). Must finish below the HelmRelease install/upgrade
  # timeout (30m for bp-self-sovereign-cutover post-Fix-#152) AND the
  # activeDeadline below so the Job exits cleanly even when catalyst-
  # api never comes up — 25 minutes leaves a healthy 5m buffer below
  # the 30m HR cap. Bumped from 720s (12m) on Fix #152 (chart 0.1.27)
  # after prov #23 hit the 14m Job deadline before catalyst-api came
  # up — cold-start budget needs ~2× headroom on slow Sovereigns.
  autoWaitForAPISeconds: 600
  # #4632 (chart 0.1.91): how long the trigger POST RETRIES on HTTP 425
  # (handover-completion gate) before giving up (exit 0; operator can fire
  # via CTA). On a FRESH prov this hook fires at slot-06a install time —
  # BEFORE bp-catalyst-platform reaches Ready and the handover post-install
  # hook seals secret/catalyst/tofu-phase0-archive — so the first POST 425s.
  # The prior single-POST 425 handler did `exit 0` and the hook-succeeded
  # delete-policy then removed the Job, so NOTHING ever re-POSTed and the
  # cutover never auto-fired (verified live on dep 8fd457a8: handover sealed
  # at 13:56:41 but the lone POST 425'd at 13:54:48, ~2 min too early →
  # cutover stuck progressPercent=0). The Job now polls every 15s within
  # this budget so the trigger re-fires the moment handover seals the
  # archive — zero-touch, no CTA click (founder rule #933). #4723 (chart
  # 0.1.102): 1500s -> 900s. The long wait only needs to cover the #4632
  # race class (~2min between chart-install and seal on
  # fireCutoverOnHandover provs). On a PERMANENT Sovereign the seal lands
  # only after full phase-1 convergence (45min after hook start on hw220)
  # — no in-Job wait can bridge that, and it does not need to: the #4669
  # level-triggered reconciler self-heals sealed-but-uncut after this Job
  # exits 0. Shrinking the wait restores real pod-start margin under the
  # activeDeadline (see autoTimeoutSeconds below).
  autoHandoverWaitSeconds: 900
  # Overall cap on the auto-trigger Job runtime. activeDeadlineSeconds
  # on the Job spec — anything longer means catalyst-api is sick and
  # the operator should investigate. The Job exiting at this deadline
  # is non-fatal for the chart install (the cutover engine already
  # runs detached inside catalyst-api once /start returns 200).
  # Must stay below the HelmRelease install/upgrade timeout (40m per the
  # 06a slot overlay) so the Job ends and the hook unblocks before Helm
  # gives up. History: 840s (Fix #152) -> 1740 -> 2100 (#4632). #4723
  # (chart 0.1.102): the #4632 arithmetic was broken — worst-case script
  # time was autoWaitForAPISeconds(1500) + autoHandoverWaitSeconds(1500)
  # = 3000s INSIDE this 2100s deadline, and even the happy path (API up)
  # left ~600s for pod scheduling + a COLD image pull (~10min on a fresh
  # prov, no warm registry pre-cutover) → the pod was killed mid-retry
  # before its own graceful exit-0 (live: hw220 attempt 1 DeadlineExceeded
  # at exactly +2100s, a wasted 26-min Helm remediate/reinstall cycle).
  # Now: 600 + 900 = 1500s worst-case script time under the unchanged
  # 2100s deadline = a real 600s pod-start margin on EVERY path.
  autoTimeoutSeconds: 2100
  # TTL on the completed Job — kept for audit so operators can read
  # the trigger Pod logs if something looks wrong.
  autoJobTTLSeconds: 86400

# ── #5359 SECONDARY-REGION (region-B) pivot legs ──────────────────────
#
# On a 2-region Sovereign the 11-step chain runs in the CONTROL-PLANE
# (region-A) cluster only, and pre-0.1.151 it pivoted ONLY region-A:
# live-proven on hw288 (dep 027f07559af1f9f7) region-B's Flux
# GitRepository still pointed at github.com, all 64 HelmRepositories at
# ghcr.io — yet cutoverComplete=true (the step-08 deny-egress proof
# never touched region-B). A FALSE-POSITIVE Pillar-5 claim, and the
# direct cause of the #5339 per-region chart-version drift (region-A on
# the frozen local mirror, region-B tracking latest public ghcr).
#
# 0.1.151 teaches steps 05/06/08 a per-secondary-region leg driven by
# `kubectl --kubeconfig /secondary-kubeconfigs/<regionKey>.yaml`:
#
#   step 05  patches EVERY region's flux GitRepository -> local Gitea
#            (region-B reaches it through a Cilium ClusterMesh global
#            Service alias this leg establishes — the bp-cnpg-pair /
#            bp-openbao cross-region-mesh-service idiom);
#   step 06  pivots EVERY region's HelmRepositories -> local Harbor
#            (+ syncs the ghcr-pull auth + the cutover-harbor-ca trust
#            Secret into the secondary's flux-system);
#   step 08  applies the SAME deny-egress hold manifest to EVERY region
#            (inheriting the ALLOW_CIDRS + #4596/#5020-5025 provider-API
#            carve-outs) and requires EVERY region's Flux to stay green
#            through the window — the sovereignty proof now covers the
#            whole Sovereign, not just its control-plane region.
#
# CREDENTIAL SOURCE (no new secret contract): catalyst-api's cutover
# engine (cutover.go runCutover, #5359) materializes the secondary
# kubeconfigs it ALREADY holds on its PVC (`<kubeconfigsDir>/<depID>-
# <regionKey>.yaml`, the same store ClusterMesh establish + the #5244
# gateway-ELB reconciler read; server host healed to the VPC-routable
# private IP per #3991/#4000) into the Secret named below, one
# `<regionKey>.yaml` data key per secondary region. The steps mount it
# `optional: true`:
#
#   SINGLE-REGION Sovereign -> the engine guarantees the Secret is
#   ABSENT -> the mount is empty -> every leg no-ops -> behavior is
#   byte-identical to 0.1.150. No overlay change needed.
#
# Step 04 (registry-pivot: region-B node containerd certs.d + the
# per-region Dragonfly/dfdaemon + coredns-custom chain) is the
# remaining region-B increment, tracked on #5359 — it requires the
# region-B bootstrap-kit's own bp-dragonfly plumbing and is NOT
# silently faked here.
secondaryRegions:
  # Secret (in this release namespace) carrying one `<regionKey>.yaml`
  # kubeconfig per secondary region. Written by catalyst-api at every
  # cutover run start; mounted optional:true so its absence (single-
  # region) renders the legs inert. Must match catalyst-api's
  # CATALYST_CUTOVER_SECONDARY_KUBECONFIGS_SECRET (default identical).
  kubeconfigSecretName: "cutover-secondary-kubeconfigs"
  # Step 05 region-B leg: bounded wait, PER CANDIDATE URL, for the
  # secondary GitRepository to CONVERGE — observedGeneration ==
  # generation with Ready=True, not merely Ready=True. FAIL-LOUD: a
  # secondary that cannot converge on any candidate fails the step.
  #
  # #5359 (hw292): the old predicate accepted a stale Ready=True left
  # over from the object's last successful clone of PUBLIC github.com,
  # so the leg recorded success at 07:39:48Z — the same second Ready
  # actually flipped to False — and the region stayed on its pre-pivot
  # artifact for 22h. Ready is a status field; immediately after a patch
  # it still describes the previous spec.
  gitRepositoryReadySeconds: 300
  # Step 06 secondary leg: DURABLE pivot assert (#5596). After patching a
  # secondary region's HelmRepositories, the leg pokes that region's own
  # GitRepository + HR-owning Kustomizations (helmRepositories.
  # readbackReconcileKustomizations) with a reconcile token and refuses to
  # record success until one of those Kustomizations reports
  # status.lastHandledReconcileAt == that token — i.e. the actor that would
  # REVERT the pivot has already run — with the read-back clean on every
  # sample up to that point.
  #
  # #5596 (hw292, dep 1c56518035a83e03): the pre-0.1.171 read-back was
  # single-shot and fired seconds after the patch loop, so it sampled the
  # PATCH and never the PIVOT. The step recorded
  # step.helmrepository-patches.region.me-east-215-b-1.result=success at
  # 07:41:13Z; region-b's kustomize-controller re-applied its FROZEN
  # pre-cutover artifact at 07:42:08Z and put all 64 HelmRepositories back
  # on oci://ghcr.io/openova-io. cutoverComplete=true landed at 08:12:30Z
  # and 3 days later region-b was still 64/65 on ghcr.io. 55 seconds was
  # the entire width of the window the old assert could see.
  #
  # A converged secondary handles the poke in seconds, so a healthy region
  # costs ~2 samples of wall-clock and never waits the budget out; the
  # budget is only spent on a region that genuinely cannot prove durability,
  # where failing loud after 5 minutes is exactly the right trade. Inside
  # stepTimeouts.helmRepositoryPatchesSeconds (2400s) alongside the region-A
  # read-back + Phase-3a strip-readiness worst case.
  pivotReadbackSeconds: 300
  # Consecutive clean read-backs required (the last of which must land at or
  # after the poked re-apply). 2 keeps a healthy region fast while still
  # spanning one interval of live observation.
  pivotReadbackSettleSamples: 2
  # Seconds between read-back samples. Same 10s cadence step-05's secondary
  # convergence poll uses.
  pivotReadbackIntervalSeconds: 10
  # Git URL the SECONDARY regions' GitRepository is pivoted to. Empty
  # (default) = the chain is the Sovereign's OWN external Gitea door
  # (giteaFallbackURL / giteaFallbackToPublicDoor below). Setting this
  # pins the chain to exactly one URL (explicit operator intent — e.g.
  # the qaTestEnabled LE-staging case where the public door is
  # x509-hostile and the operator must name a reachable path).
  #
  # #5359 — why the in-cluster URL is NOT in the default chain (0.1.166;
  # 0.1.151..0.1.165 tried it first and every 2-region cutover burned a
  # gitRepositoryReadySeconds window on it). `gitea-http.gitea.svc.
  # cluster.local` resolves LOCALLY in the secondary: a 2-region
  # Sovereign installs bp-gitea in both regions, so the secondary has
  # its own same-named Service selecting its own (empty, never mirrored)
  # Gitea. The retired step-05 mesh alias could not override that,
  # because BOTH Services are HEADLESS (clusterIP: None) and Cilium
  # ClusterMesh global-services do not span headless Services at all —
  # CoreDNS answers straight from the local EndpointSlice, making
  # `service.cilium.io/global` inert — and even a non-headless global
  # pair would MERGE the empty local backend into the pool. Live on
  # hw292 region-b that name resolved to 10.43.3.228 (its own gitea
  # pod), whose openova/openova advertises zero refs → "pkt-line 3: EOF"
  # on every fetch, generation=2/observedGeneration=1 for 22h.
  giteaURL: ""
  # #5359 — the DEFAULT secondary pivot target. Empty +
  # giteaFallbackToPublicDoor=true (the default) means
  # `https://gitea.<sovereign.fqdn>/<org>/<repo>`: the Sovereign's OWN
  # external Gitea door. That is ON-Sovereign, not a tether — it is the
  # Sovereign's own gateway VIP (served DIRECT per §854: LB-IPAM VIP /
  # hostPort, never a NodePort), it satisfies the step-08 source-host
  # lint's *.<fqdn> exemption, and the step-08 secondary deny-egress leg
  # already carves out that gateway's public IPs so the hold does not cut
  # it. Live-verified on hw292: from region-b this door served HEAD
  # 7bcd1d59… — byte-identical to region-A's in-cluster Gitea, i.e. the
  # PIVOTED content — while the in-cluster name served zero refs.
  #
  # The key keeps its historical FALLBACK spelling so pinned values files
  # survive the 0.1.166 default flip unchanged (#5323 key-rename class).
  # giteaFallbackToPublicDoor=false with giteaURL and giteaFallbackURL
  # both empty leaves a secondary with NO candidate: the leg fails LOUD
  # at its first region (stamping result=failed) instead of silently
  # pivoting to an unreachable URL or leaving the region tethered.
  giteaFallbackURL: ""
  giteaFallbackToPublicDoor: true
  # Extra CIDRs allowed by the SECONDARY regions' deny-egress hold, ON
  # TOP of egressTest.allowIntraClusterCIDRs + allowProviderCIDRs (both
  # inherited verbatim) + the auto-resolved public IPs of the
  # Sovereign's OWN registry.<fqdn>/gitea.<fqdn> gateway (the
  # secondary's helm-controller pulls charts through that door — the
  # Sovereign's own infrastructure, not a mothership tether). Cloud-init
  # overlays may add e.g. the peer region's node CIDR.
  extraEgressAllowCIDRs: []
