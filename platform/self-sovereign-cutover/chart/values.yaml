# bp-self-sovereign-cutover — default values.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally
# meaningful value flows in via per-Sovereign Flux HelmRelease values; the
# placeholder defaults below let `helm template` smoke-render cleanly in CI
# without --set. Per-Sovereign overlays
# (clusters/_template/bootstrap-kit/06a-bp-self-sovereign-cutover.yaml)
# supply real values via envsubst on `${SOVEREIGN_FQDN}` exactly the way
# 19-harbor.yaml + 10-gitea.yaml do.
#
# This chart installs DORMANT. Job PodSpecs are emitted as ConfigMaps;
# catalyst-api reads them at cutover trigger time and stamps real batch/v1
# Jobs. NO helm.sh/hook annotations on any Job manifests in this chart.

global:
  # When set, post-pivot step ConfigMaps render image references through
  # this prefix (so catalyst-api stamps Jobs that pull from the local
  # Harbor proxy-cache). Pre-pivot steps (gitea-mirror, harbor-projects,
  # harbor-prewarm, registry-pivot) MUST use upstream-public images
  # because they run BEFORE the local Harbor proxy-cache + containerd
  # registries.yaml v2 are in place. Default empty = upstream-public for
  # all steps (safe default for smoke render).
  imageRegistry: ""

# Sovereign coordinates. The HelmRelease in
# clusters/_template/bootstrap-kit/06a-bp-self-sovereign-cutover.yaml
# substitutes ${SOVEREIGN_FQDN} from cluster overlays.
sovereign:
  # REQUIRED at install time — overlay supplies a real FQDN. The
  # placeholder below lets `helm template` smoke-render in CI; runtime
  # use with the placeholder is non-functional by design.
  fqdn: "example.local"
  # Local Harbor URL (in-cluster Service form). Used by step 02
  # (harbor-projects) and step 03 (harbor-prewarm). The PUBLIC
  # `registry.<sovereign.fqdn>` URL is what registries.yaml v2 + step 06
  # (helmrepository-patches) rewrite to (since containerd + Flux
  # source-controller resolve through public DNS, not in-cluster
  # CoreDNS). NB: the HTTPRoute hostname is `registry.<sov>`, NOT
  # `harbor.<sov>` — see `clusters/_template/bootstrap-kit/19-harbor.yaml`
  # `gateway.host`. Pre-2026-05-18 this said `harbor.<sov>` which no
  # HTTPRoute matched → bp-sandbox stuck forever (t20 debug matrix).
  # Service name on bp-harbor is `harbor-core` (NOT `harbor-harbor-core`)
  # — caught live on otech103 2026-05-04. Verified via
  # `kubectl get svc -n harbor` returns harbor-core ClusterIP.
  harborInternalURL: "http://harbor-core.harbor.svc.cluster.local"
  # ↓ overlay required for real cutover (uses ${SOVEREIGN_FQDN}).
  #    MUST be `registry.<sov-fqdn>` to match the bp-harbor HTTPRoute.
  #
  # #4682 — the registry is reached ONLY via the external host
  # `registry.<sov-fqdn>` on the standard HTTPS port :443, through the Cilium
  # Gateway API `Service type=LoadBalancer` (hcloud-ccm gives it an ExternalIP
  # on Hetzner; a CiliumLoadBalancerIPPool does on CCM-less Huawei). The gateway
  # listener is now plain :443 (hostNetwork is OFF, so cilium-envoy never does a
  # privileged host bind and the old high-NodePort :30443 workaround is gone).
  # No in-cluster ClusterIP rewrite, no coredns-custom registry-local.server
  # block, no :30443 append — in a segregated DMZ/RTZ multi-cluster topology an
  # in-cluster ClusterIP does not route across clusters, so the external routable
  # host on :443 is the only correct target for both source-controller and the
  # step-06 Phase-3a probe.
  harborPublicURL: "https://registry.example.local"
  giteaInternalURL: "http://gitea-http.gitea.svc.cluster.local:3000"
  # ↓ overlay supplies https://gitea.${SOVEREIGN_FQDN} (informational; jobs use internal URL).
  giteaPublicURL: "https://gitea.example.local"
  # ↓ overlay required for real cutover (uses ${SOVEREIGN_FQDN}).
  #    #2940 Phase 3: Step 07 pivots the catalyst-api issuer envs
  #    (CATALYST_PIN_ISSUER / CATALYST_HANDOVER_JWT_ISSUER) + the
  #    catalyst-runtime-config console/api-public URL keys to this
  #    value, then read-back-asserts zero openova.io residue. The Job
  #    FAILS FATAL if left at the example default — a cutover that
  #    skipped the issuer pivot would pass the egress hold while every
  #    token still carried a mothership `iss`.
  consolePublicURL: "https://console.example.local"

# ── plane-isolation carve-out for the cutover Job namespace ───────────
# (#3821 mgmt-era, Refs #3379 #3642; #4325 de-vcluster update, Refs #4291 #4293)
#
# The cutover step Jobs are stamped by catalyst-api into THIS chart's
# release namespace (`.Release.Namespace`, the `catalyst` ns). Several
# steps must reach the platform-plane apps gitea / harbor / openbao:
#   - step 01 (gitea-mirror)               -> gitea-http.gitea.svc
#   - step 02/03 (harbor-projects/prewarm) -> harbor-core.harbor.svc
#   - step 09 (gitea-token-mint)           -> gitea-http.gitea.svc
#
# Post-#4325 the platform planes are first-class HOST namespaces
# (gitea / harbor / openbao), each carrying a per-component default-deny
# CiliumNetworkPolicy from bp-plane-isolation (slot 26b). Those allow-lists
# admit `catalyst-system`, `flux-system`, `cnpg-system`,
# `external-secrets-system` — but NOT `catalyst`. So every cutover Job's
# dial from the `catalyst` ns into a plane namespace is dropped at the
# Cilium policy verdict and the cutover wedges at step 01/02/03/09 with
# `watch Job catalyst/cutover-gitea-mirror-...: context deadline exceeded`.
# (Pre-#4325 the same wedge had a different owner — bp-mgmt-vcluster's
# `-isolation` NetworkPolicy on the single `mgmt` mirror namespace, #3821.)
#
# These chart-owned NetworkPolicies are PURELY ADDITIVE (Cilium unions
# every NetworkPolicy + CiliumNetworkPolicy selecting an endpoint — same
# additive idiom bp-mgmt-vcluster #3817 uses for its gateway-ingress CNP)
# so they open `catalyst -> <plane>` ingress WITHOUT editing
# bp-plane-isolation / bp-mgmt-vcluster (owned separately). The canonical
# complement is to add `catalyst` to each plane's bp-plane-isolation
# allowIngressFrom; carrying the carve-out here makes the cutover
# self-contained regardless of who owns the plane policy.
#
# Disable on a Sovereign with NO plane-isolation NetworkPolicies by setting
# enabled: false.
mgmtIsolationCarveOut:
  enabled: true
  # Plane host namespaces the cutover Jobs dial. Post-#4325 the planes are
  # native host namespaces; gitea/harbor/openbao are the apps steps
  # 01/02/03/09 reach. A pre-#4325 (mgmt-vCluster) Sovereign overrides this
  # to `[mgmt]` (the single ExternalName-mirror namespace) — or just sets
  # the legacy `mgmtNamespace` below, which is folded into this set.
  targetNamespaces:
    - gitea
    - harbor
    - openbao
  # Legacy single mgmt host namespace (pre-#4325 topology). Empty by default
  # post-de-vcluster (mgmt is no longer a namespace). When non-empty it is
  # ADDED to targetNamespaces, so an operator overlay that only flips this
  # value still opens the path. Backward-compatible with #3821 overlays.
  mgmtNamespace: ""

# Upstream openova-io read-only public clone — the source for cutover
# step 01. Step-1 calls Gitea's /repos/migrate API with mirror=true so
# Gitea itself owns the recurring upstream sync going forward; the local
# repo polls upstream on .Values.upstream.mirrorInterval. Overrideable
# so a Sovereign that ships from a fork can rebase the seed.
upstream:
  repoURL: "https://github.com/openova-io/openova"
  branch: "main"
  # Gitea pull-mirror poll interval. Format = Go duration string parsed
  # by Gitea (e.g. "10m0s", "1h0m0s"). Set to 10m by default — short
  # enough that a chart bump → upstream merge → Sovereign reconcile
  # cycle stays under 15 minutes end-to-end, long enough that GitHub
  # anonymous-clone rate limits aren't a concern even with hundreds of
  # Sovereigns. Caught the "drifts forever after cutover" bug live on
  # otech103 2026-05-04 — chart 0.1.14 closes that loop. (#870)
  mirrorInterval: "10m0s"
  # Mothership Harbor — the soft-tethered cold-start registry. Step 08
  # egress-block test asserts the cluster can survive without this URL.
  mothershipHarborURL: "https://harbor.openova.io"

  # Wave 5.110 (#2462): optional bastion mirror in front of harbor.openova.io.
  # When set (Huawei Sovereigns), the cold-start registries.yaml v1 (rendered
  # by 04-registry-pivot-daemonset.yaml) ALSO mirrors harbor.openova.io →
  # this endpoint, so containerd's resolution of ghcr.io/quay.io/etc. (each
  # rewritten to harbor.openova.io/v2/proxy-X) flows through the bastion
  # registry:2 cache instead of hitting Contabo NAT directly. Hetzner
  # Sovereigns leave empty — they reach harbor.openova.io fine over public
  # Internet without a mirror. Live evidence: hw06-hw10 stuck at Phase 1
  # because cnpg + openbao etc. images pulled via harbor.openova.io directly
  # from Huawei NAT EIPs hit intermittent DNS NXDOMAIN.
  harborProxyMirrorEndpoint: ""

# Local Gitea target — the org + repo created by step 01 (gitea-mirror).
gitea:
  org: "openova"
  repo: "openova"
  # Shape of the admin secret created by bp-gitea's templates.
  # Keys: username, password, token (optional). Job uses BasicAuth
  # username:password against /api/v1 + git push.
  #
  # NOTE on namespace: the cutover step Jobs are stamped by catalyst-api into
  # THIS chart's release namespace (`catalyst`) and read these credentials via
  # a Kubernetes `secretKeyRef`, which resolves ONLY in the Pod's OWN
  # namespace (the `namespace` field below is informational — secretKeyRef has
  # no cross-namespace form). bp-gitea creates `gitea-admin-secret` in the
  # `gitea` namespace. The `giteaAdminSecretBridge` block below re-publishes a
  # plain copy into THIS release namespace at install time so the step Jobs'
  # secretKeyRef resolves natively — no hand-bridge.
  adminSecretRef:
    name: "gitea-admin-secret"
    namespace: "gitea"
    usernameKey: "username"
    passwordKey: "password"

  # #4967 (Refs #3379 #4885) — self-healing re-assert of the Gitea admin
  # password before step-06's authenticated Gitea-API calls (the demirror
  # PATCH + the git clone/push).
  #
  # ROOT CAUSE (hw236 live cutover step-06 demirror 401). step-06 authenticates
  # to Gitea with BasicAuth gitea_admin:<gitea-admin-secret.password>. step-04
  # registry-pivot rolls the gitea image ~minutes earlier; on a gitea Pod
  # restart the init container re-seeds the admin password from the Secret via
  # GITEA_ADMIN_PASSWORD_MODE=keepUpdated. If that re-sync races / no-ops / is
  # reverted by a CNPG restore, the LIVE DB password DRIFTS from the Secret and
  # EVERY admin-API auth 401s `user's password is invalid [uid:1 name:
  # gitea_admin]`. bp-gitea's admin-secret Helm-lookup pin + the #4885
  # bp-reloader roll SHRINK the drift window but do not CLOSE it.
  #
  # FIX. Phase-1.4 of 06-helmrepository-patches-job.yaml execs
  # `gitea admin user change-password` in the live gitea Pod to force the DB row
  # to match the Secret BEFORE the first authenticated call. The CLI writes the
  # users table directly (no admin session needed) so it heals even while the
  # API is 401ing. Best-effort: if the Pod can't be resolved it logs and falls
  # through to the PATCH (either succeeds — no drift — or fails the same clear
  # 401 as before; no regression). The cutover runner already has pods/exec.
  adminPasswordReassert:
    # Flip false only where the cutover runner is barred from execing the gitea
    # Pod (then the demirror relies on keepUpdated + reloader having converged).
    enabled: true
    # Host namespace where bp-gitea runs. Post-#4325 de-vcluster gitea lives in
    # the native host `gitea` namespace.
    namespace: "gitea"
    # Label selector for the live gitea Pod. Upstream gitea 10.5.0 renders a
    # Deployment (pod name gitea-<hash>-<id>), so we select by label, not an
    # index. Release name is `gitea` on Sovereigns (matches sso-configure #2818).
    podSelector: "app.kubernetes.io/name=gitea,app.kubernetes.io/instance=gitea"
    # Container inside the gitea Pod that carries the `gitea` CLI.
    containerName: "gitea"

# #4557 (Refs #3379 #3642 #3811): durable host bridge of `gitea-admin-secret`
# into THIS chart's release namespace (`catalyst`).
#
# WHY THIS EXISTS. Every cutover step Job that needs the Gitea admin
# credential (06-helmrepository-patches, 07-catalyst-api-env-patch,
# 09-gitea-token-mint, 10-vcluster-registry-pivot, 11-mirror-resync) is
# stamped by catalyst-api into the cutover release namespace (`catalyst`) and
# reads `gitea-admin-secret` via a Kubernetes `secretKeyRef`. A secretKeyRef
# resolves ONLY in the Pod's own namespace — there is no cross-namespace
# form. bp-gitea creates `gitea-admin-secret` in the `gitea` namespace (and
# the #3811 bp-catalyst-platform bridge also publishes a plain copy there
# after #3642 moved gitea into the mgmt vCluster), so on a fresh prov the
# secret is ABSENT from `catalyst` → the first step Job that references it
# (or its stamping) fails `secret "gitea-admin-secret" not found`. Prior
# walks hand-bridged a `kubectl apply` copy into `catalyst`; this block makes
# that durable in the chart so the cutover is self-contained.
#
# Same Helm-lookup-and-mirror seam proven by bp-catalyst-platform's
# catalyst-gitea-admin-secret-bridge.yaml (#3811),
# provisioning-github-token.yaml (#3122) and valkey-cross-ns-secret.yaml
# (#863). Source-wins on every reconcile so a Gitea admin-password rotation
# propagates on the next Flux tick. Per docs/INVIOLABLE-PRINCIPLES.md #10 the
# password bytes are read back via lookup from the live source Secret and
# re-emitted base64 — they never appear in chart source or rendered manifests.
giteaAdminSecretBridge:
  # Default true. Flip false only where the cutover release namespace already
  # carries a plain `gitea-admin-secret` by another mechanism.
  enabled: true
  # Source — where bp-gitea (or the #3811 bridge) publishes the plain
  # `gitea-admin-secret`. Default `gitea` namespace.
  sourceNamespace: "gitea"
  sourceSecretName: "gitea-admin-secret"
  # Destination secret name in THIS chart's release namespace. MUST match
  # gitea.adminSecretRef.name so the step Jobs' secretKeyRef resolves.
  destSecretName: "gitea-admin-secret"
  usernameKey: "username"
  passwordKey: "password"
  # #4660 — RUNTIME materialisation Job (the durable fix for the render-time
  # fragility of the Helm-lookup bridge above).
  #
  # WHY. The lookup-and-mirror Secret above reads the source at HELM RENDER
  # time. But this chart installs DORMANT at bootstrap-kit slot 06a, which
  # renders BEFORE bp-gitea (slot ~14) exists → the lookup returns nil → the
  # bridge Secret is never emitted into the release namespace. Once the cutover
  # HR reaches Ready (no drift) helm-controller does NOT re-render, so the
  # render-time bridge stays absent indefinitely and the first cutover step Job
  # that references `gitea-admin-secret` (06-helmrepository-patches /
  # 09-gitea-token-mint, secretKeyRef in the Pod's OWN namespace) fails
  # `CreateContainerConfigError: secret "gitea-admin-secret" not found` → the
  # cutover wedges at step-06 (live on prov 17c2e8b2).
  #
  # THE FIX. A regular (non-hook) Job ships with the chart and runs at install.
  # It WAITS at RUNTIME (poll loop) for the source `gitea/gitea-admin-secret`
  # to exist, then copies it into the release namespace as `destSecretName`.
  # Runtime copy is EVENT-DRIVEN (it watches the source appear) rather than
  # render-time-bound, so a late-arriving secret is materialised regardless of
  # when bp-gitea converges relative to slot 06a. The lookup Secret above is
  # kept as the no-cost fast path for re-installs/upgrades where gitea already
  # exists; this Job is the guarantee of eventual materialisation.
  #
  # The Job is scoped by a dedicated ServiceAccount + a same-namespace Role
  # (create/get/patch the destination Secret) + a `gitea`-namespace Role
  # scoped via resourceNames to read ONLY `gitea-admin-secret` — it cannot read
  # any other Secret on the cluster. Per docs/INVIOLABLE-PRINCIPLES.md #10 the
  # admin-password bytes are streamed kubectl→kubectl in-pod and never echoed.
  runtimeJob:
    # Flip false to ship ONLY the render-time lookup Secret (e.g. an env where
    # gitea is guaranteed up before slot 06a renders). Default true.
    enabled: true
    # Poll budget — total wait = pollIntervalSeconds * pollMaxAttempts. Defaults
    # 30s * 60 = 1800s (30 min), comfortably inside the HR install/upgrade 40m
    # timeout and long enough to span the slot-06a → bp-gitea (slot ~14) gap on
    # a cold fresh prov. Both values-overridable (Principle #4: no hardcoding).
    pollIntervalSeconds: 30
    pollMaxAttempts: 60
    # Job-level activeDeadlineSeconds — must exceed pollIntervalSeconds *
    # pollMaxAttempts plus a copy-and-verify margin. Default 2000s (~33 min).
    activeDeadlineSeconds: 2000
    # ttlSecondsAfterFinished — keep the completed Job around for operator
    # forensics for a day by default, then auto-GC.
    ttlSecondsAfterFinished: 86400

# GitRepository pivot credential — step 05 (flux-gitrepository-patch). #3536.
#
# THE BUG (hw138/hw136 keystone catch, Refs #3379): step 05 repoints
# GitRepository/openova from public github.com to the local Gitea, but the
# cloud-init bootstrap GitRepository carries NO secretRef (public GitHub
# clones anonymously). bp-gitea sets service.REQUIRE_SIGNIN_VIEW=true
# (platform/gitea/chart/values.yaml) — anonymous clone of the local Gitea
# 401s "authentication required" even for a PUBLIC repo (PROVEN live on
# hw133, see products/catalyst/.../org-tenants-gitrepo-auth-secret.yaml).
# So after the pivot, source-controller can never fetch the local source →
# step 06's HelmRepository URL rewrites never reconcile → step 08's bounded
# pivot-wait can never converge → the 600s deny-egress hold never runs →
# cutoverComplete=false. The Gitea PAT was only minted at step 09 (after
# step 08), which is too late.
#
# THE FIX: step 05 wires a Flux basic-auth Secret into
# GitRepository.spec.secretRef BEFORE flipping the URL, using the
# `catalyst-gitea-token` PAT (key `token`) that bp-catalyst-platform's
# pre-install hook already minted at BOOTSTRAP — long before cutover fires.
# This is the identical credential + pattern issue #3454 used for the
# openova-org-tenants GitRepository. A Gitea PAT is accepted as the HTTP
# git password (REQUIRE_SIGNIN_VIEW=true → anonymous 401, PAT → 200).
#
# Flux GitRepository.spec.secretRef accepts only `name` (no namespace) and
# resolves it in the GitRepository's OWN namespace (flux-system). The PAT
# Secret lives in catalyst-system, so step 05 reads it and materialises a
# basic-auth Secret in flux-system (keys username/password) that the
# GitRepository can reference.
#
# #5262 — this block is ALSO the PAT source for the git clone/push legs of
# step-01 (gitea-mirror, #3584), step-10 (vcluster-registry-pivot) and
# step-11 (crossplane-provider-pivot): they read the token at runtime via
# kubectl and embed `<username>:<PAT>@` in the git remote URL. Steps 10/11
# previously authenticated with the gitea-admin-secret password, which can
# rotate out from under Gitea's DB on a mid-cutover bp-gitea re-render
# (live hw277: clone 401 / git exit 128); the step-09 re-minted PAT is
# fresh-per-cutover by construction and immune to that drift.
gitRepositorySecretRef:
  # Destination basic-auth Secret name (created/updated by step 05 in the
  # GitRepository's namespace = gitopsRepository.namespace). The
  # GitRepository's spec.secretRef.name is patched to this.
  destSecretName: "cutover-gitea-git-auth"
  # Source PAT Secret minted at bootstrap by bp-catalyst-platform
  # (templates/catalyst-gitea-token-secret.yaml). catalyst-platform's
  # HelmRelease has targetNamespace: catalyst-system, so the Secret lands
  # there with key `token`.
  patSourceNamespace: "catalyst-system"
  patSourceSecretName: "catalyst-gitea-token"
  patSourceKey: "token"
  # Git HTTP username for the basic-auth pair. Matches the Gitea admin
  # account (CATALYST_GITOPS_USER literal `gitea_admin`, per
  # api-deployment.yaml + org-tenants-gitrepo-auth-secret.yaml).
  username: "gitea_admin"

# Local Harbor target — admin credentials + proxy_cache projects to create.
harbor:
  # Shape of the admin secret materialised by bp-harbor's templates
  # (Catalyst-curated `harbor-admin` Secret with key HARBOR_ADMIN_PASSWORD).
  #
  # The bp-harbor umbrella chart (templates/admin-secret.yaml) emits
  # this Secret in the `harbor` namespace AND annotates it with
  # Reflector mirror annotations (allowed-namespaces=catalyst), so the
  # SAME Secret name auto-materialises in this Job's `catalyst`
  # namespace without any cross-namespace secretKeyRef gymnastics.
  # Caught live on otech113 2026-05-05 — Step 02 was failing with
  # `secret "harbor-core" not found` because the upstream `harbor-core`
  # Secret only exists in the `harbor` namespace and K8s forbids
  # cross-namespace secretKeyRef. (issue #935)
  #
  # HARBOR_ADMIN_USERNAME is intentionally NOT carried by the Secret —
  # the upstream Harbor chart hardcodes it to "admin", and Step 02's
  # PodSpec already defaults via `: "${HARBOR_USERNAME:=admin}"` with
  # `optional: true` on the secretKeyRef.
  adminSecretRef:
    name: "harbor-admin"
    namespace: "harbor"
    usernameKey: "HARBOR_ADMIN_USERNAME"
    passwordKey: "HARBOR_ADMIN_PASSWORD"
  # GHCR upstream credential (operator-issued, written by cloud-init at
  # /var/lib/catalyst/ghcr-pull-secret.yaml). Used as the credential the
  # proxy-ghcr registry attaches when pulling from ghcr.io.
  ghcrSecretRef:
    name: "ghcr-pull"
    namespace: "flux-system"
    # Secrets of dockerconfigjson type carry their value under
    # `.dockerconfigjson`; step 02 parses it for username/password.
    dockerConfigKey: ".dockerconfigjson"
  # Mothership-side auth entries to STRIP from `ghcr-pull` Secret's
  # `.dockerconfigjson` during step-06 Phase-0 (TBD-V24 MISS-2, chart
  # 0.1.35). Once cutover lands and harbor.<sov-fqdn> auth is merged
  # in, the original ghcr.io + harbor.openova.io auth entries are no
  # longer needed — Catalyst-authored images pull through the local
  # Harbor proxy-cache via containerd registries.yaml v2 (step 04),
  # not through Flux source-controller against upstream GHCR.
  # Stripping enforces credential hygiene: post-cutover the cluster
  # CANNOT silently fall back to mothership-side registries even
  # under a regression. CLAUDE.md §3 Principle #11 ("Sovereigns must
  # be independent of openova-io after handover") is the canonical
  # source for the list — keep this list in lockstep with the 4
  # tether URL families enumerated there. Idempotent: re-runs with
  # entries already gone are no-ops. (Refs #2034)
  mothershipAuthsToStrip:
    - "ghcr.io"
    - "harbor.openova.io"
    # TBD-V24 MISS-3 (chart 0.1.37, 2026-05-20): xpkg.upbound.io is the
    # Crossplane Provider package upstream — Step 11 pivots every
    # `Provider.spec.package` literal from xpkg.upbound.io to
    # `harbor.<sov-fqdn>/proxy-xpkg`, so any standing auth for the
    # upstream xpkg host on the ghcr-pull Secret is no longer needed.
    # Strip it for the same credential-hygiene rationale as the other
    # mothership entries above (CLAUDE.md §3 Principle #11). Defence-
    # in-depth: even though ghcr-pull rarely carries xpkg auth today
    # (Provider packages typically pull anonymously), an operator
    # overlay that adds xpkg credentials gets the same clean-up here.
    - "xpkg.upbound.io"
  # G66 #2615 (2026-05-31): push-mode projects for skopeo native
  # uploads of openova-io application images. Distinct from
  # proxyProjects (which are proxy-cache mode with upstream
  # adapters). Push-mode projects exist only as local Harbor
  # storage — no upstream. Step 02 ensures these exist; Step 03
  # Phase A skopeo-pushes images into them.
  #
  # The `openova-io` project name matches the path segment in
  # ghcr.io/openova-io/openova/<svc>:<tag> — Phase A copies to
  # registry.<sov>/openova-io/openova/<svc>:<tag>, dropping only
  # the `ghcr.io/` host prefix. Kept private (public:false) — the
  # Sovereign HTTPRoute + Kyverno glob gate anonymous pull of this
  # project, per CLAUDE.md §pushProjects.
  pushProjects:
    - "openova-io"
  # #4975 (Refs #3379 #3695) — the OFFLINE-MIRROR push projects. These
  # REPLACE the former proxy-cache projects for every upstream host containerd
  # can reach (docker.io / ghcr.io / quay.io / registry.k8s.io / gcr.io /
  # public.ecr.aws). A proxy-cache project CANNOT survive the step-08
  # deny-egress hold (its back-to-source to the upstream OR the mothership is
  # black-holed), so a workload image that was never node-cached
  # ImagePullBackOffs the moment its pod is rolled. Step-03 Phase A3 skopeo-
  # PUSHES a COMPLETE copy of every workload image into these projects; step-04
  # rewrites containerd to serve them from the local Harbor. That is a real
  # offline mirror, not a warm cache subject to eviction.
  #
  # PUBLIC (public:true) so an upstream-image pod that carries NO
  # imagePullSecret (the common case — it pulled anonymously from docker.io
  # pre-cutover) still pulls anonymously post-rewrite; the proxy-cache projects
  # these replace were public:true, so this preserves the proven anon-pull
  # behaviour. Step 02 ensures these exist (harbor.mirrorProjects loop).
  #
  # Names MATCH the MOTHERSHIP Harbor project names (proxy-dockerhub, not
  # proxy-docker) so a `harbor.openova.io/proxy-<x>/PATH` ref host-swaps to
  # `registry.<fqdn>/proxy-<x>/PATH` with the path segment preserved — the
  # dominant bootstrap-kit image shape (cnpg, kubectl, csi, …).
  mirrorProjects:
    - "proxy-ghcr"
    - "proxy-dockerhub"
    - "proxy-quay"
    - "proxy-k8s"
    - "proxy-gcr"
    - "proxy-ecr"
    # #5442 — Chainguard (cgr.dev). Kept in LOCKSTEP with the
    # offlineMirror.hostProjects entry below: any host mapped to a project name
    # this list does not create makes step-03's skopeo push 404 on a
    # non-existent project, trading one cutover failure for a later one.
    # tests/offline-mirror-host-projects.sh asserts the lockstep from the
    # RENDER, in both directions.
    - "proxy-chainguard"
  # Proxy-cache project(s) that REMAIN pull-through. Only `proxy-xpkg`:
  # Crossplane's xpkg fetcher (internal/xpkg/fetch.go remote.Image) bypasses
  # the node containerd mirror, so step-11 (crossplaneProviderPivot) — NOT the
  # step-04 containerd rewrite — owns the xpkg tether. xpkg is EXCLUDED from
  # the offline mirror (offlineMirror.excludedHosts) so the step-08
  # completeness gate + roll-set never flag it. Names are stable because
  # step 11 rewrites Provider spec.package against this literal project name.
  proxyProjects:
    - name: "proxy-xpkg"
      upstreamURL: "https://xpkg.upbound.io"
      registryType: "docker-registry"
      authMode: "anonymous"

# #4975 (Refs #3379 #3695) — the OFFLINE-MIRROR coverage map: the SINGLE
# source of truth that retires the three hand-maintained lists (step-03
# ghcr-only push filter, prewarm.images, imageRegistryPivot.additionalHRs)
# whose drift caused the per-prov whack-a-mole (each fresh prov surfaced a new
# residual image tether the deny-egress hold caught mid-window).
#
# HOW IT ENDS THE WHACK-A-MOLE. Three cutover steps all consume THIS map, so
# they can never disagree about where an image lives locally:
#   • step-03 Phase A3 skopeo-PUSHES every enumerated workload image into
#     registry.<fqdn>/<project>/<path> (host-drop for openova-io; host-swap for
#     the mothership; <project>/<path> for a direct upstream host);
#   • step-04 rewrites the node's containerd certs.d so a pull of that upstream
#     host resolves to EXACTLY that local path;
#   • step-08 HEADs registry.<fqdn>/v2/<local-path>/manifests/<tag> BEFORE the
#     deny-egress hold and FATALs (naming the offender) if any is absent —
#     turning an opaque mid-hold ImagePullBackOff into a fail-fast.
# A chart that introduces an image from an un-mapped host FAILS the CI
# guardrail (tests/image-registry-coverage.sh) at authoring time.
offlineMirror:
  enabled: true
  # #5194 (Refs #4975 #5191) — step-08 pre-hold completeness SELF-HEAL. A
  # funnel Org provisioned MID-CUTOVER (after step-03 harbor-prewarm already
  # enumerated the workload set) is never mirrored: its pods are Running
  # (they pulled fine pre-hold) but the completeness gate 404s on the
  # missing NATIVE local manifest (live hw269: harbor.openova.io/
  # proxy-dockerhub/mariadb:11 + wordpress:6-apache, org hw269uatwalk).
  # Egress is still OPEN when the gate runs, so the gap is recoverable: on a
  # miss, step-08 now AUTO-WARMS the missing image into local Harbor via the
  # SAME step-03 skopeo proxy-copy mechanism (HOST_PROJECT_MAP + the
  # mothership-proxy direct-source fallback + prewarm.proxyCopyAttempts /
  # proxyBackoffBaseSeconds), then re-HEADs — only a warm that itself fails
  # (or a still-missing manifest afterward) fails the gate. Default true;
  # set false to restore the pre-#5194 immediate-fail behavior.
  selfHeal:
    enabled: true
  # host → local Harbor project. project "" = host-swap, path preserved (the
  # mothership host, whose path already carries the proxy-<x> segment).
  hostProjects:
    - host: "ghcr.io"
      project: "proxy-ghcr"
    - host: "docker.io"
      project: "proxy-dockerhub"
    - host: "registry-1.docker.io"
      project: "proxy-dockerhub"
    - host: "index.docker.io"
      project: "proxy-dockerhub"
    - host: "quay.io"
      project: "proxy-quay"
    - host: "registry.k8s.io"
      project: "proxy-k8s"
    - host: "gcr.io"
      project: "proxy-gcr"
    - host: "k8s.gcr.io"
      project: "proxy-gcr"
    # #4975 (Refs #3379 #3695 #4977) — Google's pull-through mirror of Docker
    # Hub / GCR. bp-trivy (slot 30) pins the trivy-operator + trivy scanner
    # images at mirror.gcr.io/aquasec/trivy-operator + mirror.gcr.io/aquasec/
    # trivy INSIDE the sub-chart values (platform/trivy/chart/values.yaml), so
    # the runtime step-03 prewarm enumeration surfaced it as the last uncovered
    # host on live hw239. Reuse proxy-gcr — mirror.gcr.io serves gcr.io/docker.io
    # content, so `mirror.gcr.io/aquasec/trivy` host-swaps to
    # registry.<fqdn>/proxy-gcr/aquasec/trivy with the path preserved. step-02
    # already creates proxy-gcr (harbor.mirrorProjects), so no new project.
    - host: "mirror.gcr.io"
      project: "proxy-gcr"
    # #5442 (Refs #4975 #5443) — Scarf DOWNLOAD-GATEWAY in front of Docker Hub.
    # bp-litmus's upstream subchart (litmuschaos/litmus 3.28.0) defaults its
    # image registry to `litmuschaos.docker.scarf.sh`, so a default-values
    # render of the PINNED catalog chart declares 4 refs on that host
    # (litmusportal-frontend / -server / -auth-server / mongo:6) that no
    # in-repo values.yaml mentions — which is why the authoring-time scan
    # (tests/image-registry-coverage.sh, whose surface is this repo's chart
    # values) could not see it and the step-03 Phase A3 guard surfaced it at
    # runtime on live hw291 as `unmapped=5`.
    #
    # It is NOT a distinct registry: `GET https://litmuschaos.docker.scarf.sh/v2/`
    # answers 401 with `www-authenticate: Bearer realm="https://auth.docker.io/
    # token",service="registry.docker.io"` — it delegates auth to Docker Hub's
    # own token service — and an unauthenticated pull through it returns Docker
    # Hub's verbatim rate-limit body ("You have reached your unauthenticated
    # pull rate limit. https://www.docker.com/increase-rate-limit"). So it is a
    # redirector whose content IS Docker Hub content: reuse proxy-dockerhub,
    # exactly as #4975 folded mirror.gcr.io into proxy-gcr. Path is preserved,
    # so `litmuschaos.docker.scarf.sh/litmuschaos/litmusportal-frontend:3.28.0`
    # resolves to registry.<fqdn>/proxy-dockerhub/litmuschaos/
    # litmusportal-frontend:3.28.0 — the SAME local path the docker.io form
    # resolves to, so the two dedupe instead of double-storing.
    #
    # ORDER MATTERS: this entry sits AFTER `docker.io:proxy-dockerhub` because
    # step-03 copy_one + step-08 self-heal derive the mothership-proxy
    # direct-source fallback (#5095) by an INVERSE map walk that takes the
    # FIRST host whose project matches — proxy-dockerhub must keep resolving
    # back to docker.io, not to the gateway. Same reason mirror.gcr.io is
    # listed after gcr.io.
    - host: "litmuschaos.docker.scarf.sh"
      project: "proxy-dockerhub"
    # #5442 (Refs #4975) — Chainguard's registry. bp-sigstore's upstream
    # subchart (sigstore/policy-controller) pins its leases-cleanup Job at
    # `cgr.dev/chainguard/kubectl:latest-dev`; same discovery path as the Scarf
    # host above (upstream subchart default, invisible to the repo-values scan,
    # surfaced by the runtime Phase A3 guard on hw291).
    #
    # Unlike Scarf this IS a genuinely distinct registry — cgr.dev is served by
    # Chainguard's own front-end (`GET https://cgr.dev/v2/` answers 405 from
    # `server: Google Frontend`, no Docker Hub delegation) and its content
    # exists nowhere in the Docker Hub / GCR / Quay namespaces — so it gets its
    # OWN project. `proxy-chainguard` is added to harbor.mirrorProjects in
    # LOCKSTEP (step-02 must create the project or step-03's push 404s and this
    # failure is merely traded for a later one).
    - host: "cgr.dev"
      project: "proxy-chainguard"
    - host: "public.ecr.aws"
      project: "proxy-ecr"
    # MOTHERSHIP — host-swap, path preserved. Must equal the host of
    # upstream.mothershipHarborURL. Empty project because the path already
    # carries the proxy-<x> project (e.g. proxy-ghcr/cloudnative-pg/postgresql).
    - host: "harbor.openova.io"
      project: ""
  # Hosts whose images are NOT mirrored (handled elsewhere / un-mirrorable).
  excludedHosts:
    # Crossplane package host — step-11 crossplaneProviderPivot owns it; the
    # xpkg fetcher bypasses containerd, so a containerd mirror is inert for it.
    - "xpkg.upbound.io"
  # Image-path substrings NEVER mirrored NOR rolled under deny-egress.
  excludedImageSubstrings:
    # per-Org vcluster distro image — un-mirrorable on the host plane (it runs
    # inside each Org's vcluster, not a host workload).
    - "rancher/k3s"
    # vcluster control-plane image — step-10 vcluster-registry-pivot owns it.
    - "loft-sh/vcluster"

# Pre-warm list — images to HEAD-pull through Harbor proxy-cache before
# the cluster reconciles against local Harbor, so first-reconcile pulls
# hit a warm cache. The list is intentionally narrow (the heaviest
# charts). Operators can extend via overlay; an empty list is also valid.
prewarm:
  # #3944 (Refs #3379 #3642 #3927): per-`skopeo copy` command timeout for
  # step-03 Phase A (openova-io container images) + Phase A2 (openova-io helm
  # chart OCI artifacts). A `skopeo copy` whose connection is ESTABLISHED but
  # silently STALLS mid-blob hangs forever — `--retry-times` only fires on an
  # ERROR, never on a stuck-but-alive connection. With no command timeout the
  # whole Job sits "active" until the 5400s activeDeadlineSeconds kills it,
  # catalyst-api auto-re-runs the DeadlineExceeded step, and the next 90-min
  # hang begins → "step-03 active for hours, never completing" (live hw171, dep
  # 3963e9267c10a90d, right after #3927 unstuck step-02). This bounds each
  # individual copy so a stalled connection FAILS FAST → the per-image outer
  # retry loop (PREWARM_COPY_ATTEMPTS) self-heals. Go duration string (skopeo
  # `--command-timeout`). 1200s (20m) is generous for the largest multi-layer
  # PRIVATE openova-io image over throttled egress yet collapses an infinite
  # hang into a bounded, retryable failure. Operators on extremely slow links
  # may raise it via overlay; it must stay comfortably below
  # stepTimeouts.harborPrewarmSeconds (9600s, #5298) so at least 2-3 copies can
  # run serially within one Job's deadline even in the worst case.
  skopeoCommandTimeout: "1200s"
  # #4529 (Refs #3379): TLS verification on the skopeo copy DESTINATION — the
  # IN-CLUSTER Harbor reached as `registry.<sov-fqdn>` (HARBOR_PUBLIC_URL →
  # HARBOR_HOST). DEFAULT false.
  #
  # WHY false is correct (NOT a security regression). Step-03 copies the
  # openova-io container images + helm chart OCI artifacts INTO the Sovereign's
  # OWN in-cluster Harbor over the cluster pod network. On a fresh prov that
  # Harbor's wildcard `*.<sov-fqdn>` cert is served by the BOOTSTRAP issuer
  # `letsencrypt-dns01-staging-powerdns` (LE-STAGING, untrusted by the public
  # CA bundle) until production LE certs rotate in — and even with production
  # LE certs a skopeo binary running in a Job Pod carries no node trust store,
  # so `--dest-tls-verify=true` raises `x509: certificate signed by unknown
  # authority` and EVERY push fails (`push_ok=0 push_fail=30` → step-03 FATAL →
  # the cutover never reaches the 600s deny-egress hold → cutoverComplete never
  # set; live keystone prov 25aadcfc on registry.kv160729.omani.works). The
  # destination is the cluster's OWN registry — trust is established by the
  # cluster network, NOT a public CA — exactly the same rationale the cold-start
  # registries.yaml v1 uses `tls.insecure_skip_verify: true` for the bastion
  # Harbor mirror (04-registry-pivot-daemonset.yaml). The cutover's SECURITY
  # intent is severing EXTERNAL tethers + pivoting to the LOCAL registry; the
  # witnessed 600s deny-egress hold (step-08) is the real security gate and is
  # wholly untouched by this flag. SRC verification stays true unconditionally
  # (the ghcr.io SOURCE is a public CA-signed external host that MUST be
  # authenticated).
  #
  # Operators with a public-CA-trusted internal registry cert AND a skopeo
  # trust store may set this true via overlay; default false is the correct
  # fresh-prov behaviour.
  destTLSVerify: false
  # #4982 (Refs #3379) — settled-roll pre-flight. step-03 harbor-prewarm mirrors
  # the RUNNING / declared-template image tags. If any HelmRelease or
  # Deployment/StatefulSet is MID-ROLL when the mirror is built (a bootstrap-kit
  # pin bumped but not yet reconciled, or an in-flight helm upgrade), running !=
  # desired: the cutover then rolls those workloads (registry-pivot step-04 /
  # catalyst-api env-patch step-07) to the DESIRED chart-pinned tags that were
  # never mirrored → step-06 readiness sample + step-08 pre-hold completeness HEAD
  # 404 on the un-mirrored desired tag (live hw239: umbrella bp-catalyst-platform
  # running 1.4.1086 but pin 1.4.1088; catalyst-api/ui running :3412183 but desired
  # :00b6cfe). Once step-05 pivots Flux to the local Gitea the GitRepository
  # freezes at the cutover-start sha, so the workloads can never roll to the
  # desired tag during the cutover — a running != mirrored deadlock the deny-egress
  # hold then trips on. This gate (Phase A0) REFUSES to build the mirror on an
  # unsettled host cluster — still PRE-PIVOT, nothing destructive has run — and
  # names every offender so the operator waits for the roll to settle and
  # re-triggers. The "settled-roll pre-flight" STONE principle. Default true; set
  # false ONLY as an emergency override on an env you have manually confirmed
  # settled.
  #
  # #5391 — NAMED PER-RELEASE OVERRIDE (prefer this over enabled=false, which
  # kills the whole gate). A Stalled=True/RetriesExceeded HelmRelease never
  # reaches Ready on its own (Flux stops retrying permanently — live hw290/
  # hw291, quota-wedged per-Org customer apps #5393), which held the entire
  # Sovereign's cutover closed forever. A sovereign-admin excludes ONE
  # genuinely-stuck release by annotating it:
  #
  #   kubectl annotate helmrelease <name> -n <ns> \
  #     catalyst.openova.io/cutover-settled-roll-override="<reason>"
  #
  # The annotation key is a FIXED contract (not a values knob — the audit
  # trail must not be configurable away). Validation is fail-closed: an
  # empty reason, an annotation on a healthy release, or one on a genuinely
  # mid-roll release (neither Stalled=True nor Ready.reason=DependencyNotReady)
  # each FATAL the gate naming the release. Honored overrides are recorded in
  # the status ConfigMap (settledRollOverrides) and surfaced on
  # GET /sovereign/cutover/status; recording failure is itself FATAL.
  settledRollPreflight:
    enabled: true
  # #5237 round 2 (Refs #5007 #3379) — PIN-AWARE prewarm: union the chart-
  # mirror set with the EXACT versions the bootstrap-kit slot pins in the
  # LOCAL GITEA MIRROR reference (clusters/_template/bootstrap-kit/*.yaml at
  # the commit step-01 mirrored — the SAME commit flux consumes once step-05
  # pivots the GitRepository). The live deployed∪desired union (#5007 round 3)
  # tracks the CLUSTER, which a mid-cutover catalog merge can roll AWAY from
  # the frozen pins before step-03 runs (the GitRepository still tracks GitHub
  # until step-05): prewarm then mirrors the transient tag while the version
  # flux settles back to post-pivot was never warmed → step-06 wedges /
  # post-strip chart (re)pulls 404 under the deny-egress hold. Enumerating the
  # FROZEN pins directly (via the shared cutover-bootstrap-kit-pins extractor
  # — ONE parser for step-03, step-06 and the #5265 Day-2 reconciler)
  # guarantees the post-cutover pin set is in local Harbor REGARDLESS of what
  # merges upstream mid-cutover — the durable close of the hw274
  # catalog-latest-vs-flux-pinned drift class (dep d51a69f885872a81).
  # FAIL-LOUD: an unreadable PAT / unreachable Gitea mirror / zero-pin parse
  # FATALs step-03 while egress is still open, never a silently narrower
  # mirror. Set false ONLY as an emergency override on an env whose local
  # Gitea mirror is manually confirmed unusable (the live-union mirror set +
  # the step-06 union-warm top-up then remain the only nets).
  bootstrapKitPins:
    enabled: true
  # #5443 (Refs #3627 #5237 #5442) — mirror the MARKETPLACE's chart set, not
  # only the charts something already installed.
  #
  # The two enumerations above (live HelmReleases + frozen bootstrap-kit pins)
  # both derive from what is INSTALLED. Step-06 nevertheless pivots the
  # `openova-catalog` HelmRepository — the one every per-Org Application
  # HelmRelease resolves through — onto the local Harbor, so after cutover the
  # marketplace resolves against a registry that was stocked from a strictly
  # smaller set. Measured on hw290 2026-07-27: 14 of 29 `visibility: listed`
  # catalog entries resolved and 15 returned 404, with no proxy-cache fallback
  # (the `openova-io` project is HOSTED, registry_id: None).
  catalogCharts:
    # Enumerate the LIVE Blueprint CRs (what `/api/v1/catalog` serves — the
    # catalog-seed only seeds them; the console's catalog editor and operator
    # curation both write the CRs) and union their chart:version coordinates
    # into the mirror set. OFF mirrors the installed union only, i.e. keeps the
    # pre-#5443 coverage gap.
    enabled: true
    # The `spec.visibility` whose entries are CONTRACTUAL: their
    # `spec.manifests.chart`:`spec.version` MUST mirror and MUST be provably
    # present, or the cutover fails loud with egress still open. `listed` is
    # the customer-visible marketplace grid — the set a Sovereign advertises as
    # installable. `unlisted`/`private` entries are still MIRRORED (a chart OCI
    # artifact is tiny next to the image wave that dominates prewarm's runtime,
    # and mirroring them covers the listed set's depends[]/companion closure for
    # free) but best-effort: a stale pin on a Blueprint no customer can install
    # from the grid must not hold the whole cutover hostage.
    hardVisibility: listed
    guard:
      # After the mirror, assert every contractual entry resolves DURABLY in
      # local Harbor (Harbor CORE's artifact API — its database, never a
      # pull-through), for exactly the coordinate the install path requests.
      # This is the probe that found #5443 and it would have failed that
      # cutover. Disabling knowingly ships a Sovereign whose marketplace
      # over-advertises what it can install.
      enabled: true
    # The Blueprint CR resource the enumeration reads, with the v1alpha1
    # fallback the CRD still serves (products/catalyst/chart/crds/blueprint.yaml
    # serves v1 as storage + v1alpha1 for the existing corpus).
    blueprintResource: "blueprints.v1.catalyst.openova.io"
    blueprintResourceFallback: "blueprints.v1alpha1.catalyst.openova.io"
  # #5442 (Refs #5443 #5237 #5437) — warm images from the PINNED CHART
  # VERSIONS, not only from what the cluster happens to be running.
  #
  # harbor-prewarm sources its two inputs from two places that agree only while
  # the cluster has ALREADY converged to what the mirror declares: chart
  # versions come from the mirror's pins (Phase A2 / A2-pins), image tags come
  # from the live cluster (running Pods union declared templates). A completely
  # FRESH mirror pinning a chart whose images the cluster has not yet rolled to
  # reproduces the outage with no staleness involved — step-05 pivots Flux onto
  # charts pinning images the prewarm never warmed, and the local registry
  # correctly answers NotFound. Live hw290 2026-07-27: catalyst-api,
  # catalyst-ui and catalyst-organization-controller all ImagePullBackOff on
  # local tags that did not exist, and the Sovereign could not self-heal
  # because catalyst-api is what drives the cutover; recovery meant hand-pinning
  # all three back to ghcr, i.e. re-tethering.
  #
  # The prewarm's job is to make the POST-pivot world pullable, so its input
  # must be the post-pivot DECLARATION. This UNIONS the chart-derived set into
  # the runtime-derived one; it does not replace it. Replacing would be strictly
  # worse — a default-values render cannot see an image behind a conditional a
  # per-Sovereign overlay turns on, which the runtime walk does see. Union can
  # only widen coverage, never narrow it.
  chartImages:
    # Render every chart in the CONTRACTUAL mirror set — the live-HR
    # deployed-union-desired set, the frozen bootstrap-kit pins, and the
    # contractual catalog entries — and warm every image the render pins.
    # Charts are pulled back out of the local Harbor they were just mirrored
    # into, so this costs no extra upstream egress and proves the chart mirror
    # in passing. `helm template` is faithful rather than heuristic because
    # .github/workflows/blueprint-release.yaml refuses to publish a bp-* chart
    # that does not render at default values.
    enabled: true
    # FATAL on a chart-derived image that cannot be mirrored or cannot be
    # proven durably present afterwards. Default TRUE, matching the posture
    # Phase A already takes for the runtime-derived set: an un-mappable
    # registry host or a failed copy is a GUARANTEED post-severance
    # ImagePullBackOff, and failing here — with egress still open and the
    # offender named — is recoverable, whereas discovering it after the pivot
    # can strand the control plane that drives the cutover. A chart that fails
    # to RENDER is always a WARN and never fatal: it makes no claim about
    # images either way.
    fatal: true
  # #5468 (Refs #5442 #4975) — the per-image SINGLE-PLATFORM copy exception.
  #
  # Every step-03 copy uses `--multi-arch all` (#4975) unless the source ref
  # matches one of `imageSubstrings`, in which case it is copied as ONE
  # platform (`--multi-arch system` + the os/arch below). Keep this list as
  # short as the evidence demands — it exists for upstream manifest lists that
  # are MALFORMED in a way no retry can fix, NOT as a general escape hatch, and
  # narrowing `--multi-arch all` globally is a known-wrong fix (it reproduces
  # hw239's `digest invalid` on every list-digest-addressed image).
  #
  # A ref belongs here only when ALL THREE hold:
  #   1. the upstream index cannot be ingested by Harbor at all (not egress, not
  #      a timeout — a deterministic, permanent rejection);
  #   2. nothing pulls the ref BY its manifest-list digest (a tag-addressed pin
  #      resolves to the single-platform manifest correctly, a digest-addressed
  #      one would not);
  #   3. the Sovereign's nodes are all `os`/`arch` below.
  singlePlatform:
    os: "linux"
    arch: "amd64"
    imageSubstrings:
      # ghcr.io/berriai/litellm-database — the image bp-llm-gateway's upstream
      # litellm-helm subchart pins for BOTH its proxy Deployment
      # (`:main-v1.57.2`, from the chart appVersion) and its Prisma migration
      # Job (`:main-latest`, hardcoded upstream). Its `main-v1.57.2` OCI index
      # lists each of its four children TWICE, byte-identical; Harbor's
      # post-push artifact walk inserts duplicate artifact_reference rows,
      # violates their uniqueness, rolls the transaction back and then answers
      # `not found` for the index digest it just computed. Live hw291
      # 2026-07-28 step-03: `Phase A3-chart-images ok=35 fail=1
      # durable_miss=1`, every child copied 1/8..8/8 and only the manifest-list
      # upload FATALed. bp-llm-gateway is `visibility: listed`, so the A3 guard
      # is right to treat it as contractual — the index is the defect, not the
      # pin. The substring is repository-scoped, not tag-scoped, because
      # `main-latest` is a floating tag rebuilt by the same buildx pipeline.
      - "berriai/litellm-database"
  # #4994 (Refs #3379) — content-digest idempotency for the step-03 skopeo
  # mirror. When true (default) each container-image copy (Phase A) + chart-OCI
  # copy (Phase A2) first compares the SOURCE vs local-Harbor DEST manifest
  # digest (`skopeo inspect --raw | sha256sum`, no blob pull) and SKIPS the copy
  # when the dest already serves byte-identical content. This makes a prewarm
  # re-run (catalyst-api re-fires step-03 after a DeadlineExceeded) or an
  # already-mirrored image cost a cheap manifest HEAD instead of re-transferring
  # every multi-hundred-MB blob from the mothership — the hw240 #4994 symptom
  # (step-03 Running 0/1 for 68m re-pushing ~121 images across the proxy-*
  # projects). Fail-OPEN: any inspect miss (source unreachable, dest absent /
  # partial / single-arch leftover) FALLS THROUGH to the full copy, so the
  # fail-closed completeness contract (every workload image must land locally
  # before the deny-egress hold) is preserved — a skip happens ONLY on a
  # positive src==dst digest match. Set false to force an unconditional re-copy.
  skipIfAlreadyPresent: true
  # #5095 (Refs #5093 #3379) — flap-tolerant pacing for MOTHERSHIP-PROXY-sourced
  # copies. Docker-Hub-sourced bootstrap images route through the mothership
  # Harbor proxy-cache (harbor.openova.io/proxy-dockerhub/...), giving step-03 a
  # hard PRE-cutover tether to mothership reachability from the Sovereign. A
  # routine per-prefix transit flap (hw255 2026-07-15 05:20–05:55Z, #5093:
  # Omantel→Cogent black-hole toward the mothership /24 — the server was healthy
  # worldwide, only the path was dead) FAILed every proxy-sourced copy exit=1
  # while the ghcr.io copies were fine; the shared 3-attempt / fixed-5s budget
  # exhausted INSIDE the 35-min flap → Phase A push_fail=6 → FATAL → a full
  # extra Job re-run (~30-40 min on the keystone clock). Proxy-sourced refs
  # therefore get:
  #   (a) their OWN attempts budget with EXPONENTIAL backoff — base doubling
  #       (30+60+120+240+480 = 930s ≥ 15 min of inter-attempt spacing at the
  #       defaults, comfortably inside the 9600s step deadline #5298) so a short
  #       transit flap is ridden out instead of FATALing the step; and
  #   (b) a DIRECT-SOURCE fallback: on a proxy-source copy failure the SAME
  #       image is retried from its canonical upstream (docker.io/... etc.,
  #       derived MECHANICALLY from the proxy path via the offlineMirror
  #       coverage map's inverse — no second hand-list) BEFORE the attempt
  #       counts as failed. The dest path is untouched (host-swap, path
  #       preserved), so step-04/07/08 resolve the identical local artifact;
  #       upstream rate-limit exposure is bounded (~10-20 images, only while
  #       the proxy path is failing).
  # FATAL-on-any-failure (the sovereignty guarantee) is PRESERVED — these only
  # widen the transient window the step can survive. Non-proxy sources keep the
  # existing 3×5s discipline (PREWARM_COPY_ATTEMPTS) unchanged.
  proxyCopyAttempts: 6
  proxyBackoffBaseSeconds: 30
  # #5095 round 2 (Refs #5093 #5298) — proxy-DOWN direct-first routing. The
  # 0.1.136 direct-source fallback (proxyCopyAttempts + the mechanical upstream
  # derivation above) fires only AFTER the proxy-source `skopeo copy` returns
  # non-zero, and that proxy copy is bounded ONLY by the #3944 --command-timeout
  # (skopeoCommandTimeout, 1200s). When the mothership Harbor proxy is
  # unreachable for the WHOLE step — a sustained transit hole toward the
  # mothership /24, not a brief flap — EVERY proxy-sourced image independently
  # burns that timeout probing the dead proxy BEFORE the fast direct upstream is
  # tried. That per-image "proxy timeout tax" dragged the direct-fallback wave to
  # ~100 min for 140 images and tripped the step deadline (raised separately in
  # #5298/#5299). This block adds a ONE-TIME, cheap HTTP reachability probe of
  # the mothership proxy at the top of the copy wave (only when the wave actually
  # has proxy-sourced refs); on an unreachable proxy the step latches proxy-DOWN
  # and copy_one tries the DIRECT upstream FIRST for proxy-sourced refs (proxy
  # kept as the secondary), so the wave runs at full parallel speed with no
  # timeout tax. The latch also trips adaptively the moment a proxy leg fails
  # while its direct sibling succeeds (the "proxy bad, direct good" hw255
  # signature), catching a proxy that dies mid-wave after the probe passed.
  # Source selection ONLY — the DEST path (host-swap, path preserved) is
  # untouched, so step-04/07/08 resolve the identical LOCAL artifact and the
  # sovereignty guarantee (every image in local Harbor before the deny-egress
  # hold) is intact; FATAL-on-any-failure is preserved (both sources must fail
  # for an image to be .fail). The probe is NEVER fatal — a down proxy must not
  # fail the step, the direct path covers it. Default true; set enabled=false to
  # keep strict proxy-first ordering.
  proxyDownDirectFirst:
    enabled: true
    # Per-probe curl timeout (seconds) and probe attempt count. Worst case
    # probeAttempts × probeTimeoutSeconds (default 3 × 8s = 24s) — negligible
    # against a multi-image wave, and only paid when proxy-sourced refs exist.
    probeTimeoutSeconds: 8
    probeAttempts: 3
  # #5204 (Refs #5209 #3379) — Phase A4: warm every Crossplane provider
  # package (providers.pkg.crossplane.io spec.package — the SAME set step-11
  # pivots, read from the crossplaneProviderPivot values so the two can never
  # drift) through the local Harbor `proxy-xpkg` project so the xpkg OCI
  # artifact is DURABLY cached locally BEFORE step-11 rewrites spec.package
  # onto it. `proxy-xpkg` is the ONE local project that stays a Harbor
  # PROXY-CACHE (Harbor REJECTS pushes into a proxy-cache project, so the
  # Phase A skopeo-push route cannot serve it, and xpkg.upbound.io is
  # deliberately in offlineMirror.excludedHosts — the Crossplane package
  # manager bypasses containerd, making the generic mirror legs inert for
  # it). The warm is ONE FULL authenticated pull THROUGH the local endpoint
  # per package (skopeo → dir: scratch, --multi-arch all), which makes Harbor
  # fetch + durably cache the manifest (list) and every blob; a bounded
  # Harbor-artifact-API poll (#5030 durable-probe discipline) then asserts
  # presence, FATAL naming the offender otherwise. Without this the cache is
  # COLD at pivot time and every post-severance package re-pull / provider
  # upgrade needs the proxy leg to reach xpkg.upbound.io — an upstream tether
  # Principle #11 forbids (live hw270 dep b2f0a9b0585f6781: provider-opentofu
  # could not resolve its package from the local registry). Set false only on
  # a Sovereign that intentionally keeps the xpkg upstream leg open.
  xpkgPackages:
    enabled: true
    # #5232 (Refs #5226 #5204) — the release-namespace ConfigMap where Phase
    # A4 records each warmed package's tag->digest resolution. Harbor
    # proxy-cache NEVER records TAGS for pulled-through xpkg artifacts
    # (manual tag-create 401s on proxy projects; a tag manifest GET serves
    # the index but does not record the tag either — live hw274 dep
    # d51a69f885872a81), so step-11 pivots Provider.spec.package BY DIGEST
    # using this map; a tag-form pivot ref would 404 post-severance. The
    # SAME value is read by BOTH step templates (no drift).
    digestMapConfigMapName: "self-sovereign-cutover-xpkg-digests"
  # #4975 (Refs #3379 #3695) — RETIRED. This hand-maintained 11-image HEAD list
  # (the old Phase B "warm the proxy-cache" pass) was one of the three drifting
  # lists that caused the per-prov whack-a-mole: any upstream image a chart added
  # but this list omitted was never warmed, so under the deny-egress hold its
  # roll ImagePullBackOff'd. Coverage now comes from step-03 Phase A3's LIVE
  # enumeration (every running Pod ∪ declared workload template image), pushed
  # into the offlineMirror push projects — nothing to keep in sync. Left as an
  # empty list (Phase B is a no-op) for back-compat with overlays that still set
  # it; an operator MAY still HEAD-warm a proxy-cache project via overlay.
  images: []

# GitOps source — Flux GitRepository in flux-system namespace that step
# 05 (flux-gitrepository-patch) patches to point at local Gitea.
gitopsRepository:
  name: "openova"
  namespace: "flux-system"

