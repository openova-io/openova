    - "bp-keycloak"
    - "bp-gitea"
    - "bp-powerdns"
    - "bp-external-dns"
    - "bp-catalyst-platform"
    - "bp-crossplane-claims"
    - "bp-external-secrets"
    - "bp-external-secrets-stores"
    - "bp-cnpg"
    - "bp-valkey"
