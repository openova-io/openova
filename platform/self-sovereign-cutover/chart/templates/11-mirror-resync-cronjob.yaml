{{- /*
Post-cutover continuous mirror re-sync (TBD-A37, issue #1899).

Why this exists
───────────────
Step 01 (gitea-mirror) runs EXACTLY ONCE at cutover time. It does a
bare-clone of the upstream openova-io/openova GitHub repo and a single
force-push to local Gitea. The local repo is then a STANDALONE,
non-mirror repo (PR #1029 — pull-mirror semantics block Step-06's
HelmRepository URL rewrite push, so the cutover migrated off Gitea's
built-in pull-mirror feature).

But standalone means: after cutover, the local repo never re-fetches
upstream. Any chart bump or controller-image bump that lands on
upstream main AFTER cutover never reaches the Sovereign. Live failure
on t31 2026-05-19 (A145 verifier): sandbox-controller still at image
:8017700 from 2026-05-16 even though PR #1862 had merged 2 days
earlier — the upstream values.yaml bump never crossed the mirror seam.

This CronJob closes that loop by re-running the same idempotent bare-
clone + force-push every 5 minutes. The script is INTENTIONALLY
identical to 01-gitea-mirror-job.yaml in semantics (defensive HTTP
probe → API auth → git clone --bare → git push --mirror --force) so
operators can reason about both as one mechanism.

Design notes
────────────
- Interval defaults to 5 minutes ("*\/5 * * * *"). Short enough that
  chart-bump → upstream-merge → Sovereign-reconcile stays under ~10
  minutes end-to-end (5 min for this CronJob to fire + ~5 min for the
  bp-* HelmRepository's `interval: 15m` Flux refresh — see notes in
  10-gitea.yaml). Long enough that GitHub anonymous-clone rate limits
  aren't a concern even with hundreds of Sovereigns (300 req/hr per
  IP for anonymous clone; one Sovereign clones once per 5 min = 12
  clones/hr).

- IDEMPOTENT-FIRST. The CronJob is created at chart-install time
  (before Step-01 runs). On every fire pre-cutover, the script
  detects the local repo is missing or empty and exits 0 (no-op).
  This avoids fighting with the in-flight Step-01.

- Force-push is SAFE in this architecture: the local Gitea
  openova/openova repo is the SAME content as upstream openova-io/
  openova by construction (Step 06 patches HelmRepository URLs but
  not the repo contents). Any local divergence is a bug we WANT to
  overwrite.

- Suspend knob (`.Values.mirrorResync.suspended`) ships at default
  `false` for canonical fresh-prov behaviour; an operator running a
  sandboxed soak Sovereign that intentionally stays N days behind
  upstream can suspend this CronJob via per-Sovereign overlay.

- G75 #2622 (2026-05-31): MASTER SEVERANCE GATE
  (`.Values.mirrorResync.enabled`) ships at default `true`. Cutover
  Step 01 flips it to `false` via HR patch on bp-self-sovereign-
  cutover, then DELETEs the live CronJob. The combination of (a)
  IaC flag false + (b) live delete means Flux won't recreate the
  resource on the next reconcile. This is the architectural
  severance of the GIT-source upstream tether per ADR-0002
  §Pillar 5 (one of the 8 tethers cutover is contractually
  required to sever). Previously cutover Step 06 (HelmRepository
  URL pivot) + Step 07 (Phase 2.5 sed) pushed changes that
  SURVIVED ~5min and then got CLOBBERED by this CronJob's next
  `git push --mirror --force` — verified live hw86
  afc8800bc03751c6 2026-05-31. Suspend is NOT equivalent
  (Principle 14): a suspended cronjob is a future drift trap;
  severance must be irreversible at the IaC layer.

- Image: same `images.git` as Step-01 (alpine/git). MUST use the
  cutoverPhase: "pre" image because pre-cutover the local Harbor
  proxy-cache isn't routable yet and the CronJob is created
  alongside Step-01.

- TTL on completed Pods: 1 hour. Operators get a small audit window
  to read logs but completed Pods don't pile up.

- SA: re-uses the cutover runner SA (`bp-self-sovereign-cutover-
  runner`). Doesn't require any new RBAC — the CronJob only talks to
  GitHub (anonymous) + local Gitea HTTP (BasicAuth from mounted
  Secret). It needs ZERO Kubernetes API verbs at runtime.

Acceptance contract (issue #1899)
─────────────────────────────────
On a fresh prov post-cutover:
  - kubectl get cronjob -n catalyst gitea-mirror-resync → Active
  - Wait 5 min, kubectl get jobs -n catalyst -l app.kubernetes.io/
    component=mirror-resync → at least one Job with Succeeded=True
  - kubectl logs <pod> → "pushed all refs successfully"
  - Re-push a values.yaml bump to upstream openova-io/openova:main,
    wait 10 min, observe sandbox-controller Deployment image SHA
    matches the new upstream tag.

Image phase: pre — uses upstream-public image like Step-01.
*/ -}}
{{- if .Values.mirrorResync.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-mirror-resync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-self-sovereign-cutover.labels" . | nindent 4 }}
    app.kubernetes.io/component: mirror-resync
    catalyst.openova.io/purpose: "post-cutover-gitea-resync"
spec:
  schedule: {{ .Values.mirrorResync.schedule | quote }}
  suspend: {{ .Values.mirrorResync.suspended }}
  {{- /*
   Concurrency = Forbid: a long-running clone (slow GitHub day) must
   NOT pile up parallel pushes against local Gitea. Skip-if-busy.
  */}}
  concurrencyPolicy: Forbid
  {{- /* Keep a small audit trail: 3 completed + 1 failed. */}}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  {{- /*
   If a Sovereign was suspended for hours and the kube-controller-
   manager comes back up, do NOT replay every missed slot — fire at
   most one. The next scheduled fire will pick up any drift.
  */}}
  startingDeadlineSeconds: 60
  jobTemplate:
    metadata:
      labels:
        {{- include "bp-self-sovereign-cutover.labels" . | nindent 8 }}
        app.kubernetes.io/component: mirror-resync
    spec:
      {{- /* TTL after finished — 1 hour audit window then GC. */}}
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.mirrorResync.jobTimeoutSeconds }}
      template:
        metadata:
          labels:
            {{- include "bp-self-sovereign-cutover.labels" . | nindent 12 }}
            app.kubernetes.io/component: mirror-resync
        spec:
          serviceAccountName: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
          restartPolicy: Never
          {{- /*
           #5214 — re-assert gitea-admin-secret in the release namespace before
           each resync fire (durable close of the #4557/#4558/#4661 recurrence
           class; the secretKeyRef below resolves only in this Pod's namespace).
           See _helpers.tpl.
          */}}
          initContainers:
            {{- include "bp-self-sovereign-cutover.giteaSecretSelfHealInitContainer" (dict "ctx" . "phase" "pre") | nindent 12 }}
          containers:
            - name: gitea-mirror-resync
              {{- /*
               #6490 — when the secondary-mirror leg is on it runs `kubectl`, so
               the container needs alpine/k8s (kubectl + git + curl), not
               alpine/git. When off, the image is unchanged (byte-identical).
              */}}
              image: {{ if .Values.secondaryRegions.mirrorToSecondaryGitea }}{{ include "bp-self-sovereign-cutover.image" (dict "repository" .Values.images.kubectl.repository "tag" .Values.images.kubectl.tag "cutoverPhase" "pre" "Values" .Values) }}{{ else }}{{ include "bp-self-sovereign-cutover.image" (dict "repository" .Values.images.git.repository "tag" .Values.images.git.tag "cutoverPhase" "pre" "Values" .Values) }}{{ end }}
              imagePullPolicy: IfNotPresent
              env:
                - name: UPSTREAM_REPO_URL
                  value: {{ .Values.upstream.repoURL | quote }}
                - name: UPSTREAM_BRANCH
                  value: {{ .Values.upstream.branch | quote }}
                - name: GITEA_INTERNAL_URL
                  value: {{ .Values.sovereign.giteaInternalURL | quote }}
                - name: GITEA_ORG
                  value: {{ .Values.gitea.org | quote }}
                - name: GITEA_REPO
                  value: {{ .Values.gitea.repo | quote }}
                - name: GITEA_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.gitea.adminSecretRef.name }}
                      key: {{ .Values.gitea.adminSecretRef.usernameKey }}
                - name: GITEA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.gitea.adminSecretRef.name }}
                      key: {{ .Values.gitea.adminSecretRef.passwordKey }}
                {{- if .Values.secondaryRegions.mirrorToSecondaryGitea }}
                {{- /* #6490 — inputs for the secondary-region resync leg (same
                   shape as step-01's leg). */}}
                - name: SECONDARY_GITEA_NAMESPACE
                  value: {{ .Values.secondaryRegions.secondaryGiteaNamespace | quote }}
                - name: MIRROR_JOB_WAIT_SECONDS
                  value: {{ .Values.secondaryRegions.mirrorJobWaitSeconds | quote }}
                - name: MIRROR_JOB_POLL_SECONDS
                  value: {{ .Values.secondaryRegions.mirrorJobPollSeconds | quote }}
                {{- /* #6754 — PAT source for the secondary distribution: the shared
                   secondary-mirror Job now authenticates with the region-A
                   catalyst-gitea-token PAT (valid in the shared gitea DB) instead of
                   the region-local admin password that cannot match the shared
                   gitea_admin row. */}}
                - name: PAT_SOURCE_NAMESPACE
                  value: {{ .Values.gitRepositorySecretRef.patSourceNamespace | quote }}
                - name: PAT_SOURCE_SECRET_NAME
                  value: {{ .Values.gitRepositorySecretRef.patSourceSecretName | quote }}
                - name: PAT_SOURCE_KEY
                  value: {{ .Values.gitRepositorySecretRef.patSourceKey | quote }}
                {{- end }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  {{- /*
                   Credential hygiene mirrors 01-gitea-mirror-job.yaml:
                   never echo $GITEA_PASSWORD on stdout. The BasicAuth
                   header is base64-encoded into a single env-local
                   variable; git push/ls-remote authenticate with that same
                   `http.extraHeader` — NOT URL embedding, which breaks when
                   the admin password holds a URL-special char (#6490).
                  */}}
                  redacted_url="${GITEA_INTERNAL_URL}/${GITEA_ORG}/${GITEA_REPO}.git"
                  echo "[mirror-resync] upstream=${UPSTREAM_REPO_URL} branch=${UPSTREAM_BRANCH}"
                  echo "[mirror-resync] target=${redacted_url}"

                  {{- /*
                   Idempotent pre-flight: the CronJob is created at
                   chart-install time, BEFORE Step-01 (gitea-mirror)
                   has run. If the local repo doesn't exist yet, exit
                   0 (no-op) so we don't conflict with the in-flight
                   cutover. The very next fire after Step-01 finishes
                   will pick up the work.
                  */}}
                  gitea_host="$(printf '%s' "${GITEA_INTERNAL_URL}" | sed -E 's|^https?://||' | cut -d: -f1 | cut -d/ -f1)"
                  if [ -n "${gitea_host}" ]; then
                    if ! nslookup "${gitea_host}" >/dev/null 2>&1; then
                      echo "[mirror-resync] ${gitea_host} not in DNS yet — Gitea not installed; skipping (no-op until cutover)"
                      exit 0
                    fi
                  fi

                  basic_auth=$(printf '%s' "${GITEA_USERNAME}:${GITEA_PASSWORD}" | base64 -w0 2>/dev/null || printf '%s' "${GITEA_USERNAME}:${GITEA_PASSWORD}" | base64 | tr -d '\n')
                  api_url="${GITEA_INTERNAL_URL}/api/v1"

                  {{- /*
                   Confirm the local repo exists. If it doesn't, Step-
                   01 hasn't run yet (or the operator hasn't triggered
                   cutover) — exit 0 (no-op).
                  */}}
                  repo_check=$(wget -q -O - \
                    --header="Authorization: Basic ${basic_auth}" \
                    --header="Content-Type: application/json" \
                    "${api_url}/repos/${GITEA_ORG}/${GITEA_REPO}" 2>/dev/null || echo "missing")
                  if [ "${repo_check}" = "missing" ] || ! printf '%s' "${repo_check}" | grep -q '"full_name"'; then
                    echo "[mirror-resync] local repo ${GITEA_ORG}/${GITEA_REPO} not present — Step-01 hasn't completed; skipping"
                    exit 0
                  fi

                  {{- /*
                   Bare-clone upstream and push --mirror --force to the
                   local Gitea. Same semantics as Step-01 step (3),
                   without the create-org + create-repo phases.
                  */}}
                  export HOME=/tmp
                  git config --global user.name "gitea-mirror-resync"
                  git config --global user.email "mirror-resync@${gitea_host}"
                  git config --global advice.detachedHead false

                  push_url="${GITEA_INTERNAL_URL}/${GITEA_ORG}/${GITEA_REPO}.git"
                  workdir=$(mktemp -d)
                  cd "${workdir}"
                  echo "[mirror-resync] cloning ${UPSTREAM_REPO_URL} (bare)"
                  if ! git clone --bare "${UPSTREAM_REPO_URL}" upstream.git >/dev/null 2>&1; then
                    echo "[mirror-resync] upstream clone failed — likely network blip or GitHub rate-limit; will retry next fire" >&2
                    exit 0
                  fi
                  cd upstream.git
                  echo "[mirror-resync] pushing all refs to ${redacted_url}"
                  push_err=$(git -c http.extraHeader="Authorization: Basic ${basic_auth}" push --mirror --force "${push_url}" 2>&1) || {
                    echo "[mirror-resync] git push to local Gitea failed" >&2
                    printf '%s\n' "${push_err}" | sed -E "s,${GITEA_PASSWORD}+,REDACTED,g" >&2
                    exit 1
                  }
                  echo "[mirror-resync] pushed all refs successfully"
                  {{- if .Values.secondaryRegions.mirrorToSecondaryGitea }}
                  {{- /*
                   ── #6490: keep EACH secondary region's OWN in-cluster Gitea in
                   sync too ── same in-region Job mechanism as step-01's leg (a
                   secondary's headless gitea-http is unreachable cross-region).
                   /secondary-kubeconfigs is optional; empty => no-op.
                  */}}
                  echo "[mirror-resync] #6490 secondary-region resync leg"
                  {{- /*
                   #6754 — read the region-A catalyst-gitea-token PAT once, to
                   (re)distribute into each secondary's gitea ns below. It is a row
                   in the SHARED gitea access_token table (region-B -> shared-pg-mesh-rw
                   -> region-A's shared-pg primary), so it authenticates from either
                   region — unlike the per-region admin password, which can never
                   match the single shared gitea_admin row.
                  */}}
                  SEC_GITEA_PAT=$(kubectl -n "${PAT_SOURCE_NAMESPACE}" get secret "${PAT_SOURCE_SECRET_NAME}" -o "jsonpath={.data.${PAT_SOURCE_KEY}}" 2>/dev/null | base64 -d 2>/dev/null || true)
                  sec_any="false"
                  for skc in /secondary-kubeconfigs/*.yaml; do
                    [ -e "${skc}" ] || continue
                    sec_any="true"
                    region=$(basename "${skc}" .yaml)
                    jobname=$(printf 'cutover-gitea-mirror-secondary-%s' "${region}" | cut -c1-63)
                    echo "[mirror-resync] #6490 secondary region ${region}: stamping in-region resync Job ${jobname} (ns ${SECONDARY_GITEA_NAMESPACE})"
                    kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" create configmap cutover-secondary-mirror-script \
                      --from-file=secondary-mirror.sh=/secondary-mirror/secondary-mirror.sh \
                      --dry-run=client -o yaml | kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" apply -f -
                    {{- /* #6754 — (re)distribute the shared-DB PAT into this secondary's gitea ns
                       (--from-file, never argv). */}}
                    if [ -n "${SEC_GITEA_PAT}" ]; then
                      umask 077
                      printf '%s' "${SEC_GITEA_PAT}" > /tmp/sec-pat-token
                      kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" create secret generic {{ .Values.secondaryRegions.giteaPatSecretName }} \
                        --from-file=token=/tmp/sec-pat-token \
                        --dry-run=client -o yaml | kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" apply -f -
                      rm -f /tmp/sec-pat-token
                    else
                      echo "[mirror-resync] #6754 WARN: catalyst-gitea-token PAT unreadable in ${PAT_SOURCE_NAMESPACE}/${PAT_SOURCE_SECRET_NAME}; reusing any PAT step-01 already distributed to region ${region}" >&2
                    fi
                    kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" delete job "${jobname}" --ignore-not-found=true >/dev/null 2>&1 || true
                    sed "s/__REGION__/${region}/g" /secondary-mirror/secondary-mirror-job.yaml >/tmp/secjob.yaml
                    kubectl --kubeconfig "${skc}" apply -f /tmp/secjob.yaml
                    sec_deadline=$(( $(date +%s) + ${MIRROR_JOB_WAIT_SECONDS} ))
                    sec_done=""
                    while [ "$(date +%s)" -lt "${sec_deadline}" ]; do
                      sec_ok=$(kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" get job "${jobname}" -o jsonpath='{.status.succeeded}' 2>/dev/null || echo "")
                      sec_fail=$(kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" get job "${jobname}" -o jsonpath='{.status.failed}' 2>/dev/null || echo "")
                      if [ "${sec_ok}" = "1" ]; then sec_done="ok"; break; fi
                      if [ -n "${sec_fail}" ] && [ "${sec_fail}" -ge 3 ] 2>/dev/null; then sec_done="fail"; break; fi
                      sleep "${MIRROR_JOB_POLL_SECONDS}"
                    done
                    if [ "${sec_done}" != "ok" ]; then
                      echo "[mirror-resync] #6490 WARN secondary region ${region}: resync Job ${jobname} did not succeed within ${MIRROR_JOB_WAIT_SECONDS}s — this region's Gitea may be behind upstream; next fire retries" >&2
                      kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" logs "job/${jobname}" --tail=40 2>/dev/null || true
                    else
                      echo "[mirror-resync] #6490 secondary region ${region}: resync Job ${jobname} succeeded"
                    fi
                  done
                  if [ "${sec_any}" != "true" ]; then
                    echo "[mirror-resync] #6490: no secondary-region kubeconfigs mounted — single-region, secondary resync is a no-op"
                  fi
                  {{- end }}
                  echo "[mirror-resync] done"
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { memory: 512Mi }
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              {{- if .Values.secondaryRegions.mirrorToSecondaryGitea }}
              volumeMounts:
                - name: secondary-kubeconfigs
                  mountPath: /secondary-kubeconfigs
                  readOnly: true
                - name: secondary-mirror
                  mountPath: /secondary-mirror
                  readOnly: true
              {{- end }}
          {{- if .Values.secondaryRegions.mirrorToSecondaryGitea }}
          {{- /*
           #6490 — optional secondary-region kubeconfigs (catalyst-api
           materialises cutover-secondary-kubeconfigs; empty on single-region so
           the leg no-ops) + the shared mirror script this leg distributes into
           each secondary. Rendered ONLY when the flag is set so single-region
           provs (and the default mirrorResync=disabled path) stay byte-identical.
          */}}
          volumes:
            - name: secondary-kubeconfigs
              secret:
                secretName: {{ .Values.secondaryRegions.kubeconfigSecretName }}
                optional: true
            - name: secondary-mirror
              configMap:
                name: cutover-secondary-mirror-script
                defaultMode: 0755
          {{- end }}
{{- end }}
