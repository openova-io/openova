{{- /*
Step 10 — vcluster-registry-pivot (TBD-V24 MISS-1, issue #2034).

Pivots the THREE bp-*-vcluster HelmReleases' `image.repository` values
from the chart-default `harbor.openova.io/proxy-ghcr/loft-sh/vcluster`
to the Sovereign-local `harbor.<SOVEREIGN_FQDN>/proxy-ghcr/loft-sh/
vcluster`. Without this step the MGMT/RTZ/DMZ vCluster control-plane
Pods keep pulling from mothership Harbor indefinitely — blocking
Pillar 5 (Sovereign independence). The chart's own comment at
`platform/bp-mgmt-vcluster/chart/values.yaml:77-79` already promises
"post-handover, the per-Sovereign overlay rewrites to
`harbor.<sovereign-fqdn>/proxy-ghcr/...`" but until this step shipped
no such rewrite existed anywhere in the cutover sequence.

Why step 04 (containerd registries.yaml pivot) does NOT catch it
─────────────────────────────────────────────────────────────────
`registries.yaml.v2` (written by Step 04's DaemonSet) only registers
mirrors for the 7 canonical UPSTREAMS (ghcr.io, docker.io,
registry.k8s.io, gcr.io, quay.io, xpkg.upbound.io, public.ecr.aws). The
host `harbor.openova.io` is treated as a literal endpoint, NOT an
upstream — Step 04 does NOT add a mirror for it. So a Pod whose
imageRef starts with `harbor.openova.io/...` ALWAYS hits the literal
mothership Harbor regardless of containerd mirror config.

Why not just `helm template` the bp-*-vcluster charts with an overlay
─────────────────────────────────────────────────────────────────────
The bp-*-vcluster charts default to mothership-friendly values so
non-Sovereign installs (the openova-io mothership itself, dev clusters)
work without threading a Sovereign FQDN through values. Coupling the
chart to a per-Sovereign FQDN at template time would pollute every
non-Sovereign deployment. The cutover-step pattern keeps chart
defaults untouched and only rewrites POST-handover, when the
per-Sovereign FQDN is well-defined.

Patches applied (TWO knobs per HelmRelease)
───────────────────────────────────────────
The bp-mgmt-vcluster / bp-rtz-vcluster / bp-dmz-vcluster charts expose
the vCluster image at TWO levels:

  1. `<role>Vcluster.image.repository` — the umbrella chart's image
     reference (see `platform/bp-mgmt-vcluster/chart/values.yaml:81`,
     bp-rtz-vcluster/...values.yaml:33, bp-dmz-vcluster/...:43)
  2. `vcluster.controlPlane.statefulSet.image.{registry,repository}`
     — the loft-sh upstream subchart's image reference (see
     platform/bp-mgmt-vcluster/chart/values.yaml:129-130 et al.)

This Job patches BOTH on each of the 3 HelmReleases. Idempotent: a
re-run reads the current value and skips when already pivoted.

bp-sso-bridge image host pivot (#2951 / #2940 ATTACK#9)
──────────────────────────────────────────────────────
UAT Wave-2 ATTACK#9 (#2940) found that a Sovereign which completes
cutover STILL pulls the bp-sso-bridge reconciler Pod image from
mothership Harbor: `platform/sso-bridge/chart/values.yaml` defaults
`image.repository: harbor.openova.io/proxy-dockerhub/alpine/k8s` and the
`13b-bp-sso-bridge.yaml` bootstrap-kit overlay carries NO
`spec.values.image.repository` override, so the chart default wins on
every reconcile. That is the same class of residual `harbor.openova.io`
tether this step already severs for the three vClusters, so #2951 folds
the sso-bridge image-host pivot into THIS step rather than bolting a
values-injection onto Step 06 (whose script only rewrites HelmRepository
OCI URLs, not arbitrary chart values). Phase 1b live-patches
`bp-sso-bridge` HR `spec.values.image.repository` host from
`harbor.openova.io` → `harbor.<SOVEREIGN_FQDN>` (preserving the
`/proxy-dockerhub/alpine/k8s` path), and Phase 2 injects the same
override into `13b-bp-sso-bridge.yaml` so the bootstrap-kit reconcile
doesn't revert it. Idempotent: skip-if-already-pivoted on the live patch,
sentinel-comment guard on the Gitea injection.

NOTE on the other #2951 candidates: the powerdns overlay
(`11-powerdns.yaml`) already sets `api.host: pdns.${SOVEREIGN_FQDN}`
(cloud-init envsubst), and the cert-manager-powerdns-webhook
`powerdns.host` deliberately targets contabo's central out-of-cluster
PowerDNS (`pdns.openova.io`) for ACME DNS-01 — an intentional external
dependency, NOT a mothership tether to sever (rewriting it would break
wildcard-cert issuance). Both are therefore intentionally left untouched;
the acceptance grep on #2951 excludes intentional bootstrap/external
paths.

Phase inventory
───────────────
  Phase 1  Live K8s patch — `kubectl patch helmrelease` against each
           of {bp-mgmt-vcluster, bp-rtz-vcluster, bp-dmz-vcluster} in
           flux-system, setting both image knobs to the Sovereign-local
           Harbor host. Triggers an immediate Flux reconcile annotation
           so helm-controller re-renders within seconds rather than
           waiting for the 15m HR interval.
  Phase 2  Push YAML edit to local Gitea (same pattern as Step 06
           Phase 2): clone the bootstrap-kit repo, inject `image:`
           overrides into clusters/_template/bootstrap-kit/{54,58,59}-
           bp-*-vcluster.yaml under spec.values, commit + push. Without
           this phase the bootstrap-kit Kustomization reconcile (every
           ~1 min from local Gitea) would silently revert the Phase 1
           live patch back to the chart default within minutes.

Pod restart-safety / image-pull semantics
──────────────────────────────────────────
The actively-running vCluster Pods do NOT churn on a `helm upgrade` of
the wrapper chart unless the StatefulSet PodSpec changes. Changing
ONLY `image.repository` to a different host of the SAME image tag
DOES trigger a rolling update because the StatefulSet's
`spec.template.spec.containers[].image` field changes. Local Harbor's
proxy-ghcr project (created by Step 02) will serve the same upstream
image bytes via Harbor's proxy-cache semantics, so the new image-pull
either hits Harbor's existing cache (Step 03 prewarm covered this) or
falls through to ghcr.io once and then caches locally.

Order rationale: 10 (after Step 09)
────────────────────────────────────
Placed at order 10 so it runs LAST in the cutover sequence. This
follows the precedent set by Step 09 (gitea-token-mint, chart 0.1.30):
"avoid renumbering 01..09 which would invalidate operator history".
Functionally the step is order-independent for everything except:
  - MUST run AFTER Step 02 (harbor-projects) so the local Harbor
    proxy-ghcr project exists for the new image pulls.
  - MUST run AFTER Step 06 (helmrepository-patches Phase-0) so the
    ghcr-pull Secret carries auth for harbor.<sov-fqdn> — that auth is
    what the vCluster Pods need to pull from the local Harbor mirror.

Image phase: post.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cutover-step-10-vcluster-registry-pivot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-self-sovereign-cutover.labels" . | nindent 4 }}
    app.kubernetes.io/component: cutover-step
    bp.openova.io/cutover-order: "9"
    bp.openova.io/cutover-mode: "job"
data:
  stepName: vcluster-registry-pivot
  podSpec: |
    serviceAccountName: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
    restartPolicy: Never
    activeDeadlineSeconds: {{ .Values.stepTimeouts.vclusterRegistryPivotSeconds }}
    {{- /*
     #5262 — the #5214 gitea-admin-secret self-heal initContainer is GONE
     from this step: the Phase-2 git clone/push now authenticates with the
     step-09 minted `catalyst-gitea-token` PAT (read at runtime below), so
     this step no longer consumes gitea-admin-secret at all and must not
     keep a wedge-path on its presence (contract Case 63 asserts absence).
    */}}
    containers:
      - name: vcluster-registry-pivot
        {{- /*
         alpine/k8s ships both kubectl AND git so we can patch live
         HelmReleases AND push the YAML edit to local Gitea (same image
         Step 06 uses for the same reason).
         Fix #163 (2026-05-11, MIRROR-EVERYTHING): explicit
         harbor.openova.io/proxy-dockerhub prefix per CLAUDE.md
         inviolable rule — pre-cutover containerd already routes this
         via the proxy, so the Job can pull its own image during the
         cutover sequence.
        */}}
        image: harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4
        imagePullPolicy: IfNotPresent
        env:
          - name: HELMRELEASE_NAMESPACE
            value: {{ .Values.vclusterRegistryPivot.helmReleaseNamespace | quote }}
          - name: SOVEREIGN_FQDN
            value: {{ .Values.sovereign.fqdn | quote }}
          - name: GITEA_INTERNAL_URL
            value: {{ .Values.sovereign.giteaInternalURL | quote }}
          {{- /*
           #5262 (live hw277) — the Phase-2 git clone/push authenticates
           with the step-09 minted `catalyst-gitea-token` PAT, NOT the
           gitea admin password. On hw277 a mid-cutover bp-gitea re-render
           rotated gitea-admin-secret while Gitea's DB kept the
           install-time password → the clone here 401'd (git exit 128,
           ~1s) and the step wedged. A Gitea PAT is accepted as the HTTP
           git password under any existing username (step-01 #3584 + step-05
           #3536 precedent), is fresh-per-cutover by construction (step-09
           runs at order 9, directly before this step), and is a direct
           local sha1 lookup — immune to admin-password drift AND to the
           external openova-sso apiAuth hang. Username stays the admin
           login for commit auditability (gitRepositorySecretRef.username).
          */}}
          - name: GITEA_USERNAME
            value: {{ .Values.gitRepositorySecretRef.username | quote }}
          - name: PAT_SOURCE_NAMESPACE
            value: {{ .Values.gitRepositorySecretRef.patSourceNamespace | quote }}
          - name: PAT_SOURCE_SECRET_NAME
            value: {{ .Values.gitRepositorySecretRef.patSourceSecretName | quote }}
          - name: PAT_SOURCE_KEY
            value: {{ .Values.gitRepositorySecretRef.patSourceKey | quote }}
          - name: GITEA_ORG
            value: {{ .Values.gitea.org | quote }}
          - name: GITEA_REPO
            value: {{ .Values.gitea.repo | quote }}
          - name: IMAGE_TAG
            value: {{ .Values.vclusterRegistryPivot.imageTag | quote }}
          {{- /*
           #5439 Phase 3 — the per-Organization `<slug>/catalyst-tenant` leg.
           Every knob is threaded as env (never re-templated inside the script)
           so chart/tests/perorg-vcluster-registry-pivot.sh can drive the SAME
           rendered bytes with its own values — the #5646 discipline: the test
           executes the shipped block, it does not validate a copy of it.
          */}}
          - name: PERORG_PIVOT_ENABLED
            value: {{ eq (toString .Values.vclusterRegistryPivot.perOrgTenant.enabled) "true" | quote }}
          - name: PERORG_TENANT_REPO
            value: {{ .Values.vclusterRegistryPivot.perOrgTenant.repo | quote }}
          - name: PERORG_BRANCH
            value: {{ .Values.vclusterRegistryPivot.perOrgTenant.branch | quote }}
          - name: PERORG_FLUX_NAMESPACE
            value: {{ .Values.vclusterRegistryPivot.perOrgTenant.fluxNamespace | quote }}
          - name: PERORG_ORG_CRD
            value: {{ .Values.vclusterRegistryPivot.perOrgTenant.organizationCRD | quote }}
          - name: PERORG_TREES
            value: {{ .Values.vclusterRegistryPivot.perOrgTenant.trees | quote }}
          - name: PERORG_READBACK_DEADLINE
            value: {{ .Values.vclusterRegistryPivot.perOrgTenant.readbackDeadlineSeconds | quote }}
          - name: MOTHERSHIP_HARBOR_HOST
            value: {{ .Values.vclusterRegistryPivot.perOrgTenant.mothershipHarborHost | quote }}
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu

            {{- /*
             The Sovereign-local Harbor host. bp-*-vcluster charts'
             `image.repository` is HOST + PATH ("harbor.openova.io/
             proxy-ghcr/loft-sh/vcluster"), but the upstream loft-sh
             subchart splits it into `.image.registry` (HOST only) +
             `.image.repository` (PATH only). So we compute both.
            */}}
            target_host="harbor.${SOVEREIGN_FQDN}"
            wrapper_repo="${target_host}/proxy-ghcr/loft-sh/vcluster"
            sub_registry="${target_host}"
            sub_repo_path="proxy-ghcr/loft-sh/vcluster"

            echo "[vcluster-registry-pivot] target host: ${target_host}"
            echo "[vcluster-registry-pivot] wrapper image.repository: ${wrapper_repo}"
            echo "[vcluster-registry-pivot] subchart image.registry: ${sub_registry} repository: ${sub_repo_path}"

            {{- /*
             #3695 — a real YAML processor for the Phase-2b/2c git-persist
             merges (Principle #15). Line-oriented awk/sed on a multi-document
             YAML with an EVOLVING schema is the wrong tool: 13b-bp-sso-bridge.yaml
             GAINED a `spec.values` block (the #2940 global.registryMirror
             overlay), so the old awk injector's "append a fresh values: under
             spec:" produced a SECOND values: key → duplicate-mapping-key →
             bootstrap-kit BuildFailed → the root GitOps loop died while
             cutoverComplete flipped true. yq MERGES into the existing mapping
             and is idempotent against a file that already carries the key.
             The alpine/k8s image ships yq (mikefarah/Go yq); if a future image
             variant drops it we apk-add it (best-effort; proxied alpine repos),
             and fall back to a NO-OP-when-values-exists guard so we can NEVER
             re-introduce the duplicate-key corruption.
            */}}
            HAVE_YQ=""
            if command -v yq >/dev/null 2>&1; then
              HAVE_YQ="yes"
            else
              apk add --no-cache yq >/dev/null 2>&1 || true
              command -v yq >/dev/null 2>&1 && HAVE_YQ="yes"
            fi
            if [ -n "${HAVE_YQ}" ]; then
              echo "[vcluster-registry-pivot] yq available ($(yq --version 2>/dev/null || echo unknown)) — Phase-2 git-persist will MERGE values (#3695)"
            else
              echo "[vcluster-registry-pivot] WARN yq unavailable — Phase-2 image.repository merge will NO-OP when a values: block already exists (never injects a duplicate); the durable registry host pivot still rides global.registryMirror (Phase-2c)"
            fi

            {{- /*
             ---- Phase 1: live K8s patch on each of the 3 bp-*-vcluster HelmReleases ----

             The bp-*-vcluster wrapper charts each expose:
               spec.values.<role>Vcluster.image.repository   (umbrella)
               spec.values.vcluster.controlPlane.statefulSet.image.{registry,repository}   (subchart)
             where <role> is one of {mgmt, rtz, dmz}. We merge-patch
             both knobs in a single kubectl invocation per HR so a
             partial-patch race can't leave one knob pivoted and the
             other not.

             Idempotency: kubectl patch --type=merge is a no-op when
             the requested value equals the current value, so re-runs
             don't churn the HR resourceVersion. We additionally read
             the current wrapper image.repository before patching and
             log a SKIP when it's already correct.
            */}}
            ok=0
            skip=0
            fail=0

            patch_hr() {
              {{- /*
               $1 = HR name (bp-mgmt-vcluster | bp-rtz-vcluster | bp-dmz-vcluster)
               $2 = role key (mgmtVcluster | rtzVcluster | dmzVcluster)
              */}}
              hr_name="$1"
              role_key="$2"

              {{- /*
               Skip-if-absent guard. On a primary region the MGMT and
               DMZ HRs exist; secondaries only have DMZ + RTZ. We
               don't want a missing HR to fail the cutover step on
               the wrong topology.
              */}}
              if ! kubectl get helmrelease "${hr_name}" -n "${HELMRELEASE_NAMESPACE}" >/dev/null 2>&1; then
                echo "[vcluster-registry-pivot] SKIP ${hr_name} (not present in this region — topology-dependent, expected)"
                skip=$((skip+1))
                return 0
              fi

              cur_wrapper=$(kubectl get helmrelease "${hr_name}" -n "${HELMRELEASE_NAMESPACE}" \
                -o jsonpath='{.spec.values.'"${role_key}"'.image.repository}' 2>/dev/null || echo "")
              cur_sub_reg=$(kubectl get helmrelease "${hr_name}" -n "${HELMRELEASE_NAMESPACE}" \
                -o jsonpath='{.spec.values.vcluster.controlPlane.statefulSet.image.registry}' 2>/dev/null || echo "")

              if [ "${cur_wrapper}" = "${wrapper_repo}" ] && [ "${cur_sub_reg}" = "${sub_registry}" ]; then
                echo "[vcluster-registry-pivot] SKIP ${hr_name} (already pivoted: wrapper=${cur_wrapper} sub-registry=${cur_sub_reg})"
                skip=$((skip+1))
                return 0
              fi

              {{- /*
               Build a single merge-patch that updates BOTH knobs.
               Using a heredoc + printf to keep the JSON readable.
              */}}
              patch_json=$(printf '{
                "spec": {
                  "values": {
                    "%s": {
                      "image": {
                        "repository": "%s"
                      }
                    },
                    "vcluster": {
                      "controlPlane": {
                        "statefulSet": {
                          "image": {
                            "registry": "%s",
                            "repository": "%s"
                          }
                        }
                      }
                    }
                  }
                }
              }' "${role_key}" "${wrapper_repo}" "${sub_registry}" "${sub_repo_path}")

              if kubectl patch helmrelease "${hr_name}" \
                  -n "${HELMRELEASE_NAMESPACE}" \
                  --type=merge --patch "${patch_json}" >/dev/null 2>&1; then
                echo "[vcluster-registry-pivot] OK ${hr_name} -> wrapper=${wrapper_repo} sub-registry=${sub_registry}"
                {{- /*
                 Trigger immediate Flux reconcile so helm-controller
                 re-renders the chart within seconds rather than
                 waiting for the 15m HR interval.
                */}}
                kubectl annotate --overwrite helmrelease "${hr_name}" \
                  -n "${HELMRELEASE_NAMESPACE}" \
                  "reconcile.fluxcd.io/requestedAt=$(date +%s)" >/dev/null 2>&1 || true
                ok=$((ok+1))
              else
                echo "[vcluster-registry-pivot] FAIL ${hr_name}" >&2
                fail=$((fail+1))
              fi
            }

            patch_hr "bp-mgmt-vcluster" "mgmtVcluster"
            patch_hr "bp-rtz-vcluster"  "rtzVcluster"
            patch_hr "bp-dmz-vcluster"  "dmzVcluster"

            {{- /*
             ---- Phase 1b: live K8s patch on the bp-sso-bridge HelmRelease (#2951) ----

             bp-sso-bridge's chart default
             `image.repository: harbor.openova.io/proxy-dockerhub/alpine/k8s`
             keeps the reconciler Pod pulling from mothership Harbor
             post-cutover (UAT Wave-2 ATTACK#9, #2940). The
             `13b-bp-sso-bridge.yaml` overlay has NO image override, so the
             chart default wins on every reconcile. We pivot only the HOST
             segment (`harbor.openova.io` → `harbor.${SOVEREIGN_FQDN}`) and
             preserve the rest of the path so the local Harbor proxy-
             dockerhub project serves the same upstream alpine/k8s image.

             Idempotency: read the current value first; SKIP when it no
             longer references harbor.openova.io (already pivoted, or an
             operator overlay set a custom host). We never assume a fixed
             suffix — we string-replace the literal mothership host so a
             future chart image-tag/path change is preserved automatically.
            */}}
            sso_hr="bp-sso-bridge"
            if kubectl get helmrelease "${sso_hr}" -n "${HELMRELEASE_NAMESPACE}" >/dev/null 2>&1; then
              cur_sso=$(kubectl get helmrelease "${sso_hr}" -n "${HELMRELEASE_NAMESPACE}" \
                -o jsonpath='{.spec.values.image.repository}' 2>/dev/null || echo "")
              if [ -z "${cur_sso}" ]; then
                {{- /*
                 The overlay carries no spec.values.image.repository
                 override, so the live HR reflects the chart default. Read
                 it off the chart default literal we know ships today; if
                 that ever changes the SKIP-on-no-harbor.openova.io guard
                 below still keeps this safe.
                */}}
                cur_sso="harbor.openova.io/proxy-dockerhub/alpine/k8s"
              fi
              case "${cur_sso}" in
                *harbor.openova.io/*)
                  new_sso=$(printf '%s' "${cur_sso}" | sed -e "s,harbor\.openova\.io/,harbor.${SOVEREIGN_FQDN}/,")
                  sso_patch=$(printf '{"spec":{"values":{"image":{"repository":"%s"}}}}' "${new_sso}")
                  if kubectl patch helmrelease "${sso_hr}" \
                      -n "${HELMRELEASE_NAMESPACE}" \
                      --type=merge --patch "${sso_patch}" >/dev/null 2>&1; then
                    echo "[vcluster-registry-pivot] OK ${sso_hr} -> image.repository=${new_sso}"
                    kubectl annotate --overwrite helmrelease "${sso_hr}" \
                      -n "${HELMRELEASE_NAMESPACE}" \
                      "reconcile.fluxcd.io/requestedAt=$(date +%s)" >/dev/null 2>&1 || true
                    ok=$((ok+1))
                  else
                    echo "[vcluster-registry-pivot] FAIL ${sso_hr}" >&2
                    fail=$((fail+1))
                  fi
                  ;;
                *)
                  echo "[vcluster-registry-pivot] SKIP ${sso_hr} (image.repository=${cur_sso} not on harbor.openova.io — already pivoted or custom)"
                  skip=$((skip+1))
                  ;;
              esac
            else
              echo "[vcluster-registry-pivot] SKIP ${sso_hr} (HR not present)"
              skip=$((skip+1))
            fi

            {{- /*
             ---- Phase 1d: live K8s patch of spec.values.global.registryMirror (#3379, hw139) ----

             The 3 bp-*-vcluster HRs AND bp-sso-bridge each carry a
             `spec.values.global.registryMirror` knob (single source of truth
             for the image HOST — see each chart's
             templates/_helpers.tpl `global.registryMirror | default
             "harbor.openova.io"`). The bootstrap-kit overlays set it to
             `${REGISTRY_MIRROR:=harbor.openova.io}`, which on a Sovereign
             (REGISTRY_MIRROR unset) envsubst-resolves to the LITERAL
             `harbor.openova.io`. The Phase-1/1b image.repository pivots above
             do NOT touch global.registryMirror, so it stays at mothership
             Harbor — and the Phase-1c residual-tether check below greps the
             WHOLE spec.values for `harbor.openova.io`, so a surviving
             registryMirror makes the check FATAL ("N HelmRelease(s) still
             tethered") → BackoffLimitExceeded → cutover wedged at step-10.
             That is exactly the hw139 #3379 catch (4 HRs flagged:
             bp-mgmt/rtz/dmz-vcluster + bp-sso-bridge).

             Fix: pivot the registryMirror HOST here too
             (harbor.openova.io → harbor.${SOVEREIGN_FQDN}) so the residual
             check passes AND the vCluster/sso-bridge image pulls actually
             resolve through the Sovereign-local Harbor mirror. Idempotent:
             SKIP when the live value no longer equals harbor.openova.io
             (already pivoted, or an operator overlay set a custom mirror).
            */}}
            patch_registry_mirror() {
              {{- /* $1 = HR name */}}
              rm_hr="$1"
              kubectl get helmrelease "${rm_hr}" -n "${HELMRELEASE_NAMESPACE}" >/dev/null 2>&1 || {
                echo "[vcluster-registry-pivot] SKIP registryMirror ${rm_hr} (HR not present)"
                skip=$((skip+1))
                return 0
              }
              cur_rm=$(kubectl get helmrelease "${rm_hr}" -n "${HELMRELEASE_NAMESPACE}" \
                -o jsonpath='{.spec.values.global.registryMirror}' 2>/dev/null || echo "")
              case "${cur_rm}" in
                harbor.openova.io)
                  rm_patch=$(printf '{"spec":{"values":{"global":{"registryMirror":"%s"}}}}' "${target_host}")
                  if kubectl patch helmrelease "${rm_hr}" \
                      -n "${HELMRELEASE_NAMESPACE}" \
                      --type=merge --patch "${rm_patch}" >/dev/null 2>&1; then
                    echo "[vcluster-registry-pivot] OK registryMirror ${rm_hr} -> ${target_host}"
                    kubectl annotate --overwrite helmrelease "${rm_hr}" \
                      -n "${HELMRELEASE_NAMESPACE}" \
                      "reconcile.fluxcd.io/requestedAt=$(date +%s)" >/dev/null 2>&1 || true
                    ok=$((ok+1))
                  else
                    echo "[vcluster-registry-pivot] FAIL registryMirror ${rm_hr}" >&2
                    fail=$((fail+1))
                  fi
                  ;;
                "")
                  echo "[vcluster-registry-pivot] SKIP registryMirror ${rm_hr} (no spec.values.global.registryMirror set)"
                  skip=$((skip+1))
                  ;;
                *)
                  echo "[vcluster-registry-pivot] SKIP registryMirror ${rm_hr} (registryMirror=${cur_rm} not harbor.openova.io — already pivoted or custom)"
                  skip=$((skip+1))
                  ;;
              esac
            }

            patch_registry_mirror "bp-mgmt-vcluster"
            patch_registry_mirror "bp-rtz-vcluster"
            patch_registry_mirror "bp-dmz-vcluster"
            patch_registry_mirror "bp-sso-bridge"

            echo "[vcluster-registry-pivot] live-K8s ok=${ok} skip=${skip} fail=${fail}"
            [ "${fail}" -eq 0 ] || exit 1

            {{- /*
             ---- Phase 1c: residual-tether self-assertion (#2951 / #2940 ATTACK#9) ----

             The four image.repository pivots above (3 vClusters + sso-bridge)
             are the ONLY chart-default `harbor.openova.io` tethers this step
             owns. Assert directly against live HR state that none of them
             still resolves to mothership Harbor, so the cutover Job itself
             FAILS LOUDLY rather than leaving a manual post-hoc
             `kubectl get hr -A -o yaml | grep harbor.openova.io` as the only
             acceptance gate (the VERIFIED-PARTIAL finding on #2940: "the
             cutover automation does not assert the pivots actually landed").

             Scope note (Pillar 5 / ADR-0002): we ONLY assert the four image
             tethers. We deliberately do NOT flag:
               * powerdns `api.host` — the `11-powerdns.yaml` overlay already
                 templates `pdns.${SOVEREIGN_FQDN}` (no live harbor ref).
               * cert-manager-powerdns-webhook `powerdns.host` — an INTENTIONAL
                 out-of-cluster ACME DNS-01 tether to contabo's central
                 PowerDNS; rewriting it would break wildcard-cert issuance.
               * ghcr.io/openova-io chart-fetch URLs — ADR-0002 cold-start path.
            */}}
            residual=0
            for hr_name in bp-mgmt-vcluster bp-rtz-vcluster bp-dmz-vcluster bp-sso-bridge; do
              kubectl get helmrelease "${hr_name}" -n "${HELMRELEASE_NAMESPACE}" >/dev/null 2>&1 || continue
              hr_values=$(kubectl get helmrelease "${hr_name}" -n "${HELMRELEASE_NAMESPACE}" \
                -o jsonpath='{.spec.values}' 2>/dev/null || echo "")
              case "${hr_values}" in
                *harbor.openova.io*)
                  echo "[vcluster-registry-pivot] RESIDUAL-TETHER ${hr_name}: spec.values still references harbor.openova.io" >&2
                  residual=$((residual+1))
                  ;;
                *)
                  echo "[vcluster-registry-pivot] CLEAN ${hr_name}: no harbor.openova.io in spec.values"
                  ;;
              esac
            done
            if [ "${residual}" -ne 0 ]; then
              echo "[vcluster-registry-pivot] FATAL: ${residual} HelmRelease(s) still tethered to mothership Harbor after pivot — Pillar 5 independence not met" >&2
              exit 1
            fi
            echo "[vcluster-registry-pivot] residual-tether assertion PASS (0 of 4 image HRs on harbor.openova.io)"

            {{- /*
             ---- Phase 2: push YAML edit to local Gitea ----

             bootstrap-kit Kustomization reconciles HelmRelease YAML
             from local Gitea every ~1 min. Without this phase, Phase
             1's live patch is silently reverted on the next reconcile
             because the YAML in Gitea still lacks the image.repository
             override under spec.values. We inject the override block
             (same shape used by other Sovereign-overlay knobs in
             those files like `nodeSelector` and the existing
             `${SOVEREIGN_REGION_CANONICAL_LABEL}` substitutions).
            */}}
            export HOME=/tmp
            git config --global user.name "self-sovereign-cutover"
            git config --global user.email "cutover@${SOVEREIGN_FQDN}"
            git config --global advice.detachedHead false

            gitea_host="$(printf '%s' "${GITEA_INTERNAL_URL}" | sed -E 's|^https?://||' | cut -d: -f1 | cut -d/ -f1)"
            for i in $(seq 1 30); do
              if nslookup "${gitea_host}" >/dev/null 2>&1; then break; fi
              sleep 5
            done

            {{- /*
             #5262 — read the step-09 minted `catalyst-gitea-token` PAT for
             the git clone/push. Credential hygiene: the PAT is never
             echoed; it flows only into the git remote URL (logged in the
             redacted form). Bounded wait: step-09 (gitea-token-mint) runs
             directly before this step, so a populated token byte is the
             steady state; the retry only covers apiserver flakes.
            */}}
            echo "[vcluster-registry-pivot] reading PAT ${PAT_SOURCE_NAMESPACE}/${PAT_SOURCE_SECRET_NAME}.${PAT_SOURCE_KEY}"
            GITEA_PAT=""
            for i in $(seq 1 30); do
              GITEA_PAT=$(kubectl -n "${PAT_SOURCE_NAMESPACE}" get secret "${PAT_SOURCE_SECRET_NAME}" \
                -o "jsonpath={.data.${PAT_SOURCE_KEY}}" 2>/dev/null | base64 -d 2>/dev/null || true)
              if [ -n "${GITEA_PAT}" ]; then
                echo "[vcluster-registry-pivot] PAT present (attempt ${i})"
                break
              fi
              echo "[vcluster-registry-pivot] PAT not yet populated in ${PAT_SOURCE_NAMESPACE}/${PAT_SOURCE_SECRET_NAME} (attempt ${i}/30) — sleeping 5s"
              sleep 5
            done
            if [ -z "${GITEA_PAT}" ]; then
              echo "[vcluster-registry-pivot] FATAL: ${PAT_SOURCE_NAMESPACE}/${PAT_SOURCE_SECRET_NAME}.${PAT_SOURCE_KEY} empty after 150s — step-09 gitea-token-mint did not populate the PAT; refusing to clone with the admin password (drifts from the Gitea DB, the #5262 401/exit-128 wedge)" >&2
              exit 1
            fi

            push_url=$(printf '%s' "${GITEA_INTERNAL_URL}" | sed -E "s,^(https?://),\1${GITEA_USERNAME}:${GITEA_PAT}@,")"/${GITEA_ORG}/${GITEA_REPO}.git"
            redacted=$(printf '%s' "${GITEA_INTERNAL_URL}/${GITEA_ORG}/${GITEA_REPO}.git")

            echo "[vcluster-registry-pivot] cloning ${redacted}"
            cd /tmp
            rm -rf repo
            git clone --depth 1 --branch main "${push_url}" repo >/dev/null 2>&1
            cd repo

            target_dir="clusters/_template/bootstrap-kit"
            if [ ! -d "${target_dir}" ]; then
              echo "[vcluster-registry-pivot] FATAL: ${target_dir} not present in local mirror" >&2
              exit 1
            fi

            {{- /*
             The three vCluster HR YAMLs and their role keys.
             Format: filename:role_key
            */}}
            edited=0
            for entry in \
              "54-bp-dmz-vcluster.yaml:dmzVcluster" \
              "58-bp-mgmt-vcluster.yaml:mgmtVcluster" \
              "59-bp-rtz-vcluster.yaml:rtzVcluster" \
            ; do
              file="${entry%%:*}"
              role_key="${entry##*:}"
              path="${target_dir}/${file}"

              if [ ! -f "${path}" ]; then
                echo "[vcluster-registry-pivot] SKIP ${path} (not present)"
                continue
              fi

              {{- /*
               Has the override block already been injected (re-run)?
               We look for our sentinel comment + the wrapper-repo URL
               under the role_key block.
              */}}
              if grep -q "# ─── vCluster image registry pivot (TBD-V24 MISS-1) ──" "${path}"; then
                {{- /*
                 Idempotency: rewrite the URL value in case the
                 SOVEREIGN_FQDN changed between runs (rare but
                 possible when the operator renames the Sovereign).
                 We replace the line beginning with `        repository:`
                 under the role_key block.
                */}}
                if sed -i -E "/^[[:space:]]{4}${role_key}:[[:space:]]*$/,/^[[:space:]]{0,4}[a-zA-Z]/{s,^([[:space:]]{8}repository:[[:space:]]*).*$,\1${wrapper_repo}," "${path}" 2>/dev/null; then
                  edited=$((edited+1))
                  echo "[vcluster-registry-pivot] rewrote existing image override in ${path}"
                else
                  echo "[vcluster-registry-pivot] WARN: sed rewrite failed for ${path}; Phase-1 K8s patch remains durable for one upgrade cycle"
                fi
                continue
              fi

              {{- /*
               No existing override — inject the block under the
               `values:` key. The role-key block exists at 4-space
               indent under spec.values (every chart >= 0.1.0 ships
               this shape; the role keys are `mgmtVcluster`,
               `rtzVcluster`, `dmzVcluster`).
              */}}
              if grep -qE "^[[:space:]]{4}${role_key}:[[:space:]]*$" "${path}"; then
                awk -v role="${role_key}" -v repo="${wrapper_repo}" -v reg="${sub_registry}" -v rpath="${sub_repo_path}" -v tag="${IMAGE_TAG}" '
                  $0 ~ "^[[:space:]]{4}"role":[[:space:]]*$" && !done {
                    print
                    print "      # ─── vCluster image registry pivot (TBD-V24 MISS-1) ──"
                    print "      # Injected by self-sovereign-cutover step-10 from"
                    print "      # harbor.openova.io → harbor.<SOVEREIGN_FQDN> so the"
                    print "      # vCluster control-plane Pods pull from the Sovereign-local"
                    print "      # Harbor mirror, NOT mothership Harbor. Required by"
                    print "      # Principle #11 (no tether to harbor.openova.io after"
                    print "      # handover). Without this override the chart default at"
                    print "      # platform/bp-*-vcluster/chart/values.yaml resolves back"
                    print "      # to harbor.openova.io and the bootstrap-kit Kustomization"
                    print "      # reconcile reverts step-10s live K8s patch."
                    print "      image:"
                    print "        repository: " repo
                    done = 1
                    next
                  }
                  { print }
                ' "${path}" > "${path}.new" && mv "${path}.new" "${path}"
                edited=$((edited+1))
                echo "[vcluster-registry-pivot] injected wrapper image override into ${path}"
              else
                echo "[vcluster-registry-pivot] WARN: ${path} has no ${role_key}: anchor — Phase-1 K8s patch remains durable for one upgrade cycle"
                continue
              fi

              {{- /*
               ALSO inject (or replace) the subchart image block —
               the loft-sh upstream image. The file already has a
               `vcluster:` block at 4-space indent (every HR YAML
               has it for nodeSelector pinning). We append the
               subchart image under controlPlane.statefulSet, OR if
               the block already exists, replace the registry value.
              */}}
              if grep -qE "^[[:space:]]{8}statefulSet:[[:space:]]*$" "${path}"; then
                if grep -qE "^[[:space:]]{10}image:[[:space:]]*$" "${path}"; then
                  {{- /*
                   Existing image block under statefulSet — replace
                   registry + repository lines at 12-space indent
                   using a bounded sed range so we don't touch other
                   image: blocks in the same file.
                  */}}
                  sed -i -E "/^[[:space:]]{10}image:[[:space:]]*$/,/^[[:space:]]{0,10}[a-zA-Z]/{s,^([[:space:]]{12}registry:[[:space:]]*).*$,\1${sub_registry},; s,^([[:space:]]{12}repository:[[:space:]]*).*$,\1${sub_repo_path},}" "${path}" 2>/dev/null || true
                  echo "[vcluster-registry-pivot] rewrote subchart image registry/repository in ${path}"
                else
                  {{- /*
                   Inject a new image block under statefulSet at
                   10-space indent. statefulSet appears once; we add
                   `image:` as a sibling of `scheduling:`.
                  */}}
                  awk -v reg="${sub_registry}" -v rpath="${sub_repo_path}" -v tag="${IMAGE_TAG}" '
                    /^[[:space:]]{8}statefulSet:[[:space:]]*$/ && !done {
                      print
                      print "          image:"
                      print "            registry: " reg
                      print "            repository: " rpath
                      done = 1
                      next
                    }
                    { print }
                  ' "${path}" > "${path}.new" && mv "${path}.new" "${path}"
                  echo "[vcluster-registry-pivot] injected subchart image block into ${path}"
                fi
              fi
            done

            {{- /*
             ---- Phase 2b: persist sso-bridge image override to Gitea (#2951/#3695) ----

             13b-bp-sso-bridge.yaml is a MULTI-DOCUMENT YAML: doc 1 is the
             HelmRepository (its `spec:` carries type/url/secretRef), doc 2 is
             the HelmRelease whose `spec.values` takes image.repository. Since
             #2940 the HelmRelease ALSO carries a `spec.values` block
             (global.registryMirror + sovereign.fqdn). The old awk injector
             appended a SECOND `values:` under the HelmRelease spec → duplicate
             mapping key → bootstrap-kit BuildFailed (hw150). We now MERGE
             `image.repository` INTO the existing values mapping with yq,
             anchored to the HelmRelease document only (select by kind), so the
             result always has exactly ONE `values:` key. Idempotent: yq
             assignment is a no-op when the value already matches.

             The repository is host-LESS (proxy-dockerhub/alpine/k8s): the
             sso-bridge chart's `bp-sso-bridge.image` helper prepends
             global.registryMirror (pivoted durably to harbor.<fqdn> by
             Phase-2c), so the registry host has exactly ONE source of truth.
             Writing a host-qualified repository here would FIGHT that single
             source — the helper honours a host-qualified repo verbatim and
             would ignore the pivoted mirror.
            */}}
            sso_file="${target_dir}/13b-bp-sso-bridge.yaml"
            sso_repo="proxy-dockerhub/alpine/k8s"
            if [ -f "${sso_file}" ]; then
              if [ -n "${HAVE_YQ}" ]; then
                {{- /*
                 MERGE into the HelmRelease document's spec.values.image.repository.
                 `(select(.kind=="HelmRelease") | .spec.values.image.repository) = $r`
                 creates the image: child under the EXISTING values: mapping
                 (or creates values: if somehow absent) WITHOUT ever emitting a
                 second values: key. Other documents (HelmRepository) are
                 untouched. yq preserves the ${REGISTRY_MIRROR:=...} envsubst
                 placeholders verbatim (they are plain scalar strings to yq).
                */}}
                if yq eval -i "(select(.kind == \"HelmRelease\") | .spec.values.image.repository) = \"${sso_repo}\"" "${sso_file}" 2>/dev/null; then
                  echo "[vcluster-registry-pivot] merged sso-bridge image.repository=${sso_repo} into existing values (yq, single values: key) — ${sso_file}"
                  edited=$((edited+1))
                else
                  echo "[vcluster-registry-pivot] WARN: yq merge of sso-bridge image.repository failed on ${sso_file}; the durable registry host still rides global.registryMirror (Phase-2c)"
                fi
              elif grep -qE "^[[:space:]]+values:[[:space:]]*$" "${sso_file}"; then
                {{- /*
                 No yq AND a values: block already exists → the awk injector
                 would duplicate the key. NO-OP rather than corrupt the file:
                 the registry host pivot is fully covered by Phase-2c's
                 global.registryMirror rewrite (the image host's single source
                 of truth), so skipping the image.repository merge does NOT
                 leave a mothership tether. (#3695: never re-introduce the
                 duplicate-mapping-key BuildFailed.)
                */}}
                echo "[vcluster-registry-pivot] NO-OP sso-bridge image.repository merge (no yq + existing values: block) — registry host pivot covered by Phase-2c global.registryMirror"
              else
                echo "[vcluster-registry-pivot] SKIP sso-bridge image.repository merge (no yq + no values: block) — Phase-1b K8s patch remains durable for one upgrade cycle"
              fi
            else
              echo "[vcluster-registry-pivot] SKIP ${sso_file} (not present)"
            fi

            {{- /*
             ---- Phase 2c: persist global.registryMirror pivot to Gitea (#3379, hw139) ----

             Phase-1d live-patched spec.values.global.registryMirror on the
             4 HRs, but the bootstrap-kit Kustomization reconciles those HR
             YAMLs from local Gitea every ~1 min and would REVERT the patch
             back to the overlay literal `harbor.openova.io` — re-tethering
             the Sovereign + re-arming the Phase-1c residual FATAL on the
             NEXT cutover. So rewrite the registryMirror host durably in the
             4 overlay files too. The cloud-init-rendered Gitea copy carries
             the post-envsubst literal `registryMirror: harbor.openova.io`
             (REGISTRY_MIRROR unset on a Sovereign), so a line-anchored sed
             off that literal is exact — registryMirror appears once per
             overlay (under global:). Idempotent: a re-run finds the value
             already at harbor.${SOVEREIGN_FQDN} and the sed is a no-op
             (git diff stays empty for that line).
            */}}
            for rm_file in \
              "54-bp-dmz-vcluster.yaml" \
              "58-bp-mgmt-vcluster.yaml" \
              "59-bp-rtz-vcluster.yaml" \
              "13b-bp-sso-bridge.yaml" \
            ; do
              rm_path="${target_dir}/${rm_file}"
              if [ ! -f "${rm_path}" ]; then
                echo "[vcluster-registry-pivot] SKIP registryMirror persist ${rm_path} (not present)"
                continue
              fi
              {{- /*
               #3695: prefer yq for a structural assignment of the HelmRelease
               document's spec.values.global.registryMirror. This is robust to
               the overlay carrying the value as a ${REGISTRY_MIRROR:=...}
               placeholder OR the post-envsubst literal harbor.openova.io, and
               never touches a HelmRepository document in the same file. The
               sed fallback (value-replacement on the literal line — safe, it
               rewrites a scalar in place and never adds a key) covers a
               yq-less image. Idempotent either way.
              */}}
              if [ -n "${HAVE_YQ}" ]; then
                cur=$(yq eval 'select(.kind == "HelmRelease") | .spec.values.global.registryMirror' "${rm_path}" 2>/dev/null | head -1 || true)
                case "${cur}" in
                  harbor.${SOVEREIGN_FQDN})
                    echo "[vcluster-registry-pivot] registryMirror in ${rm_path} already harbor.${SOVEREIGN_FQDN} (yq) — no rewrite" ;;
                  ""|null)
                    echo "[vcluster-registry-pivot] registryMirror absent in ${rm_path} (yq) — no rewrite" ;;
                  *)
                    if yq eval -i "(select(.kind == \"HelmRelease\") | .spec.values.global.registryMirror) = \"harbor.${SOVEREIGN_FQDN}\"" "${rm_path}" 2>/dev/null; then
                      echo "[vcluster-registry-pivot] rewrote global.registryMirror in ${rm_path} -> harbor.${SOVEREIGN_FQDN} (yq)"
                      edited=$((edited+1))
                    else
                      echo "[vcluster-registry-pivot] WARN: yq registryMirror rewrite failed for ${rm_path}; Phase-1d K8s patch remains durable for one reconcile cycle"
                    fi ;;
                esac
              elif grep -qE "^[[:space:]]*registryMirror:[[:space:]]*harbor\.openova\.io[[:space:]]*$" "${rm_path}"; then
                if sed -i -E "s,^([[:space:]]*registryMirror:[[:space:]]*)harbor\.openova\.io[[:space:]]*\$,\1harbor.${SOVEREIGN_FQDN}," "${rm_path}" 2>/dev/null; then
                  echo "[vcluster-registry-pivot] rewrote global.registryMirror in ${rm_path} -> harbor.${SOVEREIGN_FQDN} (sed fallback)"
                  edited=$((edited+1))
                else
                  echo "[vcluster-registry-pivot] WARN: registryMirror sed failed for ${rm_path}; Phase-1d K8s patch remains durable for one reconcile cycle"
                fi
              else
                echo "[vcluster-registry-pivot] registryMirror in ${rm_path} already pivoted or absent — no rewrite"
              fi
            done

            echo "[vcluster-registry-pivot] edited ${edited} files (yq merge / sed fallback)"
            {{- /*
             #5439 — these two "nothing to do" outcomes used to `exit 0` and END
             THE STEP. That was correct while the bootstrap-kit push was the last
             thing this step did; with Phase 3 below it would mean a Sovereign
             whose bootstrap-kit slots are ALREADY pivoted (every re-run, and
             every cutover re-fire) silently skips the per-Org leg entirely. The
             skip is now scoped to the PUSH, which is what has nothing to do —
             never to the rest of the step.
            */}}
            if [ "${edited}" -eq 0 ]; then
              echo "[vcluster-registry-pivot] no bootstrap-kit edits required — already pivoted in Gitea or files absent"
            else
              git add "${target_dir}"
              if git diff --staged --quiet; then
                echo "[vcluster-registry-pivot] git diff empty after sed — nothing to commit"
              else
                git commit -m "cutover: pivot vCluster + sso-bridge image.repository + global.registryMirror to harbor.${SOVEREIGN_FQDN}" >/dev/null
                push_err=$(git push origin main 2>&1) || {
                  echo "[vcluster-registry-pivot] FATAL: git push failed" >&2
                  printf '%s\n' "$push_err" >&2
                  exit 1
                }
                echo "[vcluster-registry-pivot] pushed to ${redacted}"

                {{- /*
                 Trigger an immediate Flux reconciliation so the new YAML
                 lands without waiting for the polling interval.
                */}}
                kubectl annotate --overwrite gitrepository openova \
                  -n flux-system \
                  "reconcile.fluxcd.io/requestedAt=$(date +%s)" >/dev/null || true
              fi
            fi

            {{- /*
             ══ Phase 3 (#5439): per-Organization `<slug>/catalyst-tenant` ══
                 vCluster image-registry durable pivot.

             Everything above this line pivots FOUR named HelmReleases in ONE
             namespace. This phase pivots the shape whose count scales with the
             number of Organizations, and whose durable source is a repo class
             no cutover step touched: `<slug>/catalyst-tenant@main`, tree
             `vcluster/` (vcluster.yaml + apps/ + host-apps/), reconciled by the
             `catalyst-tenant-<slug>-{vcluster,apps,host-apps}` Kustomizations
             with prune=true.

             THE ENUMERATION IS THE DESIGN. A hardcoded slug list is wrong the
             moment the next Organization is sold, so the list is built LIVE and
             from the SAME two sources step-06 Phase-2d already uses (#6309) —
             deliberately the same, so the two legs can never disagree about
             which Organizations exist:

               SOURCE 1 (mandatory) the `catalyst-tenant-<slug>` GitRepositories
                 — per_org_flux.go creates exactly one per Org, and it is the
                 object that FEEDS the reverting Kustomization.
               SOURCE 2 (union) the Organization CRs — catches an Org whose Flux
                 source has not been created yet.

             Neither read may fail quietly: a refused list and an empty estate
             render identically, and here that would leave an unknown number of
             Organizations tethered while this step recorded success.
            */}}
            # ---- perorg-vcluster-pivot BEGIN (extraction anchor — chart/tests/perorg-vcluster-registry-pivot.sh awk-slices this region out of the render and EXECUTES it under a stubbed kubectl/curl with real git) ----
            if [ "${PERORG_PIVOT_ENABLED:-true}" != "true" ]; then
              echo "[vcluster-registry-pivot] Phase-3 SKIP: vclusterRegistryPivot.perOrgTenant.enabled=false"
            else
              {{- /*
               Scratch root. Production keeps /tmp (the Job's emptyDir, the
               only writable path under readOnlyRootFilesystem). It is a
               variable so chart/tests/perorg-vcluster-registry-pivot.sh can
               execute these exact bytes in its own sandbox instead of
               writing into the runner's real /tmp — a test that has to share
               mutable global paths cannot run beside another copy of itself.
              */}}
              pv_scratch="${PERORG_SCRATCH_DIR:-/tmp}"
              pv_repo="${PERORG_TENANT_REPO:-catalyst-tenant}"
              pv_branch="${PERORG_BRANCH:-main}"
              pv_ns="${PERORG_FLUX_NAMESPACE:-flux-system}"
              pv_crd="${PERORG_ORG_CRD:-organizations.orgs.openova.io}"
              pv_api_base="${GITEA_INTERNAL_URL%/}/api/v1/repos"
              pv_slugs="${pv_scratch}/.pv-slugs.txt"
              pv_touched="${pv_scratch}/.pv-touched.txt"
              : > "${pv_slugs}"
              : > "${pv_touched}"

              {{- /*
               SOURCE 1 + the ANTI-VACUITY WITNESS.

               `pv_grs_total` is the count of ALL GitRepositories the listing
               returned, kept separately from the count that MATCHED the
               `catalyst-tenant-` prefix. It exists because "zero Organizations"
               and "I read nothing" are the same output otherwise, and the
               fail-closed branch below only covers the case where kubectl
               EXITS non-zero. A listing that exits 0 and returns zero rows is
               the residual hole — and on a Sovereign it cannot be honest: this
               very step annotates `gitrepository openova -n flux-system` a few
               lines above, so at least ONE GitRepository is present in this
               namespace by construction. Zero total therefore means the reader
               is not looking at the cluster it thinks it is (wrong namespace,
               wrong context, a stub that answers everything with silence), and
               a "no Organizations, nothing to do" verdict drawn from it would
               be a fabrication. It is FATAL, and it is the witness that makes a
               genuine zero trustworthy.
              */}}
              if kubectl get gitrepositories.source.toolkit.fluxcd.io -n "${pv_ns}" \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
                  > "${pv_scratch}/.pv-grs.txt" 2>"${pv_scratch}/.pv-grs.err"; then
                pv_grs_total=$(awk 'NF' "${pv_scratch}/.pv-grs.txt" | grep -c . || true)
                if [ "${pv_grs_total}" -eq 0 ]; then
                  echo "[vcluster-registry-pivot] FATAL: Phase-3: listing GitRepositories in ${pv_ns} SUCCEEDED but returned ZERO objects. This step annotated gitrepository/openova in that namespace moments ago, so zero is not a state this Sovereign can be in — the read is hollow (wrong namespace or context), and concluding 'no Organizations' from it would report a pivot over an estate that was never examined (#5439)" >&2
                  exit 1
                fi
                awk -v p="${pv_repo}-" 'index($0,p)==1 && length($0)>length(p) {print substr($0,length(p)+1)}' \
                  "${pv_scratch}/.pv-grs.txt" >> "${pv_slugs}"
              else
                echo "[vcluster-registry-pivot] FATAL: Phase-3: listing GitRepositories in ${pv_ns} FAILED — the live Organization list cannot be built, and pivoting a PARTIAL list would leave an unknown number of per-Org vCluster HelmReleases on the mothership Harbor while this step recorded success (#5439)" >&2
                sed 's/^/  KUBECTL-STDERR /' "${pv_scratch}/.pv-grs.err" >&2 || true
                exit 1
              fi

              {{- /*
               SOURCE 2. CRD absence must be POSITIVE evidence: `kubectl get crd`
               exits non-zero for BOTH "not installed" and "forbidden", so the
               NotFound string is required before absence may be concluded.
               Without that, a missing RBAC grant reads as "this Sovereign has
               no Organizations" and the leg no-ops on exactly the environments
               that need it.
              */}}
              pv_org_present=0
              if kubectl get customresourcedefinitions "${pv_crd}" >/dev/null 2>"${pv_scratch}/.pv-crd.err"; then
                pv_org_present=1
                pv_org_state="crd-present"
              elif grep -q 'NotFound' "${pv_scratch}/.pv-crd.err"; then
                pv_org_state="crd-absent(NotFound-confirmed)"
                echo "[vcluster-registry-pivot] Phase-3: ${pv_crd} is not installed on this Sovereign — the live Org list comes from the per-Org Flux sources alone"
              else
                echo "[vcluster-registry-pivot] FATAL: Phase-3: could not determine whether ${pv_crd} exists — that is NOT the same as it being absent, and treating it as absent silently drops every Organization from the pivot (#5439)" >&2
                sed 's/^/  KUBECTL-STDERR /' "${pv_scratch}/.pv-crd.err" >&2 || true
                exit 1
              fi
              if [ "${pv_org_present}" -eq 1 ]; then
                if kubectl get "${pv_crd}" \
                    -o jsonpath='{range .items[*]}{.spec.slug}{"\n"}{end}' \
                    > "${pv_scratch}/.pv-orgs.txt" 2>"${pv_scratch}/.pv-orgs.err"; then
                  pv_org_state="crd-present,listed=$(awk 'NF' "${pv_scratch}/.pv-orgs.txt" | grep -c . || true)"
                  awk 'NF' "${pv_scratch}/.pv-orgs.txt" >> "${pv_slugs}"
                else
                  echo "[vcluster-registry-pivot] FATAL: Phase-3: the ${pv_crd} CRD IS installed but listing Organizations failed — refusing to pivot a partial Organization list (#5439)" >&2
                  sed 's/^/  KUBECTL-STDERR /' "${pv_scratch}/.pv-orgs.err" >&2 || true
                  exit 1
                fi
              fi

              awk 'NF' "${pv_slugs}" | sort -u > "${pv_scratch}/.pv-slugs.sorted"
              mv "${pv_scratch}/.pv-slugs.sorted" "${pv_slugs}"
              pv_total=$(grep -c . "${pv_slugs}" || true)
              {{- /*
               The witness is PRINTED, not merely computed. An operator reading
               `orgs=0` must be able to see, on the same line, the two positive
               reads that establish it — never infer it from silence.
              */}}
              echo "[vcluster-registry-pivot] Phase-3: ${pv_total} live Organization slug(s) (Organization CRs ∪ ${pv_repo}-* Flux sources) [witness: gitrepositories-read-ok total=${pv_grs_total}, org-crd=${pv_org_state}]"

              pv_absent=0
              pv_pushed=0
              pv_nodiff=0
              for pv_slug in $(awk 'NF' "${pv_slugs}"); do
                {{- /*
                 Existence decided by HTTP STATUS, not by whether a git command
                 failed: `git ls-remote` exits non-zero both for a repo that does
                 not exist and for one we cannot authenticate to, and collapsing
                 those is how a credential fault presents as "this Org simply has
                 no repo". 404 is legitimately absent; anything neither 200 nor
                 404 is unreadable and fails closed.
                */}}
                pv_code=$(curl -s -o "${pv_scratch}/.pv-repo.json" -w '%{http_code}' \
                  -u "${GITEA_USERNAME}:${GITEA_PAT}" \
                  "${pv_api_base}/${pv_slug}/${pv_repo}" 2>/dev/null || echo "000")
                case "${pv_code}" in
                  200) : ;;
                  404)
                    echo "[vcluster-registry-pivot] Phase-3 ${pv_slug}: no ${pv_repo} repo (HTTP 404) — this Org has no per-Org gitops tree, so nothing re-applies a vCluster HelmRelease from one"
                    pv_absent=$((pv_absent+1))
                    continue
                    ;;
                  *)
                    echo "[vcluster-registry-pivot] FATAL: Phase-3 ${pv_slug}: HTTP ${pv_code} probing ${pv_slug}/${pv_repo} — an unreadable repo is NOT an absent repo, and guessing leaves this Org's vCluster on the mothership Harbor (#5439)" >&2
                    exit 1
                    ;;
                esac

                pv_url=$(printf '%s' "${GITEA_INTERNAL_URL}" | sed -E "s,^(https?://),\1${GITEA_USERNAME}:${GITEA_PAT}@,")"/${pv_slug}/${pv_repo}.git"

                {{- /*
                 A repo that EXISTS but carries no branch is a real, benign state
                 (the org-controller creates the repo before anything seeds it).
                 Separated from an AUTH failure exactly as the probe separates
                 404 from 500: ls-remote SUCCEEDING with no matching ref is an
                 absent branch; ls-remote FAILING against a repo the API just
                 reported present is a credential fault and stays fatal.
                */}}
                if ! git ls-remote --heads "${pv_url}" "${pv_branch}" > "${pv_scratch}/.pv-heads.txt" 2>"${pv_scratch}/.pv-heads.err"; then
                  echo "[vcluster-registry-pivot] FATAL: Phase-3 ${pv_slug}: git ls-remote ${pv_branch} failed against a repo the API just reported present — that is a credential fault, not an empty repo (#5439)" >&2
                  sed -e 's,://[^@]*@,://***@,g' "${pv_scratch}/.pv-heads.err" >&2 || true
                  exit 1
                fi
                if ! grep -q "refs/heads/${pv_branch}" "${pv_scratch}/.pv-heads.txt"; then
                  echo "[vcluster-registry-pivot] Phase-3 ${pv_slug}: ${pv_repo} exists but has no ${pv_branch} branch — the per-Org tree has not been seeded yet"
                  pv_absent=$((pv_absent+1))
                  continue
                fi

                cd "${pv_scratch}"
                rm -rf repo-perorg-vc
                if ! git clone --depth 1 --branch "${pv_branch}" "${pv_url}" repo-perorg-vc >/dev/null 2>"${pv_scratch}/.pv-clone.err"; then
                  echo "[vcluster-registry-pivot] FATAL: Phase-3 ${pv_slug}: clone of ${pv_slug}/${pv_repo} branch ${pv_branch} failed (#5439)" >&2
                  sed -e 's,://[^@]*@,://***@,g' "${pv_scratch}/.pv-clone.err" >&2 || true
                  exit 1
                fi
                cd repo-perorg-vc

                {{- /*
                 THE REWRITE is a HOST-literal substitution, not a rewrite of
                 three named YAML paths. The generator renders every one of its
                 image references off ONE variable (VClusterImageRegistry), but
                 it renders them into DIFFERENT shapes — a bare `registry:`
                 scalar for the distro and syncer images, and a fully-qualified
                 `host/path:tag` for coredns — and it has gained fields before
                 (that is how #5439 came to exist one field over from #5527).
                 Replacing the HOST wherever it appears covers the shapes that
                 exist, the shapes that will be added, and the app manifests in
                 the same tree, while preserving every path and tag verbatim.
                 Idempotent by construction: after a successful run the literal
                 is gone, so a re-run matches nothing and produces no diff.
                */}}
                pv_list="${pv_scratch}/.pv-targets.txt"
                : > "${pv_list}"
                for pv_tree in ${PERORG_TREES:-vcluster}; do
                  [ -d "${pv_tree}" ] || continue
                  grep -rl "${MOTHERSHIP_HARBOR_HOST}" "${pv_tree}" 2>/dev/null >> "${pv_list}" || true
                done
                pv_edited=0
                for pvf in $(awk 'NF' "${pv_list}" | sort -u); do
                  sed -i "s,${MOTHERSHIP_HARBOR_HOST},${target_host},g" "${pvf}"
                  pv_edited=$((pv_edited+1))
                  echo "[vcluster-registry-pivot] Phase-3 edited ${pv_slug}/${pv_repo}@${pv_branch}:${pvf}"
                done

                {{- /*
                 Post-condition on the FILES, before anything is committed — the
                 RESULT of the rewrite, never the count of loop iterations that
                 were supposed to produce it.
                */}}
                pv_left_file="${pv_scratch}/.pv-left.txt"
                : > "${pv_left_file}"
                for pv_tree in ${PERORG_TREES:-vcluster}; do
                  [ -d "${pv_tree}" ] || continue
                  grep -rl "${MOTHERSHIP_HARBOR_HOST}" "${pv_tree}" 2>/dev/null >> "${pv_left_file}" || true
                done
                pv_left=$(grep -c . "${pv_left_file}" || true)
                if [ "${pv_left}" -ne 0 ]; then
                  echo "[vcluster-registry-pivot] FATAL: Phase-3 ${pv_slug}: ${pv_left} file(s) still reference ${MOTHERSHIP_HARBOR_HOST} after the rewrite — pushing now would record a durable pivot that does not exist (#5439)" >&2
                  sed 's,^,  STILL-MOTHERSHIP ,' "${pv_left_file}" >&2 || true
                  exit 1
                fi

                {{- /*
                 Commit on ACTUAL tree state, never on ${pv_edited}: a re-run
                 legitimately visits files and produces no diff, and gating on
                 the counter would turn that no-op into a hard failure on every
                 second run (the #6293 Phase-2b lesson).
                */}}
                if git diff --quiet; then
                  echo "[vcluster-registry-pivot] Phase-3 ${pv_slug}: already pivoted (${pv_edited} file-visit(s), no diff) — nothing to push"
                  pv_nodiff=$((pv_nodiff+1))
                else
                  git add -A .
                  if git diff --staged --quiet; then
                    echo "[vcluster-registry-pivot] FATAL: Phase-3 ${pv_slug}: the working tree has changes but the index is empty — \`git add\` is mis-scoped and this push would carry none of the rewrite (#5439)" >&2
                    exit 1
                  fi
                  git commit -m "cutover: pivot ${pv_edited} per-Org file(s) off ${MOTHERSHIP_HARBOR_HOST} to ${target_host}" >/dev/null
                  if ! pv_push_err=$(git push origin "HEAD:${pv_branch}" 2>&1); then
                    echo "[vcluster-registry-pivot] FATAL: Phase-3 ${pv_slug}: push to ${pv_branch} failed — this Org's vCluster keeps reverting to ${MOTHERSHIP_HARBOR_HOST} on every reconcile (#5439)" >&2
                    printf '%s\n' "${pv_push_err}" | sed -e 's,://[^@]*@,://***@,g' >&2
                    exit 1
                  fi
                  echo "[vcluster-registry-pivot] Phase-3 OK: pushed ${pv_edited} edit(s) to ${pv_slug}/${pv_repo} branch ${pv_branch}"
                  pv_pushed=$((pv_pushed+1))
                fi
                printf '%s\n' "${pv_slug}" >> "${pv_touched}"
                cd "${pv_scratch}"
              done

              pv_with_repo=$(grep -c . "${pv_touched}" || true)
              echo "[vcluster-registry-pivot] Phase-3: orgs=${pv_total} with-repo=${pv_with_repo} pushed=${pv_pushed} already-pivoted=${pv_nodiff} no-repo=${pv_absent}"

              {{- /*
               ── THE READ-BACK (Stage CONVERGE) ───────────────────────────────
               A durable rewrite is a CLAIM until the reconciler that owns the
               object has fetched it and re-applied it. Poll the LIVE per-Org
               HelmReleases until none carries the mothership host in
               spec.values, re-poking each cycle. Reaching the deadline with an
               offender still live is FATAL: a rewrite the owning Kustomization
               never applied is a pivot that does not exist, and this is exactly
               the leg where "pushed" would otherwise be mistaken for "pivoted".

               Scoped to the Orgs THIS phase touched, so an unrelated namespace
               is never this leg's failure. An enumeration that FAILS is not a
               clean sample — it returns non-zero and the poll keeps waiting,
               and the deadline then reports honestly that convergence was never
               OBSERVED rather than silently certifying it.
              */}}
              if [ "${pv_with_repo}" -eq 0 ]; then
                echo "[vcluster-registry-pivot] Phase-3 read-back SKIP: no Organization had a seeded ${pv_repo} tree, so there is no per-Org HelmRelease this phase could have changed (witness above shows the estate WAS read)"
              else
                pv_offenders() {
                  if ! kubectl get helmreleases.helm.toolkit.fluxcd.io -A \
                      -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"="}{.spec.values}{"\n"}{end}' \
                      > "${pv_scratch}/.pv-hrs.txt" 2>"${pv_scratch}/.pv-hrs.err"; then
                    return 2
                  fi
                  : > "${pv_scratch}/.pv-offenders.txt"
                  while IFS= read -r pv_line; do
                    [ -n "${pv_line}" ] || continue
                    pv_key="${pv_line%%=*}"
                    pv_vals="${pv_line#*=}"
                    case "${pv_vals}" in
                      *"${MOTHERSHIP_HARBOR_HOST}"*) : ;;
                      *) continue ;;
                    esac
                    pv_hrns="${pv_key%%/*}"
                    {{- /* Only the Orgs this phase pivoted. */}}
                    if grep -qx "${pv_hrns}" "${pv_touched}"; then
                      printf '%s\n' "${pv_key}" >> "${pv_scratch}/.pv-offenders.txt"
                    fi
                  done < "${pv_scratch}/.pv-hrs.txt"
                  {{- /*
                   Explicit if, never `[ -s f ] && return 1`: this whole script
                   runs under `set -eu`, and an AND-OR list is precisely the
                   shape whose exit-status semantics people get wrong. Spelling
                   it out costs two lines and removes the question.
                  */}}
                  if [ -s "${pv_scratch}/.pv-offenders.txt" ]; then
                    return 1
                  fi
                  return 0
                }

                pv_deadline="${PERORG_READBACK_DEADLINE:-300}"
                pv_start=$(date +%s)
                pv_converged=0
                pv_lastrc=9
                while [ $(($(date +%s) - pv_start)) -lt "${pv_deadline}" ]; do
                  {{- /*
                   `set -e` is ON. A bare `pv_offenders` call would TERMINATE the
                   step the first time it legitimately reports offenders — i.e.
                   the poll would die on the very state it exists to wait out.
                   The `&& rc=0 || rc=$?` form keeps the non-zero returns as
                   DATA, which is what they are here.
                  */}}
                  pv_offenders && pv_lastrc=0 || pv_lastrc=$?
                  if [ "${pv_lastrc}" -eq 0 ]; then
                    pv_converged=1
                    break
                  fi
                  if [ "${pv_lastrc}" -eq 2 ]; then
                    echo "  [vcluster-registry-pivot] Phase-3 read-back: HelmRelease enumeration failed ($(head -1 "${pv_scratch}/.pv-hrs.err" 2>/dev/null)) — a failed read is NOT a clean sample; retrying in 15s"
                  else
                    echo "  [vcluster-registry-pivot] Phase-3 read-back: $(grep -c . "${pv_scratch}/.pv-offenders.txt" || true) per-Org HelmRelease(s) still on ${MOTHERSHIP_HARBOR_HOST} at $(($(date +%s) - pv_start))s; re-poking the owning sources, re-checking in 15s (bounded ${pv_deadline}s)"
                  fi
                  for pv_slug in $(awk 'NF' "${pv_touched}"); do
                    kubectl annotate --overwrite "gitrepository/${pv_repo}-${pv_slug}" -n "${pv_ns}" \
                      "reconcile.fluxcd.io/requestedAt=$(date +%s)" >/dev/null 2>&1 || true
                  done
                  sleep 15
                done
                if [ "${pv_converged}" -ne 1 ]; then
                  echo "[vcluster-registry-pivot] FATAL: Phase-3 read-back did not converge within ${pv_deadline}s (last enumeration rc=${pv_lastrc}) — the durable rewrite was pushed but the owning Kustomization has not re-applied it, so the per-Org vCluster image registry is still the mothership Harbor. Pillar 5 independence not met (#5439)" >&2
                  sed 's,^,  RESIDUAL-PERORG-TETHER ,' "${pv_scratch}/.pv-offenders.txt" >&2 2>/dev/null || true
                  exit 1
                fi
                echo "[vcluster-registry-pivot] Phase-3 read-back PASS: 0 per-Org HelmRelease(s) on ${MOTHERSHIP_HARBOR_HOST} across ${pv_with_repo} pivoted Organization(s) — the rewrite was fetched and re-applied by the owning reconciler"
              fi
            fi
            # ---- perorg-vcluster-pivot END ----

            echo "[vcluster-registry-pivot] step complete"
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits:   { memory: 384Mi }
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
    volumes:
      - name: tmp
        emptyDir: {}
