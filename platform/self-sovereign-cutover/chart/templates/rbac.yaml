{{- /*
RBAC for the cutover runner ServiceAccount.

CRITICAL — feedback_rbac_create_no_resourcenames.md (auto-memory anchor):
Kubernetes RBAC forbids combining `create` verbs with `resourceNames`.
A POST request has no resource name yet; the apiserver MUST evaluate the
rule against the request without a name match, and a `resourceNames` set
with `create` produces a 403 every time. This caused the bp-openbao
6+ provisioning loop. We split `create` into its own Rule with NO
`resourceNames` and keep `update/patch/get/delete` in a separate Rule
that may be name-scoped.

The cutover runner needs cluster-scope reach because:
  - Step 02 reads bp-harbor admin Secret in `harbor` namespace.
  - Step 02 reads ghcr-pull Secret in `flux-system` namespace.
  - Step 03 only writes to local Harbor over HTTP (no K8s API).
  - Step 05 reads the `catalyst-gitea-token` PAT in `catalyst-system`,
    CREATES the basic-auth Secret `cutover-gitea-git-auth` in
    `flux-system`, and patches GitRepository (URL + secretRef) in
    `flux-system` so the post-pivot local-Gitea clone authenticates (#3536).
  - Step 06 patches HelmRepositories in `flux-system` namespace, AND
    (phase-0, #1184) merges harbor.<sov-fqdn> auth into the ghcr-pull
    Secret in `flux-system` so source-controller can pull from the
    per-Sovereign Harbor mirror without manual kubectl patch. It ALSO
    (phase-0.5, #3379) READS the in-cluster Harbor wildcard TLS Secret in
    `kube-system` and CREATES/patches a ca.crt-only Secret
    (`cutover-harbor-ca`) in `flux-system`, then patches each pivoted
    HelmRepository's spec.certSecretRef to it so source-controller TRUSTS
    the LE-staging in-cluster registry (Flux OCI HRs have no
    insecureSkipVerify — certSecretRef is the only trust mechanism). Both
    the cross-namespace Secret read and the Secret create/patch are already
    covered by the cluster-scoped secrets get/create/patch rules below.
  - Step 07 patches the catalyst-api Deployment in `catalyst-system` and
    (#4996) runs pre-roll safety gates: reads node EVS zone labels + PVCs +
    VolumeAttachments, cordons a broken-CSI node, and force-deletes the stale
    RWO-EVS VolumeAttachment that Multi-Attach-deadlocks a Recreate roll (#4972).
  - Step 08 creates+deletes a CiliumNetworkPolicy cluster-wide, queries
    HelmRelease/Kustomization status across all namespaces, AND (#3526)
    force-reconciles the GitRepository + bootstrap-kit Kustomization so
    Step-06's durable git-push lands before the HelmRepository-pivot
    assertion — needs kustomizations {update,patch} for the reconcile
    annotation. (#3647) It ALSO force-deletes ONE openova-io-imaged Pod
    under the deny-egress hold and watches its replacement reach Running
    to prove a FRESH image pull resolves through local Harbor — needs
    pods {delete} + replicasets {get,list} (pod→Deployment ownership map).
  - Registry-pivot DaemonSet (step 04, #4639 Dragonfly rewrite) writes the
    containerd `_default/hosts.toml` catch-all on the host filesystem
    (hostPath → the node-local dfdaemon proxy), patches the bp-dragonfly
    dfdaemon ConfigMap upstream + DaemonSet/StatefulSet hostAliases, reads
    the cilium-gateway Service ClusterIP, and writes per-node acks +
    the cluster-wide flip guard on the cutover-status ConfigMap. The #4652
    finisher ADDS two coupled moves: (a) it patches/creates the kube-system
    `coredns-custom` ConfigMap with a `registry.<fqdn> -> gateway ClusterIP`
    `*.server` block (no fallthrough) and EXECs `grep` in the Running CoreDNS
    pod to confirm the CM-volume sync before trusting the override; (b) it
    READS the in-cluster Harbor wildcard TLS Secret in `kube-system` and
    CREATES/patches/deletes an Opaque `dragonfly-harbor-ca` Secret (tls.crt)
    in the `dragonfly` namespace so bp-dragonfly mounts it for the dfdaemon
    `registryMirror.cert` trust anchor. The ConfigMap create/patch, Secret
    read/create/patch/delete, and pods/exec verbs below cover these.

We use ClusterRole + ClusterRoleBinding because the namespaces touched
are heterogeneous and cluster-scoped resources (CiliumNetworkPolicy)
must be addressable.
*/ -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
  labels:
    {{- include "bp-self-sovereign-cutover.labels" . | nindent 4 }}
rules:
  # ───────────────────────────────────────────────────────────────
  # CREATE verbs — MUST be in their own Rule WITHOUT resourceNames.
  # ───────────────────────────────────────────────────────────────
  - apiGroups: [""]
    resources: ["configmaps"]   # cutover-status ConfigMap is created+updated by every step
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]   # step 05 (#3536) creates the flux-system basic-auth Secret (cutover-gitea-git-auth) wired into GitRepository.spec.secretRef so the post-pivot local-Gitea clone authenticates
    verbs: ["create"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies"]   # step 08 creates + tears down the cluster-wide egress-block policy (#2940)
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["events"]   # informational events posted as steps complete
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]   # catalyst-api stamps Jobs in this namespace from step ConfigMaps
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/exec"]   # #4652 (Refs #4641): registry-pivot DaemonSet execs `grep` in the Running CoreDNS pod to confirm the coredns-custom CM-volume sync completed BEFORE trusting the registry.<fqdn>->ClusterIP override (the patch-then-sync sequencing — restart races the stale mount)
    verbs: ["create", "get"]
  - apiGroups: ["pkg.crossplane.io"]
    resources: ["imageconfigs"]   # step 11 (#5204) creates the ImageConfig that binds the pivoted matchImages prefixes to the local-Harbor package-pull Secret so the Crossplane package manager authenticates post-cutover
    verbs: ["create"]

  # ───────────────────────────────────────────────────────────────
  # READ verbs — namespace-spanning per the step inventory above.
  # ───────────────────────────────────────────────────────────────
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]   # step 08 inspects pod status during the egress block window
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]   # step 08 (#3647) maps the freshly-created Pod back to its owning Deployment for the fresh-pull-under-deny-egress proof
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "helmrepositories", "ocirepositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]   # registry-pivot DaemonSet reports node status into the status ConfigMap; step 07 (#4996) reads node EVS zone labels to spot a broken-CSI node
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]   # step 07 (#4996) maps catalyst-api's PVCs -> PV names to scope the EVS detach-gate to catalyst-api's OWN volumes; step 08 (#5091) rule-c reads each roll candidate's PVC accessModes + storageClassName to skip RWO-EVS stateful singletons
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]   # step 08 (#5091) rule-c resolves a candidate PVC's BOUND PV to read .spec.csi.driver (the storageClass-independent EVS-detection leg, so a PVC with an empty storageClassName is still caught)
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]   # step 07 (#4996) enumerates VolumeAttachments to find + clear the STALE RWO-EVS attachment that Multi-Attach-deadlocks a Recreate roll (#4972)
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]   # #4639 (Refs #4637): registry-pivot DaemonSet resolves the cilium-gateway Service ClusterIP (node-routable, serves registry.<fqdn> wildcard TLS + token realm) for the dfdaemon hostAlias instead of the un-hairpinnable public gateway EIP
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]   # #5359 step-05 secondary leg: annotate gitea-http with service.cilium.io/global+shared so the region-B zero-backend alias resolves it over ClusterMesh; without patch the annotate 403s and every 2-region cutover dies at the step-05 Ready wait
    resourceNames: ["gitea-http"]
    verbs: ["patch", "update"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]   # step 06 Phase -1 (#1871, chart 0.1.32): wait for cilium-gateway Programmed=True before URL rewrite
    verbs: ["get", "list", "watch"]
  - apiGroups: ["pkg.crossplane.io"]
    resources: ["providers", "imageconfigs"]   # step 11 (TBD-V24 MISS-3, chart 0.1.37): pivot Provider.spec.package off xpkg.upbound.io; #5204 reads/applies the ImageConfig that authenticates the local-Harbor package pull
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]   # step 11 probes for providers.pkg.crossplane.io CRD presence before patching
    verbs: ["get", "list", "watch"]

  # ───────────────────────────────────────────────────────────────
  # UPDATE / PATCH / DELETE — separate from create per RBAC rule.
  # ───────────────────────────────────────────────────────────────
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["update", "patch"]   # step 06 phase-0 merges harbor.<sov-fqdn> auth into ghcr-pull (#1184)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]   # step 08 (#3647) force-deletes ONE openova-io-imaged Pod under deny-egress; step 07 (#4996) drains the catalyst-api pod off a broken-CSI node before the roll (drain-old-pod-first, #4972)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]   # step 07 (#4996) cordons a broken-CSI node (missing the EVS zone label) so the Recreate roll can't place catalyst-api where RWO-EVS attach would Multi-Attach deadlock (#4972)
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["delete"]   # step 07 (#4996) force-detaches the STALE catalyst-api RWO-EVS attachment (its owning pod is gone) that deadlocks the new Recreate pod on Multi-Attach (#4972)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete"]   # #4652 (Refs #4641): registry-pivot rollback (v1) deletes the dragonfly-namespace dragonfly-harbor-ca Secret it created for the dfdaemon registryMirror.cert trust anchor (best-effort, paired with the addr/cert revert)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["update", "patch"]   # step 07 sets env on catalyst-api deployment
  - apiGroups: ["apps"]
    resources: ["daemonsets", "statefulsets"]
    verbs: ["update", "patch"]   # step 08 (#3695) rolls EVERY external-registry workload under deny-egress to prove fresh-pullability — kubectl rollout restart patches the workload's pod template; AND step 04 (#4639) patches the bp-dragonfly dfdaemon DaemonSet + seed-peer StatefulSet hostAliases (registry.<fqdn> -> cilium-gateway ClusterIP) + restartedAt for the Dragonfly upstream flip
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "helmrepositories"]
    verbs: ["update", "patch"]   # steps 05 + 06
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["update", "patch"]   # step 06 phase-1.6 (catalog override) + step 10 vcluster-registry-pivot (TBD-V24 MISS-1)
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["update", "patch"]   # step 08 (#3526) force-reconciles the bootstrap-kit Kustomization so Step-06's durable git-push lands before the pivot assertion (the annotate reconcile.fluxcd.io/requestedAt patch)
  - apiGroups: ["pkg.crossplane.io"]
    resources: ["providers", "imageconfigs"]
    verbs: ["update", "patch"]   # step 11 crossplane-provider-pivot (TBD-V24 MISS-3); #5204 patches the ImageConfig on re-run (kubectl apply)
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["delete", "patch", "update"]   # step 08 removes the policy at end-of-test
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "delete"]   # G75 #2622: step 01 deletes gitea-mirror-resync CronJob to sever upstream git tether (ADR-0002 Pillar 5)

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
  labels:
    {{- include "bp-self-sovereign-cutover.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
