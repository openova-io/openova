{{- /*
RBAC for the cutover runner ServiceAccount.

CRITICAL — feedback_rbac_create_no_resourcenames.md (auto-memory anchor):
Kubernetes RBAC forbids combining `create` verbs with `resourceNames`.
A POST request has no resource name yet; the apiserver MUST evaluate the
rule against the request without a name match, and a `resourceNames` set
with `create` produces a 403 every time. This caused the bp-openbao
6+ provisioning loop. We split `create` into its own Rule with NO
`resourceNames` and keep `update/patch/get/delete` in a separate Rule
that may be name-scoped.

The cutover runner needs cluster-scope reach because:
  - Step 02 reads bp-harbor admin Secret in `harbor` namespace.
  - Step 02 reads ghcr-pull Secret in `flux-system` namespace.
  - Step 03 only writes to local Harbor over HTTP (no K8s API).
  - Step 05 reads the `catalyst-gitea-token` PAT in `catalyst-system`,
    CREATES the basic-auth Secret `cutover-gitea-git-auth` in
    `flux-system`, and patches GitRepository (URL + secretRef) in
    `flux-system` so the post-pivot local-Gitea clone authenticates (#3536).
  - Step 06 patches HelmRepositories in `flux-system` namespace, AND
    (phase-0, #1184) merges harbor.<sov-fqdn> auth into the ghcr-pull
    Secret in `flux-system` so source-controller can pull from the
    per-Sovereign Harbor mirror without manual kubectl patch.
  - Step 07 patches Deployment in `catalyst-platform` namespace.
  - Step 08 creates+deletes a CiliumNetworkPolicy cluster-wide, queries
    HelmRelease/Kustomization status across all namespaces, AND (#3526)
    force-reconciles the GitRepository + bootstrap-kit Kustomization so
    Step-06's durable git-push lands before the HelmRepository-pivot
    assertion — needs kustomizations {update,patch} for the reconcile
    annotation. (#3647) It ALSO force-deletes ONE openova-io-imaged Pod
    under the deny-egress hold and watches its replacement reach Running
    to prove a FRESH image pull resolves through local Harbor — needs
    pods {delete} + replicasets {get,list} (pod→Deployment ownership map).
  - Registry-pivot DaemonSet writes to /etc/rancher/k3s/registries.yaml
    on the host filesystem (hostPath, no K8s API needed beyond status
    update on the cutover-status ConfigMap).

We use ClusterRole + ClusterRoleBinding because the namespaces touched
are heterogeneous and cluster-scoped resources (CiliumNetworkPolicy)
must be addressable.
*/ -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
  labels:
    {{- include "bp-self-sovereign-cutover.labels" . | nindent 4 }}
rules:
  # ───────────────────────────────────────────────────────────────
  # CREATE verbs — MUST be in their own Rule WITHOUT resourceNames.
  # ───────────────────────────────────────────────────────────────
  - apiGroups: [""]
    resources: ["configmaps"]   # cutover-status ConfigMap is created+updated by every step
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]   # step 05 (#3536) creates the flux-system basic-auth Secret (cutover-gitea-git-auth) wired into GitRepository.spec.secretRef so the post-pivot local-Gitea clone authenticates
    verbs: ["create"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies"]   # step 08 creates + tears down the cluster-wide egress-block policy (#2940)
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["events"]   # informational events posted as steps complete
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]   # catalyst-api stamps Jobs in this namespace from step ConfigMaps
    verbs: ["create"]

  # ───────────────────────────────────────────────────────────────
  # READ verbs — namespace-spanning per the step inventory above.
  # ───────────────────────────────────────────────────────────────
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]   # step 08 inspects pod status during the egress block window
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]   # step 08 (#3647) maps the freshly-created Pod back to its owning Deployment for the fresh-pull-under-deny-egress proof
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "helmrepositories", "ocirepositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]   # registry-pivot DaemonSet reports node status into the status ConfigMap
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]   # step 06 Phase -1 (#1871, chart 0.1.32): wait for cilium-gateway Programmed=True before URL rewrite
    verbs: ["get", "list", "watch"]
  - apiGroups: ["pkg.crossplane.io"]
    resources: ["providers"]   # step 11 (TBD-V24 MISS-3, chart 0.1.37): pivot Provider.spec.package off xpkg.upbound.io
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]   # step 11 probes for providers.pkg.crossplane.io CRD presence before patching
    verbs: ["get", "list", "watch"]

  # ───────────────────────────────────────────────────────────────
  # UPDATE / PATCH / DELETE — separate from create per RBAC rule.
  # ───────────────────────────────────────────────────────────────
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["update", "patch"]   # step 06 phase-0 merges harbor.<sov-fqdn> auth into ghcr-pull (#1184)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]   # step 08 (#3647) force-deletes ONE openova-io-imaged Pod under deny-egress to prove a fresh image pull resolves through local Harbor (the ReplicaSet recreates it; only a single Pod is bounced)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["update", "patch"]   # step 07 sets env on catalyst-api deployment
  - apiGroups: ["apps"]
    resources: ["daemonsets", "statefulsets"]
    verbs: ["update", "patch"]   # step 08 (#3695) rolls EVERY external-registry workload under deny-egress to prove fresh-pullability — kubectl rollout restart patches the workload's pod template
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "helmrepositories"]
    verbs: ["update", "patch"]   # steps 05 + 06
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["update", "patch"]   # step 06 phase-1.6 (catalog override) + step 10 vcluster-registry-pivot (TBD-V24 MISS-1)
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["update", "patch"]   # step 08 (#3526) force-reconciles the bootstrap-kit Kustomization so Step-06's durable git-push lands before the pivot assertion (the annotate reconcile.fluxcd.io/requestedAt patch)
  - apiGroups: ["pkg.crossplane.io"]
    resources: ["providers"]
    verbs: ["update", "patch"]   # step 11 crossplane-provider-pivot (TBD-V24 MISS-3)
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["delete", "patch", "update"]   # step 08 removes the policy at end-of-test
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "delete"]   # G75 #2622: step 01 deletes gitea-mirror-resync CronJob to sever upstream git tether (ADR-0002 Pillar 5)

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
  labels:
    {{- include "bp-self-sovereign-cutover.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
