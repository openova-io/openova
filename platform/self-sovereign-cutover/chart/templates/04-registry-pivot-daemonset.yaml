{{- /*
Step 04 — registry-pivot (Dragonfly rewrite, #4639 Refs #4637).

This step is a DaemonSet, not a Job. The consumer (catalyst-api,
issue #792) handles this via mode=daemonset-wait: when the cutover
hits this step, it waits for the DaemonSet's
`status.numberReady == status.desiredNumberScheduled` AND the per-node
`node.<NODE>.registriesYaml=v2` acks (#3671) on the cutover-status
ConfigMap, then treats that as step success. The DaemonSet is shipped
HERE by the chart so it is already running by the time catalyst-api
stamps the wait.

WHAT CHANGED (#4639) — Dragonfly, not the hand-rolled hairpin hack
──────────────────────────────────────────────────────────────────
The legacy step-04 wrote /etc/rancher/k3s/registries.yaml + regenerated
the containerd certs.d/<host>/hosts.toml mirror dir to redirect the 7
canonical upstreams through the in-cluster Harbor's PUBLIC host
(registry.<fqdn>). That host DNS-resolves on the NODE to the cluster's
PUBLIC gateway EIP (the cloudinit /etc/hosts pin). On a cloud whose nodes
cannot hairpin to their own public EIP (Huawei kom4dc) the kubelet pull
i/o-timed-out and the cutover wedged at step-07 (#4637). Every prior
workaround (the ClusterIP rewrite, the `30443`/DNAT surgery, per-cloud
`if Hetzner/Huawei` branches) was a symptom of that one bad assumption.

Dragonfly (`bp-dragonfly`, slot 06) removes the assumption. Every node's
containerd already mirrors through the LOCAL dfdaemon proxy on
`127.0.0.1:{{ .Values.registryPivot.dragonfly.proxyPort }}` (a standard,
documented containerd mirror — the node→127.0.0.1 path is IDENTICAL on
every cloud, zero per-cloud branches). dfdaemon fetches each blob from
its configured upstream ONCE per cluster and serves the rest P2P. So the
cutover is now THREE generic moves, all of which this DaemonSet performs
on the live node when it sees registriesYamlActive=v2:

  1. CONTAINERD → dfdaemon. Write a containerd certs.d `_default/hosts.toml`
     catch-all that mirrors EVERY registry namespace through
     `http://127.0.0.1:{{ .Values.registryPivot.dragonfly.proxyPort }}`
     (the dfdaemon proxy). containerd re-reads certs.d PER PULL, so this
     takes effect on the RUNNING node with NO k3s restart — the same
     live-certs.d mechanism the legacy step relied on (#3647), but the
     endpoint is the node-LOCAL dfdaemon, never the un-hairpinnable EIP.
     (When bp-dragonfly's own `dfinit` is enabled the node already carries
     this mirror at boot; this write is then a harmless idempotent re-state.)

  2. dfdaemon UPSTREAM FLIP. Patch the `{{ .Values.registryPivot.dragonfly.clientConfigMap }}`
     ConfigMap (and the seed-peer's) `proxy.registryMirror.addr` from
     `https://ghcr.io` → the cluster-LOCAL Harbor public host
     (`https://registry.<fqdn>:{{ .Values.registryPivot.dragonfly.gatewayHTTPSPort }}`).
     This is the design's "one-line upstream flip": post-cutover dfdaemon
     back-to-sources to the LOCAL Harbor, never ghcr.

  3. HOSTALIAS (the #4637 root kill). dfdaemon is hostNetwork, so it
     inherits the node's `registry.<fqdn> → public-EIP` pin and would
     hairpin on the upstream fetch — AND on the token-realm follow-up
     (Harbor answers `Www-Authenticate: Bearer realm="https://registry.
     <fqdn>:{{ .Values.registryPivot.dragonfly.gatewayHTTPSPort }}/service/token"`,
     which the client must also reach). Adding a Kubernetes `hostAliases`
     entry `registry.<fqdn> → <cilium-gateway ClusterIP>` to the dfdaemon
     (+ seed) pod template makes BOTH the `/v2/` fetch and the token-realm
     fetch resolve to the cluster's node-routable Cilium-gateway ClusterIP
     (kube-proxy/cilium program it on the host net) instead of the public
     EIP. The gateway terminates the wildcard `*.<fqdn>` TLS and routes
     `registry.<fqdn>` to Harbor — token realm included — so the whole
     registry handshake stays in-cluster. PROVEN live on the kom4dc
     `omantel.biz` env: from a hostNetwork context the public-host fetch
     i/o-timed-out (curl 28) while the same fetch with `registry.<fqdn>`
     resolved to the gateway ClusterIP returned the registry 401 challenge
     + a 200 from `/service/token`.

Moves 2 + 3 are CLUSTER-wide (one ConfigMap / one DaemonSet template), so
the DaemonSet performs them ONCE, guarded by a status flag, on whichever
node converges first; every node still independently performs move 1 on
its own containerd and writes its own per-node ack.

ROLLBACK (v1): remove the `_default/hosts.toml` catch-all (restore the
node's pre-cutover containerd behaviour) and revert the dfdaemon upstream
+ hostAlias to ghcr. Idempotent across restarts.

Image phase: pre.
*/ -}}
{{- if .Values.registryPivot.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry-pivot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-self-sovereign-cutover.labels" . | nindent 4 }}
    app.kubernetes.io/component: cutover-daemonset
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cutover-daemonset
      catalyst.openova.io/blueprint: bp-self-sovereign-cutover
  template:
    metadata:
      labels:
        {{- include "bp-self-sovereign-cutover.labels" . | nindent 8 }}
        app.kubernetes.io/component: cutover-daemonset
    spec:
      serviceAccountName: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: pivot
          image: {{ include "bp-self-sovereign-cutover.image" (dict "repository" .Values.images.hostExec.repository "tag" .Values.images.hostExec.tag "cutoverPhase" "pre" "Values" .Values) }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: HARBOR_PUBLIC_URL
              value: {{ .Values.sovereign.harborPublicURL | quote }}
            - name: STATUS_CONFIGMAP_NAME
              value: {{ .Values.status.configMapName | quote }}
            - name: STATUS_CONFIGMAP_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            # ── Dragonfly coordinates (the #4639 rewrite) ──────────────────
            # The dfdaemon proxy every node's containerd mirrors through.
            - name: DF_PROXY_PORT
              value: {{ .Values.registryPivot.dragonfly.proxyPort | quote }}
            # The bp-dragonfly mesh namespace + the per-node dfdaemon
            # DaemonSet + seed-peer + their config ConfigMaps the upstream
            # flip + hostAlias patch target.
            - name: DF_NAMESPACE
              value: {{ .Values.registryPivot.dragonfly.namespace | quote }}
            - name: DF_CLIENT_DAEMONSET
              value: {{ .Values.registryPivot.dragonfly.clientDaemonSet | quote }}
            - name: DF_CLIENT_CONFIGMAP
              value: {{ .Values.registryPivot.dragonfly.clientConfigMap | quote }}
            - name: DF_SEED_STATEFULSET
              value: {{ .Values.registryPivot.dragonfly.seedStatefulSet | quote }}
            - name: DF_SEED_CONFIGMAP
              value: {{ .Values.registryPivot.dragonfly.seedConfigMap | quote }}
            # The node-routable Cilium gateway Service whose ClusterIP serves
            # registry.<fqdn> (wildcard TLS + token realm). The hostAlias maps
            # registry.<fqdn> → this ClusterIP so dfdaemon's hostNetwork pull
            # never hairpins to the public EIP. The gateway HTTPS listener port
            # is the canonical Catalyst NodePort (SOVEREIGN_GATEWAY_HTTPS_PORT).
            - name: GATEWAY_SERVICE_NAME
              value: {{ .Values.registryPivot.dragonfly.gatewayServiceName | quote }}
            - name: GATEWAY_SERVICE_NAMESPACE
              value: {{ .Values.registryPivot.dragonfly.gatewayServiceNamespace | quote }}
            - name: GATEWAY_HTTPS_PORT
              value: {{ .Values.registryPivot.dragonfly.gatewayHTTPSPort | quote }}
            - name: DF_RESTART_ON_FLIP
              value: {{ .Values.registryPivot.dragonfly.restartOnFlip | quote }}
            # The Sovereign FQDN — the CoreDNS override server block keys on
            # registry.<fqdn> and the wildcard-TLS Secret name is
            # <prefix><fqdn-dashed>. Sourced from the chart's sovereign.fqdn
            # (cloud-init substitutes ${SOVEREIGN_FQDN} via the 06a overlay).
            - name: SOVEREIGN_FQDN
              value: {{ .Values.sovereign.fqdn | quote }}
            # ── #4652 CoreDNS-to-ClusterIP override (the DNS fix) ──────────────
            # The hostAlias is insufficient for the Rust dfdaemon resolver: it
            # returns the public EIP first → hairpin → timeout. We rewrite
            # CoreDNS so registry.<fqdn> resolves cluster-internally to the
            # cilium-gateway ClusterIP ONLY (no fallthrough → the EIP is never
            # returned). Proven github-ipv4 `coredns-custom` `*.server` mechanism.
            - name: COREDNS_OVERRIDE_ENABLED
              value: {{ .Values.registryPivot.dragonfly.coredns.enabled | quote }}
            - name: COREDNS_CM_NAME
              value: {{ .Values.registryPivot.dragonfly.coredns.configMapName | quote }}
            - name: COREDNS_CM_NAMESPACE
              value: {{ .Values.registryPivot.dragonfly.coredns.configMapNamespace | quote }}
            - name: COREDNS_SERVER_KEY
              value: {{ .Values.registryPivot.dragonfly.coredns.serverKey | quote }}
            - name: COREDNS_DEPLOYMENT
              value: {{ .Values.registryPivot.dragonfly.coredns.deploymentName | quote }}
            - name: COREDNS_DEPLOYMENT_NAMESPACE
              value: {{ .Values.registryPivot.dragonfly.coredns.deploymentNamespace | quote }}
            - name: COREDNS_SYNC_TIMEOUT_SECONDS
              value: {{ .Values.registryPivot.dragonfly.coredns.syncTimeoutSeconds | quote }}
            # ── #4652 dfdaemon registryMirror.cert (the x509 fix) ─────────────
            # Read the in-cluster Harbor wildcard TLS Secret, create a dragonfly-
            # namespace Opaque Secret carrying tls.crt (bp-dragonfly 0.1.1 mounts
            # it OPTIONALLY at HARBOR_CA_MOUNT_PATH), and set
            # proxy.registryMirror.cert = <mount>/<file> in the dfdaemon ConfigMap
            # patch that flips registryMirror.addr. Same tls.crt-fallback as #3379.
            - name: HARBOR_CA_ENABLED
              value: {{ .Values.registryPivot.dragonfly.harborCA.enabled | quote }}
            - name: HARBOR_CA_SRC_NAMESPACE
              value: {{ .Values.registryPivot.dragonfly.harborCA.sourceNamespace | quote }}
            - name: HARBOR_CA_SRC_NAME_PREFIX
              value: {{ .Values.registryPivot.dragonfly.harborCA.sourceNamePrefix | quote }}
            - name: HARBOR_CA_DEST_SECRET
              value: {{ .Values.registryPivot.dragonfly.harborCA.destSecretName | quote }}
            - name: HARBOR_CA_MOUNT_PATH
              value: {{ .Values.registryPivot.dragonfly.harborCA.certMountPath | quote }}
            - name: HARBOR_CA_FILE_NAME
              value: {{ .Values.registryPivot.dragonfly.harborCA.certFileName | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # #4637 follow-up: the dfdaemon-serving probe must reach the NODE's
            # dfdaemon, but this pod is NOT hostNetwork — so its 127.0.0.1 is the
            # pod loopback, never the node's :DF_PROXY_PORT. The dfdaemon binds
            # 0.0.0.0:DF_PROXY_PORT (hostNetwork), so HOST_IP:DF_PROXY_PORT is
            # reachable from this pod. (containerd still pulls via 127.0.0.1 in
            # the NODE netns — that is correct and unchanged.)
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          # readinessProbe: the script touches /tmp/ready after its first
          # successful reconcile pass. catalyst-api's daemonset-wait
          # then sees numberReady=desired and proceeds.
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/ready"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            # #3647/#4639: the containerd certs.d host-mirror dir. The pivot
            # loop writes the `_default/hosts.toml` catch-all that points
            # containerd at the node-local dfdaemon proxy; containerd re-reads
            # it per-pull so the pivot is effective on the RUNNING node.
            - name: containerd-certs-d
              mountPath: /host/var/lib/rancher/k3s/agent/etc/containerd/certs.d
            - name: pivot-script
              mountPath: /usr/local/bin/pivot.sh
              subPath: pivot.sh
              readOnly: true
          command: ["/bin/sh", "/usr/local/bin/pivot.sh"]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { memory: 128Mi }
      volumes:
        # #3647/#4639: containerd host-mirror dir (k3s default data-dir; no
        # --data-dir override in cloudinit-control-plane.tftpl). containerd
        # re-reads <ns>/hosts.toml here on every pull, so writing the
        # `_default/hosts.toml` catch-all makes the dfdaemon mirror effective
        # on a RUNNING node — no k3s restart, no node reboot.
        - name: containerd-certs-d
          hostPath:
            path: /var/lib/rancher/k3s/agent/etc/containerd/certs.d
            type: DirectoryOrCreate
        - name: pivot-script
          configMap:
            name: registry-pivot-script
            defaultMode: 0755
---
# Step ConfigMap for catalyst-api consumer (mode=daemonset-wait).
# The handler resolves the DaemonSet name from the `bp.openova.io/cutover-daemonset`
# label; we set it explicitly so the lookup is stable even if the cm
# name convention changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cutover-step-04-registry-pivot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-self-sovereign-cutover.labels" . | nindent 4 }}
    app.kubernetes.io/component: cutover-step
    bp.openova.io/cutover-order: "4"
    bp.openova.io/cutover-mode: "daemonset-wait"
    bp.openova.io/cutover-daemonset: "registry-pivot"
data:
  stepName: registry-pivot
  # podSpec is intentionally absent — mode=daemonset-wait does NOT use it.
  # Catalyst-api's parser tolerates absent podSpec when mode!=job.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-pivot-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-self-sovereign-cutover.labels" . | nindent 4 }}
    app.kubernetes.io/component: cutover-daemonset
data:
  pivot.sh: |
    #!/bin/sh
    # shellcheck disable=SC2086  # ${CT} (= "--max-time 20") is word-split ON PURPOSE so the two tokens become separate curl args; quoting it would pass a single bad arg.
    # registry-pivot reconcile loop (Dragonfly rewrite, #4639 Refs #4637).
    # Reads registriesYamlActive from the cutover-status ConfigMap; when the
    # value changes:
    #   v2 → (a) write the containerd `_default/hosts.toml` catch-all that
    #            mirrors EVERY registry namespace through the node-local
    #            dfdaemon proxy http://127.0.0.1:${DF_PROXY_PORT};
    #        (b) ONCE (cluster-wide, guarded): flip the dfdaemon (+ seed)
    #            registryMirror.addr ghcr → the local Harbor, add a
    #            registry.<fqdn> → cilium-gateway ClusterIP hostAlias, and
    #            bounce dfdaemon so it reloads.
    #   v1/rollback → remove the catch-all + revert the dfdaemon upstream/alias.
    #
    # NB on `set -u` (NOT `set -eu`): this is a long-running best-effort
    # RECONCILE LOOP — every apiserver call is already individually guarded
    # (--max-time + `|| true` / `&& … || …` fallbacks) and a transient miss is
    # MEANT to be retried on the next 15s sweep, never to abort the loop. Under
    # `errexit` any guarded sub-command that legitimately exits non-zero (a
    # best-effort ack that 409s, a `[ test ]` that is false at the tail of an
    # `&&` chain) would kill the whole DaemonSet pod and the per-node pivot
    # would silently stall. `set -u` keeps unset-variable protection (the real
    # footgun) without the errexit fragility. The daemonset-wait + per-node ack
    # contract is unchanged.
    set -u

    apk add --no-cache curl jq >/dev/null 2>&1 || true

    api="https://kubernetes.default.svc"
    token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    cacert=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    cm_url="${api}/api/v1/namespaces/${STATUS_CONFIGMAP_NAMESPACE}/configmaps/${STATUS_CONFIGMAP_NAME}"
    # EVERY apiserver call carries --max-time so a kom4dc network blip FAIL-FASTs
    # instead of wedging the reconcile loop forever (a stuck-but-alive connection
    # never trips curl's -f). 20s is generous for an in-cluster apiserver call;
    # the 15s sweep retries any miss. Word-split intentionally ($CT not quoted).
    CT="--max-time 20"

    # containerd host-mirror dir, mounted from the host. containerd re-reads
    # certs.d/<ns>/hosts.toml PER PULL, so writing the `_default` catch-all
    # here makes new pulls hit the local dfdaemon immediately — no k3s restart.
    certs_d=/host/var/lib/rancher/k3s/agent/etc/containerd/certs.d
    df_proxy="http://127.0.0.1:${DF_PROXY_PORT}"
    last_state=""

    # ── helpers ────────────────────────────────────────────────────────────

    # The dfdaemon upstream the cutover flips TO: the cluster-LOCAL Harbor's
    # public host, on the canonical gateway HTTPS port. dfdaemon resolves this
    # host via the hostAlias we add (→ cilium-gateway ClusterIP), so the
    # `:PORT` here MUST match the realm Harbor reflects (EXT_ENDPOINT host +
    # the port the request carries) — keeping the token-realm follow-up on the
    # same node-routable endpoint.
    harbor_host=$(printf '%s' "${HARBOR_PUBLIC_URL}" | sed -E 's,^https?://,,; s,/$,,')
    local_upstream="https://${harbor_host}:${GATEWAY_HTTPS_PORT}"

    # #4652 — the PEM path bp-dragonfly (0.1.1) mounts the Harbor wildcard cert
    # at on the dfdaemon (+ seed); set as proxy.registryMirror.cert so the Rust
    # resolver trusts the LE-staging in-cluster Harbor on the back-to-source
    # pull. Empty when HARBOR_CA_ENABLED is off → addr-only flip (no cert line).
    local_cert_path="${HARBOR_CA_MOUNT_PATH}/${HARBOR_CA_FILE_NAME}"
    # The wildcard TLS Secret name = <prefix><fqdn with '.'->'-'> (mirrors the
    # #3379 helmRepositoryTrust source-secret derivation). The registry-pivot
    # reads it from HARBOR_CA_SRC_NAMESPACE and materialises HARBOR_CA_DEST_SECRET
    # (carrying tls.crt) in the dragonfly namespace for the optional mount.
    fqdn_dashed=$(printf '%s' "${SOVEREIGN_FQDN}" | tr '.' '-')
    wildcard_secret="${HARBOR_CA_SRC_NAME_PREFIX}${fqdn_dashed}"

    # Write (v2) or remove (v1) the containerd `_default/hosts.toml` catch-all
    # that mirrors every registry namespace through the node-local dfdaemon
    # proxy. `_default` is the containerd wildcard host-config dir — it applies
    # to ANY registry that has no explicit certs.d/<host> dir, so a single file
    # routes ghcr.io / docker.io / registry.k8s.io / … all through dfdaemon.
    # skip_verify is moot (the endpoint is plain-HTTP loopback) but harmless.
    write_default_mirror() {
      mkdir -p "${certs_d}/_default"
      {
        echo "# managed by bp-self-sovereign-cutover registry-pivot (#4639) — DO NOT EDIT"
        echo "[host.\"${df_proxy}\"]"
        echo "  capabilities = [\"pull\", \"resolve\"]"
        echo "  skip_verify = true"
      } > "${certs_d}/_default/hosts.toml.new"
      mv "${certs_d}/_default/hosts.toml.new" "${certs_d}/_default/hosts.toml"
      echo "[registry-pivot]   wrote _default/hosts.toml -> ${df_proxy} (dfdaemon) on ${NODE_NAME}"
      # #4637 (live-PROVEN on hw202): containerd's `_default` FALLBACK does NOT
      # honor the http:// scheme of the [host] key — for an https-origin registry
      # (registry.<fqdn>, :443) it dials `https://127.0.0.1:4001` and the dfdaemon,
      # which serves PLAIN HTTP at :4001, EOFs the TLS handshake → step-07
      # catalyst-api image pull ImagePullBackOff → cutover wedges at 54%. An
      # EXPLICIT per-host certs.d/<registry-host>/hosts.toml DOES honor the http
      # scheme, so write one for the pivoted in-cluster Harbor host. Confirmed:
      # writing this + restarting catalyst-api → image pulled, pod Running.
      if [ -n "${harbor_host}" ]; then
        mkdir -p "${certs_d}/${harbor_host}"
        {
          echo "# managed by bp-self-sovereign-cutover registry-pivot (#4637) — DO NOT EDIT"
          # The `server` line is LOAD-BEARING: without it containerd's host-dir
          # falls back to the origin scheme (https) for the dfdaemon hop and
          # TLS-handshakes the plain-HTTP :4001 proxy → EOF. The proven
          # harbor.openova.io / 212.72.24.20:5000 certs.d entries on this same node
          # ALL pair `server = "https://<host>/v2"` with an `[host."http://..."]`
          # mirror — mirror that exact shape so the http dfdaemon hop is honored.
          echo "server = \"https://${harbor_host}\""
          echo "[host.\"${df_proxy}\"]"
          echo "  capabilities = [\"pull\", \"resolve\"]"
          echo "  skip_verify = true"
        } > "${certs_d}/${harbor_host}/hosts.toml.new"
        mv "${certs_d}/${harbor_host}/hosts.toml.new" "${certs_d}/${harbor_host}/hosts.toml"
        echo "[registry-pivot]   wrote ${harbor_host}/hosts.toml -> ${df_proxy} (explicit http, #4637) on ${NODE_NAME}"
      fi
    }
    remove_default_mirror() {
      rm -f "${certs_d}/_default/hosts.toml" 2>/dev/null || true
      [ -n "${harbor_host}" ] && rm -f "${certs_d}/${harbor_host}/hosts.toml" 2>/dev/null || true
      echo "[registry-pivot]   removed _default + ${harbor_host} hosts.toml (rollback) on ${NODE_NAME}"
    }

    # Resolve the cilium-gateway Service ClusterIP — node-routable (kube-proxy/
    # cilium program it on the host net), serves registry.<fqdn> (wildcard TLS
    # + token realm). The hostAlias maps registry.<fqdn> → this IP so dfdaemon's
    # hostNetwork pull never hairpins to the public EIP. Best-effort: empty on a
    # read miss → the flip is deferred to a later sweep (re-fires while the
    # alias is still missing), never wedging on a transient API miss.
    gw_svc_url="${api}/api/v1/namespaces/${GATEWAY_SERVICE_NAMESPACE}/services/${GATEWAY_SERVICE_NAME}"
    read_gateway_clusterip() {
      curl -fsS ${CT} --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
        "${gw_svc_url}" 2>/dev/null \
        | jq -r '.spec.clusterIP // empty' 2>/dev/null \
        || true
    }

    # #4652 (the x509 fix) — materialise the in-cluster Harbor trust anchor in
    # the dragonfly namespace. Reads the wildcard TLS Secret from
    # HARBOR_CA_SRC_NAMESPACE (kube-system) and creates/updates an Opaque Secret
    # HARBOR_CA_DEST_SECRET in DF_NAMESPACE carrying `tls.crt`. bp-dragonfly
    # (0.1.1) mounts that Secret OPTIONALLY at HARBOR_CA_MOUNT_PATH, so once it
    # exists the dfdaemon (+ seed) carry the PEM the registryMirror.cert line
    # points at. Same tls.crt-fallback as #3379 (the wildcard Secret carries
    # tls.crt+tls.key, NO ca.crt → tls.crt is the real trust bundle). Opaque
    # (NOT kubernetes.io/tls): only tls.crt is copied; the private key is NEVER
    # carried into dragonfly. Returns 0 when the dest Secret carries the cert.
    src_secret_url="${api}/api/v1/namespaces/${HARBOR_CA_SRC_NAMESPACE}/secrets/${wildcard_secret}"
    dst_secret_url="${api}/api/v1/namespaces/${DF_NAMESPACE}/secrets/${HARBOR_CA_DEST_SECRET}"
    harbor_ca_to_dragonfly_ns() {
      case "${HARBOR_CA_ENABLED}" in
        true|True|TRUE|1|yes) : ;;
        *) return 0 ;;
      esac
      # Prefer the issuing CA (ca.crt); fall back to the served leaf+chain
      # (tls.crt) — the wildcard Secret typically has NO ca.crt, so tls.crt is
      # the path that actually fires (the #3379 finding). base64 (.data.*) is
      # copied verbatim into the dest Secret's .data so no re-encode is needed.
      ca_b64=$(curl -fsS ${CT} --cacert "${cacert}" -H "Authorization: Bearer ${token}" "${src_secret_url}" 2>/dev/null \
        | jq -r '.data["ca.crt"] // .data["tls.crt"] // empty' 2>/dev/null || true)
      if [ -z "${ca_b64}" ]; then
        echo "[registry-pivot]   WARN ${HARBOR_CA_SRC_NAMESPACE}/${wildcard_secret} has no ca.crt/tls.crt; deferring dfdaemon cert (registryMirror.cert will be skipped this sweep)"
        return 1
      fi
      # PUT the cert under the `tls.crt` key (the file bp-dragonfly mounts is
      # <path>/tls.crt). Idempotent create-or-update: read the dest, if its
      # tls.crt already matches we skip; else apply via server-side apply
      # (kubectl-less: a strategic create falls back to a merge-patch on 409).
      cur_b64=$(curl -fsS ${CT} --cacert "${cacert}" -H "Authorization: Bearer ${token}" "${dst_secret_url}" 2>/dev/null \
        | jq -r '.data["tls.crt"] // empty' 2>/dev/null || true)
      if [ "${cur_b64}" = "${ca_b64}" ]; then
        echo "[registry-pivot]   ${DF_NAMESPACE}/${HARBOR_CA_DEST_SECRET} already carries the Harbor cert"
        return 0
      fi
      body=$(jq -cn --arg n "${HARBOR_CA_DEST_SECRET}" --arg ns "${DF_NAMESPACE}" --arg c "${ca_b64}" \
        '{apiVersion:"v1",kind:"Secret",metadata:{name:$n,namespace:$ns,labels:{"app.kubernetes.io/managed-by":"self-sovereign-cutover","bp.openova.io/cutover-step":"registry-pivot"}},type:"Opaque",data:{"tls.crt":$c}}')
      create_url="${api}/api/v1/namespaces/${DF_NAMESPACE}/secrets"
      if curl -fsS ${CT} -X POST --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
          -H "Content-Type: application/json" --data "${body}" "${create_url}" >/dev/null 2>&1; then
        echo "[registry-pivot]   created ${DF_NAMESPACE}/${HARBOR_CA_DEST_SECRET} (Harbor trust anchor for dfdaemon)"
        return 0
      fi
      # Already exists → merge-patch the data in place.
      patch=$(jq -cn --arg c "${ca_b64}" '{data:{"tls.crt":$c}}')
      if curl -fsS ${CT} -X PATCH --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
          -H "Content-Type: application/merge-patch+json" --data "${patch}" "${dst_secret_url}" >/dev/null 2>&1; then
        echo "[registry-pivot]   updated ${DF_NAMESPACE}/${HARBOR_CA_DEST_SECRET} (Harbor trust anchor for dfdaemon)"
        return 0
      fi
      echo "[registry-pivot]   WARN failed to create/patch ${DF_NAMESPACE}/${HARBOR_CA_DEST_SECRET} (will retry next sweep)"
      return 1
    }
    harbor_ca_remove_from_dragonfly_ns() {
      curl -fsS ${CT} -X DELETE --cacert "${cacert}" -H "Authorization: Bearer ${token}" "${dst_secret_url}" >/dev/null 2>&1 || true
    }

    # #4652 (the DNS fix) — rewrite CoreDNS so registry.<fqdn> resolves cluster-
    # internally to the cilium-gateway ClusterIP ONLY. The pod hostAlias is
    # INSUFFICIENT for the Rust dfdaemon resolver (getent returns the public EIP
    # first → hairpin → timeout, #4649). We patch the k3s `coredns-custom`
    # ConfigMap with a SEPARATE `*.server` block (the proven github-ipv4
    # mechanism) carrying a `hosts` plugin with NO `fallthrough` (so the EIP is
    # NOT also returned). CRITICAL sequencing (the #4652 failed live attempt
    # patched then immediately restarted CoreDNS → the new pod mounted the STALE
    # CM → the override was absent): patch the CM, then POLL the projected
    # coredns-custom volume on the RUNNING CoreDNS pod until our server-block key
    # appears in the mounted /etc/coredns/custom dir (kubelet CM-volume sync lag
    # ~60s), and rely on the k3s CoreDNS `reload` plugin to auto-pick it up — NO
    # rollout restart (which would re-trigger the stale-mount race). One-shot per
    # apply via the corednsOverride status guard.
    coredns_url="${api}/api/v1/namespaces/${COREDNS_CM_NAMESPACE}/configmaps/${COREDNS_CM_NAME}"
    coredns_override() {
      gwip="$1"
      case "${COREDNS_OVERRIDE_ENABLED}" in
        true|True|TRUE|1|yes) : ;;
        *) return 0 ;;
      esac
      [ -z "${gwip}" ] && { echo "[registry-pivot]   WARN gateway ClusterIP empty; deferring CoreDNS override"; return 1; }
      # The server block: `registry.<fqdn> { hosts { <gwip> registry.<fqdn> } }`.
      # NO fallthrough (else CoreDNS also forwards to PowerDNS → the EIP).
      block=$(printf '%s {\n    hosts {\n        %s %s\n    }\n}\n' "${harbor_host}" "${gwip}" "${harbor_host}")
      # Merge our key into the (possibly pre-existing, github-ipv4-bearing)
      # coredns-custom CM. A merge-patch+json adds/replaces ONLY our key and
      # preserves the github-ipv4.server key. If the CM does not exist yet
      # (no Huawei github-ipv4 step ran) the PATCH 404s → fall back to a create.
      patch=$(jq -cn --arg k "${COREDNS_SERVER_KEY}" --arg v "${block}" '{data:{($k):$v}}')
      if curl -fsS ${CT} -X PATCH --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
          -H "Content-Type: application/merge-patch+json" --data "${patch}" "${coredns_url}" >/dev/null 2>&1; then
        echo "[registry-pivot]   patched ${COREDNS_CM_NAMESPACE}/${COREDNS_CM_NAME} ${COREDNS_SERVER_KEY} -> ${harbor_host} ${gwip}"
      else
        body=$(jq -cn --arg n "${COREDNS_CM_NAME}" --arg ns "${COREDNS_CM_NAMESPACE}" --arg k "${COREDNS_SERVER_KEY}" --arg v "${block}" \
          '{apiVersion:"v1",kind:"ConfigMap",metadata:{name:$n,namespace:$ns,labels:{"app.kubernetes.io/managed-by":"self-sovereign-cutover","bp.openova.io/cutover-step":"registry-pivot"}},data:{($k):$v}}')
        cdns_create="${api}/api/v1/namespaces/${COREDNS_CM_NAMESPACE}/configmaps"
        if curl -fsS ${CT} -X POST --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" --data "${body}" "${cdns_create}" >/dev/null 2>&1; then
          echo "[registry-pivot]   created ${COREDNS_CM_NAMESPACE}/${COREDNS_CM_NAME} with ${COREDNS_SERVER_KEY}"
        else
          echo "[registry-pivot]   WARN failed to patch/create ${COREDNS_CM_NAME} (will retry next sweep)"
          return 1
        fi
      fi
      # Poll the projected coredns-custom volume on a RUNNING CoreDNS pod until
      # our key materialises in /etc/coredns/custom, proving the kubelet CM-volume
      # sync completed BEFORE we trust the override (no restart → no stale-mount
      # race). The k3s CoreDNS `reload` plugin then auto-reloads from the synced
      # file. Bounded by COREDNS_SYNC_TIMEOUT_SECONDS; a timeout is non-fatal
      # (logged; next sweep re-polls) so a slow sync never wedges the pivot.
      pod=$(curl -fsS ${CT} --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
        "${api}/api/v1/namespaces/${COREDNS_DEPLOYMENT_NAMESPACE}/pods?labelSelector=k8s-app%3Dkube-dns" 2>/dev/null \
        | jq -r '.items[] | select(.status.phase=="Running") | .metadata.name' 2>/dev/null | head -n1 || true)
      [ -z "${pod}" ] && pod=$(curl -fsS ${CT} --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
        "${api}/api/v1/namespaces/${COREDNS_DEPLOYMENT_NAMESPACE}/pods?labelSelector=app.kubernetes.io%2Fname%3Dcoredns" 2>/dev/null \
        | jq -r '.items[] | select(.status.phase=="Running") | .metadata.name' 2>/dev/null | head -n1 || true)
      if [ -z "${pod}" ]; then
        echo "[registry-pivot]   WARN no Running CoreDNS pod found to confirm coredns-custom sync; trusting reload-plugin pickup on ${NODE_NAME}"
        return 0
      fi
      # The k3s CoreDNS Corefile `import`s /etc/coredns/custom/*.server; the
      # coredns-custom CM is projected there. exec a grep for our gwip in the
      # mounted server file (the apiserver pod-exec subresource over the SA
      # token). Bounded poll.
      exec_base="${api}/api/v1/namespaces/${COREDNS_DEPLOYMENT_NAMESPACE}/pods/${pod}/exec"
      deadline=$(( $(date +%s) + COREDNS_SYNC_TIMEOUT_SECONDS ))
      while [ "$(date +%s)" -lt "${deadline}" ]; do
        # grep -q the gwip inside the synced custom file. If exec is unavailable
        # (no ws upgrade in this minimal client) the call fails → we fall back to
        # a fixed grace sleep below. command=grep -r <gwip> /etc/coredns/custom
        if curl -fsS ${CT} -G --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
            --data-urlencode "command=grep" \
            --data-urlencode "command=-rl" \
            --data-urlencode "command=${gwip}" \
            --data-urlencode "command=/etc/coredns/custom" \
            --data-urlencode "container=coredns" \
            --data-urlencode "stdout=true" --data-urlencode "stderr=true" \
            "${exec_base}" 2>/dev/null | grep -q "/etc/coredns/custom"; then
          echo "[registry-pivot]   coredns-custom ${COREDNS_SERVER_KEY} synced on pod ${pod}; reload plugin will pick it up"
          return 0
        fi
        sleep 5
      done
      # Sync poll inconclusive (exec subresource may not be reachable from this
      # minimal curl client). Fall back to the kubelet sync-period grace window
      # so the reload plugin still picks up the file; non-fatal either way.
      echo "[registry-pivot]   coredns-custom sync poll inconclusive after ${COREDNS_SYNC_TIMEOUT_SECONDS}s; relying on reload-plugin pickup (grace) on ${NODE_NAME}"
      return 0
    }
    coredns_override_remove() {
      # Rollback: drop ONLY our server key (preserve github-ipv4.server). A
      # JSON-merge null deletes the key.
      patch=$(jq -cn --arg k "${COREDNS_SERVER_KEY}" '{data:{($k):null}}')
      curl -fsS ${CT} -X PATCH --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
        -H "Content-Type: application/merge-patch+json" --data "${patch}" "${coredns_url}" >/dev/null 2>&1 || true
    }

    # Patch a dfdaemon-family ConfigMap's dfdaemon.yaml registryMirror.addr to
    # ${2}, and (when ${3} is non-empty) ensure a sibling registryMirror.cert:
    # ${3} (the PEM trust anchor for the LE-staging in-cluster Harbor, #4652).
    # The config is a single YAML string under data."dfdaemon.yaml"; we read it,
    # rewrite ONLY the registryMirror addr/cert lines, and merge-patch it back.
    # Idempotent. SCOPING IS LOAD-BEARING: the dfdaemon.yaml carries MULTIPLE
    # `addr:` keys — `manager.addr: http://dragonfly-manager…:65003` (the gRPC
    # control-plane the dfdaemon health-checks at boot) AND
    # `proxy.registryMirror.addr` (the registry upstream we flip). A blanket
    # `sed s/addr: …/` would ALSO rewrite the manager addr → dfdaemon
    # ConnectError on startup → CrashLoopBackOff (caught live on the kom4dc
    # seed-client). So the awk rewrites addr/cert ONLY while inside a
    # `registryMirror:` block (set the in-block flag on a line ending in
    # `registryMirror:`; clear it when indentation returns to <= the
    # registryMirror key's indent). The `cert:` line is emitted at the SAME
    # indent as `addr` (a sibling under registryMirror) — updated in place if it
    # already exists in-block, else inserted right after the addr line; cleared
    # on rollback (want_cert empty). want_addr / want_cert are passed via -v (no
    # shell interpolation into the awk program → metacharacter-safe).
    patch_df_configmap_addr() {
      cm_name="$1"; want_addr="$2"; want_cert="${3:-}"
      url="${api}/api/v1/namespaces/${DF_NAMESPACE}/configmaps/${cm_name}"
      cur=$(curl -fsS ${CT} --cacert "${cacert}" -H "Authorization: Bearer ${token}" "${url}" 2>/dev/null \
        | jq -r '.data["dfdaemon.yaml"] // empty' 2>/dev/null || true)
      [ -z "${cur}" ] && { echo "[registry-pivot]   WARN ${cm_name} dfdaemon.yaml unreadable; deferring upstream flip"; return 1; }
      new=$(printf '%s' "${cur}" | awk -v want="${want_addr}" -v cert="${want_cert}" '
        # compute leading-space count of a line
        function indent(s,   n){ n=0; while (substr(s,n+1,1)==" ") n++; return n }
        {
          if ($0 ~ /registryMirror:[[:space:]]*$/) { inblk=1; blkind=indent($0); print; next }
          if (inblk) {
            ci=indent($0)
            # a non-blank line at indent <= the registryMirror key ends the
            # block. Before leaving, if we owe a cert line and never saw one,
            # emit it now at the addr indent we recorded (insert before the line
            # that closes the block).
            if ($0 ~ /[^[:space:]]/ && ci <= blkind) {
              if (cert != "" && !cert_done && addrind != "") {
                printf "%*scert: %s\n", addrind, "", cert
                cert_done=1
              }
              inblk=0
            }
          }
          # In-block existing cert line: update it in place (want set) or drop it
          # (rollback, want_cert empty) — do NOT print the stale/cleared line.
          if (inblk && $0 ~ /^[[:space:]]*cert:[[:space:]]*/) {
            if (cert != "" && !cert_done) {
              printf "%*scert: %s\n", indent($0), "", cert
              cert_done=1
            }
            next
          }
          if (inblk && $0 ~ /^[[:space:]]*addr:[[:space:]]*https?:\/\//) {
            addrind=indent($0)
            sub(/addr:[[:space:]]*https?:\/\/[^[:space:]]+/, "addr: " want)
            print
            # Insert the cert sibling right after addr if not already emitted.
            if (cert != "" && !cert_done) {
              printf "%*scert: %s\n", addrind, "", cert
              cert_done=1
            }
            next
          }
          print
        }
        END {
          # Block ran to EOF still open and we owe a cert line (registryMirror
          # was the last block in the doc): emit it at the recorded addr indent.
          if (inblk && cert != "" && !cert_done && addrind != "")
            printf "%*scert: %s\n", addrind, "", cert
        }')
      [ "${new}" = "${cur}" ] && { echo "[registry-pivot]   ${cm_name} upstream already ${want_addr}${want_cert:+ (cert ${want_cert})}"; return 0; }
      patch=$(jq -cn --arg v "${new}" '{data: {"dfdaemon.yaml": $v}}')
      if curl -fsS ${CT} -X PATCH --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
        -H "Content-Type: application/merge-patch+json" --data "${patch}" "${url}" >/dev/null 2>&1; then
        echo "[registry-pivot]   flipped ${cm_name} dfdaemon upstream -> ${want_addr}${want_cert:+ (cert ${want_cert})}"
        return 0
      fi
      echo "[registry-pivot]   WARN failed to patch ${cm_name} upstream (will retry next sweep)"
      return 1
    }

    # Set (v2) / clear (v1) the registry.<fqdn> → gateway-ClusterIP hostAlias on
    # a dfdaemon-family workload (DaemonSet or StatefulSet) pod template. Adding
    # hostAliases switches the hostNetwork pod from the node's bind-mounted
    # /etc/hosts (which carries the public-EIP pin) to a kubelet-managed hosts
    # file that ALSO contains our alias → the gateway ClusterIP entry wins the
    # connection (proven live: curl picks the routable address). A strategic-
    # merge patch on spec.template.spec.hostAliases re-rolls the pods.
    patch_workload_hostalias() {
      kind="$1"; name="$2"; gwip="$3"   # kind ∈ daemonsets|statefulsets
      url="${api}/apis/apps/v1/namespaces/${DF_NAMESPACE}/${kind}/${name}"
      if [ -n "${gwip}" ]; then
        patch=$(jq -cn --arg ip "${gwip}" --arg h "${harbor_host}" \
          '{spec:{template:{spec:{hostAliases:[{ip:$ip,hostnames:[$h]}]}}}}')
      else
        patch='{"spec":{"template":{"spec":{"hostAliases":[]}}}}'
      fi
      if curl -fsS ${CT} -X PATCH --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
        -H "Content-Type: application/strategic-merge-patch+json" --data "${patch}" "${url}" >/dev/null 2>&1; then
        echo "[registry-pivot]   patched ${kind}/${name} hostAliases (${harbor_host} -> ${gwip:-<cleared>})"
        return 0
      fi
      echo "[registry-pivot]   WARN failed to patch ${kind}/${name} hostAliases (will retry next sweep)"
      return 1
    }

    # Roll dfdaemon (+ seed) so they reload the flipped upstream. A hostAlias
    # patch already re-rolls them; this is the explicit nudge for the addr-only
    # change and is gated by DF_RESTART_ON_FLIP. Uses the restartedAt annotation
    # (kubectl rollout restart equivalent) via a strategic-merge patch.
    restart_workload() {
      kind="$1"; name="$2"
      [ "${DF_RESTART_ON_FLIP}" = "true" ] || return 0
      url="${api}/apis/apps/v1/namespaces/${DF_NAMESPACE}/${kind}/${name}"
      stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      patch=$(jq -cn --arg t "${stamp}" \
        '{spec:{template:{metadata:{annotations:{"kubectl.kubernetes.io/restartedAt":$t}}}}}')
      curl -fsS ${CT} -X PATCH --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
        -H "Content-Type: application/strategic-merge-patch+json" --data "${patch}" "${url}" >/dev/null 2>&1 \
        && echo "[registry-pivot]   rolled ${kind}/${name}" \
        || echo "[registry-pivot]   WARN failed to roll ${kind}/${name}"
    }

    # The cluster-wide dfdaemon flip (upstream + hostAlias) — performed ONCE.
    # The status key dragonflyUpstream=local is the cluster-scope guard: the
    # first node to converge sets it; the rest skip. Returns 0 only when the
    # full flip (both ConfigMaps + both hostAliases) succeeded so the guard is
    # set; a partial failure leaves the guard unset → a later sweep retries.
    cm_patch_status() {
      key="$1"; val="$2"
      p=$(jq -cn --arg k "${key}" --arg v "${val}" '{data: {($k): $v}}')
      curl -fsS ${CT} -X PATCH --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
        -H "Content-Type: application/merge-patch+json" --data "${p}" "${cm_url}" >/dev/null 2>&1 || true
    }
    df_flip_to_local() {
      already=$(curl -fsS ${CT} --cacert "${cacert}" -H "Authorization: Bearer ${token}" "${cm_url}" 2>/dev/null \
        | jq -r '.data.dragonflyUpstream // empty' 2>/dev/null || true)
      if [ "${already}" = "local" ]; then
        return 0
      fi
      gwip=$(read_gateway_clusterip)
      if [ -z "${gwip}" ] || [ "${gwip}" = "None" ]; then
        echo "[registry-pivot]   WARN cilium-gateway ClusterIP unresolved; deferring dfdaemon flip on ${NODE_NAME}"
        return 1
      fi
      echo "[registry-pivot]   cilium-gateway ClusterIP ${gwip} -> hostAlias ${harbor_host} on ${NODE_NAME}"
      ok=0
      # #4652 (DNS fix): rewrite CoreDNS registry.<fqdn> -> gateway ClusterIP
      # ONLY (no fallthrough), with the patch-then-sync sequencing. Best-effort:
      # a miss leaves the guard unset → retried next sweep.
      coredns_override "${gwip}" || ok=1
      # #4652 (x509 fix): materialise the Harbor trust anchor in the dragonfly
      # namespace; ONLY then set registryMirror.cert (so we never point the
      # dfdaemon at a non-existent PEM). If the CA cannot be materialised this
      # sweep, flip addr-only and defer the cert to a later sweep.
      cert_arg=""
      if harbor_ca_to_dragonfly_ns; then
        cert_arg="${local_cert_path}"
      else
        ok=1
      fi
      patch_df_configmap_addr "${DF_CLIENT_CONFIGMAP}" "${local_upstream}" "${cert_arg}" || ok=1
      [ -n "${DF_SEED_CONFIGMAP}" ] && { patch_df_configmap_addr "${DF_SEED_CONFIGMAP}" "${local_upstream}" "${cert_arg}" || ok=1; }
      patch_workload_hostalias daemonsets "${DF_CLIENT_DAEMONSET}" "${gwip}" || ok=1
      [ -n "${DF_SEED_STATEFULSET}" ] && { patch_workload_hostalias statefulsets "${DF_SEED_STATEFULSET}" "${gwip}" || ok=1; }
      restart_workload daemonsets "${DF_CLIENT_DAEMONSET}"
      [ -n "${DF_SEED_STATEFULSET}" ] && restart_workload statefulsets "${DF_SEED_STATEFULSET}"
      if [ "${ok}" = "0" ]; then
        cm_patch_status dragonflyUpstream local
        echo "[registry-pivot]   dfdaemon flipped to LOCAL Harbor ${local_upstream} + CoreDNS + cert (cluster-wide guard set)"
        return 0
      fi
      echo "[registry-pivot]   dfdaemon flip incomplete; guard NOT set, will retry next sweep on ${NODE_NAME}"
      return 1
    }
    df_revert_to_ghcr() {
      # Rollback clears the cert (empty 3rd arg) along with the addr.
      patch_df_configmap_addr "${DF_CLIENT_CONFIGMAP}" "https://ghcr.io" "" || true
      if [ -n "${DF_SEED_CONFIGMAP}" ]; then
        patch_df_configmap_addr "${DF_SEED_CONFIGMAP}" "https://ghcr.io" "" || true
      fi
      patch_workload_hostalias daemonsets "${DF_CLIENT_DAEMONSET}" "" || true
      if [ -n "${DF_SEED_STATEFULSET}" ]; then
        patch_workload_hostalias statefulsets "${DF_SEED_STATEFULSET}" "" || true
      fi
      coredns_override_remove
      harbor_ca_remove_from_dragonfly_ns
      cm_patch_status dragonflyUpstream ghcr
    }

    # #4637 — the step-07 catalyst-api re-pull GATE. The _default/hosts.toml
    # catch-all points this node's containerd at the node-local dfdaemon proxy
    # http://127.0.0.1:${DF_PROXY_PORT}; the dfdaemon is what actually serves
    # the registry.<fqdn>/openova-io/openova/catalyst-api blob (back-to-source
    # to its flipped registryMirror.addr). But the dfdaemon DaemonSet
    # (dragonfly-client) is a SEPARATE workload — if it has 0 Ready pods on this
    # node (the live #4649 Kyverno-readOnlyRootFilesystem DENY → DESIRED=N
    # CURRENT=0), the mirror endpoint is dead and a containerd pull through it
    # gets `dial tcp 127.0.0.1:${DF_PROXY_PORT}: connect: connection refused`.
    # Writing the v2 node-ack while the proxy is dead lets catalyst-api's
    # daemonset-wait green PREMATURELY → step-07 fires the catalyst-api HR
    # image roll → ImagePullBackOff → cutover wedges at 54% (the exact #4637
    # leg). So probe the LOCAL dfdaemon's registry endpoint BEFORE acking v2:
    # a reachable proxy answers /v2/ with an HTTP status (200 or a 401/403/404
    # registry challenge — ANY HTTP response proves the listener is up, no body
    # parse needed). A connection-refused/timeout returns no status → not yet
    # serving → defer the ack so the daemonset-wait keeps blocking until the
    # node mirror is genuinely live (idempotent; retried each 15s sweep).
    dfdaemon_serving() {
      # curl's -w '%{http_code}' prints the response status, or `000` when the
      # connection failed (refused/timeout) — and on a dead port curl ALSO exits
      # non-zero, so do NOT chain `|| echo 000` (that would append a SECOND 000 →
      # `000000`, which is not the literal `000` we test for → a false "serving"
      # verdict). `|| true` keeps `set -u`-safe without corrupting the code. A
      # REAL HTTP response is a 3-digit code whose leading digit is 1-5 (200, or
      # a 401/403/404 registry challenge — ANY proves the listener is up, no body
      # parse needed); `000` / empty / anything else = not serving → defer.
      # Probe the NODE's dfdaemon via HOST_IP, not 127.0.0.1 (#4637 follow-up):
      # this pod is NOT hostNetwork, so its loopback never reaches the node's
      # hostNetwork dfdaemon — a 127.0.0.1 probe ALWAYS reads 000 and defers
      # forever, wedging step-04. The dfdaemon binds 0.0.0.0:${DF_PROXY_PORT} so
      # HOST_IP is reachable. (containerd still pulls via 127.0.0.1 in the NODE
      # netns — correct + unchanged.) Fall back to 127.0.0.1 if HOST_IP is unset.
      probe_host="${HOST_IP:-127.0.0.1}"
      code=$(curl -s -o /dev/null -w '%{http_code}' ${CT} \
        "http://${probe_host}:${DF_PROXY_PORT}/v2/" 2>/dev/null || true)
      case "${code}" in
        [1-5][0-9][0-9]) return 0 ;;  # a genuine HTTP status — dfdaemon serves
        *) return 1 ;;                # 000 / empty / malformed — proxy not up
      esac
    }

    # #3671: per-node ack the daemonset-wait counts (proves EVERY node swapped
    # its containerd to the dfdaemon mirror, not merely that the DS Pods are
    # Ready). Key node.<NODE>.registriesYaml. Best-effort; retried each sweep.
    write_node_ack() {
      ack_val="$1"
      ack_key="node.${NODE_NAME}.registriesYaml"
      patch=$(jq -cn --arg k "${ack_key}" --arg v "${ack_val}" '{data: {($k): $v}}')
      curl -fsS ${CT} -X PATCH --cacert "${cacert}" -H "Authorization: Bearer ${token}" \
        -H "Content-Type: application/merge-patch+json" --data "${patch}" "${cm_url}" >/dev/null 2>&1 \
        && echo "[registry-pivot]   acked ${ack_key}=${ack_val}" \
        || echo "[registry-pivot]   WARN failed to ack ${ack_key}=${ack_val} (will retry next sweep)"
    }

    apply_state() {
      desired="$1"
      case "${desired}" in
        v2)
          # Per-node: point this node's containerd at the local dfdaemon.
          write_default_mirror
          # Cluster-wide (guarded): flip the dfdaemon upstream + hostAlias.
          df_flip_to_local || true
          # #4637 — ack v2 ONLY once the node-local dfdaemon is actually
          # serving its registry endpoint. Acking while 127.0.0.1:${DF_PROXY_PORT}
          # is dead would green the daemonset-wait → step-07 catalyst-api pull
          # `connection refused`. Defer (no ack) so the wait keeps blocking; the
          # reconcile loop re-probes every sweep (see the v2-ack retry guard).
          if dfdaemon_serving; then
            write_node_ack v2
          else
            echo "[registry-pivot]   WARN node-local dfdaemon http://127.0.0.1:${DF_PROXY_PORT}/v2/ not serving yet on ${NODE_NAME}; DEFERRING v2 ack (step-07 must not pull into a dead mirror) — retry next sweep"
          fi
          ;;
        v1|rollback|*)
          remove_default_mirror
          df_revert_to_ghcr || true
          write_node_ack v1
          ;;
      esac
    }

    while true; do
      desired=$(curl -fsS ${CT} --cacert "${cacert}" -H "Authorization: Bearer ${token}" "${cm_url}" 2>/dev/null \
        | jq -r '.data.registriesYamlActive // "v1"' 2>/dev/null \
        || echo "v1")
      desired=${desired:-v1}

      # #4639 — re-apply v2 if the cluster-wide dfdaemon flip has not yet been
      # confirmed (guard dragonflyUpstream != local). apply_state fires only
      # ONCE per state, so if the cilium-gateway Service was not yet resolvable
      # on the first v2 sweep the flip would be skipped forever. This retries
      # the flip on a later sweep WITHOUT re-applying every tick once converged.
      needs_flip_retry=0
      if [ "${desired}" = "v2" ] && [ "${desired}" = "${last_state}" ]; then
        cur_up=$(curl -fsS ${CT} --cacert "${cacert}" -H "Authorization: Bearer ${token}" "${cm_url}" 2>/dev/null \
          | jq -r '.data.dragonflyUpstream // empty' 2>/dev/null || true)
        [ "${cur_up}" != "local" ] && needs_flip_retry=1
      fi

      # #4637 — re-apply v2 if THIS node's v2 ack is still missing (its local
      # dfdaemon was not serving on the first sweep — the live #4649 condition).
      # The cluster-wide flip (needs_flip_retry) may already be `local`, so that
      # guard would NOT re-fire apply_state; without this a node whose dfdaemon
      # came up late never re-probes/re-acks → its node.<NODE>.registriesYaml
      # stays absent → catalyst-api's per-node-ack wait never reaches
      # acks==desired → the cutover stalls at step-04 instead of greening once
      # the mirror is live. Cheap (one CM GET) and self-limiting (stops the
      # instant the ack lands).
      needs_ack_retry=0
      if [ "${desired}" = "v2" ] && [ "${desired}" = "${last_state}" ] && [ "${needs_flip_retry}" = "0" ]; then
        my_ack=$(curl -fsS ${CT} --cacert "${cacert}" -H "Authorization: Bearer ${token}" "${cm_url}" 2>/dev/null \
          | jq -r --arg k "node.${NODE_NAME}.registriesYaml" '.data[$k] // empty' 2>/dev/null || true)
        [ "${my_ack}" != "v2" ] && needs_ack_retry=1
      fi

      if [ "${desired}" != "${last_state}" ] || [ "${needs_flip_retry}" = "1" ] || [ "${needs_ack_retry}" = "1" ]; then
        if [ "${needs_ack_retry}" = "1" ]; then
          echo "[registry-pivot] re-applying ${desired} to complete THIS node's v2 ack (dfdaemon mirror not confirmed serving yet) on ${NODE_NAME}"
        elif [ "${needs_flip_retry}" = "1" ]; then
          echo "[registry-pivot] re-applying ${desired} to complete the dfdaemon upstream flip (guard not yet local) on ${NODE_NAME}"
        else
          echo "[registry-pivot] state change ${last_state:-<none>} -> ${desired} on ${NODE_NAME}"
        fi
        apply_state "${desired}"
        last_state="${desired}"
        # Mark Pod ready after the first successful sync.
        touch /tmp/ready
      fi

      sleep 15
    done
{{- end }}
