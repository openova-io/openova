{{- /*
Step 05 — flux-gitrepository-patch.

Patches `flux-system/<gitopsRepository.name>` GitRepository.spec.url
to the local Sovereign Gitea URL AND wires a basic-auth secretRef so
source-controller can authenticate to the local Gitea. After this patch
source-controller reconciles against the in-cluster Gitea Service.

#3536 (Refs #3379) — secretRef wiring (load-bearing for step 08)
────────────────────────────────────────────────────────────────
The cloud-init bootstrap GitRepository pulls from public github.com with
NO secretRef (anonymous clone). bp-gitea sets REQUIRE_SIGNIN_VIEW=true,
so once we flip the URL to the local Gitea, an anonymous clone 401s
("authentication required") even for a PUBLIC repo. source-controller
then freezes on the stale pre-cutover artifact, step 06's HelmRepository
URL rewrites never reconcile, and step 08's bounded pivot-wait can never
converge → the 600s deny-egress hold never runs → cutoverComplete=false.

Fix: BEFORE flipping the URL, materialise a Flux basic-auth Secret in the
GitRepository's namespace carrying the `catalyst-gitea-token` PAT (minted
at BOOTSTRAP by bp-catalyst-platform, in catalyst-system) in
username/password shape, and set GitRepository.spec.secretRef.name to it.
A Gitea PAT is accepted as the HTTP git password. This is the same
credential + pattern issue #3454 used for the openova-org-tenants
GitRepository. Flux secretRef takes only a name (no namespace) and
resolves it in the GitRepository's own namespace, so the Secret is
created locally from the cross-namespace PAT here.

#5359 (Refs #5265 #5339) — SECONDARY-REGION leg. On a 2-region Sovereign
region-B runs its OWN flux whose bootstrap GitRepository still points at
public github.com after the region-A patch — live-proven on hw288
(cc=true, region-B GitRepository -> github.com). After the region-A
patch this Job iterates every kubeconfig in /secondary-kubeconfigs
(the `cutover-secondary-kubeconfigs` Secret catalyst-api materialises
at run start from its on-PVC secondary kubeconfig store; mounted
optional:true so a single-region Sovereign renders the leg inert) and:

  1. establishes the ClusterMesh global-Service path to the local
     Gitea (the bp-cnpg-pair / bp-openbao cross-region-mesh idiom):
     annotates region-A's gitea-http Service `service.cilium.io/
     global=true` + creates the same-named zero-backend alias Service
     in the secondary's `gitea` namespace, so `gitea-http.gitea.svc`
     resolves there and the dial crosses the mesh to region-A;
  2. mirrors the basic-auth Secret into the secondary's flux-system;
  3. applies the SAME url/branch/secretRef/ignore patch to the
     secondary's GitRepository (secondaryRegions.giteaURL overrides
     the URL; empty = the same in-cluster URL region-A uses);
  4. FAIL-LOUD waits for the secondary GitRepository to reach
     Ready=True on the pivoted URL (secondaryRegions.
     gitRepositoryReadySeconds) — succeeding without region-B
     reconciling local Gitea would re-mint the #5359 false positive;
  5. records `step.flux-gitrepository-patch.region.<key>.result` on
     the status ConfigMap (the per-region tracking #5359 asks for).

Image phase: post.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cutover-step-05-flux-gitrepository-patch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-self-sovereign-cutover.labels" . | nindent 4 }}
    app.kubernetes.io/component: cutover-step
    bp.openova.io/cutover-order: "5"
    bp.openova.io/cutover-mode: "job"
data:
  stepName: flux-gitrepository-patch
  podSpec: |
    serviceAccountName: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
    restartPolicy: Never
    activeDeadlineSeconds: {{ .Values.stepTimeouts.fluxGitRepositoryPatchSeconds }}
    containers:
      - name: flux-gitrepository-patch
        image: {{ include "bp-self-sovereign-cutover.image" (dict "repository" .Values.images.kubectl.repository "tag" .Values.images.kubectl.tag "cutoverPhase" "post" "Values" .Values) }}
        imagePullPolicy: IfNotPresent
        env:
          - name: GITREPO_NAME
            value: {{ .Values.gitopsRepository.name | quote }}
          - name: GITREPO_NAMESPACE
            value: {{ .Values.gitopsRepository.namespace | quote }}
          - name: LOCAL_GITEA_URL
            value: {{ printf "%s/%s/%s" .Values.sovereign.giteaInternalURL .Values.gitea.org .Values.gitea.repo | quote }}
          - name: BRANCH
            value: {{ .Values.upstream.branch | quote }}
          # Issue #891 — the GitRepository ignore filter must be widened to
          # include the Sovereign's own clusters/<sov-fqdn>/ subtree, or
          # source-controller filters out every Sovereign-specific manifest
          # (incl. Organization tenant overlays at clusters/<sov-fqdn>/org-tenants/
          # <tenant-id>/) and Flux Kustomizations downstream all hit
          # "kustomization path not found".
          - name: SOVEREIGN_FQDN
            value: {{ .Values.sovereign.fqdn | quote }}
          # #3536 — secretRef wiring inputs. The destination basic-auth
          # Secret is created in the GitRepository's namespace; the source
          # PAT (`catalyst-gitea-token`) is read from catalyst-system where
          # bp-catalyst-platform's pre-install hook minted it at bootstrap.
          - name: GIT_AUTH_SECRET_NAME
            value: {{ .Values.gitRepositorySecretRef.destSecretName | quote }}
          - name: PAT_SOURCE_NAMESPACE
            value: {{ .Values.gitRepositorySecretRef.patSourceNamespace | quote }}
          - name: PAT_SOURCE_SECRET_NAME
            value: {{ .Values.gitRepositorySecretRef.patSourceSecretName | quote }}
          - name: PAT_SOURCE_KEY
            value: {{ .Values.gitRepositorySecretRef.patSourceKey | quote }}
          - name: GIT_AUTH_USERNAME
            value: {{ .Values.gitRepositorySecretRef.username | quote }}
          # #5359 — secondary-region leg inputs. SECONDARY_GITEA_URL empty =
          # reuse LOCAL_GITEA_URL (the in-cluster Service URL, reachable from
          # the secondary via the ClusterMesh global-Service alias this leg
          # establishes). STATUS_CONFIGMAP receives the per-region
          # step.<step>.region.<key>.* tracking keys.
          - name: SECONDARY_GITEA_URL
            value: {{ if .Values.secondaryRegions.giteaURL }}{{ printf "%s/%s/%s" (.Values.secondaryRegions.giteaURL | trimSuffix "/") .Values.gitea.org .Values.gitea.repo | quote }}{{ else }}""{{ end }}
          # #5359 — the fallback candidate, tried only if the in-cluster mesh
          # URL fails to CONVERGE in the secondary. Defaults to the Sovereign's
          # OWN external Gitea door, which is on-Sovereign (it satisfies the
          # step-08 source-host lint's *.<fqdn> exemption) and is the only path
          # live-proven to serve region-A's pivoted repo from region-B on hw292.
          # Set secondaryRegions.giteaFallbackURL to "" to disable the fallback
          # and make a mesh failure immediately fatal.
          - name: SECONDARY_GITEA_FALLBACK_URL
            value: {{ if .Values.secondaryRegions.giteaFallbackURL }}{{ printf "%s/%s/%s" (.Values.secondaryRegions.giteaFallbackURL | trimSuffix "/") .Values.gitea.org .Values.gitea.repo | quote }}{{ else if .Values.secondaryRegions.giteaFallbackToPublicDoor }}{{ printf "https://gitea.%s/%s/%s" .Values.sovereign.fqdn .Values.gitea.org .Values.gitea.repo | quote }}{{ else }}""{{ end }}
          - name: SECONDARY_GITREPO_READY_SECONDS
            value: {{ .Values.secondaryRegions.gitRepositoryReadySeconds | quote }}
          - name: STATUS_CONFIGMAP
            value: {{ .Values.status.configMapName | quote }}
          - name: CUTOVER_NAMESPACE
            value: {{ .Release.Namespace | quote }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            echo "[flux-gitrepository-patch] target=${GITREPO_NAMESPACE}/${GITREPO_NAME} -> ${LOCAL_GITEA_URL} (branch=${BRANCH})"

            # ── #3536: wire a basic-auth secretRef BEFORE flipping the URL ──
            #
            # bp-gitea sets REQUIRE_SIGNIN_VIEW=true → an anonymous clone of
            # the local Gitea 401s even for a public repo. The cloud-init
            # bootstrap GitRepository has NO secretRef (it cloned public
            # github.com anonymously). So we must give source-controller a
            # credential, or every reconcile after the URL flip fails
            # "authentication required" and step 08 can never converge.
            #
            # Credential = the `catalyst-gitea-token` PAT minted at BOOTSTRAP
            # by bp-catalyst-platform (in ${PAT_SOURCE_NAMESPACE}). A Gitea
            # PAT is accepted as the HTTP git password. Flux secretRef takes
            # only a name resolved in the GitRepository's own namespace, so
            # we read the cross-namespace PAT and write a basic-auth Secret
            # (keys username/password) into ${GITREPO_NAMESPACE}.
            #
            # The PAT Secret exists from bootstrap, but its `token` byte may
            # be momentarily empty if the minter Job is mid-flight; wait
            # (bounded) for a non-empty value before proceeding — a cutover
            # that wired an empty password would re-introduce the 401.
            echo "[flux-gitrepository-patch] reading PAT ${PAT_SOURCE_NAMESPACE}/${PAT_SOURCE_SECRET_NAME}.${PAT_SOURCE_KEY}"
            pat=""
            for i in $(seq 1 30); do
              pat=$(kubectl -n "${PAT_SOURCE_NAMESPACE}" get secret "${PAT_SOURCE_SECRET_NAME}" \
                -o "jsonpath={.data.${PAT_SOURCE_KEY}}" 2>/dev/null | base64 -d 2>/dev/null || true)
              if [ -n "${pat}" ]; then
                echo "[flux-gitrepository-patch] PAT present (attempt ${i})"
                break
              fi
              echo "[flux-gitrepository-patch] PAT not yet populated in ${PAT_SOURCE_NAMESPACE}/${PAT_SOURCE_SECRET_NAME} (attempt ${i}/30) — sleeping 5s"
              sleep 5
            done
            if [ -z "${pat}" ]; then
              echo "[flux-gitrepository-patch] FATAL: ${PAT_SOURCE_NAMESPACE}/${PAT_SOURCE_SECRET_NAME}.${PAT_SOURCE_KEY} empty after 150s — bp-catalyst-platform PAT mint did not complete; refusing to pivot the GitRepository to an authenticated Gitea without a credential (would 401 on every reconcile)" >&2
              exit 1
            fi

            # Create/update the basic-auth Secret in the GitRepository's
            # namespace. Apply via stdin manifest so the PAT never lands in
            # argv (visible to other namespaces' process listings). stringData
            # lets the apiserver base64-encode for us.
            echo "[flux-gitrepository-patch] materialising basic-auth Secret ${GITREPO_NAMESPACE}/${GIT_AUTH_SECRET_NAME}"
            cat >/tmp/git-auth-secret.yaml <<EOF
            apiVersion: v1
            kind: Secret
            metadata:
              name: ${GIT_AUTH_SECRET_NAME}
              namespace: ${GITREPO_NAMESPACE}
              labels:
                app.kubernetes.io/managed-by: self-sovereign-cutover
                app.kubernetes.io/component: cutover-gitrepository-auth
              annotations:
                catalyst.openova.io/mirrored-from: ${PAT_SOURCE_NAMESPACE}/${PAT_SOURCE_SECRET_NAME}
            type: Opaque
            stringData:
              username: ${GIT_AUTH_USERNAME}
              password: ${pat}
            EOF
            kubectl apply -f /tmp/git-auth-secret.yaml
            echo "[flux-gitrepository-patch] basic-auth Secret applied"

            # Issue #891 — apply the patch via a YAML strategic-merge file
            # so the multi-line ignore filter is shipped verbatim. JSON-
            # patching a multi-line string from sh is a rabbit-hole of
            # quoting; YAML lets us write it as a literal block.
            # #3536 — the patch ALSO sets spec.secretRef.name so the
            # post-flip GitRepository authenticates to the local Gitea.
            cat >/tmp/patch.yaml <<EOF
            spec:
              url: ${LOCAL_GITEA_URL}
              ref:
                branch: ${BRANCH}
              secretRef:
                name: ${GIT_AUTH_SECRET_NAME}
              ignore: |
                /*
                !/clusters/_template
                !/clusters/${SOVEREIGN_FQDN}
                !/platform
                !/products
            EOF
            echo "[flux-gitrepository-patch] applying patch (URL -> local Gitea, secretRef -> ${GIT_AUTH_SECRET_NAME}, ignore widened to include clusters/${SOVEREIGN_FQDN}/)"
            kubectl patch gitrepository "${GITREPO_NAME}" \
              -n "${GITREPO_NAMESPACE}" \
              --type=merge --patch-file /tmp/patch.yaml
            kubectl annotate --overwrite gitrepository "${GITREPO_NAME}" \
              -n "${GITREPO_NAMESPACE}" \
              "reconcile.fluxcd.io/requestedAt=$(date +%s)"
            echo "[flux-gitrepository-patch] control-plane region done"

            # ── #5359: SECONDARY-REGION legs ─────────────────────────────
            # /secondary-kubeconfigs is the optional:true mount of the
            # cutover-secondary-kubeconfigs Secret (one <regionKey>.yaml per
            # secondary region, materialised by catalyst-api at run start).
            # Empty/absent = single-region Sovereign = this whole block
            # no-ops (pre-#5359 behavior byte-identical).
            #
            # #5359 CANDIDATE URL CHAIN (hw292, dep 1c56518035a83e03). The leg
            # used to pivot the secondary to LOCAL_GITEA_URL unconditionally —
            # `http://gitea-http.gitea.svc.cluster.local:3000`. That name does
            # NOT reach region-A from a secondary region, and the mesh alias
            # below cannot make it: a 2-region Sovereign installs bp-gitea in
            # BOTH regions from the bootstrap-kit, so the secondary already runs
            # its own `gitea/gitea-http` Service whose selector matches its own
            # (empty, never mirrored) Gitea pod; and BOTH Services are HEADLESS
            # (clusterIP: None), which Cilium ClusterMesh global-services cannot
            # span at all — a headless Service is resolved by CoreDNS straight
            # from the LOCAL EndpointSlice, so `service.cilium.io/global` is
            # inert on it. Live on hw292: region-b resolved that name to
            # 10.43.3.228, its OWN gitea pod, whose openova/openova advertises
            # zero refs, giving source-controller "pkt-line 3: EOF" on every
            # fetch from 07:39:48Z onward.
            #
            # So the URL is a candidate, not a certainty, and the only honest
            # prober is the secondary's OWN source-controller: it dials the exact
            # URL, from the right cluster, with the right credential. Each
            # candidate is patched in and given a bounded window to CONVERGE
            # (below); the first that converges wins, and exhausting the chain is
            # fatal. The fallback is the Sovereign's own external Gitea door,
            # which is on-Sovereign (it satisfies the step-08 source-host lint's
            # *.<SOVEREIGN_FQDN> exemption, and the step-08 secondary hold
            # already carves out that gateway's public IPs) and was
            # live-verified reachable from hw292 region-b, serving the pivoted
            # revision 7bcd1d59... byte-identical to region-A's in-cluster Gitea.
            sec_url_chain="${SECONDARY_GITEA_URL:-}"
            if [ -z "${sec_url_chain}" ]; then
              sec_url_chain="${LOCAL_GITEA_URL}"
              [ -n "${SECONDARY_GITEA_FALLBACK_URL:-}" ] && sec_url_chain="${sec_url_chain} ${SECONDARY_GITEA_FALLBACK_URL}"
            fi
            echo "[flux-gitrepository-patch] #5359 secondary candidate URL chain: ${sec_url_chain}"
            for skc in /secondary-kubeconfigs/*.yaml; do
              [ -e "${skc}" ] || continue
              region=$(basename "${skc}" .yaml)
              echo "[flux-gitrepository-patch] #5359 secondary region ${region}: pivoting its GitRepository -> ${sec_url}"

              # 1a. Share region-A's gitea-http endpoints into the mesh (the
              # bp-cnpg-pair global-Service idiom). Annotating the LIVE
              # Service is additive + idempotent; the durable bp-gitea-side
              # annotation is tracked on #5359.
              kubectl -n gitea annotate --overwrite service gitea-http \
                "service.cilium.io/global=true" "service.cilium.io/shared=true" \
                || echo "[flux-gitrepository-patch] WARN: could not annotate gitea/gitea-http global (mesh share) — secondary clone will fail if the alias has no reachable backend"

              # 1b. Same-named zero-backend alias Service in the SECONDARY
              # cluster so gitea-http.gitea.svc resolves there and the dial
              # crosses the mesh to region-A (bp-openbao
              # cross-region-mesh-service.yaml is the reference shape).
              cat >/tmp/gitea-mesh-alias.yaml <<EOF
            apiVersion: v1
            kind: Namespace
            metadata:
              name: gitea
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: gitea-http
              namespace: gitea
              labels:
                app.kubernetes.io/managed-by: self-sovereign-cutover
                catalyst.openova.io/component: cutover-secondary-gitea-mesh-alias
              annotations:
                service.cilium.io/global: "true"
                catalyst.openova.io/mirrored-from: region-a/gitea/gitea-http
            spec:
              type: ClusterIP
              selector:
                app.kubernetes.io/name: gitea
              ports:
                - name: http
                  port: 3000
                  targetPort: 3000
                  protocol: TCP
            EOF
              kubectl --kubeconfig "${skc}" apply -f /tmp/gitea-mesh-alias.yaml

              # 2. Basic-auth Secret in the secondary's flux-system (same PAT
              # bytes written to /tmp/git-auth-secret.yaml above).
              kubectl --kubeconfig "${skc}" apply -f /tmp/git-auth-secret.yaml

              # 3. Same patch shape as region-A (URL may differ via
              # secondaryRegions.giteaURL).
              if ! kubectl --kubeconfig "${skc}" get gitrepository "${GITREPO_NAME}" -n "${GITREPO_NAMESPACE}" >/dev/null 2>&1; then
                echo "[flux-gitrepository-patch] #5359 secondary ${region}: GitRepository ${GITREPO_NAMESPACE}/${GITREPO_NAME} absent — no flux git tether to pivot in this region; recording skipped"
                kubectl -n "${CUTOVER_NAMESPACE}" patch configmap "${STATUS_CONFIGMAP}" --type=merge \
                  -p "{\"data\":{\"step.flux-gitrepository-patch.region.${region}.result\":\"skipped\",\"step.flux-gitrepository-patch.region.${region}.finishedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}" || true
                continue
              fi
              sg_ready=""
              sg_chosen=""
              sg_msg=""
              for sec_url in ${sec_url_chain}; do
                echo "[flux-gitrepository-patch] #5359 secondary ${region}: trying candidate ${sec_url}"
                cat >/tmp/patch-secondary.yaml <<EOF
            spec:
              url: ${sec_url}
              ref:
                branch: ${BRANCH}
              secretRef:
                name: ${GIT_AUTH_SECRET_NAME}
              ignore: |
                /*
                !/clusters/_template
                !/clusters/${SOVEREIGN_FQDN}
                !/platform
                !/products
            EOF
                kubectl --kubeconfig "${skc}" patch gitrepository "${GITREPO_NAME}" \
                  -n "${GITREPO_NAMESPACE}" \
                  --type=merge --patch-file /tmp/patch-secondary.yaml
                kubectl --kubeconfig "${skc}" annotate --overwrite gitrepository "${GITREPO_NAME}" \
                  -n "${GITREPO_NAMESPACE}" \
                  "reconcile.fluxcd.io/requestedAt=$(date +%s)"

                # 4. FAIL-LOUD readiness. #5359 (hw292): the predicate here USED
                # to be `Ready == True && spec.url == sec_url`, and both halves
                # were unsound.
                #
                #   * `spec.url` is the value this leg had just WRITTEN one line
                #     earlier, so that half is a tautology — it can never be
                #     false and it proves nothing about the fetch.
                #   * `Ready` is a STATUS field, and immediately after a patch it
                #     still describes the PREVIOUS spec. On hw292 the object went
                #     into the loop carrying Ready=True from its last successful
                #     clone of PUBLIC github.com, so the very first iteration
                #     matched and the leg recorded result=success at 07:39:48Z —
                #     the same second the Ready condition actually flipped to
                #     False. The controller then never advanced past
                #     observedGeneration=1 while metadata.generation stayed 2,
                #     and 22h later it was still serving that pre-pivot GitHub
                #     artifact.
                #
                # The sound predicate is CONVERGENCE: source-controller has
                # processed THIS generation (observedGeneration == generation)
                # and the outcome was success (Ready=True). Nothing else can
                # distinguish "fetched from the new URL" from "still holding what
                # it fetched from the old one".
                sg_deadline=$(( $(date +%s) + ${SECONDARY_GITREPO_READY_SECONDS} ))
                while [ "$(date +%s)" -lt "${sg_deadline}" ]; do
                  sg_json=$(kubectl --kubeconfig "${skc}" get gitrepository "${GITREPO_NAME}" -n "${GITREPO_NAMESPACE}" \
                    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}|{.metadata.generation}|{.status.observedGeneration}|{.spec.url}' 2>/dev/null || echo "")
                  sg_status=$(printf '%s' "${sg_json}" | cut -d'|' -f1)
                  sg_gen=$(printf '%s' "${sg_json}" | cut -d'|' -f2)
                  sg_obs=$(printf '%s' "${sg_json}" | cut -d'|' -f3)
                  sg_url=$(printf '%s' "${sg_json}" | cut -d'|' -f4)
                  if [ "${sg_status}" = "True" ] && [ -n "${sg_gen}" ] && [ "${sg_obs}" = "${sg_gen}" ] && [ "${sg_url}" = "${sec_url}" ]; then
                    sg_ready="yes"
                    sg_chosen="${sec_url}"
                    break
                  fi
                  echo "[flux-gitrepository-patch] #5359 secondary ${region}: Ready=${sg_status:-<none>} generation=${sg_gen:-<none>} observedGeneration=${sg_obs:-<none>} (need observedGeneration==generation on a Ready source) — re-checking in 10s"
                  sleep 10
                done
                [ -n "${sg_ready}" ] && break
                sg_msg=$(kubectl --kubeconfig "${skc}" get gitrepository "${GITREPO_NAME}" -n "${GITREPO_NAMESPACE}" \
                  -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}' 2>/dev/null || echo "")
                echo "[flux-gitrepository-patch] #5359 secondary ${region}: candidate ${sec_url} did not converge within ${SECONDARY_GITREPO_READY_SECONDS}s: ${sg_msg}"
              done
              if [ -z "${sg_ready}" ]; then
                echo "[flux-gitrepository-patch] FATAL: secondary region ${region} GitRepository did not CONVERGE (observedGeneration==generation with Ready=True) on any candidate URL in [${sec_url_chain}] — last error: ${sg_msg}. region-B is still serving its pre-cutover artifact and every HelmRepository this cutover pivots there will be reverted on the next Kustomization interval; refusing to succeed (#5359)" >&2
                kubectl -n "${CUTOVER_NAMESPACE}" patch configmap "${STATUS_CONFIGMAP}" --type=merge \
                  -p "{\"data\":{\"step.flux-gitrepository-patch.region.${region}.result\":\"failed\",\"step.flux-gitrepository-patch.region.${region}.finishedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"step.flux-gitrepository-patch.region.${region}.lastError\":\"$(printf '%s' "${sg_msg}" | tr -d '\"' | cut -c1-200)\"}}" || true
                exit 1
              fi

              # 5. Per-region durable tracking (#5359). giteaURL records WHICH
              # candidate converged, so an operator can see from the status
              # ConfigMap alone whether the secondary took the in-cluster mesh
              # path or the Sovereign's external Gitea door.
              kubectl -n "${CUTOVER_NAMESPACE}" patch configmap "${STATUS_CONFIGMAP}" --type=merge \
                -p "{\"data\":{\"step.flux-gitrepository-patch.region.${region}.result\":\"success\",\"step.flux-gitrepository-patch.region.${region}.finishedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"step.flux-gitrepository-patch.region.${region}.giteaURL\":\"${sg_chosen}\"}}" || true
              echo "[flux-gitrepository-patch] #5359 secondary region ${region}: GitRepository CONVERGED on ${sg_chosen} (observedGeneration==generation, Ready=True)"
            done
            echo "[flux-gitrepository-patch] done"
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { memory: 256Mi }
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # Issue #891 — /tmp emptyDir for the kubectl patch-file
        # (readOnlyRootFilesystem blocks writes to /tmp without it).
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          # #5359 — optional secondary-region kubeconfigs (empty on a
          # single-region Sovereign; the leg no-ops).
          - name: secondary-kubeconfigs
            mountPath: /secondary-kubeconfigs
            readOnly: true
    volumes:
      - name: tmp
        emptyDir: {}
      # #5359 — materialised by catalyst-api (cutover.go runCutover) from its
      # on-PVC secondary kubeconfig store at every run start; optional:true
      # so a single-region Sovereign (no Secret) schedules unchanged.
      - name: secondary-kubeconfigs
        secret:
          secretName: {{ .Values.secondaryRegions.kubeconfigSecretName }}
          optional: true
