{{- /*
Step 01 — gitea-mirror.

Mirrors the upstream openova-io public repo into the local Sovereign
Gitea so subsequent Flux GitRepository pivots resolve against in-cluster
DNS. This step is the canonical seam: catalyst-api stamps a Job from
this PodSpec exactly once per cutover.

Consumer contract (catalyst-api cutover endpoint, issue #792):
  - Discovered by labels app.kubernetes.io/part-of=self-sovereign-cutover
    + app.kubernetes.io/component=cutover-step.
  - Order = bp.openova.io/cutover-order label (integer, ascending).
  - Mode = bp.openova.io/cutover-mode label ("job" here).
  - Required data keys:
      stepName  short slug used in status ConfigMap + Job naming
      podSpec   YAML of corev1.PodSpec; catalyst-api wraps it in
                PodTemplateSpec + batchv1.Job.

Image phase: pre — runs BEFORE registries.yaml v2 is active.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cutover-step-01-gitea-mirror
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-self-sovereign-cutover.labels" . | nindent 4 }}
    app.kubernetes.io/component: cutover-step
    bp.openova.io/cutover-order: "1"
    bp.openova.io/cutover-mode: "job"
data:
  stepName: gitea-mirror
  podSpec: |
    serviceAccountName: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
    restartPolicy: Never
    activeDeadlineSeconds: {{ .Values.stepTimeouts.giteaMirrorSeconds }}
    containers:
      - name: gitea-mirror
        {{- /*
         #3584 — image is now the alpine/k8s (images.kubectl) image, NOT
         alpine/git. We need `kubectl` to read the cross-namespace
         `catalyst-gitea-token` PAT from catalyst-system (same as step-05
         #3536) + `curl` for token-auth API calls; alpine/k8s bundles
         kubectl + curl + git (steps 05/06/07/09/10 already git clone/push
         from this image). The git clone/push below is unchanged.
        */}}
        image: {{ include "bp-self-sovereign-cutover.image" (dict "repository" .Values.images.kubectl.repository "tag" .Values.images.kubectl.tag "cutoverPhase" "pre" "Values" .Values) }}
        imagePullPolicy: IfNotPresent
        env:
          - name: UPSTREAM_REPO_URL
            value: {{ .Values.upstream.repoURL | quote }}
          - name: UPSTREAM_BRANCH
            value: {{ .Values.upstream.branch | quote }}
          - name: GITEA_INTERNAL_URL
            value: {{ .Values.sovereign.giteaInternalURL | quote }}
          - name: GITEA_ORG
            value: {{ .Values.gitea.org | quote }}
          - name: GITEA_REPO
            value: {{ .Values.gitea.repo | quote }}
          - name: MIRROR_INTERVAL
            value: {{ .Values.upstream.mirrorInterval | quote }}
          {{- /*
           #3584 — Gitea git-push username. A Gitea PAT is accepted as the
           HTTP git password under ANY existing username; we use the admin
           login (`gitea_admin`) for auditability. The git push embeds
           ${GITEA_USERNAME}:${GITEA_PAT}@ in the URL.
          */}}
          - name: GITEA_USERNAME
            value: {{ .Values.gitRepositorySecretRef.username | quote }}
          {{- /*
           #3584 — PAT source coordinates (reuses the step-05 #3536 values
           block). The `catalyst-gitea-token` PAT is minted at BOOTSTRAP by
           bp-catalyst-platform's pre-install hook in catalyst-system. We
           read it cross-namespace here. WHY token auth (not the admin
           password): bp-gitea configures an `openova-sso` OAuth2 login
           source; Gitea's apiAuth consults that EXTERNAL source when
           validating a BasicAuth PASSWORD, so during the cutover window
           (Keycloak still converging) every BasicAuth API call hangs
           ~130s then 401s (v1/api.go:748). A PAT is a direct local sha1
           lookup that never touches the external source → fast + immune.
          */}}
          - name: PAT_SOURCE_NAMESPACE
            value: {{ .Values.gitRepositorySecretRef.patSourceNamespace | quote }}
          - name: PAT_SOURCE_SECRET_NAME
            value: {{ .Values.gitRepositorySecretRef.patSourceSecretName | quote }}
          - name: PAT_SOURCE_KEY
            value: {{ .Values.gitRepositorySecretRef.patSourceKey | quote }}
          {{- if .Values.secondaryRegions.mirrorToSecondaryGitea }}
          {{- /*
           #6490 — inputs for the secondary-region mirror leg. The per-secondary
           mirror Job manifest is fully rendered in the cutover-secondary-mirror-
           script ConfigMap (mounted at /secondary-mirror); this leg only needs
           to know WHERE in each secondary to stamp it and HOW LONG to wait.
          */}}
          - name: SECONDARY_GITEA_NAMESPACE
            value: {{ .Values.secondaryRegions.secondaryGiteaNamespace | quote }}
          - name: MIRROR_JOB_WAIT_SECONDS
            value: {{ .Values.secondaryRegions.mirrorJobWaitSeconds | quote }}
          - name: MIRROR_JOB_POLL_SECONDS
            value: {{ .Values.secondaryRegions.mirrorJobPollSeconds | quote }}
          {{- end }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            {{- /*
             Credential hygiene: never echo $GITEA_PAT. We feed it to git
             via URL embedding only inside the redirected http call below;
             stdout shows just the redacted form. The HTTP API calls use
             an `Authorization: token <PAT>` header (#3584 — was BasicAuth,
             which hangs ~130s then 401s because Gitea's apiAuth consults
             the external openova-sso OAuth2 source for password creds).
            */}}
            redacted_url="${GITEA_INTERNAL_URL}/${GITEA_ORG}/${GITEA_REPO}.git"
            echo "[gitea-mirror] upstream=${UPSTREAM_REPO_URL} branch=${UPSTREAM_BRANCH}"
            echo "[gitea-mirror] target=${redacted_url}"
            echo "[gitea-mirror] mirror_interval=${MIRROR_INTERVAL}"

            {{- /*
             #968 — DNS-readiness probe for gitea-http.

             The cutover auto-trigger fires within seconds of bp-self-
             sovereign-cutover Helm-install completing. On a fresh
             Sovereign the gitea Pod can still be moving from Running
             to Ready, in which case the headless service `gitea-http`
             has no DNS record published yet. Without this probe the
             very first wget call returns `bad address` and the Job
             exits non-zero. catalyst-api's cutover engine treats that
             as a hard failure (per cutover.go #968 backoffLimit was
             raised to 3, but local resolve here is cheaper and faster
             than burning Pod-restart budget). On otech115 2026-05-05
             this race fired Step-01 at +8s after gitea reached Ready
             and DNS hadn't propagated; one nslookup wait of ~10s would
             have been sufficient. Loop budget = 30 × 5s = 150s, well
             under the step's activeDeadlineSeconds.
            */}}
            gitea_host="$(printf '%s' "${GITEA_INTERNAL_URL}" | sed -E 's|^https?://||' | cut -d: -f1 | cut -d/ -f1)"
            if [ -n "${gitea_host}" ]; then
              echo "[gitea-mirror] waiting for DNS resolution of ${gitea_host}"
              dns_ready="false"
              for i in $(seq 1 30); do
                if nslookup "${gitea_host}" >/dev/null 2>&1; then
                  echo "[gitea-mirror] DNS ready for ${gitea_host} (attempt ${i})"
                  dns_ready="true"
                  break
                fi
                sleep 5
              done
              if [ "${dns_ready}" != "true" ]; then
                echo "[gitea-mirror] FATAL: ${gitea_host} did not resolve within 150s" >&2
                exit 1
              fi
            fi

            {{- /*
             #3584 — read the `catalyst-gitea-token` PAT (minted at BOOTSTRAP
             by bp-catalyst-platform in ${PAT_SOURCE_NAMESPACE}). All Gitea
             API calls below send `Authorization: token ${GITEA_PAT}`; the
             git push embeds ${GITEA_USERNAME}:${GITEA_PAT}@ in the URL. This
             replaces the admin-password BasicAuth that hung ~130s then 401s
             during the cutover window (Keycloak still converging — apiAuth
             consults the external openova-sso OAuth2 source for password
             creds; token auth is a direct local sha1 lookup, immune).
             Bounded wait: the PAT Secret exists from bootstrap but its
             `token` byte may be momentarily empty if the minter is mid-flight.
            */}}
            echo "[gitea-mirror] reading PAT ${PAT_SOURCE_NAMESPACE}/${PAT_SOURCE_SECRET_NAME}.${PAT_SOURCE_KEY}"
            GITEA_PAT=""
            for i in $(seq 1 30); do
              GITEA_PAT=$(kubectl -n "${PAT_SOURCE_NAMESPACE}" get secret "${PAT_SOURCE_SECRET_NAME}" \
                -o "jsonpath={.data.${PAT_SOURCE_KEY}}" 2>/dev/null | base64 -d 2>/dev/null || true)
              if [ -n "${GITEA_PAT}" ]; then
                echo "[gitea-mirror] PAT present (attempt ${i})"
                break
              fi
              echo "[gitea-mirror] PAT not yet populated in ${PAT_SOURCE_NAMESPACE}/${PAT_SOURCE_SECRET_NAME} (attempt ${i}/30) — sleeping 5s"
              sleep 5
            done
            if [ -z "${GITEA_PAT}" ]; then
              echo "[gitea-mirror] FATAL: ${PAT_SOURCE_NAMESPACE}/${PAT_SOURCE_SECRET_NAME}.${PAT_SOURCE_KEY} empty after 150s — bp-catalyst-platform PAT mint did not complete; refusing to mirror with no usable credential (BasicAuth fallback would hang ~130s then 401 during the cutover window)" >&2
              exit 1
            fi

            {{- /*
             1. Ensure the org exists in Gitea (idempotent — POST /orgs
                returns 422 if a same-named user exists, 422 if org
                exists, 201 on create). We swallow non-201 because the
                "already exists" surface is the steady-state path. curl -f
                makes the existence GET return non-zero on any 4xx so the
                "missing" branch fires only when the org truly absent.
            */}}
            api_url="${GITEA_INTERNAL_URL}/api/v1"
            if curl -fsS -o /dev/null \
              -H "Authorization: token ${GITEA_PAT}" \
              -H "Accept: application/json" \
              "${api_url}/orgs/${GITEA_ORG}" 2>/dev/null; then
              echo "[gitea-mirror] org already present"
            else
              echo "[gitea-mirror] creating org ${GITEA_ORG}"
              curl -fsS -o /dev/null \
                -X POST \
                -H "Authorization: token ${GITEA_PAT}" \
                -H "Content-Type: application/json" \
                -d "{\"username\":\"${GITEA_ORG}\",\"visibility\":\"public\"}" \
                "${api_url}/orgs" 2>/dev/null || true
            fi

            {{- /*
             2. Ensure the repo exists in Gitea as a REGULAR (non-mirror)
                repository, then bare-clone upstream and push so the
                local Gitea has the same content. This replaces the
                earlier `/repos/migrate {mirror:true}` approach (PR
                #970) — Gitea pull-mirrors are read-only and block the
                cutover step-06 push that pivots HelmRepository URLs
                to local Harbor (see PR #1029, otech125 incident).
                Gitea 1.22 does not support converting a pull-mirror
                to standalone via API (only `mirror_interval: "0s"`
                silently no-ops, leaving `mirror: true` set, which
                keeps the repo read-only). The architecturally correct
                behaviour at cutover IS to stop tracking upstream — the
                Sovereign is going self-hosted from this point on. If
                operator wants a chart rollout post-cutover they
                re-run this Job (idempotent: rebases local main on
                upstream main and force-pushes any new commits).
            */}}
            if curl -fsS -o /dev/null \
              -H "Authorization: token ${GITEA_PAT}" \
              -H "Accept: application/json" \
              "${api_url}/repos/${GITEA_ORG}/${GITEA_REPO}" 2>/dev/null; then
              echo "[gitea-mirror] repo already present (idempotent re-run); refreshing content"
            else
              echo "[gitea-mirror] creating empty repo ${GITEA_ORG}/${GITEA_REPO}"
              create_payload=$(printf '{"name":"%s","auto_init":false,"private":false,"description":"Self-hosted clone of %s (post-cutover, standalone)"}' \
                "${GITEA_REPO}" "${UPSTREAM_REPO_URL}")
              curl -fsS -o /dev/null \
                -X POST \
                -H "Authorization: token ${GITEA_PAT}" \
                -H "Content-Type: application/json" \
                -d "${create_payload}" \
                "${api_url}/orgs/${GITEA_ORG}/repos" 2>&1 || true
              if ! curl -fsS -o /dev/null \
                -H "Authorization: token ${GITEA_PAT}" \
                -H "Accept: application/json" \
                "${api_url}/repos/${GITEA_ORG}/${GITEA_REPO}" 2>/dev/null; then
                echo "[gitea-mirror] FATAL: repo create failed — not visible after POST" >&2
                exit 1
              fi
              echo "[gitea-mirror] empty repo created"
            fi

            {{- /*
             3. Bare-clone upstream and push to local Gitea via EXPLICIT
                refspecs — refs/heads/* + refs/tags/* — NEVER mirror mode
                (#5011). Mirror mode makes the remote EXACTLY match the
                clone, DELETING refs absent upstream; on hw242 (2026-07-12,
                dep f05b0718dac62fe9) it pruned the sovereign-LOCAL branches
                `catalog-sovereign` (catalyst-api catalog seed) and
                `org-tenants` (org-controller per-Org GitOps tree) — both
                exist ONLY in the local Gitea, never on GitHub — breaking
                the flux GitRepositories openova-catalog-sovereign +
                openova-org-tenants mid-cutover. The explicit refspecs
                force-update/create every GitHub-derived branch + tag
                (--force keeps re-runs idempotent even after an upstream
                history rewrite) but never touch remote-only refs.
            */}}
            export HOME=/tmp
            git config --global user.name "self-sovereign-cutover"
            git config --global user.email "cutover@${gitea_host}"
            git config --global advice.detachedHead false
            {{- /*
             #6487: the openova monorepo has grown (472 MB bare, ~19 min over
             the kom4dc IPv4-only egress). The default git-over-HTTP transfer
             early-EOFs / RPC-fails on a repo this size, and the previous
             `git clone … >/dev/null 2>&1` both FAILED (Job backoffLimit
             exhausted → cutover wedged at step-01) AND swallowed the reason.
             Raise the HTTP buffer + tolerate a slow link, retry, and surface
             stderr. Measured: with these settings the bare clone completes.
            */}}
            git config --global http.postBuffer 1048576000
            git config --global http.lowSpeedLimit 1000
            git config --global http.lowSpeedTime 600

            local_url=$(printf '%s' "${GITEA_INTERNAL_URL}" | sed -E "s,^(https?://),\1${GITEA_USERNAME}:${GITEA_PAT}@,")"/${GITEA_ORG}/${GITEA_REPO}.git"
            workdir=$(mktemp -d)
            cd "${workdir}"
            echo "[gitea-mirror] cloning ${UPSTREAM_REPO_URL} (bare)"
            clone_err=""
            for _attempt in 1 2 3; do
              if clone_err=$(git clone --bare "${UPSTREAM_REPO_URL}" upstream.git 2>&1); then
                clone_err=""
                break
              fi
              echo "[gitea-mirror] clone attempt ${_attempt} failed: $(printf '%s' "${clone_err}" | tail -3)" >&2
              rm -rf upstream.git
              [ "${_attempt}" = 3 ] || sleep 10
            done
            if [ -n "${clone_err}" ]; then
              echo "[gitea-mirror] FATAL: git clone of ${UPSTREAM_REPO_URL} failed after 3 attempts" >&2
              exit 1
            fi
            cd upstream.git
            {{- /*
             #6754 — force-push the FULL upstream mirror, with CORRUPT-TARGET
             recovery. A target repo left with an empty/truncated git-receive-pack
             advertisement by prior partial pushes (live hw305 region-B: a 35-byte
             advertisement over ~556MB of orphaned objects, 8 days of failed pushes)
             can NEVER recover via force-push — git aborts against the empty
             advertisement BEFORE sending, surfacing only the generic "Could not
             read from remote repository" (the #6490 pkt-line 3 EOF class). It is
             NOT a size/ref-count limit: the identical mirror pushes to a FRESH repo
             with exit 0. So: push; if the push fails OR the default branch is absent
             afterwards, DELETE+RECREATE the repo clean (the admin-scoped
             catalyst-gitea-token can) and push once more against the fresh target.

             Explicit refspecs from the UPSTREAM clone only — never mirror mode — so
             a HEALTHY repo's sovereign-local refs catalog-sovereign / org-tenants
             are never sent nor pruned (#5011). A DELETE+RECREATE is only ever
             reached when the repo is ALREADY corrupt (those refs already unusable);
             it resets them, and catalyst-api's catalog-seed + the org-controller
             re-establish catalog-sovereign / org-tenants on their next reconcile.
            */}}
            echo "[gitea-mirror] pushing upstream branches + tags (explicit refspecs, never prunes sovereign-local refs) to ${redacted_url}"
            push_mirror() {
              git push --force "${local_url}" 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*' 2>&1
            }
            default_present() {
              git ls-remote --heads "${local_url}" 2>/dev/null | grep -q "refs/heads/${UPSTREAM_BRANCH}"
            }
            recreate_repo() {
              echo "[gitea-mirror] DELETE + RECREATE a clean ${GITEA_ORG}/${GITEA_REPO} (prior partial-push corruption; #6754). catalog-sovereign/org-tenants re-seed on the next catalyst-api / org-controller reconcile." >&2
              curl -fsS -o /dev/null --max-time 60 -X DELETE \
                -H "Authorization: token ${GITEA_PAT}" \
                "${api_url}/repos/${GITEA_ORG}/${GITEA_REPO}" 2>/dev/null || true
              sleep 2
              _re_payload=$(printf '{"name":"%s","auto_init":false,"private":false,"description":"Self-hosted clone of %s (post-cutover, standalone)"}' \
                "${GITEA_REPO}" "${UPSTREAM_REPO_URL}")
              curl -fsS -o /dev/null --max-time 60 -X POST \
                -H "Authorization: token ${GITEA_PAT}" -H "Content-Type: application/json" \
                -d "${_re_payload}" \
                "${api_url}/orgs/${GITEA_ORG}/repos" 2>/dev/null || true
              for _rr in 1 2 3 4 5 6; do
                if curl -fsS -o /dev/null --max-time 60 \
                    -H "Authorization: token ${GITEA_PAT}" -H "Accept: application/json" \
                    "${api_url}/repos/${GITEA_ORG}/${GITEA_REPO}" 2>/dev/null; then return 0; fi
                sleep 2
              done
              echo "[gitea-mirror] FATAL: ${GITEA_ORG}/${GITEA_REPO} not visible after DELETE+RECREATE" >&2
              return 1
            }
            push_ok=""
            if push_err=$(push_mirror) && default_present; then
              push_ok=1
            else
              echo "[gitea-mirror] initial push failed or default branch absent — target likely corrupt from prior partial pushes; recreating clean and retrying (#6754)" >&2
              printf '%s\n' "${push_err:-}" | sed -E "s,${GITEA_PAT}+,REDACTED,g" >&2 || true
              recreate_repo || exit 1
              if push_err=$(push_mirror) && default_present; then
                push_ok=1
              fi
            fi
            if [ -z "${push_ok}" ]; then
              echo "[gitea-mirror] FATAL: git push to local Gitea still failed after DELETE+RECREATE" >&2
              printf '%s\n' "${push_err:-}" | sed -E "s,${GITEA_PAT}+,REDACTED,g" >&2 || true
              exit 1
            fi
            echo "[gitea-mirror] pushed all upstream branches + tags successfully (sovereign-local refs untouched on the healthy path)"

            {{- /*
             4. Verify by reading back the default branch SHA and
                confirming non-empty (auto_init=false means a missing
                push leaves the repo "empty: true").
            */}}
            repo_meta=$(curl -fsS \
              -H "Authorization: token ${GITEA_PAT}" \
              -H "Accept: application/json" \
              "${api_url}/repos/${GITEA_ORG}/${GITEA_REPO}" 2>/dev/null || echo "{}")
            if printf '%s' "${repo_meta}" | grep -q '"empty":false'; then
              echo "[gitea-mirror] verified: repo has content (empty=false)"
            else
              echo "[gitea-mirror] WARN: repo metadata still reports empty=true — push may not have landed"
            fi
            if printf '%s' "${repo_meta}" | grep -q '"mirror":false'; then
              echo "[gitea-mirror] verified: mirror=false on ${GITEA_ORG}/${GITEA_REPO} (writable for cutover step-06)"
            fi

            {{- if .Values.secondaryRegions.mirrorToSecondaryGitea }}
            {{- /*
             ── #6490: mirror to EACH secondary region's OWN in-cluster Gitea ──
             The primary push above populated region-A only. A secondary's own
             gitea-http is HEADLESS and unreachable cross-region, so we run the
             mirror IN each secondary: distribute the shared cutover-secondary-
             mirror-script ConfigMap into the region's gitea namespace, then stamp
             the Helm-rendered mirror Job (only __REGION__ is sed-substituted). The
             Job clones upstream + force-pushes to the region-local Gitea using
             THAT region's OWN gitea-admin-secret + ls-remote self-verifies. It
             lands in the gitea namespace with the default SA because the cutover
             chart is SECONDARY_HR_SUSPEND'd on a secondary (no runner SA there)
             and the mirror makes no Kubernetes API calls. /secondary-kubeconfigs
             is the optional cutover-secondary-kubeconfigs mount; empty (single-
             region) makes this whole block a runtime no-op.
            */}}
            echo "[gitea-mirror] #6490 secondary-region mirror leg (mirrorToSecondaryGitea=true)"
            sec_any="false"
            for skc in /secondary-kubeconfigs/*.yaml; do
              [ -e "${skc}" ] || continue
              sec_any="true"
              region=$(basename "${skc}" .yaml)
              jobname=$(printf 'cutover-gitea-mirror-secondary-%s' "${region}" | cut -c1-63)
              echo "[gitea-mirror] #6490 secondary region ${region}: distributing mirror script + stamping in-region Job ${jobname} (ns ${SECONDARY_GITEA_NAMESPACE})"
              {{- /*
               Distribute the shared script ConfigMap into the secondary's gitea
               namespace, then (re)create the Job (delete a prior attempt first —
               a Job's pod template is immutable). The Job manifest is rendered in
               the mounted ConfigMap; only __REGION__ is substituted here.
              */}}
              kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" create configmap cutover-secondary-mirror-script \
                --from-file=secondary-mirror.sh=/secondary-mirror/secondary-mirror.sh \
                --dry-run=client -o yaml | kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" apply -f -
              {{- /*
               #6754 — distribute the region-A catalyst-gitea-token PAT (already in
               ${GITEA_PAT}) into this secondary's gitea namespace so its mirror Job
               authenticates with a credential valid in the SHARED gitea DB. The two
               regions share one database (region-B -> shared-pg-mesh-rw -> region-A's
               shared-pg primary), so region-B's own per-region admin password can
               never match the single gitea_admin row; the PAT is a row in the shared
               access_token table and authenticates identically from either region.
               Written via --from-file (never argv) so the token never appears in a
               process listing; the temp file is removed immediately after.
              */}}
              umask 077
              printf '%s' "${GITEA_PAT}" > /tmp/sec-pat-token
              kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" create secret generic {{ .Values.secondaryRegions.giteaPatSecretName }} \
                --from-file=token=/tmp/sec-pat-token \
                --dry-run=client -o yaml | kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" apply -f -
              rm -f /tmp/sec-pat-token
              kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" delete job "${jobname}" --ignore-not-found=true >/dev/null 2>&1 || true
              sed "s/__REGION__/${region}/g" /secondary-mirror/secondary-mirror-job.yaml >/tmp/secjob.yaml
              kubectl --kubeconfig "${skc}" apply -f /tmp/secjob.yaml
              echo "[gitea-mirror] #6490 secondary region ${region}: waiting up to ${MIRROR_JOB_WAIT_SECONDS}s for ${jobname}"
              sec_deadline=$(( $(date +%s) + ${MIRROR_JOB_WAIT_SECONDS} ))
              sec_done=""
              while [ "$(date +%s)" -lt "${sec_deadline}" ]; do
                sec_ok=$(kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" get job "${jobname}" -o jsonpath='{.status.succeeded}' 2>/dev/null || echo "")
                sec_fail=$(kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" get job "${jobname}" -o jsonpath='{.status.failed}' 2>/dev/null || echo "")
                if [ "${sec_ok}" = "1" ]; then sec_done="ok"; break; fi
                if [ -n "${sec_fail}" ] && [ "${sec_fail}" -ge 3 ] 2>/dev/null; then sec_done="fail"; break; fi
                sleep "${MIRROR_JOB_POLL_SECONDS}"
              done
              if [ "${sec_done}" != "ok" ]; then
                echo "[gitea-mirror] FATAL: #6490 secondary region ${region} mirror Job ${jobname} did not succeed within ${MIRROR_JOB_WAIT_SECONDS}s — its in-cluster Gitea has no complete ${GITEA_ORG}/${GITEA_REPO} and step-05 would pivot this region's Flux at an empty source (the pkt-line 3 EOF class, #6490)" >&2
                kubectl --kubeconfig "${skc}" -n "${SECONDARY_GITEA_NAMESPACE}" logs "job/${jobname}" --tail=40 2>/dev/null || true
                exit 1
              fi
              echo "[gitea-mirror] #6490 secondary region ${region}: mirror Job ${jobname} SUCCEEDED (region-local Gitea serves a complete ref advertisement)"
            done
            if [ "${sec_any}" != "true" ]; then
              echo "[gitea-mirror] #6490: no secondary-region kubeconfigs mounted — single-region Sovereign, secondary mirror is a no-op"
            fi
            {{- end }}

            {{- /*
             G75 #2622 (2026-05-31): SEVER UPSTREAM GIT TETHER (ADR-0002
             Pillar 5 contract). gitea-mirror-resync CronJob runs every
             5min doing a mirror-mode force-push from upstream → local
             Gitea, which CLOBBERS cutover Step 06+07 pushes. G62
             "Gitea persist" pattern has been a no-op architecturally
             because of this tether — Step 06+07 pushes survive ~5min
             then get force-overwritten. Verified live hw86
             afc8800bc03751c6 2026-05-31: Step 06 pushed HelmRepository
             URL pivot 11:34, mirror-resync fired 11:45 wiped it, Step
             08 fired 12:00 saw HRs still at ghcr.io → FAILED.

             B' shape (per lead): IaC removal (HR values flag) + live
             DELETE + post-verify wait window. Suspend would be a
             workaround per Principle 14 — severance must be irreversible.

             Order: HR patch FIRST (so Flux re-reconcile doesn't recreate
             after live delete), THEN live delete, THEN post-verify
             waits ≥1 mirror-resync interval to confirm the tether stays
             severed.
             G75 #3606 fast-path: with mirrorResync.enabled defaulting to
             false (values.yaml), template 11-mirror-resync-cronjob.yaml
             renders NOTHING — the gitea-mirror-resync CronJob never exists
             on a default Sovereign, so the tether is already severed at the
             IaC (git) layer. The old imperative `kubectl patch hr ...
             mirrorResync.enabled=false` was the #3606 bug: Flux owns this
             HR from git and REVERTED the patch every reconcile, re-rendering
             the CronJob → this 6-min post-verify FATAL'd → step-01 looped.
             We no longer patch the HR. We only DELETE + post-verify a
             rendered remnant when one actually exists (an operator overlay
             may have opted IN to mirrorResync pre-cutover).
            */}}
            if ! kubectl get cronjob -n {{ .Release.Namespace }} gitea-mirror-resync >/dev/null 2>&1; then
              echo "[gitea-mirror] G75 OK: mirror-resync already severed at IaC layer (mirrorResync.enabled=false default) — skipping live-delete + post-verify hold"
            else
              echo "[gitea-mirror] G75: severing upstream git tether (delete mirror-resync CronJob)"
              kubectl patch hr -n flux-system bp-self-sovereign-cutover \
                --type=merge \
                -p '{"spec":{"values":{"mirrorResync":{"enabled":false}}}}' 2>&1 || \
                echo "[gitea-mirror] G75 WARN: HR patch failed (cronjob will recreate after delete unless chart conditional gates it)"

              kubectl delete cronjob -n {{ .Release.Namespace }} gitea-mirror-resync --ignore-not-found=true 2>&1 || \
                echo "[gitea-mirror] G75 WARN: cronjob delete failed (RBAC?)"

              {{- /*
               Post-verify: wait 6min (>1 mirror-resync interval) + confirm
               CronJob still absent + confirm local Gitea HEAD unchanged.
              */}}
              CRONJOB_NS={{ .Release.Namespace }}
              for i in $(seq 1 6); do
                sleep 60
                if kubectl get cronjob -n "${CRONJOB_NS}" gitea-mirror-resync >/dev/null 2>&1; then
                  echo "[gitea-mirror] G75 FATAL: cronjob reappeared at ${i}min — Flux re-reconciled despite HR patch (template not conditional?)"
                  exit 1
                fi
                echo "[gitea-mirror] G75 post-verify (${i}/6): cronjob still absent"
              done
              echo "[gitea-mirror] G75 OK: upstream git tether severed (cronjob deleted + HR patched + 6min hold confirmed no recreate)"
            fi

            echo "[gitea-mirror] step complete"
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { memory: 1Gi }
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
        {{- if .Values.secondaryRegions.mirrorToSecondaryGitea }}
        {{- /*
         #6490 — optional secondary-region kubeconfigs (the cutover-secondary-
         kubeconfigs Secret catalyst-api materialises at run start; empty on a
         single-region Sovereign so the leg no-ops) + the shared mirror script
         this leg distributes into each secondary. Rendered ONLY when the flag is
         set so single-region provs stay byte-identical.
        */}}
        volumeMounts:
          - name: secondary-kubeconfigs
            mountPath: /secondary-kubeconfigs
            readOnly: true
          - name: secondary-mirror
            mountPath: /secondary-mirror
            readOnly: true
        {{- end }}
    {{- if .Values.secondaryRegions.mirrorToSecondaryGitea }}
    volumes:
      - name: secondary-kubeconfigs
        secret:
          secretName: {{ .Values.secondaryRegions.kubeconfigSecretName }}
          optional: true
      - name: secondary-mirror
        configMap:
          name: cutover-secondary-mirror-script
          defaultMode: 0755
    {{- end }}
