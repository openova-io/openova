{{- /*
Step 03 — harbor-prewarm. Image phase: pre.

Phase A (G66 #2615): skopeo NATIVE-PUSHES the images into local Harbor with
the ghcr.io PAT of flux-system/ghcr-pull (intact before the step-04 pivot and
the step-06 strip). Harbor's github-ghcr adapter cannot run ghcr.io's 2-step
`/token?scope=` flow (401 with a valid PAT, hw73 9d4a5b629fcc38bb), so a
proxy-cache is no route for them. The Sovereign then holds IMMUTABLE pushed
images and the deny-egress hold passes genuinely (docs/DOD.md Pillar 5).
Sources: the live walk of every region, the pinned charts (A2, A3), the kit's
manifests and Flux Kustomizations (#7938). Phase B HEADs the public proxy-*
paths of .Values.prewarm.images (legacy contract).
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cutover-step-03-harbor-prewarm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-self-sovereign-cutover.labels" . | nindent 4 }}
    app.kubernetes.io/component: cutover-step
    bp.openova.io/cutover-order: "3"
    bp.openova.io/cutover-mode: "job"
data:
  stepName: harbor-prewarm
  prewarm.list: |
    {{- range .Values.prewarm.images }}
    {{ . }}
    {{- end }}
  {{- /*
   Phase A2 (Refs #3627): the openova-io HelmRepository pivot set — the
   SAME list step-06 repoints to local Harbor. Phase A2 mirrors the helm
   CHART OCI artifact (not just the container images) for every HelmRelease
   whose sourceRef.name is one of these, so the charts are present + pullable
   in local Harbor BEFORE step-06 strips the ghcr.io fallback.
  */}}
  chart-mirror-names.txt: |
    {{- range .Values.helmRepositories.names }}
    {{ . }}
    {{- end }}
  {{- /*
   #5593 — the step script, mounted and exec'd FROM FILE. It must NEVER be
   inlined into the container args: the rendered script exceeds the kernel
   per-argument cap (MAX_ARG_STRLEN = 128 KiB), so the container dies at
   exec with "argument list too long" before a single line runs (live
   hw292 dep 1c56518035a83e03 — the cutover chain retry-looped at step 03
   forever). scripts/ CI guard asserts every step's inline args stay small.
  */}}
  run.sh: |
    set -eu
    : "${HARBOR_USERNAME:=admin}"

    {{- /*
     #6356 — RE-SEED THE STATUS ConfigMap IF IT IS EMPTY. 09-cutover-status-
     configmap.yaml carries `helm.sh/resource-policy: keep` (mid-cutover progress
     must survive an upgrade), so Helm never updates an existing object: an empty
     one has no reconcile path back, /jobs never renders 11 steps and
     cutoverComplete is unprovable (hw298 2026-08-15, ZERO data keys; UAT rows
     G11/166). This step always runs and holds STATUS_CONFIGMAP_NAME/NAMESPACE;
     its merge patch only ADDS absent keys: it fills a gap, never overwrites a
     verdict.
    */}}
    if [ -n "${STATUS_CONFIGMAP_NAME:-}" ] && [ -n "${STATUS_CONFIGMAP_NAMESPACE:-}" ]; then
      _seed_total="$(kubectl get configmap "${STATUS_CONFIGMAP_NAME}" -n "${STATUS_CONFIGMAP_NAMESPACE}" -o jsonpath='{.data.totalSteps}' 2>/dev/null || true)"
      if [ -z "${_seed_total}" ]; then
        echo "[harbor-prewarm] #6356: status ConfigMap ${STATUS_CONFIGMAP_NAMESPACE}/${STATUS_CONFIGMAP_NAME} has no totalSteps — re-seeding (resource-policy:keep means Helm cannot)"
        if kubectl patch configmap "${STATUS_CONFIGMAP_NAME}" -n "${STATUS_CONFIGMAP_NAMESPACE}" --type merge -p '{"data":{"totalSteps":"11","reseededBy":"harbor-prewarm-6356"}}' >/dev/null 2>&1; then
          echo "[harbor-prewarm] #6356: re-seeded totalSteps=11"
        else
          echo "[harbor-prewarm] #6356: WARN could not re-seed the status ConfigMap — cutover continues, but /jobs may not render all 11 steps"
        fi
      else
        echo "[harbor-prewarm] #6356: status ConfigMap already seeded (totalSteps=${_seed_total}) — no write"
      fi
    fi

    {{- /*
     #4975 — the offline-mirror image→local-path resolver (shared with
     step-08). Defines offlinemirror_normalize_ref + offlinemirror_local_paths
     over the HOST_PROJECT_MAP / EXCLUDED_* / LOCAL_REGISTRY_HOST env.
    */}}
    . /resolver/resolver.sh
    {{- /*
     #5443 — the catalog chart-set extractor (03c). Defines
     catalog_chart_set + catalog_guard_missing + chart_declared_images.
     Pure functions; sourced here so Phase A2-catalog, the Phase
     A2-guard and Phase A3-catalog-images all read ONE definition of
     "what the marketplace offers".
    */}}
    . /catalog-set/catalog-set.sh
    echo "[harbor-prewarm] offline-mirror map: ${HOST_PROJECT_MAP}"
    echo "[harbor-prewarm] local registry host: ${LOCAL_REGISTRY_HOST}; excluded hosts: ${EXCLUDED_HOSTS:-<none>}"

    {{- /* ─── Phase A: skopeo native push of openova-io images ────── */}}
    echo "[harbor-prewarm] Phase A: install skopeo + jq + enumerate openova-io images"
    {{- /*
     G69 #2618 (hw78 de7f6aa8d5ef12b5): the apk repos of alpine/k8s:1.31.4 do
     not carry skopeo, so `apk add skopeo` silently no-ops and the chain stops
     at step 03. Fix: the static skopeo binary from GitHub releases via curl,
     apk as the fallback. jq is verified and apk-installed if absent.
    */}}
    apk add --no-cache jq >/dev/null 2>&1 || true
    if ! command -v jq >/dev/null 2>&1; then
      echo "[harbor-prewarm] FATAL: jq missing + apk install failed"
      exit 1
    fi
    if ! command -v kubectl >/dev/null 2>&1; then
      echo "[harbor-prewarm] FATAL: kubectl missing from image"
      exit 1
    fi

    {{- /*
     ─── Phase A0: settled-roll pre-flight (#4982 #5391, Refs #3379) ───
     Phase A mirrors the RUNNING / declared-template image tags. A HOST-cluster
     HelmRelease or Deployment/StatefulSet that is MID-ROLL (pin bumped, not yet
     reconciled) has running != desired: steps 04/07 later roll it to a DESIRED
     tag never mirrored here, and step-06's readiness sample + step-08's
     completeness HEAD 404 on it (hw239: umbrella running 1.4.1086, pin
     1.4.1088). Once step-05 freezes Flux at the cutover-start sha the roll can
     never finish, and the deny-egress hold deadlocks on it. Still PRE-PIVOT
     (steps 01/02 are idempotent), the gate REFUSES an unsettled env, naming
     every offender; the operator waits and re-triggers. It runs before the
     skopeo download, so it fails fast.

     #5391 NAMED OPERATOR OVERRIDE: an HR at Stalled=True has stopped retrying
     for good (hw290/hw291, #5393) and held the whole cutover closed. A
     sovereign-admin may exclude ONE genuinely-stuck release:
       kubectl annotate helmrelease <name> -n <ns> \
         catalyst.openova.io/cutover-settled-roll-override="<reason>"
     Validated FAIL-CLOSED: an empty reason, a HEALTHY release, or one still
     mid-roll (neither Stalled=True nor Ready.reason=DependencyNotReady) FATALs.
     Honored overrides are recorded in the cutover status ConfigMap
     (settledRollOverrides / settledRollOverridesAt; GET /sovereign/cutover/status
     and the console show them); one that cannot be recorded is REFUSED. The
     exclusion narrows only the settle CHECK: Phase A / A2 still mirror the
     excluded release's images and charts.

     A DELIVERY of a candidate does not gate a release the candidate repairs: word for word above the key
     prewarm.settledRollPreflight of values.yaml (#6004).
    */}}
    {{- /*
     The kit's slot files at ${UPSTREAM_BRANCH} of the local Gitea mirror into $1, setting bk_pat, bk_api,
     bk_path and bk_list for prewarm_kit_get; 1 after a FATAL line when the PAT, the listing or a file
     cannot be read (#5237). Phase A2-pins reads the kit through it, a delivery's Phase A0 too.
     The catalyst-gitea-token PAT — same coordinates + bounded wait as steps 01/05 (BasicAuth would hang
     ~130s then 401 while Keycloak converges). Never echoed; sent only via the Authorization header.
     Listing via the Gitea contents API, then each slot file raw: ~70 small fetches, lighter than a clone.
    */}}
    prewarm_kit_fetch() {
      bk_dir="$1"
      bk_pat=""
      for i in $(seq 1 12); do
        bk_pat=$(kubectl -n "${PAT_SOURCE_NAMESPACE}" get secret "${PAT_SOURCE_SECRET_NAME}" \
          -o "jsonpath={.data.${PAT_SOURCE_KEY}}" 2>/dev/null | base64 -d 2>/dev/null || true)
        [ -n "${bk_pat}" ] && break
        echo "[harbor-prewarm] Phase A2-pins: PAT not yet populated in ${PAT_SOURCE_NAMESPACE}/${PAT_SOURCE_SECRET_NAME} (attempt ${i}/12) — sleeping 5s"
        sleep 5
      done
      if [ -z "${bk_pat}" ]; then
        echo "[harbor-prewarm] FATAL: ${PAT_SOURCE_NAMESPACE}/${PAT_SOURCE_SECRET_NAME}.${PAT_SOURCE_KEY} empty after 60s — cannot read the local Gitea mirror's bootstrap-kit pins, so the mirror set cannot be proven to cover the frozen flux pin set (#5237). Emergency override: prewarm.bootstrapKitPins.enabled=false."
        return 1
      fi
      rm -rf "${bk_dir}"; mkdir -p "${bk_dir}"
      bk_api="${GITEA_INTERNAL_URL%/}/api/v1/repos/${GITEA_ORG}/${GITEA_REPO}"
      bk_path="clusters/_template/bootstrap-kit"
      bk_list=$(curl -fsS --retry 3 --retry-delay 5 \
        -H "Authorization: token ${bk_pat}" \
        "${bk_api}/contents/${bk_path}?ref=${UPSTREAM_BRANCH}" 2>/dev/null \
        | jq -r '.[] | select(.type=="file") | .name | select(test("^[0-9].*\\.ya?ml$"))' 2>/dev/null || true)
      if [ -z "${bk_list}" ]; then
        echo "[harbor-prewarm] FATAL: could not list ${bk_path} in the local Gitea mirror (${GITEA_ORG}/${GITEA_REPO}@${UPSTREAM_BRANCH}) — step-01 gitea-mirror must have completed before step-03; without the frozen pin set the mirror cannot be proven complete (#5237). Emergency override: prewarm.bootstrapKitPins.enabled=false."
        return 1
      fi
      bk_fetch_fail=0
      for bk_f in ${bk_list}; do
        if ! curl -fsS --retry 3 --retry-delay 5 \
            -H "Authorization: token ${bk_pat}" \
            -o "${bk_dir}/${bk_f}" \
            "${bk_api}/raw/${bk_path}/${bk_f}?ref=${UPSTREAM_BRANCH}" 2>/dev/null; then
          echo "[harbor-prewarm] Phase A2-pins: fetch FAILED for ${bk_path}/${bk_f}"
          bk_fetch_fail=$((bk_fetch_fail+1))
        fi
      done
      if [ "${bk_fetch_fail}" -gt 0 ]; then
        echo "[harbor-prewarm] FATAL: ${bk_fetch_fail} bootstrap-kit slot file(s) failed to fetch from the local Gitea mirror (named above) — a partial pin set could silently miss the exact version a mid-cutover merge makes load-bearing (#5237). Emergency override: prewarm.bootstrapKitPins.enabled=false."
        return 1
      fi
    }
    {{- /* A delivery's Phase A0: the candidate's pins, "<chart>\t<version>" as Phase A2-pins reads them, or 1. */}}
    srp_candidate_pins() {
      [ "${PREWARM_BOOTSTRAP_KIT_PINS:-true}" = "true" ] || return 1
      prewarm_kit_fetch /tmp/bootstrap-kit-pins >&2 || return 1
      . /pin-extractor/extract-pins.sh
      bootstrapkit_pins /tmp/bootstrap-kit-pins "${UPSTREAM_PREFIX}" "oci://$(printf '%s' "${HARBOR_PUBLIC_URL}" | sed -e 's,^https\?://,,' -e 's,/$,,')/openova-io" 2>/dev/null
    }
    # ── settled-roll-preflight BEGIN (Case 77 extraction anchor — tests/cutover-contract.sh executes this block verbatim with a stubbed kubectl) ──
    SETTLED_ROLL_OVERRIDE_ANNOTATION="catalyst.openova.io/cutover-settled-roll-override"
    {{- /*
     #6273 — the OWNERSHIP partition: an Organization's application release must
     not fail-close the Sovereign's cutover; a PLATFORM namespace offender still
     does. The label is a FIXED contract with the org-controller, like the
     override key above: core/controllers/organization/internal/gitops/
     manifests.go stamps openova.io/organization=<slug> on every Organization's
     host Namespace at every tier (pinned by org_namespace_invariant_4292_test.go),
     and kubeconfig_reconciler.go already lists namespaces by it. The predicate
     is POSITIVE, so fail-closed: an unlabelled namespace is platform and stays
     FATAL (hw296, 2026-08-13: 4 of 55 namespaces labelled; all 7 offenders in one).
    */}}
    ORG_NAMESPACE_LABEL="openova.io/organization"
    {{- /* #6253 — the TERMINAL classifier, defined once: word for word above the key prewarm.settledRollPreflight of values.yaml (#6004). */}}
    SRP_TERMINAL_JQ='
      def _cond($t): (.status.conditions // []) | map(select(.type == $t)) | (.[0] // {});
      def _stalled: ((_cond("Stalled").status) // "False") == "True";
      def _source_absent:
        {{- /*
         Bind the Ready condition FIRST. `["a","b"] | index($x)` re-binds `.`
         to the array literal, so any `_cond(...)` evaluated inside that pipe
         would run against the array and die with "Cannot index array with
         string status" — caught by Case 77 direction 1 before this shipped.
        */}}
        (_cond("Ready")) as $r
        | ((($r.message) // "") | ascii_downcase) as $m
        | ((($r.status) // "Unknown") != "True")
          and ((["SourceNotReady", "ArtifactFailed", "ChartPullError"] | index(($r.reason) // "")) != null)
          and (
            ($m | test("no chart version found"))
            or (($m | test("chart pull error")) and ($m | test("not found")))
          );
      def _terminal: _stalled or _source_absent;
      {{- /* #6262 — this chart's own HelmRelease is excluded: word for word above the key prewarm.settledRollPreflight of values.yaml (#6004). */}}
      def _is_own_release($own):
        ((.spec.chart.spec.chart // "") == $own) or ((.metadata.name // "") == $own);
    '
    {{- /*
     #6273 — defined ONCE and consumed by ALL THREE jq sites (the override
     validation, the HelmRelease offender pass, and the workload
     `wl_pending` pass). Re-hand-rolling `index` at each site is how the
     two terminal classifiers drifted apart before #6253; and a partition
     applied to only one of the two passes fixes nothing, because the
     #5391 override annotation is HelmRelease-only — a workload offender's
     ONLY escape today is the whole-gate kill switch.
    */}}
    SRP_ORG_NS_JQ='
      def _in_org_ns($orgns):
        {{- /*
         Bind the namespace FIRST — the SAME trap `_source_absent` above
         carries a warning for. `$orgns | index($x)` re-binds `.` to the
         array, so an inline `.metadata.namespace` inside the index
         argument is evaluated against the ARRAY and dies with "Cannot
         index array with string metadata". Caught by executing the
         extracted gate against the live hw296 fixtures before this
         shipped, exactly as Case 77 direction 1 caught it for #6253.
        */}}
        (.metadata.namespace // "") as $ns
        | (($orgns | index($ns)) != null);
    '
    srp_delivery() { [ -n "${CANDIDATE:-}" ] && [ "${UPSTREAM_BRANCH:-}" = "release/${CANDIDATE}" ]; }
    {{- /*
     A delivery's repaired set (see the head of Phase A0), over the gated releases: "R\t<ns>/<name>\t<chart>\t<from>\t<deployed>\t<to>"
     per terminal release the candidate's pin ($pins: chart -> its versions) moves, "D\t<ns>/<name>\t<deps>" per dependent that waits
     on those alone, and "N\t<ns>/<name>\t<why>" per terminal release the candidate does not change. No field is empty.
     The pins name charts, not releases: only a release the kit applies (flux-system, Kustomization bootstrap-kit) can be R.
    */}}
    SRP_REPAIR_JQ='
      def _key: "\(.metadata.namespace // "")/\(.metadata.name // "")";
      def _kit_applied: ((.metadata.namespace // "") == "flux-system") and ((((.metadata.labels // {})["kustomize.toolkit.fluxcd.io/name"]) // "") == "bootstrap-kit");
      def _settled: (((_cond("Ready").status) // "Unknown") == "True") and ((.status.observedGeneration // -1) >= (.metadata.generation // 0));
      def _deps: (.metadata.namespace // "") as $dns | [(.spec.dependsOn // [])[] | "\(.namespace // $dns)/\(.name)"];
      def _or($v): if . == "" then $v else . end;
      (.items | map({key: _key, value: .}) | from_entries) as $all
      | [.items[] | select((.spec.suspend // false) | not) | select(_is_own_release($own) | not)
          | select(_in_org_ns($orgns) | not) | select(((.metadata.annotations // {}) | has($okey)) | not)] as $hrs
      | [$hrs[] | select(_terminal)
          | (.spec.chart.spec.chart // "") as $c
          | (.spec.chart.spec.version // "") as $want
          | (.status.lastAttemptedRevision // "") as $att
          | ((([(.status.history // [])[] | select(.status == "deployed") | .chartVersion] | .[0]) // .status.lastAppliedRevision) // "") as $dep
          | (($pins[$c]) // []) as $pv
          | _kit_applied as $kit
          | {key: _key, chart: ($c | _or("-")), from: ($att | _or($want) | _or("-")), deployed: ($dep | _or("-")), to: ($pv | join(" ") | _or("-")),
             why: (if $c == "" then "it names no chart (spec.chart.spec.chart)"
                   elif ($kit | not) then "the kit does not apply it (only flux-system HelmReleases of the Kustomization bootstrap-kit), so the candidate pinning \($c) does not change it"
                   elif ($pv | length) == 0 then "the candidate kit pins no version of \($c)"
                   elif ($pv | length) > 1 then "the candidate kit pins \($c) at several versions (\($pv | join(", ")))"
                   elif ($pv[0] == $want) or ($pv[0] == $att) or ($pv[0] == $dep) then "the candidate pins \($c) \($pv[0]), not a new version for it (desired \($want | _or("-")), last attempted \($att | _or("-")), deployed \($dep | _or("-")))"
                   else "" end)}] as $t
      | [$t[] | select(.why == "")] as $r0
      | [$hrs[] | select((_terminal | not) and (((_cond("Ready").reason) // "") == "DependencyNotReady"))] as $dnr
      | def _grow: . as $r
          | [$dnr[] | _key as $k | select(any($r[]; . == $k) | not) | _deps as $ds
             | select(any($ds[]; . as $d | any($r[]; . == $d)))
             | select(all($ds[]; . as $d | any($r[]; . == $d) or ((($all[$d]) // null) | if . == null then false else _settled end)))
             | $k] as $new
          | if ($new | length) == 0 then $r else ($r + $new) | _grow end;
        ([$r0[] | .key] | _grow) as $rep
      | ($r0[] | "R\t\(.key)\t\(.chart)\t\(.from)\t\(.deployed)\t\(.to)"),
        ($rep[] | . as $k | select(any($r0[]; .key == $k) | not)
          | "D\t\($k)\t\([$all[$k] | _deps | .[] | . as $d | select(any($rep[]; . == $d))] | join(", "))"),
        ($t[] | select(.why != "") | "N\t\(.key)\t\(.why)")
    '
    srp_kubectl_json() {
      {{- /*
       kubectl get "$@" -o json with a bounded retry; JSON on stdout,
       diagnostics on stderr. The gate must SEE the roll state to certify
       anything — a read failure returns 1 and the caller FATALs
       (fail-closed) instead of silently passing on an empty offender
       list (the assert-on-the-VALUE-not-the-KEY trap: the pre-#5391 gate
       PASSED whenever the kubectl read itself failed).
      */}}
      _srp_i=1
      while [ "${_srp_i}" -le 5 ]; do
        if _srp_out=$(kubectl get "$@" -o json 2>/dev/null) && [ -n "${_srp_out}" ]; then
          printf '%s' "${_srp_out}"
          return 0
        fi
        echo "[harbor-prewarm] Phase A0: kubectl get $* failed (attempt ${_srp_i}/5); retry in 5s" >&2
        _srp_i=$((_srp_i+1))
        sleep 5
      done
      return 1
    }
    srp_record_overrides() {
      {{- /*
       $1 = newline-joined honored "<ns>/<name>=<reason>" list; "" CLEARS
       the record on a clean pass so a previous run's override cannot
       linger in the status CM as a phantom audit entry.
      */}}
      if [ -z "${STATUS_CONFIGMAP_NAME:-}" ] || [ -z "${STATUS_CONFIGMAP_NAMESPACE:-}" ]; then
        [ -z "$1" ] && return 0
        echo "[harbor-prewarm] FATAL: settled-roll override(s) in effect but STATUS_CONFIGMAP_NAME/NAMESPACE is unset — cannot write the audit record; an override MUST be recorded to be used (#5391)"
        return 1
      fi
      _srp_at=""
      [ -n "$1" ] && _srp_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      _srp_patch=$(jq -cn --arg v "$1" --arg at "${_srp_at}" '{data: {settledRollOverrides: $v, settledRollOverridesAt: $at}}')
      if kubectl patch configmap "${STATUS_CONFIGMAP_NAME}" -n "${STATUS_CONFIGMAP_NAMESPACE}" --type merge -p "${_srp_patch}" >/dev/null 2>&1; then
        return 0
      fi
      if [ -z "$1" ]; then
        echo "[harbor-prewarm] WARN: could not clear the settledRollOverrides record on ${STATUS_CONFIGMAP_NAMESPACE}/${STATUS_CONFIGMAP_NAME} (best-effort on a clean pass)"
        return 0
      fi
      echo "[harbor-prewarm] FATAL: settled-roll override(s) in effect but the audit-record patch to ConfigMap ${STATUS_CONFIGMAP_NAMESPACE}/${STATUS_CONFIGMAP_NAME} failed — an override MUST be recorded to be used (#5391)"
      return 1
    }
    settled_roll_preflight() {
      echo "[harbor-prewarm] Phase A0: settled-roll pre-flight — no HelmRelease/workload may be mid-roll before the mirror is built"
      if ! _srp_hr_json=$(srp_kubectl_json helmreleases -A); then
        echo "[harbor-prewarm] FATAL: Phase A0 could not list HelmReleases after 5 attempts — the gate cannot certify a roll state it cannot read; refusing to fail open (#5391)"
        return 1
      fi
      if ! _srp_wl_json=$(srp_kubectl_json deployments,statefulsets -A); then
        echo "[harbor-prewarm] FATAL: Phase A0 could not list Deployments/StatefulSets after 5 attempts — the gate cannot certify a roll state it cannot read; refusing to fail open (#5391)"
        return 1
      fi
      {{- /* #6273 — the Organization namespaces are read from the label: word for word above the key prewarm.settledRollPreflight of values.yaml (#6004). */}}
      if ! _srp_ns_json=$(srp_kubectl_json namespaces -l "${ORG_NAMESPACE_LABEL}"); then
        echo "[harbor-prewarm] FATAL: Phase A0 could not list Organization namespaces (-l ${ORG_NAMESPACE_LABEL}) after 5 attempts — the gate cannot partition offenders by ownership it cannot read; refusing to fail open (#6273)"
        return 1
      fi
      org_ns=$(printf '%s' "${_srp_ns_json}" | jq -c '[.items[].metadata.name]') || {
        echo "[harbor-prewarm] FATAL: Phase A0 Organization-namespace jq failed — refusing to fail open (#6273)"
        return 1
      }
      {{- /* #5391 — override validation first: word for word above the key prewarm.settledRollPreflight of values.yaml (#6004). */}}
      or_bad=$(printf '%s' "${_srp_hr_json}" | jq -r --arg okey "${SETTLED_ROLL_OVERRIDE_ANNOTATION}" --arg own {{ .Chart.Name | quote }} --argjson orgns "${org_ns}" "${SRP_TERMINAL_JQ}${SRP_ORG_NS_JQ}"'
        .items[]
        | select((.spec.suspend // false) | not)
        | select(_is_own_release($own) | not)
        | select(_in_org_ns($orgns) | not)
        | select((.metadata.annotations // {}) | has($okey))
        | ((.metadata.annotations[$okey] // "") | gsub("^\\s+|\\s+$"; "")) as $reason
        | ((((.status.conditions // []) | map(select(.type=="Ready")) | (.[0].status // "Unknown")) == "True")
           and ((.status.observedGeneration // -1) >= (.metadata.generation // 0))) as $healthy
        | _terminal as $terminal
        | (((.status.conditions // []) | map(select(.type=="Ready")) | (.[0].reason // ""))) as $why
        | if ($reason | length) == 0 then "\(.metadata.namespace)/\(.metadata.name)\tEMPTY-REASON"
          elif $healthy then "\(.metadata.namespace)/\(.metadata.name)\tHEALTHY"
          elif (($terminal or ($why == "DependencyNotReady")) | not) then "\(.metadata.namespace)/\(.metadata.name)\tMID-ROLL"
          else empty end') || {
        echo "[harbor-prewarm] FATAL: Phase A0 override-validation jq failed — refusing to fail open (#5391)"
        return 1
      }
      if [ -n "${or_bad}" ]; then
        echo "[harbor-prewarm] FATAL: invalid settled-roll override annotation(s) (${SETTLED_ROLL_OVERRIDE_ANNOTATION}) — fail-closed, NO exclusion honored (#5391):"
        printf '%s\n' "${or_bad}" | while IFS="$(printf '\t')" read -r _srp_hr _srp_class; do
          case "${_srp_class}" in
            EMPTY-REASON) echo "[harbor-prewarm]   ${_srp_hr}: annotation present but the reason is EMPTY — an override must say why; re-annotate with a non-empty reason (or remove it)" ;;
            HEALTHY)      echo "[harbor-prewarm]   ${_srp_hr}: names a HEALTHY HelmRelease (Ready=True, observedGeneration==generation) — a stale/over-broad override; remove the annotation" ;;
            MID-ROLL)     echo "[harbor-prewarm]   ${_srp_hr}: genuinely mid-roll (not terminal — neither Stalled=True, nor an absent chart artifact, nor Ready.reason=DependencyNotReady) — it will settle on its own; wait and re-trigger instead of overriding" ;;
          esac
        done
        return 1
      fi
      {{- /*
       Every remaining annotated HR is a VALIDATED override (named, stuck,
       reasoned). Newlines/tabs in the reason are flattened so the record
       stays one line per release.
      */}}
      or_used=$(printf '%s' "${_srp_hr_json}" | jq -r --arg okey "${SETTLED_ROLL_OVERRIDE_ANNOTATION}" '
        .items[]
        | select((.spec.suspend // false) | not)
        | select((.metadata.annotations // {}) | has($okey))
        | "\(.metadata.namespace)/\(.metadata.name)=\((.metadata.annotations[$okey] | gsub("[\\n\\t]"; " ") | gsub("^\\s+|\\s+$"; "")))"') || {
        echo "[harbor-prewarm] FATAL: Phase A0 override-enumeration jq failed — refusing to fail open (#5391)"
        return 1
      }
      {{- /* A delivery: the releases its candidate repairs (head of Phase A0). Without a delivery, or without its pins, none. */}}
      srp_rep_rows=""; srp_rep_keys='[]'
      if srp_delivery && printf '%s' "${_srp_hr_json}" | jq -e "${SRP_TERMINAL_JQ}"'any(.items[]; _terminal)' >/dev/null 2>&1; then
        if _srp_pins=$(srp_candidate_pins) && [ -n "${_srp_pins}" ]; then
          _srp_pins_json=$(printf '%s\n' "${_srp_pins}" | jq -R -s -c 'split("\n") | map(select(length > 0) | split("\t") | select(length == 2)) | group_by(.[0]) | map({key: .[0][0], value: (map(.[1]) | unique)}) | from_entries') \
            && srp_rep_rows=$(printf '%s' "${_srp_hr_json}" | jq -r --arg okey "${SETTLED_ROLL_OVERRIDE_ANNOTATION}" --arg own {{ .Chart.Name | quote }} --argjson orgns "${org_ns}" --argjson pins "${_srp_pins_json}" "${SRP_TERMINAL_JQ}${SRP_ORG_NS_JQ}${SRP_REPAIR_JQ}") \
            && srp_rep_keys=$(printf '%s\n' "${srp_rep_rows}" | jq -R -s -c 'split("\n") | map(select(test("^[RD]\t")) | split("\t")[1])') || {
            echo "[harbor-prewarm] FATAL: Phase A0 delivery-repair jq failed — refusing to fail open"
            return 1
          }
        else
          echo "[harbor-prewarm] Phase A0: the delivery of ${CANDIDATE} could not read its candidate's kit pins at ${UPSTREAM_BRANCH} (or prewarm.bootstrapKitPins.enabled=false), so no stalled release counts as repaired by it"
        fi
      fi
      {{- /* HelmReleases, and #5391/#5392/#6253 terminal vs mid-roll: word for word above the key prewarm.settledRollPreflight of values.yaml (#6004). */}}
      {{- /*
       #6273 — ONE enumeration, tagged by ownership, split in shell. The
       row TEXT after the tag is byte-identical in both directions, so an
       Organization offender is reported with exactly the evidence the
       FATAL path prints (including the #6253 TERMINAL classification) and
       the two can never drift into two different formatters.
      */}}
      hr_all=$(printf '%s' "${_srp_hr_json}" | jq -r --arg okey "${SETTLED_ROLL_OVERRIDE_ANNOTATION}" --arg own {{ .Chart.Name | quote }} --argjson orgns "${org_ns}" --argjson rep "${srp_rep_keys}" "${SRP_TERMINAL_JQ}${SRP_ORG_NS_JQ}"'
        .items[]
        | select((.spec.suspend // false) | not)
        | select(_is_own_release($own) | not)
        | select(((.metadata.annotations // {}) | has($okey)) | not)
        | select(
            ((.status.observedGeneration // -1) < (.metadata.generation // 0))
            or (((.status.conditions // []) | map(select(.type=="Ready")) | (.[0].status // "Unknown")) != "True")
          )
        | _stalled as $stalled
        | _source_absent as $source_absent
        | (((.status.conditions // []) | map(select(.type=="Ready")) | (.[0].message // "")) | split("\n")[0]) as $why
        | (if _in_org_ns($orgns) then "ORG " elif ("\(.metadata.namespace)/\(.metadata.name)" as $k | any($rep[]; . == $k)) then "REP " else "PLT " end)
          + "HelmRelease/\(.metadata.namespace)/\(.metadata.name)"
          + (if $stalled then "  [TERMINAL: Flux stalled — it has STOPPED retrying and will never clear itself]"
             elif $source_absent then "  [TERMINAL: the pinned chart version does not exist in the registry — retrying cannot create it]"
             else "" end)
          + (if ($why | length) > 0 then "  (\($why))" else "" end)') || {
        echo "[harbor-prewarm] FATAL: Phase A0 HelmRelease-offender jq failed — refusing to fail open (#5391)"
        return 1
      }
      hr_pending=$(printf '%s\n' "${hr_all}" | grep '^PLT ' | sed 's/^PLT //' || true)
      hr_org=$(printf '%s\n' "${hr_all}" | grep '^ORG ' | sed 's/^ORG //' || true)
      {{- /*
       #6262 — the own-release exclusion must not be SILENT. Skipping the
       gate is the right call (the deadlock above), but an unsettled own
       release still means the next chart fix will not reach this Sovereign,
       and the operator has to learn that from somewhere. Report it as a
       NOTE that never blocks: same evidence, no exit.
      */}}
      own_hr=$(printf '%s' "${_srp_hr_json}" | jq -r --arg own {{ .Chart.Name | quote }} "${SRP_TERMINAL_JQ}"'
        .items[]
        | select(_is_own_release($own))
        | select(
            ((.status.observedGeneration // -1) < (.metadata.generation // 0))
            or (((.status.conditions // []) | map(select(.type=="Ready")) | (.[0].status // "Unknown")) != "True")
          )
        | "HelmRelease/\(.metadata.namespace)/\(.metadata.name)"
          + (if _terminal then "  [TERMINAL]" else "" end)
          + ((((.status.conditions // []) | map(select(.type=="Ready")) | (.[0].message // "")) | split("\n")[0]) as $why
             | if ($why | length) > 0 then "  (\($why))" else "" end)') || own_hr=""
      if [ -n "${own_hr}" ]; then
        echo "[harbor-prewarm] NOTE: this chart's OWN HelmRelease is not settled. It is EXCLUDED from the settled-roll gate on purpose (#6262/#6198 circularity — the cutover does not roll itself, and this script was rendered from the INSTALLED revision), so the cutover proceeds:"
        printf '%s\n' "${own_hr}" | sed 's/^/  own (not gated): /'
        echo "[harbor-prewarm]   It does mean a NEWER cutover chart is not reaching this Sovereign — if the message above is a 404 on the pinned version, that version was never published and the pin needs fixing at its source before any future cutover fix can land here."
      fi
      {{- /* Deployments + StatefulSets, and #6198 this chart's own workloads excluded: word for word above the key prewarm.settledRollPreflight of values.yaml (#6004). */}}
      {{- /*
       #6273 — the workload pass carries the SAME ownership tag. This half
       is the one that actually mattered on hw296: four of the seven
       offenders were Deployments/StatefulSets in `walkthree`, and the
       #5391 named override is HelmRelease-only, so nothing short of the
       whole-gate kill switch could clear them.
      */}}
      wl_all=$(printf '%s' "${_srp_wl_json}" | jq -r --arg own {{ .Chart.Name | quote }} --argjson orgns "${org_ns}" "${SRP_ORG_NS_JQ}"'
        .items[]
        | select((.spec.replicas // 1) > 0)
        | select(((.metadata.labels // {})["app.kubernetes.io/name"] // "") != $own)
        | select(
            ((.status.observedGeneration // -1) < (.metadata.generation // 0))
            or ((.status.updatedReplicas // 0) < (.spec.replicas // 1))
            or ((.status.readyReplicas // 0) < (.spec.replicas // 1))
          )
        | (if _in_org_ns($orgns) then "ORG " else "PLT " end)
          + "\(.kind // "Workload")/\(.metadata.namespace)/\(.metadata.name)"') || {
        echo "[harbor-prewarm] FATAL: Phase A0 workload-offender jq failed — refusing to fail open (#5391)"
        return 1
      }
      wl_pending=$(printf '%s\n' "${wl_all}" | grep '^PLT ' | sed 's/^PLT //' || true)
      wl_org=$(printf '%s\n' "${wl_all}" | grep '^ORG ' | sed 's/^ORG //' || true)
      {{- /* #6273 — the WARNING before the platform verdict, and what it costs: word for word above the key prewarm.settledRollPreflight of values.yaml (#6004). */}}
      srp_rep_rec=""
      if [ -n "${srp_rep_rows}" ]; then
        echo "[harbor-prewarm] Phase A0: the delivery of ${CANDIDATE} read its candidate's kit pins for the stalled release(s). R: the candidate pins another version, which the promote gives Flux to try and Phase A2-pins mirrors, NOT gated; D: DependencyNotReady only on R releases, NOT gated; N: the candidate does not change it, gated as before:"
        printf '%s\n' "${srp_rep_rows}" | awk -F '\t' -v b="${UPSTREAM_BRANCH}" '
          $1 == "R" {print "  R HelmRelease/" $2 ": " $3 " " $4 " (last attempted; deployed " $5 ") -> " $6 " (pinned by " b ")"}
          $1 == "D" {print "  D HelmRelease/" $2 ": DependencyNotReady only on " $3}
          $1 == "N" {print "  N HelmRelease/" $2 ": " $3}'
        srp_rep_rec=$(printf '%s\n' "${srp_rep_rows}" | awk -F '\t' -v c="${CANDIDATE}" '
          $1 == "R" {print $2 "=the delivery of " c " moves " $3 " " $4 " -> " $6 " (deployed " $5 ")"}
          $1 == "D" {print $2 "=DependencyNotReady only on " $3 ", which the delivery of " c " repairs"}')
      fi
      org_unsettled=$(printf '%s\n%s\n' "${hr_org}" "${wl_org}" | grep -c . || true)
      if [ "${org_unsettled}" -gt 0 ]; then
        echo "[harbor-prewarm] WARNING: Phase A0 found ${org_unsettled} unsettled release(s)/workload(s) in Organization namespaces. The cutover PROCEEDS anyway (#6273) — an Organization's application belongs to the Organization that installed it, and a sovereign-admin must not have to repair a customer's app to gain the Sovereign's independence. Platform namespaces are UNCHANGED: any offender there is still FATAL below."
        printf '%s\n%s\n' "${hr_org}" "${wl_org}" | grep . | sed 's/^/  not gated (Organization namespace): /'
        echo "[harbor-prewarm] WHAT THIS COSTS, stated plainly: if one of the above is GENUINELY MID-ROLL rather than terminally stuck, harbor-prewarm mirrors the tag it is running NOW and the post-cutover roll may move it to a desired tag that was never mirrored — that Application can then fail to pull its image after the cutover and may need a re-install. The Sovereign itself is unaffected; every platform workload is still gated."
        echo "[harbor-prewarm] Organization namespaces are read from the live cluster by the ${ORG_NAMESPACE_LABEL} label the org-controller stamps on every Organization namespace — a namespace WITHOUT that label is treated as platform and stays FATAL."
      fi
      unsettled=$(printf '%s\n%s\n' "${hr_pending}" "${wl_pending}" | grep -c . || true)
      if [ "${unsettled}" -gt 0 ]; then
        terminal=$(printf '%s\n' "${hr_pending}" | grep -c 'TERMINAL:' || true)
        {{- /*
         #6253 — count the hollow-pin terminals separately so the remedy
         printed matches the terminal shape actually present. Both counts
         feed the same "do not say wait" branch; only the fix line differs.
        */}}
        terminal_hollow=$(printf '%s\n' "${hr_pending}" | grep -c 'does not exist in the registry' || true)
        terminal_stalled=$((terminal - terminal_hollow))
        echo "[harbor-prewarm] FATAL: env NOT settled — ${unsettled} PLATFORM-namespace release(s)/workload(s) are mid-roll; harbor-prewarm would mirror running tags the cutover then rolls away from (running != desired):"
        printf '%s\n%s\n' "${hr_pending}" "${wl_pending}" | grep . | sed 's/^/  mid-roll: /'
        if [ "${terminal}" -gt 0 ]; then
          {{- /* #5391 — do NOT tell the operator to wait when waiting cannot work. */}}
          echo "[harbor-prewarm] ${terminal} of these are TERMINAL. Waiting will NOT clear them. Each one needs an explicit fix before the cutover can proceed:"
          if [ "${terminal_stalled}" -gt 0 ]; then
            echo "[harbor-prewarm]   ${terminal_stalled} Flux Stalled/RetriesExceeded — Flux has already given up retrying:"
            echo "[harbor-prewarm]     flux reconcile helmrelease <name> -n <namespace> --reset   # clears Stalled and retries"
            echo "[harbor-prewarm]     (or remove the Organization if the release belongs to a customer app you no longer need)"
            echo "[harbor-prewarm]   Fix the underlying failure first — the message in parentheses above is the Helm error that stalled it."
          fi
          if [ "${terminal_hollow}" -gt 0 ]; then
            {{- /*
             #6253 — a hollow pin. Do NOT offer `flux reconcile --reset`
             here: the chart version was never published, so every retry
             404s identically. Live hw296 (dep e689e3b34a75fdec):
             bp-guacamole pinned 0.2.40, published max 0.2.39.
            */}}
            echo "[harbor-prewarm]   ${terminal_hollow} pinned to a chart version that DOES NOT EXIST in the registry (a hollow pin). Re-driving Flux cannot help — there is no artifact to pull. Fix the pin at its source:"
            echo "[harbor-prewarm]     - publish the pinned chart version (its Blueprint Release build likely failed before the push), OR"
            echo "[harbor-prewarm]     - re-pin the release to a version that IS published, and let Flux reconcile."
            echo "[harbor-prewarm]   The parenthesised message above names the exact chart reference that 404'd."
          fi
          echo "[harbor-prewarm] If a release is GENUINELY unfixable right now (e.g. quota-wedged, #5393), a sovereign-admin may exclude that ONE release from this gate with a named, audited override (#5391):"
          echo "[harbor-prewarm]   kubectl annotate helmrelease <name> -n <namespace> ${SETTLED_ROLL_OVERRIDE_ANNOTATION}=\"<why it is stuck / ticket ref>\""
          echo "[harbor-prewarm]   The override is validated fail-closed (a healthy or merely mid-roll release is REJECTED), recorded in the cutover status ConfigMap, and shown on GET /sovereign/cutover/status."
        fi
        if [ "${unsettled}" -gt "${terminal}" ]; then
          echo "[harbor-prewarm] The remainder are genuinely mid-roll — wait for them to settle (HelmRelease Ready=True + observedGeneration==generation; workloads updated==ready==desired replicas), then re-trigger the cutover."
        fi
        if [ -n "${or_used}" ]; then
          echo "[harbor-prewarm] NOTE: these named overrides were validated and WOULD be honored, but the offenders above remain outside them:"
          printf '%s\n' "${or_used}" | sed 's/^/  override: /'
        fi
        echo "[harbor-prewarm] (settled-roll pre-flight #4982/#5391; named per-release override: the ${SETTLED_ROLL_OVERRIDE_ANNOTATION} annotation; whole-gate emergency kill for a manually confirmed-settled env: prewarm.settledRollPreflight.enabled=false)"
        return 1
      fi
      srp_record_overrides "$(printf '%s\n%s\n' "${or_used}" "${srp_rep_rec}" | grep . || true)" || return 1
      if [ -n "${or_used}" ]; then
        or_count=$(printf '%s\n' "${or_used}" | grep -c . || true)
        echo "[harbor-prewarm] Phase A0: env settled WITH ${or_count} named operator override(s) (#5391) — each excluded release is terminal-stuck; its running images/charts are still mirrored by the enumerations below:"
        printf '%s\n' "${or_used}" | sed 's/^/  override: /'
        echo "[harbor-prewarm] override record written to ConfigMap ${STATUS_CONFIGMAP_NAMESPACE}/${STATUS_CONFIGMAP_NAME} key settledRollOverrides (surfaced on GET /sovereign/cutover/status)"
      fi
      if [ -n "${srp_rep_rec}" ]; then
        echo "[harbor-prewarm] Phase A0: env settled for the delivery of ${CANDIDATE}: $(printf '%s\n' "${srp_rep_rec}" | grep -c .) release(s) it repairs (named above) are not gated; recorded in ConfigMap ${STATUS_CONFIGMAP_NAMESPACE}/${STATUS_CONFIGMAP_NAME} key settledRollOverrides:"
        printf '%s\n' "${srp_rep_rec}" | sed 's/^/  repaired: /'
      fi
      if [ -z "${or_used}${srp_rep_rec}" ]; then
        echo "[harbor-prewarm] Phase A0: env settled — no PLATFORM-namespace HelmRelease/Deployment/StatefulSet mid-roll; building the mirror from running == desired tags"
      fi
      return 0
    }
    if [ "${SETTLED_ROLL_PREFLIGHT:-true}" = "true" ]; then
      settled_roll_preflight || exit 1
    else
      echo "[harbor-prewarm] Phase A0: settled-roll pre-flight DISABLED (prewarm.settledRollPreflight.enabled=false) — mirroring running tags without a settle check"
    fi
    # ── settled-roll-preflight END (Case 77 extraction anchor) ──

    {{- include "bp-self-sovereign-cutover.skopeoFetch" . | nindent 4 }}
    if ! command -v skopeo >/dev/null 2>&1; then
      echo "[harbor-prewarm] skopeo not on PATH; downloading static binary"
      skopeo_fetch /tmp "[harbor-prewarm]" || { echo "[harbor-prewarm] FATAL: skopeo unavailable via static download after 3 retries"; exit 1; }
      echo "[harbor-prewarm] skopeo static binary installed: $(skopeo --version)"
    else
      echo "[harbor-prewarm] skopeo already on PATH: $(skopeo --version)"
    fi

    {{- /*
     Extract GHCR PAT from dockerconfigjson.
     G72 #2618-followup (2026-05-31): Kubernetes env from
     secretKeyRef ALWAYS passes the DECODED secret value (raw
     bytes/string as stored under .data after base64 decode).
     Prior naive `base64 -d 2>/dev/null || raw` fallback fired
     base64 -d on already-decoded JSON, which produced garbage
     output (busybox base64 doesn't strictly fail on non-base64
     input) → jq parse error "Invalid numeric literal at line 1,
     column 21". Live evidence hw84 bf7de50d4b5ca99e Step 03.

     Fix: detect if input starts with `{` (JSON object) — if so,
     use as-is (no base64 decode attempt). Otherwise try base64
     decode then fall back to raw.
    */}}
    if [ "${GHCR_DOCKERCONFIG:0:1}" = "{" ]; then
      dc_decoded="${GHCR_DOCKERCONFIG}"
    else
      dc_decoded=$(printf '%s' "${GHCR_DOCKERCONFIG}" | base64 -d 2>/dev/null || printf '%s' "${GHCR_DOCKERCONFIG}")
    fi
    {{- /* Locate the ghcr.io entry's auth (base64 of "<user>:<PAT>"). */}}
    ghcr_auth_b64=$(printf '%s' "${dc_decoded}" | jq -r '.auths["ghcr.io"].auth // empty')
    if [ -z "${ghcr_auth_b64}" ]; then
      echo "[harbor-prewarm] FATAL: no ghcr.io auth entry in ${GHCR_DOCKERCONFIG_NAMESPACE}/ghcr-pull dockerconfigjson — step 06 phase-0 may have already pivoted (race with cutover order)"
      {{- /* List what auths ARE present for diagnostic */}}
      printf '%s' "${dc_decoded}" | jq -r '.auths | keys[]' 2>&1 | sed 's/^/  auth-host: /'
      exit 1
    fi
    ghcr_user=$(printf '%s' "${ghcr_auth_b64}" | base64 -d | awk -F: '{print $1}')
    ghcr_pat=$(printf '%s' "${ghcr_auth_b64}" | base64 -d | awk -F: '{print $2}')
    {{- /*
     #5467 — NEVER print any prefix of the PAT. The `${ghcr_pat:0:8}` disclosed
     4 real secret chars (after the `ghp_` type prefix) + the token type + exact
     length + owning account into pod logs, which are read by operators, shipped
     by log aggregators, and pasted into issues on a failed cutover. Match the
     mothership branch below: user + length only (platform rule — secret values
     are never printed; lengths/hashes only).
    */}}
    echo "[harbor-prewarm] ghcr.io auth extracted: user=${ghcr_user} (len=${#ghcr_pat})"

    {{- /*
     #4975 — OPTIONAL mothership-Harbor source auth. Phase A3 mirrors
     `harbor.openova.io/proxy-<x>/...` refs (the dominant bootstrap-kit
     image shape) by host-swapping to the local Harbor; the SOURCE pull
     from the mothership uses THIS auth when the ghcr-pull dockerconfig
     carries it (it usually does — same Secret proxies both). Absent →
     anonymous mothership pull (the proxy-<x> projects are public).
    */}}
    moth_user=""
    moth_pat=""
    moth_auth_b64=$(printf '%s' "${dc_decoded}" | jq -r --arg h "${MOTHERSHIP_HOST}" '.auths[$h].auth // empty' 2>/dev/null || true)
    if [ -n "${moth_auth_b64}" ]; then
      moth_user=$(printf '%s' "${moth_auth_b64}" | base64 -d | awk -F: '{print $1}')
      moth_pat=$(printf '%s' "${moth_auth_b64}" | base64 -d | cut -d: -f2-)
      echo "[harbor-prewarm] ${MOTHERSHIP_HOST} auth extracted: user=${moth_user} (len=${#moth_pat})"
    fi

    {{- /*
     #4975 — choose skopeo --src-creds by SOURCE host: ghcr.io → the
     ghcr-pull PAT (private openova-io packages); the mothership →
     optional mothership auth; every anonymous upstream (docker.io,
     quay.io, registry.k8s.io, gcr.io, public.ecr.aws) → NO creds.
    */}}
    src_creds_for() {
      case "$1" in
        ghcr.io) printf '%s:%s' "${ghcr_user}" "${ghcr_pat}" ;;
        "${MOTHERSHIP_HOST}")
          [ -n "${moth_user}" ] && printf '%s:%s' "${moth_user}" "${moth_pat}" || printf '' ;;
        *) printf '' ;;
      esac
    }

    {{- /*
     #5036 (reverts #4688): the Harbor artifact-API existence check dials the IN-CLUSTER Harbor
     Service (harbor-core.harbor.svc, always resolvable pre-pivot), NOT registry.<fqdn> (NXDOMAIN
     pre-pivot where the split-horizon zone lacks the record — hw246 dep c38c437f). Harbor stores by
     project/repo, host-independent, so post-cutover pulls via registry.<fqdn> (step-04 containerd,
     step-08 completeness HEAD on LOCAL_REGISTRY_HOST) resolve the identical artifacts. HARBOR_HOST is
     step-03-local (the resolver returns host-LESS paths), so this does not touch steps 04/08.
     #5051 (round 2 — supersedes the 0.1.127 :80 attempt): the skopeo PUSH DEST must be the PUBLIC
     host. Harbor's bearer realm is https://<request-host>/service/token (host echoed, scheme HARD-
     https, probed on hw250) and NO in-cluster harbor Service terminates TLS (TLS ends at the gateway),
     so an in-cluster dest can NEVER complete the token flow (hw250 0/136 twice). The #5037 pre-pivot
     NXDOMAIN flake is handled by the bounded readiness probe below, NOT by a dest pivot. Harbor REST
     dials (projects, artifact idempotency probe, Phase B /v2 HEAD — basic auth, no token dance) STAY
     on HARBOR_INTERNAL_URL, which step 02 proved works in-cluster.
    */}}
    HARBOR_HOST=$(printf '%s' "${HARBOR_PUBLIC_URL}" | sed -e 's,^https\?://,,' -e 's,/$,,')

    {{- /*
     ── #5007 (Refs #5051 #5036 #4652 #4682) — install a kube-system
     `coredns-custom` override so registry.<fqdn> resolves IN-CLUSTER to the
     cilium-gateway Service ClusterIP, BEFORE the readiness probe + every
     skopeo push, making the local-registry datapath INDEPENDENT of public
     DNS. #5051 round 2 correctly forced the push DEST back to the PUBLIC host
     (only the TLS-terminating gateway serves Harbor's hard-https bearer realm
     https://registry.<fqdn>/service/token — no in-cluster :80 Service can
     complete the token flow), but that dest was left resolving via PUBLIC
     DNS, so it still breaks when the Sovereign zone flakes or a wiped-env
     `*.<pool>` wildcard shadows the specific record: hw241's dead
     `*.omantel.biz` 49.12.16.160 → readiness probe connection-refused →
     10-min FATAL; hw252's intermittent NXDOMAIN (`lookup registry.hw252.
     omani.works on 10.96.0.10:53: no such host`) flapped MID-PUSH →
     push_ok=131 push_fail=7 (survived only on a backoffLimit retry).

     WHY CoreDNS, not /etc/hosts: harbor-prewarm runs runAsNonRoot(uid 1000)
     + readOnlyRootFilesystem + drop-ALL, so it CANNOT write its own (root-
     owned) /etc/hosts, and a pod `hostAliases` can't take a runtime IP. It
     instead patches the k3s-native `coredns-custom` ConfigMap — the same
     extension point cloud-init uses for the github-ipv4 pin — with a
     SEPARATE `.server` block (registry.<fqdn> -> the gateway ClusterIP), so
     CoreDNS (which every pod already queries at 10.96.0.10) answers
     registry.<fqdn> authoritatively in-cluster. The ClusterIP is ALWAYS
     allocated (even TYPE=ClusterIP with no VIP on the §854 ELB-direct model,
     #5007 round 2 / 0.1.129); ClusterIP:443 terminates the wildcard TLS and
     serves BOTH the /v2 challenge AND the /service/token realm (proven
     #4637). Request host / SNI stay registry.<fqdn> so the bearer realm +
     gateway HTTPRoute + wildcard cert all still match — ONLY resolution is
     pinned. This reverses #4682's public-DNS assumption ONLY for the primary
     cluster's CoreDNS + ONLY for the local registry name (a dedicated
     `.server` block, never a `.override` — two `hosts` plugins in one block
     crash CoreDNS, the #3804 trap); the NODE/containerd path is untouched
     (step-04's /etc/hosts pin). FAIL-LOUD: if the pin is enabled but the
     gateway ClusterIP can't be resolved, EXIT NON-ZERO rather than silently
     push over the flaky public path. The existing readiness probe below is
     the sync-confirm — it blocks until CoreDNS actually serves the override.
    */}}
    install_coredns_registry_pin() {
      case "${LOCAL_REGISTRY_PIN_ENABLED:-true}" in
        true|True|TRUE|1|yes) : ;;
        *) echo "[harbor-prewarm] local-registry CoreDNS pin DISABLED (LOCAL_REGISTRY_PIN_ENABLED=${LOCAL_REGISTRY_PIN_ENABLED:-}) — ${HARBOR_HOST} resolves via cluster DNS (public path)"; return 0 ;;
      esac
      [ -n "${HARBOR_HOST}" ] || { echo "[harbor-prewarm] FATAL: HARBOR_PUBLIC_URL yielded an empty registry host — cannot pin (#5007)"; exit 1; }
      _cip=""
      if [ -n "${GATEWAY_LB_SVC_NAME:-}" ]; then
        _pin_attempt=1
        while [ "${_pin_attempt}" -le 5 ]; do
          {{- /*
           ClusterIP is allocated the moment the gateway Service exists (well
           before step-03) in BOTH the LB and the §854 ELB-direct (TYPE=
           ClusterIP) gateway models. `services get` RBAC is already granted.
          */}}
          _c=$(kubectl get svc "${GATEWAY_LB_SVC_NAME}" -n "${GATEWAY_LB_SVC_NAMESPACE}" -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)
          case "${_c}" in
            ""|None) : ;;
            *) _cip="${_c}"; break ;;
          esac
          echo "[harbor-prewarm] gateway Service ${GATEWAY_LB_SVC_NAMESPACE}/${GATEWAY_LB_SVC_NAME} ClusterIP not resolved yet (attempt ${_pin_attempt}/5); retry in 3s"
          _pin_attempt=$((_pin_attempt+1))
          sleep 3
        done
      fi
      if [ -z "${_cip}" ]; then
        echo "[harbor-prewarm] FATAL: could not resolve the cilium-gateway Service ClusterIP (${GATEWAY_LB_SVC_NAMESPACE:-}/${GATEWAY_LB_SVC_NAME:-<unset>}). Refusing to push over the flaky public DNS path (#5007). Fix/name the gateway Service (registryPivot.localRegistryHostPin.gatewayServiceName), then re-trigger."
        exit 1
      fi
      {{- /*
       A SEPARATE `.server` block (NEVER `.override`): a single `hosts` plugin
       scoped to the registry zone, mirroring cloud-init's github-ipv4 pin.
      */}}
      _cdns_key="cutover-registry-pin.server"
      _cdns_block=$(printf '%s {\n    hosts {\n        %s %s\n        fallthrough\n    }\n    forward . /etc/resolv.conf\n}\n' "${HARBOR_HOST}" "${_cip}" "${HARBOR_HOST}")
      {{- /*
       Idempotent: if kube-system/coredns-custom already carries our key with
       THIS ClusterIP, nothing to do (avoids a needless CoreDNS reload on a
       step re-run).
      */}}
      _cdns_cur=$(kubectl get cm coredns-custom -n kube-system -o json 2>/dev/null | jq -r --arg k "${_cdns_key}" '.data[$k] // ""' 2>/dev/null || true)
      case "${_cdns_cur}" in
        *"${_cip} ${HARBOR_HOST}"*)
          echo "[harbor-prewarm] coredns-custom already pins ${HARBOR_HOST} -> ${_cip} (#5007)"
          return 0 ;;
      esac
      _cdns_patch=$(jq -cn --arg k "${_cdns_key}" --arg v "${_cdns_block}" '{data: {($k): $v}}')
      {{- /*
       MERGE-patch (never replace) so a co-resident github-ipv4.server key is
       preserved; create the CM if it does not exist yet (Hetzner renders no
       coredns-custom at boot); re-patch on a create race.
      */}}
      if kubectl patch configmap coredns-custom -n kube-system --type merge -p "${_cdns_patch}" >/dev/null 2>&1; then
        :
      elif kubectl create configmap coredns-custom -n kube-system --from-literal="${_cdns_key}=${_cdns_block}" >/dev/null 2>&1; then
        :
      elif kubectl patch configmap coredns-custom -n kube-system --type merge -p "${_cdns_patch}" >/dev/null 2>&1; then
        :
      else
        echo "[harbor-prewarm] FATAL: could not install the coredns-custom ${HARBOR_HOST} -> ${_cip} override (kube-system/coredns-custom patch+create both failed). Refusing to push over the flaky public DNS path (#5007)."
        exit 1
      fi
      echo "[harbor-prewarm] installed coredns-custom pin ${HARBOR_HOST} -> ${_cip} (in-cluster; step-03 pushes + bearer-token flow bypass public DNS; #5007). Waiting for CoreDNS reload via the readiness probe below."
    }
    install_coredns_registry_pin

    echo "[harbor-prewarm] public-dest readiness probe: https://${HARBOR_HOST}/v2/ (want 401/200; registry.<fqdn> resolves via the in-cluster CoreDNS gateway-ClusterIP pin once CoreDNS reloads, #5007)"
    {{- /* A curl without an HTTP answer is ONE not-ready probe: a bare `_pr_code=$(curl …)` under
     `set -eu` ended two pods with exit 6 while CoreDNS reloaded the pin (20 Nov 2026). */}}
    {{- include "bp-self-sovereign-cutover.curlNoAnswer" . | nindent 4 }}
    _pr_ok=0
    for _pr_i in $(seq 1 40); do
      _pr_rc=0
      _pr_code=$(curl -sk -o /dev/null -w '%{http_code}' -m 10 "https://${HARBOR_HOST}/v2/" 2>/dev/null) || _pr_rc=$?
      {{- /*
       #7900 — the public path answers 401 too, so the code alone passed before
       CoreDNS served the pin, and the first pushes left through the public
       door. That door pools every region's nodes and each region's registry
       signs its own tokens, so those pushes were refused. Ready only when this
       pod resolves the pinned address.
      */}}
      [ -z "${_cip:-}" ] || case " $(getent ahostsv4 "${HARBOR_HOST}" 2>/dev/null | awk '{print $1}' | tr '\n' ' ')" in *" ${_cip} "*) : ;; *) _pr_code="pin-not-served" ;; esac
      _pr_why="HTTP ${_pr_code:-none}"
      [ "${_pr_rc}" = 0 ] || { _pr_code=none; _pr_why=$(curl_no_answer "${_pr_rc}"); }
      if [ "${_pr_code}" = "401" ] || [ "${_pr_code}" = "200" ]; then
        _pr_ok=1
        echo "[harbor-prewarm] public dest ready (HTTP ${_pr_code}, probe ${_pr_i})"
        break
      fi
      echo "[harbor-prewarm] public dest not ready (${_pr_why}, probe ${_pr_i}/40) — pre-pivot DNS/gateway may still be settling (#5037 hw246 flake); retry in 15s"
      sleep 15
    done
    if [ "${_pr_ok}" != "1" ]; then
      echo "[harbor-prewarm] FATAL: https://${HARBOR_HOST}/v2/ never became ready after 40 probes (10 min; last probe: ${_pr_why}) — cannot push. With the #5007 coredns-custom pin, registry.<fqdn> resolves to the in-cluster gateway ClusterIP once CoreDNS reloads; a persistent failure means either CoreDNS did not pick up the override (check kube-system/coredns-custom + the coredns Pod logs) OR the gateway is not serving the registry (Harbor down / HTTPRoute not Programmed / wildcard TLS not issued) — NOT a public-DNS flake. (If the pin is disabled via LOCAL_REGISTRY_PIN_ENABLED=false, also check the Sovereign DNS zone for registry.<fqdn>.)"
      exit 1
    fi

    {{- /*
     Enumerate every image to mirror: running pods (containers, init,
     ephemeral) ∪ the declared Deployment/StatefulSet/DaemonSet/CronJob/Job
     templates (#3944: a scaled-to-zero or between-fires workload has no pod),
     every image, not only openova-io (#4975; copy_one routes each through the
     shared resolver), in EVERY region (#7922: a follower's own pods), plus
     each node's sandbox (pause) image. See values.yaml #7922 note. A walk
     that cannot list is FATAL, never empty.
    */}}
    # ── prewarm-list-images BEGIN (#7922 extraction anchor — tests/step7922-prewarm-proxy-path.sh sources this block verbatim) ──
    # The sandbox image is in no Pod spec: containerd starts every Pod with the image its node is configured with
    # (k3s --pause-image, else the default of the node's k3s release). The kubelet reports it on each Pod's sandbox
    # (cadvisor series with container="" and a pod), so it is read from the nodes, never written here a second time.
    prewarm_node_sandbox_images() {
      _ns_j=$(kubectl "$@" get nodes -o json 2>/dev/null) || return 1
      _ns_n=$(printf '%s' "${_ns_j}" | jq -r '.items[].metadata.name') || return 1
      [ -n "${_ns_n}" ] || return 0
      {{- /* A release delivery runs the candidate's step 03 under the INSTALLED grants (#7960): a chart older than this read lacks nodes/proxy. Name it; the next run after this chart is installed reads the nodes. */}}
      if ! kubectl "$@" auth can-i get nodes --subresource=proxy >/dev/null 2>&1; then
        echo "[harbor-prewarm] WARNING: this ServiceAccount may not get nodes/proxy (an installed ClusterRole older than this step), so the nodes' sandbox image is not read in this run" >&2; return 0
      fi
      _ns_out=""; _ns_miss=""
      for _ns_x in ${_ns_n}; do
        _ns_m=$(kubectl "$@" get --raw "/api/v1/nodes/${_ns_x}/proxy/metrics/cadvisor" 2>/dev/null) || { _ns_miss="${_ns_miss} ${_ns_x}"; continue; }
        _ns_out=$(printf '%s\n%s' "${_ns_out}" "$(printf '%s\n' "${_ns_m}" | awk 'match($0, /[{,]container=""[,}]/) && match($0, /[{,]pod="[^"]+"/) && match($0, /[{,]image="[^"]+"/) {print substr($0, RSTART + 8, RLENGTH - 9)}' | sort -u)")
      done
      [ -z "${_ns_miss}" ] || echo "[harbor-prewarm] sandbox image: no kubelet answer from${_ns_miss}; the other nodes of the region are read" >&2
      if [ -n "${_ns_n}" ] && [ -z "$(printf '%s' "${_ns_out}" | tr -d '[:space:]')" ]; then echo "[harbor-prewarm] FATAL: no node of the region reported the sandbox image its Pods start with" >&2; return 1; fi
      printf '%s' "${_ns_out}"
    }
    prewarm_list_images() {
      _li_rg="$2"
      if [ -n "$1" ]; then set -- --kubeconfig "$1"; else set --; fi
      _li_p=$(kubectl "$@" get pods -A -o json 2>/dev/null) || return 1
      _li_w=$(kubectl "$@" get deployments,statefulsets,daemonsets,cronjobs,jobs -A -o json 2>/dev/null) || return 1
      _li_a=$(printf '%s' "${_li_p}" | jq -r '.items[].spec | (.containers // [])[].image, (.initContainers // [])[].image, (.ephemeralContainers // [])[].image') || return 1
      _li_b=$(printf '%s' "${_li_w}" | jq -r '.items[] | (.spec.jobTemplate.spec.template.spec // .spec.template.spec // {}) | (.containers // [])[].image, (.initContainers // [])[].image') || return 1
      _li_s=$(prewarm_node_sandbox_images "$@") || return 1
      printf '%s\n%s\n%s\n' "${_li_a}" "${_li_b}" "${_li_s}" | grep -E '^[^[:space:]]+$' | grep -v '^null$' | sort -u | awk -v r="${_li_rg}" '{print $0 "\t" r}'
    }
    # ── prewarm-list-images END ──
    echo "[harbor-prewarm] enumerating ALL images across cluster (running pods ∪ declared workload templates), every region (#7922)"
    run_images_file=/tmp/.prewarm-run-images.tsv
    prewarm_list_images "" primary >"${run_images_file}" || { echo "[harbor-prewarm] FATAL (#7922): could not list the images of this region"; exit 1; }
    for _rk in /secondary-kubeconfigs/*.yaml; do
      [ -e "${_rk}" ] || continue
      prewarm_list_images "${_rk}" "$(basename "${_rk}" .yaml)" >>"${run_images_file}" || { echo "[harbor-prewarm] FATAL (#7922): could not list the images of follower region $(basename "${_rk}" .yaml) — the step can neither mirror nor check what that region runs"; exit 1; }
    done
    openova_images=$(cut -f1 "${run_images_file}" | sort -u)
    count=$(printf '%s\n' "${openova_images}" | grep -c . || true)
    echo "[harbor-prewarm] ${count} unique image(s) to mirror; $(awk -F'\t' '$2=="primary" {p[$1]=1} {a[$1]=1} END {n=0; for (k in a) if (!(k in p)) n++; print n}' "${run_images_file}") of them run only in a follower region (#7922)"

    {{- /*
     Native push each via skopeo copy, PREWARM_PARALLELISM at once (#3379,
     hw139: serial copies over a throttled egress blew the step deadline with
     6/29 pushed; the ghcr sources are private, so this authenticated push is
     the only route, but the wall-clock collapses). Each worker writes its own
     `.ok`/`.fail` sentinel and log under ${cpdir}; the parent waits for all
     and tallies the sentinels (POSIX sh has no `wait -n`: the launch loop
     counts live PIDs). skopeo `--retry-times` heals a transient reset inside
     one copy; copy_one adds an OUTER per-image retry (PREWARM_COPY_ATTEMPTS)
     because a Harbor-side reset can abort a whole copy (#3608, hw146: two
     ~50MB guacamole images). The step FATALs only when both retry layers are
     exhausted (every image must be local for the deny-egress hold).
     `--insecure-policy` (no /etc/containers/policy.json in the image) and the
     branch on skopeo's REAL exit status, never a piped sed's, stay (#3379).
    */}}
    : "${PREWARM_PARALLELISM:=6}"
    : "${PREWARM_COPY_ATTEMPTS:=3}"
    {{- /*
     #5095 — separate, wider budget for MOTHERSHIP-PROXY-sourced
     copies (exponential backoff spans ≥15 min at the defaults so a
     short transit flap toward the mothership can't exhaust it).
    */}}
    : "${PREWARM_PROXY_COPY_ATTEMPTS:=6}"
    : "${PREWARM_PROXY_BACKOFF_BASE_SECONDS:=30}"
    {{- /* #5095 round 2 — proxy-DOWN direct-first routing defaults. */}}
    : "${PROXY_DIRECT_FIRST_ENABLED:=true}"
    : "${PROXY_PROBE_TIMEOUT_SECONDS:=8}"
    : "${PROXY_PROBE_ATTEMPTS:=3}"
    cpdir="/tmp/prewarm-copies"
    PREWARM_RT_DIR="${cpdir}"
    rm -rf "${cpdir}"; mkdir -p "${cpdir}"
    echo "[harbor-prewarm] pushing ${count} image(s) with parallelism=${PREWARM_PARALLELISM}"

    {{- /*
     #4955 (Refs #3379): `name:tag@sha256:...` becomes `name@sha256:...` before
     skopeo, which refuses a reference with both ("not supported") and so once
     failed the whole step on one image (hw235, wordpress-tenant-pg). The digest
     is what containerd pulls by for such a pod ref, so the post-pivot pull is
     kept. Tag-only and digest-only refs pass unchanged; only the LAST path
     segment's tag is stripped, so a `host:port/...` ref is left intact.
    */}}
    normalize_ref() {
      _nr="$1"
      case "${_nr}" in
        *@*)
          _nr_digest="${_nr##*@}"   # sha256:...
          _nr_name="${_nr%@*}"      # name[:tag]
          case "${_nr_name##*/}" in
            *:*) _nr_name="${_nr_name%:*}" ;;  # strip tag from last path segment
          esac
          printf '%s@%s' "${_nr_name}" "${_nr_digest}"
          ;;
        *)
          printf '%s' "${_nr}"
          ;;
      esac
    }

    XPKG_V2_ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
    xpkg_v2_resolve_digest() {
      {{- /*
       $1 = repo-path (literal slashes, incl. project), $2 = tag.
       Echoes the servable manifest/index digest (Docker-Content-Digest
       from a v2 HEAD) when the HEAD is 200 + carries the header, else
       nothing. This is the durable digest step-11 pivots spec.package
       to. Empty tag → nothing (an in-ref digest is authoritative and
       never needs resolving).
      */}}
      _xr_repo="$1"; _xr_tag="$2"
      [ -n "${_xr_tag}" ] || return 0
      curl -sSIk --max-time 30 \
        -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
        -H "Accept: ${XPKG_V2_ACCEPT}" \
        "${HARBOR_INTERNAL_URL}/v2/${_xr_repo}/manifests/${_xr_tag}" 2>/dev/null \
        | tr -d '\r' | grep -i '^docker-content-digest:' | tail -1 | awk '{print $2}'
    }
    xpkg_v2_digest_present() {
      {{- /*
       $1 = repo-path (literal slashes, incl. project), $2 = sha256
       digest. 0 iff the registry v2 API serves that digest (200) —
       Harbor CORE serving the durably-cached index/manifest, the
       multi-arch-aware durability signal that supersedes the
       artifact-management-API probe for xpkg (#5232). Non-zero on ANY
       miss → fail-closed (the caller warms / FATALs).
      */}}
      _xp_repo="$1"; _xp_dig="$2"
      [ -n "${_xp_dig}" ] || return 1
      _xp_code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 30 \
        -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
        -H "Accept: ${XPKG_V2_ACCEPT}" \
        "${HARBOR_INTERNAL_URL}/v2/${_xp_repo}/manifests/${_xp_dig}" 2>/dev/null)
      [ "${_xp_code}" = "200" ]
    }

    {{- /*
     #5030 #5443 — the digest the local Harbor DURABLY holds for $1 (the resolver PATH
     project/repo[:tag|@digest] or a HARBOR_HOST-prefixed lref), empty when absent. It asks the
     ARTIFACT API (Harbor CORE, from its database), never `skopeo inspect` on the dest, which pulls a
     manifest through a proxy-cache leg while egress is up and once false-skipped copies that 404ed
     under step 08's hold (hw243, hw244). It is the probe step 08's completeness gate and the Phase
     A2-guard use, so a skip can never diverge from the gate that judges it. Its exit status is never
     load-bearing on its own.
    */}}
    harbor_durable_digest() {
      _hd_pp="${1#${HARBOR_HOST}/}"
      _hd_ref="latest"
      case "${_hd_pp}" in
        *@*)
          _hd_ref="${_hd_pp##*@}"; _hd_pp="${_hd_pp%@*}"
          case "${_hd_pp##*/}" in *:*) _hd_pp="${_hd_pp%:*}" ;; esac ;;
        *)
          case "${_hd_pp##*/}" in *:*) _hd_ref="${_hd_pp##*:}"; _hd_pp="${_hd_pp%:*}" ;; esac ;;
      esac
      {{- /* project = first path segment; repository = the (possibly nested) rest. */}}
      case "${_hd_pp}" in
        */*) _hd_proj="${_hd_pp%%/*}"; _hd_repo="${_hd_pp#*/}" ;;
        *)   _hd_proj="${_hd_pp}";     _hd_repo="" ;;
      esac
      {{- /* No repository segment → cannot address an artifact. */}}
      [ -z "${_hd_repo}" ] && return 1
      {{- /*
       Harbor's artifact API needs the nested repo name's `/` encoded as
       %2F. #5036: this check dials the Harbor CORE Service DIRECTLY
       (HARBOR_INTERNAL_URL) with NO gateway in the path, so SINGLE-encode
       (`/` -> %2F) — harbor-core receives %2F and routes the nested repo.
       (Under #4688's gateway path this was DOUBLE-encoded `%252F` to survive
       envoy's one-layer decode before Harbor; the direct Service path has no
       such decode.) -k is harmless over the plain-HTTP Service; retained so
       an https harborInternalURL override still works.
      */}}
      _hd_repo_enc=$(printf '%s' "${_hd_repo}" | sed 's#/#%2F#g')
      _hd_d=$(curl -sk --max-time 30 \
        -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
        "${HARBOR_INTERNAL_URL}/api/v2.0/projects/${_hd_proj}/repositories/${_hd_repo_enc}/artifacts/${_hd_ref}" 2>/dev/null \
        | jq -r '.digest // empty' 2>/dev/null || true)
      {{- /* #5232: a proxy-cache project lists a pulled-through index by its digest in the registry API only, and that API also answers from the upstream: it counts only after this run read the ref through (prewarm_read_through), then by a digest GET as Phase A4 verifies. */}}
      if [ -z "${_hd_d}" ] && prewarm_proxy_project "${_hd_proj}" && [ -e "${PREWARM_RT_DIR:-${cpdir}}/.rt-ok.$(rl_slug "${_hd_proj}/${_hd_repo}@${_hd_ref}")" ]; then
        case "${_hd_ref}" in sha256:*) if xpkg_v2_digest_present "${_hd_proj}/${_hd_repo}" "${_hd_ref}"; then _hd_d="${_hd_ref}"; fi ;; esac
      fi
      [ -z "${_hd_d}" ] || printf '%s\n' "${_hd_d}"
    }

    {{- /* The local projects that are proxy caches (PROXY_CACHE_PROJECTS, step 02's harbor.proxyProjects). */}}
    prewarm_proxy_project() { for _pxp in ${PROXY_CACHE_PROJECTS:-}; do [ "$1" = "${_pxp}" ] && return 0; done; return 1; }
    {{- /*
     prewarm_read_through PATH LOG: fill a proxy-cache project with PATH by one full read through it
     (all platforms) with the local credential, as Phase A4 warms a package, and mark PATH read in
     PREWARM_RT_DIR; PREWARM_LEG_ERR names the registry's answer when every attempt fails.
    */}}
    prewarm_read_through() {
      _rt_dir="${cpdir}/.rt.$(rl_slug "$1")"; _rt_i=1; PREWARM_LEG_ERR=""
      while [ "${_rt_i}" -le "${PREWARM_COPY_ATTEMPTS:-3}" ]; do
        rm -rf "${_rt_dir}"
        if skopeo --command-timeout "${PREWARM_SKOPEO_TIMEOUT}" copy --insecure-policy --multi-arch all --retry-times 5 \
            --src-creds="${HARBOR_USERNAME}:${HARBOR_PASSWORD}" --src-tls-verify="${PREWARM_DEST_TLS_VERIFY}" \
            "docker://${HARBOR_HOST}/$1" "dir:${_rt_dir}" >>"$2" 2>&1; then rm -rf "${_rt_dir}"; : >"${PREWARM_RT_DIR:-${cpdir}}/.rt-ok.$(rl_slug "$1")"; return 0; fi
        _rt_i=$((_rt_i+1)); [ "${_rt_i}" -gt "${PREWARM_COPY_ATTEMPTS:-3}" ] || sleep 5
      done
      rm -rf "${_rt_dir}"
      PREWARM_LEG_ERR="read of ${HARBOR_HOST}/$1 as ${HARBOR_USERNAME} failed: $(grep 'level=fatal' "$2" | tail -1 | sed -e 's/^.*level=fatal msg=//' -e 's/^"//' -e 's/"$//' | awk '{print substr($0, length($0) > 300 ? length($0) - 299 : 1)}')"
      return 1
    }

    dest_already_current() {
      {{- /*
       $1 upstream ref  $2 local dest ref (resolver PATH or HARBOR_HOST-prefixed lref)  $3 src creds.
       0: the dest durably holds the source digest. 1: the dest is absent: copy. 2 (#7938): the
       dest durably holds the tag at ANOTHER digest, or the source is unreadable: the tag is KEPT.
       A tag of the local registry never moves to another digest (a pod moved to another node
       would pull other bytes than its siblings run); an upstream that re-pushed the tag is a
       WARNING, and new content reaches the Sovereign under a new tag. The source digest is the
       sha256 of the raw manifest bytes, read into a file (a failed read hashed in a pipe is the
       empty-input sha256, and $(...) drops a trailing newline); for a single-platform ref
       (#5468) it is the digest of that platform's child, the manifest the copy writes.
       Measured on hw307 (18 Nov 2026): build-chargeback.yaml pushes ghcr.io/openova-io/
       chargeback:<appVersion> on every push to main under products/chargeback, so 0.1.67 named
       d326a9d9 (15 Nov 13:27), 51c16e5d (15 Nov 22:16) and 509d6807 (16 Nov 05:42). A delivery's
       step 03 found an older digest locally, read 509d6807 upstream, copied it: the push_time of
       proxy-ghcr/openova-io/chargeback:0.1.67 is 14:05:06, inside that step, and the copy kept
       the source digest exactly (no re-encoding, no platform change). A replica rescheduled by
       a node drain then pulled 509d6807 while the other ran 51c16e5d, so gate runs 16 and 17
       saw two digests for one tag and could not pair. The follower's leg (secondary-harbor-
       prewarm) re-copied the same tag into the same shared repository with no check at all.
      */}}
      _dc_up="$1"; _dc_dref="$2"; _dc_sc="$3"; _dc_s=""; _dc_f="${cpdir:-/tmp}/.src.$(rl_slug "${_dc_dref}")"
      _dc_d=$(harbor_durable_digest "${_dc_dref}")
      set -- --command-timeout "${PREWARM_SKOPEO_TIMEOUT}" inspect --raw --tls-verify=true
      [ -z "${_dc_sc}" ] || set -- "$@" --creds="${_dc_sc}"
      skopeo "$@" "docker://${_dc_up}" >"${_dc_f}" 2>/dev/null || : >"${_dc_f}"
      if [ -s "${_dc_f}" ]; then
        _dc_s="sha256:$(sha256sum <"${_dc_f}" | awk '{print $1}')"
        case "$(prewarm_multiarch_flags "${_dc_up}")" in *system*)
          _dc_c=$(jq -r --arg o "${PREWARM_SINGLE_PLATFORM_OS:-linux}" --arg a "${PREWARM_SINGLE_PLATFORM_ARCH:-amd64}" '[.manifests[]? | select(.platform.os == $o and .platform.architecture == $a) | .digest][0] // empty' <"${_dc_f}" 2>/dev/null || true)
          [ -z "${_dc_c}" ] || _dc_s="${_dc_c}" ;;
        esac
      fi
      rm -f "${_dc_f}"
      [ -n "${_dc_d}" ] || return 1
      [ "${_dc_s}" != "${_dc_d}" ] || return 0
      [ -z "${_dc_s}" ] || echo "[harbor-prewarm] WARNING: tag moved upstream: ${_dc_up} is now ${_dc_s}; the local registry keeps ${_dc_dref#"${HARBOR_HOST}"/} at ${_dc_d} and never moves a tag to another digest; publish the new content under a new tag (#7938)"
      return 2
    }

    {{- /*
     #5095 — ONE bounded skopeo copy SRC → LREF (optional src creds, output
     appended to the log), shared by the proxy leg and the direct fallback.
     Its status is skopeo's REAL status (#3379 hw138: callers branch on it
     in if/else, never a pipeline). Flags: #3944 --command-timeout (a stalled
     connection fails fast for the outer retry), #4529 dest TLS off for the
     in-cluster Harbor, #4975 --multi-arch all (containerd pulls BY the list
     digest; a single-arch copy of a list is `digest invalid`, hw239), #7938
     --preserve-digests (skopeo writes the source's digest or fails, never a re-encoding).
     #5468 — prewarm_multiarch_flags: the one per-image exception, a SINGLE
     platform for refs matching PREWARM_SINGLE_PLATFORM_SUBSTRINGS (upstream
     indexes Harbor cannot ingest, e.g. litellm-database's duplicated
     children; tag-addressed, so safe). Full account at values.yaml
     prewarm.singlePlatform. Env reads are `:-`-defaulted under `set -eu`.
    */}}
    prewarm_multiarch_flags() {
      _ma_ref="$1"
      for _ma_s in ${PREWARM_SINGLE_PLATFORM_SUBSTRINGS:-}; do
        case "${_ma_ref}" in
          *"${_ma_s}"*)
            printf -- '--multi-arch system --override-os %s --override-arch %s' \
              "${PREWARM_SINGLE_PLATFORM_OS:-linux}" "${PREWARM_SINGLE_PLATFORM_ARCH:-amd64}"
            return 0 ;;
        esac
      done
      printf -- '--multi-arch all'
    }

    {{- /* #5525 leg 2 — slug a registry host into a latch-file-safe token. */}}
    rl_slug() { printf '%s' "$1" | tr -c 'A-Za-z0-9._-' '_'; }

    prewarm_skopeo_copy() {
      _pc_src="$1"; _pc_creds="$2"; _pc_lref="$3"; _pc_log="$4"; PREWARM_LEG_ERR=""
      {{- /* #7938 — a copy whose source is its destination (after normalization) is never attempted: it can only read the registry it writes. */}}
      if [ "$(offlinemirror_normalize_ref "${_pc_src}")" = "$(offlinemirror_normalize_ref "${_pc_lref}")" ]; then PREWARM_LEG_ERR="not attempted: the source ${_pc_src} is its own destination (#7938)"; echo "[harbor-prewarm] ${PREWARM_LEG_ERR}" >>"${_pc_log}"; return 1; fi
      {{- /* #5468 multi-arch mode first (unquoted: the flag string word-splits), matched on the SOURCE ref. */}}
      set -- $(prewarm_multiarch_flags "${_pc_src}")
      {{- /* #5525 leg 2 — log offset BEFORE this leg, so the sniffs below read only this leg's output. */}}
      _pc_off=$(wc -c < "${_pc_log}" 2>/dev/null || echo 0)
      {{- /* A list as its entries, then its own bytes (offlinemirror_copy, _helpers.tpl). */}}
      if offlinemirror_copy "${_pc_src}" "${_pc_creds}" "${_pc_lref}" "$@" >>"${_pc_log}" 2>&1; then
        return 0
      else
        _pc_rc=$?
      fi
      {{- /*
       #5525 leg 2 — `toomanyrequests` is a PER-IP quota window (hw291: retries
       kept it exhausted ~60 min): latch the SOURCE host so copy_one skips it
       for this job attempt wherever a fallback source exists.
      */}}
      _pc_h="${_pc_src%%/*}"
      if tail -c +"$((_pc_off+1))" "${_pc_log}" 2>/dev/null | grep -qi 'toomanyrequests'; then
        if [ ! -f "${cpdir}/.ratelimited.$(rl_slug "${_pc_h}")" ]; then
          touch "${cpdir}/.ratelimited.$(rl_slug "${_pc_h}")" 2>/dev/null || true
          echo "[harbor-prewarm] ${_pc_h} answered toomanyrequests (per-IP rate limit) — latching this host OFF for the remainder of this job attempt wherever a fallback source exists; retrying inside the same quota window is guaranteed waste (#5525)"
        fi
      fi
      {{- /*
       #7900 #7922 #7938 — 75 = the DESTINATION failed (copy_one retries the same
       source: no fallback, no latch), told ONLY by skopeo's write-phase errors
       (push denied, layer upload, `writing blob`/manifest, blob reuse at or init
       of the destination), never by the local host in the text: in
       `initializing source docker://registry.<fqdn>/…` it is the SOURCE.
       `happened during read` is a source error inside an upload. PREWARM_LEG_ERR
       names the side, the ref and the identity (values.yaml #7922 note).
      */}}
      _pc_fatal=$(tail -c +"$((_pc_off+1))" "${_pc_log}" 2>/dev/null | grep 'level=fatal' | tail -1)
      _pc_err=$(printf '%s' "${_pc_fatal:-skopeo exit ${_pc_rc}, no fatal line}" | sed -e 's/^.*level=fatal msg=//' -e 's/^"//' -e 's/"$//' | cut -c1-300)
      _pc_dst=""; if tail -c +"$((_pc_off+1))" "${_pc_log}" 2>/dev/null | grep -v 'happened during read' | grep -qE 'action: push|initiating layer upload|writing manifest'; then _pc_dst=1; fi
      case "${_pc_fatal}" in *'happened during read'*) : ;; *'writing blob'*|*'reuse blob'*|*'initializing destination'*) _pc_dst=1 ;; esac
      if [ -n "${_pc_dst}" ]; then PREWARM_LEG_ERR="write to ${_pc_lref} as ${HARBOR_USERNAME} failed: ${_pc_err}"; return 75; fi
      _pc_who="${_pc_creds%%:*}"; PREWARM_LEG_ERR="read of ${_pc_src} as ${_pc_who:-anonymous} failed: ${_pc_err}"
      return "${_pc_rc}"
    }

    {{- /* #7922 — one anonymous GET of the parent's registry API; 200/401/403 = the proxy path is up. */}}
    mothership_proxy_code() { curl -sk -o /dev/null -w '%{http_code}' -m "${PROXY_PROBE_TIMEOUT_SECONDS:-8}" "https://${MOTHERSHIP_HOST}/v2/" 2>/dev/null || true; }

    {{- /*
     #4975 — copy ONE image to ALL its local paths (two for
     ghcr.io/openova-io/*), from the shared resolver, so step 03 and step 08
     agree byte for byte. .ok only if EVERY dest copy succeeded.
    */}}
    copy_one() {
      up=$(offlinemirror_normalize_ref "$1")
      slug=$(printf '%s' "${up}" | tr -c 'A-Za-z0-9._-' '_')
      : >"${cpdir}/${slug}.log"
      dests=$(offlinemirror_local_paths "${up}")
      if [ -z "${dests}" ]; then
        {{- /* Excluded at copy time (belt to the pre-pass filter). */}}
        printf '%s (excluded)' "${up}" >"${cpdir}/${slug}.ok"
        return 0
      fi
      {{- /*
       #7938: a ref on the local registry (a pivoted workload; a chart rendered with this Sovereign's
       values) maps to itself. Present: not copied. Absent: its upstream (03a offlinemirror_upstream_ref)
       is resolved BEFORE any copy; with none it fails by name and skopeo is never called. Local is
       every name of it (offlinemirror_is_local_host): a delivery after step 11 reads Provider pods on
       harbor.<fqdn>/proxy-xpkg, which an anonymous read answered 401 (20 Nov 2026).
      */}}
      if offlinemirror_is_local_host "${up%%/*}"; then
        _cu_miss=""; for _cu_p in ${dests}; do [ -n "$(harbor_durable_digest "${_cu_p}")" ] || _cu_miss=1; done
        if [ -z "${_cu_miss}" ]; then printf '%s (in the local registry)' "${up}" >"${cpdir}/${slug}.ok"; return 0; fi
        _cu=$(offlinemirror_upstream_ref "${up}" 2>/dev/null || true)
        if [ -z "${_cu}" ] || offlinemirror_is_local_host "${_cu%%/*}"; then
          printf '%s points at the local registry, is not in it, and maps back to no upstream: not copied (#7938)' "${up}" >"${cpdir}/${slug}.fail"; echo "[harbor-prewarm] FAIL $(cat "${cpdir}/${slug}.fail")"; return 0
        fi
        echo "[harbor-prewarm] ${up} points at the local registry and is not in it: copying it from its upstream ${_cu} (#7938)" >>"${cpdir}/${slug}.log"
        {{- /* A proxy-cache project takes no push and is never present before this run reads it (harbor_durable_digest): a full read through it with the local credential fills it from that upstream; then it must be present at the same digest. */}}
        if prewarm_proxy_project "${dests%%/*}"; then
          if prewarm_read_through "${dests}" "${cpdir}/${slug}.log" && [ -n "$(harbor_durable_digest "${dests}")" ]; then
            printf '%s (copied from %s through the proxy project)' "${up}" "${_cu}" >"${cpdir}/${slug}.ok"; echo "[harbor-prewarm] done ${up} (ok)"
          else
            printf '%s exit=1: %s' "${up}" "${PREWARM_LEG_ERR:-read through, and still not in the local registry}" >"${cpdir}/${slug}.fail"; echo "[harbor-prewarm] done ${up} (FAIL)"
          fi
          return 0
        fi
        up="${_cu}"
      fi
      {{- /* SOURCE host → src-creds selection (bare official image = docker.io). */}}
      srchost="${up%%/*}"
      case "${srchost}" in *.*|*:*|localhost) : ;; *) srchost="docker.io" ;; esac
      sc=$(src_creds_for "${srchost}")
      {{- /*
       #5095 — a mothership-proxy ref (harbor.openova.io/proxy-<x>/<path>) gets
       a DIRECT fallback derived from the proxy path by the INVERSE coverage-map
       lookup (proxy-dockerhub → docker.io, …; no second hand-list), for a
       transit flap toward the mothership (hw255). #5525 leg 1 — a Scarf
       redirector (*.docker.scarf.sh: Docker Hub's anonymous quota applies
       through it, hw291) gets the mothership proxy as its fallback by the
       FORWARD lookup. Source selection only; the DEST path is untouched.
      */}}
      proxy_src=0
      fb_up=""
      fb_creds=""
      if [ -n "${MOTHERSHIP_HOST:-}" ] && [ "${srchost}" = "${MOTHERSHIP_HOST}" ]; then
        proxy_src=1
        _fb_rest="${up#*/}"
        case "${_fb_rest}" in
          */*)
            _fb_proj="${_fb_rest%%/*}"
            _fb_path="${_fb_rest#*/}"
            _fb_host=""
            for _fb_pair in ${HOST_PROJECT_MAP}; do
              _fb_h="${_fb_pair%%:*}"
              case "${_fb_pair}" in *:*) _fb_p="${_fb_pair#*:}" ;; *) _fb_p="" ;; esac
              if [ -n "${_fb_p}" ] && [ "${_fb_p}" = "${_fb_proj}" ]; then _fb_host="${_fb_h}"; break; fi
            done
            if [ -n "${_fb_host}" ]; then
              fb_up="${_fb_host}/${_fb_path}"
              fb_creds=$(src_creds_for "${_fb_host}")
              echo "[harbor-prewarm] mothership-proxy source ${up}: direct-source fallback available (${fb_up}; #5095)" >>"${cpdir}/${slug}.log"
            fi
            ;;
        esac
      elif [ -n "${MOTHERSHIP_HOST:-}" ]; then
        case "${srchost}" in
          *.docker.scarf.sh)
            _fb_proj=""
            for _fb_pair in ${HOST_PROJECT_MAP}; do
              _fb_h="${_fb_pair%%:*}"
              case "${_fb_pair}" in *:*) _fb_p="${_fb_pair#*:}" ;; *) _fb_p="" ;; esac
              if [ "${_fb_h}" = "${srchost}" ] && [ -n "${_fb_p}" ]; then _fb_proj="${_fb_p}"; break; fi
            done
            if [ -n "${_fb_proj}" ]; then
              fb_up="${MOTHERSHIP_HOST}/${_fb_proj}/${up#*/}"
              fb_creds=$(src_creds_for "${MOTHERSHIP_HOST}")
              echo "[harbor-prewarm] scarf.sh redirector source ${up}: mothership-proxy fallback available (${fb_up}; #5525)" >>"${cpdir}/${slug}.log"
            fi
            ;;
        esac
      fi
      all_ok=1; _cur_n=0
      last_rc=0
      for dpath in ${dests}; do
        lref="${HARBOR_HOST}/${dpath}"
        {{- /* #4994 — SKIP when the dest durably serves the same manifest (hw240); #7938 — a tag the dest holds at another digest is KEPT, whatever the toggle says. */}}
        _dc_rc=0; dest_already_current "${up}" "${lref}" "${sc}" || _dc_rc=$?
        if [ "${_dc_rc}" -eq 0 ] && [ "${PREWARM_SKIP_IF_PRESENT:-true}" = "true" ]; then
          echo "[harbor-prewarm] skip ${up} -> ${lref} (dest already current)"
          echo "  SKIP ${up} -> ${lref} (dest already serves identical manifest; copy skipped)" >>"${cpdir}/${slug}.log"
          _cur_n=$((_cur_n+1)); continue
        fi
        if [ "${_dc_rc}" -eq 2 ]; then echo "  KEPT ${lref} at ${_dc_d}: the source reads ${_dc_s:-nothing}; a tag never moves (#7938)" >>"${cpdir}/${slug}.log"; _cur_n=$((_cur_n+1)); continue; fi
        {{- /*
         OUTER per-dest retry loop around prewarm_skopeo_copy (a dest reset can
         abort a whole copy, hw146): PREWARM_COPY_ATTEMPTS, or for a
         mothership-proxy ref PREWARM_PROXY_COPY_ATTEMPTS with exponential
         backoff (#5095). The image is .fail unless every dest copy succeeds
         from SOME source.
        */}}
        attempt=1
        rc=1
        src_used=""
        _proxy_err=""
        _direct_why=""
        if [ "${proxy_src}" -eq 1 ]; then
          max_attempts="${PREWARM_PROXY_COPY_ATTEMPTS}"
        else
          max_attempts="${PREWARM_COPY_ATTEMPTS}"
        fi
        while [ "${attempt}" -le "${max_attempts}" ]; do
          {{- /*
           #5095 round 2 — proxy latched DOWN (upfront probe, or the #7922 latch
           below): try the DIRECT upstream FIRST, so no image pays the 1200s
           timeout on a dead proxy; on a miss fall through to proxy-first.
           Re-checked every attempt. #5525 — gated on proxy_src: a scarf ref's
           fallback IS the proxy and keeps primary-first.
          */}}
          if [ "${proxy_src}" -eq 1 ] && [ -n "${fb_up}" ] && [ "${PROXY_DIRECT_FIRST_ENABLED:-true}" = "true" ] && [ -f "${cpdir}/.proxy_down" ]; then
            echo "[harbor-prewarm] proxy latched DOWN; direct-first ${fb_up} -> ${lref} attempt ${attempt}/${max_attempts} (#5095 round 2)" >>"${cpdir}/${slug}.log"
            if prewarm_skopeo_copy "${fb_up}" "${fb_creds}" "${lref}" "${cpdir}/${slug}.log"; then
              rc=0
              src_used="${fb_up}"
              _direct_why="proxy latched DOWN earlier in this wave"
              break
            else
              rc=$?
            fi
          fi
          {{- /* #5525 leg 2 — a toomanyrequests-latched primary with a fallback is skipped, straight to the fallback. */}}
          if [ -n "${fb_up}" ] && [ -f "${cpdir}/.ratelimited.$(rl_slug "${srchost}")" ]; then
            echo "[harbor-prewarm] skip rate-limited primary ${up} (host latched toomanyrequests); straight to fallback ${fb_up} attempt ${attempt}/${max_attempts} (#5525)" >>"${cpdir}/${slug}.log"
            rc=1
            _proxy_err="not tried: ${srchost} answered toomanyrequests earlier in this wave"
          else
            echo "[harbor-prewarm] copy ${up} -> ${lref} attempt ${attempt}/${max_attempts}" >>"${cpdir}/${slug}.log"
            if prewarm_skopeo_copy "${up}" "${sc}" "${lref}" "${cpdir}/${slug}.log"; then
              rc=0
              src_used="${up}"
              break
            else
              rc=$?
              _proxy_err="${PREWARM_LEG_ERR:-}"
            fi
          fi
          {{- /* #5095 — the fallback runs inside the same attempt, before it counts as failed; never on a destination failure (75). */}}
          if [ "${rc}" -eq 75 ]; then
            echo "[harbor-prewarm] ${lref} refused the write (destination failure, not a source failure): ${PREWARM_LEG_ERR:-}; no source fallback, no proxy latch; same source after the backoff (#7900)" >>"${cpdir}/${slug}.log"
          elif [ -n "${fb_up}" ]; then
            if [ "${proxy_src}" -eq 1 ]; then
              echo "[harbor-prewarm] proxy source failed (exit=${rc}); direct-source fallback ${fb_up} -> ${lref} attempt ${attempt}/${max_attempts} (#5095)" >>"${cpdir}/${slug}.log"
            else
              echo "[harbor-prewarm] primary source failed/skipped (exit=${rc}); mothership-proxy fallback ${fb_up} -> ${lref} attempt ${attempt}/${max_attempts} (#5525)" >>"${cpdir}/${slug}.log"
            fi
            if prewarm_skopeo_copy "${fb_up}" "${fb_creds}" "${lref}" "${cpdir}/${slug}.log"; then
              rc=0
              src_used="${fb_up}"
              {{- /*
               #5095 round 2 #7922 — the proxy leg failed, its direct sibling
               worked: latch the proxy DOWN only if its /v2/ does not answer. A
               proxy that answers but cannot serve this one image (hw307:
               `manifest unknown` for one child manifest latched 75 images away
               from it) stays in use. See values.yaml #7922 note.
              */}}
              if [ "${proxy_src}" -eq 1 ]; then
                _direct_why="the proxy could not serve this image: ${_proxy_err}"
                if [ "${PROXY_DIRECT_FIRST_ENABLED:-true}" = "true" ] && [ ! -f "${cpdir}/.proxy_down" ]; then
                  _pl_code=$(mothership_proxy_code)
                  case "${_pl_code}" in
                    200|401|403) _direct_why="${_direct_why}; ${MOTHERSHIP_HOST}/v2/ answers HTTP ${_pl_code}, so the proxy is NOT latched down" ;;
                    *) touch "${cpdir}/.proxy_down" 2>/dev/null || true
                      _direct_why="mothership proxy path failing: ${_proxy_err}; ${MOTHERSHIP_HOST}/v2/ answers HTTP ${_pl_code:-none}"
                      echo "[harbor-prewarm] proxy LATCHED DOWN by ${up}: the proxy leg failed (${_proxy_err}), ${MOTHERSHIP_HOST}/v2/ answers HTTP ${_pl_code:-none} and the direct upstream ${fb_up} succeeded — every later proxy-sourced image of this wave goes direct-first (#5095 #7922)" ;;
                  esac
                fi
              fi
              break
            else
              rc=$?
            fi
          fi
          echo "[harbor-prewarm] copy ${up} -> ${lref} attempt ${attempt} failed (exit=${rc}: ${PREWARM_LEG_ERR:-}); retrying after backoff" >>"${cpdir}/${slug}.log"
          attempt=$((attempt+1))
          if [ "${attempt}" -le "${max_attempts}" ]; then
            if [ "${proxy_src}" -eq 1 ]; then
              {{- /* #5095 — base*2^(n-2) before attempt n: 30..480s, 930s over 6 attempts, inside the step deadline (#5298). */}}
              _bo="${PREWARM_PROXY_BACKOFF_BASE_SECONDS}"
              _bi=2
              while [ "${_bi}" -lt "${attempt}" ]; do _bo=$((_bo*2)); _bi=$((_bi+1)); done
              echo "[harbor-prewarm] proxy-source backoff ${_bo}s before attempt ${attempt}/${max_attempts} for ${up} (#5095 flap-tolerant pacing)" >>"${cpdir}/${slug}.log"
              sleep "${_bo}"
            else
              sleep 5
            fi
          fi
        done
        {{- /*
         #5525 leg 3 — every attempt failed AND the source manifest is
         unreadable (rate-limit latch, or a fresh read yields nothing): if the
         dest is durably present (harbor_durable_digest, never a pull-through)
         keep it with a WARN, freshness unverified (hw291: A3 PASS next to
         FATAL copy_fail=4). A readable source keeps the strict failure.
        */}}
        if [ "${rc}" -ne 0 ]; then
          _rs_raw=""
          if [ ! -f "${cpdir}/.ratelimited.$(rl_slug "${srchost}")" ]; then
            if [ -n "${sc}" ]; then
              _rs_raw=$(skopeo --command-timeout "${PREWARM_SKOPEO_TIMEOUT}" inspect --raw \
                --creds="${sc}" --tls-verify=true "docker://${up}" 2>/dev/null || true)
            else
              _rs_raw=$(skopeo --command-timeout "${PREWARM_SKOPEO_TIMEOUT}" inspect --raw \
                --tls-verify=true "docker://${up}" 2>/dev/null || true)
            fi
          fi
          if [ -z "${_rs_raw}" ] && [ -n "$(harbor_durable_digest "${lref}")" ]; then
            echo "[harbor-prewarm] WARN ${up} -> ${lref}: source manifest unreadable (rate limit/outage) and every copy attempt failed, but the dest is durably present in local Harbor — keeping the durable artifact; source freshness UNVERIFIED this run (#5525)"
            echo "  WARN source unreadable + dest durably present; counted ok, freshness unverified (#5525)" >>"${cpdir}/${slug}.log"
            rc=0
            src_used=""
          fi
        fi
        {{- /* #5095 #7922 — which source succeeded, and why not the proxy (Job log + per-image log). */}}
        if [ "${rc}" -eq 0 ] && [ -n "${src_used}" ] && [ "${src_used}" != "${up}" ]; then
          if [ "${proxy_src}" -eq 1 ]; then
            echo "[harbor-prewarm] ${up} -> ${lref} succeeded via DIRECT upstream ${src_used} (${_direct_why:-mothership proxy path failing}; #5095 #7922)"
            echo "  succeeded via direct upstream ${src_used} (${_direct_why:-mothership proxy path failing})" >>"${cpdir}/${slug}.log"
          else
            echo "[harbor-prewarm] ${up} -> ${lref} succeeded via mothership-proxy fallback ${src_used} (primary source failing/rate-limited; #5525)"
            echo "  succeeded via mothership-proxy fallback ${src_used} (primary source failing/rate-limited)" >>"${cpdir}/${slug}.log"
          fi
        fi
        [ "${rc}" -eq 0 ] || { all_ok=0; last_rc="${rc}"; }
      done
      if [ "${all_ok}" -eq 1 ]; then
        {{- /* Every dest already held it (current or kept): counted present in the summary, not copied. */}}
        if [ "${_cur_n}" -gt 0 ] && [ "${_cur_n}" -eq "$(printf '%s\n' ${dests} | grep -c .)" ]; then printf '%s (already current)' "${up}" >"${cpdir}/${slug}.ok"; else printf '%s' "${up}" >"${cpdir}/${slug}.ok"; fi
        {{- /* #4994 — real-time per-image completion line (the worker runs async; hw240 looked hung for 68m). */}}
        echo "[harbor-prewarm] done ${up} (ok)"
      else
        printf '%s exit=%s' "${up}" "${last_rc}" >"${cpdir}/${slug}.fail"
        echo "[harbor-prewarm] done ${up} (FAIL exit=${last_rc})"
      fi
    }

    {{- /*
     #5095 round 2 — ONE-TIME probe of the mothership proxy's /v2/ (401 for
     anonymous, 200/403 for public projects = alive; a transit hole = 000). An
     unreachable proxy latches .proxy_down: copy_one goes DIRECT-FIRST, no
     per-image timeout tax. Bounded (attempts × timeout, 24s by default), never
     fatal, re-run each Job run.
    */}}
    probe_mothership_proxy() {
      [ "${PROXY_DIRECT_FIRST_ENABLED:-true}" = "true" ] || { echo "[harbor-prewarm] proxy-DOWN direct-first routing DISABLED (PROXY_DIRECT_FIRST_ENABLED=${PROXY_DIRECT_FIRST_ENABLED:-}); strict proxy-first ordering (#5095)"; return 0; }
      [ -n "${MOTHERSHIP_HOST:-}" ] || return 0
      _mp_code=""
      _mp_i=1
      while [ "${_mp_i}" -le "${PROXY_PROBE_ATTEMPTS}" ]; do
        _mp_code=$(mothership_proxy_code)
        case "${_mp_code}" in
          200|401|403)
            rm -f "${cpdir}/.proxy_down" 2>/dev/null || true
            echo "[harbor-prewarm] mothership proxy ${MOTHERSHIP_HOST} reachable (HTTP ${_mp_code}, probe ${_mp_i}/${PROXY_PROBE_ATTEMPTS}) — proxy-first ordering (#5095)"
            return 0 ;;
        esac
        _mp_i=$((_mp_i+1))
      done
      touch "${cpdir}/.proxy_down"
      echo "[harbor-prewarm] mothership proxy ${MOTHERSHIP_HOST} UNREACHABLE after ${PROXY_PROBE_ATTEMPTS} probes (last HTTP ${_mp_code:-none}) — DIRECT-FIRST for proxy-sourced images this step; no per-image proxy timeout tax (#5095). Images still land in LOCAL Harbor via the direct upstream; sovereignty guarantee intact."
    }

    {{- /*
     #4975 PRE-PASS — resolve every enumerated image through the shared
     coverage map BEFORE the parallel fan-out. Excluded images (xpkg /
     rancher-k3s / loft-sh-vcluster) are dropped; an image from a
     registry host NOT in offlineMirror.hostProjects is UNMAPPED →
     FATAL fail-fast (naming the offender). This is the whack-a-mole
     trap closing at step-03: a new chart's un-covered registry host
     fails the cutover HERE (egress still open, clear message) instead
     of surfacing as an opaque ImagePullBackOff mid deny-egress hold.
    */}}
    mirror_work=""
    unmapped=""
    for img in ${openova_images}; do
      [ -z "${img}" ] && continue
      paths=$(offlinemirror_local_paths "${img}")
      case "${paths}" in
        __UNMAPPED__*)
          uh=$(printf '%s' "${paths}" | awk '{print $2}')
          unmapped="${unmapped} ${uh}(${img})"
          ;;
        "")
          : ;;  # excluded — skip
        *)
          mirror_work="${mirror_work} ${img}"
          ;;
      esac
    done
    {{- /*
     #6294 — de-duplicate the worklist by DESTINATION before the fan-out. One
     artifact is often enumerated twice, as the mothership-proxy form
     (harbor.openova.io/proxy-dockerhub/X, the kit's pins) and the direct form
     (docker.io/X, a chart's values), both resolving to one local path; two
     concurrent copy_one workers then raced on it and the second push failed the
     step (hw296, curlimages/curl:8.10.1, ~55 min burned; the #4994 skip runs too
     early to help). ONE item per destination set is kept: the proxy form, which
     copy_one gives both legs (proxy, then the #5095 direct fallback); the
     dropped form is named on stdout.
    */}}
    # ── prewarm-dedupe-by-dest BEGIN (#6294 extraction anchor — tests/step6294-dedupe-by-destination.sh sources this block verbatim with a stubbed resolver) ──
    prewarm_dedupe_by_dest() {
      _dd_claims="${cpdir:-/tmp/prewarm-copies}/.dest-claims"
      mkdir -p "$(dirname "${_dd_claims}")"
      : >"${_dd_claims}"
      _dd_work=""
      _dd_dropped=0
      _dd_proxy_pfx="${MOTHERSHIP_HOST:-__no_mothership__}/"
      # Pass 1 — the mothership-proxy forms claim their destinations first.
      for _dd_img in "$@"; do
        case "${_dd_img}" in
          "${_dd_proxy_pfx}"*)
            for _dd_dp in $(offlinemirror_local_paths "${_dd_img}"); do
              printf '%s\t%s\n' "${_dd_dp}" "${_dd_img}" >>"${_dd_claims}"
            done
            _dd_work="${_dd_work} ${_dd_img}"
            ;;
        esac
      done
      # Pass 2 — every other form keeps its item only if no earlier item claimed its destination(s).
      for _dd_img in "$@"; do
        case "${_dd_img}" in
          "${_dd_proxy_pfx}"*) continue ;;
        esac
        _dd_owner=""
        for _dd_dp in $(offlinemirror_local_paths "${_dd_img}"); do
          _dd_owner=$(awk -F'\t' -v d="${_dd_dp}" '$1==d {print $2; exit}' "${_dd_claims}")
          [ -n "${_dd_owner}" ] && break
        done
        if [ -n "${_dd_owner}" ]; then
          echo "[harbor-prewarm] dedupe ${_dd_img}: same local destination as ${_dd_owner}; copying once (#6294)" >&2
          _dd_dropped=$((_dd_dropped+1))
          continue
        fi
        for _dd_dp in $(offlinemirror_local_paths "${_dd_img}"); do
          printf '%s\t%s\n' "${_dd_dp}" "${_dd_img}" >>"${_dd_claims}"
        done
        _dd_work="${_dd_work} ${_dd_img}"
      done
      if [ "${_dd_dropped}" -gt 0 ]; then
        echo "[harbor-prewarm] ${_dd_dropped} duplicate work item(s) collapsed by destination (#6294)" >&2
      fi
      printf '%s' "${_dd_work}"
    }
    # ── prewarm-dedupe-by-dest END (#6294 extraction anchor) ──
    {{- /*
     The deduped list goes to stdout (captured), the dedupe NOTICES go to
     stderr (surfaced on the Job log right after), so a notice can never
     be mistaken for a work item.
    */}}
    prewarm_dedupe_by_dest ${mirror_work} >"${cpdir}/.dedup-work" 2>"${cpdir}/.dedup-notices" || true
    cat "${cpdir}/.dedup-notices"
    mirror_work=$(cat "${cpdir}/.dedup-work")
    if [ -n "${unmapped}" ]; then
      echo "[harbor-prewarm] FATAL: image(s) from registry host(s) NOT in the offline-mirror coverage map (offlineMirror.hostProjects). Add the host→project (or exclude it) and re-run:"
      for u in ${unmapped}; do echo "  UNMAPPED ${u}"; done
      exit 1
    fi
    count=$(printf '%s\n' ${mirror_work} | grep -c . || true)
    echo "[harbor-prewarm] ${count} mapped image(s) to mirror after resolver filter (parallelism=${PREWARM_PARALLELISM})"

    {{- /*
     #5095 round 2 — probe the mothership proxy ONCE before the fan-out,
     but only when this wave actually has mothership-proxy-sourced refs
     (all-ghcr provs never dial the proxy, so skip the probe entirely).
    */}}
    if [ -n "${MOTHERSHIP_HOST:-}" ] && printf '%s\n' ${mirror_work} | grep -q "^${MOTHERSHIP_HOST}/"; then
      probe_mothership_proxy
    fi

    {{- /*
     #4994 — real-time progress heartbeat. A bounded, self-stopping
     background loop prints "N/M settled" every 30s while the fan-out
     drains, so the step is NEVER a silent black box (hw240: "Running 0/1
     for 68m, only queue lines"). Combined with copy_one's per-image
     `done`/`skip` lines the operator always sees forward progress — and
     a genuine hang is now visibly bounded (settled count stops advancing)
     rather than indistinguishable from slow-but-working.
    */}}
    progress_heartbeat() {
      _hb_tot="$1"; _hb_dir="$2"; _hb_label="$3"
      while [ ! -f "${_hb_dir}/.hb_stop" ]; do
        _hb_n=$( { ls "${_hb_dir}"/*.ok "${_hb_dir}"/*.fail 2>/dev/null || true; } | grep -c . || true)
        echo "[harbor-prewarm] ${_hb_label} progress: ${_hb_n}/${_hb_tot} settled (still copying)"
        _hb_i=0
        while [ "${_hb_i}" -lt 30 ] && [ ! -f "${_hb_dir}/.hb_stop" ]; do sleep 1; _hb_i=$((_hb_i+1)); done
      done
    }
    rm -f "${cpdir}/.hb_stop"
    progress_heartbeat "${count}" "${cpdir}" "Phase A" &
    hb_pid=$!
    {{- /*
     Track live worker PIDs explicitly — POSIX sh's `jobs -p` is
     unreliable in a non-interactive shell, so we count by polling
     `kill -0 <pid>` against the PIDs we launched. `allpids` accumulates
     EVERY worker so the final drain waits on the workers only (a bare
     `wait` would also block on the never-returning heartbeat #4994).
    */}}
    pids=""
    allpids=""
    for upstream in ${mirror_work}; do
      echo "[harbor-prewarm] queue ${upstream}"
      copy_one "${upstream}" &
      _newpid=$!
      pids="${pids} ${_newpid}"
      allpids="${allpids} ${_newpid}"
      {{- /*
       Throttle: block launching the next copy while
       PREWARM_PARALLELISM workers are still alive.
      */}}
      while : ; do
        live=0
        newpids=""
        for p in ${pids}; do
          if kill -0 "${p}" 2>/dev/null; then
            live=$((live+1))
            newpids="${newpids} ${p}"
          fi
        done
        pids="${newpids}"
        [ "${live}" -lt "${PREWARM_PARALLELISM}" ] && break
        sleep 2
      done
    done
    {{- /*
     Drain the workers explicitly (NOT a bare `wait` — that would also
     block on the heartbeat, which only stops on the sentinel below).
    */}}
    for _p in ${allpids}; do wait "${_p}" 2>/dev/null || true; done
    touch "${cpdir}/.hb_stop"
    wait "${hb_pid}" 2>/dev/null || true

    {{- /* Tally + surface each copy's captured log. */}}
    push_ok=0
    push_fail=0; n_present=0; n_excluded=0
    for f in "${cpdir}"/*.ok; do
      [ -e "${f}" ] || continue
      up=$(cat "${f}")
      slug=$(basename "${f}" .ok)
      sed 's/^/  /' "${cpdir}/${slug}.log" 2>/dev/null || true
      push_ok=$((push_ok+1))
      case "${up}" in *' (in the local registry)'|*' (already current)') n_present=$((n_present+1)) ;; *' (excluded)') n_excluded=$((n_excluded+1)) ;; esac
      echo "[harbor-prewarm] OK ${up}"
    done
    for f in "${cpdir}"/*.fail; do
      [ -e "${f}" ] || continue
      detail=$(cat "${f}")
      slug=$(basename "${f}" .fail)
      sed 's/^/  /' "${cpdir}/${slug}.log" 2>/dev/null || true
      push_fail=$((push_fail+1))
      echo "[harbor-prewarm] FAIL ${detail}"
    done
    echo "[harbor-prewarm] Phase A complete: push_ok=${push_ok} push_fail=${push_fail} (copied=$((push_ok-n_present-n_excluded)) already-present=${n_present} excluded=${n_excluded} failed=${push_fail})"
    if [ "${push_fail}" -gt 0 ]; then
      echo "[harbor-prewarm] FATAL: ${push_fail} openova-io image(s) failed to push — Sovereign cannot survive ghcr.io deny-egress post-cutover"
      exit 1
    fi

    {{- /*
     ─── Phase A2: skopeo native push of openova-io HELM CHARTS ────────

     #3627 (Refs #3379, root-caused live on hw146): Phase A above
     mirrors the openova-io CONTAINER images, but NO cutover step ever
     mirrors the helm CHART OCI artifacts. Step-06 Phase-1 repoints
     every Flux HelmRepository from oci://ghcr.io/openova-io/<chart>
     to oci://registry.<sov-fqdn>/openova-io/<chart>, and step-06
     Phase-3 then strips the ghcr.io fallback from ghcr-pull. If the
     chart artifacts are NOT in local Harbor at that point, the first
     post-strip (re)pull 404s and the HelmRelease wedges. The
     HelmReleases survive on hw146 ONLY because they were installed
     from ghcr.io at bootstrap and the strip has not yet run; local
     Harbor's openova-io project held 29 container repos and ZERO
     chart repos. A true sovereignty cutover MUST carry every
     openova-io chart in local Harbor BEFORE egress is cut.

     The chart NAME + VERSION are NOT on the HelmRepository (its
     spec.url is only the project pointer oci://ghcr.io/openova-io);
     they live on each consuming HelmRelease's
    */}}
    # spec.chart.spec.{chart,version,sourceRef.{kind,name}}. We
    {{- /*
     enumerate those tuples, select the ones whose sourceRef.kind is
     HelmRepository and whose sourceRef.name is in the cutover pivot
     set (.Values.helmRepositories.names, mounted at /chart-mirror),
     dedupe by chart:version, then skopeo-copy each chart OCI artifact
     ghcr.io/openova-io/<chart>:<version> → ${HARBOR_HOST}/openova-io/
     <chart>:<version>. Helm OCI charts are plain OCI artifacts, so
     `skopeo copy` handles them regardless of media type. Same retry
     discipline as Phase A (--insecure-policy + --retry-times 3 +
     captured real exit status + parallel fan-out via sentinels).

     `openova-catalog` is in the pivot set but is a project POINTER
     for per-Application HelmReleases (rendered by bp-catalyst-platform
     from .Values.catalog.helmRepository.url), not a single bootstrap
     chart artifact — it has no HelmRelease of its own to read a
     chart:version off, so the sourceRef-driven enumeration below
     naturally excludes it (no bootstrap HR sources from it). Any
     per-Application charts an operator later installs are mirrored by
     the ongoing gitea-mirror-resync + Harbor's own pull-through, not
     by this one-shot cutover prewarm.
    */}}
    echo "[harbor-prewarm] Phase A2: mirror openova-io helm charts into local Harbor"

    {{- /*
     Build the pivot-set lookup. #4573 F4 (Refs #3379): the prior
     implementation seeded the pivot set ONLY from the static
     .Values.helmRepositories.names list (mounted at
     /chart-mirror/chart-mirror-names.txt). That list is hand-
     maintained and DRIFTED — it omitted ~22 openova-io
     HelmRepositories the bootstrap-kit slots actually reference
     (bp-cnpg-pair, bp-network-policies, bp-postgres, bp-newapi,
     bp-oidc-gate, bp-sso-bridge, bp-sandbox, bp-vllm, bp-plane-
     isolation, bp-continuum, bp-guacamole, bp-k8s-ws-proxy,
     bp-powerdns-admin, bp-opentelemetry-operator, bp-openova-flow-
     {server,emitter}, the hcloud/evs CSI charts, …). Phase A2 then
     SKIPPED those charts → they never landed in local Harbor → a
     post-strip HR source kick 404s `does not have an artifact`
     (live c39f0cd4455b7a46). The COMPLETENESS of the mirror set
     must NOT depend on a static list staying in sync with the
     slot tree.

     Fix: derive the pivot set DYNAMICALLY from the LIVE cluster —
     every Flux HelmRepository whose spec.url is the upstream
     openova-io OCI prefix (oci://ghcr.io/openova-io) is in the set,
     regardless of whether it is named in the static list. UNION
     that live set with the static names file (belt-and-suspenders:
     a HR named in the list but momentarily absent from the live
     API read is still covered). The union can only WIDEN the set —
     every chart is still skopeo-copied idempotently — never narrow
     it, a strict superset of the prior behaviour. This is the same
     "union live ∪ declared, never depend on a static snapshot"
     discipline the container-image enumeration (Phase A) already
     uses above.
    */}}
    pivot_set_file=/tmp/.chart-pivot-set.txt
    : > "${pivot_set_file}"
    {{- /* (a) static names from the mounted list (legacy contract). */}}
    while IFS= read -r pl; do
      pn=$(printf '%s' "${pl}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
      [ -z "${pn}" ] && continue
      printf '%s\n' "${pn}" >> "${pivot_set_file}"
    done < /chart-mirror/chart-mirror-names.txt
    {{- /*
     (b) live HelmRepositories whose url is the openova-io upstream
     OCI prefix — the complete, drift-proof set. UPSTREAM_PREFIX is
     `oci://ghcr.io/openova-io`; a HR url may be exactly that prefix
     or a `<prefix>/<name>`-suffixed form, so match on the prefix.
    */}}
    up_prefix_match=$(printf '%s' "${UPSTREAM_PREFIX}" | sed -e 's,/$,,')
    live_openova_hrs=$(kubectl get helmrepositories.source.toolkit.fluxcd.io -A -o json 2>/dev/null | \
      jq -r --arg p "${up_prefix_match}" \
        '.items[] | select((.spec.url // "") | startswith($p)) | .metadata.name' 2>/dev/null | \
      sort -u || true)
    printf '%s\n' "${live_openova_hrs}" >> "${pivot_set_file}"
    {{- /* Dedupe + drop blanks so the lookup is clean. */}}
    sort -u "${pivot_set_file}" -o "${pivot_set_file}"
    sed -i '/^[[:space:]]*$/d' "${pivot_set_file}" 2>/dev/null || true
    static_n=$(grep -c . /chart-mirror/chart-mirror-names.txt 2>/dev/null || echo 0)
    live_n=$(printf '%s\n' "${live_openova_hrs}" | grep -c . || true)
    union_n=$(grep -c . "${pivot_set_file}" || true)
    echo "[harbor-prewarm] Phase A2 pivot set: static-names=${static_n} ∪ live-openova-io-HelmRepositories=${live_n} → ${union_n} unique sourceRef name(s) (#4573 F4: drift-proof)"

    in_pivot_set() {
      {{- /* $1 = HelmRepository name; 0 if present in the pivot set. */}}
      grep -Fxq "$1" "${pivot_set_file}"
    }

    {{- /*
     Enumerate (chart, version, sourceRef.kind, sourceRef.name) from
     every HelmRelease cluster-wide. Tab-separated; a HR with no
     explicit chart.spec is skipped (empty fields).

     #5007 round 3 (Refs #4870 #4982) — mirror the UNION of the DEPLOYED
     and the DESIRED chart versions per HR. Two OPPOSITE drifts wedge
     step-06 (helmrepository-patches Phase-3a), which reads the SAME
     `.status.history[0].chartVersion // .spec.chart.spec.version`
     resolution (06-…-job.yaml L1199-1207) — but at a LATER instant:
       • #4870: mirroring ONLY the desired (`.spec.chart.spec.version`)
         breaks when a deploybot catalog bump transiently oscillates the
         desired ahead of the settled deployed → prewarm mirrors 1.4.1039,
         step-06 checks the settled deployed 1.4.1038 → wedge.
       • #5007 round 3 (hw252): mirroring ONLY the deployed
         (`.status.history[0].chartVersion`) breaks when a PR merges +
         re-publishes a chart DURING the cutover — the live HR briefly
         DEPLOYS the just-published 1.4.1121 (so history[0]=1.4.1121),
         while the flux/bootstrap-kit PIN the Sovereign settles back to
         post-step-05 is 1.4.1120 (`.spec.chart.spec.version`). prewarm
         warmed 1.4.1121, step-06 waited FOREVER for the pinned 1.4.1120.
     Mirroring the UNION warms BOTH the pinned/desired AND the deployed
     tag, so step-06 finds its version locally regardless of which the HR
     settles on between the two steps. The union is a strict SUPERSET (an
     extra skopeo copy is idempotent + #4994 skip-if-present makes it
     cheap), never narrows the set, and the Phase A2 chart_fail>0 FATAL
     below is the FAIL-LOUD guard: a PINNED version whose OCI artifact
     cannot be pulled fails the cutover HERE (egress still open, named)
     instead of silently wedging step-06 under the deny-egress hold.
    */}}
    chart_tuples=$(kubectl get helmreleases -A -o json | \
      jq -r '.items[]
        | .spec.chart.spec as $cs
        | select($cs.chart != null and $cs.sourceRef != null)
        | ( [ (.status.history[0].chartVersion), $cs.version ]
            | map(select(. != null and . != "")) | unique ) as $vers
        | ( if ($vers | length) == 0 then [""] else $vers end )[]
        | . as $v
        | [ $cs.chart, $v, ($cs.sourceRef.kind // ""), ($cs.sourceRef.name // "") ]
        | @tsv' 2>/dev/null | sort -u || true)

    {{- /*
     #5007 round 3 — informational DRIFT report: name every pivot-set HR
     whose DEPLOYED (history[0]) and DESIRED (spec) chart versions differ.
     Both are warmed by the union above, so this NEVER wedges — it makes a
     mid-cutover publish visible in the step-03 log instead of surfacing as
     an opaque step-06 "chart not yet pullable" hang.
    */}}
    chart_drift=$(kubectl get helmreleases -A -o json 2>/dev/null | \
      jq -r '.items[]
        | .spec.chart.spec as $cs
        | select($cs.chart != null and $cs.sourceRef != null)
        | select((.status.history[0].chartVersion) != null and $cs.version != null
                 and (.status.history[0].chartVersion) != $cs.version)
        | "\($cs.chart): deployed=\(.status.history[0].chartVersion) desired=\($cs.version)"' 2>/dev/null | sort -u || true)
    if [ -n "${chart_drift}" ]; then
      echo "[harbor-prewarm] Phase A2 DRIFT (#5007): HelmRelease(s) with deployed != desired chart version — warming BOTH so step-06 finds its pinned version regardless:"
      printf '%s\n' "${chart_drift}" | sed 's/^/  drift: /'
    fi

    {{- /*
     Resolve the UPSTREAM chart-OCI host/project prefix from the same
     value step-06 pivots FROM (oci://ghcr.io/openova-io → host
     ghcr.io, project path openova-io). Strip the oci:// scheme.
    */}}
    up_chart_prefix=$(printf '%s' "${UPSTREAM_PREFIX}" | sed -e 's,^oci://,,' -e 's,/$,,')

    {{- /* Dedupe the work list to chart:version pairs we actually mirror. */}}
    chart_work=/tmp/.chart-work.txt
    : > "${chart_work}"
    printf '%s\n' "${chart_tuples}" | while IFS="$(printf '\t')" read -r c_chart c_ver c_kind c_name; do
      [ -z "${c_chart}" ] && continue
      [ "${c_kind}" = "HelmRepository" ] || continue
      in_pivot_set "${c_name}" || continue
      if [ -z "${c_ver}" ]; then
        echo "[harbor-prewarm] Phase A2 WARN: HelmRelease chart ${c_chart} (source ${c_name}) has no pinned version — skipping (cannot mirror a floating tag deterministically)"
        continue
      fi
      {{- /*
       #5007 round 3 — the union may surface a DESIRED spec.version that is
       a semver RANGE (a `<`, `>`, `~`, `^`, `|`, `*` or space) rather than a
       concrete OCI tag; a range can't be skopeo-copied deterministically, so
       skip it with a clear WARN instead of FATALing on an invalid tag. The
       concrete deployed/desired tag(s) for the same chart still mirror.
      */}}
      case "${c_ver}" in
        *[\<\>~^\|\ ]*|*'*'*)
          echo "[harbor-prewarm] Phase A2 WARN: HelmRelease chart ${c_chart} (source ${c_name}) version '${c_ver}' is a semver range, not a concrete tag — skipping (cannot mirror deterministically)"
          continue ;;
      esac
      printf '%s\t%s\n' "${c_chart}" "${c_ver}" >> "${chart_work}"
    done

    {{- /*
     ── Phase A2-pins (#5237 round 2, Refs #5007): union the FROZEN bootstrap-kit
     pins of the LOCAL GITEA MIRROR into the chart set. The live union tracks the
     CLUSTER, which a mid-cutover merge can roll AWAY from the pins Flux settles on
     after step 05 (hw274, dep d51a69f885872a81: the frozen pin was never warmed and
     404ed under the hold). The slot files of the mirror are the post-cutover pin
     truth; the shared extractor 03b (step 06 and the #5265 Day-2 reconciler use
     it too) reads them. A strict superset; the Phase A2 chart_fail>0 FATAL below
     still guards a pin that cannot be pulled. FAIL-LOUD: an unreadable PAT,
     unreachable mirror or zero-pin parse exits 1 HERE, never a narrower mirror.

     #7938 — the images the kit's own manifests and its Flux Kustomizations run.
     Slot 12b's `images:` retags the Job under its path, and nothing else names
     that ref: the live walk has no Job before promote, Phase A3 renders
     HelmReleases only. hw307, 16 Nov 2026: that Job sat in ImagePullBackOff in
     both regions after cutover. Read from the same tree as the pins, they join
     the run guard and the follower legs. Applied: a folder's kustomization.yaml
     resources (files, folders) or, without one, every YAML below it (Flux's
     generator), then spec.images as kustomize applies them. Named, never applied:
     other kustomize fields, spec.patches/components, remote resources. A ref
     with ${VAR} (postBuild) or no tag is skipped by name.
    */}}
    # ── prewarm-kit-images BEGIN (#7938 extraction anchor — tests/step7938-prewarm-kit-images.sh runs this block verbatim) ──
    prewarm_kit_get() { mkdir -p "$(dirname "$2")" && curl -fsS --retry 3 --retry-delay 5 -H "Authorization: token ${bk_pat}" -o "$2" "${bk_api}/raw/$1?ref=${UPSTREAM_BRANCH}" 2>/dev/null; }
    prewarm_kit_ls() { curl -fsS --retry 3 --retry-delay 5 -H "Authorization: token ${bk_pat}" "${bk_api}/contents/$1?ref=${UPSTREAM_BRANCH}" 2>/dev/null | jq -er 'if type == "array" then .[] | .type + " " + .name else error("not a folder") end'; }
    # prewarm_kit_refs <manifest>...: "<image>\t<file>" for every container of a Pod-bearing document.
    prewarm_kit_refs() {
      awk -v q="'" 'FNR == 1 || /^---/ {k = ""} /^kind:/ {k = $2} /^[[:space:]]*#/ {next}
        k ~ /^(Pod|Deployment|StatefulSet|DaemonSet|ReplicaSet|Job|CronJob)$/ && match($0, /(^|[[:space:],{])image:[[:space:]]*[^[:space:],]+/) {
          v = substr($0, RSTART, RLENGTH); sub(/^.*image:[[:space:]]*/, "", v); gsub(/"/, "", v); gsub(q, "", v); if (v !~ /[$][{]/) sub(/[}]+$/, "", v); print v "\t" FILENAME}' "$@"
    }
    # prewarm_kit_retag <name|newName|newTag|digest;...>: a Flux Kustomization's images: on the first field of stdin, in
    # order, as kustomize applies them: an entry matches the name without tag or digest; newName replaces the name;
    # newTag and digest, either one given, replace both.
    prewarm_kit_retag() {
      awk -F '\t' -v OFS='\t' -v spec="$1" 'BEGIN {n = split(spec, e, ";")} {r = $1; for (i = 1; i <= n; i++) {split(e[i], f, "|")
        s = index(r, "/"); o = (s > 1) ? s - 1 : 0; t = substr(r, o + 1); a = index(t, "@"); c = index(t, ":"); if (a && c > a) c = 0
        nm = substr(r, 1, o + (c ? c : (a ? a : length(t) + 1)) - 1); tg = c ? substr(r, o + c + 1, (a ? a - c - 1 : length(t))) : ""; dg = a ? substr(r, o + a + 1) : ""
        if (nm != f[1]) continue; if (f[2] != "") nm = f[2]; if (f[3] != "" || f[4] != "") {tg = f[3]; dg = f[4]}
        r = nm; if (tg != "") r = r ":" tg; if (dg != "") r = r "@" dg} $1 = r; print}'
    }
    # prewarm_kit_images <kit dir> <work dir>: one ref per line; reasons on stderr; 1 when the tree cannot be read.
    prewarm_kit_images() {
      _ki_w="$2"; rm -rf "${_ki_w}"; mkdir -p "${_ki_w}/t"; (cd "$1" && prewarm_kit_refs [0-9]*.yaml) >"${_ki_w}/refs"
      awk -v q="'" 'function val(v) {v = $0; sub(/^[^:]*:[[:space:]]*/, "", v); sub(/[[:space:]]+#.*$/, "", v); gsub(/"/, "", v); gsub(q, "", v); return v}
        function out(i, s) {if (fk) {s = ""; for (i = 1; i <= e; i++) s = s ";" en[i] "|" nn[i] "|" nt[i] "|" dg[i]; print n "\t" p "\t" substr(s, 2)} fk = e = ii = 0; n = p = sec = ""}
        FNR == 1 || /^---/ {out(); api = ""} /^[[:space:]]*(#|$)/ {next} /^apiVersion:/ {api = val()}
        /^kind:/ {fk = (val() == "Kustomization" && api ~ /^kustomize\.toolkit\.fluxcd\.io\//)} !fk {next}
        /^[^ ]/ {sec = $1; next} sec == "metadata:" && /^  name:/ {n = val()} sec != "spec:" {next}
        /^  [^ -]/ {ii = ($0 ~ /^  images:/)} /^  (patches|components):/ {x = $1; sub(/:$/, "", x); print "n " n ": its spec." x}
        /^  path:/ {p = val()} ii && /^ *- / {e++; en[e] = nn[e] = nt[e] = dg[e] = ""; sub(/- /, "  ")}
        ii && /^ +name:/ {en[e] = val()} ii && /^ +newName:/ {nn[e] = val()} ii && /^ +newTag:/ {nt[e] = val()} ii && /^ +digest:/ {dg[e] = val()}
        END {out()}' "$1"/[0-9]*.yaml >"${_ki_w}/ks.tsv"
      while IFS="$(printf '\t')" read -r _ki_n _ki_p _ki_e; do
        case "${_ki_n}" in "n "*) echo "[harbor-prewarm] kit-images: Flux Kustomization ${_ki_n#n } is not applied (only its path's resources and spec.images are)" >&2; continue ;; esac
        case "${_ki_p}" in ''|*'$'*) echo "[harbor-prewarm] kit-images: SKIP Flux Kustomization ${_ki_n}: its path '${_ki_p}' is empty or substituted" >&2; continue ;; esac
        _ki_p="${_ki_p#./}"; printf 'd %s\n' "${_ki_p%/}" >"${_ki_w}/q"; : >"${_ki_w}/files"; _ki_i=0
        while _ki_i=$((_ki_i + 1)); _ki_l=$(sed -n "${_ki_i}p" "${_ki_w}/q"); [ -n "${_ki_l}" ]; do
          _ki_x="${_ki_l#? }"
          case "${_ki_l}" in
            n*) echo "[harbor-prewarm] kit-images: ${_ki_n}: ${_ki_x} is not applied (only resources and spec.images are)" >&2 ;;
            f*) prewarm_kit_get "${_ki_x}" "${_ki_w}/t/${_ki_x}" || { echo "[harbor-prewarm] kit-images: ${_ki_n}: could not read ${_ki_x}" >&2; return 1; }
              printf '%s\n' "${_ki_x}" >>"${_ki_w}/files" ;;
            *) prewarm_kit_ls "${_ki_x}" >"${_ki_w}/ls" || { echo "[harbor-prewarm] kit-images: ${_ki_n}: could not list ${_ki_x}" >&2; return 1; }
              _ki_k=$(awk '$1 == "file" && $2 ~ /^(kustomization\.ya?ml|Kustomization)$/ {print $2; exit}' "${_ki_w}/ls")
              if [ -z "${_ki_k}" ]; then awk -v d="${_ki_x}" '$1 == "dir" {print "d " d "/" $2} $1 == "file" && $2 ~ /\.ya?ml$/ {print "f " d "/" $2}' "${_ki_w}/ls" >"${_ki_w}/new"
              elif prewarm_kit_get "${_ki_x}/${_ki_k}" "${_ki_w}/k.yaml"; then
                awk -v d="${_ki_x}" -v q="'" '/^[^ #-]/ {r = ($0 ~ /^(resources|bases):/); if ($0 ~ /^(images|patches|patchesStrategicMerge|patchesJson6902|replacements|components|transformers|generators|helmCharts):/) print "n the " substr($1, 1, length($1) - 1) " of " d}
                  r && /^ *- / {v = $0; sub(/^ *- */, "", v); sub(/[[:space:]]+#.*$/, "", v); gsub(/"/, "", v); gsub(q, "", v); if (v ~ /:\/\/|^git(hub\.com\/|@)|[?]ref=/) {print "n the remote resource " v; next}
                    m = split(d "/" v, s, "/"); k = 0; for (i = 1; i <= m; i++) if (s[i] == "..") k -= (k > 0); else if (s[i] != "" && s[i] != ".") o[++k] = s[i]
                    p = o[1]; for (i = 2; i <= k; i++) p = p "/" o[i]; t = (v ~ /\.(ya?ml|json)$/) ? "f " : "d "; print t p}' "${_ki_w}/k.yaml" >"${_ki_w}/new"
              else echo "[harbor-prewarm] kit-images: ${_ki_n}: could not read ${_ki_x}/${_ki_k}" >&2; return 1; fi
              grep -vxF -f "${_ki_w}/q" "${_ki_w}/new" >>"${_ki_w}/q" || true ;;
          esac
        done
        if [ -s "${_ki_w}/files" ]; then (cd "${_ki_w}/t" && prewarm_kit_refs $(cat ../files)) | prewarm_kit_retag "${_ki_e}" | awk -F '\t' -v OFS='\t' -v n="${_ki_n}" '{$2 = "Flux Kustomization " n ", " $2; print}' >>"${_ki_w}/refs"; fi
      done <"${_ki_w}/ks.tsv"
      sort -u "${_ki_w}/refs" | while IFS="$(printf '\t')" read -r _ki_r _ki_s; do
        case "${_ki_r}" in *'$'*) echo "[harbor-prewarm] kit-images: SKIP ${_ki_r} (${_ki_s}): a postBuild substitution is never guessed" >&2; continue ;; esac
        case "${_ki_r##*/}" in *[:@]*) echo "[harbor-prewarm] kit-images: ${_ki_r} (${_ki_s})" >&2; printf '%s\n' "${_ki_r}" ;; *) echo "[harbor-prewarm] kit-images: SKIP ${_ki_r} (${_ki_s}): untagged, and an implicit :latest is no mirror target" >&2 ;; esac
      done
    }
    # ── prewarm-kit-images END ──
    : "${PREWARM_BOOTSTRAP_KIT_PINS:=true}"
    if [ "${PREWARM_BOOTSTRAP_KIT_PINS}" = "true" ]; then
      echo "[harbor-prewarm] Phase A2-pins (#5237): enumerating bootstrap-kit chart pins from the local Gitea mirror (the frozen commit flux consumes post-step-05)"
      prewarm_kit_fetch /tmp/bootstrap-kit-pins || exit 1
      {{- /*
       Shared extractor (03b): one parser for step-03 + step-06 +
       the #5265 Day-2 reconciler. Accepts BOTH the upstream and the
       already-pivoted local prefix so a post-step-06 re-run (mirror
       already rewritten to local Harbor) still enumerates.
      */}}
      . /pin-extractor/extract-pins.sh
      bk_pins=/tmp/.bootstrap-kit-pins.tsv
      bootstrapkit_pins "${bk_dir}" "${UPSTREAM_PREFIX}" "oci://${HARBOR_HOST}/openova-io" > "${bk_pins}"
      bk_count=$(grep -c . "${bk_pins}" || true)
      if [ "${bk_count}" -eq 0 ]; then
        echo "[harbor-prewarm] FATAL: zero pinned openova-io charts parsed from ${bk_path} ($(printf '%s\n' ${bk_list} | grep -c .) slot files fetched) — the bootstrap-kit ALWAYS pins its charts, so an empty parse means the mirror or the slot format drifted; refusing to build a mirror that cannot be proven to cover the frozen flux pin set (#5237). Emergency override: prewarm.bootstrapKitPins.enabled=false."
        exit 1
      fi
      {{- /*
       Drift visibility: pins NOT already in the live union are
       exactly the entries a mid-cutover roll would have lost.
      */}}
      sort -u "${chart_work}" -o "${chart_work}"
      bk_pin_only=0
      while IFS="$(printf '\t')" read -r bk_c bk_v; do
        [ -z "${bk_c}" ] && continue
        if ! grep -Fxq "$(printf '%s\t%s' "${bk_c}" "${bk_v}")" "${chart_work}"; then
          echo "[harbor-prewarm] Phase A2-pins PIN-ONLY (#5237): ${bk_c}:${bk_v} pinned by the frozen bootstrap-kit but absent from the live deployed∪desired union — the live cluster drifted; warming the pin so post-pivot flux converges"
          bk_pin_only=$((bk_pin_only+1))
        fi
        printf '%s\t%s\n' "${bk_c}" "${bk_v}" >> "${chart_work}"
      done < "${bk_pins}"
      echo "[harbor-prewarm] Phase A2-pins: ${bk_count} frozen bootstrap-kit pin(s) unioned into the mirror set (${bk_pin_only} pin-only, i.e. not covered by the live union)"
      kit_img=/tmp/.kit-images.txt
      prewarm_kit_images "${bk_dir}" /tmp/kit-images >"${kit_img}" || { echo "[harbor-prewarm] FATAL (#7938): could not read the tree a kit Flux Kustomization applies (named above) from the local Gitea mirror (${GITEA_ORG}/${GITEA_REPO}@${UPSTREAM_BRANCH}), so the images it runs cannot be named. Emergency override: prewarm.bootstrapKitPins.enabled=false."; exit 1; }
      echo "[harbor-prewarm] Phase A2-pins: $(grep -c . "${kit_img}" || true) image(s) that the kit's manifests and Flux Kustomizations run join the run guard and the follower legs (#7938)"
    else
      echo "[harbor-prewarm] Phase A2-pins DISABLED (prewarm.bootstrapKitPins.enabled=false) — mirroring the live deployed∪desired union only; the frozen flux pin set is NOT guaranteed locally (#5237)"
    fi

    {{- /*
     ── Phase A2-catalog (#5443, Refs #3627 #5237 #5442): union the
     MARKETPLACE's chart set into the mirror. The sets above are what is
     INSTALLED; the catalog is strictly larger, yet step 06 pivots
     `openova-catalog` (every per-Org Application resolves through it) onto
     local Harbor, whose `openova-io` project is HOSTED: no proxy fallback, a
     404 is final (hw290 2026-07-27: 15 of 29 listed entries 404ed).
     SOURCE OF TRUTH = the LIVE Blueprint CRs, not the catalog-seed: the CRs are
     what `/api/v1/catalog` serves and the console editor mutates.
     HARD vs SOFT. `spec.manifests.chart`:`spec.version` is the coordinate the
     install path requests, so for a `visibility: listed` entry a failed copy is
     FATAL and the Phase A2-guard re-asserts it against Harbor's artifact API.
     Every other row is SOFT (best-effort, WARN): `spec.source.version` is read
     by no controller (#5444) and unlisted entries are not installable; a chart
     artifact is small, and mirroring them covers the depends[] closure.
    */}}
    : "${PREWARM_CATALOG_CHARTS:=true}"
    : "${PREWARM_CATALOG_HARD_VISIBILITY:=listed}"
    sort -u "${chart_work}" -o "${chart_work}"
    {{- /* Everything enumerated SO FAR keeps the pre-#5443 FATAL semantics. */}}
    chart_hard=/tmp/.chart-hard.tsv
    cp "${chart_work}" "${chart_hard}"
    {{- /* #7900 — the same set, kept apart: the charts something has INSTALLED (see the A3-guard). */}}
    chart_installed=/tmp/.chart-installed.tsv
    cp "${chart_work}" "${chart_installed}"
    catalog_set=/tmp/.catalog-set.tsv
    : > "${catalog_set}"
    catalog_hard=/tmp/.catalog-hard.tsv
    : > "${catalog_hard}"
    if [ "${PREWARM_CATALOG_CHARTS}" = "true" ]; then
      echo "[harbor-prewarm] Phase A2-catalog (#5443): enumerating the live Blueprint CR set — what the marketplace OFFERS, on top of what is installed"
      {{- /*
       Blueprint is a CLUSTER-scoped CRD (no -A). The v1 storage
       version is read first with the still-served v1alpha1 as the
       fallback (products/catalyst/chart/crds/blueprint.yaml serves
       both). FAIL-LOUD only when NEITHER read succeeds: an
       unreadable API / missing CRD / missing RBAC means the mirror
       CANNOT be proven to cover the marketplace, which is precisely
       the state #5443 shipped. A read that succeeds and returns zero
       items is a different thing — a Sovereign with an empty catalog
       advertises nothing, so there is nothing to over-advertise; that
       WARNs and continues rather than holding the cutover hostage.
      */}}
      catalog_json=/tmp/.blueprints.json
      : > "${catalog_json}"
      catalog_read=0
      if kubectl get "${CATALOG_BLUEPRINT_RESOURCE}" -o json > "${catalog_json}" 2>/dev/null; then
        catalog_read=1
      else
        echo "[harbor-prewarm] Phase A2-catalog: ${CATALOG_BLUEPRINT_RESOURCE} not served — retrying the v1alpha1 fallback ${CATALOG_BLUEPRINT_RESOURCE_FALLBACK}"
        if kubectl get "${CATALOG_BLUEPRINT_RESOURCE_FALLBACK}" -o json > "${catalog_json}" 2>/dev/null; then
          catalog_read=1
        else
          : > "${catalog_json}"
        fi
      fi
      if [ "${catalog_read}" -eq 0 ]; then
        echo "[harbor-prewarm] FATAL: cannot read the Blueprint CRs (${CATALOG_BLUEPRINT_RESOURCE} nor ${CATALOG_BLUEPRINT_RESOURCE_FALLBACK}) — the CRD is absent, RBAC is missing, or the API is degraded. Step-06 will still pivot the marketplace's openova-catalog resolver onto local Harbor, so refusing to build a mirror that cannot be proven to cover what the marketplace offers (#5443). Emergency override: prewarm.catalogCharts.enabled=false."
        exit 1
      fi
      catalog_items=$(jq -r '(.items // []) | length' "${catalog_json}" 2>/dev/null || echo 0)
      if [ "${catalog_items:-0}" -eq 0 ]; then
        echo "[harbor-prewarm] Phase A2-catalog WARN: the Blueprint CR list is EMPTY — this Sovereign's marketplace offers nothing, so there is nothing for the mirror to cover. Expected a catalog-seed baseline set (products/catalyst/chart templates/catalog-seed); an empty catalog on a real Sovereign is itself worth investigating (#5443)."
      fi
      {{- /*
       Shared extractor (03c) — the SAME function the guard's hard set
       and the image enumeration read, so the mirrored set and the
       judged set can never fork.
      */}}
      catalog_chart_set "${catalog_json}" "${UPSTREAM_PREFIX}" "${PREWARM_CATALOG_HARD_VISIBILITY}" > "${catalog_set}" 2>/tmp/.catalog-set.err || true
      sed 's/^/  /' /tmp/.catalog-set.err 2>/dev/null || true
      cat_rows=$(grep -c . "${catalog_set}" || true)
      cat_hard_n=0
      cat_new=0
      while IFS="$(printf '\t')" read -r cat_c cat_v cat_h cat_n cat_vis; do
        [ -z "${cat_c}" ] && continue
        if ! grep -Fxq "$(printf '%s\t%s' "${cat_c}" "${cat_v}")" "${chart_work}"; then
          cat_new=$((cat_new+1))
          echo "[harbor-prewarm] Phase A2-catalog CATALOG-ONLY (#5443): ${cat_c}:${cat_v} (${cat_n}, visibility=${cat_vis}) is offered by the marketplace but installed nowhere — the exact class step-06 would pivot into a 404"
        fi
        printf '%s\t%s\n' "${cat_c}" "${cat_v}" >> "${chart_work}"
        if [ "${cat_h}" = "1" ]; then
          printf '%s\t%s\n' "${cat_c}" "${cat_v}" >> "${chart_hard}"
          printf '%s\t%s\n' "${cat_c}" "${cat_v}" >> "${catalog_hard}"
          cat_hard_n=$((cat_hard_n+1))
        fi
      done < "${catalog_set}"
      sort -u "${chart_hard}" -o "${chart_hard}"
      sort -u "${catalog_hard}" -o "${catalog_hard}"
      echo "[harbor-prewarm] Phase A2-catalog: ${catalog_items} Blueprint CR(s) -> ${cat_rows} chart:version row(s) (${cat_hard_n} contractual, visibility=${PREWARM_CATALOG_HARD_VISIBILITY}); ${cat_new} not covered by the installed union"
    else
      echo "[harbor-prewarm] Phase A2-catalog DISABLED (prewarm.catalogCharts.enabled=false) — mirroring the installed union only; the marketplace's offered set is NOT guaranteed locally (#5443)"
    fi

    sort -u "${chart_work}" -o "${chart_work}"
    chart_count=$(grep -c . "${chart_work}" || true)
    echo "[harbor-prewarm] Phase A2: ${chart_count} unique openova-io chart(s) to mirror"

    {{- /* Per-chart copy worker — same sentinel pattern as copy_one. */}}
    chart_cpdir=/tmp/chart-mirror-copies
    rm -rf "${chart_cpdir}"; mkdir -p "${chart_cpdir}"
    copy_chart() {
      cchart="$1"; cver="$2"
      csrc="docker://${up_chart_prefix}/${cchart}:${cver}"
      cdst="docker://${HARBOR_HOST}/openova-io/${cchart}:${cver}"
      cslug=$(printf '%s_%s' "${cchart}" "${cver}" | tr -c 'A-Za-z0-9._-' '_')
      {{- /*
       #3944 bounded (--command-timeout); #4529 dest TLS as Phase A (PREWARM_DEST_TLS_VERIFY), src
       verified. #4581: an OUTER attempt loop, since skopeo's --retry-times retries only SOURCE
       errors and one transient dest 504 on blob-upload once FATAL-ed the step at 61/62 charts.
       #4994 #5030 #7938: dest_already_current as Phase A (the chart OCI is one manifest): skipped
       when current, KEPT when the dest holds the tag at another digest; --preserve-digests.
      */}}
      _dc_rc=0; dest_already_current "${up_chart_prefix}/${cchart}:${cver}" "${HARBOR_HOST}/openova-io/${cchart}:${cver}" "${ghcr_user}:${ghcr_pat}" || _dc_rc=$?
      if [ "${_dc_rc}" -eq 2 ] || { [ "${_dc_rc}" -eq 0 ] && [ "${PREWARM_SKIP_IF_PRESENT:-true}" = "true" ]; }; then
        echo "[harbor-prewarm] skip chart ${cchart}:${cver} (dest already current)"
        printf '%s:%s (present)' "${cchart}" "${cver}" >"${chart_cpdir}/${cslug}.ok"
        return 0
      fi
      cattempt=0
      cmax="${PREWARM_COPY_ATTEMPTS:-4}"
      while : ; do
        cattempt=$((cattempt+1))
        if offlinemirror_copy "${csrc#docker://}" "${ghcr_user}:${ghcr_pat}" "${cdst#docker://}" >"${chart_cpdir}/${cslug}.log" 2>&1; then
          printf '%s:%s' "${cchart}" "${cver}" >"${chart_cpdir}/${cslug}.ok"
          echo "[harbor-prewarm] done chart ${cchart}:${cver} (ok)"
          return 0
        fi
        crc=$?
        if [ "${cattempt}" -ge "${cmax}" ]; then
          printf '%s:%s exit=%s attempts=%s' "${cchart}" "${cver}" "${crc}" "${cattempt}" >"${chart_cpdir}/${cslug}.fail"
          echo "[harbor-prewarm] done chart ${cchart}:${cver} (FAIL exit=${crc})"
          return 0
        fi
        echo "[harbor-prewarm] chart ${cchart}:${cver} copy attempt ${cattempt}/${cmax} failed (rc=${crc}, transient e.g. 504) — retrying in $((cattempt*5))s" >>"${chart_cpdir}/${cslug}.log"
        sleep "$((cattempt*5))"
      done
    }

    {{- /*
     #4994 — Phase A2 gets the same real-time heartbeat + explicit drain
     as Phase A (the chart mirror shares the file-buffered-log silence).
    */}}
    rm -f "${chart_cpdir}/.hb_stop"
    progress_heartbeat "${chart_count}" "${chart_cpdir}" "Phase A2" &
    chart_hb_pid=$!
    chart_pids=""
    chart_allpids=""
    while IFS="$(printf '\t')" read -r w_chart w_ver; do
      [ -z "${w_chart}" ] && continue
      echo "[harbor-prewarm] queue chart ${up_chart_prefix}/${w_chart}:${w_ver} → ${HARBOR_HOST}/openova-io/${w_chart}:${w_ver}"
      copy_chart "${w_chart}" "${w_ver}" &
      _cnp=$!
      chart_pids="${chart_pids} ${_cnp}"
      chart_allpids="${chart_allpids} ${_cnp}"
      {{- /* Throttle to PREWARM_PARALLELISM live workers (POSIX sh, no wait -n). */}}
      while : ; do
        clive=0
        cnewpids=""
        for cp in ${chart_pids}; do
          if kill -0 "${cp}" 2>/dev/null; then
            clive=$((clive+1))
            cnewpids="${cnewpids} ${cp}"
          fi
        done
        chart_pids="${cnewpids}"
        [ "${clive}" -lt "${PREWARM_PARALLELISM}" ] && break
        sleep 2
      done
    done < "${chart_work}"
    {{- /* Drain the chart workers explicitly, then stop + reap the heartbeat. */}}
    for _p in ${chart_allpids}; do wait "${_p}" 2>/dev/null || true; done
    touch "${chart_cpdir}/.hb_stop"
    wait "${chart_hb_pid}" 2>/dev/null || true

    chart_ok=0
    chart_fail=0
    for f in "${chart_cpdir}"/*.ok; do
      [ -e "${f}" ] || continue
      cup=$(cat "${f}")
      cslug=$(basename "${f}" .ok)
      sed 's/^/  /' "${chart_cpdir}/${cslug}.log" 2>/dev/null || true
      chart_ok=$((chart_ok+1))
      echo "[harbor-prewarm] OK chart ${cup}"
    done
    {{- /*
     #5443 — a copy failure is FATAL only for a chart:version in the
     HARD set (everything the installed union already required, plus
     every contractual `visibility: listed` catalog entry). A row that
     exists ONLY because Phase A2-catalog widened the mirror
     best-effort — an unlisted/private Blueprint, or a
     `spec.source.version` no controller reads — WARNs instead: those
     are not installable from the marketplace grid, so a stale pin on
     one must not hold the whole cutover hostage. The customer-visible
     contract keeps its fail-loud teeth; the widening cannot regress the
     cutover's success rate.
    */}}
    chart_soft_fail=0
    for f in "${chart_cpdir}"/*.fail; do
      [ -e "${f}" ] || continue
      cdetail=$(cat "${f}")
      cslug=$(basename "${f}" .fail)
      sed 's/^/  /' "${chart_cpdir}/${cslug}.log" 2>/dev/null || true
      cpair="${cdetail%% *}"
      cfc="${cpair%:*}"
      cfv="${cpair##*:}"
      if grep -Fxq "$(printf '%s\t%s' "${cfc}" "${cfv}")" "${chart_hard}"; then
        chart_fail=$((chart_fail+1))
        echo "[harbor-prewarm] FAIL chart ${cdetail}"
      else
        chart_soft_fail=$((chart_soft_fail+1))
        echo "[harbor-prewarm] WARN chart ${cdetail} — best-effort row (not a contractual visibility=${PREWARM_CATALOG_HARD_VISIBILITY} catalog entry and not required by the installed union); not fatal (#5443)"
      fi
    done
    echo "[harbor-prewarm] Phase A2 complete: chart_ok=${chart_ok} chart_fail=${chart_fail} chart_soft_fail=${chart_soft_fail}"
    if [ "${chart_fail}" -gt 0 ]; then
      echo "[harbor-prewarm] FATAL: ${chart_fail} openova-io chart(s) failed to mirror (named above) — step-06 cannot strip ghcr.io safely (post-cutover chart (re)pulls would 404). #5007: this INCLUDES any pinned/desired chart version the union added — a pinned tag that cannot be pulled fails LOUD here (egress open, recoverable) instead of silently wedging step-06 under the deny-egress hold. #5443: it ALSO includes every contractual catalog entry, so the marketplace can never advertise a Blueprint the pivoted registry cannot serve."
      exit 1
    fi

    {{- /*
     ── Phase A2-guard (#5443): re-assert the contract against Harbor.

     The copy tally above says "skopeo returned 0"; the guard says "the
     pivoted registry actually serves it, durably". Those are not the
     same claim — #5030 documents the whole class where a dest read is
     satisfied by a pull-through that persists a manifest and no blobs,
     and #4994's skip-if-present can elide a copy on that basis. So the
     guard probes Harbor CORE's artifact API (its DATABASE, never a
     pull-through) through the SAME harbor_durable_digest the skip
     trusts and step-08's completeness gate makes, for exactly the
     coordinate the install path will request:
     `<spec.manifests.chart>:<spec.version>` of every
     `visibility: listed` Blueprint. This IS the probe that found #5443
     on hw290, and it would have failed that cutover.
    */}}
    : "${PREWARM_CATALOG_GUARD:=true}"
    if [ "${PREWARM_CATALOG_GUARD}" = "true" ] && [ "${PREWARM_CATALOG_CHARTS}" = "true" ]; then
      guard_n=$(grep -c . "${catalog_hard}" || true)
      echo "[harbor-prewarm] Phase A2-guard (#5443): asserting all ${guard_n} contractual catalog chart(s) resolve durably in local Harbor"
      catalog_present=/tmp/.catalog-present.txt
      : > "${catalog_present}"
      while IFS="$(printf '\t')" read -r g_c g_v; do
        [ -z "${g_c}" ] && continue
        g_d=$(harbor_durable_digest "openova-io/${g_c}:${g_v}")
        if [ -n "${g_d}" ]; then
          printf '%s:%s\n' "${g_c}" "${g_v}" >> "${catalog_present}"
        fi
      done < "${catalog_hard}"
      guard_missing=$(catalog_guard_missing "${catalog_hard}" "${catalog_present}")
      if [ -n "${guard_missing}" ]; then
        echo "[harbor-prewarm] FATAL (#5443): the marketplace advertises chart(s) the pivoted registry cannot serve — step-06 would repoint openova-catalog at a registry that never stocked them, and every post-cutover install of these Blueprints 404s under the deny-egress hold:"
        printf '%s\n' "${guard_missing}" | sed 's,^,  MISSING openova-io/,'
        echo "[harbor-prewarm] Each MISSING line is a Blueprint whose spec.manifests.chart:spec.version is absent from local Harbor. Either the upstream artifact does not exist (fix the Blueprint's pin — the #5444 class: a spec.version no registry publishes) or the mirror did not reach it (re-trigger step-03 with egress open). Emergency override: prewarm.catalogCharts.guard.enabled=false — which knowingly ships a Sovereign whose marketplace over-advertises."
        exit 1
      fi
      echo "[harbor-prewarm] Phase A2-guard: PASS — ${guard_n}/${guard_n} contractual catalog chart(s) durably present in local Harbor"
    else
      echo "[harbor-prewarm] Phase A2-guard DISABLED — the marketplace's advertised set is NOT asserted against the pivoted registry (#5443)"
    fi

    {{- /*
     ── Phase A3-chart-images (#5442 #5443 #7938): warm the images the PINNED
     CHART VERSIONS declare, not only what the cluster runs. The live walk
     (Phase A) cannot see a chart's images before the cluster rolls to it
     (hw290 2026-07-27: catalyst-api, catalyst-ui and the organization
     controller ImagePullBackOff on local tags never warmed, and catalyst-api
     drives the cutover), nor those of a catalogue chart nobody installed. So
     every chart in `chart_hard` (live-HR deployed∪desired, the kit pins, the
     contractual catalogue) is pulled back out of local Harbor (skopeo `dir:`),
     rendered, and every image the render pins goes through the same resolver
     and copy_one as the live wave, so step-08 checks identical local paths.
     #7938: rendered at its default values AND with the values of each
     HelmRelease that installs it, in every region (valuesFrom in order, then
     spec.values, as Flux merges them; a Secret's targetPath value is rendered
     as "set", never its bytes; a suspended release runs nothing). Only those
     values turn on images such as the umbrella's org-services
     (ingress.marketplace.enabled, default false): on hw307, 16 Nov 2026, nine
     Deployments went ImagePullBackOff after a release that warmed defaults
     only. A union with the live walk: it can only widen coverage.
    */}}
    # ── prewarm-sovereign-values BEGIN (#7938 extraction anchor — tests/step7938-prewarm-sovereign-values.sh runs this block verbatim) ──
    # prewarm_hr_values <dir>: one folder per HelmRelease of every region: chart, ns, where, v<n>.yaml in merge order.
    prewarm_hr_values() {
      _hv_o="$1"; rm -rf "${_hv_o}"; mkdir -p "${_hv_o}"; _hv_i=0
      for _hv_kc in primary /secondary-kubeconfigs/*.yaml; do
        if [ "${_hv_kc}" = primary ]; then set --; else [ -e "${_hv_kc}" ] || continue; set -- --kubeconfig "${_hv_kc}"; fi
        kubectl "$@" get helmreleases.helm.toolkit.fluxcd.io -A -o json >"${_hv_o}/hr.json" 2>/dev/null || return 1
        jq -c '.items[] | select(.spec.chart.spec.chart != null and .spec.suspend != true)' "${_hv_o}/hr.json" >"${_hv_o}/hr.jsonl" || return 1
        while IFS= read -r _hv_l; do
          _hv_i=$((_hv_i+1)); _hv_d="${_hv_o}/${_hv_i}"; mkdir -p "${_hv_d}"
          printf '%s' "${_hv_l}" | jq -r .spec.chart.spec.chart >"${_hv_d}/chart"
          printf '%s' "${_hv_l}" | jq -r .metadata.namespace >"${_hv_d}/ns"
          printf '%s %s/%s\n' "$(basename "${_hv_kc}" .yaml)" "$(cat "${_hv_d}/ns")" "$(printf '%s' "${_hv_l}" | jq -r .metadata.name)" >"${_hv_d}/where"
          printf '%s' "${_hv_l}" | jq -r '(.spec.valuesFrom // []) | to_entries[] | [.key + 100, .value.kind, .value.name, (.value.valuesKey // "values.yaml"), (.value.targetPath // "-")] | @tsv' \
            | while IFS="$(printf '\t')" read -r _hv_k _hv_kind _hv_n _hv_key _hv_tp; do
                _hv_v=$(kubectl "$@" -n "$(cat "${_hv_d}/ns")" get "${_hv_kind}" "${_hv_n}" -o json 2>/dev/null \
                  | jq -r --arg k "${_hv_key}" 'if .kind == "Secret" then (.data[$k] // empty | @base64d) else (.data[$k] // empty) end' 2>/dev/null || true)
                [ -n "${_hv_v}" ] || continue
                [ "${_hv_tp}" = "-" ] && { printf '%s\n' "${_hv_v}" >"${_hv_d}/v${_hv_k}.yaml"; continue; }
                [ "${_hv_kind}" = Secret ] && _hv_v=set
                jq -n --arg p "${_hv_tp}" --arg v "${_hv_v}" 'setpath($p | split("."); (try ($v | fromjson) catch $v))' >"${_hv_d}/v${_hv_k}.yaml"
              done
          printf '%s' "${_hv_l}" | jq '.spec.values // {}' >"${_hv_d}/v999.yaml"
        done <"${_hv_o}/hr.jsonl"
      done
    }
    # prewarm_chart_images <tgz> <chart> <values dir>: the images of the default render and of the render with
    # each HelmRelease's values; a ref that points at the local registry is named by the upstream it maps to.
    prewarm_chart_images() {
      _pci_t="$1"; _pci_c="$2"; _pci_o="$3"
      { chart_declared_images "${_pci_t}"
        for _pci_f in $(grep -lx "${_pci_c}" "${_pci_o}"/*/chart 2>/dev/null); do
          _pci_d="${_pci_f%/chart}"; set --
          for _pci_v in "${_pci_d}"/v*.yaml; do [ -e "${_pci_v}" ] && set -- "$@" -f "${_pci_v}"; done
          echo "[harbor-prewarm] Phase A3-chart-images: ${_pci_c} also rendered with the values of HelmRelease $(cat "${_pci_d}/where") (#7938)" >&2
          chart_declared_images "${_pci_t}" --namespace "$(cat "${_pci_d}/ns")" "$@"
        done; } | while IFS= read -r _pci_r; do
          case "${_pci_r}" in "${LOCAL_REGISTRY_HOST:-__none__}"/*) offlinemirror_upstream_ref "${_pci_r}" || printf '%s\n' "${_pci_r}" ;; *) printf '%s\n' "${_pci_r}" ;; esac
        done | sort -u
    }
    # prewarm_release_seed <images> <run list>: the images the pinned charts declare for installed releases join
    # the run guard's list, so the step ends only when what the release WILL run is local too (#7922, #7938).
    prewarm_release_seed() { [ -s "$1" ] || return 0; awk -v r="pinned by ${UPSTREAM_BRANCH:-main}" 'NF {print $0 "\t" r}' "$1" >>"$2"; }
    # ── prewarm-sovereign-values END ──
    : "${PREWARM_CHART_IMAGES:=true}"
    : "${PREWARM_CHART_IMAGES_FATAL:=true}"
    if [ "${PREWARM_CHART_IMAGES}" = "true" ] && [ -s "${chart_hard}" ]; then
      echo "[harbor-prewarm] Phase A3-chart-images (#5442 Refs #5443): enumerating images FROM the $(grep -c . "${chart_hard}" || true) pinned chart version(s) — the post-pivot DECLARATION, not the pre-pivot runtime"
      cat_img_set=/tmp/.chart-images.txt
      : > "${cat_img_set}"
      cat_img_installed=/tmp/.chart-images-installed.txt
      : > "${cat_img_installed}"
      cat_pull_dir=/tmp/chart-image-renders
      rm -rf "${cat_pull_dir}"; mkdir -p "${cat_pull_dir}"
      CATALOG_SET_TMPDIR=/tmp
      export CATALOG_SET_TMPDIR
      {{- /*
       helm writes its cache/config/data + $HOME dotfiles on startup;
       the container runs readOnlyRootFilesystem:true with only /tmp
       writable, so redirect all four the way step-06 Phase-3a and the
       #5265 Day-2 reconciler already do — otherwise every render dies
       on a read-only HOME and the image enumeration silently degrades
       to "this chart has no images".
      */}}
      HOME=/tmp/helm-home
      HELM_CACHE_HOME=/tmp/helm-home/cache
      HELM_CONFIG_HOME=/tmp/helm-home/config
      HELM_DATA_HOME=/tmp/helm-home/data
      export HOME HELM_CACHE_HOME HELM_CONFIG_HOME HELM_DATA_HOME
      mkdir -p "${HELM_CACHE_HOME}" "${HELM_CONFIG_HOME}" "${HELM_DATA_HOME}"
      {{- /*
       Materialise the Phase A wave as a FILE so the "already covered"
       test is a plain `grep -Fxq <file>` — never `printf … | grep -q`,
       whose early grep exit SIGPIPEs the writer the moment anything
       upstream enables pipefail (#5370, #5406).
      */}}
      cat_wave_file=/tmp/.prewarm-image-wave.txt
      printf '%s\n' ${mirror_work} > "${cat_wave_file}"
      cat_render_fail=0
      prewarm_hr_values /tmp/prewarm-hr-values || { echo "[harbor-prewarm] FATAL (#7938): could not read the HelmReleases of every region, so the images their own values turn on cannot be named"; exit 1; }
      while IFS="$(printf '\t')" read -r ci_c ci_v; do
        [ -z "${ci_c}" ] && continue
        ci_slug=$(printf '%s_%s' "${ci_c}" "${ci_v}" | tr -c 'A-Za-z0-9._-' '_')
        ci_dir="${cat_pull_dir}/${ci_slug}"
        rm -rf "${ci_dir}"
        {{- /*
         skopeo `dir:` transport — no `helm registry login` dance, and
         the same creds/TLS treatment the chart push already used.
        */}}
        if ! skopeo --command-timeout "${PREWARM_SKOPEO_TIMEOUT}" copy \
            --insecure-policy \
            --src-creds="${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            --src-tls-verify="${PREWARM_DEST_TLS_VERIFY}" \
            "docker://${HARBOR_HOST}/openova-io/${ci_c}:${ci_v}" \
            "dir:${ci_dir}" >"${cat_pull_dir}/${ci_slug}.log" 2>&1; then
          echo "[harbor-prewarm] Phase A3-chart-images WARN: could not pull chart ${ci_c}:${ci_v} back from local Harbor for image enumeration"
          sed 's/^/    /' "${cat_pull_dir}/${ci_slug}.log" 2>/dev/null || true
          cat_render_fail=$((cat_render_fail+1))
          continue
        fi
        {{- /*
         The helm chart content layer is the one blob that is a gzip
         tarball — identified by content, not by a skopeo-version-
         specific blob filename convention.
        */}}
        ci_tgz=""
        for b in "${ci_dir}"/*; do
          [ -f "${b}" ] || continue
          case "${b##*/}" in manifest.json|version|*.json) continue ;; esac
          if tar -tzf "${b}" >/dev/null 2>&1; then ci_tgz="${b}"; break; fi
        done
        if [ -z "${ci_tgz}" ]; then
          echo "[harbor-prewarm] Phase A3-chart-images WARN: no chart tarball layer found in the ${ci_c}:${ci_v} OCI artifact — image enumeration skipped"
          cat_render_fail=$((cat_render_fail+1))
          continue
        fi
        ci_imgs=$(prewarm_chart_images "${ci_tgz}" "${ci_c}" /tmp/prewarm-hr-values 2>/tmp/.chart-images.err || true)
        sed 's/^/    /' /tmp/.chart-images.err 2>/dev/null || true
        ci_n=$(printf '%s\n' "${ci_imgs}" | grep -c . || true)
        echo "[harbor-prewarm] Phase A3-chart-images: ${ci_c}:${ci_v} renders ${ci_n} image ref(s)"
        [ -n "${ci_imgs}" ] && printf '%s\n' "${ci_imgs}" >> "${cat_img_set}"
        [ -n "${ci_imgs}" ] && grep -Fxq "$(printf '%s\t%s' "${ci_c}" "${ci_v}")" "${chart_installed}" && printf '%s\n' "${ci_imgs}" >> "${cat_img_installed}"
        rm -rf "${ci_dir}"
      done < "${chart_hard}"
      sort -u "${cat_img_set}" -o "${cat_img_set}"
      {{- /*
       Drop everything the image wave already mirrored, and resolve the
       remainder through the SHARED coverage map so step-08's
       completeness HEAD looks at the identical local paths.
      */}}
      cat_img_work=""
      cat_img_unmapped=""
      while IFS= read -r ci_ref; do
        [ -z "${ci_ref}" ] && continue
        if grep -Fxq "${ci_ref}" "${cat_wave_file}"; then continue; fi
        ci_paths=$(offlinemirror_local_paths "${ci_ref}")
        case "${ci_paths}" in
          __UNMAPPED__*)
            ci_uh=$(printf '%s' "${ci_paths}" | awk '{print $2}')
            cat_img_unmapped="${cat_img_unmapped} ${ci_uh}(${ci_ref})" ;;
          "") : ;;
          *) cat_img_work="${cat_img_work} ${ci_ref}" ;;
        esac
      done < "${cat_img_set}"
      cat_img_n=$(printf '%s\n' ${cat_img_work} | grep -c . || true)
      echo "[harbor-prewarm] Phase A3-chart-images: ${cat_img_n} chart-declared image(s) not already covered by the live-cluster wave — exactly the #5442 gap"
      if [ -n "${cat_img_unmapped}" ]; then
        echo "[harbor-prewarm] Phase A3-chart-images UNMAPPED — pinned chart(s) reference image(s) from registry host(s) absent from offlineMirror.hostProjects; they CANNOT be mirrored and will ImagePullBackOff post-severance:"
        for u in ${cat_img_unmapped}; do echo "  UNMAPPED ${u}"; done
      fi
      {{- /*
       Second image wave — copy_one verbatim, over its own sentinel dir
       so the Phase A tally is untouched. The #5095 proxy-down latch is
       carried across so a dead mothership proxy keeps direct-first
       routing instead of re-paying the timeout tax.
      */}}
      cat_img_fail=0
      if [ "${cat_img_n}" -gt 0 ]; then
        cat_cpdir=/tmp/prewarm-chart-image-copies
        rm -rf "${cat_cpdir}"; mkdir -p "${cat_cpdir}"
        [ -f "${cpdir}/.proxy_down" ] && touch "${cat_cpdir}/.proxy_down"
        {{- /*
         #5525 leg 2 — carry the per-host toomanyrequests latches into
         the chart-image wave too, so a host that exhausted its quota
         during Phase A is not re-hammered by Phase A3.
        */}}
        for _rl_f in "${cpdir}"/.ratelimited.*; do
          [ -e "${_rl_f}" ] || continue
          cp "${_rl_f}" "${cat_cpdir}/" 2>/dev/null || true
        done
        {{- /*
         copy_one writes its sentinels into the GLOBAL cpdir; point it
         at this wave's dir and restore afterwards so nothing later in
         the step observes a mutated global.
        */}}
        cat_cpdir_saved="${cpdir}"
        cpdir="${cat_cpdir}"
        rm -f "${cat_cpdir}/.hb_stop"
        progress_heartbeat "${cat_img_n}" "${cat_cpdir}" "Phase A3-chart-images" &
        cat_hb_pid=$!
        cat_pids=""
        cat_allpids=""
        for ci_up in ${cat_img_work}; do
          echo "[harbor-prewarm] queue chart-image ${ci_up}"
          copy_one "${ci_up}" &
          _cip=$!
          cat_pids="${cat_pids} ${_cip}"
          cat_allpids="${cat_allpids} ${_cip}"
          while : ; do
            cilive=0
            cinew=""
            for cp in ${cat_pids}; do
              if kill -0 "${cp}" 2>/dev/null; then
                cilive=$((cilive+1))
                cinew="${cinew} ${cp}"
              fi
            done
            cat_pids="${cinew}"
            [ "${cilive}" -lt "${PREWARM_PARALLELISM}" ] && break
            sleep 2
          done
        done
        for _p in ${cat_allpids}; do wait "${_p}" 2>/dev/null || true; done
        touch "${cat_cpdir}/.hb_stop"
        wait "${cat_hb_pid}" 2>/dev/null || true
        cpdir="${cat_cpdir_saved}"
        cat_img_ok=0
        for f in "${cat_cpdir}"/*.ok; do
          [ -e "${f}" ] || continue
          cat_img_ok=$((cat_img_ok+1))
        done
        for f in "${cat_cpdir}"/*.fail; do
          [ -e "${f}" ] || continue
          ci_detail=$(cat "${f}")
          ci_slug=$(basename "${f}" .fail)
          sed 's/^/  /' "${cat_cpdir}/${ci_slug}.log" 2>/dev/null || true
          cat_img_fail=$((cat_img_fail+1))
          echo "[harbor-prewarm] Phase A3-chart-images FAIL ${ci_detail}"
        done
        echo "[harbor-prewarm] Phase A3-chart-images copy wave complete: ok=${cat_img_ok} fail=${cat_img_fail} render_fail=${cat_render_fail}"
      else
        echo "[harbor-prewarm] Phase A3-chart-images copy wave complete: every chart-declared image was already covered by the live-cluster wave (render_fail=${cat_render_fail})"
      fi
      {{- /*
       ── Phase A3-guard (#5442): every image the pinned charts declare
       must resolve DURABLY in local Harbor.

       "skopeo returned 0" and "the pivoted registry serves it" are not
       the same claim — #5030 is the whole class where a dest read is
       satisfied by a pull-through that persists a manifest and no
       blobs, and #4994's skip-if-present can elide a copy on exactly
       that basis. So the guard re-asserts through the SAME
       harbor_durable_digest (Harbor CORE's artifact API — its
       database, never a pull-through) that the skip trusts and that
       step-08's completeness gate makes. It covers the WHOLE
       chart-declared set, including refs the live wave was credited
       with, because a false-present there is precisely how the hw290
       control plane ended up unpullable.

       #7900 — a miss stops the cutover only for an image that an INSTALLED
       chart declares. An image declared only by catalogue charts that are
       installed nowhere is listed as a warning: no workload needs it, and a
       fresh installation stopped here on four images of such a chart that
       Docker Hub rate-limited (each retry pod repeats the whole step and
       meets the same images). An image both kinds declare counts as installed.
      */}}
      img_guard_missing=/tmp/.chart-image-missing.txt
      : > "${img_guard_missing}"
      img_guard_catalog=/tmp/.chart-image-catalog-only-missing.txt
      : > "${img_guard_catalog}"
      img_guard_n=0
      while IFS= read -r ci_ref; do
        [ -z "${ci_ref}" ] && continue
        ci_paths=$(offlinemirror_local_paths "${ci_ref}")
        case "${ci_paths}" in
          __UNMAPPED__*|"") continue ;;
        esac
        for ci_dpath in ${ci_paths}; do
          img_guard_n=$((img_guard_n+1))
          if [ -z "$(harbor_durable_digest "${ci_dpath}")" ]; then
            if grep -Fxq "${ci_ref}" "${cat_img_installed}"; then _ig_f="${img_guard_missing}"; else _ig_f="${img_guard_catalog}"; fi
            printf '%s -> %s\n' "${ci_ref}" "${ci_dpath}" >> "${_ig_f}"
          fi
        done
      done < "${cat_img_set}"
      img_missing_n=$(grep -c . "${img_guard_missing}" || true)
      img_catalog_n=$(grep -c . "${img_guard_catalog}" || true)
      if [ "${img_catalog_n}" -gt 0 ]; then
        echo "[harbor-prewarm] Phase A3-guard WARN (#7900): ${img_catalog_n} image path(s) declared only by catalogue chart(s) that are installed NOWHERE are not in local Harbor. This does not stop the cutover unless a pod runs one of them (the run guard at the end of this step checks every image a pod runs, in every region; #7922). Such a Blueprint fails at image pull if it is installed before its images are mirrored; the Day-2 reconciler reports the same set every cycle:"
        sed 's/^/  CATALOGUE-ONLY-MISSING /' "${img_guard_catalog}"
      fi
      if [ "${img_missing_n}" -eq 0 ]; then
        echo "[harbor-prewarm] Phase A3-guard (#5442): PASS — of ${img_guard_n} local path(s) for the chart-declared image set, every path an installed chart declares is durably present in local Harbor (catalogue-only misses: ${img_catalog_n})"
      else
        echo "[harbor-prewarm] Phase A3-guard (#5442): ${img_missing_n}/${img_guard_n} chart-declared image path(s) NOT durably present in local Harbor:"
        sed 's/^/  MISSING /' "${img_guard_missing}"
      fi
      {{- /*
       FATAL policy. copy failures, un-mappable registry hosts and
       durable-presence misses are all PROVEN post-severance
       ImagePullBackOffs — the same two conditions Phase A already
       FATALs on for the runtime-derived set, applied to the second
       input. Failing HERE, with egress still open and the offender
       named, is recoverable; discovering it after the pivot can strand
       the control plane that drives the cutover (hw290). A chart that
       failed to RENDER is deliberately NOT fatal: it makes no claim
       about images either way, so failing on it would fail a cutover
       on an enumeration hiccup rather than a missing artifact.
      */}}
      if [ "${cat_render_fail}" -gt 0 ]; then
        echo "[harbor-prewarm] Phase A3-chart-images WARN: ${cat_render_fail} chart(s) could not be pulled back or rendered (named above) — their images were NOT enumerated from the chart; those charts rely on the live-cluster wave alone (#5442)"
      fi
      {{- /*
       #5525 leg 3 — copy_fail ALONE is not a post-severance
       ImagePullBackOff: the A3-guard durability sweep directly above
       is the AUTHORITATIVE assertion of what the pivoted registry
       serves, and copy_fail>0 with durable_miss=0 means every failed
       copy was a freshness re-copy against a source we no longer need
       (live hw291 attempt 1785396281: `Phase A3-guard (#5442): PASS`
       with durable_miss=0 immediately followed by `FATAL ...
       copy_fail=4` — the gate contradicted its own sweep). That shape
       degrades to a LOUD WARN naming the refs; FATAL keys on
       { durable_miss>0 || unmapped } ONLY.
      */}}
      if [ "${cat_img_fail}" -gt 0 ] && [ "${img_missing_n}" -eq 0 ] && [ "${img_catalog_n}" -eq 0 ] && [ -z "${cat_img_unmapped}" ]; then
        echo "[harbor-prewarm] Phase A3-chart-images WARN (#5525): ${cat_img_fail} copy attempt(s) failed but EVERY chart-declared image path is durably present in local Harbor (A3-guard PASS, durable_miss=0) — the failures were freshness re-copies against unreachable/rate-limited sources; the pivoted registry serves the full set. Failed ref(s):"
        for f in "${cat_cpdir}"/*.fail; do
          [ -e "${f}" ] || continue
          echo "  WARN-COPY-FAIL $(cat "${f}")"
        done
      fi
      if [ "${PREWARM_CHART_IMAGES_FATAL}" = "true" ] \
         && { [ "${img_missing_n}" -gt 0 ] || [ -n "${cat_img_unmapped}" ]; }; then
        echo "[harbor-prewarm] FATAL (#5442 #5525): the pinned charts declare image(s) the local registry cannot serve (durable_miss=${img_missing_n} catalogue_only_miss=${img_catalog_n} unmapped=$(printf '%s\n' ${cat_img_unmapped} | grep -c . || true) copy_fail=${cat_img_fail}). Step-05 pivots flux onto these exact chart versions, so every workload whose image is missing goes ImagePullBackOff against a registry that correctly answers NotFound — and if catalyst-api is among them the Sovereign cannot self-heal, because catalyst-api is what drives the cutover (live hw290 2026-07-27). Fix the named refs (extend offlineMirror.hostProjects for an UNMAPPED host; re-trigger step-03 with egress open for a durable miss) or set prewarm.chartImages.fatal=false to proceed knowing the post-pivot world is not fully pullable."
        exit 1
      fi
    else
      echo "[harbor-prewarm] Phase A3-chart-images SKIP — prewarm.chartImages.enabled=false or an empty contractual chart set; image warming falls back to the LIVE-CLUSTER walk alone, which cannot see the images of a chart the cluster has not rolled to (#5442)"
    fi

    # ─── Phase A4 (#5204): warm Crossplane xpkg provider packages ──────
    {{- /*

     #5204 (Refs #5209 #3379). Step-11 rewrites every Provider's spec.package to
     the local `proxy-xpkg` project, but nothing placed the xpkg artifact ITSELF
     there. proxy-xpkg is the ONE local project that stays a Harbor PROXY-CACHE
     (Harbor rejects a push into it, so Phase A cannot serve it), and
     xpkg.upbound.io is in offlineMirror.excludedHosts (the Crossplane package
     manager bypasses containerd). On a COLD cache a severed Sovereign could not
     resolve its own provider package (hw270, provider-opentofu Installed=False).

     FIX: for every providers.pkg.crossplane.io spec.package (the set step-11
     pivots), ONE FULL authenticated pull THROUGH the local proxy-xpkg
     (`skopeo copy docker://${HARBOR_HOST}/proxy-xpkg/<path> dir:…`, --multi-arch
     all) makes Harbor cache the manifest (list) and EVERY blob DURABLY; Harbor
     serves cached proxy content when the upstream is unreachable. A bounded
     durable-presence poll confirms each package, else FATAL naming it.
     Step-11's verify-before-pivot re-asserts it before each rewrite.

     #5232 (Refs #5226) — DIGEST-addressed end-to-end. Harbor proxy-cache NEVER
     records TAGS for pulled-through xpkg artifacts (hw274: tag-create 401s; a
     tag manifest GET records none), and for a MULTI-ARCH package the artifact
     API records only the per-arch CHILD manifests, never the index by its own
     digest. So Phase A4 resolves tag->digest from a registry v2 HEAD
     (Docker-Content-Digest, the digest containerd/Crossplane resolve), verifies
     with a v2 digest GET (200), and persists the map in the XPKG_DIGEST_CM
     ConfigMap for step-11's digest pivot.

     The two helpers (defined before Phase A, where harbor_durable_digest uses
     the GET) call ${HARBOR_INTERNAL_URL}/v2/<repo>/manifests/<ref>, the Service
     Phase B dials, with LITERAL-slash repo paths; the Accept header covers OCI
     index, docker manifest list and single manifest, so a single-arch package
     needs no special case.
    */}}

    if [ "${XPKG_PREWARM_ENABLED:-true}" != "true" ]; then
      echo "[harbor-prewarm] Phase A4 SKIP — prewarm.xpkgPackages.enabled=false (Crossplane package warm disabled; post-severance provider re-pulls stay dependent on proxy-cache upstream reachability)"
    elif ! kubectl get crd providers.pkg.crossplane.io >/dev/null 2>&1; then
      {{- /*
       Same very-early-handover guard step-11 Phase 1 uses: bp-crossplane
       not landed yet → no Provider CRs to warm, and step-11 skips the
       live pivot on the SAME probe, so no ref is ever pivoted onto a
       cold cache. A step re-run once crossplane lands warms the set.
      */}}
      echo "[harbor-prewarm] Phase A4 SKIP — providers.pkg.crossplane.io CRD not installed yet (bp-crossplane not landed); packages warm on a later step re-run"
    else
      echo "[harbor-prewarm] Phase A4: warm Crossplane xpkg provider packages through local ${XPKG_REGISTRY_PATH} (#5204; digest-addressed durable verify #5232)"
      xpkg_target_host="harbor.${SOVEREIGN_FQDN}"
      xpkg_tsv=$(kubectl get providers.pkg.crossplane.io \
        -o 'jsonpath={range .items[*]}{.metadata.name}{"\t"}{.spec.package}{"\n"}{end}' 2>/dev/null || true)
      xpkg_warm_dir=/tmp/xpkg-warm
      rm -rf "${xpkg_warm_dir}"; mkdir -p "${xpkg_warm_dir}"
      {{- /*
       #5232 — the prior-run digest map (also the create-or-replace
       target below). A skip-if-present decision may ONLY key on a
       digest a PRIOR successful warm minted (full pull-through +
       durable verify): resolving a tag via a fresh manifest GET
       through the proxy would itself pull the manifest through and
       could record the artifact digest with COLD blobs — a
       durability hole. No prior digest -> full warm. Fail-closed.
      */}}
      xpkg_digest_map_json=$(kubectl get configmap "${XPKG_DIGEST_CM}" -n "${RELEASE_NAMESPACE}" -o json 2>/dev/null) || xpkg_digest_map_json='{}'
      [ -n "${xpkg_digest_map_json}" ] || xpkg_digest_map_json='{}'
      printf '%s\n' "${xpkg_tsv}" | while IFS="$(printf '\t')" read -r _xw_name _xw_pkg; do
        [ -z "${_xw_name}" ] && continue
        [ -z "${_xw_pkg}" ] && continue
        {{- /*
         tag@digest → digest-only (skopeo rejects a ref carrying both;
         the digest is authoritative — the #4955 normalization).
        */}}
        _xw_pkg=$(offlinemirror_normalize_ref "${_xw_pkg}")
        {{- /*
         Route the package to its local proxy-xpkg path. Handles every
         shape step-11 handles: the raw upstream host (Hetzner), the
         MOTHERSHIP proxy prefix (Huawei fresh-prov, #4488), and the
         already-pivoted local aliases (re-run idempotency).
        */}}
        _xw_lpath=""
        case "${_xw_pkg}" in
          "${XPKG_UPSTREAM_HOST}/"*)
            _xw_lpath="${XPKG_REGISTRY_PATH}/${_xw_pkg#${XPKG_UPSTREAM_HOST}/}" ;;
          "${XPKG_MOTHERSHIP_PROXY_PREFIX}/"*)
            _xw_lpath="${XPKG_REGISTRY_PATH}/${_xw_pkg#${XPKG_MOTHERSHIP_PROXY_PREFIX}/}" ;;
          "${xpkg_target_host}/${XPKG_REGISTRY_PATH}/"*)
            _xw_lpath="${_xw_pkg#${xpkg_target_host}/}" ;;
          "${LOCAL_REGISTRY_HOST}/${XPKG_REGISTRY_PATH}/"*)
            _xw_lpath="${_xw_pkg#${LOCAL_REGISTRY_HOST}/}" ;;
          *)
            {{- /*
             Unmapped package host — the same fail-fast discipline as
             the Phase A pre-pass (egress still open, offender named)
             instead of a silent post-severance resolution failure.
            */}}
            echo "[harbor-prewarm] Phase A4 UNMAPPED: Provider ${_xw_name} package '${_xw_pkg}' is from a host not covered by crossplaneProviderPivot (${XPKG_UPSTREAM_HOST} / ${XPKG_MOTHERSHIP_PROXY_PREFIX} / ${xpkg_target_host}/${XPKG_REGISTRY_PATH} / ${LOCAL_REGISTRY_HOST}/${XPKG_REGISTRY_PATH}) — extend the values and re-trigger"
            printf '%s %s (unmapped host)' "${_xw_name}" "${_xw_pkg}" > "${xpkg_warm_dir}/$(printf '%s' "${_xw_name}" | tr -c 'A-Za-z0-9._-' '_').fail"
            continue ;;
        esac
        _xw_slug=$(printf '%s' "${_xw_lpath}" | tr -c 'A-Za-z0-9._-' '_')
        : >"${xpkg_warm_dir}/${_xw_slug}.log"
        {{- /*
         #5232 — split the local path into repo-path + tag + ref. A
         source ref that already carries a digest (#4955 normalized
         tag@digest -> digest-only) IS the authoritative digest; the
         tag drives the registry v2 HEAD that resolves the servable
         digest for a tag-only ref.
        */}}
        _xw_repo_path="${_xw_lpath}"
        _xw_digest=""
        _xw_tag=""
        case "${_xw_lpath}" in
          *@sha256:*)
            _xw_digest="${_xw_lpath##*@}"; _xw_repo_path="${_xw_lpath%@*}"
            case "${_xw_repo_path##*/}" in *:*) _xw_tag="${_xw_repo_path##*:}"; _xw_repo_path="${_xw_repo_path%:*}" ;; esac ;;
          *)
            case "${_xw_lpath##*/}" in *:*) _xw_tag="${_xw_lpath##*:}"; _xw_repo_path="${_xw_lpath%:*}" ;; esac ;;
        esac
        {{- /*
         Idempotency (#4994/#5232): skip ONLY when a digest is
         already authoritative (in-ref, or minted by a PRIOR
         successful warm) AND that digest is durably present. A TAG
         can never be probed: Harbor proxy-cache NEVER records tags
         for pulled-through xpkg artifacts (live hw274 — manual
         tag-create 401s on proxy projects; a tag manifest GET does
         not record either). Fail-closed — any miss warms.
        */}}
        if [ "${PREWARM_SKIP_IF_PRESENT:-true}" = "true" ]; then
          _xw_skip_digest="${_xw_digest}"
          if [ -z "${_xw_skip_digest}" ]; then
            _xw_skip_digest=$(printf '%s' "${xpkg_digest_map_json}" | jq -r --arg k "${_xw_slug}" '.data[$k] // empty' 2>/dev/null) || _xw_skip_digest=""
          fi
          if [ -n "${_xw_skip_digest}" ] && xpkg_v2_digest_present "${_xw_repo_path}" "${_xw_skip_digest}"; then
            echo "[harbor-prewarm] Phase A4 skip ${_xw_pkg} -> ${_xw_repo_path}@${_xw_skip_digest} (already durably cached by digest)"
            printf '%s' "${_xw_skip_digest}" > "${xpkg_warm_dir}/${_xw_slug}.digest"
            printf '%s@%s (present)' "${_xw_repo_path}" "${_xw_skip_digest}" > "${xpkg_warm_dir}/${_xw_slug}.ok"
            continue
          fi
        fi
        echo "[harbor-prewarm] Phase A4 warm ${_xw_pkg} -> ${HARBOR_HOST}/${_xw_lpath} (full pull-through; manifest + all blobs cache durably)"
        _xw_attempt=1
        _xw_rc=1
        while [ "${_xw_attempt}" -le "${PREWARM_COPY_ATTEMPTS}" ]; do
          echo "[harbor-prewarm] Phase A4 warm ${_xw_lpath} attempt ${_xw_attempt}/${PREWARM_COPY_ATTEMPTS}" >>"${xpkg_warm_dir}/${_xw_slug}.log"
          rm -rf "${xpkg_warm_dir}/${_xw_slug}.dir"
          {{- /*
           SOURCE = the local proxy-xpkg endpoint (the exact ref
           step-11 pivots to); admin src-creds satisfy Harbor's
           authenticated proxy-cache pull (#5204/#5209). src-tls
           follows PREWARM_DEST_TLS_VERIFY — it is the SAME in-cluster
           registry.<fqdn> endpoint the Phase A pushes target (#4529
           rationale: trust is the cluster network, not a public CA).
           --multi-arch all pulls EVERY arch sub-manifest + blobs
           through so the cached list is complete (#4975 rationale).
          */}}
          if skopeo --command-timeout "${PREWARM_SKOPEO_TIMEOUT}" copy \
              --insecure-policy \
              --multi-arch all \
              --retry-times 5 \
              --src-creds="${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
              --src-tls-verify="${PREWARM_DEST_TLS_VERIFY}" \
              "docker://${HARBOR_HOST}/${_xw_lpath}" \
              "dir:${xpkg_warm_dir}/${_xw_slug}.dir" >>"${xpkg_warm_dir}/${_xw_slug}.log" 2>&1; then
            _xw_rc=0
            break
          else
            _xw_rc=$?
          fi
          echo "[harbor-prewarm] Phase A4 warm ${_xw_lpath} attempt ${_xw_attempt} failed (exit=${_xw_rc}); retrying after backoff" >>"${xpkg_warm_dir}/${_xw_slug}.log"
          _xw_attempt=$((_xw_attempt+1))
          [ "${_xw_attempt}" -le "${PREWARM_COPY_ATTEMPTS}" ] && sleep 5
        done
        {{- /*
         #5232 (round 2) — resolve the tag->digest from the REGISTRY
         V2 API, not the pulled-through scratch: HEAD the tag and read
         the `Docker-Content-Digest` response header. That is the
         EXACT digest Harbor serves for the tag (and containerd/
         Crossplane resolve at pull time) — for a multi-arch package
         the top-level OCI INDEX digest, which the artifact-management
         API never exposes by its own digest (live hw274: only per-
         arch child manifests, so the resolved index 404s there). The
         full pull-through above already cached the manifest + every
         blob durably, so this HEAD is served from cache. In-ref
         digests (#4955) are authoritative and skip the resolve.
        */}}
        if [ "${_xw_rc}" -eq 0 ] && [ -z "${_xw_digest}" ]; then
          _xw_digest=$(xpkg_v2_resolve_digest "${_xw_repo_path}" "${_xw_tag}")
        fi
        {{- /*
         The dir: copy is a scratch side-effect — the durable payload
         is what Harbor cached on the way through. Free the emptyDir.
        */}}
        rm -rf "${xpkg_warm_dir}/${_xw_slug}.dir"
        if [ "${_xw_rc}" -ne 0 ]; then
          printf '%s exit=%s' "${_xw_lpath}" "${_xw_rc}" > "${xpkg_warm_dir}/${_xw_slug}.fail"
          echo "[harbor-prewarm] Phase A4 done ${_xw_lpath} (FAIL exit=${_xw_rc})"
          continue
        fi
        if [ -z "${_xw_digest}" ]; then
          {{- /*
           Without a digest step-11 has NOTHING valid to pivot to (a
           tag ref 404s post-severance — Harbor never records tags on
           proxy projects, #5232) — fail LOUD while egress is open.
          */}}
          printf '%s (pulled through but tag->digest resolution failed)' "${_xw_lpath}" > "${xpkg_warm_dir}/${_xw_slug}.fail"
          echo "[harbor-prewarm] Phase A4 ${_xw_lpath}: pull-through succeeded but the registry v2 HEAD returned no Docker-Content-Digest for tag '${_xw_tag}' (HEAD non-200 or header absent) — no digest to record for the step-11 pivot (#5232)"
          continue
        fi
        {{- /*
         Durable-presence poll BY DIGEST via the registry v2 API
         (#5232 round 2 — the multi-arch-aware durability signal;
         Harbor records proxied artifacts ASYNC): GET the digest must
         be 200, bounded 12x10s before the fail-closed verdict.
        */}}
        _xw_present=0
        for _xw_i in $(seq 1 12); do
          if xpkg_v2_digest_present "${_xw_repo_path}" "${_xw_digest}"; then _xw_present=1; break; fi
          sleep 10
        done
        if [ "${_xw_present}" -eq 1 ]; then
          printf '%s' "${_xw_digest}" > "${xpkg_warm_dir}/${_xw_slug}.digest"
          printf '%s@%s' "${_xw_repo_path}" "${_xw_digest}" > "${xpkg_warm_dir}/${_xw_slug}.ok"
          echo "[harbor-prewarm] Phase A4 done ${_xw_repo_path}@${_xw_digest} (durably cached by digest)"
        else
          printf '%s@%s (pulled through but never durably recorded)' "${_xw_repo_path}" "${_xw_digest}" > "${xpkg_warm_dir}/${_xw_slug}.fail"
          echo "[harbor-prewarm] Phase A4 ${_xw_lpath}: pull-through succeeded but the registry v2 API never served ${_xw_digest} (GET non-200, 120s poll) — proxy-cache persistence failed"
        fi
      done
      xpkg_ok=0
      xpkg_fail=0
      for f in "${xpkg_warm_dir}"/*.ok; do
        [ -e "${f}" ] || continue
        _xs=$(basename "${f}" .ok)
        xpkg_ok=$((xpkg_ok+1))
        echo "[harbor-prewarm] Phase A4 OK $(cat "${f}")"
      done
      for f in "${xpkg_warm_dir}"/*.fail; do
        [ -e "${f}" ] || continue
        _xs=$(basename "${f}" .fail)
        sed 's/^/  /' "${xpkg_warm_dir}/${_xs}.log" 2>/dev/null || true
        xpkg_fail=$((xpkg_fail+1))
        echo "[harbor-prewarm] Phase A4 FAIL $(cat "${f}")"
      done
      echo "[harbor-prewarm] Phase A4 complete: xpkg_ok=${xpkg_ok} xpkg_fail=${xpkg_fail}"
      {{- /*
       #5232 — persist the tag->digest map for step-11 BEFORE the
       fail gate so partial progress is durable across a re-run.
       Create-or-replace: the enumerated live set fully re-emits
       every run (kubectl apply prunes keys absent from the render).
      */}}
      _xd_literals=""
      _xd_count=0
      for f in "${xpkg_warm_dir}"/*.digest; do
        [ -e "${f}" ] || continue
        _xd_literals="${_xd_literals} --from-literal=$(basename "${f}" .digest)=$(cat "${f}")"
        _xd_count=$((_xd_count+1))
      done
      if [ "${_xd_count}" -gt 0 ]; then
        if kubectl create configmap "${XPKG_DIGEST_CM}" -n "${RELEASE_NAMESPACE}" ${_xd_literals} \
            --dry-run=client -o json \
          | jq '.metadata.labels={"app.kubernetes.io/managed-by":"self-sovereign-cutover","bp.openova.io/cutover-step":"harbor-prewarm"}' \
          | kubectl apply -f - >/dev/null; then
          echo "[harbor-prewarm] Phase A4 recorded ${_xd_count} tag->digest entries in ConfigMap ${RELEASE_NAMESPACE}/${XPKG_DIGEST_CM} for the step-11 digest pivot (#5232)"
        else
          echo "[harbor-prewarm] FATAL: failed to persist the xpkg tag->digest map to ConfigMap ${RELEASE_NAMESPACE}/${XPKG_DIGEST_CM} — step-11 cannot construct digest pivot refs without it (#5232)"
          exit 1
        fi
      fi
      if [ "${xpkg_fail}" -gt 0 ]; then
        echo "[harbor-prewarm] FATAL: ${xpkg_fail} Crossplane xpkg package(s) failed to warm into local Harbor (named above) — step-11 would pivot Provider spec.package onto a ref the local registry cannot serve post-severance (#5204)"
        exit 1
      fi
    fi

    {{- /* Phase A5 (SOV-343): the OpenTofu provider packages, copied by digest; the rules are above the key tofuProviders of values.yaml. */}}
    {{- include "bp-self-sovereign-cutover.tofuProviders" . | nindent 4 }}
    # tofu-providers-copy BEGIN
    tofu_providers_copy() {
      _tp_rc=0; tofu_list_read /tmp/tofu-providers.list || _tp_rc=$?
      if [ "${_tp_rc}" -eq 2 ]; then
        echo "[harbor-prewarm] Phase A5: no ConfigMap ${TOFU_NAMESPACE}/${TOFU_LIST_CM}: this Sovereign lists no OpenTofu provider package, none is copied"
        return 0
      fi
      if [ "${_tp_rc}" -ne 0 ]; then
        echo "[harbor-prewarm] FATAL: Phase A5 cannot read ConfigMap ${TOFU_NAMESPACE}/${TOFU_LIST_CM}: the OpenTofu provider packages are not known to be in the local registry"
        return 1
      fi
      _tp_bad=""; _tp_n=0; _tp_creds=$(src_creds_for "${TOFU_ORIGIN_PREFIX%%/*}")
      while IFS= read -r _tp_l; do
        if ! tofu_list_line "${_tp_l}"; then
          _tp_bad="${_tp_bad}; the list line '${_tp_l}' is not '<source> <version> sha256:<digest>'"; continue
        fi
        _tp_n=$((_tp_n+1)); _tp_dst="${HARBOR_HOST}/${TOFU_LOCAL_PATH}/${_tl_repo}:${_tl_ver}"
        _tp_have=$(tofu_local_digest "${_tl_repo}" "${_tl_ver}")
        if [ "${_tp_have}" = "${_tl_dig}" ]; then
          echo "[harbor-prewarm] Phase A5 present ${_tp_dst} at ${_tl_dig}"; continue
        fi
        if [ -n "${_tp_have}" ]; then
          _tp_bad="${_tp_bad}; ${_tp_dst} is ${_tp_have}, the list names ${_tl_dig} (a tag never moves)"; continue
        fi
        _tp_src="${TOFU_ORIGIN_PREFIX}/${_tl_repo}@${_tl_dig}"; _tp_ok=""
        for _tp_try in $(seq 1 "${PREWARM_COPY_ATTEMPTS}"); do
          echo "[harbor-prewarm] Phase A5 copy ${_tp_src} -> ${_tp_dst} (attempt ${_tp_try}/${PREWARM_COPY_ATTEMPTS})"
          if offlinemirror_copy "${_tp_src}" "${_tp_creds}" "${_tp_dst}" --multi-arch all >/tmp/tofu-providers.log 2>&1 \
              && [ "$(tofu_local_digest "${_tl_repo}" "${_tl_ver}")" = "${_tl_dig}" ]; then
            _tp_ok=1; break
          fi
          sed 's/^/    /' /tmp/tofu-providers.log
          [ "${_tp_try}" -ge "${PREWARM_COPY_ATTEMPTS}" ] || sleep 5
        done
        [ -n "${_tp_ok}" ] || _tp_bad="${_tp_bad}; ${_tp_src} could not be copied to ${_tp_dst} at its digest"
      done </tmp/tofu-providers.list
      [ "${_tp_n}" -gt 0 ] || _tp_bad="${_tp_bad}; the list names no package"
      if [ -n "${_tp_bad}" ]; then
        echo "[harbor-prewarm] FATAL: Phase A5: ${_tp_bad#; } (step 11 moves the OpenTofu CLI configuration here only when every listed package is)"
        return 1
      fi
      echo "[harbor-prewarm] Phase A5 complete: ${_tp_n} OpenTofu provider package(s) in the local registry by digest"
    }
    # tofu-providers-copy END
    tofu_providers_copy

    # ─── Phase B (legacy): HEAD against proxy-cache for non-openova-io ─
    echo "[harbor-prewarm] Phase B: HEAD against proxy-cache for upstream images"
    base="${HARBOR_INTERNAL_URL}/v2"  # #5036 in-cluster Harbor Service — always resolves pre-pivot; the /v2 registry API uses literal-slash repo names (no gateway-decode nuance)
    ok=0
    fail=0
    while IFS= read -r line; do
      ref=$(printf '%s' "${line}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
      [ -z "${ref}" ] && continue
      path=${ref%:*}
      tag=${ref##*:}
      code=$(curl -sk -o /dev/null -w "%{http_code}" \
        -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
        -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json" \
        -I "${base}/${path}/manifests/${tag}")
      case "${code}" in
        200|301|302) ok=$((ok+1)); echo "[harbor-prewarm] OK ${ref}" ;;
        *)           fail=$((fail+1)); echo "[harbor-prewarm] MISS ${ref} (${code})" ;;
      esac
    done < /work/prewarm.list
    echo "[harbor-prewarm] Phase B complete: primed=${ok} failed=${fail}"
    total=$((ok+fail))
    if [ "${total}" -gt 0 ] && [ "${fail}" -gt $((total/4)) ]; then
      echo "[harbor-prewarm] Phase B failure rate exceeds 25% — failing step"
      exit 1
    fi

    {{- if or .Values.secondaryRegions.prewarmSecondaryHarbor .Values.secondaryRegions.replicaRegion }}
    {{- /*
     ── #6764: prewarm EACH secondary region's OWN in-cluster Harbor ──
     Each region runs bp-harbor; step 06 pivots a follower's HelmRepositories at
     its own, so it must hold the openova-io charts (#5359). Per follower, through
     its admin kubeconfig (/secondary-kubeconfigs, optional: empty on a single
     region, a no-op): (1) a coredns-custom pin of registry.<fqdn> to THAT
     region's gateway ClusterIP; (2) its ghcr-pull dockerconfig copied into the
     harbor ns (a secretKeyRef cannot cross namespaces); (3) its openova-io images
     and charts enumerated; (4) the shared script and the lists as a region-local
     ConfigMap; (5) the rendered Job (only __REGION__ substituted), default SA in
     the harbor ns since the follower runs no cutover release, which copies them
     and self-verifies through /v2. As the #6490 gitea leg does one layer down.
    */}}
    echo "[harbor-prewarm] #6764 secondary-region Harbor prewarm leg (prewarmSecondaryHarbor=true)"
    sec_any="false"
    for skc in /secondary-kubeconfigs/*.yaml; do
      [ -e "${skc}" ] || continue
      sec_any="true"
      region=$(basename "${skc}" .yaml)
      jobname=$(printf 'cutover-harbor-prewarm-secondary-%s' "${region}" | cut -c1-63)
      echo "[harbor-prewarm] #6764 secondary region ${region}: prewarming its OWN local Harbor (ns ${SECONDARY_HARBOR_NAMESPACE})"

      {{- /*
       (1) region-local CoreDNS pin — registry.<fqdn> -> THIS region's gateway
       ClusterIP (the #5007 `.server` block, never `.override`). Read the
       ClusterIP + patch coredns-custom through the region admin kubeconfig; the
       in-region Job's readiness probe blocks until CoreDNS serves it.
      */}}
      case "${LOCAL_REGISTRY_PIN_ENABLED:-true}" in
        true|True|TRUE|1|yes)
          _sec_cip=""
          for _sec_pa in 1 2 3 4 5; do
            _sec_c=$(kubectl --kubeconfig "${skc}" get svc "${GATEWAY_LB_SVC_NAME}" -n "${GATEWAY_LB_SVC_NAMESPACE}" -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)
            case "${_sec_c}" in ""|None) : ;; *) _sec_cip="${_sec_c}"; break ;; esac
            echo "[harbor-prewarm] #6764 secondary region ${region}: gateway Service ${GATEWAY_LB_SVC_NAMESPACE}/${GATEWAY_LB_SVC_NAME} ClusterIP not resolved yet (attempt ${_sec_pa}/5); retry in 3s"
            sleep 3
          done
          if [ -z "${_sec_cip}" ]; then
            echo "[harbor-prewarm] FATAL: #6764 secondary region ${region}: could not resolve the cilium-gateway Service ClusterIP (${GATEWAY_LB_SVC_NAMESPACE}/${GATEWAY_LB_SVC_NAME}). Refusing to push over the flaky public DNS path (#5007)." >&2
            exit 1
          fi
          _sec_block=$(printf '%s {\n    hosts {\n        %s %s\n        fallthrough\n    }\n    forward . /etc/resolv.conf\n}\n' "${HARBOR_HOST}" "${_sec_cip}" "${HARBOR_HOST}")
          _sec_patch=$(jq -cn --arg k "cutover-registry-pin.server" --arg v "${_sec_block}" '{data: {($k): $v}}')
          if kubectl --kubeconfig "${skc}" patch configmap coredns-custom -n kube-system --type merge -p "${_sec_patch}" >/dev/null 2>&1; then :;
          elif kubectl --kubeconfig "${skc}" create configmap coredns-custom -n kube-system --from-literal="cutover-registry-pin.server=${_sec_block}" >/dev/null 2>&1; then :;
          elif kubectl --kubeconfig "${skc}" patch configmap coredns-custom -n kube-system --type merge -p "${_sec_patch}" >/dev/null 2>&1; then :;
          else
            echo "[harbor-prewarm] FATAL: #6764 secondary region ${region}: could not install the coredns-custom ${HARBOR_HOST} -> ${_sec_cip} override (patch+create both failed)." >&2
            exit 1
          fi
          echo "[harbor-prewarm] #6764 secondary region ${region}: coredns-custom pins ${HARBOR_HOST} -> ${_sec_cip}"
          ;;
        *) echo "[harbor-prewarm] #6764 secondary region ${region}: CoreDNS pin DISABLED (LOCAL_REGISTRY_PIN_ENABLED=${LOCAL_REGISTRY_PIN_ENABLED:-}) — relying on this region's public DNS for ${HARBOR_HOST}" ;;
      esac

      {{- /*
       (2) copy THIS region's OWN ghcr dockerconfig into the harbor ns so the
       in-region Job can secretKeyRef it (cross-namespace secretKeyRef forbidden).
       Strip server-managed metadata; keep .type + .data.
      */}}
      if ! kubectl --kubeconfig "${skc}" -n "${SECONDARY_GHCR_SOURCE_NAMESPACE}" get secret "${SECONDARY_GHCR_SOURCE_SECRET}" -o json 2>/dev/null \
        | jq --arg n "${SECONDARY_GHCR_DEST_SECRET}" --arg ns "${SECONDARY_HARBOR_NAMESPACE}" \
            'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.ownerReferences,.metadata.annotations,.metadata.labels,.metadata.managedFields,.status) | .metadata.name=$n | .metadata.namespace=$ns' \
        | kubectl --kubeconfig "${skc}" -n "${SECONDARY_HARBOR_NAMESPACE}" apply --server-side --force-conflicts --field-manager=self-sovereign-cutover -f - >/dev/null 2>&1; then
        echo "[harbor-prewarm] FATAL: #6764 secondary region ${region}: could not copy ${SECONDARY_GHCR_SOURCE_NAMESPACE}/${SECONDARY_GHCR_SOURCE_SECRET} into ${SECONDARY_HARBOR_NAMESPACE}/${SECONDARY_GHCR_DEST_SECRET} — the region-local push cannot authenticate to ghcr.io." >&2
        exit 1
      fi

      {{- /*
       (2b) The secondary Harbor shares the PRIMARY's Harbor database, so its
       admin account (and password) is the primary's. bp-harbor in the
       secondary region generates its OWN random harbor-admin Secret on first
       install, which that Harbor then rejects (401): on hw307 (2026-11-06)
       all 70 secondary-region pushes failed with "unauthorized". Converge the
       secondary's harbor-admin Secret on the primary's password (this Job
       already holds it as HARBOR_PASSWORD); bp-harbor's lookup re-emits the
       stored bytes on every reconcile and reflector mirrors the Secret into
       catalyst, so the fix is durable.
      */}}
      if [ -n "${HARBOR_PASSWORD:-}" ]; then
        _sec_pw_b64=$(printf '%s' "${HARBOR_PASSWORD}" | base64 | tr -d '\n')
        if kubectl --kubeconfig "${skc}" -n "${SECONDARY_HARBOR_NAMESPACE}" get secret harbor-admin >/dev/null 2>&1; then
          if kubectl --kubeconfig "${skc}" -n "${SECONDARY_HARBOR_NAMESPACE}" patch secret harbor-admin --type=merge \
               -p "{\"data\":{\"HARBOR_ADMIN_PASSWORD\":\"${_sec_pw_b64}\"}}" >/dev/null 2>&1; then
            echo "[harbor-prewarm] #6764 secondary region ${region}: harbor-admin converged on the primary's admin password (shared Harbor DB)"
          else
            echo "[harbor-prewarm] FATAL: #6764 secondary region ${region}: could not converge ${SECONDARY_HARBOR_NAMESPACE}/harbor-admin on the primary's admin password — the region-local pushes would 401." >&2
            exit 1
          fi
        fi
      fi

      {{- /*
       (3) enumerate THIS region's OWN openova-io images (running Pods ∪ declared
       workload templates — the same union the primary Phase A builds) + charts
       (static names ∪ live openova-io HelmRepositories, deployed∪desired
       versions — the primary Phase A2 pivot-set + tuple logic).
      */}}
      sec_img="/tmp/sec-${region}-images.list"
      sec_run=$(kubectl --kubeconfig "${skc}" get pods -A -o json 2>/dev/null | jq -r '.items[].spec | (.containers // [])[].image, (.initContainers // [])[].image, (.ephemeralContainers // [])[].image' 2>/dev/null || true)
      sec_decl=$(kubectl --kubeconfig "${skc}" get deployments,statefulsets,daemonsets -A -o json 2>/dev/null | jq -r '.items[].spec.template.spec | (.containers // [])[].image, (.initContainers // [])[].image' 2>/dev/null || true)
      sec_cj=$(kubectl --kubeconfig "${skc}" get cronjobs -A -o json 2>/dev/null | jq -r '.items[].spec.jobTemplate.spec.template.spec | (.containers // [])[].image, (.initContainers // [])[].image' 2>/dev/null || true)
      sec_jb=$(kubectl --kubeconfig "${skc}" get jobs -A -o json 2>/dev/null | jq -r '.items[].spec.template.spec | (.containers // [])[].image, (.initContainers // [])[].image' 2>/dev/null || true)
      printf '%s\n%s\n%s\n%s\n' "${sec_run}" "${sec_decl}" "${sec_cj}" "${sec_jb}" | grep -E '^ghcr\.io/openova-io/' | sort -u > "${sec_img}" || true

      sec_pivot="/tmp/sec-${region}-pivot.txt"
      : > "${sec_pivot}"
      while IFS= read -r _pn; do
        _pn=$(printf '%s' "${_pn}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
        [ -z "${_pn}" ] && continue
        printf '%s\n' "${_pn}" >> "${sec_pivot}"
      done < /chart-mirror/chart-mirror-names.txt
      _sec_upmatch=$(printf '%s' "${UPSTREAM_PREFIX}" | sed -e 's,/$,,')
      kubectl --kubeconfig "${skc}" get helmrepositories.source.toolkit.fluxcd.io -A -o json 2>/dev/null \
        | jq -r --arg p "${_sec_upmatch}" '.items[] | select((.spec.url // "") | startswith($p)) | .metadata.name' 2>/dev/null | sort -u >> "${sec_pivot}" || true
      sort -u "${sec_pivot}" -o "${sec_pivot}"
      sed -i '/^[[:space:]]*$/d' "${sec_pivot}" 2>/dev/null || true

      sec_tuples="/tmp/sec-${region}-tuples.tsv"
      kubectl --kubeconfig "${skc}" get helmreleases -A -o json 2>/dev/null | jq -r '.items[]
        | .spec.chart.spec as $cs
        | select($cs.chart != null and $cs.sourceRef != null)
        | ( [ (.status.history[0].chartVersion), $cs.version ] | map(select(. != null and . != "")) | unique ) as $vers
        | ( $vers[] )
        | . as $v
        | [ $cs.chart, $v, ($cs.sourceRef.kind // ""), ($cs.sourceRef.name // "") ] | @tsv' 2>/dev/null | sort -u > "${sec_tuples}" || true
      sec_charts="/tmp/sec-${region}-charts.list"
      : > "${sec_charts}"
      while IFS="$(printf '\t')" read -r _cc _cv _ck _cn; do
        [ -z "${_cc}" ] && continue
        [ "${_ck}" = "HelmRepository" ] || continue
        grep -Fxq "${_cn}" "${sec_pivot}" || continue
        [ -z "${_cv}" ] && continue
        case "${_cv}" in *[\<\>~^\|\ ]*|*'*'*) continue ;; esac
        printf '%s\t%s\n' "${_cc}" "${_cv}" >> "${sec_charts}"
      done < "${sec_tuples}"
      # ── follower-release-pins BEGIN (#7938 extraction anchor — tests/step7938-follower-release-pins.sh runs this block verbatim): this region's live set is the release it RUNS; the release it is GIVEN is what this step pinned from ${UPSTREAM_BRANCH} (chart_installed) and the images those charts declare (Phase A3) ──
      if [ -s "${chart_installed:-}" ]; then cat "${chart_installed}" >> "${sec_charts}"; fi
      cat "${cat_img_installed:-/dev/null}" "${kit_img:-/dev/null}" 2>/dev/null | grep -E '^ghcr\.io/openova-io/' >> "${sec_img}" || true
      sort -u "${sec_charts}" -o "${sec_charts}"; sort -u "${sec_img}" -o "${sec_img}"
      echo "[harbor-prewarm] #7938 secondary region ${region}: also mirrors the pins of ${UPSTREAM_BRANCH} and the images their charts and the kit's Flux Kustomizations declare, so this region's registry holds what the release pins"
      # ── follower-release-pins END ──
      _sec_imgn=$(grep -c . "${sec_img}" || true)
      _sec_chartn=$(grep -c . "${sec_charts}" || true)
      echo "[harbor-prewarm] #6764 secondary region ${region}: enumerated ${_sec_imgn} openova-io image(s) + ${_sec_chartn} chart(s)"

      {{- /*
       (4) distribute the shared script + the enumerated lists into a
       region-local ConfigMap, then (re)create the Job (delete a prior attempt
       first — a Job pod template is immutable). Only __REGION__ is substituted.
      */}}
      kubectl --kubeconfig "${skc}" -n "${SECONDARY_HARBOR_NAMESPACE}" create configmap cutover-secondary-harbor-prewarm \
        --from-file=secondary-harbor-prewarm.sh=/secondary-harbor-prewarm/secondary-harbor-prewarm.sh \
        --from-file=images.list="${sec_img}" \
        --from-file=charts.list="${sec_charts}" \
        --dry-run=client -o yaml | kubectl --kubeconfig "${skc}" -n "${SECONDARY_HARBOR_NAMESPACE}" apply -f -
      kubectl --kubeconfig "${skc}" -n "${SECONDARY_HARBOR_NAMESPACE}" delete job "${jobname}" --ignore-not-found=true >/dev/null 2>&1 || true
      sed "s/__REGION__/${region}/g; s/__REGISTRY_PIN_IP__/${_sec_cip:-}/g" /secondary-harbor-prewarm/secondary-harbor-prewarm-job.yaml >/tmp/sec-harbor-job.yaml
      kubectl --kubeconfig "${skc}" apply -f /tmp/sec-harbor-job.yaml

      {{- /* (5) wait bounded, fail-loud with logs — verbatim shape of the #6490 step-01 secondary wait. */}}
      echo "[harbor-prewarm] #6764 secondary region ${region}: waiting up to ${HARBOR_PREWARM_JOB_WAIT_SECONDS}s for ${jobname}"
      sec_deadline=$(( $(date +%s) + ${HARBOR_PREWARM_JOB_WAIT_SECONDS} ))
      sec_done=""
      while [ "$(date +%s)" -lt "${sec_deadline}" ]; do
        sec_ok=$(kubectl --kubeconfig "${skc}" -n "${SECONDARY_HARBOR_NAMESPACE}" get job "${jobname}" -o jsonpath='{.status.succeeded}' 2>/dev/null || echo "")
        sec_fail=$(kubectl --kubeconfig "${skc}" -n "${SECONDARY_HARBOR_NAMESPACE}" get job "${jobname}" -o jsonpath='{.status.failed}' 2>/dev/null || echo "")
        if [ "${sec_ok}" = "1" ]; then sec_done="ok"; break; fi
        if [ -n "${sec_fail}" ] && [ "${sec_fail}" -ge 3 ] 2>/dev/null; then sec_done="fail"; break; fi
        sleep "${HARBOR_PREWARM_JOB_POLL_SECONDS}"
      done
      if [ "${sec_done}" != "ok" ]; then
        echo "[harbor-prewarm] FATAL: #6764 secondary region ${region} Harbor-prewarm Job ${jobname} did not succeed within ${HARBOR_PREWARM_JOB_WAIT_SECONDS}s — its local Harbor lacks the openova-io images/charts and step-06 would strip ghcr.io leaving this region's HelmRepositories to 404 (#5359 STILL-UPSTREAM class)" >&2
        kubectl --kubeconfig "${skc}" -n "${SECONDARY_HARBOR_NAMESPACE}" logs "job/${jobname}" --tail=60 2>/dev/null || true
        exit 1
      fi
      echo "[harbor-prewarm] #6764 secondary region ${region}: Harbor-prewarm Job ${jobname} SUCCEEDED (region-local Harbor serves the openova-io project)"
    done
    if [ "${sec_any}" != "true" ]; then
      echo "[harbor-prewarm] #6764: no secondary-region kubeconfigs mounted — single-region Sovereign, secondary Harbor prewarm is a no-op"
    fi
    {{- end }}

    {{- /*
     ── Run guard (#7922): the last thing step 03 does ──
     Every image a pod runs or a workload template declares, in EVERY region
     (read again now, unioned with Phase A's walk), must be durably in the
     local registry (harbor_durable_digest); a miss gets one copy, then FATAL
     naming image, path and regions. Excluded images are named, never counted
     present. So the #7900 catalogue-only warning stays a warning only for an
     image nothing runs. What the other guards cover: values.yaml #7922 note.
    */}}
    # ── prewarm-run-guard BEGIN (#7922 extraction anchor — tests/step7922-prewarm-proxy-path.sh sources this block verbatim) ──
    prewarm_run_guard() {
      _rg_dir="$1"; _rg_seed="$2"
      rm -rf "${_rg_dir}"; mkdir -p "${_rg_dir}/cp"
      if ! prewarm_list_images "" primary >"${_rg_dir}/run.tsv"; then
        echo "[harbor-prewarm] FATAL (#7922): the run guard could not list the images of this region — it cannot certify what it cannot read"
        return 1
      fi
      for _rg_kc in /secondary-kubeconfigs/*.yaml; do
        [ -e "${_rg_kc}" ] || continue
        if ! prewarm_list_images "${_rg_kc}" "$(basename "${_rg_kc}" .yaml)" >>"${_rg_dir}/run.tsv"; then
          echo "[harbor-prewarm] FATAL (#7922): the run guard could not list the images of follower region $(basename "${_rg_kc}" .yaml) — it cannot certify what it cannot read"
          return 1
        fi
      done
      if [ -n "${_rg_seed}" ] && [ -f "${_rg_seed}" ]; then cat "${_rg_seed}" >>"${_rg_dir}/run.tsv"; fi
      awk -F'\t' '$1 != "" { if (!($1 in r)) { o[++n] = $1; r[$1] = $2 } else if (index("," r[$1] ",", "," $2 ",") == 0) { r[$1] = r[$1] "," $2 } } END { for (i = 1; i <= n; i++) print o[i] "\t" r[o[i]] }' "${_rg_dir}/run.tsv" | sort >"${_rg_dir}/refs.tsv"
      : >"${_rg_dir}/missing.txt"
      _rg_n=0; _rg_pn=0; _rg_excl=0; _rg_healed=0
      {{- /* The Phase A / A3 latches carry over, as A3 carries Phase A's: a heal copy must not re-pay a dead proxy's timeout. */}}
      for _rg_l in "${cpdir}"/.proxy_down "${cpdir}"/.ratelimited.* "${cat_cpdir:-/nonexistent}"/.proxy_down "${cat_cpdir:-/nonexistent}"/.ratelimited.*; do
        if [ -e "${_rg_l}" ]; then cp "${_rg_l}" "${_rg_dir}/cp/" 2>/dev/null || true; fi
      done
      _rg_cpdir_saved="${cpdir}"
      cpdir="${_rg_dir}/cp"
      while IFS="$(printf '\t')" read -r _rg_ref _rg_regions; do
        [ -z "${_rg_ref}" ] && continue
        _rg_n=$((_rg_n+1))
        _rg_lp=$(offlinemirror_local_paths "${_rg_ref}")
        case "${_rg_lp}" in
          "")
            _rg_excl=$((_rg_excl+1))
            echo "[harbor-prewarm] run guard: EXCLUDED ${_rg_ref} (runs in: ${_rg_regions}) — offlineMirror.excluded*, not served by the local registry by design"
            continue ;;
          __UNMAPPED__*)
            printf '%s -> unmapped registry host %s (runs in: %s)\n' "${_rg_ref}" "$(printf '%s' "${_rg_lp}" | awk '{print $2}')" "${_rg_regions}" >>"${_rg_dir}/missing.txt"
            continue ;;
        esac
        _rg_absent=""
        for _rg_p in ${_rg_lp}; do
          _rg_pn=$((_rg_pn+1))
          [ -n "$(harbor_durable_digest "${_rg_p}")" ] || _rg_absent="${_rg_absent} ${_rg_p}"
        done
        [ -z "${_rg_absent}" ] && continue
        echo "[harbor-prewarm] run guard: ${_rg_ref} (runs in: ${_rg_regions}) is not durably in the local registry (${_rg_absent# }) — copying it now"
        copy_one "${_rg_ref}" </dev/null || true
        for _rg_p in ${_rg_absent}; do
          if [ -n "$(harbor_durable_digest "${_rg_p}")" ]; then
            _rg_healed=$((_rg_healed+1))
          else
            printf '%s -> %s (runs in: %s)\n' "${_rg_ref}" "${_rg_p}" "${_rg_regions}" >>"${_rg_dir}/missing.txt"
          fi
        done
      done <"${_rg_dir}/refs.tsv"
      cpdir="${_rg_cpdir_saved}"
      _rg_mn=$(grep -c . "${_rg_dir}/missing.txt" || true)
      if [ "${_rg_mn}" -gt 0 ]; then
        echo "[harbor-prewarm] FATAL (#7922): ${_rg_mn} image(s) that this Sovereign runs, or that the release it is given pins (its charts for an installed release, its kit manifests and Flux Kustomizations), are not in its own registry. Under the deny-egress hold, and after it, each pod that needs one fails to pull on its next start:"
        sed 's/^/  RUNNING-MISSING /' "${_rg_dir}/missing.txt"
        return 1
      fi
      echo "[harbor-prewarm] run guard (#7922): PASS — ${_rg_n} image(s) that pods run, workload templates declare in every region or the release pins (charts of installed releases, kit manifests and Flux Kustomizations); ${_rg_pn} local path(s) durably present (${_rg_healed} copied by the guard), ${_rg_excl} excluded by design"
    }
    # ── prewarm-run-guard END ──
    for _rs_f in "${cat_img_installed:-}" "${kit_img:-}"; do prewarm_release_seed "${_rs_f}" "${run_images_file}"; done
    prewarm_run_guard /tmp/prewarm-run-guard "${run_images_file}" || exit 1
    {{- if and .Values.registryPivot.enabled (or .Values.secondaryRegions.prewarmSecondaryHarbor .Values.secondaryRegions.replicaRegion) }}
    {{- /*
     #7938 — cutover step 04 in every follower region, once the guard above has certified
     the registry: 04's cutover-follower-registry-pivot (files/follower-registry-pivot.sh).
     A release delivery runs this step 03 as its prewarm, so an installed Sovereign gets
     its followers pivoted by the delivery that carries this line; the step fails with it.
    */}}
    sh /follower-registry-pivot/follower-registry-pivot.sh || exit 1
    {{- end }}
  podSpec: |
    serviceAccountName: {{ include "bp-self-sovereign-cutover.serviceAccountName" . }}
    restartPolicy: Never
    activeDeadlineSeconds: {{ .Values.stepTimeouts.harborPrewarmSeconds }}
    containers:
      - name: harbor-prewarm
        {{- /*
         G66: switch from curl-only to alpine/k8s (has kubectl) + apt
         install skopeo at runtime. alpine/k8s is already the canonical
         cutover-step image carrying kubectl; adding skopeo via apk
         keeps the image small + composable.
        */}}
        image: {{ include "bp-self-sovereign-cutover.image" (dict "repository" .Values.images.kubectl.repository "tag" .Values.images.kubectl.tag "cutoverPhase" "pre" "Values" .Values) }}
        imagePullPolicy: IfNotPresent
        env:
          - name: HARBOR_INTERNAL_URL
            value: {{ .Values.sovereign.harborInternalURL | quote }}
          - name: HARBOR_PUBLIC_URL
            value: {{ .Values.sovereign.harborPublicURL | quote }}
          - name: HARBOR_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.harbor.adminSecretRef.name }}
                key: {{ .Values.harbor.adminSecretRef.usernameKey }}
                optional: true
          - name: HARBOR_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.harbor.adminSecretRef.name }}
                key: {{ .Values.harbor.adminSecretRef.passwordKey }}
          {{- /*
           G66: GHCR PAT from flux-system/ghcr-pull (intact at step 03
           time, BEFORE step 06 phase-0 strips ghcr.io entry). The
           dockerconfigjson auth field carries `<user>:<PAT>` base64-
           encoded — Phase A parses it to extract the PAT for skopeo
           --src-creds.
          */}}
          - name: GHCR_DOCKERCONFIG
            valueFrom:
              secretKeyRef:
                name: {{ .Values.harbor.ghcrSecretRef.name }}
                key: {{ .Values.harbor.ghcrSecretRef.dockerConfigKey }}
          - name: GHCR_DOCKERCONFIG_NAMESPACE
            value: {{ .Values.harbor.ghcrSecretRef.namespace | quote }}
          {{- /*
           Phase A2 (Refs #3627 #3379): the cutover pivot set — the
           namespace holding the Flux HelmRepositories that step-06 repoints
           to local Harbor, and the names of those openova-io HelmRepositories.
           Phase A2 reads the chart+version off every HelmRelease whose
           sourceRef.kind=HelmRepository and whose sourceRef.name is in this
           set, then skopeo-mirrors the chart OCI artifact into local Harbor
           so the charts are PULLABLE post-cutover (without this, step-06
           only pivots the URL — the chart artifacts themselves never reach
           local Harbor, so the first post-strip (re)pull 404s).
          */}}
          - name: HELMREPO_NAMESPACE
            value: {{ .Values.helmRepositories.namespace | quote }}
          - name: UPSTREAM_PREFIX
            value: {{ .Values.helmRepositories.upstreamPrefix | quote }}
          {{- /*
           #3944 (Refs #3379 #3642 #3927): per-`skopeo copy` command timeout.
           A `skopeo copy` whose TCP connection is ESTABLISHED but then
           silently STALLS mid-blob (no bytes, no reset — common on a
           freshly-bootstrapped/throttled Sovereign network, or against the
           registry.<fqdn> front door that accepts the connect but stops
           responding) hangs INDEFINITELY: `--retry-times` only fires on an
           ERROR, never on a stuck-but-alive connection. With no command
           timeout the copy never returns, the worker never drains, the parent
           `wait` blocks forever, and the whole Job sits "active" until the
           step's activeDeadlineSeconds (9600s post-#5298) kills it — then
           catalyst-api auto-re-runs the DeadlineExceeded step (cutover.go) and
           the next full-deadline hang
           begins. Back-to-back deadline cycles = the "step-03 active for hours,
           never completing" symptom seen live on hw171 (dep 3963e9267c10a90d)
           right after #3927 unstuck step-02. `--command-timeout` bounds each
           individual copy so a stalled connection FAILS FAST → the per-image
           outer retry loop (PREWARM_COPY_ATTEMPTS) re-attempts with backoff,
           which is exactly the self-heal path that was unreachable while the
           copy hung. 1200s (20m) is generous for the largest multi-layer
           PRIVATE openova-io image over throttled egress yet collapses an
           infinite hang into a bounded, retryable failure.
          */}}
          - name: PREWARM_SKOPEO_TIMEOUT
            value: {{ .Values.prewarm.skopeoCommandTimeout | default "1200s" | quote }}
          {{- /*
           #4529 (Refs #3379): TLS-verify on the skopeo copy DESTINATION (the
           PUBLIC registry.<fqdn> = HARBOR_HOST — restored by #5051 round 2; the
           #5036/#5037 in-cluster dest is unusable for pushes because Harbor's
           bearer-token realm is hard-https on the echoed host and nothing
           in-cluster terminates TLS). DEFAULT false — the target's
           wildcard cert was LE-STAGING/untrusted on a fresh prov (and a Job-Pod
           skopeo has no node trust store even with production LE), so verifying the
           dest against the public CA x509-failed every push (live keystone
           25aadcfc: push_ok=0 push_fail=30 → step-03 FATAL → cutover never reached
           the deny-egress hold). Post-#5036 the dest is the plain-HTTP in-cluster
           Service on :80; DEST_TLS_VERIFY=false ALSO drives skopeo's https->http
           ping fallback (containers/image retries http when InsecureSkipVerify is
           set), so the push lands over HTTP with no cert involved. Trust here is the
           cluster network, not a public CA. The SRC (ghcr.io) verification is
           ALWAYS true (external public host).
          */}}
          - name: PREWARM_DEST_TLS_VERIFY
            value: {{ .Values.prewarm.destTLSVerify | default false | quote }}
          {{- /*
           #4975 (Refs #3379 #3695) — the offline-mirror coverage map + the
           local/mothership hosts, rendered from .Values.offlineMirror by the
           shared helpers. Phase A3 resolves every enumerated image to its
           local Harbor push path(s) via /resolver/resolver.sh, which reads
           THESE — the SAME env step-08's completeness HEAD reads.
          */}}
          - name: HOST_PROJECT_MAP
            value: {{ include "bp-self-sovereign-cutover.hostProjectMapInline" . | quote }}
          - name: EXCLUDED_HOSTS
            value: {{ include "bp-self-sovereign-cutover.excludedHostsInline" . | quote }}
          - name: EXCLUDED_SUBSTRINGS
            value: {{ include "bp-self-sovereign-cutover.mirrorExcludedSubstringsInline" . | quote }}
          - name: LOCAL_REGISTRY_HOST
            value: {{ include "bp-self-sovereign-cutover.localRegistryHost" . | quote }}
          {{- /* The other name of the local registry, the projects a pivot step writes that the map does not name, and the proxy-cache projects (_helpers.tpl). */}}
          - name: LOCAL_REGISTRY_ALIASES
            value: {{ include "bp-self-sovereign-cutover.localRegistryAliasesInline" . | quote }}
          - name: PIVOT_PROJECT_MAP
            value: {{ include "bp-self-sovereign-cutover.pivotProjectMapInline" . | quote }}
          - name: PROXY_CACHE_PROJECTS
            value: {{ include "bp-self-sovereign-cutover.proxyCacheProjectsInline" . | quote }}
          - name: MOTHERSHIP_HOST
            value: {{ include "bp-self-sovereign-cutover.mothershipHost" . | quote }}
          {{- /*
           #5007 (Refs #5051 #5036 #4652 #4682) — in-cluster CoreDNS pin of the
           local registry host for the PRE-pivot prewarm phase. #5051 round 2
           settled that the skopeo push DEST must be the PUBLIC host registry.<fqdn>
           (only the TLS-terminating gateway serves Harbor's hard-https bearer
           realm), but it was left resolving via PUBLIC DNS → still breaks on a
           stale `*.<pool>` wildcard shadow (hw241 dead 49.12.16.160) or a mid-push
           NXDOMAIN flap (hw252). harbor-prewarm runs runAsNonRoot(1000) +
           readOnlyRootFilesystem + drop-ALL, so it CANNOT write its own /etc/hosts;
           instead it installs a kube-system `coredns-custom` `.server` override
           (registry.<fqdn> -> the cilium-gateway Service ClusterIP) so CoreDNS —
           which every pod already queries — answers registry.<fqdn> in-cluster,
           independent of the Sovereign zone / public wildcard. The ClusterIP is
           ALWAYS allocated (even TYPE=ClusterIP with no VIP on the §854 ELB-direct
           model, #5007 round 2 / 0.1.129) and ClusterIP:443 terminates the wildcard
           TLS + serves the /service/token realm (proven #4637). Reuses the SAME
           gateway-Service values PR #5008 added for the step-04 node pin + the
           configmaps create/get/patch RBAC the runner SA already holds cluster-wide.
          */}}
          - name: LOCAL_REGISTRY_PIN_ENABLED
            value: {{ .Values.registryPivot.localRegistryHostPin.enabled | quote }}
          - name: GATEWAY_LB_SVC_NAME
            value: {{ .Values.registryPivot.localRegistryHostPin.gatewayServiceName | quote }}
          - name: GATEWAY_LB_SVC_NAMESPACE
            value: {{ .Values.registryPivot.localRegistryHostPin.gatewayServiceNamespace | quote }}
          {{- /*
           #4982 (Refs #3379) — settled-roll pre-flight toggle. When true
           (default) Phase A0 REFUSES to build the mirror while any HelmRelease
           or Deployment/StatefulSet on the host cluster is mid-roll, so the
           mirror can never capture running tags the cutover then rolls away
           from (running != desired → step-06/step-08 404 under the deny-egress
           hold). Set false only as an emergency override on a manually
           confirmed-settled env.
           NB: no `| default true` — Sprig `default` treats bool false as empty
           (`false | default true` → true), which would silently break the
           disable override. The key is always present in values.yaml.
          */}}
          - name: SETTLED_ROLL_PREFLIGHT
            value: {{ .Values.prewarm.settledRollPreflight.enabled | quote }}
          {{- /*
           #5391 — the named-override audit-record target. Phase A0 writes
           every honored settled-roll override (the
           catalyst.openova.io/cutover-settled-roll-override annotation,
           validated fail-closed) into the cutover status ConfigMap keys
           settledRollOverrides / settledRollOverridesAt so
           GET /sovereign/cutover/status + the admin console can show a
           walk that an override was used; a clean pass clears the record.
           An override that cannot be recorded FATALs the step — no
           unaudited carve-outs.
          */}}
          - name: STATUS_CONFIGMAP_NAME
            value: {{ .Values.status.configMapName | quote }}
          - name: STATUS_CONFIGMAP_NAMESPACE
            value: {{ .Release.Namespace | quote }}
          {{- /*
           #4994 (Refs #3379), #5030 — content-digest idempotency. When true
           (default) each skopeo copy first compares the SOURCE manifest digest
           (`skopeo inspect --raw | sha256sum` on the SOURCE — the sha256 of the
           exact manifest bytes IS the digest, single-arch AND multi-arch LISTS,
           no blob pulled) against the DEST's DURABLE digest and SKIPS the copy
           only on a real match. #5030: the DEST digest now comes from the Harbor
           ARTIFACT API (GET /api/v2.0/.../artifacts/<ref>, served by Harbor CORE
           against its DB — NEVER pull-through), NOT `skopeo inspect --raw` on the
           dest registry endpoint, which pull-throughs on a proxy-cache-reachable
           dest and false-"current"-skipped an image the step-08 gate then 404'd
           (hw244 otel-operator; hw243 velero/cnpg). A prewarm RE-RUN (catalyst-api
           re-fires the step after a DeadlineExceeded) or an already-mirrored image
           then costs a cheap API GET instead of re-transferring every
           multi-hundred-MB blob from the mothership (the hw240 #4994 "step-03
           Running 0/1 for 68m" symptom). Fail-CLOSED: any miss (source
           unreachable, dest 404/absent/partial, API error, empty/mismatched dest
           digest) FALLS THROUGH to the full copy — a skip happens ONLY on a
           positive durable src==dst match. Set false to force re-copy.
          */}}
          - name: PREWARM_SKIP_IF_PRESENT
            value: {{ .Values.prewarm.skipIfAlreadyPresent | quote }}
          {{- /*
           #5095 (Refs #5093 #3379) — flap-tolerant pacing for MOTHERSHIP-
           PROXY-sourced copies. Docker-Hub-sourced bootstrap images route
           through the mothership Harbor proxy-cache (harbor.openova.io/
           proxy-dockerhub/...), so step-03 has a hard PRE-cutover tether to
           mothership reachability from the Sovereign. During the 2026-07-15
           05:20–05:55Z Omantel→Cogent transit black-hole toward the
           mothership /24 (hw255 dep 5762118f, #5093 — the server was healthy
           worldwide, only the path was dead) EVERY proxy-sourced copy FAILed
           exit=1 while the ghcr.io copies were fine, and the shared
           PREWARM_COPY_ATTEMPTS=3 / fixed-5s budget exhausted INSIDE the
           35-min flap → Phase A push_fail=6 → FATAL → a full extra Job
           re-run (~30-40 min on the keystone clock). Proxy-sourced refs now
           get their OWN attempts budget (default 6) with EXPONENTIAL
           backoff (base 30s doubling: 30+60+120+240+480 = 930s ≥ 15 min of
           inter-attempt spacing) so a routine per-prefix transit flap is
           ridden out instead of FATALing the step; copy_one ALSO retries the
           SAME image from its canonical DIRECT upstream (derived
           mechanically from the proxy path via the #4975 coverage map)
           before an attempt counts as failed. Non-proxy sources keep the
           existing 3×5s discipline unchanged. FATAL-on-any-failure (the
           sovereignty guarantee) is PRESERVED — this only widens the
           transient window the step can survive.
          */}}
          - name: PREWARM_PROXY_COPY_ATTEMPTS
            value: {{ .Values.prewarm.proxyCopyAttempts | default 6 | quote }}
          - name: PREWARM_PROXY_BACKOFF_BASE_SECONDS
            value: {{ .Values.prewarm.proxyBackoffBaseSeconds | default 30 | quote }}
          {{- /*
           #5095 round 2 (Refs #5093 #5298) — proxy-DOWN direct-first routing.
           The 0.1.136 direct-source fallback fires only AFTER the proxy-source
           `skopeo copy` returns non-zero, and that proxy copy is bounded ONLY by
           the #3944 --command-timeout (PREWARM_SKOPEO_TIMEOUT, 1200s). When the
           mothership Harbor proxy is unreachable for the WHOLE step (a sustained
           transit hole toward the mothership /24, not a brief flap — hw281 dep
           observed the proxy dead for the full prewarm), EVERY proxy-sourced
           image independently burns that timeout on the dead proxy BEFORE the
           fast direct upstream is even tried — the per-image "proxy timeout tax"
           that dragged the direct-fallback wave to ~100 min for 140 images and
           tripped the step deadline (raised separately in #5298/#5299). This
           env drives a ONE-TIME cheap HTTP reachability probe of the mothership
           proxy at the top of the copy wave; on an unreachable proxy the step
           latches proxy-DOWN and copy_one tries the DIRECT upstream FIRST for
           proxy-sourced refs (proxy kept as the secondary), so the wave runs at
           full parallel speed with no per-image timeout tax. The latch also
           trips adaptively when an in-flight proxy leg fails and the proxy's
           /v2/ then does not answer, catching a proxy that dies mid-wave (after
           the probe passed); a proxy that answers but cannot serve one image is
           not latched (#7922). Source selection
           only — the DEST path (host-swap, path preserved) is untouched, so
           step-04/07/08 resolve the identical LOCAL artifact and the
           sovereignty guarantee (every image in local Harbor before deny-egress)
           is intact. Default true; set false to keep strict proxy-first.
          */}}
          - name: PROXY_DIRECT_FIRST_ENABLED
            value: {{ .Values.prewarm.proxyDownDirectFirst.enabled | quote }}
          - name: PROXY_PROBE_TIMEOUT_SECONDS
            value: {{ .Values.prewarm.proxyDownDirectFirst.probeTimeoutSeconds | default 8 | quote }}
          - name: PROXY_PROBE_ATTEMPTS
            value: {{ .Values.prewarm.proxyDownDirectFirst.probeAttempts | default 3 | quote }}
          {{- /*
           #5204 (Refs #5209 #3379) — Phase A4 Crossplane xpkg package warm.
           The upstream/mothership/registry-path literals come from the SAME
           .Values.crossplaneProviderPivot block step-11 reads, so the warm
           set and the pivot target can never drift apart (no second
           hand-list — the #4975 single-source discipline).
          */}}
          - name: XPKG_PREWARM_ENABLED
            value: {{ .Values.prewarm.xpkgPackages.enabled | quote }}
          - name: SOVEREIGN_FQDN
            value: {{ .Values.sovereign.fqdn | quote }}
          - name: XPKG_UPSTREAM_HOST
            value: {{ .Values.crossplaneProviderPivot.upstreamHost | quote }}
          - name: XPKG_REGISTRY_PATH
            value: {{ .Values.crossplaneProviderPivot.registryPath | quote }}
          - name: XPKG_MOTHERSHIP_PROXY_PREFIX
            value: {{ .Values.crossplaneProviderPivot.mothershipProxyPrefix | quote }}
          {{- include "bp-self-sovereign-cutover.tofuProvidersEnv" . | nindent 10 }}
          {{- /*
           #5232 (Refs #5226 #5204) — the tag->digest map Phase A4 records
           for step-11. Harbor proxy-cache NEVER records TAGS for
           pulled-through xpkg artifacts (manual tag-create 401s on proxy
           projects; a tag manifest GET serves the index but does not record
           the tag either — live hw274 dep d51a69f885872a81), so the step-11
           pivot ref must be DIGEST-addressed. Phase A4 resolves each
           package's digest at warm time (sha256 of the exact pulled-through
           manifest bytes) and persists it here; step-11 reads the SAME
           values-driven ConfigMap name (no drift).
          */}}
          - name: XPKG_DIGEST_CM
            value: {{ .Values.prewarm.xpkgPackages.digestMapConfigMapName | quote }}
          - name: RELEASE_NAMESPACE
            value: {{ .Release.Namespace | quote }}
          {{- /*
           #5237 round 2 (Refs #5007) — Phase A2-pins: union the chart-mirror
           set with the EXACT versions the bootstrap-kit slot pins in the
           LOCAL GITEA MIRROR reference — the frozen commit flux consumes
           once step-05 pivots the GitRepository, immune to anything a
           mid-cutover merge publishes upstream. The slot files are fetched
           from the local Gitea (step-01 mirrored them) via the SAME
           catalyst-gitea-token PAT steps 01/05 read, and parsed by the
           shared cutover-bootstrap-kit-pins extractor (03b — one parser for
           step-03, step-06 and the #5265 Day-2 reconciler).
           NB: bare `| quote` (NOT `| default true`) — sprig `default`
           treats a literal false as empty and would flip an explicit
           disable back to true (sprig_default_bool_unsafe); the script's
           `: "${VAR:=true}"` restores the on-state for a nil render.
          */}}
          - name: PREWARM_BOOTSTRAP_KIT_PINS
            value: {{ .Values.prewarm.bootstrapKitPins.enabled | quote }}
          - name: GITEA_INTERNAL_URL
            value: {{ .Values.sovereign.giteaInternalURL | quote }}
          - name: GITEA_ORG
            value: {{ .Values.gitea.org | quote }}
          - name: GITEA_REPO
            value: {{ .Values.gitea.repo | quote }}
          - name: UPSTREAM_BRANCH
            value: {{ .Values.upstream.branch | quote }}
          - name: PAT_SOURCE_NAMESPACE
            value: {{ .Values.gitRepositorySecretRef.patSourceNamespace | quote }}
          - name: PAT_SOURCE_SECRET_NAME
            value: {{ .Values.gitRepositorySecretRef.patSourceSecretName | quote }}
          - name: PAT_SOURCE_KEY
            value: {{ .Values.gitRepositorySecretRef.patSourceKey | quote }}
          {{- /*
           #5443 — Phase A2-catalog: mirror the MARKETPLACE's chart set (the
           live Blueprint CRs) on top of the two installed-derived
           enumerations, then GUARD that every contractual entry resolves in
           the pivoted registry. Without this the cutover repoints the
           marketplace resolver at a registry it never stocked.
           NB: bare `| quote` (NOT `| default true`) — sprig `default` treats a
           literal false as empty and would flip an explicit disable back to
           true (sprig_default_bool_unsafe); the script's `: "${VAR:=…}"`
           restores the on-state for a nil render.
          */}}
          - name: PREWARM_CATALOG_CHARTS
            value: {{ .Values.prewarm.catalogCharts.enabled | quote }}
          - name: PREWARM_CATALOG_GUARD
            value: {{ .Values.prewarm.catalogCharts.guard.enabled | quote }}
          - name: PREWARM_CATALOG_HARD_VISIBILITY
            value: {{ .Values.prewarm.catalogCharts.hardVisibility | quote }}
          {{- /*
           #5442 — warm images from the PINNED CHART VERSIONS, unioned with
           (never replacing) the live-cluster walk.
          */}}
          - name: PREWARM_CHART_IMAGES
            value: {{ .Values.prewarm.chartImages.enabled | quote }}
          - name: PREWARM_CHART_IMAGES_FATAL
            value: {{ .Values.prewarm.chartImages.fatal | quote }}
          {{- /*
           #5468 — per-image single-platform copy exception (see
           prewarm_multiarch_flags). Space-separated ref substrings; empty
           means EVERY copy stays on the #4975 `--multi-arch all` default.
          */}}
          - name: PREWARM_SINGLE_PLATFORM_SUBSTRINGS
            value: {{ include "bp-self-sovereign-cutover.singlePlatformSubstringsInline" . | quote }}
          - name: PREWARM_SINGLE_PLATFORM_OS
            value: {{ .Values.prewarm.singlePlatform.os | default "linux" | quote }}
          - name: PREWARM_SINGLE_PLATFORM_ARCH
            value: {{ .Values.prewarm.singlePlatform.arch | default "amd64" | quote }}
          - name: CATALOG_BLUEPRINT_RESOURCE
            value: {{ .Values.prewarm.catalogCharts.blueprintResource | quote }}
          - name: CATALOG_BLUEPRINT_RESOURCE_FALLBACK
            value: {{ .Values.prewarm.catalogCharts.blueprintResourceFallback | quote }}
          {{- if or .Values.secondaryRegions.prewarmSecondaryHarbor .Values.secondaryRegions.replicaRegion }}
          {{- /*
           #6764 — inputs for the secondary-region Harbor prewarm leg. HARBOR_HOST,
           LOCAL_REGISTRY_PIN_ENABLED, GATEWAY_LB_SVC_* and UPSTREAM_PREFIX are
           already in this env (the leg reuses them); these tell it WHERE in each
           secondary to prep+stamp and HOW LONG to wait. Rendered ONLY when the
           flag is set so single-region provs stay byte-identical.
          */}}
          - name: SECONDARY_HARBOR_NAMESPACE
            value: {{ .Values.secondaryRegions.secondaryHarborNamespace | quote }}
          - name: SECONDARY_GHCR_SOURCE_NAMESPACE
            value: {{ .Values.harbor.ghcrSecretRef.namespace | quote }}
          - name: SECONDARY_GHCR_SOURCE_SECRET
            value: {{ .Values.harbor.ghcrSecretRef.name | quote }}
          - name: SECONDARY_GHCR_DEST_SECRET
            value: {{ .Values.secondaryRegions.secondaryGhcrSecretName | quote }}
          - name: HARBOR_PREWARM_JOB_WAIT_SECONDS
            value: {{ .Values.secondaryRegions.prewarmJobWaitSeconds | quote }}
          - name: HARBOR_PREWARM_JOB_POLL_SECONDS
            value: {{ .Values.secondaryRegions.prewarmJobPollSeconds | quote }}
          {{- end }}
        volumeMounts:
          - name: prewarm
            mountPath: /work
            readOnly: true
          - name: chart-mirror-names
            mountPath: /chart-mirror
            readOnly: true
          - name: offline-mirror-resolver
            mountPath: /resolver
            readOnly: true
          - name: bootstrap-kit-pins
            mountPath: /pin-extractor
            readOnly: true
          - name: catalog-chart-set
            mountPath: /catalog-set
            readOnly: true
          - name: tmp
            mountPath: /tmp
          - name: step-script
            mountPath: /step-script
          {{- if or .Values.secondaryRegions.prewarmSecondaryHarbor .Values.secondaryRegions.replicaRegion }}
          {{- /*
           #6764 — optional secondary-region kubeconfigs (the cutover-secondary-
           kubeconfigs Secret catalyst-api materialises at run start; empty on a
           single-region Sovereign so the leg no-ops) + the shared secondary
           prewarm script this leg distributes into each secondary's Harbor ns.
           Rendered ONLY when the flag is set so single-region provs stay
           byte-identical.
          */}}
          - name: secondary-kubeconfigs
            mountPath: /secondary-kubeconfigs
            readOnly: true
          - name: secondary-harbor-prewarm
            mountPath: /secondary-harbor-prewarm
            readOnly: true
          {{- if .Values.registryPivot.enabled }}
          - {name: follower-registry-pivot, mountPath: /follower-registry-pivot, readOnly: true}
          - {name: registry-pivot-script, mountPath: /registry-pivot-script, readOnly: true}
          {{- end }}
          {{- end }}
        command: ["/bin/sh", "/step-script/run.sh"]
        resources:
          {{- /*
           G66: bump MEMORY for skopeo image-copy work (downloads layers).
           #3608 (Refs #3568): the 500m CPU request was unschedulable on a
           tight Sovereign (every node 89–99% CPU-requested → Pending 22+ min,
           FailedScheduling Insufficient cpu — live hw145). harbor-prewarm is a
           skopeo image-copy Job (I/O-bound, not CPU-bound); right-size the CPU
           request to 100m (in line with every other cutover step Job, which
           request 25–100m). Memory stays 512Mi — skopeo needs the RAM for
           layer buffers.
          */}}
          requests: { cpu: 100m, memory: 512Mi }
          limits:   { memory: 2Gi }
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          {{- /*
           G66: skopeo needs writable /tmp for layer staging
           (emptyDir mount below provides it; root FS stays read-only).
          */}}
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
    volumes:
      - name: prewarm
        configMap:
          name: cutover-step-03-harbor-prewarm
          items:
            - key: prewarm.list
              path: prewarm.list
      - name: chart-mirror-names
        configMap:
          name: cutover-step-03-harbor-prewarm
          items:
            - key: chart-mirror-names.txt
              path: chart-mirror-names.txt
      - name: offline-mirror-resolver
        configMap:
          name: cutover-offline-mirror-resolver
          items:
            - key: resolver.sh
              path: resolver.sh
      - name: bootstrap-kit-pins
        configMap:
          name: cutover-bootstrap-kit-pins
          items:
            - key: extract-pins.sh
              path: extract-pins.sh
      - name: catalog-chart-set
        configMap:
          name: cutover-catalog-chart-set
          items:
            - key: catalog-set.sh
              path: catalog-set.sh
      - name: tmp
        emptyDir: {}
      - name: step-script
        configMap:
          name: cutover-step-03-harbor-prewarm
          items:
            - key: run.sh
              path: run.sh
      {{- if or .Values.secondaryRegions.prewarmSecondaryHarbor .Values.secondaryRegions.replicaRegion }}
      - name: secondary-kubeconfigs
        secret:
          secretName: {{ .Values.secondaryRegions.kubeconfigSecretName }}
          optional: true
      - name: secondary-harbor-prewarm
        configMap:
          name: cutover-secondary-harbor-prewarm-script
          defaultMode: 0755
      {{- if .Values.registryPivot.enabled }}
      - {name: follower-registry-pivot, configMap: {name: cutover-follower-registry-pivot}}
      - {name: registry-pivot-script, configMap: {name: registry-pivot-script}}
      {{- end }}
      {{- end }}
