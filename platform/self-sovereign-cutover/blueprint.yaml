apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-self-sovereign-cutover
spec:
  version: 0.1.257
  card:
    title: Self-Sovereignty Cutover
    summary: "Post-handover cutover Blueprint — pivots every upstream tether (GitOps source, OCI HelmRepositories, registry mirrors, catalyst-api repo env) to the local Sovereign. See ADR-0002 + issue #790."
    icon: cutover.svg
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  class: platform-component
  lifecycle: experimental
  manifests:
    chart: bp-self-sovereign-cutover

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active ONLY. One-shot Jobs at handover (dormant on standby
  #   until activated). No cross-cluster sync; if mgmt-A is lost mid-cutover
  #   the cutover must be re-run from standby once promoted.
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # No external endpoint — one-shot Jobs only.
  endpoints: []

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # Trigger flow gated through catalyst-api auth; no direct user surface
  # on bp-self-sovereign-cutover itself.
  sso:
    realm: sovereign
    protocolMapper: oidc
    silentLogin: false

  placementSchema:
    modes: [single-region]
    default: single-region
