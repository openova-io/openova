apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-self-sovereign-cutover
  labels:
    catalyst.openova.io/section: pts-2-3-per-sovereign-supporting-services
    catalyst.openova.io/tier: catalyst-cp
spec:
  version: 0.1.173
  card:
    title: self-sovereignty-cutover
    summary: |
      Post-handover Self-Sovereignty Cutover. After bp-gitea + bp-harbor
      reach Ready, this Blueprint installs DORMANT on the new Sovereign.
      The catalyst-api cutover endpoint (#792) stamps Jobs from the
      eight PodSpec ConfigMaps shipped here and pivots EVERY upstream
      reference (GitOps source, OCI HelmRepositories, container-registry
      mirrors, catalyst-api repo env) to the local Sovereign — eliminating
      runtime dependencies on github.com / ghcr.io / harbor.openova.io.
      Trigger is operator-driven (admin-console button) or auto-fired
      after the first successful operator login on the new Sovereign.
      See ADR-0002 + issue #790 for the full tether map.
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  manifests:
    chart: ./chart
  depends:
    - blueprint: bp-gitea
    - blueprint: bp-harbor
    # #4639: step-04 (registry-pivot, the Dragonfly rewrite) flips the
    # bp-dragonfly dfdaemon mesh upstream ghcr -> local Harbor + adds the
    # registry.<fqdn> -> cilium-gateway hostAlias, so the dfdaemon mesh must
    # be present before the post-handover cutover runs.
    - blueprint: bp-dragonfly

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active ONLY. One-shot Jobs at handover (dormant on standby
  #   until activated). No cross-cluster sync; if mgmt-A is lost mid-cutover
  #   the cutover must be re-run from standby once promoted.
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        replication:
          backend: none
          mode: none
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # No external endpoint — one-shot Jobs only.
  endpoints: []

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # Trigger flow gated through catalyst-api auth; no direct user surface
  # on bp-self-sovereign-cutover itself.
  sso:
    realm: sovereign
    protocolMapper: oidc
    silentLogin: false

  # ── G117.6: Multi-instance ─────────────────────────────────────────────
  # One-shot per Sovereign — installs exactly once, runs to completion.
  multiInstance:
    enabled: false
