apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-clickhouse
spec:
  # G117.1 (Wave-1/B3) — scaffold-only Application Blueprint.
  #
  # This Blueprint folder currently only ships a README; the upstream chart
  # is tracked but not yet packaged. The four new blocks below declare the
  # intended target-state per docs/sessions/2026-06-02-per-blueprint-topology-audit.md,
  # so the catalog UI, application-controller, and SSO fan-out can plan
  # against it ahead of the chart being authored.
  version: 0.0.0
  visibility: unlisted
  class: data-service
  lifecycle: experimental
  card:
    title: ClickHouse
    summary: Column-oriented OLAP database. Sub-second queries over billions of rows.
    description: Distributed columnar database for real-time analytics. Pairs with bp-loki for log analytics at scale.
    icon: clickhouse.svg
    license: Apache-2.0
    tags: [analytics, olap, columnar, sql, clickhouse]
    docs: https://clickhouse.com/docs
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-active
    - singleton
    defaults:
      multi-region: active-active
      single-region: singleton
    perTopology:
      active-active:
        replication:
          backend: none
          mode: async
        switchover:
          mechanism: none
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: active
      singleton:
        placement:
          tier: rtz
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: http
    hostnameTemplate: clickhouse.{{.OrgDomain}}
    port: 8443
    protocol: https
    tls: true
    visibility: private
    launchDefault: false
    ssoEnabled: false
  multiInstance:
    enabled: true
    maxPerOrg: 5
    namingTemplate: "{{.AppName}}-{{.InstanceID}}"
  # ── /G117.1 ──
  configSchema:
    type: object
    properties:
      shards:
        type: integer
        default: 1
        minimum: 1
        maximum: 8
      replicas:
        type: integer
        default: 2
        minimum: 1
        maximum: 3
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-clickhouse
