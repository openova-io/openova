# Catalyst Blueprint umbrella metadata — the upstream chart is now resolved
# as a Helm subchart via Chart.yaml `dependencies:`. This values.yaml carries
# both:
#   1. The catalystBlueprint metadata block (provenance + version) so
#      observability/audit pipelines can inspect the artifact and report
#      which upstream chart + version is bundled.
#   2. The upstream subchart values overlay under the `crossplane:` key
#      (umbrella-chart convention — the dependency name from Chart.yaml is
#      the values namespace).

global:
  # INERT for this chart — kept only as a documented placeholder (#560),
  # consistent with the peer umbrella charts (bp-flux, bp-kyverno). The
  # upstream crossplane subchart has NO `global.imageRegistry` (nor an
  # `image.registry`) handling — its Deployment/rbac-manager templates read
  # `crossplane.image.repository` verbatim. So the effective image override
  # is `crossplane.image.repository` (set below), NOT this key.
  imageRegistry: ""

catalystBlueprint:
  upstream: { chart: crossplane, version: "1.18.0", repo: "https://charts.crossplane.io/stable" }

# ─── Upstream chart values (subchart key: crossplane) ─────────────────────
# Generated by docs/PROVISIONING-PLAN.md tickets [F] chart Pass 105+.
crossplane:
  # Core controller image — route through the Sovereign Harbor pull-through
  # proxy instead of pulling DIRECT from xpkg.upbound.io (#5281).
  #
  # The upstream default `xpkg.upbound.io/crossplane/crossplane` is the ONLY
  # image on a fresh Sovereign that pulls straight from upbound's registry —
  # every other platform image already routes through `harbor.openova.io/
  # proxy-*` (bp-flux, bp-openbao, bp-cnpg, …). During Phase-1 convergence,
  # BEFORE the cutover registry-pivot rewrites node containerd certs.d, an
  # `xpkg.upbound.io` 503 (observed live on hw279 dep 059126bb, 2026-07-20)
  # wedges `Init:ErrImagePull` on crossplane-system → bp-crossplane install
  # stalls → bp-crossplane-claims DependencyNotReady → bp-catalyst-platform
  # (console/api umbrella) blocked → the whole fresh prov is hostage to
  # upbound's uptime.
  #
  # We route via the already-live `proxy-dockerhub` project (NOT `proxy-xpkg`):
  #   * `docker.io/crossplane/crossplane` publishes the identical core release
  #     (`:v1.18.0` present), so proxy-dockerhub's pull-through cache serves it.
  #   * The mothership `harbor.openova.io` carries proxy-dockerhub today but
  #     has NO proxy-xpkg project (#4541's create workflow is founder-gated and
  #     unran) — a proxy-xpkg route would 404 in Phase-1.
  #   * At cutover the local Harbor mirrors docker.io→proxy-dockerhub and the
  #     harbor-prewarm Phase-A3 live-enumeration covers this ref automatically,
  #     whereas `xpkg.upbound.io` is in `offlineMirror.excludedHosts`.
  # This ref is subject to the same certs.d pivot as every other
  # `harbor.openova.io/proxy-*` image, so it survives the sovereignty cutover.
  # `image.tag` stays empty → resolves to `v<appVersion>` = v1.18.0. This
  # single key covers both the core Deployment and rbac-manager (both upstream
  # templates read `crossplane.image.repository`).
  image:
    repository: harbor.openova.io/proxy-dockerhub/crossplane/crossplane
  # Crossplane CORE resources (#4212 Seam 1+2 — runtime-Observe blocker).
  #
  # History: the original 1Gi limit OOMKilled core the moment
  # provider-opentofu was installed (144 restarts, exit 137). The first fix
  # raised it to 2Gi — but a capstone verify on omantel.biz (dep
  # 4635277cae4ffed9, region-a) found core STILL CrashLoopBackOff at 2Gi
  # with 55 restarts (OOMKilled, exit 137, killed ~90s after start) even
  # though ZERO providers / ZERO CloudAdoptions were yet installed. core
  # `start` builds discovery + composition/GC informer caches across EVERY
  # CRD on the cluster (190 here, 8 compose.openova.io XRDs Established),
  # and that startup working set alone overruns 2Gi on this Sovereign — so
  # the seam can never reach the point of installing a provider. Raise the
  # limit to 4Gi (2x the failing limit; the node carries ~64Gi allocatable,
  # core is a cluster-singleton, ample headroom) and lift the request floor
  # to 1Gi so the scheduler reserves real space instead of overcommitting
  # core into the OOM window. RBAC-manager is untouched (it is not the OOM
  # offender). Operator-tunable per Inviolable Principle #4.
  resourcesCrossplane:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { memory: 4Gi }
  # Prometheus metrics annotations — DEFAULT OFF.
  #
  # Per docs/INVIOLABLE-PRINCIPLES.md #4 and docs/BLUEPRINT-AUTHORING.md
  # §11.2 (Observability toggles must default false). The upstream
  # crossplane chart's `metrics.enabled` only adds prometheus.io/scrape
  # annotations and a 8080/metrics port — it does NOT render
  # ServiceMonitor or any monitoring.coreos.com/v1 resource — so defaulting
  # `true` here would not break install. We default it `false` anyway to
  # keep the rule uniform across every Blueprint: every observability
  # toggle is operator-tunable and ships off. Operator opts in via
  # per-cluster overlay (issue #182).
  metrics:
    enabled: false
