apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-crossplane
spec:
  version: 1.1.11
  card:
    title: Crossplane
    summary: Control-plane day-2 infrastructure provisioning. Renders Composite Resources (XRs) into cloud + in-cluster resources the Sovereign never surfaces to Users directly.
    icon: crossplane.svg
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  class: platform-component
  lifecycle: experimental
  manifests:
    chart: bp-crossplane
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  placementSchema:
    modes: [single-region]
    default: single-region
  endpoints: []
