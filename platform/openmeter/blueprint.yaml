apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-openmeter
  labels:
    catalyst.openova.io/category: application
    catalyst.openova.io/section: pts-4-8-identity-and-metering
spec:
  version: 1.1.0
  card:
    title: OpenMeter
    category: application
    summary: "Real-time usage metering. CloudEvents ingestion, deterministic per-subject aggregation, OpenAPI Query endpoint. Used by bp-fingate (Open Banking) to meter API calls per TPP for monetization, and available to any Application that needs per-event usage tracking. omantel-1 ships the ClickHouse-less profile per docs/BOOTSTRAP-KIT-EXPANSION-PLAN.md §6.4 — backend writes go to bp-cnpg (PostgreSQL) and bp-nats-jetstream (event bus). Re-roll with backend.kind=clickhouse once a host cluster adds bp-clickhouse. "
    description: "Real-time usage metering. CloudEvents ingestion, deterministic per-subject aggregation, OpenAPI Query endpoint. Used by bp-fingate (Open Banking) to meter API calls per TPP for monetization, and available to any Application that needs per-event usage tracking. omantel-1 ships the ClickHouse-less profile per docs/BOOTSTRAP-KIT-EXPANSION-PLAN.md §6.4 — backend writes go to bp-cnpg (PostgreSQL) and bp-nats-jetstream (event bus). Re-roll with backend.kind=clickhouse once a host cluster adds bp-clickhouse. "
    icon: openmeter.svg
    license: Apache-2.0
    tags: [metering, usage, billing, cloudevents, application]
    docs: https://openmeter.io/docs
  visibility: listed
  owner:
    team: platform
    contact: platform@openova.io
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-openmeter
  upgrades:
    from: ["0.x"]
  observability:
    metrics: prometheus
    logs: stdout
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-passive
    - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: rtz
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: openmeter.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: '{{.OrgSlug}}'
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  # ── /G117.1 ──
