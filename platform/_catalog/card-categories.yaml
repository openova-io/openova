# The card category of each seeded Blueprint whose blueprint.yaml carries no spec.card.category,
# as the hand-written seed (products/catalyst/chart/templates/catalog-seed/blueprints.yaml) says it.
# A category is said in one place: here or in the Blueprint's own file, never both. The category of a
# provider's Blueprint (a folder its pack.yaml lists in spec.charts) is declared in that provider's own
# infra/providers/<provider>/card-categories.yaml, never here.
# Read by scripts/generate-catalog.py, which writes the category into the seed and the generated catalogue.
categories:
  bp-alloy: observability
  bp-catalyst-platform: platform
  bp-cert-manager: platform
  bp-cert-manager-powerdns-webhook: platform
  bp-clickhouse: analytics
  bp-crossplane: platform
