# Catalyst Blueprint umbrella metadata — the upstream chart is now resolved
# as a Helm subchart via Chart.yaml `dependencies:`. This values.yaml carries
# both:
#   1. The catalystBlueprint metadata block (provenance + version) so
#      observability/audit pipelines can inspect the artifact and report
#      which upstream chart + version is bundled.
#   2. The upstream subchart values overlay under the `cert-manager:` key
#      (umbrella-chart convention — the dependency name from Chart.yaml is
#      the values namespace).
#   3. Catalyst overlay values consumed by templates/ (e.g. `certManager:`
#      governs templates/clusterissuer-letsencrypt-dns01.yaml).
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). The upstream cert-manager
  # subchart exposes per-component image.registry knobs:
  #   cert-manager.image.registry, cert-manager.webhook.image.registry,
  #   cert-manager.cainjector.image.registry, cert-manager.startupapicheck.image.registry
  # Per-Sovereign overlays should populate those alongside this value. Tracked under #560.
  imageRegistry: ""

catalystBlueprint:
  upstream: { chart: cert-manager, version: "v1.16.5", repo: "https://charts.jetstack.io" }

# ─── Upstream chart values (subchart key: cert-manager) ───────────────────
# `helm dependency build` resolves the upstream as a subchart; values here
# under the `cert-manager:` key flow into that subchart unchanged.
cert-manager:
  # Wave 5.116 (#2462): force DNS-01 propagation check to use public
  # recursive resolvers (8.8.8.8, 1.1.1.1) instead of authoritative NS.
  # On Hetzner Sovereigns this is a no-op (default behavior already works
  # because Contabo IPs reach mothership pdns NS fine). On Huawei Sovereigns
  # the authoritative NS (ns1/2/3.openova.io → 45.151.123.50:53) is blocked
  # by NAT egress, so cert-manager's propagation check hangs with
  # "dial tcp 45.151.123.50:53: i/o timeout" — even though the TXT record
  # WAS written successfully via the Wave 5.111 bastion :443 SNI proxy.
  # Live evidence: hw19 29acca8e 6/13 challenges stuck on this exact error
  # until cert-manager Deployment was patched with these flags. Folding the
  # patch into chart values so future provs are truly zero-touch.
  extraArgs:
    - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
    - --dns01-recursive-nameservers-only
  # Install CRDs as part of this chart. The Catalyst overlay's ClusterIssuer
  # template (templates/clusterissuer-letsencrypt-dns01.yaml) depends on the
  # cert-manager.io/v1 CRD being registered before the post-install hook
  # runs. The legacy `installCRDs:` flag is replaced by `crds.enabled` /
  # `crds.keep` in cert-manager v1.16+ — the two cannot both be set.
  crds:
    enabled: true
    keep: true
  # ─── Harbor proxy-cache routing (Refs #3296 #3903) ──────────────────────
  # Canonical proxy idiom (quay.io/X -> harbor.openova.io/proxy-quay/X): route
  # all four cert-manager component images through the Sovereign Harbor
  # proxy-quay project so they pull on a fresh IPv4-only kom4dc prov AND
  # satisfy the harbor-proxy-pull Kyverno ClusterPolicy (Enforce; glob
  # */proxy-*/*). The upstream "image" helper renders `<registry>/<repository>`
  # when .registry is set, so registry MUST be the proxy host+project and
  # repository MUST be the host-stripped path (jetstack/cert-manager-*).
  # Tags stay pinned to the chart appVersion (v1.16.5) via the subchart default.
  # Do NOT set a chart-wide global.imageRegistry — it would double-prefix.
  image:
    registry: harbor.openova.io/proxy-quay
    repository: jetstack/cert-manager-controller
  cainjector:
    image:
      registry: harbor.openova.io/proxy-quay
      repository: jetstack/cert-manager-cainjector
  startupapicheck:
    image:
      registry: harbor.openova.io/proxy-quay
      repository: jetstack/cert-manager-startupapicheck
  # NOTE: the webhook component's image override lives in the existing
  # `webhook:` block below (alongside webhook.resources) to avoid a
  # duplicate YAML key.
  # Prometheus scraping + ServiceMonitor — DEFAULT OFF.
  #
  # Per docs/INVIOLABLE-PRINCIPLES.md #4 and docs/BLUEPRINT-AUTHORING.md
  # §11.2 (Observability toggles must default false): the
  # `monitoring.coreos.com/v1` CRDs that back ServiceMonitor ship with
  # kube-prometheus-stack — an Application Blueprint that depends on the
  # bootstrap-kit. Defaulting `servicemonitor.enabled: true` creates a
  # circular CRD dependency that breaks bp-cert-manager install on a
  # fresh Sovereign. Operator opts in via per-cluster overlay after the
  # observability tier is reconciled (issue #182).
  prometheus:
    enabled: false
    servicemonitor:
      enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      # G17-class right-size (caught live on hw90, 2026-06-03): the
      # controller was the cluster's ONLY OOMKilled container (26 kills at
      # 256Mi). The full bootstrap-kit now carries far more Certificate /
      # CertificateRequest / Order objects than when 256Mi was set
      # (per-app SSO + G117 endpoints), and the controller's informer
      # caches grow with them. A dead cert-manager starves every
      # webhook-serving component of its TLS Secret (sigstore / ESO /
      # otel-operator / kyverno-cleanup all crash-loop cert-less) and
      # wedges the fresh-prov cascade cluster-wide. 1Gi gives the same
      # 4× headroom step G17 applied to cnpg for the identical failure
      # shape.
      memory: 1Gi
  webhook:
    # Harbor proxy-cache routing (Refs #3296 #3903) — quay.io idiom, see the
    # `image:` block above. registry = proxy host+project, repository =
    # host-stripped path; tag stays the chart appVersion default.
    image:
      registry: harbor.openova.io/proxy-quay
      repository: jetstack/cert-manager-webhook
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

# ─── Catalyst-managed ClusterIssuers — MOVED to bp-cert-manager-issuers ──
# (#3734) The two Catalyst ClusterIssuers (letsencrypt-dns01-prod,
# letsencrypt-http01-prod) no longer ship in this chart. They now live in
# the standalone bp-cert-manager-issuers chart (bootstrap-kit slot 02a,
# dependsOn bp-cert-manager) — split out to dodge the helm-controller
# RESTMapper-cache CRD-ordering race that looped this HR on InstallFailed.
# The `certManager.issuers.*` knobs (email / acmeServer / dns01 / http01)
# moved there UNCHANGED: cluster overlays that previously set
# `certManager.issuers.*` on the bp-cert-manager HR now set the SAME key
# path on the bp-cert-manager-issuers HR (slot 02a). See
# platform/cert-manager-issuers/chart/values.yaml.
# ─── CRD-establishment gate (templates/crd-gate-{hook,rbac}.yaml) ────────
# Closes #149 — bp-cert-manager terminal failure on prov #24
# (`c776423270f4ae30`): the post-install ClusterIssuer hook (weight 5)
# fired before the cert-manager.io ClusterIssuer CRD reached
# `status.conditions[?(@.type=="Established")].status == "True"`. The
# upstream Jetstack subchart installs the CRD as a regular template
# (no helm.sh/hook), so `kubectl apply` returns when the resource is
# CREATED — not when the apiextensions-apiserver controller has finished
# Establishing it. Asynchronous in the apiserver; observed up to 30s on
# fresh Hetzner cold-start k3s.
#
# This Job (post-install,post-upgrade hook-weight -10) polls every CRD
# in `crds` for Established=True. Per docs/INVIOLABLE-PRINCIPLES.md #4 (no
# hardcoded band-aids, target-state every time): closes the race rather than
# papering with `helm.sh/hook-weight: 50` or a longer Flux retry loop.
#
# #3734: the two ClusterIssuer CRs moved OUT of this chart into
# bp-cert-manager-issuers (slot 02a). This gate is NO LONGER about this
# chart's own issuers — it now exists purely so downstream Blueprints that
# apply Issuer/Certificate CRs (and bp-cert-manager-issuers itself, via its
# own pre-install gate) can rely on those CRDs being Established once
# bp-cert-manager reports Ready. Kept because removing it would re-expose
# the downstream Certificate-applier race the gate was extended to cover.
crdGate:
  enabled: true
  # CRDs the gate waits for. Defaults cover the cert-manager.io types
  # dependent Blueprints instantiate: clusterissuers (applied by
  # bp-cert-manager-issuers, slot 02a) + issuers + certificates (applied by
  # gateway/harbor/gitea/etc.). Gating all three here means a downstream HR
  # that immediately applies a Certificate CR after bp-cert-manager goes
  # Ready doesn't have to ship its own gate. Cluster overlays MAY append
  # CRDs here (e.g. when a custom webhook ships its own CRD that should also
  # be Established before any dependent CR applies).
  crds:
    - clusterissuers.cert-manager.io
    - issuers.cert-manager.io
    - certificates.cert-manager.io
  # Total wait budget. 300s gives ~10x headroom over the worst-case
  # observed Established latency (~30s on a fresh Hetzner cold-start)
  # while still failing fast on a genuinely broken upstream (5min vs
  # an unbounded Helm timeout). Same sizing rationale as
  # bp-external-secrets-stores webhookGate.timeoutSeconds (#143).
  timeoutSeconds: 300
  # Poll interval. 2s matches bp-external-secrets-stores; <1s would
  # spam the apiserver, >5s would over-pad the success path.
  intervalSeconds: 2
  # kubectl image. Default is a known-good kubectl 1.30 build that ships
  # bash + kubectl (matches k3s 1.30 on Hetzner Sovereigns). Cluster
  # overlays MAY pin to a digest for air-gap or supply-chain reasons.
  #
  # 2026-05-11 (Fix #158): switched from docker.io/bitnami/kubectl:1.30.4
  # because Bitnami's 2025-08 secure-images cutover deleted all
  # versioned tags from docker.io/bitnami/kubectl (only :latest +
  # sha256-named tags remain). Pin to docker.io/bitnamilegacy/kubectl
  # (Bitnami's deprecation-fallback registry path) which still carries
  # versioned tags AND retains bash/sh in the image (rancher/kubectl
  # is distroless and would break the hook's bash-c shell script —
  # see platform/k8s-ws-proxy hmac-bootstrap-job.yaml comment).
  # 1.30.7 is the newest 1.30.x in bitnamilegacy.
  #
  # Fix #163 (2026-05-11, MIRROR-EVERYTHING): explicit Harbor proxy-cache
  # prefix per CLAUDE.md inviolable rule. Node-level containerd mirror in
  # cloudinit-control-plane.tftpl line 706 already rewrites docker.io →
  # harbor.openova.io/proxy-dockerhub, but explicit references defeat
  # upstream-deletion blast radius AND satisfy the Kyverno
  # `harbor-proxy-pull` ClusterPolicy.
  image: harbor.openova.io/proxy-dockerhub/bitnamilegacy/kubectl:1.30.7
  imagePullPolicy: IfNotPresent

# NOTE (#3734): the `certManager.issuers.*` block that used to live here was
# REMOVED when the two ClusterIssuers split out to bp-cert-manager-issuers
# (slot 02a). Those knobs now live in
# platform/cert-manager-issuers/chart/values.yaml under the SAME key path.
# Cluster overlays that set `certManager.issuers.*` must target the
# bp-cert-manager-issuers HelmRelease (slot 02a), not this one.
