{{- /*
Function test of bp-cert-manager (docs/RUNBOOKS.md section 4.5). `helm test` runs it.

It asks cert-manager to issue a certificate and waits for it. In this
namespace it creates a self-signed Issuer <release>-function-test and a
Certificate <release>-function-test for the name function-test.invalid, whose
Secret is <release>-function-test-tls. It passes when the Certificate reports
the condition Ready True within 120 seconds: the webhook admitted both objects,
and the controller issued the certificate and wrote it. Then, and also when it
fails, it deletes the Certificate, the Issuer and that Secret, which
cert-manager wrote; the test itself creates no Secret. The self-signed Issuer
needs nothing outside the cluster.

A ServiceAccount, Role and RoleBinding of this file give the Pod exactly that
right: create, get and delete issuers and certificates of cert-manager.io, and
get and delete the one Secret by its name.

The chart has no master gate, so the test always renders. The subchart is a
dependency without a condition, and its value `enabled` is a placeholder that
no template reads: cert-manager.enabled=false switches nothing off. The image
is the kubectl image this chart already uses for its CRD gate (crdGate.image);
functionTest.image overrides it.
*/ -}}
{{- $ft := .Values.functionTest | default dict }}
{{- $gate := .Values.crdGate | default dict }}
{{- $image := $ft.image | default ($gate.image | default "harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4") }}
{{- $probe := printf "%s-function-test" .Release.Name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers", "certificates"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-tls" $probe | quote }}]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-function-test
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-function-test
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    catalyst.openova.io/function-test: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 300
  serviceAccountName: {{ .Release.Name }}-function-test
  containers:
    - name: function-test
      image: {{ $image | quote }}
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: HOME
          value: /tmp
        - name: TEST_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: PROBE
          value: {{ $probe | quote }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          k() { kubectl --request-timeout=15s -n "${TEST_NAMESPACE}" "$@"; }
          cleanup() {
            k delete certificate "${PROBE}" --ignore-not-found --wait=false > /dev/null 2>&1
            k delete issuer "${PROBE}" --ignore-not-found --wait=false > /dev/null 2>&1
            k delete secret "${PROBE}-tls" --ignore-not-found --wait=false > /dev/null 2>&1
          }
          fail() { cleanup; echo "FUNCTION-TEST fail {{ .Chart.Name }} $1"; exit 1; }
          cleanup
          printf '{"apiVersion":"cert-manager.io/v1","kind":"Issuer","metadata":{"name":"%s"},"spec":{"selfSigned":{}}}' "${PROBE}" \
            | k create -f - > /dev/null 2>/tmp/error || fail "the Issuer ${PROBE} was refused: $(tr '\n' ' ' < /tmp/error | cut -c1-160)"
          printf '{"apiVersion":"cert-manager.io/v1","kind":"Certificate","metadata":{"name":"%s"},"spec":{"secretName":"%s-tls","dnsNames":["function-test.invalid"],"issuerRef":{"kind":"Issuer","name":"%s"}}}' "${PROBE}" "${PROBE}" "${PROBE}" \
            | k create -f - > /dev/null 2>/tmp/error || fail "the Certificate ${PROBE} was refused: $(tr '\n' ' ' < /tmp/error | cut -c1-160)"
          deadline=$(( $(date +%s) + 120 ))
          while :; do
            ready="$(k get certificate "${PROBE}" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)"
            [ "${ready}" = "True" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              fail "the Certificate ${PROBE} is not Ready within 120 seconds: $(k get certificate "${PROBE}" -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}' 2>/dev/null | cut -c1-160)"
            fi
            sleep 5
          done
          cleanup
          echo "FUNCTION-TEST pass {{ .Chart.Name }} a self-signed Certificate in ${TEST_NAMESPACE} became Ready and was deleted"
  volumes:
    - name: tmp
      emptyDir: {}
