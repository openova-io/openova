apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-opensearch
  labels:
    catalyst.openova.io/section: pts-4-application-tier
spec:
  # G117.1 (Wave-1/B3) — scaffold-only Application Blueprint.
  #
  # This Blueprint folder currently only ships a README; the upstream chart
  # is tracked but not yet packaged. The four new blocks below declare the
  # intended target-state per docs/sessions/2026-06-02-per-blueprint-topology-audit.md,
  # so the catalog UI, application-controller, and SSO fan-out can plan
  # against it ahead of the chart being authored.
  version: 0.0.0
  visibility: unlisted
  card:
    title: OpenSearch
    family: search
    summary: Open-source search + analytics suite (Elasticsearch fork). Full-text search, log aggregation, vector search.
    description: OpenSearch cluster + Dashboards. Suitable for full-text search, observability, and SIEM use cases.
    icon: opensearch.svg
    license: Apache-2.0
    tags: [search, elasticsearch, opensearch, logs, vector]
    docs: https://opensearch.org/docs/
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-active
    - active-passive
    - singleton
    defaults:
      multi-region: active-active
      single-region: singleton
    perTopology:
      active-active:
        replication:
          backend: ccr
          mode: async
        switchover:
          mechanism: ccr-promote
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: active
      active-passive:
        replication:
          backend: ccr
          mode: async
        switchover:
          mechanism: ccr-promote
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: rtz
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: api
    hostnameTemplate: opensearch.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: false
    ssoEnabled: true
  - name: dashboards
    hostnameTemplate: dashboards.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: "{{.OrgSlug}}"
    protocolMapper: oidc
    silentLogin: true
  # ── /G117.1 ──
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-opensearch
