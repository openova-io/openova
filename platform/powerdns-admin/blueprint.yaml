apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-powerdns-admin
  labels:
    catalyst.openova.io/section: pts-2-3-per-sovereign-supporting-services
spec:
  version: 0.1.8
  card:
    title: powerdns-admin
    summary: |
      PowerDNS-Admin (ngoduykhanh/powerdns-admin) web UI for per-Sovereign
      PowerDNS zone + record management. CNPG-backed Postgres metadata,
      Catalyst SSO via Keycloak. Reads PDNS_API_URL / PDNS_API_KEY from
      bp-powerdns to drive the authoritative DNS server.
  visibility: unlisted              # mandatory infra
  manifests:
    chart: ./chart
  depends:
    - bp-powerdns
    - bp-cnpg
    - bp-keycloak
    - bp-sso-bridge
    - bp-external-secrets-stores
    - bp-reflector
    - bp-gateway-api
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ''
          clusters:
            - mgmt-A
            - mgmt-B
            - dmz-A
            - dmz-B
            - rtz-A
            - rtz-B
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  endpoints:
    - name: ui
      hostnameTemplate: pdns-admin.{{.SovereignFQDN}}
      port: 443
      protocol: https
      tls: true
      visibility: private
      launchDefault: true
      ssoEnabled: true
      # #3150 — silent-SSO OIDC-init path. PowerDNS-Admin (ngoduykhanh) is a
      # Flask/authlib app; the generic-OIDC provider registers its login view
      # at /oidc/login, which redirects the browser to OIDC_OAUTH_AUTHORIZE_URL
      # (already carries ?kc_idp_hint=catalyst-pin — see chart
      # sso-oauth-source-externalsecret.yaml) → silent PIN re-use → operator
      # lands inside PDA with no login form. NOT installed on hw124 (only the
      # bp-powerdns DNS server is) — confirm the exact route against the running
      # url_map when PDA is first provisioned.
      ssoInitPath: "/oidc/login"
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  multiInstance:
    enabled: false
