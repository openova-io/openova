# bp-powerdns-admin values overlay.
#
# Per Inviolable Principle #4 (never hardcode) every operationally-
# meaningful value flows from this file. Per-Sovereign cluster overlays
# (clusters/<sovereign>/) wire gateway.host, pdns.apiUrl, sso.sovereignFqdn.

# Image — pinned PowerDNS-Admin upstream. Routed through the per-Sovereign
# Harbor proxy-cache (harbor.openova.io/proxy-dockerhub/…) per CLAUDE.md
# MIRROR-EVERYTHING rule; post-cutover Step-04's containerd mirror
# redirects harbor.openova.io → the local Harbor, so this is a
# Sovereign-local pull, not a mothership tether.
#
# #3150/#3173: the upstream project moved from `ngoduykhanh/powerdns-admin`
# (Docker Hub tags stop at 0.3.0 — the previously-pinned `:0.4.2` NEVER
# existed there → ImagePullBackOff "not found" on every Sovereign) to the
# maintained `powerdnsadmin/pda-legacy` repo, which publishes `0.4.2`
# (== `latest`, digest sha256:0fc92c8e…). Verified resolvable through the
# hw124 Harbor proxy-cache.
#
# proxy-dockerhub serves PUBLIC images cred-free, so NO imagePullSecret is
# needed here — the prior `ghcr-pull` ref was both wrong (ghcr-pull is the
# ghcr.io cred, not the Harbor cred) and not reflected into this namespace,
# which produced the spurious FailedToRetrieveImagePullSecret warning.
image:
  repository: harbor.openova.io/proxy-dockerhub/powerdnsadmin/pda-legacy
  tag: "0.4.2"
  pullPolicy: IfNotPresent
  pullSecrets: []

replicas: 1

# Pod-level security.
securityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false      # PDA writes session/cache to /tmp
  # #3150: the powerdnsadmin/pda-legacy Alpine image's musl loader / busybox
  # exec path returns EPERM ("Operation not permitted" on `python3`/`flask`)
  # when ALL Linux capabilities are dropped — verified live on hw124 (an A/B
  # probe with `drop:[ALL]` failed exec; without it gunicorn boots 1/1). The
  # Pod still runs unprivileged: non-root uid 100, allowPrivilegeEscalation
  # false, RuntimeDefault seccomp. This image was NEVER exercised before
  # (the prior `ngoduykhanh:0.4.2` tag was unpullable), so the drop-ALL
  # default went untested. Leaving caps at the runtime default keeps the Pod
  # PodSecurity-baseline compliant.
  capabilities: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Container port the Gunicorn process inside the PowerDNS-Admin image binds
# to. #3150: the powerdnsadmin/pda-legacy image's baked-in
# /app/configs/docker_config.py sets `PORT = 80` and gunicorn binds 0.0.0.0:80
# (the old ngoduykhanh image used 9191). targetPort drives both the
# Deployment containerPort and the readiness/liveness probe port, so a stale
# 9191 here left the Pod Running-but-never-Ready (probe connection-refused) —
# verified live on hw124. Aligned to the image's actual listen port.
service:
  port: 80
  targetPort: 80
  type: ClusterIP

# Catalyst HTTPRoute (Cilium Gateway API, issue #387). Per-Sovereign
# overlay supplies gateway.host (e.g. pdns-admin.<sovereign-fqdn>).
gateway:
  enabled: true
  host: ""
  path: "/"
  backendService: ""               # defaults to <release>-bp-powerdns-admin
  backendPort: 80
  parentRef:
    name: cilium-gateway
    namespace: kube-system
    sectionName: ""                 # multi-zone-safe (PR #1888 / TBD-A40)

# ─── CNPG-managed Postgres cluster for PDA metadata ──────────────────────
# PowerDNS-Admin needs a SQL backend for users, audit log, history. Per
# the bp-harbor / bp-gitea pattern, we materialise a Catalyst-managed
# CNPG Cluster + reflect the generated `<cluster>-app` Secret to give
# the upstream container a stable password binding.
postgres:
  cluster:
    # 0.1.12 (#3370): embedded-cluster gate. false → the bundled pda-pg
    # Cluster is skipped; PDA runs against the shared-pg-b instance's `pda`
    # Context via the reflector-PUSHED pda-shared-database-secret hub (slot
    # 11a flips databaseSecret.name in lockstep). true → PDA reads the
    # bundled cluster's CNPG-generated pda-pg-app Secret directly (#3486).
    enabled: true
    name: pda-pg
    namespace: ""                  # defaults to .Release.Namespace
    instances: 1
    # CNPG postgres image. Defaults to the mothership Harbor proxy cache
    # (harbor.openova.io/proxy-ghcr) so fresh-prov bootstrap pulls the
    # ~300MB image through Harbor instead of throttling on anonymous ghcr
    # (#3058). PUBLIC image → proxy-ghcr serves it cred-free. Post-cutover
    # Step-04's containerd mirror redirects harbor.openova.io → local Harbor.
    # The tag is set separately via pgVersion.
    imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql
    pgVersion: "16"
    database: pda
    owner: pda
    storageSize: 5Gi
    storageClass: local-path
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Database credential Secret the deployment.yaml secretKeyRefs read
# (uri/username/password).
#
# 0.1.14 (#3486): the embedded-cluster path reads the CNPG-generated
# `pda-pg-app` Secret DIRECTLY (same namespace as the Deployment, always
# present once bp-cnpg materialises the pda-pg Cluster, already carries
# `uri`/`username`/`password`). The previous indirection — an empty
# `pda-database-secret` carrying a `reflector .../reflects: pda-pg-app`
# annotation that bp-reflector PULL-mirrored — wedged every fresh prov:
# the same-namespace `reflects:` pull is edge-triggered on the DESTINATION,
# so when CNPG regenerated `pda-pg-app` during the HR's
# uninstall/reinstall remediation churn the mirror never re-ran →
# `pda-database-secret` stayed empty (DATA=0) → the PDA Pod hung in
# CreateContainerConfigError ("couldn't find key uri") → the 15m HR
# install timed out → remediateLastFailure uninstalled + restarted → the
# pda-pg Cluster re-bootstrapped → infinite loop. That HR-never-Ready
# wedged the bootstrap-kit Kustomization's health-check loop, blocking the
# `sovereign-tls` Kustomization (dependsOn bootstrap-kit) that applies the
# `*.<fqdn>` wildcard Certificate → the Cilium Gateway :443 listener stayed
# `Invalid CertificateRef` → the console served HTTP 000 (traced live on
# hw134, dep 6a189d1b7d8cebc8). Reading the CNPG Secret directly removes
# the empty-secret window entirely; the install converges first attempt.
#
# The shared-pg-b path (slot 11a flips this to `pda-shared-database-secret`,
# #3370) already reads a reflector-PUSHED hub directly with the same key
# contract — so deployment.yaml stays generic via `databaseSecret.name`.
databaseSecret:
  # cnpg cluster's generated `<cluster>-app` Secret (pda-pg → pda-pg-app).
  name: pda-pg-app
  cnpgSecretName: pda-pg-app
  passwordKey: password
  usernameKey: username
  # CNPG stamps a ready-to-use `uri` key (postgresql://user:pass@host:port/db)
  # into its generated `<cluster>-app` Secret. pda-legacy's create_app()
  # reads SQLALCHEMY_DATABASE_URI verbatim, so the deployment wires this
  # key straight through — see deployment.yaml DB-wiring comment. Refs #3189.
  uriKey: uri

# ─── PowerDNS backend endpoint ───────────────────────────────────────────
# Where the running PDA container reaches the authoritative server.
# Per-Sovereign overlay sets these or accepts the in-cluster default.
# 0.1.6 (#3189, 2026-06-10): the API/webserver (port 8081) is exposed by
# the bp-powerdns chart's `powerdns` Service (live: `powerdns` svc port
# `webserver:8081`; the chart's own zone-bootstrap-job curls
# `http://powerdns:8081`). The previous `bp-powerdns-api` host does NOT
# exist as a Service → NXDOMAIN → PowerDNS-Admin could not reach the API
# → empty Zones table (its core function dead). Point at the real svc.
pdns:
  apiUrl: "http://powerdns.powerdns.svc.cluster.local:8081"
  # The API key the PDA container POSTs via X-API-Key. bp-powerdns chart
  # ships templates/api-credentials-secret.yaml; the same Secret is
  # reflected into this namespace via the reflector chain so we read
  # the bytes via secretKeyRef.
  apiKeySecret:
    name: pdns-api-credentials
    key: api-key
  # #3150: the API-key Secret originates in the bp-powerdns namespace as
  # `powerdns-api-credentials`. templates/pdns-api-credentials-mirror.yaml
  # ships a reflector stub that pulls it into this ns under apiKeySecret.name
  # (above). Override sourceSecret.{namespace,name} if a Sovereign overlay
  # relocates the PDNS server's credential Secret.
  sourceSecret:
    namespace: powerdns
    name: powerdns-api-credentials
  version: "4.7"
  protocol: http

# ─── Flask SECRET_KEY ────────────────────────────────────────────────────
# 32-byte URL-safe secret used by Flask to sign session cookies. Helm
# `lookup` makes it idempotent across reconciles; operator override
# wins for sealed-secret restoration scenarios.
flaskSecretKey:
  secretName: pda-flask-key
  override: ""                       # set to pre-existing value to import

# ─── G91.powerdns-admin (#2656) SSO opt-in ───────────────────────────────
# Per SECURITY.md §6.3 — bp-sso-bridge auto-provisions a Keycloak Client
# `powerdns-admin`, stores client_secret + URL bundle in OpenBao at
# `secret/sso/powerdns-admin`, emits an ExternalSecret in this namespace,
# and grants the Sovereign operator (deployment.OrgEmail) the
# Administrator role.
sso:
  enabled: true
  realm: sovereign
  # Per-Sovereign cluster overlay sets this (e.g. `hw86.omani.works`).
  # When empty the OIDC env vars on the PDA Pod stay empty strings —
  # PDA falls back to local-account auth (clear behaviour, not a half-
  # config).
  sovereignFqdn: ""
  clientId: powerdns-admin
  externalSecretStoreName: vault-region1
  refreshInterval: 1h
  adminGroup: sovereign-admins
  # Auto-onboarding — PDA creates a local user record on first OIDC
  # sign-in if it doesn't already exist.
  autoOnboard: true
  # ── Bare-URL zero-click entry (#3374) ──────────────────────────────
  # Gateway-level 302 of ONLY the bare root `/` into /oidc/login — the
  # callback-aware replacement for the reverted 0.1.10 /login rule
  # (which decapitated PDA's /oidc/authorized -> /login session
  # exchange; see the loop forensics in templates/httproute.yaml).
  bareURL:
    enabled: true
  # ── OIDC-readiness gate (#3374, 0.1.16) ────────────────────────────
  # An initContainer that blocks the main PDA container from starting until
  # the bp-sso-bridge `pda-sso-oidc-credentials` ExternalSecret exists AND
  # OIDC_OAUTH_AUTHORIZE_URL is non-empty. This is the ROBUST replacement for
  # relying on Stakater Reloader to roll the Pod after the Secret syncs:
  # measured live on hw138 the Reloader annotation was present yet the Pod
  # was never rolled (108min old), so the OIDC env stayed empty and
  # /oidc/login HTTP-500'd the whole time. With the gate, `envFrom` always
  # sees the populated Secret at container creation — the env is NEVER empty
  # at first serve. See templates/deployment.yaml for the full forensics.
  oidcReadinessGate:
    enabled: true
    # Defaults to the PDA image (has /bin/sh + matches the kyverno harbor
    # proxy glob). Override only if a smaller glob-compliant image is wanted.
    image: ""
    # Phase-1 budget for bp-sso-bridge to project the OIDC Secret. The
    # sso-bridge client-mint + ExternalSecret sync is a few minutes after the
    # PDA Pod schedules on a fresh prov; 600s leaves generous headroom.
    timeoutSeconds: 600
    intervalSeconds: 5

# Misc PDA settings.
config:
  # Trust the per-Sovereign Gateway's X-Forwarded-* headers so PDA's
  # internal URL generation matches the public scheme/host.
  proxyFix: true
  # Default landing page after sign-in.
  defaultLandingPage: dashboard
  # ── SQLAlchemy connection resilience (#3374, 0.1.17) ──────────────────
  # PDA (Flask + SQLAlchemy 1.4) holds a pooled DB connection. CNPG /
  # PostgreSQL recycle idle SSL connections server-side, so a pooled
  # connection PDA hands out can already be dead → the next query raises
  # `psycopg2.OperationalError: SSL connection has been closed unexpectedly`,
  # the transaction is left invalid, and EVERY subsequent request 500s with
  # `PendingRollbackError` until the Pod restarts. PDA runs a `Setting().get()`
  # DB query on EVERY request (routes/index.py before_request +
  # __init__.py inject_sitename), so a single dropped connection bricks the
  # whole UI — including the bare-URL `/` → /oidc/login zero-click entry and
  # the OIDC callback that onboards the SSO user. Measured live on hw167 (dep
  # 28d4e96f96407bbb): the OIDC redirect to Keycloak worked, but the
  # DB-touching callback path 500'd on the recycled connection → never landed
  # on /dashboard.
  #
  # `pool_pre_ping` makes SQLAlchemy issue a lightweight liveness check
  # (SELECT 1) before handing out a pooled connection and transparently
  # reconnect if it's dead — the canonical fix for server-side connection
  # recycling. `pool_recycle` proactively discards connections older than N
  # seconds so they never outlive the server's idle timeout. These are passed
  # through to SQLAlchemy's create_engine() unchanged.
  #
  # INJECTION PATH: PDA's lib/settings.py `AppSettings.load_environment(app)`
  # (called LAST in create_app, after from_object) iterates its `defaults`,
  # uppercases each key, and for any matching env var assigns
  # app.config[KEY] = convert_type(value). `sqlalchemy_engine_options` is a
  # known default (type `dict`), so convert_type runs `json.loads()` on the
  # env value and lands a real dict in `app.config['SQLALCHEMY_ENGINE_OPTIONS']`
  # — exactly the key Flask-SQLAlchemy 2.5.1 reads to build the engine (db =
  # SQLAlchemy() is constructed with NO engine_options arg, so the config dict
  # is authoritative). The deployment renders this map to a JSON string env
  # var. Verified live: settings.py reads SQLALCHEMY_ENGINE_OPTIONS, fsa 2.5.1
  # passes app.config['SQLALCHEMY_ENGINE_OPTIONS'] into create_engine.
  #
  # Set sqlAlchemyEngineOptions to {} (empty) to omit the env var entirely.
  sqlAlchemyEngineOptions:
    pool_pre_ping: true
    pool_recycle: 280

extraEnv: []
