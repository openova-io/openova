apiVersion: v2
name: bp-powerdns-admin
# 0.1.1 (G117.5 W3.D1 #2744, 2026-06-02): Append `?kc_idp_hint=catalyst-pin`
# to the rendered `OIDC_OAUTH_AUTHORIZE_URL` env so PDA's browser-flow
# auth redirect carries the IdP hint as defense-in-depth alongside the
# sovereign realm IDR `defaultProvider` (bp-keycloak 1.4.9). Hardens
# against operator drift on the IDR config and per-Org realm flows
# whose IDR points at `sovereign-broker` (Tier-3 chain). Per Aux-2
# audit docs/sessions/2026-06-02-G117-sso-fanout-audit/tier-2/bp-powerdns-admin.md
# "Option A" — chart-local override, no bp-sso-bridge contract change.
# Refs G113 `feedback_g113_sso_idr_defaultprovider_fix.md`.
#
# 0.1.3 (#3150/#3173, 2026-06-10): repoint the container image from the
# dead `ngoduykhanh/powerdns-admin:0.4.2` (that tag never existed on the
# ngoduykhanh repo — Docker Hub stops at 0.3.0 → ImagePullBackOff "not
# found" on hw124, lone catalog-404, wedged the bootstrap-kit Kustomization)
# to the maintained `powerdnsadmin/pda-legacy:0.4.2`. Drop the spurious
# `ghcr-pull` imagePullSecret (proxy-dockerhub is anonymous; ghcr-pull is
# the wrong cred and isn't reflected into this namespace). See values.yaml.
#
# 0.1.4 (#3189): wire SQLALCHEMY_DATABASE_URI from the CNPG `uri` secret key
# so pda-legacy uses the provisioned pda-pg postgres, not baked-in SQLite.
#
# 0.1.5 (#3150, 2026-06-10): land silent-SSO LOGGED-IN on hw124. Two fixes:
# (1) the OIDC env-var NAMES were wrong — PDA reads `oidc_oauth_<x>` from env
#     `OIDC_OAUTH_<X>` (settings.py load_environment; Setting().get reads
#     app.config[KEY] before the DB). The `_CLAIM`/`_PROPERTY`-suffixed names
#     (USERNAME_CLAIM / FIRST_NAME_PROPERTY / LAST_NAME_PROPERTY / EMAIL_PROPERTY)
#     are NOT what PDA reads → they were ignored → Setting().get fell through to
#     the DB default `given_name` → the login view's unguarded
#     `user_data['given_name']` raised `KeyError` → HTTP 500 on the OIDC
#     callback. Renamed to the exact keys OIDC_OAUTH_USERNAME / _FIRSTNAME /
#     _LAST_NAME / _EMAIL.
# (2) catalyst-pin federated users carry NO name claims, so firstname +
#     last_name both point at `preferred_username` (always present). Verified
#     live on hw124: console Open → pdns-admin.<fqdn>/oidc/login → KC silent →
#     lands on the PDA Dashboard logged-in, no login form
#     (docs/sessions/2026-06-10/evidence/hw124-powerdns-admin-loggedin.png).
# 0.1.7 (Refs #2737, 2026-06-11): pass the kyverno Enforce admission on a
# fresh Sovereign. bp-powerdns-admin reached kyverno admission for the FIRST
# time on the hw126 fresh prov (prior provs wedged upstream) and was DENIED
# by the baseline cilium-l7-mtls / cilium-enforced-label rule — the Pod
# template was missing `policy.cilium.io/enforced: "true"`. Add the label to
# spec.template.metadata.labels, mirroring the bp-sso-bridge + catalyst chart
# idiom. The container image already pulls through the Harbor proxy
# (harbor.openova.io/proxy-dockerhub/…, #3150) so it satisfies harbor-proxy-pull.
#
# 0.1.8 (Refs #2737, 2026-06-11): full kyverno-Enforce compliance re-cut +
# cold-install guard. Audited the WHOLE rendered chart against the live
# baseline policies (platform/kyverno-policies/.../baseline/{04-probes,
# 09-cilium-l7-mtls,11-harbor-proxy,12-image-tag-pinned}.yaml). Result:
# every container the chart ships is already compliant —
#   • Deployment/powerdns-admin container `powerdns-admin`:
#       image harbor.openova.io/proxy-dockerhub/powerdnsadmin/pda-legacy:0.4.2
#       → matches harbor-proxy glob `*/proxy-*/*`, tag `0.4.2` is pinned
#       (not :latest), BOTH livenessProbe + readinessProbe (httpGet :http)
#       present, Pod template carries `policy.cilium.io/enforced: "true"`
#       (added 0.1.7/#3242).
#   • CNPG Cluster `pda-pg`: imageName
#       harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql:16 → proxy
#       glob + pinned. (The `Cluster` CRD itself is not in any baseline
#       policy `kinds:` match; the postgres Pod CNPG later creates inherits
#       the pinned proxy image.)
# The 0.1.6→0.1.7 denial the operator captured on hw126 traced to a
# pre-0.1.7 OCI artifact still being served when admission was first
# reached (0.1.2 shipped the dead non-Harbor `ngoduykhanh/powerdns-admin`
# image → harbor-proxy-pull + image-tag-pinned DENY; the enforced label
# arrived only at 0.1.7). This 0.1.8 re-cut publishes the already-correct
# chart so the FIX actually lands.
# ALSO add the bp-gitea/bp-harbor gold-standard `.Capabilities.APIVersions.
# Has "postgresql.cnpg.io/v1"` guard to templates/cnpg-cluster.yaml so a
# cold install can't half-render (apiserver rejecting the Cluster CR before
# bp-cnpg registers the CRD) and wedge the chart BEFORE it reaches kyverno
# admission at all.
# 0.1.13 (#3374, 2026-06-13): ROOT-URL zero-click SSO — the callback-aware
# replacement the 0.1.11 revert (464e4182, #3353) demanded. The HTTPRoute now
# 302s ONLY the bare root `/` (Exact match, explicit port 443 per #3310) to
# /oidc/login. The reverted 0.1.10 rule intercepted /login, which the live
# pda-legacy 0.4.2 source proves is the OIDC session-exchange hop
# (/oidc/authorized stores the token then bounces to /login) — that is why it
# looped. The root-only rule cannot loop: the post-exchange chain goes
# /login -> /dashboard/ (authed-user guard) and never revisits `/`; /login,
# /oidc/login and /oidc/authorized are never intercepted, so OIDC errors
# degrade to the visible form. Gated on sso.bareURL.enabled (default true).
# Full forensics in templates/httproute.yaml.
# 0.1.12 (#3370, 2026-06-12): embedded-DB elimination seam — gate
# `postgres.cluster.enabled` (default true) on the bundled pda-pg
# Cluster + its pda-database-secret mirror. false → PDA runs against
# the shared-pg-b instance's `pda` Context (slot 16c hub Secret
# pda-shared-database-secret, reflector-PUSHED into this namespace)
# via the slot-11a databaseSecret.name flip — same one-flag contract
# as gitea/harbor/keycloak (enable_shared_pg).
# 0.1.14 (#3486, 2026-06-14): RETIRE the racy same-namespace reflector
# PULL-mirror that left `pda-database-secret` empty and looped the
# embedded-cluster install forever on every fresh prov. The PDA Deployment
# now reads the CNPG-generated `pda-pg-app` Secret DIRECTLY (default
# databaseSecret.name flip in values.yaml + slot 11a) — same namespace,
# always present, already carries uri/username/password. The old empty
# Secret + its `reflects:` annotation was edge-triggered on the DESTINATION
# only, so when CNPG regenerated `pda-pg-app` during the HR's
# uninstall/reinstall remediation churn the mirror never re-ran → DATA=0 →
# PDA Pod CreateContainerConfigError → 15m install timeout →
# remediateLastFailure uninstall+retry → pda-pg re-bootstrap → infinite
# loop. That HR-never-Ready wedged the bootstrap-kit Kustomization, which
# blocked the sovereign-tls Kustomization (dependsOn bootstrap-kit) that
# applies the `*.<fqdn>` wildcard Certificate → the Cilium Gateway :443
# listener stayed `Invalid CertificateRef` → the console served HTTP 000
# (traced live on hw134, dep 6a189d1b7d8cebc8). database-secret.yaml is
# now skip-rendered (no consumer); the shared-pg-b path already read a
# reflector-PUSHED hub directly so it is unchanged.
# 0.1.15 (#3374, 2026-06-14): zero-click bare-URL SSO lands signed-in. Add the
# `secret.reloader.stakater.com/reload: pda-sso-oidc-credentials` annotation to
# the Deployment so Stakater Reloader (bp-reloader) rolls the Pod when the
# bp-sso-bridge OIDC ExternalSecret materialises/rotates. ROOT CAUSE measured
# live on hw136 (dep 3a2ee904b1d0366a): on a fresh prov the PDA Pod starts
# ~3min BEFORE the sso-bridge projects `pda-sso-oidc-credentials`; the OIDC env
# is injected via `envFrom.secretRef` (optional), which kubelet evaluates ONLY
# at container creation, so the running Pod boots with EMPTY
# OIDC_OAUTH_AUTHORIZE_URL/_TOKEN_URL/_KEY -> PDA's Setting().get() returns ''
# -> authlib raises `Missing "authorize_url" value` (routes/index.py:155) ->
# the bare-URL 302 lands on PDA's own HTTP 500, never on Keycloak. The Reloader
# annotation triggers a rolling restart the moment the Secret appears, so the
# next Pod picks up the OIDC env and /oidc/login 302s to KC -> owner lands on
# /dashboard/ signed-in (verified live hw136: full Administration sidebar incl.
# Users, signed in as emrah.baysal@openova.io).
version: 0.1.15
description: |
  PowerDNS-Admin (ngoduykhanh/powerdns-admin) web UI Blueprint for
  per-Sovereign PowerDNS zone + record management. Drives the
  authoritative DNS server via PDNS_API_URL / PDNS_API_KEY (from
  bp-powerdns) and persists its own metadata (users, account audit,
  RBAC) into a dedicated CNPG Cluster.

  Catalyst SSO via bp-sso-bridge (G91.1 #2652): the framework
  auto-provisions a Keycloak Client `powerdns-admin`, stores the
  client_secret in OpenBao at `secret/sso/powerdns-admin`, materialises
  an ExternalSecret in this namespace, and grants the Sovereign
  operator the client's `admin` role. PowerDNS-Admin reads the OIDC
  config via env vars (OIDC_OAUTH_*) injected from the
  ExternalSecret-rendered Secret.

  Per ADR-0001 / docs/PLATFORM-TECH-STACK.md §3.5 the chart is
  vendor-agnostic — per-Sovereign overlays set the gateway hostname
  (pdns-admin.<sovereign-fqdn>) and the PDNS endpoint reachable from
  Pods inside the Sovereign cluster.
type: application
keywords: [catalyst, blueprint, powerdns-admin, dns, ui, sso]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

annotations:
  # PowerDNS-Admin upstream ships only a container image — no upstream
  # Helm chart. This Blueprint constructs the deployment shape itself
  # (Deployment + Service + HTTPRoute + CNPG Cluster + Secrets) so the
  # blueprint-release umbrella-shape gate (issue #181 +
  # docs/BLUEPRINT-AUTHORING.md §11.1) accepts no-upstream charts.
  catalyst.openova.io/no-upstream: "true"
  catalyst.openova.io/depends-on: "bp-powerdns,bp-cnpg,bp-keycloak,bp-sso-bridge,bp-external-secrets-stores,bp-reflector,bp-gateway-api"
