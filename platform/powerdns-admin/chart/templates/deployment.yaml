apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-bp-powerdns-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bp-powerdns-admin
    app.kubernetes.io/instance: {{ .Release.Name }}
    catalyst.openova.io/blueprint: bp-powerdns-admin
  {{- if .Values.sso.enabled }}
  annotations:
    # #3374 (2026-06-14) — roll this Deployment when the bp-sso-bridge
    # ExternalSecret `pda-sso-oidc-credentials` materialises/rotates.
    #
    # ROOT CAUSE measured live on hw136 (dep 3a2ee904b1d0366a): on a fresh
    # prov the PDA Pod starts BEFORE the sso-bridge mints the Keycloak client
    # + projects the OIDC ExternalSecret (the Pod was 2m45s older than the
    # Secret on hw136). The OIDC env is injected via
    # `envFrom.secretRef: pda-sso-oidc-credentials` (optional: true), and
    # kubelet evaluates `envFrom` ONLY at container creation — it never
    # re-injects env when the Secret later appears. So the running Pod boots
    # with EMPTY OIDC_OAUTH_AUTHORIZE_URL / _TOKEN_URL / _KEY (every
    # ExternalSecret-sourced key), PDA's Setting().get() returns '' for them,
    # and authlib raises `RuntimeError: Missing "authorize_url" value` at
    # routes/index.py:155 oidc_login → the bare-URL zero-click 302 lands on
    # PDA's own HTTP 500, never on Keycloak. A rolling restart once the
    # Secret exists makes /oidc/login 302 to KC and the owner lands on
    # /dashboard/ signed-in (verified live on hw136).
    #
    # Stakater Reloader (bp-reloader, --reload-strategy=annotations) watches
    # the named Secret and triggers a rolling restart on every change — so
    # the moment the ExternalSecret syncs the OIDC bundle the Pod is rolled
    # and picks up the env via envFrom. Same idiom catalyst-api uses
    # (secret.reloader.stakater.com/reload=handover-jwt-public,...). Gated
    # on sso.enabled so a non-SSO Sovereign emits no annotation.
    secret.reloader.stakater.com/reload: "pda-sso-oidc-credentials"
  {{- end }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bp-powerdns-admin
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bp-powerdns-admin
        app.kubernetes.io/instance: {{ .Release.Name }}
        catalyst.openova.io/blueprint: bp-powerdns-admin
        # kyverno cilium-l7-mtls / cilium-enforced-label (baseline policy
        # 09-cilium-l7-mtls): every Deployment/StatefulSet/DaemonSet Pod
        # template must carry this label so the catalyst-network controller
        # attaches the Pod to the L7 mTLS mesh. Without it the Enforce
        # admission DENIES the Deployment — caught on the hw126 fresh prov,
        # the first time bp-powerdns-admin ever reached kyverno admission.
        policy.cilium.io/enforced: "true"
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.sso.enabled }}
      {{- $oidcGate := .Values.sso.oidcReadinessGate | default dict }}
      {{- /* default-true gate that RESPECTS an explicit `false`: the Helm
         `default true <bool>` idiom wrongly coerces an explicit false back to
         true because false is the bool zero-value. Test key presence + value
         directly (same idiom as the newapi httproute ssoInit gate). */}}
      {{- $oidcGateOn := or (not (hasKey $oidcGate "enabled")) $oidcGate.enabled }}
      {{- if $oidcGateOn }}
      initContainers:
        # #3374 (2026-06-14) — OIDC-readiness gate. THE ROBUST FIX for the
        # fresh-prov HTTP 500. The OIDC env (OIDC_OAUTH_AUTHORIZE_URL/_TOKEN_URL/
        # _KEY/_SECRET …) is injected into the main container via
        # `envFrom.secretRef: pda-sso-oidc-credentials` (optional: true), and
        # kubelet evaluates `envFrom` EXACTLY ONCE at container creation. On a
        # fresh prov the PDA Pod starts ~3min BEFORE bp-sso-bridge mints the
        # Keycloak client + projects that ExternalSecret (measured live: Pod
        # created 15:38:44Z, Secret created 15:41:41Z on hw138), so the main
        # container boots with EMPTY OIDC_OAUTH_AUTHORIZE_URL → PDA's
        # Setting().get() returns '' → authlib raises `Missing "authorize_url"
        # value` (routes/index.py oidc_login) → the bare-URL zero-click 302
        # lands on PDA's own HTTP 500, never on Keycloak.
        #
        # The Stakater Reloader annotation (below, kept for ROTATIONS) was the
        # prior-only mechanism and is NOT reliable for the FIRST secret
        # CREATION on a fresh prov — measured live on hw138 the annotation was
        # present yet Reloader never rolled the Pod (108min old, never
        # restarted; zero reload activity in its log) → the env stayed empty
        # and /oidc/login 500'd the whole 108min the env was up. An
        # init-container is event-deterministic: the main container CANNOT
        # start until the OIDC Secret exists AND OIDC_OAUTH_AUTHORIZE_URL is
        # populated, so `envFrom` ALWAYS sees the real values at container
        # creation and the env is NEVER empty at first serve. Kubernetes
        # refreshes a mounted Secret in place within ~60s of the ExternalSecret
        # sync, so this gate clears with NO Pod restart once bp-sso-bridge
        # publishes. Fresh-prov-safe, zero-touch. Gated on sso.enabled (a
        # non-SSO Sovereign emits no init-container) and individually opt-out
        # via sso.oidcReadinessGate.enabled=false.
        #
        # Image = the PDA image itself: it has /bin/sh + /bin/cat, and matches
        # the SAME kyverno harbor-proxy glob (*/proxy-*/*) as the main
        # container, so kyverno harbor-proxy-pull's anyPattern (which requires
        # ONE allowed glob to match BOTH initContainers AND containers) passes
        # — a curl/dockerhub image would be DENIED (the bp-guacamole jdbc-seed
        # + bp-newapi dsn-gate lesson). Operators override via
        # sso.oidcReadinessGate.image with any image matching the glob.
        - name: wait-for-oidc
          image: {{ $oidcGate.image | default (printf "%s:%s" .Values.image.repository .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # The OIDC Secret is projected at /oidc/OIDC_OAUTH_AUTHORIZE_URL.
              # Wait until bp-sso-bridge's ExternalSecret has materialised a
              # NON-EMPTY authorize URL (the key that makes authlib's
              # register() succeed). `-s` = exists AND non-zero size.
              TIMEOUT={{ $oidcGate.timeoutSeconds | default 600 }}
              INTERVAL={{ $oidcGate.intervalSeconds | default 5 }}
              echo "[oidc-gate] waiting for a non-empty OIDC_OAUTH_AUTHORIZE_URL at /oidc (budget ${TIMEOUT}s)"
              deadline=$(( $(date +%s) + TIMEOUT ))
              while [ "$(date +%s)" -lt "${deadline}" ]; do
                if [ -s /oidc/OIDC_OAUTH_AUTHORIZE_URL ]; then
                  echo "[oidc-gate] OIDC_OAUTH_AUTHORIZE_URL populated — PDA will register the OIDC provider"
                  exit 0
                fi
                sleep "${INTERVAL}"
              done
              echo "[oidc-gate] FATAL: OIDC_OAUTH_AUTHORIZE_URL still empty after ${TIMEOUT}s — bp-sso-bridge did not project pda-sso-oidc-credentials; refusing to boot into a guaranteed /oidc/login HTTP 500" >&2
              exit 1
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: oidc-credentials
              mountPath: /oidc
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      {{- end }}
      {{- end }}
      containers:
        - name: powerdns-admin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort | default 9191 }}
              protocol: TCP
          env:
            # ─── Database wiring ───────────────────────────────────────
            # The `powerdnsadmin/pda-legacy` image (current upstream) does
            # NOT honor the SQLA_DB_* split env vars — those were the old
            # `ngoduykhanh/powerdns-admin` entrypoint convention, which
            # assembled the SQLAlchemy URI from them at container start.
            # pda-legacy's `create_app()` instead loads its baked-in
            # `powerdnsadmin/docker_config.py` (which HARDCODES
            # `SQLALCHEMY_DATABASE_URI = 'sqlite:////data/powerdns-admin.db'`)
            # and then runs `AppSettings.load_environment()` LAST, which
            # only overrides config keys whose UPPERCASED env var name
            # matches a known setting — i.e. it reads `SQLALCHEMY_DATABASE_URI`
            # verbatim, never the SQLA_DB_* parts. So to actually land on
            # the provisioned CNPG `pda-pg` cluster (instead of silently
            # falling back to on-disk SQLite) we MUST set the full
            # `SQLALCHEMY_DATABASE_URI` from the CNPG-generated `uri` key.
            # Refs #3189.
            - name: SQLALCHEMY_DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret.name | default "pda-database-secret" }}
                  key: {{ .Values.databaseSecret.uriKey | default "uri" }}
            # ─── SQLAlchemy connection resilience (#3374) ────────────────
            # CNPG/PostgreSQL recycle idle SSL connections server-side. Without
            # pool_pre_ping, PDA hands out a dead pooled connection on the next
            # request → `psycopg2.OperationalError: SSL connection has been
            # closed unexpectedly`, the transaction is left invalid, and EVERY
            # subsequent request 500s with `PendingRollbackError` (PDA runs a
            # Setting().get() DB query in before_request + inject_sitename on
            # every request) — bricking the bare-URL zero-click `/` entry and
            # the OIDC callback that onboards the SSO user, so the operator
            # never lands on /dashboard. Measured live on hw167 (dep
            # 28d4e96f96407bbb). PDA's lib/settings.py load_environment maps env
            # `SQLALCHEMY_ENGINE_OPTIONS` (a known `dict`-typed default) ⇄
            # app.config['SQLALCHEMY_ENGINE_OPTIONS'] via json.loads, which
            # Flask-SQLAlchemy 2.5.1 passes straight to create_engine(). Render
            # the values map as a JSON string. Omitted when the map is empty.
            {{- with .Values.config.sqlAlchemyEngineOptions }}
            - name: SQLALCHEMY_ENGINE_OPTIONS
              value: {{ toJson . | quote }}
            {{- end }}
            # The SQLA_DB_* vars below are retained for documentation +
            # forward/backward compatibility with the older ngoduykhanh
            # image; pda-legacy ignores them but they are harmless.
            - name: SQLA_DB_TYPE
              value: "postgres"
            - name: SQLA_DB_HOST
              value: "{{ .Values.postgres.cluster.name | default "pda-pg" }}-rw.{{ .Release.Namespace }}.svc.cluster.local"
            - name: SQLA_DB_PORT
              value: "5432"
            - name: SQLA_DB_NAME
              value: {{ .Values.postgres.cluster.database | default "pda" | quote }}
            - name: SQLA_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret.name | default "pda-database-secret" }}
                  key: {{ .Values.databaseSecret.usernameKey | default "username" }}
            - name: SQLA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret.name | default "pda-database-secret" }}
                  key: {{ .Values.databaseSecret.passwordKey | default "password" }}
            # ─── Flask SECRET_KEY ─────────────────────────────────────
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.flaskSecretKey.secretName | default "pda-flask-key" }}
                  key: SECRET_KEY
            # ─── PowerDNS backend ────────────────────────────────────
            - name: PDNS_VERSION
              value: {{ .Values.pdns.version | default "4.7" | quote }}
            - name: PDNS_PROTO
              value: {{ .Values.pdns.protocol | default "http" | quote }}
            - name: PDNS_API_URL
              value: {{ .Values.pdns.apiUrl | quote }}
            - name: PDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pdns.apiKeySecret.name | default "pdns-api-credentials" }}
                  key: {{ .Values.pdns.apiKeySecret.key | default "api-key" }}
            # ─── Proxy + UI behaviour ────────────────────────────────
            - name: GUNICORN_LOGLEVEL
              value: "info"
            {{- if .Values.config.proxyFix }}
            - name: REMOTE_USER_LOGOUT_URL
              value: "/login"
            - name: PROXY_FIX
              value: "true"
            {{- end }}
            # ─── G91.powerdns-admin SSO wiring ───────────────────────
            {{- if .Values.sso.enabled }}
            - name: OIDC_OAUTH_ENABLED
              value: "True"
            - name: OIDC_OAUTH_AUTO_CONFIGURE
              value: "True"
            - name: OIDC_OAUTH_SCOPE
              value: "openid profile email groups"
            # #3150 — the env-var NAMES MUST be PDA's exact setting keys
            # upper-cased (powerdnsadmin/lib/settings.py load_environment maps
            # `oidc_oauth_<x>` ⇄ env `OIDC_OAUTH_<X>`; Setting().get reads
            # app.config[KEY] BEFORE the DB). The earlier `_CLAIM` / `_PROPERTY`
            # suffixes were WRONG names → PDA ignored them → Setting().get fell
            # through to the seeded DB defaults. Caught live on hw124: with the
            # wrong `OIDC_OAUTH_FIRST_NAME_PROPERTY`, the login view's
            # `user_data[Setting().get('oidc_oauth_firstname')]` resolved to the
            # DB default `given_name` → `KeyError: 'given_name'` → HTTP 500 on
            # the OIDC callback.
            - name: OIDC_OAUTH_USERNAME
              value: "preferred_username"
            # catalyst-pin federated users carry ONLY email + groups +
            # preferred_username — NO `given_name` / `family_name` name claims
            # (catalyst-pin's id_token has no name claims; see
            # platform/keycloak/chart/templates/configmap-sovereign-realm.yaml).
            # PDA's login view does an UNGUARDED `user_data[<firstname>]` lookup,
            # so point firstname + last_name at `preferred_username` (always
            # present) — otherwise the callback 500s and the operator never
            # lands inside PDA.
            - name: OIDC_OAUTH_FIRSTNAME
              value: "preferred_username"
            - name: OIDC_OAUTH_LAST_NAME
              value: "preferred_username"
            - name: OIDC_OAUTH_EMAIL
              value: "email"
            - name: OIDC_OAUTH_ACCOUNT_NAME_PROPERTY
              value: "groups"
            - name: OIDC_OAUTH_ACCOUNT_DESCRIPTION_PROPERTY
              value: "preferred_username"
            - name: SIGNUP_ENABLED
              value: {{ .Values.sso.autoOnboard | default true | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          envFrom:
            {{- if .Values.sso.enabled }}
            - secretRef:
                name: pda-sso-oidc-credentials
                optional: true
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-upload
              mountPath: /app/upload
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: app-upload
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.sso.enabled }}
        {{- $oidcGate := .Values.sso.oidcReadinessGate | default dict }}
        {{- $oidcGateOn := or (not (hasKey $oidcGate "enabled")) $oidcGate.enabled }}
        {{- if $oidcGateOn }}
        # #3374: the bp-sso-bridge OIDC ExternalSecret, projected so the
        # wait-for-oidc initContainer can block until OIDC_OAUTH_AUTHORIZE_URL
        # is populated. optional: true so a non-SSO / pre-sync render still
        # mounts (the gate then polls until the key appears). Same Secret the
        # main container reads via envFrom.
        - name: oidc-credentials
          secret:
            secretName: pda-sso-oidc-credentials
            optional: true
        {{- end }}
        {{- end }}
