{{- /*
CNPG Cluster for PowerDNS-Admin metadata (users, RBAC, audit log).
Mirrors platform/gitea/chart/templates/cnpg-cluster.yaml.

CNPG operator generates a `<cluster>-app` Secret (`pda-pg-app`) carrying
the postgres-app user's `uri`/`username`/`password`. 0.1.14 (#3486):
deployment.yaml reads `pda-pg-app` DIRECTLY via secretKeyRef (same
namespace, no cross-namespace ref) — the old empty `pda-database-secret`
reflector pull-mirror (templates/database-secret.yaml) is retired because
its same-namespace `reflects:` pull raced the HR remediation churn and
never converged.

Capabilities gate (0.1.8, Refs #2737): bp-cnpg ships the
`postgresql.cnpg.io/v1` CRD. On a cold install — before bp-cnpg is
reconciling — the apiserver rejects this Cluster CR and the whole
HelmRelease render fails, wedging bp-powerdns-admin BEFORE it ever
reaches kyverno admission. The Capabilities check skips this template
until the CRD is registered, making the render self-healing on a partial
reconcile. The bootstrap-kit slot 11a `dependsOn bp-cnpg` already orders
this, but the guard mirrors the bp-gitea / bp-harbor gold-standard
pattern so the chart never half-renders.
*/ -}}
{{- /*
Embedded-cluster gate (0.1.12, #3370): `postgres.cluster.enabled=false`
skips the bundled pda-pg Cluster entirely — PDA then runs against the
shared-pg-b instance's `pda` Context (slot 16c) via the reflected
`pda-shared-database-secret` hub Secret (databaseSecret.name flip in
slot 11a). Default true keeps the 1:1 embedded render byte-identical.
*/ -}}
{{- $clusterEnabled := true }}
{{- if hasKey .Values.postgres.cluster "enabled" }}
{{- $clusterEnabled = ne (toString .Values.postgres.cluster.enabled) "false" }}
{{- end }}
{{- if and $clusterEnabled (.Capabilities.APIVersions.Has "postgresql.cnpg.io/v1") }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.cluster.name | default "pda-pg" }}
  namespace: {{ .Values.postgres.cluster.namespace | default .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-powerdns-admin
    catalyst.openova.io/component: pda-pg-cluster
spec:
  instances: {{ .Values.postgres.cluster.instances | default 1 }}
  imageName: {{ .Values.postgres.cluster.imageName | default "harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql" }}:{{ .Values.postgres.cluster.pgVersion | default "16" }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.cluster.database | default "pda" }}
      owner: {{ .Values.postgres.cluster.owner | default "pda" }}
  storage:
    size: {{ .Values.postgres.cluster.storageSize | default "5Gi" }}
    storageClass: {{ .Values.postgres.cluster.storageClass | default "local-path" }}
  resources:
    {{- toYaml .Values.postgres.cluster.resources | nindent 4 }}

  # inheritedMetadata.annotations: CNPG propagates these onto every Secret
  # it generates (pda-pg-app, pda-pg-superuser, …). The `inheritedMetadata`
  # stanza is the correct CNPG v1.24+ mechanism (CNPG does not copy a
  # Cluster CR's own `metadata.annotations` onto generated Secrets).
  #
  # 0.1.14 (#3486): the PDA Deployment now reads `pda-pg-app` DIRECTLY
  # (values.yaml databaseSecret.name), so these reflection-allowed
  # annotations are no longer load-bearing for THIS chart — the racy
  # same-namespace `reflects:` pull they enabled is retired (see
  # templates/database-secret.yaml). They are kept (harmless) so that any
  # cross-namespace consumer that opts into AUTO-reflection of pda-pg-app
  # keeps working, mirroring the gitea/harbor gold-standard pattern.
  #
  # Historical (#3150): before this block existed, reflector logged
  # "Source powerdns-admin/pda-pg-app does not permit it" and the old
  # pda-database-secret mirror stayed empty → CreateContainerConfigError.
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: {{ .Values.postgres.cluster.namespace | default .Release.Namespace | quote }}
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: {{ .Values.postgres.cluster.namespace | default .Release.Namespace | quote }}
{{- end }}
