{{- /*
Mirror of the bp-powerdns REST API credentials into the powerdns-admin ns.

The source Secret `powerdns-api-credentials` is generated by bp-powerdns
(slot 11) in the `powerdns` namespace
(platform/powerdns/chart/templates/api-credentials-secret.yaml) and carries
keys `api-key` + `webserver-password`. The PDA Deployment reads the API key
via secretKeyRef on `pdns.apiKeySecret.name` (default `pdns-api-credentials`)
key `pdns.apiKeySecret.key` (default `api-key`) to populate PDNS_API_KEY.

We ship a STUB Secret here with an explicit
`reflector.v1.k8s.emberstack.com/reflects: powerdns/powerdns-api-credentials`
annotation — reflector copies the source's bytes into this stub (renaming
`powerdns-api-credentials` → `pdns-api-credentials`) and keeps it in sync.
This is the same cross-namespace pull idiom as
platform/sso-bridge/chart/templates/secret-kc-credentials-mirror.yaml and the
same-namespace pull in templates/database-secret.yaml.

#3150: before this template existed, the PDA chart referenced a
`pdns-api-credentials` Secret that NOTHING created (the source is named
`powerdns-api-credentials` and reflector preserves the source name on
auto-push), and bp-powerdns did not permit reflection into the
powerdns-admin ns. Result: the PDA Pod wedged in CreateContainerConfigError
("secret pdns-api-credentials not found"). The matching source-side opt-in
(`powerdns-admin` added to reflection-allowed-namespaces) ships in the
bp-powerdns chart in the same change.

Why this is safe — reflector is the only writer (see the sso-bridge mirror
for the full rationale): the stub installs with empty `data:`; reflector
fills it within a reconcile interval once the source exists; the kubelet
re-reads the atomic Secret volume so the Pod picks up the key on next start.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.pdns.apiKeySecret.name | default "pdns-api-credentials" }}
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-powerdns-admin
    catalyst.openova.io/component: pdns-api-credentials-mirror
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "{{ .Values.pdns.sourceSecret.namespace | default "powerdns" }}/{{ .Values.pdns.sourceSecret.name | default "powerdns-api-credentials" }}"
type: Opaque
