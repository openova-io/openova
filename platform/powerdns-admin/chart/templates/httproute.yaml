{{- /*
HTTPRoute — Cilium Gateway API (issue #387). Per-Sovereign overlay
supplies `gateway.host` (e.g. pdns-admin.<sovereign-fqdn>). Default
parentRef cilium-gateway/kube-system. sectionName intentionally empty
per PR #1888 / TBD-A40 (multi-zone Sovereigns rename HTTPS listeners).
*/ -}}
{{- if and .Values.gateway.enabled .Values.gateway.host }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-bp-powerdns-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bp-powerdns-admin
    app.kubernetes.io/instance: {{ .Release.Name }}
    catalyst.openova.io/blueprint: bp-powerdns-admin
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentRef.name | default "cilium-gateway" }}
      namespace: {{ .Values.gateway.parentRef.namespace | default "kube-system" }}
      {{- with .Values.gateway.parentRef.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
{{- if and .Values.sso .Values.sso.bareURL .Values.sso.bareURL.enabled }}
{{- /*
ROOT-URL zero-click SSO (#3374) — the CALLBACK-AWARE approach the 0.1.11
revert (464e4182, #3353) demanded. ONLY the bare root `/` is intercepted.

Why the 0.1.10 `/login` rule looped (verified against the live pda-legacy
0.4.2 source, powerdnsadmin/routes/index.py + services/oidc.py):
  - /oidc/authorized (the KC callback) stores the token in the Flask
    session and 302s to /login (services/oidc.py oidc_authorized());
  - /login is where the oidc_token -> app-session exchange happens
    (routes/index.py login(), `if 'oidc_token' in session:` branch);
  - intercepting /login therefore decapitates the callback chain:
    /login -> gw -> /oidc/login -> KC -> /oidc/authorized -> /login -> gw
    -> ... = ERR_TOO_MANY_REDIRECTS.

Why the root-only rule CANNOT loop:
  - post-exchange, authenticate_user() 302s to /login, whose
    authed-user guard 302s STRAIGHT to /dashboard/ (routes/index.py
    login(): `return redirect(url_for('dashboard.dashboard'))`) —
    the chain never revisits `/`;
  - /login, /oidc/login and /oidc/authorized are never intercepted, so
    any OIDC error degrades to the visible login form, never a loop.
Port is explicit 443 (the #3310 listener-port-leak class).
*/}}
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            port: 443
            path:
              type: ReplaceFullPath
              replaceFullPath: /oidc/login
            statusCode: 302
{{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.path | default "/" | quote }}
      backendRefs:
        - name: {{ .Values.gateway.backendService | default (printf "%s-bp-powerdns-admin" .Release.Name) }}
          port: {{ .Values.gateway.backendPort | default 80 }}
{{- end }}
