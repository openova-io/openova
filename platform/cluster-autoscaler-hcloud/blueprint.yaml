apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-cluster-autoscaler-hcloud
  annotations:
    catalyst.openova.io/provider: hetzner
spec:
  version: 1.3.0
  card:
    title: Cluster Autoscaler (Hetzner)
    summary: Kubernetes Cluster Autoscaler with the Hetzner Cloud provider — scales worker node pools up/down to match scheduled-Pod demand on hcloud-backed Sovereigns.
    icon: cluster-autoscaler.svg
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  class: platform-component
  lifecycle: experimental
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-cluster-autoscaler-hcloud
  upgrades:
    from: ["0.x"]
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  endpoints: []
