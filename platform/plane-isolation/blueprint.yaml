apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-plane-isolation
  labels:
    catalyst.openova.io/section: pts-3-1-networking-and-service-mesh
spec:
  version: 0.1.9  # lockstep with chart/Chart.yaml (#4468 — smoke-render-mode=default-off so the OCI publish stops wedging on the empty client-side render)
  card:
    title: Plane isolation (per-component default-deny)
    summary: |
      Per-component default-deny NetworkPolicy + gateway-ingress
      CiliumNetworkPolicy for the de-vclustered platform planes (#4291
      Workstream C). Replaces the whole-plane policy on the mgmt/rtz/dmz
      vCluster syncer namespaces with a tight per-component policy pair —
      one-component blast radius, the core micro-segmentation win.
    family: networking
    documentation: ./README.md
  visibility: unlisted
  owner:
    team: platform
    contact: platform@openova.io
  configSchema:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
        description: Master gate. Default on — micro-segmentation of the de-vclustered platform planes is the canonical Sovereign posture.
      dnsNamespace:
        type: string
        default: kube-system
        description: Namespace where CoreDNS lives (DNS egress is always allowed).
      components:
        type: array
        description: One entry per de-vclustered platform component's host namespace, with its explicit cross-component ingress allow-list and whether it faces the public gateway.
        items:
          type: object
          properties:
            namespace:
              type: string
            gatewayIngress:
              type: boolean
              default: false
            allowIngressFrom:
              type: array
              items:
                type: string
  placementSchema:
    modes: [single-region, active-active]
    default: active-active
    minRegions: 1
    maxRegions: 5
  manifests:
    chart: ./chart
  depends:
    - blueprint: bp-cilium
      version: ^1
  upgrades:
    from: ["0.x"]
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        replication:
          backend: flux-git
          mode: async
        placement:
          tier: ''
          clusters:
            - mgmt-A
            - mgmt-B
            - dmz-A
            - dmz-B
            - rtz-A
            - rtz-B
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  multiInstance:
    enabled: false
