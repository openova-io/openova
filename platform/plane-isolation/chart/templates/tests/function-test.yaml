{{- /*
Function test of bp-plane-isolation (docs/RUNBOOKS.md section 4.5). `helm test` runs it.

The chart gives each platform namespace of components[] a default-deny
NetworkPolicy that admits only its own Pods, flux-system and the namespaces of
its allowIngressFrom. The test checks that this holds for one protected
namespace, the target: functionTest.target.namespace (default keycloak, the
sign-in service every application depends on), on the Pod port
functionTest.target.port (default 7800) of a ready address of its Service
functionTest.target.host (default keycloak.keycloak.svc.cluster.local).

The port is a port of the target's Pods that no policy may open to a foreign
namespace. Keycloak's 7800 is its Infinispan cluster transport, which only the
Keycloak Pods of the two regions may reach (bp-keycloak, values
keycloak.networkPolicy). Its HTTP port 8080 is not a test of
isolation: bp-keycloak serves the issuer to every source by design, because
the Organizations' namespaces dial it in-cluster and their names are not
known. Up to and including 0.1.19 the test dialled the Service on port 80
(Pod port 8080), so it could pass only if Keycloak's issuer stopped answering
the platform.

The test Pod runs in functionTest.namespace (default "default"), a namespace
that the target does not admit. It first reads, through the Kubernetes API, the
Endpoints of the target Service and requires at least one ready address, so a
target that is down cannot pass the test. Another release delivers the target
(bp-keycloak), and this release cannot depend on it without moving the
isolation policies behind the identity service, so on a fresh install the test
runs before the target is up: it reads the Endpoints again every 5 seconds
until 60 seconds before its bound T, and fails naming the target Service when
it has no ready address by then. T is functionTest.timeoutSeconds, the Pod's
activeDeadlineSeconds: the kit states the install timeout of its release
there, no shorter than the target release's (docs/RUNBOOKS.md section 4.5);
without it T is 300. Then it connects to the first ready address on the
port. It passes when no connection is made within 5 seconds (curl exit code 28,
or 7 when it is refused). It fails when the connection is made, whatever the
port answers (curl's time_connect is not zero): then a namespace outside the
allow-list reaches the protected namespace. It writes nothing.

So that only the target's own policies decide, a CiliumNetworkPolicy of this
file (rendered when the API cilium.io/v2 is served) lets the test Pod send to
cluster DNS, the Kubernetes API and every Pod of the target namespace. It is
named <release>-function-test-egress: helm-controller records the result of a
release's test hooks by name (status.history[].testHooks), and Helm keeps a
CiliumNetworkPolicy hook after the Pod hook, so under the Pod's name its
"Succeeded" overwrote the Pod's "Failed" and check SVC-G06 read a failed test
as passed (hw307, 21 Nov 2026, both regions). A ServiceAccount in the test
namespace, and a Role and RoleBinding in the target namespace (get on the
Endpoints of the target Service), give the Pod the right to read the
Endpoints; they come before the Pod in Helm's order, so the Pod's result is
the one kept under the shared name.

It renders only when enabled is true, the target namespace is one of
components[], and the test namespace is neither on its allowIngressFrom nor
flux-system. The image is the kubectl image the kit already pulls (bp-cnpg's
webhook gate), which carries curl; functionTest.image overrides it.
*/ -}}
{{- $ft := .Values.functionTest | default dict }}
{{- $testNamespace := $ft.namespace | default "default" }}
{{- $target := $ft.target | default dict }}
{{- $targetNamespace := $target.namespace | default "keycloak" }}
{{- $targetHost := $target.host | default "keycloak.keycloak.svc.cluster.local" }}
{{- $targetPort := $target.port | default 7800 }}
{{- $targetService := first (splitList "." $targetHost) }}
{{- $protected := false }}
{{- range .Values.components }}
{{- if and (eq .namespace $targetNamespace) (not (has $testNamespace (.allowIngressFrom | default list))) }}
{{- $protected = true }}
{{- end }}
{{- end }}
{{- if and .Values.enabled $protected (ne $testNamespace "flux-system") (ne $testNamespace $targetNamespace) }}
{{- $image := $ft.image | default "harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4" }}
{{- $bound := int ($ft.timeoutSeconds | default 300) }}
{{- $wait := sub $bound 60 }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ $testNamespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ $targetNamespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: [{{ $targetService | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ $targetNamespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-function-test
    namespace: {{ $testNamespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-function-test
  apiGroup: rbac.authorization.k8s.io
{{- if .Capabilities.APIVersions.Has "cilium.io/v2" }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-function-test-egress
  namespace: {{ $testNamespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      catalyst.openova.io/function-test: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.dnsNamespace | default "kube-system" }}
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $targetNamespace }}
{{- end }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ $testNamespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    catalyst.openova.io/function-test: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: {{ $bound }}
  serviceAccountName: {{ .Release.Name }}-function-test
  containers:
    - name: function-test
      image: {{ $image | quote }}
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: HOME
          value: /tmp
        - name: TEST_NAMESPACE
          value: {{ $testNamespace | quote }}
        - name: TARGET_NAMESPACE
          value: {{ $targetNamespace | quote }}
        - name: TARGET_SERVICE
          value: {{ $targetService | quote }}
        - name: TARGET_PORT
          value: {{ $targetPort | quote }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          {{- include "kube-access-lib.in-cluster-kubeconfig" . | nindent 10 }}
          fail() { echo "FUNCTION-TEST fail {{ .Chart.Name }} $1"; exit 1; }
          ready=""
          while [ "${SECONDS}" -lt {{ $wait }} ]; do
            ready="$(kubectl --request-timeout=15s -n "${TARGET_NAMESPACE}" get endpoints "${TARGET_SERVICE}" -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/tmp/error)" && [ -n "${ready}" ] && break
            sleep 5
          done
          [ -n "${ready}" ] || fail "the Service ${TARGET_NAMESPACE}/${TARGET_SERVICE} has no ready address within {{ $wait }} seconds, so the test cannot judge: $(tr '\n' ' ' < /tmp/error | cut -c1-160)"
          address="${ready%% *}"
          target="${TARGET_SERVICE}.${TARGET_NAMESPACE} Pod ${address} port ${TARGET_PORT}"
          # time_connect is the time to the completed TCP connection, 0 when none was made: any digit but 0 means connected.
          connect="$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{time_connect}' "http://${address}:${TARGET_PORT}/" 2>/tmp/error)"
          rc=$?
          if [ -n "$(printf '%s' "${connect}" | tr -d '0.')" ]; then
            fail "a Pod in ${TEST_NAMESPACE} connected to ${target} (curl exit code ${rc}): the namespace ${TARGET_NAMESPACE} is not isolated"
          fi
          case "${rc}" in
            28|7) ;;
            *) fail "the connection to ${target} ended with curl exit code ${rc}: $(tr '\n' ' ' < /tmp/error | cut -c1-160)" ;;
          esac
          echo "FUNCTION-TEST pass {{ .Chart.Name }} a Pod in ${TEST_NAMESPACE} could not connect to ${target} (curl exit code ${rc}), a ready address"
  volumes:
    - name: tmp
      emptyDir: {}
{{- end }}
