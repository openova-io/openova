apiVersion: v2
name: bp-plane-isolation
# 0.1.0 (#4291 Workstream C — Refs #4293 #3642 #3373, 2026-06-25): the
# de-vcluster inverse of #3642. When the mgmt/rtz/dmz platform planes
# stop being vClusters and each platform component runs in its OWN
# first-class HOST namespace (placement.yaml `vcluster: host`), the
# whole-plane NetworkPolicy + gateway-ingress CNP that bp-{mgmt,rtz,dmz}-
# vcluster shipped per syncer-namespace (mgmt/rtz/dmz) must be replaced by
# a PER-COMPONENT default-deny + explicit-allow pair — the core
# micro-segmentation win of #4291. This chart renders, for each declared
# host namespace, BOTH:
#   (a) a default-deny NetworkPolicy (podSelector:{}, Ingress+Egress) with
#       only the explicit namespaceSelector allows that component needs
#       (derived from the cross-component call graph) + DNS egress, AND
#   (b) the mandatory CiliumNetworkPolicy fromEntities:[ingress,host,
#       remote-node] — without which Cilium-Gateway/envoy traffic (which
#       carries the reserved `ingress` ENTITY no namespaceSelector can
#       match) is silently dropped → curl 000/503 (the #2940 hw159–hw165
#       app-plane wedge). No `world` — only the gateway reaches them.
# The allow-set tightens from coarse-namespace (whole-plane) to
# per-component — one-component blast radius instead of whole-plane.
# 0.1.1 (#4347 / Refs #4325): FIX the missing YAML document separator between
#   rendered manifests. Both templates chomped the newline before `---` (the
#   `{{- $ns := .namespace -}}` trailing `-}}`), gluing `---` onto the previous
#   doc's last line (`cidr: 0.0.0.0/0---`, `- remote-node---`) → Helm's
#   post-render saw ONE doc with N duplicate `apiVersion` keys → `unmarshal
#   errors: mapping key "apiVersion" already defined` → bp-plane-isolation HR
#   install FAILED (live on omantel.biz region-a). All 24 docs now separate
#   cleanly. Dropped the `-}}` chomp on the $ns assignment in both templates.
# 0.1.2 (#4360 / Refs #4272 #4307 #4322 #4179): FIX the default-deny egress
#   rule silently dropping ALL in-cluster traffic under Cilium. The egress
#   allow was `ipBlock: 0.0.0.0/0` ONLY — but a K8s NetworkPolicy CIDR rule
#   matches Cilium's `world` entity, NOT in-cluster pod identities, so every
#   covered component's cross-component dial (gitea→shared-pg, keycloak→CNPG,
#   harbor→openbao, …) was Policy-denied. Live proof on omantel.biz region-a:
#   `cilium monitor` drop `identity gitea->shared-pg 10.42.2.135 -> 10.42.4.241:5432
#   tcp SYN` → gitea SQL 2m timeouts → all git auth 401 → every funnel Org's
#   GitRepository source False → org-controller GiteaOrgFailed → ZERO funnel
#   Orgs converge. Added a companion `namespaceSelector: {}` egress rule so the
#   union admits in-cluster identities alongside world. Same reserved-entity
#   class as the gateway `ingress` CNP this chart already ships.
# 0.1.3 (#4382 / Refs #4360 #4322 #4297 #4292): ADD org-services to gitea's
#   allowIngressFrom. The 0.1.2 gitea default-deny INGRESS allowlist covered
#   cnpg-system/external-secrets-system/catalyst-system/flux-system but OMITTED
#   org-services — so the provisioning service (org-services) dialing gitea-http
#   :3000 to validate its bootstrap PAT + bootstrap per-Org gitops repos on the
#   funnel CreateOrg path was Cilium-dropped → provisioning wait-for-gitea-token
#   init got HTTP 000 (connection timeout, not a token reject) → funnel Org
#   bootstrap wedged even with gitea Ready + a valid PAT. Live proof on
#   omantel.biz region-a (kom4dc dep 4635277cae4ffed9, 2026-06-26):
#   `curl --max-time 8 http://gitea-http.gitea.svc:3000/api/v1/version` → code=000
#   exit=28 from the provisioning pod while the same PAT returns 200 from a gitea
#   pod. core/services/provisioning/github/client.go is the legitimate consumer.
# 0.1.4 (#4325 #4382 comprehensive dial-graph sweep): the #4361/#4380/#4383
#   fixes each closed ONE de-vcluster ingress gap as live traffic hit it. This
#   sweep audits the FULL cross-component dial graph (org-services/provisioning/
#   sandbox/newapi/guacamole/grafana/observability) and closes every remaining
#   denied-but-legitimate ingress edge in ONE pass, plus adds the three
#   de-vcluster'd host namespaces that had NO default-deny at all (opentelemetry,
#   alloy, oidc-gate) so the plane segmentation is complete. ADDED ingress edges:
#     keycloak     ← sandbox (controller+MCP realm/user OIDC admin), newapi
#                    (admin-UI OIDC), guacamole (OIDC silent-login), grafana (SSO)
#     gitea        ← sandbox (per-Sandbox repo create/read)
#     nats-system  ← newapi (metering-sidecar usage events)
#     seaweedfs    ← sandbox (per-Sandbox MCP S3 storage)
#     grafana      ← cnpg-system (grafana-app Postgres backend)
#   NEW components (own default-deny, were un-policied → wide open post-#4325):
#     opentelemetry ← alloy (OTLP forward), catalyst-system (OTLP emit)
#     alloy         (pure source — default-deny ingress, nothing dials in)
#     oidc-gate     (gateway-fronted auth proxy — gatewayIngress CNP only)
#   A new contract test (Case 30, tests/e2e/bootstrap-kit) asserts the known
#   dial graph is fully covered so a future de-vcluster/re-home can't silently
#   drop an edge. Egress stays open (0.1.2 union) — only ingress edges added;
#   default-deny posture intact. Refs #4325 #4382 #4361 #4380 #4383.
# 0.1.5 (#4428 / Refs #4360 #4409 #4325): ADD a kube-apiserver-egress
#   CiliumNetworkPolicy (toEntities:[kube-apiserver]) for EVERY component. The
#   0.1.2 egress union (namespaceSelector:{} + ipBlock 0.0.0.0/0) covers
#   in-cluster pod identities + Cilium `world`, but NEITHER matches the reserved
#   `kube-apiserver` identity the apiserver ClusterIP VIP (10.96.0.1:443)
#   resolves to under kube-proxy-replacement — so every pod that dials the
#   kube-API in a default-denied namespace had its apiserver egress silently
#   dropped. Live proof on omantel.biz region-a (kom4dc dep 4635277cae4ffed9,
#   2026-06-26): the newapi CNPG instance-manager bootstrap initContainer hung
#   `wait-for-get-cluster ... Get https://10.96.0.1:443/apis/postgresql.cnpg.io
#   /v1/.../clusters/newapi-bp-newapi-newapi-pg: dial tcp 10.96.0.1:443: i/o
#   timeout` → Postgres never started → `-rw` Service had no endpoints → the
#   app CrashLooped → bp-newapi HR `Ready=False` Helm-rollback-context-deadline
#   → the `bootstrap-kit` Kustomization (wait:true, gates on bp-newapi) stalled
#   — the last blocker on #4409. Namespaces WITHOUT a plane-isolation
#   default-deny (org-services/org-pg, shared-data/shared-pg) stayed healthy,
#   isolating the cause to this chart's Egress policyType. A K8s NetworkPolicy
#   cannot express reserved:kube-apiserver, so the allow lives in a
#   CiliumNetworkPolicy — same reserved-entity class as the gateway `ingress`
#   CNP this chart already ships, and the egress sibling of the #4360 fix.
version: 0.1.5
description: |
  Per-component default-deny + explicit-allow micro-segmentation for the
  de-vclustered platform planes (#4291 Workstream C). For each platform
  component's host namespace, renders a default-deny NetworkPolicy +
  the gateway-ingress CiliumNetworkPolicy (fromEntities ingress/host/
  remote-node). The inverse of the #3642 host-bridge: replaces the
  whole-plane NetworkPolicy on the mgmt/rtz/dmz vCluster syncer namespaces
  with a tight per-component policy pair. Default ON per ADR-0001 §2
  (zero-trust) — every fresh Sovereign micro-segments its platform planes.
type: application
keywords: [catalyst, blueprint, network-policy, cilium, zero-trust, devcluster, micro-segmentation]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Annotations:
#
# - catalyst.openova.io/no-upstream: "true"
#   Opt out of the hollow-chart guard (issue #181): this chart ships only
#   Catalyst-authored CRs (NetworkPolicy + CiliumNetworkPolicy targeting
#   the cilium.io CRDs installed by bp-cilium). No upstream Helm subchart.
#   Same shape as bp-network-policies / bp-kyverno-policies / bp-continuum.
annotations:
  catalyst.openova.io/no-upstream: "true"
