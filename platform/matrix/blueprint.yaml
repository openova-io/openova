apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-matrix
spec:
  version: 1.1.0
  card:
    title: Matrix (Synapse)
    summary: "Self-hosted, federation-capable team chat. Synapse is the reference Matrix homeserver implementation — Catalyst's per- Sovereign tenancy default keeps federation OFF (private rooms only), and operator overlays toggle it on per-Organization for cross-Sovereign collaboration. Hosted at chat.<sovereign-fqdn> with a paired Element-Web client at chat-web.<sovereign-fqdn>. OIDC SSO via bp-keycloak; Postgres backend via bp-cnpg. (\"Synapse\" here = the Matrix server implementation, NOT the retired OpenOva product noun.) "
    description: "Self-hosted, federation-capable team chat. Synapse is the reference Matrix homeserver implementation — Catalyst's per- Sovereign tenancy default keeps federation OFF (private rooms only), and operator overlays toggle it on per-Organization for cross-Sovereign collaboration. Hosted at chat.<sovereign-fqdn> with a paired Element-Web client at chat-web.<sovereign-fqdn>. OIDC SSO via bp-keycloak; Postgres backend via bp-cnpg. (\"Synapse\" here = the Matrix server implementation, NOT the retired OpenOva product noun.) "
    icon: matrix.svg
    license: AGPL-3.0
    tags: [chat, messaging, federation, e2ee, oidc, application]
    docs: https://element-hq.github.io/synapse/
  visibility: listed
  class: application
  lifecycle: experimental
  owner:
    team: platform
    contact: platform@openova.io
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-matrix
  upgrades:
    from: ["0.x"]
  observability:
    metrics: prometheus
    logs: stdout
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-passive
    - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          tier: ''
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: ''
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: matrix.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: '{{.OrgSlug}}'
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  # ── /G117.1 ──
