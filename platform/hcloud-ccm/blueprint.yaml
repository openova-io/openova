apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-hcloud-ccm
  labels:
    catalyst.openova.io/section: pts-3-1-cloud-integration
  annotations:
    catalyst.openova.io/provider: hetzner
spec:
  version: 1.0.0
  card:
    title: Hetzner Cloud Controller Manager
    summary: Hetzner Cloud provider integration — node lifecycle, LoadBalancer Services, and route reconciliation on hcloud-backed Sovereign clusters.
    icon: hetzner.svg
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-hcloud-ccm
  upgrades:
    from: ["0.x"]
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  endpoints: []
