{{- /*
Function test of bp-sovereign-tls-vars (docs/RUNBOOKS.md section 4.5). `helm test` runs it.

The chart renders the ConfigMap sovereign-tls-vars in flux-system. The Flux
Kustomization sovereign-tls substitutes its two keys into the listener lists
of the shared and the console Gateway (postBuild.substituteFrom, optional:
false). The test reads that ConfigMap through the Kubernetes API. It passes
when each key the chart declares, PARENT_DOMAINS_LISTENERS_YAML and
CONSOLE_LISTENERS_YAML, holds a non-empty listener list: a value that starts
with [{ . It reads nothing else and writes nothing.

A ServiceAccount, and a Role and RoleBinding in flux-system (verb get on that
one ConfigMap), give the test Pod that right. It renders only when the chart
renders the ConfigMap (global.sovereignFQDN is set). The image is the kubectl
image the kit already pulls (bp-cnpg's webhook gate); functionTest.image
overrides it.
*/ -}}
{{- if .Values.global.sovereignFQDN }}
{{- $ft := .Values.functionTest | default dict }}
{{- $image := $ft.image | default "harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: flux-system
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["sovereign-tls-vars"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: flux-system
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-function-test
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-function-test
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    catalyst.openova.io/function-test: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 300
  serviceAccountName: {{ .Release.Name }}-function-test
  containers:
    - name: function-test
      image: {{ $image | quote }}
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: HOME
          value: /tmp
        - name: KEYS
          value: "PARENT_DOMAINS_LISTENERS_YAML CONSOLE_LISTENERS_YAML"
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          fail() { echo "FUNCTION-TEST fail {{ .Chart.Name }} $1"; exit 1; }
          for key in ${KEYS}; do
            value="$(kubectl --request-timeout=15s -n flux-system get configmap sovereign-tls-vars -o "jsonpath={.data.${key}}" 2>/tmp/error)" \
              || fail "the ConfigMap flux-system/sovereign-tls-vars cannot be read: $(tr '\n' ' ' < /tmp/error | cut -c1-160)"
            case "${value}" in
              "[{"*) ;;
              *) fail "the key ${key} holds no listener list: '$(printf '%s' "${value}" | cut -c1-80)'" ;;
            esac
          done
          echo "FUNCTION-TEST pass {{ .Chart.Name }} every key of flux-system/sovereign-tls-vars (${KEYS}) holds a listener list"
  volumes:
    - name: tmp
      emptyDir: {}
{{- end }}
