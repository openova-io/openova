{{- /*
sovereign-tls-vars ConfigMap — Flux postBuild.substituteFrom source for
the sovereign-tls Kustomization (clusters/_template/sovereign-tls/).

Moved out of products/catalyst/chart (bp-catalyst-platform) into this
dedicated chart — Refs #5187. bp-catalyst-platform is a PRIMARY-ONLY
HelmRelease (`suspend: ${SECONDARY_HR_SUSPEND:=false}`, G2 #2574): it
never installs on a secondary (DR-standby) region's control plane. The
`sovereign-tls` Kustomization, however, reconciles on EVERY region (no
region-role gate) with `postBuild.substituteFrom: [{kind: ConfigMap,
name: sovereign-tls-vars, optional: false}]` — so a secondary region's
Kustomization sat Ready=False forever (`configmaps "sovereign-tls-vars"
not found`) because nothing on that region ever rendered the CM.

This chart is installed via bootstrap-kit slot 12a with NO
region-role/suspend gate (the same "no gate ⇒ every region" shape
bp-cilium / bp-gateway-api / bp-cert-manager already use), so BOTH
regions get this ConfigMap identically. Region-a is unaffected — same
byte-for-byte template, same values contract, just a different
(always-on) HelmRelease owns it now.

Why this data is a ConfigMap at all (original #2118 rationale, preserved)
──────────────────────────────────────────────────────────────────────
The Cilium Gateway listeners block (cilium-gateway.yaml `spec.listeners:
${PARENT_DOMAINS_LISTENERS_YAML}`) was previously materialised in
infra/hetzner/main.tf (locals.parent_domains_listeners_yaml) and threaded
into cloud-init as an inline `postBuild.substitute` value on the
sovereign-tls Kustomization manifest.

That value scales O(N) with the parent_domains count: ~440 bytes per
parent zone (HTTPS+HTTP listener objects with cert refs + allowedRoutes)
plus the per-prov 2-label wildcard pair (TBD-A32 #1886) when the
sovereign FQDN is not itself one of the parent zones. For a 4-zone
Org-pool Sovereign (primary + 3 org-pool, e.g. omantel.biz + omani.{homes,
rest,trade}) the value renders to ~2,210 bytes inside cloud-init — and
Hetzner caps user_data at HARD 32 KiB. Cloud-init for t39's exact body
overshot the post-#1985 guardrail (32,256) at 33,656 bytes (audit
agent-a2c1647c, 2026-05-20). Reintroducing an inline cloud-init
substitute (even scoped to one region) would reopen that exact
regression — the ConfigMap-rendered-by-chart shape is the durable fix,
now just installed on both regions instead of one.

Listener-shape contract (must match locals.parent_domains_listeners_yaml
in infra/hetzner/main.tf historically):
  - SINGLE parent zone  → listener names are the bare strings
                          `https` / `http` (every platform HTTPRoute
                          hardcodes `parentRefs[0].sectionName: https`
                          on single-zone Sovereigns).
  - MULTIPLE parent zones (Org pool present) → unique names per zone:
                          `https-<sanitised>` / `http-<sanitised>`
                          where sanitised = zone.replace(".", "-").
  - certificateRefs ALWAYS targets the per-prov per-name TLS Secret
    `sovereign-wildcard-tls-<sovereignFQDN-dashed>` (TBD-A29 #1883 —
    LE rate-limit bypass via per-prov identifier set).
  - PER-PROV 2-label wildcard listener pair (TBD-A32 #1886) appended
    when global.sovereignFQDN is NOT identical to any parent-zone name
    (i.e. the operator did not bring the apex itself). Pair is hostnamed
    `*.<sovereignFQDN>` so 2-label-deep operator endpoints
    (`console.t39.omantel.biz`) match. Named `https-<fqdn-dashed>` /
    `http-<fqdn-dashed>` so the parent-zone listener doesn't collide.

The output value is a JSON-flow array string (YAML-compatible) consumed
as a YAML scalar at `listeners: ${PARENT_DOMAINS_LISTENERS_YAML}` in
clusters/_template/sovereign-tls/cilium-gateway.yaml. Flux's
postBuild.substituteFrom inlines the value verbatim and the apiserver
parses it as the materialised listener list.
*/}}
{{- if .Values.global.sovereignFQDN }}
{{- $fqdn := .Values.global.sovereignFQDN }}
{{- $fqdnDashed := replace "." "-" $fqdn }}
{{- $secretName := printf "sovereign-wildcard-tls-%s" $fqdnDashed }}
{{- $zones := default (list) .Values.parentZones }}
{{- /* Single-zone fallback so legacy Sovereigns that ship parentZones
       empty still produce a valid listener pair. Mirrors the same
       fallback infra/hetzner/main.tf locals.parent_domains_decoded used
       (single zone derived from sovereign FQDN, role=primary). */}}
{{- if eq (len $zones) 0 }}
{{-   $zones = list (dict "name" $fqdn "role" "primary") }}
{{- end }}
{{- $single := eq (len $zones) 1 }}
{{- /* Build the listener array. We assemble a list of dicts then
       toJson it; Go-template flow is verbose but unambiguous. */}}
{{- $listeners := list }}
{{- range $z := $zones }}
{{-   $sanitised := replace "." "-" $z.name }}
{{-   $httpsName := ternary "https" (printf "https-%s" $sanitised) $single }}
{{-   $httpName := ternary "http" (printf "http-%s" $sanitised) $single }}
{{- /* #3376 fix: per-zone certificate binding. The primary zone (the
       Sovereign FQDN apex, role=primary) keeps the per-prov cert
       sovereign-wildcard-tls-fqdnDashed minted by cilium-gateway-cert.yaml
       (the TBD-A29 per-prov LE bucket; its SAN is the primary apex
       wildcard). A role=org-pool zone (e.g. omani.homes) is NOT covered by
       that cert, so its wildcard listener previously bound to a cert that
       did not match the hostname, leaving the listener Programmed=False and
       tenant hosts under the pool zone connection-refused. Bind org-pool
       zone listeners to the per-zone Secret sovereign-wildcard-tls-
       sanitised that sovereign-wildcard-certs.yaml now mints (re-enabled in
       this PR). Selection keys only off the zone role field (data, not
       code) so it is generic for any pool TLD. */}}
{{- $zoneSecret := $secretName }}
{{- if and (ne $z.name $fqdn) (eq (default "primary" $z.role) "org-pool") }}
{{-   $zoneSecret = printf "sovereign-wildcard-tls-%s" $sanitised }}
{{- end }}
{{-   $httpsListener := dict
        "name" $httpsName
        "port" 443
        "protocol" "HTTPS"
        "hostname" (printf "*.%s" $z.name)
        "tls" (dict
          "mode" "Terminate"
          "certificateRefs" (list (dict "kind" "Secret" "name" $zoneSecret))
        )
        "allowedRoutes" (dict "namespaces" (dict "from" "All"))
      }}
{{-   $httpListener := dict
        "name" $httpName
        "port" 80
        "protocol" "HTTP"
        "hostname" (printf "*.%s" $z.name)
        "allowedRoutes" (dict "namespaces" (dict "from" "All"))
      }}
{{-   $listeners = append $listeners $httpsListener }}
{{-   $listeners = append $listeners $httpListener }}
{{- end }}
{{- /* Per-prov 2-label wildcard pair (TBD-A32 #1886). Skipped when
       sovereignFQDN is identical to a declared parent-zone name
       (legacy single-zone-on-apex case — duplicate listener-name
       guard). */}}
{{- $fqdnInZones := false }}
{{- range $z := $zones }}
{{-   if eq $z.name $fqdn }}
{{-     $fqdnInZones = true }}
{{-   end }}
{{- end }}
{{- if not $fqdnInZones }}
{{-   $listeners = append $listeners (dict
        "name" (printf "https-%s" $fqdnDashed)
        "port" 443
        "protocol" "HTTPS"
        "hostname" (printf "*.%s" $fqdn)
        "tls" (dict
          "mode" "Terminate"
          "certificateRefs" (list (dict "kind" "Secret" "name" $secretName))
        )
        "allowedRoutes" (dict "namespaces" (dict "from" "All"))
      ) }}
{{-   $listeners = append $listeners (dict
        "name" (printf "http-%s" $fqdnDashed)
        "port" 80
        "protocol" "HTTP"
        "hostname" (printf "*.%s" $fqdn)
        "allowedRoutes" (dict "namespaces" (dict "from" "All"))
      ) }}
{{- end }}
{{- /* ─────────────────────────────────────────────────────────────────────
       #4053 — POISON-PROOF CONSOLE GATEWAY ISOLATION
       ─────────────────────────────────────────────────────────────────────
       Cilium Gateway API compiles ALL of a Gateway's HTTPRoutes + backends
       into ONE CiliumEnvoyConfig (CEC), committed ATOMICALLY by cilium-agent.
       If ANY single backend Service is unresolvable (a half-converged app, a
       vanished vcluster-bridge Service, an empty EndpointSlice), getK8sService
       returns "retrieved nil details" → the WHOLE CEC upsert fails → cilium-
       envoy gets 0 listeners → the entire gateway 404s, console included.
       This is the unfixed upstream bug cilium#35728 / cilium#34982 — no config
       flag, no version fix on the pinned Cilium 1.16.5 (Chart.lock truth).
       Confirmed live on hw182 (newapi install #3831 bridge Service poisoned
       the whole console).

       Because the CEC is ONE-PER-GATEWAY, isolating the console onto its OWN
       Gateway means a broken volatile app backend can only zero ITS gateway —
       the console gateway (stable ClusterIP backends only: catalyst-ui +
       catalyst-api) survives. This second key renders the console gateway's
       listener set: the SAME per-prov wildcard cert (`*.<fqdn>` matches the
       2-label-deep console.<fqdn> / api.<fqdn> operator endpoints), but on the
       console gateway's OWN LoadBalancer Service (consoleGateway.httpsPort /
       .httpPort, default 443 / 80; #4682). The shared gateway serves the
       standard :443 / :80 on its own cilium-provisioned LoadBalancer Service
       (hostNetwork is OFF; no host bind, no NodePort); the console gateway is
       a SEPARATE Gateway → SEPARATE CiliumEnvoyConfig → SEPARATE LoadBalancer
       Service, so its distinct listener ports never collide with the shared
       gateway even though both terminate public :443 at their own LB front.

       Why SPECIFIC per-host listeners (not one `*.<fqdn>` pair): the console +
       api + marketplace hostnames always live under the Sovereign FQDN apex,
       never under an org-pool zone (those are tenant/app surfaces and stay on
       the SHARED gateway). A wildcard `*.<fqdn>` listener here made the console
       CEC's envoy filter chain claim EVERY `*.<fqdn>` TLS handshake, colliding
       with the shared gateway's own `*.<fqdn>` chain and 404'ing ~50% of every
       OTHER subdomain (#5341). Each console endpoint therefore gets its exact
       2-label hostname (see the $consoleHosts loop below); the primary wildcard
       cert still covers all of them, so the console CEC stays minimal + cheap.

       Consumed by clusters/_template/sovereign-tls/cilium-gateway-console.yaml
       at `listeners: ${CONSOLE_LISTENERS_YAML}` via the same Flux postBuild
       substituteFrom the shared gateway uses for PARENT_DOMAINS_LISTENERS_YAML.
*/ -}}
{{- $consoleCfg := default dict .Values.consoleGateway }}
{{- $consoleHttpsPort := default 443 $consoleCfg.httpsPort }}
{{- $consoleHttpPort := default 80 $consoleCfg.httpPort }}
{{- /* #5341 — the console gateway MUST hostname its listeners to the SPECIFIC
       operator endpoints it serves, NOT the apex wildcard `*.<fqdn>`.
       ─────────────────────────────────────────────────────────────────────
       ROOT CAUSE the wildcard caused (confirmed live on hw288, dep 027f0755):
       the shared gateway AND this console gateway each compile a cilium-envoy
       filter chain whose `filterChainMatch.serverNames` was `*.<fqdn>`. Both
       chains load onto the SAME shared cilium-envoy DaemonSet, so a TLS
       handshake for ANY subdomain (e.g. `mcp.<fqdn>`) matched BOTH chains.
       Envoy resolves the duplicate-wildcard match non-deterministically, so
       ~50% of `mcp.<fqdn>` requests landed on the CONSOLE chain — whose router
       only has console/api/marketplace vhosts, no mcp — and returned a bare
       `404 (server: envoy, connection: close)` that cleared on retry. Every
       non-console subdomain on the shared gateway was exposed to this flake.

       FIX: give each console listener its EXACT 2-label hostname. Envoy prefers
       an exact `server_name` over the shared gateway's `*.<fqdn>` wildcard, so
       console/api/marketplace deterministically bind the console chain, while
       every OTHER subdomain no longer matches the console chain at all and is
       served solely by the shared gateway. The per-prov wildcard cert already
       covers all three 2-label hosts, so no extra Let's-Encrypt issuance.

       `hostPrefixes` is the set of HTTPRoute hostnames re-parented to the
       console gateway (catalyst-ui=console, catalyst-api/catalyst-catalog=api,
       marketplace=marketplace). A new console-gateway route needs its prefix
       added here or its listener won't accept it — the deliberate, testable
       cost of a specific (non-wildcard) listener. */}}
{{- $consoleHosts := default (list "console" "api" "marketplace") $consoleCfg.hostPrefixes }}
{{- $consoleListeners := list }}
{{- range $hp := $consoleHosts }}
{{-   $consoleHost := printf "%s.%s" $hp $fqdn }}
{{-   $consoleListeners = append $consoleListeners (dict
        "name" (printf "%s-https" $hp)
        "port" $consoleHttpsPort
        "protocol" "HTTPS"
        "hostname" $consoleHost
        "tls" (dict
          "mode" "Terminate"
          "certificateRefs" (list (dict "kind" "Secret" "name" $secretName))
        )
        "allowedRoutes" (dict "namespaces" (dict "from" "All"))
      ) }}
{{-   $consoleListeners = append $consoleListeners (dict
        "name" (printf "%s-http" $hp)
        "port" $consoleHttpPort
        "protocol" "HTTP"
        "hostname" $consoleHost
        "allowedRoutes" (dict "namespaces" (dict "from" "All"))
      ) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sovereign-tls-vars
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/component: sovereign-tls-vars
    catalyst.openova.io/sovereign: {{ $fqdn | quote }}
data:
  # PARENT_DOMAINS_LISTENERS_YAML — JSON-flow array literal of the SHARED
  # Cilium Gateway listener block (all parent zones + the per-prov wildcard
  # pair). Consumed by Flux postBuild.substituteFrom on the sovereign-tls
  # Kustomization (cloud-init writes that Kustomization). See
  # cilium-gateway.yaml `listeners: ${PARENT_DOMAINS_LISTENERS_YAML}` for the
  # consumer. The SHARED gateway carries every VOLATILE route (keycloak,
  # grafana, gitea, harbor, openbao, powerdns, newapi, marketplace, tenant +
  # mgmt-vcluster app routes) — its CEC may be poisoned by a half-converged
  # app, which is acceptable because the console no longer rides this gateway.
  PARENT_DOMAINS_LISTENERS_YAML: {{ toJson $listeners | quote }}
  # CONSOLE_LISTENERS_YAML — #4053 — JSON-flow array literal of the dedicated
  # CONSOLE Cilium Gateway listener block. Consumed by Flux postBuild.
  # substituteFrom on the sovereign-tls Kustomization. See
  # cilium-gateway-console.yaml `listeners: ${CONSOLE_LISTENERS_YAML}`. The
  # console gateway carries ONLY the catalyst-ui + catalyst-api HTTPRoutes
  # (stable ClusterIP backends that always resolve), so its CEC is structurally
  # immune to the app-backend poisoning that can zero the shared gateway.
  CONSOLE_LISTENERS_YAML: {{ toJson $consoleListeners | quote }}
{{- end }}
