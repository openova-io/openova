apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: opentelemetry
  labels:
    catalyst.openova.io/section: pts-3-observability
spec:
  version: 1.1.3
  card:
    title: OpenTelemetry Collector + Operator
    family: insights
    description: Vendor-neutral telemetry collector (OTLP receiver/forwarder) plus the OpenTelemetry Operator with a default Instrumentation CR so workloads opt into auto-instrumentation via pod annotations. Sibling to bp-alloy — Catalyst supports both; per-Sovereign overlays choose one.
    docs: https://opentelemetry.io/docs/collector/
