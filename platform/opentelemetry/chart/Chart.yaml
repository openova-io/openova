apiVersion: v2
name: bp-opentelemetry
description: |
  Catalyst Blueprint umbrella chart for the OpenTelemetry Collector PLUS
  the OpenTelemetry Operator. Bundles two upstream subcharts:

  1. `opentelemetry-collector` — vendor-neutral OTLP receiver/forwarder
  2. `opentelemetry-operator` — installs `Instrumentation` CRD + reconciler
     so apps can opt into auto-instrumentation via pod annotations
     (`instrumentation.opentelemetry.io/inject-<lang>: opentelemetry/default`).

  A default `Instrumentation` CR in the `opentelemetry` NS points workloads
  at the in-cluster Collector OTLP endpoint
  (`http://opentelemetry-opentelemetry-collector.opentelemetry.svc:4318`).
  Apps in other namespaces reference it as `opentelemetry/default`.

  Default deployment mode is `deployment` (a single collector pod handling
  OTLP traffic from in-cluster apps) — DaemonSet / StatefulSet are values
  toggles for node-level collection / WAL persistence respectively.
type: application
version: 1.1.1
appVersion: "0.150.1"
keywords: [catalyst, blueprint, opentelemetry, otlp, observability, telemetry, collector, operator, instrumentation]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Pinned to open-telemetry/opentelemetry-collector 0.152.0 (appVersion
# 0.150.1) — current stable on 2026-04-29. Per
# docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the version is
# operator-bumpable via PR + Blueprint release.
# Operator pinned to 0.62.0 (appVersion 0.108.0) — current stable on
# 2026-05-24. Installs `Instrumentation` + `OpenTelemetryCollector` CRDs.
dependencies:
  - name: opentelemetry-collector
    version: "0.152.0"
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"
  - name: opentelemetry-operator
    version: "0.62.0"
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"
    condition: opentelemetry-operator.enabled
