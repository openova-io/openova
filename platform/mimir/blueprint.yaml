apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-mimir
  labels:
    catalyst.openova.io/section: pts-3-observability
    catalyst.openova.io/tier: catalyst-cp
spec:
  version: 1.0.13
  visibility: listed
  card:
    title: Mimir
    family: insights
    description: Horizontally scalable, highly available Prometheus-compatible metrics storage for the LGTM observability stack.
    icon: mimir.svg
    docs: https://grafana.com/docs/mimir/latest/


  topology:
    supported:
      - active-passive
      - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: s3-bucket-replication
          mode: async
          lagSloSeconds: 60
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 60
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # internal-only — queried by Grafana via in-cluster Service DNS.
  endpoints: []

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    silentLogin: true

  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-mimir
