{{- /*
G49 (Refs #2601, 2026-05-30): RBAC for the mimir webhook-gate Job.
Same pattern as G38 #2593 webhook-gate-rbac for bp-opentelemetry-operator.
Scoped to GET Endpoints in the mimir namespace ONLY.
*/}}
{{- $gate := .Values.webhookGate | default dict -}}
{{- $enabled := true -}}
{{- if hasKey $gate "enabled" -}}
{{-   $enabled = $gate.enabled -}}
{{- end -}}
{{- if $enabled }}
{{- $svcNs := (($gate.service).namespace) | default "mimir" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-webhook-gate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bp-mimir
    catalyst.openova.io/component: webhook-gate
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-webhook-gate
  namespace: {{ $svcNs | quote }}
  labels:
    app.kubernetes.io/name: bp-mimir
    catalyst.openova.io/component: webhook-gate
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-webhook-gate
  namespace: {{ $svcNs | quote }}
  labels:
    app.kubernetes.io/name: bp-mimir
    catalyst.openova.io/component: webhook-gate
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-webhook-gate
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-webhook-gate
  apiGroup: rbac.authorization.k8s.io
{{- end }}
