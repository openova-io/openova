# Catalyst Blueprint umbrella metadata — the upstream chart is resolved as
# a Helm subchart via Chart.yaml `dependencies:`. Catalyst-curated values
# under the `mimir-distributed:` key flow into the upstream subchart
# unchanged.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

catalystBlueprint:
  upstream:
    chart: mimir-distributed
    version: "6.0.6"
    repo: "https://grafana.github.io/helm-charts"

# ─── Upstream chart values (subchart key: mimir-distributed) ─────────────
mimir-distributed:
  # Pin the global image tag — DO NOT use floating tags.
  # Route through the Sovereign Harbor proxy-cache (IPv4-only kom4dc pull +
  # harbor-proxy-pull Kyverno admit). The upstream image block has no
  # `registry:` key, so host-swap docker.io -> harbor.openova.io/proxy-dockerhub
  # in the repository path itself. Refs #3296 #3903.
  image:
    repository: harbor.openova.io/proxy-dockerhub/grafana/mimir
    tag: "3.0.4"
    pullPolicy: IfNotPresent

  # Per-component replicas — solo-Sovereign minimum is 1 each. Per-Sovereign
  # overlays scale these up and flip zoneAwareReplication on for HA.
  alertmanager:
    replicas: 1
    zoneAwareReplication:
      enabled: false
  distributor:
    replicas: 1
  ingester:
    replicas: 1
    zoneAwareReplication:
      enabled: false
  querier:
    replicas: 1
  query_frontend:
    replicas: 1
  query_scheduler:
    replicas: 1
  store_gateway:
    replicas: 1
    zoneAwareReplication:
      enabled: false
  compactor:
    replicas: 1
  ruler:
    replicas: 1
  overrides_exporter:
    replicas: 1

  # Gateway (nginx in front of Mimir) — keep enabled, scale to 1.
  # Route the nginx image via the Harbor proxy-cache. The upstream
  # gateway.nginx.image has a `registry:` key — set it to proxy-dockerhub
  # and keep the repository path. Refs #3296 #3903.
  gateway:
    enabled: true
    replicas: 1
    nginx:
      image:
        registry: harbor.openova.io/proxy-dockerhub
        repository: nginxinc/nginx-unprivileged
        tag: 1.29-alpine

  # Bundled MinIO — DEFAULT ON only as a stop-gap so the chart renders;
  # Catalyst routes object storage through SeaweedFS. Per-Sovereign
  # overlays MUST set `minio.enabled: false` AND wire S3 credentials
  # pointing at SeaweedFS (or cloud object storage) before production use.
  # The bundled MinIO is single-replica, ephemeral-friendly, and not for
  # production data.
  #
  # Route the MinIO server + `mc` client images via the Harbor proxy-cache.
  # Both upstream fields are single `repository:` with the host embedded, so
  # host-swap quay.io -> harbor.openova.io/proxy-quay in place. Refs #3296 #3903.
  minio:
    enabled: true
    image:
      repository: harbor.openova.io/proxy-quay/minio/minio
      tag: RELEASE.2024-12-18T13-15-44Z
    mcImage:
      repository: harbor.openova.io/proxy-quay/minio/mc
      tag: RELEASE.2024-11-21T17-21-54Z

  # Kafka (ingest-storage architecture) — DISABLED. The classic blocks-
  # storage architecture is the Catalyst default; Kafka ingest-storage is
  # an opt-in path that requires bp-strimzi to be reconciled first.
  kafka:
    enabled: false

  # Structured Mimir config — explicitly disable ingest_storage so the
  # Mimir process does NOT require a Kafka address. The upstream
  # mimir-distributed 6.0.6 chart may default ingest_storage.enabled to
  # true in its bundled config; this override forces classic ingester mode
  # (blocks-storage, no Kafka). Fixes CrashLoopBackOff on otech22 with
  # "the Kafka address has not been configured" (issue #567).
  mimir:
    structuredConfig:
      ingest_storage:
        enabled: false
      # Re-enable Push gRPC method on the ingester. Upstream
      # mimir-distributed 6.0.6 sets push_grpc_method_enabled=false
      # when ingest-storage is disabled, but classic-mode ingester
      # REQUIRES the Push gRPC method. Without this override the
      # ingester pod crashloops with: "cannot disable Push gRPC
      # method in ingester, while ingest storage is not enabled".
      # Caught live on otech43.
      ingester:
        push_grpc_method_enabled: true

  # MetaMonitoring (ServiceMonitor + Grafana dashboards) — DEFAULT FALSE
  # per docs/BLUEPRINT-AUTHORING.md §11.2.
  metaMonitoring:
    serviceMonitor:
      enabled: false
    dashboards:
      enabled: false
    grafanaAgent:
      installOperator: false
      logs:
        enabled: false
      metrics:
        enabled: false

  # Smoke + continuous-test pods — disabled in production.
  smoke_test:
    enabled: false
  continuous_test:
    enabled: false

  # rollout-operator subchart — keep enabled (it manages zone-aware rollouts
  # and is referenced by the upstream chart even with zone-awareness off).
  # Route via the Harbor proxy-cache. The subchart image has an empty
  # `registry: ""`; set it to proxy-dockerhub (grafana/rollout-operator is a
  # Docker Hub image). Refs #3296 #3903.
  rollout_operator:
    enabled: true
    replicas: 1
    image:
      registry: harbor.openova.io/proxy-dockerhub
      repository: grafana/rollout-operator

  # Service account — chart manages its own.
  serviceAccount:
    create: true

# ─── Catalyst overlay values (consumed by templates/ in this chart) ──────
mimirOverlay:
  networkPolicy:
    enabled: false

# ─── Compliance recording rules + alerts (EPIC-1 #1096 slice S2) ─────────
#
# When `enabled: true` AND the cluster has Prometheus Operator's
# `monitoring.coreos.com/v1` CRD installed (via bp-kube-prometheus-stack),
# the chart renders a PrometheusRule resource pre-aggregating the
# catalyst-api's `catalyst_compliance_*` metrics into trend dashboards
# and pager alerts.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 every threshold is a value so
# per-Sovereign overlays tighten/loosen without forking the chart.
complianceRules:
  # Default ON because the metrics are emitted by every catalyst-api
  # Pod; rendering the rule on a Sovereign that hasn't reached Phase 2
  # is gated by the Capabilities check in the template (no failure
  # mode — the resource is silently skipped).
  enabled: true
  # Empty namespace falls back to .Release.Namespace.
  namespace: ""
  extraLabels: {}
  recording:
    # How often Prometheus evaluates the recording rules. 1m is the
    # cheapest cadence that still drives a smooth trend dashboard.
    interval: 1m
  alerts:
    severity: warning
    # Alert when an Application's 1h-avg score drops by this many
    # absolute points hour-over-hour. Default 10; tighten to 5 for
    # regulator-grade Sovereigns.
    regressionThreshold: 10
    regressionFor: 10m
    # Alert when an enforcing policy is firing more than N
    # violations/hour — the U5 toggle let it through but workloads
    # are still failing. Default 50.
    enforcingViolationsPerHour: 50
    enforcingFor: 5m

# G49 (Refs #2601, 2026-05-30): webhook-gate Job + RBAC defaults.
# Polls mimir-rollout-operator Service Endpoints during pre-upgrade
# hook to close the Helm-vs-webhook race on StatefulSet patches.
# Mirror of bp-opentelemetry-operator G38 pattern.
webhookGate:
  enabled: true
  service:
    name: mimir-rollout-operator
    namespace: mimir
  timeoutSeconds: 300
  intervalSeconds: 2
  # Route via the Harbor proxy-cache. Bare Docker Hub ref -> proxy-dockerhub
  # (host-swap in place, path preserved). Refs #3296 #3903.
  image: "harbor.openova.io/proxy-dockerhub/bitnamilegacy/kubectl:1.30.7"
  imagePullPolicy: IfNotPresent
