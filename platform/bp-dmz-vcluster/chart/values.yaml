# Catalyst Blueprint values for bp-dmz-vcluster (DoD A4 — vCluster
# topology implementation, 2026-05-16).
#
# Per docs/INVIOLABLE-PRINCIPLES.md:
#   #1   waterfall — chart ships the full target shape on the first cut.
#   #4   never hardcode — every value is overridable per-Sovereign.
#   #4a  SHA-pinned images.
#   MIRROR-EVERYTHING — Harbor proxy by default.

catalystBlueprint:
  upstream:
    chart: vcluster
    version: "0.20.0"
    repo: "https://charts.loft.sh"

# ── Registry mirror (MIRROR-EVERYTHING + Pillar 5 anti-tether #2940) ──
# Single source of truth for the registry host every image in this chart
# pulls through. Default `harbor.openova.io` preserves bootstrap behaviour.
# Consumed by (1) the `bp-dmz-vcluster.image` fail-fast helper for the
# umbrella image and (2) the loft-sh subchart syncer image registry, which
# (being a subchart values literal Helm can't self-template) is driven by
# slot 54's `${REGISTRY_MIRROR:=harbor.openova.io}` postBuild substitution.
# Post-bp-self-sovereign-cutover (Step-04, ADR-0002) a per-Sovereign
# overlay flips this to `harbor.<sovereign-fqdn>`. Renamed from the dead
# `global.imageRegistry` (loft-sh never honoured that key). #2940.
global:
  registryMirror: "harbor.openova.io"

dmzVcluster:
  # Top-level enable gate. False by default; bootstrap-kit slot 54
  # postBuild.substitute flips it on every region.
  enabled: false

  # ── Topology identity ───────────────────────────────────────────────
  hostNamespace: dmz
  vclusterName: dmz
  role: every-region

  # ── NodeSelector pin to this region's CP ────────────────────────────
  # The DMZ vCluster pod MUST run on the region's own CP node so the
  # inter-region WireGuard endpoint binds the correct region's public
  # IP. Per docs/SOVEREIGN-MULTI-REGION-DOD.md A2 — inter-region link
  # goes over the DMZ WG over PUBLIC IPs.
  nodeSelector:
    regionLabelKey: "openova.io/region"
    # The region's key — substituted by the bootstrap-kit Kustomization
    # via `${SOVEREIGN_REGION_LABEL}`. Empty default keeps the chart
    # renderable for `helm template` smoke tests.
    regionLabelValue: ""

  # ── Image (MIRROR-EVERYTHING) ─────────────────────────────────────
  # #2940 Pillar 5: registry-RELATIVE repository; the host is composed
  # from `global.registryMirror` by the `bp-dmz-vcluster.image` helper.
  # Consumed only by the umbrella fail-fast guard — the real syncer image
  # is the subchart value below; keep them in lockstep. Backward-compat: a
  # host-qualified repository is honoured verbatim by the helper.
  image:
    repository: "proxy-ghcr/loft-sh/vcluster"
    tag: "0.21.0"
    pullPolicy: "IfNotPresent"

  # ── NetworkPolicy isolation baseline ──────────────────────────────
  # DMZ is public-fronted. Ingress from world (Gateway) IS allowed
  # but only on the Cilium Gateway path — the rest is default-deny.
  # The DMZ also needs to call the MGMT vCluster (catalyst-api etc.)
  # and the RTZ vCluster (tenant workloads). Cross-region MGMT calls
  # go through the inter-region WG.
  networkPolicy:
    enabled: true
    # Namespaces allowed to ingress this vCluster from inside the host
    # k3s (intra-region cross-vCluster traffic). Per DoD A4 traffic
    # stays inside host k3s via Cilium.
    allowedIngressNamespaces:
      - mgmt    # primary-only — RTZ secondaries won't have this NS
      - rtz     # secondary-only — primary won't have this NS
      - kube-system    # Gateway control-plane
      - gateway-system # Gateway data-plane
      # Flux helm-controller (ns flux-system) manages the in-vCluster
      # HelmReleases targeted here (bp-coraza) via the vc-dmz kubeconfig →
      # vcluster API :443. Today allowWorldIngress:true masks this, but state
      # the invariant explicitly so dmz stays correct if an operator flips
      # allowWorldIngress to false. Every vcluster hosting Flux-managed HRs
      # must allow flux-system ingress to its API. #3055
      - flux-system
    # World ingress: allow Cilium Gateway pods to reach DMZ vCluster
    # via the in-cluster Service. Operators override per-Sovereign
    # to add WireGuard port (UDP 51871) allowance from world.
    allowWorldIngress: true

# ─── Upstream chart values (subchart key: vcluster) ────────────────
vcluster:
  controlPlane:
    distro:
      k8s:
        enabled: true
    backingStore:
      database:
        embedded:
          enabled: true
    statefulSet:
      scheduling:
        nodeSelector: {}
      image:
        # #2940 Pillar 5: the ACTUAL vCluster syncer image. This `registry`
        # is a subchart values literal Helm can't derive from
        # global.registryMirror here, so `harbor.openova.io` stays as the
        # bootstrap fallback and the single overlay knob is slot 54's
        # `registry: ${REGISTRY_MIRROR:=harbor.openova.io}` substitution.
        # Keep in lockstep with the umbrella dmzVcluster.image above.
        registry: harbor.openova.io
        repository: proxy-ghcr/loft-sh/vcluster
        tag: "0.21.0"
      resources:
        requests:
          cpu: "200m"
          memory: "384Mi"
        limits:
          cpu: "2"
          memory: "1Gi"
      persistence:
        volumeClaim:
          enabled: true
          size: "5Gi"
          storageClass: "local-path"
    service:
      enabled: true
      spec:
        type: ClusterIP

  sync:
    toHost:
      services:
        enabled: true
      ingresses:
        enabled: false
      persistentVolumeClaims:
        enabled: true
      configMaps:
        enabled: true
      secrets:
        enabled: true
    fromHost:
      ingressClasses:
        enabled: true

  # Writes a host-namespace Secret named `vc-dmz` containing a kubeconfig
  # for the vCluster's apiserver. The Sovereign-side handler
  # (core/services/provisioning/handlers/handlers.go
  # mirrorVClusterKubeconfig) mirrors this Secret into flux-system as
  # `dmz-vcluster-kubeconfig` so per-Sovereign Flux Kustomization CRs
  # can reconcile DMZ-vCluster-targeted resources.
  exportKubeConfig:
    context: vcluster
    # hw91 2026-06-04: without an explicit server, vcluster exports its
    # default `https://localhost:8443` — only dialable from inside the
    # vcluster pod. helm-controller (flux-system, host cluster) reads
    # this Secret via HelmRelease.spec.kubeConfig and got
    # `dial tcp [::1]:8443: connection refused` on every vc-dmz-targeted
    # HR (dmz/bp-coraza), holding the bootstrap-kit health gate forever.
    # The host-side service DNS is the correct dial target. NB use the
    # `<svc>.<ns>` short form, NOT `<svc>.<ns>.svc` — the vcluster
    # apiserver serving cert's SANs include `dmz-vcluster.dmz` +
    # `dmz-vcluster` but NOT `dmz-vcluster.dmz.svc` (hw92 2026-06-04: the
    # `.svc` form #3038 first used gave helm-controller `x509:
    # certificate is valid for ... dmz-vcluster.dmz, not
    # dmz-vcluster.dmz.svc`). `dmz-vcluster.dmz` resolves from
    # flux-system via the `svc.cluster.local` search domain.
    server: https://dmz-vcluster.dmz:443
    secret:
      name: vc-dmz
