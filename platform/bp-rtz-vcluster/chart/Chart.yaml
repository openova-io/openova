apiVersion: v2
name: bp-rtz-vcluster
# 0.1.0 — initial implementation of DoD A4 vCluster topology
# (sovereign-multi-region-DoD invariant #4). Founder ruling
# 2026-05-16: every secondary region must materialise an RTZ
# vCluster for regional tenant workloads + caches. Slot 59 in the
# bootstrap-kit.
# 0.1.1 — Refs #2537: default `rtzVcluster.enabled` flipped false→true
# so every region renders the RTZ vCluster (symmetric topology
# supersedes asymmetric A4).
# 0.2.0 — Refs #2664/#2639 (G92 EPIC, 2026-06-01) lockstep bump of
# loft-sh/vcluster subchart 0.20.0 → 0.21.0 (sibling to bp-mgmt-vcluster
# 0.2.0 + bp-dmz-vcluster 0.2.0). Picks up `sync.toHost.customResources`
# schema so RTZ vCluster-placed tenant Applications (G92.5 #2664) +
# per-Org CNPG can wire CR sync to the host cnpg-operator without a
# follow-up chart bump.
# 0.2.1 — Refs #2664/#2639 (G92.5 EPIC, 2026-06-01): values.yaml now
# declares `vcluster.sync.toHost.customResources` for the 3 CNPG CR
# kinds — mirrors the bp-mgmt-vcluster 0.2.1 policy (PR #2692). The
# RTZ vCluster hosts per-Org tenant Applications + Sandbox per DoD
# §A4; both paths route CNPG provisioning through the host
# cnpg-operator (G92.6 substrate per #2665) via this sync.
# 0.2.6 — Refs #2940 (Pillar 5 anti-tether, 2026-06-08): registry host no
# longer hardcoded `harbor.openova.io` as the sole source of truth. New
# `global.registryMirror` drives the umbrella image helper;
# `rtzVcluster.image.repository` is registry-relative; the subchart syncer
# image registry is driven by slot 59's `${REGISTRY_MIRROR:=harbor.openova.io}`
# substitution. Renamed the dead `global.imageRegistry`. Default render
# byte-identical. Sibling to bp-mgmt-vcluster 0.2.6 + bp-dmz-vcluster 0.2.5.
# 0.2.7 — Refs #3373: sync.toHost.customResources gains
# httproutes.gateway.networking.k8s.io +
# externalsecrets.external-secrets.io (coupling fix (b) — re-homed
# charts' routes/secrets mirror toHost).
# 0.2.8 — Refs #3380-D (2026-06-13): pin the k8s distro control-plane
# images off upstream `registry.k8s.io` onto the Sovereign-local Harbor
# `proxy-k8s` cache (lockstep with bp-mgmt-vcluster 0.2.8). The loft-sh
# subchart otherwise defaults apiServer/controllerManager/scheduler to
# `registry.k8s.io/kube-*` — which the `harbor-proxy-pull` Enforce
# ClusterPolicy DENIES on the next image roll. Additive values only.
# Sibling to bp-mgmt-vcluster 0.2.8 + bp-dmz-vcluster 0.2.7.
# 0.2.9 — Refs #3373 Batch A (2026-06-14): add `sme` to
# networkPolicy.allowedIngressNamespaces. bp-valkey moved INTO this RTZ
# vCluster; its host-synced Service now sits behind the `-isolation`
# NetworkPolicy whose allow-list was {dmz, flux-system}. The host `sme`
# namespace runs the BSS auth/gateway services that consume valkey via
# VALKEY_ADDR — without this carve-out they fail to reach the synced
# Service. Additive; mirrors the #3423 sme→NATS carve-out on
# bp-mgmt-vcluster.
# 0.2.10 — Refs #3373 Batch A (2026-06-14): add gitea/harbor/catalyst-system/
# mgmt/velero to networkPolicy.allowedIngressNamespaces. bp-seaweedfs moved
# INTO this RTZ vCluster; its host-synced S3 Service now sits behind the
# `-isolation` NetworkPolicy. These host namespaces run seaweedfs S3 consumers
# (all default-OFF on a fresh prov; the carve-out admits the wire once an
# operator enables S3 post-move). Additive; mirrors the #3423 carve-out.
# 0.2.11 — Refs #3373 Batch A (2026-06-14): add `newapi` to
# networkPolicy.allowedIngressNamespaces. bp-vllm moved INTO this RTZ
# vCluster; the host `newapi` namespace runs the LLM gateway whose vllm
# channel consumes bp-vllm — without this carve-out it cannot reach the
# synced Service. Additive; mirrors the #3423 carve-out.
# 0.2.12 — Refs #3642/#3736 (2026-06-17): LOCKSTEP loft-sh/vcluster subchart
# bump 0.21.0 → 0.23.0 (sibling to bp-mgmt-vcluster 0.2.12 + bp-dmz-vcluster
# 0.2.8). The active `sync.fromHost.secrets` mappings land in
# bp-mgmt-vcluster (the 7 NS#1 apps re-home into vc-mgmt); this RTZ umbrella
# carries ONLY the version bump so all 3 vCluster umbrellas stay on the same
# loft-sh tag — drift between siblings would surface as inconsistent syncer
# behaviour across the DMZ / MGMT / RTZ apiservers. RTZ's Batch-A residents
# (valkey/seaweedfs/vllm) mint no host-side DB/SSO Secret, so no
# fromHost.secrets mapping is needed here. Syncer image tag bumped to 0.23.0
# to match. Default render unchanged in shape (subchart version only).
version: 0.2.12
appVersion: "0.23.0"
description: |
  Catalyst-curated Blueprint umbrella chart for the Sovereign RTZ
  vCluster. Implements docs/SOVEREIGN-MULTI-REGION-DOD.md A4
  ("each secondary region runs an RTZ vCluster for regional tenant
  workloads") as a Helm release of the upstream loft-sh/vcluster chart
  wrapped in Catalyst conventions.

  Hosts the per-region tenant workloads:
    - tenant pods (when a SME/marketplace tenant is regionalised)
    - regional caches (valkey-cache, etc.)
    - region-local observability shippers

  Topology contract (re-read docs/SOVEREIGN-MULTI-REGION-DOD.md):
    primary    region → MGMT  + DMZ  vCluster (bp-mgmt-vcluster + bp-dmz-vcluster)
    secondary  region → DMZ   + RTZ  vCluster (bp-dmz-vcluster  + this chart)

  Cross-vCluster intra-region traffic (RTZ ↔ DMZ within the same
  secondary region) stays inside the host k3s via Cilium endpoint
  identity routing. Cross-region traffic (RTZ ↔ MGMT primary) goes
  through the DMZ WireGuard hop per DoD A2.

  The upstream chart is pulled in as a Helm subchart so
  `helm dependency build` bundles it into the OCI artifact — the
  same umbrella shape used by bp-cert-manager + bp-cilium +
  bp-mgmt-vcluster + bp-dmz-vcluster.
type: application
annotations:
  # CI Blueprint Release smoke-render gate accepts the literal token
  # "default-off" to bypass the "render < 5 lines" failure for charts
  # whose top-level condition (rtzVcluster.enabled) is false at default
  # values. The bootstrap-kit slot flips it on for every secondary region
  # via postBuild.substitute. The full-ON path is exercised by
  # chart/tests/render.sh which CI doesn't run as a Release gate.
  catalyst.openova.io/smoke-render-mode: "default-off"
keywords: [catalyst, blueprint, vcluster, rtz, isolation, multi-region, dod-a4]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

dependencies:
  - name: vcluster
    # G92 EPIC #2639 (2026-06-01) — sibling bump with bp-mgmt-vcluster
    # 0.2.0 + bp-dmz-vcluster 0.2.0. See bp-mgmt-vcluster/chart/Chart.yaml
    # for the full RCA on why the 0.21.0 schema is required.
    #
    # #3642/#3736 (2026-06-17): 0.21.0 → 0.23.0 LOCKSTEP with bp-mgmt-vcluster
    # + bp-dmz-vcluster (all 3 vCluster umbrellas pin the same loft-sh tag —
    # sibling drift = inconsistent syncer behaviour). The 0.23.0
    # sync.fromHost.secrets mappings that unblock the host→vCluster Secret
    # crossing are declared in bp-mgmt-vcluster (where the 7 NS#1 apps move);
    # this umbrella takes the version bump only.
    version: "0.23.0"
    repository: "https://charts.loft.sh"
    # The subchart only renders when the umbrella's top-level
    # `rtzVcluster.enabled` is true. Default-OFF therefore renders ZERO
    # resources. The bootstrap-kit Kustomization flips this on ONLY
    # for secondary regions (per the DoD A4 topology contract).
    condition: rtzVcluster.enabled
