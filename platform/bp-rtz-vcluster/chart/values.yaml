# Catalyst Blueprint values for bp-rtz-vcluster (DoD A4 — vCluster
# topology, 2026-05-16).
#
# Per docs/INVIOLABLE-PRINCIPLES.md #1/#4/#4a + MIRROR-EVERYTHING.

catalystBlueprint:
  upstream:
    chart: vcluster
    version: "0.20.0"
    repo: "https://charts.loft.sh"

# ── Registry mirror (MIRROR-EVERYTHING + Pillar 5 anti-tether #2940) ──
# Single source of truth for the registry host every image in this chart
# pulls through. Default `harbor.openova.io` preserves bootstrap behaviour.
# Consumed by (1) the `bp-rtz-vcluster.image` fail-fast helper for the
# umbrella image and (2) the loft-sh subchart syncer image registry, which
# (a subchart values literal Helm can't self-template) is driven by slot
# 59's `${REGISTRY_MIRROR:=harbor.openova.io}` postBuild substitution.
# Post-bp-self-sovereign-cutover (Step-04, ADR-0002) a per-Sovereign
# overlay flips this to `harbor.<sovereign-fqdn>`. Renamed from the dead
# `global.imageRegistry` (loft-sh never honoured that key). #2940.
global:
  registryMirror: "harbor.openova.io"

rtzVcluster:
  # Top-level enable gate.
  #
  # Founder direction 2026-05-28 (Refs #2537): every region runs the
  # symmetric triad MGMT+RTZ+DMZ. The historical asymmetric A4 contract
  # (primary=MGMT+DMZ, secondary=DMZ+RTZ) is superseded — the
  # SOVEREIGN_REGION_ROLE gate that would have flipped this on only on
  # secondary regions never landed, and is no longer needed.
  #
  # Default ON: this slot renders on every region of every Sovereign.
  # Operators who want to opt out flip via per-Sovereign overlay.
  enabled: true

  # ── Topology identity ───────────────────────────────────────────────
  hostNamespace: rtz
  vclusterName: rtz
  role: secondary

  # ── NodeSelector pin to this region's CP ────────────────────────────
  # The RTZ vCluster pod MUST run on the region's own CP node so
  # tenant traffic never silently lands in a foreign region.
  nodeSelector:
    regionLabelKey: "openova.io/region"
    regionLabelValue: ""

  # #2940 Pillar 5: registry-RELATIVE repository; the host is composed from
  # `global.registryMirror` by the `bp-rtz-vcluster.image` helper. Consumed
  # only by the umbrella fail-fast guard — the real syncer image is the
  # subchart value below; keep them in lockstep. Backward-compat: a
  # host-qualified repository is honoured verbatim by the helper.
  image:
    repository: "proxy-ghcr/loft-sh/vcluster"
    tag: "0.21.0"
    pullPolicy: "IfNotPresent"

  # ── NetworkPolicy isolation baseline ──────────────────────────────
  # RTZ default-deny: tenant workloads only reach DMZ for outbound
  # routes. NO direct mgmt access (mgmt only lives on the primary —
  # MGMT calls cross-region via DMZ WG).
  networkPolicy:
    enabled: true
    allowedIngressNamespaces:
      - dmz     # always present on the same region
      # REQUIRED: the Flux helm-controller (ns flux-system) manages the
      # in-vCluster HelmReleases targeted here (e.g. bp-sandbox) through the
      # vc-rtz kubeconfig → vcluster API :443. With allowWorldIngress:false this
      # is the ONLY path the controller has to the API; omitting it makes every
      # such HR StateError ("could not determine release state: dial tcp
      # …:443 i/o timeout") and never reconcile. flux-system is trusted
      # control-plane, so tenant isolation (world/other-tenants out) is intact. #3055
      - flux-system
      # REQUIRED (#3373 Batch A, 2026-06-14): the host `sme` namespace runs
      # the BSS control-plane services (auth/gateway via VALKEY_ADDR), which
      # consume bp-valkey. #3373 placement moved bp-valkey INTO this RTZ
      # vCluster, so its host-synced Service
      # (valkey-primary-x-valkey-x-rtz-vcluster.rtz.svc) now sits behind
      # this isolation policy. Without this entry the SME auth/gateway
      # services fail to reach valkey ("dial tcp …:6379 i/o timeout").
      # Endpoints are healthy; the policy is the wall. Mirrors the #3423
      # sme→NATS carve-out on bp-mgmt-vcluster.
      - sme
    allowWorldIngress: false   # tenant pods never face world directly

vcluster:
  controlPlane:
    distro:
      k8s:
        enabled: true
        # #3380-D Pillar-5 anti-tether (2026-06-13): pin the k8s distro
        # control-plane images off upstream `registry.k8s.io` and onto the
        # Sovereign-local Harbor `proxy-k8s` cache (lockstep with
        # bp-mgmt-vcluster). The loft-sh subchart otherwise defaults the
        # apiServer/controllerManager/scheduler images to
        # `registry.k8s.io/kube-*`, which the `harbor-proxy-pull` Enforce
        # ClusterPolicy would DENY on the next image roll. `harbor.openova.io`
        # is the bootstrap default (subchart values can't self-template
        # `global.registryMirror`); slot 58/59 flips it via
        # `${REGISTRY_MIRROR:=harbor.openova.io}` and cutover Step-04 pivots
        # it post-handover. `tag` left to the subchart default.
        apiServer:
          image:
            registry: harbor.openova.io
            repository: proxy-k8s/kube-apiserver
        controllerManager:
          image:
            registry: harbor.openova.io
            repository: proxy-k8s/kube-controller-manager
        scheduler:
          image:
            registry: harbor.openova.io
            repository: proxy-k8s/kube-scheduler
    backingStore:
      database:
        embedded:
          enabled: true
    statefulSet:
      scheduling:
        nodeSelector: {}
      image:
        # #2940 Pillar 5: the ACTUAL vCluster syncer image. This `registry`
        # is a subchart values literal Helm can't derive from
        # global.registryMirror here, so `harbor.openova.io` stays the
        # bootstrap fallback and the single overlay knob is slot 59's
        # `registry: ${REGISTRY_MIRROR:=harbor.openova.io}` substitution.
        # Keep in lockstep with the umbrella rtzVcluster.image above.
        registry: harbor.openova.io
        repository: proxy-ghcr/loft-sh/vcluster
        tag: "0.21.0"
      resources:
        requests:
          cpu: "200m"
          memory: "384Mi"
        limits:
          cpu: "2"
          memory: "1Gi"
      persistence:
        volumeClaim:
          enabled: true
          size: "5Gi"
          storageClass: "local-path"
    service:
      enabled: true
      spec:
        type: ClusterIP

  sync:
    toHost:
      services:
        enabled: true
      ingresses:
        enabled: false
      persistentVolumeClaims:
        enabled: true
      configMaps:
        enabled: true
      secrets:
        enabled: true
      # G92.5 #2664 (2026-06-01) — CNPG `Cluster` CR sync vCluster → host.
      # Mirrors the policy bp-mgmt-vcluster 0.2.1 ships (PR #2692). The
      # RTZ vCluster hosts per-Org tenant Applications + Sandbox per
      # docs/SOVEREIGN-MULTI-REGION-DOD.md §A4; both paths route
      # PostgreSQL provisioning through the host cnpg-operator (G92.6
      # substrate per #2665) via this sync policy:
      #
      #   - Tenant Applications: application-controller (G92.1 #2660,
      #     PR #2674) renders the per-Application HR with
      #     placementSchema.vcluster=rtz; the chart's CNPG Cluster CR
      #     lands in vCluster's apiserver and reflects to host via
      #     this policy.
      #   - Sandbox: sandbox-controller's per-Sandbox CNPG Cluster CR
      #     dispatch (slot 19a `sandbox.db.provision` block, D31
      #     active-hot-standby aware) lands in vCluster, reflects to
      #     host the same way.
      customResources:
        clusters.postgresql.cnpg.io:
          enabled: true
        poolers.postgresql.cnpg.io:
          enabled: true
        scheduledbackups.postgresql.cnpg.io:
          enabled: true
        # #3373 coupling fix (b) — vCluster CRD-sync set.
        # Charts re-homed INTO this vCluster ship HTTPRoute (Gateway API)
        # and ExternalSecret CRs. The syncer registers the CRDs inside the
        # vCluster apiserver (fromHost CRD discovery, same mechanism as the
        # CNPG entries above) and mirrors the CRs toHost, where the host
        # Cilium Gateway serves the route (backendRef pre-aliased to the
        # syncer-mangled Service name by the slot's
        # gateway.backendService value — fix (a)) and the host
        # external-secrets-operator resolves the ExternalSecret in the HR's
        # own host namespace — fix (c).
        httproutes.gateway.networking.k8s.io:
          enabled: true
        externalsecrets.external-secrets.io:
          enabled: true
    fromHost:
      ingressClasses:
        enabled: true

  # Writes a host-namespace Secret named `vc-rtz` containing a kubeconfig
  # for the vCluster's apiserver. The Sovereign-side handler
  # (core/services/provisioning/handlers/handlers.go
  # mirrorVClusterKubeconfig) mirrors this Secret into flux-system as
  # `rtz-vcluster-kubeconfig` so per-Sovereign Flux Kustomization CRs
  # can reconcile RTZ-vCluster-targeted resources.
  exportKubeConfig:
    context: vcluster
    # hw91 2026-06-04: same defect as bp-dmz-vcluster — the default
    # exported server is `https://localhost:8443`, unusable by the
    # host-cluster helm-controller that reconciles vc-rtz-targeted HRs
    # (rtz/bp-sandbox). Point at the host-side service DNS.
    server: https://rtz-vcluster.rtz:443
    secret:
      name: vc-rtz
