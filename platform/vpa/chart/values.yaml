# Catalyst Blueprint umbrella metadata — the upstream chart is resolved as
# a Helm subchart via Chart.yaml `dependencies:`. Catalyst-curated values
# under the `vertical-pod-autoscaler:` key flow into the upstream subchart
# unchanged.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

catalystBlueprint:
  upstream:
    chart: vertical-pod-autoscaler
    version: "11.1.1"
    repo: "https://cowboysysop.github.io/charts/"

# ─── Upstream chart values (subchart key: vertical-pod-autoscaler) ───────
# Note: the cowboysysop chart name on disk is `vertical-pod-autoscaler` —
# Helm's umbrella convention requires the values key match that name.
vertical-pod-autoscaler:

  # Pin upstream image versions — DO NOT use floating tags per
  # docs/INVIOLABLE-PRINCIPLES.md.
  recommender:
    enabled: true
    replicaCount: 1
    image:
      # Upstream cowboysysop chart prepends `.image.registry` (default
      # registry.k8s.io) to `.image.repository`, so we MUST NOT include
      # the registry hostname in repository — the rendered image would
      # be `registry.k8s.io/registry.k8s.io/autoscaling/...` (doubled
      # prefix) and pulls fail with "image not found" (caught live on
      # otech26).
      #
      # Route registry.k8s.io through the Sovereign Harbor `proxy-k8s` cache
      # via the chart's own `.image.registry` knob (canonical idiom
      # `registry.k8s.io/X` → `harbor.openova.io/proxy-k8s/X`, Refs #3296
      # #3903). Bare `registry.k8s.io/...` (a) ImagePullBackOffs on the
      # IPv4-only Huawei VPC and (b) matches NEITHER harbor-proxy-pull glob
      # (`*/proxy-*/*` | `*/openova-io/*`, Enforce) → denied on the next roll.
      # Same `proxy-k8s` project the vCluster control-plane images use.
      registry: harbor.openova.io/proxy-k8s
      repository: autoscaling/vpa-recommender
      tag: "1.5.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # Recommender prefers metrics-server but will also scrape Prometheus
    # when configured. The default (metrics-server only) is fine for a
    # fresh Sovereign — per-Sovereign overlays MAY add Prometheus extra
    # args once bp-mimir reconciles.
    extraArgs: {}
    # ServiceMonitor / PrometheusRule — DEFAULT FALSE per
    # docs/BLUEPRINT-AUTHORING.md §11.2. monitoring.coreos.com/v1 CRDs
    # ship with kube-prometheus-stack, which is an Application-tier
    # Blueprint. Operator opts in via per-cluster overlay.
    metrics:
      serviceMonitor:
        enabled: false
      prometheusRule:
        enabled: false

  updater:
    enabled: true
    replicaCount: 1
    image:
      # registry.k8s.io → Harbor proxy-k8s (see recommender note, Refs #3296).
      registry: harbor.openova.io/proxy-k8s
      repository: autoscaling/vpa-updater
      tag: "1.5.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
    # Per-Sovereign overlays MAY tune `--eviction-tolerance` etc.
    extraArgs: {}
    metrics:
      serviceMonitor:
        enabled: false
      prometheusRule:
        enabled: false

  admissionController:
    enabled: true
    replicaCount: 1
    image:
      # registry.k8s.io → Harbor proxy-k8s (see recommender note, Refs #3296).
      registry: harbor.openova.io/proxy-k8s
      repository: autoscaling/vpa-admission-controller
      tag: "1.5.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
    # #3499 (Refs #3375, #3380, 2026-06-14) — exclude kube-system from the
    # VPA pod-mutating webhook so it can never gate the CNI bootstrap.
    #
    # The VPA admission-controller SELF-REGISTERS a MutatingWebhookConfiguration
    # (`vpa-webhook-config`) matching CREATE on `pods` in every namespace. Its
    # backend Pod can be scheduled onto ANY node — including one whose
    # cilium-agent a concurrent cilium DaemonSet roll has just deleted. When
    # that happens the apiserver's call to the VPA webhook (failurePolicy=Ignore,
    # timeout=30s) hangs against the de-CNI'd backend for the FULL 30s before
    # being ignored — which exceeds the apiserver's Pod-create request deadline,
    # so even the replacement cilium-agent Pod create returns "context deadline
    # exceeded". That stalls CNI self-heal (root-caused live on hw135: VPA
    # backend 10.42.4.209 sat on the de-CNI'd node, blocking cilium recreation
    # for 30s/attempt; #3499). The companion bp-kyverno fix exempts cilium from
    # the Fail webhook; this exempts it from the VPA webhook so the CNI bootstrap
    # is gated by NO webhook at all.
    #
    # VPA 1.5.0 builds the webhook's namespaceSelector from
    # `--ignored-vpa-object-namespaces` (comma-separated): the binary registers
    # the webhook with `namespaceSelector: kubernetes.io/metadata.name NotIn
    # [<here>]` AND skips VPA-object reconciliation in those namespaces (see
    # autoscaler vertical-pod-autoscaler-1.5.0 pkg/admission-controller
    # config.go selfRegistration + main.go). Because VPA RE-registers the
    # webhook on every restart/roll, this exclusion survives — unlike a manual
    # patch of the webhook config, which VPA would overwrite. kube-system holds
    # the cilium DaemonSet + operator + envoy + all other CNI/control-plane
    # bootstrap workloads; VPA never right-sizes those, so excluding it costs
    # nothing.
    #
    # ─── Webhook-timeout cap — defence-in-depth (Refs #3374, #3375) ──────
    # `ignored-vpa-object-namespaces` above exempts ONLY kube-system, which
    # protects the cilium CNI bootstrap. But the same VPA webhook still
    # intercepts Pod CREATE in EVERY OTHER namespace (cnpg, keycloak, the
    # tenant vclusters, …) with the upstream-default 30s timeout. If the
    # single admission-controller replica is ever briefly unroutable while
    # cilium is otherwise healthy (node reboot, replica reschedule), every
    # Pod CREATE in those namespaces hangs up to 30s — long enough to time
    # out a cnpg-pair initdb bootstrap Pod (root-caused live on hw135: the
    # initdb Pod CREATE returned "context deadline exceeded", #3375). Since
    # cilium is healthy in that scenario the mesh won't self-heal the way the
    # kube-system exemption fixes the CNI case, so the exemption alone does
    # not cover it. Capping the webhook timeout at 2s bounds that blast
    # radius cluster-wide: failurePolicy=Ignore means the api-server simply
    # falls through after 2s. 2s is ample for a cluster-internal mutation;
    # steady state carries zero added CREATE latency. Per-Sovereign overlays
    # MAY raise it.
    extraArgs:
      ignored-vpa-object-namespaces: kube-system
      webhook-timeout-seconds: 2
    # The admission controller serves a MutatingWebhookConfiguration over
    # TLS. The upstream chart bootstraps a self-signed CA + cert via an
    # init job, which is fine for Catalyst because the webhook is
    # cluster-internal and not exposed externally. Per-Sovereign overlays
    # MAY swap to cert-manager-issued certs if preferred.
    generateCertificate: true
    metrics:
      serviceMonitor:
        enabled: false
      prometheusRule:
        enabled: false

  # CRDs — VPA's CRDs (verticalpodautoscalers, verticalpodautoscalercheck
  # points) ship with the chart. `helm install` creates them. Per
  # docs/INVIOLABLE-PRINCIPLES.md #3, we keep CRD lifecycle managed by
  # the chart — Flux will surface CRD upgrade conflicts as
  # InstallFailed/UpgradeFailed events that the operator resolves
  # explicitly (no silent drift).
  crds:
    install: true
    keep: true
    # The CRD-install Job (templates/crds/job.yaml) runs a kubectl image at
    # install time — upstream default `docker.io/bitnamilegacy/kubectl`. Route
    # it through the Sovereign Harbor `proxy-dockerhub` cache (canonical idiom,
    # same as cnpg's webhookCertBootstrap kubectl, Refs #3296 #3903) so the
    # install Job pulls on a fresh IPv4-only prov and satisfies harbor-proxy-
    # pull. The chart prepends `.image.registry` to `.image.repository`.
    image:
      registry: harbor.openova.io/proxy-dockerhub
      repository: bitnamilegacy/kubectl
      tag: "1.29.3"

  # Helm-test pod image (`helm test` only — NOT auto-deployed at runtime).
  # Proxied for completeness so an operator-run test never ImagePullBackOffs
  # nor trips harbor-proxy-pull. ghcr.io → Harbor proxy-ghcr (Refs #3296).
  tests:
    image:
      registry: harbor.openova.io/proxy-ghcr
      repository: cowboysysop/pytest
      tag: "1.2.0"

  # RBAC — chart manages its own ClusterRole + ServiceAccount.
  rbac:
    create: true

  # Default UpdateMode for autogenerated VPAs is `Off` (recommend only).
  # Per docs/INVIOLABLE-PRINCIPLES.md #1: Catalyst doesn't auto-enable
  # mutation of customer workloads — SREs opt in per-workload via a
  # VerticalPodAutoscaler CR with `updatePolicy.updateMode: Auto`.
  # (This setting is not consumed by the upstream chart directly — it
  # documents intent. Per-workload VPA CRs override it.)

# ─── Catalyst overlay values (consumed by templates/ in this chart) ──────
# Reserved for Catalyst-side overlays (NetworkPolicy) added in a follow-up
# PR once bp-vpa is consumed in clusters/_template/.
vpaOverlay:
  networkPolicy:
    enabled: false
    admissionWebhookPort: 8000
    metricsPort: 8942
    metricsServerPort: 4443
