apiVersion: v2
name: bp-storage-ready
version: 0.1.0
appVersion: "n/a"
description: |
  The neutral storage gate of the bootstrap kit (slot 15b, HelmRelease
  storage-ready): one hook Job that succeeds when the StorageClass named by
  expectedClass is the cluster default, and fails after 10 minutes.
type: application
keywords: [catalyst, blueprint, storage, storageclass, bootstrap-kit, gate]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# No upstream Helm chart: the one hook Job and its RBAC are Catalyst-authored.
annotations:
  catalyst.openova.io/no-upstream: "true"
