{{- /*
bp-storage-ready: the neutral storage gate of the bootstrap kit (slot 15b).
A pre-install and pre-upgrade hook Job exits 0 when the StorageClass named by
.Values.expectedClass carries storageclass.kubernetes.io/is-default-class:
"true". It checks every 5 seconds for at most 600 seconds, then exits 1 and
Flux retries the release. An empty expectedClass fails at once. The RBAC hooks
(weight -5) exist before the Job (weight 0); all four go after success.
*/}}
{{- $timeout := 600 -}}
{{- $interval := 5 -}}
{{- $image := "harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-gate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bp-storage-ready
    app.kubernetes.io/component: storage-gate
    catalyst.openova.io/blueprint: bp-storage-ready
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-gate
  labels:
    app.kubernetes.io/name: bp-storage-ready
    app.kubernetes.io/component: storage-gate
    catalyst.openova.io/blueprint: bp-storage-ready
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-gate
  labels:
    app.kubernetes.io/name: bp-storage-ready
    app.kubernetes.io/component: storage-gate
    catalyst.openova.io/blueprint: bp-storage-ready
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-gate
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-gate
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-gate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bp-storage-ready
    app.kubernetes.io/component: storage-gate
    catalyst.openova.io/blueprint: bp-storage-ready
    # A hook carries no HelmRelease owner reference. The Kyverno policy
    # flux-managed admits it by this label.
    app.kubernetes.io/managed-by: flux
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bp-storage-ready
        app.kubernetes.io/component: storage-gate
        app.kubernetes.io/managed-by: flux
    spec:
      serviceAccountName: {{ .Release.Name }}-gate
      restartPolicy: Never
      containers:
        - name: gate
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 96Mi }
          env:
            - name: EXPECTED_CLASS
              value: {{ .Values.expectedClass | default "" | quote }}
            - name: TIMEOUT_SECONDS
              value: {{ $timeout | quote }}
            - name: INTERVAL_SECONDS
              value: {{ $interval | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              if [ -z "${EXPECTED_CLASS}" ]; then
                echo "FATAL: the value expectedClass is empty. Set it to the name of the default StorageClass." >&2
                exit 1
              fi
              echo "storage gate: waiting until StorageClass ${EXPECTED_CLASS} is the cluster default (at most ${TIMEOUT_SECONDS}s)."
              deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
              until [ "$(kubectl get storageclass "${EXPECTED_CLASS}" -o 'jsonpath={.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}' 2>/dev/null || true)" = "true" ]; do
                if [ "$(date +%s)" -ge "${deadline}" ]; then
                  echo "FATAL: StorageClass ${EXPECTED_CLASS} is not the cluster default after ${TIMEOUT_SECONDS}s. StorageClasses now:" >&2
                  kubectl get storageclass >&2 || true
                  exit 1
                fi
                sleep "${INTERVAL_SECONDS}"
              done
              echo "storage gate: StorageClass ${EXPECTED_CLASS} is the cluster default."
