{{- /*
Function test of bp-storage-ready (docs/RUNBOOKS.md section 4.5). `helm test` runs it.

The function of this release is that the StorageClass named by expectedClass
is the cluster default, so that a claim without a class binds on it. The test
lists the StorageClasses through the Kubernetes API and passes when exactly
one of them carries storageclass.kubernetes.io/is-default-class: "true" and
that one is expectedClass: with two defaults the API server picks the newest
for a claim without a class. It reads nothing else and writes nothing.

The release's own hook Job waits for the class before the install ends, so at
install the test meets its subject already up; after an upgrade, or when
another class turns default, it reads the classes again every 10 seconds until
60 seconds before its bound T and then fails naming the default classes it
saw. T is functionTest.timeoutSeconds, the Pod's activeDeadlineSeconds: the
kit states the install timeout of its release there (docs/RUNBOOKS.md section
4.5); without it T is 300. An empty expectedClass fails at once.

A StorageClass has no namespace, so a ClusterRole and a ClusterRoleBinding of
this file (get and list on storageclasses) give the test Pod that right. Their
names carry the namespace, so two releases never share them. The image is the
kubectl image of the hook Job; functionTest.image overrides it.
*/ -}}
{{- $ft := .Values.functionTest | default dict }}
{{- $bound := int ($ft.timeoutSeconds | default 300) }}
{{- $wait := sub $bound 60 }}
{{- $image := $ft.image | default "harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4" }}
{{- $clusterName := printf "%s-%s-function-test" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-function-test
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $clusterName }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    catalyst.openova.io/function-test: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: {{ $bound }}
  serviceAccountName: {{ .Release.Name }}-function-test
  containers:
    - name: function-test
      image: {{ $image | quote }}
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: HOME
          value: /tmp
        - name: EXPECTED_CLASS
          value: {{ .Values.expectedClass | default "" | quote }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          {{- include "kube-access-lib.in-cluster-kubeconfig" . | nindent 10 }}
          fail() { echo "FUNCTION-TEST fail {{ .Chart.Name }} $1"; exit 1; }
          [ -n "${EXPECTED_CLASS}" ] || fail "the value expectedClass is empty"
          while :; do
            if list="$(kubectl --request-timeout=15s get storageclass -o 'jsonpath={range .items[*]}{.metadata.name}{" "}{.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}{"\n"}{end}' 2>/tmp/error)"; then
              defaults=""
              while read -r name value; do
                [ "${value:-}" = "true" ] && defaults="${defaults:+${defaults} }${name}"
              done <<< "${list}"
              [ "${defaults}" = "${EXPECTED_CLASS}" ] && break
              reason="the default StorageClasses are '${defaults}'"
            else
              reason="the StorageClasses cannot be read: $(tr '\n' ' ' < /tmp/error | cut -c1-160)"
            fi
            [ "${SECONDS}" -lt {{ $wait }} ] || fail "StorageClass ${EXPECTED_CLASS} is not the one default class within {{ $wait }} seconds: ${reason}"
            sleep 10
          done
          echo "FUNCTION-TEST pass {{ .Chart.Name }} StorageClass ${EXPECTED_CLASS} is the one default class"
  volumes:
    - name: tmp
      emptyDir: {}
