{{- if .Values.coraza.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bp-coraza.fullname" . }}
  labels:
    {{- include "bp-coraza.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.coraza.replicas }}
  selector:
    matchLabels:
      {{- include "bp-coraza.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bp-coraza.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "bp-coraza.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: coraza-spoa
          image: "{{ .Values.coraza.image.repository }}:{{ .Values.coraza.image.tag }}"
          imagePullPolicy: {{ .Values.coraza.image.pullPolicy }}
          ports:
            - name: spoa
              containerPort: {{ .Values.coraza.spoaPort }}
              protocol: TCP
          # #4347 — liveness + readiness probes (required by the host-ns Kyverno
          # `probes-present` Enforce ClusterPolicy after #4325 moved bp-coraza
          # into a native host namespace). coraza-spoa is a TCP SPOA (HAProxy
          # SPOE) server with no HTTP health endpoint, so both probes are
          # tcpSocket checks against the spoa listener — a bound, accepting
          # socket is the correct readiness/liveness signal for the WAF agent.
          readinessProbe:
            tcpSocket:
              port: spoa
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: spoa
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.coraza.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.coraza.securityContext | nindent 12 }}
          {{- if .Values.coraza.configMap }}
          volumeMounts:
            - name: config
              mountPath: /etc/coraza-spoa
              readOnly: true
          {{- end }}
      {{- if .Values.coraza.configMap }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.coraza.configMap }}
      {{- end }}
{{- end }}
