apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-ferretdb
  labels:
    catalyst.openova.io/section: pts-4-application-tier
spec:
  # G117.1 (Wave-1/B3) — scaffold-only Application Blueprint.
  #
  # This Blueprint folder currently only ships a README; the upstream chart
  # is tracked but not yet packaged. The four new blocks below declare the
  # intended target-state per docs/sessions/2026-06-02-per-blueprint-topology-audit.md,
  # so the catalog UI, application-controller, and SSO fan-out can plan
  # against it ahead of the chart being authored.
  version: 0.0.0
  card:
    title: Ferretdb
    summary: |
      Scaffold-only Application Blueprint — chart not yet packaged.
      Topology + endpoints + sso + multiInstance are declared per the
      G117.1 audit so downstream Catalyst surfaces can render against
      it.
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-passive
    - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: rtz
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: wire
    hostnameTemplate: db.{{.OrgDomain}}
    port: 27017
    protocol: tcp
    tls: false
    visibility: public
    launchDefault: true
    ssoEnabled: false
  multiInstance:
    enabled: true
    maxPerOrg: 10
    namingTemplate: '{{.AppName}}-{{.InstanceID}}'
    isolationLevel: namespace
  # ── /G117.1 ──
