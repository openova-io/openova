{{- /*
RBAC for the setup Job (templates/setup-job.yaml). Ordinary objects of the
release, like the Job itself: a Helm hook with the delete policy
hook-succeeded would be deleted as soon as it was created, before the Job
could use it.

  - Role in the release namespace: read the submission Secret, patch the
    dns-records ConfigMap (DKIM public key write-back).
  - Role in the mirror namespace (catalyst-system): create the mirror
    Secret, and read and replace it by name. "create" cannot be limited by
    resourceNames, so it is a rule of its own.

The mirror Role and RoleBinding live in the mirror namespace, so that
namespace must exist when the release is installed.
*/}}
{{- if and .Values.stalwart.enabled .Values.setupJob.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bp-stalwart-sovereign.fullname" . }}-setup
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "bp-stalwart-sovereign.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.smtp.submissionSecretName | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "bp-stalwart-sovereign.dnsRecordsConfigMapName" . | quote }}]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bp-stalwart-sovereign.fullname" . }}-setup
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "bp-stalwart-sovereign.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bp-stalwart-sovereign.fullname" . }}-setup
subjects:
  - kind: ServiceAccount
    name: {{ include "bp-stalwart-sovereign.serviceAccountName" . }}
    namespace: {{ .Release.Namespace | quote }}
{{- $cfg := .Values.sovereignSMTPCredentialsMirror | default dict -}}
{{- $cfgEnabled := dig "enabled" true $cfg -}}
{{- $mirrorNs := default "catalyst-system" $cfg.namespace -}}
{{- $mirrorName := default "sovereign-smtp-credentials" $cfg.secretName -}}
{{- if $cfgEnabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bp-stalwart-sovereign.fullname" . }}-mirror
  namespace: {{ $mirrorNs | quote }}
  labels:
    {{- include "bp-stalwart-sovereign.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $mirrorName | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bp-stalwart-sovereign.fullname" . }}-mirror
  namespace: {{ $mirrorNs | quote }}
  labels:
    {{- include "bp-stalwart-sovereign.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bp-stalwart-sovereign.fullname" . }}-mirror
subjects:
  - kind: ServiceAccount
    name: {{ include "bp-stalwart-sovereign.serviceAccountName" . }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
{{- end }}
