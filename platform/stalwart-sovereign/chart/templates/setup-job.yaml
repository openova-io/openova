{{- /*
Setup Job of the Sovereign's own mail server. It is an ordinary object of the
release, not a Helm hook. Helm always waits for a hook; it waits for an
ordinary Job only when the release is told to wait for Jobs. A HelmRelease
that installs this chart therefore sets install.disableWait and
upgrade.disableWait to true, and then the release (and the bootstrap kit that
holds it) is never held by mail. The Job runs in the background and is
bounded by activeDeadlineSeconds and backoffLimit (setupJob in values.yaml).

The Job name ends in the first 10 hex characters of the SHA-256 of its pod
template. A Job's pod template cannot be changed in place, so a changed
template gives a new name: Helm creates the new Job and deletes the old one.
An unchanged template keeps the name, and an upgrade leaves the Job as it is.

The Job's pod carries the selector labels, so the chart's NetworkPolicy
selects it, but not the label app.kubernetes.io/component of the server's
pods, so it is never an endpoint of the chart's Services.

The server (release v0.15.5) answers HTTP 200 to almost every admin call,
also when it refuses one: a refusal is the body {"error":"<name>",...}, a
success the body {"data":...}. Every call is judged by its body.

Every step can run again with the same result:

  1. Wait until the server is ready (/healthz/ready), at most 60 tries with
     a 2 s time limit each. The chart's NetworkPolicy allows this pod to
     reach port 8080 of the chart's own pods.
  2. Make the Sovereign's domain a principal of the server, or find it
     there: the server refuses an address in a domain it does not hold.
  3. Make the submission principal match the in-namespace submission Secret:
     create it when the server says notFound, otherwise set its secret to
     the Secret's password. Then read it back; anything but a principal
     fails the run.
  4. Pin mail.<sovereignFQDN> to the cluster address of the mail Service:
     merge the key corednsPin.pinKey into the CoreDNS extension ConfigMap
     (create it when absent). The mail client checks the certificate
     against that name, and outside the cluster the name does not reach
     the server.
  5. Write catalyst-system/sovereign-smtp-credentials (the mirror) from the
     submission Secret: create it when it does not exist, otherwise replace
     it (PUT), so that it holds exactly what this chart writes and no label,
     annotation or key of an earlier writer stays. The mirror is written only
     after steps 3 and 4 succeeded, so a reader never gets a credential the
     server does not know or a host that does not reach it. It carries the
     key shape of every reader (smtp-*, user/password, SMTP_*) and the
     reflector annotations that copy it into the namespaces of
     sovereignSMTPCredentialsMirror.reflectionNamespaces.
  6. Write the DKIM public key into the dns-records ConfigMap. Best effort:
     it never fails the run.

A failure in steps 1 to 5 exits 1; the Job is retried until it succeeds or
its deadline passes. No password is ever printed: credentials are read from
env and written to files under /tmp that only this container reads.
*/}}
{{- define "bp-stalwart-sovereign.setupPodTemplate" -}}
{{- $fqdn := include "bp-stalwart-sovereign.sovereignFQDN" . -}}
{{- $cfg := .Values.sovereignSMTPCredentialsMirror | default dict -}}
{{- $cfgEnabled := dig "enabled" true $cfg -}}
{{- $mirrorNs := default "catalyst-system" $cfg.namespace -}}
{{- $mirrorName := default "sovereign-smtp-credentials" $cfg.secretName -}}
{{- $reflectNs := default "chargeback" $cfg.reflectionNamespaces -}}
{{- $pin := .Values.corednsPin | default dict -}}
{{- $pinEnabled := dig "enabled" true $pin -}}
{{- $mailHost := include "bp-stalwart-sovereign.mailFQDN" . -}}
{{- $sender := include "bp-stalwart-sovereign.senderAddress" . -}}
metadata:
  labels:
    {{- include "bp-stalwart-sovereign.selectorLabels" . | nindent 4 }}
    catalyst.openova.io/job: stalwart-sovereign-setup
spec:
  restartPolicy: OnFailure
  serviceAccountName: {{ include "bp-stalwart-sovereign.serviceAccountName" . }}
  {{- with .Values.stalwart.image.pullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: setup
      image: {{ include "bp-stalwart-sovereign.setupJobImage" . | quote }}
      imagePullPolicy: {{ .Values.setupJob.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop: ["ALL"]
      {{- with .Values.setupJob.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      env:
        - name: STALWART_URL
          value: "http://{{ include "bp-stalwart-sovereign.fullname" . }}-http.{{ .Release.Namespace }}.svc.cluster.local:8080"
        - name: SOVEREIGN_FQDN
          value: {{ $fqdn | default "" | quote }}
        - name: MAIL_HOST
          value: {{ $mailHost | default "" | quote }}
        - name: SENDER_ADDRESS
          value: {{ $sender | default "" | quote }}
        - name: SUBMISSION_USER
          value: {{ .Values.smtp.submissionUser | quote }}
        - name: RELEASE_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: MAIL_SERVICE
          value: "{{ include "bp-stalwart-sovereign.fullname" . }}-mail"
        - name: DNS_RECORDS_CONFIGMAP
          value: {{ include "bp-stalwart-sovereign.dnsRecordsConfigMapName" . | quote }}
        - name: PIN_ENABLED
          value: {{ ternary "true" "false" $pinEnabled | quote }}
        - name: PIN_NAMESPACE
          value: {{ default "kube-system" $pin.namespace | quote }}
        - name: PIN_CONFIGMAP
          value: {{ default "coredns-custom" $pin.configMapName | quote }}
        - name: PIN_ENTRY
          value: {{ default "stalwart-sovereign-mail-pin.server" $pin.pinKey | quote }}
        - name: MIRROR_NAMESPACE
          value: {{ $mirrorNs | quote }}
        - name: MIRROR_NAME
          value: {{ $mirrorName | quote }}
        - name: MIRROR_ENABLED
          value: {{ ternary "true" "false" $cfgEnabled | quote }}
        - name: REFLECTION_NAMESPACES
          value: {{ $reflectNs | quote }}
        {{- include "bp-stalwart-sovereign.adminPasswordEnv" . | nindent 8 }}
        {{- include "bp-stalwart-sovereign.submissionPasswordEnv" . | nindent 8 }}
      command:
        - /bin/sh
        - -ec
        - |
          set -eu
          log() { echo "[stalwart-sovereign-setup] $*"; }
          trap 'rm -f /tmp/principal.json /tmp/answer.json /tmp/service.json /tmp/pin.json /tmp/mirror.json /tmp/dkim.json' EXIT
          # answer: "data" for a success body of the admin API, the error name
          # for a refusal ({"error":"notFound",...} gives notFound), "other" else.
          answer() {
            if grep -q '^{"data"' /tmp/answer.json 2>/dev/null; then echo data; return 0; fi
            a="$(sed -n 's/^{"error":"\([A-Za-z]*\)".*/\1/p' /tmp/answer.json 2>/dev/null | head -1)"
            echo "${a:-other}"
          }

          if [ -z "${SOVEREIGN_FQDN:-}" ]; then
            log "sovereignFQDN unset; nothing to set up"
            exit 0
          fi

          # 1. Wait until the server is ready: at most 60 tries.
          log "waiting for ${STALWART_URL}/healthz/ready"
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -m 2 "${STALWART_URL}/healthz/ready" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "${ready}" != "1" ]; then
            log "mail server not ready; the Job retries"
            exit 1
          fi

          # 2. The Sovereign's domain is a principal of the server.
          printf '{"type":"domain","name":"%s","description":"Sovereign mail domain"}' "${SOVEREIGN_FQDN}" > /tmp/principal.json
          code="$(curl -sS -m 10 -o /tmp/answer.json -w '%{http_code}' -u "admin:${ADMIN_PASSWORD}" -H "Content-Type: application/json" \
            -X POST "${STALWART_URL}/api/principal" -d @/tmp/principal.json)" || code=000
          a="$(answer)"
          if [ "${code}" != "200" ] || { [ "${a}" != "data" ] && [ "${a}" != "fieldAlreadyExists" ]; }; then
            log "domain ${SOVEREIGN_FQDN} not created (HTTP ${code}, ${a}); the Job retries"
            exit 1
          fi
          log "domain ${SOVEREIGN_FQDN} present"

          # 3. The submission principal matches the submission Secret.
          code="$(curl -sS -m 10 -o /tmp/answer.json -w '%{http_code}' -u "admin:${ADMIN_PASSWORD}" \
            "${STALWART_URL}/api/principal/${SUBMISSION_USER}")" || code=000
          a="$(answer)"
          if [ "${code}" = "200" ] && [ "${a}" = "notFound" ]; then
            log "create principal ${SUBMISSION_USER}"
            printf '{"name":"%s","description":"Sovereign Console submission principal","secrets":["%s"],"emails":["%s"],"roles":["user"]}' \
              "${SUBMISSION_USER}" "${SUBMISSION_PASSWORD}" "${SENDER_ADDRESS}" > /tmp/principal.json
            code="$(curl -sS -m 10 -o /tmp/answer.json -w '%{http_code}' -u "admin:${ADMIN_PASSWORD}" -H "Content-Type: application/json" \
              -X POST "${STALWART_URL}/api/principal" -d @/tmp/principal.json)" || code=000
          elif [ "${code}" = "200" ] && [ "${a}" = "data" ]; then
            log "set the secret of principal ${SUBMISSION_USER}"
            printf '[{"action":"set","field":"secrets","value":["%s"]}]' "${SUBMISSION_PASSWORD}" > /tmp/principal.json
            code="$(curl -sS -m 10 -o /tmp/answer.json -w '%{http_code}' -u "admin:${ADMIN_PASSWORD}" -H "Content-Type: application/json" \
              -X PATCH "${STALWART_URL}/api/principal/${SUBMISSION_USER}" -d @/tmp/principal.json)" || code=000
          else
            log "principal read answered HTTP ${code} (${a}); the Job retries"
            exit 1
          fi
          rm -f /tmp/principal.json
          a="$(answer)"
          if [ "${code}" != "200" ] || [ "${a}" != "data" ]; then
            log "principal ${SUBMISSION_USER} not written (HTTP ${code}, ${a}); the Job retries"
            exit 1
          fi
          code="$(curl -sS -m 10 -o /tmp/answer.json -w '%{http_code}' -u "admin:${ADMIN_PASSWORD}" \
            "${STALWART_URL}/api/principal/${SUBMISSION_USER}")" || code=000
          if [ "${code}" != "200" ] || [ "$(answer)" != "data" ]; then
            log "principal ${SUBMISSION_USER} not confirmed (HTTP ${code}); the Job retries"
            exit 1
          fi
          log "principal ${SUBMISSION_USER} confirmed"

          K8S_API="https://kubernetes.default.svc"
          K8S_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

          # 4. mail.<fqdn> resolves to the mail Service inside the cluster.
          if [ "${PIN_ENABLED}" = "true" ]; then
            code="$(curl -sS -m 10 --cacert "${CACERT}" -H "Authorization: Bearer ${K8S_TOKEN}" \
              -o /tmp/service.json -w '%{http_code}' \
              "${K8S_API}/api/v1/namespaces/${RELEASE_NAMESPACE}/services/${MAIL_SERVICE}")" || code=000
            cip="$(grep -o '"clusterIP": *"[0-9a-fA-F.:]*"' /tmp/service.json 2>/dev/null | head -1 | sed 's/.*"\([^"]*\)"$/\1/')"
            rm -f /tmp/service.json
            if [ "${code}" != "200" ] || [ -z "${cip}" ]; then
              log "no cluster address of Service ${RELEASE_NAMESPACE}/${MAIL_SERVICE} (HTTP ${code}); the Job retries"
              exit 1
            fi
            data="$(printf '"data":{"%s":"%s {\\n    hosts {\\n        %s %s\\n        fallthrough\\n    }\\n    forward . /etc/resolv.conf\\n}\\n"}' \
              "${PIN_ENTRY}" "${MAIL_HOST}" "${cip}" "${MAIL_HOST}")"
            CM="${K8S_API}/api/v1/namespaces/${PIN_NAMESPACE}/configmaps"
            printf '{%s}' "${data}" > /tmp/pin.json
            code="$(curl -sS -m 10 --cacert "${CACERT}" -H "Authorization: Bearer ${K8S_TOKEN}" \
              -H "Content-Type: application/merge-patch+json" -o /dev/null -w '%{http_code}' \
              -X PATCH "${CM}/${PIN_CONFIGMAP}" -d @/tmp/pin.json)" || code=000
            if [ "${code}" = "404" ]; then
              printf '{"apiVersion":"v1","kind":"ConfigMap","metadata":{"name":"%s","namespace":"%s"},%s}' \
                "${PIN_CONFIGMAP}" "${PIN_NAMESPACE}" "${data}" > /tmp/pin.json
              code="$(curl -sS -m 10 --cacert "${CACERT}" -H "Authorization: Bearer ${K8S_TOKEN}" \
                -H "Content-Type: application/json" -o /dev/null -w '%{http_code}' \
                -X POST "${CM}" -d @/tmp/pin.json)" || code=000
            fi
            rm -f /tmp/pin.json
            if [ "${code}" != "200" ] && [ "${code}" != "201" ]; then
              log "pin of ${MAIL_HOST} not written into ${PIN_NAMESPACE}/${PIN_CONFIGMAP} (HTTP ${code}); the Job retries"
              exit 1
            fi
            log "pin ${MAIL_HOST} -> ${cip} written into ${PIN_NAMESPACE}/${PIN_CONFIGMAP}"
          else
            log "pin disabled; skipping"
          fi

          # 5. The mirror Secret, written only after steps 3 and 4.
          if [ "${MIRROR_ENABLED}" = "true" ]; then
            B64_HOST="$(printf '%s' "${MAIL_HOST}" | base64 -w0)"
            B64_PORT="$(printf '%s' '587' | base64 -w0)"
            B64_FROM="$(printf '%s' "${SENDER_ADDRESS}" | base64 -w0)"
            B64_USER="$(printf '%s' "${SUBMISSION_USER}" | base64 -w0)"
            B64_PASS="$(printf '%s' "${SUBMISSION_PASSWORD}" | base64 -w0)"
            cat > /tmp/mirror.json <<MIRROR_JSON
          {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {
              "name": "${MIRROR_NAME}",
              "namespace": "${MIRROR_NAMESPACE}",
              "labels": {
                "app.kubernetes.io/name": "bp-stalwart-sovereign",
                "catalyst.openova.io/component": "sovereign-smtp-credentials-mirror"
              },
              "annotations": {
                "reflector.v1.k8s.emberstack.com/reflection-allowed": "true",
                "reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces": "${REFLECTION_NAMESPACES}",
                "reflector.v1.k8s.emberstack.com/reflection-auto-enabled": "true",
                "reflector.v1.k8s.emberstack.com/reflection-auto-namespaces": "${REFLECTION_NAMESPACES}"
              }
            },
            "type": "Opaque",
            "data": {
              "smtp-host": "${B64_HOST}",
              "smtp-port": "${B64_PORT}",
              "smtp-from": "${B64_FROM}",
              "smtp-user": "${B64_USER}",
              "smtp-pass": "${B64_PASS}",
              "user": "${B64_USER}",
              "password": "${B64_PASS}",
              "SMTP_HOST": "${B64_HOST}",
              "SMTP_PORT": "${B64_PORT}",
              "SMTP_FROM": "${B64_FROM}",
              "SMTP_USER": "${B64_USER}",
              "SMTP_PASS": "${B64_PASS}"
            }
          }
          MIRROR_JSON
            code="$(curl -sS -m 10 --cacert "${CACERT}" -H "Authorization: Bearer ${K8S_TOKEN}" \
              -o /dev/null -w '%{http_code}' \
              "${K8S_API}/api/v1/namespaces/${MIRROR_NAMESPACE}/secrets/${MIRROR_NAME}")" || code=000
            if [ "${code}" = "404" ]; then
              code="$(curl -sS -m 10 --cacert "${CACERT}" -H "Authorization: Bearer ${K8S_TOKEN}" \
                -H "Content-Type: application/json" -o /dev/null -w '%{http_code}' \
                -X POST "${K8S_API}/api/v1/namespaces/${MIRROR_NAMESPACE}/secrets" \
                -d @/tmp/mirror.json)" || code=000
            elif [ "${code}" = "200" ]; then
              code="$(curl -sS -m 10 --cacert "${CACERT}" -H "Authorization: Bearer ${K8S_TOKEN}" \
                -H "Content-Type: application/json" -o /dev/null -w '%{http_code}' \
                -X PUT "${K8S_API}/api/v1/namespaces/${MIRROR_NAMESPACE}/secrets/${MIRROR_NAME}" \
                -d @/tmp/mirror.json)" || code=000
            fi
            rm -f /tmp/mirror.json
            if [ "${code}" != "200" ] && [ "${code}" != "201" ]; then
              log "mirror ${MIRROR_NAMESPACE}/${MIRROR_NAME} not written (HTTP ${code}); the Job retries"
              exit 1
            fi
            log "mirror ${MIRROR_NAMESPACE}/${MIRROR_NAME} written (HTTP ${code})"
          else
            log "mirror disabled; skipping"
          fi

          # 6. DKIM public key into the dns-records ConfigMap (best effort).
          DKIM_PUBLIC_KEY="$(curl -fsS -m 10 -u "admin:${ADMIN_PASSWORD}" \
            "${STALWART_URL}/api/settings/group?prefix=signature.dkim" 2>/dev/null \
            | grep -oE '"public-key":"[^"]*"' | head -1 \
            | sed -E 's/"public-key":"([^"]*)"/\1/' || true)"
          if [ -n "${DKIM_PUBLIC_KEY:-}" ]; then
            printf '{"metadata":{"annotations":{"catalyst.openova.io/dkim-public-key":"%s"}}}' "${DKIM_PUBLIC_KEY}" > /tmp/dkim.json
            curl -fsS -m 10 --cacert "${CACERT}" -H "Authorization: Bearer ${K8S_TOKEN}" \
              -H "Content-Type: application/merge-patch+json" -X PATCH \
              "${K8S_API}/api/v1/namespaces/${RELEASE_NAMESPACE}/configmaps/${DNS_RECORDS_CONFIGMAP}" \
              -d @/tmp/dkim.json >/dev/null 2>&1 || log "DKIM write-back answered non-2xx (continuing)"
            rm -f /tmp/dkim.json
          else
            log "DKIM public key not available yet (continuing)"
          fi

          log "done"
{{- end -}}
{{- if and (include "bp-stalwart-sovereign.active" .) .Values.setupJob.enabled }}
{{- $pod := include "bp-stalwart-sovereign.setupPodTemplate" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-setup-%s" (include "bp-stalwart-sovereign.fullname" .) ($pod | sha256sum | trunc 10) }}
  labels:
    {{- include "bp-stalwart-sovereign.labels" . | nindent 4 }}
spec:
  activeDeadlineSeconds: {{ .Values.setupJob.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.setupJob.backoffLimit }}
  template:
    {{- $pod | nindent 4 }}
{{- end }}
