{{- /*
Setup Job of the Sovereign's own mail server. It is an ordinary object of the
release, not a Helm hook. Helm always waits for a hook; it waits for an
ordinary Job only when the release is told to wait for Jobs. A HelmRelease
that installs this chart therefore sets install.disableWait and
upgrade.disableWait to true, and then the release (and the bootstrap kit that
holds it) is never held by mail. The Job runs in the background and is
bounded by activeDeadlineSeconds and backoffLimit (setupJob in values.yaml).

The Job name ends in the first 10 hex characters of the SHA-256 of its pod
template. A Job's pod template cannot be changed in place, so a changed
template gives a new name: Helm creates the new Job and deletes the old one.
An unchanged template keeps the name, and an upgrade leaves the Job as it is.

Every step can run again with the same result:

  1. Wait for the admin API, at most 60 tries with a 2 s time limit each.
     The chart's NetworkPolicy (templates/networkpolicy.yaml) selects this
     pod too, and allows it to reach port 8080 of the chart's own pods.
  2. Make the submission principal match the in-namespace submission Secret:
     create it when it does not exist, otherwise set its secret to the
     Secret's password. Then read it back; anything but HTTP 200 fails the
     run.
  3. Allow the principal to send as the sender address.
  4. Write catalyst-system/sovereign-smtp-credentials (the mirror) from the
     submission Secret: create it when it does not exist, otherwise replace
     it (PUT), so that it holds exactly what this chart writes and no label,
     annotation or key of an earlier writer stays. The mirror is written only
     after step 2 succeeded, so a reader never gets a credential the server
     does not know. It carries the key shape of every reader (smtp-*,
     user/password, SMTP_*) and the reflector annotations that copy it into
     the namespaces of sovereignSMTPCredentialsMirror.reflectionNamespaces.
  5. Write the DKIM public key into the dns-records ConfigMap. Best effort:
     it never fails the run.

A failure in steps 1, 2 or 4 exits 1; the Job is retried until it succeeds or
its deadline passes. No password is ever printed: credentials are read from
env and written to files under /tmp that only this container reads.
*/}}
{{- define "bp-stalwart-sovereign.setupPodTemplate" -}}
{{- $fqdn := include "bp-stalwart-sovereign.sovereignFQDN" . -}}
{{- $cfg := .Values.sovereignSMTPCredentialsMirror | default dict -}}
{{- $cfgEnabled := dig "enabled" true $cfg -}}
{{- $mirrorNs := default "catalyst-system" $cfg.namespace -}}
{{- $mirrorName := default "sovereign-smtp-credentials" $cfg.secretName -}}
{{- $reflectNs := default "chargeback" $cfg.reflectionNamespaces -}}
{{- $mailHost := include "bp-stalwart-sovereign.mailFQDN" . -}}
{{- $sender := include "bp-stalwart-sovereign.senderAddress" . -}}
metadata:
  labels:
    {{- include "bp-stalwart-sovereign.selectorLabels" . | nindent 4 }}
    catalyst.openova.io/job: stalwart-sovereign-setup
spec:
  restartPolicy: OnFailure
  serviceAccountName: {{ include "bp-stalwart-sovereign.serviceAccountName" . }}
  {{- with .Values.stalwart.image.pullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: setup
      image: {{ include "bp-stalwart-sovereign.setupJobImage" . | quote }}
      imagePullPolicy: {{ .Values.setupJob.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop: ["ALL"]
      env:
        - name: STALWART_URL
          value: "http://{{ include "bp-stalwart-sovereign.fullname" . }}-http.{{ .Release.Namespace }}.svc.cluster.local:8080"
        - name: SOVEREIGN_FQDN
          value: {{ $fqdn | default "" | quote }}
        - name: MAIL_HOST
          value: {{ $mailHost | default "" | quote }}
        - name: SENDER_ADDRESS
          value: {{ $sender | default "" | quote }}
        - name: SUBMISSION_USER
          value: {{ .Values.smtp.submissionUser | quote }}
        - name: RELEASE_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: DNS_RECORDS_CONFIGMAP
          value: {{ include "bp-stalwart-sovereign.dnsRecordsConfigMapName" . | quote }}
        - name: MIRROR_NAMESPACE
          value: {{ $mirrorNs | quote }}
        - name: MIRROR_SECRET_NAME
          value: {{ $mirrorName | quote }}
        - name: MIRROR_ENABLED
          value: {{ ternary "true" "false" $cfgEnabled | quote }}
        - name: REFLECTION_NAMESPACES
          value: {{ $reflectNs | quote }}
        {{- include "bp-stalwart-sovereign.adminPasswordEnv" . | nindent 8 }}
        {{- include "bp-stalwart-sovereign.submissionPasswordEnv" . | nindent 8 }}
      command:
        - /bin/sh
        - -ec
        - |
          set -eu
          log() { echo "[stalwart-sovereign-setup] $*"; }
          trap 'rm -f /tmp/principal.json /tmp/mirror.json /tmp/dkim.json' EXIT

          if [ -z "${SOVEREIGN_FQDN:-}" ]; then
            log "sovereignFQDN unset; nothing to set up"
            exit 0
          fi

          # 1. Wait for the admin API: at most 60 tries.
          log "waiting for ${STALWART_URL}/api"
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS -m 2 -u "admin:${ADMIN_PASSWORD}" "${STALWART_URL}/api/health" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "${ready}" != "1" ]; then
            log "admin API did not answer; the Job retries"
            exit 1
          fi

          # 2. The submission principal matches the submission Secret.
          code="$(curl -sS -m 10 -o /dev/null -w '%{http_code}' -u "admin:${ADMIN_PASSWORD}" \
            "${STALWART_URL}/api/principal/${SUBMISSION_USER}")" || code=000
          if [ "${code}" = "404" ]; then
            log "create principal ${SUBMISSION_USER}"
            printf '{"name":"%s","description":"Sovereign Console submission principal","secrets":["%s"],"emails":["%s"],"roles":["user"]}' \
              "${SUBMISSION_USER}" "${SUBMISSION_PASSWORD}" "${SENDER_ADDRESS}" > /tmp/principal.json
            curl -fsS -m 10 -u "admin:${ADMIN_PASSWORD}" -H "Content-Type: application/json" \
              -X POST "${STALWART_URL}/api/principal" -d @/tmp/principal.json >/dev/null || {
              log "principal ${SUBMISSION_USER} not created; the Job retries"
              exit 1
            }
          elif [ "${code}" = "200" ]; then
            log "set the secret of principal ${SUBMISSION_USER}"
            printf '[{"action":"set","field":"secrets","value":["%s"]}]' "${SUBMISSION_PASSWORD}" > /tmp/principal.json
            curl -fsS -m 10 -u "admin:${ADMIN_PASSWORD}" -H "Content-Type: application/json" \
              -X PATCH "${STALWART_URL}/api/principal/${SUBMISSION_USER}" -d @/tmp/principal.json >/dev/null || {
              log "secret of principal ${SUBMISSION_USER} not set; the Job retries"
              exit 1
            }
          else
            log "principal read answered HTTP ${code}; the Job retries"
            exit 1
          fi
          rm -f /tmp/principal.json
          code="$(curl -sS -m 10 -o /dev/null -w '%{http_code}' -u "admin:${ADMIN_PASSWORD}" \
            "${STALWART_URL}/api/principal/${SUBMISSION_USER}")" || code=000
          if [ "${code}" != "200" ]; then
            log "principal ${SUBMISSION_USER} not confirmed (HTTP ${code}); the Job retries"
            exit 1
          fi
          log "principal ${SUBMISSION_USER} confirmed"

          # 3. Allow send-as for the sender address.
          curl -fsS -m 10 -u "admin:${ADMIN_PASSWORD}" -H "Content-Type: application/json" \
            -X POST "${STALWART_URL}/api/settings" \
            -d "[{\"key\":\"lookup.sender-allow.${SUBMISSION_USER}|${SENDER_ADDRESS}\",\"value\":\"true\",\"assert_empty\":false}]" \
            >/dev/null || log "sender-allow write answered non-2xx (continuing)"

          K8S_API="https://kubernetes.default.svc"
          K8S_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

          # 4. The mirror Secret, written only after step 2.
          if [ "${MIRROR_ENABLED}" = "true" ]; then
            B64_HOST="$(printf '%s' "${MAIL_HOST}" | base64 -w0)"
            B64_PORT="$(printf '%s' '587' | base64 -w0)"
            B64_FROM="$(printf '%s' "${SENDER_ADDRESS}" | base64 -w0)"
            B64_USER="$(printf '%s' "${SUBMISSION_USER}" | base64 -w0)"
            B64_PASS="$(printf '%s' "${SUBMISSION_PASSWORD}" | base64 -w0)"
            cat > /tmp/mirror.json <<MIRROR_JSON
          {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {
              "name": "${MIRROR_SECRET_NAME}",
              "namespace": "${MIRROR_NAMESPACE}",
              "labels": {
                "app.kubernetes.io/name": "bp-stalwart-sovereign",
                "catalyst.openova.io/component": "sovereign-smtp-credentials-mirror"
              },
              "annotations": {
                "reflector.v1.k8s.emberstack.com/reflection-allowed": "true",
                "reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces": "${REFLECTION_NAMESPACES}",
                "reflector.v1.k8s.emberstack.com/reflection-auto-enabled": "true",
                "reflector.v1.k8s.emberstack.com/reflection-auto-namespaces": "${REFLECTION_NAMESPACES}"
              }
            },
            "type": "Opaque",
            "data": {
              "smtp-host": "${B64_HOST}",
              "smtp-port": "${B64_PORT}",
              "smtp-from": "${B64_FROM}",
              "smtp-user": "${B64_USER}",
              "smtp-pass": "${B64_PASS}",
              "user": "${B64_USER}",
              "password": "${B64_PASS}",
              "SMTP_HOST": "${B64_HOST}",
              "SMTP_PORT": "${B64_PORT}",
              "SMTP_FROM": "${B64_FROM}",
              "SMTP_USER": "${B64_USER}",
              "SMTP_PASS": "${B64_PASS}"
            }
          }
          MIRROR_JSON
            code="$(curl -sS -m 10 --cacert "${CACERT}" -H "Authorization: Bearer ${K8S_TOKEN}" \
              -o /dev/null -w '%{http_code}' \
              "${K8S_API}/api/v1/namespaces/${MIRROR_NAMESPACE}/secrets/${MIRROR_SECRET_NAME}")" || code=000
            if [ "${code}" = "404" ]; then
              code="$(curl -sS -m 10 --cacert "${CACERT}" -H "Authorization: Bearer ${K8S_TOKEN}" \
                -H "Content-Type: application/json" -o /dev/null -w '%{http_code}' \
                -X POST "${K8S_API}/api/v1/namespaces/${MIRROR_NAMESPACE}/secrets" \
                -d @/tmp/mirror.json)" || code=000
            elif [ "${code}" = "200" ]; then
              code="$(curl -sS -m 10 --cacert "${CACERT}" -H "Authorization: Bearer ${K8S_TOKEN}" \
                -H "Content-Type: application/json" -o /dev/null -w '%{http_code}' \
                -X PUT "${K8S_API}/api/v1/namespaces/${MIRROR_NAMESPACE}/secrets/${MIRROR_SECRET_NAME}" \
                -d @/tmp/mirror.json)" || code=000
            fi
            rm -f /tmp/mirror.json
            if [ "${code}" != "200" ] && [ "${code}" != "201" ]; then
              log "mirror ${MIRROR_NAMESPACE}/${MIRROR_SECRET_NAME} not written (HTTP ${code}); the Job retries"
              exit 1
            fi
            log "mirror ${MIRROR_NAMESPACE}/${MIRROR_SECRET_NAME} written (HTTP ${code})"
          else
            log "mirror disabled; skipping"
          fi

          # 5. DKIM public key into the dns-records ConfigMap (best effort).
          DKIM_PUBLIC_KEY="$(curl -fsS -m 10 -u "admin:${ADMIN_PASSWORD}" \
            "${STALWART_URL}/api/settings/group?prefix=signature.dkim" 2>/dev/null \
            | grep -oE '"public-key":"[^"]*"' | head -1 \
            | sed -E 's/"public-key":"([^"]*)"/\1/' || true)"
          if [ -n "${DKIM_PUBLIC_KEY:-}" ]; then
            printf '{"metadata":{"annotations":{"catalyst.openova.io/dkim-public-key":"%s"}}}' "${DKIM_PUBLIC_KEY}" > /tmp/dkim.json
            curl -fsS -m 10 --cacert "${CACERT}" -H "Authorization: Bearer ${K8S_TOKEN}" \
              -H "Content-Type: application/merge-patch+json" -X PATCH \
              "${K8S_API}/api/v1/namespaces/${RELEASE_NAMESPACE}/configmaps/${DNS_RECORDS_CONFIGMAP}" \
              -d @/tmp/dkim.json >/dev/null 2>&1 || log "DKIM write-back answered non-2xx (continuing)"
            rm -f /tmp/dkim.json
          else
            log "DKIM public key not available yet (continuing)"
          fi

          log "done"
{{- end -}}
{{- if and .Values.stalwart.enabled .Values.setupJob.enabled }}
{{- $pod := include "bp-stalwart-sovereign.setupPodTemplate" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-setup-%s" (include "bp-stalwart-sovereign.fullname" .) ($pod | sha256sum | trunc 10) }}
  labels:
    {{- include "bp-stalwart-sovereign.labels" . | nindent 4 }}
spec:
  activeDeadlineSeconds: {{ .Values.setupJob.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.setupJob.backoffLimit }}
  template:
    {{- $pod | nindent 4 }}
{{- end }}
