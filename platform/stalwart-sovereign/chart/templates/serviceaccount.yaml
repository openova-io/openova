{{- if and .Values.serviceAccount.create (include "bp-stalwart-sovereign.active" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bp-stalwart-sovereign.serviceAccountName" . }}
  labels:
    {{- include "bp-stalwart-sovereign.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
