{{- /*
One upload-state secret and one CSRF key for the Sovereign.

The registry signs the state of a chunked blob upload (the `_state` of each
Location it answers) with REGISTRY_HTTP_SECRET; the core signs its CSRF cookie
with CSRF_KEY. The upstream chart generates both per cluster, so each region of
a two-region Sovereign held its own, while the registry's public name sends the
requests of one client to both regions: an upload begun in one region and
continued in the other is refused (BLOB_UPLOAD_INVALID), and a write whose CSRF
token one region issued is refused by the other (403).

Both values live in the Secret that `harbor.registry.existingSecret` and
`harbor.core.existingXsrfSecret` name (they must name the same one):

  - The primary region (and a single-region Sovereign) writes it once and
    keeps it: an existing Secret is read back, and the first render takes
    over the values the upstream Secrets hold, so an upgrade changes no byte.
  - A follower (`crossRegion.role: secondary`) writes none. The parent's
    cross-region orchestrator copies the primary's Secret to it
    (products/catalyst/bootstrap/api/internal/crossregion, CopiedSecrets), as
    it copies harbor-token-key. Its registry and core do not start before
    the copy, so they never run with a value of their own.
*/ -}}
{{- $h := .Values.harbor | default dict -}}
{{- $name := dig "registry" "existingSecret" "" $h -}}
{{- $role := dig "role" "primary" (.Values.crossRegion | default dict) -}}
{{- if ne $name (dig "core" "existingXsrfSecret" "" $h) }}
{{- fail "harbor.registry.existingSecret and harbor.core.existingXsrfSecret must name the same Secret" }}
{{- end }}
{{- if and $name (ne $role "secondary") }}
{{- $full := include "bp-harbor.upstreamFullname" . -}}
{{- $own := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $reg := (lookup "v1" "Secret" .Release.Namespace (printf "%s-registry" $full)).data | default dict -}}
{{- $core := (lookup "v1" "Secret" .Release.Namespace (printf "%s-core" $full)).data | default dict -}}
{{- $rk := dig "registry" "existingSecretKey" "REGISTRY_HTTP_SECRET" $h -}}
{{- $ck := dig "core" "existingXsrfSecretKey" "CSRF_KEY" $h -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-harbor.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $rk }}: {{ index $own $rk | default $reg.REGISTRY_HTTP_SECRET | default (randAlphaNum 16 | b64enc) | quote }}
  {{ $ck }}: {{ index $own $ck | default $core.CSRF_KEY | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
