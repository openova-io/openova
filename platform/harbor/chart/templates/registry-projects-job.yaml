{{- /*
SOV-160: the registry projects of this Sovereign, created at install. The Job
makes sure each project exists in this region's Harbor as a hosted project (no
registry_id). An existing project is left as it is; the Job fails, after every
project, when one is a pull-through project. Projects (values registryProjects,
filled by bootstrap-kit slot 19 from contract C5): public = each distinct path
of REGISTRY_PROXY_PROJECTS_JSON; private = the first path segment of the five
REGISTRY_PATH_* keys of paths. The REGISTRY_PATH_XPKG project is left out while
createXpkgProject is false: the cutover's prewarm still pulls through it.
SOV-336: one project is pull-through by design, the project of the
vulnerability database (the first path segment of REGISTRY_PATH_VULN_DB,
value vulnDBPath). The Job makes sure the registry endpoint
<project>-origin (type docker-registry, anonymous) points at
ORIGIN_REGISTRY_SCHEME://ORIGIN_REGISTRY_HOST (values origin), then makes
sure the project exists, public, with that endpoint as its registry_id. It is
left out of the hosted-project rule. An existing endpoint with another URL or
an existing project with another registry_id fails the Job. With an empty
origin host (a Sovereign fed by offline bundles) the Job makes no endpoint and
no such project.
A plain Job, not a hook: slot 19 installs with disableWait. The name hash
re-runs it when an input or the chart version changes.
*/ -}}
{{- if .Values.registryProjects.enabled }}
{{- $rp := .Values.registryProjects }}
{{- $map := $rp.defaultProxyProjects }}
{{- if kindIs "map" $rp.proxyProjectsJSON }}
{{- $map = $rp.proxyProjectsJSON }}
{{- else if $rp.proxyProjectsJSON }}
{{- $map = fromJson $rp.proxyProjectsJSON }}
{{- if hasKey $map "Error" }}
{{- fail "registryProjects.proxyProjectsJSON is not a JSON object" }}
{{- end }}
{{- end }}
{{- $xpkg := first (splitList "/" (toString ($rp.xpkgPath | default ""))) }}
{{- $public := list }}
{{- range $name, $path := $map }}
{{- $p := first (splitList "/" (toString ($path | default ""))) }}
{{- if and $p (or $rp.createXpkgProject (ne $p $xpkg)) }}
{{- $public = append $public $p }}
{{- end }}
{{- end }}
{{- $public = $public | uniq | sortAlpha }}
{{- $private := list }}
{{- range $key := list "charts" "release" "providerPacks" "tofuProviders" "nodeArtifacts" }}
{{- $p := first (splitList "/" (toString ((index $rp.paths $key) | default ""))) }}
{{- if and $p (not (has $p $public)) }}
{{- $private = append $private $p }}
{{- end }}
{{- end }}
{{- $private = $private | uniq | sortAlpha }}
{{- $origin := $rp.origin | default dict }}
{{- $originHost := toString ($origin.host | default "") }}
{{- $originScheme := toString ($origin.scheme | default "https") }}
{{- if not (has $originScheme (list "https" "http")) }}
{{- fail "registryProjects.origin.scheme must be https or http" }}
{{- end }}
{{- $vulndb := "" }}
{{- $originURL := "" }}
{{- if $originHost }}
{{- $vulndb = first (splitList "/" (toString ($rp.vulnDBPath | default ""))) }}
{{- end }}
{{- if $vulndb }}
{{- $originURL = printf "%s://%s" $originScheme $originHost }}
{{- if or (has $vulndb $public) (has $vulndb $private) }}
{{- fail (printf "registryProjects.vulnDBPath: the project %s is also a hosted project" $vulndb) }}
{{- end }}
{{- end }}
{{- $hash := printf "%s|%s|%s|%s|%s|%s" (join " " $public) (join " " $private) $vulndb $originURL $rp.image .Chart.Version | sha256sum | trunc 8 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-registry-projects-{{ $hash }}
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-harbor
    catalyst.openova.io/component: registry-projects
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        catalyst.openova.io/blueprint: bp-harbor
        catalyst.openova.io/component: registry-projects
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ensure
          image: {{ $rp.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: HARBOR_CORE_URL
              value: "http://{{ .Release.Name }}-core.{{ .Release.Namespace }}.svc.cluster.local"
            - name: PUBLIC_PROJECTS
              value: {{ join " " $public | quote }}
            - name: PRIVATE_PROJECTS
              value: {{ join " " $private | quote }}
            - name: VULNDB_PROJECT
              value: {{ $vulndb | quote }}
            - name: VULNDB_ORIGIN_URL
              value: {{ $originURL | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              api="${HARBOR_CORE_URL}/api/v2.0"
              pw="$(cat /etc/harbor-admin/HARBOR_ADMIN_PASSWORD)"
              up=""
              for i in $(seq 1 90); do
                if curl -fsS -o /dev/null --max-time 5 "${api}/ping"; then up=yes; break; fi
                echo "[registry-projects] waiting for harbor-core (${i}/90)"
                sleep 10
              done
              if [ -z "${up}" ]; then
                echo "[registry-projects] FATAL: harbor-core did not answer" >&2
                exit 1
              fi
              bad=""
              ensure() {
                body=$(printf '{"project_name":"%s","public":%s,"metadata":{"public":"%s"}}' "$1" "$2" "$2")
                code=$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 30 -u "admin:${pw}" \
                  -H 'Content-Type: application/json' -X POST "${api}/projects" --data "${body}") || code=000
                case "${code}" in
                  201) echo "[registry-projects] $1 created (public=$2)" ;;
                  409) echo "[registry-projects] $1 exists" ;;
                  *) echo "[registry-projects] FATAL: creating $1 answered ${code}" >&2; cat /tmp/out >&2; exit 1 ;;
                esac
                code=$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 30 -u "admin:${pw}" \
                  "${api}/projects/$1") || code=000
                if [ "${code}" != 200 ]; then
                  echo "[registry-projects] FATAL: reading $1 answered ${code}" >&2
                  exit 1
                fi
                if grep -q '"registry_id":[1-9]' /tmp/out; then
                  echo "[registry-projects] $1 is a pull-through project (it has a registry_id)" >&2
                  bad="${bad} $1"
                fi
              }
              for p in ${PUBLIC_PROJECTS}; do ensure "${p}" true; done
              for p in ${PRIVATE_PROJECTS}; do ensure "${p}" false; done
              if [ -n "${VULNDB_PROJECT}" ]; then
                reg="${VULNDB_PROJECT}-origin"
                body=$(printf '{"name":"%s","type":"docker-registry","url":"%s","insecure":false}' "${reg}" "${VULNDB_ORIGIN_URL}")
                code=$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 30 -u "admin:${pw}" \
                  -H 'Content-Type: application/json' -X POST "${api}/registries" --data "${body}") || code=000
                case "${code}" in
                  201) echo "[registry-projects] endpoint ${reg} created (${VULNDB_ORIGIN_URL})" ;;
                  409) echo "[registry-projects] endpoint ${reg} exists" ;;
                  *) echo "[registry-projects] FATAL: creating endpoint ${reg} answered ${code}" >&2; cat /tmp/out >&2; exit 1 ;;
                esac
                code=$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 30 -u "admin:${pw}" \
                  "${api}/registries?q=name%3D${reg}") || code=000
                if [ "${code}" != 200 ]; then
                  echo "[registry-projects] FATAL: reading endpoint ${reg} answered ${code}" >&2
                  exit 1
                fi
                id=$(tr ',' '\n' < /tmp/out | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
                if [ -z "${id}" ]; then
                  echo "[registry-projects] FATAL: endpoint ${reg} has no id" >&2
                  exit 1
                fi
                if ! grep -q -F "\"url\":\"${VULNDB_ORIGIN_URL}\"" /tmp/out; then
                  echo "[registry-projects] endpoint ${reg} does not point at ${VULNDB_ORIGIN_URL}" >&2
                  bad="${bad} ${reg}"
                else
                  body=$(printf '{"project_name":"%s","public":true,"registry_id":%s,"metadata":{"public":"true"}}' "${VULNDB_PROJECT}" "${id}")
                  code=$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 30 -u "admin:${pw}" \
                    -H 'Content-Type: application/json' -X POST "${api}/projects" --data "${body}") || code=000
                  case "${code}" in
                    201) echo "[registry-projects] ${VULNDB_PROJECT} created (pull-through ${reg})" ;;
                    409) echo "[registry-projects] ${VULNDB_PROJECT} exists" ;;
                    *) echo "[registry-projects] FATAL: creating ${VULNDB_PROJECT} answered ${code}" >&2; cat /tmp/out >&2; exit 1 ;;
                  esac
                  code=$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 30 -u "admin:${pw}" \
                    "${api}/projects/${VULNDB_PROJECT}") || code=000
                  if [ "${code}" != 200 ]; then
                    echo "[registry-projects] FATAL: reading ${VULNDB_PROJECT} answered ${code}" >&2
                    exit 1
                  fi
                  if ! grep -q -E "\"registry_id\":${id}([^0-9]|\$)" /tmp/out; then
                    echo "[registry-projects] ${VULNDB_PROJECT} is not a pull-through project of ${reg}" >&2
                    bad="${bad} ${VULNDB_PROJECT}"
                  fi
                fi
              fi
              if [ -n "${bad}" ]; then
                echo "[registry-projects] FATAL: projects or endpoints not as declared:${bad}" >&2
                exit 1
              fi
              echo "[registry-projects] every project exists as declared"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: harbor-admin
              mountPath: /etc/harbor-admin
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: harbor-admin
          secret:
            secretName: {{ .Values.harborAdmin.secretName | default "harbor-admin" }}
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
