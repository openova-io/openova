{{- /*
Catalyst HTTPRoute for Harbor — bp-harbor (issue #387, Cilium Gateway
API migration). Replaces the upstream chart's networking.k8s.io/v1.Ingress
on Sovereigns; the upstream `harbor.expose.type` is set to `clusterIP` (or
`expose.ingress.enabled=false` equivalent) in per-Sovereign overlays so this
HTTPRoute is the sole HTTP exposure.

Backend reference: the upstream goharbor/harbor chart's core Service is
named per its `harbor.fullname` helper — when `.Release.Name` already
contains the chart name `harbor` (as with releaseName=harbor), the
helper returns just `.Release.Name`, so the Service ends up as
`harbor-core`. Only when the release name does NOT contain `harbor`
does the Service get the double-prefixed `<release>-harbor-core` form.
We replicate that logic so the default backend always matches the live
Service. Operators can override via `gateway.backendService`.

Path coverage: Harbor needs both UI (`/`) and registry-v2 API (`/v2/`)
served on the same hostname; both go to harbor-core, so a single rule
matching `/` is sufficient. Sub-path-specific rules can be added by an
operator overlay if isolating /api/v2.0 separately is required.
*/}}
{{- if and .Values.gateway .Values.gateway.enabled -}}
{{- if .Values.gateway.host }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.gateway.name | default "harbor" | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-harbor.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentRef.name | default "cilium-gateway" | quote }}
      namespace: {{ .Values.gateway.parentRef.namespace | default "kube-system" | quote }}
      {{- with .Values.gateway.parentRef.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
{{- /*
#4913 (hw233 live walk): Harbor's UI + registry-v2 API + SSO are ALL served on
ONE host — registry.<fqdn> (gateway.host; also harbor.externalURL and the OIDC
redirect_uri). The app-named harbor.<fqdn> deliberately had NO HTTPRoute, so an
operator/tool reaching for the intuitive harbor.<fqdn> hit a bare-envoy 404: the
Sovereign wildcard DNS *.<fqdn> resolves it to the gateway VIP, but no route
hostname matched (the exact hw233 symptom; NOT a missing UI route — the UI route
lives on registry.<fqdn>). The wildcard listener (*.${SOVEREIGN_FQDN}:443,
clusters/_template/bootstrap-kit/01-cilium.yaml) + wildcard TLS already cover
harbor.<fqdn>, so listing it as a SECOND hostname on the SAME route serves the UI
there too — no DNS/cert change needed. gateway.host stays canonical: the
sign-in→/c/oidc/login redirect below and Harbor's externalURL keep auth +
self-links on registry.<fqdn>, so an entry via harbor.<fqdn> lands on the
canonical host after login (no redirect loop). Disable via
gateway.aliasHarborHost=false; add arbitrary aliases via gateway.extraHosts.
*/}}
{{- /* #5015: harbor.<fqdn> is NO LONGER co-served on this route. Co-serving
   started the OIDC flow on the alias origin (state/nonce cookie set on
   harbor.<fqdn>) but Harbor's redirect_uri/externalURL is registry.<fqdn>, so
   the callback landed cross-host with no state cookie → HTTP 400 (hw242 live).
   When gateway.aliasHarborHost is true, a SEPARATE redirect-only HTTPRoute
   below 301s harbor.<fqdn>/* → registry.<fqdn>/* so the ENTIRE flow is
   single-origin — keeping #4913's no-bare-404 discoverability. */}}
{{- range $h := .Values.gateway.extraHosts }}
{{- if and $h (ne $h $.Values.gateway.host) }}
    - {{ $h | quote }}
{{- end }}
{{- end }}
  rules:
{{- if and .Values.sso .Values.sso.enabled .Values.sso.bareURL .Values.sso.bareURL.enabled }}
{{- $oidcLoginPath := .Values.sso.bareURL.oidcLoginPath | default "/c/oidc/login" }}
{{- /*
ROOT-URL zero-click SSO (founder mandate 2026-06-12; #3374 class).
PROVEN GREEN on the live wire — hw167 2026-06-19, deployment
28d4e96f96407bbb: the sso-zero-click-probe.mjs `harbor` row landed on
https://registry.<fqdn>/harbor/projects signed-in (Projects text, no
login_username marker).

WHY: with auth_mode=oidc_auth Harbor's portal is a client-side Angular
SPA. Typing the bare registry URL loads index.html; the SPA detects no
session and does a FULL-PAGE navigation to /account/sign-in?redirect_url=…
(gateway-visible — NOT a pure client-side route) and renders a sign-in
page with a "LOGIN VIA OIDC PROVIDER" button. Harbor has NO native
auto-redirect knob, so absent this route the operator must CLICK that
button and the probe lands on the sign-in page (input[name=login_username]
present) = RED.

THE FIX (the gitea httproute idiom): the gateway 302s Harbor's sign-in
page path into Harbor's server-side OIDC login initiation endpoint
`/c/oidc/login`, which 302s straight to Keycloak (carrying the
kc_idp_hint=catalyst-pin from oidc_extra_redirect_parms) → silent broker
→ /c/oidc/callback → Harbor sets the session cookie → /harbor/projects.
Top-level redirect flow (NOT popup-based like openbao), so no landing-page
shim is needed.

Loop-safety — redirect ONLY Exact `/account/sign-in`:
  - The bare `/` is deliberately NOT intercepted. Harbor's OIDC callback,
    on success, 302s the browser to `/` (its default post-login landing),
    where the SPA then routes internally to /harbor/projects. Intercepting
    `/` re-fed that post-login `/` back into /c/oidc/login → infinite
    bounce (measured live: net::ERR_TOO_MANY_REDIRECTS). Only the
    unauthenticated sign-in PAGE path is redirected; an authenticated
    session never visits /account/sign-in again.
  - /c/oidc/login, /c/oidc/callback, /harbor/*, /api/*, /v2/*,
    /service/token all fall through to the PathPrefix `/` backend →
    straight to harbor-core. Docker/OCI clients (/v2/ + /service/token,
    Basic/Bearer auth) never hit /account/sign-in — registry pull/push is
    untouched (verified live: /v2/ → 401 auth-challenge, not redirected).

Port is explicit 443 — Gateway API otherwise copies the cilium LISTENER
port (e.g. 30443) into Location, which nothing serves externally (the
#3310 pdns lesson, re-confirmed on the hw167 wire check).
*/}}
{{- $signInPath := .Values.sso.bareURL.signInPath | default "/account/sign-in" }}
    - matches:
        - path:
            type: Exact
            value: {{ $signInPath | quote }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ $.Values.gateway.host | quote }}
            port: 443
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ $oidcLoginPath | quote }}
            statusCode: 302
{{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.path | default "/" | quote }}
      backendRefs:
        - name: {{ .Values.gateway.backendService | default (printf "%s-core" (ternary .Release.Name (printf "%s-harbor" .Release.Name) (contains "harbor" .Release.Name))) | quote }}
          port: {{ .Values.gateway.backendPort | default 80 }}
{{- end }}
---
{{- /* #5015 — dedicated redirect-only HTTPRoute: harbor.<fqdn> → 301 →
   registry.<fqdn>, path preserved. Fires BEFORE any OIDC flow starts, so the
   whole auth flow is single-origin on the canonical host (no cross-host state
   cookie 400). Only when aliasHarborHost=true AND gateway.host is a registry.*
   host (so the harbor.* alias is derivable). Set aliasHarborHost=false to serve
   ONLY gateway.host with no alias at all. */}}
{{- if and .Values.gateway.host .Values.gateway.aliasHarborHost (hasPrefix "registry." .Values.gateway.host) }}
{{- $aliasHost := printf "harbor.%s" (trimPrefix "registry." .Values.gateway.host) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bp-harbor.fullname" . }}-alias-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-harbor.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | default "cilium-gateway" }}
      namespace: {{ .Values.gateway.namespace | default "kube-system" }}
      sectionName: {{ .Values.gateway.sectionName | default "https" | quote }}
  hostnames:
    - {{ $aliasHost | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ .Values.gateway.host | quote }}
            port: 443
            statusCode: 301
{{- end }}
{{- end }}
