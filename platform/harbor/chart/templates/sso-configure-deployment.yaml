{{- /*
G91.harbor (#2654) — Continuous Harbor OIDC config reconciler.

WHY A DEPLOYMENT, NOT A ONE-SHOT HELM HOOK (root-caused live hw167
2026-06-19):
  bp-harbor installs at bootstrap-kit slot 19; the
  harbor-sso-oidc-credentials Secret is rendered by
  templates/sso-oauth-source-externalsecret.yaml only AFTER bp-sso-bridge
  reconciles the OpenBao `secret/sso/harbor` bundle — which does not run
  until well after harbor-core is Ready. The former post-install +
  post-upgrade Helm hook Job therefore fired at install time (~1h before
  the OIDC creds Secret existed on hw167), could NOT resolve its
  client_id/client_secret secretKeyRefs, and so Harbor stayed at
  auth_mode=db_auth. The post-UPGRADE hook never re-fired because the
  chart was not upgraded again — so the registry landed every operator on
  the local-DB sign-in page forever (zero-click probe RED:
  input[name="login_username"] present, url /account/sign-in).

  Measured live: HR Ready 2026-06-19T00:33:22Z; harbor-sso-oidc-credentials
  created 2026-06-19T01:38:46Z (65 min later). The hook lost the race.

  This mirrors the IDENTICAL root cause + fix in bp-openbao
  (templates/sso-configure-deployment.yaml, #2655): a continuous
  single-replica reconcile loop tolerates the Secret being absent on early
  ticks, applies the OIDC config the instant the creds land, and
  re-converges on any drift (a Harbor DB restore wiping auth_mode back to
  db_auth self-heals on the next tick).

WHAT IT DOES every INTERVAL_SECONDS:
  1. Waits for harbor-core /api/v2.0/ping to answer.
  2. Skips until /etc/sso-creds/{client_id,client_secret} are present.
  3. PUTs /api/v2.0/configurations (partial PUT — only our keys) with
     auth_mode=oidc_auth, primary_auth_mode, oidc_auto_onboard, the
     oidc_endpoint/scope/groups_claim/admin_group/user_claim, and
     oidc_extra_redirect_parms carrying kc_idp_hint=<idpHint> (G117.5
     #2744) so KC's IDR delegates silently to the catalyst-pin broker.

Idempotency: Harbor's PUT replaces the included config block; re-PUTting
the same payload every tick is a no-op once converged.
*/ -}}
{{- if and .Values.sso.enabled .Values.sso.sovereignFqdn }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-harbor
    app.kubernetes.io/name: harbor-sso-configure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-harbor
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - harbor-sso-oidc-credentials
      - {{ .Values.harborAdmin.secretName | default "harbor-admin" }}
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-harbor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-sso-configure
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-sso-configure
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-harbor
data:
  reconcile.sh: |
    #!/bin/sh
    # bp-harbor sso-configure reconcile loop (G91.harbor #2654, hw167 fix).
    set -u

    log() { printf '[%s] %s\n' "$(date -u +%FT%TZ)" "$*"; }

    log "bp-harbor sso-configure starting."
    log "  HARBOR_CORE_URL=${HARBOR_CORE_URL}"
    log "  OIDC_NAME=${OIDC_NAME}"
    log "  OIDC_ENDPOINT=${OIDC_ENDPOINT}"
    log "  OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP}"
    log "  INTERVAL_SECONDS=${INTERVAL_SECONDS}"

    while true; do
      sleep "${INTERVAL_SECONDS}"

      # 1) harbor-core reachable?
      if ! curl -fsS -o /tmp/ping.out "${HARBOR_CORE_URL}/api/v2.0/ping" 2>/dev/null; then
        log "harbor-core /api/v2.0/ping not yet answering; waiting"
        continue
      fi

      # 2) ESO-projected OIDC creds present? (race-tolerant — bp-sso-bridge
      #    may not have materialised harbor-sso-oidc-credentials yet.)
      if [ ! -s /etc/sso-creds/client_id ] || [ ! -s /etc/sso-creds/client_secret ]; then
        log "harbor-sso-oidc-credentials not yet present (client_id/client_secret) — waiting for bp-sso-bridge"
        continue
      fi
      OIDC_CLIENT_ID="$(cat /etc/sso-creds/client_id 2>/dev/null)"
      OIDC_CLIENT_SECRET="$(cat /etc/sso-creds/client_secret 2>/dev/null)"
      if [ -z "${OIDC_CLIENT_ID}" ] || [ -z "${OIDC_CLIENT_SECRET}" ]; then
        log "OIDC creds present but empty — waiting"
        continue
      fi

      # 3) admin password (single-key HARBOR_ADMIN_PASSWORD; username
      #    hardcoded `admin` upstream).
      if [ ! -s /etc/harbor-admin/HARBOR_ADMIN_PASSWORD ]; then
        log "harbor admin password Secret not yet present — waiting"
        continue
      fi
      HARBOR_ADMIN_PASS="$(cat /etc/harbor-admin/HARBOR_ADMIN_PASSWORD 2>/dev/null)"

      # Build the partial config payload. Harbor writes only the included
      # keys. oidc_extra_redirect_parms (note upstream typo) is a
      # JSON-encoded string; double-encode internal quotes for the outer
      # JSON document.
      ESCAPED_EXTRA="$(printf '%s' "${OIDC_EXTRA_REDIRECT_PARMS}" | sed 's/"/\\"/g')"
      cat >/tmp/payload.json <<JSON
    {
      "auth_mode": "oidc_auth",
      "primary_auth_mode": true,
      "oidc_name": "${OIDC_NAME}",
      "oidc_endpoint": "${OIDC_ENDPOINT}",
      "oidc_client_id": "${OIDC_CLIENT_ID}",
      "oidc_client_secret": "${OIDC_CLIENT_SECRET}",
      "oidc_scope": "${OIDC_SCOPE}",
      "oidc_groups_claim": "${OIDC_GROUPS_CLAIM}",
      "oidc_admin_group": "${OIDC_ADMIN_GROUP}",
      "oidc_user_claim": "${OIDC_USER_CLAIM}",
      "oidc_verify_cert": ${OIDC_VERIFY_CERT},
      "oidc_auto_onboard": ${OIDC_AUTO_ONBOARD},
      "oidc_extra_redirect_parms": "${ESCAPED_EXTRA}"
    }
    JSON

      HTTP_CODE="$(curl -sS -o /tmp/resp.out -w '%{http_code}' \
        -X PUT \
        -u "${HARBOR_ADMIN_USER}:${HARBOR_ADMIN_PASS}" \
        -H 'Content-Type: application/json' \
        --data-binary @/tmp/payload.json \
        "${HARBOR_CORE_URL}/api/v2.0/configurations" 2>/dev/null)"

      case "${HTTP_CODE}" in
        2*) log "OIDC config converged (auth_mode=oidc_auth, HTTP ${HTTP_CODE})" ;;
        *)
          log "WARN: PUT /api/v2.0/configurations returned ${HTTP_CODE}; retrying next tick"
          cat /tmp/resp.out 2>/dev/null || true
          ;;
      esac
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-harbor
    catalyst.openova.io/component: sso-configure
    app.kubernetes.io/name: harbor-sso-configure
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-sso-configure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-sso-configure
        catalyst.openova.io/blueprint: bp-harbor
        catalyst.openova.io/component: sso-configure
      annotations:
        # Roll the reconciler whenever the SSO config inputs OR the
        # reconcile.sh script change. The script lives in the ConfigMap, so
        # a script edit does not alter this Pod template — without a
        # revision marker the helm upgrade would leave the OLD pod running
        # the OLD mounted script (the bp-openbao #3374 hw133 trap). Hash the
        # chart version (script-lockstep: a script change always bumps the
        # chart) plus the SSO config knobs.
        checksum/sso-config: {{ printf "%s:%s:%s:%s" (.Values.sso.sovereignFqdn | default "") (.Values.sso.adminGroup | default "") (.Values.sso.idpHint | default "") (.Chart.Version) | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-sso-configure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: {{ .Values.sso.configureReconciler.image | default "harbor.openova.io/proxy-dockerhub/curlimages/curl:8.10.1" | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: ["/bin/sh", "/etc/harbor-sso/reconcile.sh"]
          env:
            - name: HARBOR_CORE_URL
              value: "http://{{ .Release.Name }}-core.{{ .Release.Namespace }}.svc.cluster.local"
            # Harbor's admin username is hardcoded upstream
            # (see templates/admin-secret.yaml docstring).
            - name: HARBOR_ADMIN_USER
              value: "admin"
            - name: OIDC_ENDPOINT
              value: "https://auth.{{ .Values.sso.sovereignFqdn }}/realms/{{ .Values.sso.realm | default "sovereign" }}"
            - name: OIDC_NAME
              value: "openova-sso"
            - name: OIDC_SCOPE
              value: "openid,profile,email,{{ .Values.sso.groupClaimName | default "groups" }}"
            - name: OIDC_GROUPS_CLAIM
              value: {{ .Values.sso.groupClaimName | default "groups" | quote }}
            - name: OIDC_ADMIN_GROUP
              value: {{ .Values.sso.adminGroup | default "sovereign-admins" | quote }}
            - name: OIDC_USER_CLAIM
              value: {{ .Values.sso.userClaim | default "preferred_username" | quote }}
            - name: OIDC_VERIFY_CERT
              value: {{ .Values.sso.verifyCert | default true | quote }}
            - name: OIDC_AUTO_ONBOARD
              value: "true"
            # G117.5 #2744 — kc_idp_hint on every Harbor /c/oidc/login
            # redirect (Harbor injects oidc_extra_redirect_parms as
            # /authorize query params). Empty hint → "{}".
            - name: OIDC_EXTRA_REDIRECT_PARMS
              value: {{ ternary (printf "{\"kc_idp_hint\":\"%s\"}" .Values.sso.idpHint) "{}" (ne (.Values.sso.idpHint | default "") "") | quote }}
            - name: INTERVAL_SECONDS
              value: {{ .Values.sso.configureReconciler.intervalSeconds | default 60 | quote }}
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: script
              mountPath: /etc/harbor-sso
              readOnly: true
            - name: sso-creds
              mountPath: /etc/sso-creds
              readOnly: true
            - name: harbor-admin
              mountPath: /etc/harbor-admin
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-sso-configure
            defaultMode: 0555
        - name: sso-creds
          secret:
            secretName: harbor-sso-oidc-credentials
            optional: true
        - name: harbor-admin
          secret:
            secretName: {{ .Values.harborAdmin.secretName | default "harbor-admin" }}
            optional: true
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
