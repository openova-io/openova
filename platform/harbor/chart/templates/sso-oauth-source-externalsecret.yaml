{{- /*
G91.harbor (#2654) — OAuth source Secret for the SSO bridge.

bp-sso-bridge (G91.1 #2652) writes the canonical OIDC client bundle into
OpenBao at `secret/sso/<clientId>` with keys:
  client_id, client_secret, issuer_url, authorize_url, token_url,
  userinfo_url, end_session_url.

Harbor configures OIDC at the API layer (PUT /api/v2.0/configurations
with `auth_mode=oidc_auth` + oidc_endpoint/oidc_client_id/oidc_client_secret/
oidc_scope/etc.); there is no upstream-chart wiring path for OIDC.

This ExternalSecret materialises the canonical bundle into the
harbor-sso-oidc-credentials Secret in the harbor namespace; the
configure-oauth Job (templates/sso-configure-oauth-job.yaml) consumes
its keys via env vars and calls the Harbor API.
*/ -}}
{{- if .Values.sso.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-sso-oidc-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-harbor
    bp-sso-bridge.openova.io/consumer: bp-harbor
spec:
  refreshInterval: {{ .Values.sso.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.sso.externalSecretStoreName | default "vault-region1" }}
    kind: ClusterSecretStore
  target:
    name: harbor-sso-oidc-credentials
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "harbor" }}
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "harbor" }}
        property: client_secret
    - secretKey: issuer_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "harbor" }}
        property: issuer_url
{{- end }}
