apiVersion: v2
name: bp-harbor
# 1.2.42 (#5022 — updateStrategy: Recreate (global; upstream has no
# per-component knob). harbor-jobservice is a single-replica RWO-backed
# Deployment; RollingUpdate deadlocks forced rolls on Multi-Attach (hw242
# step-08). Upstream guidance: Recreate whenever fs persistence is on.)
description: |
  Catalyst Blueprint umbrella chart for Harbor. Depends on the upstream
  `harbor` chart (goharbor/harbor-helm) as a Helm subchart so
  `helm dependency build` pulls the upstream payload into this artifact.
  Catalyst-curated values flow into the upstream subchart under the
  `harbor:` key in values.yaml.

  Harbor is the per-Sovereign OCI registry (per docs/PLATFORM-TECH-STACK.md
  §3.5 — every host cluster runs its own Harbor instance). It mirrors
  Catalyst Blueprint OCI artefacts and container images so day-2 pulls
  don't depend on ghcr.io.

  Per ADR-0001 §13 (S3-aware app architecture rule) + docs/omantel-
  handover-wbs.md §3 + §3a, S3-aware apps (Harbor is one) write
  DIRECTLY to the cloud-provider's native S3 endpoint — Hetzner Object
  Storage on Hetzner Sovereigns; AWS S3 on AWS Sovereigns; etc.
  SeaweedFS is reserved as a POSIX→S3 buffer for legacy POSIX-only
  writers and is NOT in the minimal Sovereign set.

  Per #383 / #425 the chart is vendor-AGNOSTIC: per-Sovereign overlays
  wire bucket / region / endpoint / credentials via Flux `valuesFrom`
  against the canonical `flux-system/object-storage` Secret. The
  umbrella's templates/objectstorage-credentials.yaml synthesises a
  harbor-namespace Secret with the upstream chart's expected
  REGISTRY_STORAGE_S3_ACCESSKEY / REGISTRY_STORAGE_S3_SECRETKEY keys,
  referenced via `persistence.imageChartStorage.s3.existingSecret`.
  Adding a future AWS / Azure / GCP / OCI Sovereign requires only a
  sibling `infra/<provider>/` Tofu module — this chart Just Works.

  Default render (contabo / dev / no objectStorage overlay) emits NO
  credentials Secret and NO s3 backend wiring; the upstream chart
  falls back to filesystem PVC. Per-Sovereign overlays flip
  `objectStorage.enabled: true` to engage the S3 backend.

  Catalyst-curated defaults route Harbor's metadata DB to CNPG, so
  this Blueprint hard-depends on bp-cnpg + bp-cert-manager. The
  earlier dependency on bp-seaweedfs is REMOVED (cloud-direct S3 path).
type: application
# 1.2.38 (#4343, 2026-06-25): set `nginx.resources.requests` (cpu/memory) so
# the harbor-nginx Deployment satisfies the cluster-wide Kyverno
# `resource-requests` Enforce policy. Post-#4325 this chart installs into the
# native host namespace (not a vCluster) where the policy applies; the upstream
# goharbor subchart only emits nginx resources when `nginx.resources` is set.
# 1.2.16 (Fix #163, 2026-05-11, MIRROR-EVERYTHING): database-secret-sync-job
# hook image switched from curlimages/curl:8.10.1 to
# harbor.openova.io/proxy-dockerhub/curlimages/curl:8.10.1 per CLAUDE.md
# inviolable rule.
# 1.2.18 (Fix #1902, TBD-A40, 2026-05-19): omit HTTPRoute parentRef
# sectionName by default — multi-zone Sovereigns rename HTTPS listeners
# to https-<sanitised-zone>, breaking NoMatchingListener with the prior
# pinned sectionName: https. Matches the catalyst-system fix in PR #1888.
# 1.2.19 (Fix #1901, TBD-A39, 2026-05-19): change CNPG egress
# NetworkPolicy from namespaceSelector=cnpg (the operator NS) to
# podSelector matchLabels cnpg.io/cluster=<postgres.cluster.name>.
# The Postgres workload Pods reconcile into the same NS as the
# CNPG Cluster CR, NOT into cnpg-system; the prior rule could
# never match the actual DB Pods.
# 1.2.26 (#3098, 2026-06-08): guard sso-oauth-source-externalsecret.yaml
# with `.Capabilities.APIVersions.Has "external-secrets.io/v1beta1"` (the
# #2988 gold-standard, mirrors bp-external-dns + bp-sandbox). The
# ExternalSecret previously rendered unconditionally on sso.enabled (default
# true), so on a fresh prov it raced bp-external-secrets' CRD/webhook readiness
# ("validate.externalsecret.external-secrets.io: connection refused") → the
# bp-harbor HR stalled Ready=False → bootstrap-kit never converged → handover
# never fired. Observed live on hw100. The slot-19 dependsOn: bp-external-secrets
# gates HR-Ready but not webhook-serving; this Capabilities guard is its
# complementary half — omit until the CRD exists, re-render on next reconcile.
# 1.2.28 (#3285, 2026-06-11): SHARED-PG consumer wiring. The
# database-secret-sync-job (which polls `harbor-pg-app` to mirror the CNPG
# password into harbor-database-secret) is now gated on
# `postgres.cluster.enabled != false` — the same gate cnpg-cluster.yaml +
# database-secret.yaml already carry. In SHARED mode there is no
# harbor-pg-app to poll; the populated harbor-database-secret is reflected
# in by bp-postgres-shared (#3284), so the un-gated Job would time out and
# FAIL the post-install hook. harbor's externalDatabase already reads
# `harbor-database-secret` (key `password`) + its host flips via the
# SOVEREIGN_HARBOR_PG_HOST slot seam, so no other consumer change is
# needed. own-cluster render byte-identical to 1.2.27.
# 1.2.31 (#3687, extends #3370): bootstrap self-registration —
# templates/application-cr.yaml renders the canonical apps.openova.io/v1
# Application CR for the slot-19 HelmRelease (gated bootstrapOwned.enabled
# + Capabilities apps.openova.io/v1) so the console /apps list, per-app
# Topology tab + showback resolve harbor (no more "no Application CR").
# 1.2.32 (#3375 / #3786, 2026-06-18): the bootstrap-owned Application CR's
# spec.placement now emits the CANONICAL token `singleton` (overridable via
# bootstrapOwned.placement) instead of the banned legacy `single-region`.
# readTopology serves spec.placement VERBATIM to the Topology tab + the
# Instances-table chip, so the legacy spelling leaked the banned word to the
# operator (hw159 #3375).
# 1.2.33 (harbor zero-click SSO, root-caused live hw167 2026-06-19): TWO
# durable fixes so the bare registry URL lands the operator signed-in on
# /harbor/projects instead of the local-DB sign-in page.
#   (1) sso-configure-oauth-job.yaml (one-shot post-install/post-upgrade
#       Helm hook Job) -> sso-configure-deployment.yaml (continuous
#       single-replica reconcile loop, the bp-openbao #2655 pattern). The
#       hook fired at slot-19 install (~1h BEFORE bp-sso-bridge rendered
#       harbor-sso-oidc-credentials), could not source client_id/secret,
#       and left auth_mode=db_auth forever (the post-upgrade hook never
#       re-fired). Measured live: HR Ready 00:33:22Z vs OIDC creds Secret
#       01:38:46Z (65 min race lost). The reconciler tolerates the Secret
#       being absent on early ticks, applies oidc_auth the instant the
#       creds land, and self-heals on any drift (a DB restore wiping
#       auth_mode back to db_auth).
#   (2) httproute.yaml: bare-URL zero-click (the gitea idiom). With
#       auth_mode=oidc_auth Harbor's Angular SPA does a full-page
#       navigation to /account/sign-in and renders a "LOGIN VIA OIDC
#       PROVIDER" button (Harbor has no native auto-redirect knob) — one
#       click, not zero. The gateway now 302s Exact `/account/sign-in`
#       -> Harbor's server-side `/c/oidc/login` (gated sso.bareURL.enabled)
#       -> KC silent broker (kc_idp_hint=catalyst-pin) -> /c/oidc/callback
#       -> /harbor/projects. The bare `/` is deliberately NOT intercepted:
#       Harbor's post-login callback lands on `/`, so redirecting `/` loops
#       (ERR_TOO_MANY_REDIRECTS, measured live). Docker `/v2/` +
#       `/service/token` untouched (401 auth-challenge, not redirected).
#       PROVEN GREEN: probe landed registry.<fqdn>/harbor/projects
#       signed-in on hw167.
# 1.2.34 (#3934 / Refs #3642, 2026-06-20): SPLIT-GATE for the mgmt-vCluster
# host-bridge. The #3642 promotion of harbor into the mgmt vCluster set
# placement.yaml hostBridge.suppress `sso.enabled: false`, which ALSO killed
# the 1.2.33 sso-configure Deployment — so auth_mode was never PUT to oidc_auth
# and the bare registry URL showed the local-DB sign-in form (caught live
# hw171 2026-06-19, /api/v2.0/systeminfo auth_mode=db_auth). New value
# sso.externalSecret.enabled (default true) gates the chart's ExternalSecret
# independently; the Deployment stays gated on sso.enabled. Host-bridge sets
# externalSecret.enabled:false (host renders harbor-sso-oidc-credentials) while
# sso.enabled stays true so the configurator runs IN the vCluster against
# harbor-core. Non-host-bridged render byte-identical. Refs #3374 #3642.
# 1.2.35 (#3971): CNPG storageClass empty ⇒ cluster-default durable cloud CSI; local-path FORBIDDEN.
# 1.2.36 (#4059 / Refs #3642 #3953, 2026-06-22): DB-secret rename bridge
# regression in the host-bridge path. harbor-core reads its DB password from a
# Secret NAMED `harbor-database-secret`, but CNPG mints `harbor-pg-app` — the
# templates/database-secret.yaml placeholder + database-secret-sync-job.yaml
# renamer bridge that. Both were gated on `postgres.cluster.enabled != false`,
# which the #3642 host-bridge placement ALSO flips false (the harbor-pg Cluster
# CR is host-rendered, not in-vc) → the renamer was wrongly SKIPPED → harbor
# never got `harbor-database-secret` → harbor-core CreateContainerConfigError
# ("harbor-database-secret-x-harbor-x-mgmt-vcluster" not found), harbor-jobservice
# CrashLoop, registry.<fqdn> 502 / harbor.<fqdn> 404 on a fresh prov (caught live
# hw172/hw173, BOTH regions). New value postgres.databaseSecretSync.enabled
# (default true) gates the renamer independently of cluster.enabled: it runs
# whenever harbor OWNS a harbor-pg Cluster (embedded OR host-bridge — both produce
# harbor-pg-app), and is set false only in TRUE shared-pg mode (bp-postgres mints
# the secret). Rendering the Job is ALSO what references harbor-pg-app inside
# vc-mgmt, so it makes the bp-mgmt-vcluster sync.fromHost.secrets import (#3953)
# materialise. The cnpg-cluster.yaml Cluster-CR gate is UNCHANGED (still
# cluster.enabled — the host-bridge must not double-create it). Non-host-bridged
# render byte-identical.
# 1.2.39 (#4347): harbor-sso-configure Deployment gains liveness + readiness
#   EXEC probes (heartbeat sentinel) so the host-ns Kyverno `probes-present`
#   Enforce ClusterPolicy admits it (after #4325 de-vcluster re-homed bp-harbor
#   into a native host namespace). Adds tests/kyverno-probes-present.sh.
#   Refs #4347 #4325.
# 1.2.41 (#4913, hw233 live walk): the HTTPRoute now ALSO answers on the
#   app-named harbor.<fqdn>, not just the canonical registry.<fqdn>. Harbor
#   serves UI + registry-v2 + SSO on ONE host (registry.<fqdn> = gateway.host =
#   externalURL = OIDC redirect_uri base); the intuitive harbor.<fqdn> had NO
#   route, so operators/tools reaching for it got a bare-envoy 404 (wildcard DNS
#   *.<fqdn> resolves it to the gateway VIP but no route hostname matched). NOT a
#   missing UI route — the UI route lives on registry.<fqdn>. New value
#   gateway.aliasHarborHost (default true) auto-adds the harbor.-prefixed sibling
#   as a second hostname on the SAME route when gateway.host is registry.-prefixed;
#   the Sovereign wildcard listener + wildcard TLS already cover it, so no
#   DNS/cert change is needed. Auth + self-links stay on registry.<fqdn> (the
#   sign-in->/c/oidc/login redirect keeps its canonical hostname), so entry via
#   harbor.<fqdn> lands on the canonical host with no loop. Also adds
#   gateway.extraHosts (arbitrary aliases) + tests/httproute-render.sh Case 6.
# 1.2.44 (#5302): fix the S3 blob-redirect key casing. Upstream Harbor reads the
#   ALL-LOWERCASE `persistence.imageChartStorage.disableredirect` (registry-cm
#   renders `redirect.disable: {{ $storage.disableredirect }}`). The camelCase
#   `disableRedirect` that #4573 F2 / #4575 shipped was silently dropped by Helm
#   (values are case-sensitive), so the OBS 302 redirect stayed ENABLED and every
#   COLD chart pull (e.g. after a region hard-restart) TLS-failed with `x509:
#   certificate valid for *.obs... not registry.<fqdn>`, wedging post-cutover
#   Flux self-heal. Default is now `disableredirect: true` — the self-contained
#   sovereign registry streams blobs over its own trusted host, never redirects
#   to a differently-certed Object Storage backend. tests/registry-disableredirect.sh
#   guards the wiring so the casing typo cannot recur.
# 1.2.45 (#5406): ONE Harbor session/queue/cache store per Sovereign, anchored
#   in the ACTIVE region and reached from the standby over Cilium ClusterMesh.
#   Harbor keeps its OIDC session in Redis db 0, its job queue in db 1 and its
#   registry blob-descriptor cache in db 2. Two of Harbor's three stateful
#   stores were already anchored in region-A on a 2-region Sovereign (Postgres
#   via the zero-endpoint `shared-pg-mesh-rw` global-Service alias; blobs via a
#   single Object Storage bucket) — Redis was the only one left region-local,
#   because upstream's `redis.type: internal` default survived into a topology
#   it does not fit. Since ONE shared wildcard VIP fans `registry.<fqdn>` at
#   BOTH regions' envoys, a session minted by whichever region handled
#   /c/oidc/callback was invisible to the other and every request that landed
#   on the other region 401'd — per-request, so it read as flake. Measured live
#   on hw290 (dep 31106b6aa4a7e8e7, 2026-07-26 21:13:44Z): region-A
#   `/api/v2.0/users/current` 200 and region-B `/api/v2.0/users/current` 401 in
#   the SAME second, same referer + UA, one page-load. The same split also ran
#   harbor-jobservice's work queue and harbor-registry's blob cache twice,
#   uncoordinated, over one shared DB and one shared bucket.
#   Ships templates/redis-mesh-service.yaml (the `harbor-redis-mesh` Cilium
#   global Service, rendered on BOTH regions — the openbao `openbao-active-mesh`
#   / cnpg-pair `*-primary-mesh` idiom) + templates/redis-crossregion-netpol.yaml
#   (identity-based CiliumNetworkPolicies; a k8s NetworkPolicy can never admit a
#   ClusterMesh peer because Cilium AND-injects the LOCAL cluster label into
#   every selector it derives — verified with cilium-dbg on hw290, same class as
#   #4846/#4854). The slot flips the SECONDARY to `harbor.redis.type: external`
#   pointing at the mesh Service, so upstream renders no local redis there.
#   FAILOVER: on a region-A kill the standby loses this Redis — it ALREADY
#   loses its Postgres the same way, so Harbor needs bp-continuum's switchover
#   either way (blueprint.yaml topology.perTopology.active-hot-standby.
#   switchover.mechanism), and the Redis anchor rides the SAME substitute seam
#   as SOVEREIGN_HARBOR_PG_HOST so the switchover repoints it identically.
#   All of it is gated on crossRegion.enabled (slot-wired to
#   ${SOVEREIGN_ENABLE_CNPG_PAIR}, which catalyst-api stamps true only once
#   ClusterMesh is established) — a single-region render is byte-identical.
#   Guarded by tests/redis-crossregion.sh.
version: 1.2.47
appVersion: "2.14.3"
# 1.2.23 (G117.5 #2744, 2026-06-02): SSO defense-in-depth via Harbor's
# `oidc_extra_redirect_parms` config field. The configure-oauth Job now
# PUTs the field with `{"kc_idp_hint":"catalyst-pin"}` (per top-level
# `sso.idpHint` value) so KC receives the hint on every Harbor
# `/c/oidc/login` redirect → IDR delegates silently to the catalyst-pin
# broker. Defense-in-depth to the realm-config IDR `defaultProvider`
# binding shipped by bp-keycloak 1.4.9+. Refs #2744.
# 1.2.21 (G91.harbor #2654, 2026-05-31): opt in to the bp-sso-bridge
# (G91.1 #2652) SSO framework. Top-level `sso:` block (defaults
# enabled=true). Ships:
#   - templates/sso-oauth-source-externalsecret.yaml — ExternalSecret
#     reading bp-sso-bridge's OpenBao `secret/sso/harbor` bundle into
#     the harbor-sso-oidc-credentials Secret.
#   - templates/sso-configure-oauth-job.yaml — Helm post-install +
#     post-upgrade Job that PUTs Harbor's `/api/v2.0/configurations`
#     with auth_mode=oidc_auth + oidc_endpoint/oidc_client_id/
#     oidc_client_secret/oidc_scope/oidc_groups_claim/oidc_admin_group/
#     oidc_user_claim/oidc_verify_cert/oidc_auto_onboard. Auth uses
#     the local Harbor admin password from harbor-admin Secret
#     (single-key HARBOR_ADMIN_PASSWORD; username hardcoded `admin`
#     per templates/admin-secret.yaml). Idempotent on chart reconcile.
# Sovereign operator (deployment.OrgEmail; auto-granted by
# bp-sso-bridge to client's admin role + sovereign-admins realm
# group) lands in Harbor as a system admin via OIDC. The local
# Harbor `admin` user remains the break-glass account.
# Per SECURITY.md §6.3 (App-level SSO).
keywords: [catalyst, blueprint, harbor, oci, registry, container]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Pinned to goharbor/harbor 1.18.3 (appVersion 2.14.3) — current stable on
# 2026-04-30. Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the
# version is operator-bumpable via PR + Blueprint release.
dependencies:
  - name: harbor
    version: "1.18.3"
    repository: "https://helm.goharbor.io"
