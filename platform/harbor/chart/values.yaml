# Catalyst Blueprint umbrella metadata — the upstream chart is resolved as
# a Helm subchart via Chart.yaml `dependencies:`. Catalyst-curated values
# under the `harbor:` key flow into the upstream subchart unchanged.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). The upstream harbor subchart
  # exposes per-component `harbor.<component>.image.repository` for override.
  # Per-Sovereign overlays should wire those alongside this value. Tracked under #560.
  imageRegistry: ""

catalystBlueprint:
  upstream:
    chart: harbor
    version: "1.18.3"
    repo: "https://helm.goharbor.io"

# ─── Upstream chart values (subchart key: harbor) ────────────────────────
harbor:

  # ─── External hostname / endpoint ──────────────────────────────────────
  # Per-Sovereign overlay MUST set externalURL (e.g.
  # "https://harbor.<location-code>.<sovereign-domain>"). Default is a
  # placeholder so `helm template` smoke renders without `--set`.
  externalURL: "https://harbor.example.local"

  # ─── Admin password (issue #935) ───────────────────────────────────────
  # The upstream goharbor/harbor chart writes its `harbor-core` Secret
  # with key HARBOR_ADMIN_PASSWORD. Either it generates a fresh password
  # from the chart values (`harborAdminPassword`) every reconcile — which
  # rotates every helm upgrade and breaks every running session — OR it
  # consumes a pre-existing Secret via `existingSecretAdminPassword`.
  #
  # The umbrella chart owns the Secret (templates/admin-secret.yaml)
  # because:
  #   1. Per docs/INVIOLABLE-PRINCIPLES.md #10, the password MUST be
  #      fully-random + per-install (no shared default across Sovereigns).
  #   2. The bp-self-sovereign-cutover Step 02 (harbor-projects) Job
  #      runs in the `catalyst` namespace and must read the admin
  #      password via secretKeyRef — K8s forbids cross-namespace
  #      secretKeyRef. The umbrella's admin-secret carries Reflector
  #      annotations that mirror the Secret into `catalyst` so the
  #      cutover Job's references resolve. (Caught live on otech113
  #      2026-05-05 — Job CreateContainerConfigError "secret
  #      harbor-core not found".)
  #   3. lookup-on-reconcile keeps the bytes stable across helm upgrade
  #      so the rotation pathology above never fires.
  #
  # Operator override: set .Values.harborAdmin.password at the umbrella
  # values layer to inject a specific password (e.g. when sealed-secrets
  # already pin it). Empty = generate at first install + lookup on
  # subsequent reconciles.
  existingSecretAdminPassword: "harbor-admin"
  existingSecretAdminPasswordKey: "HARBOR_ADMIN_PASSWORD"

  # ─── Expose (clusterIP + Cilium Gateway HTTPRoute) ─────────────────────
  # Catalyst standard (issue #387): expose harbor-core as a ClusterIP
  # Service and route external traffic through the per-Sovereign Cilium
  # Gateway via the HTTPRoute in templates/httproute.yaml. TLS terminates
  # at the Gateway (wildcard cert from cert-manager — see
  # clusters/_template/bootstrap-kit/01-cilium.yaml), so the upstream
  # chart's expose.tls block is disabled here.
  expose:
    type: clusterIP
    tls:
      enabled: false
    # ingress block retained for documentation / fallback only — when
    # expose.type=clusterIP, the upstream chart does not render an Ingress.
    ingress:
      hosts:
        core: "harbor.example.local"

  # ─── Image-chart storage ───────────────────────────────────────────────
  # Per ADR-0001 §13 + docs/omantel-handover-wbs.md §3 + §3a, S3-aware
  # apps (Harbor is one) write DIRECTLY to the cloud-provider's native S3
  # endpoint. On Hetzner Sovereigns that is Hetzner Object Storage
  # (https://<region>.your-objectstorage.com), NOT SeaweedFS — SeaweedFS
  # is reserved as a POSIX→S3 buffer for legacy POSIX-only writers and
  # is not in the minimal Sovereign set.
  #
  # Defaults below leave bucket/region/regionendpoint EMPTY because the
  # umbrella chart MUST render cleanly on contabo (which has no Hetzner
  # credentials). Per-Sovereign HelmRelease in
  # clusters/<sovereign>/bootstrap-kit/19-harbor.yaml supplies real
  # values via Flux `valuesFrom` against the flux-system/object-storage
  # Secret (issue #371, vendor-agnostic since #425).
  #
  # `type: filesystem` keeps the upstream chart on the local PVC path
  # at default-render time (so an empty bucket/regionendpoint doesn't
  # produce a half-broken S3 driver); the per-Sovereign overlay MUST
  # flip type back to `s3` and set `existingSecret: harbor-objectstorage-credentials`
  # once it supplies real config — see the bootstrap-kit slot for the
  # wiring.
  persistence:
    enabled: true
    resourcePolicy: "keep"
    persistentVolumeClaim:
      registry:
        # Used in `type: filesystem` mode (contabo dev/test) AND as a
        # tiny cache when `type: s3` is engaged. Per-Sovereign overlay
        # MAY override storageClass.
        existingClaim: ""
        storageClass: ""
        subPath: ""
        accessMode: ReadWriteOnce
        size: 5Gi
      jobservice:
        jobLog:
          existingClaim: ""
          storageClass: ""
          subPath: ""
          accessMode: ReadWriteOnce
          size: 1Gi
      database:
        # Catalyst uses bp-cnpg for DB — no embedded postgres PVC. The
        # upstream chart still requires this block to exist when
        # `database.type: external`; size kept at upstream default.
        existingClaim: ""
        storageClass: ""
        subPath: ""
        accessMode: ReadWriteOnce
        size: 1Gi
      redis:
        existingClaim: ""
        storageClass: ""
        subPath: ""
        accessMode: ReadWriteOnce
        size: 1Gi
      trivy:
        existingClaim: ""
        storageClass: ""
        subPath: ""
        accessMode: ReadWriteOnce
        size: 5Gi
    imageChartStorage:
      # #5302: upstream Harbor's key is all-lowercase `disableredirect` (Helm
      # values are case-sensitive — camelCase `disableRedirect` is silently
      # ignored, which is why #4573 F2 was inert its entire life and a
      # region-restart cold chart-pull TLS-failed against the OBS redirect).
      # Default `true`: a self-contained sovereign registry must stream blobs
      # over its own trusted registry host, never 302-redirect to a
      # differently-certed Object Storage backend. Inert for `type: filesystem`.
      disableredirect: true
      # Default `filesystem` so contabo dev/test renders cleanly with
      # no S3 endpoint configured. Per-Sovereign overlay flips this to
      # `s3` and supplies bucket/region/regionendpoint/existingSecret
      # via Flux valuesFrom.
      type: filesystem
      filesystem:
        rootdirectory: /storage
      s3:
        # Per-Sovereign overlay populates these via Flux `valuesFrom`
        # against flux-system/object-storage Secret (#371, vendor-
        # agnostic since #425). The corresponding `targetPath` entries
        # are documented in clusters/_template/bootstrap-kit/19-harbor.yaml.
        region: ""
        bucket: ""
        # Credentials flow through `existingSecret` (NOT inline
        # accesskey/secretkey) so the umbrella's templated Secret
        # carries them — see templates/objectstorage-credentials.yaml.
        # Per-Sovereign overlay MUST set existingSecret to the value of
        # `objectStorage.credentialsSecretName` (default
        # `harbor-objectstorage-credentials`).
        existingSecret: ""
        accesskey: ""
        secretkey: ""
        regionendpoint: ""
        encrypt: false
        keyid: ""
        secure: true
        v4auth: true
        chunksize: ""
        rootdirectory: ""
        storageclass: "STANDARD"
        multipartcopychunksize: ""
        multipartcopymaxconcurrency: ""
        multipartcopythresholdsize: ""

  # ─── Database (external CNPG) ──────────────────────────────────────────
  # Per-Sovereign overlay supplies CNPG Cluster ref via ExternalSecret +
  # populates `host`, `password` from the secret. Default is placeholder
  # so `helm template` smoke renders without `--set`.
  database:
    type: external
    external:
      host: "harbor-pg-rw.harbor.svc.cluster.local"
      port: "5432"
      username: "harbor"
      password: ""
      coreDatabase: "registry"
      existingSecret: "harbor-database-secret"   # ESO-projected from CNPG
      sslmode: "disable"
    maxIdleConns: 100
    maxOpenConns: 900
    podAnnotations: {}

  # ─── Redis (internal — for solo Sovereign; HA overlay swaps to Valkey) ─
  redis:
    type: internal
    internal:
      image:
        repository: harbor.openova.io/proxy-dockerhub/goharbor/redis-photon
        tag: "v2.14.3"
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
    external:
      addr: ""
      sentinelMasterSet: ""
      coreDatabaseIndex: "0"
      jobserviceDatabaseIndex: "1"
      registryDatabaseIndex: "2"
      trivyAdapterIndex: "5"
      password: ""
      existingSecret: ""

  # ─── Image pin (per docs/INVIOLABLE-PRINCIPLES.md #4) + Harbor
  # proxy-cache pull (#3296, #3267 class) ────────────────────────────────
  # Every component image is pinned to appVersion 2.14.3 AND pulled
  # THROUGH the Harbor proxy-cache. Bare `goharbor/*` refs match NEITHER
  # kyverno `harbor-proxy-pull` (Enforce) glob (`*/proxy-*/*`,
  # `*/openova-io/*`); original pods are admitted pre-enforcement during
  # bootstrap, so the denial only fires on the FIRST chart roll of a
  # converged env — live on hw128 the 1.2.28 roll's replacement
  # ReplicaSets had every pod denied (harbor-registry FailedCreate) and
  # the rollback timed out. proxy-dockerhub is a read-through cache of
  # the same bytes. The exporter (metrics off) and internal database
  # (external CNPG) stay at upstream defaults — they never render pods
  # here.
  nginx:
    image:
      repository: harbor.openova.io/proxy-dockerhub/goharbor/nginx-photon
      tag: "v2.14.3"
    # #4343 — the harbor-nginx Deployment MUST declare resources.requests. The
    # upstream goharbor subchart only renders `resources:` when
    # `.Values.nginx.resources` is set; left unset, harbor-nginx ships with NO
    # requests. Pre-#4325 this chart ran INSIDE a vCluster where the host's
    # Kyverno `resource-requests` Enforce ClusterPolicy didn't reach it; after
    # the de-vcluster migration it installs into the native host namespace and
    # the `Deployment/harbor-nginx` admission is DENIED, timing out the Helm
    # install → bp-harbor InstallFailed. Mirror the portal/core sibling
    # requests — modest for the reverse-proxy front door.
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 500m

  # ─── Component replica counts ──────────────────────────────────────────
  portal:
    image:
      repository: harbor.openova.io/proxy-dockerhub/goharbor/harbor-portal
      tag: "v2.14.3"
    replicas: 1
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 500m

  core:
    image:
      repository: harbor.openova.io/proxy-dockerhub/goharbor/harbor-core
      tag: "v2.14.3"
    replicas: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 1
    # `secretName` lets per-Sovereign overlay supply the Harbor admin
    # secret (CSRF key, JWT signing key, admin password). Default empty
    # — chart auto-generates on first install (rotated by overlay later).
    secretName: ""
    # Internal TLS — Catalyst's Cilium WireGuard handles cluster-internal
    # traffic encryption; Harbor's internal TLS off by default.
    tokenCert: ""
    tokenKey: ""

  jobservice:
    image:
      repository: harbor.openova.io/proxy-dockerhub/goharbor/harbor-jobservice
      tag: "v2.14.3"
    replicas: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 1
    maxJobWorkers: 10
    jobLoggers:
      - file
    loggerSweeperDuration: 14

  registry:
    registry:
      image:
        repository: harbor.openova.io/proxy-dockerhub/goharbor/registry-photon
        tag: "v2.14.3"
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 1Gi
          cpu: 1
    controller:
      image:
        repository: harbor.openova.io/proxy-dockerhub/goharbor/harbor-registryctl
        tag: "v2.14.3"
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
        limits:
          memory: 256Mi
          cpu: 500m
    replicas: 1
    middleware:
      enabled: false

  # ─── Trivy vulnerability scanner ───────────────────────────────────────
  # DEFAULT FALSE per docs/BLUEPRINT-AUTHORING.md §11.2 logic — bp-trivy
  # (slot 30) reconciles AFTER bp-harbor (slot 19) in the bootstrap kit
  # ordering, so Trivy scanning here would race against an absent CRD
  # surface. Per-Sovereign overlay flips this on once bp-trivy is Ready.
  trivy:
    enabled: false
    image:
      repository: harbor.openova.io/proxy-dockerhub/goharbor/trivy-adapter-photon
      tag: "v2.14.3"
    replicas: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 1
    skipUpdate: false
    offlineScan: false
    timeout: 5m0s

  # ─── Notary (image signing) — DEPRECATED in upstream Harbor 2.x ────────
  # Sigstore (bp-sigstore, slot 32) is the Catalyst signing path. Notary
  # OFF.
  notary:
    enabled: false

  # ─── Exporter / metrics ────────────────────────────────────────────────
  # ServiceMonitor / metrics — DEFAULT FALSE per docs/BLUEPRINT-AUTHORING
  # .md §11.2 (Observability toggles default false; kube-prometheus-stack
  # CRDs may not exist on a fresh Sovereign).
  metrics:
    enabled: false
    core:
      path: /metrics
      port: 8001
    registry:
      path: /metrics
      port: 8001
    jobservice:
      path: /metrics
      port: 8001
    exporter:
      path: /metrics
      port: 8001
    serviceMonitor:
      enabled: false

  # ─── Logging ──────────────────────────────────────────────────────────
  logLevel: info

  # ─── Update strategy ──────────────────────────────────────────────────
  # #5022 — Recreate, not RollingUpdate. The upstream harbor chart applies
  # this strategy to its PERSISTENCE-BACKED Deployments (jobservice +
  # registry — verified in the render; core/portal/nginx keep the k8s
  # default RollingUpdate) and offers no per-component knob. harbor-
  # jobservice is a single-replica Deployment backed by an RWO PVC (jobLog
  # persistence): RollingUpdate (maxUnavailable rounds to 0 at replicas=1)
  # DEADLOCKS any forced roll -- the new pod can't attach the RWO volume
  # until the old one detaches, the old one must stay Ready until the new is
  # Ready -> Multi-Attach wedge (proven live on hw242: cutover step-08 240s
  # roll-timeout FAILed the leg; jobservice needed a manual scale-bounce).
  # Upstream's own guidance: use Recreate whenever filesystem (RWO)
  # persistence is enabled. Overlays running HA replicas + RWX/S3-only
  # storage MAY flip back to RollingUpdate.
  updateStrategy:
    type: Recreate

# ─── Harbor admin credentials (issue #935) ────────────────────────────────
# Catalyst-curated admin Secret that the umbrella chart materialises in
# the harbor namespace and Reflector-mirrors into `catalyst` so the
# bp-self-sovereign-cutover Step 02 Job (which lives in the `catalyst`
# namespace) can read HARBOR_ADMIN_PASSWORD via secretKeyRef.
#
# Persistence: lookup-on-reconcile keeps the password stable across
# every helm upgrade. First-install path generates a 32-char alphanum
# password (190 bits entropy, per feedback_passwords.md). Operator may
# inject a fixed password via .password (e.g. when sealed-secrets pin
# it). The Secret is annotated with helm.sh/resource-policy=keep so
# `helm uninstall` does NOT delete the bytes — a re-install picks the
# same password back up via lookup.
harborAdmin:
  # Name of the Secret materialised in `.Release.Namespace` (the harbor
  # namespace by convention). The upstream Harbor subchart's
  # `existingSecretAdminPassword` field (default "harbor-admin", set in
  # the harbor: subchart values above) MUST match this value.
  secretName: "harbor-admin"
  # Operator-supplied password override. Empty = generate at first
  # install + preserve via lookup on every reconcile thereafter.
  password: ""
  # Comma-separated list of namespaces Reflector mirrors the admin
  # Secret into. `catalyst` is required for the cutover Job; operators
  # may add more if other in-cluster consumers need the bytes.
  reflectionAllowedNamespaces: "catalyst"

# ─── Catalyst overlay values (consumed by templates/ in this chart) ──────
# Reserved for Catalyst-side overlays added in a follow-up PR once
# bp-harbor is consumed in clusters/_template/:
#  - NetworkPolicy isolating harbor namespace from non-Catalyst traffic
#  - ExternalSecret projecting CNPG password + SeaweedFS S3 keys via ESO
#    (bp-external-secrets) so values.database.external.password and
#    values.persistence.imageChartStorage.s3.{accesskey,secretkey} land
#    via Reloader-restart-on-rotation rather than chart-render-time.
#  - cert-manager Certificate for harbor.<location-code>.<sovereign-domain>
#    pointing at the per-Sovereign Issuer.
#  - Keycloak OIDC client wiring for SSO when ssoEnabled flips true.
#  - Harbor Project + Pull-mirror policy bootstrap (project: catalyst,
#    pull-mirror: ghcr.io/openova-io/* every 6h).
harborOverlay:
  networkPolicy:
    enabled: false
    cnpgNamespace: "cnpg"
    keycloakNamespace: "keycloak"
  serviceMonitor:
    enabled: false                # docs/BLUEPRINT-AUTHORING.md §11.2
    interval: "30s"
    namespace: ""                 # default: release namespace
  externalSecret:
    enabled: false
  certificate:
    enabled: false
    issuerRef:
      kind: ClusterIssuer
      name: ""
  sso:
    # Deprecated alias retained for any pre-G91 cluster overlays that
    # toggle `harborOverlay.sso.enabled`. G91.harbor (#2654) introduces
    # a first-class top-level `sso:` block (see below) wired to the
    # bp-sso-bridge framework. This sub-block now mirrors the new top-
    # level value at chart-template time inside templates/networkpolicy.yaml.
    enabled: false
    keycloakRealm: ""
    keycloakClientId: ""
  pullMirror:
    enabled: false
    upstreams: []     # list of {name, url, schedule, filter} entries

# ─── G91.harbor (#2654) SSO opt-in ────────────────────────────────────────
# Per SECURITY.md §6.3 every Application Blueprint declares SSO support
# with a single value. bp-sso-bridge (G91.1 #2652) watches every HR with
# `sso.enabled: true` and reconciles a Keycloak Client + OpenBao
# `secret/sso/<clientId>` + ExternalSecret in this namespace.
#
# bp-harbor opts in by default — Sovereign-operator SSO is mandatory.
# Harbor's local `admin` user (HARBOR_ADMIN_PASSWORD in admin-secret.yaml)
# remains as the break-glass account for Sovereign-recovery scenarios.
sso:
  enabled: true
  # #3934 (Refs #3642): split-gate for the host-bridge (mgmt-vCluster)
  # placement. Host-bridged → the HOST renders the harbor-sso-oidc-credentials
  # ExternalSecret; placement.yaml's hostBridge.suppress sets
  # `externalSecret.enabled: false` so the chart skips the in-vCluster copy,
  # while `sso.enabled` stays true so the sso-configure Deployment (which PUTs
  # auth_mode=oidc_auth) still renders in the vCluster alongside harbor-core.
  # Default true → non-host-bridged render byte-identical.
  externalSecret:
    enabled: true
  realm: sovereign
  # Per-Sovereign cluster overlay sets this (e.g. `hw86.omani.works`).
  # When empty the configure-oauth Job is suppressed so a half-configured
  # auth_mode can never land.
  sovereignFqdn: ""
  # OIDC client ID — defaults to "harbor" (bp-sso-bridge strips "bp-"
  # from the HR name).
  clientId: harbor
  externalSecretStoreName: vault-region1
  refreshInterval: 1h
  # Harbor's `oidc_user_claim` — `preferred_username` is the standard
  # OIDC claim that maps to the Keycloak realm's username. Defaults to
  # name as Harbor strips most non-ASCII characters.
  userClaim: preferred_username
  groupClaimName: groups
  adminGroup: sovereign-admins
  # Verify the Keycloak TLS cert. The realm runs behind the per-Sovereign
  # cert-manager-managed cert which is trusted by Harbor's pod's CA bundle
  # (cert-manager Issuer is one of the bootstrap-kit's CA roots).
  verifyCert: true
  # G117.5 #2744 — Identity Provider hint injected via Harbor's
  # `oidc_extra_redirect_parms` config field so KC's IDR delegates
  # silently to the catalyst-pin broker on every Harbor `/c/oidc/login`
  # redirect. Defense-in-depth to the realm-config IDR `defaultProvider`
  # binding (bp-keycloak 1.4.9+). Per-Sovereign overlay may override
  # (empty string disables defense-in-depth).
  idpHint: catalyst-pin
  # ── True zero-click bare-URL entry (founder mandate 2026-06-12; #3374
  # class; PROVEN GREEN live hw167 2026-06-19) ───────────────────────────
  # With auth_mode=oidc_auth, Harbor's Angular SPA does a full-page
  # navigation to /account/sign-in and renders a sign-in page with a
  # "LOGIN VIA OIDC PROVIDER" button — Harbor has no native auto-redirect
  # knob, so the operator must CLICK. When bareURL.enabled, the Catalyst
  # HTTPRoute (templates/httproute.yaml) 302s the sign-in PAGE path to
  # Harbor's server-side OIDC login endpoint (oidcLoginPath) for genuine
  # zero-click. Mirrors the gitea / openbao / pdns-admin bare-URL idiom.
  # NOTE: only signInPath is intercepted, never the bare `/` — Harbor's
  # post-login callback lands on `/`, so redirecting `/` loops
  # (ERR_TOO_MANY_REDIRECTS, measured live).
  bareURL:
    enabled: true
    # Harbor's unauthenticated sign-in page path (the SPA navigates here
    # with ?redirect_url=… when no session exists). The gateway 302s this
    # to oidcLoginPath. An authenticated session never revisits it.
    signInPath: /account/sign-in
    # Harbor's server-side OIDC login initiation endpoint. It 302s to
    # Keycloak carrying the kc_idp_hint set via oidc_extra_redirect_parms
    # (so the realm IDR delegates silently to catalyst-pin), then
    # /c/oidc/callback sets the session and lands on /harbor/projects.
    oidcLoginPath: /c/oidc/login
  # ── Continuous OIDC config reconciler (sso-configure-deployment.yaml) ──
  # Replaces the former one-shot post-install/post-upgrade Helm hook Job
  # (root-caused live hw167 2026-06-19): bp-harbor (slot 19) installs
  # BEFORE bp-sso-bridge reconciles the harbor-sso-oidc-credentials Secret,
  # so the hook fired ~1h before the OIDC creds existed → it could not
  # source client_id/client_secret → Harbor stayed at auth_mode=db_auth and
  # the post-upgrade hook never re-fired (chart unchanged since install).
  # A continuous single-replica reconcile loop (the bp-openbao
  # sso-configure-deployment.yaml pattern) tolerates the Secret being
  # absent on early ticks and re-converges the config on any drift
  # (e.g. a Harbor DB reset wiping the auth_mode back to db_auth).
  configureReconciler:
    image: harbor.openova.io/proxy-dockerhub/curlimages/curl:8.10.1
    intervalSeconds: 60

# ─── Catalyst HTTPRoute (Cilium Gateway API, issue #387) ──────────────────
# Replaces the upstream chart's networking.k8s.io/v1.Ingress on Sovereigns.
# Per-Sovereign overlay supplies `gateway.host` (e.g. registry.<sovereign-fqdn>).
# parentRef defaults to cilium-gateway/kube-system, the per-Sovereign
# Gateway shipped by clusters/_template/bootstrap-kit/01-cilium.yaml.
gateway:
  enabled: true
  # host: registry.<sovereign-fqdn> — REQUIRED, no default per Inviolable Principle #4.
  # This is the CANONICAL Harbor host: UI (`/`) + registry-v2 (`/v2/`) + SSO all
  # terminate here, and it MUST equal harbor.externalURL (the OIDC redirect_uri base).
  host: ""
  # #4913 (hw233): also answer the HTTPRoute on the app-named harbor.<fqdn> so the
  # intuitive host stops returning a bare-envoy 404 (it deliberately had no route;
  # the UI lives on registry.<fqdn>). When true AND gateway.host begins with
  # "registry.", the chart auto-adds the "harbor."-prefixed sibling as a second
  # hostname on the SAME route. The Sovereign wildcard DNS (*.<fqdn>) + wildcard
  # TLS already cover it, so no per-Sovereign DNS/cert change is needed. Auth +
  # self-links stay on gateway.host, so an entry via harbor.<fqdn> lands on the
  # canonical registry.<fqdn> after login. Set false to serve ONLY gateway.host.
  aliasHarborHost: true
  # Additional hostnames the SAME HTTPRoute should answer on (beyond gateway.host
  # and the auto-derived harbor.<fqdn> alias above). Empty entries and any entry
  # equal to gateway.host are skipped. Each must be covered by the Gateway
  # listener's wildcard hostname + TLS cert.
  extraHosts: []
  path: "/"
  # Backend Service — defaults to <release>-harbor-core (harbor subchart core Service)
  backendService: ""
  backendPort: 80
  parentRef:
    name: cilium-gateway
    namespace: kube-system
    # sectionName intentionally empty — multi-zone Sovereigns rename HTTPS
    # listeners to https-<sanitised-zone> (e.g. https-omani-works), so
    # pinning sectionName: https breaks NoMatchingListener. Cilium Gateway
    # matches by hostname filter. See PR #1888 / TBD-A40 / issue #1902.
    sectionName: ""

# ─── Vendor-agnostic Object Storage backend config (issue #383 / #425) ───
#
# Per ADR-0001 §13 + docs/omantel-handover-wbs.md §3 + §3a, S3-aware
# apps (Harbor is one) write DIRECTLY to the cloud-provider's native S3
# endpoint. The per-Sovereign HelmRelease populates these fields via
# Flux `valuesFrom` against the canonical `flux-system/object-storage`
# Secret. Per #425 the seam is vendor-agnostic — same Secret name +
# same chart-values shape support a future AWS / Azure / GCP / OCI
# Sovereign without renaming the seam.
#
# Default values below produce a clean render on contabo (no
# credentials configured, type: filesystem) — see the bootstrap-kit
# slot at clusters/_template/bootstrap-kit/19-harbor.yaml for the
# canonical mapping.
# ─── CNPG Postgres cluster for Harbor metadata DB ────────────────────────
# These values are consumed by templates/cnpg-cluster.yaml (the Cluster CR)
# and templates/database-secret.yaml (the harbor-database-secret Secret).
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), all operationally-
# meaningful sizing/naming values are overridable via per-Sovereign overlays.
postgres:
  cluster:
    name: harbor-pg
    # Default to the chart's own targetNamespace. Override via per-Sovereign
    # overlay if the CNPG cluster lives in a different namespace.
    namespace: harbor
    instances: 1                  # bump to 3 alongside HA overlay once beyond Phase-0
    storageSize: 5Gi
    storageClass: ""  # #3971 — empty ⇒ cluster-default durable cloud CSI; local-path FORBIDDEN
    # CNPG postgres image. Defaults to the mothership Harbor proxy cache
    # (harbor.openova.io/proxy-ghcr) so fresh-prov bootstrap pulls the
    # ~300MB image through Harbor instead of throttling on anonymous ghcr
    # (#3058). PUBLIC image → proxy-ghcr serves it cred-free. Post-cutover
    # Step-04's containerd mirror redirects harbor.openova.io → local Harbor.
    # The tag is set separately via pgVersion.
    imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql
    pgVersion: "16"
    # MUST match harbor.database.external.coreDatabase. Harbor upstream
    # defaults coreDatabase="registry" and connects to a DB named "registry".
    database: registry
    owner: harbor
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }
  # ── DB-secret rename bridge (harbor-pg-app → harbor-database-secret) ──────
  # Harbor upstream reads its DB password from a Secret NAMED
  # `harbor-database-secret` (key `password` / `HARBOR_DATABASE_PASSWORD`),
  # but CNPG mints `harbor-pg-app`. The placeholder Secret
  # (templates/database-secret.yaml) + post-install Job
  # (templates/database-secret-sync-job.yaml) bridge that rename.
  #
  # This MUST run whenever harbor OWNS a `harbor-pg` Cluster (i.e. there is a
  # `harbor-pg-app` to rename) — and that is true in BOTH:
  #   (a) the legacy embedded path   (postgres.cluster.enabled=true,  in-vc render), AND
  #   (b) the #3642 host-bridge path (postgres.cluster.enabled=false, host renders
  #       the Cluster CR but harbor STILL owns harbor-pg → harbor-pg-app exists).
  # It MUST be OFF only in TRUE shared-pg mode (ADR-0010), where bp-postgres
  # mints `harbor-database-secret` directly and no `harbor-pg-app` exists to poll.
  #
  # Previously the Job + placeholder were gated on `postgres.cluster.enabled`
  # — which the #3642 host-bridge placement ALSO flips false (the Cluster CR
  # is host-rendered, not in-vc). That conflation SKIPPED the renamer in the
  # host-bridge path → `harbor-database-secret` never created → harbor-core
  # `CreateContainerConfigError` (secret
  # "harbor-database-secret-x-harbor-x-mgmt-vcluster" not found) → registry.<fqdn>
  # 502 / harbor.<fqdn> 404 on a fresh prov (caught live hw172/hw173, BOTH regions).
  # The sync Job is also the in-vCluster consumer of `harbor-pg-app`, so its
  # absence ALSO meant nothing referenced `harbor-pg-app` inside vc-mgmt → the
  # bp-mgmt-vcluster `sync.fromHost.secrets` import (#3953) never materialised
  # it either. Rendering the Job fixes BOTH layers. (#4059, Refs #3642 #3953.)
  # Default true (every own-cluster prov, embedded + host-bridge); a
  # per-Sovereign TRUE-shared-pg overlay sets it false alongside the
  # SOVEREIGN_HARBOR_PG_OWN_CLUSTER=false flip.
  databaseSecretSync:
    enabled: true

objectStorage:
  # When false, no credentials Secret is rendered (contabo, local dev,
  # etc.). Per-Sovereign overlay flips to true.
  enabled: false
  # When true, skip rendering the harbor-namespace credentials Secret
  # entirely — the operator has already created one out-of-band
  # (sealed-secret / external-secret / cloud-init / etc.).
  useExistingSecret: false
  # Override the default secret name — must match the value supplied to
  # the upstream chart's persistence.imageChartStorage.s3.existingSecret
  # field by the per-Sovereign overlay.
  credentialsSecretName: ""
  s3:
    # Operator-issued S3 access/secret keys. Plaintext at runtime ONLY
    # — Flux populates these via valuesFrom at HelmRelease apply time,
    # never committed to git.
    accessKey: ""
    secretKey: ""

# ── Bootstrap self-registration (#3687, extends #3370) ───────────────────
# When a bootstrap-kit slot installs this chart, it flips
# bootstrapOwned.enabled=true so templates/application-cr.yaml renders the
# canonical apps.openova.io/v1 Application CR for the slot's HelmRelease
# (the instance card every console surface reads — /apps, Topology,
# showback). Default OFF so console-created instances are not double-carded.
# helmRelease names the owning Flux HelmRelease (the controller's adoption
# path mirrors its Ready condition); namespace is where that HR object
# lives (flux-system for the slot 19 HR).
bootstrapOwned:
  enabled: false
  # Canonical placement token stamped onto the self-registered Application
  # CR's spec.placement (#3375 DoD-1 / #3768 / #3786). MUST be a canonical
  # mode (singleton / active-active / active-hot-standby / active-passive) —
  # NEVER the banned legacy dialect single-region / active-hotstandby, which
  # the read path (readTopology) would surface verbatim to the operator. A
  # leaf bootstrap app installs as one copy, so singleton is the truthful
  # effective mode.
  placement: singleton
  helmRelease:
    name: ""
    namespace: flux-system

# ── Cross-region session/queue/cache store (#5406) ───────────────────────
# Harbor's OIDC session lives in Redis db 0 (`_REDIS_URL_CORE`), its job
# queue in db 1 and its registry blob-descriptor cache in db 2. On a
# 2-region Sovereign BOTH regions serve `registry.<fqdn>` (one shared
# wildcard VIP fans requests at both regions' envoys), while upstream's
# default `redis.type: internal` gave each region its OWN redis — so a
# session minted in one region 401s in the other, on a PER-REQUEST basis.
# Meanwhile Harbor's other two stateful stores (Postgres via
# `shared-pg-mesh-rw`, blobs via one Object Storage bucket) were ALREADY
# anchored in the active region. This block makes Redis follow the same
# rule instead of being the odd one out.
#
# `enabled` is wired by bootstrap-kit slot 19 to ${SOVEREIGN_ENABLE_CNPG_PAIR}
# — stamped true on BOTH regions by catalyst-api only once Cilium ClusterMesh
# is established. A single-region prov never reaches that flip, so the
# default render below emits NOTHING (no Service, no CiliumNetworkPolicy)
# and is byte-identical to the pre-#5406 chart.
#
# The SECONDARY region additionally receives `harbor.redis.type: external` +
# `harbor.redis.external.addr: <meshServiceName>:6379` from the slot (driven
# by the SOVEREIGN_HARBOR_REDIS_* substitutes catalyst-api stamps at the same
# post-mesh gate that stamps SOVEREIGN_HARBOR_PG_HOST), so upstream renders no
# local redis there and every dial crosses the mesh to the active region.
crossRegion:
  # Render the ClusterMesh global Service + the cross-region CiliumNetworkPolicies.
  enabled: false
  # This region's role in the pair: primary | secondary. Drives
  # service.cilium.io/shared (the standby must never export a redis of its own).
  role: primary
  # Peer ClusterMesh cluster name(s) — stamped by catalyst-api as
  # SOVEREIGN_PEER_CLUSTERMESH_NAMES. EMPTY → no CiliumNetworkPolicy rendered.
  peerClusters: []
  redis:
    # Name of the merged global Service. MUST be identical on both regions —
    # Cilium merges ClusterMesh global services by name+namespace.
    meshServiceName: harbor-redis-mesh
    # Cilium global-service backend preference. `local` falls through to the
    # peer when there are no local backends (the standby's case), which is the
    # same idiom bp-openbao's openbao-active-mesh and bp-cnpg-pair's
    # *-primary-mesh Services use.
    affinity: local
    port: 6379
    # Selector for the upstream goharbor internal-redis Pod
    # (charts/harbor/templates/redis/service.yaml → harbor.matchLabels +
    # component: redis). Defaults track the upstream chart; override only if
    # `harbor.nameOverride` / the release name is customised.
    appLabel: harbor
    releaseLabel: ""
