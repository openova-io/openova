apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: harbor
  labels:
    catalyst.openova.io/section: pts-3-5-storage-and-data
    catalyst.openova.io/tier: catalyst-cp
spec:
  version: 1.2.44  # lockstep with chart/Chart.yaml (#5302 disableredirect key casing — see Chart.yaml changelog)
  card:
    title: Harbor
    family: foundation
    description: Per-Sovereign OCI registry. Mirrors Catalyst Blueprint OCI artefacts and container images so the Sovereign isn't dependent on ghcr.io for day-2 image pulls. Stores blobs DIRECTLY in cloud-native Object Storage (Hetzner Object Storage / AWS S3 / etc., per ADR-0001 §13), metadata in CNPG. SSO via Keycloak OIDC. Vulnerability scanning via Trivy (off by default; opt-in once bp-trivy reconciles).
    docs: https://goharbor.io/docs/
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  configSchema:
    type: object
    required: [hostname]
    properties:
      hostname:
        type: string
        format: hostname
        description: Public hostname for Harbor Core (e.g. harbor.<location-code>.<sovereign-domain>).
      coreReplicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 5
      registryReplicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 5
      jobserviceReplicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 3
      portalReplicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 3
      trivyEnabled:
        type: boolean
        default: false
        description: Enable Trivy vulnerability scanning. Default off — opt in via per-Sovereign overlay once bp-trivy (slot 30) has reconciled.
      ssoEnabled:
        type: boolean
        default: false
        description: Enable OIDC SSO via Catalyst Keycloak. Default off — opt in via per-Sovereign overlay once bp-keycloak has reconciled.
  placementSchema:
    # Aligned with spec.topology below (#4212 Seam 3): the application-
    # controller validates an Application's spec.placement against modes[]
    # (blueprintAllowedModes) and derives the effective default from
    # default / defaultOnMultiRegion (EffectiveDefault). The spine
    # Application-CR producer stamps active-hot-standby on a multi-region
    # Sovereign (matching topology.defaults.multi-region), so modes[] must
    # admit it AND defaultOnMultiRegion must name it — otherwise the
    # explicit placement is rejected and no Continuum CR is minted.
    modes: [single-region, singleton, active-hot-standby]
    default: single-region
    defaultOnMultiRegion: active-hot-standby
    minRegions: 1
    maxRegions: 2
  # ── #3373: class-level placement SUGGESTION + allow-list ────────────────
  # Placement is an INSTANCE property (Application.spec.placement); this is
  # only the default every instance inherits silently — the provisioning
  # journey's generic advanced selector (and a direct Git edit of the
  # instance's spec.placement) may override it within allowedPlacements.
  # Founder §4 table target: mgmt. Single render mechanism: the Flux
  # spec.kubeConfig.secretRef pivot — zero per-app placement code.
  defaultPlacement:
    vcluster: mgmt
  allowedPlacements: [host, mgmt]

  manifests:
    chart: ./chart
  depends:
    - blueprint: bp-cnpg             # CNPG operator + CRDs (engine substrate)
      version: ^1
    # bp-postgres (#3370): Harbor's registry metadata DB is a Context on a
    # SHAREABLE bp-postgres data-instance (the slot wires harbor's HR
    # dependsOn bp-postgres-shared). Declaring bp-postgres here — the
    # shareable INSTANCE Blueprint, not just bp-cnpg the engine operator —
    # makes the console's New-instance wizard render the generic PostgreSQL
    # backing selector (Create new / Reuse existing) per §2.4 / §7.
    - blueprint: bp-postgres
      version: ^0
    - blueprint: bp-cert-manager     # registry endpoint TLS via ClusterIssuer
      version: ^1
    # Note: bp-seaweedfs dependency REMOVED in 1.1.0 (issue #383). Per
    # ADR-0001 §13 Harbor on Sovereigns writes blobs DIRECTLY to the
    # cloud-provider's native S3 endpoint (Hetzner Object Storage / AWS
    # S3 / etc.). SeaweedFS is reserved as a POSIX→S3 buffer for legacy
    # POSIX-only writers and is not in the minimal Sovereign set.
  upgrades:
    from: ["0.x", "1.0.x"]

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive. PG via bp-cnpg-pair sync; image blobs
  #   on cloud-native S3 (cross-region replication = provider-native bucket
  #   replication, async). Switchover: bp-continuum PG flip + PowerDNS flip
  #   for registry.<sov> + harbor.<sov>; blob pulls keep working through
  #   replica bucket on standby region.
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          # #4402 (#4325 de-vcluster fallout): the `mgmt` plane vCluster was
          # removed; the spine lands host-native in its own host namespace.
          # The #4334 spine producer drives this Blueprint through the
          # application-controller fan-out, which resolved `tier: mgmt` → host
          # ns `mgmt` (now absent) → `namespaces "mgmt" not found` and never
          # reached the Continuum producer. Host placement = empty tier; keep
          # the mgmt-A/-B region designators. Mirrors #4375/#4379.
          tier: ''
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ''
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # Audit row: harbor.<sov> (UI/API) + registry.<sov> (OCI pull/push).
  endpoints:
    - name: ui
      # Harbor's UI + API are served on the SAME host as the registry
      # (registry.<sov>): clusters/_template/bootstrap-kit/19-harbor.yaml sets
      # BOTH gateway.host AND externalURL to registry.${SOVEREIGN_FQDN}, and
      # the Keycloak OIDC client redirect_uri is registry.<sov>/c/oidc/callback.
      # The earlier harbor.<sov> value pointed at a host with NO HTTPRoute → the
      # console launch-url would 404. Keep this aligned with the live externalURL.
      # registry.<sov> is therefore the CANONICAL launch host and stays the
      # hostnameTemplate below. #4913 (chart 1.2.41): the HTTPRoute now ALSO
      # answers on the app-named harbor.<sov> (gateway.aliasHarborHost) so an
      # operator who reaches for harbor.<sov> by intuition no longer hits a
      # bare-envoy 404 — but the launch-url / OIDC redirect_uri MUST remain
      # registry.<sov> (Harbor's externalURL), so do NOT flip this template.
      hostnameTemplate: "registry.{{.SovereignFQDN}}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
      # #3150 — silent-SSO OIDC-init path. Harbor core's OIDC onboarding route:
      # a GET to /c/oidc/login with no code 302s straight to Keycloak
      # (auth.<sov>/realms/sovereign/...?kc_idp_hint=catalyst-pin) → silent PIN
      # re-use → operator lands inside Harbor with no login form. Verified live
      # on hw124: GET /c/oidc/login → 302 auth.hw124.omani.works/realms/sovereign.
      ssoInitPath: "/c/oidc/login"
    - name: registry
      hostnameTemplate: "registry.{{.SovereignFQDN}}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: false
      ssoEnabled: false   # OCI clients authenticate via robot accounts / OIDC token endpoint, not silent SSO

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
      harbor-admins: admin
      harbor-developers: developer
      harbor-guests: guest
    silentLogin: true

  # ── G117.6: Multi-instance ─────────────────────────────────────────────
  # Singleton per Sovereign — one Harbor per Catalyst control plane.
  multiInstance:
    enabled: false
