apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-flux
spec:
  # 1.2.7 (#3735): proxy all 6 Flux controller images + flux-cli onto Harbor
  # proxy-ghcr/fluxcd; RollingUpdate(maxUnavailable:0) post-render patch on
  # source-controller eliminates the Recreate serving-gap (Ready 26→7 on hw157).
  version: 1.2.10
  card:
    title: Flux
    summary: GitOps engine — reconciles every Sovereign Blueprint HelmRelease from the local Gitea source. The continuous-reconciliation backbone of the platform.
    icon: flux.svg
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  class: platform-component
  lifecycle: experimental
  manifests:
    chart: bp-flux
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ""
          clusters: [mgmt-A, mgmt-B, dmz-A, dmz-B, rtz-A, rtz-B]
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  placementSchema:
    modes: [single-region]
    default: single-region
  endpoints: []
