apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-flux
  labels:
    catalyst.openova.io/section: pts-3-2-gitops-and-iac
spec:
  # 1.2.7 (#3735): proxy all 6 Flux controller images + flux-cli onto Harbor
  # proxy-ghcr/fluxcd; RollingUpdate(maxUnavailable:0) post-render patch on
  # source-controller eliminates the Recreate serving-gap (Ready 26→7 on hw157).
  version: 1.2.7
  card:
    title: flux
    summary: GitOps reconciler. One per vcluster (source + kustomize + helm controllers); host-level Flux per host cluster watches its bp-* OCI sources.
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  manifests:
    chart: ./chart
  depends: []
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        replication:
          backend: flux-git
          mode: async
        placement:
          tier: ''
          clusters:
            - mgmt-A
            - mgmt-B
            - dmz-A
            - dmz-B
            - rtz-A
            - rtz-B
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  multiInstance:
    enabled: false
