{{- /*
Function test of bp-network-policies (docs/RUNBOOKS.md section 4.5). `helm test` runs it.

The function of the chart is the object baseline-deny-metadata: no pod
without the exception label reaches the instance metadata address
169.254.169.254. The test Pod runs in functionTest.namespace (default
"default", which exists in every cluster) and carries no exception label.
It makes two requests:
  1. https://kubernetes.default.svc.cluster.local:443/version. Only the name
     lookup is judged: curl exit code 6 means cluster DNS did not resolve the
     name, and then the Pod has no working network and the second request
     would prove nothing. Any other exit code passes this request, because
     the object baseline-default-deny denies the connection itself when the
     namespace of the test is in enforcedNamespaces.
  2. http://169.254.169.254/. It passes when the connection is not made
     within 5 seconds (curl exit code 28, or 7 when it is refused). It fails
     when the address answers: then the deny does not hold.
It writes nothing.

It renders whenever enabled is true, with and without enforced namespaces,
because the deny object renders then. The Pod mounts no service-account
token. The image is the kubectl image the kit already pulls (bp-cnpg's
webhook gate), which carries curl; functionTest.image overrides it.
*/ -}}
{{- $ft := .Values.functionTest | default dict }}
{{- $testNamespace := $ft.namespace | default "default" }}
{{- if .Values.enabled }}
{{- $image := $ft.image | default "harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4" }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ $testNamespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    catalyst.openova.io/function-test: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 300
  automountServiceAccountToken: false
  containers:
    - name: function-test
      image: {{ $image | quote }}
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: HOME
          value: /tmp
        - name: TEST_NAMESPACE
          value: {{ $testNamespace | quote }}
        - name: DNS_URL
          value: "https://kubernetes.default.svc.cluster.local:443/version"
        - name: METADATA_URL
          value: "http://169.254.169.254/"
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          fail() { echo "FUNCTION-TEST fail {{ .Chart.Name }} $1"; exit 1; }
          curl -sS -k --connect-timeout 5 --max-time 10 -o /dev/null "${DNS_URL}" 2>/tmp/dns-error
          rc=$?
          if [ "${rc}" = 6 ]; then
            fail "cluster DNS did not resolve kubernetes.default.svc.cluster.local from ${TEST_NAMESPACE}: $(tr '\n' ' ' < /tmp/dns-error | cut -c1-160)"
          fi
          code="$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' "${METADATA_URL}" 2>/tmp/error)"
          rc=$?
          case "${rc}" in
            28|7) ;;
            0) fail "a Pod in ${TEST_NAMESPACE} reached ${METADATA_URL} (HTTP ${code}): the deny of the instance metadata address does not hold" ;;
            *) fail "the request to ${METADATA_URL} ended with curl exit code ${rc} (HTTP ${code}): $(tr '\n' ' ' < /tmp/error | cut -c1-160)" ;;
          esac
          echo "FUNCTION-TEST pass {{ .Chart.Name }} a Pod in ${TEST_NAMESPACE} resolved cluster DNS but could not connect to ${METADATA_URL} (curl exit code ${rc})"
  volumes:
    - name: tmp
      emptyDir: {}
{{- end }}
