{{/*
Catalyst control-plane namespaces stay fully reachable. Without these
exemptions, default-deny would cut Flux from kube-apiserver, Cilium
operator from etcd, cert-manager from external ACME, etc. — every
Sovereign would be unreachable within minutes.

Per docs/EPICS-1-6-unified-design.md §3.9 row 8.
*/}}
{{- if and .Values.enabled .Values.allowSystemNamespaces -}}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: 10-allow-system-namespaces
  labels:
    app.kubernetes.io/name: bp-network-policies
    app.kubernetes.io/component: zero-trust-allow
    catalyst.openova.io/policy-tier: allow-system
spec:
  description: |
    Full ingress + egress for Catalyst control-plane namespaces. The set
    is parametric (.Values.allowSystemNamespaces) so per-Sovereign
    overlays can extend it (e.g. add `gitea`, `harbor`, `loki` if those
    live in their own namespaces).
  # Apply this allow rule to Pods in any of the listed namespaces.
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
          {{- range .Values.allowSystemNamespaces }}
          - {{ . | quote }}
          {{- end }}
  # 1.0.4 (Refs #3188, 2026-06-10): full reachability for control-plane
  # namespaces must use the reserved entity `all`, NOT a bare `{}` rule.
  # In Cilium a `{}` ingress/egress rule matches only Pod ENDPOINTS — it
  # does NOT cover the reserved entities (`kube-apiserver`, `host`,
  # `remote-node`, `world`). Under `00-default-deny`, that left every
  # control-plane Pod (kyverno, flux, cert-manager, …) unable to reach the
  # kube-apiserver ClusterIP (10.96.0.1 → identity `kube-apiserver`),
  # the host, or external endpoints — kyverno's admission webhook lost its
  # endpoints and its failurePolicy=Fail then blocked every Pod mutation
  # cluster-wide. `all` = every endpoint + every reserved entity + world,
  # which is the documented "full ingress/egress" intent for this coarse
  # control-plane safety net. (The working bp-external-dns-apiserver CNP
  # uses the same `toEntities` idiom for apiserver egress.)
  ingress:
    - fromEntities:
        - all
  egress:
    - toEntities:
        - all
{{- end -}}
