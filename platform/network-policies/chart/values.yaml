# Master gate. true (the default) renders the baseline of this chart.
# false renders nothing at all.
#
# The baseline is ONE object, `baseline-deny-metadata`: no pod reaches the
# instance metadata address 169.254.169.254. It puts no pod under default
# deny, so every other flow of a pod stays as it was. A workload that must
# read the address sets this label in its own pod template:
#   network.openova.io/metadata-access: "true"
enabled: true

# The namespaces under default deny. Empty (the default): no pod of the
# cluster is under default deny, and the chart renders the baseline only.
#
# A namespace in this list is selected by the object `baseline-default-deny`:
# nothing enters its pods, and the one flow that leaves them is DNS to the
# cluster resolver. Its own allow object `allow-<namespace>`, written in
# templates/allow/<namespace>.yaml, renders only while the namespace is in
# this list. Each entry is a namespace name (an RFC 1123 label); another
# value stops the render. The rule template of an allow file and the rule
# for later namespaces are in templates/allow/_README.tpl.
enforcedNamespaces: []
