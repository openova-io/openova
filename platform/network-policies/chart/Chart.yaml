apiVersion: v2
name: bp-network-policies
# 1.0.3 (G101 Refs #2650, 2026-06-01): default-deny flipped from
# operator-opt-in to mandatory-on. Zero-trust posture is the canonical
# Sovereign default per ADR-0001 §2 + DoD §A5. allowSystemNamespaces
# expanded from 8 → 45 namespaces covering every targetNamespace
# declared in clusters/_template/bootstrap-kit/*.yaml plus the 3
# vCluster syncer namespaces (dmz/mgmt/rtz). bootstrap-kit slot 26
# installs this Blueprint by default so every fresh prov has zero-trust
# from boot. Per-Blueprint CNPs progressively tighten beyond this
# coarse safety net.
# 1.0.2 (initial — operator-opt-in).
version: 1.0.4
description: |
  Catalyst zero-trust default-deny CiliumClusterwideNetworkPolicy +
  allow-templates for control-plane namespaces, intra-namespace traffic,
  and CoreDNS egress. Default ON per docs/DOD.md §A5 (zero-trust) +
  ADR-0001 §2 — every fresh Sovereign installs default-deny from boot;
  operator MAY override per Sovereign overlay.
type: application
keywords: [catalyst, blueprint, network-policy, cilium, zero-trust]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Annotations:
#
# - catalyst.openova.io/no-upstream: "true"
#   Opt out of the hollow-chart guard (Blueprint-Release workflow / issue
#   #181): this chart legitimately ships only Catalyst-authored CRs
#   (default-deny CiliumClusterwideNetworkPolicy + allow-templates that
#   target the cilium.io CRDs installed by bp-cilium). It has NO upstream
#   Helm subchart to bundle. Same shape as bp-kyverno-policies (PR #2023)
#   and bp-continuum (PR #2081).
#
# - catalyst.openova.io/smoke-render-mode: default-off RETIRED at 1.0.3
#   The 1.0.2 default `enabled: false` made the smoke-render output
#   too short. 1.0.3 (G101) flipped the default to `enabled: true`, so
#   the chart now renders its full output (default-deny + DNS-egress
#   + system-namespaces allow templates) without operator overlay. The
#   smoke-render annotation is no longer needed.
annotations:
  catalyst.openova.io/no-upstream: "true"
