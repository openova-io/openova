apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-network-policies
  labels:
    catalyst.openova.io/section: pts-3-1-networking-and-service-mesh
spec:
  version: 1.0.10
  card:
    title: Network Policies (zero-trust baseline)
    summary: |
      Cluster-wide Cilium policies: the instance metadata address denied to
      every pod, and default deny with one hand-written allow object per
      namespace listed in enforcedNamespaces.
    family: networking
    documentation: ./README.md
  visibility: unlisted
  owner:
    team: platform
    contact: platform@openova.io
  configSchema:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
        description: Master gate. false renders nothing at all.
      enforcedNamespaces:
        type: array
        description: Namespaces under default deny. Each one gets the allow object of its file templates/allow/<namespace>.yaml.
        items:
          type: string
        default: []
  placementSchema:
    modes: [single-region, active-active]
    default: active-active
    minRegions: 1
    maxRegions: 5
  manifests:
    chart: ./chart
  depends:
    - blueprint: bp-cilium
      version: ^1
  upgrades:
    from: ["0.x"]
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        replication:
          backend: flux-git
          mode: async
        placement:
          tier: ''
          clusters:
            - mgmt-A
            - mgmt-B
            - dmz-A
            - dmz-B
            - rtz-A
            - rtz-B
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  multiInstance:
    enabled: false
