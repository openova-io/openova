apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-gateway-api
  labels:
    catalyst.openova.io/category: per-host-cluster-infrastructure
    catalyst.openova.io/section: pts-3-1-networking-and-service-mesh
spec:
  version: 1.1.0
  card:
    title: Gateway API
    summary: |
      Upstream Kubernetes Gateway API CRDs (Experimental channel, v1.1.0) — the
      gateway.networking.k8s.io/v1 family that every HTTPRoute/Gateway/
      GatewayClass-using Blueprint depends on. Cilium 1.16's `gatewayAPI.
      enabled=true` flag wires up the cilium controller but does NOT
      install these CRDs — that's why this Blueprint exists as an explicit,
      auditable dependency edge in the bootstrap-kit DAG.
    icon: kubernetes.svg
    category: infrastructure
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  configSchema:
    type: object
    properties: {}
  placementSchema:
    modes: [single-region, active-active]
    default: active-active           # CRDs are cluster-scoped, install on every host cluster
  manifests:
    chart: ./chart
  depends: []                        # foundational — must precede every HTTPRoute-using Blueprint
  upgrades:
    from: ["0.x"]
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        replication:
          backend: flux-git
          mode: async
        placement:
          tier: ''
          clusters:
            - mgmt-A
            - mgmt-B
            - dmz-A
            - dmz-B
            - rtz-A
            - rtz-B
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  multiInstance:
    enabled: false
