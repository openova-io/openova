apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-gateway-api
spec:
  version: 1.3.1
  card:
    title: Gateway API
    summary: Kubernetes Gateway API CRDs (GatewayClass/Gateway/HTTPRoute) — the north-south traffic contract every Sovereign endpoint is exposed through via Cilium.
    icon: gateway-api.svg
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  class: platform-component
  lifecycle: experimental
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-gateway-api
  upgrades:
    from: ["0.x"]
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ""
          clusters: [mgmt-A, mgmt-B, dmz-A, dmz-B, rtz-A, rtz-B]
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  endpoints: []
