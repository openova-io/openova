{{/*
The one JetStream Stream of the platform: CATALYST_ORG, subjects
`catalyst.>`, the stream of contract C3 (docs/contracts/C3-event-subjects.yaml,
key `stream`). The JetStream controller of the nack subchart creates it from
this object. No Go code creates a stream: core/services/shared/events binds to
this one at start and fails while it is absent. Its values are the ones that
code used to create it with: file storage, limits retention, 14 days, one
replica. tests/catalyst-org-stream.sh holds the chart and the code to them.
*/}}
{{- if .Values.catalystStreams.enabled }}
---
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: catalyst-org
  labels: {{- include "catalyst-nats.labels" . | nindent 4 }}
spec:
  name: CATALYST_ORG
  subjects: ["catalyst.>"]
  storage: file
  retention: limits
  maxAge: "336h"
  replicas: 1
  discard: old
{{- end }}
