{{- /*
Function test of bp-nats-jetstream (docs/RUNBOOKS.md section 4.5). `helm test` runs it.

It creates a scratch stream with file storage, publishes one message to it
and checks the stream's acknowledgement, creates a pull consumer, reads the
message back through that consumer and compares it, then deletes the stream
(which deletes the consumer). The image is the nats-box image the nats
subchart already ships, which carries the nats command-line tool.

It dials the Service of the nats subchart, <fullname>:<port>, with <fullname>
computed the way the subchart computes it. The chart has no master gate, so the
test always renders.
*/ -}}
{{- $sub := .Values.nats | default dict }}
{{- $name := $sub.nameOverride | default "nats" }}
{{- $fullname := "" }}
{{- if $sub.fullnameOverride }}
{{- $fullname = $sub.fullnameOverride | trunc 63 | trimSuffix "-" }}
{{- else if contains $name .Release.Name }}
{{- $fullname = .Release.Name | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- $fullname = printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- $port := dig "config" "nats" "port" 4222 $sub }}
{{- $img := dig "natsBox" "container" "image" dict $sub }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    catalyst.openova.io/function-test: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 300
  automountServiceAccountToken: false
  containers:
    - name: function-test
      image: {{ printf "%s/%s:%s" $img.registry $img.repository (toString $img.tag) | quote }}
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      env:
        - name: NATS_URL
          value: {{ printf "nats://%s.%s.svc.cluster.local:%v" $fullname .Release.Namespace $port | quote }}
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -u
          fail() { echo "FUNCTION-TEST fail {{ .Chart.Name }} $1"; exit 1; }
          oneline() { printf '%s' "$1" | tr '\n' ' ' | cut -c1-200; }
          id="$(date +%s)_$$"
          stream="FUNCTION_TEST_${id}"
          subject="function-test.${id}"
          body="function test message ${id}"
          out="$(nats --server "${NATS_URL}" stream add "${stream}" --subjects "${subject}" --storage file --replicas 1 --defaults 2>&1)" || fail "stream add on ${NATS_URL} failed: $(oneline "${out}")"
          # From here every failure deletes the scratch stream, then fails.
          undo() { nats --server "${NATS_URL}" stream rm "${stream}" -f >/dev/null 2>&1; fail "$1"; }
          # A request to a stream subject is answered by JetStream with its acknowledgement: {"stream":"<name>","seq":<n>}.
          out="$(nats --server "${NATS_URL}" request "${subject}" "${body}" --raw 2>&1)" || undo "publish failed: $(oneline "${out}")"
          case "${out}" in
            *"\"stream\":\"${stream}\""*) ;;
            *) undo "the publish was not acknowledged by stream ${stream}: $(oneline "${out}")" ;;
          esac
          out="$(nats --server "${NATS_URL}" consumer add "${stream}" reader --pull --deliver all --ack explicit --defaults 2>&1)" || undo "consumer add failed: $(oneline "${out}")"
          out="$(nats --server "${NATS_URL}" consumer next "${stream}" reader --count 1 --raw 2>/tmp/error)" || undo "consumer next failed: $(oneline "$(cat /tmp/error)")"
          [ "${out}" = "${body}" ] || undo "the pull consumer returned '$(oneline "${out}")', not the message published"
          out="$(nats --server "${NATS_URL}" stream rm "${stream}" -f 2>&1)" || fail "stream rm ${stream} failed: $(oneline "${out}")"
          echo "FUNCTION-TEST pass {{ .Chart.Name }} stream ${stream} on ${NATS_URL} acknowledged one message, a pull consumer read it back, and the stream was deleted"
