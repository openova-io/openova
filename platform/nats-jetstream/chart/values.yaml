# Catalyst Blueprint umbrella metadata — the upstream chart is now resolved
# as a Helm subchart via Chart.yaml `dependencies:`. This values.yaml carries
# both:
#   1. The catalystBlueprint metadata block (provenance + version) so
#      observability/audit pipelines can inspect the artifact and report
#      which upstream chart + version is bundled.
#   2. The upstream subchart values overlay under the `nats:` key
#      (umbrella-chart convention — the dependency name from Chart.yaml is
#      the values namespace).

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). The upstream nats subchart
  # exposes `nats.container.image.repository` for registry override.
  # Per-Sovereign overlays wire that alongside this value. Tracked under #560.
  imageRegistry: ""

catalystBlueprint:
  upstream: { chart: nats, version: "1.2.0", repo: "https://nats-io.github.io/k8s/helm/charts" }

# ─── Upstream chart values (subchart key: nats) ───────────────────────────
# Generated by docs/PROVISIONING-PLAN.md tickets [F] chart Pass 105+.
nats:
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
  container:
    # #4347 — the nats SERVER image must route through the Sovereign-local
    # Harbor dockerhub proxy so it satisfies the cluster-wide Kyverno
    # `harbor-proxy-pull` Enforce ClusterPolicy (every container image must
    # match glob `*/proxy-*/*` or `*/openova-io/*`). Post-#4325 this chart
    # installs into the native host namespace `nats-system` where that policy
    # applies. `nats` is an OFFICIAL (library) dockerhub image, so the proxy
    # path is `proxy-dockerhub/library/nats` (mirrors platform/openbao +
    # keycloak `proxy-dockerhub/library/*`). The nats.image helper composes
    # `<registry>/<repository>:<tag>` → harbor.openova.io/proxy-dockerhub/
    # library/nats:2.10.16-alpine. Tag unchanged.
    image:
      registry: harbor.openova.io
      repository: proxy-dockerhub/library/nats
    # #4343 — the vendored nats 1.2.0 chart renders each container via the
    # file-based `loadMergePatch` helper, which consumes ONLY `.merge` (and
    # `.patch`) — NOT the top-level container dict. A bare `container.resources`
    # is therefore SILENTLY DROPPED and the nats server container rendered with
    # NO resources.requests. Pre-#4325 this chart ran INSIDE a vCluster where
    # the host's Kyverno `resource-requests` Enforce ClusterPolicy didn't reach
    # it, masking the gap; after the de-vcluster migration it installs into the
    # native host namespace and the StatefulSet admission is DENIED. Resources
    # MUST live under `container.merge.resources` to actually reach the pod.
    # (The nats server container already ships liveness+readiness probes from
    # the upstream chart — gated on `config.monitor.enabled: true`, which is
    # the default — so it already satisfies the host-ns `probes-present`
    # Enforce policy and needs no probe injection here.)
    merge:
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 1Gi }
  # #4343 — the config-reloader sidecar (upstream default `reloader.enabled:
  # true`) shares the StatefulSet pod and its base container template ships NO
  # resources. Set them via the same `merge` knob so the sidecar carries
  # requests.
  reloader:
    # #4347 — route the reloader image through the Harbor dockerhub proxy
    # (`harbor-proxy-pull` Enforce). `natsio/nats-server-config-reloader` is a
    # namespaced (non-library) dockerhub repo, so the proxy path keeps the
    # `natsio/` segment: proxy-dockerhub/natsio/nats-server-config-reloader.
    # The nats.image helper composes <registry>/<repository>:<tag>. Tag kept.
    image:
      registry: harbor.openova.io
      repository: proxy-dockerhub/natsio/nats-server-config-reloader
    merge:
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 64Mi }
      # #4347 — the reloader sidecar has NO serving/health HTTP port (it's a
      # file-watcher that signals the nats-server via a PID file), so the
      # host-ns Kyverno `probes-present` Enforce policy (which requires BOTH
      # liveness + readiness on every Deployment/StatefulSet/DaemonSet
      # container) was DENYING the StatefulSet. The image is alpine-based (NOT
      # distroless — verified: ships /bin/sh + busybox `pidof`), and the
      # entrypoint `exec`s the binary as PID 1, so a meaningful exec probe is
      # `pidof nats-server-config-reloader` — it proves the watcher process is
      # alive without any network dependency (never flaps on broker state).
      livenessProbe:
        exec:
          command: ["/bin/sh", "-c", "pidof nats-server-config-reloader >/dev/null"]
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        exec:
          command: ["/bin/sh", "-c", "pidof nats-server-config-reloader >/dev/null"]
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
  # #4343 — the nats-box utility Deployment (upstream default `natsBox.enabled:
  # true`) is a separate workload whose base container template ships NO
  # resources. Set them via `natsBox.container.merge` so its single container
  # carries requests.
  natsBox:
    container:
      # #4347 — route the nats-box image through the Harbor dockerhub proxy
      # (`harbor-proxy-pull` Enforce). `natsio/nats-box` is a namespaced
      # dockerhub repo, so the proxy path keeps the `natsio/` segment:
      # proxy-dockerhub/natsio/nats-box. Tag kept.
      image:
        registry: harbor.openova.io
        repository: proxy-dockerhub/natsio/nats-box
      merge:
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 64Mi }
        # #4347 — nats-box is a debug toolbox Deployment whose only workload is
        # a `sleep infinity` keep-alive (no serving port), so it shipped with
        # NO probes and the host-ns Kyverno `probes-present` Enforce policy
        # DENIED the Deployment. The image is alpine/busybox-based (verified:
        # ships /bin/sh + `pidof`); PID 1 is `sh` running the keep-alive with
        # `sleep` as its child. A meaningful, non-flapping exec probe is
        # `pidof sleep` — it proves the box's keep-alive is alive. Deliberately
        # NOT coupled to broker reachability: a debug toolbox must not flip
        # NotReady whenever the NATS server restarts.
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "pidof sleep >/dev/null"]
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "pidof sleep >/dev/null"]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
  # Prometheus exporter + PodMonitor — DEFAULT OFF.
  #
  # Per docs/INVIOLABLE-PRINCIPLES.md #4 and docs/BLUEPRINT-AUTHORING.md
  # §11.2 (Observability toggles must default false). The upstream nats
  # chart's `promExporter.podMonitor.enabled` renders a
  # monitoring.coreos.com/v1 PodMonitor which the apiserver rejects on a
  # fresh Sovereign before bp-kube-prometheus-stack ships the CRD.
  # Upstream already defaults both to false — set explicitly so a
  # future upstream bump cannot regress this. Operator opts in via
  # per-cluster overlay (issue #182).
  promExporter:
    enabled: false
    podMonitor:
      enabled: false

# ─── Catalyst-curated JetStream Streams + KV buckets ─────────────────────
#
# Reconciled by NACK (nats-io/nack) when it's installed in the same
# cluster. NACK is NOT a current dependency of this chart — install it
# as a sibling Blueprint, then flip `enabled: true` here.
#
# Per docs/EPICS-1-6-unified-design.md §3.9 row 7 + ADR-0001 §6,
# Catalyst's own events flow on these streams:
#   catalyst.audit  / catalyst.events / catalyst.billing  → Stream CRs
#   idempotency / dr-leases / policy-rollup               → KeyValue CRs
#
# Per-Org and per-Application streams are created at runtime by
# organization-controller (slice C1) and application-controller (slice
# C4), not statically here.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every retention
# value is a variable and operator-overrideable.
catalystStreams:
  # Wave 5.50 (#2278) flipped default false -> true. Catalyst's compliance
  # scorer (#1096 Wave 5.44 NATS KV publisher), idempotency keys
  # (HTTP write paths), and DR-lease witness (#1101 Continuum) all
  # depend on the 3 KV buckets that kv-buckets.yaml renders. Without
  # this gate flipped, those buckets never materialise → Wave 5.44
  # publisher Put auto-creates the bucket on first use but loses the
  # chart-defined TTL/maxBytes config. Per-Sovereign overlays MAY set
  # `false` to opt-out, but the default Sovereign experience requires
  # these primitives.
  enabled: true
  # Wave 5.52 (#2283) sub-gate: the 3 chart-managed Streams
  # (catalyst-audit / catalyst-events / catalyst-billing) architecturally
  # conflict with the in-code CATALYST_ORG wildcard stream that
  # core/services/shared/events/nats.go declares with subjects
  # `catalyst.>`. Default-OFF preserves the current production shape
  # (CATALYST_ORG + FilterSubject consumers per t20 fix). Operators
  # opt-in only when migrating org-services/billing to the 3-stream model per
  # original ADR-0001 §6 design. Surfaced live on hw01 2026-05-24T06:30Z
  # when Wave 5.50 rolled chart 1.3.1 and both attempted to claim
  # overlapping subjects → upgrade ROLLBACK fired.
  streamsEnabled: false
  # JetStream replication factor. R=3 is the bank-tier default for
  # in-region quorum; the DR Mirror to a second region is a separate
  # follow-up wired by Continuum (#1101).
  replicas: 3
  # Override the upstream nats Service URL — defaults to
  # nats://<release>-nats.<release-namespace>.svc.cluster.local:4222
  servers: ""
  audit:
    # 90 days. Audit-log retention horizon.
    maxAge: "2160h"
    maxBytes: -1
    duplicateWindow: "5m"
    placement: {}
  events:
    # 24 hours. Cross-replica fan-out + cold-start replay window.
    maxAge: "24h"
    maxBytes: -1
  billing:
    # 1 year. Billing reconciliation horizon.
    maxAge: "8760h"
    maxBytes: -1
  idempotency:
    ttl: "24h"
    # 256 MiB upper bound on the bucket.
    maxBytes: 268435456
  drLeases:
    # 60 seconds — matches Continuum.spec.leaseClient.config.ttlSeconds
    # default. DR-quorum lease path; Cloudflare-KV path bypasses this.
    ttl: "60s"
  policyRollup:
    # 7 days. Replayable window for the compliance scorer.
    ttl: "168h"
    # 1 GiB upper bound.
    maxBytes: 1073741824

# ─── nack subchart values (Wave 5.45 #2254) ──────────────────────────────
# Installs the JetStream Controller + KeyValue/Stream/Consumer/ObjectStore
# CRDs that bp-nats-jetstream's kv-buckets.yaml + streams.yaml render
# against. Without nack the broker is Running but no CRs reconcile.
#
# The chart's default deploys nack as 'jetstream' Deployment in the
# release namespace (nats-system). Watch namespace empty = cluster-wide.
nack:
  enabled: true
  # #4343 — the nack jetstream-controller container reads its resources from
  # the TOP-LEVEL `resources` key (`{{- with .Values.resources }}` in
  # deployment-jetstream-controller.yml), NOT `jetstream.resources` — the
  # latter is inert. Setting it here is what actually gives the `jsc` container
  # requests, so it clears the host-ns Kyverno `resource-requests` Enforce
  # policy (post-#4325). Modest controller request.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  jetstream:
    # #4347 — route the jetstream-controller image through the Harbor
    # dockerhub proxy (`harbor-proxy-pull` Enforce). The jsc.image helper
    # composes `<registry>/<repository>:<tag>`; with the tag left empty it
    # falls back to the nack subchart `.Chart.AppVersion` (0.23.0 for chart
    # 0.34.0). `natsio/jetstream-controller` is a namespaced dockerhub repo,
    # so the proxy path keeps the `natsio/` segment.
    image:
      registry: harbor.openova.io
      repository: proxy-dockerhub/natsio/jetstream-controller
    # #4347 — the nack 0.29.0 jetstream-controller Deployment template had NO
    # livenessProbe/readinessProbe hook and exposed no health port, so the
    # host-ns Kyverno `probes-present` Enforce policy DENIED the Deployment and
    # there was NO values knob to inject probes. The clean upstream-native fix
    # is the nack 0.34.0 dependency bump (Chart.yaml): its
    # deployment-jetstream-controller.yml renders an HTTP `/healthz` liveness +
    # `/readyz` readiness probe on port 8081 — BUT only when the controller
    # runs its controller-runtime backend, which also binds the health probe
    # address (`--health-probe-bind-address=:8081`). `controlLoop: true` is the
    # flag that enables that backend AND the probe block in one switch. This is
    # the upstream-recommended reconcile path; it needs no shell/exclusion.
    controlLoop: true
    # Point at the broker subchart's Service. Same-namespace, no auth
    # required (NATS auth is operator-config'd separately if at all).
    nats:
      url: "nats://nats-jetstream:4222"
    # Modest defaults at solo-Sovereign scale. Bump replicas via overlay
    # when HA is sized.
    replicas: 1
  # No webhook or PodMonitor for the controller in our solo profile.
  podMonitor:
    enabled: false
