# Catalyst Blueprint umbrella metadata — the upstream chart is now resolved
# as a Helm subchart via Chart.yaml `dependencies:`. This values.yaml carries
# both:
#   1. The catalystBlueprint metadata block (provenance + version) so
#      observability/audit pipelines can inspect the artifact and report
#      which upstream chart + version is bundled.
#   2. The upstream subchart values overlay under the `nats:` key
#      (umbrella-chart convention — the dependency name from Chart.yaml is
#      the values namespace).

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). The upstream nats subchart
  # exposes `nats.container.image.repository` for registry override.
  # Per-Sovereign overlays wire that alongside this value. Tracked under #560.
  imageRegistry: ""

catalystBlueprint:
  upstream: { chart: nats, version: "1.2.0", repo: "https://nats-io.github.io/k8s/helm/charts" }

# ─── Upstream chart values (subchart key: nats) ───────────────────────────
# Generated by docs/PROVISIONING-PLAN.md tickets [F] chart Pass 105+.
nats:
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
  container:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
  # Prometheus exporter + PodMonitor — DEFAULT OFF.
  #
  # Per docs/INVIOLABLE-PRINCIPLES.md #4 and docs/BLUEPRINT-AUTHORING.md
  # §11.2 (Observability toggles must default false). The upstream nats
  # chart's `promExporter.podMonitor.enabled` renders a
  # monitoring.coreos.com/v1 PodMonitor which the apiserver rejects on a
  # fresh Sovereign before bp-kube-prometheus-stack ships the CRD.
  # Upstream already defaults both to false — set explicitly so a
  # future upstream bump cannot regress this. Operator opts in via
  # per-cluster overlay (issue #182).
  promExporter:
    enabled: false
    podMonitor:
      enabled: false

# ─── Catalyst-curated JetStream Streams + KV buckets ─────────────────────
#
# Reconciled by NACK (nats-io/nack) when it's installed in the same
# cluster. NACK is NOT a current dependency of this chart — install it
# as a sibling Blueprint, then flip `enabled: true` here.
#
# Per docs/EPICS-1-6-unified-design.md §3.9 row 7 + ADR-0001 §6,
# Catalyst's own events flow on these streams:
#   catalyst.audit  / catalyst.events / catalyst.billing  → Stream CRs
#   idempotency / dr-leases / policy-rollup               → KeyValue CRs
#
# Per-Org and per-Application streams are created at runtime by
# organization-controller (slice C1) and application-controller (slice
# C4), not statically here.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every retention
# value is a variable and operator-overrideable.
catalystStreams:
  # Wave 5.50 (#2278) flipped default false -> true. Catalyst's compliance
  # scorer (#1096 Wave 5.44 NATS KV publisher), idempotency keys
  # (HTTP write paths), and DR-lease witness (#1101 Continuum) all
  # depend on the 3 KV buckets that kv-buckets.yaml renders. Without
  # this gate flipped, those buckets never materialise → Wave 5.44
  # publisher Put auto-creates the bucket on first use but loses the
  # chart-defined TTL/maxBytes config. Per-Sovereign overlays MAY set
  # `false` to opt-out, but the default Sovereign experience requires
  # these primitives.
  enabled: true
  # Wave 5.52 (#2283) sub-gate: the 3 chart-managed Streams
  # (catalyst-audit / catalyst-events / catalyst-billing) architecturally
  # conflict with the in-code CATALYST_ORG wildcard stream that
  # core/services/shared/events/nats.go declares with subjects
  # `catalyst.>`. Default-OFF preserves the current production shape
  # (CATALYST_ORG + FilterSubject consumers per t20 fix). Operators
  # opt-in only when migrating sme/billing to the 3-stream model per
  # original ADR-0001 §6 design. Surfaced live on hw01 2026-05-24T06:30Z
  # when Wave 5.50 rolled chart 1.3.1 and both attempted to claim
  # overlapping subjects → upgrade ROLLBACK fired.
  streamsEnabled: false
  # JetStream replication factor. R=3 is the bank-tier default for
  # in-region quorum; the DR Mirror to a second region is a separate
  # follow-up wired by Continuum (#1101).
  replicas: 3
  # Override the upstream nats Service URL — defaults to
  # nats://<release>-nats.<release-namespace>.svc.cluster.local:4222
  servers: ""
  audit:
    # 90 days. Audit-log retention horizon.
    maxAge: "2160h"
    maxBytes: -1
    duplicateWindow: "5m"
    placement: {}
  events:
    # 24 hours. Cross-replica fan-out + cold-start replay window.
    maxAge: "24h"
    maxBytes: -1
  billing:
    # 1 year. Billing reconciliation horizon.
    maxAge: "8760h"
    maxBytes: -1
  idempotency:
    ttl: "24h"
    # 256 MiB upper bound on the bucket.
    maxBytes: 268435456
  drLeases:
    # 60 seconds — matches Continuum.spec.leaseClient.config.ttlSeconds
    # default. DR-quorum lease path; Cloudflare-KV path bypasses this.
    ttl: "60s"
  policyRollup:
    # 7 days. Replayable window for the compliance scorer.
    ttl: "168h"
    # 1 GiB upper bound.
    maxBytes: 1073741824

# ─── nack subchart values (Wave 5.45 #2254) ──────────────────────────────
# Installs the JetStream Controller + KeyValue/Stream/Consumer/ObjectStore
# CRDs that bp-nats-jetstream's kv-buckets.yaml + streams.yaml render
# against. Without nack the broker is Running but no CRs reconcile.
#
# The chart's default deploys nack as 'jetstream' Deployment in the
# release namespace (nats-system). Watch namespace empty = cluster-wide.
nack:
  enabled: true
  jetstream:
    # Point at the broker subchart's Service. Same-namespace, no auth
    # required (NATS auth is operator-config'd separately if at all).
    nats:
      url: "nats://nats-jetstream:4222"
    # Modest defaults at solo-Sovereign scale. Bump replicas via overlay
    # when HA is sized.
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  # No webhook or PodMonitor for the controller in our solo profile.
  podMonitor:
    enabled: false
