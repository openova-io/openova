apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-nats-jetstream
spec:
  version: 1.3.9
  card:
    title: NATS JetStream
    summary: Event spine for the Catalyst control plane — JetStream Streams + KV + Object Store via the bundled nack JetStream Controller. Per-Organization Accounts.
    icon: nats.svg
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  class: platform-component
  lifecycle: experimental

  manifests:
    chart: bp-nats-jetstream

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive. Within mgmt: 3-node JetStream cluster
  #   (Raft). Cross-cluster: NATS leaf-node tunnel only — streams NOT
  #   replicated by default. Switchover: bp-continuum leaf-node retarget +
  #   DNS flip; in-flight messages on lost region drop unless stream.mirror
  #   enabled.
  topology:
    supported: [active-passive, singleton]
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: none
          mode: async
          lagSloSeconds: 30
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 30
        placement:
          tier: ''
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ''
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # internal-only — `nats://nats:4222` from in-cluster clients.
  endpoints: []

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # NATS client auth is account/credential-based (NKEYS / JWTs), not OIDC.
  # Realm declared for admission-webhook completeness; no silent login.
  sso:
    realm: sovereign
    protocolMapper: oidc
    silentLogin: false

  placementSchema:
    modes: [single-region]
    default: single-region
