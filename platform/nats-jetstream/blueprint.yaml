apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-nats-jetstream
  labels:
    catalyst.openova.io/section: pts-2-3-per-sovereign-supporting-services
    catalyst.openova.io/tier: catalyst-cp
spec:
  version: 1.3.3
  card:
    title: nats-jetstream
    summary: Event spine for the Catalyst control plane. JetStream Streams + KV + Object Store via bundled nack JetStream Controller (Wave 5.45 #2254). Per-Organization Accounts. Replaces what was previously specified as Redpanda + Valkey for the control plane.
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  # ── #3373: class-level placement SUGGESTION + allow-list ────────────────
  # Placement is an INSTANCE property (Application.spec.placement); this is
  # only the default every instance inherits silently — the provisioning
  # journey's generic advanced selector (and a direct Git edit of the
  # instance's spec.placement) may override it within allowedPlacements.
  # Founder §4 table target: mgmt. Single render mechanism: the Flux
  # spec.kubeConfig.secretRef pivot — zero per-app placement code.
  defaultPlacement:
    vcluster: mgmt
  allowedPlacements: [host, mgmt]

  manifests:
    chart: ./chart
  depends: []

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive. Within mgmt: 3-node JetStream cluster
  #   (Raft). Cross-cluster: NATS leaf-node tunnel only — streams NOT
  #   replicated by default. Switchover: bp-continuum leaf-node retarget +
  #   DNS flip; in-flight messages on lost region drop unless stream.mirror
  #   enabled.
  topology:
    supported:
      - active-passive
      - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: raft
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 60
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # internal-only — `nats://nats:4222` from in-cluster clients.
  endpoints: []

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # NATS client auth is account/credential-based (NKEYS / JWTs), not OIDC.
  # Realm declared for admission-webhook completeness; no silent login.
  sso:
    realm: sovereign
    protocolMapper: oidc
    silentLogin: false

  # ── G117.6: Multi-instance ─────────────────────────────────────────────
  multiInstance:
    enabled: false
