{{- /*
clustersecretstore-peers.yaml — one ClusterSecretStore per PEER region
(ADR-0015, Refs #7067).

Every region runs its own OpenBao. `vault-region1` stays THIS region's store
(every ExternalSecret reads it). A multi-region Application's primary writes
its shared material into every region's OpenBao: into its own through
`vault-region1`, into each peer's through `vault-<peer-region-id>` below, so
the peer's ExternalSecrets, reading the peer's own store, find it.

  vault-<peer>   server http://openbao-<peer>.openbao.svc.cluster.local:8200 —
                 bp-openbao's ClusterMesh-global per-region Service; in this
                 region it is a selector-less stub, so the dial reaches only
                 the peer's OpenBao. Auth: jwt mount `jwt-peer-<self>` on the
                 peer, role openbao-peer-push (write-only on
                 secret/openova/apps/*), with the token below.
  openbao-peer-push-token
                 an identity token signed by THIS region's OpenBao
                 (identity/oidc/token/openbao-peer-push, aud openbao-peer-push,
                 claim openova_region=<self>), minted by the ESO
                 VaultDynamicSecret generator via the k8s-auth role
                 openbao-peer-token and refreshed every `tokenRefreshInterval`
                 (the token lives `peerTrust.tokenTTL`, default 1h). The peer
                 verifies it against this region's public issuer keys, which
                 it discovers over the mesh — no key is copied between regions.

Inputs come from the region registry (bootstrap-kit 15a threads
SOVEREIGN_REGION_CANONICAL_LABEL and SOVEREIGN_REGIONS_JSON). Skip-render when
the registry names no region other than self: single-region output unchanged.
*/ -}}
{{- $ps := .Values.peerStores | default dict -}}
{{- $pt := include "bp-external-secrets-stores.peers" . | fromJson -}}
{{- if $pt.peers }}
{{- $css := .Values.clusterSecretStore | default dict -}}
{{- $kAuth := $css.kubernetesAuth | default dict -}}
{{- $localServer := $css.server | default "http://openbao.openbao.svc.cluster.local:8200" -}}
{{- $kvPath := $css.path | default "secret" -}}
{{- $kvVersion := $css.version | default "v2" -}}
{{- $saName := $kAuth.serviceAccountName | default "external-secrets" -}}
{{- $saNs := $kAuth.serviceAccountNamespace | default "external-secrets-system" -}}
{{- $prefix := $ps.namePrefix | default "vault-" -}}
{{- $svcPrefix := $ps.servicePrefix | default "openbao-" -}}
{{- $baoNs := $ps.openbaoNamespace | default "openbao" -}}
{{- $aud := $ps.audience | default "openbao-peer-push" -}}
{{- $tokenSecret := $ps.tokenSecretName | default "openbao-peer-push-token" }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: {{ $tokenSecret | quote }}
  namespace: {{ $saNs | quote }}
  labels:
    catalyst.openova.io/component: external-secrets
    catalyst.openova.io/secret-backend: openbao
spec:
  method: GET
  path: {{ printf "identity/oidc/token/%s" $aud | quote }}
  resultType: Data
  provider:
    server: {{ $localServer | quote }}
    auth:
      kubernetes:
        mountPath: {{ $kAuth.mountPath | default "kubernetes" | quote }}
        role: openbao-peer-token
        serviceAccountRef:
          name: {{ $saName | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $tokenSecret | quote }}
  namespace: {{ $saNs | quote }}
  labels:
    catalyst.openova.io/component: external-secrets
    catalyst.openova.io/secret-backend: openbao
spec:
  refreshInterval: {{ $ps.tokenRefreshInterval | default "15m" | quote }}
  target:
    name: {{ $tokenSecret | quote }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: {{ $tokenSecret | quote }}
{{- range $pt.peers }}
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ printf "%s%s" $prefix . | quote }}
  labels:
    catalyst.openova.io/component: external-secrets
    catalyst.openova.io/secret-backend: openbao
    catalyst.openova.io/store-scope: peer-region
    openova.io/region: {{ . | quote }}
spec:
  provider:
    vault:
      server: {{ printf "http://%s%s.%s.svc.cluster.local:8200" $svcPrefix . $baoNs | quote }}
      path: {{ $kvPath | quote }}
      version: {{ $kvVersion | quote }}
      auth:
        jwt:
          path: {{ printf "jwt-peer-%s" $pt.self | quote }}
          role: {{ $aud | quote }}
          secretRef:
            name: {{ $tokenSecret | quote }}
            namespace: {{ $saNs | quote }}
            key: token
{{- end }}
{{- end }}
