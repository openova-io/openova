{{- /*
Function test of bp-external-secrets-stores (docs/RUNBOOKS.md section 4.5). `helm test` runs it.

External Secrets marks a ClusterSecretStore Ready only after it has validated
the store against its OpenBao. The test reads, through the Kubernetes API, the
condition Ready of the store of its own region, clusterSecretStore.name
(vault-region1), which this release renders when clusterSecretStore.enabled is
true. It never judges a peer store (peerStores, one per other region): that
store writes into the other region's OpenBao, which an install of this region
does not deliver. It reads nothing else and writes nothing.

The kit installs this release without waiting for its workloads
(install.disableWait), and OpenBao and External Secrets start beside it on a
fresh install: the test reads the condition again every 10 seconds until 60
seconds before its bound T, and fails naming the store when it is not Ready by
then. T is functionTest.timeoutSeconds, the Pod's activeDeadlineSeconds: the
kit states the install timeout of its release there (docs/RUNBOOKS.md section
4.5); without it T is 300.

A ClusterSecretStore has no namespace, so a ClusterRole and a
ClusterRoleBinding of this file (verb get on that one clustersecretstore of
external-secrets.io) give the test Pod that right. Their names carry the
namespace, so two releases never share them.

It renders nothing when the chart renders no store of its own region. The
image is the kubectl image this chart already uses for its webhook gate;
functionTest.image overrides it.
*/ -}}
{{- $css := .Values.clusterSecretStore | default dict }}
{{- if $css.enabled }}
{{- $store := $css.name | default "vault-region1" }}
{{- $ft := .Values.functionTest | default dict }}
{{- $bound := int ($ft.timeoutSeconds | default 300) }}
{{- $wait := sub $bound 60 }}
{{- $gate := .Values.webhookGate | default dict }}
{{- $image := $ft.image | default ($gate.image | default "harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4") }}
{{- $clusterName := printf "%s-%s-function-test" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["clustersecretstores"]
    resourceNames: [{{ $store | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-function-test
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $clusterName }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    catalyst.openova.io/function-test: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: {{ $bound }}
  serviceAccountName: {{ .Release.Name }}-function-test
  containers:
    - name: function-test
      image: {{ $image | quote }}
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: HOME
          value: /tmp
        - name: STORE
          value: {{ $store | quote }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          {{- include "kube-access-lib.in-cluster-kubeconfig" . | nindent 10 }}
          fail() { echo "FUNCTION-TEST fail {{ .Chart.Name }} $1"; exit 1; }
          while :; do
            if ready="$(kubectl --request-timeout=15s get clustersecretstore "${STORE}" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/tmp/error)"; then
              [ "${ready}" = "True" ] && break
              reason="Ready is '${ready}': $(kubectl --request-timeout=15s get clustersecretstore "${STORE}" -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}' 2>/dev/null | cut -c1-160)"
            else
              reason="$(tr '\n' ' ' < /tmp/error | cut -c1-160)"
            fi
            [ "${SECONDS}" -lt {{ $wait }} ] || fail "the ClusterSecretStore ${STORE} of this region is not Ready within {{ $wait }} seconds: ${reason}"
            sleep 10
          done
          echo "FUNCTION-TEST pass {{ .Chart.Name }} the ClusterSecretStore ${STORE} of this region is Ready"
  volumes:
    - name: tmp
      emptyDir: {}
{{- end }}
