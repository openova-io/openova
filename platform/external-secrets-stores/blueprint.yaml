apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-external-secrets-stores
  labels:
    catalyst.openova.io/section: pts-3-3-security-and-policy
spec:
  version: 1.0.14
  card:
    title: External Secrets — Stores
    category: security
    summary: ClusterSecretStore + SecretStore CRs binding the External Secrets Operator to the Sovereign's OpenBao backend. The store-configuration companion to bp-external-secrets.
    icon: external-secrets.svg
  visibility: unlisted
  dependsOn:
    - bp-external-secrets
    - bp-openbao
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ""
          clusters: [mgmt-A, mgmt-B, dmz-A, dmz-B, rtz-A, rtz-B]
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-external-secrets-stores
  endpoints: []
