apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: kyverno
  labels:
    catalyst.openova.io/section: pts-3-3-security-and-policy
spec:
  # 1.3.0 (TBD-V53 #2128): Cold-start race fix — cert-manager-issued TLS
  # + extraInitContainer that blocks main container until the secret is
  # populated. See platform/kyverno/chart/Chart.yaml for the full rationale.
  # 1.3.6 (#3149): webhook-gate non-fatal — no more fatal-hook→stuck-uninstall cascade.
  # 1.3.7 (#3499): config.webhooks.objectSelector excludes the cilium CNI stack so a
  # cilium roll can always recreate its agent (breaks the apiserver-return-path deadlock).
  # 1.3.8 (#3735): MIRROR-EVERYTHING — 4 controller registries + kyvernopre init image
  # re-pointed from ghcr.io / reg.kyverno.io to harbor.openova.io/proxy-ghcr/kyverno/*.
  version: 1.3.8
  card:
    title: Kyverno
    family: guardian
    description: Kubernetes-native policy management. Validating/mutating/generating admission control. HA mode with separate admission/background/cleanup/reports controllers.
    docs: https://kyverno.io/docs/
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        replication:
          backend: flux-git
          mode: async
        placement:
          tier: ''
          clusters:
            - mgmt-A
            - mgmt-B
            - dmz-A
            - dmz-B
            - rtz-A
            - rtz-B
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  multiInstance:
    enabled: false
