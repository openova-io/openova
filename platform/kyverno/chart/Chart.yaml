apiVersion: v2
name: bp-kyverno
description: |
  Catalyst Blueprint umbrella chart for Kyverno. Depends on the upstream
  `kyverno` chart (kyverno/kyverno) as a Helm subchart so
  `helm dependency build` pulls the upstream payload into this artifact.
  Catalyst-curated values flow into the upstream subchart under the
  `kyverno:` key in values.yaml.

  Kyverno is the admission policy engine for Catalyst Sovereigns —
  validating, mutating, and generating Kubernetes resources via webhook.
  HA mode runs four controllers (admission, background, cleanup, reports);
  solo-Sovereign default is replicas=1 each.
type: application
# 1.3.0 (TBD-V53 #2128): Cold-start race fix — admission-controller TLS
# now provisioned by cert-manager BEFORE the kyverno binary starts, and
# an extraInitContainer blocks the main container until the secret has a
# populated tls.crt. Eliminates the apiserver→webhook TLS handshake EOF
# that wedged bootstrap-kit on every fresh-prov Sovereign.
# 1.3.6 (#3149): webhook-gate is now NON-FATAL on timeout (exit 0, not exit 1).
# A fatal gate triggered Flux install-remediation → uninstall → kyverno's own
# webhook blocks its deletion → HR stuck → bootstrap-kit never holds →
# sovereign-tls blocked → console 000 (hw07/hw08/hw62/hw93/hw95/hw123). The
# gate stays a slow-warm DETECTOR (waits the full budget, logs loudly) but
# never wedges the cluster; downstream admission-needers gate on their own
# cert-wait + G50 retries. This is the "DEEPER FIX still owed" from the G54 header.
# 1.3.7 (#3499, Refs #3375/#3380): config.webhooks.objectSelector excludes the
# cilium CNI stack (app.kubernetes.io/part-of=cilium) from the Fail webhooks so
# a cilium DaemonSet roll can always recreate its own agent — breaks the
# self-deadlock where the de-CNI'd apiserver node can't receive the webhook
# response (hw135: cnpg-pair initdb wedged → no region-b standby → region-kill
# impossible). See chart/values.yaml config.webhooks for the full root cause.
version: 1.3.7
appVersion: "v1.18.0"
keywords: [catalyst, blueprint, kyverno, policy, admission, security]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Pinned to kyverno/kyverno 3.8.0 (appVersion v1.18.0) — current stable on
# 2026-04-29. Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the
# version is operator-bumpable via PR + Blueprint release.
dependencies:
  - name: kyverno
    version: "3.8.0"
    repository: "https://kyverno.github.io/kyverno/"
