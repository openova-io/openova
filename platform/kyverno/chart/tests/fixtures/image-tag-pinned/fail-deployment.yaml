# Failing case: :latest tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fail-image-tag
  namespace: example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fail-image-tag
  template:
    metadata:
      labels:
        app: fail-image-tag
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:latest
