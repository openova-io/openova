# Catalyst Blueprint umbrella metadata — the upstream chart is resolved as
# a Helm subchart via Chart.yaml `dependencies:`. Catalyst-curated values
# under the `kyverno:` key flow into the upstream subchart unchanged.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

global:
  # ⚠️ #3735 (2026-06-17): this `global.imageRegistry` key is INERT for the
  # upstream Kyverno chart — Kyverno reads `global.image.registry` (a nested
  # `image.registry`), NOT a flat `global.imageRegistry`. It is kept here only
  # for cross-chart umbrella-overlay symmetry (#560) and has NO effect on any
  # Kyverno image pull. The registry that actually moves the pull is each
  # per-controller `kyverno.<controller>.image.registry` (set to the Harbor
  # proxy-ghcr cache below). A per-Sovereign overlay that needs to repoint ALL
  # Kyverno images in one line should set `kyverno.global.image.registry`
  # (the real upstream knob), not this field.
  imageRegistry: ""

catalystBlueprint:
  upstream:
    chart: kyverno
    version: "3.8.0"
    repo: "https://kyverno.github.io/kyverno/"

# ─── Upstream chart values (subchart key: kyverno) ───────────────────────
kyverno:
  # CRDs — installed by the umbrella so HelmRelease ordering works (CRDs
  # land before the controller deployments). Default upstream behavior.
  crds:
    install: true
    # #3735: the CRD-migration hook image (kyverno-cli) defaulted to
    # `reg.kyverno.io` (crds.migration.enabled=true → the post-upgrade-migrate-
    # resources hook Job runs on every CRD migration, e.g. a chart bump). Proxy
    # it so the migration hook never cold-pulls the slow un-proxied registry +
    # never trips the harbor-proxy-pull Enforce glob.
    migration:
      image:
        registry: harbor.openova.io
        repository: proxy-ghcr/kyverno/kyverno-cli

  # HA mode — Kyverno 1.18 splits into 4 controllers. Solo-Sovereign default
  # is replicas=2 (Wave 5.90 #2436) so a single admission-controller restart
  # doesn't take down the entire fail-closed admission path. Per-Sovereign
  # overlays may bump to 3 for true HA on regional Sovereigns.
  admissionController:
    replicas: 2
    # #3735 (2026-06-17): MIRROR-EVERYTHING for ALL Kyverno image pulls. Every
    # Kyverno image used to resolve to a NON-Harbor registry — slow-direct on the
    # IPv4-only kom4dc VPC AND failing the `harbor-proxy-pull` Enforce glob
    # `*/proxy-*/*` on converged-env rolls. Same fix class as bp-cnpg (#3257) +
    # bp-external-secrets (#3533). Re-pointed at the Harbor proxy-ghcr cache.
    #
    # ⚠️ KEY-PATH TRAP (verified by `helm template` on hw157): the MAIN admission
    # image is read from `admissionController.CONTAINER.image.*`, NOT
    # `admissionController.image.*`. The legacy top-level `admissionController.image`
    # block below is INERT for the running Pod (exactly like the `.resources`-vs-
    # `.container.resources` trap the #2436 comment documents) — it was rendering
    # `reg.kyverno.io/kyverno/kyverno:v1.18.0` despite carrying a tag, because the
    # helper only reads `.container.image`. The EFFECTIVE override lives under
    # `container.image` further down. We keep the legacy block ONLY so an operator
    # grepping for the admission tag still finds the right value, with this warning.
    #
    # Resolution precedence in the upstream `kyverno.image` helper:
    #   `<x>.image.registry` > `global.image.registry` > `image.defaultRegistry`
    #   (= `reg.kyverno.io` for the controllers, `ghcr.io` for readiness-checker).
    # The flat `global.imageRegistry` (top of file) is INERT — upstream reads the
    # nested `global.image.registry`. So each per-image `registry:` is the knob
    # that actually moves the pull. Live on hw157: `reg.kyverno.io` was the
    # SLOWEST registry on the VPC (~13 min) and starved the helm-controller
    # install workers.
    image:
      # INERT for the main container (see KEY-PATH TRAP above) — the effective
      # override is admissionController.container.image. Kept proxied + in sync
      # for grep-friendliness; harmless if upstream ever starts reading it.
      registry: harbor.openova.io
      repository: proxy-ghcr/kyverno/kyverno
      tag: "v1.18.0"
      pullPolicy: IfNotPresent
    # #3735: the kyvernopre INIT container was NEVER overridden — the chart set
    # only admissionController.image.* (itself inert), so the init image fell
    # through to upstream `defaultRegistry: reg.kyverno.io`. kyvernopre runs on
    # EVERY admission-controller Pod start (replicas=2 → 2 cold pulls of
    # reg.kyverno.io/kyverno/kyvernopre:v1.18.0). The init-container image block
    # is admissionController.initContainer.image.{registry,repository,tag}. tag
    # pinned explicitly (else it falls through to image.tag).
    initContainer:
      image:
        registry: harbor.openova.io
        repository: proxy-ghcr/kyverno/kyvernopre
        tag: "v1.18.0"
        pullPolicy: IfNotPresent
    # Wave 5.90 (#2436) — main container resources bumped from upstream
    # default 100m/128Mi/384Mi → 500m/512Mi/1Gi. Surfaced live on
    # d3c6268c (#2423 fresh prov 2026-05-24T20:00Z): with the upstream
    # defaults, admission-controller on a small s7n.large.4 CP was CPU-
    # starved during Phase 1 cascade — every Pod create on any
    # namespace flowed through the kyverno webhook → 10s timeout →
    # Pod-create cascaded to FailedCreate → bp-keycloak STS wedged →
    # 22 downstream HRs blocked → console.<fqdn> HTTPS never came up.
    # With 500m/1Gi the controller has headroom to respond <2s even
    # during the heaviest Pod-create bursts of Phase 1.
    #
    # IMPORTANT: upstream chart key for the MAIN container resources
    # is `admissionController.container.resources` (NOT just
    # `.resources` — that key exists in upstream but doesn't propagate
    # to the Pod spec). The `container:` nesting is the canonical path
    # per upstream values.yaml line 1238.
    container:
      # #3735: the EFFECTIVE main admission-controller image override (the
      # upstream helper reads `.container.image`, not `.image` — see KEY-PATH
      # TRAP above). Proxies the heaviest, most-pulled Kyverno image off
      # reg.kyverno.io onto the Harbor proxy-ghcr cache.
      image:
        registry: harbor.openova.io
        repository: proxy-ghcr/kyverno/kyverno
        tag: "v1.18.0"
        pullPolicy: IfNotPresent
      # G67 #2616 (2026-05-31): cpu request 500m → 200m. Live use on
      # hw74 was ~50m/admission-controller — 200m is conservative
      # right-size. Original 500m × 2 replicas ate 1000m on workers,
      # contributing to cluster CPU saturation that blocked cutover
      # Step 01 Pod scheduling.
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 2
          memory: 1Gi
    serviceMonitor:
      enabled: false

    # TBD-V53 #2128 — Cold-start race fix.
    #
    # PROBLEM: With the upstream default (admissionController.certManager.enabled=
    # false, admissionController.createSelfSignedCert=false), Kyverno generates
    # its own admission-webhook TLS cert AT RUNTIME inside the main container.
    # During the boot window the kube-apiserver sees a registered ValidatingWebhook
    # Configuration but the kyverno-svc TCP endpoint can't yet complete a TLS
    # handshake — `TLS handshake error from <apiserver>:<port>: EOF`. The kyverno
    # binary exits cleanly (code 0) to retry; kubelet restarts; each restart
    # races again. Concurrently the Flux bootstrap-kit Kustomization's dry-run
    # apply (e.g. Namespace/alloy) calls the same webhook → 502 → the entire
    # bootstrap-kit wedges on a fresh-prov Sovereign. Verified live on t40 today
    # (6 restarts in 67 min, bootstrap-kit still "Reconciliation in progress").
    #
    # FIX: Provision the TLS cert via cert-manager BEFORE Kyverno starts.
    # bp-cert-manager is bootstrap-kit slot 02 and bp-kyverno is slot 27 with
    # an explicit dependsOn (see clusters/_template/bootstrap-kit/27-kyverno.yaml),
    # so cert-manager is guaranteed Ready by the time this chart installs.
    # certManager.createSelfSignedIssuer=true (the upstream default when
    # certManager.enabled=true) makes the chart self-contained — it creates its
    # own ClusterIssuer + Issuer chain so no external Issuer is required.
    certManager:
      enabled: true
      # Self-signed ClusterIssuer + CA chain shipped by the upstream chart.
      # The whole TLS lineage is internal to kyverno; the webhook caBundle is
      # cainjector-mutated from the Certificate's CA into the
      # ValidatingWebhookConfiguration at runtime.
      createSelfSignedIssuer: true

    # GUARD against the kyverno main container racing apiserver webhook calls
    # before the cert-manager-issued Secret has actually been populated. Even
    # with certManager.enabled=true the Certificate CR may be Issuing for ~10-30s
    # on a cold cluster (selfsigned-issuer → CA cert → Issuer → leaf cert chain).
    # The init container polls the Secret; once `data.tls.crt` is non-empty the
    # main container proceeds. Bounded by k8s pod startup timeout (no infinite
    # block — fails into CrashLoop if cert-manager is broken, which is louder
    # than a silent webhook-EOF cycle).
    extraInitContainers:
      - name: wait-for-tls-secret
        # curlimages/curl is the canonical small image used across the
        # Catalyst Blueprint catalog for in-cluster polling init containers
        # (matches platform/k8s-ws-proxy + platform/wordpress-tenant). Per the
        # MIRROR-EVERYTHING inviolable rule (PR #163), the image is pulled
        # through harbor.openova.io's proxy-dockerhub library so air-gapped
        # Sovereigns work without DockerHub egress. Per Sovereign overlays
        # may rewrite via global.imageRegistry once Sovereign-local Harbor
        # takes over the proxy_cache role post-cutover.
        image: harbor.openova.io/proxy-dockerhub/curlimages/curl:8.10.1
        imagePullPolicy: IfNotPresent
        # The secret name follows the upstream chart's naming convention:
        #   <kyverno.admission-controller.serviceName>.<kyverno.namespace>.svc.kyverno-tls-pair
        # With the Catalyst release name `kyverno` in namespace `kyverno`, that
        # resolves to `kyverno-svc.kyverno.svc.kyverno-tls-pair`. The kube-apiserver
        # path is the in-cluster Kubernetes API, reachable from any Pod's
        # service-account token at https://kubernetes.default.svc.
        command:
          - sh
          - -c
          - |
            set -eu
            TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
            CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            NS="${KYVERNO_NAMESPACE:-kyverno}"
            SECRET="kyverno-svc.${NS}.svc.kyverno-tls-pair"
            URL="https://kubernetes.default.svc/api/v1/namespaces/${NS}/secrets/${SECRET}"
            echo "wait-for-tls-secret: polling ${URL} for non-empty data.tls.crt"
            i=0
            until crt="$(curl -sS --cacert "${CACERT}" -H "Authorization: Bearer ${TOKEN}" "${URL}" 2>/dev/null \
                          | sed -n 's/.*"tls\.crt":[[:space:]]*"\([^"]*\)".*/\1/p')" \
                  && [ -n "${crt}" ] && [ "${crt}" != "null" ]; do
              i=$((i+1))
              if [ "${i}" -gt 120 ]; then
                echo "wait-for-tls-secret: TIMEOUT after ~10min — cert-manager has not issued ${SECRET}"
                exit 1
              fi
              sleep 5
            done
            echo "wait-for-tls-secret: secret ${SECRET} has tls.crt — proceeding."
        env:
          - name: KYVERNO_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532

  backgroundController:
    replicas: 1
    # #3735: proxy-ghcr (was ghcr.io) — see admissionController.image comment.
    image:
      registry: harbor.openova.io
      repository: proxy-ghcr/kyverno/background-controller
      tag: "v1.18.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    serviceMonitor:
      enabled: false

  cleanupController:
    enabled: true
    replicas: 1
    # #3735: proxy-ghcr (was ghcr.io) — see admissionController.image comment.
    image:
      registry: harbor.openova.io
      repository: proxy-ghcr/kyverno/cleanup-controller
      tag: "v1.18.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    serviceMonitor:
      enabled: false

  reportsController:
    replicas: 1
    # #3735: proxy-ghcr (was ghcr.io) — see admissionController.image comment.
    image:
      registry: harbor.openova.io
      repository: proxy-ghcr/kyverno/reports-controller
      tag: "v1.18.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    serviceMonitor:
      enabled: false

  # #3735: the readiness-checker image (used by the webhooksCleanup pre-delete
  # hook Job AND `helm test`) defaulted to `ghcr.io` with an implicit `:latest`
  # tag — un-proxied + unpinned, failing the Enforce glob and slow-direct on the
  # VPC. Proxy both call sites onto proxy-ghcr. (webhooksCleanup runs as a Helm
  # pre-delete hook so it IS on the live uninstall path; `test` is helm-test-only
  # but proxied for full MIRROR-EVERYTHING glob compliance.)
  webhooksCleanup:
    image:
      registry: harbor.openova.io
      repository: proxy-ghcr/kyverno/readiness-checker
      # tag left to upstream default (chart appVersion v1.18.0); the
      # pre-delete hook only runs on uninstall so an unpinned tag never
      # races a fresh-prov pull.
  test:
    image:
      registry: harbor.openova.io
      repository: proxy-ghcr/kyverno/readiness-checker
      # #3735: pin to v1.18.0 (was implicit `:latest`) so even the helm-test
      # image is a deterministic proxied ref, not a floating `:latest`.
      tag: v1.18.0

  # Reports server — bundled subchart, default disabled. Per-Sovereign
  # overlays enable when scaling out PolicyReport storage.
  reportsServer:
    enabled: false

  # Grafana subchart bundled by upstream — DEFAULT FALSE per
  # docs/BLUEPRINT-AUTHORING.md §11.2 (Catalyst provides bp-grafana
  # separately).
  grafana:
    enabled: false

  # Webhook configuration — upstream defaults apply (namespaceSelector
  # excludes `kube-system`). Per-Sovereign overlays MAY override
  # `config.webhooks.namespaceSelector` and per-controller `failurePolicy`
  # via the upstream chart's controller-scoped settings once 3-replica HA
  # is in place. See upstream `values.yaml` `config:` block for shape.
  #
  # #3499 (Refs #3375, #3380, 2026-06-14) — CNI-bootstrap admission exemption.
  #
  # ROOT CAUSE (root-caused live on hw135, dep 368c2d9b74d0b71a): kyverno's
  # resource webhooks run failurePolicy=Fail and match `pods` + `batch/jobs`.
  # When the cilium DaemonSet rolls (any spec change re-creates its agent
  # pods), the rolling-update DELETES the old agent on the control-plane /
  # apiserver node, then must CREATE the replacement — a Pod CREATE that
  # passes through these very webhooks. With the apiserver node's cilium-agent
  # momentarily gone, the apiserver->kyverno *request* still arrives but
  # kyverno's *response* back to the apiserver's pod-network address times out
  # (no BPF datapath on the de-CNI'd node):
  #     ERR "read tcp <kyverno-pod>:9443-><apiserver-podIP>: i/o timeout"
  #         url=/validate/fail?timeout=10s
  # → admission hits the 10s deadline → "context deadline exceeded" → the
  # replacement cilium-agent Pod is never admitted → the apiserver node stays
  # CNI-less permanently → self-perpetuating deadlock that also wedges
  # cilium-operator and every downstream Pod/Job create (incl. cnpg-pair
  # initdb → no region-b standby → #3375 region-kill impossible).
  #
  # FIX: exempt the cilium CNI stack from the kyverno resource webhooks so a
  # cilium roll can ALWAYS recreate its own agent and self-heal the datapath,
  # regardless of admission/datapath state. All three cilium components
  # (agent, operator, envoy) carry `app.kubernetes.io/part-of: cilium`, so a
  # single objectSelector covers the whole CNI bootstrap. This does NOT weaken
  # policy coverage for any tenant/app workload — only the cluster's own CNI
  # pods bypass admission, and only on the create/update path. The upstream
  # `kyverno.config.webhooks` helper preserves objectSelector verbatim and
  # appends the kube-system + kyverno-namespace exclusions to namespaceSelector
  # (see charts/kyverno/templates/config/_helpers.tpl). Setting config.webhooks
  # here REPLACES the upstream default block, so the namespaceSelector below
  # re-states the upstream kube-system exclusion (the helper still appends the
  # kyverno namespace because excludeKyvernoNamespace stays true).
  config:
    webhooks:
      # Exclude namespaces (re-states the upstream default — kube-system; the
      # helper also appends the kyverno namespace via excludeKyvernoNamespace).
      namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values:
              - kube-system
      # Exclude the cilium CNI stack (agent + operator + envoy) so a cilium
      # DaemonSet roll never deadlocks against the Fail webhook return-path.
      objectSelector:
        matchExpressions:
          - key: app.kubernetes.io/part-of
            operator: NotIn
            values:
              - cilium

  # OpenReports CRDs — both flags must agree per upstream schema. Default
  # disabled (matches upstream); per-Sovereign overlays enable BOTH together
  # once the OpenReports CRDs are required.
  openreports:
    enabled: false
    installCrds: false

# ─── Catalyst overlay values (consumed by templates/ in this chart) ──────
kyvernoOverlay:
  networkPolicy:
    enabled: false
  # Default policy bundle — empty; per-Sovereign overlays SET to
  # `pod-security`, `best-practices`, etc. once the policy library lands.
  policyBundle: ""

  # Label-vocabulary enforcement policies (slices E1+E2 of #1095). Two
  # ClusterPolicies that together implement the contract in
  # docs/EPICS-1-6-unified-design.md §1 (label vocab is the join key
  # across compliance, RBAC, billing, networking).
  labelVocab:
    # E1 — mutate-add-openova-labels
    # Mutating ClusterPolicy that, at admission, derives missing
    # openova.io/{org,environment,application,blueprint,vcluster,host-cluster,
    # sovereign} labels from the resource's namespace + ownerReferences and
    # adds them. Default OFF — operator opts in once Organization (slice
    # B1) + Environment (slice B2) CRs exist on the cluster, otherwise
    # the derivation has nothing to read from.
    mutate:
      enabled: false

    # E2 — validate-require-openova-labels
    # Validating ClusterPolicy that REJECTS resources missing the required
    # openova.io/* labels (permissive Audit by default; per-Environment
    # overlay flips to Enforce via EnvironmentPolicy in EPIC-1 #1096).
    # Default OFF — turn on after slice C1/C4 controllers populate labels
    # so existing Sovereign control-plane resources don't trip on it.
    validate:
      enabled: false
      # Audit | Enforce — permissive vs blocking. EnvironmentPolicy.spec.modes
      # drives this per-environment in EPIC-1.
      action: Audit
      # Resource kinds the policy gates. Limited to workload kinds so
      # control-plane Secrets / ConfigMaps don't trip on missing org labels.
      resourceKinds:
        - Deployment
        - StatefulSet
        - DaemonSet
        - Job
        - CronJob
        - Service
        - Ingress
      # Required label keys. Subset of the §1 vocab — only the labels
      # workload-rendering controllers populate. Cluster-scope labels
      # (provider/region/bb/env-type/host-cluster) are set elsewhere.
      requiredLabels:
        - openova.io/organization
        - openova.io/environment
        - openova.io/application
        - openova.io/blueprint
        - openova.io/managed-by
      # Namespaces exempted from the validate rule (control-plane
      # namespaces that pre-date the label vocab — operator extends the
      # set per Sovereign).
      excludeNamespaces:
        - kube-system
        - flux-system
        - cilium
        - cilium-gateway
        - cert-manager
        - openova-system
        - catalyst
        - kyverno
        - monitoring
        - ingress
        - default

# G54 (Refs #2605, 2026-05-30): self-referential webhook-gate Job + RBAC defaults.
# Post-install hook polls kyverno-svc Endpoints + own TLS Secret presence BEFORE
# Helm marks the release Installed. Closes META-AUDIT 1 sub-class 3 — self-
# referential admission webhook bootstrap deadlock. See templates/webhook-gate-
# hook.yaml G54 comment for the full failure-chain analysis.
webhookGate:
  enabled: true
  service:
    name: kyverno-svc
    namespace: kyverno
  tlsSecretName: kyverno-svc.kyverno.svc.kyverno-tls-pair
  timeoutSeconds: 300
  intervalSeconds: 2
  # #3735: explicit Harbor proxy-dockerhub prefix (was bare
  # `bitnamilegacy/kubectl:1.30.7`). A bare ref relies on the node containerd
  # docker.io→proxy-dockerhub mirror AND fails the `harbor-proxy-pull` Enforce
  # glob `*/proxy-*/*` (the glob matches the image STRING as written, pre-mirror-
  # rewrite). Matches the cnpg webhookGate (#3257) + cert-manager idiom exactly.
  image: "harbor.openova.io/proxy-dockerhub/bitnamilegacy/kubectl:1.30.7"
  imagePullPolicy: IfNotPresent
