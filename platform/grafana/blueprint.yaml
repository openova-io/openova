apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-grafana
spec:
  version: 1.0.19  # lockstep with chart/Chart.yaml (#5022 deploymentStrategy Recreate — RWO single-replica roll deadlock)
  visibility: unlisted
  class: platform-component
  lifecycle: experimental
  card:
    title: Grafana
    summary: Open-source observability dashboards. Pre-wired to Prometheus + Loki sources.
    description: Multi-source observability platform with dashboards, alerting, and Keycloak SSO.
    icon: grafana.svg
    license: AGPL-3.0
    tags: [observability, monitoring, dashboards, grafana]
    docs: https://grafana.com/docs/grafana/latest/


  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  endpoints:
    - name: ui
      hostnameTemplate: "grafana.{{.SovereignFQDN}}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
      # #3150 — silent-SSO OIDC-init path. The console "Open" launch lands
      # the browser on Grafana's OWN OIDC-login route, which immediately
      # 302s to Keycloak carrying the `kc_idp_hint=catalyst-pin` baked into
      # Grafana's synced auth_url (GF_AUTH_GENERIC_OAUTH_AUTH_URL). Keycloak
      # silently re-uses the operator's PIN session and the browser lands
      # inside Grafana already logged in — no Grafana login form, no
      # "Sign in with OpenOva" button to click. Without this, the launch
      # hits the app root where Grafana ignores the Keycloak query params
      # and renders its login form.
      ssoInitPath: "/login/generic_oauth"

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    silentLogin: true

  configSchema:
    type: object
    properties:
      adminUser:
        type: string
        default: admin
      persistence:
        type: object
        properties:
          size:
            type: string
            default: 10Gi
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-grafana
