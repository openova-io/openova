apiVersion: v2
name: bp-grafana
description: |
  Catalyst Blueprint umbrella chart for Grafana. Depends on the upstream
  `grafana` chart (grafana/helm-charts) as a Helm subchart so
  `helm dependency build` pulls the upstream payload into this artifact.
  Catalyst-curated values flow into the upstream subchart under the
  `grafana:` key in values.yaml.

  Visualization layer of the LGTM observability stack — pairs with bp-loki
  (logs), bp-tempo (traces), bp-mimir (metrics), and bp-alloy or
  bp-opentelemetry (collection).
type: application
# 1.0.6 (G117.5a #2788, 2026-06-02): Tempo datasource URL port 3100 → 3200.
# Upstream Tempo single-binary chart (grafana/helm-charts tempo-1.24.4)
# exposes the HTTP query API on port 3200 (`http_listen_port` default,
# rendered Service named port `tempo-prom-metrics`). The earlier 3100
# was a copy-paste from Loki's chart and broke Grafana's Tempo
# datasource health-check on fresh-prov walks.
# 1.0.5 (G117.5 + G115 #2744, 2026-06-02): SSO defense-in-depth +
# observability-stack auto-wiring on fresh install.
#   - SSO: emit GF_AUTH_GENERIC_OAUTH_AUTH_URL with `?kc_idp_hint=
#     catalyst-pin` in the ESO-rendered Secret. Combined with bp-keycloak
#     1.4.9+ realm-config IDR `defaultProvider` this delivers silent SSO
#     in two layers (realm-config primary + per-app hint defense-in-depth).
#     Adds TOKEN_URL + API_URL env-override keys so the grafana Pod has the
#     full env-override set rather than the chart-render-time empty defaults
#     in `grafana.ini.auth.generic_oauth`.
#   - G115: ship pre-baked Prometheus/Loki/Tempo (+ optional Alertmanager)
#     datasources via templates/datasource-configmaps.yaml, picked up by the
#     upstream `grafana.sidecar.datasources` discovery (now enabled by
#     default). Ship 5-dashboard starter pack via templates/dashboard-
#     configmaps.yaml: cluster-overview, node-exporter, kube-state, openbao-
#     audit, flux-reconcile-health. Per-Sovereign overlays can override any
#     URL/tenant/dashboard via `observabilityStack.*` knobs. Default Service
#     DNS matches bootstrap-kit slots 22-loki / 23-mimir / 24-tempo
#     (releaseName + targetNamespace).
# Refs #2744.
# 1.0.2 (Fix #1902, TBD-A40, 2026-05-19): omit HTTPRoute parentRef
# sectionName by default — multi-zone Sovereigns rename HTTPS listeners
# to https-<sanitised-zone>, breaking NoMatchingListener with the prior
# pinned sectionName: https. Matches the catalyst-system fix in PR #1888.
# 1.0.10 (founder NS-3, #3263, 2026-06-12): owner is admin-by-default.
# role_attribute_path now maps `sovereign-admins` → 'GrafanaAdmin' (server
# admin — full Administration nav) instead of org-level 'Admin', paired
# with the REQUIRED allow_assign_grafana_admin=true (without it Grafana
# degrades GrafanaAdmin to org Admin). The owner lands in sovereign-admins
# via the bp-keycloak 1.4.24 realm-import seed; the role re-evaluates from
# the groups claim on every OAuth login. Render test
# tests/sso-admin-role-mapping.sh.
# 1.0.11 (#2745, 2026-06-12): bp-loki/bp-mimir/bp-tempo re-homed INSIDE
# the mgmt vCluster (NS-1 founder DoD, audit PROMOTE-NOW). Grafana runs
# host-side, so the three default datasource URLs re-point at the
# host-visible syncer-mangled Service names
# (<svc>-x-<inner-ns>-x-mgmt-vcluster.mgmt.svc.cluster.local). Reverts
# to plain in-vCluster names when grafana itself promotes (audit
# Phase-2). Lockstep with bootstrap-kit slots 22/23/24 + bp-catalyst-
# platform 1.4.591 (CATALYST_MIMIR_URL + baseline CNP).
version: 1.0.14
appVersion: "12.3.1"
# 1.0.14 (#3374, 2026-06-14): raise the sidecar memory limit 64Mi → 192Mi
# (request 32Mi → 64Mi). The 1.0.13 limit was too low for the
# kiwigrid/k8s-sidecar running searchNamespace=ALL (cluster-wide ConfigMap +
# Secret informer), so both grafana sidecars were OOMKilled (exitCode 137) in
# a tight CrashLoopBackOff → grafana Pod stuck 1/3 NotReady → Service dropped
# it → route flapped to 503 despite a healthy main grafana container serving
# SSO. Refs #3374.
# 1.0.13 (#3374, 2026-06-14): declare resources.requests/limits on the
# dashboard + datasource sidecars (grafana.sidecar.resources). Those
# sidecars are containers[0]/[1] of the grafana Pod and shipped with NO
# requests, so on a kyverno-Enforce Sovereign the `resource-requests`
# ClusterPolicy denies EVERY grafana Pod create (`rule requests-pod failed
# at path /spec/containers/0/resources/requests/`). The original Pod
# survives because it was admitted before enforcement, but any reschedule —
# e.g. to pick up the corrected GF_-shaped OIDC envFromSecret — can never
# create a new Pod, so grafana stays stuck on the stale spec and never lands
# zero-click. Tiny footprint (10m/32Mi requests; the sidecars only watch
# ConfigMaps + POST reload hooks). Refs #3374.
# 1.0.4 (G91.grafana #2658, 2026-05-31): opt in to the bp-sso-bridge
# (G91.1 #2652) SSO framework. Top-level `sso:` block (defaults
# enabled=true). Adds templates/sso-oauth-source-externalsecret.yaml
# (ExternalSecret reading bp-sso-bridge's OpenBao `secret/sso/grafana`
# bundle into Secret keys GF_AUTH_GENERIC_OAUTH_CLIENT_ID +
# _CLIENT_SECRET — Grafana's canonical env-var-override mechanism).
# Wires `grafana.envFromSecret: grafana-sso-oidc-credentials` so the
# rendered env vars override the matching grafana.ini placeholders.
# grafana.ini.auth.generic_oauth pre-configures scopes, login_attribute_
# path=preferred_username, groups_attribute_path=groups, and
# role_attribute_path mapping the realm sovereign-admins group → Admin
# role. Per-Sovereign cluster overlay sets auth_url/token_url/api_url
# from sso.sovereignFqdn + sso.realm.
# Per SECURITY.md §6.3 (App-level SSO).
keywords: [catalyst, blueprint, grafana, observability, dashboards]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Pinned to grafana/grafana 10.5.15 (appVersion 12.3.1) — current stable on
# 2026-04-29, validated against Kubernetes 1.31. Per
# docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the version is
# operator-bumpable via PR + Blueprint release.
dependencies:
  - name: grafana
    version: "10.5.15"
    repository: "https://grafana.github.io/helm-charts"
