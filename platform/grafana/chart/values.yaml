# Catalyst Blueprint umbrella metadata — the upstream chart is resolved as
# a Helm subchart via Chart.yaml `dependencies:`. Catalyst-curated values
# under the `grafana:` key flow into the upstream subchart unchanged.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). The upstream grafana chart
  # exposes `grafana.image.repository` for override. Per-Sovereign overlays
  # wire that alongside this value. Tracked under #560.
  imageRegistry: ""

catalystBlueprint:
  upstream:
    chart: grafana
    version: "10.5.15"
    repo: "https://grafana.github.io/helm-charts"

# ─── Upstream chart values (subchart key: grafana) ────────────────────────
grafana:
  # Solo-Sovereign minimum — single replica. Per-Sovereign overlays scale up
  # via the upstream `replicas:` value once a regional Sovereign is sized
  # for HA.
  replicas: 1

  # Pin upstream image tag — DO NOT use floating tags per
  # docs/INVIOLABLE-PRINCIPLES.md.
  # #3375 — proxy-glob ALL grafana images through the Sovereign's local
  # Harbor so kyverno's harbor-proxy-pull Enforce policy admits every Pod
  # on a converged env. The subchart defaults to raw docker.io/quay.io,
  # which a converged Enforce Sovereign DENIES on the first chart-roll
  # (the same landmine that wedged bp-openbao on hw130). Mirror the harbor
  # chart's harbor.openova.io/proxy-<src>/... convention.
  image:
    registry: harbor.openova.io
    repository: proxy-dockerhub/grafana/grafana
    tag: "12.3.1"
    pullPolicy: IfNotPresent
  testFramework:
    image:
      registry: harbor.openova.io
      repository: proxy-dockerhub/bats/bats
  downloadDashboardsImage:
    registry: harbor.openova.io
    repository: proxy-dockerhub/curlimages/curl

  # Persistence — required so dashboard state survives pod restarts. Default
  # 10Gi on the cluster's default StorageClass; per-Sovereign overlays SET
  # storageClassName when SeaweedFS-backed PVCs are wired (issue #189).
  persistence:
    enabled: true
    type: pvc
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  # ServiceMonitor — DEFAULT FALSE per docs/BLUEPRINT-AUTHORING.md §11.2
  # (Observability toggles default false — the kube-prometheus-stack CRDs
  # may not exist yet on a fresh Sovereign).
  serviceMonitor:
    enabled: false

  # Anonymous + admin defaults — operator overlays SET admin password via a
  # Secret reference. NEVER hardcode the admin password here.
  adminUser: admin
  # `adminPassword` deliberately unset; upstream chart auto-generates a
  # random password into a Secret if not provided. Per-Sovereign overlays
  # MAY pin it via `admin.existingSecret`.

  # SecurityContext — non-root, matches Catalyst defaults across other bp-*.
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472

  # #2872 (2026-06-03): disable upstream chart's init-chown-data initContainer.
  # The PVC's RWO local-path provisioner mounts the volume already owned by
  # 472:472 (matches our runAsUser+fsGroup), so the chown is a no-op AND the
  # initContainer runs as root with a `chown -R 472:472 /var/lib/grafana`
  # which fails on subdirs the user already created (png/pdf/csv) with
  # Permission denied → Pod CrashLoopBackOff. Disabling the chown initContainer
  # eliminates the failure; fsGroup ensures correct ownership. Caught live on
  # hw86 — grafana-7f56ff86b9-x899r 0/3 Init:CrashLoopBackOff x53+.
  initChownData:
    enabled: false

  # Service — ClusterIP; ingress is wired by per-Sovereign overlays via the
  # cilium-gateway HTTPRoute.
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  # Datasources — empty by default. Per-Sovereign overlays populate this
  # with bp-loki / bp-mimir / bp-tempo endpoints once those Blueprints
  # reconcile on the cluster.
  datasources: {}

  # Pre-installed dashboards — empty by default. Per-Sovereign overlays
  # populate via `dashboards:` or via dashboard ConfigMaps with the
  # `grafana_dashboard: "1"` label.
  dashboards: {}

  # Resources — modest defaults sized for a solo Sovereign.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # RBAC — chart manages its own ServiceAccount + RBAC.
  rbac:
    create: true
    pspEnabled: false
  serviceAccount:
    create: true
    name: ""

  # G115 #2744 — Enable the kiwigrid/k8s-sidecar that auto-discovers
  # ConfigMaps labelled `grafana_datasource: "1"` (resp.
  # `grafana_dashboard: "1"`) cluster-wide and writes their
  # `data:` keys into the grafana Pod's /etc/grafana/provisioning/
  # subdirs. The bp-grafana umbrella ships starter datasource +
  # dashboard ConfigMaps (templates/datasource-configmaps.yaml +
  # templates/dashboard-configmaps.yaml) gated by the
  # observabilityStack.* block below; the sidecar picks them up at
  # Pod boot so fresh-install Grafana renders charts immediately
  # without the per-Sovereign overlay having to wire each.
  sidecar:
    # #3375 — the kiwigrid/k8s-sidecar image (a co-container of the
    # grafana Pod) must be proxy-globbed through the local Harbor too, or
    # kyverno's harbor-proxy-pull Enforce denies the WHOLE grafana Pod.
    image:
      registry: harbor.openova.io
      repository: proxy-quay/kiwigrid/k8s-sidecar
    # #3374 (2026-06-14) — the dashboard + datasource sidecars are
    # `containers[0]`/`[1]` of the grafana Pod (the main grafana container
    # is last). On a kyverno-Enforce Sovereign the `resource-requests`
    # ClusterPolicy denies any Pod whose containers omit
    # resources.requests.cpu/memory — and the upstream chart ships these
    # sidecars with NO requests, so EVERY grafana Pod roll is blocked
    # (`Pod ... blocked ... rule requests-pod failed at path
    # /spec/containers/0/resources/requests/`). The original Pod survives
    # only because it was admitted before kyverno started enforcing; once
    # it must reschedule (e.g. to pick up a changed envFromSecret), the new
    # Pod can never be created and grafana is stuck on the stale spec.
    # Declaring sidecar.resources makes both sidecars kyverno-compliant so
    # grafana can actually roll.
    #
    # 1.0.14 (#3374): the 1.0.13 memory limit of 64Mi was too low — the
    # kiwigrid/k8s-sidecar runs with searchNamespace=ALL (it LISTs/WATCHes
    # ConfigMaps + Secrets across EVERY namespace), and on hw136 both
    # sidecars were OOMKilled (exitCode 137) in a tight CrashLoopBackOff,
    # which kept the grafana Pod at 1/3 NotReady → the Service dropped it →
    # the route flapped back to 503 even though the main grafana container
    # was healthy and serving SSO. Bump to 64Mi request / 192Mi limit so the
    # cluster-wide informer cache fits with headroom. Still a modest
    # footprint for a Pod whose main container is 256Mi/512Mi.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 192Mi
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      # Cluster-wide discovery so a per-Sovereign overlay can ship its
      # own datasource ConfigMap in any namespace.
      searchNamespace: ALL
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      # Provider name shown in Grafana UI's "Dashboards by source" list.
      provider:
        name: "catalyst-starter"
        orgid: 1
        folder: "Catalyst"
        type: file
        disableDelete: false
        allowUiUpdates: false

  # G91.grafana (#2658) — inject GF_AUTH_GENERIC_OAUTH_CLIENT_ID +
  # _CLIENT_SECRET from the ExternalSecret-rendered Secret.
  # The upstream chart concatenates envFromSecret + envFromSecrets.
  envFromSecret: "grafana-sso-oidc-credentials"

  # G91.grafana (#2658) — generic_oauth + auth defaults wired through
  # grafana.ini. Per Grafana's value-override rule env vars take
  # precedence over grafana.ini values, so the GF_AUTH_GENERIC_OAUTH_*
  # env vars injected via envFromSecret above override the placeholders
  # below. We still set the placeholders so the rendered grafana.ini
  # carries the right scopes + URLs (env-only-rotation is fine, but
  # operators inspecting /etc/grafana/grafana.ini see the right block).
  #
  # Per-Sovereign cluster overlay should set
  # `grafana.grafana\.ini.auth\.generic_oauth.auth_url` /
  # `.token_url` / `.api_url` to the realm URLs computed from
  # sso.sovereignFqdn. The chart leaves them blank by default so a
  # half-configured signin attempt errors clearly rather than wedging
  # the grafana login UI.
  "grafana.ini":
    server:
      root_url: "https://%(domain)s/"
    auth:
      disable_login_form: false
      # Zero-click from the app ROOT URL (founder mandate, 2026-06-12):
      # hitting grafana.<fqdn>/ must land signed-in via the sovereign
      # realm — no grafana login form, no button. The login form stays
      # enabled underneath (disable_login_form false) so admin/break-
      # glass login at /login?disableAutoLogin remains possible.
      oauth_auto_login: true
    "auth.generic_oauth":
      enabled: true
      name: "OpenOva SSO"
      icon: signin
      allow_sign_up: true
      auto_login: true
      client_id: "${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}"
      client_secret: "${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
      scopes: "openid profile email groups"
      # Per-Sovereign overlay populates these from sso.sovereignFqdn
      # + sso.realm. Empty default = clear error on signin (rather
      # than silent half-config).
      auth_url: ""
      token_url: ""
      api_url: ""
      # JMESPath expression: any contains() over the realm `groups`
      # claim that matches the adminGroup → GrafanaAdmin, else Viewer.
      # Operator overlays may broaden this to map additional groups.
      #
      # Founder NS-3 (#3263, 2026-06-12): 'GrafanaAdmin' (not 'Admin') so
      # the Sovereign owner — seeded into `sovereign-admins` by the
      # bp-keycloak realm import — lands as Grafana SERVER admin
      # (Administration nav: users/orgs/plugins/settings), not merely
      # org-level Admin. GrafanaAdmin assignment additionally requires
      # allow_assign_grafana_admin=true below; without that flag Grafana
      # degrades the mapping to org Admin. The role is re-evaluated from
      # the groups claim on EVERY OAuth login (no skip_org_role_sync).
      role_attribute_path: "contains(groups[*], 'sovereign-admins') && 'GrafanaAdmin' || 'Viewer'"
      # Required for role_attribute_path to be allowed to grant the
      # server-admin (GrafanaAdmin) flag via OAuth (founder NS-3, #3263).
      allow_assign_grafana_admin: true
      # `email` claim provides the login identifier.
      login_attribute_path: "preferred_username"
      groups_attribute_path: "groups"
      # Use email as the identifier when a user lacks login.
      use_pkce: true

# ─── Catalyst overlay values (consumed by templates/ in this chart) ──────
# Reserved for Catalyst-side overlays (NetworkPolicy, ExternalSecret) added
# in a follow-up PR once bp-grafana is consumed in clusters/_template/.
grafanaOverlay:
  networkPolicy:
    enabled: false

# ─── G91.grafana (#2658) SSO opt-in ───────────────────────────────────────
# Per SECURITY.md §6.3 every Application Blueprint declares SSO support
# with a single value. bp-sso-bridge (G91.1 #2652) watches every HR with
# `sso.enabled: true` and reconciles a Keycloak Client + OpenBao
# `secret/sso/grafana` + ExternalSecret in this namespace.
#
# bp-grafana plumbs the OIDC credentials into the upstream grafana chart's
# generic_oauth path via the env-var-override mechanism — see
# templates/sso-oauth-source-externalsecret.yaml. The grafana.ini values
# below + the envFromSecret reference (added under grafana:) wire it all
# together. role_attribute_path maps Keycloak realm groups to Grafana
# roles: sovereign-admins → Admin, everyone else → Viewer.
sso:
  enabled: true
  realm: sovereign
  # Per-Sovereign cluster overlay sets this (e.g. `hw86.omani.works`).
  # When empty the grafana.ini generic_oauth section still renders but
  # auth_url/token_url/api_url are empty strings → users see an OAuth
  # error on attempted sign-in (clear diagnostic) rather than a silent
  # half-config.
  sovereignFqdn: ""
  clientId: grafana
  externalSecretStoreName: vault-region1
  refreshInterval: 1h
  # Realm group → Grafana role mapping (JMESPath expression evaluated
  # against the OIDC userinfo response by Grafana's
  # role_attribute_path). The Sovereign owner (deployment orgEmail) is
  # seeded into `sovereign-admins` by the bp-keycloak 1.4.24+ realm
  # import (founder NS-3, #3263); users in that group land as Grafana
  # SERVER admins (GrafanaAdmin via allow_assign_grafana_admin above).
  adminGroup: sovereign-admins
  # G117.5 #2744 — Identity Provider hint appended to the OIDC
  # authorize_url so KC's Identity Provider Redirector delegates to
  # the catalyst-pin broker without prompting for username/password.
  # Defense-in-depth to the realm-config IDR `defaultProvider` binding
  # shipped by bp-keycloak 1.4.9+ (PR #2730). Per-Sovereign overlay may
  # override (e.g. set to empty string to disable defense-in-depth).
  idpHint: catalyst-pin

# ─── Catalyst HTTPRoute (Cilium Gateway API, issue #387) ──────────────────
# Replaces the upstream chart's networking.k8s.io/v1.Ingress on Sovereigns.
# Per-Sovereign overlay supplies `gateway.host` (e.g. grafana.<sovereign-fqdn>).
# parentRef defaults to cilium-gateway/kube-system, the per-Sovereign
# Gateway shipped by clusters/_template/bootstrap-kit/01-cilium.yaml.
gateway:
  enabled: true
  # host: grafana.<sovereign-fqdn> — REQUIRED, no default per Inviolable Principle #4
  host: ""
  path: "/"
  # Backend Service — defaults to <release> (grafana subchart fullname)
  backendService: ""
  backendPort: 80
  parentRef:
    name: cilium-gateway
    namespace: kube-system
    # sectionName intentionally empty — multi-zone Sovereigns rename HTTPS
    # listeners to https-<sanitised-zone> (e.g. https-omani-works), so
    # pinning sectionName: https breaks NoMatchingListener. Cilium Gateway
    # matches by hostname filter. See PR #1888 / TBD-A40 / issue #1902.
    sectionName: ""

# ─── G115 #2744 — Observability stack auto-wiring ─────────────────────────
# Default-on starter datasources + dashboards consumed by the upstream
# grafana subchart's sidecar (configured above as
# `grafana.sidecar.datasources` / `grafana.sidecar.dashboards`). Per
# docs/INVIOLABLE-PRINCIPLES.md #4, every URL/tenant is operator-overridable
# via per-Sovereign overlay or set to empty to disable the individual
# datasource.
#
# The Service DNS defaults below assume the bootstrap-kit slot conventions
# (releaseName + targetNamespace) in clusters/_template/bootstrap-kit/
# 22-loki.yaml, 23-mimir.yaml, 24-tempo.yaml. Multi-cluster federation
# overlays MAY point at a regional aggregator instead.
#
# #2745 (2026-06-12): bp-loki/bp-mimir/bp-tempo are re-homed INSIDE the
# mgmt vCluster (NS-1 founder DoD). Grafana itself still runs host-side
# (audit Phase-2 candidate), so these defaults point at the host-visible
# syncer-mangled Service names the bp-mgmt-vcluster
# sync.toHost.services reflector creates:
#   <svc>-x-<inner-ns>-x-mgmt-vcluster.<host-ns mgmt>.svc.cluster.local
# (suffix = the vCluster instance name = slot-58 releaseName
# `mgmt-vcluster` — same convention as the nats-jetstream/keycloak
# G92.2 entries in products/catalyst values). When grafana promotes
# into the mgmt vCluster (audit Phase-2) these revert to the plain
# in-vCluster names (loki.loki.svc / mimir-nginx.mimir.svc /
# tempo.tempo.svc) via overlay or follow-up bump.
observabilityStack:
  enabled: true
  # Custom sidecar discovery label override (mirrors
  # grafana.sidecar.datasources.label / .dashboards.label set above).
  # Keep these in sync if a per-Sovereign overlay flips either.
  sidecarLabel: grafana_datasource
  sidecarDashboardLabel: grafana_dashboard
  datasources:
    prometheus:
      enabled: true
      # bp-mimir 1.0.5+ exposes its query frontend via the
      # `<release>-mimir-nginx` Service on port 80 in the (inner) mimir
      # namespace. #2745: bp-mimir lives inside the mgmt vCluster; the
      # host-visible synced Service is
      # mimir-nginx-x-mimir-x-mgmt-vcluster in host ns mgmt.
      url: "http://mimir-nginx-x-mimir-x-mgmt-vcluster.mgmt.svc.cluster.local:80/prometheus"
      tenantId: anonymous
    loki:
      enabled: true
      # bp-loki 1.0.0 single-binary chart Service name is `<release>`
      # (no -gateway suffix on the simple-deployment values shipped by
      # bp-loki today). #2745: bp-loki lives inside the mgmt vCluster;
      # the host-visible synced Service is loki-x-loki-x-mgmt-vcluster
      # in host ns mgmt.
      url: "http://loki-x-loki-x-mgmt-vcluster.mgmt.svc.cluster.local:3100"
      tenantId: anonymous
    tempo:
      enabled: true
      # bp-tempo 1.0.0 single-binary chart Service name is `<release>`.
      # #2745: bp-tempo lives inside the mgmt vCluster; the host-visible
      # synced Service is tempo-x-tempo-x-mgmt-vcluster in host ns mgmt,
      # port 3200 for the query API.
      #
      # Port 3200 is the upstream Tempo `http_listen_port` default
      # (grafana/helm-charts tempo-1.24.4 values.yaml `tempo.config`
      # block) — the same port the rendered Service exposes as the
      # `tempo-prom-metrics` named port for tempo-query traffic. The
      # earlier value 3100 was a copy-paste mismatch from Loki's HTTP
      # port (also `:3100` in the Loki single-binary chart) and would
      # have produced `Tempo is not responding` in Grafana's datasource
      # health-check on a fresh-prov walk. G117.5a (Refs #2788).
      url: "http://tempo-x-tempo-x-mgmt-vcluster.mgmt.svc.cluster.local:3200"
    alertmanager:
      # Default OFF — Mimir's bundled AM and standalone bp-alertmanager
      # are not yet wired in clusters/_template/. Per-Sovereign overlay
      # flips this on with the right Service DNS.
      enabled: false
      url: ""
  dashboards:
    starter:
      enabled: true
      clusterOverview: true
      nodeExporter: true
      kubeState: true
      openbaoAudit: true
      fluxReconcile: true

# ── Bootstrap self-registration (#3687, extends #3370) ───────────────────
# When a bootstrap-kit slot installs this chart, it flips
# bootstrapOwned.enabled=true so templates/application-cr.yaml renders the
# canonical apps.openova.io/v1 Application CR for the slot's HelmRelease
# (the instance card every console surface reads — /apps, Topology,
# showback). Default OFF: a console-created instance gets its CR from the
# application-controller fan-out, so self-registering a second one would
# violate "N instances => exactly N cards". helmRelease names the owning
# Flux HelmRelease (the controller's adoption path mirrors its Ready
# condition); namespace is where that HR object lives (flux-system for the
# slot 25 HR).
bootstrapOwned:
  enabled: false
  # Canonical placement token stamped onto the self-registered Application
  # CR's spec.placement (#3375 DoD-1 / #3768 / #3786). MUST be a canonical
  # mode (singleton / active-active / active-hot-standby / active-passive) —
  # NEVER the banned legacy dialect single-region / active-hotstandby, which
  # the read path (readTopology) would surface verbatim to the operator. A
  # leaf bootstrap app installs as one copy, so singleton is the truthful
  # effective mode.
  placement: singleton
  helmRelease:
    name: ""
    namespace: flux-system
