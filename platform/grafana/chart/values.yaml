# Catalyst Blueprint umbrella metadata — the upstream chart is resolved as
# a Helm subchart via Chart.yaml `dependencies:`. Catalyst-curated values
# under the `grafana:` key flow into the upstream subchart unchanged.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). The upstream grafana chart
  # exposes `grafana.image.repository` for override. Per-Sovereign overlays
  # wire that alongside this value. Tracked under #560.
  imageRegistry: ""

catalystBlueprint:
  upstream:
    chart: grafana
    version: "10.5.15"
    repo: "https://grafana.github.io/helm-charts"

# ─── Upstream chart values (subchart key: grafana) ────────────────────────
grafana:
  # Solo-Sovereign minimum — single replica. Per-Sovereign overlays scale up
  # via the upstream `replicas:` value once a regional Sovereign is sized
  # for HA.
  replicas: 1

  # Pin upstream image tag — DO NOT use floating tags per
  # docs/INVIOLABLE-PRINCIPLES.md.
  image:
    repository: grafana/grafana
    tag: "12.3.1"
    pullPolicy: IfNotPresent

  # Persistence — required so dashboard state survives pod restarts. Default
  # 10Gi on the cluster's default StorageClass; per-Sovereign overlays SET
  # storageClassName when SeaweedFS-backed PVCs are wired (issue #189).
  persistence:
    enabled: true
    type: pvc
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  # ServiceMonitor — DEFAULT FALSE per docs/BLUEPRINT-AUTHORING.md §11.2
  # (Observability toggles default false — the kube-prometheus-stack CRDs
  # may not exist yet on a fresh Sovereign).
  serviceMonitor:
    enabled: false

  # Anonymous + admin defaults — operator overlays SET admin password via a
  # Secret reference. NEVER hardcode the admin password here.
  adminUser: admin
  # `adminPassword` deliberately unset; upstream chart auto-generates a
  # random password into a Secret if not provided. Per-Sovereign overlays
  # MAY pin it via `admin.existingSecret`.

  # SecurityContext — non-root, matches Catalyst defaults across other bp-*.
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472

  # Service — ClusterIP; ingress is wired by per-Sovereign overlays via the
  # cilium-gateway HTTPRoute.
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  # Datasources — empty by default. Per-Sovereign overlays populate this
  # with bp-loki / bp-mimir / bp-tempo endpoints once those Blueprints
  # reconcile on the cluster.
  datasources: {}

  # Pre-installed dashboards — empty by default. Per-Sovereign overlays
  # populate via `dashboards:` or via dashboard ConfigMaps with the
  # `grafana_dashboard: "1"` label.
  dashboards: {}

  # Resources — modest defaults sized for a solo Sovereign.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # RBAC — chart manages its own ServiceAccount + RBAC.
  rbac:
    create: true
    pspEnabled: false
  serviceAccount:
    create: true
    name: ""

  # G91.grafana (#2658) — inject GF_AUTH_GENERIC_OAUTH_CLIENT_ID +
  # _CLIENT_SECRET from the ExternalSecret-rendered Secret.
  # The upstream chart concatenates envFromSecret + envFromSecrets.
  envFromSecret: "grafana-sso-oidc-credentials"

  # G91.grafana (#2658) — generic_oauth + auth defaults wired through
  # grafana.ini. Per Grafana's value-override rule env vars take
  # precedence over grafana.ini values, so the GF_AUTH_GENERIC_OAUTH_*
  # env vars injected via envFromSecret above override the placeholders
  # below. We still set the placeholders so the rendered grafana.ini
  # carries the right scopes + URLs (env-only-rotation is fine, but
  # operators inspecting /etc/grafana/grafana.ini see the right block).
  #
  # Per-Sovereign cluster overlay should set
  # `grafana.grafana\.ini.auth\.generic_oauth.auth_url` /
  # `.token_url` / `.api_url` to the realm URLs computed from
  # sso.sovereignFqdn. The chart leaves them blank by default so a
  # half-configured signin attempt errors clearly rather than wedging
  # the grafana login UI.
  "grafana.ini":
    server:
      root_url: "https://%(domain)s/"
    auth:
      disable_login_form: false
      oauth_auto_login: false
    "auth.generic_oauth":
      enabled: true
      name: "OpenOva SSO"
      icon: signin
      allow_sign_up: true
      auto_login: false
      client_id: "${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}"
      client_secret: "${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
      scopes: "openid profile email groups"
      # Per-Sovereign overlay populates these from sso.sovereignFqdn
      # + sso.realm. Empty default = clear error on signin (rather
      # than silent half-config).
      auth_url: ""
      token_url: ""
      api_url: ""
      # JMESPath expression: any contains() over the realm `groups`
      # claim that matches the adminGroup → Admin, else Viewer.
      # Operator overlays may broaden this to map additional groups.
      role_attribute_path: "contains(groups[*], 'sovereign-admins') && 'Admin' || 'Viewer'"
      # `email` claim provides the login identifier.
      login_attribute_path: "preferred_username"
      groups_attribute_path: "groups"
      # Use email as the identifier when a user lacks login.
      use_pkce: true

# ─── Catalyst overlay values (consumed by templates/ in this chart) ──────
# Reserved for Catalyst-side overlays (NetworkPolicy, ExternalSecret) added
# in a follow-up PR once bp-grafana is consumed in clusters/_template/.
grafanaOverlay:
  networkPolicy:
    enabled: false

# ─── G91.grafana (#2658) SSO opt-in ───────────────────────────────────────
# Per SECURITY.md §6.3 every Application Blueprint declares SSO support
# with a single value. bp-sso-bridge (G91.1 #2652) watches every HR with
# `sso.enabled: true` and reconciles a Keycloak Client + OpenBao
# `secret/sso/grafana` + ExternalSecret in this namespace.
#
# bp-grafana plumbs the OIDC credentials into the upstream grafana chart's
# generic_oauth path via the env-var-override mechanism — see
# templates/sso-oauth-source-externalsecret.yaml. The grafana.ini values
# below + the envFromSecret reference (added under grafana:) wire it all
# together. role_attribute_path maps Keycloak realm groups to Grafana
# roles: sovereign-admins → Admin, everyone else → Viewer.
sso:
  enabled: true
  realm: sovereign
  # Per-Sovereign cluster overlay sets this (e.g. `hw86.omani.works`).
  # When empty the grafana.ini generic_oauth section still renders but
  # auth_url/token_url/api_url are empty strings → users see an OAuth
  # error on attempted sign-in (clear diagnostic) rather than a silent
  # half-config.
  sovereignFqdn: ""
  clientId: grafana
  externalSecretStoreName: vault-region1
  refreshInterval: 1h
  # Realm group → Grafana role mapping (JMESPath expression evaluated
  # against the OIDC userinfo response by Grafana's
  # role_attribute_path). The Sovereign operator is auto-added to
  # `sovereign-admins` by the realm import; users in that group land
  # as Grafana org-level Admins.
  adminGroup: sovereign-admins

# ─── Catalyst HTTPRoute (Cilium Gateway API, issue #387) ──────────────────
# Replaces the upstream chart's networking.k8s.io/v1.Ingress on Sovereigns.
# Per-Sovereign overlay supplies `gateway.host` (e.g. grafana.<sovereign-fqdn>).
# parentRef defaults to cilium-gateway/kube-system, the per-Sovereign
# Gateway shipped by clusters/_template/bootstrap-kit/01-cilium.yaml.
gateway:
  enabled: true
  # host: grafana.<sovereign-fqdn> — REQUIRED, no default per Inviolable Principle #4
  host: ""
  path: "/"
  # Backend Service — defaults to <release> (grafana subchart fullname)
  backendService: ""
  backendPort: 80
  parentRef:
    name: cilium-gateway
    namespace: kube-system
    # sectionName intentionally empty — multi-zone Sovereigns rename HTTPS
    # listeners to https-<sanitised-zone> (e.g. https-omani-works), so
    # pinning sectionName: https breaks NoMatchingListener. Cilium Gateway
    # matches by hostname filter. See PR #1888 / TBD-A40 / issue #1902.
    sectionName: ""
