{{- /*
G91.grafana (#2658) — OIDC client credentials Secret.

bp-sso-bridge (G91.1 #2652) writes the canonical OIDC client bundle into
OpenBao at `secret/sso/grafana`. The upstream Grafana chart consumes
generic_oauth credentials via env vars (GF_AUTH_GENERIC_OAUTH_*); this
ExternalSecret mirrors the OpenBao bundle into a Secret with keys named
after the env vars, and the Helm values block (values.yaml `grafana.
envFromSecret: grafana-sso-oidc-credentials`) plumbs them into the
grafana Pod's environment.

Env-var-as-config is Grafana's canonical override mechanism — values in
grafana.ini are templated, but env vars `GF_<SECTION>_<KEY>` override at
runtime, which lets us keep the client_secret out of the chart-rendered
ConfigMap entirely.

G117.5 #2744 — emit the full env-override Secret including
GF_AUTH_GENERIC_OAUTH_AUTH_URL with `?kc_idp_hint=catalyst-pin` defense-
in-depth hint appended. With the bp-keycloak 1.4.9+ realm-config IDR
`defaultProvider=catalyst-pin` binding, KC delegates to catalyst-pin
unconditionally — the hint is redundant but cheap, and a useful
diagnostic signal in HAR captures (the auth URL ALWAYS carries the
hint, so any "fell back to forms" failure mode tells you the realm-
config didn't reach KC). Also emits TOKEN_URL + API_URL so the grafana
Pod has the full env-override set (rather than the chart-render-time
empty defaults in values.yaml `grafana.ini.auth.generic_oauth`).
*/ -}}
{{/*
#2988 ESO-CRD guard (gold standard: bp-external-dns externalsecret.yaml):
without the Capabilities check, installing this chart on a cluster where
the external-secrets.io CRDs are not yet established fails at manifest-
build time ("no matches for kind ExternalSecret") and wedges the whole
install — caught live as the fresh-prov sso ExternalSecret CRD race and
reproduced verbatim by the bp-openbao fresh-prov CI gate (kind cluster,
no ESO). With the guard, the resource is simply omitted until the next
Flux reconcile re-renders once the CRD exists (Capabilities re-evaluated
every reconcile), so SSO wiring self-heals with zero manual touch.
*/}}
{{- if and .Values.sso.enabled (.Capabilities.APIVersions.Has "external-secrets.io/v1beta1") }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-sso-oidc-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-grafana
    bp-sso-bridge.openova.io/consumer: bp-grafana
spec:
  refreshInterval: {{ .Values.sso.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.sso.externalSecretStoreName | default "vault-region1" }}
    kind: ClusterSecretStore
  target:
    name: grafana-sso-oidc-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Upstream Grafana env-override keys — these become env vars on
        # the grafana Pod when `grafana.envFromSecret` references this
        # Secret. The env vars override the matching grafana.ini values.
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID:     "{{ "{{ .client_id }}" }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ "{{ .client_secret }}" }}"
        # G117.5 — auth_url MUST carry ?kc_idp_hint=catalyst-pin defense-
        # in-depth (see template docstring above). Use the
        # bp-sso-bridge-emitted authorize_url as the base; append the
        # query string in ESO Go-template since OpenBao stores it bare.
        # Hint suffix omitted entirely when sso.idpHint is "" (operator
        # opt-out: realm-config IDR `defaultProvider` still delivers
        # silent SSO).
        {{- if .Values.sso.idpHint }}
        GF_AUTH_GENERIC_OAUTH_AUTH_URL:      "{{ "{{ .authorize_url }}" }}?kc_idp_hint={{ .Values.sso.idpHint }}"
        {{- else }}
        GF_AUTH_GENERIC_OAUTH_AUTH_URL:      "{{ "{{ .authorize_url }}" }}"
        {{- end }}
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL:     "{{ "{{ .token_url }}" }}"
        GF_AUTH_GENERIC_OAUTH_API_URL:       "{{ "{{ .userinfo_url }}" }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "grafana" }}
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "grafana" }}
        property: client_secret
    - secretKey: authorize_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "grafana" }}
        property: authorize_url
    - secretKey: token_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "grafana" }}
        property: token_url
    - secretKey: userinfo_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "grafana" }}
        property: userinfo_url
{{- end }}
