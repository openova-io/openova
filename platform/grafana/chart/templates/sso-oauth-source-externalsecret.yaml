{{- /*
G91.grafana (#2658) — OIDC client credentials Secret.

bp-sso-bridge (G91.1 #2652) writes the canonical OIDC client bundle into
OpenBao at `secret/sso/grafana`. The upstream Grafana chart consumes
generic_oauth credentials via env vars (GF_AUTH_GENERIC_OAUTH_*); this
ExternalSecret mirrors the OpenBao bundle into a Secret with keys named
after the env vars, and the Helm values block (values.yaml `grafana.
envFromSecret: grafana-sso-oidc-credentials`) plumbs them into the
grafana Pod's environment.

Env-var-as-config is Grafana's canonical override mechanism — values in
grafana.ini are templated, but env vars `GF_<SECTION>_<KEY>` override at
runtime, which lets us keep the client_secret out of the chart-rendered
ConfigMap entirely.
*/ -}}
{{- if .Values.sso.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-sso-oidc-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-grafana
    bp-sso-bridge.openova.io/consumer: bp-grafana
spec:
  refreshInterval: {{ .Values.sso.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.sso.externalSecretStoreName | default "vault-region1" }}
    kind: ClusterSecretStore
  target:
    name: grafana-sso-oidc-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Upstream Grafana env-override keys — these become env vars on
        # the grafana Pod when `grafana.envFromSecret` references this
        # Secret. The env vars override the matching grafana.ini values.
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID:     "{{ "{{ .client_id }}" }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ "{{ .client_secret }}" }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "grafana" }}
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "grafana" }}
        property: client_secret
{{- end }}
