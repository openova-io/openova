apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-powerdns
  labels:
    catalyst.openova.io/category: per-host-cluster-infrastructure
    catalyst.openova.io/section: pts-3-2-gitops-and-iac
spec:
  version: 1.2.27
  card:
    title: PowerDNS
    category: infrastructure
    summary: Authoritative DNS for every Sovereign zone — per-zone DNSSEC, lua-records for geo + health-checked failover, dnsdist rate-limiting. See docs/MULTI-REGION-DNS.md.
    icon: powerdns.svg
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  configSchema:
    type: object
    properties:
      replicaCount:
        type: integer
        default: 3
        description: PowerDNS Authoritative replicas. Each connects to the same CNPG database.
      dnssec:
        type: boolean
        default: true
        description: |
          DNSSEC ON (ECDSAP256SHA256) per #167 acceptance. Off requires explicit
          override in cluster overlay AND a documented exception.
      luaRecords:
        type: boolean
        default: true
        description: PowerDNS Lua records — geo + health-checked failover. See docs/MULTI-REGION-DNS.md.
      dnsdistEnabled:
        type: boolean
        default: true
        description: Companion dnsdist for query rate-limiting (default 100 qps per source IP).
      qpsPerSource:
        type: integer
        default: 100
        description: dnsdist MaxQPSIPRule threshold per source IP.
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-powerdns
  upgrades:
    from: ["0.x"]
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  endpoints:
    - name: ns1
      hostnameTemplate: "ns1.{{.SovereignFQDN}}"
      port: 53
      protocol: udp
      tls: false
      visibility: public
      launchDefault: false
    - name: ns2
      hostnameTemplate: "ns2.{{.SovereignFQDN}}"
      port: 53
      protocol: udp
      tls: false
      visibility: public
      launchDefault: false
