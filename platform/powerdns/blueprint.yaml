apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-powerdns
spec:
  version: 1.2.34
  card:
    title: PowerDNS
    summary: Authoritative DNS for every Sovereign zone — per-zone DNSSEC, lua-records for geo + health-checked failover, dnsdist rate-limiting. See docs/MULTI-REGION-DNS.md.
    icon: powerdns.svg
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  class: platform-component
  lifecycle: experimental
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-powerdns
  upgrades:
    from: ["0.x"]
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ''
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  endpoints:
    - name: ns1
      hostnameTemplate: "ns1.{{.SovereignFQDN}}"
      port: 53
      protocol: udp
      tls: false
      visibility: public
      launchDefault: false
    - name: ns2
      hostnameTemplate: "ns2.{{.SovereignFQDN}}"
      port: 53
      protocol: udp
      tls: false
      visibility: public
      launchDefault: false
