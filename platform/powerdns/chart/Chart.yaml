apiVersion: v2
name: bp-powerdns
# 1.2.4 (Fix #1902, TBD-A40, 2026-05-19): omit HTTPRoute parentRef
# sectionName by default — multi-zone Sovereigns rename HTTPS listeners
# to https-<sanitised-zone>, breaking NoMatchingListener with the prior
# pinned sectionName: https. Matches the catalyst-system fix in PR #1888.
# 1.2.10 (#3150, 2026-06-10): permit reflection of powerdns-api-credentials
# into the powerdns-admin ns so bp-powerdns-admin's PDNS_API_KEY resolves
# (slot 11a first exercised by #3173 — see api-credentials-secret.yaml).
# 1.2.11 (#3225, 2026-06-10): api-httproute.yaml gains a catch-all root
# rule (gated on new api.uiRedirectHost) that 302-redirects a bare GET /
# on pdns.<fqdn> to the powerdns-admin UI at pdns-admin.<fqdn>, so the
# founder's browser lands on the UI instead of a 404. The /api forward
# rule is preserved (Gateway-API longest-prefix). Default empty = no
# redirect rule rendered (zero regression).
# 1.2.13 (#3380-D, 2026-06-13): (1) the REST-API Ingress now renders ONLY
# when the Gateway path is OFF (api.gateway.enabled=false). On a
# Cilium-Gateway Sovereign the Ingress was redundant with the HTTPRoute AND
# its cert-manager.io/cluster-issuer annotation spawned a standalone
# `powerdns-api-tls` Certificate that sits Ready=False forever (chart
# default issuer `letsencrypt-prod` names a ClusterIssuer absent on
# Sovereigns; the cilium-gateway wildcard already serves pdns.<sov-fqdn>).
# (2) the dnsdist + pdns-auth images route through the Harbor `proxy-docker`
# cache (were raw docker.io — Enforce-DENIED by harbor-proxy-pull on the
# next roll, the `powerdns` ns is not excluded). Verified live hw130.
# Contabo (gateway OFF, real Traefik) unaffected.
# 1.2.14 (2026-06-13): REVERT the #3380-D part-(2) image reroute — the
# dnsdist + pdns-auth images go BACK to raw `docker.io/powerdns/...`. The
# `proxy-docker` Harbor project is NOT bootstrap-pullable on a fresh prov
# (unlike cred-free `proxy-ghcr`), so #3380-D wedged EVERY fresh prov
# (hw131 + hw132: powerdns pods never started → REST API never up →
# zone-bootstrap Job DeadlineExceeded → bp-powerdns never Ready →
# cert-manager DNS01 can't issue the wildcard → no TLS → console down).
# docker.io is hw130's proven-working source. The kyverno-Enforce concern
# is now handled correctly by EXCLUDING the `powerdns` namespace from the
# harbor-proxy-pull policy (bp-kyverno-policies 1.0.33,
# harborProxyPull.extraExcludeNamespaces), NOT by rerouting the image.
# The #3380-D part-(1) REST-API-Ingress gating is UNCHANGED.
# 1.2.15 (#3687, extends #3370): bootstrap self-registration —
# templates/application-cr.yaml renders the canonical apps.openova.io/v1
# Application CR for the slot-11 HelmRelease (gated bootstrapOwned.enabled
# + Capabilities apps.openova.io/v1) so the console /apps list, per-app
# Topology tab + showback resolve powerdns (no more "no Application CR").
# 1.2.16 (#3375 / #3786, 2026-06-18): the bootstrap-owned Application CR's
# spec.placement now emits the CANONICAL token `singleton` (overridable via
# bootstrapOwned.placement) instead of the banned legacy `single-region`.
# readTopology serves spec.placement VERBATIM to the Topology tab + the
# Instances-table chip, so the legacy spelling leaked the banned word to the
# operator (hw159 #3375).
# 1.2.17 (#3971): CNPG storageClass empty ⇒ cluster-default durable cloud CSI; local-path FORBIDDEN.
# 1.2.18 (#4765): anycast NodePort ERADICATED — serviceType=NodePort fails render;
#   LoadBalancer renders allocateLoadBalancerNodePorts:false (Cilium LB-IPAM shared VIP).
# 1.2.19 (#4765 live-strike): zone-bootstrap hook Job carries
#   app.kubernetes.io/managed-by: flux — kyverno `flux-managed` policy denied
#   the hook on upgrade (hw224), rolling back 1.2.18 and stranding the anycast
#   Service as the forbidden NodePort.
# 1.2.20 (#4765): hook-Job labels spelled out so managed-by=flux actually
#   renders — the 1.2.19 duplicate-key override was inert (first key wins).
# 1.2.21 (#5086, Refs #4765): Hetzner DNS front door. New dnsdist.hostPortMode
#   (default false — Huawei/kom4dc anycast-VIP path UNCHANGED). When true (set
#   ONLY by the Hetzner cloud-init substitute), dnsdist becomes a DaemonSet
#   whose container binds hostPort:53 on every node so the tofu `dns` LB
#   :53->node:53 forward has a real listener. §854-clean: hostPort ONLY, NEVER
#   a NodePort. No hostNetwork (pod-netns :53 bind dodges the Ubuntu-24.04
#   systemd-resolved 127.0.0.53:53 stub). Live-gated: proven on a real Hetzner
#   prov (dig @<node> <fqdn>), no Hetzner env currently up.
# 1.2.22 (#5086, Refs #4765): regression lock for the 1.2.21 §854 front door.
#   tests/hetzner-frontdoor-render.sh asserts the render contract both ways —
#   default => dnsdist Deployment, ClusterIP Service, NO hostPort, NO NodePort;
#   dnsdist.hostPortMode=true => DaemonSet + hostPort:53 (UDP+TCP), tolerate-all,
#   NO hostNetwork, NO nodePort/type:NodePort; anycast Service stays
#   type=LoadBalancer + allocateLoadBalancerNodePorts:false. Guards the Hetzner
#   DNS front door against a silent §854 regression (no chart behaviour change).
version: 1.2.22
description: |
  Catalyst-curated Blueprint wrapper for PowerDNS Authoritative.
  Carries Catalyst-specific values.yaml + templates (CNPG cluster, dnsdist
  companion, Traefik api-ingress, placeholder anycast endpoint, multi-zone
  bootstrap Job) on top of the upstream Helm chart. The bootstrap-kit
  installer (products/catalyst/bootstrap/api/internal/bootstrap/) reads
  the upstream chart reference from values.yaml's catalystBlueprint
  metadata block and applies the values overlay at helm install time.

  Mirrors the bp-cilium / bp-keycloak / bp-cert-manager wrapper shape:
  Chart.yaml lists the upstream chart as a Helm dependency so
  `helm dependency build` resolves it; values.yaml carries both the
  catalystBlueprint metadata block and the upstream subchart values.

  1.2.3 — Fix #144 recurrence (prov #37+#38 InstallFailed
  BackoffLimitExceeded, 2026-05-12). Bumping activeDeadlineSeconds alone
  (Fix #144) was insufficient: the post-install hook Job's container
  exited within backoffLimit=6 (~10min wall-time) because curl against
  http://powerdns:8081 hit a Service with empty Ready endpoints (powerdns
  Deployment Pods Pending behind a CNPG initdb that itself waited for
  worker capacity). The 14m deadline never got a chance — the Job died
  at BackoffLimit. Fix moves the wait-for-API loop INSIDE the container
  (restartPolicy: Never) so one Pod owns the full activeDeadlineSeconds
  budget. New value apiReadyTimeoutSeconds (default 600s) bounds the
  inner poll; surfaced via values.yaml per INVIOLABLE-PRINCIPLES #4.

  Bumped to 1.2.0 — multi-zone bootstrap (issue #827, parent epic #825).
  A franchised Sovereign now supports N parent zones, NOT one. New
  values key `zones: []` declares the parent domains the operator
  brings to the Sovereign at signup; a Helm post-install/post-upgrade
  hook Job (templates/zone-bootstrap-job.yaml) creates each one in
  PowerDNS via the REST API. Idempotent on HTTP 409. Pairs with the
  per-zone wildcard Certificate templates in bp-catalyst-platform 1.4.0+
  and the post-provision /api/v1/sovereign/parent-domains/<name>/zone
  endpoint in catalyst-api (issue #829).
type: application
keywords: [catalyst, blueprint, powerdns, dns, dnssec, lua-records, dnsdist]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a Helm subchart so `helm dependency build`
# bundles it into the OCI artifact. Pinned to pschichtel/powerdns 0.10.0
# (verified publisher on Artifact Hub, tracks docker.io/powerdns/pdns-auth-50
# at appVersion 5.0.3 — see values.yaml `catalystBlueprint.upstream` for
# the rationale).
dependencies:
  - name: powerdns
    version: "0.10.0"
    repository: "https://schich.tel/helm-charts"
