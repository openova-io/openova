{{- /*
Public NS endpoint Service — placeholder until XHetznerFloatingIP
Crossplane composition is authored.

Per #167 the target state is anycast Floating IPs across regions
(ns1.openova.io, ns2.openova.io, ns3.openova.io). The right primitive
is a Crossplane XHetznerFloatingIP composite that allocates Hetzner
Floating IPs and binds them to the dnsdist replicas across regions
(via hcloud_floating_ip_assignment).

Until that composition lands (gap explicitly disclosed in
templates/crossplane-floatingip.yaml + the Phase-1 deferral comment in
the public-repo PR description), this Service is the operational
stand-in. 🛑 NodePort is FORBIDDEN (founder 2026-07-03, #4765): the
Service is type=LoadBalancer served by a Cilium LB-IPAM VIP sharing
the Sovereign EIP (`lbipam.cilium.io/sharing-key`), with nodePort
allocation suppressed. Overlays may only pick LoadBalancer|ClusterIP.

Frontend: dnsdist (rate-limited). Backend (skipped here, dnsdist routes
in-cluster) is the upstream powerdns Service.
*/}}
{{- if .Values.anycast.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.anycast.serviceName | default "powerdns-anycast" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-powerdns.labels" . | nindent 4 }}
    catalyst.openova.io/role: public-ns-endpoint
  {{- with .Values.anycast.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- $svcType := .Values.anycast.serviceType | default "LoadBalancer" }}
  {{- if eq $svcType "NodePort" }}
  {{- fail "bp-powerdns: anycast.serviceType=NodePort is FORBIDDEN (#4765) — use LoadBalancer (Cilium LB-IPAM shared VIP) or ClusterIP" }}
  {{- end }}
  type: {{ $svcType }}
  {{- if eq $svcType "LoadBalancer" }}
  # 🛑 zero nodePorts, ever (#4765): the VIP is served by Cilium LB-IPAM
  # (north-south via kube-proxy replacement) — node:3xxxx must not exist.
  allocateLoadBalancerNodePorts: false
  {{- end }}
  selector:
    app.kubernetes.io/name: dnsdist
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    {{- range .Values.anycast.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol }}
      {{- if eq $svcType "LoadBalancer" }}
      # 🛑 #5348: state ZERO explicitly — omitting nodePort is NOT enough.
      #
      # allocateLoadBalancerNodePorts:false above only stops the apiserver
      # allocating NEW node ports; it does NOT deallocate ones already
      # assigned. And a declarative apply that simply OMITS nodePort leaves
      # the existing value in place — the field reads as unmanaged, so the
      # allocation survives every reconcile.
      #
      # Live proof on the mothership 2026-08-01: this very Service carried
      # allocateLoadBalancerNodePorts:false AND nodePort=32015 (53/UDP) +
      # nodePort=31425 (53/TCP) at the same time. The chart rendered clean,
      # scripts/check-no-nodeports.sh passed, and node:32015/udp was open —
      # a §854 violation invisible to every source-side check.
      #
      # `nodePort: 0` is the release sentinel: the apiserver treats it as
      # "no node port" and clears the allocation on apply. It is also the
      # inert value the repo guard deliberately ignores (it flags only
      # `nodePort: [1-9][0-9]*`), so this stays guard-clean by construction.
      nodePort: 0
      {{- end }}
    {{- end }}
{{- end }}
