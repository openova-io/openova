{{- /*
PowerDNS REST API ingress — operator-only.

Exposes the in-cluster powerdns webserver at .Values.api.host
(default pdns.openova.io) on path .Values.api.path (/api). Traefik
basicAuth middleware gates the surface; the Secret holding bcrypt(operator:<password>)
is referenced by name (.Values.api.basicAuth.secretName) — the plaintext
NEVER lives in values.yaml or this chart.

Per docs/INVIOLABLE-PRINCIPLES.md #10 (credentials never appear in source
or commits) the basicAuth Secret is created out-of-band by the
private-repo cluster manifest at clusters/contabo-mkt/apps/powerdns/.

#3380-D (2026-06-13): the Ingress is now rendered ONLY when the Gateway
path is OFF. Previously this template rendered ALONGSIDE the HTTPRoute on
Sovereigns ("+ Ingress, harmless on Sovereigns without Traefik") — but it
is NOT harmless: the Ingress carries the cert-manager.io/cluster-issuer
annotation, so cert-manager's Ingress-shim spawns a standalone
`powerdns-api-tls` Certificate. On a Cilium-Gateway Sovereign that
Certificate is BOTH redundant (the cilium-gateway https/apex-https
listeners already serve `*.<sov-fqdn>` via `sovereign-wildcard-tls`, which
covers `pdns.<sov-fqdn>` — verified live hw130) AND broken: the chart
default `api.tls.issuer: letsencrypt-prod` names a ClusterIssuer that does
NOT exist on Sovereigns (they issue via `wildcard-issuer`), so the
CertificateRequest sits "Referenced ClusterIssuer not found" / Ready=False
forever — a self-inflicted noise wound that pollutes `kubectl get
certificate` and burns a pointless LE attempt. Gating the Ingress off when
api.gateway.enabled=true removes the shim trigger at source; the HTTPRoute
+ Gateway wildcard fully serve `pdns.<sov-fqdn>` on Cilium Sovereigns.
Contabo (api.gateway.enabled=false, real Traefik) is unaffected — it still
gets the Ingress + its standalone cert.
*/}}
{{- if and .Values.api.enabled (not (and .Values.api.gateway .Values.api.gateway.enabled)) }}
{{- /*
Capabilities gate (issue #190): the `traefik.io/v1alpha1` Middleware CRD
ships with the Traefik ingress controller. k3s ships Traefik by default
on most Sovereigns, but a Sovereign overlay MAY disable Traefik (e.g. in
favour of cilium-only ingress) — in that case the CRD is absent and the
apiserver rejects this Middleware with `no matches for kind Middleware
in version traefik.io/v1alpha1`. The Capabilities check skips the
Middleware while still rendering the Ingress below, so the auth posture
must then be supplied by the cluster overlay's chosen ingress controller
(per docs/INVIOLABLE-PRINCIPLES.md #4 — never hardcode ingress class).
*/}}
{{- if and .Values.api.basicAuth.enabled (.Capabilities.APIVersions.Has "traefik.io/v1alpha1") }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.api.middlewareName | default "powerdns-api-auth" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-powerdns.labels" . | nindent 4 }}
spec:
  basicAuth:
    secret: {{ .Values.api.basicAuth.secretName | default "powerdns-api-basicauth" | quote }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: powerdns-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-powerdns.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.api.tls.issuer | default "letsencrypt-prod" | quote }}
    {{- /* Traefik router middleware annotation only renders when the
    Middleware CRD is present (Traefik is the chosen ingress controller)
    AND basicAuth.enabled is true. When basicAuth is off (current default
    per PR #681 followup) the API surface relies on PowerDNS's own
    X-API-Key check — see api-credentials-secret.yaml for the source
    of truth on the API key. */}}
    {{- if and .Values.api.basicAuth.enabled (.Capabilities.APIVersions.Has "traefik.io/v1alpha1") }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s@kubernetescrd" .Release.Namespace (.Values.api.middlewareName | default "powerdns-api-auth") | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.api.ingressClassName | default "traefik" | quote }}
  {{- if .Values.api.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.api.host | quote }}
      secretName: {{ .Values.api.tls.secretName | default "powerdns-api-tls" | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.api.host | quote }}
      http:
        paths:
          - path: {{ .Values.api.path | default "/api" | quote }}
            pathType: {{ .Values.api.pathType | default "Prefix" }}
            backend:
              service:
                name: powerdns                       # subchart's Service name (matches chart fullname when nameOverride empty)
                port:
                  number: {{ .Values.powerdns.powerdns.webserver.bindPort | default 8081 }}
{{- end }}
