{{- /*
dnsdist companion — query rate-limiting + DDoS posture in front of every
PowerDNS replica.

Per #167 the public NS endpoints carry full DDoS exposure; dnsdist's
MaxQPSIPRule is the first line of defence. The companion runs as a
separate Deployment so the upstream powerdns chart stays unmodified.

Per docs/INVIOLABLE-PRINCIPLES.md #4 the qps threshold + image refs +
backend address all come from values.yaml.
*/}}
{{- if .Values.dnsdist.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnsdist-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-powerdns.dnsdistLabels" . | nindent 4 }}
data:
  dnsdist.conf: |
    {{- tpl .Values.dnsdist.config . | nindent 4 }}
---
{{- /*
Workload kind (#5086, Refs #4765). DEFAULT: a Deployment fronted by the
Cilium LB-IPAM anycast VIP (anycast-endpoint.yaml). On Hetzner the LB-IPAM
`sovereign-vip` pool is gated OFF and hcloud-ccm cannot materialise the
anycast Service (no location annotation, no nodePort), and on the reference
cloud the EIP's 1:1 NAT never delivers to the VIP, so node:53 never binds via
the VIP path. `dnsdist.hostPortMode: true` (the substitute
POWERDNS_DNSDIST_HOSTPORT, which every provider pack sets since NET-185) flips
dnsdist to a DaemonSet whose container claims hostPort:53 on EVERY node (a
balancer or a 1:1 NAT may target any node — CP + workers), giving public port
53 a real listener. §854-clean: hostPort ONLY, NEVER a NodePort (#4765). Deliberately
NO hostNetwork — dnsdist binds :53 inside the pod netns (Cilium
kube-proxy-replacement DNATs node:53 -> pod), so it never collides with the
Ubuntu-24.04 systemd-resolved stub already holding 127.0.0.53:53 on the host.
*/}}
{{- $hostPort := .Values.dnsdist.hostPortMode | default false }}
apiVersion: apps/v1
kind: {{ if $hostPort }}DaemonSet{{ else }}Deployment{{ end }}
metadata:
  name: dnsdist
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-powerdns.dnsdistLabels" . | nindent 4 }}
spec:
  {{- if not $hostPort }}
  replicas: {{ .Values.dnsdist.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dnsdist
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "bp-powerdns.dnsdistLabels" . | nindent 8 }}
      annotations:
        # Hash the rendered dnsdist.conf (post-tpl) so a values change rolls
        # the workload automatically. Avoid `include "<this file>"` —
        # that's a recursive template self-reference and Helm rejects it.
        checksum/config: {{ tpl .Values.dnsdist.config . | sha256sum }}
    spec:
      {{- if $hostPort }}
      # DNS front door on EVERY node the Hetzner LB targets (CP + workers).
      # Tolerate all taints so the CP node (an LB :53 target) is covered too —
      # mirrors bp-cilium's every-node clustermesh-proxy host-socket DaemonSet.
      tolerations:
        - operator: Exists
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 953
        runAsGroup: 953
        fsGroup: 953
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dnsdist
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.dnsdist.image.repository }}:{{ .Values.dnsdist.image.tag | default "1.9.14" }}"
          imagePullPolicy: {{ .Values.dnsdist.image.pullPolicy | default "IfNotPresent" }}
          args:
            - --supervised
            - --config=/etc/dnsdist/dnsdist.conf
          ports:
            - name: dns-udp
              containerPort: 53
              {{- if $hostPort }}
              hostPort: 53          # §854 node:53 direct bind — NEVER a NodePort (#4765)
              {{- end }}
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              {{- if $hostPort }}
              hostPort: 53          # §854 node:53 direct bind — NEVER a NodePort (#4765)
              {{- end }}
              protocol: TCP
          {{- /*
          The ClusterPolicy probes-present (Enforce after the bootstrap
          window) refuses any create or change of this workload unless the
          container declares both probes. Each is a TCP connect to dnsdist's
          own DNS listener: kubelet dials the pod's address on port 53, where
          dnsdist listens in both modes (hostPortMode maps the node's port 53
          to this same socket; the pod has no hostNetwork). The image ships no
          DNS client, and dnsdist's console and web server each need a second
          listener and a key, so the listener itself is the check.
          */}}
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            {{- with .Values.dnsdist.probes.liveness }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            {{- with .Values.dnsdist.probes.readiness }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE     # dnsdist binds :53 directly
          resources:
            {{- toYaml .Values.dnsdist.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/dnsdist
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dnsdist-config
---
apiVersion: v1
kind: Service
metadata:
  name: dnsdist
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-powerdns.dnsdistLabels" . | nindent 4 }}
spec:
  type: {{ .Values.dnsdist.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: dnsdist
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP }
{{- end }}
