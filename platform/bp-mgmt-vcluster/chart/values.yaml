# Catalyst Blueprint values for bp-mgmt-vcluster (DoD A4 — vCluster
# topology implementation, 2026-05-16).
#
# Per docs/INVIOLABLE-PRINCIPLES.md:
#   #1   waterfall — chart ships the full target shape on the first cut
#        (namespace + HelmRelease of upstream vcluster + NetworkPolicy
#        isolation). No "for now" subset.
#   #4   never hardcode — every operationally-meaningful value is
#        configurable via per-Sovereign overlay.
#   #4a  SHA-pinned images; CI fills .image.tag at promotion time when
#        the chart graduates to ghcr. The 0.20.0 default keeps the
#        bootstrap installable on a fresh Sovereign without waiting
#        for the SHA-mirror cycle (same migration plan as products/
#        dmz-vcluster/chart/values.yaml).
#   MIRROR-EVERYTHING — image repository routes through
#        harbor.openova.io/proxy-* (mothership Harbor proxy-cache) so
#        upstream-registry deletes / rate-limits never break a fresh
#        provision. Per-Sovereign post-handover overlay points at the
#        Sovereign's OWN Harbor.

catalystBlueprint:
  upstream:
    chart: vcluster
    version: "0.20.0"
    repo: "https://charts.loft.sh"

# ─── Registry mirror (MIRROR-EVERYTHING + Pillar 5 anti-tether #2940) ───
# Single source of truth for the container-registry host every image in
# this chart pulls through. Default `harbor.openova.io` preserves the
# mothership/bootstrap behaviour (the central Harbor proxy-cache).
#
# Two consumers:
#   1. The umbrella's own `bp-mgmt-vcluster.image` fail-fast helper
#      (_helpers.tpl) composes `<registryMirror>/<repository>:<tag>` so the
#      umbrella `mgmtVcluster.image.repository` no longer hardcodes the
#      host (it's now the registry-relative `proxy-ghcr/loft-sh/vcluster`).
#   2. The loft-sh subchart's real syncer image
#      (`vcluster.controlPlane.statefulSet.image.registry`) — a SUBCHART
#      values literal that Helm cannot self-template from THIS file. Slot 58
#      drives it via `${REGISTRY_MIRROR:=harbor.openova.io}` postBuild
#      substitution (same canonical pattern as the region-label substitute
#      already in that slot), so a per-Sovereign overlay sets the host in
#      ONE place. The subchart literal below stays the bootstrap fallback
#      so `helm template` with defaults renders identically.
#
# Post-bp-self-sovereign-cutover (Step-04 registry pivot, ADR-0002) the
# overlay points registryMirror at the Sovereign's OWN Harbor
# (`harbor.<sovereign-fqdn>`) and every pull re-points in one place.
#
# (Renamed from the prior `global.imageRegistry` knob, which the loft-sh
# subchart never honoured — it has no `global.imageRegistry`, only the
# per-image `controlPlane.statefulSet.image.registry` field — so that knob
# was dead config that produced no render effect. #2940.)
global:
  registryMirror: "harbor.openova.io"

mgmtVcluster:
  # Top-level enable gate.
  #
  # Founder direction 2026-05-28 (Refs #2537): every region runs the
  # symmetric triad MGMT+RTZ+DMZ. The historical asymmetric A4 contract
  # (primary=MGMT+DMZ, secondary=DMZ+RTZ) is superseded — the
  # SOVEREIGN_REGION_ROLE gate that would have flipped this on only on
  # primary regions never landed, and is no longer needed.
  #
  # Default ON: this slot renders on every region of every Sovereign.
  # Operators who want to opt out (single-region SME tier) flip this
  # to false via per-Sovereign overlay.
  enabled: true

  # ── Topology identity ───────────────────────────────────────────────
  # Host namespace this vCluster's pods land in (inside the HOST k3s).
  # The vCluster syncer creates `<pod>-x-<inner-ns>-x-<vclusterName>`
  # mirror pods in this namespace per upstream convention.
  hostNamespace: mgmt

  # The vCluster's Kubernetes name. Becomes
  # `<vclusterName>.<hostNamespace>.svc.cluster.local` on the host.
  vclusterName: mgmt

  # Per the topology contract this chart renders ONLY on the primary
  # region. The bootstrap-kit Kustomization gates render via the
  # SOVEREIGN_REGION_ROLE substitute (introduced 2026-05-16 alongside
  # this chart, see infra/hetzner/cloudinit-control-plane.tftpl primary
  # CP postBuild block).
  role: primary

  # ── NodeSelector pin to this region's CP ────────────────────────────
  # vCluster pods MUST run on the region's own CP node so cross-region
  # traffic never silently lands in a foreign region. Per docs/
  # SOVEREIGN-MULTI-REGION-DOD.md A2 inter-region link goes through
  # DMZ WG; intra-region stays inside host k3s. The nodeSelector key
  # `openova.io/region` is stamped on every Hetzner CP node by
  # cloud-init (infra/hetzner/cloudinit-control-plane.tftpl §node-
  # labels). Empty value = no pinning (single-region or test
  # rendering).
  nodeSelector:
    regionLabelKey: "openova.io/region"
    # The primary region's key — substituted by the bootstrap-kit
    # Kustomization via `${SOVEREIGN_REGION_LABEL}` (e.g.
    # `hz-nbg-rtz-prod`). Empty default keeps the chart renderable
    # for `helm template` smoke tests without a Sovereign context.
    regionLabelValue: ""

  # ── Image (MIRROR-EVERYTHING) ─────────────────────────────────────
  # #2940 Pillar 5: `repository` is now the registry-RELATIVE path only.
  # The `bp-mgmt-vcluster.image` helper prepends `global.registryMirror`
  # (default `harbor.openova.io`) so the registry host has ONE source of
  # truth. Post-handover the per-Sovereign overlay flips global.registryMirror
  # to `harbor.<sovereign-fqdn>` and this image re-points with it.
  # NB this image ref is consumed ONLY by the umbrella's fail-fast guard
  # (templates/namespace.yaml) — the vCluster's ACTUAL syncer image is the
  # subchart value `vcluster.controlPlane.statefulSet.image` below; both
  # are kept in lockstep. Backward-compat: a host-qualified repository
  # (pre-#2940 shape) is still honoured verbatim by the helper.
  image:
    repository: "proxy-ghcr/loft-sh/vcluster"
    # #3642/#3736: 0.21.0 → 0.23.0 in lockstep with the subchart
    # dependency bump (Chart.yaml) + the real syncer image tag below.
    tag: "0.23.0"
    pullPolicy: "IfNotPresent"

  # ── NetworkPolicy isolation baseline ───────────────────────────
  # The MGMT vCluster's host namespace runs default-deny: every
  # ingress flow is denied unless explicitly allowed. Cross-vCluster
  # intra-region traffic between MGMT and DMZ stays inside the host
  # k3s via Cilium endpoint identity routing — the allowlist below
  # permits the DMZ namespace to call MGMT for the catalyst-api
  # control plane.
  networkPolicy:
    enabled: true
    # Namespaces that may ingress this vCluster. Defaults to {dmz}
    # so the DMZ-fronted public services (console, gitea, etc.) can
    # reach catalyst-api on the MGMT side. Operators add more
    # entries via per-Sovereign overlay.
    allowedIngressNamespaces:
      - dmz
      # REQUIRED: the Flux helm-controller (ns flux-system) manages the
      # in-vCluster HelmReleases targeted here (gitea/keycloak/harbor/openbao/
      # nats-jetstream) through the vc-mgmt kubeconfig → vcluster API :443.
      # This chart sets no allowWorldIngress (defaults false), so without this
      # entry those HRs StateError ("could not determine release state: dial
      # tcp …:443 i/o timeout") on their next reconcile — they only appear
      # healthy until Cilium starts enforcing the netpol. #3055
      - flux-system
      # REQUIRED: the host BSS control-plane services (billing/tenant/
      # domain/notification/provisioning/marketplace) whose event bus is
      # NATS. #3373 placement moved nats-jetstream INTO this MGMT vCluster,
      # so its host-synced Service
      # (nats-jetstream-x-nats-system-x-mgmt-vcluster.mgmt.svc) now sits
      # behind this isolation policy. Without this entry every such service
      # CrashLoops on "failed to connect to NATS … i/o timeout" → the
      # voucher/billing funnel back-half (#3376) is dead. Endpoints are
      # healthy; the policy is the wall. #3376
      #
      # #3859 (2026-06-19): the BSS tier moved from the legacy `sme`
      # namespace to `org-services` (eradicate-sme-naming), but this
      # allow-list still only admitted `sme` → on hw167 tenant/provisioning
      # CrashLoopBackOff'd on NATS i/o-timeout, blocking the #3376 funnel.
      # `org-services` is the live namespace; `sme` is kept one release for
      # back-compat / any not-yet-migrated Sovereign.
      - org-services
      - sme
      # ── #3642 host-bridge carve-outs ──────────────────────────────────
      # The #3642 host→mgmt move re-homes keycloak (auth.) + grafana into
      # this vCluster behind the isolation netpol. Their HOST-side
      # consumers + the host Cilium Gateway that fronts their host-bridged
      # HTTPRoutes now sit OUTSIDE the vCluster and are denied unless their
      # namespace is allow-listed (mirrors the #3423 sme→NATS carve-out,
      # commit cc3a7abcf). Per docs/sessions/2026-06-14/3373-migration-plan
      # §7 batch-D consumer set:
      #   gateway-system + kube-system — the host Cilium Gateway dials the
      #     syncer-mangled Service backendRef (keycloak-x-…, grafana-x-…)
      #     of every host-bridged HTTPRoute. Without these the public route
      #     503s "no healthy upstream" even though the in-vCluster Pod is up.
      - gateway-system
      - kube-system
      #   catalyst-system — catalyst-api → keycloak (OIDC admin token, realm
      #     management); the control-plane reaches the moved IdP.
      - catalyst-system
      #   newapi — newapi → keycloak (OIDC client) after newapi's own move.
      - newapi
      #   sso-bridge — bp-sso-bridge reconciler → keycloak (realm/client
      #     bootstrap) while it stays host-side.
      - sso-bridge
      #   oidc-gate — host slot 13c auth proxy on the gateway datapath →
      #     the moved keycloak realm.
      - oidc-gate
      # ── #3642 follow-on host-bridge carve-outs ────────────────────────
      # The remaining 5 host→mgmt moves (openbao auth., harbor registry.,
      # gitea gitea., newapi newapi., guacamole guacamole.) re-home behind this
      # isolation netpol. The gateway-system/kube-system + catalyst-system/
      # newapi/sso-bridge/oidc-gate entries above already cover the host Cilium
      # Gateway dialing every host-bridged route's mangled backendRef + the
      # openbao/newapi SSO consumers. Per docs/sessions/2026-06-14/
      # 3373-migration-plan §7 batch-D set, the additional consumer namespaces:
      #   harbor + gitea — their host-rendered CNPG `-rw` Services (harbor-pg-rw,
      #     gitea-pg-rw) are reached cross-cluster by their now-in-vCluster Pods;
      #     and velero (registry backup) → harbor. Allow-list both host ns.
      - harbor
      - gitea
      #   velero — host slot 34 backs up harbor (registry) + the CNPG WAL/cluster
      #     backup of the host-rendered Clusters.
      - velero
      #   rtz — when a moved app SHARES the rtz shared-pg/cnpg-pair (the
      #     cross-vCluster DB wire) instead of owning its host-bridged Cluster,
      #     its in-mgmt Pod must reach rtz. Required once batch-C moves shared-pg.
      - rtz
      #   external-secrets-system — the host external-secrets-operator (slot 15)
      #     is the PRIMARY consumer of the now-in-vCluster OpenBao: its
      #     ClusterSecretStore `vault-region1` dials
      #     `openbao-x-openbao-x-mgmt-vcluster.mgmt.svc:8200` on EVERY reconcile
      #     (K8s-auth login + every `secret/sso/*` read). Dropped here, the store
      #     is `InvalidProviderConfig` (`unable to log in with Kubernetes auth:
      #     context deadline exceeded`) and EVERY `*-sso-oidc-credentials`
      #     ExternalSecret stays SecretSyncedError → the oidc-gate sidecars
      #     (grafana/hubble) + the per-app SSO consumers CreateContainerConfigError
      #     → the public surface 503s. The #3642 carve-out list shipped the
      #     gateway/consumer namespaces but DROPPED external-secrets-system even
      #     though openbao moved INTO vc-mgmt — the same secret-not-reachable
      #     class as the openbao/* fromHost-mirror miss (#3760). hw165 live RCA
      #     (#3820): a host pod pinned in external-secrets-system timed out to
      #     openbao:8200 while a freshly-minted host ESO SA token logged in fine
      #     from inside the openbao pod (cross-cluster TokenReview healthy) — the
      #     ONLY wall was this ingress allow-list. Refs #3820 #3642.
      - external-secrets-system

# ─── Host→vCluster plain-name reachability aliases (#3642 hw164 fix) ───
# Static host ExternalName Services that alias the PLAIN in-vCluster app
# names (dialled by ~20 host-side consumers) to the `sync.toHost.services`
# mangled names. Replaces the crash-prone replicateServices.toHost.
# Rendered by templates/host-service-aliases.yaml (see its header).
hostServiceAliases:
  enabled: true
  aliases:
    - name: keycloak
      namespace: keycloak
      externalName: keycloak-x-keycloak-x-mgmt-vcluster.mgmt.svc.cluster.local
      port: 8080
    - name: gitea-http
      namespace: gitea
      externalName: gitea-http-x-gitea-x-mgmt-vcluster.mgmt.svc.cluster.local
      port: 3000
    - name: openbao
      namespace: openbao
      externalName: openbao-x-openbao-x-mgmt-vcluster.mgmt.svc.cluster.local
      port: 8200

# ─── Upstream chart values (subchart key: vcluster) ────────────────
# `helm dependency build` resolves the upstream loft-sh/vcluster
# chart as a subchart; values here under the `vcluster:` key flow
# into that subchart unchanged. Schema is the upstream 0.20.0
# values.yaml. Per docs/INVIOLABLE-PRINCIPLES.md #4 every knob is
# operator-bumpable via per-Sovereign overlay.
vcluster:
  controlPlane:
    distro:
      k8s:
        enabled: true
        # #3380-D Pillar-5 anti-tether (2026-06-13): pin the k8s distro
        # control-plane images (apiServer / controllerManager / scheduler)
        # off upstream `registry.k8s.io` and onto the Sovereign-local Harbor
        # `proxy-k8s` cache. WITHOUT this, the loft-sh subchart defaults all
        # three to `registry.k8s.io/kube-{apiserver,controller-manager,
        # scheduler}` — confirmed LIVE on hw130 (`mgmt-vcluster-0`
        # initContainers `registry.k8s.io/kube-apiserver:v1.31.4` +
        # `registry.k8s.io/kube-controller-manager:v1.31.4`). Under the
        # `harbor-proxy-pull` ClusterPolicy (Enforce — every image must match
        # `*/proxy-*/*` or `*/openova-io/*`), the NEXT image roll of these
        # control-plane pods would be DENIED at admission — a self-inflicted
        # wound the moment the vCluster reschedules. `registry.k8s.io` is
        # proxied by Harbor's `proxy-k8s` project (chart 0.1.x proxyProjects),
        # so `harbor.openova.io/proxy-k8s/kube-apiserver:<tag>` resolves the
        # identical upstream digest through the cache.
        #
        # The `harbor.openova.io` host is kept as the bootstrap default for
        # the same reason as the syncer image below — subchart values can't
        # self-template `global.registryMirror`; bootstrap-kit slot 58 flips
        # the host via `${REGISTRY_MIRROR:=harbor.openova.io}` postBuild
        # substitution and bp-self-sovereign-cutover Step-04 re-points it
        # post-handover. `tag` is left to the subchart default (the upstream
        # k8s version pin) so a vcluster subchart bump carries the matching
        # control-plane version automatically. Default `helm template` renders
        # the proxy path identically across all three distro components.
        apiServer:
          image:
            registry: harbor.openova.io
            repository: proxy-k8s/kube-apiserver
        controllerManager:
          image:
            registry: harbor.openova.io
            repository: proxy-k8s/kube-controller-manager
        scheduler:
          image:
            registry: harbor.openova.io
            repository: proxy-k8s/kube-scheduler
    backingStore:
      database:
        embedded:
          enabled: true
    statefulSet:
      # NodeSelector pin — see mgmtVcluster.nodeSelector above. The
      # umbrella's _helpers.tpl `bp-mgmt-vcluster.nodeSelector` helper
      # injects this at render time so per-Sovereign overlays can
      # override either of the two keys without touching the subchart
      # directly. NOTE: when bootstrap-kit slot 58 substitutes a real
      # region label the rendered map below becomes `{openova.io/
      # region: hz-nbg-rtz-prod}`; empty value = empty map.
      scheduling:
        nodeSelector: {}
      image:
        # The upstream chart's controlPlane.statefulSet.image is the
        # vCluster syncer image — the ACTUAL image the vCluster runs.
        # MIRROR-EVERYTHING via Harbor proxy.
        #
        # #2940 Pillar 5 anti-tether: this `registry` is a SUBCHART values
        # literal, which Helm cannot derive from `global.registryMirror` in
        # this same values.yaml (subchart values can't self-template). The
        # `harbor.openova.io` default is therefore kept here as the
        # bootstrap fallback (so `helm template` with defaults renders
        # identically to pre-#2940), and the single overlay knob is wired
        # in bootstrap-kit slot 58, which sets
        # `registry: ${REGISTRY_MIRROR:=harbor.openova.io}` via Flux
        # postBuild.substitute — exactly the canonical pattern the
        # SOVEREIGN_REGION_CANONICAL_LABEL substitute already uses in that
        # slot. A per-Sovereign overlay (or the bp-self-sovereign-cutover
        # Step-04 registry pivot, ADR-0002) re-points the host in ONE place.
        # Keep this in lockstep with the umbrella `mgmtVcluster.image` above.
        registry: harbor.openova.io
        repository: proxy-ghcr/loft-sh/vcluster
        # #3642/#3736: the ACTUAL vCluster syncer image — bumped 0.21.0 →
        # 0.23.0 to match the subchart dependency version (Chart.yaml). The
        # 0.23.0 syncer is the binary that honours sync.fromHost.secrets.
        tag: "0.23.0"
      resources:
        requests:
          cpu: "200m"
          memory: "384Mi"
        limits:
          cpu: "2"
          memory: "1Gi"
      persistence:
        volumeClaim:
          enabled: true
          size: "5Gi"
          storageClass: "local-path"
    service:
      enabled: true
      spec:
        type: ClusterIP

  # ── #3642/#3737-DNS host→vCluster Service mirror (4th-layer SHARED_PG fix) ──
  # The NS#1 apps re-homed into vc-mgmt (#3642) consume the 3 HOST-level
  # shared-pg instances that live in the host `shared-data` namespace (North
  # Star #2: 3 shared instances, 6-7 apps many-to-many). Each app's
  # emberstack-reflector-minted `<app>-database-secret` carries the HOST FQDN
  # `shared-pg[-b|-c]-rw.shared-data.svc.cluster.local`. The in-vCluster Pod is
  # a REAL host pod (shared CNI) so the host ClusterIP is reachable — but the
  # NAME does not resolve inside vc-mgmt: the vCluster's own CoreDNS only knows
  # vCluster-local services, and `sync.toHost.services` mirrors the OTHER
  # direction (vCluster→host). The `sync` PG `customResources` mechanism (lines
  # ~332-341) only resolves PG Clusters CREATED INSIDE the vCluster, NOT a
  # host-level shared instance. Result (hw163, 2026-06-18): keycloak-0
  # CrashLoopBackOff — `cannot resolve host
  # "shared-pg-rw.shared-data.svc.cluster.local" … on <vc-coredns>:53: no such
  # host` — the #3642-vs-NorthStar-#2 collision. `replicateServices.fromHost`
  # creates a vCluster Service per host shared-pg endpoint so the host FQDN
  # resolves natively inside vc-mgmt (routes to the host ClusterIP via the
  # shared CNI). Eventually-consistent: the syncer watches the host service and
  # materialises the mirror once bp-postgres-shared renders it — on a fresh
  # prov the vCluster starts before shared-pg exists (no-op until present). All
  # 3 instances × rw/ro so EVERY SHARED_PG consumer (any instance) resolves
  # with zero per-app special-casing (#3642 DoD-6 "no per-app special-casing").
  #
  # ── #3374 hw167: ALSO mirror the ClusterMesh-global `-mesh-rw` / `-mesh`
  # write/read services ──
  # On a 2-region (active-hot-standby) Sovereign, bp-postgres mints a
  # cross-region consumer's DB host to the GLOBAL write Service
  # `<instance>-mesh-rw` (platform/postgres _helpers.tpl writeServiceName,
  # gated on activeHotStandby) so writes resolve identically in either region
  # and follow CNPG promotion. grafana is exactly such a consumer: its
  # `grafana-database-env` Secret carries
  # `GF_DATABASE_HOST=shared-pg-b-mesh-rw.shared-data.svc.cluster.local:5432`.
  # The non-mesh `-rw` mirrors above DON'T cover this name, so grafana-in-vc-mgmt
  # CrashLoopBackOff'd on hw167 — `dial tcp: lookup
  # shared-pg-b-mesh-rw.shared-data.svc.cluster.local … no such host` — leaving
  # the gateway with no Ready backend → `grafana.<fqdn>` 503 "no healthy
  # upstream" (UAT 3374-05). keycloak/harbor survived only because they happen
  # to dial the plain `shared-pg-rw` (instance "a", already mirrored). Mirror
  # all 3 instances × {mesh-rw (global write), mesh (global read — note the read
  # global is named `-mesh`, NOT `-mesh-ro`)} so every active-hot-standby
  # consumer resolves with zero per-app special-casing. Same no-op-until-present
  # semantics — the mesh Services only render once activeHotStandby is on.
  networking:
    replicateServices:
      fromHost:
        - from: shared-data/shared-pg-rw
          to: shared-data/shared-pg-rw
        - from: shared-data/shared-pg-ro
          to: shared-data/shared-pg-ro
        - from: shared-data/shared-pg-b-rw
          to: shared-data/shared-pg-b-rw
        - from: shared-data/shared-pg-b-ro
          to: shared-data/shared-pg-b-ro
        - from: shared-data/shared-pg-c-rw
          to: shared-data/shared-pg-c-rw
        - from: shared-data/shared-pg-c-ro
          to: shared-data/shared-pg-c-ro
        # ── #3374 guacamole-pg host→vCluster reachability (the SERVICE half) ──
        # guacamole is host-bridged (#3642): slot 52 ships
        # `guacamole.database.cluster.enabled=false` + `httproute.enabled=false`,
        # so the CNPG `guacamole-pg` Cluster is HOST-rendered in host
        # `catalyst-system` while the webapp + the JDBC schema-seed Job run INSIDE
        # vc-mgmt. The `sync.fromHost.secrets` `catalyst-system/*` mapping already
        # mirrors the `guacamole-pg-app` Secret in, but the CNPG `-rw`/`-ro`
        # SERVICES live host-side only — so `guacamole-pg-rw` did NOT resolve
        # inside vc-mgmt (`getent hosts guacamole-pg-rw` → NXDOMAIN, hw167). The
        # seed Job's psql looped its 5-min wait_for_db, hit
        # activeDeadlineSeconds → DeadlineExceeded → Helm rolled the whole install
        # back → no webapp/guacd/HTTPRoute backend → `guacamole.<fqdn>` edge
        # 500/503 (32 installFailures on hw167). Same 4th-layer DNS gap fixed for
        # shared-pg above; mirroring these two Services makes BOTH the seed Job's
        # short-name `guacamole-pg-rw` AND the webapp's
        # `POSTGRESQL_HOSTNAME=guacamole-pg-rw.catalyst-system.svc.cluster.local`
        # resolve. No-op until the host-bridge renders the Cluster (additive).
        - from: catalyst-system/guacamole-pg-rw
          to: catalyst-system/guacamole-pg-rw
        - from: catalyst-system/guacamole-pg-ro
          to: catalyst-system/guacamole-pg-ro
        # ── #3831 newapi-pg host→vCluster reachability (the SERVICE half) ──
        # newapi is the ONLY NorthStar-#1 app that OWNS a dedicated CNPG cluster
        # (it does NOT consume a reflected shared-pg secret like the other 6).
        # Re-homed into vc-mgmt like guacamole (#3642 host-bridge): slot 80
        # ships placement.role=vcluster-app + cnpg.enabled=false, so the CNPG
        # `newapi-bp-newapi-newapi-pg` Cluster is HOST-rendered in the host
        # `newapi` ns by the slot-80a host-seams HR while the app Deployment +
        # Service run INSIDE vc-mgmt. The `newapi/*` from-host secret mapping
        # (below) already mirrors the DSN Secret, but the CNPG `-rw`/`-ro`
        # SERVICES live host-side only — and the DSN baked by the host
        # database-secret-sync Job points at
        # `newapi-bp-newapi-newapi-pg-rw.newapi.svc.cluster.local:5432`, which is
        # NXDOMAIN inside vc-mgmt without this mirror → the app's GORM connect
        # fails. Mirroring both Services makes that host-style FQDN resolve in
        # the vCluster. No-op until the host-seams HR renders the Cluster
        # (additive). Same 4th-layer DNS gap fixed for guacamole-pg above.
        - from: newapi/newapi-bp-newapi-newapi-pg-rw
          to: newapi/newapi-bp-newapi-newapi-pg-rw
        - from: newapi/newapi-bp-newapi-newapi-pg-ro
          to: newapi/newapi-bp-newapi-newapi-pg-ro
        # ClusterMesh-global write endpoints (active-hot-standby): the host
        # FQDN cross-region SHARED_PG consumers (grafana et al.) actually dial.
        - from: shared-data/shared-pg-mesh-rw
          to: shared-data/shared-pg-mesh-rw
        - from: shared-data/shared-pg-b-mesh-rw
          to: shared-data/shared-pg-b-mesh-rw
        - from: shared-data/shared-pg-c-mesh-rw
          to: shared-data/shared-pg-c-mesh-rw
        # ClusterMesh-global read endpoints (active-hot-standby) — named
        # `<instance>-mesh` (the read global), no `-mesh-ro` variant exists.
        - from: shared-data/shared-pg-mesh
          to: shared-data/shared-pg-mesh
        - from: shared-data/shared-pg-b-mesh
          to: shared-data/shared-pg-b-mesh
        - from: shared-data/shared-pg-c-mesh
          to: shared-data/shared-pg-c-mesh
      # ── #3642 host→vCluster gitea reachability (the MIRROR of fromHost above) ──
      # #3642 moved gitea INTO vc-mgmt, but bp-catalyst-platform stays HOST-side
      # (catalyst-system). Its in-cluster gitea consumers — the
      # `catalyst-gitea-token` mint hook (chart catalyst-gitea-token-secret.yaml:
      # `url: http://gitea-http.gitea.svc.cluster.local:3000`), the
      # `catalyst-gitea-tenants-repo-bootstrap` pre-install hook, and catalyst-api
      # itself (CATALYST_GITEA_URL) — dial `gitea-http.gitea.svc.cluster.local`
      # on the HOST. After #3642 the host `gitea` ns has only the CNPG DB; the
      # real gitea-http runs INSIDE vc-mgmt → the host name does not resolve →
      # the token never mints → the bp-catalyst-platform pre-install hook
      # CrashLoops `secret "catalyst-gitea-token" not found` → install times out
      # → CONSOLE NEVER COMES UP (root-caused live on hw163, 2026-06-18).
      #
      # WALK-TIME EXTENSION (#3642 audit, 2026-06-18): `sync.toHost.services`
      # only projects in-vCluster Services to the host as MANGLED
      # `<svc>-x-<ns>-x-mgmt-vcluster.mgmt.svc` — the plain `<svc>.<ns>.svc` does
      # NOT exist host-side (zero ExternalName aliases anywhere). So THREE host
      # name families are stranded, dialled by every host-side controller, the
      # gitea-token mint, AND the sso-bridge reconciler (THE walk-blocker — it
      # mints every app's keycloak client + writes secret/sso/<app>; with these
      # unreachable, all 6 SSO ExternalSecrets stay empty and zero-login
      # collapses):
      #   1. gitea-http.gitea.svc:3000  — org/app/env/blueprint controllers,
      #      the catalyst-gitea-token mint, catalog-sovereign GitRepository.
      #   2. keycloak.keycloak.svc:8080 — catalyst-api CATALYST_KC_ADDR,
      #      org-controller keycloakAddr, sso-bridge KC_ADDR.
      #   3. openbao.openbao.svc:8200   — catalyst-api openbaoAddr, sso-bridge
      #      OPENBAO_ADDR (writes secret/sso/<app>).
      # ⛔ replicateServices.toHost REMOVED (#3642 follow-up, 2026-06-18, hw164
      # root-cause): the `{from,to}` object form CRASHES the vcluster 0.23 syncer
      # at RUNTIME (`parse physical service mapping: invalid service mapping,
      # please use namespace1/service1=service2`) — render-validation passes, the
      # binary dies on boot, mgmt-vcluster-0 CrashLoops, vc-mgmt secret never
      # mints, and EVERY in-vCluster app wedges. Worse, vcluster's toHost target
      # is a bare service NAME placed in the vCluster's HOST-target namespace
      # (not `<ns>/<svc>`), so it could never recreate `gitea-http.gitea.svc`
      # anyway. The host→vCluster PLAIN-NAME reachability the 3 families need
      # (gitea-http.gitea.svc:3000 / keycloak.keycloak.svc:8080 /
      # openbao.openbao.svc:8200, dialled by catalyst-api, the org/app/env/
      # blueprint controllers, the gitea-token mint, and the sso-bridge) is now
      # delivered by static host ExternalName Services that alias the plain name
      # to the `sync.toHost.services` mangled name (templates/host-service-
      # aliases.yaml) — those mangled Services reliably exist (harbor proved it),
      # so the alias resolves with zero syncer-crash risk. Proven live on hw164.
      toHost: []

  # sync — what host-cluster resources sync into the vCluster. The
  # MGMT vCluster needs services + endpoints + configmaps + secrets
  # to talk to the bootstrap services that live in the host (cnpg,
  # gitea, openbao, keycloak). Ingresses + nodes + PVs are
  # intentionally NOT synced (host enforces, vcluster sees abstract
  # versions).
  sync:
    toHost:
      services:
        enabled: true
      ingresses:
        enabled: false
      persistentVolumeClaims:
        enabled: true
      configMaps:
        enabled: true
      secrets:
        enabled: true
      # G92.3 #2662 (2026-06-01) — CNPG `Cluster` CR sync vCluster → host.
      # Required by every MGMT-tier chart that ships a Helm-templated
      # `postgresql.cnpg.io/v1.Cluster` (bp-gitea, bp-harbor, and the
      # follow-up bp-catalyst-platform move). Per G92.6 #2665 the
      # cnpg-operator stays on host substrate; without this sync block
      # the Cluster CR lands inside the vCluster apiserver where the
      # operator can't see it, the chart's Capabilities gate fails
      # silently, and no PostgreSQL is provisioned.
      #
      # vCluster 0.21+'s `customResources` syntax (the loft-sh subchart
      # bump from 0.20.0 → 0.21.0 landed in PR #2690 / e0148e2c) makes
      # the mirror declarative: the syncer watches Cluster CRs in the
      # vCluster's apiserver and writes them to the host k3s in a
      # syncer-mangled namespace (`<inner-ns>-x-<vcluster>`), where the
      # cnpg-operator reconciles them and creates the StatefulSet pods.
      # The already-enabled `services` sync above carries the PG
      # Service back into the vCluster's view, so the chart's
      # `<release>-pg-rw.<inner-ns>.svc.cluster.local` URL resolves
      # natively from inside the vCluster.
      #
      # Coverage:
      #   clusters.postgresql.cnpg.io         primary CR — every CNPG-
      #                                       backed service ships one
      #                                       (gitea-pg, harbor-pg,
      #                                       catalyst-pg, openbao-audit-pg)
      #   poolers.postgresql.cnpg.io          read-replica routing for
      #                                       active-hot-standby tier
      #   scheduledbackups.postgresql.cnpg.io daily backup CRs (host's
      #                                       backup quota applies)
      #
      # ⚠️ EMPIRICAL CORRECTION (#3373, hw130 2026-06-13): enabling a CRD
      # under `sync.toHost.customResources` does NOT register the CRD
      # *definition* inside the vCluster apiserver on the OSS vCluster build
      # we run (`loft-sh/vcluster:0.21.0`). Verified live on hw130's vc-mgmt:
      # with all five entries below enabled in the running syncer config
      # secret (`vc-config-mgmt-vcluster`), the vCluster apiserver had ZERO
      # of these CRDs registered, the syncer boot log created ZERO
      # custom-resource syncer controllers, and an in-vcluster
      # `kubectl apply` of an HTTPRoute failed with `no matches for kind
      # "HTTPRoute"`. The toHost custom-resource SYNC (and its CRD
      # auto-import) is a vCluster Pro/Platform-gated feature (the binary
      # carries "pro feature" gates) — so this block is schema-accepted but
      # INERT on OSS. It is kept (a) so a Pro-licensed operator activates the
      # toHost mirror without a values change, and (b) as the declarative
      # record of which CRs are intended to mirror host-ward. The actual
      # CRD *registration inside the vCluster* — the prerequisite that lets
      # an in-vcluster app create these CRs at all — is done by the
      # OSS-native init-manifests deployer under
      # `experimental.deploy.vcluster.manifests` below (proven on hw130).
      customResources:
        clusters.postgresql.cnpg.io:
          enabled: true
        poolers.postgresql.cnpg.io:
          enabled: true
        scheduledbackups.postgresql.cnpg.io:
          enabled: true
        # #3373: charts re-homed INTO this vCluster ship HTTPRoute (Gateway
        # API) and ExternalSecret CRs. On a Pro-licensed build the toHost
        # mirror carries them host-ward; the in-vcluster CRD registration
        # that lets the app create them at all is the init-manifest below.
        httproutes.gateway.networking.k8s.io:
          enabled: true
        externalsecrets.external-secrets.io:
          enabled: true
    fromHost:
      ingressClasses:
        enabled: true
      # ── #3642/#3736 host→vCluster Secret mirror (GOVERNING CONSTRAINT #2) ──
      # The host-bridge (#3642) keeps each re-homed app's HTTPRoute +
      # ExternalSecret + CNPG `Cluster` CR HOST-rendered so the host Cilium
      # Gateway / external-secrets-operator / cnpg-operator (all host-minimum
      # substrate) reconcile them — but the app's WORKLOAD Pod, which now runs
      # INSIDE vc-mgmt, still needs the Secret those host-side resources MINT:
      #   - a CNPG/reflector DB credential — `<app>-database-secret` (the
      #     emberstack-reflector hub Secret, e.g. keycloak-database-secret /
      #     gitea-database-secret / harbor-database-secret /
      #     newapi-database-secret) and/or the CNPG-app Secret `<app>-pg-app`
      #     (gitea-pg-app) / `guacamole-pg`.
      #   - a host-ESO SSO Secret — `<app>-sso-oidc-credentials`
      #     (harbor-/grafana-/openbao-/gitea-/newapi-).
      # On OSS vcluster 0.21.0 NO mechanism delivered it across the
      # host→vCluster boundary (the in-vCluster Pod mounts from the vCluster's
      # OWN apiserver, a different namespace store than the host's): an
      # in-vCluster ExternalSecret can't reconcile (ESO is host-minimum, slot
      # 15; toHost custom-resource sync is Pro-gated/inert on OSS), and
      # `sync.fromHost.secrets` did not EXIST until vcluster 0.23.0. Result:
      # keycloak-0 hung on `MountVolume.SetUp … secret
      # "keycloak-database-secret-x-keycloak-x-mgmt-vcluster" not found`
      # (#3737 SHARED_PG terminal blocker) and grafana/harbor/gitea/newapi
      # booted without their SSO/DB env. THIS block is that delivery
      # mechanism — genuinely OSS in 0.23.0 (no `product:"pro"` tag → no
      # admin.loft.sh tether → the Pillar-5 cutover deny-egress hold passes).
      #
      # `mappings.byName` is a map[string]string keyed `"<hostNs>/<name>"` →
      # valued `"<vClusterNs>/<name>"`; `*` wildcards the NAME component. We
      # use the documented namespace-wildcard idiom `"<ns>/*": "<ns>/*"` per
      # moved-app HOST namespace so EVERY host Secret in that namespace (DB
      # hub Secret, CNPG-app Secret, SSO ExternalSecret-materialised Secret,
      # and any future addition) mirrors into the identically-named vCluster
      # namespace with zero per-secret enumeration — the generic mechanism
      # (#3642 DoD-6 "no per-app special-casing"), not a per-secret hack. The
      # namespaces are exactly the 7 NS#1 apps' inner namespaces
      # (keycloak/gitea/harbor/newapi/grafana/openbao, plus catalyst-system for
      # guacamole — guacamole's `guacamole-pg` CNPG-app Secret + the
      # bp-continuum/k8s-ws-proxy host-adjacent peers share that namespace).
      # On a fresh prov the host namespaces that don't yet exist are simply
      # not mirrored (no-op) until the host-bridge renders them — additive
      # and safe. Independent of the existing `sync.toHost.secrets`
      # (vCluster→host); the two directions don't conflict.
      #
      # ⚠️ openbao — EXACT-NAME mappings, NOT `openbao/*` (#3838, the
      # fresh-prov keycloak install-loop root cause). openbao is the 7th NS#1
      # app re-homed into vc-mgmt (placement.yaml `hr: bp-openbao, vcluster:
      # mgmt, namespace: openbao`). Its in-vc-mgmt workloads need exactly two
      # HOST-minted Secrets:
      #   - `openbao-sso-oidc-credentials` (host ESO reconciles it from
      #     secret/sso/openbao; the sso-configure Deployment mounts it,
      #     optional:true → WAITS rather than CrashLoops).
      #   - `openbao-host-token-reviewer-static` (the Opaque copy of the host
      #     SA token + host CA the auth-bootstrap Job mounts for cross-cluster
      #     TokenReview — #3825).
      # hw161's 0.2.13 used the namespace-wildcard `openbao/*`, which ALSO
      # swept the host `openbao-host-token-reviewer` Secret — type
      # `kubernetes.io/service-account-token`, carrying the
      # `kubernetes.io/service-account.name` annotation. vCluster's
      # `from-host-secret` syncer mirrors it into vc-mgmt, where the vCluster's
      # OWN token-controller re-stamps the SA-token Secret (the referenced SA
      # does not exist in the vCluster), so every reconcile sees host≠virtual
      # drift and RE-CREATES it — an infinite hot loop (measured 2833 `Create
      # virtual object` per 8000 syncer log lines on hw166, ~35% of ALL syncer
      # work). That loop saturates the syncer queue + host k3s apiserver →
      # `error syncing Secret keycloak/keycloak-database-secret to host
      # cluster: context deadline exceeded` → `keycloak-database-secret-x-
      # keycloak-x-mgmt-vcluster` never lands → keycloak-0 hangs
      # `Init:0/2` (MountVolume.SetUp), the post-install config-cli hook times
      # out at 30m, bp-keycloak install→remediate→reinstall loops, and the
      # whole spine (gitea → bp-catalyst-platform → console) stalls ~49/64 HRs.
      # The auth-bootstrap Job genuinely needs the token+CA, so the host slot
      # (placement.yaml `openbao-host-token-reviewer-export` Job, #3838) copies
      # them into the Opaque `openbao-host-token-reviewer-static` Secret — no
      # `service-account.name` annotation, so the vCluster token-controller
      # never touches it and the mirror is stable. Mirror that Opaque copy by
      # EXACT name; never wildcard a namespace that holds an SA-token Secret.
      # ⚠️ NEVER namespace-wildcard a host ns whose pod-mounted DB Secret the
      # in-vCluster pod also references (#3374 cycle-1, hw167 live RCA). On
      # vcluster 0.23.0 a Secret that is BOTH (a) imported via a
      # `sync.fromHost.secrets` wildcard AND (b) pod-mounted inside vc-mgmt
      # (so the `sync.toHost.secrets` "necessary" auto-sync also claims the
      # SAME virtual object) makes the from-host and to-host secret syncers
      # FIGHT over ownership — a delete/recreate loop that on any pod restart
      # ends in `context deadline exceeded`, the host projection never sticks,
      # and the app sits `Init:0/2` for 20m+. It is latent until the
      # mesh-secret regeneration (the #3872 `<instance>-mesh-rw` mirror) makes
      # the emberstack reflector REPOINT the host DB Secret → the from-host
      # importer rewrites the in-vCluster copy → pod restart → deadlock.
      # The 4 host-bridged apps each mint a pod-mounted DB Secret via the
      # shared-pg reflector (16a/16c) — `keycloak-database-secret`,
      # `grafana-database-env`, `gitea-database-secret`,
      # `harbor-database-secret` — every one previously swept in by the
      # `<ns>/*` wildcard. The validation agent hand-removed ONLY the
      # `keycloak/*` DB-secret import live on hw167 + created the DB Secret
      # natively in-vCluster (toHost/syncer path only → single owner, no
      # fight); this block applies that pattern durably to ALL 4: the DB
      # Secret is NEVER fromHost-imported, so the from-host syncer never
      # contends with the to-host syncer over it. Each namespace is narrowed
      # from `<ns>/*` to EXACT-NAME mappings covering ONLY the host-minted
      # Secrets an in-vCluster pod/reconciler still needs (the SSO/OIDC
      # ExternalSecret-materialised creds — gitea/harbor/grafana sso-configure
      # + grafana runtime mount them). keycloak has NO host-minted non-DB
      # Secret (its IdP creds are issued, not mounted), so it drops out
      # entirely. The DB Secret is delivered natively in-vCluster by the
      # sibling slot-16 change (#3878, the implemented companion to #3876):
      # bp-postgres 0.2.4's `reflect.mangledTarget` makes the shared-pg
      # reflector materialise the vCluster-syncer-mangled host object
      # `<secret>-x-<ns>-x-mgmt-vcluster` directly in host ns `mgmt` — the EXACT
      # object the in-vc-mgmt pod mounts in single-namespace mode (the
      # `MountVolume.SetUp … secret "keycloak-database-secret-x-keycloak-x-mgmt-
      # vcluster" not found` name above). Because that object is reflector-owned
      # and NEVER `sync.fromHost.secrets`-imported, the from-host syncer never
      # touches it (no from-host↔to-host ownership fight) AND it carries the
      # live randAlphaNum password (no missing credential on a fresh prov). The
      # toHost necessary-sync is its only in-vc owner. `newapi/*` +
      # `catalyst-system/*` keep their wildcards (out of this de-conflict's
      # 4-app scope, no observed rotation-driven deadlock); the openbao
      # EXACT-NAME entries (#3838) remain unchanged.
      secrets:
        enabled: true
        mappings:
          byName:
            # gitea/harbor/grafana — host-minted SSO/OIDC creds ONLY
            # (the pod-mounted DB Secret is intentionally NOT imported).
            "gitea/gitea-oauth-source-credentials": "gitea/gitea-oauth-source-credentials"
            "harbor/harbor-sso-oidc-credentials": "harbor/harbor-sso-oidc-credentials"
            "grafana/grafana-sso-oidc-credentials": "grafana/grafana-sso-oidc-credentials"
            # keycloak — NO entry: the only host-minted Secret it needs is
            # `keycloak-database-secret` (excluded above); it has no host SSO
            # Secret (Keycloak IS the IdP, it issues client creds, mounts none).
            "newapi/*": "newapi/*"
            "openbao/openbao-sso-oidc-credentials": "openbao/openbao-sso-oidc-credentials"
            "openbao/openbao-host-token-reviewer-static": "openbao/openbao-host-token-reviewer-static"
            "catalyst-system/*": "catalyst-system/*"

  # ── In-vCluster CRD registration (#3373, OSS-native) ────────────────────
  # The init-manifests deployer (`loft-sh/vcluster` controllers
  # `RegisterInitManifestsController` / `ApplyGivenInitManifests`, present in
  # the OSS binary) applies these manifests INSIDE the vCluster apiserver at
  # control-plane startup. They register the host CRDs that re-homed apps
  # must be able to CREATE from inside vc-mgmt — without them an in-vcluster
  # HelmRelease that ships an HTTPRoute / ExternalSecret / CNPG Cluster fails
  # its reconcile with `no matches for kind …` (the #3373 gap, reproduced
  # live on hw130's vc-mgmt 2026-06-13).
  #
  # These are STRUCTURAL CRDs (`x-kubernetes-preserve-unknown-fields: true`),
  # NOT copies of the full upstream schemas. Empirically (hw130 2026-06-13) a
  # structural CRD is sufficient for the vCluster apiserver to register the
  # kind and accept a fully-specified CR with the entire spec preserved
  # byte-for-byte (hostnames / parentRefs / backendRefs all round-tripped).
  # The host operators (Cilium Gateway-API, external-secrets-operator,
  # cnpg-operator) hold the AUTHORITATIVE full-schema CRDs and perform the
  # real validation + reconciliation host-side — the vCluster apiserver only
  # needs to accept the create. Shipping structural stubs (not 6 500-line
  # vendored CRDs) keeps this chart lean and free of upstream-CRD drift.
  #
  # NB: registering the CRD here makes the in-vcluster CREATE path work. On
  # OSS vCluster the toHost mirror of these CRs is Pro-gated (see the
  # customResources note above), so an app whose route must reach the HOST
  # Cilium Gateway still requires either a Pro license OR staying host-side.
  # Internal in-vcluster apps that merely need the kind to exist (e.g. an app
  # that owns its own in-vcluster CNPG Cluster reconciled by an in-vcluster
  # operator) work fully on OSS today.
  experimental:
    deploy:
      vcluster:
        manifests: |
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: httproutes.gateway.networking.k8s.io
            annotations:
              api-approved.kubernetes.io: "https://github.com/kubernetes-sigs/gateway-api/pull/1111"
              catalyst.openova.io/managed-by: bp-mgmt-vcluster
          spec:
            group: gateway.networking.k8s.io
            scope: Namespaced
            names:
              kind: HTTPRoute
              listKind: HTTPRouteList
              plural: httproutes
              singular: httproute
            versions:
              - name: v1
                served: true
                storage: true
                schema:
                  openAPIV3Schema:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              - name: v1beta1
                served: true
                storage: false
                schema:
                  openAPIV3Schema:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
          ---
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: externalsecrets.external-secrets.io
            annotations:
              catalyst.openova.io/managed-by: bp-mgmt-vcluster
          spec:
            group: external-secrets.io
            scope: Namespaced
            names:
              kind: ExternalSecret
              listKind: ExternalSecretList
              plural: externalsecrets
              singular: externalsecret
              shortNames:
                - es
            versions:
              - name: v1beta1
                served: true
                storage: true
                schema:
                  openAPIV3Schema:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
          ---
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: clusters.postgresql.cnpg.io
            annotations:
              catalyst.openova.io/managed-by: bp-mgmt-vcluster
          spec:
            group: postgresql.cnpg.io
            scope: Namespaced
            names:
              kind: Cluster
              listKind: ClusterList
              plural: clusters
              singular: cluster
              shortNames:
                - cnp
            versions:
              - name: v1
                served: true
                storage: true
                schema:
                  openAPIV3Schema:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true

  # exportKubeConfig — writes vc-<vclusterName> Secret into the host
  # namespace with a kubeconfig pointing at the vCluster's apiserver.
  # The Sovereign-side handlers (core/services/provisioning/handlers/
  # handlers.go mirrorVClusterKubeconfig) mirror this Secret into
  # flux-system as `mgmt-vcluster-kubeconfig` so per-Sovereign Flux
  # Kustomization CRs can reconcile MGMT-vCluster-targeted resources.
  # Writes a host-namespace Secret named `vc-mgmt` containing a kubeconfig
  # for the vCluster's apiserver. The Sovereign-side handler
  # (core/services/provisioning/handlers/handlers.go
  # mirrorVClusterKubeconfig) mirrors this Secret into flux-system as
  # `mgmt-vcluster-kubeconfig` so per-Sovereign Flux Kustomization CRs
  # can reconcile MGMT-vCluster-targeted resources.
  exportKubeConfig:
    context: vcluster
    # hw91 2026-06-04: same defect as bp-dmz-vcluster — the default
    # exported server is `https://localhost:8443`, unusable by the
    # host-cluster helm-controller / per-Sovereign Kustomizations that
    # consume the mirrored kubeconfig. Point at the host-side service
    # DNS before the first vc-mgmt-targeted HR trips over it.
    server: https://mgmt-vcluster.mgmt:443
    secret:
      name: vc-mgmt
