apiVersion: v2
name: bp-mgmt-vcluster
# 0.1.0 — initial implementation of DoD A4 vCluster topology
# (sovereign-multi-region-DoD invariant #4). Founder ruling
# 2026-05-16: every Sovereign must materialise the MGMT + DMZ + RTZ
# vCluster topology before convergence is declared. Slot 58 in the
# bootstrap-kit.
# 0.1.1 — Refs #2537: default `mgmtVcluster.enabled` flipped false→true
# so every region renders the MGMT vCluster (symmetric topology
# supersedes asymmetric A4).
# 0.2.0 — Refs #2661/#2639 (G92 EPIC, 2026-06-01) lockstep with sibling
# charts: loft-sh/vcluster subchart bumped 0.20.0 → 0.21.0 to pick up the
# `sync.toHost.customResources` schema field. Required by the G92
# vCluster placement matrix — bp-keycloak / bp-gitea / bp-harbor /
# bp-catalyst-platform install INSIDE the MGMT vCluster (G92.2 #2661 +
# G92.3 #2662), and their Helm-templated CNPG `Cluster` CRs
# (`postgresql.cnpg.io/v1`) need to reflect from vCluster → host so the
# host's cnpg-operator (G92.6 substrate per #2665) can reconcile them.
# v0.20.0's schema rejected the field (`helm template` returned
# "Additional property customResources is not allowed"); v0.21.0 ships
# the schema entry per the loft-sh CHANGELOG. Coupled with
# bp-dmz-vcluster 0.2.0 + bp-rtz-vcluster 0.2.0 (sibling bumps in the
# same PR) so all 3 vCluster umbrellas stay on the same loft-sh tag —
# drift between siblings would surface as inconsistent syncer
# behaviour across the DMZ / MGMT / RTZ apiservers.
# 0.2.1 — Refs #2662/#2639 (G92.3 EPIC, 2026-06-01): values.yaml now
# declares `vcluster.sync.toHost.customResources` for
# `clusters.postgresql.cnpg.io` + `poolers.postgresql.cnpg.io` +
# `scheduledbackups.postgresql.cnpg.io`. This is the schema entry the
# 0.2.0 subchart bump made available; wiring it in here finally lets
# CNPG-backed charts (bp-gitea + bp-harbor in this PR; bp-catalyst-
# platform in a follow-up) install INSIDE the MGMT vCluster while
# keeping the cnpg-operator on host substrate (G92.6 #2665). The
# syncer mirrors the inner Cluster CR into a host namespace named
# `<inner-ns>-x-mgmt`, the host's cnpg-operator reconciles it, and
# the resulting Service is synced back into the vCluster's view via
# the already-enabled `sync.toHost.services`.
# 0.2.6 — Refs #2940 (Pillar 5 anti-tether, 2026-06-08): the registry
# host is no longer hardcoded `harbor.openova.io` as the sole source of
# truth. New `global.registryMirror` (default `harbor.openova.io`) drives
# the umbrella image fail-fast helper; `mgmtVcluster.image.repository` is
# now registry-relative; the loft-sh subchart's syncer image registry
# (`vcluster.controlPlane.statefulSet.image.registry`, a subchart literal
# Helm can't self-template) is driven by slot 58's
# `${REGISTRY_MIRROR:=harbor.openova.io}` postBuild substitution. The
# renamed knob replaces the dead `global.imageRegistry` (loft-sh never
# honoured it). Default `helm template` renders byte-identical. A
# per-Sovereign overlay / bp-self-sovereign-cutover Step-04 pivot flips
# the host in one place. Additive value + helper change only.
# 0.2.7 — Refs #3373: sync.toHost.customResources gains
# httproutes.gateway.networking.k8s.io +
# externalsecrets.external-secrets.io (coupling fix (b) — re-homed
# charts' routes/secrets mirror toHost).
# 0.2.8 — Refs #3380-D (2026-06-13): pin the k8s distro control-plane
# images (apiServer / controllerManager / scheduler) off upstream
# `registry.k8s.io` onto the Sovereign-local Harbor `proxy-k8s` cache.
# The loft-sh subchart defaulted all three to `registry.k8s.io/kube-*`
# (confirmed LIVE on hw130 `mgmt-vcluster-0` initContainers) — which the
# `harbor-proxy-pull` Enforce ClusterPolicy DENIES on the next image roll
# (a self-inflicted wound the moment the vCluster reschedules). Additive
# values only; `helm template` renders the proxy path. `harbor.openova.io`
# kept as the bootstrap default (slot 58 `${REGISTRY_MIRROR}` + cutover
# Step-04 re-point the host). Sibling to bp-dmz-vcluster 0.2.7 +
# bp-rtz-vcluster 0.2.8.
# 0.2.9 — Refs #3376: add `sme` to networkPolicy.allowedIngressNamespaces.
# #3373 placement moved nats-jetstream INTO this MGMT vCluster; its
# host-synced Service now sits behind the `-isolation` NetworkPolicy whose
# ingress allow-list was {dmz, flux-system} only. The BSS control-plane
# services in the host `sme` namespace (billing/tenant/domain/notification/
# provisioning/marketplace) use NATS as their event bus → every one
# CrashLooped on "failed to connect to NATS … i/o timeout" (confirmed LIVE
# on hw133: all 4 SME pods, endpoints healthy, policy is the wall) → the
# voucher/billing funnel back-half (#3376) was dead. Additive allow-list
# entry only; no other behaviour changes.
# 0.2.10 — Refs #3373 (hw130 2026-06-13): EMPIRICAL FIX of the
# in-vCluster CRD-registration gap. Live on hw130's vc-mgmt the 0.2.7
# `sync.toHost.customResources` block did NOT register the CRD
# definitions inside the vCluster apiserver — an in-vcluster
# `kubectl apply` of an HTTPRoute returned `no matches for kind
# "HTTPRoute"`, and the OSS vCluster 0.21.0 syncer created ZERO
# custom-resource syncer controllers at boot (the toHost CR sync + its
# CRD auto-import are vCluster Pro/Platform-gated, inert on OSS). This
# release registers the three app-needed CRDs (HTTPRoute, ExternalSecret,
# CNPG Cluster) INSIDE the vCluster via the OSS-native init-manifests
# deployer (`experimental.deploy.vcluster.manifests`) using lean
# structural CRDs. Empirically (hw130) a structural CRD is enough for the
# vCluster apiserver to register the kind and accept a fully-specified CR
# round-tripped byte-for-byte; host operators hold the authoritative full
# schemas. The 0.2.7 customResources block is kept verbatim (Pro-license
# activation + declarative record). Additive subchart-values change only;
# default `helm template` gains the init-manifest CRDs.
# 0.2.11 (#3642): host-bridge carve-outs — the keycloak + grafana host→mgmt
# move adds gateway-system/kube-system (host Cilium Gateway → the mangled
# backendRef of the host-bridged HTTPRoutes) + catalyst-system/newapi/
# sso-bridge/oidc-gate (keycloak SSO consumers) to allowedIngressNamespaces
# (mirrors the #3423 sme→NATS carve-out). Additive netpol-values change only.
# 0.2.12 (#3642 #3736): UNBLOCK North-Star #1 — the host→vCluster Secret
# delivery the host-bridge alone could NOT provide (placement.yaml
# GOVERNING CONSTRAINT #2). loft-sh/vcluster subchart bumped 0.21.0 →
# 0.23.0 (lockstep with bp-dmz-vcluster 0.2.8 + bp-rtz-vcluster 0.2.12) to
# pick up `sync.fromHost.secrets.mappings.byName` — the host→vCluster
# Secret mirror that FIRST shipped in vcluster 0.23.0 and is genuinely
# OSS (no `product:"pro"` struct tag on SyncFromHost.Secrets → no
# admin.loft.sh license tether → the Pillar-5 bp-self-sovereign-cutover
# 600s deny-egress hold still passes). Each of the 7 NS#1 apps that
# re-homes into vc-mgmt (keycloak/gitea/harbor/newapi/grafana/openbao/
# guacamole) mounts a host-MINTED Secret — a CNPG/reflector DB credential
# (`<app>-database-secret` / `<app>-pg-app`) and/or a host-ESO SSO Secret
# (`<app>-sso-oidc-credentials`) — that lives in the app's HOST namespace
# while the Pod runs inside vc-mgmt (a different apiserver). Without this
# mirror keycloak-0 hangs on `MountVolume.SetUp … secret
# "keycloak-database-secret-x-keycloak-x-mgmt-vcluster" not found` (#3737
# SHARED_PG terminal blocker) and grafana/harbor/gitea/newapi boot without
# their SSO/DB env. The new `vcluster.sync.fromHost.secrets` block (default
# render) mirrors every host Secret in the 6 moved-app host namespaces
# (keycloak/gitea/harbor/newapi/grafana/catalyst-system) into the
# identically-named vCluster namespace via the documented OSS namespace-
# wildcard idiom (`"<ns>/*": "<ns>/*"`). `sync.toHost.secrets` (existing,
# vCluster→host) and `sync.fromHost.secrets` (host→vCluster) are
# independent struct fields — no conflict. ⚠️ DO-NOT-MERGE until a
# fresh-prov walk confirms the 7 apps land IN vc-mgmt with their Secrets
# mounted: a vcluster MAJOR bump (0.21→0.23) can change syncer behaviour
# and MUST be validated on a live env before merge.
# 0.2.12 (#3642 follow-on): the remaining 5 host→mgmt moves (openbao, harbor,
# gitea, newapi, guacamole) add their host-side consumers' namespaces to
# allowedIngressNamespaces (the mangled Services of their host-bridged routes
# + their CNPG -rw Services now sit behind this isolation netpol). Per
# docs/sessions/2026-06-14/3373-migration-plan §7 batch-D set: harbor + gitea +
# velero (velero → harbor registry backup; harbor/gitea also self-ingress their
# own host-rendered CNPG -rw Service from the in-vCluster Pod once the syncer
# mirrors it) + rtz (the cross-vCluster DB wire when a moved app SHARES the rtz
# shared-pg/cnpg-pair instead of owning its host-bridged Cluster). The
# gateway-system/kube-system + catalyst-system/newapi/sso-bridge/oidc-gate
# entries from 0.2.11 already cover the host Cilium Gateway + the openbao/newapi
# SSO consumers. Additive netpol-values change only; default render unchanged.
# 0.2.13 (hw161 converge-readiness, Refs #3760): add the missing `openbao/*`
# entry to vcluster.sync.fromHost.secrets.mappings.byName. openbao is the 7th
# NS#1 app re-homed into vc-mgmt (placement.yaml `vcluster: mgmt, namespace:
# openbao`); its host-bridge mints `openbao-sso-oidc-credentials` in the openbao
# HOST namespace but the 0.2.12 mapping shipped only 6 of the 7 namespaces
# (keycloak/gitea/harbor/newapi/grafana/catalyst-system) — DROPPING openbao.
# Result: the in-vCluster openbao sso-configure Deployment (optional secret
# mount) WAITS forever for openbao-sso-oidc-credentials that the host→vCluster
# mirror never delivered → OpenBao SSO silently never configures (the #3737
# secret-not-mirrored class, soft-wait variant). Additive values-only change;
# default render gains one mapping entry.
#
# 0.2.14 (#3737 4th-layer SHARED_PG DNS, hw163 2026-06-18): the secret mirror
# (0.2.12/0.2.13) delivers `<app>-database-secret` into vc-mgmt, but that
# secret's host field is the HOST FQDN `shared-pg[-b|-c]-rw.shared-data.svc.
# cluster.local` — which does NOT resolve inside vc-mgmt (its CoreDNS only
# knows vCluster-local services; the host shared-pg lives in the host
# `shared-data` ns). keycloak-0 CrashLoopBackOff `cannot resolve host
# shared-pg-rw.shared-data.svc.cluster.local … no such host` — the
# #3642-vs-NorthStar-#2 collision (apps in vc-mgmt + host-level shared-pg).
# Adds `networking.replicateServices.fromHost` for all 3 instances × rw/ro so
# the host shared-pg FQDN resolves natively inside vc-mgmt (the Pod is a real
# host pod → ClusterIP reachable; only the NAME was missing). Additive,
# values-only; zero per-app special-casing (#3642 DoD-6).
#
# 0.2.15 (#3642 host→vCluster gitea reachability, hw163 2026-06-18, 5th layer):
# the MIRROR of 0.2.14. bp-catalyst-platform stays HOST-side but its in-cluster
# gitea consumers (the `catalyst-gitea-token` mint hook, the tenants-repo
# bootstrap pre-install hook, catalyst-api's CATALYST_GITEA_URL) dial
# `gitea-http.gitea.svc.cluster.local:3000` on the host — which after #3642 has
# only the CNPG DB (gitea-http runs inside vc-mgmt). Token never mints → console
# pre-install hook `secret "catalyst-gitea-token" not found` → install times out
# → console never comes up. Adds `networking.replicateServices.toHost` exporting
# the in-vCluster gitea-http back to the host `gitea/gitea-http` Service.
#
# 0.2.17 (#2940 FOUNDATIONAL app-plane wedge, hw159–hw165 RCA, 2026-06-19):
# adds templates/gateway-ingress-cnp.yaml — a CiliumNetworkPolicy admitting
# the gateway's reserved `ingress` identity (+ host / remote-node) to every
# mgmt endpoint. ROOT CAUSE: the -isolation NetworkPolicy is podSelector:{}
# default-deny-ingress over ALL mgmt pods with an allow-list built PURELY from
# namespaceSelector rules. Cilium's Gateway API (envoy) proxies backend
# traffic under the reserved:ingress identity, which is neither a pod nor a
# namespace — so NO namespaceSelector can match it, and the 0.2.11 attempt to
# fix this by ADDING gateway-system/kube-system to allowedIngressNamespaces was
# structurally inert. Every gateway→app request (gitea/harbor/keycloak/openbao/
# grafana/guacamole/pdns) was silently dropped → curl 000 (timeout) / 503
# (envoy ejects the "unhealthy" backend). The host console worked only because
# it sits outside this namespace. This shipped identically in every #3642 env,
# so wipe-and-re-fire reproduced it every single time — the only fix is forward.
# Validated LIVE on hw165 (2026-06-19): applying exactly these fromEntities
# flipped gitea 000/503→303 and recovered 7 of 11 app surfaces instantly
# (console/gitea/registry/auth/bao/guacamole/pdns up; the remaining 4 are a
# separate missing-SSO-secret / no-frontend-pod cause, tracked apart). A
# vanilla k8s NetworkPolicy cannot express reserved:ingress; Cilium unions all
# policies selecting an endpoint, so this is purely ADDITIVE to -isolation —
# gateway reachability without weakening tenant isolation (no `world`).
#
# 0.2.18 (#3820 #3642 — merged with the 0.2.17 gateway-ingress CNP, 2026-06-19):
# add `external-secrets-system` to mgmtVcluster.networkPolicy.allowedIngressNamespaces.
# The #3642 host→vCluster move re-homed OpenBao into vc-mgmt, but the isolation
# NetworkPolicy's ingress carve-out list never allowed external-secrets-system —
# the host ESO's PRIMARY consumer of OpenBao. Result on hw165: ClusterSecretStore
# vault-region1 InvalidProviderConfig (`unable to log in with Kubernetes auth:
# context deadline exceeded`) → every *-sso-oidc-credentials ExternalSecret
# SecretSyncedError → grafana/hubble oidc-gate sidecars + per-app SSO consumers
# CreateContainerConfigError → public surface 503. Same class as the openbao/*
# fromHost-mirror miss (#3760). Live-verified: a host pod in external-secrets-system
# timed out to openbao:8200 while a freshly-minted host ESO SA token logged in fine
# from inside the openbao pod (XCR TokenReview healthy) — the ONLY wall was this
# ingress allow-list. Additive netpol-values change only; orthogonal to the 0.2.17
# gateway-ingress CNP (one admits the gateway proxy identity for north-south app
# reachability, the other admits the host ESO namespace for the OpenBao secret
# chain) — both ship together in this release.
# 0.2.19 (#3838, the fresh-prov keycloak install-loop fix): replace the
# `openbao/*` sync.fromHost.secrets wildcard with two EXACT-NAME mappings
# (`openbao-sso-oidc-credentials` + `openbao-host-token-reviewer-static`). The
# wildcard swept the host `openbao-host-token-reviewer` Secret — type
# `kubernetes.io/service-account-token` — into the fromHost mirror, where the
# vCluster's own token-controller re-stamped it every reconcile (the referenced
# SA does not exist in the vCluster), spinning an infinite `from-host-secret
# Create virtual object` loop (2833 per 8000 syncer log lines on hw166, ~35% of
# all syncer work). That saturated the syncer queue + host k3s apiserver →
# `context deadline exceeded` on the keycloak/harbor DB-secret toHost writes →
# `keycloak-database-secret-x-keycloak-x-mgmt-vcluster` never landed →
# keycloak-0 hung `Init:0/2` → the config-cli post-install hook timed out at
# 30m → bp-keycloak install→remediate→reinstall loop stalling the spine at
# ~49/64 HRs. The companion host slot (placement.yaml
# `openbao-host-token-reviewer-export` Job) materialises an Opaque
# `openbao-host-token-reviewer-static` Secret (no `service-account.name`
# annotation → mirror-stable) for the auth-bootstrap Job to mount. Never
# wildcard a namespace that holds a `kubernetes.io/service-account-token`.
# 0.2.22 (#3374 cycle-1 train — COMBINE #3868 guacamole + #3872 grafana-mesh):
# single version landing BOTH fromHost mirror extensions. #3868 added
# `catalyst-system/guacamole-pg-rw`/`-ro` (un-wedge the host-bridged guacamole
# JDBC schema-seed Job, hw167 32 installFailures). #3872 added the
# ClusterMesh-global `<instance>-mesh-rw` (write) + `<instance>-mesh` (read)
# Services for all 3 shared-pg instances (un-wedge grafana, which dials the
# global `shared-pg-b-mesh-rw` write Service on a 2-region active-hot-standby
# Sovereign, hw167 503 "no healthy upstream"). Both are additive,
# eventually-consistent fromHost mirrors (no-op until the host renders the
# target Service). Default `helm template` (mgmtVcluster.enabled=false) renders
# byte-identical. Lockstep: 58-bp-mgmt-vcluster.yaml pin + blueprint.yaml →
# 0.2.22. Refs #3374.
# 0.2.21 (#3374, the hw167 guacamole zero-click 500/503 fix): add
# `catalyst-system/guacamole-pg-rw` + `-ro` to
# `networking.replicateServices.fromHost`. guacamole is host-bridged (#3642 —
# slot 52 ships `database.cluster.enabled=false`), so its CNPG `guacamole-pg`
# Cluster is HOST-rendered in `catalyst-system` while the webapp + JDBC
# schema-seed Job run INSIDE vc-mgmt. The `guacamole-pg-app` Secret was already
# mirrored (the `catalyst-system/*` fromHost.secrets mapping), but the CNPG
# `-rw`/`-ro` SERVICES were not — so `guacamole-pg-rw` resolved to NXDOMAIN
# inside vc-mgmt (verified live on hw167: seed pod stuck at `waiting for
# postgres (57/60)`, `getent hosts guacamole-pg-rw` → NXDOMAIN). The seed Job's
# 5-min wait_for_db exhausted, hit activeDeadlineSeconds → DeadlineExceeded →
# Helm rolled the entire install back → no webapp/guacd/HTTPRoute backend →
# `https://guacamole.<fqdn>` returned edge 500/503 (32 installFailures). This is
# the same 4th-layer host→vCluster DNS gap fixed for shared-pg (#3737) but never
# extended to guacamole's host-rendered CNPG cluster. Mirroring these two
# Services makes both the seed Job (short name) and the webapp runtime
# (`POSTGRESQL_HOSTNAME=guacamole-pg-rw.catalyst-system.svc.cluster.local`)
# resolve. Additive + idempotent (no-op until the host-bridge renders the
# Cluster). Lockstep: 58-bp-mgmt-vcluster.yaml pin → 0.2.21. Refs #3374.
# 0.2.23 (#3374 cycle-1 — the fromHost-vs-toHost DB-secret deadlock fix,
# hw167 live RCA): de-conflict the 4 pod-mounted DB Secrets from the
# `sync.fromHost.secrets.mappings.byName` namespace wildcards. On vcluster
# 0.23.0 a Secret that matches BOTH a fromHost `<ns>/*` mapping AND is
# pod-mounted inside vc-mgmt (so the toHost "necessary" auto-sync claims the
# SAME virtual object) makes the from-host and to-host secret syncers fight
# in a delete/recreate loop → `context deadline exceeded`, the host
# projection never sticks, the app sits `Init:0/2` for 20m+ on any pod
# restart. Latent until the #3872 mesh-secret regeneration makes the
# emberstack reflector REPOINT the host DB Secret → the from-host importer
# rewrites the in-vCluster copy → pod restart → deadlock. The validation
# agent hand-fixed ONLY keycloak live (removed `keycloak/*` DB import +
# created the DB Secret natively in-vCluster); this release applies that
# pattern durably to ALL 4 host-bridged DB Secrets:
# `keycloak-database-secret` / `grafana-database-env` /
# `gitea-database-secret` / `harbor-database-secret`. Each app namespace is
# narrowed from `<ns>/*` to EXACT-NAME mappings covering ONLY the host-minted
# SSO/OIDC creds the in-vCluster pods/reconcilers still mount
# (gitea-oauth-source-credentials / harbor-sso-oidc-credentials /
# grafana-sso-oidc-credentials); keycloak has no host-minted non-DB Secret so
# it drops out entirely. The DB Secret is no longer fromHost-imported (the
# from-host syncer never contends with the to-host syncer over it) and is
# delivered natively in-vCluster via the sibling slot-16 shared-pg reflector
# re-target — toHost is then its sole owner. `newapi/*` + `catalyst-system/*`
# wildcards and the openbao EXACT-NAME entries (#3838) are unchanged. No
# secret name now double-matches a fromHost mapping AND a known
# keycloak/grafana/gitea/harbor pod-mount. Lockstep:
# 58-bp-mgmt-vcluster.yaml pin + blueprint.yaml → 0.2.23. Refs #3374 #3737.
version: 0.2.23
appVersion: "0.23.0"
description: |
  Catalyst-curated Blueprint umbrella chart for the Sovereign MGMT
  vCluster. Implements docs/SOVEREIGN-MULTI-REGION-DOD.md A4
  ("primary region = MGMT + DMZ vCluster topology") as a Helm
  release of the upstream loft-sh/vcluster chart wrapped in
  Catalyst conventions (namespace creation, nodeSelector pin to
  the region's CP, fail-fast image-tag guard, MIRROR-EVERYTHING
  Harbor proxy by default, NetworkPolicy isolation).

  Hosts the Sovereign mgmt-control-plane workloads:
    - catalyst-api (Sovereign-side)
    - catalyst-ui (sovereign-admin SPA)
    - openova-flow-server (per-Sovereign event bus)
    - any mgmt-tier service that should NOT face the public internet

  Topology contract (re-read docs/SOVEREIGN-MULTI-REGION-DOD.md):
    primary    region → MGMT  + DMZ  vCluster (this chart + bp-dmz-vcluster)
    secondary  region → DMZ   + RTZ  vCluster (bp-dmz-vcluster + bp-rtz-vcluster)

  Inter-vCluster intra-region traffic stays inside the host k3s
  cluster via Cilium endpoint identity routing. Inter-region traffic
  goes over the DMZ WireGuard hop per DoD A2.

  The upstream chart is pulled in as a Helm subchart so
  `helm dependency build` bundles it into the OCI artifact — the
  same umbrella shape used by bp-cert-manager + bp-cilium +
  bp-hcloud-ccm.
type: application
annotations:
  # CI Blueprint Release smoke-render gate accepts the literal token
  # "default-off" to bypass the "render < 5 lines" failure for charts
  # whose top-level condition (mgmtVcluster.enabled) is false at default
  # values. The bootstrap-kit slot flips it on for the primary region
  # via postBuild.substitute. The full-ON path is exercised by
  # chart/tests/render.sh which CI doesn't run as a Release gate.
  catalyst.openova.io/smoke-render-mode: "default-off"
keywords: [catalyst, blueprint, vcluster, mgmt, isolation, multi-region, dod-a4]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a Helm subchart so `helm dependency build`
# bundles it into the OCI artifact. Pinned to loft-sh/vcluster 0.20.0
# — matches the canonical version proven by products/dmz-vcluster
# (qa-loop iter-12) and core/services/provisioning/gitops/gitops.go's
# generateVCluster() helper (`chart: "vcluster" version: "0.33.*"` is
# the per-tenant marketplace path; the bootstrap topology uses the
# stable 0.20.x line). Per docs/INVIOLABLE-PRINCIPLES.md #4 (never
# hardcode) the version is operator-bumpable via PR.
dependencies:
  - name: vcluster
    # G92 EPIC #2639 (2026-06-01): bumped 0.20.0 → 0.21.0 so the
    # umbrella can declare `vcluster.sync.toHost.customResources` —
    # the schema entry that lets the syncer mirror CNPG `Cluster` CRs
    # (postgresql.cnpg.io/v1) from inside the vCluster back to the
    # host k3s where the cnpg-operator (substrate per G92.6 #2665)
    # reconciles them. Without this, every chart that ships a CNPG
    # Cluster template (bp-gitea, bp-harbor, bp-catalyst-platform)
    # silently skips it under the chart's Capabilities gate when
    # installed inside the vCluster.
    #
    # #3642/#3736 (2026-06-17): bumped 0.21.0 → 0.23.0 (lockstep with
    # bp-dmz-vcluster + bp-rtz-vcluster) so the umbrella can declare
    # `vcluster.sync.fromHost.secrets.mappings.byName` — the host→vCluster
    # Secret mirror that FIRST shipped in vcluster 0.23.0. This is the
    # GOVERNING CONSTRAINT #2 fix (placement.yaml §4 exception): the 7
    # NS#1 apps re-homed into vc-mgmt each mount a host-MINTED DB/SSO
    # Secret that the OSS 0.21.0 syncer could not deliver across the
    # host→vCluster boundary (0.21.0 has no `sync.fromHost.secrets` key
    # and REJECTS it at strict-unmarshal config parse). 0.23.0's
    # SyncFromHost.Secrets struct field carries NO `product:"pro"` tag —
    # genuinely OSS, no admin.loft.sh tether, so the bp-self-sovereign-
    # cutover 600s deny-egress hold still passes. Empirically verified
    # (helm dependency build + helm template) that all pre-existing
    # subchart values (controlPlane.distro.k8s, statefulSet.image,
    # sync.toHost.customResources, experimental.deploy.vcluster.manifests)
    # still parse under 0.23.0 strict-unmarshal alongside the new block.
    version: "0.23.0"
    repository: "https://charts.loft.sh"
    # The subchart only renders when the umbrella's top-level
    # `mgmtVcluster.enabled` is true. Default-OFF therefore renders
    # ZERO resources (umbrella namespace + NetworkPolicy AND subchart).
    # The bootstrap-kit Kustomization flips this on ONLY for the
    # primary region (per the DoD A4 topology contract).
    condition: mgmtVcluster.enabled
