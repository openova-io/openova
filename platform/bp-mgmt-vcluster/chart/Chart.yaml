apiVersion: v2
name: bp-mgmt-vcluster
# 0.1.0 — initial implementation of DoD A4 vCluster topology
# (sovereign-multi-region-DoD invariant #4). Founder ruling
# 2026-05-16: every Sovereign must materialise the MGMT + DMZ + RTZ
# vCluster topology before convergence is declared. Slot 58 in the
# bootstrap-kit.
# 0.1.1 — Refs #2537: default `mgmtVcluster.enabled` flipped false→true
# so every region renders the MGMT vCluster (symmetric topology
# supersedes asymmetric A4).
# 0.2.0 — Refs #2661/#2639 (G92 EPIC, 2026-06-01) lockstep with sibling
# charts: loft-sh/vcluster subchart bumped 0.20.0 → 0.21.0 to pick up the
# `sync.toHost.customResources` schema field. Required by the G92
# vCluster placement matrix — bp-keycloak / bp-gitea / bp-harbor /
# bp-catalyst-platform install INSIDE the MGMT vCluster (G92.2 #2661 +
# G92.3 #2662), and their Helm-templated CNPG `Cluster` CRs
# (`postgresql.cnpg.io/v1`) need to reflect from vCluster → host so the
# host's cnpg-operator (G92.6 substrate per #2665) can reconcile them.
# v0.20.0's schema rejected the field (`helm template` returned
# "Additional property customResources is not allowed"); v0.21.0 ships
# the schema entry per the loft-sh CHANGELOG. Coupled with
# bp-dmz-vcluster 0.2.0 + bp-rtz-vcluster 0.2.0 (sibling bumps in the
# same PR) so all 3 vCluster umbrellas stay on the same loft-sh tag —
# drift between siblings would surface as inconsistent syncer
# behaviour across the DMZ / MGMT / RTZ apiservers.
# 0.2.1 — Refs #2662/#2639 (G92.3 EPIC, 2026-06-01): values.yaml now
# declares `vcluster.sync.toHost.customResources` for
# `clusters.postgresql.cnpg.io` + `poolers.postgresql.cnpg.io` +
# `scheduledbackups.postgresql.cnpg.io`. This is the schema entry the
# 0.2.0 subchart bump made available; wiring it in here finally lets
# CNPG-backed charts (bp-gitea + bp-harbor in this PR; bp-catalyst-
# platform in a follow-up) install INSIDE the MGMT vCluster while
# keeping the cnpg-operator on host substrate (G92.6 #2665). The
# syncer mirrors the inner Cluster CR into a host namespace named
# `<inner-ns>-x-mgmt`, the host's cnpg-operator reconciles it, and
# the resulting Service is synced back into the vCluster's view via
# the already-enabled `sync.toHost.services`.
version: 0.2.1
appVersion: "0.21.0"
description: |
  Catalyst-curated Blueprint umbrella chart for the Sovereign MGMT
  vCluster. Implements docs/SOVEREIGN-MULTI-REGION-DOD.md A4
  ("primary region = MGMT + DMZ vCluster topology") as a Helm
  release of the upstream loft-sh/vcluster chart wrapped in
  Catalyst conventions (namespace creation, nodeSelector pin to
  the region's CP, fail-fast image-tag guard, MIRROR-EVERYTHING
  Harbor proxy by default, NetworkPolicy isolation).

  Hosts the Sovereign mgmt-control-plane workloads:
    - catalyst-api (Sovereign-side)
    - catalyst-ui (sovereign-admin SPA)
    - openova-flow-server (per-Sovereign event bus)
    - any mgmt-tier service that should NOT face the public internet

  Topology contract (re-read docs/SOVEREIGN-MULTI-REGION-DOD.md):
    primary    region → MGMT  + DMZ  vCluster (this chart + bp-dmz-vcluster)
    secondary  region → DMZ   + RTZ  vCluster (bp-dmz-vcluster + bp-rtz-vcluster)

  Inter-vCluster intra-region traffic stays inside the host k3s
  cluster via Cilium endpoint identity routing. Inter-region traffic
  goes over the DMZ WireGuard hop per DoD A2.

  The upstream chart is pulled in as a Helm subchart so
  `helm dependency build` bundles it into the OCI artifact — the
  same umbrella shape used by bp-cert-manager + bp-cilium +
  bp-hcloud-ccm.
type: application
annotations:
  # CI Blueprint Release smoke-render gate accepts the literal token
  # "default-off" to bypass the "render < 5 lines" failure for charts
  # whose top-level condition (mgmtVcluster.enabled) is false at default
  # values. The bootstrap-kit slot flips it on for the primary region
  # via postBuild.substitute. The full-ON path is exercised by
  # chart/tests/render.sh which CI doesn't run as a Release gate.
  catalyst.openova.io/smoke-render-mode: "default-off"
keywords: [catalyst, blueprint, vcluster, mgmt, isolation, multi-region, dod-a4]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a Helm subchart so `helm dependency build`
# bundles it into the OCI artifact. Pinned to loft-sh/vcluster 0.20.0
# — matches the canonical version proven by products/dmz-vcluster
# (qa-loop iter-12) and core/services/provisioning/gitops/gitops.go's
# generateVCluster() helper (`chart: "vcluster" version: "0.33.*"` is
# the per-tenant marketplace path; the bootstrap topology uses the
# stable 0.20.x line). Per docs/INVIOLABLE-PRINCIPLES.md #4 (never
# hardcode) the version is operator-bumpable via PR.
dependencies:
  - name: vcluster
    # G92 EPIC #2639 (2026-06-01): bumped 0.20.0 → 0.21.0 so the
    # umbrella can declare `vcluster.sync.toHost.customResources` —
    # the schema entry that lets the syncer mirror CNPG `Cluster` CRs
    # (postgresql.cnpg.io/v1) from inside the vCluster back to the
    # host k3s where the cnpg-operator (substrate per G92.6 #2665)
    # reconciles them. Without this, every chart that ships a CNPG
    # Cluster template (bp-gitea, bp-harbor, bp-catalyst-platform)
    # silently skips it under the chart's Capabilities gate when
    # installed inside the vCluster.
    version: "0.21.0"
    repository: "https://charts.loft.sh"
    # The subchart only renders when the umbrella's top-level
    # `mgmtVcluster.enabled` is true. Default-OFF therefore renders
    # ZERO resources (umbrella namespace + NetworkPolicy AND subchart).
    # The bootstrap-kit Kustomization flips this on ONLY for the
    # primary region (per the DoD A4 topology contract).
    condition: mgmtVcluster.enabled
