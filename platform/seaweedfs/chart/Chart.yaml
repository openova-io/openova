apiVersion: v2
name: bp-seaweedfs
description: |
  Catalyst Blueprint umbrella chart for SeaweedFS. The upstream
  `seaweedfs/seaweedfs` 4.22.0 chart is VENDORED (committed bytes under
  `chart/charts/seaweedfs/`) rather than declared as a `dependencies:`
  entry. Catalyst-curated values flow into the vendored subchart under the
  `seaweedfs:` key in values.yaml.

  SeaweedFS is the unified S3-compatible storage layer per
  docs/PLATFORM-TECH-STACK.md §3.5 — the single S3 surface that every
  Catalyst consumer talks to (Loki chunks, Mimir blocks, Tempo blocks,
  Velero backups, Harbor blobs, CNPG WAL archive, OpenSearch snapshots,
  per-Application buckets). NO per-app MinIO. SeaweedFS internally tiers
  hot→warm→cold and offloads cold objects to a cloud archival backend
  (Cloudflare R2 / AWS S3 Glacier / Hetzner Object Storage) configured at
  Sovereign provisioning time.

  Why vendored (issue #340):
    Upstream 4.22.0 ships templates/shared/security-configmap.yaml that
    calls `fromToml` (Sprig function added in Helm 3.13). Flux v1.x
    helm-controller bundles a Helm SDK older than 3.13 and PARSES every
    template before any `{{- if .Values.global.seaweedfs.enableSecurity }}`
    gate fires — so the chart fails install with `function "fromToml" not
    defined` even though enableSecurity defaults to false. Vendoring the
    chart and deleting the offending template removes the dependency on a
    Helm runtime feature we don't control. The deleted file is only
    referenced by other templates inside `{{- if enableSecurity }}` blocks,
    so removing it is a no-op for our default deployment shape (Catalyst
    SeaweedFS does not enable JWT/TLS — auth happens at the S3 layer via
    IAM credentials sourced from External Secrets, not via the upstream
    chart's TLS/JWT machinery).
type: application
# 1.2.3 (#3971): seaweedfs-storage SC default provisioner local-path ->
# csi.hetzner.cloud (durable). local-path is FORBIDDEN (k3s
# --disable=local-storage + Kyverno ENFORCE deny). bp-hcloud-csi gates the
# stateful root slots so the cloud CSI is Ready before any seaweedfs PVC binds.
# 1.2.4 (#4347): route the seaweedfs image through the Sovereign-local Harbor
#   proxy-cache (`harbor.openova.io/proxy-dockerhub/chrislusf/seaweedfs`) so the
#   host-ns Kyverno `harbor-proxy-pull` Enforce policy admits all 4 seaweedfs
#   workloads (master/volume/filer/s3) after #4325 re-homed bp-seaweedfs into
#   the native host ns. Refs #4347 #4325.
# 1.2.5 (#3971): comment-only — reword a storageclass.yaml doc line so the
#   land-time zero-local-path guard (scripts/check-no-local-path.sh) sees the
#   ban marker on the same line that names `rancher.io/local-path`. Rendered
#   output is byte-identical to 1.2.4.
version: 1.2.5
appVersion: "4.22"
keywords: [catalyst, blueprint, seaweedfs, s3, object-storage, storage]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# The vendored subchart at chart/charts/seaweedfs/ is committed bytes — it
# is NEVER re-pulled from the mutable upstream Helm repo (doing so would
# re-introduce the broken `security-configmap.yaml`, issue #340). We still
# DECLARE it under `dependencies:` below so the umbrella is a well-formed
# Helm chart: `helm lint` rejects any chart that carries a subchart under
# charts/ with no matching `dependencies:` entry ("chart metadata is
# missing these dependencies: seaweedfs"), and the blueprint-release
# hollow-chart guard (issue #181) is satisfied by the declared dep (so the
# former `no-upstream: "true"` opt-out annotation is no longer needed).
#
# The dependency `repository:` is a `file://` URL pointing at the vendored
# copy, NOT the upstream `seaweedfs.github.io` repo. This is the load-
# bearing part: `helm dependency build` (run by blueprint-release.yaml and
# the chart-annotations GUARD 2) resolves the dep from the LOCAL committed
# bytes — verified to succeed with the network fully unreachable — so it
# can never reach upstream and never re-introduce the fromToml template. It
# re-packs the local dir into charts/seaweedfs-<ver>.tgz and leaves the
# unpacked dir (and the deleted security-configmap.yaml) untouched.
#
# To bump SeaweedFS:
#   1. helm pull seaweedfs --version <X.Y.Z> --repo https://seaweedfs.github.io/seaweedfs/helm
#   2. tar -xzf seaweedfs-<X.Y.Z>.tgz -C chart/charts/ (replacing seaweedfs/)
#   3. rm chart/charts/seaweedfs/templates/shared/security-configmap.yaml
#      (until upstream stops using fromToml or we move to Helm 3.13+ in
#      helm-controller — track via fluxcd/helm-controller releases)
#   4. Bump the dependencies[0].version + the version: field here + open PR
dependencies:
  - name: seaweedfs
    version: "4.22.0"
    # Local vendored copy (see note above) — NEVER the upstream repo, so
    # `helm dependency build` resolves offline and the deleted
    # security-configmap.yaml (issue #340) is never re-pulled.
    repository: "file://charts/seaweedfs"
annotations:
  catalyst.openova.io/vendored-subchart: "seaweedfs@4.22.0"
  catalyst.openova.io/vendored-reason: "issue #340 — upstream uses fromToml (Helm 3.13+)"
