# Catalyst Blueprint umbrella metadata — the upstream chart is resolved as
# a Helm subchart via Chart.yaml `dependencies:`. Catalyst-curated values
# under the `seaweedfs:` key flow into the upstream subchart unchanged.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

catalystBlueprint:
  upstream:
    chart: seaweedfs
    version: "4.22.0"
    repo: "https://seaweedfs.github.io/seaweedfs/helm"

# ─── Upstream chart values (subchart key: seaweedfs) ─────────────────────
seaweedfs:

  # Multi-tenant namespacing — when true, every resource is prefixed
  # `seaweedfs-`. Required because Catalyst runs ONE SeaweedFS per
  # Sovereign and the prefix avoids name collisions with co-located
  # workloads that ship resources named `master`, `volume`, `filer`, `s3`.
  enableNamePrefix: true

  global:
    # SECURITY DISABLED for v1.0.x — upstream's templates/shared/security-configmap.yaml
    # uses Helm template `fromToml` which is unsupported by the helm-controller
    # v1.1.0 helm SDK on otech.omani.works. Re-enable when fluxcd/helm-controller
    # is bumped to a version with helm SDK >= 3.13. JWT signing + HTTPS-internal
    # are off here; the SeaweedFS API is reached internally via cluster-IP only,
    # so disabling chart-level security is acceptable on Sovereign-1. To enable:
    # set enableSecurity: true after upgrading helm-controller.
    enableSecurity: false
    # Pin upstream image tag — DO NOT use floating tags per
    # docs/INVIOLABLE-PRINCIPLES.md #4.
    # NOTE: registry must NOT have a trailing slash — the vendored chart's
    # _helpers.tpl seaweedfs.image renders `printf "%s/%s:%s" registry name tag`.
    # A trailing slash in registry produces a double slash: "chrislusf//seaweedfs:4.22"
    # which is an invalid image reference (issue #568).
    # #4347 — route through the Sovereign-local Harbor proxy-cache so the
    # host-ns Kyverno `harbor-proxy-pull` Enforce ClusterPolicy admits it (after
    # #4325 re-homed bp-seaweedfs into the native host ns `seaweedfs`). The raw
    # `chrislusf/seaweedfs` (dockerhub) matches no allowed glob. The registry
    # field carries the proxy prefix UP TO the chrislusf org segment so the
    # `printf "%s/%s:%s" registry imageName imageTag` helper composes
    # `harbor.openova.io/proxy-dockerhub/chrislusf/seaweedfs:4.22` (matches
    # `*/proxy-*/*`).
    registry: "harbor.openova.io/proxy-dockerhub/chrislusf"
    repository: ""
    imageName: seaweedfs
    imageTag: "4.22"
    imagePullPolicy: IfNotPresent
    # Cluster role label — used by upstream chart for affinity rules.
    serviceAccountName: "seaweedfs"
    # Per-Sovereign overlays MAY override `replicationPlacment` (sic —
    # upstream's spelling) to "001" (one replica on different rack),
    # "100" (one on different DC), etc. Default "000" = no replication
    # — fine for solo Sovereign with bp-velero providing DR.
    replicationPlacment: "000"
    # Allow crashes to be visible (don't restart pods that are crash-
    # looping faster than 10s).
    monitoring:
      enabled: false
      gatewayHost: null
      gatewayPort: null

  # ─── Master ────────────────────────────────────────────────────────────
  # 1 master is fine for a solo Sovereign. Per-Sovereign HA overlay bumps
  # to 3 with raft consensus.
  master:
    enabled: true
    repository: null
    imageName: null
    imageTag: null
    imageOverride: null
    restartPolicy: null
    replicas: 1
    port: 9333
    grpcPort: 19333
    metricsPort: 9327
    ipBind: "0.0.0.0"
    volumePreallocate: false
    volumeSizeLimitMB: 30000
    loggingOverrideLevel: null
    # Disk type — per-Sovereign overlays MAY set "ssd" or "hdd".
    data:
      type: "persistentVolumeClaim"
      size: "10Gi"
      storageClass: ""
    # logs.type=emptyDir (#3579): bp-seaweedfs runs INSIDE the rtz vCluster
    # (#3373 Batch A) whose host `rtz` namespace enforces baseline
    # PodSecurity — baseline FORBIDS hostPath volumes, so the vcluster
    # pod-syncer rejected every seaweedfs pod ("violates PodSecurity
    # baseline: hostPath volumes") leaving them Pending forever. glog
    # logdir files are ephemeral, so emptyDir is the correct shape.
    logs:
      type: "emptyDir"
      size: ""
      storageClass: ""
      hostPathPrefix: /storage
    # Resources tuned for solo Sovereign on cx32 (8 vCPU / 16 GB).
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 1
    # Master uses internal raft for consensus. nodeSelector/tolerations
    # left empty so master schedules anywhere.
    nodeSelector: null
    affinity: null
    tolerations: null
    # ServiceMonitor — DEFAULT FALSE per docs/BLUEPRINT-AUTHORING.md §11.2.
    metricsPort: 9327
    config: |-
      [master.maintenance]
      scripts = """
        lock
        ec.encode -fullPercent=95 -quietFor=1h
        ec.rebuild -force
        ec.balance -force
        volume.deleteEmpty -quietFor=24h -force
        volume.balance -force
        volume.fix.replication
        s3.clean.uploads -timeAgo=24h
        unlock
      """
      sleep_minutes = 17
    # PodSecurity — non-root.
    podSecurityContext:
      enabled: true
      fsGroup: 1000
    securityContext:
      enabled: true
      runAsUser: 1000
      runAsNonRoot: true
      readOnlyRootFilesystem: false

  # ─── Volume servers ────────────────────────────────────────────────────
  # 3 replicas = standard local redundancy. Per docs/PLATFORM-TECH-STACK.md
  # §3.5 (SeaweedFS as the unified S3 surface), volume size is the hot/warm
  # local storage; cold tier offloads to cloud archive.
  volume:
    enabled: true
    repository: null
    imageName: null
    imageTag: null
    imageOverride: null
    restartPolicy: null
    replicas: 3
    port: 8080
    grpcPort: 18080
    metricsPort: 9327
    ipBind: "0.0.0.0"
    # Volume PVC — 100Gi default, per-Sovereign overlay sizes per workload.
    dataDirs:
      - name: data
        type: "persistentVolumeClaim"
        size: "100Gi"
        storageClass: ""
        # #6765 — `-max 0` (auto) under-sized to just 2 volumes on the 100Gi
        # data dir (30GB volumeSizeLimit → auto stopped at 2), so the master
        # hit "Not enough data nodes found / 0 free" and EVERY seaweedfs-S3
        # write (openbao raft snapshots + all object storage) failed with
        # "AssignVolume: DeadlineExceeded". An explicit ceiling lets the master
        # grow volumes as data arrives (still disk-capped by minFreeSpacePercent).
        maxVolumes: 10
    # logs.type=emptyDir (#3579) — see master.logs note; baseline
    # PodSecurity in the host rtz ns forbids hostPath.
    logs:
      type: "emptyDir"
      size: ""
      storageClass: ""
      hostPathPrefix: /storage
    # Idle timeout — close idle connections after 30 minutes.
    idleTimeout: 30
    # Resources tuned for solo Sovereign.
    # G67 #2616 (2026-05-31): cpu request 500m → 300m. 3 volume Pods
    # × 500m = 1500m of cluster request budget for SeaweedFS alone.
    # Right-sized to 300m × 3 = 900m, freeing 600m for cutover Jobs
    # and tenant workloads. Limit stays at 2 CPU for burst capacity
    # during high-throughput periods.
    resources:
      requests:
        memory: 1Gi
        cpu: 300m
      limits:
        memory: 4Gi
        cpu: 2
    nodeSelector: null
    affinity: null
    tolerations: null
    podSecurityContext:
      enabled: true
      fsGroup: 1000
    securityContext:
      enabled: true
      runAsUser: 1000
      runAsNonRoot: true
      readOnlyRootFilesystem: false

  # ─── Filer (POSIX/HDFS surface; underpins S3) ──────────────────────────
  # 1 replica solo, 2 HA. Filer stores metadata in its built-in store
  # (default: leveldb on PVC). Per-Sovereign HA overlay swaps to a
  # PostgreSQL/CNPG backing for metadata.
  filer:
    enabled: true
    repository: null
    imageName: null
    imageTag: null
    imageOverride: null
    restartPolicy: null
    replicas: 1
    port: 8888
    grpcPort: 18888
    metricsPort: 9327
    ipBind: "0.0.0.0"
    s3:
      enabled: false           # S3 has its own deployment block below
      port: 8333
      enableAuth: false
      skipAuthSecretCreation: false
    webdav:
      enabled: false
    # Filer PVC stores metadata leveldb. 8Gi is generous for solo.
    data:
      type: "persistentVolumeClaim"
      size: "8Gi"
      storageClass: ""
    # logs.type=emptyDir (#3579) — see master.logs note; baseline
    # PodSecurity in the host rtz ns forbids hostPath.
    logs:
      type: "emptyDir"
      size: ""
      storageClass: ""
      hostPathPrefix: /storage
    extraVolumes: ""
    extraVolumeMounts: ""
    # Notification topic (for filer events). Default: null = no
    # notification. Per-Sovereign overlay enables Kafka/NATS notification
    # if needed.
    notificationConfig: null
    # Filer config (CSV stores, post-create scripts, etc.). Empty default;
    # per-Sovereign overlay populates if a non-default backing store is
    # used.
    extraEnvironmentVars:
      WEED_LEVELDB2_ENABLED: "true"
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 1
    nodeSelector: null
    affinity: null
    tolerations: null
    podSecurityContext:
      enabled: true
      fsGroup: 1000
    securityContext:
      enabled: true
      runAsUser: 1000
      runAsNonRoot: true
      readOnlyRootFilesystem: false

  # ─── S3 API (THE Catalyst-facing service: seaweedfs-s3:8333) ───────────
  # This is the single endpoint every consumer talks to. Service exposes
  # port 8333 (S3 API) over ClusterIP; HTTPS termination is handled by
  # cert-manager-issued certificate referenced via per-Sovereign overlay.
  s3:
    enabled: true
    repository: null
    imageName: null
    imageTag: null
    imageOverride: null
    restartPolicy: null
    replicas: 2
    port: 8333
    httpsPort: 0                # 0 = HTTP; per-Sovereign overlay flips to 8443 with cert
    metricsPort: 9327
    allowEmptyFolder: false
    enableAuth: true            # CRITICAL: every consumer authenticates with access/secret keys
    skipAuthSecretCreation: false
    # When `enableAuth: true`, the chart auto-generates a Secret
    # `seaweedfs-s3-secret` with admin/anonymous access keys. Per-Sovereign
    # overlay MAY supply existing secret name + per-bucket fine-grained
    # IAM via `auditLogConfig` and `s3ConfigContents`.
    s3ConfigContents: ""
    extraEnvironmentVars:
      WEED_FILER_BUCKETS_FOLDER: "/buckets"
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 1
    # Service — ClusterIP. `enableNamePrefix: true` above makes the
    # service name `seaweedfs-s3`. The canonical FQDN every consumer
    # uses:
    #   seaweedfs-s3.seaweedfs.svc.cluster.local:8333
    # (matches docs/PLATFORM-TECH-STACK.md §3.5 endpoint contract).
    serviceType: "ClusterIP"
    # logs.type=emptyDir (#3579) — the umbrella did NOT override s3.logs
    # so it inherited the vendored subchart default `hostPath`, which the
    # host rtz ns baseline PodSecurity rejected (the s3 Deployment pod has
    # NO PVC yet still failed to sync — proving hostPath, not storage, was
    # the blocker). emptyDir is baseline-compliant; the vendored
    # s3-deployment.yaml already renders the logdir mount + -logdir flag
    # for emptyDir.
    logs:
      type: "emptyDir"
      hostPathPrefix: /storage
    nodeSelector: null
    affinity: null
    tolerations: null
    # ServiceMonitor — DEFAULT FALSE per docs/BLUEPRINT-AUTHORING.md §11.2.
    metricsServiceMonitor:
      enabled: false
    podSecurityContext:
      enabled: true
      fsGroup: 1000
    securityContext:
      enabled: true
      runAsUser: 1000
      runAsNonRoot: true
      readOnlyRootFilesystem: false

  # ─── Cosi (Container Object Storage Interface) ─────────────────────────
  # Off by default — k8s CSI-style dynamic bucket provisioning is not on
  # the Catalyst critical path. Per-Sovereign overlay enables if needed.
  cosi:
    enabled: false
    # #3913: the upstream subchart defaults this to the bare upstream ref
    # `ghcr.io/seaweedfs/seaweedfs-cosi-driver:v0.1.2`, which the
    # harbor-proxy-pull Kyverno ClusterPolicy (Enforce) would DENY the moment a
    # per-Sovereign overlay flips cosi.enabled=true (the literal matches neither
    # `*/proxy-*/*` nor `*/openova-io/*`). Pin it through the Harbor proxy-ghcr
    # project up-front so enabling cosi never trips admission. harbor.openova.io
    # resolves to the local Harbor post-cutover (the registry-pivot rewrites
    # proxy-ghcr), and pre-cutover the containerd registry mirror also fronts it.
    image: "harbor.openova.io/proxy-ghcr/seaweedfs/seaweedfs-cosi-driver:v0.1.2"

  # ─── Certificates (TLS between SeaweedFS components) ───────────────────
  # Off by default — cluster-internal traffic is encrypted at the Cilium
  # WireGuard layer. Per-Sovereign overlay flips on with cert-manager
  # ClusterIssuer ref if explicit TLS between components is required.
  certificates:
    commonName: "SeaweedFS CA"
    keySize: 2048
    duration: 2160h
    renewBefore: 360h
    issuer:
      name: ""              # set by per-Sovereign overlay to a cert-manager Issuer
      kind: ClusterIssuer

# ─── Catalyst overlay values (consumed by templates/ in this chart) ──────
# Reserved for Catalyst-side overlays (NetworkPolicy, ExternalSecret for
# S3 admin credentials wired via bp-external-secrets, ServiceMonitor opt-in
# wrapper) added in a follow-up PR once bp-seaweedfs is consumed in
# clusters/_template/.
seaweedfsOverlay:
  networkPolicy:
    enabled: false
  serviceMonitor:
    enabled: false                # docs/BLUEPRINT-AUTHORING.md §11.2
    interval: "30s"
    namespace: ""                 # default: release namespace
  externalSecret:
    enabled: false

  # ─── StorageClasses (qa-loop Wave 5 Fix #79, Gap B) ────────────────────
  # Catalyst-curated StorageClass aliases for SeaweedFS-fronted persistence.
  # Per docs/PLATFORM-TECH-STACK.md §3.5 + ADR-0001 §3 (5-store rule),
  # bp-seaweedfs is THE owner of every `seaweedfs-*` StorageClass — every
  # downstream consumer that defaults to `storageClassName: seaweedfs-storage`
  # (bp-guacamole recordings PVC, future bp-loki/mimir/tempo cache PVCs)
  # binds against the class registered here.
  #
  # #3971 — Default `provisioner: csi.hetzner.cloud` (the durable Hetzner
  # Cloud CSI), NOT the ephemeral k3s local-path. k3s runs
  # --disable=local-storage so local-path is FORBIDDEN (never installed; a
  # Kyverno ENFORCE policy DENIES any local-path reference). bp-hcloud-csi
  # (slot 55a) is a dependsOn of the stateful root slots, so the cloud CSI is
  # Ready before any seaweedfs PVC binds. Per-Sovereign overlay flips
  # `provisioner:` to the cloud's durable CSI on non-Hetzner clouds (Huawei:
  # everest/EVS — #3971 follow-up). NEVER set this to local-path.
  #
  # Per docs/INVIOLABLE-PRINCIPLES.md #4 every field below is operator-
  # tunable through `seaweedfsOverlay.storageClasses[]` — list semantics
  # let a Sovereign register multiple tiers (`seaweedfs-storage` warm,
  # `seaweedfs-cold` Glacier-backed, etc.) without bespoke chart edits.
  storageClasses:
    - name: seaweedfs-storage
      enabled: true
      # #3971 — durable cloud CSI (NOT local-path, which is FORBIDDEN).
      # Overlay MAY override to the cloud's own durable CSI on non-Hetzner.
      provisioner: csi.hetzner.cloud
      reclaimPolicy: Delete
      # WaitForFirstConsumer keeps PV creation lazy so overlay can re-tier
      # the underlying provisioner without re-binding existing PVCs.
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
      tier: warm
      isDefault: false
      parameters: {}
      mountOptions: []
      annotations: {}
  # Cold tier — per-Sovereign overlay MUST populate one of these blocks
  # (or leave both null for hot-only). Catalyst's tier-config ConfigMap is
  # rendered in the overlay PR.
  coldTier:
    cloudflareR2:
      enabled: false
      bucket: ""
      accountId: ""
    awsS3Glacier:
      enabled: false
      bucket: ""
      region: ""
    # Hetzner S3 (Hetzner's S3-compatible cold archive backend).
    # Renamed in #425 so the wider grep gate enforcing the new vendor-
    # agnostic Object Storage seam (`flux-system/object-storage` Secret
    # + `objectStorage.s3.*` chart values block) returns zero hits
    # across the platform/ tree. The cold-tier struct here is a
    # deliberate vendor-named branch — parallel to `cloudflareR2` and
    # `awsS3Glacier` — because the cold backend itself is vendor-
    # specific (each one's pricing + retrieval-latency profile differs);
    # the rename preserves that parallel shape while satisfying the gate.
    hetznerS3:
      enabled: false
      bucket: ""
      region: ""

# ─────────────────────────────────────────────────────────────────────────
# Cross-region filer sync — ADR-0015 D6(a), issue #7067.
#
# Region-local FILE state of a multi-region Application (first consumer:
# WordPress media) must exist in every region, so a topology transition
# (Primary A -> B) never loses user files. bp-seaweedfs runs one independent
# SeaweedFS per region; this block wires SeaweedFS's NATIVE cross-cluster
# mechanism, `weed filer.sync`, between the regions' filers.
#
# Shape, per region (`self`):
#   - ONE ClusterMesh global Service per region id, `seaweedfs-filer-mesh-<id>`.
#     For `self` it selects the local filer and EXPORTS it (shared=true); for
#     each peer it is a zero-backend stub (shared=false) whose name resolves,
#     over Cilium ClusterMesh, to the PEER's filer. Same idiom as bp-cnpg-pair
#     `-mesh` / bp-harbor `harbor-redis-mesh`.
#   - ONE Deployment per peer, `seaweedfs-filer-sync-from-<peer-id>`: it
#     PULLS peer -> self (`-isActivePassive`, A = peer mesh Service, B = local
#     filer), one `weed filer.sync` process per replicated bucket. The peer
#     region runs the mirror-image Deployment, so the pair is active-active:
#     a write in EITHER region appears in the other. Loop-free natively —
#     every replicated event carries the source filer signature and the
#     follower skips events stamped with its own target's signature.
#   - Idempotent across restarts: filer.sync persists its offset IN THE
#     LOCAL (target) filer KV (key `sync.<path><source-signature>`), every
#     ~3s while streaming and on SIGTERM; a restart resumes from it. A fresh
#     pair starts from the peer filer's earliest metadata log, so objects
#     written before the sync existed are replicated too.
#
# Values contract: the ADR-0015 D2 topology contract `openova.topology.{self,
# peers[]}` wins when set. bp-seaweedfs is delivered TODAY by the per-region
# bootstrap-kit slot 18, so the slot fills the `crossRegion.*` seam from the
# existing per-region Flux substitutes (the same ones bp-cnpg-pair / bp-harbor
# consume): self = SOVEREIGN_REGION_KEY, configuredRegions =
# SOVEREIGN_CONFIGURED_REGIONS_YAML (peers = configuredRegions minus self),
# enabled = SOVEREIGN_ENABLE_CNPG_PAIR (stamped true on BOTH regions by
# catalyst-api only once ClusterMesh is established), peerClusters =
# SOVEREIGN_PEER_CLUSTERMESH_NAMES.
#
# OFF by default and on every single-region Sovereign -> renders NOTHING
# (byte-identical to 1.2.6).
# ─────────────────────────────────────────────────────────────────────────
openova:
  topology:
    # ADR-0015 D2 contract (region ids). Empty -> fall back to crossRegion.*.
    self: ""
    peers: []

crossRegion:
  enabled: false
  # This region's id, e.g. hw-me-east-215-a-rtz-prod (slot: SOVEREIGN_REGION_KEY).
  self: ""
  # Every region id of the Sovereign (slot: SOVEREIGN_CONFIGURED_REGIONS_YAML).
  # peers = configuredRegions minus self, unless openova.topology.peers is set.
  configuredRegions: []
  # Peer Cilium ClusterMesh cluster names (slot: SOVEREIGN_PEER_CLUSTERMESH_NAMES).
  # Only used by the CiliumNetworkPolicies rendered when
  # seaweedfsOverlay.networkPolicy.enabled=true (a k8s NetworkPolicy can never
  # admit a ClusterMesh peer — Cilium pins it to the local cluster).
  peerClusters: []

  filerMesh:
    # Prefix of the per-region ClusterMesh global Service; full name is
    # `<prefix>-<region-id>` (must fit a 63-char DNS label).
    servicePrefix: seaweedfs-filer-mesh

  filerSync:
    enabled: true
    # REPLICATED SCOPE. One `weed filer.sync` process per bucket. filer.sync
    # scopes by DIRECTORY (it subscribes to `<path>/`), so a bucket-name
    # wildcard is impossible natively — scope is this explicit list, and
    # every name MUST be `replicated` or `replicated-<suffix>` (the render
    # fails otherwise) so the name alone tells any reader a bucket is
    # cross-region. The default `replicated` bucket is shared: Applications
    # write under a key prefix `<org>/<app>/...`. An Application that needs
    # its own bucket adds `replicated-<org>-<app>` here.
    buckets:
      - replicated
    # S3 buckets folder in the filer (upstream default; matches
    # seaweedfs.s3.extraEnvironmentVars.WEED_FILER_BUCKETS_FOLDER).
    bucketsFolder: /buckets
    # Create every listed bucket on the LOCAL filer (idempotent, on every pod
    # start) so an Application can write in ANY region before the first
    # replicated event arrives.
    ensureBuckets: true
    # Deletes/overwrites in one region propagate to the other.
    # CONFLICT RULE (native filer.sync sink): per object, the newer mtime
    # wins; an incoming entry whose mtime is <= the existing entry's is
    # skipped (identical ETag = already replicated). Two regions writing the
    # SAME key within the same second keep their own copy until the next
    # write — an Application must not write one key from two regions at once
    # (WordPress media keys are unique per upload).
    propagateDeletes: true
    concurrency: 32
    # First metrics port; bucket i listens on metricsPortBase+i.
    metricsPortBase: 9340
    image:
      # Empty -> seaweedfs.global.registry/imageName:imageTag (Harbor proxy).
      repository: ""
      tag: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
