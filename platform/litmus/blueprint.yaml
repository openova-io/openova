apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: litmus
  labels:
    catalyst.openova.io/section: pts-3-3-security-and-policy
spec:
  version: 1.0.0
  card:
    title: LitmusChaos
    family: guardian
    description: CNCF chaos engineering platform. Cloud-native fault injection (pod-kill, network-loss, disk-fill, etc.) with experiment workflows. Validates Sovereign resilience as part of the SRE posture.
    docs: https://docs.litmuschaos.io/
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: singleton
            rtz-B: singleton
  endpoints:
  - name: ui
    hostnameTemplate: litmus.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: '{{.OrgSlug}}'
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  multiInstance:
    enabled: true
    maxPerOrg: 3
    namingTemplate: '{{.AppName}}-{{.InstanceID}}'
    isolationLevel: namespace
  # ── /G117.1 ──
