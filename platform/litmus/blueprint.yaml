apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-litmus
spec:
  version: 1.0.0
  visibility: unlisted
  class: platform-component
  lifecycle: experimental
  card:
    title: LitmusChaos
    description: CNCF chaos engineering platform. Cloud-native fault injection (pod-kill, network-loss, disk-fill, etc.) with experiment workflows. Validates Sovereign resilience as part of the SRE posture.
    icon: litmus.svg
    docs: https://docs.litmuschaos.io/
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ''
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: singleton
            rtz-B: singleton
  endpoints:
  - name: ui
    hostnameTemplate: litmus.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: '{{.OrgSlug}}'
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  # ── /G117.1 ──
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-litmus
