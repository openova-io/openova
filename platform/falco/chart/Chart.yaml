apiVersion: v2
name: bp-falco
# 1.0.2 (#5017-class — route the falco + falcoctl (initContainer AND sidecar)
# images through the Sovereign-local Harbor proxy: kyverno harbor-proxy-pull
# denies the raw docker.io refs on any DaemonSet roll; one denied node pod
# freezes the whole RollingUpdate(maxUnavailable:1) roll — caught live on
# hw242 cutover step-08 run 3, DS wedged at 0 updated. The DS updateStrategy
# itself was verified correct (RollingUpdate/maxUnavailable:1) — the denial,
# not the strategy, froze the roll.)
description: |
  Catalyst Blueprint umbrella chart for Falco. Depends on the upstream
  `falco` chart (falcosecurity/charts) as a Helm subchart so
  `helm dependency build` pulls the upstream payload into this artifact.
  Catalyst-curated values flow into the upstream subchart under the
  `falco:` key in values.yaml.

  Falco runs as a DaemonSet on every host cluster of a Sovereign — eBPF
  syscall monitoring for runtime threat detection. Pairs with bp-trivy
  (static scanning) and feeds the SIEM pipeline via Falcosidekick into
  bp-opensearch.
type: application
version: 1.0.2
appVersion: "0.43.1"
keywords: [catalyst, blueprint, falco, security, runtime, ebpf, threat-detection]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Pinned to falcosecurity/falco 8.0.2 (appVersion 0.43.1) — current stable
# on 2026-04-29. Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the
# version is operator-bumpable via PR + Blueprint release.
dependencies:
  - name: falco
    version: "8.0.2"
    repository: "https://falcosecurity.github.io/charts"

annotations:
  # #2935 (2026-06-03): Blueprint-Release hollow-chart guard exemption.
  # Chart legitimately renders zero resources with default values
  # (default-off feature toggle or dependency-on-CRD pattern). Without
  # this annotation Blueprint-Release rejects publish.
  catalyst.openova.io/smoke-render-mode: "default-off"
