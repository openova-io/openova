apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-falco
  labels:
    catalyst.openova.io/section: pts-3-3-security-and-policy
spec:
  version: 1.0.2
  visibility: unlisted
  card:
    title: Falco
    summary: Runtime security — eBPF syscall + Kubernetes-audit threat detection. Streams security events to the Sovereign observability stack.
    icon: falco.svg
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ''
          clusters:
            - mgmt-A
            - mgmt-B
            - dmz-A
            - dmz-B
            - rtz-A
            - rtz-B
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-falco
  endpoints: []
