apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-loki
spec:
  version: 1.0.3  # lockstep with chart/Chart.yaml (#4623a disable loki-sc-rules sidecar — no rules ship + CrashLoop hazard from /proc/1/cmdline probe)
  visibility: unlisted
  class: platform-component
  lifecycle: experimental
  card:
    title: Loki
    summary: Log aggregation system from Grafana Labs. Multi-tenant + cheap object-storage backend.
    description: Loki + Promtail (log shipper). Pre-wired as a Grafana data source for unified log + metric queries.
    icon: loki.svg
    license: AGPL-3.0
    tags: [observability, logs, loki, grafana]
    docs: https://grafana.com/docs/loki/latest/


  topology:
    supported:
      - active-passive
      - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: s3-bucket-replication
          mode: async
          lagSloSeconds: 60
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 60
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # internal-only — queried by Grafana via in-cluster Service DNS.
  endpoints: []

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # No direct user-facing endpoint; SSO realm still declared so Loki's
  # multi-tenancy header (X-Scope-OrgID) maps from sovereign-realm claims.
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    silentLogin: true

  configSchema:
    type: object
    properties:
      retention:
        type: string
        default: 168h
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-loki
