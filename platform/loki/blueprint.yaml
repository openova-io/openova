apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: loki
  labels:
    catalyst.openova.io/section: pts-3-observability
    catalyst.openova.io/tier: catalyst-cp
spec:
  version: 1.0.0
  card:
    title: Loki
    family: insights
    description: Log aggregation backend for the LGTM observability stack. Single-binary mode for solo Sovereign; scalable mode is a values toggle.
    docs: https://grafana.com/docs/loki/latest/

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive; chunks + index on object storage
  #   (cross-region S3 bucket replication async). Not active-hot-standby
  #   because replication mode is async (schema constrains active-hot-standby
  #   to sync); active-active feasible if read-only queries split, but the
  #   audit calls out async/eventual-consistency so active-passive is the
  #   honest default.
  # ── #3373: class-level placement SUGGESTION + allow-list ────────────────
  # Placement is an INSTANCE property (Application.spec.placement); this is
  # only the default every instance inherits silently — the provisioning
  # journey's generic advanced selector (and a direct Git edit of the
  # instance's spec.placement) may override it within allowedPlacements.
  # Founder §4 table target: mgmt. Single render mechanism: the Flux
  # spec.kubeConfig.secretRef pivot — zero per-app placement code.
  defaultPlacement:
    vcluster: mgmt
  allowedPlacements: [host, mgmt]

  topology:
    supported:
      - active-passive
      - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: s3-bucket-replication
          mode: async
          lagSloSeconds: 60
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 60
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # internal-only — queried by Grafana via in-cluster Service DNS.
  endpoints: []

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # No direct user-facing endpoint; SSO realm still declared so Loki's
  # multi-tenancy header (X-Scope-OrgID) maps from sovereign-realm claims.
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    silentLogin: true

  # ── G117.6: Multi-instance ─────────────────────────────────────────────
  multiInstance:
    enabled: false
