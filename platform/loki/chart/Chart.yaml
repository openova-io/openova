apiVersion: v2
name: bp-loki
description: |
  Catalyst Blueprint umbrella chart for Grafana Loki. Depends on the
  upstream `loki` chart (grafana/helm-charts) as a Helm subchart so
  `helm dependency build` pulls the upstream payload into this artifact.
  Catalyst-curated values flow into the upstream subchart under the
  `loki:` key in values.yaml.

  Default deployment shape is SingleBinary (one Loki StatefulSet) — minimum
  for a solo Sovereign. SimpleScalable / Distributed modes are a values
  toggle (`loki.deploymentMode`) once a regional Sovereign needs HA log
  ingestion. Object storage is filesystem (PVC) by default; per-Sovereign
  overlays MUST flip storage to S3 (SeaweedFS / cloud) when SimpleScalable
  or Distributed is selected — the upstream chart enforces this.
type: application
# 1.0.1 (#4343, 2026-06-25): set `loki.sidecar.resources.requests` so the
# rules sidecar (loki-sc-rules) in the SingleBinary StatefulSet satisfies the
# cluster-wide Kyverno `resource-requests` Enforce policy. Post-#4325 this
# chart installs into the native host namespace (not a vCluster) where the
# policy applies; upstream defaults the sidecar resources to empty.
# 1.0.2 (#4347): host-ns Kyverno Enforce compliance — (a) ENABLE the loki pod
#   livenessProbe (loki.loki.livenessProbe httpGet /ready; upstream shipped
#   readiness-only) + add EXEC probes to the loki-sc-rules sidecar
#   (probes-present Enforce); (b) proxy both images (grafana/loki +
#   kiwigrid/k8s-sidecar) through harbor.openova.io (harbor-proxy-pull Enforce).
#   Adds tests/kyverno-probes-present.sh. Refs #4347 #4325.
# 1.0.3 (#4623a): DISABLE the loki-sc-rules sidecar (loki.sidecar.rules.enabled
#   = false). This Sovereign ships ZERO loki_rule ConfigMaps/Secrets, so the
#   sidecar watched an empty set forever AND was a recurring CrashLoop hazard —
#   its EXEC liveness/readiness probe grepped /proc/1/cmdline for python/sidecar,
#   coupling the probe to the upstream image's PID-1 entrypoint which the mutable
#   kiwigrid/k8s-sidecar:2.5.0 tag can change on any rebuild. Disabling drops the
#   container entirely (nothing for probes-present/resource-requests Enforce to
#   reject, no functional loss). Probes retained but switched to the image's
#   built-in /healthz HTTP endpoint for overlays that re-enable the sidecar.
#   Refs #4623.
version: 1.0.3
appVersion: "3.6.7"
keywords: [catalyst, blueprint, loki, observability, logs]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Pinned to grafana/loki 7.0.0 (appVersion 3.6.7) — current stable on
# 2026-04-29. Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the
# version is operator-bumpable via PR + Blueprint release.
dependencies:
  - name: loki
    version: "7.0.0"
    repository: "https://grafana.github.io/helm-charts"

annotations:
  # #2935 (2026-06-03): Blueprint-Release hollow-chart guard exemption.
  # Chart legitimately renders zero resources with default values
  # (default-off feature toggle or dependency-on-CRD pattern). Without
  # this annotation Blueprint-Release rejects publish.
  catalyst.openova.io/smoke-render-mode: "default-off"
