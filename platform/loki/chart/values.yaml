# Catalyst Blueprint umbrella metadata — the upstream chart is resolved as
# a Helm subchart via Chart.yaml `dependencies:`. Catalyst-curated values
# under the `loki:` key flow into the upstream subchart unchanged.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

catalystBlueprint:
  upstream:
    chart: loki
    version: "7.0.0"
    repo: "https://grafana.github.io/helm-charts"

# ─── Upstream chart values (subchart key: loki) ──────────────────────────
loki:
  # SingleBinary mode — solo-Sovereign default. One Loki StatefulSet does
  # ingestion + querying + compaction. Per-Sovereign overlays flip this to
  # `SimpleScalable` (read/write/backend pods) or `Distributed` once HA is
  # required AND object storage is wired. The upstream chart will refuse to
  # render SimpleScalable/Distributed against filesystem storage.
  deploymentMode: SingleBinary

  # Loki core config — SingleBinary uses filesystem storage out of the box.
  # Per-Sovereign overlays MUST replace `storage:` with `s3:` (SeaweedFS or
  # cloud object storage) before flipping deploymentMode.
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: filesystem
      bucketNames:
        chunks: chunks
        ruler: ruler
        admin: admin
    # Pin upstream image — DO NOT use floating tags.
    # #4347 — route through the Sovereign-local Harbor proxy-cache so the
    # host-ns Kyverno `harbor-proxy-pull` Enforce ClusterPolicy admits it
    # (after #4325 moved bp-loki into a native host namespace). The raw
    # `docker.io/grafana/loki` matches neither allowed glob.
    image:
      registry: harbor.openova.io
      repository: proxy-dockerhub/grafana/loki
      tag: "3.6.7"
      pullPolicy: IfNotPresent

    # #4347 — ENABLE the Loki pod livenessProbe. The upstream chart ships
    # `loki.readinessProbe` (httpGet /ready) populated but `loki.livenessProbe:
    # {}` (empty) → the SingleBinary StatefulSet rendered a readinessProbe but
    # NO livenessProbe → the host-ns Kyverno `probes-present` Enforce
    # ClusterPolicy (requires BOTH on every container, after #4325) would DENY
    # it. NOTE the key lives at loki.loki.livenessProbe: the subchart is named
    # `loki`, so the parent's `loki:` map IS the subchart's `.Values`, and the
    # statefulset reads `.Values.loki.livenessProbe` — i.e. parent
    # `loki.loki.livenessProbe`. Mirror the readiness httpGet against /ready;
    # generous initial delay so WAL replay / compaction startup settles first.
    livenessProbe:
      httpGet:
        path: /ready
        port: http-metrics
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 5
      successThreshold: 1

  # SingleBinary StatefulSet — 1 replica, 10Gi PVC for chunks + index.
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 1Gi

  # #4343 — the rules sidecar (kiwigrid/k8s-sidecar `loki-sc-rules`) co-runs
  # in the SingleBinary StatefulSet whenever the upstream `sidecar.rules.enabled`
  # default (true) holds. Its resources come from `sidecar.resources`, which
  # upstream defaults to `{}` → the sidecar container renders with NO requests.
  # Pre-#4325 this chart ran INSIDE a vCluster where the host's Kyverno
  # `resource-requests` Enforce ClusterPolicy didn't reach it; after the
  # de-vcluster migration it installs into the native host namespace and the
  # StatefulSet admission is DENIED. Modest request for the light k8s watcher.
  sidecar:
    # #4347 — proxy the kiwigrid/k8s-sidecar image through the Sovereign-local
    # Harbor so the host-ns `harbor-proxy-pull` Enforce policy admits it
    # (`docker.io/kiwigrid/k8s-sidecar` matches no allowed glob). Mirror the
    # grafana sidecar's proxy-dockerhub convention.
    image:
      registry: harbor.openova.io
      repository: proxy-dockerhub/kiwigrid/k8s-sidecar
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
    # #4347 — the loki-sc-rules sidecar (kiwigrid/k8s-sidecar) had NO probes →
    # the host-ns Kyverno `probes-present` Enforce policy denies the StatefulSet.
    # The sidecar serves no HTTP health port, so both probes are EXEC checks
    # confirming PID 1 is still the python sidecar process (a crashed/replaced
    # PID 1 fails the grep). /proc/1/cmdline is null-separated; grep -q matches
    # the `python` / `sidecar` substring on the python-slim base image.
    livenessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - 'grep -aq -e python -e sidecar /proc/1/cmdline'
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - 'grep -aq -e python -e sidecar /proc/1/cmdline'
      initialDelaySeconds: 5
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3

  # SimpleScalable / Distributed pools — DEFAULT 0 replicas. Per-Sovereign
  # overlays bump these (and flip `deploymentMode`) when scaling out.
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  # Gateway (nginx in front of Loki) — DISABLED for SingleBinary; the
  # SingleBinary StatefulSet serves directly. SimpleScalable overlays flip
  # this on.
  gateway:
    enabled: false

  # Memcached for chunks/results cache — disabled for SingleBinary; not
  # needed at solo-Sovereign scale.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # Loki Canary (synthetic log producer/verifier) — DISABLED by default;
  # drains a DaemonSet pod per node and pulls in monitoring CRDs.
  lokiCanary:
    enabled: false

  # Helm test pods — DISABLED. We don't ship `helm test` infra in production.
  test:
    enabled: false

  # Bundled MinIO subchart — DISABLED. Catalyst routes object storage
  # through SeaweedFS when SimpleScalable/Distributed is selected; never
  # MinIO embedded.
  minio:
    enabled: false

  # Monitoring (dashboards + PrometheusRules) — DEFAULT FALSE per
  # docs/BLUEPRINT-AUTHORING.md §11.2. Enabled by per-Sovereign overlays
  # once kube-prometheus-stack is reconciled.
  monitoring:
    dashboards:
      enabled: false
    rules:
      enabled: false
    serviceMonitor:
      enabled: false
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    lokiCanary:
      enabled: false

# ─── Catalyst overlay values (consumed by templates/ in this chart) ──────
lokiOverlay:
  networkPolicy:
    enabled: false
