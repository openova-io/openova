{{- /*
#3374 (2026-06-14) — NewAPI admin-init + SSO-provider seed + admin-promote.

ROOT CAUSE measured live on hw133 (newapi 0.13.2): newapi shows the
"uninitialized" setup wizard and grants NO admin. `GET /api/setup` returns
`{"status":false,"root_init":false}`; every newapi table (`users`, `setups`,
`custom_oauth_providers`) is EMPTY. The chart had wired the `newapi-admin`
Keycloak client + an `OIDC_*` ConfigMap, but newapi 0.13.x does NOT read OIDC
from env — its OIDC providers live in the DB `custom_oauth_providers` table,
and it has no root user, so the app is stuck pre-setup and the owner could
never land signed-in as admin.

NewAPI facts (verified against QuantumNous/new-api):
  - `setups` (id, version, initialized_at): one row ⇒ `status:true`.
  - `RootUserExists()` = any `users.role = 100` ⇒ `root_init:true`. role
    constants: common=1, admin=10, root=100.
  - OIDC login (controller/oidc.go) matches an existing user by `oidc_id`
    (the `sub` claim); when none matches AND registration is enabled it
    CREATES the user with the DB-default role=1 (common) — there is NO
    group→role mechanism and NO "first user becomes root". So an SSO user
    is ALWAYS created as common and must be promoted out of band.
  - `custom_oauth_providers` is the OIDC-provider table (slug uniqueIndex;
    client_id/secret; well_known auto-discovers endpoints; user_id_field
    default `sub`; auth_style 0=auto; access_policy = JSON
    {logic, conditions:[{field,op,value}], groups:[...]} that GATES login).

This template ships, all DB-direct via the CNPG `<cluster>-app` Secret (the
chart's smoke test ASSERTS `auth.adminUI.masterKeySecret` is unset, so the
admin-API/master-key path is unavailable — we go straight to Postgres, which
newapi owns):

  1. A post-install/post-upgrade Job that, idempotently:
     a. inserts a `setups` row (⇒ status:true, kills the wizard),
     b. inserts a system root user (role=100, SSO-only — a locked password
        sentinel that can never bcrypt-verify, so password login is
        impossible) ⇒ root_init:true,
     c. inserts the sovereign-realm OIDC provider row (enabled) ⇒ the
        "Sign in with <name>" button works and the silent-SSO chain lands,
        with access_policy gating the `sovereign-admins` group,
     d. promotes any already-present OIDC user to root (re-run catch-up).
  2. A CronJob (default every minute) that promotes any SSO-authenticated
     user (`oidc_id<>'' AND role<100`) to root — so the owner's FIRST bare-
     URL SSO login lands them as admin within ~1 min. Gated to the
     access_policy'd provider, only `sovereign-admins` members ever get a
     user row, so the promote is owner-scoped.

Fresh-prov-safe + zero-touch: pgcrypto is NOT required (locked-sentinel
password, never verified); all statements are idempotent guards.

Skip-render: `auth.adminUI.mode != keycloak`, `newapi.enabled=false`, or
`cnpg.enabled=false` ⇒ no Job/CronJob (the DB-direct seam needs the CNPG
cluster). Operators on an external Postgres or a non-OIDC posture get
nothing.
*/ -}}
{{- $seed := .Values.adminSeed | default dict -}}
{{- /* #3648 — STANDARD sso-bootstrap contract. The seed's parameters now
   come from the app-agnostic `.Values.sso` stanza (adminGroup + bootstrap.*,
   the SAME contract every other app declares: grafana/harbor/gitea/openbao);
   the legacy `.Values.adminSeed.*` keys remain a fallback so existing
   overlays keep working. The platform's interpretation keys on the STANDARD
   fields, never on "newapi". The DB-direct SQL is intrinsic to newapi's
   schema; only its parameterisation rides this contract. */ -}}
{{- $sso := .Values.sso | default dict -}}
{{- $ssoBootstrap := $sso.bootstrap | default dict -}}
{{- /* Seed-enabled: standard sso.bootstrap.enabled wins; else legacy
   adminSeed.enabled; default true. */ -}}
{{- $seedEnabled := true -}}
{{- if hasKey $ssoBootstrap "enabled" -}}{{- $seedEnabled = $ssoBootstrap.enabled -}}
{{- else if hasKey $seed "enabled" -}}{{- $seedEnabled = $seed.enabled -}}{{- end -}}
{{- $kcMode := eq .Values.auth.adminUI.mode "keycloak" -}}
{{- if and $seedEnabled .Values.newapi.enabled $kcMode .Values.cnpg.enabled .Values.sovereignFQDN -}}
{{- $clusterName := printf "%s-newapi-pg" (include "bp-newapi.fullname" .) -}}
{{- $cnpgSecretName := printf "%s-app" $clusterName -}}
{{- $jobName := include "bp-newapi.adminSeedJobName" . -}}
{{- $cronName := include "bp-newapi.adminPromoteCronName" . -}}
{{- /* #3374: the NewAPI Deployment the seed rollout-restarts so the running
   pod reloads custom_oauth_providers from the DB (boot-only registry). */ -}}
{{- $deployName := include "bp-newapi.fullname" . -}}
{{- /* #3374: Deployment annotation recording the provider-config hash the
   running NewAPI was last restarted for — makes the reload idempotent. */ -}}
{{- $reloadHashAnno := "catalyst.openova.io/newapi-provider-reload-hash" -}}
{{- $pgImage := .Values.cnpg.cluster.imageName | default "harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql:16.4" -}}
{{- $fqdn := .Values.sovereignFQDN -}}
{{- $clientId := .Values.auth.adminUI.keycloak.clientId | default "newapi-admin" -}}
{{- $oidcSecretName := .Values.auth.adminUI.keycloak.existingSecret | default (printf "%s-oidc" (include "bp-newapi.fullname" .)) -}}
{{- /* #3648 — adminGroup + providerSlug resolve from the STANDARD
   `.Values.sso` contract first (sso.adminGroup, sso.bootstrap.providerSlug),
   then the legacy adminSeed.* keys, then the literal default. */ -}}
{{- $adminGroup := $sso.adminGroup | default $seed.adminGroup | default "sovereign-admins" -}}
{{- $rootUsername := $seed.rootUsername | default "catalyst-root" -}}
{{- $providerName := $seed.providerName | default "OpenOva SSO" -}}
{{- $providerSlug := $ssoBootstrap.providerSlug | default $seed.providerSlug | default "sovereign" -}}
{{- /* #3648 — enforceAdminGroup: standard sso.bootstrap.enforceAdminGroup
   wins; else legacy adminSeed.enforceAdminGroup; default false. */ -}}
{{- $enforceAdminGroup := false -}}
{{- if hasKey $ssoBootstrap "enforceAdminGroup" -}}{{- $enforceAdminGroup = $ssoBootstrap.enforceAdminGroup -}}
{{- else if hasKey $seed "enforceAdminGroup" -}}{{- $enforceAdminGroup = $seed.enforceAdminGroup -}}{{- end -}}
{{- /* #3374: NewAPI's public base URL → options.ServerAddress. The
   generic-OAuth token-exchange builds redirect_uri = ServerAddress/oauth/<slug>
   (upstream oauth/generic.go:97); it MUST byte-match the frontend authorize
   redirect_uri window.origin/oauth/<slug> (use-oauth-login.ts:204), i.e.
   https://newapi.<fqdn>. Operator override wins; else derive from the FQDN. */ -}}
{{- $serverAddress := $seed.serverAddress | default (printf "https://newapi.%s" $fqdn) -}}
{{- $version := .Chart.AppVersion | default "0.13.2" -}}
{{- $pullPolicy := (default dict $seed.image).pullPolicy | default "IfNotPresent" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
    catalyst.openova.io/component: admin-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "8"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
    catalyst.openova.io/component: admin-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "8"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ $cnpgSecretName | quote }}
      - {{ $oidcSecretName | quote }}
    verbs: ["get"]
  # #3374 (2026-06-15) — provider-reload rollout-restart. After the seed INSERTs
  # the custom_oauth_providers row, the running NewAPI pod must reload it: NewAPI
  # loads custom OAuth providers into its in-memory registry ONLY at boot
  # (LoadCustomProviders / GetEnabledCustomProviders); the 60s SYNC_FREQUENCY
  # loop re-syncs ONLY options + channels, NEVER custom providers (proven live
  # hw139, boot log "Loaded 0 custom OAuth providers" while the DB row was
  # inserted 2s after the pod started → /api/oauth/sovereign returned "Unknown
  # OAuth provider" → SSO callback dies → owner bounced to /login → /setup). The
  # seed patches the NewAPI Deployment (standard kubectl.kubernetes.io/restartedAt
  # annotation) to force a reload. Scoped get+patch on EXACTLY the NewAPI deploy.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - {{ $deployName | quote }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
    catalyst.openova.io/component: admin-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "8"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ $jobName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $jobName }}
  apiGroup: rbac.authorization.k8s.io
---
{{- /*
The SQL is identical for the one-shot seed Job and the periodic promote
CronJob's catch-up, so it lives in one ConfigMap mounted into both. Two
scripts: seed.sh (full init, Job) + promote.sh (promote-only, CronJob).
The CNPG <cluster>-app Secret (basic-auth) carries host/port/dbname/user/
password; we read them from a mounted Secret volume rather than env so the
plaintext never lands in the Pod manifest.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $jobName }}-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
    catalyst.openova.io/component: admin-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "8"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  common.sh: |
    # Shared: build PSQL from the mounted CNPG -app Secret + wait for tables.
    set -eu
    CRED=/cnpg
    PGHOST="$(cat "${CRED}/host")"
    PGPORT="$(cat "${CRED}/port" 2>/dev/null || echo 5432)"
    PGDATABASE="$(cat "${CRED}/dbname")"
    PGUSER="$(cat "${CRED}/user" 2>/dev/null || cat "${CRED}/username")"
    PGPASSWORD="$(cat "${CRED}/password")"
    export PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD
    PSQL="psql -v ON_ERROR_STOP=1 -qtA"
    wait_for_users_table() {
      i=0
      until [ "$i" -ge 60 ]; do
        if $PSQL -c "SELECT to_regclass('public.users');" 2>/dev/null | grep -q '^users$'; then
          echo "[admin-seed] users table present"; return 0
        fi
        i=$((i+1)); echo "[admin-seed] waiting for newapi schema migration ($i/60)"; sleep 5
      done
      echo "[admin-seed] FATAL: users table not present after 5min (newapi never migrated?)" >&2
      return 1
    }
    promote_oidc_users() {
      # Any SSO-authenticated, active user that is not yet root → root (100).
      # access_policy on the provider gates login to the admin group, so only
      # authorised owners ever own an SSO identity row.
      #
      # #3374 (2026-06-14) — CUSTOM-PROVIDER identity lives in
      # `user_oauth_bindings`, NOT `users.oidc_id`. NewAPI's generic
      # (custom) OAuth provider persists the SSO subject in the
      # `user_oauth_bindings` table (controller/oauth.go findOrCreateOAuthUser
      # → model.UpdateUserOAuthBinding; the comment at
      # model/custom_oauth_provider.go:126 is explicit: "Custom provider: use
      # user_oauth_bindings table"). The legacy `users.oidc_id` column is only
      # written by the BUILT-IN `oidc` provider, which this Sovereign does NOT
      # use (we seed a custom provider, slug `{{ $providerSlug }}`). So an
      # SSO user created through the sovereign provider has oidc_id='' and the
      # old `oidc_id <> ''` predicate NEVER matched it → the owner signed in
      # via SSO but stayed role=1 (common) forever and every admin route
      # 302'd to /forbidden (measured live on hw136: user `sovereign_2` had a
      # `user_oauth_bindings` row but oidc_id='' → never promoted). Promote on
      # EITHER signal: a non-empty legacy oidc_id (built-in provider, kept for
      # back-compat) OR a binding to the sovereign custom provider.
      n="$($PSQL -c "UPDATE users SET role=100
            WHERE status = 1 AND role < 100
              AND (
                (oidc_id IS NOT NULL AND oidc_id <> '')
                OR id IN (
                  SELECT b.user_id FROM user_oauth_bindings b
                  JOIN custom_oauth_providers p ON p.id = b.provider_id
                  WHERE p.slug = '{{ $providerSlug }}'
                )
              )
            RETURNING id;" | wc -l | tr -d ' ')"
      echo "[admin-seed] promoted ${n} SSO user(s) to root (oidc_id OR {{ $providerSlug }} binding)"
    }
    reload_newapi_provider() {
      # #3374 (2026-06-15) — make the RUNNING NewAPI pod pick up the
      # `{{ $providerSlug }}` custom_oauth_providers row this seed just wrote.
      #
      # ROOT CAUSE (measured live on hw139, dep c89aa7059556b342): NewAPI loads
      # custom OAuth providers into an in-memory registry ONLY at boot
      # (LoadCustomProviders; GetEnabledCustomProviders reads that map). The 60s
      # SYNC_FREQUENCY loop re-syncs ONLY `options` + `channels` from the DB —
      # NEVER `custom_oauth_providers` (confirmed in the pod log: repeated
      # "syncing options"/"syncing channels", no custom-provider sync; upstream
      # oauth/registry.go has no periodic reload). Because this seed runs as a
      # Helm post-install/post-upgrade hook, it INSERTs the provider row AFTER
      # the NewAPI Deployment is already up (live: pod started 18:51:56, row
      # created 18:51:58, restartCount=0) — so the process boots with "Loaded 0
      # custom OAuth providers", /api/oauth/{{ $providerSlug }} returns
      # "Unknown OAuth provider", the SSO callback dies and the owner bounces to
      # /login → /setup. A rollout-restart re-runs LoadCustomProviders → "Loaded
      # 1 custom OAuth providers" and the callback works (proven live).
      #
      # We trigger the restart by patching the Deployment's pod-template
      # `kubectl.kubernetes.io/restartedAt` (exactly what `kubectl rollout
      # restart` does). IDEMPOTENT across reconciles: we record a hash of the
      # provider's material config in the Deployment's top-level annotation
      # `{{ $reloadHashAnno }}` and restart ONLY when that hash is absent or
      # changed — so a re-run with no provider change is a no-op (no restart
      # loop; the per-minute promote CronJob never calls this). All via the
      # mounted ServiceAccount token (python3 is present in the postgres image;
      # curl/wget are not, and an HTTP probe would fight the NetworkPolicy).
      #
      # Hash the live provider config (enabled+client_id+secret+endpoints). If
      # the row is somehow absent (client_secret was not yet published when the
      # provider INSERT was deferred), skip — the next reconcile reloads.
      PROVIDER_HASH="$($PSQL -c "SELECT md5(string_agg(
            coalesce(enabled::text,'')||'|'||coalesce(client_id,'')||'|'||
            coalesce(client_secret,'')||'|'||coalesce(authorization_endpoint,'')||'|'||
            coalesce(token_endpoint,'')||'|'||coalesce(user_info_endpoint,''), ''))
          FROM custom_oauth_providers WHERE slug = '{{ $providerSlug }}';" 2>/dev/null | tr -d ' ')"
      if [ -z "${PROVIDER_HASH}" ]; then
        echo "[admin-seed] reload: provider {{ $providerSlug }} not present yet; skipping restart (next reconcile retries)"
        return 0
      fi
      # Hand off to the dedicated reload script (its own ConfigMap key, mounted
      # at /scripts/reload.py — kept a separate file so the Python lives in a
      # clean block scalar, not nested in this shell heredoc). python3 ships in
      # the postgres image; the mounted ServiceAccount token authenticates the
      # k8s API call. Best-effort: a reload hiccup never fails the seed.
      NEWAPI_DEPLOY_NAME='{{ $deployName }}' \
      NEWAPI_RELOAD_ANNO='{{ $reloadHashAnno }}' \
      NEWAPI_PROVIDER_HASH="${PROVIDER_HASH}" \
        python3 /scripts/reload.py || \
        echo "[admin-seed] reload: python step exited non-zero (best-effort; provider still seeded)"
    }
  seed.sh: |
    . /scripts/common.sh
    echo "[admin-seed] target=${PGHOST}:${PGPORT}/${PGDATABASE} user=${PGUSER}"
    wait_for_users_table

    # (a0) ServerAddress option → newapi's public base URL. #3374 (2026-06-14).
    #      The generic-OAuth provider builds the token-exchange redirect_uri as
    #      `${ServerAddress}/oauth/${slug}` (upstream oauth/generic.go:97), which
    #      MUST byte-match the frontend authorize redirect_uri
    #      `${window.origin}/oauth/${slug}` (use-oauth-login.ts:204) per
    #      RFC-6749 §4.1.3. With ServerAddress empty (the newapi default — the
    #      `options` table ships with 0 rows), the exchange sends the relative
    #      `/oauth/${slug}`, Keycloak rejects it with `invalid_grant - Incorrect
    #      redirect_uri`, and the owner never gets a session (bounces to
    #      /login?expired=true — measured live hw133 2026-06-14, #3475). The
    #      `options` table is (key text PRIMARY KEY, value text); newapi loads it
    #      into OptionMap at boot AND re-syncs periodically (model/option.go
    #      InitOptionMap→loadOptionsFromDatabase + SyncOptions), so this upsert
    #      takes effect on the running pod without a forced restart. Idempotent.
    $PSQL -c "INSERT INTO options (key, value) VALUES ('ServerAddress', '{{ $serverAddress }}')
              ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value;"
    echo "[admin-seed] ServerAddress option ensured ({{ $serverAddress }})"

    # (a) setups row → status:true (kills the setup wizard). Idempotent.
    $PSQL -c "INSERT INTO setups (version, initialized_at)
              SELECT '{{ $version }}', EXTRACT(EPOCH FROM now())::bigint
              WHERE NOT EXISTS (SELECT 1 FROM setups);"
    echo "[admin-seed] setups row ensured"

    # (b) system root user → root_init:true. SSO-only: the password is a
    #     locked sentinel that can NEVER bcrypt-verify (newapi's
    #     ValidateAndFill bcrypt-compare returns an error ⇒ password login
    #     impossible). The owner signs in via SSO, never this account.
    $PSQL -c "INSERT INTO users (username, password, display_name, role, status, email, quota, \"group\", created_at)
              SELECT '{{ $rootUsername }}',
                     '!locked-sso-only-' || md5(random()::text),
                     'Catalyst Root (SSO-only)', 100, 1,
                     '{{ $rootUsername }}@{{ $fqdn }}', 100000000, 'default',
                     EXTRACT(EPOCH FROM now())::bigint
              WHERE NOT EXISTS (SELECT 1 FROM users WHERE role = 100);"
    echo "[admin-seed] root user ensured (role=100, SSO-only)"

    # (c) sovereign-realm OIDC provider → the in-app SSO button works and the
    #     silent-SSO chain (catalyst-pin) lands the owner. well_known drives
    #     endpoint discovery; access_policy gates login to the admin group.
    CLIENT_SECRET="$(cat /oidc/client_secret 2>/dev/null || cat /oidc/OIDC_CLIENT_SECRET 2>/dev/null || echo '')"
    if [ -z "${CLIENT_SECRET}" ]; then
      echo "[admin-seed] WARN: OIDC client_secret not yet published (bp-sso-bridge); provider insert deferred — CronJob/next reconcile will retry"
    else
      WELLKNOWN="https://auth.{{ $fqdn }}/realms/{{ $providerSlug }}/.well-known/openid-configuration"
      AUTHZ="https://auth.{{ $fqdn }}/realms/{{ $providerSlug }}/protocol/openid-connect/auth?kc_idp_hint=catalyst-pin"
      TOKEN="https://auth.{{ $fqdn }}/realms/{{ $providerSlug }}/protocol/openid-connect/token"
      USERINFO="https://auth.{{ $fqdn }}/realms/{{ $providerSlug }}/protocol/openid-connect/userinfo"
      # access_policy: OPTIONAL gate. When enforceAdminGroup=true the userinfo
      # `groups` array (KC sovereign realm emits the BARE name — realm mapper
      # full.path=false, so grafana's working `contains(groups[*],
      # 'sovereign-admins')` proves the format) must CONTAIN the admin group.
      # Default OFF (empty policy): the sovereign realm's catalyst-pin IdP
      # already restricts WHO can authenticate, and the promote step keys on
      # oidc_id — so the owner ALWAYS lands (the #3150 lesson: never let a gate
      # break the actual login). Operators flip enforceAdminGroup=true to also
      # deny non-admins at the newapi boundary.
      {{- if $enforceAdminGroup }}
      POLICY='{"logic":"and","conditions":[{"field":"groups","op":"contains","value":"{{ $adminGroup }}"}],"groups":[]}'
      {{- else }}
      POLICY=''
      {{- end }}
      # Upsert on the unique slug. ON CONFLICT keeps secret/endpoints fresh
      # across rotations.
      $PSQL <<SQL
    INSERT INTO custom_oauth_providers
      (name, slug, icon, enabled, client_id, client_secret,
       authorization_endpoint, token_endpoint, user_info_endpoint,
       scopes, user_id_field, username_field, display_name_field, email_field,
       well_known, auth_style, access_policy, access_denied_message,
       created_at, updated_at)
    VALUES
      ('{{ $providerName }}', '{{ $providerSlug }}', 'keycloak', true,
       '{{ $clientId }}', '${CLIENT_SECRET}',
       '${AUTHZ}', '${TOKEN}', '${USERINFO}',
       'openid profile email groups', 'sub', 'preferred_username', 'name', 'email',
       '${WELLKNOWN}', 0,
       '${POLICY}',
       'Access denied — your account is not a member of the {{ $adminGroup }} group.',
       now(), now())
    ON CONFLICT (slug) DO UPDATE SET
       enabled = EXCLUDED.enabled,
       client_id = EXCLUDED.client_id,
       client_secret = EXCLUDED.client_secret,
       authorization_endpoint = EXCLUDED.authorization_endpoint,
       token_endpoint = EXCLUDED.token_endpoint,
       user_info_endpoint = EXCLUDED.user_info_endpoint,
       well_known = EXCLUDED.well_known,
       access_policy = EXCLUDED.access_policy,
       updated_at = now();
    SQL
      echo "[admin-seed] sovereign OIDC provider ensured (slug={{ $providerSlug }}, admin group={{ $adminGroup }})"
    fi

    # (d) promote anyone already signed in (re-run catch-up).
    promote_oidc_users

    # (e) #3374 — reload the running NewAPI so it actually SEES the provider
    #     row just written. NewAPI's custom-provider registry is boot-only and
    #     the 60s sync loop never re-reads custom_oauth_providers, so a Helm
    #     post-install/upgrade DB INSERT is invisible to the live pod until a
    #     rollout-restart. Idempotent (hash-gated) — only restarts on a genuine
    #     provider config change. Without this the bare URL completes the KC
    #     authorize but the /api/oauth/{{ $providerSlug }} callback hard-fails
    #     "Unknown OAuth provider" and the owner never lands signed-in.
    reload_newapi_provider
    echo "[admin-seed] done."
  promote.sh: |
    . /scripts/common.sh
    wait_for_users_table
    promote_oidc_users
  reload.py: |
    # #3374 (2026-06-15) — rollout-restart NewAPI so the running pod reloads the
    # seeded custom OAuth provider (boot-only registry; the 60s sync loop never
    # re-reads custom_oauth_providers). Idempotent: records a hash of the
    # provider config in the Deployment annotation and restarts ONLY when that
    # hash is absent/changed. Uses only the stdlib + the mounted SA token.
    import json, os, ssl, urllib.request, urllib.error, datetime
    sa = "/var/run/secrets/kubernetes.io/serviceaccount"
    tok = open(sa + "/token").read().strip()
    ns = open(sa + "/namespace").read().strip()
    ca = sa + "/ca.crt"
    host = os.environ["KUBERNETES_SERVICE_HOST"]
    port = os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS") or os.environ.get("KUBERNETES_SERVICE_PORT") or "443"
    name = os.environ["NEWAPI_DEPLOY_NAME"]
    anno = os.environ["NEWAPI_RELOAD_ANNO"]
    want = os.environ["NEWAPI_PROVIDER_HASH"]
    base = "https://%s:%s/apis/apps/v1/namespaces/%s/deployments/%s" % (host, port, ns, name)
    ctx = ssl.create_default_context(cafile=ca)


    def call(method, url, body=None, ctype="application/json"):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url, data=data, method=method, headers={
            "Authorization": "Bearer " + tok,
            "Accept": "application/json",
            "Content-Type": ctype,
        })
        try:
            with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
                return r.status, r.read().decode()
        except urllib.error.HTTPError as e:
            return e.code, e.read().decode()


    st, body = call("GET", base)
    if st != 200:
        print("[admin-seed] reload: GET deployment failed (%s): %s" % (st, body[:200]))
        raise SystemExit(0)
    cur = (json.loads(body).get("metadata", {}).get("annotations", {}) or {}).get(anno)
    if cur == want:
        print("[admin-seed] reload: NewAPI already restarted for provider hash %s -- no-op" % want[:12])
        raise SystemExit(0)
    nowts = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
    patch = {
        "metadata": {"annotations": {anno: want}},
        "spec": {"template": {"metadata": {"annotations": {
            "kubectl.kubernetes.io/restartedAt": nowts,
        }}}},
    }
    st2, body2 = call("PATCH", base, patch, ctype="application/strategic-merge-patch+json")
    if st2 == 200:
        print("[admin-seed] reload: rollout-restart triggered for %s (provider hash %s -> %s)" % (name, (cur or "none")[:12], want[:12]))
    else:
        print("[admin-seed] reload: PATCH failed (%s): %s" % (st2, body2[:200]))
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    # hookLabels = bp-newapi.labels but managed-by=flux (single key, no dup):
    # kyverno flux-managed Enforce DENIES a hook Job without managed-by=flux
    # (helm-controller-created, no HR ownerReference). Without it this
    # post-upgrade SSO admin seed fails → HR rolls back (#3374 / #3434).
    {{- include "bp-newapi.hookLabels" . | nindent 4 }}
    catalyst.openova.io/component: admin-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "12"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ $seed.backoffLimit | default 6 }}
  activeDeadlineSeconds: {{ $seed.activeDeadlineSeconds | default 420 }}
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "bp-newapi.selectorLabels" . | nindent 8 }}
        catalyst.openova.io/component: admin-seed
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $jobName }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: scripts
          configMap:
            name: {{ $jobName }}-scripts
            defaultMode: 0555
        - name: cnpg
          secret:
            secretName: {{ $cnpgSecretName | quote }}
        - name: oidc
          secret:
            secretName: {{ $oidcSecretName | quote }}
            optional: true
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
      containers:
        - name: admin-seed
          image: {{ $pgImage | quote }}
          imagePullPolicy: {{ $pullPolicy }}
          command: ["/bin/sh", "/scripts/seed.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: cnpg
              mountPath: /cnpg
              readOnly: true
            - name: oidc
              mountPath: /oidc
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml ($seed.resources | default (dict "requests" (dict "cpu" "10m" "memory" "64Mi") "limits" (dict "cpu" "200m" "memory" "128Mi"))) | nindent 12 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $cronName }}
  namespace: {{ .Release.Namespace }}
  labels:
    # hookLabels = managed-by=flux (single key, no dup). kyverno flux-managed
    # Enforce gates CronJob too (helm-controller hook CronJobs carry no HR
    # ownerReference) → stamp it on the CronJob AND its spawned Jobs
    # (jobTemplate below). Caught live on hw133 once the 4-Job managed-by fix
    # let the upgrade reach the CronJob (#3374; openbao snapshot-replication #3434).
    {{- include "bp-newapi.hookLabels" . | nindent 4 }}
    catalyst.openova.io/component: admin-promote
spec:
  schedule: {{ $seed.promoteSchedule | default "* * * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 120
  jobTemplate:
    metadata:
      labels:
        # The CronJob-spawned Job is itself gated by flux-managed — managed-by=flux.
        {{- include "bp-newapi.hookLabels" . | nindent 8 }}
        catalyst.openova.io/component: admin-promote
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 120
      template:
        metadata:
          labels:
            {{- include "bp-newapi.selectorLabels" . | nindent 12 }}
            catalyst.openova.io/component: admin-promote
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ $jobName }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: scripts
              configMap:
                name: {{ $jobName }}-scripts
                defaultMode: 0555
            - name: cnpg
              secret:
                secretName: {{ $cnpgSecretName | quote }}
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 8Mi
          containers:
            - name: admin-promote
              image: {{ $pgImage | quote }}
              imagePullPolicy: {{ $pullPolicy }}
              command: ["/bin/sh", "/scripts/promote.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: cnpg
                  mountPath: /cnpg
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
{{- end }}
