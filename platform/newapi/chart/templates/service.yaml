{{- /*
#5599 — this Service is deliberately still gated on plain `renderApp`, NOT on
`renderWorkloads`: on a crossRegion SECONDARY it MUST render even though the
Deployment does not. Cilium merges ClusterMesh global Services BY name +
namespace, so the name has to exist in every participating cluster; the
HTTPRoute's backendRef has to resolve; and this region's envoy still has to
answer for `newapi.<fqdn>` because the shared VIP fans TCP across BOTH regions'
gateways. With no local Pod the selector matches ZERO backends, so
`service.cilium.io/affinity: local` falls through the mesh to the primary's
singleton — which is exactly what stops one browser's OAuth code exchange from
splitting across two independent Postgres clusters (the 403-on-a-valid-code).
*/ -}}
{{- if and (eq (include "bp-newapi.renderApp" .) "true") .Values.newapi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bp-newapi.fullname" . }}
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
  {{- with (include "bp-newapi.crossRegionServiceAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if .Values.meteringSidecar.enabled }}
    # When the metering sidecar (#798) is enabled, the canonical
    # http port routes to the sidecar so /v1/* traffic is observed
    # before reaching NewAPI. The sidecar forwards to NewAPI on the
    # same pod's loopback. The admin Ingress allow-list (api.* host)
    # still flows through this Service; admin paths skip sidecar
    # billing per pathLooksLikeLLM in core/services/metering-sidecar.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.meteringSidecar.port }}
      protocol: TCP
    # Direct port to NewAPI for the bp-catalyst-platform admin API
    # (`http://newapi.newapi.svc:3000/api/v1/admin/users` per
    # ADR-0003 §3.2). Keeps the admin trust boundary off the
    # observed proxy path.
    - name: http-newapi-direct
      port: {{ add .Values.service.port 1 }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
    {{- else }}
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
    {{- end }}
    {{- if .Values.sandboxBridge.enabled }}
    # Sandbox-bridge sidecar (#2303, Wave 5.57) — POST
    # /admin/tokens/sandbox served by the Go bridge handler in
    # platform/newapi/internal/handler. The sandbox-controller's
    # NewAPI client targets `<svc>:bridge`.
    - name: bridge
      port: {{ .Values.sandboxBridge.port }}
      targetPort: {{ .Values.sandboxBridge.port }}
      protocol: TCP
    {{- end }}
  selector:
    {{- include "bp-newapi.selectorLabels" . | nindent 4 }}
{{- /*
#3374 (2026-06-18) — dedicated bridge-only Service with
publishNotReadyAddresses:true. The main Service above only adds the Pod to its
EndpointSlice once ALL containers are Ready (pod-readiness = AND of every
container readinessProbe); the `newapi` container is NotReady for ~2 min during
GORM AutoMigrate, so the main Service has ZERO ready endpoints (every port)
during warm-up. The gateway routes the bare URL's Exact `/` here instead, and
publishNotReadyAddresses:true publishes the bridge endpoint the INSTANT the
bridge container is listening — even while `newapi` is NotReady — so the
zero-click landing page loads on the 1st hit (no `upstream-connect-error ...
delayed connect error: 111`). The landing page's own retry then rides out
NewAPI's /api/oauth/state warm-up. Combined with the native-sidecar bridge
(deployment.yaml), this is the real fix for the hw159 1st-hit 111. Gated on
sandboxBridge.enabled + ssoInit (the only consumer is the Exact `/` route);
publishNotReadyAddresses is safe here because the bridge has NO not-ready
window that serves bad data — it answers /healthz + the static landing page as
soon as it binds, and /api/oauth/state is proxied to NewAPI by the SPA, not by
this Service.
*/ -}}
{{- $ssoInit := .Values.ssoInit | default dict -}}
{{- $ssoInitOn := or (not (hasKey $ssoInit "enabled")) $ssoInit.enabled -}}
{{- if and .Values.sandboxBridge.enabled $ssoInitOn }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bp-newapi.fullname" . }}-bridge
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
    catalyst.openova.io/component: newapi-bridge
  {{- /* #5599 — the bridge Service needs the SAME ClusterMesh treatment as the
     main one. The HTTPRoute sends Exact `/` AND Exact `/login` here (the
     zero-click landing page + the #5612 recovery path), and BOTH of those
     initiate the OIDC round-trip whose authorization code the main Service's
     backend must later be able to redeem. Annotating only the main Service
     would leave the entry leg free to land in the secondary region while the
     callback leg went to the primary — the same defect through a narrower
     window. */}}
  {{- with (include "bp-newapi.crossRegionServiceAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # Publish the bridge endpoint even while the Pod is NotReady (the `newapi`
  # container's GORM-migrate window). The bridge serves the zero-click landing
  # page + /healthz the instant it binds :{{ .Values.sandboxBridge.port }}.
  publishNotReadyAddresses: true
  ports:
    - name: bridge
      port: {{ .Values.sandboxBridge.port }}
      targetPort: {{ .Values.sandboxBridge.port }}
      protocol: TCP
  selector:
    {{- include "bp-newapi.selectorLabels" . | nindent 4 }}
{{- end }}
{{- end }}
