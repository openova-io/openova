{{- /*
CNPG Cluster + DSN-placeholder Secret for bp-newapi (issue #943, #1834).

NewAPI persists users, credits, channels, tokens, and an audit log to
PostgreSQL. The chart auto-provisions the backing Postgres via CNPG
when `cnpg.enabled=true` (DEFAULT). The chart renders:

  - postgresql.cnpg.io/v1.Cluster `<release>-newapi-pg` with the
    operator-configured size + storage from .Values.cnpg.cluster.*.
    CNPG auto-creates `<cluster>-app` Secret (basic-auth shape:
    username + password keys) and `<cluster>-rw` Service.

  - Placeholder Secret `<release>-newapi-db-dsn` with EMPTY SQL_DSN
    key, materialised at install time so the deployment.yaml
    secretKeyRef references a Secret that already exists (kubelet
    won't trip CreateContainerConfigError). The companion
    `database-secret-sync-job.yaml` Helm post-install Job then
    composes the full DSN string from CNPG's `<cluster>-app`
    password (polled until ready) and PATCHes the SQL_DSN key
    into this Secret in place.

TBD-A39 / Issue #1834 (2026-05-19, root-cause): The previous
implementation rendered the DSN via Helm `lookup` against
`<cluster>-app` at template-render time. On every freshly-franchised
Sovereign CNPG materialises that Secret only AFTER bp-newapi's
HelmRelease applies, so the first render's lookup returns nil and
the Secret committed an empty password — `postgres://newapi:@.../`.
The chart annotated the rendered Secret `helm.sh/resource-policy: keep`,
so Flux never overwrote the empty bytes on subsequent reconciles
even after CNPG had populated the source. Result on t32: newapi Pod
in 21x CrashLoopBackOff with `password authentication failed for
user "newapi"`. Switched to the canonical sync-job pattern lifted
from platform/gitea/chart/templates/database-secret-sync-job.yaml
(issue #830 Bug 2) + platform/wordpress-tenant/chart/templates/
database-secret-sync-job.yaml (issue #1786) — both proven on
otech30/t26. The sync-job is event-deterministic (polls until source
ready, PATCHes destination, exits 0) and idempotent across helm
upgrade.

  - `database.existingSecret` and `database.existingSecretKey` default
    to the chart-emitted Secret name and key when cnpg.enabled=true,
    so the deployment.yaml gate passes WITHOUT operator intervention.
    Per Inviolable Principle #4 the operator MAY still override
    `.Values.database.existingSecret` to wire NewAPI at an external
    Postgres without forking the chart.

Capabilities gate: the chart MUST NOT render the Cluster on a Sovereign
where bp-cnpg has not yet registered the `postgresql.cnpg.io/v1` CRD.
Without the gate, a cold install fails with "no matches for kind
Cluster". Same pattern the bp-external-dns chart uses (issue #190) and
the platform/powerdns/chart/templates/cnpg-cluster.yaml mirror.
*/}}
{{- /* #5599 cross-region singleton: an OAuth authorization code is single-use
   and stored SERVER-SIDE, so the Sovereign may hold exactly ONE newapi
   datastore. `bp-newapi.renderDataStore` = `renderSeams AND NOT
   crossRegion-secondary` — it COMPOSES with the #3831 placement gate rather
   than replacing it, and with crossRegion.enabled=false (the default) it is a
   no-op. A secondary region renders neither the Cluster CR nor the DSN
   placeholder Secret below; database-secret-sync-job.yaml carries the same
   gate so its post-install hook cannot poll forever for a `<cluster>-app`
   Secret that will never exist. */ -}}
{{- if and (eq (include "bp-newapi.renderDataStore" .) "true") .Values.cnpg.enabled -}}
{{- $clusterName := printf "%s-newapi-pg" (include "bp-newapi.fullname" .) -}}
{{- $dsnSecretName := default (printf "%s-newapi-db-dsn" (include "bp-newapi.fullname" .)) .Values.cnpg.dsnSecretName -}}
{{- $database := .Values.cnpg.database | default "newapi" -}}
{{- if .Capabilities.APIVersions.Has "postgresql.cnpg.io/v1" -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  instances: {{ .Values.cnpg.cluster.instances | default 1 }}
  imageName: {{ .Values.cnpg.cluster.imageName | default "harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql:16.4" | quote }}
  {{- /* G93.3 (Refs #2668) — see bp-gitea cnpg-cluster.yaml for full
  rationale. When instances>=2, default CNPG affinity.topologyKey to
  topology.kubernetes.io/region for cross-region spread on Cilium
  ClusterMesh. */ -}}
  {{- if ge (int (.Values.cnpg.cluster.instances | default 1)) 2 }}
  affinity:
    topologyKey: {{ (default dict .Values.cnpg.cluster.affinity).topologyKey | default "topology.kubernetes.io/region" | quote }}
    podAntiAffinityType: {{ (default dict .Values.cnpg.cluster.affinity).podAntiAffinityType | default "preferred" | quote }}
  {{- end }}
  storage:
    size: {{ .Values.cnpg.cluster.storage | default "5Gi" | quote }}
    {{- with .Values.cnpg.cluster.storageClassName }}
    storageClass: {{ . | quote }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ $database | quote }}
      owner: {{ .Values.cnpg.cluster.owner | default "newapi" | quote }}
      {{- with .Values.cnpg.cluster.postInitApplicationSQL }}
      postInitApplicationSQL:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- with .Values.cnpg.cluster.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- /*
DSN placeholder Secret — populated by templates/database-secret-sync-
job.yaml at runtime (a post-install/post-upgrade Helm hook that composes
the full DSN from CNPG's `<cluster>-app` password and PATCHes the
SQL_DSN key here).

#4278-followup (2026-06-25) — DSN-CLOBBER REGRESSION (the #1834 hole):
  Pre-fix this Secret was a PLAIN chart-managed resource rendering
  `SQL_DSN: ""` on EVERY render. The original #1834 comment assumed the
  sync-job's strategic-merge PATCH would survive across renders — it does
  NOT: helm-controller owns this Secret and re-applies the empty
  placeholder on every reconcile/upgrade, RESETTING SQL_DSN to "". The
  populated value only survives if the post-install/post-upgrade DSN-sync
  HOOK completes and re-patches it AFTER the render. When the upgrade
  hook chain fails or times out FOR ANY REASON (measured live: the
  admin-promote hook hitting `context deadline exceeded`, and a fresh
  install failing at the cluster-singleton CNPG mutating-webhook x509),
  the post-hook never runs → SQL_DSN is left EMPTY → the
  `wait-for-sql-dsn` initContainer polls the empty /dsn/SQL_DSN for its
  full budget → exit 1 → the data-plane Pod wedges in
  `Init:CrashLoopBackOff` even though CNPG is healthy and the `-app`
  password exists. Caught live on omantel.biz Orgs org-5d392c0b
  (fresh install failed at the CNPG webhook) and org-7283 (1.4.127
  upgrade hook context-deadline) — both with SQL_DSN reset to 0 bytes.

FIX (self-preserving placeholder, gitea database-secret.yaml precedent):
  1. `lookup` the existing Secret at render time. If it already carries a
     NON-EMPTY SQL_DSN, RE-EMIT that exact (base64) value instead of "" —
     so a value the sync-job populated once is NEVER clobbered by a later
     render, regardless of whether the post-upgrade hook re-runs.
  2. `helm.sh/resource-policy: keep` so the Secret is treated as
     independently managed (the sync-job owns its bytes) and is not
     deleted on uninstall.
  On a TRUE first install `lookup` returns nil → SQL_DSN renders "" → the
  `wait-for-sql-dsn` gate holds the Pod (no SQLite fallback) → the
  post-install sync-job patches the real DSN → the gate clears. On EVERY
  subsequent render the lookup preserves the populated value, so an
  unrelated hook failure can no longer empty the DSN and crash the Pod.

Empty data.SQL_DSN value (first install only) prevents
CreateContainerConfigError on first Pod schedule (kubelet only checks
that the named key EXISTS, not that it has non-empty content).
*/ -}}
{{- /* Preserve an already-populated SQL_DSN across re-renders. `lookup`
   is evaluated at install/upgrade render time; on a client-only
   dry-run/`helm template` it returns an empty value, so the placeholder
   path is taken — safe (the sync-job repopulates post-install). */ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $dsnSecretName) -}}
{{- $existingDsn := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "SQL_DSN") -}}
{{- $existingDsn = (get $existing.data "SQL_DSN") -}}
{{- end -}}
{{- if .Capabilities.APIVersions.Has "postgresql.cnpg.io/v1" }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dsnSecretName }}
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
  annotations:
    # Independently managed by the database-secret-sync Job after first
    # creation — keep on uninstall, and (paired with the lookup above)
    # never clobber the populated SQL_DSN on a later render.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # lookup-preserved populated DSN (already base64) > empty placeholder.
  SQL_DSN: {{ $existingDsn | quote }}
{{- end }}
