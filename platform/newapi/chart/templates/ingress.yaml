{{- /*
Ingress + admin Ingress + Traefik allowlist Middleware. Both virtual
hosts (`api.<sovereign-fqdn>` + `admin.<sovereign-fqdn>`) are
operator-supplied via `ingress.host` + `ingress.adminHost` in the
per-Sovereign bootstrap-kit overlay (slot 80-newapi.yaml).

Skip-render gate: when EITHER host is empty, the chart's ingress block
is silently skipped. This matches the pattern used by other bootstrap-
kit HTTPRoute templates (bp-keycloak / bp-openbao / bp-external-dns)
and lets the CI smoke render (`helm template` with default values)
succeed end-to-end without smuggling a host placeholder. A real
Sovereign install whose overlay forgets to set the hosts surfaces the
gap as "no Ingress object materialised" — caught by the bootstrap-kit
smoke test, not by render-time fail.
*/ -}}
{{- /* Wave 5.81 (#2412): adminHost dropped — ops-staff admin via Catalyst BSS console only. */ -}}
{{- if and (eq (include "bp-newapi.renderApp" .) "true") .Values.newapi.enabled .Values.ingress.enabled .Values.ingress.host }}
{{- $fullName := include "bp-newapi.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $apiHost := .Values.ingress.host -}}
{{- if .Values.ingress.middleware.enabled }}
---
# ─── Customer-facing API ingress (Traefik Middleware allowlist) ──────────
# Only rendered when running on a Traefik-Ingress cluster. Sovereigns use
# Cilium Gateway API and don't have the traefik.io/v1alpha1 Middleware
# CRD, so this entire resource is gated behind ingress.middleware.enabled
# (default false). Path allowlist enforcement on Cilium Gateway is owned
# by the HTTPRoute templates instead (see bp-self-sovereign-cutover for
# the canonical pattern).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-api-allowlist
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
spec:
  # Block any path not on customerAPIAllowedPaths. The regex is built
  # from the allowlist; a request that doesn't match returns 404.
  errors:
    status: ["404"]
    service:
      name: {{ $fullName }}
      port: {{ $svcPort }}
    query: "/notfound"
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-api
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $apiHost }}
      secretName: {{ .Values.ingress.tls.apiSecretName }}
  {{- end }}
  rules:
    - host: {{ $apiHost }}
      http:
        paths:
          {{- range .Values.ingress.customerAPIAllowedPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
# Wave 5.81 (#2412, founder 2026-05-24T13:11Z) — RIP the dead admin.<sov-fqdn>
# Ingress. Per founder ruling 2026-05-18 ("this url is rubbish, the back end
# of the marketplace must be just another menu under console like
# https://console.<sov>/bss") + platform/newapi/README.md backend-only
# ruling: Catalyst IS the customer surface; ops-staff admin functions
# live under console.<sov-fqdn>/bss/* (BSS menu), never on a separate
# admin.<sov-fqdn> hostname. Removing the second Ingress + the
# associated $adminHost template var + the configSchema requirement
# (bp-newapi blueprint.yaml + values.yaml in the same PR).
{{- end }}
