{{- /*
Deployment skip-render gate.

Pre-#943 the Deployment skipped silently unless the operator manually
provided three Secrets (database DSN, app credentials, optional OIDC
client secret) via per-Sovereign overlay. On a freshly franchised
Sovereign nothing populated those values — the chart emitted Service +
ConfigMap + NetworkPolicy but no Pod, so NewAPI never came up and
alice signup gate 5 (LLM) failed.

Issue #943 fix: chart auto-provisions BOTH the CNPG-backed Postgres
DSN Secret (templates/cnpg-cluster.yaml, gated on .Values.cnpg.enabled)
AND the SESSION_SECRET/CRYPTO_SECRET credentials Secret (templates/
credentials-secret.yaml, gated on .Values.credentials.autoProvision).
Defaults flip both to true so a Sovereign install with bp-newapi at
slot 80 lands a real Pod without operator intervention.

Effective DSN Secret name resolution:
  1. .Values.database.existingSecret (operator override) — if set, use
     it directly (the contabo path or a per-Sovereign external Postgres).
  2. else when .Values.cnpg.enabled the chart auto-emits its own DSN
     Secret named `<release>-newapi-db-dsn`.
  3. else the Deployment skip-renders (legacy path — preserved for
     environments where neither auto-provision nor a manual Secret is
     wired).

Same precedence for credentials: explicit existingSecret > auto-emitted
`<release>-app-creds` > skip-render.

Keycloak OIDC client secret is required only when
`auth.adminUI.mode=keycloak` AND `auth.adminUI.keycloak.issuer` is set;
the configmap mirrors this gate.
*/ -}}
{{- $kcMode := eq .Values.auth.adminUI.mode "keycloak" -}}
{{- $kcConfigured := and $kcMode .Values.auth.adminUI.keycloak.issuer .Values.auth.adminUI.keycloak.existingSecret -}}
{{- /* Resolve database secret: explicit override > chart-emitted CNPG DSN */ -}}
{{- $effDbSecret := .Values.database.existingSecret -}}
{{- $effDbKey := .Values.database.existingSecretKey | default "SQL_DSN" -}}
{{- if and (not $effDbSecret) .Values.cnpg.enabled -}}
{{- $effDbSecret = default (printf "%s-newapi-db-dsn" (include "bp-newapi.fullname" .)) .Values.cnpg.dsnSecretName -}}
{{- end -}}
{{- /* Resolve credentials secret: explicit override > bridge-synced (#5466) >
   chart auto-provision. Under bp-newapi.credsBridgeSynced (placement.role=all
   + keycloak mode + ssoBridgeSync + sovereign realm + ESO capability — see
   _helpers.tpl) SESSION_SECRET/CRYPTO_SECRET come from the bp-sso-bridge-
   published `-app-creds-oidc` Secret, whose values are derived ONCE per KC
   client into the OpenBao sso/sovereign/<cid> bundle and delivered
   identically to EVERY region — the chart-local `lookup`-or-randAlphaNum
   generator minted a DIFFERENT pair per region behind the one shared VIP
   (the hw291 `securecookie: the value is not valid` 401, A16 class #5480). */ -}}
{{- $effCredsSecret := .Values.credentials.existingSecret -}}
{{- if and (not $effCredsSecret) (eq (include "bp-newapi.credsBridgeSynced" .) "true") -}}
{{- $effCredsSecret = include "bp-newapi.credsBridgeSecretName" . -}}
{{- else if and (not $effCredsSecret) .Values.credentials.autoProvision -}}
{{- $effCredsSecret = default (printf "%s-app-creds" (include "bp-newapi.fullname" .)) .Values.credentials.autoSecretName -}}
{{- end -}}
{{- /* Resolve sandbox token signing key secret: explicit override > chart auto-provision */ -}}
{{- $effTokenSigningKeySecret := .Values.sandboxTokenSigningKey.existingSecret -}}
{{- if and (not $effTokenSigningKeySecret) .Values.sandboxTokenSigningKey.autoProvision -}}
{{- $effTokenSigningKeySecret = default (printf "%s-token-signing-key" (include "bp-newapi.fullname" .)) .Values.sandboxTokenSigningKey.autoSecretName -}}
{{- end -}}
{{- /* #3831: the app Deployment renders ONLY under placement.role all|vcluster-app
   (the seams + CNPG render host-side under host-seams). In vcluster-app the slot
   suppresses cnpg.enabled and wires database.existingSecret to the mirrored DSN
   Secret, so $effDbSecret still resolves non-empty above.

   #5599 COMPOSES with — never replaces — that gate and the DSN/credentials
   precedence chain resolved above. `bp-newapi.renderWorkloads` is
   `renderApp AND NOT crossRegion-secondary`, so:
     - crossRegion.enabled=false (default)      → identical to pre-1.4.151.
     - crossRegion secondary                    → NO Deployment, so the
       Services rendered by service.yaml have ZERO local backends and
       `service.cilium.io/affinity: local` falls through the ClusterMesh to the
       primary's singleton. That is the whole fix: an OAuth authorization code
       is single-use and stored server-side, so two Deployments over two
       independent Postgres clusters behind one VIP answered a VALID Keycloak
       code with 403 (#5599, measured live on hw292 in BOTH regions).
     - the $effDbSecret / $effCredsSecret / $kcConfigured conditions below are
       UNCHANGED and still decide the primary's render exactly as before. */ -}}
{{- $deployReady := and (eq (include "bp-newapi.renderWorkloads" .) "true") .Values.newapi.enabled $effDbSecret $effCredsSecret -}}
{{- if and $kcMode (not $kcConfigured) -}}
{{- $deployReady = false -}}
{{- end -}}
{{- if $deployReady }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bp-newapi.fullname" . }}
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.newapi.replicas }}
  selector:
    matchLabels:
      {{- include "bp-newapi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bp-newapi.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when channel/policy config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Wave 5.57c (#2303, 2026-05-24): roll the Pod whenever the
        # sandboxBridge image or port changes — without this, a chart
        # upgrade that ONLY changes the sidecar (image tag bump, port,
        # securityContext) leaves the running Pod untouched because the
        # checksum/config above only covers the configmap and the rest
        # of the Pod spec is "diff-equivalent" to Helm's eyes. Caught
        # live on hw01: chart 1.4.45 shipped the sandbox-bridge sidecar
        # but the bp-newapi Pod kept running the 2-container 1.4.44
        # spec (no bridge), so sandbox-controller's POST :8080 hit
        # nothing → context deadline exceeded.
        checksum/sandbox-bridge: {{ toYaml .Values.sandboxBridge | sha256sum }}
    spec:
      serviceAccountName: {{ include "bp-newapi.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      # Issue #952: NewAPI image (`newapi-mirror`) and the metering
      # sidecar both live in PRIVATE ghcr.io/openova-io/openova/*
      # repositories — kubelet must authenticate to pull. The canonical
      # `ghcr-pull` Secret is reflected into every namespace listed in
      # bp-reflector's annotations on flux-system/ghcr-pull (cloud-init
      # writes the source Secret with `reflection-auto-namespaces`
      # explicitly enumerating `newapi`). Without these references the
      # Pod stalls in ImagePullBackOff with a 403 Forbidden, blocking
      # alice signup gate 5 (LLM) on every fresh Sovereign.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.newapi.securityContext | nindent 8 }}
      {{- /*
        #3374 (2026-06-14) — SQL_DSN readiness gate. The chart-emitted
        DSN Secret renders SQL_DSN: "" as a placeholder; the
        database-secret-sync-job PATCHes the real Postgres DSN into it
        AFTER CNPG is ready (see cnpg-cluster.yaml). The original design
        assumed the app Pod would CrashLoop on the empty DSN and recover on
        the next kubelet restart once the DSN populated — but NewAPI does NOT
        crash on an empty SQL_DSN: it silently FALLS BACK TO SQLITE
        (`SQL_DSN not set, using SQLite as database`), a valid happy path, so
        the Pod stays Running on an EPHEMERAL SQLite DB forever, disconnected
        from the correctly-seeded Postgres (the live #3374 newapi gap on
        hw133: bare URL stuck at the /setup wizard because the SSO-seeded
        admin lives in PG, not the pod's SQLite). This initContainer blocks
        the main container from EVER booting until SQL_DSN is non-empty, so
        NewAPI always initialises against Postgres. Event-deterministic,
        fresh-prov-safe, zero-touch. Gated on cnpg.enabled (operators wiring
        an external DB via database.existingSecret populate it up-front, so
        the gate passes immediately). databaseDsnGate.enabled=false opts out.
      */}}
      {{- /* #3831: gate on cnpg.enabled OR an explicit database.existingSecret.
         Pre-#3831 the SQLite-fallback gate only fired for the chart-owned CNPG
         DSN; under placement.role=vcluster-app cnpg.enabled is false but the
         Pod still reads a (host-rendered, mirrored-in) DSN Secret whose SQL_DSN
         starts empty until the host db-dsn-sync Job PATCHes it — so the same
         silent-SQLite-fallback race applies. Firing the gate whenever
         $effDbSecret is set keeps NewAPI from booting on ephemeral SQLite in
         the vCluster too. */ -}}
      {{- $dsnGate := .Values.databaseDsnGate | default dict -}}
      {{- $dsnGateOn := and (default true $dsnGate.enabled) (or .Values.cnpg.enabled $effDbSecret) -}}
      {{- /*
        #3374 (2026-06-18) — sandbox-bridge as a NATIVE sidecar (initContainer
        with restartPolicy:Always), so the zero-click bare-URL landing page is
        reachable on the FIRST hit instead of throwing `upstream-connect-error
        ... delayed connect error: 111`.

        ROOT CAUSE (re-walked live hw159): the bridge sidecar serves the
        Exact `/` landing page, but as a PLAIN container it was gated TWICE
        behind NewAPI's ~2-min warm-up:
          (1) the `wait-for-sql-dsn` initContainer (below) runs to completion
              BEFORE any plain container — including the bridge — starts, so
              the bridge process was not even listening during the DSN-wait
              window; and
          (2) a Pod joins a Service's EndpointSlice only when ALL its
              containers are Ready (pod-readiness = AND of every container's
              readinessProbe). The `newapi` container's readinessProbe cannot
              pass until GORM AutoMigrate finishes, so the WHOLE Pod stayed
              NotReady → the Service had ZERO ready endpoints on EVERY port,
              including the bridge port → the gateway's Exact `/` backendRef
              had no healthy upstream → 111. The bridge process being up was
              irrelevant; its endpoint was suppressed.
        A native sidecar (KEP-753, GA k8s 1.29; Sovereigns run k3s v1.31.4)
        declared as the FIRST initContainer starts in init-order BEFORE the
        DSN gate and keeps running for the whole Pod lifetime, decoupling the
        landing page from NewAPI's migrate. Paired with a bridge-only Service
        carrying publishNotReadyAddresses:true (service.yaml) so the bridge
        endpoint publishes the instant it listens, even while `newapi` is
        NotReady. Together these eliminate the 1st-hit 111; the landing page
        then rides out NewAPI's /api/oauth/state warm-up via its own retry.
        Gated on sandboxBridge.nativeSidecar (default true); set false to fall
        back to the legacy plain-container bridge.
      */}}
      {{- /* default-true gate that respects an explicit `false` — the Helm
         `default true <bool>` idiom wrongly coerces an explicit false back to
         true because false is the bool zero-value, so test key presence +
         value directly (same idiom as the ssoInit gate). */ -}}
      {{- $sb := .Values.sandboxBridge | default dict -}}
      {{- $bridgeNativeOn := or (not (hasKey $sb "nativeSidecar")) $sb.nativeSidecar -}}
      {{- $bridgeNative := and .Values.sandboxBridge.enabled $bridgeNativeOn -}}
      {{- if or $bridgeNative $dsnGateOn }}
      initContainers:
        {{- if $bridgeNative }}
        # ── Sandbox-bridge NATIVE sidecar (#3374, 2026-06-18) ───────────
        # restartPolicy:Always promotes this initContainer to a native
        # sidecar: it starts FIRST (before wait-for-sql-dsn) and runs for the
        # whole Pod lifetime. This is the SAME image/env/port/securityContext
        # as the legacy plain-container bridge (kept identical so the only
        # behavioural change is WHEN it starts and HOW its endpoint publishes).
        - name: sandbox-bridge
          image: {{ include "bp-newapi.image" (dict "repo" .Values.sandboxBridge.image.repository "tag" .Values.sandboxBridge.image.tag "root" $) | quote }}
          imagePullPolicy: {{ .Values.sandboxBridge.image.pullPolicy }}
          restartPolicy: Always
          ports:
            - name: bridge
              containerPort: {{ .Values.sandboxBridge.port }}
              protocol: TCP
          env:
            {{- include "bp-newapi.sandboxBridgeEnv" . | nindent 12 }}
          # startupProbe gates "sidecar started" for the native-sidecar init
          # ordering (the next init step waits for this probe to pass). The
          # bridge binds :8080 in milliseconds, so this is near-instant.
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.sandboxBridge.port }}
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.sandboxBridge.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.sandboxBridge.port }}
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.sandboxBridge.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.sandboxBridge.securityContext | nindent 12 }}
        {{- end }}
        {{- if $dsnGateOn }}
        # Image defaults to the NewAPI image itself (same ghcr.io/openova-io/*
        # glob as the main container). kyverno harbor-proxy-pull uses an
        # anyPattern that requires ONE allowed glob to match BOTH the
        # initContainers AND the containers of a workload — a curl image
        # (proxy-dockerhub) mixed with the openova-io main image matches no
        # single glob and is DENIED (the bp-guacamole jdbc-seed lesson, #3461;
        # caught live on hw133 with bp-newapi 1.4.75). The NewAPI image has
        # /bin/sh, so it runs the trivial file-poll gate. Operators override via
        # databaseDsnGate.image with any image that also matches the glob +
        # carries the ghcr-pull secret.
        - name: wait-for-sql-dsn
          image: {{ $dsnGate.image | default (include "bp-newapi.image" (dict "repo" .Values.newapi.image.repository "tag" .Values.newapi.image.tag "root" $)) | quote }}
          imagePullPolicy: {{ .Values.newapi.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: DSN_GATE_TIMEOUT_SECONDS
              value: {{ $dsnGate.timeoutSeconds | default 300 | quote }}
            - name: DSN_GATE_INTERVAL_SECONDS
              value: {{ $dsnGate.intervalSeconds | default 5 | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # The DSN Secret is projected at /dsn/SQL_DSN. Wait until the
              # database-secret-sync-job has PATCHed a NON-EMPTY value (the
              # placeholder is ""). Kubernetes refreshes a mounted Secret in
              # place within ~60s of the PATCH, so this initContainer sees the
              # populated value without a Pod restart.
              echo "[dsn-gate] waiting for a non-empty SQL_DSN at /dsn/SQL_DSN (budget ${DSN_GATE_TIMEOUT_SECONDS}s)"
              deadline=$(( $(date +%s) + DSN_GATE_TIMEOUT_SECONDS ))
              while [ "$(date +%s)" -lt "${deadline}" ]; do
                if [ -s /dsn/SQL_DSN ]; then
                  echo "[dsn-gate] SQL_DSN populated — NewAPI will initialise against Postgres"
                  exit 0
                fi
                sleep "${DSN_GATE_INTERVAL_SECONDS}"
              done
              echo "[dsn-gate] FATAL: SQL_DSN still empty after ${DSN_GATE_TIMEOUT_SECONDS}s — the database-secret-sync-job did not populate it; refusing to boot on SQLite" >&2
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sql-dsn-gate
              mountPath: /dsn
              readOnly: true
        {{- end }}
      {{- end }}
      containers:
        - name: newapi
          image: {{ include "bp-newapi.image" (dict "repo" .Values.newapi.image.repository "tag" .Values.newapi.image.tag "root" $) | quote }}
          imagePullPolicy: {{ .Values.newapi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.newapi.port }}
              protocol: TCP
          env:
            # ── Database (Postgres on bp-cnpg) ────────────────────────
            # Secret name resolution (issue #943):
            #   1. .Values.database.existingSecret if set (operator override)
            #   2. else chart-emitted DSN Secret from cnpg-cluster.yaml
            #      (`<release>-newapi-db-dsn`) when .Values.cnpg.enabled
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $effDbSecret }}
                  key: {{ $effDbKey }}

            # ── Valkey cache ──────────────────────────────────────────
            {{- if .Values.valkey.enabled }}
            {{- if .Values.valkey.existingSecret }}
            - name: REDIS_CONN_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.valkey.existingSecret }}
                  key: {{ .Values.valkey.existingSecretKey }}
            {{- else }}
            - name: REDIS_CONN_STRING
              value: {{ .Values.valkey.url | quote }}
            {{- end }}
            {{- end }}

            # ── App credentials (NewAPI-internal) ─────────────────────
            # Secret name resolution (issue #943, #5466):
            #   1. .Values.credentials.existingSecret (operator override)
            #   2. else the bp-sso-bridge-published `-app-creds-oidc`
            #      Secret when bp-newapi.credsBridgeSynced (#5466) —
            #      SESSION_SECRET/CRYPTO_SECRET derived once per KC client
            #      in the OpenBao bundle, so BOTH regions of a 2-region
            #      Sovereign resolve ONE value and a session set behind
            #      either region validates on the other (A16, #5480)
            #   3. else chart-emitted credentials-secret.yaml output
            #      when .Values.credentials.autoProvision (DEFAULT true)
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $effCredsSecret }}
                  key: SESSION_SECRET
            - name: CRYPTO_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $effCredsSecret }}
                  key: CRYPTO_SECRET

            # ── OIDC (admin UI) ───────────────────────────────────────
            {{- if $kcConfigured }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.adminUI.keycloak.existingSecret }}
                  key: OIDC_CLIENT_SECRET
            {{- end }}

            # ── Bootstrap-only master key (DEV ONLY) ──────────────────
            {{- if .Values.auth.adminUI.masterKeySecret }}
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.adminUI.masterKeySecret }}
                  key: MASTER_KEY
            {{- end }}

          envFrom:
            - configMapRef:
                name: {{ include "bp-newapi.configMapName" . }}

          volumeMounts:
            - name: channels
              mountPath: /etc/newapi
              readOnly: true
            # TBD-A11 (#1765, 2026-05-18): emptyDir at /data so the
            # upstream Calcium-Ion/new-api binary can `mkdir /data/logs`
            # on startup. Pre-A11 the binary crashed with
            #   `mkdir /data/logs: permission denied`
            # because the container ran as uid 1000 against a root-
            # owned `/data` baked into the upstream image. fsGroup=1000
            # on the Pod securityContext (values.yaml) chowns this
            # emptyDir to gid 1000 on mount; the Pod's primary group
            # (uid 1000 by default has supplementary gid 1000) can
            # then write here. State is ephemeral (logs only —
            # sessions, credits, channels, audit log all live in
            # Postgres via SQL_DSN); restart loses logs and nothing
            # else.
            - name: data
              mountPath: /data

          # TBD-A12 (#1798, 2026-05-18): startupProbe gates liveness +
          # readiness until the NewAPI binary has finished GORM
          # AutoMigrate on the empty CNPG database (26 CREATE TABLE +
          # 2 column-type migrations, 60-120s on cpx21 with
          # sslmode=require). Pre-A12 liveness SIGKILLed the binary
          # mid-migration at the 50s mark — the empty `newapi` DB on
          # t22 chart 1.4.18 had zero tables after 29 restarts because
          # every kill happened before AutoMigrate finished its first
          # CREATE TABLE.
          {{- if .Values.newapi.probes.startup }}
          startupProbe:
            httpGet:
              path: {{ .Values.newapi.probes.startup.path }}
              port: {{ .Values.newapi.probes.startup.port }}
            initialDelaySeconds: {{ .Values.newapi.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.newapi.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.newapi.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.newapi.probes.startup.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.newapi.probes.liveness.path }}
              port: {{ .Values.newapi.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.newapi.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.newapi.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.newapi.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.newapi.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.newapi.probes.readiness.path }}
              port: {{ .Values.newapi.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.newapi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.newapi.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.newapi.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.newapi.probes.readiness.failureThreshold }}

          resources:
            {{- toYaml .Values.newapi.resources | nindent 12 }}

        {{- /*
        #3374 (2026-06-18) — the sandbox-bridge is now a NATIVE sidecar
        (initContainers, above) by default so the zero-click landing page is
        reachable on the 1st hit (it no longer waits behind the DSN gate +
        NewAPI's pod-readiness AND-gate → no more 111). The legacy plain
        sidecar below renders ONLY when sandboxBridge.nativeSidecar=false (an
        operator opt-out, e.g. for a k8s <1.29 cluster without native-sidecar
        support). Env is shared via the bp-newapi.sandboxBridgeEnv helper so
        both code paths stay byte-identical. */}}
        {{- /* legacy plain-container bridge renders ONLY when nativeSidecar is
           explicitly false (key present + value false). Mirrors $bridgeNative
           above; avoids the `default true <bool>` false-coercion trap. */ -}}
        {{- $sbC := .Values.sandboxBridge | default dict -}}
        {{- $bridgeLegacy := and .Values.sandboxBridge.enabled (hasKey $sbC "nativeSidecar") (not $sbC.nativeSidecar) -}}
        {{- if $bridgeLegacy }}
        # ── Sandbox-bridge sidecar (#2303, Wave 5.57; legacy plain container) ──
        # Catalyst-side bridge handler at POST /admin/tokens/sandbox.
        # The upstream Calcium-Ion binary doesn't ship this route, so
        # without this sidecar sandbox-controller's token-mint call
        # hits the binary's default 404 HTML page (the "decode
        # response: invalid character '<'" failure mode on hw01
        # 2026-05-24). The sidecar serves the same Secret-mounted
        # signing key + admin secret as the in-binary code path
        # would.
        - name: sandbox-bridge
          image: {{ include "bp-newapi.image" (dict "repo" .Values.sandboxBridge.image.repository "tag" .Values.sandboxBridge.image.tag "root" $) | quote }}
          imagePullPolicy: {{ .Values.sandboxBridge.image.pullPolicy }}
          ports:
            - name: bridge
              containerPort: {{ .Values.sandboxBridge.port }}
              protocol: TCP
          env:
            {{- include "bp-newapi.sandboxBridgeEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.sandboxBridge.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.sandboxBridge.port }}
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.sandboxBridge.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.sandboxBridge.securityContext | nindent 12 }}
        {{- end }}

        {{- if .Values.meteringSidecar.enabled }}
        # ── Metering sidecar (#798) ─────────────────────────────
        # Transparent reverse proxy in front of NewAPI. Observes
        # successful /v1/* responses, emits one envelope per
        # completed LLM request on NATS subject
        # `catalyst.usage.recorded`. NewAPI itself is unmodified —
        # see values.yaml `meteringSidecar` for the architecture
        # rationale.
        - name: metering-sidecar
          image: {{ include "bp-newapi.image" (dict "repo" .Values.meteringSidecar.image.repository "tag" .Values.meteringSidecar.image.tag "root" $) | quote }}
          imagePullPolicy: {{ .Values.meteringSidecar.image.pullPolicy }}
          ports:
            - name: metering
              containerPort: {{ .Values.meteringSidecar.port }}
              protocol: TCP
          env:
            - name: LISTEN_PORT
              value: {{ .Values.meteringSidecar.port | quote }}
            # NewAPI forwards on the same pod's loopback. NewAPI's
            # `newapi.port` is the upstream container port — use
            # 127.0.0.1 (NOT the Service DNS) so the sidecar's
            # response observation does not loop through the
            # cluster-fronting Service.
            - name: NEWAPI_UPSTREAM_URL
              value: "http://127.0.0.1:{{ .Values.newapi.port }}"
            - name: NATS_URL
              value: {{ .Values.meteringSidecar.natsURL | default "nats://nats-jetstream.nats-system.svc.cluster.local:4222" | quote }}
            - name: NATS_PUBLISH_TIMEOUT
              value: {{ .Values.meteringSidecar.natsPublishTimeout | quote }}
            - name: PRICE_MICRO_OMR_PER_TOKEN
              value: {{ .Values.meteringSidecar.priceMicroOMRPerToken | quote }}
            - name: SPOOL_DIR
              value: {{ .Values.meteringSidecar.spoolDir | quote }}
            - name: CUSTOMER_ID_HEADER
              value: {{ .Values.meteringSidecar.customerIDHeader | quote }}
            - name: TENANT_ID_HEADER
              value: {{ .Values.meteringSidecar.tenantIDHeader | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.meteringSidecar.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.meteringSidecar.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.meteringSidecar.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.meteringSidecar.securityContext | nindent 12 }}
          volumeMounts:
            - name: metering-spool
              mountPath: {{ .Values.meteringSidecar.spoolDir }}
        {{- end }}

      volumes:
        - name: channels
          configMap:
            name: {{ include "bp-newapi.configMapName" . }}
            items:
              - key: channels.yaml
                path: channels.yaml
        # TBD-A11 (#1765): writable /data for upstream binary's
        # log directory. Paired with fsGroup: 1000 on the Pod
        # securityContext (values.yaml). emptyDir, not PVC — NewAPI's
        # durable state (users, credits, channels, audit log) lives in
        # Postgres via SQL_DSN; only ephemeral logs land on disk.
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        {{- if .Values.meteringSidecar.enabled }}
        # emptyDir is intentional: the sidecar's drain loop
        # republishes spooled envelopes once NATS recovers, so
        # persistence across pod restarts is unnecessary.
        - name: metering-spool
          emptyDir:
            sizeLimit: 64Mi
        {{- end }}
        {{- /* #3374: DSN Secret projected for the wait-for-sql-dsn initContainer.
           #3948: the volume MUST render under the SAME `$dsnGateOn` condition as
           the wait-for-sql-dsn initContainer (defined above) — not `cnpg.enabled`
           alone. Under placement.role=vcluster-app cnpg.enabled is false but
           `database.existingSecret` is set (the mirrored DSN), so `$dsnGateOn`
           is true and the initContainer renders WITH its `sql-dsn-gate`
           volumeMount; the old `cnpg.enabled`-only gate dropped the volume →
           `initContainers[1].volumeMounts[0].name: Not found: "sql-dsn-gate"`
           install failure (hw172 bp-newapi HR). `$effDbSecret` is in scope here. */ -}}
        {{- if $dsnGateOn }}
        - name: sql-dsn-gate
          secret:
            secretName: {{ $effDbSecret }}
            items:
              - key: {{ $effDbKey }}
                path: SQL_DSN
        {{- end }}
{{- end }}
