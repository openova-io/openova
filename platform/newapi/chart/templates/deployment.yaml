{{- /*
Deployment skip-render gate. The Deployment binds three operator-supplied
Secrets (database DSN, app credentials, optional OIDC client secret); if
any are missing on a default-values render (CI smoke test), the
Deployment is silently skipped. The Service / ServiceAccount / ConfigMap
/ NetworkPolicy still render so `helm template` produces a non-empty
output that proves the chart is structurally sound, while the actual
Pod-rendering deferred until the per-Sovereign overlay sets
`database.existingSecret` and `credentials.existingSecret`.

Keycloak OIDC client secret is required only when
`auth.adminUI.mode=keycloak` AND `auth.adminUI.keycloak.issuer` is set;
the configmap mirrors this gate.
*/ -}}
{{- $kcMode := eq .Values.auth.adminUI.mode "keycloak" -}}
{{- $kcConfigured := and $kcMode .Values.auth.adminUI.keycloak.issuer .Values.auth.adminUI.keycloak.existingSecret -}}
{{- $deployReady := and .Values.newapi.enabled .Values.database.existingSecret .Values.credentials.existingSecret -}}
{{- if and $kcMode (not $kcConfigured) -}}
{{- $deployReady = false -}}
{{- end -}}
{{- if $deployReady }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bp-newapi.fullname" . }}
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.newapi.replicas }}
  selector:
    matchLabels:
      {{- include "bp-newapi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bp-newapi.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when channel/policy config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "bp-newapi.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.newapi.securityContext | nindent 8 }}
      containers:
        - name: newapi
          image: "{{ .Values.newapi.image.repository }}:{{ .Values.newapi.image.tag }}"
          imagePullPolicy: {{ .Values.newapi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.newapi.port }}
              protocol: TCP
          env:
            # ── Database (Postgres on bp-cnpg) ────────────────────────
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}

            # ── Valkey cache ──────────────────────────────────────────
            {{- if .Values.valkey.enabled }}
            {{- if .Values.valkey.existingSecret }}
            - name: REDIS_CONN_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.valkey.existingSecret }}
                  key: {{ .Values.valkey.existingSecretKey }}
            {{- else }}
            - name: REDIS_CONN_STRING
              value: {{ .Values.valkey.url | quote }}
            {{- end }}
            {{- end }}

            # ── App credentials (NewAPI-internal) ─────────────────────
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: SESSION_SECRET
            - name: CRYPTO_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: CRYPTO_SECRET

            # ── OIDC (admin UI) ───────────────────────────────────────
            {{- if $kcConfigured }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.adminUI.keycloak.existingSecret }}
                  key: OIDC_CLIENT_SECRET
            {{- end }}

            # ── Bootstrap-only master key (DEV ONLY) ──────────────────
            {{- if .Values.auth.adminUI.masterKeySecret }}
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.adminUI.masterKeySecret }}
                  key: MASTER_KEY
            {{- end }}

          envFrom:
            - configMapRef:
                name: {{ include "bp-newapi.configMapName" . }}

          volumeMounts:
            - name: channels
              mountPath: /etc/newapi
              readOnly: true

          livenessProbe:
            httpGet:
              path: {{ .Values.newapi.probes.liveness.path }}
              port: {{ .Values.newapi.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.newapi.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.newapi.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.newapi.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.newapi.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.newapi.probes.readiness.path }}
              port: {{ .Values.newapi.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.newapi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.newapi.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.newapi.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.newapi.probes.readiness.failureThreshold }}

          resources:
            {{- toYaml .Values.newapi.resources | nindent 12 }}

      volumes:
        - name: channels
          configMap:
            name: {{ include "bp-newapi.configMapName" . }}
            items:
              - key: channels.yaml
                path: channels.yaml
{{- end }}
