{{- /*
Cilium Gateway HTTPRoute for `newapi.<sovereign-fqdn>` (TBD-D35d, issue
#1778).

Sandbox runtimes hit the LLM gateway at the URL the sandbox controller
mints into their environment:

  NEWAPI_BASE_URL=https://newapi.<sovereign-fqdn>/v1

On a Sovereign with the Catalyst marketplace enabled, the catalyst chart
ships a `tenant-wildcard` HTTPRoute (hostnames=`*.<fqdn>`) that backend-
refs to the `console` Service in the `org-services` namespace. Without a dedicated
HTTPRoute for `newapi.<fqdn>`, every Sandbox request to the LLM gateway
got absorbed by the wildcard and 502'd at the storefront — blocking the
entire BYOS Claude Code journey (D35d).

Gateway API hostname-matching prefers the most specific listener: an
exact `newapi.<fqdn>` HTTPRoute wins over `*.<fqdn>`, so this template
restores newapi's public reachability without modifying the marketplace
wildcard.

Same skip-render gate pattern as ingress.yaml: when the HTTPRoute is not
enabled OR no hostname can be derived, the template emits nothing — the
`helm template` smoke render still passes with default values, and a
Sovereign overlay forgetting to set the host surfaces as "no HTTPRoute
materialised" (caught by the bootstrap-kit smoke test).

Per docs/INVIOLABLE-PRINCIPLES.md #4 every operationally-meaningful
value (hostname, parentRef name/namespace/sectionName, backend port) is
operator-overridable via values.yaml.
*/ -}}
{{- if and (eq (include "bp-newapi.renderApp" .) "true") .Values.newapi.enabled .Values.ingress.httpRoute .Values.ingress.httpRoute.enabled -}}
{{- $host := .Values.ingress.httpRoute.host -}}
{{- if and (not $host) .Values.sovereignFQDN -}}
{{- $host = printf "newapi.%s" .Values.sovereignFQDN -}}
{{- end -}}
{{- if $host -}}
{{- $parent := .Values.ingress.httpRoute.parentRef | default dict -}}
{{- $parentName := default "cilium-gateway" $parent.name -}}
{{- $parentNs := default "kube-system" $parent.namespace -}}
{{- /*
sectionName intentionally omitted when empty/unset — pinning to "https"
broke multi-zone Sovereigns whose Cilium Gateway renames HTTPS listeners
to https-<sanitised-zone> (PR #1888 / TBD-A40 / issue #1902). Gateway API
hostname-matching attaches the route to the right listener anyway.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bp-newapi.fullname" . }}-public
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
    catalyst.openova.io/component: newapi-public-route
spec:
  parentRefs:
    - name: {{ $parentName | quote }}
      namespace: {{ $parentNs | quote }}
      {{- with $parent.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    - {{ $host | quote }}
  rules:
{{- /*
#3374 (2026-06-14) — zero-click bare-URL SSO. NewAPI's embedded React SPA
(consumed as a pinned mirror, not a fork) serves a marketing/login homepage at
`/` and only fires the OIDC flow on a "Sign in with <provider>" CLICK, which
breaks the zero-click contract. oauth2-proxy is the WRONG tool (NewAPI auths
only via its own session cookie + ignores proxy headers — middleware/auth.go),
and a static gateway 302 to Keycloak fails NewAPI's callback CSRF check (the
`state` must first be minted by GET /api/oauth/state, which sets the session
cookie). So the sandbox-bridge sidecar serves a SAME-ORIGIN init page at the
bare root that runs NewAPI's own onCustomOAuthClicked sequence (state → status
→ authorize redirect carrying kc_idp_hint=catalyst-pin). An `Exact /` match
wins over the `PathPrefix /` rule below (Gateway API prefers the most specific
match), so ONLY the bare root is intercepted; the SPA, /assets, /api and the
/oauth/<slug> callback all keep flowing to NewAPI. The full OIDC round-trip
lands the owner signed-in (verified live on hw136). Gated + overrideable.
*/}}
{{- /* default-true gate that respects an explicit `false` (the Helm `default
   true <bool>` idiom wrongly coerces an explicit false back to true because
   false is the bool zero-value, so test the key presence + value directly). */ -}}
{{- $ssoInit := .Values.ssoInit | default dict -}}
{{- $ssoInitOn := or (not (hasKey $ssoInit "enabled")) $ssoInit.enabled -}}
{{- if and $ssoInitOn .Values.sandboxBridge.enabled }}
    - matches:
        - path:
            type: Exact
            value: "/"
      backendRefs:
        {{- /* #3374 (2026-06-18) — route the bare URL to the dedicated
        bridge-only Service (<fullname>-bridge, publishNotReadyAddresses:true)
        so the zero-click landing page is reachable on the 1st hit even while
        the `newapi` container is NotReady during GORM AutoMigrate (no more
        111). gateway.bridgeBackendService overrides the name when this chart
        installs inside a vCluster (the syncer mangles it to
        <svc>-x-<ns>-x-<vcluster>); empty default = chart-computed
        <fullname>-bridge. */}}
        - name: {{ .Values.gateway.bridgeBackendService | default (printf "%s-bridge" (include "bp-newapi.fullname" .)) }}
          port: {{ .Values.sandboxBridge.port }}
{{- /*
#5612 (2026-08-05) — the inert "Continue with OpenOva SSO" RECOVERY button.
When newapi's session lapses (facet 1 of #5612 — the sub-hour TTL, addressed
separately), the embedded SPA client-routes to `/login?expired=true` and
offers a "Continue with OpenOva SSO" button. Live evidence on hw292: the
click does NOTHING (no navigation, no /api/oauth/state call, no network
request) — the SAME class of runtime-discovery gap already documented above
for the bare root (NewAPI v0.13.2 gives the SPA's click handler no
custom_oauth_providers data to act on). The SPA is a pinned mirror, not a
fork, so the button's JS cannot be patched here.

Route an Exact `/login` match to the SAME bridge that already serves the
bare-root zero-click page (sso_init.go's SSOInitHandler answers both paths
identically — self-check /api/user/self → /api/oauth/state → Keycloak
authorize redirect). Any FULL navigation to the expired-session page (a
reload, a bookmark, the User retyping the URL) now recovers deterministically
instead of dead-ending on the broken button.

Gated on `.Values.sovereignFQDN` — the SAME signal that decides whether
`bp-newapi.sandboxBridgeEnv` (_helpers.tpl) populates NEWAPI_SSO_AUTHORIZE_URL
/ NEWAPI_SSO_CLIENT_ID. Without it the bridge's config is empty and its own
fallback() redirects to /login — routing /login to a page whose only escape
hatch IS /login would be a redirect loop, so an unconfigured overlay leaves
`/login` flowing to NewAPI's stock SPA login page instead (PathPrefix `/`
below), exactly as before this change.
*/}}
{{- if .Values.sovereignFQDN }}
    - matches:
        - path:
            type: Exact
            value: "/login"
      backendRefs:
        - name: {{ .Values.gateway.bridgeBackendService | default (printf "%s-bridge" (include "bp-newapi.fullname" .)) }}
          port: {{ .Values.sandboxBridge.port }}
{{- end }}
{{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        {{- /* #3373 fix (a): when this chart installs inside a vCluster the
        slot overrides gateway.backendService with the host-side syncer-
        mangled Service name (<svc>-x-<ns>-x-<vcluster>); empty default =
        chart-computed name, default render byte-identical. */}}
        - name: {{ .Values.gateway.backendService | default (include "bp-newapi.fullname" .) }}
          port: {{ .Values.service.port }}
{{- end }}
{{- end }}
