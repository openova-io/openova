{{- /*
#3374 (2026-06-13) — converge the newapi OIDC client-secret with
Keycloak.

bp-sso-bridge (fed by the companion sso-app-registration.yaml)
publishes the LIVE KC-stored client_secret to OpenBao at
`sso/sovereign/<clientId>`. This ExternalSecret MERGES it into the
SAME Secret the Deployment already reads
(auth.adminUI.keycloak.existingSecret, key OIDC_CLIENT_SECRET).

creationPolicy: Merge — NOT Owner — by design:
  - keycloak-client-secret.yaml's lookup-or-generate placeholder keeps
    rendering so the Pod clears CreateContainerConfigError on a cold
    bootstrap BEFORE sso-bridge has published (the t20 Fix #6 race);
  - once the bundle lands, Merge overwrites OIDC_CLIENT_SECRET with the
    KC truth, and the placeholder's lookup re-emits those same bytes on
    every subsequent helm reconcile — convergent, no ownership fight.
*/ -}}
{{- $kcMode := eq .Values.auth.adminUI.mode "keycloak" -}}
{{- $sync := .Values.auth.adminUI.keycloak.ssoBridgeSync -}}
{{- $secretName := .Values.auth.adminUI.keycloak.existingSecret -}}
{{- if and .Values.newapi.enabled $kcMode $sync.enabled $secretName (.Capabilities.APIVersions.Has "external-secrets.io/v1beta1") }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "bp-newapi.fullname" . }}-oidc-sync
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
    bp-sso-bridge.openova.io/consumer: bp-newapi
spec:
  refreshInterval: {{ $sync.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $sync.externalSecretStoreName | default "vault-region1" }}
    kind: ClusterSecretStore
  target:
    name: {{ $secretName }}
    creationPolicy: Merge
    template:
      type: Opaque
      mergePolicy: Merge
      data:
        OIDC_CLIENT_SECRET: "{{ "{{ .client_secret }}" }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: sso/sovereign/{{ .Values.auth.adminUI.keycloak.clientId }}
        property: client_secret
{{- end }}
