{{- /*
ExternalSecret — `catalyst-newapi-admin-token`.

Bound to ADR-0003 §3.2 + §6: the unified-rbac service in the OTECH
control plane reads this Secret's `ADMIN_API_TOKEN` key and uses it as
`Authorization: Bearer <token>` against
`http://newapi.newapi.svc/api/v1/admin/users` to issue per-user keys
during the Organization user-create flow. The Secret therefore MUST exist on the
OTECH control plane before unified-rbac begins reconciliation.

Sourced from the Sovereign's OpenBao via a ClusterSecretStore (Catalyst
default = `vault-region1`, shipped by bp-external-secrets-stores). The
remote OpenBao path is WRITTEN by catalyst-api's seedNewapiAdminToken seam
(#4477) at the canonical, cluster-shared path `catalyst/newapi/admin-token`
(under the store's `secret/` mount) with property `ADMIN_API_TOKEN`. The
`catalyst/` prefix is the only sub-tree a Sovereign's catalyst-api can
write (`catalyst-api-write` role scoped to `secret/{data,metadata}/
catalyst/*`), so the producer + this read-path share the prefix in
lock-step. The seam propagates NewAPI's bridge ADMIN_SECRET verbatim so
the distributed token MATCHES what the sandbox-bridge validates.

Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every knob
(refreshInterval, secretStoreRef.kind/name, remoteRef.key,
remoteRef.property, target.name) is operator-tunable; the cluster
overlay at `clusters/<sovereign>/bootstrap-kit/80-newapi.yaml` sets
the per-Sovereign values without rebuilding the OCI artifact.

Capabilities gate: the chart MUST NOT render an ExternalSecret on a
Sovereign where bp-external-secrets has not yet registered the
`external-secrets.io/v1beta1` CRD. Without the gate, a cold install
fails with "no matches for kind ExternalSecret" — the same architectural
pattern the bp-external-dns chart uses (issue #190).
*/ -}}
{{- $ci := .Values.catalystIntegration | default dict -}}
{{- $es := $ci.externalSecret | default dict -}}
{{- if and (eq (include "bp-newapi.renderSeams" .) "true") $ci.enabled $es.enabled (.Capabilities.APIVersions.Has "external-secrets.io/v1beta1") -}}
{{- $store := $es.secretStoreRef | default dict -}}
{{- $remote := $es.remoteRef | default dict -}}
{{- $secretName := $ci.existingSecret | default "catalyst-newapi-admin-token" -}}
{{- $remoteKey := $remote.key | default "" -}}
{{- if not $remoteKey -}}
{{- fail "catalystIntegration.externalSecret.enabled=true but catalystIntegration.externalSecret.remoteRef.key is empty — supply the OpenBao path in the bootstrap-kit overlay (canonical, cluster-shared: catalyst/newapi/admin-token — the path catalyst-api's seedNewapiAdminToken seam writes, #4477)" -}}
{{- end -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $secretName | quote }}
  labels:
    {{- include "bp-newapi.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    kind: {{ $store.kind | default "ClusterSecretStore" | quote }}
    name: {{ $store.name | default "vault-region1" | quote }}
  target:
    name: {{ $secretName | quote }}
    creationPolicy: Owner
    # Reflector mirror into `catalyst-system` (TBD-V15 / #2021, sister
    # of TBD-V14 / #2017): the catalyst-api Pod (in catalyst-system)
    # consumes ADMIN_API_TOKEN via secretKeyRef on
    # `catalyst-newapi-admin-token` to drive the ADR-0003 §3.2
    # user-create hook. Kubernetes secretKeyRef is same-namespace-only,
    # so emberstack/reflector is the canonical cross-namespace seam
    # (same pattern as org-services-secrets, catalyst-gitea-token, cnpg-cluster
    # secrets — see products/catalyst/chart/templates/org-services/
    # org-services-secrets.yaml for the canonical comment block).
    #
    # The target Secret carries `reflection-allowed=true` +
    # `reflection-auto-enabled=true` so the destination Secret is
    # materialised in catalyst-system on first reconcile and kept in
    # sync on source rotation (the ExternalSecret refreshInterval
    # rotates the source from OpenBao; reflector rotates the mirror
    # from the source).
    #
    # allowed-namespaces is scoped to `catalyst-system` only — the
    # bytes never leak to any unrelated namespace. Operator overlays
    # MAY widen this list via .Values.catalystIntegration.
    # reflectorNamespaces but defaults to the catalyst-system seam
    # used by every Sovereign install.
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: {{ $ci.reflectorNamespaces | default "catalyst-system" | quote }}
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: {{ $ci.reflectorNamespaces | default "catalyst-system" | quote }}
  data:
    - secretKey: ADMIN_API_TOKEN
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: {{ $remote.property | default "ADMIN_API_TOKEN" | quote }}
{{- end }}
