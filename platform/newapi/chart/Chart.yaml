# 1.4.0 (issue #943, 2026-05-05): auto-provision CNPG-backed Postgres +
# in-chart credentials Secret so a Sovereign install at bootstrap-kit
# slot 80 lands a real Pod without operator intervention.
#
# Pre-#943 the deployment.yaml gate REQUIRED operator-supplied
# `database.existingSecret` AND `credentials.existingSecret` — the Pod
# silently skipped render whenever either was empty. On a freshly
# franchised Sovereign nothing populated those values, so NewAPI never
# came up and alice signup gate 5 (LLM) timed out waiting for the
# customer-facing /v1/* API to respond.
#
# Fix:
#   - NEW templates/cnpg-cluster.yaml — when .Values.cnpg.enabled
#     (DEFAULT true), renders postgresql.cnpg.io/v1.Cluster
#     `<release>-newapi-pg` + a Helm-`lookup`-persistent DSN Secret
#     `<release>-newapi-db-dsn` (key: SQL_DSN) read by the deployment.
#     Capabilities-gated on postgresql.cnpg.io/v1 so a cold install
#     before bp-cnpg is Ready surfaces as "no Cluster yet" rather
#     than a hard install error (mirrors platform/powerdns/chart/
#     templates/cnpg-cluster.yaml's pattern).
#   - NEW templates/credentials-secret.yaml — when
#     .Values.credentials.autoProvision (DEFAULT true) AND
#     .Values.credentials.existingSecret is empty, renders
#     `<release>-app-creds` carrying SESSION_SECRET + CRYPTO_SECRET
#     (each 64-char randAlphaNum, persistent across reconciles via
#     Helm `lookup`). helm.sh/resource-policy: keep so a re-install
#     recovers the same bytes (otherwise an upgrade silently rotates
#     the keys, invalidating every active session cookie + every
#     encrypted token).
#   - deployment.yaml — Secret name resolution now picks the chart-
#     emitted defaults when the operator hasn't supplied an override.
#     The Pod-render gate accepts EITHER an explicit existingSecret
#     OR the auto-provisioned one.
#   - values.yaml — adds .Values.cnpg.* and .Values.credentials.
#     {autoProvision,autoSecretName} blocks; every knob is operator-
#     overridable per Inviolable Principle #4.
#
# 1.3.0: defaultChannels.qwenPartner (channel #1 = a partner-hosted
# Qwen3-family model at an operator-supplied endpoint) + post-install/
# post-upgrade `channel-seed` Helm hook Job that idempotently POSTs
# default channels into NewAPI's admin API at /api/channel/. Bridges
# the previous documentation-only channels.yaml ConfigMap → the actual
# Postgres-backed channel rows the upstream binary reads at runtime.
# Issue #915 (epic SME tenant integration DoD: alice → OpenClaw →
# NewAPI → partner-hosted Qwen end-to-end).
# 1.2.0: Traefik Middleware gated behind ingress.middleware.enabled.
# 1.4.6 (Fix #163, 2026-05-11, MIRROR-EVERYTHING): 000-external-secrets-
# webhook-readiness-job hook image switched from curlimages/curl:8.10.1
# to harbor.openova.io/proxy-dockerhub/curlimages/curl:8.10.1 per
# CLAUDE.md inviolable rule.
#
# 1.4.10 (fix-convergence-wave11, 2026-05-18): gate the
# defaultChannels.qwenPartner entry on attestation-complete instead
# of hard-failing the helm template when commercial-contract attestation
# fields are empty. PR #1631 added envsubst placeholders
# `${LLM_PARTNER_ACCOUNT_ID:-}` / `${LLM_PARTNER_CONTRACT_REF:-}`
# in the bootstrap-kit overlay so franchised Sovereigns can opt in to
# marketplace without supplying real attestation; but the chart's
# `assertChannelAttestation` helper still raised `commercial-contract
# attestation requires accountId` and the install crashed on every
# Sovereign that flipped `MARKETPLACE_ENABLED=true` without a signed
# commercial contract. Fix: in `bp-newapi.effectiveChannels` (and the
# matching `channel-seed-job.yaml` gate), SKIP composing the
# qwenPartner channel when attestation.kind=commercial-contract AND
# either accountId or contractRef is empty. NewAPI installs with zero
# default channels; operator-supplied channels still compose. Once
# the operator overlay supplies the attestation values the channel
# composes on the next reconcile. helm template renders cleanly with
# BOTH the missing-attestation state (no channel) AND the
# fully-populated state (channel composed normally).
# 1.4.23 (Fix #1902, TBD-A40, 2026-05-19): omit HTTPRoute parentRef
# sectionName by default — multi-zone Sovereigns rename HTTPS listeners
# to https-<sanitised-zone>, breaking NoMatchingListener with the prior
# `default "https"` fallback in templates/httproute.yaml. The template
# now uses `{{- with $parent.sectionName }}` to drop the field entirely
# when blank, and values.yaml defaults sectionName to "". Matches the
# catalyst-system fix in PR #1888.
# 1.4.25 (Fix #1901, TBD-A39, 2026-05-19): replace bp-cnpg
# NetworkPolicy egress (namespaceLabel: cnpg-system) with a
# podSelector matching cnpg.io/cluster=<release>-bp-newapi-newapi-pg
# in templates/networkpolicy.yaml gated on `.Values.cnpg.enabled`.
# The CNPG operator runs in cnpg-system but the actual Postgres
# workload Pods reconcile into `.Release.Namespace` (this
# blueprint's NS); the prior rule could never reach them and the
# newapi container looped 1/2 Ready with DB-connect timeouts on
# fresh prov.
# 1.4.31 (TBD-V21 #2032, 2026-05-20): extend
# `sandboxTokenSigningKey.reflectorNamespaces` default from
# `catalyst-system,sandbox` to
# `catalyst-system,sandbox,sandbox-.*` so emberstack/reflector mirrors
# the `newapi-bp-newapi-token-signing-key` Secret into every per-Sandbox
# namespace (`sandbox-<owner-uid>`). The per-Sandbox MCP Deployment
# template (core/controllers/sandbox/internal/gitops/manifests.go) mounts
# `SIGNING_KEY` as env `SANDBOX_JWT_SECRET` with `optional: true`;
# without the regex pattern the mount silently no-ops and the MCP
# plugin's auth gate degrades to test-mode (registry.go:71) — every
# bearer claim passes unvalidated. Empberstack's
# `reflection-{allowed,auto}-namespaces` annotation supports regex
# entries per comma-separated value (kubernetes-reflector#162).
#
# 1.4.29 (TBD-A52 #1944, 2026-05-19): point the default Valkey URL at
# `valkey-primary.valkey.svc.cluster.local` instead of the non-existent
# `valkey.valkey.svc.cluster.local`. The bp-valkey blueprint installs
# the upstream bitnami chart with architecture=replication, which
# renders Services named `<release>-primary` / `<release>-replicas` /
# `<release>-headless` — there is NO plain `valkey` Service. The old
# default resolved to NXDOMAIN and the NewAPI pod looped CrashLoopBackOff
# on the Redis ping probe (t34: 31 restarts with
# `lookup valkey.valkey.svc.cluster.local: no such host`). Same hostname
# already documented as canonical in products/catalyst/chart/values.yaml
# bp-cnpg-pair comments.
# 1.4.65 (#3374, 2026-06-13): un-dead the public gateway path. The K8s
# NetworkPolicy admits only traefik/catalyst-system NAMESPACES, but Cilium
# Gateway traffic carries the reserved `ingress` ENTITY identity that no K8s
# selector can express -> every external hit to newapi.<fqdn> connection-
# timed-out (measured live on hw130 2026-06-13, "upstream connect error").
# New additive CiliumNetworkPolicy (fromEntities: [ingress], Capabilities-
# guarded per the #2988/#3102 idiom) admits the gateway; gated on
# networkPolicy.ingress.allowGatewayEntity (default true).
# ALSO #3374: real OIDC for the ops-staff admin UI. The slot pointed
# OIDC_ISSUER at the non-existent `ops` realm and the `newapi-oidc` Secret
# was a chart-local placeholder Keycloak never learned (the hubble-ui
# disease). New auth.adminUI.keycloak.ssoBridgeSync (default true):
# AppRegistration ConfigMap mints `newapi-admin` in the SOVEREIGN realm via
# bp-sso-bridge + an ExternalSecret (creationPolicy Merge) converges
# OIDC_CLIENT_SECRET to the live KC value; companion slot fix points the
# issuer at realms/sovereign.
# 1.4.69 (#3374 admin-tier, 2026-06-14): stamp `app.kubernetes.io/managed-by:
# flux` on ALL FOUR hook Jobs — the pre-upgrade `newapi-eswebhook-gate`
# (000-external-secrets-webhook-readiness-job) PLUS the post-upgrade
# admin-sso-seed / channel-seed / db-dsn-sync Jobs. On hw133 the 1.4.68
# upgrade FAILED the pre-upgrade hook (kyverno `flux-managed` Enforce denies a
# Job without managed-by=flux — helm-controller hook Jobs carry no HR
# ownerReference) and the HR rolled back to 1.4.66, so the SSO admin seed
# never reached the cluster (NewAPI stuck at /setup, uninitialized). All four
# Jobs are stamped so the upgrade doesn't merely stall at the NEXT hook. Same
# class as openbao #3434 + gitea/harbor #3296→#3297. Lockstep: 80-newapi.yaml
# pin → 1.4.69.
# 1.4.71 (#3374 admin-tier, 2026-06-14): stamp managed-by:flux on the
# admin-promote CronJob + its jobTemplate too. Once 1.4.69's 4-Job fix let the
# upgrade get PAST flux-managed, the upgrade reached the admin-promote CronJob
# which (a) also lacked managed-by:flux and (b) tripped the resource-requests
# Enforce autogen bug (fixed in lockstep, bp-kyverno-policies 1.0.34). Stamping
# the CronJob closes (a); the policy fix closes (b). Lockstep: 80-newapi.yaml
# pin → 1.4.71.
# 1.4.73 (#3374 admin-tier, 2026-06-14): fix the DUPLICATE-KEY post-render
# failure 1.4.71/1.4.72 introduced. Appending `app.kubernetes.io/managed-by:
# flux` AFTER `{{ include "bp-newapi.labels" . }}` (which already emits
# managed-by=Helm) yielded TWO managed-by keys in one map. `helm template`
# renders it last-wins, but bp-newapi's strict-YAML post-render rejected it:
#   error while running post render ... mapping key
#   "app.kubernetes.io/managed-by" already defined
# → the whole upgrade FAILED on hw133. New `bp-newapi.hookLabels` helper emits
# the full label set with managed-by=flux as a SINGLE key; the 4 hook Jobs +
# the admin-promote CronJob + its jobTemplate use it instead of the
# labels+duplicate pattern. Lockstep: 80-newapi.yaml pin → 1.4.73.
# 1.4.75 (#3374 admin-tier, 2026-06-14): add the wait-for-sql-dsn initContainer
# (databaseDsnGate). Live on hw133 the app booted on the placeholder EMPTY
# SQL_DSN, silently fell back to an ephemeral SQLite DB, and never reconnected
# to the correctly-seeded Postgres — so the bare URL stayed at the /setup
# wizard (the SSO-seeded admin lives in PG, not the pod's SQLite). The original
# design assumed an empty DSN would CrashLoop the pod until the
# database-secret-sync-job PATCHed the real DSN, but NewAPI treats empty-DSN →
# SQLite as a valid happy path, so the pod never restarts. The initContainer
# blocks the main container until SQL_DSN is non-empty → NewAPI always
# initialises against Postgres. Gated on cnpg.enabled. Lockstep: 80-newapi.yaml
# pin → 1.4.75.
# 1.4.77 (#3374 admin-tier, 2026-06-14): fix the kyverno denial 1.4.75's
# DSN-gate introduced. The wait-for-sql-dsn initContainer used a
# proxy-dockerhub/curl image while the main container is ghcr.io/openova-io/*;
# the harbor-proxy-pull anyPattern needs ONE glob to match BOTH init + main, so
# the mixed registries were DENIED (`/spec/template/spec/containers/0/image/` +
# `initContainers/0/image/`) → bp-newapi 1.4.75 stuck Ready=False on hw133 (same
# class as bp-guacamole #3461). Default the gate image to the NewAPI image
# itself (has /bin/sh; same openova-io glob as the main container). Lockstep:
# 80-newapi.yaml pin → 1.4.77.
# 1.4.81 (#3482 / Refs #3373 Batch A, 2026-06-14): rewire newapi→valkey to the
# rtz-vCluster syncer-mangled Service name. #3373 Batch A moved bp-valkey INTO
# the rtz vCluster but MISSED this consumer (the migration rewired SME, the
# projector, gitea→seaweedfs, newapi→vLLM — but not newapi→valkey). newapi's
# valkey default-ON URL still pointed at the OLD `valkey-primary.valkey.svc`
# which is now NXDOMAIN → FATAL `Redis ping test failed: ... no such host` →
# CrashLoopBackOff (observed live on hw133, 10+ restarts). values.yaml
# `valkey.url` + blueprint.yaml configSchema default now point at
# `valkey-primary-x-valkey-x-rtz-vcluster.rtz.svc.cluster.local:6379` (mirrors
# the SME VALKEY_ADDR rewire #3476). Lockstep: 80-newapi.yaml pin → 1.4.81.
# 1.4.83 (Refs #3374, 2026-06-14): rewire the NetworkPolicy valkey egress
# selector to match the #3483 connection-string rewire. #3483 repointed
# `valkey.url` at the rtz-vCluster syncer-mangled
# `valkey-primary-x-valkey-x-rtz-vcluster.rtz.svc` but LEFT the egress
# NetworkPolicy rule (`networkPolicy.egress[bp-valkey]`) selecting the now-
# dead `valkey` namespace (`namespaceSelector: kubernetes.io/metadata.name:
# valkey`). #3373 Batch A re-homed bp-valkey to the rtz vCluster, so the
# synced Service lives in the HOST `rtz` namespace — egress to valkey:6379
# was DENIED → newapi CrashLoop `Redis ping test failed` (keystone #3374
# walk, live hw135). Flips `networkPolicy.egress[bp-valkey].namespaceLabel`
# `valkey` → `rtz` so the rendered egress namespaceSelector permits the
# datapath to the rtz-synced valkey. Lockstep: 80-newapi.yaml pin → 1.4.83.
# 1.4.85 (#3374, 2026-06-14): zero-click bare-URL SSO — auto-redirect on
# load + custom-provider admin promote. TWO fixes, both root-caused live on
# hw136 (dep 3a2ee904b1d0366a):
#   (1) AUTO-REDIRECT. NewAPI's embedded React SPA (pinned mirror, not a fork)
#       serves a marketing/login homepage at `/` and only fires OIDC on a
#       "Sign in" CLICK → the zero-click contract was unmet (bare URL showed
#       the marketing page). oauth2-proxy is the WRONG tool (NewAPI auths only
#       via its own session cookie + ignores proxy headers — middleware/auth.go)
#       and a static gateway 302 fails NewAPI's callback CSRF check (the `state`
#       must be minted same-origin by GET /api/oauth/state first). FIX: the
#       sandbox-bridge sidecar now serves a SAME-ORIGIN init page at the bare
#       root (handler/sso_init.go) that runs NewAPI's own onCustomOAuthClicked
#       sequence (state → /api/status provider → authorize redirect with
#       kc_idp_hint=catalyst-pin); the HTTPRoute steers ONLY the bare root
#       (Exact `/`) to the bridge, everything else to NewAPI. The full OIDC
#       round-trip lands the owner signed-in (proven live on hw136).
#   (2) ADMIN PROMOTE. NewAPI's CUSTOM (generic) OAuth provider persists the
#       SSO subject in the `user_oauth_bindings` table, NOT the legacy
#       `users.oidc_id` column (the comment at model/custom_oauth_provider.go:126
#       is explicit; oidc_id is only written by the BUILT-IN oidc provider we do
#       NOT use). The admin-sso-seed-job promote keyed on `oidc_id <> ''`, so
#       the SSO owner (oidc_id='') was NEVER promoted → stayed role=1 → every
#       admin route 302'd to /forbidden (live hw136: user `sovereign_2` had a
#       user_oauth_bindings row but oidc_id=''). FIX: promote on EITHER a
#       non-empty oidc_id OR a binding to the sovereign custom provider —
#       verified live, /console/setting now reachable post-SSO.
# Bridge image rebuilds via build-bp-newapi-sandbox-bridge.yaml (push to
# internal/handler/**); the Exact `/` route serves the landing once the new
# bridge image rolls.
# 1.4.87 (#3374, 2026-06-14): open the gateway->sandbox-bridge:8080 hop in the
# gateway-ingress CiliumNetworkPolicy. The 1.4.85 Exact `/` HTTPRoute steers the
# bare root to the bridge sidecar, but the gateway-ingress CNP (fromEntities:
# ingress) only allowed newapi:3000 + metering:8086 — so the gateway->bridge:8080
# hop was default-denied and the bare URL returned "upstream connect error ...
# connection timeout" (measured live on hw136 after the bridge image rolled).
# Add the bridge port to the CNP toPorts, gated on ssoInit + sandboxBridge.
# Verified live on hw136: bare URL https://newapi.<fqdn>/ now serves the init
# page -> silent KC broker -> lands signed-in in /console (zero-click).
# 1.4.89 (#3374, 2026-06-15): the 1.4.85-1.4.88 zero-click landing was
# UNRELIABLE on a fresh prov — the bridge init page DISCOVERED the authorize
# endpoint + client_id at runtime from `pj.data.custom_oauth_providers` in GET
# /api/status, but NewAPI v0.13.2's /api/status payload has NO
# `custom_oauth_providers` field (proven live on hw138, dep 4b5ff7852e33fc15:
# full key dump, field absent). So the discovery always returned [], the page
# fell through to /login, and the SPA bounced the owner to the /setup wizard —
# the exact symptom — EVEN THOUGH the DB was correctly seeded (setups row,
# catalyst-root role=100, the `sovereign` custom_oauth_providers row enabled).
# ROBUST FIX (sso_init.go 0.1.16): the bridge no longer discovers — the chart
# injects NEWAPI_SSO_AUTHORIZE_URL / NEWAPI_SSO_CLIENT_ID / NEWAPI_SSO_SCOPES
# (the IDENTICAL values the admin-sso-seed-job seeds) so the init page builds
# the authorize redirect DIRECTLY. The only runtime call left is GET
# /api/oauth/state (proven to mint state + set the session cookie live on
# hw138), structurally required for NewAPI's callback CSRF. If the authorize
# URL/client_id are unset the page degrades to the SPA /login link. The bridge
# IMAGE TAG + a further chart patch bump are auto-committed by
# build-bp-newapi-sandbox-bridge.yaml on merge (push to internal/handler/**).
version: 1.4.95
appVersion: "0.13.2"
description: |
  Catalyst Blueprint scratch chart for NewAPI — multi-tenant LLM
  marketplace gateway.

  No first-party Helm chart is published by the NewAPI upstream
  (https://github.com/Calcium-Ion/new-api ships a docker-compose only).
  This chart hand-wires the upstream container image as a
  Deployment + Service + Ingress (split customer-API vs ops-admin) +
  ConfigMap + ServiceAccount + NetworkPolicy + ExternalSecret consumers.

  Connects to:
    - bp-cnpg            (Postgres for users, credits, channels, audit log)
    - bp-valkey          (session and rate-limit cache)
    - bp-keycloak        (OIDC for ops-staff admin UI)
    - bp-external-secrets (DB DSN, master key, per-channel provider keys)
    - bp-vllm            (in-cluster cheap-tier inference channel; optional)

  Customer surface is NOT this chart — Catalyst is the customer-facing
  UI. This chart's customer surface is the OpenAI-compatible API at
  `api.<host>/v1/*`. The upstream's portal UI is intentionally disabled
  via the ingress configuration.

  Pairs with bp-cnpg, bp-keycloak, bp-external-secrets, bp-valkey,
  bp-vllm (depends.list in blueprint.yaml).
type: application
keywords: [catalyst, blueprint, newapi, llm, gateway, marketplace, multi-tenant, credits, byok, openai-compatible, reseller]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io
# Scratch chart — see comments in bp-librechat/chart/Chart.yaml for the
# rationale on the `common` library subchart dependency (issue #181
# hollow-chart gate).
dependencies:
  - name: common
    version: "0.1.3"
    repository: "https://sigstore.github.io/helm-charts"
