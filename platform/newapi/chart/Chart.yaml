# 1.4.93 (#3563, 2026-06-15): zero-click RE-login fix — the bare-URL SSO landing
# page (sandbox-bridge sso_init.go 0.1.17) is now IDEMPOTENT. After 1.4.92 the
# FIRST bare-URL visit bound the SSO identity to a NewAPI user (role=100) and
# landed signed-in, but EVERY SUBSEQUENT visit dead-ended at "This OpenOva SSO
# account has already been bound" and minted no /console session (/console →
# /login?expired=true) — measured live hw139 (dep c89aa7059556b342). ROOT CAUSE
# is upstream NewAPI v0.13.2 controller/oauth.go HandleOAuth, which picks bind-
# vs-login purely off the session: `if session.Get("username") != nil →
# handleOAuthBind` (which errors MsgOAuthAlreadyBound via provider.IsUserIDTaken),
# else the LOGIN branch (findOrCreateOAuthUser logs the existing user in).
# GenerateOAuthCode (/api/oauth/state) sets `oauth_state` but NEVER clears
# `username`, so on a re-visit the browser still carries the prior visit's valid
# session cookie → the flow lands in BIND mode → "already bound". NewAPI is a
# pinned MIRROR (not a fork), so the binary cannot be patched. FIX in the
# OpenOva-owned landing page: (1) GET /api/user/self first — if the session is
# valid the owner IS signed in → redirect straight to /console (no Keycloak
# round-trip, the literal "URL → signed in as admin"); (2) else GET
# /api/user/logout (upstream session.Clear()+Save()) to wipe the stale username,
# THEN run the OAuth flow so the callback takes the LOGIN branch instead of BIND.
# Both calls are same-origin; the logout is best-effort. Build-bp-newapi-sandbox-
# bridge CI re-tags the sidecar; blueprint-release auto-bumps the 80-newapi.yaml
# pin in lockstep. Refs #3563, #3374.
# 1.4.91 (#3374, 2026-06-15): newapi SSO callback REAL root-cause fix — the
# running NewAPI pod never loaded the seeded custom OAuth provider. After
# 1.4.79+ correctly seeded the `sovereign` custom_oauth_providers row (enabled,
# client_id/secret/endpoints all present) AND the bare-URL zero-click init page
# (sandbox-bridge 0.1.16) correctly redirected to Keycloak, the in-app callback
# `/api/oauth/sovereign` STILL hard-failed `{"message":"Unknown OAuth provider"}`
# → SSO never completed → owner bounced to /login → /setup (measured live hw139
# dep c89aa7059556b342 2026-06-15). ROOT CAUSE: NewAPI loads custom OAuth
# providers into its in-memory registry ONLY at boot (LoadCustomProviders /
# oauth/registry.go); its 60s SYNC_FREQUENCY loop re-syncs ONLY `options` +
# `channels`, NEVER `custom_oauth_providers` (pod log: "Loaded 0 custom OAuth
# providers", then only "syncing options"/"syncing channels" forever). Because
# admin-sso-seed-job runs as a Helm post-install/post-upgrade HOOK, it INSERTs
# the provider row ~2s AFTER the NewAPI Deployment is already up (live: pod
# started 18:51:56, row created 18:51:58, restartCount=0) → the process never
# sees it. (The earlier `oidc_enabled=false` in /api/status is a RED HERRING —
# that flag is NewAPI's BUILT-IN OIDC, which this Sovereign does not use; the
# custom provider has no global enabled option, only its per-row `enabled`.)
# FIX: admin-sso-seed-job.yaml seed.sh adds reload_newapi_provider() — after the
# provider upsert it PATCHes the NewAPI Deployment's pod-template
# `kubectl.kubernetes.io/restartedAt` (a rollout-restart, re-running
# LoadCustomProviders → "Loaded 1 custom OAuth providers"). IDEMPOTENT: it
# records a hash of the provider's material config in the Deployment annotation
# `catalyst.openova.io/newapi-provider-reload-hash` and restarts ONLY when that
# hash is absent/changed (no restart loop; the per-minute promote CronJob never
# calls it). Mechanism: python3 (present in the postgres seed image) + the
# mounted SA token; new RBAC grants get+patch on EXACTLY the NewAPI deployment.
# Proven live on hw139: post-restart `/api/oauth/sovereign` reaches token-
# exchange instead of "Unknown OAuth provider". Lockstep: 80-newapi.yaml pin →
# 1.4.91. Refs #3374.
# 1.4.79 (#3374, 2026-06-14): SSO token-exchange redirect_uri fix. After
# 1.4.78 booted newapi on Postgres + loaded the sovereign OIDC provider, the
# in-app "Continue with OpenOva SSO" round-tripped Keycloak but the back-channel
# token-exchange FAILED `invalid_grant - Incorrect redirect_uri` → no session →
# /api/user/self 401 → bounce to /login?expired=true (measured live hw133
# 2026-06-14, #3475 re-walk). ROOT CAUSE: NewAPI's generic-OAuth provider builds
# the token-exchange redirect_uri as `${ServerAddress}/oauth/<slug>` (upstream
# oauth/generic.go:97) which must byte-match the frontend authorize redirect_uri
# `${window.origin}/oauth/<slug>` (use-oauth-login.ts:204) per RFC-6749 §4.1.3,
# but the `options` table shipped with 0 rows so ServerAddress was "" → the
# exchange sent the relative `/oauth/sovereign` ≠ the absolute authorize URI.
# FIX: admin-sso-seed-job.yaml seed.sh now upserts options.ServerAddress =
# https://newapi.<sovereignFQDN> (new adminSeed.serverAddress knob, derived by
# default); newapi's SyncOptions loop (60s) picks it up on the running pod with
# no restart. sso-app-registration.yaml also registers the exact
# /oauth/<providerSlug> redirectUri on the KC newapi-admin client (was relying on
# the /* wildcard alone). Lockstep: 80-newapi.yaml pin → 1.4.79. Refs #3374.
# 1.4.67 (#3374, 2026-06-14): admin-init + SSO-provider seed. NewAPI 0.13.x
# showed the "uninitialized" setup wizard and granted NO admin on a fresh
# Sovereign — `GET /api/setup` = {status:false,root_init:false}, every newapi
# table empty. NewAPI stores OIDC providers + the root user in its Postgres
# DB (not env, which the chart had wired), so the app was stuck pre-setup.
# New templates/admin-sso-seed-job.yaml runs a DB-direct post-install/post-
# upgrade Job (+ a per-minute promote CronJob) that writes the setups row
# (status:true), a system root user (role=100, SSO-only locked sentinel ⇒
# root_init:true), the sovereign-realm OIDC provider (the in-app SSO button),
# and promotes any SSO-authenticated user (oidc_id set) to root so the owner's
# first bare-URL login lands as admin. All DB-direct via the CNPG <cluster>-app
# Secret (master-key path is asserted-unset by the smoke test). Gated on
# cnpg.enabled + auth.adminUI.mode=keycloak + sovereignFQDN. New `adminSeed.*`
# values. Lockstep: 80-newapi.yaml pin → 1.4.67. Refs #3374.
