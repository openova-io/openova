# the host's redirectUris in the shared sovereign realm -> kills the live
# "Invalid parameter: redirect_uri" SSO regression on newapi.<sovereign-fqdn>.
# Lockstep: both slot pins + blueprint → 1.4.122.
# 1.4.128 (#4278-followup, 2026-06-25): the DSN-placeholder Secret
# (templates/cnpg-cluster.yaml) no longer CLOBBERS an already-populated
# SQL_DSN on re-render → kills the `wait-for-sql-dsn` Init:CrashLoopBackOff
# that wedged the data plane on a fresh Org (the #4278 close-blocker).
#
# ROOT CAUSE (measured live, omantel.biz Orgs org-5d392c0b + org-7283,
# chart 1.4.127):
#   The `bp-newapi-newapi-db-dsn` Secret was a PLAIN chart-managed resource
#   rendering `SQL_DSN: ""` on EVERY helm render. The real DSN is composed +
#   PATCHed in by the database-secret-sync-job, a POST-install/POST-upgrade
#   Helm HOOK that runs AFTER the render. So the populated value only
#   survives if that hook completes. When the upgrade hook chain fails OR
#   times out for ANY reason — the admin-promote hook `context deadline
#   exceeded`, or a fresh install failing at the cluster-singleton CNPG
#   mutating-webhook x509 — helm-controller's render leaves SQL_DSN reset to
#   "" and the post-hook never repopulates it. The `wait-for-sql-dsn`
#   initContainer then polls the empty /dsn/SQL_DSN for its full 300s budget,
#   exit 1, and the Pod wedges `Init:CrashLoopBackOff` even though CNPG is
#   healthy and the `-app` password (64 bytes) exists. This is the #1834
#   hole: #1834 added `resource-policy: keep` to the CNPG *Cluster* but NOT
#   to this *Secret*, and the sync-job's strategic-merge PATCH does NOT win
#   across a subsequent chart render (helm-controller re-applies the empty
#   placeholder).
#
# FIX (#4278-followup): the DSN placeholder Secret is now SELF-PRESERVING —
#   it `lookup`s its own existing value at render time and re-emits a
#   non-empty SQL_DSN unchanged (instead of ""), plus carries
#   `helm.sh/resource-policy: keep`. On a true first install the lookup is
#   nil → "" placeholder → the gate holds the Pod off SQLite → the
#   post-install sync-job patches the real DSN → the gate clears. On every
#   later render the populated DSN is preserved, so an unrelated hook
#   failure can no longer empty it and CrashLoop the data plane. Mirrors the
#   gitea database-secret.yaml `lookup`+`keep` precedent. vcluster-app role
#   (cnpg.enabled=false) is unaffected — that path mirrors the DSN host→vc.
#   Lockstep: 80-newapi.yaml + 80a-newapi-host-seams.yaml pins + blueprint.yaml
#   → 1.4.128.
# 1.4.130 (#4347): route the channel-seed post-install/post-upgrade hook Job's
#   curl image through the Sovereign-local Harbor proxy-cache
#   (`harbor.openova.io/proxy-dockerhub/curlimages/curl`) so the host-ns Kyverno
#   `harbor-proxy-pull` Enforce policy admits it on every reconcile (the sibling
#   db-dsn-sync Job already proxied it; channel-seed was the lone raw
#   docker.io/curlimages/curl). Refs #4347 #4325.
# 1.4.132 — #4388 (#4325 fallout sweep): repoint the valkey.url configSchema
#   default + chart values default + the egress NetworkPolicy namespaceSelector
#   off the dead rtz-vcluster-syncer-mangled name to the host-native
#   `valkey-primary.valkey.svc` / ns `valkey` (bp-valkey re-homed to host ns by
#   #4325; the old `rtz` namespace selector denied newapi→valkey:6379 egress).
#   Config-default-only. Refs #4388 #4325 #4376.
# 1.4.134 — #4477: SELF-HEAL a stale OIDC provider client_secret. The one-shot
#   admin-seed upserts custom_oauth_providers.client_secret ONCE; when Keycloak
#   rotates the newapi-admin client secret (or the seed ran before bp-sso-bridge
#   published the final secret) the DB row goes stale → newapi token-exchange
#   sends the old secret → KC `unauthorized_client` → in-app SSO errors "Failed
#   to get token from OpenOva SSO". The per-minute admin-promote CronJob now runs
#   resync_provider_secret (reads the live /oidc secret, UPDATEs the row only on
#   drift, then hash-gated reload), mounts the OIDC secret, and its Role reads
#   it. Live-verified on 91dc0591/omantel.biz: DB secret resynced, pod reloaded
#   "Loaded 1 custom OAuth providers", KC authenticates the corrected secret.
# 1.4.143 — #5375 (UAT row M2): REGION-LOCAL producer for the OpenBao path the
#   catalyst-newapi-admin-token ExternalSecret reads. New templates/admin-token-
#   pushsecret.yaml renders an ESO PushSecret that seeds `catalyst/newapi/
#   admin-token` (property ADMIN_API_TOKEN) from the region-local token-signing-
#   key Secret's ADMIN_SECRET via the SAME vault-region1 ClusterSecretStore. The
#   only prior producer — catalyst-api's #4477 seed — runs solely in the primary
#   region, and each region runs its own OpenBao, so on every 2-region prov
#   region-B's ExternalSecret was permanently SecretSyncedError ("could not get
#   secret data from provider", path absent in region-B's vault; live hw285-
#   hw288) → a post-region-kill promote had NO NewAPI admin bearer (latent DR
#   gap). Cross-region replication would be WRONG (the bearer must byte-match
#   the REGION-LOCAL bridge ADMIN_SECRET), so the fix is the region-local
#   producer. Pairs with bp-openbao 1.2.64 (external-secrets-push policy grant).
version: 1.4.146
appVersion: "0.13.2"
description: |
  Catalyst Blueprint scratch chart for NewAPI — multi-tenant LLM
  marketplace gateway.

  No first-party Helm chart is published by the NewAPI upstream
  (https://github.com/Calcium-Ion/new-api ships a docker-compose only).
  This chart hand-wires the upstream container image as a
  Deployment + Service + Ingress (split customer-API vs ops-admin) +
  ConfigMap + ServiceAccount + NetworkPolicy + ExternalSecret consumers.

  Connects to:
    - bp-cnpg            (Postgres for users, credits, channels, audit log)
    - bp-valkey          (session and rate-limit cache)
    - bp-keycloak        (OIDC for ops-staff admin UI)
    - bp-external-secrets (DB DSN, master key, per-channel provider keys)
    - bp-vllm            (in-cluster cheap-tier inference channel; optional)

  Customer surface is NOT this chart — Catalyst is the customer-facing
  UI. This chart's customer surface is the OpenAI-compatible API at
  `api.<host>/v1/*`. The upstream's portal UI is intentionally disabled
  via the ingress configuration.

  Pairs with bp-cnpg, bp-keycloak, bp-external-secrets, bp-valkey,
  bp-vllm (depends.list in blueprint.yaml).
type: application
keywords: [catalyst, blueprint, newapi, llm, gateway, marketplace, multi-tenant, credits, byok, openai-compatible, reseller]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io
# Scratch chart — see comments in bp-librechat/chart/Chart.yaml for the
# rationale on the `common` library subchart dependency (issue #181
# hollow-chart gate).
dependencies:
  - name: common
    version: "0.1.3"
    repository: "https://sigstore.github.io/helm-charts"
