# 1.4.27 (TBD-A39 #1834, 2026-05-19): replace the Helm-`lookup`-based
# DSN Secret render with a post-install/post-upgrade Job that polls
# CNPG's `<cluster>-app` Secret until populated, composes the SQL_DSN
# string, and PATCHes it into the chart-managed
# `<release>-newapi-db-dsn` Secret in place.
#
# ROOT CAUSE (#1834 D34 close-audit on t32 2026-05-19):
#   The pre-1.4.27 cnpg-cluster.yaml rendered the DSN Secret via Helm
#   `lookup "v1" "Secret" .Release.Namespace <cluster>-app` at template
#   time. On every freshly-franchised Sovereign CNPG materialises the
#   `<cluster>-app` source Secret only AFTER bp-newapi's HelmRelease
#   applies, so the first render's lookup returns nil and the Secret
#   was committed with an empty password — literally
#   `postgres://newapi:@newapi-bp-newapi-newapi-pg-rw.newapi.svc.cluster.local:5432/newapi?sslmode=require`.
#   The chart annotated the rendered Secret `helm.sh/resource-policy:
#   keep`, so Flux never overwrote the empty bytes on subsequent
#   reconciles even after CNPG had populated the source. Result on
#   t32: newapi Pod in 21x CrashLoopBackOff with `password
#   authentication failed for user "newapi"`. Public probe to
#   `newapi.t32.omani.works` returned envoy 503 "no healthy upstream".
#   The chart's own header comment claimed "the 1-minute Flux
#   reconcile picks it up on the next tick" — verified false in
#   production; the `resource-policy: keep` annotation pinned the
#   empty bytes across every subsequent reconcile.
#
# FIX (canonical seam — issue #830 Bug 2 + ADR-0001 §11.3
# anti-duplication):
#   - cnpg-cluster.yaml: drop the Helm `lookup` / DSN composition. The
#     DSN Secret now renders as an empty-value placeholder so kubelet
#     can satisfy the Deployment's secretKeyRef on first schedule.
#   - NEW templates/database-secret-sync-job.yaml: Helm
#     post-install/post-upgrade Job that polls `<cluster>-app` (up to
#     10 min), reads the `password` bytes, composes the canonical
#     `postgres://<user>:<password>@<host>:5432/<db>?sslmode=<mode>`
#     string, and strategic-merge PATCHes it into the placeholder
#     Secret. Hook-weight 5 (after the SA/Role/RoleBinding at 0).
#     ServiceAccount + Role (get/create/update/patch/apply on
#     secrets) + RoleBinding bound to the same hook lifecycle.
#   - Pattern mirrors platform/gitea/chart/templates/database-secret-
#     sync-job.yaml (proven on otech30, issue #830 Bug 2) and
#     platform/wordpress-tenant/chart/templates/database-secret-sync-
#     job.yaml (proven on t26).
#
# TEMPLATABILITY (Inviolable Principle #4):
#   Every knob (cnpg.cluster.owner, cnpg.database, cnpg.sslMode,
#   cnpg.dsnSecretName) flows through to the Job's env vars, so an
#   operator override on any of those updates the composed DSN on the
#   next helm upgrade without forking the chart.
#
# 1.4.19 (TBD-A12 #1798, 2026-05-18): add `startupProbe` to the newapi
# container to gate liveness + readiness until GORM AutoMigrate
# finishes on first-boot.
#
# ROOT CAUSE (t22 chart 1.4.18 Wave 36 verify):
#   On a freshly franchised Sovereign the auto-provisioned CNPG database
#   `newapi` starts empty. The upstream NewAPI binary's bootstrap path
#   (model/main.go:InitDB → migrateDB) logs "database migration started"
#   then runs GORM AutoMigrate on 26 models (Channel, Token, User,
#   PasskeyCredential, Option, Redemption, Ability, Log, Midjourney,
#   TopUp, QuotaData, Task, Model, Vendor, PrefillGroup, Setup, TwoFA,
#   TwoFABackupCode, Checkin, SubscriptionOrder, UserSubscription,
#   SubscriptionPreConsumeRecord, CustomOAuthProvider, UserOAuthBinding,
#   SubscriptionPlan) plus two column-type migrations
#   (subscription_plans.price_amount → decimal, tokens.model_limits →
#   text). The Gin route registration + the `:3000` listen only happen
#   AFTER migration returns nil.
#
#   On a cpx21/cpx31 node with CNPG primary in the same namespace and
#   sslmode=require this first-boot migration runs 60-120s. Pre-A12
#   the chart's livenessProbe was `initialDelaySeconds: 30` +
#   `periodSeconds: 10` + `failureThreshold: 3` ⇒ kubelet SIGKILLed
#   the container at the 50s mark, EVERY restart, mid-migration. The
#   empty `newapi` DB on t22 had ZERO public-schema tables after 29
#   CrashLoopBackOff restarts because every kill races the first GORM
#   query. pg_stat_activity on CNPG side showed no `newapi` user
#   connections; the kill happens before the migration's TLS handshake
#   completes.
#
#   Symptom: `[SYS] ... database migration started` is the LAST log
#   line; container terminates with exit code 2 ~50s later; readiness
#   probe shows `dial tcp <pod-ip>:3000: connect: connection refused`;
#   endpoint /v1/models returns 503 "no healthy upstream".
#
# FIX (CANONICAL SEAM, Inviolable Principle #16):
#   StartupProbe owns "is this binary ALIVE for the first time?". It
#   short-circuits BOTH liveness and readiness until the binary
#   reports healthy on `:3000/api/status` — at which point those two
#   probes activate with their normal cadence. The startupProbe gives
#   GORM AutoMigrate up to 5 minutes (30 × 10s) before it gives up;
#   well above the observed 60-120s ceiling and below operator-
#   impatience limits. Once migration completes the binary is no
#   slower than steady-state, so the existing 10s liveness probe
#   period and 3-failure threshold are unchanged.
#
#   This is the canonical k8s pattern for slow-start migrations — every
#   chart that bakes a GORM/Alembic/Flyway AutoMigrate against an
#   empty DB on first boot should own a startupProbe, NOT inflate its
#   liveness initialDelaySeconds (which would also delay restart
#   recovery on every subsequent reconcile).
#
# TEMPLATABILITY (Inviolable Principle #4):
#   Every knob (path, port, initialDelaySeconds, periodSeconds,
#   timeoutSeconds, failureThreshold, AND the gate to disable the
#   probe entirely) is operator-tunable from per-Sovereign overlays
#   via .Values.newapi.probes.startup.*. Setting
#   `.Values.newapi.probes.startup: null` skip-renders the
#   startupProbe block — operators who pre-seed their database can
#   opt out and let the (pre-A12) liveness initialDelaySeconds gate
#   take over.
#
# 1.4.17 (TBD-D35d #1778, 2026-05-18): add `httproute.yaml` template +
# `ingress.httpRoute` values block so a Sovereign install can render a
# Cilium Gateway HTTPRoute for `newapi.<sovereign-fqdn>` that outranks
# the marketplace `tenant-wildcard` (`*.<sovereign-fqdn>`). Without this
# the sandbox runtime's `NEWAPI_BASE_URL=https://newapi.<fqdn>/v1` hit
# the wildcard, was forwarded to the storefront `console` Service, and
# 502'd the entire BYOS Claude Code journey. The chart-managed HTTPRoute
# lives in the `newapi` namespace (same as the Service backend), so no
# cross-namespace ReferenceGrant is required. Default OFF (`ingress.
# httpRoute.enabled: false`); the bootstrap-kit slot 80 overlay flips
# it to true and supplies `host: newapi.${SOVEREIGN_FQDN}`.
#
# 1.4.15 (TBD-A11 #1765, 2026-05-18): fix `mkdir /data/logs: permission
# denied` CrashLoopBackOff on every fresh Sovereign. The upstream
# Calcium-Ion/new-api v0.13.2 binary writes ephemeral logs to
# `/data/logs` on startup; pre-1.4.15 the chart ran the Pod as uid
# 1000 (`runAsNonRoot: true`, `runAsUser: 1000`) against a root-owned
# `/data` baked into the upstream image AND mounted no volume at
# `/data`, so the binary's `mkdir` went against the container rootfs
# (root-owned, not writable by uid 1000 even with
# `readOnlyRootFilesystem: false`).
#
# Fix (two halves, both required):
#   - values.yaml: add `fsGroup: 1000` to `newapi.securityContext` so
#     kubelet chowns the mount to gid 1000 on Pod start.
#   - deployment.yaml: add `volumes: - name: data emptyDir: ...` and
#     a matching `volumeMounts: - name: data mountPath: /data` on the
#     newapi container. emptyDir (not PVC) is correct — NewAPI's
#     durable state (users, credits, channels, audit log) lives in
#     Postgres via SQL_DSN; only ephemeral logs land on disk so a
#     restart-loses-logs semantic is acceptable.
#
# Caught on t22 2026-05-18 with `newapi-bp-newapi-*` in
# CrashLoopBackOff and `kubectl logs --previous` showing
# `mkdir /data/logs: permission denied`. Verified via `helm template`
# that the Pod spec now carries both halves; on Sovereign reconcile
# the Pod transitions from CrashLoopBackOff → Running.
#
# 1.4.4 (qa-loop bounded-cycle audit prov #20 Fix #138, 2026-05-11): add
# pre-install/pre-upgrade hook (templates/000-external-secrets-webhook-
# readiness-job.yaml) that polls the external-secrets validating-
# admission webhook (`external-secrets-webhook.external-secrets-system.
# svc:443/validate-external-secrets-io-v1beta1-externalsecret`) until
# it returns a structured HTTP response (200/400/405/415/422). Closes
# the race between bp-external-secrets reaching HR Ready=True (Pods
# Ready) and the apiserver-side EndpointSlice for the webhook Service
# being observable by the validating admission controller.
