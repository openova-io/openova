# 1.4.126 (#4278, 2026-06-25): admin-promote CronJob no longer loops forever
# on a missing ServiceAccount → bp-newapi HR can reach Ready on a fresh Org.
#
# ROOT CAUSE (measured live, omantel.biz demo Org org-7283eb4a-…, chart 1.4.125):
#   The per-minute admin-promote CronJob (a REGULAR, release-managed resource)
#   set serviceAccountName to the one-shot admin-SEED Job's ServiceAccount
#   `bp-newapi-admin-seed`, which is a Helm HOOK resource
#   (post-install,post-upgrade + hook-delete-policy: before-hook-creation).
#   When the install/upgrade hook phase failed or timed out, Helm's
#   before-hook-creation cleanup DELETED that hook-scoped SA (+ Role +
#   RoleBinding + the scripts ConfigMap), but the long-lived CronJob survived
#   and fired every minute against a now-missing SA:
#     pods "bp-newapi-admin-promote-…-" is forbidden: error looking up
#     service account …/bp-newapi-admin-seed: serviceaccount
#     "bp-newapi-admin-seed" not found
#   → every spawned Job DeadlineExceeded → the Helm post-install hook never
#   completed → bp-newapi HR wedged "context deadline exceeded" (release stuck
#   at v1, install-failed) even though the newapi data plane was 3/3 Running.
#   This is the canonical "a long-lived CronJob must not depend on Helm-hook
#   lifecycle resources" defect — every other long-lived CronJob in this repo
#   (openbao snapshot-replication, self-sovereign-cutover mirror-resync,
#   syft-grype, flux stuck-HR-recovery) uses its OWN release-managed RBAC.
#
# FIX (#4278):
#   - The admin-promote CronJob now has a DEDICATED, release-managed
#     ServiceAccount + Role + RoleBinding (`bp-newapi-admin-promote`, NO Helm
#     hook annotations), bound with exactly the verbs promote.sh needs (get the
#     CNPG -app Secret; get+patch the NewAPI Deployment for the hash-gated
#     reload). The CronJob binds this SA, never the hook seed SA.
#   - The shared scripts ConfigMap (`bp-newapi-admin-seed-scripts`) is now a
#     release-managed resource (no before-hook-creation hook) so it can't
#     vanish out from under the CronJob either; it is applied in the main
#     install/upgrade phase, before any hook OR CronJob Pod starts.
#   - The one-shot admin-SEED Job + its SA/Role/RoleBinding REMAIN Helm hooks
#     (correct — they are genuinely one-shot post-install/post-upgrade work).
#   Regression guard: tests/admin-promote-rbac-render.sh.
#
# 1.4.109 (#3858, 2026-06-19): stop the seed/promote Jobs masquerading as
# newapi Service endpoints → kill the intermittent "upstream connect error
# 111" on newapi.<fqdn>.
#
# ROOT CAUSE (measured live on hw167, chart 1.4.108):
#   The admin-seed Job, the per-minute admin-promote CronJob, and the
#   channel-seed Job all stamped their POD TEMPLATE with
#   `bp-newapi.selectorLabels` = {app.kubernetes.io/name: bp-newapi,
#   app.kubernetes.io/instance: <release>}. That is EXACTLY the selector of
#   both the `newapi-bp-newapi` Service (ports 3000/8080) and the
#   `newapi-bp-newapi-bridge` Service (port 8080). Those Job pods are psql/curl
#   one-shots with NO HTTP listener and NO readinessProbe, so the kubelet marks
#   their running container ready-by-default and the endpoints controller
#   adopts them into BOTH Services' EndpointSlices. The bridge Service's
#   `publishNotReadyAddresses: true` (#3374) made the leak immediate. With the
#   admin-promote CronJob firing every minute, the Cilium Gateway round-robined
#   bare-URL `/` hits (Exact `/` → bridge:8080, PathPrefix `/` → newapi:3000)
#   to the dead Job pod IP whenever one was alive → the gateway got
#   connection-refused from the upstream → "upstream connect error 111".
#   Intermittent by construction: a `/` hit landed on the real pod OR a
#   transient Job pod depending on round-robin + whether a promote pod was
#   alive that second (live evidence: the bridge EndpointSlice carried
#   `10.42.0.116 → newapi-bp-newapi-admin-promote-…` next to the real pod).
#
# FIX: give each Job/CronJob pod template a DISTINCT `app.kubernetes.io/name`
#   (`newapi-admin-seed` / `newapi-admin-promote` / `newapi-channel-seed`) so it
#   matches NO Service selector — exactly the pattern the database-secret-sync
#   Job already uses (`app.kubernetes.io/name: newapi-db-dsn-sync`, which is why
#   that one never leaked). Pure pod-template-label change; the Jobs' own
#   behavior, RBAC, volumes and the workload Deployment/Service are untouched.
#   Provenance kept via `catalyst.openova.io/blueprint: bp-newapi` +
#   `catalyst.openova.io/component`.
#
# 1.4.107 (#3374, 2026-06-18): REAL fix for the hw159 zero-click 1st-hit 111 +
# /setup — eliminate the readiness race at its source instead of only retrying
# in the landing page (1.4.102 was honest race-hardening, not a fix). ROOT
# CAUSE: the sandbox-bridge serves the Exact `/` zero-click landing page, but
# as a PLAIN container it was gated TWICE behind NewAPI's ~2-min warm-up:
#   (1) the wait-for-sql-dsn initContainer runs to completion BEFORE any plain
#       container starts, so the bridge wasn't listening during the DSN-wait
#       window; and
#   (2) a Pod joins a Service EndpointSlice only when ALL containers are Ready
#       (pod-readiness = AND of every readinessProbe). The `newapi` container is
#       NotReady until GORM AutoMigrate finishes, so the WHOLE Pod stayed
#       NotReady → the Service had ZERO ready endpoints on every port (incl. the
#       bridge) → the gateway's Exact `/` backendRef had no healthy upstream →
#       `upstream-connect-error ... delayed connect error: 111`. The bridge
#       process being up was irrelevant; its endpoint was suppressed. The
#       browser could not even LOAD the landing page, so the 1.4.102 retry never
#       ran on the 1st hit; the SPA then showed /setup.
# FIX (three coordinated parts, all real):
#   (a) deployment.yaml — the bridge is now a NATIVE sidecar (initContainers
#       entry with restartPolicy:Always, KEP-753 GA k8s 1.29; Sovereigns run
#       k3s v1.31.4) declared FIRST, so it starts BEFORE the DSN gate and runs
#       the whole Pod lifetime — decoupled from NewAPI's migrate. Env shared
#       with the legacy path via the new bp-newapi.sandboxBridgeEnv helper.
#       Operator opt-out: sandboxBridge.nativeSidecar=false (pre-1.29 clusters).
#   (b) service.yaml — a dedicated bridge-only Service
#       `<fullname>-bridge` with publishNotReadyAddresses:true publishes the
#       bridge endpoint the INSTANT it binds :8080, even while `newapi` is
#       NotReady. httproute.yaml's Exact `/` rule now backendRefs THIS Service
#       (gateway.bridgeBackendService overrides it for the vCluster syncer-
#       mangled name). Result: the bare URL loads the landing page on the 1st
#       hit — no 111.
#   (c) sso_init.go (bridge sidecar) — on /api/oauth/state retry-exhaustion
#       while SSO IS configured (NewAPI still warming up) the page now RELOADS
#       ITSELF instead of falling through to /login (which the SPA bounces to
#       /setup on an unseeded NewAPI). So the first human visit never dead-ends
#       at the setup wizard during convergence. (An unconfigured overlay still
#       degrades to /login — reloading would loop with nothing to land on.)
# The setup wizard itself stays pre-completed by the admin-sso-seed-job (setups
# row + sovereign OIDC provider) and the per-minute promote/reload CronJob
# (1.4.97); this change ensures the landing page is REACHABLE and never routes
# the owner to /setup before the seed lands. Lockstep: 80-newapi.yaml pin +
# blueprint.yaml → 1.4.107. NB: build-bp-newapi-sandbox-bridge.yaml auto-bumps
# the pin further on merge (it rebuilds the sso_init.go sidecar). Refs #3374.
# 1.4.97 (#3374/#3563, 2026-06-17): SELF-HEALING provider reload — make the
# zero-click SSO custom-provider reload DETERMINISTIC on a fresh install. ROOT
# CAUSE re-surfaced live on hw158: newapi's in-app OIDC callback
# /api/oauth/sovereign returned `{"message":"Unknown OAuth provider"}` (3/3) and
# the pod boot-logged "Loaded 0 custom OAuth providers". The `sovereign`
# custom_oauth_providers DB row was correct (enabled, client_id/secret/endpoints
# present, created 03:25:05) but the running NewAPI pod was NEVER restarted to
# reload it — the Deployment carried restartCount=0 and NO
# `catalyst.openova.io/newapi-provider-reload-hash` annotation. 1.4.91's
# reload_newapi_provider (rollout-restart so LoadCustomProviders re-runs) is
# CORRECT, but it ran EXACTLY ONCE in the post-install/upgrade seed Job and is
# best-effort (`python3 /scripts/reload.py || echo`; reload.py raises
# SystemExit(0) on any GET/PATCH error). On hw158 that one-shot silently did not
# land (the provider INSERT and the hash-query/PATCH run microseconds apart in
# the same script while the pod does its own first rollout — any transient
# skip/blip leaves the annotation unset), and the per-minute promote CronJob's
# promote.sh called ONLY promote_oidc_users, so NOTHING ever retried the reload
# → broken forever. FIX (admin-sso-seed-job.yaml): promote.sh now ALSO calls
# reload_newapi_provider, so the per-minute CronJob RETRIES the reload until the
# Deployment's reload-hash annotation matches the live provider hash. Idempotent
# + hash-gated (reload.py no-ops once cur==want — never a restart loop). No RBAC
# or volume change: the CronJob already runs as the admin-seed SA (get+patch on
# the NewAPI Deployment) and already mounts /scripts (incl. reload.py) + /cnpg.
# Verified live hw158: a one-off run of reload_newapi_provider under the
# admin-seed SA patched the Deployment ("rollout-restart triggered ... provider
# hash none -> 593838668f7a") and rolled a fresh pod — proving the mechanism is
# sound and only its retry cadence was missing. Lockstep: 80-newapi.yaml pin +
# blueprint.yaml → 1.4.97. Refs #3374, #3563.
# 1.4.93 (#3563, 2026-06-15): zero-click RE-login fix — the bare-URL SSO landing
# page (sandbox-bridge sso_init.go 0.1.17) is now IDEMPOTENT. After 1.4.92 the
# FIRST bare-URL visit bound the SSO identity to a NewAPI user (role=100) and
# landed signed-in, but EVERY SUBSEQUENT visit dead-ended at "This OpenOva SSO
# account has already been bound" and minted no /console session (/console →
# /login?expired=true) — measured live hw139 (dep c89aa7059556b342). ROOT CAUSE
# is upstream NewAPI v0.13.2 controller/oauth.go HandleOAuth, which picks bind-
# vs-login purely off the session: `if session.Get("username") != nil →
# handleOAuthBind` (which errors MsgOAuthAlreadyBound via provider.IsUserIDTaken),
# else the LOGIN branch (findOrCreateOAuthUser logs the existing user in).
# GenerateOAuthCode (/api/oauth/state) sets `oauth_state` but NEVER clears
# `username`, so on a re-visit the browser still carries the prior visit's valid
# session cookie → the flow lands in BIND mode → "already bound". NewAPI is a
# pinned MIRROR (not a fork), so the binary cannot be patched. FIX in the
# OpenOva-owned landing page: (1) GET /api/user/self first — if the session is
# valid the owner IS signed in → redirect straight to /console (no Keycloak
# round-trip, the literal "URL → signed in as admin"); (2) else GET
# /api/user/logout (upstream session.Clear()+Save()) to wipe the stale username,
# THEN run the OAuth flow so the callback takes the LOGIN branch instead of BIND.
# Both calls are same-origin; the logout is best-effort. Build-bp-newapi-sandbox-
# bridge CI re-tags the sidecar; blueprint-release auto-bumps the 80-newapi.yaml
# pin in lockstep. Refs #3563, #3374.
# 1.4.91 (#3374, 2026-06-15): newapi SSO callback REAL root-cause fix — the
# running NewAPI pod never loaded the seeded custom OAuth provider. After
# 1.4.79+ correctly seeded the `sovereign` custom_oauth_providers row (enabled,
# client_id/secret/endpoints all present) AND the bare-URL zero-click init page
# (sandbox-bridge 0.1.16) correctly redirected to Keycloak, the in-app callback
# `/api/oauth/sovereign` STILL hard-failed `{"message":"Unknown OAuth provider"}`
# → SSO never completed → owner bounced to /login → /setup (measured live hw139
# dep c89aa7059556b342 2026-06-15). ROOT CAUSE: NewAPI loads custom OAuth
# providers into its in-memory registry ONLY at boot (LoadCustomProviders /
# oauth/registry.go); its 60s SYNC_FREQUENCY loop re-syncs ONLY `options` +
# `channels`, NEVER `custom_oauth_providers` (pod log: "Loaded 0 custom OAuth
# providers", then only "syncing options"/"syncing channels" forever). Because
# admin-sso-seed-job runs as a Helm post-install/post-upgrade HOOK, it INSERTs
# the provider row ~2s AFTER the NewAPI Deployment is already up (live: pod
# started 18:51:56, row created 18:51:58, restartCount=0) → the process never
# sees it. (The earlier `oidc_enabled=false` in /api/status is a RED HERRING —
# that flag is NewAPI's BUILT-IN OIDC, which this Sovereign does not use; the
# custom provider has no global enabled option, only its per-row `enabled`.)
# FIX: admin-sso-seed-job.yaml seed.sh adds reload_newapi_provider() — after the
# provider upsert it PATCHes the NewAPI Deployment's pod-template
# `kubectl.kubernetes.io/restartedAt` (a rollout-restart, re-running
# LoadCustomProviders → "Loaded 1 custom OAuth providers"). IDEMPOTENT: it
# records a hash of the provider's material config in the Deployment annotation
# `catalyst.openova.io/newapi-provider-reload-hash` and restarts ONLY when that
# hash is absent/changed (no restart loop; the per-minute promote CronJob never
# calls it). Mechanism: python3 (present in the postgres seed image) + the
# mounted SA token; new RBAC grants get+patch on EXACTLY the NewAPI deployment.
# Proven live on hw139: post-restart `/api/oauth/sovereign` reaches token-
# exchange instead of "Unknown OAuth provider". Lockstep: 80-newapi.yaml pin →
# 1.4.91. Refs #3374.
# 1.4.79 (#3374, 2026-06-14): SSO token-exchange redirect_uri fix. After
# 1.4.78 booted newapi on Postgres + loaded the sovereign OIDC provider, the
# in-app "Continue with OpenOva SSO" round-tripped Keycloak but the back-channel
# token-exchange FAILED `invalid_grant - Incorrect redirect_uri` → no session →
# /api/user/self 401 → bounce to /login?expired=true (measured live hw133
# 2026-06-14, #3475 re-walk). ROOT CAUSE: NewAPI's generic-OAuth provider builds
# the token-exchange redirect_uri as `${ServerAddress}/oauth/<slug>` (upstream
# oauth/generic.go:97) which must byte-match the frontend authorize redirect_uri
# `${window.origin}/oauth/<slug>` (use-oauth-login.ts:204) per RFC-6749 §4.1.3,
# but the `options` table shipped with 0 rows so ServerAddress was "" → the
# exchange sent the relative `/oauth/sovereign` ≠ the absolute authorize URI.
# FIX: admin-sso-seed-job.yaml seed.sh now upserts options.ServerAddress =
# https://newapi.<sovereignFQDN> (new adminSeed.serverAddress knob, derived by
# default); newapi's SyncOptions loop (60s) picks it up on the running pod with
# no restart. sso-app-registration.yaml also registers the exact
# /oauth/<providerSlug> redirectUri on the KC newapi-admin client (was relying on
# the /* wildcard alone). Lockstep: 80-newapi.yaml pin → 1.4.79. Refs #3374.
