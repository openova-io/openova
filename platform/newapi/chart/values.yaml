# Catalyst Blueprint scratch chart for NewAPI.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every
# operationally-meaningful value is configurable; cluster overlays in
# clusters/<sovereign>/bootstrap-kit/ may override any of these without
# rebuilding the Blueprint OCI artifact. The Sovereign FQDN, Keycloak
# issuer, channel endpoints, channel keys, and TLS issuer are all
# operator-supplied at install time.

catalystBlueprint:
  upstream:
    chart: ""              # scratch chart — no upstream Helm chart
    version: ""
    repo: ""
    images:
      newapi: "ghcr.io/openova-io/openova/newapi-mirror"

# ─── NewAPI application ──────────────────────────────────────────────────
newapi:
  enabled: true
  # Solo-Sovereign minimum — single replica. Per-Sovereign overlays bump
  # to 2+ once HA is needed (NewAPI is stateless once Postgres + Valkey
  # carry the persistent state).
  replicas: 1

  # Pin upstream image — DO NOT use floating tags per
  # docs/INVIOLABLE-PRINCIPLES.md #4. The chart references a
  # GHCR-mirrored image (operator's GHCR or OpenOva's mirror namespace)
  # to avoid pulling from Docker Hub at runtime.
  image:
    repository: ghcr.io/openova-io/openova/newapi-mirror
    tag: "v0.4.5"
    pullPolicy: IfNotPresent

  # NewAPI HTTP listener — port 3000 is the upstream default.
  port: 3000

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2
      memory: 1Gi

  # SecurityContext — non-root.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  # Liveness / readiness — NewAPI exposes /api/status (verified via
  # upstream code path controller/misc.go:GetStatus).
  probes:
    liveness:
      path: /api/status
      port: 3000
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /api/status
      port: 3000
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# ─── Postgres backend (bp-cnpg) ──────────────────────────────────────────
# NewAPI persists users, credits, channels, tokens, audit log to
# Postgres. Catalyst routes this to a managed Postgres provisioned via a
# Crossplane PostgresqlInstance claim against bp-cnpg. The DSN is
# operator-supplied via ExternalSecret; never hardcoded.
database:
  # ExternalSecret name carrying the full DSN. Required key: SQL_DSN
  # (e.g. "postgres://user:pass@host:5432/newapi?sslmode=require").
  existingSecret: ""              # operator-supplied (e.g. "newapi-db-dsn")
  existingSecretKey: "SQL_DSN"

# ─── Valkey cache (bp-valkey) ────────────────────────────────────────────
# Session store and rate-limit counters. Optional but recommended
# (NewAPI falls back to in-memory; in-memory loses state on restart).
valkey:
  enabled: true
  url: "redis://valkey.valkey.svc.cluster.local:6379"
  # If the operator's Valkey requires auth, supply via ExternalSecret.
  # Required key: REDIS_CONN_STRING (full URL with credentials).
  existingSecret: ""              # e.g. "newapi-valkey-conn"
  existingSecretKey: "REDIS_CONN_STRING"

# ─── App credentials (NewAPI-internal) ───────────────────────────────────
# SESSION_SECRET (random 32+ bytes) and CRYPTO_SECRET (random 32+ bytes)
# are NewAPI-internal cryptographic material. Generated out-of-band by
# the operator (per docs/INVIOLABLE-PRINCIPLES.md #4 and the credential
# hygiene rules in ~/.claude/CLAUDE.md), mounted via ExternalSecret.
# Required keys: SESSION_SECRET, CRYPTO_SECRET.
credentials:
  existingSecret: ""              # operator-supplied (e.g. "newapi-app-creds")

# ─── Auth: ops-staff admin UI ────────────────────────────────────────────
# The admin UI at admin.<host> is gated by the operator's IdP. Default
# mode is `keycloak` (OIDC against bp-keycloak). `masterKey` is allowed
# only for bootstrap-time access before Keycloak realm is ready.
auth:
  adminUI:
    mode: "keycloak"              # keycloak | masterKey
    keycloak:
      issuer: ""                  # operator-supplied (e.g. "https://keycloak.<sovereign>/realms/ops")
      clientId: "newapi-admin"
      callbackPath: "/oauth/callback"
      # ExternalSecret carrying client_secret. Required key:
      # OIDC_CLIENT_SECRET.
      existingSecret: ""          # e.g. "newapi-oidc"
    # Bootstrap-only master key. Set via ExternalSecret. Required key:
    # MASTER_KEY. The blueprint's smoke test ASSERTS this is unset on
    # production overlays.
    masterKeySecret: ""

  customerAPI:
    # `catalyst` (DEFAULT): customer-facing portal UI is disabled at
    # ingress. Catalyst issues per-user keys via NewAPI's admin API.
    # `self-serve`: customer-facing portal is enabled (NOT recommended
    # in Catalyst Sovereigns).
    keyIssuer: "catalyst"

# ─── Channels ────────────────────────────────────────────────────────────
# Operator-defined LLM provider channels. Every channel MUST carry a
# verifiable `attestation` block; render fails with a helpful error if
# any enabled channel lacks attestation. See blueprint.yaml configSchema
# and platform/newapi/README.md for the channel-tier model.
#
# Example (operator overrides this list in their per-Sovereign overlay):
#
# channels:
#   - name: qwen
#     type: vllm
#     endpoint: http://vllm.vllm.svc.cluster.local:8000/v1
#     models: ["Qwen/Qwen2.5-72B-Instruct"]
#     attestation:
#       kind: in-cluster
#       owner: "<sovereign-operator>"
#   - name: claude
#     type: anthropic
#     endpoint: https://api.anthropic.com
#     existingSecret: "newapi-channel-anthropic"
#     models: ["claude-sonnet-4-6", "claude-haiku-4-5"]
#     attestation:
#       kind: commercial-contract
#       accountId: "<anthropic-account-id>"
#       contractRef: "<internal-doc-link>"
#   - name: byok
#     type: byok-passthrough
#     attestation:
#       kind: byok
channels: []

# First-otech default vLLM channel. Disabled by default — opt-in per
# Sovereign via the bootstrap-kit overlay (slot 80-newapi.yaml). When
# `enabled: true` AND `endpoint != ""`, the chart composes a `vllm`-typed
# channel into the rendered channels list.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), the endpoint and
# model identifiers are operator-supplied at install time. The Catalyst
# repo references the OpenOva marketing site's wired upstream
# (`https://llm-api.omtd.bankdhofar.com`, model `qwen3-coder`, used by
# Axon at `openova-private/clusters/contabo-mkt/apps/axon/helmrelease.yaml`)
# as the canonical first-otech default ONLY for documentation; the
# chart's defaults here are empty so an unconfigured deploy does not
# silently wire customers to a third-party endpoint.
defaultChannels:
  vllm:
    # Set true in the per-Sovereign bootstrap-kit overlay. When false,
    # this block is ignored and the channel is NOT composed.
    enabled: false
    # Customer-visible model prefix.
    name: "qwen"
    # Upstream vLLM endpoint URL. Operator-supplied. The chart never
    # bakes a default endpoint — `helm template` with
    # `defaultChannels.vllm.enabled: true` and an empty `endpoint` is a
    # configuration error caught at render time.
    endpoint: ""
    # Models exposed via this channel.
    models:
      - "qwen3-coder"
    # ExternalSecret name holding the upstream API key (omit for truly
    # in-cluster vLLM where no key is required).
    existingSecret: ""
    # Attestation block. Default kind = `in-cluster` (operator owns the
    # weights and inference hardware behind the relay). Overlay the kind
    # to `commercial-contract` if the relay terminates at a third-party
    # provider; in that case `accountId` + `contractRef` become required.
    attestation:
      kind: "in-cluster"
      owner: ""

# ─── Geographic AUP enforcement ──────────────────────────────────────────
# Blocks requests from sanctioned regions on commercial-provider
# channels. US/EU export-control baseline by default. Operator extends
# per their jurisdiction's requirements. Reduction below baseline
# requires `geo.sanctionedRegions.allowRelaxation: true` AND a recorded
# justification reviewed by counsel.
geo:
  sanctionedRegions:
    block:
      - IR
      - KP
      - SY
      - CU
      - "RU-occupied-UA"
    allowRelaxation: false

# ─── Provider AUP enforcement ────────────────────────────────────────────
aup:
  enforcement: "provider-strictest"  # provider-strictest | per-channel | off

# ─── Audit log ───────────────────────────────────────────────────────────
audit:
  enabled: true
  retentionDays: 730
  # Default false — metadata only. Operator may opt in per privacy
  # posture; MUST be disclosed in customer ToS if enabled.
  logPromptContent: false

# ─── BYOK ────────────────────────────────────────────────────────────────
byok:
  scope: "request-scoped"          # request-scoped | never

# ─── Reseller disclosure ─────────────────────────────────────────────────
reseller:
  disclosureRequired: true

# ─── Catalyst integration ───────────────────────────────────────────────
# When enabled, the chart provisions a Kubernetes secret
# `catalyst-newapi-admin-token` consumed by Catalyst's signup hook to
# issue per-user API keys against NewAPI's admin API.
#
# ADR-0003 §3.2 + §6 binds this Secret. The unified-rbac service in the
# OTECH control plane reads it and `Authorization: Bearer <ADMIN_API_TOKEN>`
# against `http://newapi.newapi.svc/api/v1/admin/users` to issue per-user
# keys. Idempotency on `external_id` (return-existing api_key on 409) is
# the responsibility of the NewAPI admin API itself, not this chart.
catalystIntegration:
  enabled: true
  # ExternalSecret name carrying the admin API token NewAPI generates at
  # bootstrap. Required key: ADMIN_API_TOKEN. The token is rotated by
  # the operator on a schedule documented in
  # docs/CATALYST-CLI-AGENT.md.
  existingSecret: "catalyst-newapi-admin-token"

  # ExternalSecret render — gated, default true. Sources the admin token
  # from the operator's OpenBao via a ClusterSecretStore (default
  # `vault-region1`, the bp-external-secrets-stores default). The remote
  # path is operator-supplied; the canonical convention per
  # docs/INVIOLABLE-PRINCIPLES.md #4 is
  # `sovereign/<sovereign-fqdn>/newapi/admin-token` (under the store's
  # `secret/` mount) with property `ADMIN_API_TOKEN`. The cluster overlay
  # at `clusters/<sovereign>/bootstrap-kit/80-newapi.yaml` sets
  # `externalSecret.remoteRef.key` per Sovereign.
  externalSecret:
    enabled: true
    refreshInterval: "1h"
    secretStoreRef:
      # ClusterSecretStore (Catalyst default = `vault-region1`, shipped
      # by bp-external-secrets-stores). Overlays may swap to a
      # SecretStore by switching kind.
      kind: "ClusterSecretStore"
      name: "vault-region1"
    # Remote OpenBao path. Per ADR-0001 the secret-store backend is
    # OpenBao via the vault provider; the path uses the operator's
    # convention. Operator overlay supplies the per-Sovereign value.
    remoteRef:
      # `key` is the OpenBao path under the ClusterSecretStore's base
      # path (`secret/` in the Catalyst default). Operator overlay
      # supplies the per-Sovereign value, e.g.:
      #   sovereign/omantel.omani.works/newapi/admin-token
      key: ""
      # `property` is the JSON field inside the OpenBao secret holding
      # the bearer token used by the Catalyst signup hook (ADR-0003 §3.2).
      property: "ADMIN_API_TOKEN"

# ─── Service ─────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# ─── ServiceAccount ──────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""

# ─── Ingress + cert-manager TLS ──────────────────────────────────────────
# Two virtual hosts:
#   - `host`      : customer-facing OpenAI-compatible API at /v1/*
#   - `adminHost` : ops-staff admin UI (IdP-gated)
#
# The upstream's customer portal UI is disabled at ingress: only /v1/*
# and /api/* paths are exposed on `host`. Path-based deny rules block
# the upstream's React portal routes.
ingress:
  enabled: true
  className: "traefik"
  host: ""                        # operator-supplied (e.g. api.<sovereign-fqdn>)
  adminHost: ""                   # operator-supplied (e.g. admin.<sovereign-fqdn>)
  tls:
    enabled: true
    issuer: "letsencrypt-prod"    # cert-manager ClusterIssuer
    apiSecretName: "newapi-api-tls"
    adminSecretName: "newapi-admin-tls"
  # Path allowlist for the customer-facing host. Anything not on this
  # list returns 404. Locks down the upstream portal UI surface.
  customerAPIAllowedPaths:
    - "/v1/"
    - "/api/v1/"
    - "/api/status"
  # Traefik Middleware (path allowlist) is OFF by default. Sovereigns run
  # Cilium Gateway API which does not register the traefik.io/v1alpha1
  # Middleware CRD; rendering this resource on a Cilium Sovereign causes
  # a hard "no matches for kind Middleware" install failure. Enable only
  # on contabo-style Traefik clusters; on Cilium Sovereigns, path-level
  # locking down lives in the HTTPRoute layer (future work).
  middleware:
    enabled: false
  annotations: {}

# ─── NetworkPolicy ───────────────────────────────────────────────────────
# Default-allow ingress from the platform's gateway namespace; egress
# to Postgres, Valkey, Keycloak, in-cluster vLLM, DNS, and the operator-
# configured commercial-provider endpoints (egress for those is
# enforced by the cluster's egress gateway, not this NetworkPolicy).
networkPolicy:
  enabled: true
  ingress:
    fromNamespaceLabels:
      kubernetes.io/metadata.name: traefik
  egress:
    # bp-cnpg
    - namespaceLabel: cnpg-system
      port: 5432
    # bp-valkey
    - namespaceLabel: valkey
      port: 6379
    # bp-keycloak (OIDC discovery + token)
    - namespaceLabel: keycloak
      port: 8443
    # bp-vllm (in-cluster cheap-tier channel)
    - namespaceLabel: vllm
      port: 8000

# ─── ServiceMonitor ──────────────────────────────────────────────────────
# Default false per docs/BLUEPRINT-AUTHORING.md §11.2 (Observability
# toggles must default false). Operator opts in via per-cluster overlay
# once kube-prometheus-stack reconciles.
serviceMonitor:
  enabled: false
  interval: "30s"
  scrapeTimeout: "10s"
  path: "/metrics"
  labels: {}

# ─── HorizontalPodAutoscaler ─────────────────────────────────────────────
# Default false. Multi-tenant Sovereigns enable HPA via the per-cluster
# overlay once kube-prometheus-stack + metrics-server reconcile.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ─── Metering sidecar (#798) ─────────────────────────────────────────────
# Per-pod sidecar that:
#   1. Front-ends NewAPI as a transparent reverse proxy on its own port.
#   2. Observes successful /v1/* responses for OpenAI-style usage data.
#   3. Emits one envelope per completed LLM request on NATS subject
#      `catalyst.usage.recorded` (per #795 [Q-mine-3] + ADR-0001 §6).
#   4. Persists envelopes to disk + retries on NATS unreachable; the
#      customer-facing LLM call is NEVER blocked on metering.
#
# Architecture decision: NewAPI is consumed as upstream
# `ghcr.io/openova-io/openova/newapi-mirror` — a pinned mirror, NOT a
# fork we own. Patching the upstream binary to emit NATS would create
# rebase debt for every release. Observing the request/response pair at
# the network edge produces the same envelopes without forking; the
# OpenAI-compatible /v1/* response carries `usage.{prompt_tokens,
# completion_tokens, total_tokens}` that we project into the canonical
# envelope shape per `core/services/shared/events/nats.go`.
#
# The sidecar is enabled by default — a deployed bp-newapi without
# metering would silently drop billing data. Operators that explicitly
# do NOT want metering set `meteringSidecar.enabled: false` in the per-
# Sovereign overlay (only valid in regulated environments where every
# channel carries its own out-of-band ledger).
meteringSidecar:
  enabled: true

  image:
    # services-build CI publishes this image alongside the SME services
    # on every push to core/services/metering-sidecar/**.
    repository: ghcr.io/openova-io/openova/services-metering-sidecar
    tag: "latest"
    pullPolicy: IfNotPresent

  # The sidecar listens on this port; the Service routes traffic
  # (port 3000) → sidecar → newapi:3000-on-127.0.0.1. We expose the
  # sidecar at the same external port (3000) and have it forward
  # locally to NewAPI on a per-pod loopback address.
  port: 8086

  # Per-token price in micro-OMR. 1 OMR = 1,000,000 micro-OMR;
  # priceMicroOMRPerToken=156 means each token costs 0.000156 OMR
  # (~ 0.156 baisa per token). Operator overlays per region/channel.
  priceMicroOMRPerToken: 156

  # NATS broker URL. Empty → in-cluster default
  # (`nats://nats-jetstream.nats-system.svc.cluster.local:4222`). Per
  # docs/INVIOLABLE-PRINCIPLES.md #4 the sidecar accepts an explicit
  # override for cross-namespace or external-broker deployments.
  natsURL: ""
  natsPublishTimeout: "5s"

  # Spool directory for envelopes generated during a NATS outage. The
  # sidecar's background drain loop republishes once NATS recovers, so
  # persistence across pod restarts is unnecessary; an emptyDir is the
  # right shape (a pod restart during a NATS outage is rare, and on
  # the rare occasion it happens, NewAPI's own ledger backstops
  # reconciliation per #795 [Q-mine-4]).
  spoolDir: "/var/lib/metering-sidecar/spool"

  # HTTP header names the proxy reads for customer + tenant
  # identification. The cluster ingress / NewAPI's customer-API admin
  # layer is expected to inject these on every authenticated request.
  customerIDHeader: "X-Customer-Id"
  tenantIDHeader:   "X-Tenant-Id"

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
