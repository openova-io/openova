# Catalyst Blueprint scratch chart for NewAPI.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every
# operationally-meaningful value is configurable; cluster overlays in
# clusters/<sovereign>/bootstrap-kit/ may override any of these without
# rebuilding the Blueprint OCI artifact. The Sovereign FQDN, Keycloak
# issuer, channel endpoints, channel keys, and TLS issuer are all
# operator-supplied at install time.

catalystBlueprint:
  upstream:
    chart: "" # scratch chart — no upstream Helm chart
    version: ""
    repo: ""
    images:
      newapi: "ghcr.io/openova-io/openova/newapi-mirror"
# ─── Image pull secrets (issue #952) ─────────────────────────────────────
# Both the NewAPI mirror image and the metering sidecar live in PRIVATE
# ghcr.io/openova-io/openova/* repositories. Without an imagePullSecret
# on the Pod, kubelet cannot authenticate to pull them and the Pod stalls
# in ImagePullBackOff with a 403 Forbidden — blocking alice signup gate
# 5 (LLM) on every fresh Sovereign.
#
# `ghcr-pull` is the canonical name created in flux-system at cloud-init
# (infra/hetzner/cloudinit-control-plane.tftpl) and reflected into every
# bootstrap-kit namespace listed in the source Secret's
# `reflector.v1.k8s.emberstack.com/reflection-{allowed,auto}-namespaces`
# annotation. The newapi namespace is included in that list so this
# default works on every Sovereign without operator intervention. Per
# Inviolable Principle #4 the list is overrideable from per-Sovereign
# overlays (set to `[]` for clusters that pull from public repos only).
imagePullSecrets:
  - name: ghcr-pull
# ─── Placement role (#3831) ──────────────────────────────────────────────
# Splits the chart's render across two cooperating HelmReleases when newapi
# is re-homed INTO the mgmt vCluster (NorthStar #1: every app in a vCluster)
# while its CNPG-owner seams must stay HOST-side. See _helpers.tpl
# bp-newapi.renderSeams / bp-newapi.renderApp for the full contract.
#   all          (DEFAULT) — render everything (standalone / host-placed; a
#                no-op gate, fully backward-compatible).
#   host-seams   — render ONLY the host-reconciled seams (CNPG Cluster +
#                DSN-sync Job + admin-sso-seed Job/Cron + AppRegistration
#                ConfigMap + both ExternalSecrets). No app workload.
#   vcluster-app — render ONLY the app (Deployment + Service + HTTPRoute +
#                Application CR). No seams; the DSN Secret + CNPG Service are
#                delivered into the vCluster by the bp-mgmt-vcluster
#                sync.fromHost.secrets `newapi/*` mirror + replicateServices.
placement:
  role: all
# ─── Global registry rewrite (matches catalyst / continuum chart pattern) ──
# When set, the openova-io images (newapi-mirror, newapi-sandbox-bridge,
# services-metering-sidecar) route through this registry instead of ghcr.io.
# Per-Sovereign overlays leave this empty; the self-sovereign-cutover step-07
# image pivot (#4885) sets it to registry.<sovereign-fqdn> so those Pods pull
# from the Sovereign's own Harbor post-cutover (the step-08 deny-egress hold
# blocks ghcr.io). Empty = no rewrite. The 3rd-party helper images
# (harbor.openova.io proxy-dockerhub curl, proxy-ghcr postgres client) carry
# their own registry and are NOT rewritten. The bp-newapi.image helper in
# templates/_helpers.tpl performs the host-swap.
global:
  imageRegistry: ""
# ─── NewAPI application ──────────────────────────────────────────────────
newapi:
  enabled: true
  # Solo-Sovereign minimum — single replica. Per-Sovereign overlays bump
  # to 2+ once HA is needed (NewAPI is stateless once Postgres + Valkey
  # carry the persistent state).
  replicas: 1
  # Pin upstream image — DO NOT use floating tags per
  # docs/INVIOLABLE-PRINCIPLES.md #4. The chart references a
  # GHCR-mirrored image (operator's GHCR or OpenOva's mirror namespace)
  # to avoid pulling from Docker Hub at runtime. The mirror is built by
  # `.github/workflows/build-bp-newapi.yaml` — every push to
  # `platform/newapi/chart/**` triggers the mirror Job which captures the
  # upstream repo digest and re-tags into
  # `ghcr.io/openova-io/openova/newapi-mirror:<UPSTREAM_VER>`.
  #
  # Pre-2026-05-10 the chart referenced `:v0.4.5` — a tag that never
  # existed in any upstream OR in our GHCR (the original commit
  # 44d0200a invented the tag with no matching CI build). Every fresh
  # Sovereign's NewAPI Pod ImagePullBackOff'd, blocking alice signup
  # gate 5 (LLM). Bounded-cycle audit prov #7 Gap F.
  #
  # The tag is the upstream Calcium-Ion/new-api git tag (verbatim,
  # including the leading `v`). Bump in lockstep with
  # `.github/workflows/build-bp-newapi.yaml`'s `DEFAULT_UPSTREAM_VERSION`
  # AND `Chart.yaml` `appVersion` (which strips the leading `v` per
  # Helm convention).
  image:
    repository: ghcr.io/openova-io/openova/newapi-mirror
    tag: "v0.13.2"
    pullPolicy: IfNotPresent
  # NewAPI HTTP listener — port 3000 is the upstream default.
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2
      memory: 1Gi
  # SecurityContext — non-root.
  #
  # TBD-A11 (#1765, 2026-05-18): `fsGroup: 1000` added so kubelet chowns
  # the `/data` volume mount (emptyDir, see deployment.yaml `volumes:`)
  # to gid 1000 on mount. Pre-TBD-A11 the upstream NewAPI binary
  # (Calcium-Ion/new-api v0.13.2) crashed on startup with
  #   `mkdir /data/logs: permission denied`
  # because:
  #   1. The container ran as uid 1000 (`runAsUser` below).
  #   2. The upstream image's `/data` directory is owned by uid 0
  #      (its Dockerfile inherits from `node:alpine` + `golang:alpine`
  #      without an explicit chown).
  #   3. No volume was mounted at `/data`, so the binary's mkdir went
  #      against the container rootfs `/data` (root-owned, not
  #      writable by uid 1000 even with `readOnlyRootFilesystem:
  #      false`).
  # Caught on t22 2026-05-18 (Pod newapi-bp-newapi-* in
  # CrashLoopBackOff). The fix has two halves wired together — both
  # MUST stay in sync:
  #   a) THIS file: `fsGroup: 1000` so kubelet chowns the mount.
  #   b) deployment.yaml volumes: + volumeMounts: — emptyDir mounted at
  #      `/data`, sized 1Gi (upstream NewAPI writes log files +
  #      ephemeral runtime state here; sessions/credits/channels are
  #      persisted in Postgres via SQL_DSN, NOT on local disk, so an
  #      emptyDir is correct — restart loses logs only).
  # readOnlyRootFilesystem stays `false` until the upstream binary's
  # additional rootfs writes (e.g. /tmp temp files) are enumerated.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # Liveness / readiness / startup — NewAPI exposes /api/status (verified
  # via upstream code path controller/misc.go:GetStatus).
  #
  # TBD-A12 (#1798, 2026-05-18): on a freshly franchised Sovereign the
  # newapi DB is empty — GORM AutoMigrate runs CREATE TABLE for 26
  # models (Channel, Token, User, PasskeyCredential, Option, Redemption,
  # Ability, Log, Midjourney, TopUp, QuotaData, Task, Model, Vendor,
  # PrefillGroup, Setup, TwoFA, TwoFABackupCode, Checkin,
  # SubscriptionOrder, UserSubscription, SubscriptionPreConsumeRecord,
  # CustomOAuthProvider, UserOAuthBinding, SubscriptionPlan) plus two
  # column-type migrations (subscription_plans.price_amount → decimal,
  # tokens.model_limits → text). On a small (cpx21/cpx31) CNPG
  # primary with sslmode=require this first-boot migration takes 60-
  # 120s before the binary registers its Gin routes and the
  # `:3000/api/status` listener actually opens.
  #
  # Pre-A12 the liveness probe had `initialDelaySeconds: 30` +
  # `periodSeconds: 10` + `failureThreshold: 3` ⇒ kubelet SIGKILLed
  # newapi at the 50s mark, mid-migration. The empty newapi DB on t22
  # (chart 1.4.18) had zero tables after 29 restarts because every
  # restart killed the migration before it could create any. Symptom:
  # logs print `[SYS] ... database migration started` and then the
  # container terminates with exit code 2 (kubelet kill) ~50s later;
  # pg_stat_activity on the CNPG side shows no `newapi` user
  # connections (the kill races the GORM first-query DB.Migrator().
  # HasTable call against the wire).
  #
  # Fix: add a startupProbe that gates BOTH liveness and readiness for
  # up to 5 minutes (30 × 10s) before they activate. Liveness then
  # only kicks in once the binary has actually bound :3000. Readiness
  # initialDelaySeconds is unchanged because it short-circuits on the
  # startupProbe per kubelet semantics. failureThreshold of 30 covers
  # GORM AutoMigrate on PostgreSQL up to ~5 min — comfortably above
  # the observed 60-120s ceiling and below operator-impatience limits.
  probes:
    startup:
      path: /api/status
      port: 3000
      # Wait 10s before first poll to skip the token-encoder init phase
      # (~1s on cpx21) — the binary is single-threaded during this
      # phase and probing too early adds no signal.
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      # 30 × 10s = 5 minutes total budget for migration + first listen.
      failureThreshold: 30
    liveness:
      path: /api/status
      port: 3000
      # initialDelaySeconds is ignored when startupProbe is configured
      # (kubelet semantics: liveness starts after startup success).
      # Kept here for operator overlays that disable startupProbe.
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /api/status
      port: 3000
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
# ─── Postgres backend (bp-cnpg) ──────────────────────────────────────────
# NewAPI persists users, credits, channels, tokens, audit log to
# Postgres. Catalyst routes this to a managed Postgres provisioned via a
# Crossplane PostgresqlInstance claim against bp-cnpg. The DSN is
# operator-supplied via ExternalSecret; never hardcoded.
database:
  # ExternalSecret name carrying the full DSN. Required key: SQL_DSN
  # (e.g. "postgres://user:pass@host:5432/newapi?sslmode=require").
  # Pre-#943 this was REQUIRED — the deployment.yaml gate skipped Pod
  # render when empty, blocking alice signup gate 5 (LLM) on every
  # fresh Sovereign. Issue #943 (2026-05-05): when empty, the chart
  # auto-provisions via .Values.cnpg.* below and the Pod reads from
  # the chart-emitted DSN Secret. Operator may still set this to
  # bypass auto-provision and wire NewAPI at an external Postgres
  # (the contabo path historically did this via Crossplane).
  existingSecret: "" # operator-supplied (e.g. "newapi-db-dsn")
  existingSecretKey: "SQL_DSN"
# ─── SQL_DSN readiness gate (#3374) ──────────────────────────────────────
# An initContainer (wait-for-sql-dsn) that blocks the NewAPI container from
# booting until the chart-emitted DSN Secret has a NON-EMPTY SQL_DSN. Without
# it, the app boots on the placeholder empty DSN, silently falls back to an
# EPHEMERAL SQLite DB (`SQL_DSN not set, using SQLite as database`), and never
# reconnects to the correctly-seeded Postgres (the live #3374 newapi gap:
# stuck at /setup because the SSO-seeded admin lives in PG, not the pod's
# SQLite). Only renders when cnpg.enabled (operators wiring an external DB via
# database.existingSecret populate the DSN up-front, so no gate is needed —
# but it still passes immediately if they leave it on). Set enabled=false to
# opt out entirely.
databaseDsnGate:
  enabled: true
  # Default: the NewAPI image itself (same ghcr.io/openova-io/* glob as the main
  # container, so kyverno harbor-proxy-pull's anyPattern — which needs ONE glob
  # to match BOTH init + main containers — passes; a curl/proxy-dockerhub image
  # mixed with the openova-io main image matches no single glob and is denied,
  # #3461). The image has /bin/sh, which is all the file-poll gate needs.
  image: "" # default "<newapi.image.repository>:<newapi.image.tag>"
  timeoutSeconds: 300
  intervalSeconds: 5
# ─── CNPG-backed auto-provisioned Postgres (issue #943) ──────────────────
# When enabled (DEFAULT true), the chart renders templates/cnpg-cluster.yaml:
#   - postgresql.cnpg.io/v1.Cluster `<release>-newapi-pg`
#   - Secret `<release>-newapi-db-dsn` (key: SQL_DSN) read by the Pod
# The Cluster's auto-emitted basic-auth Secret is read via Helm `lookup`
# and the DSN string is composed at render time. Per Inviolable Principle
# #4 the instance count, image, storage, and SSL mode are all operator-
# tunable via per-Sovereign overlay.
#
# Capabilities-gated on postgresql.cnpg.io/v1 — when bp-cnpg is not yet
# Ready the Cluster CR is skipped and chart install does not fail.
cnpg:
  enabled: true
  # Override the auto-emitted DSN Secret name. Default empty ⇒ derived
  # from release name (`<release>-newapi-db-dsn`).
  dsnSecretName: ""
  # Database name created by CNPG initdb.
  database: newapi
  # SSL mode component of the DSN string. CNPG enforces TLS by default
  # so `require` matches the cluster's posture; operators may relax to
  # `prefer` on dev clusters by overlaying this value.
  sslMode: "require"
  cluster:
    instances: 1
    # CNPG postgres image (full ref incl tag). Defaults to the mothership
    # Harbor proxy cache (harbor.openova.io/proxy-ghcr) so fresh-prov
    # bootstrap pulls the ~300MB image through Harbor instead of throttling
    # on anonymous ghcr (#3058). PUBLIC image → proxy-ghcr serves it
    # cred-free. Post-cutover Step-04's containerd mirror redirects
    # harbor.openova.io → local Harbor.
    imageName: "harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql:16.4"
    storage: "5Gi"
    storageClassName: "" # empty ⇒ default StorageClass
    owner: "newapi"
    # Optional bootstrap SQL — empty by default. Operators may add
    # CREATE EXTENSION / additional databases here without forking
    # the chart.
    postInitApplicationSQL: []
    # #5374 (UAT row 238, live on hw288/beta-corp) — requests == limits
    # (Guaranteed QoS). CNPG stamps Cluster.spec.resources onto the
    # long-running instance pod (and its operator-injected
    # bootstrap-controller init container inherits the same block), so a
    # requests<limits shape here (the old 50m/128Mi vs 500m/512Mi) made
    # the per-Org DB pod Burstable — evictable under node pressure, and
    # DENIED outright on host-ns Org tiers whose plan-limits LimitRange
    # pins maxLimitRequestRatio {cpu:1, memory:1}. Same fix shape as
    # bp-postgres instance.resources (#4282). Sizing preserved: the
    # prior LIMITS stay the sizing; requests rise to meet them, so the
    # plan-quota limits-side accounting is byte-identical.
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi
# ─── Valkey cache (bp-valkey) ────────────────────────────────────────────
# Session store and rate-limit counters. Optional but recommended
# (NewAPI falls back to in-memory; in-memory loses state on restart).
valkey:
  enabled: true
  # bp-valkey installs the upstream bitnami chart with
  # architecture=replication; the writeable Service is named
  # `<release>-primary` (release = `valkey`). There is NO plain `valkey`
  # Service — pointing at `valkey.valkey.svc.cluster.local` resolves to
  # NXDOMAIN and the NewAPI pod CrashLoops on the Redis ping probe (issue
  # #1944 — t34 newapi pod 31x CrashLoopBackOff with
  # `lookup valkey.valkey.svc.cluster.local: no such host`).
  #
  # #4325 de-vcluster re-homed bp-valkey BACK to the native HOST namespace
  # `valkey` (placement.yaml slot 17 → vcluster: host, namespace: valkey); the
  # rtz plane vCluster + its syncer-mangled
  # `valkey-primary-x-valkey-x-rtz-vcluster.rtz.svc` are gone. The host `valkey`
  # namespace again carries the bitnami subchart's `valkey-primary` Service, so
  # the plain host-ns name resolves (ClusterIP confirmed live, #4376). The
  # subchart's primary Service is `<release>-primary` = `valkey-primary`.
  # Override `url` for an off-cluster Valkey.
  url: "redis://valkey-primary.valkey.svc.cluster.local:6379"
  # If the operator's Valkey requires auth, supply via ExternalSecret.
  # Required key: REDIS_CONN_STRING (full URL with credentials).
  existingSecret: "" # e.g. "newapi-valkey-conn"
  existingSecretKey: "REDIS_CONN_STRING"
# ─── App credentials (NewAPI-internal) ───────────────────────────────────
# SESSION_SECRET (random 32+ bytes) and CRYPTO_SECRET (random 32+ bytes)
# are NewAPI-internal cryptographic material.
#
# Issue #943 (2026-05-05): the chart auto-provisions these via
# templates/credentials-secret.yaml when autoProvision=true (DEFAULT)
# AND existingSecret is empty. Persistence across reconciles via Helm
# `lookup` — same load-bearing pattern as gitea-admin-secret (issue
# #830 Bug 2). Without this, every reconcile would invalidate every
# active session cookie and every encrypted token across NewAPI's user
# base. helm.sh/resource-policy: keep so a `helm uninstall` + reinstall
# recovers the same bytes.
#
# Operator may bring their own bytes via per-Sovereign overlay setting
# `existingSecret` — when non-empty it takes precedence and the chart-
# emitted Secret is NOT rendered.
#
# #5466 / #5480 (A16 class): on the sovereign-admin default path
# (placement.role=all + adminUI keycloak mode + ssoBridgeSync on +
# sovereignFQDN + sovereign-realm issuer + ESO CRD present) the chart-
# generated Secret is NOT rendered either — `lookup`-or-generate is
# per-cluster, so each region of a 2-region Sovereign minted a DIFFERENT
# SESSION_SECRET/CRYPTO_SECRET pair behind the one shared VIP and the
# peer region 401'd every session it did not mint (hw291 `[sessions]
# ERROR! securecookie: the value is not valid`, UAT rows 37/38). Instead
# templates/credentials-externalsecret.yaml resolves both values from
# the bp-sso-bridge-published OpenBao bundle sso/sovereign/<clientId>
# (session_secret #2807 / crypto_secret 0.2.27 — derived once per KC
# client), so EVERY region gets the same bytes — the identical carrier
# the OIDC client secret (#3374) and the oauth2-proxy cookie secret
# (#5416) already ride. Requires bp-sso-bridge >= 0.2.27.
credentials:
  existingSecret: "" # operator-supplied (e.g. "newapi-app-creds")
  autoProvision: true
  # Override the auto-emitted credentials Secret name. Default empty
  # ⇒ derived from release name (`<release>-app-creds`).
  autoSecretName: ""
# ─── Sandbox-token bridge signing key (PR #1638) ─────────────────────────
# Backs the real /admin/tokens/sandbox bridge handler (replaces PR #1619
# stub). The handler mints HS256 per-Sandbox tokens for use by Sandbox
# agent Pods on every NewAPI /v1/* call. Two pieces of secret material:
#
#   - SIGNING_KEY  — raw HS256 bytes (signs minted tokens; read by the
#                    bridge as env NEWAPI_TOKEN_SIGNING_KEY).
#   - ADMIN_SECRET — shared bearer the sandbox-controller presents on
#                    every POST /admin/tokens/sandbox (read by the
#                    bridge as env NEWAPI_ADMIN_SECRET).
#
# Issue parity with `credentials` (#943): chart auto-provisions via
# templates/sandbox-token-signing-key-secret.yaml when
# autoProvision=true (DEFAULT) AND existingSecret is empty. Persistent
# across reconciles via Helm `lookup`; helm.sh/resource-policy: keep so
# a `helm uninstall` + reinstall recovers the same bytes (otherwise an
# upgrade silently invalidates every per-Sandbox token across the
# Sovereign AND breaks the sandbox-controller's auth path).
#
# Operator may bring their own bytes via per-Sovereign overlay setting
# `existingSecret` — when non-empty THAT name takes precedence and the
# chart-emitted Secret is NOT rendered. The Secret MUST carry both
# `SIGNING_KEY` and `ADMIN_SECRET` keys; the deployment template gates
# on this.
sandboxTokenSigningKey:
  # Operator override. When non-empty, the chart does NOT render the
  # template/sandbox-token-signing-key-secret.yaml and reads from this
  # Secret directly. Required keys: SIGNING_KEY, ADMIN_SECRET.
  existingSecret: ""
  # When true (DEFAULT) the chart auto-emits the Secret with 64-char
  # alphanumeric values per field, lookup-persisted across reconciles.
  autoProvision: true
  # Override the auto-emitted Secret name. Default empty ⇒ derived
  # from release name (`<release>-token-signing-key`).
  autoSecretName: ""
  # Comma-separated list of namespaces emberstack/reflector should
  # mirror this Secret into. Defaults to
  # `catalyst-system,sandbox,sandbox-.*` —
  # `catalyst-system` is the canonical install namespace of the bp-
  # sandbox HelmRelease (clusters/_template/bootstrap-kit/19a-bp-
  # sandbox.yaml `targetNamespace: catalyst-system`). `sandbox` is
  # included for legacy overlays that still install into a dedicated
  # `sandbox` namespace + for any sister tooling (catalyst-api PATs
  # routed through the bridge) that wants the admin bearer locally.
  # `sandbox-.*` is an emberstack/reflector regex pattern (issue
  # emberstack/kubernetes-reflector#162 — comma-separated values are
  # interpreted as regexes) so the SIGNING_KEY is mirrored into every
  # per-Sandbox namespace `sandbox-<owner-uid>`. The per-Sandbox MCP
  # Deployment template (core/controllers/sandbox/internal/gitops/
  # manifests.go) mounts `SIGNING_KEY` as env `SANDBOX_JWT_SECRET` with
  # `optional: true`; without the regex pattern that mount silently
  # no-ops to empty and the MCP plugin's auth gate degrades to test-
  # mode (registry.go:71) — every bearer claim passes unvalidated.
  # TBD-V21 issue #2032.
  #
  # Per-Sovereign overlays may extend with additional commas (e.g.
  # `catalyst-system,sandbox,sandbox-.*,catalyst-controlplane`) when
  # other controllers need ADMIN_SECRET / SIGNING_KEY locally.
  #
  # IMPORTANT — this MUST contain the namespace the sandbox-controller
  # Deployment runs in. The chart in platform/sandbox/chart/templates/
  # deployment.yaml references Secret `newapi-bp-newapi-token-signing-
  # key` via secretKeyRef (optional: true). Without a reflected copy
  # in the controller's namespace, the env var lands empty + the
  # controller starts in gitops-only mode and never mints tokens
  # (silently degraded — operator-visible only via the controller's
  # startup log line).
  reflectorNamespaces: "catalyst-system,sandbox,sandbox-.*"
# ─── Auth: ops-staff admin UI ────────────────────────────────────────────
# The admin UI at admin.<host> is gated by the operator's IdP. Default
# mode is `keycloak` (OIDC against bp-keycloak). `masterKey` is allowed
# only for bootstrap-time access before Keycloak realm is ready.
auth:
  adminUI:
    mode: "keycloak" # keycloak | masterKey
    keycloak:
      issuer: "" # operator-supplied (e.g. "https://keycloak.<sovereign>/realms/ops")
      clientId: "newapi-admin"
      callbackPath: "/oauth/callback"
      # ExternalSecret carrying client_secret. Required key:
      # OIDC_CLIENT_SECRET.
      existingSecret: "" # e.g. "newapi-oidc"
      # #3374 — converge the client-secret with Keycloak. Emits an
      # AppRegistration ConfigMap (bp-sso-bridge mints `clientId` in the
      # SOVEREIGN realm + publishes the live KC secret to OpenBao
      # sso/sovereign/<clientId>) and an ExternalSecret that MERGES
      # OIDC_CLIENT_SECRET into `existingSecret`. The placeholder
      # keycloak-client-secret.yaml keeps the Pod bootable pre-publish.
      ssoBridgeSync:
        enabled: true
        externalSecretStoreName: vault-region1
        refreshInterval: 1h
    # Bootstrap-only master key. Set via ExternalSecret. Required key:
    # MASTER_KEY. The blueprint's smoke test ASSERTS this is unset on
    # production overlays.
    masterKeySecret: ""
  customerAPI:
    # `catalyst` (DEFAULT): customer-facing portal UI is disabled at
    # ingress. Catalyst issues per-user keys via NewAPI's admin API.
    # `self-serve`: customer-facing portal is enabled (NOT recommended
    # in Catalyst Sovereigns).
    keyIssuer: "catalyst"
# ─── Standard SSO-bootstrap contract (#3648) ─────────────────────────────
# This is the STANDARD, app-agnostic SSO-admin declaration that mirrors the
# Blueprint `spec.sso` contract — the SAME stanza every other app uses
# (grafana/harbor/gitea/openbao `sso.adminGroup`). It is the source of
# truth for WHO becomes admin (`adminGroup`) and HOW the first admin is
# seeded (`bootstrap.*`). The admin-sso-seed-job reads these FIRST and
# falls back to the legacy `adminSeed.*` keys only for back-compat, so a
# Sovereign overlay (or a future shared seed mechanism) configures newapi
# the same way it configures every other app — NOT through a newapi-bespoke
# key. The DB-direct SQL the chart runs is intrinsic to newapi's schema;
# only its PARAMETERISATION rides this standard contract.
sso:
  # The Sovereign-realm group whose members are elevated to newapi admin
  # (role=100). Elevation always keys on the group, never per-user.
  adminGroup: "sovereign-admins"
  bootstrap:
    # Seed newapi's first admin via the Sovereign SSO (Pattern B — newapi's
    # upstream has no group→role mechanism, so the chart seeds + promotes
    # DB-direct). Set false to skip the whole seed bundle.
    enabled: true
    # The in-app OIDC provider slug newapi trusts (custom_oauth_providers
    # .slug + the KC realm segment). Standard `sovereign`.
    providerSlug: "sovereign"
    # When true, also GATE newapi's OIDC provider on adminGroup membership
    # (deny non-members at the newapi boundary). Default OFF (the #3150
    # wire-proof≠walk lesson — a strict claim-format gate must never break
    # the owner's first landing).
    enforceAdminGroup: false
# ─── Admin-init + SSO-provider seed (#3374) ──────────────────────────────
# NewAPI 0.13.x stores OIDC providers + the root user in its Postgres DB,
# not env. Without seeding, a fresh Sovereign's newapi shows the
# "uninitialized" setup wizard and grants NO admin, and the owner can never
# land signed-in. templates/admin-sso-seed-job.yaml runs a DB-direct
# post-install/post-upgrade Job (+ a promote CronJob) that: writes a setups
# row (status:true), a system root user (role=100, SSO-only locked
# password ⇒ root_init:true), the sovereign-realm OIDC provider (the in-app
# SSO button), and promotes any SSO-authenticated user (oidc_id set) to
# root so the owner's first bare-URL login lands as admin. All DB-direct via
# the CNPG <cluster>-app Secret (the master-key path is asserted-unset by the
# smoke test). Requires cnpg.enabled + auth.adminUI.mode=keycloak +
# sovereignFQDN; otherwise the whole bundle is suppressed.
adminSeed:
  enabled: true
  # Username of the SSO-only system root account that satisfies
  # RootUserExists() (NewAPI's root_init flag). Never used to log in — its
  # password is a locked sentinel; the owner signs in via SSO and is promoted.
  rootUsername: "catalyst-root"
  # In-app OIDC provider card (NewAPI "Sign in with <name>" button).
  providerName: "OpenOva SSO"
  # Unique provider slug (custom_oauth_providers.slug). Also the KC realm
  # segment used to build the well-known/authorize/token/userinfo URLs.
  providerSlug: "sovereign"
  # Group whose members are elevated to admin. Elevation always keys on the
  # group, never per-user (#3374 law §5).
  adminGroup: "sovereign-admins"
  # #3374 (2026-06-14): NewAPI's public base URL, written into the `options`
  # table as `ServerAddress`. NewAPI builds the OAuth token-exchange
  # redirect_uri as `fmt.Sprintf("%s/oauth/%s", ServerAddress, slug)`
  # (upstream oauth/generic.go:97); the frontend builds the AUTHORIZE
  # redirect_uri as `${window.location.origin}/oauth/${slug}`
  # (web/.../use-oauth-login.ts:204). RFC-6749 §4.1.3 requires the
  # token-exchange redirect_uri to EXACTLY match the authorize one, so
  # ServerAddress MUST equal the browser origin `https://newapi.<fqdn>`.
  # When EMPTY, NewAPI's ServerAddress defaults to "" → token-exchange sends
  # the relative `/oauth/sovereign`, which never matches the absolute
  # authorize URI → Keycloak rejects the exchange with
  # `invalid_grant - Incorrect redirect_uri` → no session → the owner bounces
  # to /login?expired=true (measured live on hw133 2026-06-14, #3475 re-walk).
  # Default empty ⇒ the seed derives `https://newapi.<sovereignFQDN>` (the
  # canonical public host, == the ingress.httpRoute.host and the KC
  # newapi-admin client redirectUris). Operator overlay may override for a
  # non-standard public hostname.
  serverAddress: ""
  # When true, also GATE the newapi OIDC provider on adminGroup membership
  # (access_policy contains(groups, adminGroup)). Default OFF so a strict
  # claim-format mismatch can never break the owner's landing (the #3150
  # lesson — wire-proof ≠ walk). The realm catalyst-pin IdP already restricts
  # who can authenticate; the promote keys on oidc_id.
  enforceAdminGroup: false
  # How often the promote CronJob runs (owner's first SSO login → root within
  # this window). Default every minute.
  promoteSchedule: "* * * * *"
  image:
    pullPolicy: IfNotPresent
  backoffLimit: 6
  activeDeadlineSeconds: 420
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
# ─── Channels ────────────────────────────────────────────────────────────
# Operator-defined LLM provider channels. Every channel MUST carry a
# verifiable `attestation` block; render fails with a helpful error if
# any enabled channel lacks attestation. See blueprint.yaml configSchema
# and platform/newapi/README.md for the channel-tier model.
#
# Example (operator overrides this list in their per-Sovereign overlay):
#
# channels:
#   - name: qwen
#     type: vllm
#     endpoint: http://vllm.vllm.svc.cluster.local:8000/v1
#     models: ["Qwen/Qwen2.5-72B-Instruct"]
#     attestation:
#       kind: in-cluster
#       owner: "<sovereign-operator>"
#   - name: claude
#     type: anthropic
#     endpoint: https://api.anthropic.com
#     existingSecret: "newapi-channel-anthropic"
#     models: ["claude-sonnet-4-6", "claude-haiku-4-5"]
#     attestation:
#       kind: commercial-contract
#       accountId: "<anthropic-account-id>"
#       contractRef: "<internal-doc-link>"
#   - name: byok
#     type: byok-passthrough
#     attestation:
#       kind: byok
channels: []
# First-otech default vLLM channel. Disabled by default — opt-in per
# Sovereign via the bootstrap-kit overlay (slot 80-newapi.yaml). When
# `enabled: true` AND `endpoint != ""`, the chart composes a `vllm`-typed
# channel into the rendered channels list.
#
# Per docs/PRINCIPLES.md #4 (never hardcode), the endpoint and model
# identifiers are operator-supplied at install time. The chart's defaults
# here are empty so an unconfigured deploy does not silently wire
# customers to a third-party endpoint. Operators of each Sovereign supply
# their own upstream relay URL + API-key Secret via the per-Sovereign
# bootstrap-kit overlay.
defaultChannels:
  vllm:
    # Set true in the per-Sovereign bootstrap-kit overlay. When false,
    # this block is ignored and the channel is NOT composed.
    enabled: false
    # Customer-visible model prefix.
    name: "qwen"
    # Upstream vLLM endpoint URL. Operator-supplied. The chart never
    # bakes a default endpoint — `helm template` with
    # `defaultChannels.vllm.enabled: true` and an empty `endpoint` is a
    # configuration error caught at render time.
    endpoint: ""
    # Models exposed via this channel.
    models:
      - "qwen3-coder"
    # ExternalSecret name holding the upstream API key (omit for truly
    # in-cluster vLLM where no key is required).
    existingSecret: ""
    # Attestation block. Default kind = `in-cluster` (operator owns the
    # weights and inference hardware behind the relay). Overlay the kind
    # to `commercial-contract` if the relay terminates at a third-party
    # provider; in that case `accountId` + `contractRef` become required.
    attestation:
      kind: "in-cluster"
      owner: ""
  # ─── Qwen (partner-hosted first channel — issue #915) ────────────────
  # First-class default channel: a Qwen3-family model hosted at a
  # customer-managed LLM partner endpoint (model `qwen3-coder` / alias
  # `qwen3.6`). When `qwenPartner.enabled: true`, the chart:
  #   1. Composes this entry into the EFFECTIVE channels list as
  #      channel #1 (BEFORE any operator-supplied `.Values.channels`
  #      and BEFORE the generic `defaultChannels.vllm` block) — so a
  #      fresh customer landing on a fresh Sovereign gets routed here
  #      by default.
  #   2. Triggers the `channel-seed` post-install/post-upgrade Helm
  #      hook Job that probes NewAPI's admin API for the channel by
  #      name and POSTs it if missing (idempotent — re-runs after an
  #      upgrade are no-ops).
  #
  # Per docs/PRINCIPLES.md #4 (never hardcode), every knob below is
  # configurable via the per-Sovereign bootstrap-kit overlay. The
  # endpoint default is empty so a `helm template` with default values
  # does not silently wire customers to a third-party host; operators
  # supply the upstream relay URL via a Kubernetes Secret
  # (`newapi-channel-qwen-partner`) and per-Sovereign overlay. See
  # docs/RUNBOOKS.md §Operator-setup for the Secret schema.
  qwenPartner:
    # Toggle the channel composition + seed-Job render. Default false
    # so a CI smoke render produces no Job; per-Sovereign overlay flips
    # this true with the operator-supplied endpoint + ExternalSecret.
    enabled: false
    # Customer-visible channel name. Channel name is the human-readable
    # row label in NewAPI's admin UI AND is the idempotency key for
    # the seed Job's existence-probe (GET /api/channel/?keyword=<name>).
    #
    # F1a (2026-05-20, follow-up #2115): default is `qwen` — the short
    # customer-canonical name — so the row matches the sandbox-controller
    # default AllowedChannels=["qwen"] (envsubst
    # SANDBOX_DEFAULT_CHANNELS:-qwen at bootstrap-kit slot 19a:197). Pre-
    # fix the default included a partner-name suffix, which caused per-
    # Sandbox /v1/chat/completions to return 404 `channel not found`
    # (NewAPI's channel-router matches a token's allowed_channels against
    # rows by `name`).
    name: "qwen"
    # Upstream OpenAI-compatible endpoint URL. The chart leaves this
    # empty so an unconfigured deploy never silently dials a third-
    # party host. Per-Sovereign overlay sets it to the operator's
    # customer-managed LLM partner endpoint.
    endpoint: ""
    # Customer-facing model identifiers exposed via this channel. NewAPI
    # routes incoming requests whose `model` field matches any string
    # here to this channel. The default list contains both the
    # human-friendly `qwen3.6` alias (used in product docs) and the
    # upstream-canonical `qwen3-coder`.
    models:
      - "qwen3.6"
      - "qwen3-coder"
    # ExternalSecret name carrying the upstream API key under the
    # canonical key `API_KEY`. Operator overlay creates this Secret
    # (or wires an ExternalSecret pulling from OpenBao) before
    # enabling the channel; the seed Job mounts it and POSTs the
    # value as the channel's `key` field to NewAPI's admin API. The
    # canonical OpenBao path is
    # `sovereign/<sovereign-fqdn>/newapi/channel-qwen-partner` with
    # property `API_KEY` (operator overlay supplies the ExternalSecret).
    existingSecret: "newapi-channel-qwen-partner"
    # Secret key name holding the upstream API key.
    existingSecretKey: "API_KEY"
    # Channel attestation. When the relay terminates at a third-party
    # commercial provider, the attestation kind is `commercial-contract`
    # per platform/newapi/README.md compliance posture. Operator overlay
    # supplies `accountId` + `contractRef` (legal-team-owned doc link)
    # before flipping `enabled: true`.
    attestation:
      kind: "commercial-contract"
      accountId: ""
      contractRef: ""
# ─── Channel-seed Job (issue #915) ───────────────────────────────────────
# Post-install / post-upgrade Helm hook Job that POSTs default channels
# (currently `defaultChannels.qwenPartner`) into NewAPI's admin API
# so the FIRST customer request lands on a fully-wired channel, not a
# 404 / 400. The Job is idempotent: it probes existence via
# GET `/api/channel/?keyword=<name>` and skips channels that already
# exist; only newly-added entries POST against NewAPI.
#
# Authorization: NewAPI's admin API requires either a logged-in admin
# session cookie OR the bootstrap MASTER_KEY in the
# `Authorization: Bearer <master-key>` header. The seed Job mounts the
# operator-supplied master-key Secret (`auth.adminUI.masterKeySecret`)
# and uses it ONCE at install time. After bootstrap completes, the
# operator may rotate the master key out — channels persist in
# Postgres independent of the master key.
#
# Defaults to enabled=true so a Sovereign with `qwenPartner.enabled`
# also seeds the channel. Operators that load channels via an
# out-of-band controller flip this off to suppress the Job entirely.
channelSeed:
  enabled: true
  # Image for the curl-based seed loop. Pinned at the upstream-mutable
  # default tag; production overlays SHA-pin per
  # docs/INVIOLABLE-PRINCIPLES.md #4a.
  # #4347 — route through the Sovereign-local Harbor proxy-cache so the host-ns
  # Kyverno `harbor-proxy-pull` Enforce ClusterPolicy admits this post-install/
  # post-upgrade hook Job (applied on every reconcile, after #4325 re-homed
  # bp-newapi into the native host ns `newapi`). The raw `docker.io/curlimages/
  # curl` matches no allowed glob; the sibling db-dsn-sync Job already proxies
  # the identical image.
  image:
    repository: harbor.openova.io/proxy-dockerhub/curlimages/curl
    tag: "8.10.1"
    pullPolicy: IfNotPresent
  # Resource budget — small. Each channel is one GET (probe) + zero
  # or one POST against the in-cluster NewAPI Service.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  # Hook delete policy — keep the most recent Job around for operator
  # forensics (`kubectl logs job/<release>-channel-seed`) but delete
  # the previous one before each install/upgrade so we don't pile up
  # immutable Jobs across upgrades.
  hookDeletePolicy: "before-hook-creation"
  # backoffLimit — retries on transient errors (NewAPI Pod still
  # warming up post-rollout) before the Job marks itself Failed.
  backoffLimit: 6
  # activeDeadlineSeconds — upper bound on Job runtime. 5 minutes
  # is generous for a single-channel seed loop that retries through
  # NewAPI's startup window.
  activeDeadlineSeconds: 300
# ─── Geographic AUP enforcement ──────────────────────────────────────────
# Blocks requests from sanctioned regions on commercial-provider
# channels. US/EU export-control baseline by default. Operator extends
# per their jurisdiction's requirements. Reduction below baseline
# requires `geo.sanctionedRegions.allowRelaxation: true` AND a recorded
# justification reviewed by counsel.
geo:
  sanctionedRegions:
    block:
      - IR
      - KP
      - SY
      - CU
      - "RU-occupied-UA"
    allowRelaxation: false
# ─── Provider AUP enforcement ────────────────────────────────────────────
aup:
  enforcement: "provider-strictest" # provider-strictest | per-channel | off
# ─── Audit log ───────────────────────────────────────────────────────────
audit:
  enabled: true
  retentionDays: 730
  # Default false — metadata only. Operator may opt in per privacy
  # posture; MUST be disclosed in customer ToS if enabled.
  logPromptContent: false
# ─── BYOK ────────────────────────────────────────────────────────────────
byok:
  scope: "request-scoped" # request-scoped | never
# ─── Reseller disclosure ─────────────────────────────────────────────────
reseller:
  disclosureRequired: true
# ─── Catalyst integration ───────────────────────────────────────────────
# When enabled, the chart provisions a Kubernetes secret
# `catalyst-newapi-admin-token` consumed by Catalyst's signup hook to
# issue per-user API keys against NewAPI's admin API.
#
# ADR-0003 §3.2 + §6 binds this Secret. The unified-rbac service in the
# OTECH control plane reads it and `Authorization: Bearer <ADMIN_API_TOKEN>`
# against `http://newapi.newapi.svc/api/v1/admin/users` to issue per-user
# keys. Idempotency on `external_id` (return-existing api_key on 409) is
# the responsibility of the NewAPI admin API itself, not this chart.
catalystIntegration:
  enabled: true
  # ExternalSecret name carrying the admin API token. The token value is
  # NewAPI's bridge ADMIN_SECRET (the bearer the sandbox-bridge validates),
  # propagated into OpenBao by catalyst-api's seedNewapiAdminToken seam at
  # provisioning time (#4477) and distributed back via this ExternalSecret.
  # Required key: ADMIN_API_TOKEN. Rotation: re-running the seam (every Org
  # reconcile) re-propagates the current bridge ADMIN_SECRET, so a manual
  # rotation of the token-signing-key Secret self-heals on the next reconcile.
  existingSecret: "catalyst-newapi-admin-token"
  # Comma-separated list of namespaces emberstack/reflector mirrors the
  # rendered Secret into (TBD-V15 / #2021). Default `catalyst-system`
  # is the canonical install namespace of bp-catalyst-platform's
  # catalyst-api Deployment, which consumes ADMIN_API_TOKEN via
  # secretKeyRef as CATALYST_NEWAPI_ADMIN_TOKEN to drive the ADR-0003
  # §3.2 user-create hook. The Kubernetes secretKeyRef is same-
  # namespace-only, so the reflector mirror is the canonical cross-
  # namespace seam (same pattern as org-services-secrets in the bp-catalyst-
  # platform chart). Operator overlays MAY widen this list when other
  # controllers in other namespaces need the same bearer locally.
  reflectorNamespaces: "catalyst-system"
  # ExternalSecret render — gated, default true. Sources the admin token
  # from the Sovereign's OpenBao via a ClusterSecretStore (default
  # `vault-region1`, the bp-external-secrets-stores default). The remote
  # path is WRITTEN by catalyst-api's seedNewapiAdminToken seam (#4477):
  # the canonical, cluster-shared path is `catalyst/newapi/admin-token`
  # (under the store's `secret/` mount) with property `ADMIN_API_TOKEN`.
  # The `catalyst/` prefix is the ONLY sub-tree a Sovereign's catalyst-api
  # can write (its `catalyst-api-write` OpenBao role is scoped to
  # `secret/{data,metadata}/catalyst/*`), so the producer + this read-path
  # share the prefix in lock-step. The cluster overlay at
  # `clusters/<sovereign>/bootstrap-kit/80-newapi.yaml` sets
  # `externalSecret.remoteRef.key` (default template ships
  # `catalyst/newapi/admin-token`).
  externalSecret:
    enabled: true
    refreshInterval: "1h"
    secretStoreRef:
      # ClusterSecretStore (Catalyst default = `vault-region1`, shipped
      # by bp-external-secrets-stores). Overlays may swap to a
      # SecretStore by switching kind.
      kind: "ClusterSecretStore"
      name: "vault-region1"
    # Remote OpenBao path. Per ADR-0001 the secret-store backend is
    # OpenBao via the vault provider; the path uses the operator's
    # convention. Operator overlay supplies the per-Sovereign value.
    remoteRef:
      # `key` is the OpenBao path under the ClusterSecretStore's base
      # path (`secret/` in the Catalyst default). Written by catalyst-api's
      # seedNewapiAdminToken seam (#4477); the cluster overlay ships the
      # canonical cluster-shared value:
      #   catalyst/newapi/admin-token
      key: ""
      # `property` is the JSON field inside the OpenBao secret holding
      # the bearer token used by the Catalyst signup hook (ADR-0003 §3.2).
      property: "ADMIN_API_TOKEN"
  # ─── Region-local admin-token producer (#5375, UAT row M2) ──────────────
  # PushSecret (templates/admin-token-pushsecret.yaml) that seeds the OpenBao
  # path the ExternalSecret above reads, FROM the region-local token-signing-
  # key Secret's ADMIN_SECRET. Closes the M2 DR gap: catalyst-api's #4477
  # seed runs only in the primary region, and each region runs its own
  # OpenBao, so without this region-B's catalyst-newapi-admin-token
  # ExternalSecret stays SecretSyncedError forever (path absent in region-B's
  # vault) and a post-region-kill promote has no NewAPI admin bearer. The
  # push value is deliberately REGION-LOCAL — it must byte-match the local
  # sandbox-bridge's ADMIN_SECRET (subtle.ConstantTimeCompare), so
  # replicating region-A's value cross-region would 401 in region-B.
  # Store ref + remote path reuse externalSecret.* above (never drift).
  pushSecret:
    # Default ON wherever the app renders. The template additionally gates on
    # the external-secrets.io/v1alpha1 CRD being registered (cold-install
    # safety, same pattern as the ExternalSecret's v1beta1 gate).
    enabled: true
    # Reconcile cadence; also the max lag for a token-signing-key rotation to
    # reach the vault path. ESO skips the write when the remote value already
    # matches, so steady state costs one read per interval.
    refreshInterval: "1h"
    # Replace keeps the vault path following the live bridge secret.
    updatePolicy: "Replace"
    # Key inside the token-signing-key Secret holding the bridge bearer.
    sourceKey: "ADMIN_SECRET"
# ─── External-Secrets webhook readiness gate (Fix #138, prov #20) ────────
# Pre-install/pre-upgrade hook that polls the external-secrets validating-
# admission webhook until it serves a structured response (HTTP 200/400/
# 405/415/422). Closes the race between bp-external-secrets reaching
# HR Ready=True (Pods Ready) and the apiserver-side EndpointSlice for
# the webhook Service being observable by the admission controller.
#
# Without this gate the chart's templates/external-secret.yaml apply
# attempt fails with:
#   Internal error occurred: failed calling webhook
#   "validate.externalsecret.external-secrets.io": ... no endpoints
#   available for service "external-secrets-webhook"
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 every knob is operator-tunable
# via per-Sovereign overlay (e.g. swap to a different webhook namespace
# if external-secrets is provisioned via a non-Catalyst distribution).
# Per #3 the gate is event-driven (probe-then-proceed), NOT a blanket
# `helm install --timeout`.
externalSecretsWebhookGate:
  # Default ON. Set false ONLY on Sovereigns where external-secrets is
  # provisioned outside the Catalyst bootstrap-kit and the operator has
  # confirmed the webhook is already serving by the time bp-newapi
  # installs (rare; recommended to leave true).
  enabled: true
  # Webhook Service name (default = upstream external-secrets chart's
  # `<release>-webhook` Service when releaseName is `external-secrets`).
  service: "external-secrets-webhook"
  # Namespace the webhook Service lives in. Catalyst default per
  # clusters/_template/bootstrap-kit/15-external-secrets.yaml.
  namespace: "external-secrets-system"
  # HTTPS port the webhook serves on (upstream chart default is 443).
  port: 443
  # Validation path for ExternalSecret resources. Sourced from upstream
  # chart's templates/validatingwebhook.yaml — different from the
  # ClusterSecretStore path (used by bp-external-secrets-stores in Fix
  # #137); each consumer probes its own validation endpoint.
  path: "/validate-external-secrets-io-v1beta1-externalsecret"
  # Wall-clock budget. 60s comfortably exceeds the typical 5–15s
  # EndpointSlice propagation window observed across fresh provisions.
  timeoutSeconds: 60
  # Probe interval inside the wall-clock budget.
  intervalSeconds: 2
# ─── Service ─────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
# ─── ServiceAccount ──────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
# ─── Ingress + cert-manager TLS ──────────────────────────────────────────
# Two virtual hosts:
#   - `host`      : customer-facing OpenAI-compatible API at /v1/*
#   - `adminHost` : ops-staff admin UI (IdP-gated)
#
# The upstream's customer portal UI is disabled at ingress: only /v1/*
# and /api/* paths are exposed on `host`. Path-based deny rules block
# the upstream's React portal routes.
ingress:
  enabled: true
  className: "traefik"
  host: "" # operator-supplied (e.g. api.<sovereign-fqdn>)
  # Wave 5.81 (#2412): adminHost RIPPED. Ops-staff admin via Catalyst
  # BSS console (https://console.<sov-fqdn>/bss/*) per founder ruling
  # 2026-05-18. No separate admin.<sov-fqdn> hostname.
  tls:
    enabled: true
    # DNS-01 PowerDNS ClusterIssuer — canonical per-Org Sovereign issuer
    # (#4246). `letsencrypt-prod` does not exist on a real Sovereign.
    issuer: "letsencrypt-dns01-prod-powerdns" # cert-manager ClusterIssuer
    apiSecretName: "newapi-api-tls"
  # Path allowlist for the customer-facing host. Anything not on this
  # list returns 404. Locks down the upstream portal UI surface.
  customerAPIAllowedPaths:
    - "/v1/"
    - "/api/v1/"
    - "/api/status"
  # Traefik Middleware (path allowlist) is OFF by default. Sovereigns run
  # Cilium Gateway API which does not register the traefik.io/v1alpha1
  # Middleware CRD; rendering this resource on a Cilium Sovereign causes
  # a hard "no matches for kind Middleware" install failure. Enable only
  # on contabo-style Traefik clusters; on Cilium Sovereigns, path-level
  # locking down lives in the HTTPRoute layer (future work).
  middleware:
    enabled: false
  annotations: {}
  # ─── Cilium Gateway HTTPRoute (TBD-D35d / issue #1778) ─────────────────
  # Dedicated HTTPRoute for `newapi.<sovereign-fqdn>` (the LLM-gateway
  # public hostname Sandbox runtimes hit via MintSandboxToken-emitted
  # `NEWAPI_BASE_URL=https://newapi.<fqdn>/v1`).
  #
  # Why a chart-managed HTTPRoute on Sovereigns: Catalyst's marketplace
  # chart ships a `tenant-wildcard` HTTPRoute with `hostnames=*.<fqdn>`
  # that backendRefs to `console`. Gateway API hostname matching prefers
  # the most specific listener — an exact `newapi.<fqdn>` HTTPRoute wins
  # over the `*.<fqdn>` wildcard — so this template restores newapi's
  # public reachability without modifying the marketplace wildcard.
  #
  # Backend lives in the SAME `newapi` namespace as this chart (Service
  # `newapi.newapi.svc:3000`), so no cross-namespace ReferenceGrant is
  # required. parentRef defaults to `kube-system/cilium-gateway` (the
  # Sovereign canonical Gateway shipped by sovereign-tls/cilium-gateway.yaml).
  #
  # Default OFF (`enabled: false`) — contabo-style Traefik clusters
  # remain on the Traefik Ingress above. The Catalyst bootstrap-kit
  # overlay (`clusters/_template/bootstrap-kit/80-newapi.yaml`) flips
  # this to true for Sovereign installs.
  httpRoute:
    enabled: false
    # Hostname for the HTTPRoute. Defaults to "newapi.<sovereignFQDN>"
    # when empty AND .Values.sovereignFQDN is set; otherwise template
    # render skips.
    host: ""
    parentRef:
      name: cilium-gateway
      namespace: kube-system
      # sectionName intentionally empty — multi-zone Sovereigns rename
      # HTTPS listeners to https-<sanitised-zone> (e.g. https-omani-works,
      # https-omani-homes), so pinning sectionName: https breaks every
      # public HTTPRoute with NoMatchingListener. Cilium Gateway selects
      # the listener by hostname filter when sectionName is omitted. See
      # PR #1888 (catalyst-system) / TBD-A40 / issue #1902. Operators may
      # still override via a bootstrap-kit overlay for non-Cilium
      # gateways that REQUIRE an explicit sectionName.
      sectionName: ""
# ─── Gateway backend override (#3373 fix (a)) ────────────────────────────
# Same key shape as the gitea/harbor/openbao/grafana/powerdns charts
# (`gateway.backendService`) for slot-side uniformity.
gateway:
  # #3373 fix (a): when this chart installs inside a vCluster, the slot
  # overrides this with the host-side syncer-mangled Service name
  # (<svc>-x-<ns>-x-<vcluster>). Empty = chart-computed name (host
  # install, byte-identical).
  backendService: ""
  # #3374 (2026-06-18): the HTTPRoute's Exact `/` rule (zero-click bare-URL SSO
  # landing) backendRefs the dedicated bridge-only Service
  # (<fullname>-bridge, publishNotReadyAddresses:true). When this chart
  # installs inside a vCluster the syncer mangles that Service name to
  # <svc>-x-<ns>-x-<vcluster>; set this override to the host-side synced name.
  # Empty = chart-computed <fullname>-bridge (host install, byte-identical).
  bridgeBackendService: ""
# ─── NetworkPolicy ───────────────────────────────────────────────────────
# Default-allow ingress from the platform's gateway namespace; egress
# to Postgres, Valkey (now in the rtz host namespace — #3373 Batch A),
# Keycloak, in-cluster vLLM, DNS, and the operator-configured
# commercial-provider endpoints (egress for those is enforced by the
# cluster's egress gateway, not this NetworkPolicy).
networkPolicy:
  enabled: true
  ingress:
    fromNamespaceLabels:
      kubernetes.io/metadata.name: traefik
    # Wave 5.57a (#2299) — additional namespaces allowed to call newapi
    # ingress, rendered as additional namespaceSelector entries by the
    # template. catalyst-system contains sandbox-controller which calls
    # /admin/tokens/sandbox for per-Sandbox token mint. Operator can add
    # more namespaces per-Sovereign overlay without overriding the
    # primary fromNamespaceLabels.
    allowedFromNamespaces:
      - catalyst-system
    # #3374: admit Cilium Gateway API traffic. Gateway-proxied requests
    # reach the Pod with the reserved `ingress` ENTITY identity, which no
    # K8s NetworkPolicy selector can express — without this CNP every
    # external hit to newapi.<fqdn> times out (measured live on hw130,
    # 2026-06-13). Renders templates/cilium-ingress-networkpolicy.yaml.
    allowGatewayEntity: true
  egress:
    # NOTE: bp-cnpg egress is NOT listed here — it is rendered
    # directly in templates/networkpolicy.yaml when `.Values.cnpg.enabled`
    # so the rule can pod-select by `cnpg.io/cluster=<clusterName>`
    # (issue #1901). The CNPG operator runs in `cnpg-system` but the
    # actual Postgres Pods reconcile into `.Release.Namespace` (this
    # blueprint's namespace), which `cnpg-system` namespaceSelector
    # could never reach.
    # bp-valkey — #3373 Batch A (2026-06-14) moved bp-valkey INTO the rtz
    # vCluster (placement.yaml: `bp-valkey → vcluster: rtz, namespace:
    # valkey`). The bp-rtz-vcluster syncer reflects the in-vCluster
    # #4325 de-vcluster re-homed bp-valkey BACK to the native HOST namespace
    # `valkey`; the rtz plane vCluster + its `rtz` host namespace are gone.
    # This egress rule MUST select the `valkey` namespace where the
    # `valkey-primary` Service now lives; otherwise newapi's egress to
    # valkey:6379 is denied and the Pod CrashLoops on the Redis ping probe
    # (`Redis ping test failed`, the hw135 #3374 shape).
    - namespaceLabel: valkey
      port: 6379
    # bp-keycloak (OIDC discovery + token)
    - namespaceLabel: keycloak
      port: 8443
    # bp-vllm (in-cluster cheap-tier channel)
    - namespaceLabel: vllm
      port: 8000
# ─── ServiceMonitor ──────────────────────────────────────────────────────
# Default false per docs/BLUEPRINT-AUTHORING.md §11.2 (Observability
# toggles must default false). Operator opts in via per-cluster overlay
# once kube-prometheus-stack reconciles.
serviceMonitor:
  enabled: false
  interval: "30s"
  scrapeTimeout: "10s"
  path: "/metrics"
  labels: {}
# ─── HorizontalPodAutoscaler ─────────────────────────────────────────────
# Default false. Multi-tenant Sovereigns enable HPA via the per-cluster
# overlay once kube-prometheus-stack + metrics-server reconcile.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
# ─── Metering sidecar (#798) ─────────────────────────────────────────────
# Per-pod sidecar that:
#   1. Front-ends NewAPI as a transparent reverse proxy on its own port.
#   2. Observes successful /v1/* responses for OpenAI-style usage data.
#   3. Emits one envelope per completed LLM request on NATS subject
#      `catalyst.usage.recorded` (per #795 [Q-mine-3] + ADR-0001 §6).
#   4. Persists envelopes to disk + retries on NATS unreachable; the
#      customer-facing LLM call is NEVER blocked on metering.
#
# Architecture decision: NewAPI is consumed as upstream
# `ghcr.io/openova-io/openova/newapi-mirror` — a pinned mirror, NOT a
# fork we own. Patching the upstream binary to emit NATS would create
# rebase debt for every release. Observing the request/response pair at
# the network edge produces the same envelopes without forking; the
# OpenAI-compatible /v1/* response carries `usage.{prompt_tokens,
# completion_tokens, total_tokens}` that we project into the canonical
# envelope shape per `core/services/shared/events/nats.go`.
#
# The sidecar is enabled by default — a deployed bp-newapi without
# metering would silently drop billing data. Operators that explicitly
# do NOT want metering set `meteringSidecar.enabled: false` in the per-
# Sovereign overlay (only valid in regulated environments where every
# channel carries its own out-of-band ledger).

# Sandbox-bridge sidecar (Wave 5.57, Refs #2303). Catalyst-side bridge
# handler for POST /admin/tokens/sandbox — the upstream Calcium-Ion
# binary has no such route, so without this sidecar sandbox-controller's
# token-mint call hits the binary's default 404 HTML page (the "decode
# response: invalid character '<'" failure mode observed on hw01
# 2026-05-24). Built by .github/workflows/build-bp-newapi-sandbox-
# bridge.yaml from platform/newapi/internal/handler.
# ─── Zero-click bare-URL SSO landing (#3374) ─────────────────────────────
# NewAPI's embedded React SPA (pinned mirror, not a fork) serves a
# marketing/login homepage at `/` and only fires the OIDC flow on a click.
# To honour the #3374 zero-click contract, the sandbox-bridge sidecar serves
# a SAME-ORIGIN init page at the bare root that runs NewAPI's own
# onCustomOAuthClicked sequence (GET /api/oauth/state → /api/status → redirect
# to the Keycloak authorize URL with kc_idp_hint=catalyst-pin). The HTTPRoute
# routes ONLY the bare root (Exact `/`) to the bridge; everything else flows
# to NewAPI. oauth2-proxy is NOT used here — NewAPI authenticates only via its
# own DB-backed session cookie and ignores proxy-auth headers, so a front-door
# proxy would not log the user into NewAPI; and a static gateway 302 fails
# NewAPI's callback CSRF check (the `state` must be minted same-origin first).
#
# Requires sandboxBridge.enabled (the bridge sidecar serves the page). The
# provider slug is taken from adminSeed.providerSlug (default "sovereign").
# Set enabled=false to serve NewAPI's own homepage at `/` instead.
ssoInit:
  enabled: true
sandboxBridge:
  enabled: true
  # #3374 (2026-06-18): run the bridge as a NATIVE sidecar (initContainers
  # entry with restartPolicy:Always) instead of a plain container. This is the
  # real fix for the hw159 1st-hit `upstream-connect-error ... delayed connect
  # error: 111` on the bare URL: as a plain container the bridge (a) did not
  # start until the wait-for-sql-dsn initContainer completed, and (b) had its
  # Service endpoint suppressed because a Pod only joins a Service's
  # EndpointSlice when ALL containers are Ready — and the `newapi` container is
  # NotReady for ~2 min during GORM AutoMigrate. As a native sidecar declared
  # FIRST it starts immediately (before the DSN gate) and runs the whole Pod
  # lifetime, so paired with the bridge-only Service (publishNotReadyAddresses)
  # the zero-click landing page is reachable on the 1st hit. Native sidecars
  # are GA in k8s 1.29 (Sovereigns run k3s v1.31.4). Set false to fall back to
  # the legacy plain-container bridge (e.g. a pre-1.29 cluster).
  nativeSidecar: true
  image:
    repository: ghcr.io/openova-io/openova/newapi-sandbox-bridge
    # Wave 5.57d (#2303, 2026-05-24): switch to `:latest` + pullPolicy
    # Always so Flux re-pulls on every reconcile. Pre-fix: the chart
    # pinned tag `be382d4` (the build SHA at Wave 5.57 ship) with
    # IfNotPresent. On hw01 the kubelet had a stale image cache from
    # an earlier failed pull attempt; subsequent Flux reconciles
    # didn't re-pull, so the Pod kept running OLD image bytes
    # (effectively no sandbox-bridge listener) despite the chart
    # bumping to 1.4.45 / 1.4.46. Using `:latest` + Always trades
    # immutability for cold-pull rollout reliability — acceptable for
    # a sidecar that's already opt-in-disable-able via
    # sandboxBridge.enabled. Operator overlays can pin to a specific
    # SHA + IfNotPresent if they want air-gap-friendly behavior.
    tag: "1196146"
    pullPolicy: Always
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
meteringSidecar:
  enabled: true
  image:
    # services-build CI publishes this image alongside the Organization services
    # on every push to core/services/metering-sidecar/**.
    repository: ghcr.io/openova-io/openova/services-metering-sidecar
    # Pinned SHA, not :latest — a mutable :latest tag forces a fresh manifest
    # resolve on every reschedule, which ImagePullBackOff'd newapi on hw99
    # (live 2026-06-07) when the :latest pull transiently failed. 41e02c8 is
    # the most-recent services-build publish (= the content :latest pointed
    # at); a fixed digest with IfNotPresent is deterministic + cache-friendly.
    tag: "41e02c8"
    pullPolicy: IfNotPresent
  # The sidecar listens on this port; the Service routes traffic
  # (port 3000) → sidecar → newapi:3000-on-127.0.0.1. We expose the
  # sidecar at the same external port (3000) and have it forward
  # locally to NewAPI on a per-pod loopback address.
  port: 8086
  # Per-token price in micro-OMR. 1 OMR = 1,000,000 micro-OMR;
  # priceMicroOMRPerToken=156 means each token costs 0.000156 OMR
  # (~ 0.156 baisa per token). Operator overlays per region/channel.
  priceMicroOMRPerToken: 156
  # NATS broker URL. Empty → in-cluster default
  # (`nats://nats-jetstream.nats-system.svc.cluster.local:4222`). Per
  # docs/INVIOLABLE-PRINCIPLES.md #4 the sidecar accepts an explicit
  # override for cross-namespace or external-broker deployments.
  natsURL: ""
  natsPublishTimeout: "5s"
  # Spool directory for envelopes generated during a NATS outage. The
  # sidecar's background drain loop republishes once NATS recovers, so
  # persistence across pod restarts is unnecessary; an emptyDir is the
  # right shape (a pod restart during a NATS outage is rare, and on
  # the rare occasion it happens, NewAPI's own ledger backstops
  # reconciliation per #795 [Q-mine-4]).
  spoolDir: "/var/lib/metering-sidecar/spool"
  # HTTP header names the proxy reads for customer + tenant
  # identification. The cluster ingress / NewAPI's customer-API admin
  # layer is expected to inject these on every authenticated request.
  customerIDHeader: "X-Customer-Id"
  tenantIDHeader: "X-Tenant-Id"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
# ── Bootstrap self-registration (#3687, extends #3370) ───────────────────
# When a bootstrap-kit slot installs this chart, it flips
# bootstrapOwned.enabled=true so templates/application-cr.yaml renders the
# canonical apps.openova.io/v1 Application CR for the slot's HelmRelease
# (the instance card every console surface reads — /apps, Topology,
# showback). Default OFF so console-created instances are not double-carded.
# helmRelease names the owning Flux HelmRelease (the controller's adoption
# path mirrors its Ready condition); namespace is where that HR object
# lives (flux-system for the slot 80 HR).
bootstrapOwned:
  enabled: false
  # Canonical placement token stamped onto the self-registered Application
  # CR's spec.placement (#3375 DoD-1 / #3768 / #3786). MUST be a canonical
  # mode (singleton / active-active / active-hot-standby / active-passive) —
  # NEVER the banned legacy dialect single-region / active-hotstandby, which
  # the read path (readTopology) would surface verbatim to the operator. A
  # leaf bootstrap app installs as one copy, so singleton is the truthful
  # effective mode.
  placement: singleton
  helmRelease:
    name: ""
    namespace: flux-system
