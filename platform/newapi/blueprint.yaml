apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-newapi
spec:
  version: 1.4.172
  card:
    title: NewAPI
    summary: "Multi-tenant LLM marketplace gateway. Wraps the upstream NewAPI (github.com/Calcium-Ion/new-api, MIT, fork of OneAPI) with credits, per-key budgets, channel routing, and BYOK as first-class primitives. Deployed in **backend-only** mode: the OpenAI-compatible API at `api.<host>/v1/*` is customer-facing; the upstream's portal UI is disabled at ingress; Catalyst replaces it as the customer surface; NewAPI's admin UI at `admin.<host>` is exposed only to ops staff (IdP-gated). Compliance posture (channel attestation, geographic AUP, BYOK isolation, reseller disclosure) enforced at the blueprint layer. Use `bp-newapi` when the Sovereign operator's business model is reselling LLM access to its own customers; use `bp-llm-gateway` for self-consumption. "
    description: "Multi-tenant LLM marketplace gateway. Wraps the upstream NewAPI (github.com/Calcium-Ion/new-api, MIT, fork of OneAPI) with credits, per-key budgets, channel routing, and BYOK as first-class primitives. Deployed in **backend-only** mode: the OpenAI-compatible API at `api.<host>/v1/*` is customer-facing; the upstream's portal UI is disabled at ingress; Catalyst replaces it as the customer surface; NewAPI's admin UI at `admin.<host>` is exposed only to ops staff (IdP-gated). Compliance posture (channel attestation, geographic AUP, BYOK isolation, reseller disclosure) enforced at the blueprint layer. Use `bp-newapi` when the Sovereign operator's business model is reselling LLM access to its own customers; use `bp-llm-gateway` for self-consumption. "
    icon: newapi.svg
    license: MIT
    tags: [llm, gateway, marketplace, multi-tenant, credits, byok, openai-compatible, reseller]
    docs: https://github.com/Calcium-Ion/new-api
  visibility: listed
  class: ai-service
  lifecycle: experimental
  owner:
    team: ai-platform
    contact: ai-platform@openova.io
  placementSchema:
    modes: [single-region, active-passive]
    default: single-region
  manifests:
    chart: bp-newapi
  upgrades:
    from: ["0.x"]
  observability:
    metrics: prometheus
    logs: stdout
  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive. Stateless API; config from CRDs +
  #   values. DB persistence lives in bp-cnpg-pair (out-of-scope here).
  #   Switchover: bp-continuum DNS flip.
  # Placement tier is '' (host) in every variant: #4325 removed the mgmt
  # plane vCluster and NET-221 its chart, so no Sovereign has the host
  # namespace `mgmt`. The funnel installs bp-newapi into every new
  # Organization (ADR-0015 D5), and that release belongs in the
  # Organization's own namespace (the platform stack of
  # core/controllers/organization/internal/gitops/manifests.go). A `mgmt`
  # tier addressed the HelmRelease to `mgmt` and failed the Organization's
  # whole region-apps Kustomization. The mgmt-A/-B IDs only pin regions.
  topology:
    supported:
      - active-passive
      - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: ""
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ""
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # #5389 (2026-07-27) — this used to read `endpoints: []` with the note
  # "internal — exposed via Catalyst's API ingress (api.<sov>) not as a
  # standalone external hostname". That stopped being true at #3374: the
  # chart ships `templates/httproute.yaml`, which publishes the standalone
  # host `newapi.<sovereign-fqdn>` and routes an **Exact `/`** match to the
  # sandbox-bridge sidecar's zero-click SSO landing page, and
  # `templates/sso-app-registration.yaml` registers the Keycloak redirect
  # URI `https://newapi.<sovereign-fqdn>/oauth/<providerSlug>`. NewAPI has
  # a first-class, SSO-gated admin console on its own hostname.
  #
  # The empty list was not merely stale metadata — it was load-bearing, and
  # it removed the console's launch affordance entirely:
  #
  #   * `Handler.userUIGatePasses` (applications.go) FAILS CLOSED on
  #     `len(bp.Endpoints) == 0`, so `externalURLIfUserUI` suppressed the
  #     Application's externalURL. AppDetail renders the hero "Open" CTA
  #     only under `{appExternalURL ? … : null}` and HandleSovereignApps
  #     projects the AppsPage grid button from the same gate — so BOTH the
  #     detail-page and the grid Open buttons were absent for bp-newapi.
  #   * `HandleGetLaunchURL` (endpoint_handler.go) resolves the silent-SSO
  #     target through `pickEndpoint`, which returns nil against an empty
  #     endpoints[] → `GET /catalyst/v1/apps/bp-newapi/launch-url` answered
  #     404 `endpoint-not-found`, so even the fallback launch path had
  #     nothing to open.
  #
  # Measured live on hw290 2026-07-26 (UAT row 114): the bp-newapi app
  # detail page exposed NO `data-testid=btn-launch-app`, and the launch-url
  # endpoint returned `{"code":"endpoint-not-found","message":"Blueprint
  # newapi has no endpoint \"\""}`. Declaring the endpoint restores both.
  #
  # ssoInitPath is the BARE ROOT `/` on purpose: unlike Grafana
  # (`/login/generic_oauth`) or Harbor (`/c/oidc/login`), NewAPI has no
  # app-local OIDC-init route — the platform supplies one, as the bridge
  # sidecar's Exact-`/` landing page (internal/handler/sso_init.go 404s
  # every path except `/`), which runs NewAPI's own onCustomOAuthClicked
  # sequence (mint /api/oauth/state → /api/status → authorize redirect
  # carrying kc_idp_hint=catalyst-pin). Root IS the init route here.
  endpoints:
    - name: ui
      hostnameTemplate: "newapi.{{.SovereignFQDN}}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
      ssoInitPath: "/"
  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # NewAPI admin UI gated by KC OIDC; customer-API uses Catalyst-issued
  # API keys (not OIDC).
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
