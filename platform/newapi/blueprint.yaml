apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-newapi
  labels:
    catalyst.openova.io/category: ai-runtime
    catalyst.openova.io/section: pts-4-6-llm-serving
    catalyst.openova.io/tier: catalyst-cp
spec:
  version: 1.4.151 # lockstep with chart/Chart.yaml (#5599: cross-region singleton — a secondary region renders no newapi Deployment and no CNPG Cluster, so one browser's single-use OAuth authorization code can no longer land on a database that never saw it)
  card:
    title: NewAPI
    summary: |
      Multi-tenant LLM marketplace gateway. Wraps the upstream NewAPI
      (github.com/Calcium-Ion/new-api, MIT, fork of OneAPI) with credits,
      per-key budgets, channel routing, and BYOK as first-class primitives.
      Deployed in **backend-only** mode: the OpenAI-compatible API at
      `api.<host>/v1/*` is customer-facing; the upstream's portal UI is
      disabled at ingress; Catalyst replaces it as the customer surface;
      NewAPI's admin UI at `admin.<host>` is exposed only to ops staff
      (IdP-gated). Compliance posture (channel attestation, geographic
      AUP, BYOK isolation, reseller disclosure) enforced at the
      blueprint layer. Use `bp-newapi` when the Sovereign operator's
      business model is reselling LLM access to its own customers; use
      `bp-llm-gateway` for self-consumption.
    icon: newapi.svg
    category: ai-runtime
    tags: [llm, gateway, marketplace, multi-tenant, credits, byok, openai-compatible, reseller]
    documentation: https://github.com/Calcium-Ion/new-api
    license: MIT
  visibility: listed
  owner:
    team: ai-platform
    contact: ai-platform@openova.io
  configSchema:
    type: object
    properties:
      replicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 16
      sandboxBridge:
        type: object
        description: |
          Sidecar exposing POST /admin/tokens/sandbox on :8080 (Wave 5.57).
          Inviolable Principle #4 — every knob operator-tunable per Sovereign
          overlay. Disable when the Sovereign does not run the per-Org Sandbox
          surface (bp-sandbox not installed) to save the sidecar's 32Mi mem
          request + ghcr image-pull.
        properties:
          enabled:
            type: boolean
            default: true
            description: When false the chart skip-renders the sidecar container + Service port + NetPol rule.
          port:
            type: integer
            default: 8080
            minimum: 1
            maximum: 65535
            description: Sidecar listen port. Must match sandbox-controller's NEWAPI_BASE_URL.
      ingress:
        type: object
        required: [host]
        properties:
          host:
            type: string
            description: Customer-facing API hostname (operator-supplied, e.g. api.<sovereign-fqdn>).
          tlsIssuer:
            type: string
            default: letsencrypt-dns01-prod-powerdns
            description: cert-manager ClusterIssuer name (DNS-01 PowerDNS — the canonical per-Org Sovereign issuer; letsencrypt-prod does not exist on a real Sovereign, #4246).
      database:
        type: object
        required: [existingSecret]
        properties:
          existingSecret:
            type: string
            description: ExternalSecret name holding the Postgres DSN (key SQL_DSN). Provisioned via a Crossplane PostgresqlInstance claim against bp-cnpg.
      valkey:
        type: object
        properties:
          url:
            type: string
            default: redis://valkey-primary.valkey.svc.cluster.local:6379
            description: Valkey URL for session and rate-limit cache. #4325 de-vcluster re-homed bp-valkey to the native HOST namespace `valkey`; the bitnami subchart's primary Service is `valkey-primary.valkey.svc` (the rtz plane vCluster + its syncer-mangled name are gone, #4376).
      auth:
        type: object
        properties:
          adminUI:
            type: object
            properties:
              mode:
                type: string
                enum: [keycloak, masterKey]
                default: keycloak
                description: |
                  `keycloak` = OIDC-only via bp-keycloak realm. `masterKey` = static master
                  key (DEV/BOOTSTRAP ONLY — operators MUST migrate to keycloak before exposing
                  admin.<host> on a public ingress).
              keycloak:
                type: object
                properties:
                  issuer:
                    type: string
                    description: Keycloak realm issuer URL (e.g. https://keycloak.<sovereign>/realms/<ops-realm>).
                  clientId:
                    type: string
                    default: newapi-admin
          customerAPI:
            type: object
            properties:
              keyIssuer:
                type: string
                enum: [catalyst, self-serve]
                default: catalyst
                description: |
                  `catalyst` (DEFAULT) = customer keys are issued by Catalyst's signup hook
                  via NewAPI's admin API; the upstream's customer portal UI is disabled.
                  `self-serve` = the upstream's customer portal UI is enabled (NOT
                  recommended in Catalyst Sovereigns — Catalyst is the customer surface).
      channels:
        type: array
        description: |
          LLM provider channels exposed by this NewAPI instance. Every channel MUST carry
          a verifiable `attestation` block; the blueprint refuses to render a Deployment
          if any enabled channel lacks attestation.
        items:
          type: object
          required: [name, type, attestation]
          properties:
            name:
              type: string
              description: Channel name (customer-visible model prefix, e.g. "qwen", "claude", "gpt").
            type:
              type: string
              enum: [vllm, openai-compatible, anthropic, byok-passthrough]
              description: |
                `vllm` = in-cluster bp-vllm (cheap tier).
                `openai-compatible` = commercial OpenAI/Together/Fireworks/etc.
                `anthropic` = direct Anthropic API contract (operator's commercial account).
                `byok-passthrough` = customer-supplied key, request-scoped, never aggregated.
            endpoint:
              type: string
              description: Upstream endpoint URL (omit for byok-passthrough — taken from request).
            existingSecret:
              type: string
              description: ExternalSecret name holding the upstream API key (omit for vllm and byok-passthrough).
            models:
              type: array
              items:
                type: string
              description: Model identifiers exposed via this channel.
            attestation:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [in-cluster, commercial-contract, byok]
                  description: |
                    `in-cluster` = operator owns the model weights and inference hardware.
                    `commercial-contract` = operator holds a paid account at the upstream
                    provider with reseller terms reviewed by counsel.
                    `byok` = key is supplied per-request by the end customer.
                accountId:
                  type: string
                  description: Provider-side account identifier (required for commercial-contract).
                contractRef:
                  type: string
                  description: Internal document reference to the signed reseller terms (required for commercial-contract).
      geo:
        type: object
        properties:
          sanctionedRegions:
            type: object
            properties:
              block:
                type: array
                items:
                  type: string
                default: ["IR", "KP", "SY", "CU", "RU-occupied-UA"]
                description: ISO-3166-1 alpha-2 region codes blocked on commercial-provider channels (US/EU export-control baseline).
              allowRelaxation:
                type: boolean
                default: false
                description: Set true ONLY with a recorded justification reviewed by counsel.
      aup:
        type: object
        properties:
          enforcement:
            type: string
            enum: [provider-strictest, per-channel, off]
            default: provider-strictest
            description: |
              `provider-strictest` = downstream requests must satisfy the strictest AUP
              across all enabled commercial channels. `per-channel` = each channel's
              requests must satisfy that channel's upstream AUP. `off` = no enforcement
              (open-weight in-cluster channels only — never set in a Sovereign with
              commercial channels enabled).
      audit:
        type: object
        properties:
          enabled:
            type: boolean
            default: true
          retentionDays:
            type: integer
            default: 730
            description: Audit log retention on the bp-cnpg Postgres (days).
          logPromptContent:
            type: boolean
            default: false
            description: |
              Default false (metadata-only). Operator may opt in per their privacy posture
              and customer ToS — DO NOT enable without explicit customer disclosure.
      byok:
        type: object
        properties:
          scope:
            type: string
            enum: [request-scoped, never]
            default: request-scoped
            description: |
              `request-scoped` (DEFAULT) = BYOK keys are passed through per-request and
              never persisted, cached, or shared. `never` = BYOK is disabled entirely.
              Cross-customer BYOK aggregation is not a supported value.
      reseller:
        type: object
        properties:
          disclosureRequired:
            type: boolean
            default: true
            description: |
              The operator must publish a `/legal/llm-providers` page listing the
              upstream providers they resell. The blueprint's compliance smoke test
              asserts the page is reachable at install time.
      catalystIntegration:
        type: object
        properties:
          enabled:
            type: boolean
            default: true
            description: |
              When true, the blueprint provisions a Kubernetes secret
              `catalyst-newapi-admin-token` consumed by Catalyst's signup hook to issue
              per-user API keys against NewAPI. Disable only in Sovereigns where Catalyst
              is not the customer surface (rare).
  placementSchema:
    modes: [single-region, active-active]
    default: single-region
  # ── #3373: class-level placement SUGGESTION + allow-list ────────────────
  # Placement is an INSTANCE property (Application.spec.placement); this is
  # only the default every instance inherits silently — the provisioning
  # journey's generic advanced selector (and a direct Git edit of the
  # instance's spec.placement) may override it within allowedPlacements.
  # Founder §4 table target: mgmt. Single render mechanism: the Flux
  # spec.kubeConfig.secretRef pivot — zero per-app placement code.
  defaultPlacement:
    vcluster: mgmt
  allowedPlacements: [host, mgmt]
  manifests:
    chart: ./chart
    helmRelease:
      # #4246 — newapi's wait-for-sql-dsn initContainer blocks until the
      # database-secret-sync-job (a post-install/post-upgrade Helm hook)
      # PATCHes the SQL_DSN Secret. With Flux's default --wait, helm-
      # controller waits for the Deployment to be Ready BEFORE running the
      # post-install hooks → the hook that unblocks the Pod never runs →
      # install deadlocks + times out. disableWait lets the hooks run
      # immediately so the DSN populates and the Pod proceeds. The
      # bootstrap-kit newapi HR sets this by hand; this propagates it to
      # the per-Org Application render path (fanout via pkg/render).
      disableWait: true
  depends:
    - blueprint: bp-cnpg
      version: ^1.0
      alias: db
    - blueprint: bp-keycloak
      version: ^1.0
      alias: idp
    - blueprint: bp-external-secrets
      version: ^1.0
      alias: eso
    - blueprint: bp-valkey
      version: ^1.0
      alias: cache
    - blueprint: bp-vllm
      version: ^1.0
      alias: vllm
      optional: true
  upgrades:
    from: ["0.x"]
  observability:
    metrics: prometheus
    logs: stdout
  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive. Stateless API; config from CRDs +
  #   values. DB persistence lives in bp-cnpg-pair (out-of-scope here).
  #   Switchover: bp-continuum DNS flip.
  topology:
    supported:
      - active-passive
      - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # #5389 (2026-07-27) — this used to read `endpoints: []` with the note
  # "internal — exposed via Catalyst's API ingress (api.<sov>) not as a
  # standalone external hostname". That stopped being true at #3374: the
  # chart ships `templates/httproute.yaml`, which publishes the standalone
  # host `newapi.<sovereign-fqdn>` and routes an **Exact `/`** match to the
  # sandbox-bridge sidecar's zero-click SSO landing page, and
  # `templates/sso-app-registration.yaml` registers the Keycloak redirect
  # URI `https://newapi.<sovereign-fqdn>/oauth/<providerSlug>`. NewAPI has
  # a first-class, SSO-gated admin console on its own hostname.
  #
  # The empty list was not merely stale metadata — it was load-bearing, and
  # it removed the console's launch affordance entirely:
  #
  #   * `Handler.userUIGatePasses` (applications.go) FAILS CLOSED on
  #     `len(bp.Endpoints) == 0`, so `externalURLIfUserUI` suppressed the
  #     Application's externalURL. AppDetail renders the hero "Open" CTA
  #     only under `{appExternalURL ? … : null}` and HandleSovereignApps
  #     projects the AppsPage grid button from the same gate — so BOTH the
  #     detail-page and the grid Open buttons were absent for bp-newapi.
  #   * `HandleGetLaunchURL` (endpoint_handler.go) resolves the silent-SSO
  #     target through `pickEndpoint`, which returns nil against an empty
  #     endpoints[] → `GET /catalyst/v1/apps/bp-newapi/launch-url` answered
  #     404 `endpoint-not-found`, so even the fallback launch path had
  #     nothing to open.
  #
  # Measured live on hw290 2026-07-26 (UAT row 114): the bp-newapi app
  # detail page exposed NO `data-testid=btn-launch-app`, and the launch-url
  # endpoint returned `{"code":"endpoint-not-found","message":"Blueprint
  # newapi has no endpoint \"\""}`. Declaring the endpoint restores both.
  #
  # ssoInitPath is the BARE ROOT `/` on purpose: unlike Grafana
  # (`/login/generic_oauth`) or Harbor (`/c/oidc/login`), NewAPI has no
  # app-local OIDC-init route — the platform supplies one, as the bridge
  # sidecar's Exact-`/` landing page (internal/handler/sso_init.go 404s
  # every path except `/`), which runs NewAPI's own onCustomOAuthClicked
  # sequence (mint /api/oauth/state → /api/status → authorize redirect
  # carrying kc_idp_hint=catalyst-pin). Root IS the init route here.
  endpoints:
    - name: ui
      hostnameTemplate: "newapi.{{.SovereignFQDN}}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
      ssoInitPath: "/"
  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # NewAPI admin UI gated by KC OIDC; customer-API uses Catalyst-issued
  # API keys (not OIDC).
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
    # #3648 — STANDARD sso-bootstrap contract (the SAME spec.sso.adminGroup +
    # spec.sso.bootstrap every app declares). NewAPI is a Pattern-B app
    # (upstream has no group→role mechanism), so the platform seeds + promotes
    # its first admin via the chart's DB-direct admin-sso-seed-job — but WHO
    # becomes admin (adminGroup) and the bootstrap parameters are declared
    # HERE, uniformly, never in a newapi-bespoke key.
    adminGroup: sovereign-admins
    bootstrap:
      enabled: true
      providerSlug: sovereign
      enforceAdminGroup: false
  # ── G117.6: Multi-instance ─────────────────────────────────────────────
  # Singleton per Sovereign — one NewAPI instance per Sovereign control plane.
  multiInstance:
    enabled: false
