{{- if include "bp-speech.serving" . }}
{{- /* ClusterIP only: the model gateway is the one caller. The chart renders no route of any kind. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bp-speech.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-speech.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "bp-speech.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
{{- end }}
