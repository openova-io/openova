apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-vcluster-helmrepo
spec:
  # 0.2.0 — adds the `vclusters.vcluster.com` CRD alongside the existing
  # HelmRepository + namespace pre-staging (issue #1945, TBD-A53).
  version: 0.2.4
  card:
    title: vCluster HelmRepository
    summary: Seeds the in-vCluster HelmRepository CR so per-Org Applications resolve their Blueprint charts against the Sovereign's local OCI registry post-cutover.
    icon: vcluster.svg
  visibility: unlisted              # mandatory bootstrap topology
  class: platform-component
  lifecycle: experimental
  placementSchema:
    modes: [single-region]
    default: single-region
  upgrades:
    from: ["0.x"]
  manifests:
    chart: bp-vcluster-helmrepo

  # ── Outputs advertised to dependent Blueprints ───────────────────────────
  # The Organization controller's per-tenant vCluster renderer
  # (core/controllers/organization/internal/gitops/manifests.go)
  # references these via env (CATALYST_VCLUSTER_HELMREPO_NAME +
  # CATALYST_VCLUSTER_HELMREPO_NAMESPACE).
  outputs:
    helmRepoName: loft
    helmRepoNamespace: vcluster-system
    upstreamURL: https://charts.loft.sh
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ''
          clusters: [rtz-A]
          roles:
            rtz-A: singleton
  endpoints: []
