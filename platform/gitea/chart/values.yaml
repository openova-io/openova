# Catalyst Blueprint umbrella metadata — the upstream chart is now resolved
# as a Helm subchart via Chart.yaml `dependencies:`. This values.yaml carries
# both:
#   1. The catalystBlueprint metadata block (provenance + version) so
#      observability/audit pipelines can inspect the artifact and report
#      which upstream chart + version is bundled.
#   2. The upstream subchart values overlay under the `gitea:` key
#      (umbrella-chart convention — the dependency name from Chart.yaml is
#      the values namespace; the upstream chart's own internal `gitea:`
#      section appears as `gitea.gitea` here, which is correct).

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). The upstream Gitea subchart
  # exposes `gitea.image.registry` for registry override.
  # Per-Sovereign overlays wire that alongside this value. Tracked under #560.
  imageRegistry: ""

catalystBlueprint:
  upstream: { chart: gitea, version: "10.5.0", repo: "https://dl.gitea.com/charts" }

# ─── Upstream chart values (subchart key: gitea) ──────────────────────────
# Generated by docs/PROVISIONING-PLAN.md tickets [F] chart Pass 105+.
gitea:
  gitea:
    admin:
      username: gitea_admin
      email: gitea-admin@catalyst.local
      # existingSecret — point the upstream chart at the Catalyst-curated
      # `gitea-admin-secret` (templates/admin-secret.yaml). The upstream
      # chart reads `username` + `password` keys from this Secret to seed
      # the admin user (init.yaml's `gitea admin user create`).
      #
      # Without this, the upstream chart falls back to its baked-in default
      # password `r8sA8CPHD9!bt6d` on values:gitea.gitea.admin.password —
      # every fresh Sovereign would ship the same admin credentials,
      # which is a credential-hygiene catastrophe.
      #
      # The contract Secret shape (`username` + `password`) is also what
      # bp-self-sovereign-cutover Step 1 (gitea-mirror) reads to push the
      # upstream openova/openova mirror into the local Gitea (issue #830
      # Bug 2). Sharing the contract here means there is exactly ONE
      # source of truth for the admin credentials on the Sovereign.
      existingSecret: gitea-admin-secret
    config:
      APP_NAME: Catalyst Gitea
      server:
        DOMAIN: gitea.catalyst.local
        ROOT_URL: https://gitea.catalyst.local
      # Wire CNPG-managed Postgres (replaces bitnami subchart).
      # Password is injected at runtime via additionalConfigFromEnvs below.
      database:
        DB_TYPE: postgres
        HOST: gitea-pg-rw.gitea.svc.cluster.local:5432
        NAME: gitea
        USER: gitea
        SSL_MODE: disable
      # G91.gitea (#2653) — global OAuth2-client toggles. Per-provider
      # config (clientId/secret/autoDiscoverUrl) lives under `gitea.oauth`
      # below; these are the global app.ini knobs.
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: true
        # Use email + username from claims; never email-only (avoids
        # collisions when the operator email matches a different person's
        # local Gitea account).
        USERNAME: nickname
        # Avoid email confirmation prompt — the realm enforces
        # `loginWithEmailAllowed` + email verification at the Keycloak
        # layer (configmap-sovereign-realm.yaml).
        REGISTER_EMAIL_CONFIRM: false
        # Update profile avatar from the IdP on each login.
        UPDATE_AVATAR: true
        # Account-link-required-form: redirect users with an existing
        # local Gitea account to confirm linkage on first OIDC login.
        ACCOUNT_LINKING: auto
    # Gitea built-in metrics + ServiceMonitor — DEFAULT OFF.
    #
    # Per docs/INVIOLABLE-PRINCIPLES.md #4 and
    # docs/BLUEPRINT-AUTHORING.md §11.2 (Observability toggles must
    # default false). The upstream gitea chart's
    # `gitea.gitea.metrics.serviceMonitor.enabled` renders a
    # monitoring.coreos.com/v1 ServiceMonitor which the apiserver rejects
    # on a fresh Sovereign before bp-kube-prometheus-stack ships the CRD.
    # Upstream already defaults to false — set explicitly so a future
    # upstream bump cannot regress this. Operator opts in via per-cluster
    # overlay (issue #182).
    metrics:
      enabled: false
      serviceMonitor:
        enabled: false
    # Inject DB password DIRECTLY from CNPG's own `gitea-pg-app` Secret
    # (basic-auth type, carries the `password` key). CNPG owns BOTH the
    # database role's password and this Secret, so they can never drift.
    #
    # hw91 root-cause (2026-06-03, 1.2.17): the previous indirection —
    # secretKeyRef on the synced/kept `gitea-database-secret` — lost a
    # DETERMINISTIC start race on every fresh install attempt: helm
    # creates the sync Job and the gitea Deployment simultaneously; the
    # pod's fast init chain (init-directories → init-app-ini) bakes
    # app.ini from the env snapshot within seconds, while the sync Job
    # needs an image pull + run to copy CNPG's fresh password into the
    # kept (stale, `resource-policy: keep`) gitea-database-secret.
    # Completed init containers never re-run, so the pod stayed poisoned
    # with the previous attempt's password for its whole lifetime →
    # configure-gitea `pq: password authentication failed` → install
    # timeout → uninstall → CNPG regenerates → identical race on the
    # next attempt. Observed identically on install attempts 4, 5 and 6
    # on hw91 (the first prov ever to reach this slot's first-install
    # path). Pointing at the CNPG-owned Secret removes the race class
    # entirely; gitea-database-secret + its sync Job remain for the
    # OTHER consumers documented in database-secret-sync-job.yaml
    # (harbor's env binding shape).
    additionalConfigFromEnvs:
      - name: GITEA__database__PASSWD
        valueFrom:
          secretKeyRef:
            name: gitea-pg-app
            key: password
    # G91.gitea (#2653) — upstream chart's per-provider OAuth list.
    # Empty default; bp-gitea ships a Helm post-install hook Job
    # (templates/sso-configure-oauth-job.yaml) that calls
    # `gitea admin auth add-oauth` from inside the gitea Pod using the
    # gitea-oauth-source-credentials Secret. The hook is preferred over
    # the upstream chart's gitea.oauth path because it lets the chart
    # compute autoDiscoverUrl from .Values.sso.sovereignFqdn at template
    # time without requiring a per-Sovereign cluster overlay for every
    # new app.
    oauth: []
  # Bitnami postgresql subchart DISABLED — bitnami/* and bitnamilegacy/*
  # images are unavailable via the Harbor proxy_cache (DockerHub returns
  # text/html for these namespaces — image pull fails with "unexpected media
  # type text/html"). Replaced by bp-cnpg-managed Cluster
  # (templates/cnpg-cluster.yaml + templates/database-secret.yaml), the
  # same pattern used by bp-harbor. Fixes ImagePullBackOff on otech22.
  postgresql-ha:
    enabled: false
  postgresql:
    enabled: false
  redis-cluster:
    enabled: false
  valkey-cluster:
    enabled: false
  persistence:
    enabled: true
    size: 20Gi
  # Upstream chart Ingress — DISABLED. Catalyst routes via Cilium Gateway
  # API (see top-level `gateway:` block below). Issue #387.
  ingress:
    enabled: false

# ─── Catalyst-curated admin Secret (issue #830 Bug 2) ────────────────────
# Templated `gitea-admin-secret` lives in templates/admin-secret.yaml.
# Created on first install with a randAlphaNum 32-char password; preserved
# across reconciles via Helm `lookup`. Consumed by:
#   - upstream gitea subchart via gitea.gitea.admin.existingSecret above
#     (init container reads GITEA_ADMIN_USERNAME / GITEA_ADMIN_PASSWORD
#     from this Secret to seed the Gitea admin user).
#   - bp-self-sovereign-cutover Step 1 (gitea-mirror) via the per-step
#     PodSpec ConfigMap (cutover-step-01-gitea-mirror) — the Job pushes
#     the upstream openova/openova mirror into the local Gitea using
#     these credentials.
#
# Per-Sovereign overrides are operationally meaningful only when the
# operator has a documented reason to fork the username (default
# gitea_admin matches the upstream chart's expected admin login).
giteaAdmin:
  secretName: "gitea-admin-secret"
  username: "gitea_admin"

# ─── CNPG-managed Postgres cluster for Gitea ──────────────────────────────
# Per the Harbor pattern (templates/cnpg-cluster.yaml in bp-harbor), Gitea's
# postgres is provisioned by CNPG rather than the Bitnami subchart. The
# CNPG Cluster creates a `gitea-pg-app` Secret; database-secret.yaml uses
# reflector to mirror it into `gitea-database-secret`, which the Gitea
# deployment reads via a secretKeyRef for GITEA__database__PASSWD.
postgres:
  cluster:
    name: gitea-pg
    # namespace defaults to .Release.Namespace (gitea)
    namespace: ""
    instances: 1
    pgVersion: "16"
    database: gitea
    owner: gitea
    storageSize: 5Gi
    storageClass: local-path
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ─── Catalyst HTTPRoute (Cilium Gateway API, issue #387) ──────────────────
# Replaces the upstream chart's networking.k8s.io/v1.Ingress on Sovereigns.
# Per-Sovereign overlay supplies `gateway.host` (e.g. git.<sovereign-fqdn>).
# parentRef defaults to cilium-gateway/kube-system, the per-Sovereign
# Gateway shipped by clusters/_template/bootstrap-kit/01-cilium.yaml.
gateway:
  enabled: true
  # host: git.<sovereign-fqdn> — REQUIRED, no default per Inviolable Principle #4
  host: ""
  path: "/"
  # Backend Service — defaults to <release>-gitea-http (gitea subchart Service)
  backendService: ""
  backendPort: 3000
  parentRef:
    name: cilium-gateway
    namespace: kube-system
    # sectionName intentionally empty — multi-zone Sovereigns rename HTTPS
    # listeners to https-<sanitised-zone> (e.g. https-omani-works), so
    # pinning sectionName: https breaks NoMatchingListener. Cilium Gateway
    # matches by hostname filter. See PR #1888 / TBD-A40 / issue #1902.
    sectionName: ""

# ─── G91.gitea (#2653) SSO opt-in ─────────────────────────────────────────
# Per SECURITY.md §6.3 every Application Blueprint declares SSO support
# with a single value. bp-sso-bridge (G91.1 #2652) watches every HR with
# `sso.enabled: true` and reconciles a Keycloak Client + OpenBao
# `secret/sso/<clientId>` + ExternalSecret in this namespace.
#
# bp-gitea opts in by default — Sovereign-operator SSO is mandatory; per-
# user logins flow through the Sovereign realm only. The local Gitea admin
# (`gitea_admin`) still exists as a break-glass account for cutover step 1.
sso:
  enabled: true
  # Keycloak realm. Defaults to the shared-sovereign realm shipped by
  # platform/keycloak/chart/templates/configmap-sovereign-realm.yaml.
  realm: sovereign
  # 1.2.22 (#2989/#2744): in-cluster Keycloak base URL, used ONLY for
  # the sso-configure hook's discovery fetch — gitea VALIDATES the
  # discovery URL by fetching it, and the public auth.<fqdn> URL is
  # unreachable until the gateway binds at full convergence, which
  # waits on this very hook (bootstrap circle, caught live on hw91).
  # Browser-facing URLs stay public via --use-custom-urls.
  keycloakInternalURL: "http://keycloak.keycloak.svc.cluster.local"
  # Sovereign FQDN — used to compute issuer / auto-discover URL.
  # Per-Sovereign cluster overlay sets this (e.g. `hw86.omani.works`).
  # Empty default leaves autoDiscoverUrl unrendered; the upstream chart's
  # `gitea.oauth` list still emits but Gitea's init container exits with
  # a clear "missing required flag --auto-discover-url" message rather
  # than installing a half-configured auth source.
  sovereignFqdn: ""
  # OIDC client ID — defaults to "gitea" (matches bp-sso-bridge convention
  # of stripping "bp-" from the HR name).
  clientId: gitea
  # ESO ClusterSecretStore that mirrors OpenBao `secret/sso/<clientId>`
  # into the gitea-oauth-source-credentials Secret in this namespace.
  # Default matches bp-external-secrets-stores values.yaml
  # `clusterSecretStore.name`.
  externalSecretStoreName: vault-region1
  # Refresh interval for the rendered Secret. Per-app key rotation cadence
  # is controlled at the OpenBao policy layer (SECURITY.md §7); shorter
  # intervals here just amplify Pod restart churn.
  refreshInterval: 1h
  # Auto-register Keycloak users as Gitea local users on first OIDC login.
  # Per SECURITY.md §6.3 every Org user gets one-click SSO across all Apps
  # without seeing OAuth config.
  autoRegisterUsers: true
  # Group claim the realm emits (configmap-sovereign-realm.yaml emits
  # `groups` under the `groups` clientScope).
  groupClaimName: groups
  # Realm group → Gitea admin role mapping. The Sovereign operator
  # (deployment.OrgEmail) is auto-added to `sovereign-admins` by the realm
  # import; users in this group land as Gitea site admins.
  adminGroup: sovereign-admins
  restrictedGroup: ""
  # G117.5 #2744 — Identity Provider hint appended to the authorize_url
  # written into gitea-oauth-source-credentials Secret by the
  # ExternalSecret template. Combined with the bp-keycloak 1.4.9+ realm-
  # config IDR `defaultProvider=catalyst-pin` binding, this delivers
  # silent SSO without the KC username/password form. Per-Sovereign
  # overlay may override (empty string disables defense-in-depth and
  # falls back to --auto-discover-url at OAuth-source configure time).
  idpHint: catalyst-pin
