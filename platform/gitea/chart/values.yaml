# Catalyst Blueprint umbrella metadata — the upstream chart is now resolved
# as a Helm subchart via Chart.yaml `dependencies:`. This values.yaml carries
# both:
#   1. The catalystBlueprint metadata block (provenance + version) so
#      observability/audit pipelines can inspect the artifact and report
#      which upstream chart + version is bundled.
#   2. The upstream subchart values overlay under the `gitea:` key
#      (umbrella-chart convention — the dependency name from Chart.yaml is
#      the values namespace; the upstream chart's own internal `gitea:`
#      section appears as `gitea.gitea` here, which is correct).

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). The upstream Gitea subchart
  # exposes `gitea.image.registry` for registry override.
  # Per-Sovereign overlays wire that alongside this value. Tracked under #560.
  imageRegistry: ""

catalystBlueprint:
  upstream: { chart: gitea, version: "10.5.0", repo: "https://dl.gitea.com/charts" }

# ─── Upstream chart values (subchart key: gitea) ──────────────────────────
# Generated by docs/PROVISIONING-PLAN.md tickets [F] chart Pass 105+.
gitea:
  # 1.2.32 — kyverno baseline Enforce (containers-must-declare-cpu-memory-
  # requests): the upstream subchart's gitea container rendered resources {}
  # — grandfathered pre-enforcement, DENIED on tonight's host reinstall
  # (hw130 restore). Requests sized from live usage; limits per baseline.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # ─── Harbor proxy-cache pull (#3296, #3267 class) ────────────────────────
  # Pull the gitea image THROUGH the Harbor proxy-cache. The upstream
  # default (`gitea/gitea`, registry "") is a bare docker.io ref that
  # matches NEITHER kyverno `harbor-proxy-pull` (Enforce) glob
  # (`*/proxy-*/*` proxy-cache, `*/openova-io/*` native-push). Original
  # pods are admitted pre-enforcement during bootstrap, so the landmine
  # only fires on the FIRST chart roll of a converged env — live on hw128
  # the 1.2.27 roll's replacement ReplicaSet had every pod denied and the
  # gitea Deployment went 0/1. Tag/rootless stay at upstream defaults
  # (proxy-dockerhub is a read-through cache of the same bytes).
  image:
    registry: harbor.openova.io
    repository: proxy-dockerhub/gitea/gitea
  gitea:
    admin:
      username: gitea_admin
      email: gitea-admin@catalyst.local
      # existingSecret — point the upstream chart at the Catalyst-curated
      # `gitea-admin-secret` (templates/admin-secret.yaml). The upstream
      # chart reads `username` + `password` keys from this Secret to seed
      # the admin user (init.yaml's `gitea admin user create`).
      #
      # Without this, the upstream chart falls back to its baked-in default
      # password `r8sA8CPHD9!bt6d` on values:gitea.gitea.admin.password —
      # every fresh Sovereign would ship the same admin credentials,
      # which is a credential-hygiene catastrophe.
      #
      # The contract Secret shape (`username` + `password`) is also what
      # bp-self-sovereign-cutover Step 1 (gitea-mirror) reads to push the
      # upstream openova/openova mirror into the local Gitea (issue #830
      # Bug 2). Sharing the contract here means there is exactly ONE
      # source of truth for the admin credentials on the Sovereign.
      existingSecret: gitea-admin-secret
    config:
      APP_NAME: Catalyst Gitea
      server:
        DOMAIN: gitea.catalyst.local
        ROOT_URL: https://gitea.catalyst.local
      # Wire CNPG-managed Postgres (replaces bitnami subchart).
      # Password is injected at runtime via additionalConfigFromEnvs below.
      database:
        DB_TYPE: postgres
        HOST: gitea-pg-rw.gitea.svc.cluster.local:5432
        NAME: gitea
        USER: gitea
        SSL_MODE: disable
      # Durable session store (#5531). Upstream gitea defaults `[session]
      # PROVIDER=memory`, which keeps the OAuth2 `state` that gitea mints on
      # the redirect-to-Keycloak in process memory only. Any gitea pod roll
      # between BeginAuth and the callback — the cutover registry-pivot
      # restart, an image bump, a node drain — flushes that in-memory session,
      # so the callback lands with no stored state and gitea 500s with
      # "could not find a matching session for this request". `db` persists
      # sessions in the gitea Postgres (already wired above), so the OAuth
      # round-trip survives a mid-flow restart. PROVIDER_CONFIG is unused for
      # the db provider (it reuses the configured database engine).
      session:
        PROVIDER: db
      # G91.gitea (#2653) — global OAuth2-client toggles. Per-provider
      # config (clientId/secret/autoDiscoverUrl) lives under `gitea.oauth`
      # below; these are the global app.ini knobs.
      # ROOT-URL zero-click SSO (founder mandate 2026-06-12): anonymous
      # hits to ANY page must funnel into OIDC instead of the public
      # landing/explore pages. REQUIRE_SIGNIN_VIEW sends anonymous ->
      # /user/login, which the HTTPRoute redirects -> the OIDC entry ->
      # signed in. Git/Flux/API clients are unaffected (token auth).
      service:
        REQUIRE_SIGNIN_VIEW: true
      # LANDING_PAGE=login: gitea EXEMPTS its home page from
      # REQUIRE_SIGNIN_VIEW (verified in-pod: anon / = 200), so anonymous
      # visitors must be steered to /user/login (-> the gateway OIDC
      # redirect -> signed in). Signed-in users at / get their dashboard
      # (session checked first) — no loop.
      server:
        LANDING_PAGE: login
      oauth2_client:
        ENABLE_AUTO_REGISTRATION: true
        # Use email + username from claims; never email-only (avoids
        # collisions when the operator email matches a different person's
        # local Gitea account).
        USERNAME: nickname
        # Avoid email confirmation prompt — the realm enforces
        # `loginWithEmailAllowed` + email verification at the Keycloak
        # layer (configmap-sovereign-realm.yaml).
        REGISTER_EMAIL_CONFIRM: false
        # Update profile avatar from the IdP on each login.
        UPDATE_AVATAR: true
        # Account-link-required-form: redirect users with an existing
        # local Gitea account to confirm linkage on first OIDC login.
        ACCOUNT_LINKING: auto
    # Gitea built-in metrics + ServiceMonitor — DEFAULT OFF.
    #
    # Per docs/INVIOLABLE-PRINCIPLES.md #4 and
    # docs/BLUEPRINT-AUTHORING.md §11.2 (Observability toggles must
    # default false). The upstream gitea chart's
    # `gitea.gitea.metrics.serviceMonitor.enabled` renders a
    # monitoring.coreos.com/v1 ServiceMonitor which the apiserver rejects
    # on a fresh Sovereign before bp-kube-prometheus-stack ships the CRD.
    # Upstream already defaults to false — set explicitly so a future
    # upstream bump cannot regress this. Operator opts in via per-cluster
    # overlay (issue #182).
    metrics:
      enabled: false
      serviceMonitor:
        enabled: false
    # Inject DB password DIRECTLY from CNPG's own `gitea-pg-app` Secret
    # (basic-auth type, carries the `password` key). CNPG owns BOTH the
    # database role's password and this Secret, so they can never drift.
    #
    # hw91 root-cause (2026-06-03, 1.2.17): the previous indirection —
    # secretKeyRef on the synced/kept `gitea-database-secret` — lost a
    # DETERMINISTIC start race on every fresh install attempt: helm
    # creates the sync Job and the gitea Deployment simultaneously; the
    # pod's fast init chain (init-directories → init-app-ini) bakes
    # app.ini from the env snapshot within seconds, while the sync Job
    # needs an image pull + run to copy CNPG's fresh password into the
    # kept (stale, `resource-policy: keep`) gitea-database-secret.
    # Completed init containers never re-run, so the pod stayed poisoned
    # with the previous attempt's password for its whole lifetime →
    # configure-gitea `pq: password authentication failed` → install
    # timeout → uninstall → CNPG regenerates → identical race on the
    # next attempt. Observed identically on install attempts 4, 5 and 6
    # on hw91 (the first prov ever to reach this slot's first-install
    # path). Pointing at the CNPG-owned Secret removes the race class
    # entirely; gitea-database-secret + its sync Job remain for the
    # OTHER consumers documented in database-secret-sync-job.yaml
    # (harbor's env binding shape).
    #
    # ADR-0010 SHARING gate (#3285): the secretKeyRef NAME below is the
    # ONLY thing that flips between modes (the `password` key is identical
    # in both source Secrets):
    #   - own-cluster (default): `gitea-pg-app` — CNPG's bundled basic-auth
    #     Secret on gitea's OWN gitea-pg Cluster. Byte-identical hw91 path.
    #   - SHARED (SOVEREIGN_GITEA_PG_OWN_CLUSTER=false): the reflected
    #     `gitea-database-secret`, which bp-reflector pushes into the gitea
    #     namespace from the shared engine's `shared-pg-gitea` role Secret
    #     (CNPG synthesises it with a `password` key — same key, same
    #     secretKeyRef shape, so only the Secret NAME changes).
    # The upstream subchart consumes `additionalConfigFromEnvs` with a plain
    # `toYaml` (not `tpl`), so the umbrella chart can NOT template this name.
    # The bootstrap-kit slot 10 overlay overrides the whole single-element
    # list via the `SOVEREIGN_GITEA_PG_SECRET` envsubst seam (default
    # gitea-pg-app). This committed default keeps a standalone
    # `helm template` (and every own-cluster prov) byte-identical.
    additionalConfigFromEnvs:
      - name: GITEA__database__PASSWD
        valueFrom:
          secretKeyRef:
            name: gitea-pg-app
            key: password
    # G91.gitea (#2653) — upstream chart's per-provider OAuth list.
    # Empty default; bp-gitea ships a Helm post-install hook Job
    # (templates/sso-configure-oauth-job.yaml) that calls
    # `gitea admin auth add-oauth` from inside the gitea Pod using the
    # gitea-oauth-source-credentials Secret. The hook is preferred over
    # the upstream chart's gitea.oauth path because it lets the chart
    # compute autoDiscoverUrl from .Values.sso.sovereignFqdn at template
    # time without requiring a per-Sovereign cluster overlay for every
    # new app.
    oauth: []
  # Bitnami postgresql subchart DISABLED — bitnami/* and bitnamilegacy/*
  # images are unavailable via the Harbor proxy_cache (DockerHub returns
  # text/html for these namespaces — image pull fails with "unexpected media
  # type text/html"). Replaced by bp-cnpg-managed Cluster
  # (templates/cnpg-cluster.yaml + templates/database-secret.yaml), the
  # same pattern used by bp-harbor. Fixes ImagePullBackOff on otech22.
  postgresql-ha:
    enabled: false
  postgresql:
    enabled: false
  redis-cluster:
    enabled: false
  valkey-cluster:
    enabled: false
  persistence:
    enabled: true
    size: 20Gi
  # Deployment rollout strategy — override the upstream default of
  # RollingUpdate{maxUnavailable:0,maxSurge:100%} to Recreate (#3188).
  # Gitea's `/data` is a ReadWriteOnce PVC (persistence.accessModes default
  # [ReadWriteOnce] upstream). With maxUnavailable:0 the rollout MUST bring
  # a NEW (surge) Pod to Ready BEFORE terminating the old one — but the new
  # Pod can never mount the RWO volume the old Pod still holds, and even if
  # it could, gitea's embedded LevelDB queue takes an exclusive file lock on
  # /data, so the surge Pod CrashLoops on "resource temporarily unavailable"
  # and the rollout WEDGES (old ReplicaSet never scales down → chart upgrade
  # never reaches Ready → bp-gitea Stalled → bp-catalyst-platform blocked).
  # Recreate tears the old Pod down FIRST, releasing the PVC + the LevelDB
  # lock, then starts the new one — the correct strategy for any single-
  # replica RWO-backed stateful Deployment. Single-replica gitea already has
  # no HA during a roll, so Recreate costs nothing it didn't already lack.
  strategy:
    type: Recreate
  # ─── #4885: roll gitea when gitea-admin-secret changes (Stakater Reloader) ─
  # Root cause (hw232 live, Pillar-5 cutover step-06 demirror 401): the Gitea
  # admin user's password is seeded into the live DB by the init container from
  # `gitea-admin-secret`, and GITEA_ADMIN_PASSWORD_MODE=keepUpdated re-syncs the
  # DB password to the Secret ONLY ON POD RESTART. Gitea never restarts on its
  # own, so if `gitea-admin-secret` ever changes (rotation, a re-render, an
  # operator reset) the live DB keeps the OLD password while the Secret holds
  # the NEW one — every admin-API auth (including bp-self-sovereign-cutover
  # step-06 demirror) then 401s `user's password is invalid [uid:1 gitea_admin]`.
  #
  # templates/admin-secret.yaml's Helm `lookup` guard already pins the password
  # so it does NOT regenerate on normal reconciles (issue #830 Bug 2). This
  # annotation is the belt-and-braces companion the #4885 root-cause calls for:
  # bp-reloader (bootstrap-kit slot 28, --reload-strategy=annotations) watches
  # `gitea-admin-secret` and triggers a rolling restart of THIS Deployment on
  # any change, so the init container re-runs and keepUpdated re-syncs the DB
  # password immediately instead of waiting for an unrelated restart. The
  # annotation lives on the Deployment's OWN metadata (upstream
  # `deployment.annotations` → templates/gitea/deployment.yaml metadata.annotations)
  # which is exactly where Reloader reads (same idiom as bp-powerdns-admin's
  # `secret.reloader.stakater.com/reload: pda-sso-oidc-credentials`). The
  # Recreate strategy above makes the roll RWO-PVC / LevelDB-lock-safe. The
  # admin-secret always exists (chart-core), so the annotation is unconditional.
  # Refs #4885 #3379 #830.
  deployment:
    annotations:
      secret.reloader.stakater.com/reload: "gitea-admin-secret"
  # Upstream chart Ingress — DISABLED. Catalyst routes via Cilium Gateway
  # API (see top-level `gateway:` block below). Issue #387.
  ingress:
    enabled: false

# ─── Catalyst-curated admin Secret (issue #830 Bug 2) ────────────────────
# Templated `gitea-admin-secret` lives in templates/admin-secret.yaml.
# Created on first install with a randAlphaNum 32-char password; preserved
# across reconciles via Helm `lookup` — and, when the source Secret has
# VANISHED mid-life (#5214 class), restored from the reflector mirror(s)
# in `mirrorNamespaces` below instead of minting a fresh password that
# would drift from Gitea's DB (#5262, live hw277: a mid-cutover chart
# re-render rotated the Secret while the DB kept the install-time
# password → cutover step-10 git clone 401 / exit 128). Consumed by:
#   - upstream gitea subchart via gitea.gitea.admin.existingSecret above
#     (init container reads GITEA_ADMIN_USERNAME / GITEA_ADMIN_PASSWORD
#     from this Secret to seed the Gitea admin user).
#   - bp-self-sovereign-cutover Step 1 (gitea-mirror) via the per-step
#     PodSpec ConfigMap (cutover-step-01-gitea-mirror) — the Job pushes
#     the upstream openova/openova mirror into the local Gitea using
#     these credentials.
#
# Per-Sovereign overrides are operationally meaningful only when the
# operator has a documented reason to fork the username (default
# gitea_admin matches the upstream chart's expected admin login).
giteaAdmin:
  secretName: "gitea-admin-secret"
  username: "gitea_admin"
  # #5262 — single source of truth for BOTH the reflector
  # reflection-*-namespaces annotations on the admin Secret AND the
  # re-render vanish-fallback lookup order in admin-secret.yaml. Every
  # namespace here receives a live mirror of the Secret, and a re-render
  # that finds the source absent restores the password from the first
  # mirror that still holds one (never minting fresh bytes while any
  # copy survives).
  mirrorNamespaces:
    - "catalyst"

# ─── CNPG-managed Postgres cluster for Gitea ──────────────────────────────
# Per the Harbor pattern (templates/cnpg-cluster.yaml in bp-harbor), Gitea's
# postgres is provisioned by CNPG rather than the Bitnami subchart. The
# CNPG Cluster creates a `gitea-pg-app` Secret; database-secret.yaml uses
# reflector to mirror it into `gitea-database-secret`, which the Gitea
# deployment reads via a secretKeyRef for GITEA__database__PASSWD.
postgres:
  cluster:
    name: gitea-pg
    # namespace defaults to .Release.Namespace (gitea)
    namespace: ""
    instances: 1
    # CNPG postgres image. Defaults to the mothership Harbor proxy cache
    # (harbor.openova.io/proxy-ghcr) so fresh-prov bootstrap pulls the
    # ~300MB image through Harbor instead of throttling on anonymous ghcr
    # (#3058). PUBLIC image → proxy-ghcr serves it cred-free. Post-cutover
    # Step-04's containerd mirror redirects harbor.openova.io → local Harbor.
    # The tag is set separately via pgVersion.
    imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql
    pgVersion: "16"
    database: gitea
    owner: gitea
    storageSize: 5Gi
    storageClass: ""  # #3971 — empty ⇒ cluster-default durable cloud CSI; local-path FORBIDDEN
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ─── Catalyst HTTPRoute (Cilium Gateway API, issue #387) ──────────────────
# Replaces the upstream chart's networking.k8s.io/v1.Ingress on Sovereigns.
# Per-Sovereign overlay supplies `gateway.host` (e.g. git.<sovereign-fqdn>).
# parentRef defaults to cilium-gateway/kube-system, the per-Sovereign
# Gateway shipped by clusters/_template/bootstrap-kit/01-cilium.yaml.
gateway:
  enabled: true
  # host: git.<sovereign-fqdn> — REQUIRED, no default per Inviolable Principle #4
  host: ""
  path: "/"
  # Backend Service — defaults to <release>-gitea-http (gitea subchart Service)
  backendService: ""
  backendPort: 3000
  parentRef:
    name: cilium-gateway
    namespace: kube-system
    # sectionName intentionally empty — multi-zone Sovereigns rename HTTPS
    # listeners to https-<sanitised-zone> (e.g. https-omani-works), so
    # pinning sectionName: https breaks NoMatchingListener. Cilium Gateway
    # matches by hostname filter. See PR #1888 / TBD-A40 / issue #1902.
    sectionName: ""

# ─── G91.gitea (#2653) SSO opt-in ─────────────────────────────────────────
# Per SECURITY.md §6.3 every Application Blueprint declares SSO support
# with a single value. bp-sso-bridge (G91.1 #2652) watches every HR with
# `sso.enabled: true` and reconciles a Keycloak Client + OpenBao
# `secret/sso/<clientId>` + ExternalSecret in this namespace.
#
# bp-gitea opts in by default — Sovereign-operator SSO is mandatory; per-
# user logins flow through the Sovereign realm only. The local Gitea admin
# (`gitea_admin`) still exists as a break-glass account for cutover step 1.
sso:
  enabled: true
  # #3934 (Refs #3642): split-gate for the host-bridge (mgmt-vCluster)
  # placement. When gitea is host-bridged, the HOST renders the
  # gitea-oauth-source-credentials ExternalSecret (external-secrets-operator
  # + the OpenBao ClusterSecretStore are host resources) and placement.yaml's
  # hostBridge.suppress sets `externalSecret.enabled: false` so the chart does
  # NOT also render an in-vCluster copy (avoids two owners of one Secret name).
  # `sso.enabled` STAYS true so the sso-configure Deployment still renders IN
  # the vCluster — it kubectl-exec's the live gitea Pod (belongs alongside it)
  # and mounts the host-bridged creds crossed in by bp-mgmt-vcluster's
  # sync.fromHost mapping `gitea/gitea-oauth-source-credentials`. Default true
  # → on a non-host-bridged prov the render is byte-identical to before.
  externalSecret:
    enabled: true
  # Keycloak realm. Defaults to the shared-sovereign realm shipped by
  # platform/keycloak/chart/templates/configmap-sovereign-realm.yaml.
  realm: sovereign
  # 1.2.22 (#2989/#2744): in-cluster Keycloak base URL, used ONLY for
  # the sso-configure hook's discovery fetch — gitea VALIDATES the
  # discovery URL by fetching it, and the public auth.<fqdn> URL is
  # unreachable until the gateway binds at full convergence, which
  # waits on this very hook (bootstrap circle, caught live on hw91).
  # Browser-facing URLs stay public via --use-custom-urls.
  keycloakInternalURL: "http://keycloak.keycloak.svc.cluster.local"
  # Sovereign FQDN — used to compute issuer / auto-discover URL.
  # Per-Sovereign cluster overlay sets this (e.g. `hw86.omani.works`).
  # Empty default leaves autoDiscoverUrl unrendered; the upstream chart's
  # `gitea.oauth` list still emits but Gitea's init container exits with
  # a clear "missing required flag --auto-discover-url" message rather
  # than installing a half-configured auth source.
  sovereignFqdn: ""
  # OIDC client ID — defaults to "gitea" (matches bp-sso-bridge convention
  # of stripping "bp-" from the HR name).
  clientId: gitea
  # ESO ClusterSecretStore that mirrors OpenBao `secret/sso/<clientId>`
  # into the gitea-oauth-source-credentials Secret in this namespace.
  # Default matches bp-external-secrets-stores values.yaml
  # `clusterSecretStore.name`.
  externalSecretStoreName: vault-region1
  # Refresh interval for the rendered Secret. Per-app key rotation cadence
  # is controlled at the OpenBao policy layer (SECURITY.md §7); shorter
  # intervals here just amplify Pod restart churn.
  refreshInterval: 1h
  # Auto-register Keycloak users as Gitea local users on first OIDC login.
  # Per SECURITY.md §6.3 every Org user gets one-click SSO across all Apps
  # without seeing OAuth config.
  autoRegisterUsers: true
  # Group claim the realm emits (configmap-sovereign-realm.yaml emits
  # `groups` under the `groups` clientScope).
  groupClaimName: groups
  # Realm group → Gitea admin role mapping. The Sovereign operator
  # (deployment.OrgEmail) is auto-added to `sovereign-admins` by the realm
  # import; users in this group land as Gitea site admins.
  adminGroup: sovereign-admins
  restrictedGroup: ""
  # G117.5 #2744 — Identity Provider hint appended to the authorize_url
  # written into gitea-oauth-source-credentials Secret by the
  # ExternalSecret template. Combined with the bp-keycloak 1.4.9+ realm-
  # config IDR `defaultProvider=catalyst-pin` binding, this delivers
  # silent SSO without the KC username/password form. Per-Sovereign
  # overlay may override (empty string disables defense-in-depth and
  # falls back to --auto-discover-url at OAuth-source configure time).
  idpHint: catalyst-pin
  # #3850 — the sso-configure reconciler (templates/sso-configure-
  # deployment.yaml) re-asserts the `openova-sso` OAuth login source on this
  # cadence so it survives a CNPG DB re-init. 60s balances convergence speed
  # after a DB churn against gitea-API call volume; the assert is a no-op
  # `update-oauth` once the source already matches.
  reconcileIntervalSeconds: 60

# ─── DR-7 (#3375) Git-blob object storage on SeaweedFS S3 + cross-region ──
# mirror ───────────────────────────────────────────────────────────────────
# Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md (bp-gitea row,
# the LAW):
#   State preservation: "Postgres via bp-cnpg-pair sync; Git blobs land on
#   SeaweedFS S3 mirrored cross-region (async, ~seconds lag)".
#   Switchover: "bp-continuum PG demote/promote + PowerDNS flip for
#   gitea.<sov> (30s TTL); Git push paused ~5s". Endpoint: gitea.<sov>.
#
# The PG half (bp-cnpg-pair sync + bp-continuum demote/promote) is already
# implemented and proven (hw128). This block is the MISSING half: wiring
# Gitea's blob-class data (LFS + attachments + packages + repo-archive) onto
# SeaweedFS S3 so it survives a region kill, with async cross-region bucket
# replication (the row's "~seconds lag" mirror).
#
# DEFAULT-OFF / byte-identical: `objectStorage.enabled: false` renders ZERO
# resources (objectstorage-secret.yaml + objectstorage-mirror.yaml are both
# gated on this flag) and injects NO storage env into the gitea Pod. A
# default single-region install keeps Git blobs on the local ReadWriteOnce
# PVC (gitea.persistence above), exactly as origin/main.
#
# WHY env, not gitea.config.storage: the upstream subchart consumes
# `gitea.gitea.additionalConfigFromEnvs` with a plain `toYaml` (not `tpl`),
# so the umbrella chart can NOT template per-Sovereign values (endpoint,
# bucket, region) into the subchart's static list — identical constraint to
# GITEA__database__PASSWD (see the additionalConfigFromEnvs note above). The
# storage env entries are therefore injected by the bootstrap-kit slot-10
# overlay seam (clusters/_template/bootstrap-kit/10-gitea.yaml), which the
# `objectStorage` block here documents verbatim. Gitea's env-to-app.ini
# mechanism maps GITEA__storage__STORAGE_TYPE=minio (SeaweedFS speaks the
# S3/MinIO API on port 8333), GITEA__storage__MINIO_ENDPOINT, etc.
objectStorage:
  # Master switch. false (default) → Git blobs stay on the local RWO PVC,
  # no reflected Secret, no mirror Job — byte-identical single-region render.
  # true → the chart reflects seaweedfs-s3-secret into this namespace and (if
  # mirror.enabled) ships the cross-region replication Job; the slot-10
  # overlay injects the GITEA__storage__* env block sourced from the
  # reflected Secret.
  enabled: false
  # The Gitea storage backend type. `minio` is Gitea's S3-compatible driver;
  # SeaweedFS exposes a MinIO/S3-compatible API on seaweedfs-s3:8333, so
  # `minio` is the correct value (NOT a "seaweedfs" type — Gitea has no such
  # driver; the older README sketch is superseded here).
  storageType: minio
  # Canonical SeaweedFS S3 endpoint (host:port, NO scheme — Gitea's
  # MINIO_ENDPOINT expects host:port and toggles TLS via MINIO_USE_SSL).
  # #3373 Batch A (2026-06-14): bp-seaweedfs moved INSIDE the rtz vCluster
  # #4325 de-vcluster re-homed bp-seaweedfs to the native HOST namespace
  # `seaweedfs` (placement.yaml slot 18 → vcluster: host); the rtz plane
  # vCluster + its syncer-mangled name are gone, so the S3 Service is the plain
  # host-ns name. objectStorage is default-OFF — this default applies only when
  # an operator flips objectStorage.enabled=true. Override `endpoint` for an
  # off-cluster seaweedfs.
  endpoint: seaweedfs-s3.seaweedfs.svc.cluster.local:8333
  # Bucket that holds gitea's blob-class data. Created on first write by the
  # MinIO driver (Gitea auto-creates the bucket if MINIO_BUCKET is absent).
  bucket: gitea-blobs
  # Object-key prefix inside the bucket (lets one SeaweedFS instance host
  # multiple consumers' buckets without key collisions).
  basePath: gitea
  # TLS to the S3 endpoint. false — intra-cluster traffic is encrypted at the
  # Cilium WireGuard layer (matches seaweedfs s3.httpsPort: 0 default).
  useSSL: false
  # S3 region label. SeaweedFS ignores the region for placement but the MinIO
  # client requires a non-empty value; `us-east-1` is the de-facto default.
  location: us-east-1
  # Which blob classes move to S3. Gitea stores SQLite/leveldb METADATA
  # (issue/repo indexers, sessions, queues) on the local PVC — only these
  # blob classes are object-storage-eligible. Each maps to a
  # GITEA__<section>__STORAGE_TYPE=minio override in the overlay.
  classes:
    lfs: true
    attachments: true
    packages: true
    repoArchive: true
  # ─── Source Secret reflection ──────────────────────────────────────────
  # K8s forbids cross-namespace secretKeyRef, so the gitea Pod can't read
  # seaweedfs-s3-secret directly from the seaweedfs namespace. bp-reflector
  # (the same mirror used for gitea-database-secret) copies it into this
  # namespace. objectstorage-secret.yaml creates the reflected placeholder.
  sourceSecret:
    # Namespace + name of the SeaweedFS-generated S3 admin Secret (keys
    # admin_access_key_id / admin_secret_access_key — see
    # platform/seaweedfs/chart/charts/seaweedfs/templates/s3/s3-secret.yaml).
    namespace: seaweedfs
    name: seaweedfs-s3-secret
    # Name of the reflected copy in THIS namespace, consumed by the slot-10
    # overlay's GITEA__storage__MINIO_ACCESS_KEY_ID / _SECRET_ACCESS_KEY
    # secretKeyRef env entries.
    reflectedName: gitea-objectstorage-s3-secret
    accessKeyIdKey: admin_access_key_id
    secretAccessKeyKey: admin_secret_access_key
  # ─── Cross-region async mirror (the row's "~seconds lag" replication) ──
  # SeaweedFS replicates a bucket to a remote SeaweedFS cluster via the
  # Filer Remote Storage mechanism: `weed filer.remote.configure` registers
  # the remote S3 target, then `weed filer.remote.sync` runs a continuous
  # async push of the mounted bucket directory to the remote (sub-second to
  # seconds lag). objectstorage-mirror.yaml renders this as a long-running
  # Deployment on the PRIMARY region only (side: primary), gated on
  # mirror.enabled. The lowest-complexity native SeaweedFS mechanism for the
  # row's "async ~seconds lag cross-region mirror" — see the chart-template
  # header comment for the exact command sequence.
  mirror:
    enabled: false
    # This region's role. The mirror Deployment renders ONLY on the primary
    # (it pushes primary → secondary). On the secondary it renders nothing,
    # so a post-switchover promote can flip roles via the overlay without a
    # bidirectional-write conflict. Stamped from SOVEREIGN_REGION_ROLE by the
    # slot-10 overlay (same substitute bp-cnpg-pair uses).
    side: primary
    # Remote (secondary-region) SeaweedFS S3 endpoint the primary mirrors TO.
    # Reached over Cilium ClusterMesh (the same global-Service plumbing
    # bp-cnpg-pair uses for WAL streaming). Per-Sovereign overlay supplies
    # the secondary region's seaweedfs-s3 global-Service address; empty
    # default leaves the mirror unconfigured (Job logs a clear "remote
    # endpoint unset" and exits non-fatally rather than mirroring nowhere).
    remoteEndpoint: ""
    # Remote S3 credentials Secret (reflected from the secondary region's
    # seaweedfs-s3-secret via ClusterMesh-aware bp-reflector, or supplied by
    # the overlay). Same key names as sourceSecret.
    remoteSecretName: gitea-objectstorage-remote-s3-secret
    remoteAccessKeyIdKey: admin_access_key_id
    remoteSecretAccessKeyKey: admin_secret_access_key
    # SeaweedFS filer the mirror sidecar talks to for the remote.configure /
    # remote.sync gRPC calls. Defaults to the in-cluster filer Service.
    # #4325 de-vcluster: seaweedfs is host-native in ns `seaweedfs` → the filer
    # Service is the plain host-ns name. mirror.enabled is default-OFF; this
    # applies only when the cross-region mirror is enabled.
    filerEndpoint: seaweedfs-filer.seaweedfs.svc.cluster.local:8888
    # Container image for the `weed` CLI. Pulled through the Harbor
    # proxy-cache per CLAUDE.md inviolable rule (bare upstream refs are
    # denied by kyverno harbor-proxy-pull on a converged env).
    image: harbor.openova.io/proxy-dockerhub/chrislusf/seaweedfs:4.22
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ── Bootstrap self-registration (#3687, extends #3370) ───────────────────
# When a bootstrap-kit slot installs this chart, it flips
# bootstrapOwned.enabled=true so templates/application-cr.yaml renders the
# canonical apps.openova.io/v1 Application CR for the slot's HelmRelease
# (the instance card every console surface reads — /apps, Topology,
# showback). Default OFF so console-created instances are not double-carded.
# helmRelease names the owning Flux HelmRelease (the controller's adoption
# path mirrors its Ready condition); namespace is where that HR object
# lives (flux-system for the slot 10 HR).
bootstrapOwned:
  enabled: false
  # Canonical placement token stamped onto the self-registered Application
  # CR's spec.placement (#3375 DoD-1 / #3768 / #3786). MUST be a canonical
  # mode (singleton / active-active / active-hot-standby / active-passive) —
  # NEVER the banned legacy dialect single-region / active-hotstandby, which
  # the read path (readTopology) would surface verbatim to the operator. A
  # leaf bootstrap app installs as one copy, so singleton is the truthful
  # effective mode.
  placement: singleton
  helmRelease:
    name: ""
    namespace: flux-system

# ─── git-data preservation guard (#4354, Refs #4325 #4353) ───────────────────
# The #4325 de-vcluster re-homes gitea from the mgmt vCluster into the host
# `gitea` namespace via a FRESH helm install. The fresh install's PVC
# (`gitea-shared-storage`) dynamically provisions a BRAND-NEW empty PV and
# ABANDONS the prior per-vCluster PV — while gitea's external CNPG metadata DB
# (which lives in its OWN persistent PVC, untouched by the re-home) survives.
# The result is a catastrophic DB↔disk drift: the API reports N repos
# `empty:false` but every `contents?ref=main` 500s "no such file or directory"
# because /data/git/gitea-repositories is empty (the live #4353 P0).
#
# This guard runs as a Helm pre-install,pre-upgrade hook Job — BEFORE the
# upstream subchart's PVC manifest lands and BEFORE the gitea Deployment boots —
# and enforces the invariant: gitea MUST NOT boot a fresh-empty git-data volume
# whenever a prior populated git-data volume exists OR its metadata DB already
# reports repositories.
#
# Decision matrix (idempotent on every reconcile):
#   1. PVC `gitea-shared-storage` already Bound          → NO-OP (steady state).
#   2. No PVC, but a RELEASED/AVAILABLE orphan PV carries
#      the prior gitea git-data (matched by the claimRef
#      name the upstream chart used + the git-data label
#      this chart stamps)                                 → ADOPT: force the
#      adopted PV's reclaim policy to Retain (so a transient unbind can never
#      delete it — #4352 evs-ssd Retain→Delete interaction), clear its stale
#      claimRef, then pre-create the host-ns PVC with `volumeName` set to that
#      PV so the chart-rendered PVC binds to the SAME data volume (the re-home
#      rides the existing repositories across).
#   3. No PVC and no adoptable PV, but the external metadata
#      DB already reports repositories (host-ns re-home onto
#      a surviving DB whose disk was lost)                → FAIL LOUD: the hook
#      exits non-zero, the pre-upgrade gate fails, and the gitea Deployment is
#      NEVER rolled against an empty volume. The operator restores git-data
#      from backup (Velero / SeaweedFS object-store mirror) or re-mirrors from
#      upstream before the install can proceed — no silent empty boot.
#   4. No PVC, no adoptable PV, empty/absent metadata DB
#      (a genuinely FRESH prov)                           → NO-OP: the chart
#      provisions a fresh PVC normally. This is the only case where an empty
#      git-data volume is correct.
gitDataMigration:
  # Master switch. Default ON — the guard is a no-op on a fresh prov (case 4)
  # and only acts when prior state exists, so it is always safe to leave on.
  # An operator who has externalised ALL git-data to object storage
  # (objectStorage.enabled=true with no local repositories) MAY disable it.
  enabled: true
  # The canonical PVC name the upstream gitea subchart binds /data to
  # (gitea.persistence.claimName upstream default). Keep in lockstep with any
  # gitea.persistence.claimName override.
  claimName: gitea-shared-storage
  # When the metadata DB reports repos but no git-data volume can be adopted,
  # the guard fails the install (case 3). Set false ONLY for a deliberate
  # destroy-and-rebuild where losing repositories is acceptable (the guard then
  # logs the drift and allows the empty boot). NEVER flip this to suppress a
  # real data-loss — that is the exact #4353 footgun.
  failOnDbDiskDrift: true
  # kubectl image for the guard Job (mirrors the guacamole recordings-migrate
  # hook convention). Operator-overridable per docs/PRINCIPLES.md #4a.
  # #4369: MUST be the Harbor-proxy form so the cluster-wide Kyverno
  # `harbor-proxy-pull` Enforce policy (admits `*/proxy-*/*` or `*/openova-io/*`)
  # ADMITS the pre-upgrade hook Job. A bare docker.io ref is DENIED at admission,
  # which fails the pre-upgrade gate and rollback-loops the whole gitea HR.
  # Identical proxy ref to sso-configure-deployment.yaml / database-secret-sync-job.yaml.
  image: harbor.openova.io/proxy-dockerhub/bitnamilegacy/kubectl:1.30.7
