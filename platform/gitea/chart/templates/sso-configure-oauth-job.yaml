{{- /*
G91.gitea (#2653) — configure Gitea OAuth source from bp-sso-bridge.

Why this Job instead of upstream gitea.oauth list:
  The upstream chart's `gitea.oauth` list requires `autoDiscoverUrl` to
  be a literal string at chart-render time. Embedding the per-Sovereign
  FQDN there would require every Sovereign to ship a cluster overlay
  for bp-gitea — operationally painful + couples app charts to
  Sovereign-FQDN provisioning. By moving the OAuth-source bootstrap
  here we (a) compute the URL from .Values.sso.sovereignFqdn at chart-
  template time, (b) wait inside the Job for both the gitea Pod and
  the ESO-rendered gitea-oauth-source-credentials Secret, (c) idempotently
  add OR update the auth source.

When this fires:
  - post-install (creates the source)
  - post-upgrade (updates if sovereignFqdn changed or secret rotated;
    update-oauth on an unchanged source is a no-op)

The Job calls into the live gitea Pod via `kubectl exec` rather than
running gitea CLI in its own container so we avoid pinning a gitea
image version here. The Pod is discovered by label selector
(`app.kubernetes.io/name=gitea,app.kubernetes.io/instance=<release>`)
rather than the hard-coded `gitea-0` index — upstream gitea 10.5.0
renders a Deployment (ReplicaSet → `gitea-<hash>-<id>`), not a
StatefulSet, so the index name is wrong (G117.E2E-B1 #2818). The
selector-based lookup also keeps the Job correct if the operator
opts the upstream chart into its StatefulSet mode.
*/ -}}
{{- if and .Values.sso.enabled .Values.sso.sovereignFqdn }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-gitea
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-gitea
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gitea-oauth-source-credentials"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-gitea
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-sso-configure
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-sso-configure
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-gitea
    catalyst.openova.io/component: sso-configure
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-sso-configure
        catalyst.openova.io/blueprint: bp-gitea
        catalyst.openova.io/component: sso-configure
    spec:
      serviceAccountName: {{ .Release.Name }}-sso-configure
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: harbor.openova.io/proxy-dockerhub/bitnamilegacy/kubectl:1.30.7
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: AUTH_NAME
              value: "openova-sso"
            # AUTO_DISCOVER_URL still used as fallback when authorize_url
            # is not yet populated in the ESO Secret (early in install).
            - name: AUTO_DISCOVER_URL
              value: "https://auth.{{ .Values.sso.sovereignFqdn }}/realms/{{ .Values.sso.realm | default "sovereign" }}/.well-known/openid-configuration"
            - name: OIDC_SCOPES
              value: "openid profile email {{ .Values.sso.groupClaimName | default "groups" }}"
            - name: GROUP_CLAIM_NAME
              value: {{ .Values.sso.groupClaimName | default "groups" | quote }}
            - name: ADMIN_GROUP
              value: {{ .Values.sso.adminGroup | default "sovereign-admins" | quote }}
            - name: RESTRICTED_GROUP
              value: {{ .Values.sso.restrictedGroup | default "" | quote }}
            - name: GITEA_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            # G117.E2E-B1 #2818 — selector for the live gitea Pod.
            # Upstream chart 10.5.0 renders a Deployment (ReplicaSet pod
            # name = gitea-<hash>-<id>), so the legacy hard-coded
            # `gitea-0` index never matched on default-config Sovereigns.
            # The Job now resolves the live Pod by these labels.
            - name: POD_SELECTOR
              value: {{ printf "app.kubernetes.io/name=gitea,app.kubernetes.io/instance=%s" .Release.Name | quote }}
            # G117.5 #2744 — IDP_HINT toggles whether we pass the
            # hinted authorize_url via --auth-url + --use-custom-url-
            # mapping. When non-empty the Job reads the
            # already-hinted `authorize_url` key out of
            # gitea-oauth-source-credentials and constructs the explicit
            # URL set. When empty we fall back to --auto-discover-url
            # only (pre-G117.5 behaviour) so non-Catalyst installs still
            # work.
            - name: IDP_HINT
              value: {{ .Values.sso.idpHint | quote }}
            - name: OAUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: gitea-oauth-source-credentials
                  key: key
            - name: OAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitea-oauth-source-credentials
                  key: secret
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # G117.5 #2744 — mount the full SSO Secret so the Job can
            # read authorize_url/token_url/userinfo_url alongside the
            # short key+secret env vars.
            - name: sso-bundle
              mountPath: /etc/sso-bundle
              readOnly: true
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              echo "[$(date -u +%FT%TZ)] G91.gitea SSO configure starting."
              echo "  AUTH_NAME=${AUTH_NAME}"
              echo "  AUTO_DISCOVER_URL=${AUTO_DISCOVER_URL}"
              echo "  ADMIN_GROUP=${ADMIN_GROUP}"
              echo "  GITEA_NAMESPACE=${GITEA_NAMESPACE}"
              echo "  IDP_HINT=${IDP_HINT}"
              echo "  POD_SELECTOR=${POD_SELECTOR}"

              # G117.E2E-B1 #2818: Resolve the live gitea Pod by label
              # selector. Upstream gitea 10.5.0 renders a Deployment
              # (ReplicaSet pod name = gitea-<hash>-<id>), not a
              # StatefulSet, so the legacy hard-coded `gitea-0` lookup
              # never matches and the hook always times out.
              #
              # Wait for at least one Ready Pod matching the selector
              # (up to 10 min — first install races bp-cnpg + ESO + the
              # upstream init container).
              GITEA_POD=""
              echo "[$(date -u +%FT%TZ)] waiting for a Ready gitea Pod (selector=${POD_SELECTOR})..."
              for i in $(seq 1 60); do
                GITEA_POD="$(kubectl get pod -n "${GITEA_NAMESPACE}" \
                  -l "${POD_SELECTOR}" \
                  -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.metadata.name}{"\t"}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\n"}{end}' \
                  2>/dev/null \
                  | awk -F '\t' '$2=="True" {print $1; exit}' || true)"
                if [ -n "${GITEA_POD}" ]; then
                  echo "[$(date -u +%FT%TZ)] selected pod=${GITEA_POD} (Ready)."
                  break
                fi
                echo "  attempt $i/60: no Ready pod matching selector; sleeping 10s..."
                sleep 10
              done

              if [ -z "${GITEA_POD}" ]; then
                echo "FATAL: no Ready gitea Pod matched selector '${POD_SELECTOR}' within 10 min." >&2
                echo "  current pods in namespace:" >&2
                kubectl get pod -n "${GITEA_NAMESPACE}" -l "${POD_SELECTOR}" >&2 || true
                exit 1
              fi

              # Idempotency: check if an OAuth source with this name exists.
              echo "[$(date -u +%FT%TZ)] checking existing auth sources (via pod ${GITEA_POD})..."
              AUTH_LIST="$(kubectl exec -n "${GITEA_NAMESPACE}" "${GITEA_POD}" -- \
                gitea admin auth list --vertical-bars 2>&1 || true)"
              echo "${AUTH_LIST}"

              AUTH_ID="$(echo "${AUTH_LIST}" \
                | awk -F '|' -v name="${AUTH_NAME}" \
                  '$2 ~ name && $3 ~ /OAuth2/ {gsub(/ /,"",$1); print $1}' \
                | head -n1 || true)"

              # G117.5: if the ESO-rendered Secret already carries the
              # hinted authorize_url, use --use-custom-url-mapping +
              # --auth-url so the IDP hint reaches KC. Otherwise fall
              # back to auto-discover.
              AUTH_URL_FILE="/etc/sso-bundle/authorize_url"
              TOKEN_URL_FILE="/etc/sso-bundle/token_url"
              USERINFO_URL_FILE="/etc/sso-bundle/userinfo_url"

              if [ -n "${IDP_HINT}" ] \
                 && [ -s "${AUTH_URL_FILE}" ] \
                 && [ -s "${TOKEN_URL_FILE}" ] \
                 && [ -s "${USERINFO_URL_FILE}" ]; then
                AUTH_URL="$(cat "${AUTH_URL_FILE}")"
                TOKEN_URL="$(cat "${TOKEN_URL_FILE}")"
                USERINFO_URL="$(cat "${USERINFO_URL_FILE}")"
                echo "[$(date -u +%FT%TZ)] using custom URL mapping (IDP_HINT=${IDP_HINT})"
                echo "  AUTH_URL=${AUTH_URL}"
                COMMON_ARGS=(
                  --provider openidConnect
                  --key "${OAUTH_KEY}"
                  --secret "${OAUTH_SECRET}"
                  --use-custom-url-mapping
                  --custom-auth-url "${AUTH_URL}"
                  --custom-token-url "${TOKEN_URL}"
                  --custom-profile-url "${USERINFO_URL}"
                  --scopes "${OIDC_SCOPES}"
                  --group-claim-name "${GROUP_CLAIM_NAME}"
                  --admin-group "${ADMIN_GROUP}"
                )
              else
                echo "[$(date -u +%FT%TZ)] using auto-discover (no IDP_HINT or ESO Secret not yet populated)"
                COMMON_ARGS=(
                  --provider openidConnect
                  --key "${OAUTH_KEY}"
                  --secret "${OAUTH_SECRET}"
                  --auto-discover-url "${AUTO_DISCOVER_URL}"
                  --scopes "${OIDC_SCOPES}"
                  --group-claim-name "${GROUP_CLAIM_NAME}"
                  --admin-group "${ADMIN_GROUP}"
                )
              fi

              if [ -n "${RESTRICTED_GROUP}" ]; then
                COMMON_ARGS+=( --restricted-group "${RESTRICTED_GROUP}" )
              fi

              if [ -z "${AUTH_ID}" ]; then
                echo "[$(date -u +%FT%TZ)] adding new OAuth source '${AUTH_NAME}'..."
                kubectl exec -n "${GITEA_NAMESPACE}" "${GITEA_POD}" -- \
                  gitea admin auth add-oauth --name "${AUTH_NAME}" "${COMMON_ARGS[@]}"
              else
                echo "[$(date -u +%FT%TZ)] updating OAuth source id=${AUTH_ID} ('${AUTH_NAME}')..."
                kubectl exec -n "${GITEA_NAMESPACE}" "${GITEA_POD}" -- \
                  gitea admin auth update-oauth --id "${AUTH_ID}" --name "${AUTH_NAME}" "${COMMON_ARGS[@]}"
              fi

              echo "[$(date -u +%FT%TZ)] OAuth source configured. Final list:"
              kubectl exec -n "${GITEA_NAMESPACE}" "${GITEA_POD}" -- gitea admin auth list
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        # G117.5 #2744 — the full SSO Secret as a projected volume so
        # the Job reads the hinted authorize_url alongside the bare
        # client_id+client_secret. optional=true so the Job still
        # renders + runs in the fallback (--auto-discover-url) path on
        # first install before ESO has populated the bundle keys.
        - name: sso-bundle
          secret:
            secretName: gitea-oauth-source-credentials
            optional: true
{{- end }}
