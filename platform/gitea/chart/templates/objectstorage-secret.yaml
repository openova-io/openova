{{- /*
DR-7 (#3375) — reflected SeaweedFS S3 credentials for Git-blob object storage.

Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md (bp-gitea row,
the LAW): "Git blobs land on SeaweedFS S3 mirrored cross-region (async,
~seconds lag)". To put gitea's blob-class data (LFS + attachments + packages
+ repo-archive) on SeaweedFS S3, the gitea Pod needs the S3 admin
access/secret keys as GITEA__storage__MINIO_ACCESS_KEY_ID /
GITEA__storage__MINIO_SECRET_ACCESS_KEY env vars (the slot-10 overlay wires
the secretKeyRef env entries against the reflected Secret this template
materialises).

K8s forbids cross-namespace secretKeyRef, and the SeaweedFS-generated
seaweedfs-s3-secret lives in the `seaweedfs` namespace (keys
admin_access_key_id / admin_secret_access_key — see
platform/seaweedfs/chart/charts/seaweedfs/templates/s3/s3-secret.yaml). So
this is the SAME reflector bridge pattern templates/database-secret.yaml
already uses for the CNPG-generated gitea-pg-app password: bp-reflector
copies the source Secret's keys into this namespace, event-driven, as soon
as the source exists or rotates. No plaintext credential appears in this
committed template (docs/INVIOLABLE-PRINCIPLES.md #10).

DEFAULT-OFF / byte-identical: gated on `objectStorage.enabled` (default
false), so a default `helm template` renders nothing here and a single-
region install keeps Git blobs on the local RWO PVC.
*/}}
{{- if .Values.objectStorage.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.objectStorage.sourceSecret.reflectedName | default "gitea-objectstorage-s3-secret" }}
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-gitea
    catalyst.openova.io/component: gitea
  annotations:
    # bp-reflector copies all keys from the source seaweedfs-s3-secret into
    # this Secret. Source format: <namespace>/<name>. The source Secret is
    # generated by bp-seaweedfs (helm.sh/resource-policy: keep) and the
    # seaweedfsOverlay PR annotates it reflection-allowed; on a Sovereign
    # where that annotation is owned by the source side, this `reflects`
    # annotation is the destination half of the contract.
    reflector.v1.k8s.emberstack.com/reflects: "{{ .Values.objectStorage.sourceSecret.namespace | default "seaweedfs" }}/{{ .Values.objectStorage.sourceSecret.name | default "seaweedfs-s3-secret" }}"
    # Helm resource-policy keep — the Secret is independently managed by
    # reflector after initial creation; do not delete on helm uninstall.
    helm.sh/resource-policy: keep
type: Opaque
# Bootstrap empty data — reflector overwrites these within seconds of the
# source Secret being observed. Empty values prevent CreateContainerConfig
# Error (secret key missing) if the gitea Pod's env references this Secret
# before reflector has run.
data:
  {{ .Values.objectStorage.sourceSecret.accessKeyIdKey | default "admin_access_key_id" }}: ""
  {{ .Values.objectStorage.sourceSecret.secretAccessKeyKey | default "admin_secret_access_key" }}: ""
{{- end }}
