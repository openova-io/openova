{{- /*
G91.gitea (#2653) — OAuth source Secret for the SSO bridge.

The bp-sso-bridge framework (G91.1 #2652) writes the canonical OIDC
client bundle into OpenBao at `secret/sso/<clientId>` with keys:
  client_id, client_secret, issuer_url, authorize_url, token_url,
  userinfo_url, end_session_url.

The upstream gitea chart's `configure_oauth` init function (chart 10.5
templates/gitea/init.yaml) expects an `existingSecret` Secret with two
fixed key names: `key` (= client_id) and `secret` (= client_secret).

We don't push that schema-coupling back into bp-sso-bridge — each
per-app integration owns the translation from canonical bridge schema
to the app's upstream-expected schema. This ExternalSecret remaps the
canonical OpenBao keys into Gitea's expected key names.

Sourced from OpenBao via the per-Sovereign ClusterSecretStore
`vault-region1` (bp-external-secrets-stores values.yaml default).

This Secret is consumed by the configure-sso-oauth Job
(templates/sso-configure-oauth-job.yaml) via secretKeyRef env vars.
*/ -}}
{{- if .Values.sso.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitea-oauth-source-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-gitea
    bp-sso-bridge.openova.io/consumer: bp-gitea
spec:
  refreshInterval: {{ .Values.sso.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.sso.externalSecretStoreName | default "vault-region1" }}
    kind: ClusterSecretStore
  target:
    name: gitea-oauth-source-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          catalyst.openova.io/blueprint: bp-gitea
          bp-sso-bridge.openova.io/consumer: bp-gitea
      data:
        # Upstream gitea chart's existingSecret schema.
        key:    "{{ "{{ .client_id }}" }}"
        secret: "{{ "{{ .client_secret }}" }}"
        # Extra keys carried alongside for the configure-oauth Job.
        issuer_url:   "{{ "{{ .issuer_url }}" }}"
        # G117.5 #2744 — auth_url carries ?kc_idp_hint=catalyst-pin so
        # KC's IDR delegates silently to the catalyst-pin broker without
        # prompting username/password. Defense-in-depth to the realm-
        # config IDR `defaultProvider` binding (bp-keycloak 1.4.9+).
        # Consumed by templates/sso-configure-oauth-job.yaml via
        # `gitea admin auth add-oauth --use-custom-url-mapping --auth-url`.
        # Hint suffix omitted entirely when sso.idpHint is "" (operator
        # opt-out: realm-config IDR `defaultProvider` still delivers
        # silent SSO).
        {{- if .Values.sso.idpHint }}
        authorize_url: "{{ "{{ .authorize_url }}" }}?kc_idp_hint={{ .Values.sso.idpHint }}"
        {{- else }}
        authorize_url: "{{ "{{ .authorize_url }}" }}"
        {{- end }}
        token_url:    "{{ "{{ .token_url }}" }}"
        userinfo_url: "{{ "{{ .userinfo_url }}" }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "gitea" }}
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "gitea" }}
        property: client_secret
    - secretKey: issuer_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "gitea" }}
        property: issuer_url
    - secretKey: authorize_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "gitea" }}
        property: authorize_url
    - secretKey: token_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "gitea" }}
        property: token_url
    - secretKey: userinfo_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "gitea" }}
        property: userinfo_url
{{- end }}
