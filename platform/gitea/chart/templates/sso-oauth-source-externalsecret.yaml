{{- /*
G91.gitea (#2653) — OAuth source Secret for the SSO bridge.

The bp-sso-bridge framework (G91.1 #2652) writes the canonical OIDC
client bundle into OpenBao at `secret/sso/<clientId>` with keys:
  client_id, client_secret, issuer_url, authorize_url, token_url,
  userinfo_url, end_session_url.

The upstream gitea chart's `configure_oauth` init function (chart 10.5
templates/gitea/init.yaml) expects an `existingSecret` Secret with two
fixed key names: `key` (= client_id) and `secret` (= client_secret).

We don't push that schema-coupling back into bp-sso-bridge — each
per-app integration owns the translation from canonical bridge schema
to the app's upstream-expected schema. This ExternalSecret remaps the
canonical OpenBao keys into Gitea's expected key names.

Sourced from OpenBao via the per-Sovereign ClusterSecretStore
`vault-region1` (bp-external-secrets-stores values.yaml default).

This Secret is consumed by the configure-sso-oauth Job
(templates/sso-configure-oauth-job.yaml) via secretKeyRef env vars.
*/ -}}
{{/*
#2988 ESO-CRD guard (gold standard: bp-external-dns externalsecret.yaml):
without the Capabilities check, installing this chart on a cluster where
the external-secrets.io CRDs are not yet established fails at manifest-
build time ("no matches for kind ExternalSecret") and wedges the whole
install — caught live as the fresh-prov sso ExternalSecret CRD race and
reproduced verbatim by the bp-openbao fresh-prov CI gate (kind cluster,
no ESO). With the guard, the resource is simply omitted until the next
Flux reconcile re-renders once the CRD exists (Capabilities re-evaluated
every reconcile), so SSO wiring self-heals with zero manual touch.
*/}}
{{- /*
#3934 (Refs #3642): split-gate. When gitea is host-bridged into the mgmt
vCluster (the #3642 placement), the HOST renders this ExternalSecret (the
external-secrets-operator lives on the host, and the OpenBao
ClusterSecretStore is a host resource the vCluster apiserver can't expose
to). placement.yaml's hostBridge.suppress sets `sso.externalSecret.enabled:
false` so the chart does NOT also render an in-vCluster copy (double-owner) —
WITHOUT disabling `sso.enabled`, which still renders the sso-configure
Deployment IN the vCluster (it kubectl-exec's the live gitea Pod, so it
belongs alongside it; its creds arrive via the bp-mgmt-vcluster fromHost
secret-crossing of `gitea-oauth-source-credentials`). On a non-host-bridged
prov `sso.externalSecret.enabled` defaults true → byte-identical render.
*/}}
{{- $esEnabled := true }}
{{- if .Values.sso.externalSecret }}{{- if hasKey .Values.sso.externalSecret "enabled" }}{{- $esEnabled = .Values.sso.externalSecret.enabled }}{{- end }}{{- end }}
{{- if and .Values.sso.enabled $esEnabled (.Capabilities.APIVersions.Has "external-secrets.io/v1beta1") }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitea-oauth-source-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-gitea
    bp-sso-bridge.openova.io/consumer: bp-gitea
spec:
  refreshInterval: {{ .Values.sso.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.sso.externalSecretStoreName | default "vault-region1" }}
    kind: ClusterSecretStore
  target:
    name: gitea-oauth-source-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          catalyst.openova.io/blueprint: bp-gitea
          bp-sso-bridge.openova.io/consumer: bp-gitea
      data:
        # Upstream gitea chart's existingSecret schema.
        key:    "{{ "{{ .client_id }}" }}"
        secret: "{{ "{{ .client_secret }}" }}"
        # Extra keys carried alongside for the configure-oauth Job.
        issuer_url:   "{{ "{{ .issuer_url }}" }}"
        # G117.5 #2744 — auth_url carries ?kc_idp_hint=catalyst-pin so
        # KC's IDR delegates silently to the catalyst-pin broker without
        # prompting username/password. Defense-in-depth to the realm-
        # config IDR `defaultProvider` binding (bp-keycloak 1.4.9+).
        # Consumed by templates/sso-configure-oauth-job.yaml via
        # `gitea admin auth add-oauth --use-custom-url-mapping --auth-url`.
        # Hint suffix omitted entirely when sso.idpHint is "" (operator
        # opt-out: realm-config IDR `defaultProvider` still delivers
        # silent SSO).
        {{- if .Values.sso.idpHint }}
        authorize_url: "{{ "{{ .authorize_url }}" }}?kc_idp_hint={{ .Values.sso.idpHint }}"
        {{- else }}
        authorize_url: "{{ "{{ .authorize_url }}" }}"
        {{- end }}
        token_url:    "{{ "{{ .token_url }}" }}"
        userinfo_url: "{{ "{{ .userinfo_url }}" }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "gitea" }}
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "gitea" }}
        property: client_secret
    - secretKey: issuer_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "gitea" }}
        property: issuer_url
    - secretKey: authorize_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "gitea" }}
        property: authorize_url
    - secretKey: token_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "gitea" }}
        property: token_url
    - secretKey: userinfo_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "gitea" }}
        property: userinfo_url
{{- end }}
