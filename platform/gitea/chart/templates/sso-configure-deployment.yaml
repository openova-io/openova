{{- /*
G91.gitea (#2653) — configure Gitea OAuth source from bp-sso-bridge.
1.2.38 (#3850, 2026-06-19): CONVERTED from a one-shot post-install/
post-upgrade Helm hook Job to a continuously-reconciling Deployment
(the proven openbao-sso-configure pattern — platform/openbao/chart/
templates/sso-configure-deployment.yaml).

Why a Deployment instead of a Helm post-install hook (the durability fix):
  The prior hook ran ONCE at install (hook-delete-policy:
  before-hook-creation,hook-succeeded → the Job was deleted on success)
  and would only re-fire on the NEXT chart upgrade. But gitea's OAuth
  source is a row in gitea's CNPG database, and that DB churns / re-
  initializes during convergence (CNPG remediation-recreate, restore,
  re-bootstrap). When the DB re-inits, the `login_source` row is lost and
  NOTHING re-asserts it until an operator bumps the chart — so the source
  silently vanishes and `GET /user/oauth2/openova-sso` 500s with
  `oauth2 source not found` (caught live hw167 2026-06-19, #3850; gitea's
  SSO was dead while openbao's survived the same churn precisely because
  openbao already uses this continuous-reconciler shape).

  A single-replica Deployment running a {{ .Values.sso.reconcileIntervalSeconds | default 60 }}s
  loop re-asserts the source idempotently on every tick: it tolerates the
  Secret / gitea Pod being absent on early ticks (continue), and converges
  the source within one tick of any DB re-init. The add/update logic +
  every hard-won fix (pod-selector lookup #2818, TAB-stripping AUTH_ID
  #2816, public-first discovery URL #3150) is carried verbatim from the
  former hook.

Why this reconciler instead of upstream gitea.oauth list:
  The upstream chart's `gitea.oauth` list requires `autoDiscoverUrl` to
  be a literal string at chart-render time. Embedding the per-Sovereign
  FQDN there would require every Sovereign to ship a cluster overlay
  for bp-gitea — operationally painful + couples app charts to
  Sovereign-FQDN provisioning. By computing the URL from
  .Values.sso.sovereignFqdn at chart-template time we keep the app chart
  Sovereign-agnostic.

The reconciler calls into the live gitea Pod via `kubectl exec` rather
than running gitea CLI in its own container so we avoid pinning a gitea
image version here. The Pod is discovered by label selector
(`app.kubernetes.io/name=gitea,app.kubernetes.io/instance=<release>`)
rather than the hard-coded `gitea-0` index — upstream gitea 10.5.0
renders a Deployment (ReplicaSet → `gitea-<hash>-<id>`), not a
StatefulSet (#2818).
*/ -}}
{{- if and .Values.sso.enabled .Values.sso.sovereignFqdn }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-gitea
    app.kubernetes.io/name: gitea-sso-configure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-gitea
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gitea-oauth-source-credentials"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-gitea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-sso-configure
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-sso-configure
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-gitea
data:
  reconcile.sh: |
    #!/usr/bin/env bash
    # bp-gitea sso-configure reconcile loop (G91.gitea #2653 / #3850).
    # Idempotently asserts the `openova-sso` OAuth login source on every
    # tick so it survives a CNPG DB re-init (the durability fix).
    set -uo pipefail

    log() { echo "[$(date -u +%FT%TZ)] $*"; }

    # ── Discovery URL: PUBLIC-first, in-cluster fallback (#3150) ──
    #
    # gitea's `openidConnect` provider builds the browser-facing
    # `authorization_endpoint` it 307-redirects to STRICTLY from the
    # discovery doc fetched at the persisted AUTO_DISCOVER_URL.
    # `--custom-auth-url` / `--use-custom-urls` are IGNORED for the
    # openidConnect provider (CustomURLMapping stays `{}` — verified live
    # on hw124), so whichever discovery URL the source PERSISTS decides the
    # redirect target at every login.
    #
    # KC here runs hostname-DYNAMIC (no KC_HOSTNAME/frontendUrl): it
    # reflects the request Host into the discovery doc's endpoint URLs.
    # Fetching over the in-cluster service yields
    # `authorization_endpoint: http://keycloak.keycloak.svc.cluster.local/...`,
    # which the operator's BROWSER cannot resolve, so silent-SSO never
    # fires. The fix: PERSIST the PUBLIC discovery URL so the 307 targets
    # `https://auth.<fqdn>/...` — browser-reachable, and the sovereign-realm
    # IDR (`defaultProvider=catalyst-pin`) silently delegates with no login
    # form.
    #
    # gitea VALIDATES the discovery URL by FETCHING it at add/update-oauth,
    # and `auth.<fqdn>` is unreachable until the cilium gateway envoy binds.
    # So each tick tries PUBLIC_DISCOVER_URL first and falls back to the
    # in-cluster AUTO_DISCOVER_URL only when the public add/update fails; a
    # later tick converges the source to the public URL once the gateway is
    # up.

    build_common_args() {
      # $1 = discovery URL to use
      COMMON_ARGS=(
        --provider openidConnect
        --key "${OAUTH_KEY}"
        --secret "${OAUTH_SECRET}"
        --auto-discover-url "$1"
        --scopes "${OIDC_SCOPES}"
        --group-claim-name "${GROUP_CLAIM_NAME}"
        --admin-group "${ADMIN_GROUP}"
      )
      if [ -n "${RESTRICTED_GROUP}" ]; then
        COMMON_ARGS+=( --restricted-group "${RESTRICTED_GROUP}" )
      fi
    }

    log "bp-gitea sso-configure starting; interval=${INTERVAL_SECONDS}s"
    log "  AUTH_NAME=${AUTH_NAME} ADMIN_GROUP=${ADMIN_GROUP} GITEA_NAMESPACE=${GITEA_NAMESPACE} POD_SELECTOR=${POD_SELECTOR}"

    while true; do
      sleep "${INTERVAL_SECONDS}"

      # Read the OAuth client creds from the MOUNTED Secret each tick (not
      # baked-once env) so a late ESO population OR a key rotation is picked
      # up without a Pod roll — the openbao-sso-configure file-read posture.
      # The Secret volume is optional:true, so the files are simply absent on
      # early ticks before bp-sso-bridge has written it (#3850).
      if [ ! -f /etc/sso-creds/key ] || [ ! -f /etc/sso-creds/secret ]; then
        log "gitea-oauth-source-credentials key/secret not yet present (bp-sso-bridge may not have run yet) — waiting"
        continue
      fi
      OAUTH_KEY="$(cat /etc/sso-creds/key 2>/dev/null)"
      OAUTH_SECRET="$(cat /etc/sso-creds/secret 2>/dev/null)"
      if [ -z "${OAUTH_KEY}" ] || [ -z "${OAUTH_SECRET}" ]; then
        log "ESO Secret present but key/secret empty — waiting"
        continue
      fi

      # Resolve the live gitea Pod by label selector. Upstream gitea 10.5.0
      # renders a Deployment (ReplicaSet pod name = gitea-<hash>-<id>), not a
      # StatefulSet, so the legacy hard-coded `gitea-0` lookup never matches
      # (#2818). Take the first Pod with Ready=True.
      GITEA_POD="$(kubectl get pod -n "${GITEA_NAMESPACE}" \
        -l "${POD_SELECTOR}" \
        -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.metadata.name}{"\t"}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\n"}{end}' \
        2>/dev/null \
        | awk -F '\t' '$2=="True" {print $1; exit}' || true)"
      if [ -z "${GITEA_POD}" ]; then
        log "no Ready gitea Pod matching selector '${POD_SELECTOR}' yet — waiting"
        continue
      fi

      # Idempotency: check if an OAuth source with this name exists.
      AUTH_LIST="$(kubectl exec -n "${GITEA_NAMESPACE}" "${GITEA_POD}" -- \
        gitea admin auth list --vertical-bars 2>&1 || true)"

      # NOTE: `gitea admin auth list --vertical-bars` separates fields with
      # literal `|` BUT pads each cell with TABS, not spaces — so $1 reads
      # back as `1\t` even after stripping spaces. Strip all whitespace
      # (spaces + tabs + CR) before use; gitea CLI rejects `--id "1\t"` with
      # "parse error" (#2816, caught live hw86).
      AUTH_ID="$(echo "${AUTH_LIST}" \
        | awk -F '|' -v name="${AUTH_NAME}" \
          '$2 ~ name && $3 ~ /OAuth2/ {gsub(/[[:space:]]+/,"",$1); print $1}' \
        | head -n1 || true)"

      # Ordered discovery-URL candidates: public first (browser-reachable),
      # in-cluster fallback (always reachable, but persists internal endpoint
      # URLs the browser can't resolve). Skip the public candidate when
      # sovereignFqdn is empty (template renders host as `auth./`).
      DISCOVER_CANDIDATES=()
      case "${PUBLIC_DISCOVER_URL}" in
        "https://auth./"*) : ;;  # empty sovereignFqdn — skip public
        "") : ;;
        *) DISCOVER_CANDIDATES+=( "${PUBLIC_DISCOVER_URL}" ) ;;
      esac
      DISCOVER_CANDIDATES+=( "${AUTO_DISCOVER_URL}" )

      applied=""
      for DISCOVER_URL in "${DISCOVER_CANDIDATES[@]}"; do
        build_common_args "${DISCOVER_URL}"
        if [ -z "${AUTH_ID}" ]; then
          log "adding OAuth source '${AUTH_NAME}' via ${DISCOVER_URL} (pod ${GITEA_POD})..."
          if kubectl exec -n "${GITEA_NAMESPACE}" "${GITEA_POD}" -- \
            gitea admin auth add-oauth --name "${AUTH_NAME}" "${COMMON_ARGS[@]}"; then
            applied="yes"; break
          fi
        else
          log "updating OAuth source id=${AUTH_ID} ('${AUTH_NAME}') via ${DISCOVER_URL} (pod ${GITEA_POD})..."
          if kubectl exec -n "${GITEA_NAMESPACE}" "${GITEA_POD}" -- \
            gitea admin auth update-oauth --id "${AUTH_ID}" --name "${AUTH_NAME}" "${COMMON_ARGS[@]}"; then
            applied="yes"; break
          fi
        fi
        log "  discovery URL ${DISCOVER_URL} not yet usable (gateway settling?); trying next candidate..."
      done

      if [ -z "${applied}" ]; then
        log "no discovery URL usable this tick; retrying next tick"
        continue
      fi

      log "tick complete — OAuth source '${AUTH_NAME}' converged (id=${AUTH_ID:-new})"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-gitea
    app.kubernetes.io/name: gitea-sso-configure
    catalyst.openova.io/component: sso-configure
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-sso-configure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-sso-configure
        catalyst.openova.io/blueprint: bp-gitea
        catalyst.openova.io/component: sso-configure
      annotations:
        # Force re-roll when sso.sovereignFqdn or admin group change.
        checksum/sso-config: {{ printf "%s:%s:%s:%s" (.Values.sso.sovereignFqdn | default "") (.Values.sso.adminGroup | default "") (.Values.sso.groupClaimName | default "") (.Values.sso.realm | default "") | sha256sum }}
        # #3850 — the reconcile loop lives in the gitea-sso-configure
        # ConfigMap (reconcile.sh). A change to that SCRIPT does not alter
        # this Pod template, so without a revision marker a helm upgrade
        # leaves the OLD pod running the OLD script with the stale mounted
        # ConfigMap (same trap caught on bp-openbao hw133). Hashing the chart
        # version forces a roll on every chart bump — and the script-lockstep
        # rule means a script change always bumps the chart.
        checksum/reconcile-script: {{ .Chart.Version | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-sso-configure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: harbor.openova.io/proxy-dockerhub/bitnamilegacy/kubectl:1.30.7
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash"]
          args: ["/etc/gitea-sso/reconcile.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: AUTH_NAME
              value: "openova-sso"
            - name: AUTO_DISCOVER_URL
              value: "{{ .Values.sso.keycloakInternalURL | default "http://keycloak.keycloak.svc.cluster.local" }}/realms/{{ .Values.sso.realm | default "sovereign" }}/.well-known/openid-configuration"
            - name: PUBLIC_DISCOVER_URL
              value: "https://auth.{{ .Values.sso.sovereignFqdn }}/realms/{{ .Values.sso.realm | default "sovereign" }}/.well-known/openid-configuration"
            - name: OIDC_SCOPES
              value: "openid profile email {{ .Values.sso.groupClaimName | default "groups" }}"
            - name: GROUP_CLAIM_NAME
              value: {{ .Values.sso.groupClaimName | default "groups" | quote }}
            - name: ADMIN_GROUP
              value: {{ .Values.sso.adminGroup | default "sovereign-admins" | quote }}
            - name: RESTRICTED_GROUP
              value: {{ .Values.sso.restrictedGroup | default "" | quote }}
            - name: GITEA_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            # #2818 — selector for the live gitea Pod (Deployment, not
            # StatefulSet, so the legacy `gitea-0` index never matched).
            - name: POD_SELECTOR
              value: {{ printf "app.kubernetes.io/name=gitea,app.kubernetes.io/instance=%s" .Release.Name | quote }}
            # OAUTH_KEY / OAUTH_SECRET are NOT injected as env — the loop
            # reads them from the optional /etc/sso-creds mount each tick so a
            # late ESO population or key rotation is picked up without a Pod
            # roll (openbao-sso-configure file-read posture, #3850).
            - name: INTERVAL_SECONDS
              value: {{ .Values.sso.reconcileIntervalSeconds | default 60 | quote }}
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: script
              mountPath: /etc/gitea-sso
              readOnly: true
            - name: sso-creds
              mountPath: /etc/sso-creds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-sso-configure
            defaultMode: 0555
        # optional:true so the Pod renders + starts before bp-sso-bridge's
        # ExternalSecret has populated gitea-oauth-source-credentials; the
        # reconcile loop tolerates the absent files on early ticks (#3850).
        - name: sso-creds
          secret:
            secretName: gitea-oauth-source-credentials
            optional: true
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
