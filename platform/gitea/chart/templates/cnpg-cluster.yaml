{{- /*
CNPG-managed Postgres cluster for Gitea.

Gitea requires PostgreSQL for its database (repositories, users, issues,
pull requests, etc.). bp-gitea ships this Cluster CR so the database is
provisioned by CNPG alongside the HelmRelease — no separate Helm release or
manual setup required. Mirrors the same pattern used by bp-harbor
(platform/harbor/chart/templates/cnpg-cluster.yaml).

The Cluster name defaults to `gitea-pg`; CNPG synthesises a `gitea-pg-app`
Secret that `templates/database-secret.yaml` mirrors via reflector into
`gitea-database-secret`, which the Gitea deployment reads for the DB password.

Capabilities gate: bp-cnpg ships the `postgresql.cnpg.io/v1` CRD. On a cold
install before bp-cnpg is reconciling, the apiserver rejects this Cluster.
The Capabilities check skips this template until the CRD is registered.
The Sovereign's bootstrap order MUST land bp-cnpg before bp-gitea.

ADR-0010 SHARING gate: `postgres.cluster.enabled` (default true → 1:1
behavior unchanged) can be set false by an overlay so bp-gitea consumes
a SHARED bp-postgres data-instance instead of shipping its own Cluster.
When disabled, the Database CR + role + reflected `gitea-database-secret`
are provisioned by the shared bp-postgres instance, and gitea's DB host
points at the shared cluster's `-rw` Service.
*/}}
{{- if and (ne (toString .Values.postgres.cluster.enabled) "false") (.Capabilities.APIVersions.Has "postgresql.cnpg.io/v1") }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.cluster.name | default "gitea-pg" }}
  namespace: {{ .Values.postgres.cluster.namespace | default .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-gitea
    catalyst.openova.io/component: gitea
spec:
  instances: {{ .Values.postgres.cluster.instances | default 1 }}
  imageName: {{ .Values.postgres.cluster.imageName | default "harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql" }}:{{ .Values.postgres.cluster.pgVersion | default "16" }}

  {{- /*
  G93.3 (Refs #2668) — when instances >= 2, default the CNPG
  Cluster CR's affinity.topologyKey to topology.kubernetes.io/region
  so the CNPG operator's auto-generated podAntiAffinity spreads
  replicas across regions on Cilium ClusterMesh peers (Pillar 3 zero-
  tx-loss). Single-instance Sovereigns skip the block so the CNPG
  operator falls back to its upstream default (kubernetes.io/hostname,
  preferred) and a single-node prod still schedules. Operator
  overrides via .Values.postgres.cluster.affinity.{topologyKey,
  podAntiAffinityType} if the chart-default is wrong for the
  deployment shape.
  */ -}}
  {{- if ge (int (.Values.postgres.cluster.instances | default 1)) 2 }}
  affinity:
    topologyKey: {{ (default dict .Values.postgres.cluster.affinity).topologyKey | default "topology.kubernetes.io/region" | quote }}
    podAntiAffinityType: {{ (default dict .Values.postgres.cluster.affinity).podAntiAffinityType | default "preferred" | quote }}
  {{- end }}

  bootstrap:
    initdb:
      database: {{ .Values.postgres.cluster.database | default "gitea" | quote }}
      owner: {{ .Values.postgres.cluster.owner | default "gitea" | quote }}

  # Wave 5.35 (Refs #2211): explicit declarative role management.
  # CNPG synthesises the gitea role at initdb time AND the gitea-pg-app
  # Secret independently. In practice the two values can drift — either
  # because initdb sets a different password than what eventually lands
  # in the Secret, OR because a Secret rotation isn't applied back to
  # the role. Live evidence (hw01 30th HCS 2026-05-23): gitea-app init
  # container crashed with `pq: password authentication failed for user
  # "gitea"` despite gitea-pg-app.password being non-empty and matching
  # gitea-database-secret.password. Manual `ALTER USER gitea WITH
  # PASSWORD '<gitea-pg-app value>'` resolved it.
  #
  # `spec.managed.roles[]` with passwordSecret pointing at the canonical
  # gitea-pg-app Secret makes CNPG reconcile the role's password to
  # match the Secret value on every Cluster reconcile. Any drift gets
  # ALTER USER'd away. The Secret name follows CNPG's own naming
  # convention so this works even on fresh provisions — when CNPG first
  # creates gitea-pg-app, the role bootstrap reads from it, eliminating
  # the initdb-vs-Secret race.
  managed:
    roles:
      - name: {{ .Values.postgres.cluster.owner | default "gitea" | quote }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ printf "%s-app" (.Values.postgres.cluster.name | default "gitea-pg") | quote }}

  # inheritedMetadata.annotations: CNPG propagates these onto every
  # Secret it generates (gitea-pg-app, gitea-pg-superuser, etc.).
  # The k8s-reflector (bp-reflector) requires the SOURCE Secret to carry
  # `reflection-allowed: "true"` before it will copy data into the
  # DESTINATION Secret (`gitea-database-secret`, defined in
  # templates/database-secret.yaml). Setting these annotations on the
  # Cluster CR's own metadata does NOT work — CNPG does not copy
  # `metadata.annotations` onto generated Secrets. The `inheritedMetadata`
  # stanza is the correct CNPG v1.24+ mechanism (issue #584).
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: {{ .Values.postgres.cluster.namespace | default .Release.Namespace | quote }}
      # See bp-harbor cnpg-cluster.yaml for the otech28-diagnosed
      # Reflector retry-race rationale — without auto-enabled,
      # Reflector misses the source-create event when the destination
      # Secret is processed before CNPG provisions the password.
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: {{ .Values.postgres.cluster.namespace | default .Release.Namespace | quote }}

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "64MB"
      effective_cache_size: "192MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      log_statement: "ddl"
      log_min_duration_statement: "1000"

  resources:
    {{- toYaml .Values.postgres.cluster.resources | nindent 4 }}

  storage:
    size: {{ .Values.postgres.cluster.storageSize | default "5Gi" }}
    storageClass: {{ .Values.postgres.cluster.storageClass | default "local-path" | quote }}

  enableSuperuserAccess: true

  monitoring:
    enablePodMonitor: false
{{- end }}
