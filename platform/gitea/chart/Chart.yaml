apiVersion: v2
name: bp-gitea
# 1.2.15 (G117.E2E-A1 #2816, 2026-06-03): Fix `gitea-sso-configure`
# Job AUTH_ID extraction. PR #2821 (1.2.14) unblocked the Pod-selector
# path so the Job actually runs on hw86, exposing a long-dormant second
# bug: `gitea admin auth list --vertical-bars` separates fields with
# literal `|` but pads each cell with TABS (not spaces). The previous
# awk `gsub(/ /,"",$1)` only stripped spaces, leaving `AUTH_ID="1\t"`,
# and the next call `gitea admin auth update-oauth --id "1\t"` aborts
# with `invalid value "1\t" for flag -id: parse error`. Hook exhausts
# backoffLimit, Helm rolls back. Switching the awk to
# `gsub(/[[:space:]]+/,"",$1)` strips spaces + tabs + CR. Caught live
# on hw86 2026-06-03 after the 1.2.14 upgrade-cascade. Refs #2816.
# 1.2.14 (G117.E2E-B1 #2818, 2026-06-03): Fix post-upgrade hook
# `gitea-sso-configure` timing out. The configure-oauth Job hard-coded
# `kubectl wait pod/gitea-0` and `kubectl exec gitea-0 -- gitea admin
# auth ...`, but the upstream gitea-charts/gitea 10.5.0 chart renders a
# Deployment (templates/gitea/deployment.yaml), not a StatefulSet, so
# the live Pod is `gitea-<rs-hash>-<id>` and the index-name lookup
# never matches. The Job now resolves the live Pod by label selector
# (`app.kubernetes.io/name=gitea,app.kubernetes.io/instance=<release>`)
# — takes the first Pod with `Ready=True`, also keeps the Job correct
# if the operator flips the upstream chart into its StatefulSet mode.
# Refs #2737 (G117 EPIC) / #2818.
# 1.2.13 (G117.5 #2744, 2026-06-02): SSO defense-in-depth via
# kc_idp_hint=catalyst-pin. ExternalSecret now appends the hint to the
# `authorize_url` written into gitea-oauth-source-credentials; the
# configure-oauth Job switches to `--use-custom-url-mapping --custom-
# auth-url` when IDP_HINT is non-empty, so the hinted URL reaches KC on
# every Gitea /user/oauth2/openova-sso redirect. Falls back to --auto-
# discover-url when the ESO Secret hasn't yet populated the bundle keys
# (early in install). Defense-in-depth to the realm-config IDR
# `defaultProvider` binding shipped by bp-keycloak 1.4.9+. Refs #2744.
# 1.2.6 (Fix #163, 2026-05-11, MIRROR-EVERYTHING): database-secret-sync-job
# hook image switched from curlimages/curl:8.10.1 to
# harbor.openova.io/proxy-dockerhub/curlimages/curl:8.10.1 per CLAUDE.md
# inviolable rule.
# 1.2.8 (Fix #1902, TBD-A40, 2026-05-19): omit HTTPRoute parentRef
# sectionName by default — multi-zone Sovereigns rename HTTPS listeners
# to https-<sanitised-zone>, breaking NoMatchingListener with the prior
# pinned sectionName: https. Matches the catalyst-system fix in PR #1888.
#
# 1.2.11 (G91.gitea #2653, 2026-05-31): opt in to the bp-sso-bridge
# (G91.1 #2652) SSO framework. New top-level `sso:` block (defaults
# enabled=true). Ships:
#   - templates/sso-oauth-source-externalsecret.yaml — ExternalSecret
#     that reads bp-sso-bridge's OpenBao `secret/sso/gitea` bundle and
#     emits the gitea-oauth-source-credentials Secret with key/secret
#     keys (upstream gitea chart's existingSecret schema).
#   - templates/sso-configure-oauth-job.yaml — Helm post-install +
#     post-upgrade Job that calls `gitea admin auth add-oauth` (or
#     update-oauth) from the gitea-0 Pod, computing autoDiscoverUrl
#     from .Values.sso.sovereignFqdn at chart-template time. Idempotent
#     on chart upgrade.
#   - gitea.gitea.config.oauth2_client: app.ini global toggles —
#     ENABLE_AUTO_REGISTRATION, ACCOUNT_LINKING=auto, USERNAME=nickname,
#     UPDATE_AVATAR=true.
# Sovereign operator (deployment.OrgEmail; auto-granted by
# bp-sso-bridge to client's admin role + sovereign-admins group) lands
# directly in Gitea as a site admin via OIDC. Local `gitea_admin` user
# remains the break-glass account for bp-self-sovereign-cutover Step 1.
# Per SECURITY.md §6.3 (App-level SSO).
#
# 1.2.24 (#3150, 2026-06-10): silent-SSO now lands the operator logged-in
# from the console Open button — two stacked defects fixed.
#   (A) Launch-url targeted the gitea ROOT (renders the login page with a
#       manual "Sign in with OpenOva SSO" button) instead of the
#       OAuth-initiate path. The catalog-seed + blueprint.yaml `ui`
#       endpoint now declares `ssoInitPath: /user/oauth2/openova-sso`, so
#       Open hits gitea's provider-login route → gitea 307s to KC.
#   (B) The sso-configure Job persisted the IN-CLUSTER discovery URL, so
#       gitea's openidConnect provider 307'd the browser to
#       `http://keycloak.keycloak.svc.cluster.local/...` (unresolvable) —
#       KC runs hostname-dynamic, so in-cluster discovery returns internal
#       endpoint URLs (the 1.2.22 "frontendUrl makes them public" premise
#       is false here), and openidConnect ignores --custom-*-url. The Job
#       now persists the PUBLIC discovery URL (public-first, in-cluster
#       fallback for the install-time bootstrap circle) so the 307 targets
#       `https://auth.<fqdn>/...` and the realm IDR silently delegates to
#       catalyst-pin with no login form.
#
# 1.2.25 (#3188, ADR-0010, 2026-06-10): reusable backing-services reuse
# proof. New `postgres.cluster.enabled` SHARING gate (ne-toString idiom)
# on templates/cnpg-cluster.yaml + templates/database-secret.yaml. Default
# true → gitea ships its own gitea-pg Cluster + gitea-database-secret
# (byte-identical to the 1:1 legacy path every existing prov runs). When
# false (SOVEREIGN_GITEA_PG_OWN_CLUSTER=false), gitea SHARES the bp-postgres
# `shared-pg` data-instance: the embedded Cluster + database-secret are
# skipped and the shared instance (slot 16a) owns the `gitea` Database +
# role + reflected gitea-database-secret. gitea's DB HOST then points at
# the shared cluster's -rw Service via SOVEREIGN_GITEA_PG_HOST.
# 1.2.26 (#3188, 2026-06-10): Deployment rollout strategy override
# `gitea.strategy.type: Recreate` (was the upstream default RollingUpdate
# {maxUnavailable:0,maxSurge:100%}). Gitea's /data is a ReadWriteOnce PVC
# with an exclusive LevelDB file lock — under maxUnavailable:0 the surge
# Pod can never mount the RWO volume the old Pod holds, so the roll wedges
# (old RS never scales down → HR Stalled → bp-catalyst-platform blocked).
# Recreate terminates the old Pod first (releasing the PVC + lock) then
# starts the new one. Single-replica gitea has no roll-time HA to lose.
version: 1.2.26
description: |
  Catalyst-curated Blueprint umbrella chart for Gitea. Depends on the
  upstream `gitea` chart (dl.gitea.com) as a Helm subchart so
  `helm dependency build` pulls the upstream payload into this artifact;
  the Catalyst overlay templates in templates/ (NetworkPolicy,
  ExternalSecret, ServiceMonitor) sit alongside the upstream subchart and
  Helm renders both at install time. Catalyst-curated values flow into the
  upstream subchart under the `gitea:` key in values.yaml.

  Bumped to 1.2.4 — Day-2 cutover gitea-admin-secret seam (issue #830
  Bug 2, otech102 incident 2026-05-04). bp-self-sovereign-cutover Step 1
  (gitea-mirror) was stuck in CreateContainerConfigError with
  `secret "gitea-admin-secret" not found` because no chart materialised
  the canonical `username` + `password`-keyed admin Secret the cutover
  PodSpec was authored against. Worse, the upstream gitea chart fell
  through to its hardcoded default password `r8sA8CPHD9!bt6d` when no
  `existingSecret` was set — every fresh Sovereign would have shipped
  with the same admin credentials.
  Fix: ship templates/admin-secret.yaml — a Catalyst-curated Secret
  named `gitea-admin-secret` with `username` (default `gitea_admin`) and
  `password` (32-char random alphanumeric, generated on first install,
  preserved across reconciles via Helm `lookup`). values.yaml wires
  `gitea.gitea.admin.existingSecret: gitea-admin-secret` so the upstream
  init container reads its admin creds from this Secret instead of the
  hardcoded default. The same Secret is consumed by bp-self-sovereign-
  cutover Step 1 — single source of truth on the Sovereign.
  Resource-policy keep + lookup-based persistence guarantees the
  password bytes are stable across `helm upgrade`, `helm rollback`,
  Flux re-reconciliation, and even `helm uninstall + reinstall`.
  2026-05-04.
type: application
keywords: [catalyst, blueprint, gitea]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a Helm subchart so `helm dependency build`
# bundles it into the OCI artifact. Pinned to gitea-charts/gitea 10.5.0
# (matches platform/gitea/blueprint.yaml + values.yaml
# `catalystBlueprint.upstream.version`). Per
# docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the version is
# operator-bumpable via PR + Blueprint release.
dependencies:
  - name: gitea
    version: "10.5.0"
    repository: "https://dl.gitea.com/charts"
