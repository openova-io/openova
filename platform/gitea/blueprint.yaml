apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-gitea
  labels:
    catalyst.openova.io/section: pts-2-3-per-sovereign-supporting-services
    catalyst.openova.io/tier: catalyst-cp
spec:
  version: 1.2.48 # lockstep with chart/Chart.yaml (#5262 admin-secret vanish-proof mirror-fallback lookup; #4885 admin-secret reloader annotation; #4402 spine topology tier:mgmt → '' host-native, #4325 de-vcluster fallout)
  card:
    title: gitea
    summary: Gitea — per-Sovereign Git server. Catalyst control plane. Hosts catalog (public Blueprint mirror), catalog-sovereign (Sovereign-curated private Blueprints), one Gitea Org per Catalyst Organization, and system (sovereign-admin scope).
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  # ── #3373: class-level placement SUGGESTION + allow-list ────────────────
  # Placement is an INSTANCE property (Application.spec.placement); this is
  # only the default every instance inherits silently — the provisioning
  # journey's generic advanced selector (and a direct Git edit of the
  # instance's spec.placement) may override it within allowedPlacements.
  # Founder §4 table target: mgmt. Single render mechanism: the Flux
  # spec.kubeConfig.secretRef pivot — zero per-app placement code.
  defaultPlacement:
    vcluster: mgmt
  allowedPlacements: [host, mgmt]

  # placementSchema aligned with spec.topology below (#4212 Seam 3). The
  # spine Application-CR producer stamps active-hot-standby on a multi-region
  # Sovereign (matching topology.defaults.multi-region) — modes[] must admit
  # it AND defaultOnMultiRegion must name it so the placement is accepted and
  # the Continuum CR is minted.
  placementSchema:
    modes: [singleton, active-hot-standby]
    default: singleton
    defaultOnMultiRegion: active-hot-standby
    minRegions: 1
    maxRegions: 2

  manifests:
    chart: ./chart
  # bp-postgres (#3370): Gitea's database is a Context on a SHAREABLE
  # bp-postgres data-instance (slot 10 wires gitea's HR dependsOn
  # bp-postgres-shared). Declaring the shareable INSTANCE Blueprint here
  # (not just the engine) makes the console New-instance wizard render the
  # generic PostgreSQL backing selector (Create new / Reuse existing).
  depends:
    - blueprint: bp-postgres
      version: ^0

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive. Postgres via bp-cnpg-pair sync; Git
  #   blobs land on SeaweedFS S3 mirrored cross-region (async, ~seconds).
  #   Switchover: bp-continuum PG demote/promote + PowerDNS flip for
  #   gitea.<sov> (30s TTL); Git push paused ~5s.
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          # #4402 (#4325 de-vcluster fallout): the `mgmt` plane vCluster was
          # removed; the spine lands host-native in its own host namespace.
          # The #4334 spine producer drives this Blueprint through the
          # application-controller fan-out, which resolved `tier: mgmt` → host
          # ns `mgmt` (now absent) → `namespaces "mgmt" not found` and never
          # reached the Continuum producer. Host placement = empty tier; keep
          # the mgmt-A/-B region designators. Mirrors #4375/#4379.
          tier: ''
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ''
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  endpoints:
    - name: ui
      hostnameTemplate: "gitea.{{.SovereignFQDN}}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
      # #3150 — land the silent-SSO launch on gitea's OAuth-initiate route
      # (provider name "openova-sso" → gitea 307s to KC's authorize
      # endpoint, which the sovereign-realm IDR silently delegates to
      # catalyst-pin). Without this the launch-url falls back to the gitea
      # ROOT, which renders the login page with a manual "Sign in with
      # OpenOva SSO" button — the operator never auto-signs-in.
      ssoInitPath: "/user/oauth2/openova-sso"

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
      gitea-admins: admin
    silentLogin: true

  # ── G117.6: Multi-instance ─────────────────────────────────────────────
  # Singleton per Sovereign — one Gitea per Catalyst control plane.
  multiInstance:
    enabled: false
