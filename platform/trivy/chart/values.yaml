# Catalyst Blueprint umbrella metadata — the upstream chart is resolved as
# a Helm subchart via Chart.yaml `dependencies:`. Catalyst-curated values
# under the `trivy-operator:` key flow into the upstream subchart unchanged.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). The upstream trivy-operator chart
  # exposes `trivy-operator.image.registry` and `trivy-operator.trivy.image.registry`
  # for override. Per-Sovereign overlays wire those alongside this value.
  # Tracked under #560.
  imageRegistry: ""

catalystBlueprint:
  upstream:
    chart: trivy-operator
    version: "0.32.1"
    repo: "https://aquasecurity.github.io/helm-charts/"

# ─── Upstream chart values (subchart key: trivy-operator) ────────────────
trivy-operator:
  # Operator deployment — single replica for solo Sovereign; per-Sovereign
  # overlays may scale via leader-election once HA is required.
  replicas: 1

  # Pin upstream image tag — DO NOT use floating tags per
  # docs/INVIOLABLE-PRINCIPLES.md.
  #
  # Registry — route through the Sovereign Harbor pull-through proxy instead of
  # the upstream chart default `mirror.gcr.io` (#5281). `mirror.gcr.io` is NOT
  # in the fresh-prov node registry mirror (infra/providers/{hetzner,huawei}/
  # main.tf registries.yaml covers docker.io/quay.io/gcr.io/registry.k8s.io/
  # ghcr.io only), so during Phase-1 convergence — BEFORE the cutover
  # registry-pivot — the trivy-operator Deployment pulls `mirror.gcr.io/aquasec/
  # trivy-operator` DIRECT from Google's mirror, hostage to its uptime (the
  # exact hw279 hostage class, #5281). `aquasec/trivy-operator` + `aquasec/
  # trivy` publish the identical images to Docker Hub (hub API 200), and
  # `proxy-dockerhub` is live on the mothership Harbor + mirrored at cutover, so
  # this rides the same working proxy every other platform image uses. (The
  # cutover offlineMirror maps mirror.gcr.io -> proxy-gcr, but that is inert in
  # Phase-1: the mothership proxy-gcr is a gcr.io pull-through and aquasec/* is
  # not on gcr.io — only docker.io. So proxy-dockerhub is the correct route.)
  image:
    registry: harbor.openova.io/proxy-dockerhub
    repository: aquasec/trivy-operator
    tag: "0.30.1"
    pullPolicy: IfNotPresent

  # Trivy scanner image (used for vuln scans inside scan jobs). Same
  # Harbor-proxy reroute off mirror.gcr.io as the operator image above (#5281).
  trivy:
    image:
      registry: harbor.openova.io/proxy-dockerhub
      repository: aquasec/trivy
      tag: "0.70.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 512Mi
    # Vulnerability DB cache — persistent so DB downloads don't hammer the
    # upstream registry on every scan.
    storageClassEnabled: true
    storageSize: 5Gi

  # Operator scope — target namespaces follow the `bp-*` prefix convention
  # so Trivy reports map cleanly to Catalyst Blueprint installation units.
  # Empty string means "scan all namespaces"; per-Sovereign overlays MAY
  # narrow to a comma-list.
  operator:
    namespace: ""
    targetNamespaces: ""
    excludeNamespaces: "kube-system,kube-public,kube-node-lease"
    scanJobsConcurrentLimit: 10
    scanJobsRetryDelay: 30s
    # Scanners enabled — full posture for Catalyst Sovereigns.
    vulnerabilityScannerEnabled: true
    configAuditScannerEnabled: true
    rbacAssessmentScannerEnabled: true
    exposedSecretScannerEnabled: true
    infraAssessmentScannerEnabled: true
    clusterComplianceEnabled: true
    metricsVulnIdEnabled: false
    # Built-in policies — the upstream chart ships baseline policy bundle.
    builtInTrivyServer: false

  # trivyOperator runtime config — values that the operator pod consumes
  # at runtime via the trivy-operator-config ConfigMap (NOT the operator
  # Deployment's own pod spec; that's the `operator:` block above).
  trivyOperator:
    # scanJobTolerations — applied by the operator to every scan-job pod
    # it spawns dynamically (per-workload vuln + config-audit + RBAC scan
    # jobs). Some target workloads (k8s-system DaemonSets, control-plane-
    # pinned operators) live ONLY on the CP; without this toleration the
    # scan jobs sit Pending and the matching reports are never produced.
    # Pairs with the CP NoSchedule taint introduced in PR #755.
    scanJobTolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  # node-collector — the operator spawns ONE node-collector pod per node
  # (pinned via nodeSelector to each node's hostname) to read kubelet /
  # etcd / kube-scheduler / kube-controller-manager config from hostPath.
  # The CP node carries those control-plane config files, so the
  # collector MUST land there. PR #755 added a NoSchedule taint on the CP
  # in multi-node Sovereigns; without this toleration the CP-bound
  # collector sits Pending forever (issue #769). On solo Sovereigns
  # (worker_count=0) the CP is untainted, so this toleration is a no-op.
  nodeCollector:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  # Resources for the operator pod itself.
  # 256Mi was too tight — operator manages scan jobs across 80+ pods and
  # each watch cache grows with cluster size. OOMKilled (exit 137) on otech22.
  # 512Mi held for a 38-HR Sovereign, but OOMKilled again (exit 137, restarts=10)
  # on the larger hw250 2-region prov (#5063): under the self-sovereign-cutover
  # deny-egress fresh-pull roll the recreated operator never reached Ready within
  # the 600s budget → step-08 egress-block-test FAIL. 1Gi is the stable floor for
  # a 60+ HR multi-region Sovereign; a node replacement / region-kill hits the
  # same recreate, so this is general robustness, not cutover-only.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # ServiceMonitor — DEFAULT FALSE per docs/BLUEPRINT-AUTHORING.md §11.2
  # (Catalyst provides bp-grafana / kube-prometheus-stack separately).
  serviceMonitor:
    enabled: false

  # RBAC — chart manages its own ClusterRole + ServiceAccount.
  rbac:
    create: true
  serviceAccount:
    create: true

  # Network access — operator needs to pull vulnerability DBs from
  # ghcr.io/aquasecurity/trivy-db. Per-Sovereign overlays MAY add an
  # HTTP proxy via env vars.

# ─── Catalyst overlay values (consumed by templates/ in this chart) ──────
# Reserved for Catalyst-side overlays (NetworkPolicy, alert routing into
# the SIEM pipeline) added in a follow-up PR once bp-trivy is consumed in
# clusters/_template/.
trivyOverlay:
  networkPolicy:
    enabled: false
  # bp-* namespace targeting — per-Sovereign overlays SET this to a list
  # of Blueprint namespaces to focus scans.
  blueprintNamespacePrefix: "bp-"
