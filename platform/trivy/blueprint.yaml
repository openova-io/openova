apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: trivy
  labels:
    catalyst.openova.io/section: pts-3-3-security-and-policy
spec:
  version: 1.0.5
  card:
    title: Trivy
    family: guardian
    description: Vulnerability and misconfiguration scanner operator. Scans workloads, images, IaC, RBAC. Targets bp-* namespaces; pairs with bp-falco (runtime) and bp-kyverno (admission).
    docs: https://aquasecurity.github.io/trivy-operator/
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ''
          clusters:
            - mgmt-A
            - mgmt-B
            - dmz-A
            - dmz-B
            - rtz-A
            - rtz-B
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  multiInstance:
    enabled: false
