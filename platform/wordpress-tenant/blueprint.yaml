apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-wordpress-tenant
spec:
  # 0.4.25 (#6311, Refs #4307 #3988): CNPG-operator status-probe carve-out for
  # the per-Org default-deny namespace + zero install-time third-party egress
  # (artifacts baked into the runtime image). Rebase of PR #6320 onto current
  # main; #6320 already claims 0.4.24 as an open PR, so this republish takes
  # the next free patch. Lockstep with platform/wordpress-tenant/chart/Chart.yaml.
  # 0.5.0 (ADR-0015 D2, Refs #7067): consumes the shared openova.topology
  # contract (one HelmRelease per region, renders only its own CNPG member —
  # CNPG native distributed topology). database.mode / pg.activeHotStandby
  # REMOVED (fail closed). Lockstep with platform/wordpress-tenant/chart/Chart.yaml.
  # 0.5.1 (ADR-0015, Refs #7067): writer-only write-once seed of the shared
  # cross-region secrets (replication CA + DB owner) into the secret store;
  # remote-key prefix keyed on the pair identity. Lockstep with
  # platform/wordpress-tenant/chart/Chart.yaml.
  # 0.6.0 (ADR-0015 D6b, Refs #7067): media in the replicated SeaweedFS S3
  # bucket (S3-Uploads + openova-media-store mu-plugin); no wp-content PVC by
  # default; regionLocalVolumes declare a replication for every entry.
  # Lockstep with platform/wordpress-tenant/chart/Chart.yaml.
  # 0.6.1 (Refs #7067): seed fans out to vault-<peer> for every topology peer.
  version: 0.6.6
  card:
    title: WordPress (per-Organization)
    summary: Turnkey, SSO-pre-wired WordPress per Organization. Postgres + cert-manager TLS pre-wired.
    description: Runs in the Organization's vcluster, namespace = Organization namespace. SSO via the Organization-vcluster Keycloak realm. Default theme + admin user pre-seeded at install time.
    icon: wordpress.svg
    license: GPL-2.0-or-later
    tags: [wordpress, cms, org, organization, sso, keycloak, postgres]
    docs: https://wordpress.org/documentation/
  visibility: listed
  class: application
  lifecycle: experimental
  owner:
    team: platform
    contact: catalyst@openova.io
  configSchema:
    type: object
    # #4936: orgDomain + adminUser are NOT customer-required. The console
    # 'New instance' dialog + marketplace funnel collect neither, so
    # requiring them failed Application admission
    # (`missing properties: 'orgDomain','adminUser'`). The Organization
    # controller DERIVES both from Org context (orgDomain from the Org
    # domain, adminUser.email from the Org owner) and injects them into the
    # Application config before render — a customer never types them. They
    # stay accepted (with nested validation) for explicit operator overlays.
    properties:
      orgDomain:
        type: string
        description: "Organization domain (e.g. acme.<sov-fqdn>)."
      replicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 8
      adminUser:
        type: object
        required: [email]
        properties:
          email:
            type: string
            description: "Admin email (must match Keycloak realm email claim)."
  # placementSchema aligned with spec.topology below (#4212 Seam 4). The
  # application-controller derives the effective placement from
  # default / defaultOnMultiRegion (EffectiveDefault) and validates it
  # against modes[] (blueprintAllowedModes). With only `single-region` here,
  # a multi-region Sovereign's per-Org WordPress resolved to singleton — a
  # plan with no standby region — so the generic per-app Continuum producer
  # (continuum.go buildContinuumPlan) minted NO Continuum CR and the per-Org
  # DR contract never existed. Naming the active-passive multi-region default
  # (matching topology.defaults.multi-region) lets the producer emit a
  # primary+standby plan and mint the per-Org Continuum CR.
  placementSchema:
    # ADR-0015 D2/D9 (#7067): active-hot-standby admitted — 0.5.0 renders it
    # with the same per-region shape as active-passive.
    modes: [single-region, singleton, active-passive, active-hot-standby]
    default: single-region
    defaultOnMultiRegion: active-passive
  manifests:
    chart: bp-wordpress-tenant
  # ── ADR-0015 D6 — region-local volumes ───────────────────────────────
  # Every piece of FILE state this Blueprint keeps per region, and how it
  # survives a primary move. The D6 admission gate (catalyst-api
  # validateInstallRefs + application-controller, package
  # core/controllers/pkg/regionlocal) REFUSES any multi-region placement
  # while an entry says `replication: none` (or names no mechanism), naming
  # the volume. Recognised mechanisms:
  #   s3-replicated       — lives in a bp-seaweedfs `replicated[-*]` bucket
  #                         (native filer.sync between the regions);
  #   volume-replication  — a volume replication operator;
  #   none-needed         — nothing to carry: rebuilt from the image/Git.
  # Every PVC the chart renders must carry the label
  # `openova.io/volume-name: <name>` of an entry here —
  # scripts/check-region-local-volumes-declared.sh fails CI otherwise.
  # The spec root of the Blueprint CRD preserves unknown fields, so the
  # catalog-seed copy carries this list to the live CR the gate reads.
  regionLocalVolumes:
    - name: wp-content
      # Rendered as a PVC ONLY for the legacy single-region media.store=pvc
      # (the chart refuses media.store=pvc under a multi-region topology).
      # Default media.store=s3: an emptyDir rebuilt from the runtime image on
      # every Pod start (core themes, pg4wp, OIDC plugin, media mu-plugin);
      # DISALLOW_FILE_MODS keeps it immutable from wp-admin.
      template: chart/templates/pvc.yaml
      mountPath: /var/www/html/wp-content
      contents: [themes, plugins, mu-plugins]
      replication: none-needed
    - name: uploads
      # The media library. S3-Uploads writes it to
      # `replicated/<org>/<app>/uploads/` on this region's SeaweedFS;
      # bp-seaweedfs filer.sync makes it identical in every region.
      mountPath: /var/www/html/wp-content/uploads
      contents: [uploads]
      replication: s3-replicated
      bucket: replicated
  upgrades:
    from: ["0.x"]
  observability:
    metrics: prometheus
    logs: stdout
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-passive
    - active-hot-standby
    - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          # #4375 (#4325 de-vcluster fallout): the `rtz` plane vCluster was
          # removed; per-Org apps land host-native in their OWN Org namespace
          # (#4297 keystone). Host placement = empty tier; keep the rtz-A/-B
          # region designators (clusters/roles) for the multi-region split.
          tier: ''
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          tier: ''
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: ''
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: '{{.AppName}}.{{.OrgDomain}}'
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: "{{.OrgSlug}}"
    protocolMapper: oidc
    silentLogin: true
  multiInstance:
    enabled: true
    maxPerOrg: 10
  # ── /G117.1 ──
