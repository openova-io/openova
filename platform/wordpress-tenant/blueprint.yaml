apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-wordpress-tenant
  labels:
    catalyst.openova.io/category: organization-app
    catalyst.openova.io/section: pts-7-org-tenant
spec:
  version: 0.4.22
  card:
    title: WordPress (per-Organization)
    summary: |
      Turnkey, SSO-pre-wired WordPress per Organization. Runs in the Organization's
      vcluster, namespace = Organization namespace. SSO via the Organization-vcluster
      Keycloak realm (openid-connect-generic plugin), Postgres via bp-cnpg
      (Cluster CR in Organization ns), persistent /var/www/html/wp-content via
      PVC (default 10Gi), ingress at https://wordpress.<org-domain> with
      cert-manager TLS. Default theme + admin user pre-seeded at install
      time so the Organization admin's first browser hit lands on /wp-admin
      authenticated. No install wizard, no manual config.
    icon: wordpress.svg
    category: organization-app
    tags: [wordpress, cms, organization, sso, keycloak, oidc, postgres]
    documentation: https://wordpress.org/documentation/
    license: GPL-2.0-or-later
  visibility: listed
  owner:
    team: platform
    contact: catalyst@openova.io
  configSchema:
    type: object
    # #4936: orgDomain + adminUser are NOT customer-required. Neither the
    # console 'New instance' dialog nor the marketplace funnel collects them,
    # so requiring them failed Application admission
    # (`missing properties: 'orgDomain','adminUser'`). The Organization
    # controller DERIVES both from Org context — orgDomain from the Org's
    # domain, adminUser.email from the Org owner identity — and injects them
    # into the Application config before render (organization_gitops.go /
    # the application-controller). They remain accepted here (with their
    # own nested validation) for operator overlays that DO set them.
    required: [oidc]
    properties:
      orgDomain:
        type: string
        description: |
          The Organization tenant's domain (e.g. `acme.<otech-fqdn>` for free-
          subdomain tenants, or `acme.com` for BYO). Used to derive the
          default ingress host as `wordpress.<orgDomain>`. #4936: DERIVED by
          the Organization controller from Org context — customers never type
          it. Operator overlays MAY still set it explicitly.
      replicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 8
      oidc:
        type: object
        required: [issuerURL, clientSecretName]
        properties:
          enabled:
            type: boolean
            default: true
            description: Master toggle — when false the post-install Job is rendered but short-circuits.
          issuerURL:
            type: string
            description: |
              Discovery URL of the per-tenant Keycloak realm. Example:
              `https://keycloak.<org-domain>/realms/org-<subdomain>`.
              The openid-connect-generic plugin uses this to derive the
              token / userinfo / authorization / end-session endpoints.
          clientId:
            type: string
            default: wordpress
            description: OIDC client ID registered in the per-tenant realm.
          clientSecretName:
            type: string
            default: wordpress-oidc-client-secret
            description: |
              K8s Secret carrying the OIDC client secret (key
              `client-secret`). Provisioned by the bp-keycloak chart
              (PR #918) at the same time as the realm import.
          defaultRole:
            type: string
            default: subscriber
            description: |
              WordPress role assigned to a brand-new SSO user when
              `create_if_does_not_exist=1`. Set to empty string to
              create SSO users with no role.
          identityKey:
            type: string
            default: preferred_username
            description: Keycloak claim used to match id_token back to a WP user.
      keycloak:
        type: object
        description: |
          DEPRECATED — preserved as a backward-compat alias for chart
          0.1.x clusters whose orchestrator overlays still emit
          `keycloak.{realmURL,clientID,clientSecretName}`. New overlays
          MUST emit `oidc.*`. Folded into oidc.* by _helpers.tpl when
          oidc.* is at its values.yaml defaults.
        properties:
          realmURL:
            type: string
          clientID:
            type: string
          clientSecretName:
            type: string
      database:
        type: object
        properties:
          mode:
            type: string
            enum: ["", "singleton", "active-hot-standby"]
            default: ""
            description: |
              Canonical operator-facing DB topology selector (TBD-E8b).

                - "singleton"          (DEFAULT) — single in-vcluster CNPG Cluster CR.
                - "active-hot-standby" (D31)     — primary + replica CNPG Cluster CRs across
                                                    two regions, WAL streaming over Cilium
                                                    ClusterMesh (mirrors bp-cnpg-pair shape).

              When set, this enum overrides the legacy
              `pg.activeHotStandby.enabled` boolean. Empty string falls
              through to the boolean for back-compat with chart 0.3.x
              overlays. The marketplace voucher → org wizard (D29)
              writes this field directly.
          cnpgClusterName:
            type: string
            default: wordpress-db
            description: |
              Name of the `Cluster.postgresql.cnpg.io` provisioned for
              this WordPress instance. Per-tenant unique within the Organization
              namespace.
      adminUser:
        type: object
        required: [email]
        properties:
          email:
            type: string
            description: |
              Email of the Organization admin (must match the `email` claim
              Keycloak issues). The admin-user Job pre-seeds a wp_user
              row with this email and the administrator role.
          displayName:
            type: string
            description: Display name shown in the WP admin bar. Defaults to the local-part of the email.
      defaultTheme:
        type: string
        default: twentytwentyfive
        description: WordPress theme slug installed + activated at first install.
      persistence:
        type: object
        properties:
          wpContent:
            type: object
            properties:
              size:
                type: string
                default: 10Gi
              storageClass:
                # #3971 / #4139 — empty ⇒ omit storageClassName ⇒ bind to the
                # cluster-default durable cloud CSI. local-path is FORBIDDEN by
                # the forbid-local-path-storage Kyverno ENFORCE policy (ephemeral
                # node-local disk). Matches the chart values.yaml default ("").
                type: string
                default: ""
      gateway:
        # #3785 — the canonical Sovereign exposure: a Cilium Gateway API
        # HTTPRoute on cilium-gateway-console (the per-Org pool host serves
        # the WordPress site over the `*.<pool>` wildcard TLS listener). The
        # org-tenant overlay wires gateway.host from the chosen public host.
        type: object
        properties:
          host:
            type: string
            description: >-
              Public host the WordPress site serves at, e.g.
              `wordpress.<slug>.<pool>`. REQUIRED to expose the app — empty
              renders no HTTPRoute (fails closed).
      ingress:
        # Legacy traefik Ingress — DEFAULT OFF on a Sovereign (Cilium Gateway
        # API via `gateway` above is canonical). Retained for non-Cilium dev
        # clusters only.
        type: object
        properties:
          host:
            type: string
            description: Override the derived `wordpress.<orgDomain>` ingress host (traefik dev clusters only).
          tls:
            type: object
            properties:
              issuer:
                type: string
                default: letsencrypt-prod
                description: cert-manager ClusterIssuer name.
  # placementSchema aligned with spec.topology below (#4212 Seam 4). The
  # application-controller derives the effective placement from
  # default / defaultOnMultiRegion (EffectiveDefault) and validates it
  # against modes[] (blueprintAllowedModes). With only `single-region` here,
  # a multi-region Sovereign's per-Org WordPress resolved to singleton — a
  # plan with no standby region — so the generic per-app Continuum producer
  # (continuum.go buildContinuumPlan) minted NO Continuum CR and the per-Org
  # DR contract never existed. Naming the active-passive multi-region default
  # (matching topology.defaults.multi-region) lets the producer emit a
  # primary+standby plan and mint the per-Org Continuum CR.
  placementSchema:
    modes: [single-region, singleton, active-passive]
    default: single-region
    defaultOnMultiRegion: active-passive
  manifests:
    chart: ./chart
  depends:
    # #3370 — the database dependency is the SHAREABLE INSTANCE class
    # (bp-postgres), not the operator: a wordpress app consumes a
    # Context (db) on a bp-postgres instance-application, wired purely
    # as Flux dependsOn. The provisioning journey renders the generic
    # Create-new / Reuse-existing selector from this declaration.
    - blueprint: bp-postgres
      version: ^0.1
      alias: db
    - blueprint: bp-cnpg
      version: ^1.0
      alias: db-operator
    - blueprint: bp-keycloak
      version: ^1.0
      alias: idp
    - blueprint: bp-reflector
      version: ^1.0
      alias: reflector
    - blueprint: bp-cert-manager
      version: ^1.0
      alias: tls
  upgrades:
    from: ["0.x"]
  observability:
    metrics: prometheus
    logs: stdout
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-passive
    - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          # #4375 (#4325 de-vcluster fallout): the `rtz` plane vCluster was
          # removed; per-Org apps land host-native in their OWN Org namespace
          # (#4297 keystone). Host placement = empty tier; keep the rtz-A/-B
          # region designators (clusters/roles) for the multi-region split.
          tier: ''
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: ''
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: '{{.AppName}}.{{.OrgDomain}}'
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: '{{.OrgSlug}}'
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  multiInstance:
    enabled: true
    maxPerOrg: 20
    namingTemplate: '{{.AppName}}-{{.InstanceID}}'
    isolationLevel: namespace
  # ── /G117.1 ──
