{{- /*
─── CNPG Postgres for WordPress — THIS region's half only (ADR-0015 D2) ───

Exactly ONE Cluster.postgresql.cnpg.io per release, in every mode. Which
shape is read from the shared contract `openova.topology` (topology-lib):

  contract absent / mode=singleton
      One local Cluster, `bootstrap.initdb`, no replication fields — the
      single-region shape every pre-contract install already has. Name:
      `database.cnpgClusterName` when the contract is absent, else the
      per-region name (below).

  mode=active-passive | active-hot-standby (one HelmRelease PER REGION)
      This region's member of a CNPG NATIVE DISTRIBUTED TOPOLOGY:
        spec.replica.self    = this region's Cluster
        spec.replica.primary = the Cluster of `openova.topology.primary`
        spec.replica.source  = whom to stream from (the primary; the first
                               peer when self is the primary — used only once
                               CNPG has demoted it)
        externalClusters     = every member, each reached over its
                               `<member>-mesh` ClusterMesh global Service
      Self == primary ⇒ CNPG runs it as the primary; otherwise as a replica
      cluster streaming from the primary. NO node affinity: the release is
      applied by THIS region's Flux into THIS region's cluster, so there is
      nothing to pin and nothing ever pinned to a peer region (the pre-0.5.0
      chart rendered both halves into one cluster separated by affinity —
      the replica was unschedulable for 58 days on hw307 and, with
      dataDurability required, every write blocked).

      Per-region name: `<cnpgClusterName>-<sha256(region-id)[0:8]>`
      (topology-lib `openova.topology.nameFor`; override per region with
      `database.topology.clusterNames`).

      ADR-0004 kept: the PRIMARY member renders `synchronous_commit:
      remote_apply` + `synchronous{method:first, dataDurability:required,
      standbyNamesPre:[<declared peers' Clusters>], maxStandbyNamesFromCluster:0}`.
      A standby name is rendered ONLY for a peer in `peers[]`; replicas carry
      no fence (it moves with the role).

MOVING THE PRIMARY (planned, lossless — CNPG ≥1.24 demotion/promotion token):
  1. Commit `openova.topology.primary: <new>` to the CURRENT primary region's
     values. CNPG demotes that Cluster in place and publishes
     `status.demotionToken`; WordPress there scales to 0.
  2. Commit `openova.topology.primary: <new>` AND
     `database.topology.promotionToken: <that status.demotionToken>` to the
     NEW primary region's values. CNPG promotes it only after replaying up to
     the demotion checkpoint (RPO 0); WordPress there scales up.
  3. Commit `openova.topology.primary: <new>` to every other peer region.
  Order matters: committing step 2 before step 1 promotes immediately (no
  token to wait for) while the old primary is still writable = split brain.
  An UNPLANNED region loss skips step 1 (nobody can publish a token): commit
  primary=<survivor> without a token; CNPG promotes at once.

Capabilities gate: bp-cnpg ships the `postgresql.cnpg.io/v1` CRD; skip the
template until the CRD is registered (cold install ordering).
*/ -}}
{{- if and .Values.wordpress.enabled .Values.database.cluster.enabled }}
{{- if .Capabilities.APIVersions.Has "postgresql.cnpg.io/v1" }}
{{- $t := include "bp-wordpress-tenant.topology" . | fromJson -}}
{{- $n := include "bp-wordpress-tenant.dbNames" . | fromJson -}}
{{- $multi := $t.multiRegion -}}
{{- $topo := .Values.database.topology | default dict -}}
{{- $overrides := $topo.clusterNames | default dict -}}
{{- $repl := $topo.replication | default dict -}}
{{- $sync := and $multi $t.isPrimary (eq ($repl.mode | default "sync") "sync") -}}
{{- $mesh := $topo.clusterMesh | default dict -}}
{{- if $multi }}
{{- include "bp-wordpress-tenant.validatePromotion" . }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $n.self | quote }}
  namespace: {{ include "bp-wordpress-tenant.cnpgNamespace" . | quote }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    {{- if $multi }}
    openova.io/cnpg-role: {{ include "openova.topology.role" . | quote }}
    catalyst.openova.io/cnpg-pair: {{ .Values.database.cnpgClusterName | quote }}
    {{- end }}
  {{- if $multi }}
  annotations:
    catalyst.openova.io/blueprint: bp-wordpress-tenant
    catalyst.openova.io/cnpg-pair-role: {{ include "openova.topology.role" . | quote }}
    catalyst.openova.io/cnpg-pair-name: {{ .Values.database.cnpgClusterName | quote }}
    catalyst.openova.io/topology-primary: {{ $n.primary | quote }}
    {{- if not $t.isPrimary }}
    # #5623 — WHAT WILL PROMOTE THIS STANDBY, answerable from the live object.
    catalyst.openova.io/dr-promotion-mechanism: {{ include "bp-wordpress-tenant.drPromotionMechanism" . | quote }}
    {{- end }}
  {{- end }}
spec:
  instances: {{ .Values.database.cluster.instances }}
  imageName: {{ .Values.database.cluster.imageName | default "harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql" }}:{{ .Values.database.cluster.pgVersion }}
  {{- if $multi }}
  primaryUpdateMethod: switchover
  {{- end }}

  {{- if or (not $multi) $t.isPrimary }}
  # bootstrap only runs when the Cluster is CREATED; a later demotion /
  # promotion never re-bootstraps. The primary member initdb's; every other
  # member clones the primary over the mesh.
  bootstrap:
    initdb:
      database: {{ .Values.database.cluster.database | quote }}
      owner: {{ .Values.database.cluster.owner | quote }}
      {{- if $multi }}
      secret:
        name: {{ include "bp-wordpress-tenant.appCredentialsSecret" . | quote }}
      {{- end }}
  {{- else }}
  bootstrap:
    pg_basebackup:
      source: {{ $n.primary | quote }}
      database: {{ .Values.database.cluster.database | quote }}
      owner: {{ .Values.database.cluster.owner | quote }}
      secret:
        name: {{ include "bp-wordpress-tenant.appCredentialsSecret" . | quote }}
  {{- end }}

  {{- if $multi }}
  # ── CNPG distributed topology (ADR-0015 D2) ─────────────────────────
  replica:
    {{- include "openova.topology.cnpg.replica" (dict "ctx" . "base" .Values.database.cnpgClusterName "overrides" $overrides "promotionToken" ($topo.promotionToken | default "")) | nindent 4 }}

  externalClusters:
    {{- include "openova.topology.cnpg.externalClusters" (dict "ctx" . "base" .Values.database.cnpgClusterName "overrides" $overrides "dbname" .Values.database.cluster.database) | nindent 4 }}

  # Shared client CA (identical bytes in every region): CNPG issues THIS
  # member's `<cluster>-replication` streaming_replica cert from it, and
  # accepts every peer's cert signed by it — the symmetric form of the
  # cnpg-pair #5245 shared `-primary-ca`.
  certificates:
    clientCASecret: {{ include "bp-wordpress-tenant.replicationCASecret" . | quote }}
  {{- end }}

  # inheritedMetadata.annotations: CNPG propagates these onto every
  # Secret it generates (`<cluster>-app`, `<cluster>-superuser`, etc.).
  # See bp-gitea cnpg-cluster.yaml for the canonical rationale (#584).
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: {{ include "bp-wordpress-tenant.cnpgNamespace" . | quote }}
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: {{ include "bp-wordpress-tenant.cnpgNamespace" . | quote }}

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "64MB"
      effective_cache_size: "192MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      log_statement: "ddl"
      log_min_duration_statement: "1000"
      {{- if $multi }}
      # WAL streaming knobs (identical on every member so any of them can be
      # the primary). `hot_standby` is intentionally OMITTED — PG16 hard-pins
      # it and CNPG rejects an explicit set (omantel-fsn 2026-05-09).
      max_wal_senders: "10"
      max_replication_slots: "10"
      wal_level: "logical"
      {{- end }}
      {{- if $sync }}
      # ADR-0004 — settable GUC, stays a raw parameter. The standby list is
      # NOT (CNPG fixed parameter, #4139) — see `synchronous` below.
      synchronous_commit: {{ dig "sync" "commit" "remote_apply" $repl | quote }}
      {{- end }}
    {{- if $sync }}
    # ── Synchronous replication — CNPG-native (ADR-0004, #3740) ────────
    # FIRST n over the DECLARED peers' Clusters only; local HA pods excluded
    # (maxStandbyNamesFromCluster: 0) so a COMMIT is acked cross-region.
    synchronous:
      method: first
      number: {{ int (dig "sync" "numSync" 1 $repl) }}
      dataDurability: required
      maxStandbyNamesFromCluster: 0
      standbyNamesPre:
        {{- range (include "openova.topology.cnpg.syncStandbyNames" (dict "ctx" . "base" .Values.database.cnpgClusterName "overrides" $overrides) | fromJsonArray) }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}

  resources:
    {{- toYaml .Values.database.cluster.resources | nindent 4 }}

  storage:
    size: {{ .Values.database.cluster.storageSize }}
    # #3971 — empty ⇒ omit ⇒ CNPG uses the cluster-default durable cloud CSI; local-path FORBIDDEN.
    {{- with .Values.database.cluster.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}

  {{- if and $multi (ne ($mesh.enabled | toString) "false") }}
  # THIS member's own ClusterMesh global alias `<self>-mesh` (CNPG-managed,
  # selectorType rw). Peers stream from / to it; the zero-backend stubs for
  # the PEERS' aliases are rendered by topology-mesh.yaml.
  managed:
    services:
      additional:
        {{- include "openova.topology.cnpg.managedMeshService" (dict "name" $n.self "affinity" ($mesh.affinity | default "local") "labels" (printf "catalyst.openova.io/cnpg-pair: %s\ncatalyst.openova.io/role: replication-source" (.Values.database.cnpgClusterName | quote))) | nindent 8 }}
  {{- end }}

  enableSuperuserAccess: true

  monitoring:
    # Default false per docs/BLUEPRINT-AUTHORING.md §11.2 — operator
    # opts in via per-cluster overlay.
    enablePodMonitor: false
{{- end }}
{{- end }}
