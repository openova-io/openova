{{- /*
─── CNPG Postgres for WordPress ─────────────────────────────────────────

Two render modes, selected by the canonical operator-facing enum
`database.mode` (singleton | active-hot-standby). Legacy boolean
`pg.activeHotStandby.enabled` is folded in by _helpers.tpl's
`bp-wordpress-tenant.dbMode` for back-compat with chart 0.3.x
orchestrator overlays (see TBD-E8b).

  1. SINGLE-CLUSTER mode (database.mode=singleton, DEFAULT):
     Renders ONE Cluster.postgresql.cnpg.io named `<cnpgClusterName>` in
     the tenant namespace. Mirrors bp-gitea / bp-harbor patterns.

  2. ACTIVE-HOT-STANDBY mode (database.mode=active-hot-standby, DoD D31):
     Renders TWO Cluster CRs mirroring the bp-cnpg-pair pattern (see
     platform/cnpg-pair/chart/templates/{primary,replica}-cluster.yaml):
       - PRIMARY  `<cnpgClusterName>`         in `primaryRegion`
       - REPLICA  `<cnpgClusterName>-replica` in `replicaRegion`
     WAL streams from primary -> replica over Cilium ClusterMesh via the
     primary's `spec.managed.services.additional` Service annotated
     `service.cilium.io/global: "true"`. The replica's externalCluster
     resolves the primary's read-replica endpoint via the mesh-global
     `<cnpgClusterName>-mesh` Service alias. The replica bootstraps
     with `pg_basebackup` from the primary then streams WAL continuously.

     Depends on DoD D11 (clustermesh apiserver via LoadBalancer + peer
     cert exchange) and bp-cnpg being installed in BOTH regions (the
     bootstrap-kit ships bp-cnpg in every region — verified on t132).

WordPress connects to `<cnpgClusterName>-rw.<ns>.svc.cluster.local` in
both modes; in HA mode CNPG handles RW routing through the operator's
switchover sequencer (Continuum K-Cont-2). WordPress + the hook Jobs read
the DB password DIRECTLY from the CNPG-emitted `<cluster>-app` Secret's
`password` key (secretKeyRef) — no reflector mirror, no post-install sync
Job (#4936: that async populate raced past Helm `--wait`).

Capabilities gate: bp-cnpg ships the `postgresql.cnpg.io/v1` CRD. On a
cold install before bp-cnpg is reconciling, the apiserver rejects this
Cluster. The Capabilities check skips this template until the CRD is
registered. The Sovereign's bootstrap order MUST land bp-cnpg before
bp-wordpress-tenant in EVERY region for HA mode.

*/ -}}
{{- if and .Values.wordpress.enabled .Values.database.cluster.enabled }}
{{- if .Capabilities.APIVersions.Has "postgresql.cnpg.io/v1" }}
{{- /* D31 / TBD-E8b: read the canonical `database.mode` enum (with
   back-compat fold from the legacy `pg.activeHotStandby.enabled`
   boolean). When mode resolves to "active-hot-standby" this template
   renders TWO Cluster CRs (primary + replica) mirroring bp-cnpg-pair;
   "singleton" (default) renders ONE Cluster CR. See _helpers.tpl
   `bp-wordpress-tenant.dbMode` for the resolution precedence. */ -}}
{{- $haEnabled := eq (include "bp-wordpress-tenant.dbMode" .) "active-hot-standby" -}}
{{- if $haEnabled }}
{{- include "bp-wordpress-tenant.validateActiveHotStandbyRegions" . }}
{{- /* #5623 — a DR pair that declares no promotion mechanism is one that
       silently never promotes on a region kill. Fail closed. */ -}}
{{- include "bp-wordpress-tenant.validateActiveHotStandbyPromotion" . }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.database.cnpgClusterName | quote }}
  namespace: {{ include "bp-wordpress-tenant.cnpgNamespace" . | quote }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    {{- if $haEnabled }}
    openova.io/cnpg-role: primary
    openova.io/region: {{ .Values.pg.activeHotStandby.primaryRegion | quote }}
    catalyst.openova.io/cnpg-pair: {{ .Values.database.cnpgClusterName | quote }}
    {{- end }}
  {{- if $haEnabled }}
  annotations:
    catalyst.openova.io/blueprint: bp-wordpress-tenant
    catalyst.openova.io/cnpg-pair-role: primary
    catalyst.openova.io/cnpg-pair-name: {{ .Values.database.cnpgClusterName | quote }}
  {{- end }}
spec:
  instances: {{ .Values.database.cluster.instances }}
  imageName: {{ .Values.database.cluster.imageName | default "harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql" }}:{{ .Values.database.cluster.pgVersion }}
  {{- if $haEnabled }}
  primaryUpdateMethod: switchover
  {{- end }}

  bootstrap:
    initdb:
      database: {{ .Values.database.cluster.database | quote }}
      owner: {{ .Values.database.cluster.owner | quote }}

  # inheritedMetadata.annotations: CNPG propagates these onto every
  # Secret it generates (`<cluster>-app`, `<cluster>-superuser`, etc.).
  # The k8s-reflector (bp-reflector) requires the SOURCE Secret to carry
  # `reflection-allowed: "true"` before it will copy data into the
  # DESTINATION Secret. See bp-gitea cnpg-cluster.yaml for the
  # canonical rationale (issue #584).
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: {{ include "bp-wordpress-tenant.cnpgNamespace" . | quote }}
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: {{ include "bp-wordpress-tenant.cnpgNamespace" . | quote }}

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "64MB"
      effective_cache_size: "192MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      log_statement: "ddl"
      log_min_duration_statement: "1000"
      {{- if $haEnabled }}
      # WAL streaming knobs — match bp-cnpg-pair primary template so
      # the replica can attach replication slots from the start.
      # `hot_standby` is intentionally OMITTED — PostgreSQL 16 hard-pins
      # it to `on` for any primary that may serve replicas and CNPG
      # rejects any explicit set with phase "Unable to create required
      # cluster objects" (BlockedConfigurationParameter). Caught live on
      # omantel-fsn 2026-05-09 (Phase-2 multi-region incident #3 in
      # qa-loop-state/incidents.md).
      max_wal_senders: "10"
      max_replication_slots: "10"
      wal_level: "logical"
      {{- /*
      Synchronous replication (Pillar 3 zero-tx-loss).

      Mirrors bp-cnpg-pair chart 0.1.2. The canonical claim of "zero
      transactions lost" on region-kill failover REQUIRES synchronous
      replication; asynchronous-streaming loses any in-flight tx at
      primary-kill time.

      `synchronous_commit = remote_apply` blocks the primary's COMMIT
      until the replica has REPLAYED the WAL (strongest durability).
      `synchronous_standby_names = FIRST 1 (<replica>)` requires an
      ACK from one standby whose application_name matches the replica
      Cluster CR's name; CNPG's externalCluster streaming connection
      uses the replica Cluster CR name as application_name by default,
      so this Just Works for the bp-wordpress-tenant pair shape.

      Mode "async" exists for forensic / lab use only; the rendered
      manifest then omits both parameters and falls back to PG defaults.
      */ -}}
      {{- $replMode := default "sync" .Values.pg.activeHotStandby.replication.mode }}
      {{- if eq $replMode "sync" }}
      # `synchronous_commit` (remote_apply) IS a settable GUC → stays a raw
      # parameter. `synchronous_standby_names` is NOT — CNPG marks it a FIXED
      # configuration parameter and the admission webhook REJECTS any explicit
      # set in `parameters` with "Can't set fixed configuration parameter"
      # (#4139, caught live on omantel.biz vcluster.cnpg.io). Declare it via
      # the CNPG-native `spec.postgresql.synchronous` block below instead —
      # the SAME shape bp-cnpg-pair primary-cluster.yaml uses (#3740).
      synchronous_commit: {{ default "remote_apply" .Values.pg.activeHotStandby.replication.sync.commit | quote }}
      {{- end }}
      {{- end }}
    {{- if and $haEnabled (eq (default "sync" .Values.pg.activeHotStandby.replication.mode) "sync") }}
    # ── Synchronous replication — CNPG-native (NOT a raw parameter) ────
    # method=first + number=N + standbyNamesPre:[<replica>] +
    # maxStandbyNamesFromCluster:0 renders
    # `synchronous_standby_names = FIRST N ("<replica>")` targeting the
    # CROSS-REGION replica Cluster CR, NOT a local HA peer. Mirrors
    # bp-cnpg-pair primary-cluster.yaml (#3740, #4139). dataDurability=required
    # enforces the Pillar-3 zero-tx-loss bar.
    synchronous:
      method: first
      number: {{ int (default 1 .Values.pg.activeHotStandby.replication.sync.numSync) }}
      dataDurability: required
      maxStandbyNamesFromCluster: 0
      standbyNamesPre:
        - {{ include "bp-wordpress-tenant.cnpgPairReplicaName" . | quote }}
    {{- end }}

  resources:
    {{- toYaml .Values.database.cluster.resources | nindent 4 }}

  storage:
    size: {{ .Values.database.cluster.storageSize }}
    # #3971 — empty ⇒ omit ⇒ CNPG uses the cluster-default durable cloud CSI; local-path FORBIDDEN.
    {{- with .Values.database.cluster.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}

  {{- if $haEnabled }}
  # Region pinning — node-affinity is the operator's idiomatic seam for
  # region selection (Cluster CR Pods land on nodes whose
  # openova.io/region label matches). nodeSelector is intentionally NOT
  # used: it can't express the "MUST be in region A" constraint under
  # controller-managed taints/tolerations. Mirrors bp-cnpg-pair.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: openova.io/region
                operator: In
                values: [{{ .Values.pg.activeHotStandby.primaryRegion | quote }}]
    podAntiAffinityType: required

  {{- if .Values.pg.activeHotStandby.clusterMesh.enabled }}
  # ── Replication-source Service (managed by CNPG, annotated for
  #    Cilium ClusterMesh global routing) ────────────────────────────
  # CNPG creates the `<name>-r` Service automatically; the chart used
  # to hand-create it which CNPG refused to reconcile ("not owned by
  # the cluster"). The canonical fix (bp-cnpg-pair chart 0.1.1) is to
  # declare an *additional* managed Service via CNPG's
  # `spec.managed.services.additional[]` API (CNPG >= 1.22). The
  # Service name is `<cluster>-mesh` (avoids collision with `-r`) and
  # carries the `service.cilium.io/global: "true"` annotation so
  # Cilium ClusterMesh publishes it across every connected peer. The
  # replica's externalCluster connectionParameters.host points at this
  # Service name — WAL traffic stays on the private mesh and never
  # egresses public internet.
  managed:
    services:
      additional:
        - selectorType: r
          serviceTemplate:
            metadata:
              name: {{ include "bp-wordpress-tenant.cnpgPairReplicationServiceName" . }}
              labels:
                {{- include "bp-wordpress-tenant.labels" . | nindent 16 }}
                catalyst.openova.io/cnpg-pair: {{ .Values.database.cnpgClusterName | quote }}
                catalyst.openova.io/role: replication-source
              annotations:
                # NEW seam: bp-wordpress-tenant follows bp-cnpg-pair's
                # canonical use of the `service.cilium.io/global`
                # annotation pattern for cross-region WAL transport.
                service.cilium.io/global: "true"
                service.cilium.io/affinity: {{ .Values.pg.activeHotStandby.clusterMesh.affinity | quote }}
                catalyst.openova.io/blueprint: bp-wordpress-tenant
            spec:
              type: ClusterIP
              ports:
                - name: postgres
                  port: 5432
                  targetPort: 5432
                  protocol: TCP
  {{- end }}
  {{- end }}

  enableSuperuserAccess: true

  monitoring:
    # Default false per docs/BLUEPRINT-AUTHORING.md §11.2 — operator
    # opts in via per-cluster overlay.
    enablePodMonitor: false
{{- if $haEnabled }}
---
{{- /*
D31 replica Cluster CR. CNPG's "replica cluster" pattern
(`replica.enabled: true` + `bootstrap.pg_basebackup` + `externalClusters[]`)
lets a Cluster CR follow a remote primary's WAL stream while staying a
regular CNPG Cluster locally. The replica cannot be written to until
promoted; promotion is done by Continuum K-Cont-2 via the CNPG
`cnpg.io/cluster.replicaCluster` annotation flip + the operator's
switchover routine.

Replication source-discovery: the replica resolves the primary via the
Cilium ClusterMesh-global Service exposed by the primary Cluster CR's
`spec.managed.services.additional[]` entry (rendered above). The
`service.cilium.io/global: "true"` annotation on that Service makes it
visible across every connected mesh peer; ClusterMesh's local-affinity
routing falls through to the remote region because the replica region
has zero local backends matching the selector.
*/ -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "bp-wordpress-tenant.cnpgPairReplicaName" . | quote }}
  namespace: {{ include "bp-wordpress-tenant.cnpgNamespace" . | quote }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    openova.io/cnpg-role: replica
    openova.io/region: {{ .Values.pg.activeHotStandby.replicaRegion | quote }}
    catalyst.openova.io/cnpg-pair: {{ .Values.database.cnpgClusterName | quote }}
  annotations:
    catalyst.openova.io/blueprint: bp-wordpress-tenant
    catalyst.openova.io/cnpg-pair-role: replica
    catalyst.openova.io/cnpg-pair-name: {{ .Values.database.cnpgClusterName | quote }}
    # #5623 — WHAT WILL PROMOTE THIS STANDBY, stamped on the live object.
    # An operator inspecting a running pair must be able to answer "who promotes
    # this on a region-A kill?" from the cluster itself, not from a values file
    # in a git repo. `manual` means NOTHING region-local will act: promotion is
    # the sovereign-admin's RUNBOOKS §6.1 action and the RTO is however long
    # that takes. bp-cnpg-pair / bp-postgres stamp their pairs by shipping an
    # actual dr-promoter Deployment alongside; this chart ships none.
    catalyst.openova.io/dr-promotion-mechanism: {{ include "bp-wordpress-tenant.drPromotionMechanism" . | quote }}
spec:
  instances: {{ .Values.database.cluster.instances }}
  imageName: {{ .Values.database.cluster.imageName | default "harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql" }}:{{ .Values.database.cluster.pgVersion }}

  storage:
    size: {{ .Values.database.cluster.storageSize }}
    # #3971 — empty ⇒ omit ⇒ CNPG uses the cluster-default durable cloud CSI; local-path FORBIDDEN.
    {{- with .Values.database.cluster.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}

  resources:
    {{- toYaml .Values.database.cluster.resources | nindent 4 }}

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: openova.io/region
                operator: In
                values: [{{ .Values.pg.activeHotStandby.replicaRegion | quote }}]
    podAntiAffinityType: required

  # ── Replica-cluster mode ─────────────────────────────────────────
  # `replica.enabled: true` configures this Cluster as a CNPG replica
  # cluster: instances bootstrap via streaming replication from the
  # named externalCluster source. Continuum K-Cont-2's switchover path
  # patches `replica.enabled: false` on this CR (and flips the primary
  # CR to the inverse) to promote/demote atomically.
  replica:
    enabled: true
    source: {{ .Values.database.cnpgClusterName | quote }}

  # ── Bootstrap from primary ──────────────────────────────────────
  # CNPG REQUIRES an explicit bootstrap stanza on a replica Cluster:
  # `replica.enabled: true` alone leaves the Cluster phase stuck at
  # "Setting up primary" (caught live on omantel-hel 2026-05-09,
  # Phase-2 incident #3). The `pg_basebackup` source pulls the initial
  # heap from the named externalCluster (resolved via the
  # ClusterMesh-global `-mesh` Service exposed by the primary's
  # `spec.managed.services.additional` entry), then the replica
  # streams WAL continuously over the same connection. `database` +
  # `owner` MUST match the primary's bootstrap.initdb — they identify
  # the seed database the replica considers "owned".
  bootstrap:
    pg_basebackup:
      source: {{ .Values.database.cnpgClusterName | quote }}
      database: {{ .Values.database.cluster.database | quote }}
      owner:    {{ .Values.database.cluster.owner | quote }}

  externalClusters:
    - name: {{ .Values.database.cnpgClusterName | quote }}
      connectionParameters:
        # Cilium ClusterMesh-global Service alias — managed by CNPG via
        # the primary Cluster's `spec.managed.services.additional` entry
        # (selectorType: r, name: <cluster>-mesh, annotated
        # service.cilium.io/global: "true"). The hostname resolves
        # locally and ClusterMesh's affinity routing reaches the primary
        # region's read-replica endpoint over the private mesh; since
        # the replica region has zero local backends matching the
        # selector, traffic crosses to the primary.
        host: {{ include "bp-wordpress-tenant.cnpgPairReplicationServiceName" . }}
        port: "5432"
        user: streaming_replica
        sslmode: require
        # Application database — bootstrap will pull WAL via
        # `replication=true` regardless, but `dbname` is required for
        # the connection-string parser.
        dbname: {{ .Values.database.cluster.database | quote }}
      # streaming_replica auth: CNPG provisions a TLS client cert for
      # the streaming_replica role on every Cluster CR; the replica
      # mounts it from the primary's `-replication` Secret. ESO/
      # External-Secrets sync this Secret across clusters in
      # production; in the in-cluster test path the Secret is
      # reflected via the bp-reflector annotation set on the primary
      # Cluster's inheritedMetadata (above).
      sslKey:
        name: {{ printf "%s-replication" .Values.database.cnpgClusterName | quote }}
        key: tls.key
      sslCert:
        name: {{ printf "%s-replication" .Values.database.cnpgClusterName | quote }}
        key: tls.crt
      sslRootCert:
        name: {{ printf "%s-ca" .Values.database.cnpgClusterName | quote }}
        key: ca.crt

  # `hot_standby` is intentionally OMITTED — see primary block above
  # for the rationale. PostgreSQL 16 hard-pins it to `on` for any
  # Cluster running with `replica.enabled: true`, and CNPG rejects
  # the explicit set with phase "Unable to create required cluster
  # objects". Caught live on omantel-hel 2026-05-09.
  postgresql:
    parameters:
      max_wal_senders: "10"
      max_replication_slots: "10"
      wal_level: "logical"

  enableSuperuserAccess: false

  monitoring:
    enablePodMonitor: false
{{- end }}
{{- end }}
{{- end }}
