{{- /*
G117.5 W3.D3 — bp-wordpress-tenant per-app SSO client_secret.

Refs #2744. Chart-side `lookup`-or-generate fallback so a fresh-prov
Sovereign without bp-sso-bridge online still gets a stable
`wordpress-oidc-client-secret` and the oidc-config Job converges. When
bp-sso-bridge (or the legacy bp-keycloak `configmap-tenant-realm.yaml`
PR #918 path) lands the real client_secret bytes via an ExternalSecret
or SealedSecret, this template MUST NOT clobber them — that's the
purpose of the `lookup` fallback + `helm.sh/resource-policy: keep`
annotation: on every reconcile we read the existing Secret bytes and
re-emit them, so the chart upgrade is a no-op when the Secret is
already populated by another controller.

Pattern source: `feedback_chart_credential_persistence_defense.md`
(2026-06-02 G112 #2723 + G111 #2724 exemplars). Same shape as
`bp-keycloak` 1.4.8 postgres password defense + `bp-openbao` 1.2.21
recovery-seed defense.

Skipped entirely when `oidc.enabled=false`.
*/}}
{{- if and .Values.wordpress.enabled .Values.oidc.enabled }}
{{- $secretName := include "bp-wordpress-tenant.oidcClientSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $clientSecret := "" -}}
{{- if $existing -}}
{{- $clientSecret = index $existing.data "client-secret" | default "" | b64dec -}}
{{- end -}}
{{- if not $clientSecret -}}
{{- $clientSecret = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/sso-client-secret: "true"
  annotations:
    # Resource-policy: keep so `helm uninstall` doesn't yank the Secret
    # out from under a still-running KC realm import or a paused
    # bp-sso-bridge reconcile loop.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  client-secret: {{ $clientSecret | quote }}
{{- end }}
