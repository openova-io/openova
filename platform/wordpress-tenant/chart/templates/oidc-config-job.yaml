{{- if and .Values.wordpress.enabled .Values.oidc.enabled }}
{{- /*
Helm post-install / post-upgrade Job that:

  1. Seeds the pg4wp db.php drop-in into THIS Job's ephemeral
     wp-content (step 0) so wp-cli reaches the bp-cnpg Postgres backend.
     The runtime Deployment's initContainers seed the persistent
     wp-content PVC separately — see deployment.yaml.
  2. Runs `wp core install` (idempotent — `wp core is-installed` first).
     This populates the wp_* tables via WordPress's own install code,
     which goes through pg4wp and is therefore Postgres-safe.
  3. VENDORS `openid-connect-generic` from a pinned GitHub release
     archive into the Job's ephemeral wp-content + `wp plugin activate`
     (Refs #4322). NEVER `wp plugin install` (a wordpress.org egress
     fetch that hangs the hook → HR Ready=False on slow/air-gapped
     egress). Tolerant: a fetch failure logs + continues so the
     release still reaches Ready.
  4. Runs `wp option update openid_connect_generic_settings <json>`
     with the per-tenant Keycloak realm + client + secret from the
     chart values. Idempotent — overwrites with the same values on
     `helm upgrade`.
  5. Runs `wp theme activate <defaultTheme>` if the theme is
     installed; otherwise installs + activates it.

Why wp-cli (not direct PHP/SQL writes)
──────────────────────────────────────
- WordPress's table schema, option-row serialisation format, and the
  `active_plugins` / `template` / `stylesheet` semantics evolve
  between minor releases. wp-cli sits ON TOP of WordPress core's
  public PHP API and is the only stable contract.
- pg4wp's drop-in handles MySQL→Postgres translation transparently
  for any code that goes through `wpdb` — wp-cli uses `wpdb`, so it
  Just Works against bp-cnpg.
- The official `wordpress:cli-*` image bundles the same WordPress
  core layout as the runtime image, so the wp-content PVC mount is
  byte-for-byte interchangeable.

Why post-install / weight 10
────────────────────────────
- weight 5: database-secret-sync-job populates `wordpress-database-
  secret` from the CNPG-emitted `<cluster>-app` Secret.
- weight 10: this Job — DB Secret is now real, WordPress Pod is up;
  this Job self-seeds its own pg4wp db.php drop-in (step 0) and
  vendors the OIDC plugin from GitHub (step 4) into an ephemeral
  emptyDir — it does NOT depend on the runtime PVC.
- weight 15: admin-user-job pre-seeds the Organization admin's wp_users row.

Canonical seam — see umbrella issue #915 (D1 sub-task) and the
matching tenant-realm Keycloak client registration in
platform/keycloak/chart/templates/configmap-tenant-realm.yaml
(PR #918) which emits `wordpress-oidc-client-secret` carrying the
same client_secret bytes the realm JSON registers.
*/}}
{{- $ns := .Release.Namespace }}
{{- $issuer := include "bp-wordpress-tenant.oidcIssuerURL" . }}
{{- $clientId := include "bp-wordpress-tenant.oidcClientId" . }}
{{- $secretName := include "bp-wordpress-tenant.oidcClientSecretName" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "bp-wordpress-tenant.fullname" . }}-oidc-config
  namespace: {{ $ns }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/component: wordpress-oidc-config
    # #4220: helm-controller-created hook Job — override the helper's
    # `managed-by: Helm` to `flux` so the kyverno `flux-managed` Enforce policy
    # admits it (else post-upgrade hook fails → release rollback → HTTPRoute
    # dropped → customer host 404). Mirrors database-secret-sync-job.yaml.
    app.kubernetes.io/managed-by: flux
  annotations:
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress-oidc-config
        catalyst.openova.io/blueprint: bp-wordpress-tenant
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.wordpress.podSecurityContext | nindent 8 }}
      containers:
        - name: oidc-config
          image: {{ include "bp-wordpress-tenant.wpCliImage" . | quote }}
          imagePullPolicy: {{ .Values.oidc.cliImage.pullPolicy }}
          securityContext:
            {{- toYaml .Values.wordpress.containerSecurityContext | nindent 12 }}
          env:
            # WordPress DB connection — wp-cli reads these via the
            # wp-config.php we materialise inline below. Identical
            # variable names to the runtime container so the same
            # values.yaml block drives both.
            - name: WORDPRESS_DB_HOST
              value: {{ include "bp-wordpress-tenant.cnpgRwHost" . | quote }}
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.database.cluster.database | default "wordpress" | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.database.cluster.owner | default "wordpress" | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: password
            - name: WP_SITE_URL
              value: "https://{{ include "bp-wordpress-tenant.ingressHost" . }}"
            - name: WP_DEFAULT_THEME
              value: {{ .Values.defaultTheme | quote }}
            # OIDC inputs — folded from oidc.*  /  keycloak.* (legacy).
            - name: KC_ISSUER_URL
              value: {{ $issuer | quote }}
            - name: KC_CLIENT_ID
              value: {{ $clientId | quote }}
            - name: KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: client-secret
            - name: OIDC_DEFAULT_ROLE
              value: {{ .Values.oidc.defaultRole | quote }}
            - name: OIDC_IDENTITY_KEY
              value: {{ .Values.oidc.identityKey | quote }}
            # G117.5 W3.D3 (Refs #2744): kc_idp_hint defense-in-depth.
            # Empty disables the hint append; otherwise endpoint_login
            # carries `?kc_idp_hint=<hint>` so HAR captures always
            # show the hint and "fell back to forms" failure modes
            # surface in observability immediately.
            - name: OIDC_IDP_HINT
              value: {{ .Values.ssoIdpHint | default "" | quote }}
            # Refs #4322: openid-connect-generic plugin source. The Job
            # VENDORS the plugin from this pinned GitHub release archive
            # into its ephemeral wp-content (step 4 below) instead of
            # running `wp plugin install` (which fetches from wordpress.org
            # over egress and hangs the hook → HR Ready=False on an
            # air-gapped / slow-egress Sovereign). Same deterministic,
            # version-pinned mechanism as the pg4wp seed in step 0.
            - name: OIDC_PLUGIN_REPO
              value: {{ .Values.oidc.plugin.repo | quote }}
            - name: OIDC_PLUGIN_VERSION
              value: {{ .Values.oidc.plugin.version | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # The wordpress:cli image's default WORKDIR is /var/www/html;
              # wp-cli expects to find wp-config.php and the WordPress
              # core files there. We materialise wp-config.php inline so
              # `wp` boots WordPress and chain-loads pg4wp from a SELF-SEEDED
              # /var/www/html/wp-content/db.php drop-in (step 0 below).
              #
              # #4220 (Refs #4155): this Job mounts its OWN emptyDir for
              # wp-content, NOT the runtime Deployment's ReadWriteOnce
              # `wp-content` PVC. The Sovereign's only StorageClass is
              # RWO (evs-ssd / Huawei EVS — no RWX class exists), so a Job
              # that mounted the same PVC while the WordPress Pod holds it
              # deadlocked on the kubelet Multi-Attach error
              # ("Volume is already used by pod(s) bp-wordpress-tenant-...")
              # → the post-upgrade hook never started → Helm timed out →
              # HR Ready=False (and on cold install the release would roll
              # back, dropping the HTTPRoute → customer host 404). The OIDC
              # plugin settings + admin user persist in POSTGRES, not on the
              # PVC, so an ephemeral wp-content is correct; we only need the
              # pg4wp db.php drop-in for Postgres connectivity, seeded below.
              cd /var/www/html

              # 0. Seed the pg4wp Postgres adapter drop-in into THIS Job's
              #    ephemeral wp-content (same source + version as the
              #    deployment's wp-plugin-install initContainer). WordPress
              #    chain-loads wp-content/db.php on every boot; without it
              #    wp-cli speaks MySQL and `wp db check` fails against the
              #    bp-cnpg Postgres backend.
              if [ ! -f wp-content/db.php ]; then
                echo "[oidc-config] seeding pg4wp db.php drop-in (Postgres adapter)"
                mkdir -p wp-content
                # The release tag is `v3.3.1` — the GitHub archive path keeps
                # the `v` prefix (this is the SAME URL the deployment's
                # wp-plugin-install initContainer uses). The bare `3.3.1.zip`
                # (no `v`) returns HTTP 404, which left this Job FATAL
                # ("curl: (22) The requested URL returned error: 404") on the
                # FIRST post-install/post-upgrade hook of a fresh Org — the hook
                # never seeded db.php, `wp` could not reach the bp-cnpg Postgres
                # backend, the hook errored, Helm timed out and the HelmRelease
                # stuck Ready=False (root-caused live on the tkt0625 fresh Org,
                # omantel.biz region-a). GitHub still extracts the archive to
                # `postgresql-for-wordpress-3.3.1` (the `v` is stripped from the
                # top-level directory name), so the cp paths below are unchanged.
                curl -fsSL -o /tmp/pg4wp.zip \
                  https://github.com/PostgreSQL-For-Wordpress/postgresql-for-wordpress/archive/refs/tags/v3.3.1.zip
                # wp-cli's bundled PHP can unzip without a system `unzip`.
                php -r '$z=new ZipArchive();$z->open("/tmp/pg4wp.zip");$z->extractTo("/tmp/");$z->close();'
                cp -a /tmp/postgresql-for-wordpress-3.3.1/pg4wp wp-content/
                cp /tmp/postgresql-for-wordpress-3.3.1/pg4wp/db.php wp-content/db.php
                rm -rf /tmp/postgresql-for-wordpress-3.3.1 /tmp/pg4wp.zip
                echo "[oidc-config] pg4wp db.php seeded"
              else
                echo "[oidc-config] pg4wp db.php already present"
              fi

              # 1. Materialise wp-config.php — same contract as the
              #    runtime container's WORDPRESS_CONFIG_EXTRA so the
              #    site URL + reverse-proxy headers are consistent.
              if [ ! -f wp-config.php ]; then
                cat > wp-config.php <<'PHPCFG'
              <?php
              define('DB_NAME',     getenv('WORDPRESS_DB_NAME'));
              define('DB_USER',     getenv('WORDPRESS_DB_USER'));
              define('DB_PASSWORD', getenv('WORDPRESS_DB_PASSWORD'));
              define('DB_HOST',     getenv('WORDPRESS_DB_HOST'));
              define('DB_CHARSET',  'utf8');
              define('DB_COLLATE',  '');
              $table_prefix = 'wp_';
              define('WP_DEBUG', false);
              define('WP_HOME',    getenv('WP_SITE_URL'));
              define('WP_SITEURL', getenv('WP_SITE_URL'));
              if (!defined('ABSPATH')) {
                define('ABSPATH', __DIR__ . '/');
              }
              if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
                $_SERVER['HTTPS'] = 'on';
              }
              require_once ABSPATH . 'wp-settings.php';
              PHPCFG
                echo "[oidc-config] wrote wp-config.php";
              else
                echo "[oidc-config] wp-config.php already present";
              fi

              # 2. Wait for the database to be reachable. wp-cli
              #    `wp db check` returns non-zero when the DB isn't up;
              #    we poll for up to 5 minutes. pg4wp's drop-in runs
              #    automatically from the wp-content/db.php seeded in
              #    step 0 above.
              for i in $(seq 1 60); do
                if wp db check --allow-root >/dev/null 2>&1; then
                  echo "[oidc-config] database reachable"
                  break
                fi
                if [ "$i" = "60" ]; then
                  echo "[oidc-config] FATAL: database not reachable after 5 min" >&2
                  exit 1
                fi
                sleep 5
              done

              # 3. Run `wp core install` if WordPress isn't installed
              #    yet. Idempotent — `wp core is-installed` exits 0
              #    when the install row in wp_options is present.
              if ! wp core is-installed --allow-root >/dev/null 2>&1; then
                echo "[oidc-config] wp_options/install row absent — running wp core install"
                # Generate a strong throwaway admin password — the Organization
                # admin will only ever log in via Keycloak SSO; this
                # password is never used. NEVER printed (Inviolable
                # Principle #10).
                ADMIN_PASS="$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)"
                wp core install \
                  --allow-root \
                  --url="${WP_SITE_URL}" \
                  --title="WordPress" \
                  --admin_user="wp-bootstrap" \
                  --admin_password="${ADMIN_PASS}" \
                  --admin_email="bootstrap@${WP_SITE_URL##https://}" \
                  --skip-email
                unset ADMIN_PASS
                echo "[oidc-config] wp core install complete"
              else
                echo "[oidc-config] WordPress already installed — skipping core install"
              fi

              # 4. Vendor + activate openid-connect-generic (Refs #4322).
              #
              #    This Job mounts an EPHEMERAL emptyDir wp-content (#4220),
              #    so the plugin the runtime Deployment's initContainer
              #    seeds onto the PERSISTENT PVC is NOT visible here. The
              #    previous code therefore fell through to
              #    `wp plugin install openid-connect-generic --activate`,
              #    which fetches the zip from wordpress.org over egress and
              #    HANGS until the hook deadline on an air-gapped or
              #    slow-egress Sovereign → the post-upgrade hook timed out →
              #    HelmRelease Ready=False (root-caused live on the tkt0626
              #    fresh Org, omantel.biz, chart 0.4.17).
              #
              #    Fix: VENDOR the plugin from a pinned GitHub release
              #    archive into THIS Job's wp-content — exactly the
              #    deterministic, version-pinned mechanism step 0 uses for
              #    pg4wp. No wordpress.org runtime fetch. GitHub archives
              #    extract to `<name>-<version>` (un-prefixed tag), so we
              #    copy from `openid-connect-generic-<version>/`.
              #
              #    Activation only flips the `active_plugins` option row,
              #    which lives in POSTGRES (not on the ephemeral PVC) — so
              #    once the plugin dir exists here, `wp plugin activate`
              #    persists the activation for the runtime Pod (whose
              #    initContainer seeds the real plugin files onto the
              #    persistent PVC).
              #
              #    The whole step is WRAPPED so a fetch/activate failure
              #    LOGS and CONTINUES — it MUST NOT fail the release. A
              #    fully air-gapped Sovereign with no egress at all still
              #    reaches Ready (the OIDC settings written in step 5 live
              #    in Postgres; the runtime initContainer handles the files).
              OIDC_SLUG="openid-connect-generic"
              install_oidc_plugin() {
                if wp plugin is-installed "${OIDC_SLUG}" --allow-root >/dev/null 2>&1; then
                  echo "[oidc-config] ${OIDC_SLUG} already present — activating"
                  wp plugin activate "${OIDC_SLUG}" --allow-root >/dev/null
                  return 0
                fi
                # NEVER `wp plugin install` (wordpress.org egress fetch that
                # hangs the hook). Vendor the pinned GitHub release instead.
                OIDC_URL="https://github.com/${OIDC_PLUGIN_REPO}/archive/refs/tags/${OIDC_PLUGIN_VERSION}.zip"
                OIDC_DIR="openid-connect-generic-${OIDC_PLUGIN_VERSION}"
                echo "[oidc-config] vendoring ${OIDC_SLUG} from ${OIDC_URL}"
                # --max-time bounds the fetch so a black-holed egress route
                # can NEVER stall the hook — it fails fast and we continue.
                if ! curl -fsSL --max-time 120 -o /tmp/oidc.zip "${OIDC_URL}"; then
                  echo "[oidc-config] WARN: could not fetch ${OIDC_SLUG} from GitHub" \
                       "(air-gapped / egress blocked?) — the runtime Pod's" \
                       "wp-plugin-install initContainer seeds it onto the" \
                       "persistent PVC; continuing without failing the release"
                  return 0
                fi
                php -r '$z=new ZipArchive();$z->open("/tmp/oidc.zip");$z->extractTo("/tmp/");$z->close();'
                mkdir -p wp-content/plugins
                cp -a "/tmp/${OIDC_DIR}" "wp-content/plugins/${OIDC_SLUG}"
                rm -rf "/tmp/${OIDC_DIR}" /tmp/oidc.zip
                wp plugin activate "${OIDC_SLUG}" --allow-root >/dev/null
                echo "[oidc-config] ${OIDC_SLUG} vendored + activated"
              }
              if ! install_oidc_plugin; then
                echo "[oidc-config] WARN: ${OIDC_SLUG} install/activate failed —" \
                     "continuing so the release reaches Ready (settings persist" \
                     "in Postgres; runtime initContainer seeds the plugin files)"
              fi

              # 5. Compose the OIDC settings option row. Fields match
              #    the openid-connect-generic plugin's option schema —
              #    see openid-connect-generic-settings.php upstream.
              #    `endpoint_*` URLs are derived from the issuer URL
              #    (Keycloak's standard /protocol/openid-connect/* paths).
              ISSUER="${KC_ISSUER_URL%/}"
              # G117.5 W3.D3: append `?kc_idp_hint=<hint>` to endpoint_login
              # when OIDC_IDP_HINT is non-empty. Defense-in-depth — the
              # per-Org realm IDR `defaultProvider=sovereign-broker`
              # (W2.C4 #2794) handles silent SSO; the hint is the
              # diagnostic signal in HAR captures.
              LOGIN_URL="${ISSUER}/protocol/openid-connect/auth"
              if [ -n "${OIDC_IDP_HINT}" ]; then
                LOGIN_URL="${LOGIN_URL}?kc_idp_hint=${OIDC_IDP_HINT}"
              fi
              wp option update openid_connect_generic_settings --format=json --allow-root <<EOF
              {
                "login_type":               "auto",
                "client_id":                "${KC_CLIENT_ID}",
                "client_secret":            "${KC_CLIENT_SECRET}",
                "scope":                    "openid email profile",
                "endpoint_login":           "${LOGIN_URL}",
                "endpoint_userinfo":        "${ISSUER}/protocol/openid-connect/userinfo",
                "endpoint_token":           "${ISSUER}/protocol/openid-connect/token",
                "endpoint_end_session":     "${ISSUER}/protocol/openid-connect/logout",
                "identity_key":             "${OIDC_IDENTITY_KEY}",
                "no_sslverify":             0,
                "http_request_timeout":     5,
                "enforce_privacy":          0,
                "alternate_redirect_uri":   0,
                "token_refresh_enable":     1,
                "link_existing_users":      1,
                "create_if_does_not_exist": 1,
                "redirect_user_back":       1,
                "redirect_on_logout":       1,
                "acl_enabled":              0,
                "enable_logging":           0,
                "log_limit":                1000
              }
              EOF
              echo "[oidc-config] openid_connect_generic_settings written"

              # 6. Default WordPress role for newly-created SSO users —
              #    plugin reads this from the standard `default_role`
              #    option.
              wp option update default_role "${OIDC_DEFAULT_ROLE}" --allow-root >/dev/null
              echo "[oidc-config] default_role set to ${OIDC_DEFAULT_ROLE}"

              # 7. Theme activation — install + activate idempotently.
              if wp theme is-installed "${WP_DEFAULT_THEME}" --allow-root >/dev/null 2>&1; then
                wp theme activate "${WP_DEFAULT_THEME}" --allow-root >/dev/null
              else
                wp theme install "${WP_DEFAULT_THEME}" --activate --allow-root
              fi
              echo "[oidc-config] theme ${WP_DEFAULT_THEME} active"

              # 8. siteurl + home — overwrite the WP install defaults so
              #    links resolve through the ingress host.
              wp option update siteurl "${WP_SITE_URL}" --allow-root >/dev/null
              wp option update home    "${WP_SITE_URL}" --allow-root >/dev/null
              echo "[oidc-config] siteurl/home set to ${WP_SITE_URL}"

              echo "[oidc-config] all OIDC bootstrap steps complete"
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        # #4220 (Refs #4155): ALWAYS an emptyDir — never the runtime
        # Deployment's ReadWriteOnce `wp-content` PVC. The WordPress Pod
        # holds that RWO PVC for its whole lifetime; a concurrent Job that
        # mounted it would block forever on the kubelet Multi-Attach error
        # (the Sovereign has no RWX StorageClass). This Job only needs the
        # pg4wp db.php drop-in (self-seeded in step 0) for Postgres
        # connectivity; the OIDC settings it writes persist in Postgres,
        # so the ephemeral wp-content is the correct, deadlock-free choice.
        - name: wp-content
          emptyDir: {}
{{- end }}
