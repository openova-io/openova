{{- if .Values.wordpress.enabled }}
{{- /*
WordPress Deployment.

Boot sequence (per docs/INVIOLABLE-PRINCIPLES.md #2 — ship target-state shape, no stubs):

  1. initContainer `wp-content-bootstrap`: copies the official image's
     baked-in `/var/www/html/wp-content/` (themes, plugins, mu-plugins
     skeleton) onto the empty PVC ON FIRST INSTALL ONLY. The official
     wordpress:* image bakes wp-content into the image; mounting an
     empty PVC over `/var/www/html/wp-content` would otherwise hide
     those bytes. The init container detects an unseeded PVC by looking
     for `themes/` and seeds it from the image once, idempotently.

  2. initContainer `wp-plugin-install`: copies `openid-connect-generic`
     + the `pg4wp` Postgres adapter from the runtime image's baked
     `/usr/src/openova-wp-artifacts/` into `wp-content/` on the PVC.
     Idempotent — skips if the target dir already exists. #6311: this
     used to download them from downloads.wordpress.org + github.com at
     install time, which contradicts cutover step-08's deny-egress hold
     (Pillar 5). There is deliberately NO network fallback.

  3. main container `wordpress`: the official image starts; its
     entrypoint writes `wp-config.php` from WORDPRESS_DB_* env vars,
     then `apache2-foreground` boots Apache + mod_php.

The OIDC plugin's option row, the admin user, and the default theme
activation are populated by the post-install Jobs in
templates/oidc-config-job.yaml + templates/admin-user-job.yaml. Both
run via wp-cli (the canonical wordpress:cli-* image) against the same
DB the runtime container uses, so any plugin/theme/option change goes
through WordPress core's public API rather than direct schema writes.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bp-wordpress-tenant.fullname" . }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.wordpress.replicas }}
  selector:
    matchLabels:
      {{- include "bp-wordpress-tenant.selectorLabels" . | nindent 6 }}
  strategy:
    # ReadWriteOnce PVC default — Recreate avoids the "two pods can't
    # mount the same PVC" deadlock during rollouts. Operators that
    # switch persistence to RWX may flip to RollingUpdate via overlay.
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "bp-wordpress-tenant.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the OIDC config / DB secret name changes.
        checksum/oidc-job: {{ include (print $.Template.BasePath "/oidc-config-job.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "bp-wordpress-tenant.serviceAccountName" . }}
      {{- with .Values.wordpress.image.pullSecrets }}
      # #4152 (Refs #3858): the WordPress runtime image is now the CUSTOM
      # ghcr.io/openova-io/openova/wordpress-tenant-pg build — a PRIVATE ghcr
      # package. kubelet's anonymous pull 401s ("failed to authorize: ...
      # 401 Unauthorized"), stranding the Pod in ImagePullBackOff. This applies
      # to EVERY container that uses `bp-wordpress-tenant.wordpressImage`: all
      # three initContainers (wp-fix-perms, wp-content-bootstrap,
      # wp-plugin-install) AND the main `wordpress` container. The `ghcr-pull`
      # Secret is reflected by bp-reflector into every Org namespace (same
      # canonical name bp-newapi consumes; cloud-init writes the source
      # flux-system/ghcr-pull with reflection-auto-namespaces). Per Inviolable
      # Principle #4 the secret list is overrideable (set `[]` on clusters that
      # pull this image from a public mirror).
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.wordpress.podSecurityContext | nindent 8 }}
      initContainers:
        # ── 0. Fix wp-content PVC ownership (root, runs FIRST) ─────────
        # The PVC root is mounted root-owned; podSecurityContext.fsGroup
        # sets the GROUP but not the OWNER, so a uid-33 process cannot
        # chown/chmod it. Every downstream step that runs as uid 33 — the
        # wp-content-bootstrap seed (`chown -R 33:33 /pvc` on a fresh PVC),
        # wp-plugin-install, AND the official image's WP-core `tar` (which
        # chmods ./wp-content) — otherwise dies with "Operation not
        # permitted". This short root init (CAP_CHOWN/FOWNER only, no shell
        # privesc) re-owns the PVC to 33:33 once so all later uid-33 steps
        # succeed. Uses the wordpress image (not busybox) to satisfy the
        # kyverno harbor-proxy single-glob rule (#3461). Validated live on
        # omantel.biz demo Org (kom4dc) — pod reached Apache-serving. (#4152)
        - name: wp-fix-perms
          image: {{ include "bp-wordpress-tenant.wordpressImage" . | quote }}
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              chown -R 33:33 /pvc
              chmod -R u+rwX /pvc
              echo "wp-content PVC perms fixed (33:33)."
          volumeMounts:
            - name: wp-content
              mountPath: /pvc
        # ── 1. Seed wp-content from the image onto the PVC (idempotent) ─
        - name: wp-content-bootstrap
          image: {{ include "bp-wordpress-tenant.wordpressImage" . | quote }}
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.wordpress.containerSecurityContext | nindent 12 }}
          command:
            - /bin/bash
            - -c
            - |
              set -eu
              # If the PVC is empty (first install) seed it from the
              # image's baked-in wp-content. We probe for `themes/`
              # because the official image always ships at least the
              # default theme — if it's missing, the PVC was just
              # bound and we need to seed.
              if [ ! -d /pvc/themes ]; then
                echo "Seeding wp-content/ onto PVC from image..."
                cp -a /usr/src/wordpress/wp-content/. /pvc/
                chown -R 33:33 /pvc
                echo "Seed complete."
              else
                echo "wp-content/ already populated on PVC — skipping seed."
              fi
          volumeMounts:
            - name: wp-content
              mountPath: /pvc
        # ── 2. Seed plugins onto the PVC FROM THE IMAGE (#6311) ─────────
        # Two artifacts are pre-installed at boot, both idempotent
        # (skip if already present on the PVC):
        #
        #   a) `openid-connect-generic` — the SSO plugin that drives the
        #      Keycloak OIDC login flow.
        #   b) `pg4wp` — translates WordPress's MySQL queries to PostgreSQL
        #      so the WordPress image runs against bp-cnpg without a MySQL
        #      footprint in the Organization's namespace. Installed under
        #      wp-content/pg4wp and chain-loaded via the wp-content/db.php
        #      drop-in.
        #
        # SOURCE — the RUNTIME IMAGE, never the network (#6311, Refs #3988).
        # Until 0.4.24 this initContainer curl'd (a) from
        # downloads.wordpress.org and (b) from github.com AT INSTALL TIME.
        # Cutover step-08 (`egress-block-test`) exists precisely to hold a
        # 10-minute deny-egress NetworkPolicy against github.com / ghcr.io /
        # harbor.openova.io and require the cluster to reconcile green
        # through it — a customer Application that reaches GitHub to install
        # cannot exist on a sovereign Sovereign (Pillar 5, ADR-0002).
        #
        # Both artifacts are now baked into
        # `/usr/src/openova-wp-artifacts/` by
        # platform/wordpress-tenant/image/Dockerfile and travel to a
        # post-cutover Sovereign inside the image itself — the ONLY artifact
        # classes cutover step-03 (`harbor-prewarm`) mirrors are OCI images
        # and Helm charts, and `wordpress-tenant-pg` is already in that
        # prewarm set by name. No new mirroring mechanism was introduced.
        - name: wp-plugin-install
          image: {{ include "bp-wordpress-tenant.wordpressImage" . | quote }}
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          securityContext:
            # Stays on the shared uid-33 context: this init no longer runs
            # apt (it extracts via PHP ZipArchive — see the command below),
            # and the `wp-fix-perms` root init (initContainers[0]) already
            # re-owns the PVC, so no root is needed here. (Supersedes #4147's
            # root override, which was only for the old apt-install path.)
            {{- toYaml .Values.wordpress.containerSecurityContext | nindent 12 }}
          command:
            - /bin/bash
            - -c
            - |
              set -eu
              # #6311: the artifacts are BAKED INTO THIS IMAGE. There is no
              # download step and no zip extraction here any more — the two
              # `curl` calls this block used to run (downloads.wordpress.org
              # for the OIDC plugin, github.com for pg4wp) were install-time
              # egress and contradicted the cutover step-08 deny-egress hold.
              # Everything below is a local `cp` from the image's read-only
              # /usr/src/openova-wp-artifacts onto the wp-content PVC.
              #
              # FAIL CLOSED, never fall back to the network: if the baked
              # directory is absent, the running image predates chart 0.4.24
              # and the values.yaml image pin is hollow. Surfacing that as a
              # loud init failure is correct — a silent network fallback is
              # exactly the sovereignty violation this change removes.
              WP_ARTIFACTS=/usr/src/openova-wp-artifacts
              if [ ! -d "${WP_ARTIFACTS}" ]; then
                echo "FATAL: ${WP_ARTIFACTS} missing from the runtime image." >&2
                echo "  The chart requires the baked pg4wp + openid-connect-generic" >&2
                echo "  artifacts (#6311). Check wordpress.image.{tag,digest} in" >&2
                echo "  values.yaml against platform/wordpress-tenant/image/." >&2
                exit 1
              fi
              # ── (a) openid-connect-generic plugin ──────────────────
              # Slug is the BARE `openid-connect-generic` — the same directory
              # name the oidc-config hook Job's `wp plugin activate` writes
              # into WordPress's `active_plugins` option row. The pre-#6311
              # wordpress.org slug (`daggerhart-openid-connect-generic`) did
              # NOT match it, so that option row pointed at a path this PVC
              # never contained and the plugin never loaded at runtime.
              OIDC_DIR=/pvc/plugins/openid-connect-generic
              if [ -d "${OIDC_DIR}" ]; then
                echo "openid-connect-generic already installed — skipping."
              else
                echo "Seeding openid-connect-generic from the image..."
                mkdir -p /pvc/plugins
                # `cp -R`, NOT `cp -a`: the baked source is root-owned in the
                # image, while this init runs as uid 33 and the PVC copy must
                # end up owned by uid 33 (WordPress writes into wp-content).
                # `-a` implies `-p`, which asks to preserve ROOT ownership —
                # either denied outright under the dropped-ALL-capabilities
                # securityContext, or "successful" and leaving a root-owned
                # tree the runtime user cannot write. `cp -R` copies content
                # and lets the new files take the copying uid. Verified by the
                # uid-33 build-time probe in image/Dockerfile.
                cp -R "${WP_ARTIFACTS}/plugins/openid-connect-generic" "${OIDC_DIR}"
                echo "openid-connect-generic installed."
              fi
              # ── (b) pg4wp drop-in (Postgres adapter) ───────────────
              # bp-wordpress-tenant runs WordPress against bp-cnpg
              # Postgres (per ticket #800 scope). pg4wp ships a
              # `wp-content/db.php` drop-in + `pg4wp/` library that
              # together intercept `wpdb` at the PHP level and map
              # MySQL queries to Postgres.
              PG4WP_DIR=/pvc/pg4wp
              if [ -d "${PG4WP_DIR}" ] && [ -f /pvc/db.php ]; then
                echo "pg4wp already installed — skipping."
              else
                echo "Seeding pg4wp from the image..."
                # rm -rf first so a half-seeded PVC (pg4wp/ present, db.php
                # absent) cannot make `cp` nest the copy at /pvc/pg4wp/pg4wp.
                rm -rf "${PG4WP_DIR}"
                cp -R "${WP_ARTIFACTS}/pg4wp" "${PG4WP_DIR}"
                cp "${WP_ARTIFACTS}/db.php" /pvc/db.php
                echo "pg4wp installed."
              fi
              # No chown needed: this init runs as uid 33 (the chart's
              # containerSecurityContext), so php_unzip extracts plugin/adapter
              # files already owned by 33. A `chown -R 33:33 /pvc` here is both
              # redundant AND fatal — as a non-root (uid 33) process it cannot
              # re-own the fsGroup-mounted `/pvc` root (owned by root) →
              # "chown: changing ownership of '/pvc': Operation not permitted"
              # → init Error. wp-content-bootstrap (init 0) already owns the
              # seed; the runtime container (uid 33 + fsGroup) reads these fine.
          volumeMounts:
            - name: wp-content
              mountPath: /pvc
      containers:
        - name: wordpress
          image: {{ include "bp-wordpress-tenant.wordpressImage" . | quote }}
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.wordpress.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.wordpress.port }}
              protocol: TCP
          env:
            # ── Database connection (CNPG-emitted app Secret, direct) ─
            - name: WORDPRESS_DB_HOST
              value: {{ include "bp-wordpress-tenant.cnpgRwHost" . | quote }}
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.database.cluster.database | default "wordpress" | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.database.cluster.owner | default "wordpress" | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  # 0.4.21 (#4936): bind DIRECTLY to the CNPG-generated
                  # `<cluster>-app` Secret (default `wordpress-db-app`, key
                  # `password`). CNPG synthesises this Secret WITH the real
                  # password the moment the Cluster CR is admitted — well
                  # inside Helm's `--wait` window. The previous indirection
                  # through the reflector-mirrored `wordpress-database-secret`
                  # populated ~6 min AFTER install (reflector is a separate
                  # watch controller), which blew past the 5 m `--wait` →
                  # HR `InstallFailed: context deadline exceeded` → the
                  # external HTTPRoute was never created (host 404). Pointing
                  # at the source Secret removes the async populate + the
                  # empty-placeholder race entirely. NOT `optional`: the key
                  # is guaranteed present once CNPG has created the Secret, so
                  # the Pod must never boot binding an empty password.
                  name: {{ include "bp-wordpress-tenant.cnpgAppSecret" . }}
                  key: password
            # ── Site URL (used by WP to construct admin/login links) ─
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME',    'https://{{ include "bp-wordpress-tenant.ingressHost" . }}');
                define('WP_SITEURL', 'https://{{ include "bp-wordpress-tenant.ingressHost" . }}');
                /* SSL terminates at the ingress; tell WP to honour the
                   X-Forwarded-Proto header so login redirects use https. */
                if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
                  $_SERVER['HTTPS'] = 'on';
                }
          livenessProbe:
            httpGet:
              path: {{ .Values.wordpress.probes.liveness.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "bp-wordpress-tenant.ingressHost" . | quote }}
            initialDelaySeconds: {{ .Values.wordpress.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.wordpress.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.wordpress.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.wordpress.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.wordpress.probes.readiness.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "bp-wordpress-tenant.ingressHost" . | quote }}
            initialDelaySeconds: {{ .Values.wordpress.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.wordpress.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.wordpress.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.wordpress.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: wp-content
          {{- if .Values.persistence.wpContent.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "bp-wordpress-tenant.fullname" . }}-wp-content
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
