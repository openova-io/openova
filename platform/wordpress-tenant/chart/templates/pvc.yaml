{{- if and .Values.wordpress.enabled (eq (include "bp-wordpress-tenant.wpContentOnPvc" .) "true") }}
{{- /*
LEGACY REGION-LOCAL VOLUME `wp-content` (ADR-0015 D6) — media.store=pvc only.

Persistent volume for /var/www/html/wp-content carrying themes, plugins,
mu-plugins and uploaded media across pod restarts and image upgrades.

This volume is REGION-LOCAL and NOTHING replicates it, so it is rendered
only for the legacy single-region shape: `bp-wordpress-tenant.mediaStore`
FAILS the render for media.store=pvc under a multi-region openova.topology,
and the catalyst-api / application-controller D6 gate refuses the placement.
The default media.store=s3 renders NO PVC: uploads go to the replicated
SeaweedFS bucket and wp-content is rebuilt from the image on every Pod start.
Declared in platform/wordpress-tenant/blueprint.yaml
`spec.regionLocalVolumes[name=wp-content]`; the label
`openova.io/volume-name` below is what scripts/check-region-local-volumes-
declared.sh matches against that declaration.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bp-wordpress-tenant.wpContentPvcName" . }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    openova.io/volume-scope: region-local
    openova.io/volume-name: wp-content
  annotations:
    # Helm resource-policy keep — do not delete on `helm uninstall`
    # (the PVC carries customer content; operator must explicitly
    # delete via `kubectl delete pvc` after data export). Also what lets
    # templates/media-migrate-job.yaml find it after a switch to media.store=s3.
    helm.sh/resource-policy: keep
    openova.io/volume-replication: none
spec:
  accessModes:
    {{- range .Values.persistence.wpContent.accessModes }}
    - {{ . | quote }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.wpContent.size | quote }}
  {{- if .Values.persistence.wpContent.storageClass }}
  storageClassName: {{ .Values.persistence.wpContent.storageClass | quote }}
  {{- end }}
{{- end }}
