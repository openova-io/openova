{{- /*
─── Shared-secret SEED — rendered by the writer (primary) region only ────
(ADR-0015 D2, Refs #7067)

A two-region CNPG pair needs two Secrets with the SAME bytes in every region
(topology-mesh.yaml §3 pulls them with ExternalSecrets):

  <cnpgClusterName>-replication-ca   ca.crt / ca.key  — the streaming client CA
  <cnpgClusterName>-app-credentials  username / password — the DB owner

This file is the GENERATOR. It renders only where `openova.topology.self` is
the primary, and writes the material ONCE into the secret store at the same
paths every region's ExternalSecret reads:

  <prefix>/db-owner        ← ESO Password generator (+ the owner name)
  <prefix>/replication-ca  ← a cert-manager self-signed CA Certificate

  <prefix> = database.topology.sharedSecrets.externalSecret.remoteKeyPrefix,
             default `openova/apps/<namespace>/<cnpgClusterName>` — the PAIR
             identity, identical in every region. (Not the release name: each
             region's HelmRelease is named `<app>-<cluster>`, so a release-keyed
             path would differ per region and no peer would ever find it.)

Write-once, never regenerated:
  - Both PushSecrets use `updatePolicy: IfNotExists` — ESO checks each remote
    property and skips it when present, so a re-render, a refresh, a new
    generator value or a renewed seed CA never overwrites the shared copy.
  - `deletionPolicy: None` — uninstalling the seed (this region stops being
    the primary, or the release is removed) leaves the material in the store.
  - Every region, the primary included, CONSUMES the store copy (the
    ExternalSecrets), never the local seed — so the seed Secret drifting
    (cert-manager renewal) changes nothing.
After a primary move the new primary renders this file again; every property
already exists, so it is a no-op. The material lives in the store, not in a
region.

Where the bytes must reach: every region's store. Each region runs its own
OpenBao, so the default pushes into this region's store
(`externalSecret.storeRef`, vault-region1) AND `vault-<peer>` for every peer
in `openova.topology.peers` — the per-peer-region stores
bp-external-secrets-stores renders, which write into that peer's OpenBao. A
peer's ExternalSecrets, reading the peer's own vault-region1, then find the
material. No operator values. `seed.secretStoreRefs` overrides the list.

Gates: multi-region contract + this release is the primary + a store is
configured + `seed.enabled` (default true) + the ESO PushSecret API. The CA
seed additionally needs cert-manager.io/v1.
*/ -}}
{{- if and .Values.wordpress.enabled .Values.database.cluster.enabled (include "bp-wordpress-tenant.multiRegion" .) (include "openova.topology.isPrimary" .) }}
{{- $topo := .Values.database.topology | default dict -}}
{{- $ss := $topo.sharedSecrets | default dict -}}
{{- $es := $ss.externalSecret | default dict -}}
{{- $store := $es.storeRef | default dict -}}
{{- $seed := $ss.seed | default dict -}}
{{- if and $store.name (ne ($seed.enabled | toString) "false") (.Capabilities.APIVersions.Has "external-secrets.io/v1alpha1") }}
{{- $prefix := include "bp-wordpress-tenant.sharedSecretsPrefix" . -}}
{{- $ns := include "bp-wordpress-tenant.cnpgNamespace" . -}}
{{- $pair := .Values.database.cnpgClusterName -}}
{{- /* Default fan-out: this region's store (the consumers' storeRef) plus one
       store per PEER of the topology contract, `<peerStoreNamePrefix><peer>`
       — bp-external-secrets-stores renders exactly those names (one per peer
       region, writing into that region's OpenBao). An explicit
       seed.secretStoreRefs replaces the default verbatim. */ -}}
{{- $stores := list (dict "kind" ($store.kind | default "ClusterSecretStore") "name" $store.name) -}}
{{- $peerPrefix := $seed.peerStoreNamePrefix | default "vault-" -}}
{{- range (include "openova.topology.get" . | fromJson).peers -}}
{{- $stores = append $stores (dict "kind" "ClusterSecretStore" "name" (printf "%s%s" $peerPrefix .)) -}}
{{- end -}}
{{- if $seed.secretStoreRefs -}}{{- $stores = $seed.secretStoreRefs -}}{{- end -}}
{{- $refresh := $seed.refreshInterval | default "1h" -}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ printf "%s-db-owner-seed" $pair | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ $pair | quote }}
spec:
  length: 32
  digits: 6
  # No symbols: the password is interpolated into libpq / PHP connection
  # strings by the DB-writing Jobs.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ printf "%s-db-owner-seed" $pair | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ $pair | quote }}
    catalyst.openova.io/component: shared-secret-seed
spec:
  refreshInterval: {{ $refresh | quote }}
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    {{- range $stores }}
    - kind: {{ .kind | default "ClusterSecretStore" | quote }}
      name: {{ .name | quote }}
    {{- end }}
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: {{ printf "%s-db-owner-seed" $pair | quote }}
  template:
    data:
      username: {{ .Values.database.cluster.owner | quote }}
      password: {{ "{{ .password }}" | quote }}
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: {{ printf "%s/db-owner" $prefix | quote }}
          property: username
    - match:
        secretKey: password
        remoteRef:
          remoteKey: {{ printf "%s/db-owner" $prefix | quote }}
          property: password
{{- if .Capabilities.APIVersions.Has "cert-manager.io/v1" }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ printf "%s-replication-ca-seed" $pair | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ $pair | quote }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "%s-replication-ca-seed" $pair | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ $pair | quote }}
spec:
  isCA: true
  commonName: {{ printf "%s-replication-ca" $pair | quote }}
  secretName: {{ printf "%s-replication-ca-seed" $pair | quote }}
  # 10 years. The shared copy is write-once; a local renewal never reaches it.
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: {{ printf "%s-replication-ca-seed" $pair | quote }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ printf "%s-replication-ca-seed" $pair | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ $pair | quote }}
    catalyst.openova.io/component: shared-secret-seed
spec:
  refreshInterval: {{ $refresh | quote }}
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    {{- range $stores }}
    - kind: {{ .kind | default "ClusterSecretStore" | quote }}
      name: {{ .name | quote }}
    {{- end }}
  selector:
    secret:
      name: {{ printf "%s-replication-ca-seed" $pair | quote }}
  data:
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: {{ printf "%s/replication-ca" $prefix | quote }}
          property: ca.crt
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: {{ printf "%s/replication-ca" $prefix | quote }}
          property: ca.key
{{- end }}
{{- end }}
{{- end }}
