{{- /*
─── Seed CA Secret clean-up — a Helm hook in every region ─────────────────
(FND-G12, J5 on hw307, 23 November 2026)

shared-secrets-seed.yaml has cert-manager issue the seed CA into
`<pair>-replication-ca-seed`. cert-manager never deletes a Certificate's
Secret (the platform does not run --enable-certificate-owner-ref), so the
Secret stayed after the Application was removed, in every region the seed
had rendered in. Secret guard G3 forbids rendering the Secret here, so a
hook Job deletes it instead:

  post-delete   in every region, whatever the primary: the release is gone,
                and with it the Certificate, so nothing writes the Secret
                again. A former primary's copy goes when the Application is
                removed.

Only a REAL removal deletes the seed. helm-controller also uninstalls, with
hooks, to remediate a failed install (install.remediation.retries); the retry
would then issue a NEW CA and the write-once stores of the regions would hold
different replication CAs. So the Job first reads this release's own
HelmRelease and deletes the seed only when it is gone (404 naming it) or has
a deletionTimestamp (Flux pruned it; its finalizer runs this uninstall). An
existing HelmRelease without one (a remediation, or a helm uninstall outside
Flux), or any answer it cannot read, deletes nothing. The release names its
HelmRelease: the application controller sets no spec.releaseName and no
spec.targetNamespace in the fan-out (core/controllers/application/internal/
render/fanout.go renderOneHR), and releaseName = metadata.name with
targetNamespace = the host namespace in the per-region render
(core/controllers/pkg/render/manifests.go), so on the host .Release.Name and
.Release.Namespace are the HelmRelease's name and namespace.

There is deliberately NO post-upgrade hook. The upgrade that moves the
Primary away demotes this region's CNPG Cluster; a hook that cannot start
(image pull, scheduling, quota) would fail that upgrade after spec.timeout,
helm-controller would roll it back to the revision where this region is the
primary, and the new region is promoted already: two primaries. Nothing may
gate a demotion upgrade.

The Job reaches the API server: the Organization's CiliumNetworkPolicy
allow-gateway-and-apiserver (core/controllers/organization/internal/gitops/
manifests.go) selects every Pod of the namespace (endpointSelector {}) and
allows egress to the kube-apiserver entity on 443 and 6443. org-fence and
org-fence-api deny the API server only to Pods with the label
vcluster.loft.sh/managed-by, which a host hook Pod does not carry.

The Role allows get and delete on that one Secret name and get on that one
HelmRelease, nothing else. The script deletes the Secret (404 is success)
and exits 0. A Pod that never starts is
bounded by activeDeadlineSeconds (the Job then fails, ttlSecondsAfterFinished
applies) and hook-failed deletes the Job, so no Pending Pod stays charged to
plan-quota after the release is purged. No Secret value is read.
*/}}
{{- if and .Values.wordpress.enabled .Values.database.cluster.enabled (include "bp-wordpress-tenant.multiRegion" .) }}
{{- $topo := .Values.database.topology | default dict -}}
{{- $ss := $topo.sharedSecrets | default dict -}}
{{- $es := $ss.externalSecret | default dict -}}
{{- $store := $es.storeRef | default dict -}}
{{- $seed := $ss.seed | default dict -}}
{{- if and $store.name (ne ($seed.enabled | toString) "false") (.Capabilities.APIVersions.Has "external-secrets.io/v1alpha1") (.Capabilities.APIVersions.Has "cert-manager.io/v1") }}
{{- $ns := include "bp-wordpress-tenant.cnpgNamespace" . -}}
{{- $secret := printf "%s-replication-ca-seed" (include "bp-wordpress-tenant.cnpgBase" .) -}}
{{- $name := printf "%s-seed-ca-cleanup" (include "bp-wordpress-tenant.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- $hook := "post-delete" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/component: shared-secret-seed-cleanup
  annotations:
    "helm.sh/hook": {{ $hook | quote }}
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/component: shared-secret-seed-cleanup
  annotations:
    "helm.sh/hook": {{ $hook | quote }}
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secret | quote }}]
    verbs: ["get", "delete"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    resourceNames: [{{ .Release.Name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/component: shared-secret-seed-cleanup
  annotations:
    "helm.sh/hook": {{ $hook | quote }}
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $ns | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/component: shared-secret-seed-cleanup
    # helm-controller-created hook Job: the kyverno flux-managed policy admits
    # managed-by flux (same as admin-user-job.yaml).
    app.kubernetes.io/managed-by: flux
  annotations:
    "helm.sh/hook": {{ $hook | quote }}
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded,hook-failed"
spec:
  backoffLimit: 2
  # Bounds a Pod that never starts (backoffLimit does not count it), well
  # inside the 900 s spec.timeout; each of the script's two calls ends
  # within ~130 s.
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress-seed-ca-cleanup
        catalyst.openova.io/blueprint: bp-wordpress-tenant
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      {{- with .Values.wordpress.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.wordpress.podSecurityContext | nindent 8 }}
      containers:
        - name: cleanup
          # The WordPress image of this release: admitted in this namespace;
          # it carries curl. It may not be on the node: a region that was
          # never the primary runs no WordPress Pod (replicas 0), so this can
          # be its first pull; activeDeadlineSeconds bounds that.
          image: {{ include "bp-wordpress-tenant.wordpressImage" . | quote }}
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.wordpress.containerSecurityContext | nindent 12 }}
          # #4951: an explicit CPU limit. Without one the plan-limits
          # LimitRange defaults limits.cpu to the plan headline / 8 and
          # plan-quota charges it; a hook Pod rejected "exceeded quota:
          # plan-quota" is never created and fails the uninstall.
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
          env:
            - name: SEED_NAMESPACE
              value: {{ $ns | quote }}
            - name: SEED_SECRET
              value: {{ $secret | quote }}
            - name: HELMRELEASE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: HELMRELEASE_NAME
              value: {{ .Release.Name | quote }}
          command:
            - /bin/sh
            - -c
            - |
              sa=/var/run/secrets/kubernetes.io/serviceaccount
              t="${TMPDIR:-/tmp}"
              hr="$HELMRELEASE_NAMESPACE/$HELMRELEASE_NAME"
              printf 'Authorization: Bearer %s\n' "$(cat "$sa/token")" > "$t/auth"
              # A real removal, or a remediation uninstall? Read the metadata
              # of this release's HelmRelease (the API pretty-prints for curl,
              # so blanks are stripped before matching).
              code=$(curl -sS -o "$t/hr" -w '%{http_code}' --max-time 20 \
                --retry 5 --retry-delay 2 --retry-all-errors --cacert "$sa/ca.crt" -H @"$t/auth" \
                -H 'Accept: application/json;as=PartialObjectMetadata;g=meta.k8s.io;v=v1' \
                "https://kubernetes.default.svc/apis/helm.toolkit.fluxcd.io/v2/namespaces/$HELMRELEASE_NAMESPACE/helmreleases/$HELMRELEASE_NAME") || code="no answer"
              body=$(tr -d ' \t\r\n' 2>/dev/null < "$t/hr")
              rm -f "$t/hr"
              remove=no
              case "$code" in
                200) case "$body" in
                       *'"deletionTimestamp":"'*) remove=yes; why="the HelmRelease $hr is being deleted" ;;
                       *) why="the HelmRelease $hr exists and is not being deleted (a remediation uninstall, or a helm uninstall outside Flux)" ;;
                     esac ;;
                404) case "$body" in
                       *'"kind":"helmreleases"'*) remove=yes; why="the HelmRelease $hr is gone" ;;
                       *) why="reading the HelmRelease $hr answered 404 without naming it (the API is not served here)" ;;
                     esac ;;
                *) why="cannot read the HelmRelease $hr (answered $code)" ;;
              esac
              if [ "$remove" != yes ]; then
                rm -f "$t/auth"
                echo "$why: the Secret $SEED_NAMESPACE/$SEED_SECRET stays"
                exit 0
              fi
              echo "$why"
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                --retry 5 --retry-delay 2 --retry-all-errors --cacert "$sa/ca.crt" -H @"$t/auth" \
                -X DELETE "https://kubernetes.default.svc/api/v1/namespaces/$SEED_NAMESPACE/secrets/$SEED_SECRET") || code="no answer"
              rm -f "$t/auth"
              case "$code" in
                200|202) echo "deleted the Secret $SEED_NAMESPACE/$SEED_SECRET" ;;
                404) echo "the Secret $SEED_NAMESPACE/$SEED_SECRET does not exist" ;;
                *) echo "WARNING: deleting the Secret $SEED_NAMESPACE/$SEED_SECRET answered $code; it stays" ;;
              esac
              exit 0
{{- end }}
{{- end }}
