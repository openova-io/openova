{{- /*
#3785: the Cilium Gateway path to WordPress was DEAD on the omantel.biz
demo Org — every external hit to wordpress.<slug>.<pool> returned
"upstream connect error ... connection timeout" (envoy 503) once the
HTTPRoute landed. Root cause: the K8s NetworkPolicy in networkpolicy.yaml
allows ingress only from NAMESPACES (traefik / kube-system), but Cilium
Gateway API traffic reaches the backend with the reserved `ingress`
ENTITY identity (the Envoy proxy embedded in the cilium agent), which NO
K8s NetworkPolicy selector (podSelector / namespaceSelector / ipBlock)
can express. Same failure class as platform/newapi
cilium-ingress-networkpolicy.yaml (#3374) + the sso-bridge kube-apiserver
entity saga: Cilium namespace rules match only Pod endpoints, never
reserved entities — so a `namespaceSelector: kube-system` is INERT for
gateway traffic and the connection times out. Confirmed live: deleting
the standard NetworkPolicy flipped GET / from 503 → HTTP 302
(/wp-admin/install.php); a CNP fromEntities:[ingress] is the canonical,
additive fix that keeps the default-deny posture intact.

CiliumNetworkPolicy fromEntities is the canonical expression (same idiom
as platform/newapi + platform/sso-bridge). When both a K8s NetworkPolicy
and a CNP select the same Pod the allow-sets UNION, so this is purely
additive: gateway traffic is admitted, everything the K8s policy already
allowed stays allowed, everything else stays denied.

Gated on the cilium.io/v2 Capabilities check (the #2988/#3102 idiom) so
the chart still installs on CRD-less clusters (kind CI), and on
networkPolicy.ingress.allowGatewayEntity so a non-Cilium overlay can opt
out.
*/ -}}
{{- if and .Values.wordpress.enabled .Values.networkPolicy.enabled .Values.networkPolicy.ingress.allowGatewayEntity (.Capabilities.APIVersions.Has "cilium.io/v2") }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "bp-wordpress-tenant.fullname" . }}-gateway-ingress
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/component: wordpress-gateway-netpol
spec:
  endpointSelector:
    matchLabels:
      {{- include "bp-wordpress-tenant.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: {{ .Values.wordpress.port | quote }}
              protocol: TCP
{{- end }}
