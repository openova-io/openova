{{- if and .Values.wordpress.enabled (eq (include "bp-wordpress-tenant.mediaStore" .) "s3") }}
{{- /*
ADR-0015 D6 (Refs #7067) — reflected SeaweedFS S3 credentials for the media
store. SAME bridge as bp-gitea's objectStorage (platform/gitea/chart/
templates/objectstorage-secret.yaml): K8s forbids a cross-namespace
secretKeyRef, the bp-seaweedfs-generated `seaweedfs-s3-secret` lives in the
`seaweedfs` namespace, so bp-reflector copies its keys into this Secret as
soon as the source exists or rotates. bp-seaweedfs >= 1.3.1 annotates the
source `reflection-allowed` (the source half of the contract).

Each region's release reflects ITS OWN region's SeaweedFS credentials and
talks to its own region's S3 gateway; bp-seaweedfs filer.sync replicates the
`replicated` bucket between the regions.

No credential appears in this template (docs/PRINCIPLES.md #10). The empty
bootstrap keys keep the volume mount valid before the reflector has run; the
mu-plugin reads the files per request, so the filled values are picked up
without a Pod restart (kubelet refreshes Secret volumes).
*/}}
{{- $c := .Values.media.s3.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bp-wordpress-tenant.mediaS3SecretName" . }}
  labels:
    {{- include "bp-wordpress-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/component: wordpress-media-store
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "{{ $c.sourceNamespace }}/{{ $c.sourceName }}"
    # The reflector owns the data after the first sync; a Helm upgrade must
    # not reset it to the empty bootstrap values.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $c.accessKeyIdKey }}: ""
  {{ $c.secretAccessKeyKey }}: ""
{{- end }}
