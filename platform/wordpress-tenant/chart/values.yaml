# Catalyst Blueprint scratch chart for bp-wordpress-tenant — in-vcluster
# turnkey WordPress per Organization tenant, SSO-pre-wired against the Organization's
# vcluster-local Keycloak realm.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every
# operationally-meaningful value (image tag, ingress host, Keycloak realm
# URL, CNPG cluster name, default theme, admin email) is configurable.
# Per-Sovereign cluster overlays in clusters/<sovereign>/.../wordpress/
# may override any of these without rebuilding the Blueprint OCI artifact.
#
# Image-pull strategy
# ───────────────────
# `global.imageRegistry` (rendered as a prefix on `image.repository`)
# routes pulls through the Sovereign's own Harbor proxy-cache once
# bp-harbor reconciles. Empty default = pull directly from Docker Hub
# (only used during pre-Harbor bootstrap; production overlays always
# set this). See bp-cnpg / bp-keycloak / bp-gitea values.yaml for the
# canonical pattern.

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). Per-Sovereign overlays
  # wire this at install time. Tracked under #560.
  imageRegistry: ""
catalystBlueprint:
  upstream:
    chart: "" # scratch chart — no upstream Helm chart
    version: ""
    repo: ""
    images:
      # #4152 — custom WordPress image (official base + pdo_pgsql/pgsql for
      # pg4wp → bp-cnpg Postgres). See wordpress.image below + image/Dockerfile.
      wordpress: "ghcr.io/openova-io/openova/wordpress-tenant-pg"
# ─── Organization tenant identity ────────────────────────────────────────────────
# `orgDomain` is the customer's free-subdomain (e.g. acme.<otech-fqdn>)
# OR BYO domain (e.g. acme.com); supplied by the tenant-provisioning
# pipeline. Used to derive the default ingress host.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 there is no production-safe
# default — the tenant-provisioning pipeline (#804) MUST supply this
# value at install. The placeholder `org.local` is set ONLY so the
# `helm template` smoke render in the Blueprint Release workflow
# (which runs with no overrides) produces valid YAML; per-Sovereign
# overlays MUST override.
orgDomain: "org.local"
# ─── WordPress application ──────────────────────────────────────────────
wordpress:
  enabled: true
  # Solo-tenant minimum — single replica. Per-Sovereign overlays bump
  # to 2+ once HA is needed (WordPress is stateless once Postgres + the
  # wp-content PVC carry the persistent state; with ReadWriteOnce
  # storage classes the PVC pins replicas to 1 — operators that need
  # >1 must switch to ReadWriteMany on persistence.wpContent.storageClass).
  replicas: 1
  image:
    # #4152 — CUSTOM WordPress image: the official `wordpress:6-php8.3-apache`
    # base + the PostgreSQL PHP extensions (`pdo_pgsql` / `pgsql`) that pg4wp
    # (wp-content/db.php, DB_DRIVER='pgsql') REQUIRES to talk to bp-cnpg
    # Postgres (#800). The official image ships only mysqli/pdo_sqlite, so a
    # bare-official-image WordPress 500s on every request against Postgres
    # (root-caused live on omantel.biz demo Org / kom4dc). Built from
    # platform/wordpress-tenant/image/Dockerfile and published by
    # .github/workflows/build-bp-wordpress-tenant-pg.yaml to the full ghcr
    # path below. That workflow OVERWRITES `tag` (with the build short-SHA)
    # and `digest` (with the pushed manifest digest) on every build — the
    # values committed here are the initial bootstrap pins.
    #
    # Repository is host-qualified (`ghcr.io/...`). _helpers.tpl
    # bp-wordpress-tenant.wordpressImage honours it VERBATIM and does NOT
    # prepend `global.imageRegistry` (a harbor overlay would otherwise emit a
    # double-registry, unpullable ref). On a Sovereign the containerd registry
    # mirror rewrites ghcr.io -> harbor.openova.io/proxy-ghcr transparently.
    #
    # SHA-pinned per docs/PRINCIPLES.md #4 — the digest below is the manifest
    # digest of the published image; the human-readable tag is kept alongside
    # for forensics.
    repository: ghcr.io/openova-io/openova/wordpress-tenant-pg
    tag: "28d6575"
    # Pushed manifest digest of `wordpress-tenant-pg:<tag>` — populated by the
    # build workflow's build-push-action `outputs.digest` on first build.
    # Empty until then; the helper omits `@digest` when empty so the chart
    # still renders + pulls by tag during the bootstrap window.
    digest: "sha256:b1f15f9e1786e64136f64b56ec9bc17fda247408adc9d78daa873adbd39a576d"
    pullPolicy: IfNotPresent
    # ─── Image pull secrets (#4152, Refs #3858) ──────────────────────────
    # Since #4153 the runtime image is the CUSTOM
    # `ghcr.io/openova-io/openova/wordpress-tenant-pg` build (official base +
    # the pdo_pgsql/pgsql PHP extensions pg4wp REQUIRES to serve against
    # bp-cnpg Postgres). That ghcr package is PRIVATE, so the kubelet's
    # anonymous pull fails with `failed to authorize: ... 401 Unauthorized`
    # and the Pod stalls in ImagePullBackOff (root-caused live on
    # omantel.biz demo Org / kom4dc). The old official `wordpress` image was
    # public dockerhub, so no pull secret was ever needed — hence none was
    # wired before.
    #
    # `ghcr-pull` is the canonical Secret name (mirrors bp-newapi #952): a
    # `kubernetes.io/dockerconfigjson` Secret created in flux-system at
    # cloud-init and reflected by bp-reflector into every Organization
    # namespace (the source Secret carries the
    # `reflector.v1.k8s.emberstack.com/reflection-auto-namespaces`
    # annotation). It applies to BOTH the runtime Deployment (all three
    # initContainers + the main container) AND the admin-user Job — every
    # workload that pulls `bp-wordpress-tenant.wordpressImage`.
    #
    # Per Inviolable Principle #4 the list is overrideable from per-Sovereign
    # overlays (set `[]` for clusters that mirror this image into a public
    # registry).
    pullSecrets:
      - name: ghcr-pull
  port: 80
  # #4951: the per-Org namespace carries a `plan-quota` ResourceQuota
  # (default 4 CPU limit for the WHOLE vcluster-backed namespace) AND a
  # LimitRange that DEFAULTS every un-capped container to a 500m CPU
  # limit. vcluster overhead alone (coredns 1000m + vcluster-0 500m +
  # embedded postgres 500m) plus the CNPG DB (500m) already eats ~2500m.
  # A 1-core (1000m) runtime LIMIT here left only ~250m of `limits.cpu`
  # headroom — NOT enough for the post-install oidc-config hook Job to
  # schedule its pod (its 500m-limit pod was rejected `exceeded quota:
  # plan-quota` and NEVER created → Helm post-install timed out → HR
  # Failed → the external HTTPRoute was never programmed → host 404).
  # A per-Org tenant WordPress site is light; a 500m CPU CEILING (burst)
  # with a 100m request is ample and frees durable quota headroom so the
  # transient bootstrap hooks fit alongside the running site.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # SecurityContext — the official WordPress image runs Apache as
  # `www-data` (UID 33). Keep readOnlyRootFilesystem=false because the
  # WP boot script writes `wp-config.php` and Apache touches /run.
  podSecurityContext:
    fsGroup: 33
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 33
    runAsGroup: 33
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # Liveness / readiness — WordPress's default `/wp-admin/install.php`
  # responds 200/302 once the Apache + PHP stack is up. We hit `/`
  # which redirects to `/wp-admin/install.php` on first boot and to
  # the homepage afterwards; either way Apache returns < 500.
  probes:
    liveness:
      path: /
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
# ─── Database (bp-cnpg in tenant namespace) ─────────────────────────────
# This chart provisions a dedicated `Cluster.postgresql.cnpg.io` for
# WordPress. WORDPRESS_DB_PASSWORD (deployment + the two hook Jobs) binds
# DIRECTLY to the CNPG-generated `<cluster>-app` Secret's `password` key
# via secretKeyRef — the source Secret CNPG synthesises when the Cluster
# CR is admitted.
#
# #4936: the chart NO LONGER creates an empty `wordpress-database-secret`
# reflector-mirror + post-install sync Job. That indirection populated the
# `password` key ~6 min after install (bp-reflector is a separate watch
# controller), which raced past Helm's 5 m `--wait` deadline → HelmRelease
# `InstallFailed: context deadline exceeded` → the external HTTPRoute was
# never created (customer host 404). Referencing the CNPG source Secret
# directly removes the async-populate race outright.
database:
  # CNPG Cluster name. Without `openova.topology` this IS the Cluster name.
  # With the contract it is the BASE of the per-region name
  # `<cnpgClusterName>-<sha256(region-id)[0:8]>` (see database.topology).
  cnpgClusterName: "wordpress-db"
  cluster:
    enabled: true
    # CNPG namespace defaults to .Release.Namespace (tenant ns) so the
    # Cluster lives next to WordPress. Operator may move it to a
    # shared `cnpg-tenants` namespace via overlay.
    namespace: ""
    instances: 1
    # CNPG postgres image. Defaults to the mothership Harbor proxy cache
    # (harbor.openova.io/proxy-ghcr) so fresh-prov bootstrap pulls the
    # ~300MB image through Harbor instead of throttling on anonymous ghcr
    # (#3058). PUBLIC image → proxy-ghcr serves it cred-free. Post-cutover
    # Step-04's containerd mirror redirects harbor.openova.io → local Harbor.
    # The tag is set separately via pgVersion.
    imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql
    pgVersion: "16"
    database: "wordpress"
    owner: "wordpress"
    storageSize: "10Gi"
    storageClass: "" # #3971 — empty ⇒ cluster-default durable cloud CSI; local-path FORBIDDEN
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
        # #4936: `database.secretName` is REMOVED. WordPress + the hook Jobs now
        # read WORDPRESS_DB_PASSWORD straight from the CNPG-generated
        # `<cluster>-app` Secret (name derived from `cnpgClusterName`, resolved by
        # _helpers.tpl `cnpgAppSecret`). There is no separate reflector-mirrored
        # wrapper Secret to name.
  # ─── Multi-region DB knobs (ADR-0015 D2) ─────────────────────────────
  # Read ONLY when `openova.topology.mode` is active-passive or
  # active-hot-standby. Placement itself (mode/self/primary/peers) is NOT
  # here — it is the shared contract `openova.topology` below.
  topology:
    # Migration seam — region-id → explicit CNPG Cluster name. Lets an
    # existing Cluster keep its name (and data) when its release adopts the
    # contract, instead of the derived `<cnpgClusterName>-<hash>`. Example:
    #   clusterNames: {hw-me-east-215-a-rtz-prod: wordpress-db}
    clusterNames: {}
    # Planned primary move — the CNPG demotion token the FORMER primary
    # published (`status.demotionToken`). Committed by the orchestrator into
    # the NEW primary region's values together with `openova.topology.primary`
    # (step 2 of the move; templates/cnpg-cluster.yaml). Rendered only on the
    # member the contract names primary; CNPG ignores a token it already used
    # (`status.lastPromotionToken`), so leaving it set is harmless.
    promotionToken: ""
    # #5623 — WHO PROMOTES A STANDBY WHEN THE PRIMARY REGION DIES? REQUIRED
    # for a multi-region contract; empty FAILS the render. `continuum`
    # (ADR-0015 D8): the Continuum rendered into every region file commits
    # the move phase by phase (demote old → promote new with the CNPG token →
    # peers); an unplanned region loss is promoted only when the Continuum's
    # spec.transition.autoPromoteOnRegionLoss is true. `manual`: the
    # sovereign-admin commits `openova.topology.primary: <surviving region>`.
    # `dr-promoter` fails closed (this chart ships no promoter). The chart
    # renders no actor of its own under either value.
    # Stamped on every non-primary Cluster as
    # catalyst.openova.io/dr-promotion-mechanism.
    promotion:
      mechanism: ""
    # Cilium ClusterMesh transport for cross-region WAL. `enabled: false` is
    # for forensic isolation only (the members cannot reach each other).
    clusterMesh:
      enabled: true
      affinity: local
    # ADR-0004 — `sync` (DEFAULT, Pillar 3 zero-tx-loss): the primary member
    # renders synchronous_commit=remote_apply + synchronous{method first,
    # dataDurability required, standbyNamesPre = the DECLARED peers'
    # Clusters}. If no peer is reachable the primary BLOCKS writes — the
    # by-design durability contract. `async` is lab/forensic only.
    replication:
      mode: sync
      sync:
        commit: remote_apply
        numSync: 1
    # Secrets that must be IDENTICAL in every region (see _helpers.tpl):
    #   replicationCA  (ca.crt, ca.key)  — shared streaming client CA
    #   appCredentials (basic-auth)       — the DB owner's password
    # Empty names ⇒ `<cnpgClusterName>-replication-ca` /
    # `<cnpgClusterName>-app-credentials`. Every region pulls both from
    # externalSecret.storeRef at `<remoteKeyPrefix>/replication-ca` and
    # `<remoteKeyPrefix>/db-owner` (default prefix
    # `openova/apps/<namespace>/<cnpgClusterName>` — the pair identity, the
    # same in every region). The PRIMARY region also renders the seed
    # (templates/shared-secrets-seed.yaml): an ESO Password generator + a
    # cert-manager self-signed CA, pushed write-once (IfNotExists) into every
    # store in seed.secretStoreRefs. storeRef.name "" ⇒ no ExternalSecret and
    # no seed: the two Secrets must then pre-exist (the CNPG Cluster waits).
    sharedSecrets:
      replicationCA: ""
      appCredentials: ""
      externalSecret:
        storeRef:
          kind: ClusterSecretStore
          # The platform's OpenBao store (bp-external-secrets-stores), present
          # on every Sovereign.
          name: vault-region1
        remoteKeyPrefix: ""
        refreshInterval: 1h
      seed:
        enabled: true
        # Stores the primary pushes the material into. Empty (default) ⇒
        # [storeRef] + one `<peerStoreNamePrefix><peer>` per
        # openova.topology.peers entry: every region runs its own OpenBao and
        # bp-external-secrets-stores renders `vault-<peer-region-id>` writing
        # into each peer's OpenBao (README §Shared secrets). Non-empty ⇒ used
        # verbatim.
        secretStoreRefs: []
        # Must equal bp-external-secrets-stores peerStores.namePrefix
        # (tests/shared-secrets-render.sh S8 renders both and compares).
        peerStoreNamePrefix: vault-
        refreshInterval: 1h
# ─── openova.topology — THE placement contract (ADR-0015 D2) ─────────────
# Written per region into Git by the orchestrator (one HelmRelease of this
# chart PER REGION); never hand-edited per chart. Shared by every
# multi-region chart through platform/topology-lib.
#
#   openova:
#     topology:
#       mode: active-passive          # singleton | active-passive | active-hot-standby
#       self: hw-me-east-215-a-rtz-prod
#       primary: hw-me-east-215-a-rtz-prod
#       peers: [hw-me-east-215-b-rtz-prod]
#
# Empty (default) ⇒ the single-region render (one Cluster named
# `database.cnpgClusterName`, WordPress serving, no replication).
# active-active is refused: WordPress is a single-writer application.
# REMOVED in 0.5.0: `database.mode`, `pg.activeHotStandby.*` — setting either
# fails the render with the migration instruction (README §Migration).
openova:
  topology: {}
# ─── SSO via Organization-vcluster Keycloak (openid-connect-generic plugin) ──────
# The plugin is installed + activated + configured by the post-install
# `oidc-config` Job (templates/oidc-config-job.yaml) using `wp-cli` so
# the Organization admin never sees the WordPress setup wizard.
#
# Canonical block — `oidc.*`. The legacy `keycloak.*` block below is
# kept as a backward-compat alias for clusters that haven't been
# re-rendered through the orchestrator yet (#804 emits both via
# sme_tenant_gitops.go to keep the upgrade path zero-downtime).
oidc:
  # Master toggle. When `false` the post-install Job is rendered but
  # short-circuits at the top — useful for `helm template` smoke
  # renders that don't have a real Keycloak. Defaults true so that
  # production installs are SSO-on by default; per-Sovereign overlays
  # (e.g. an air-gapped install) may flip false.
  enabled: true
  # Discovery URL of the Organization-vcluster Keycloak realm. Example:
  #   https://keycloak.<org-domain>/realms/org-<subdomain>
  #
  # G117.5 W3.D3 (Refs #2744): when this is left empty AND
  # `sovereign.fqdn` + `org.realm` (or `orgSubdomain` legacy) are
  # populated, `_helpers.tpl bp-wordpress-tenant.oidcIssuerURL`
  # auto-derives `https://auth.<sovereign.fqdn>/realms/<realm>`. The
  # placeholder default below remains so existing chart 0.3.x overlays
  # render unchanged.
  issuerURL: "https://keycloak.org.local/realms/org"
  # OIDC client ID registered in the per-tenant Keycloak realm — see
  # platform/keycloak/chart/templates/configmap-tenant-realm.yaml
  # (PR #918) where the realm import ConfigMap registers the client.
  clientId: "wordpress"
  # K8s Secret carrying the OIDC client secret. Required key:
  # `client-secret`. PR #918 emits this Secret as part of the
  # bp-keycloak tenant-realm ConfigMap render so the realm JSON's
  # `secret` field and these K8s Secret bytes never drift.
  clientSecretName: "wordpress-oidc-client-secret"
  # Default WordPress role assigned to a brand-new SSO user when the
  # `create_if_does_not_exist` setting fires. Operators may tighten
  # to `subscriber` or open up to `editor` via overlay. The plugin
  # honours an empty string as "no role" (login allowed but no
  # capabilities); we default to `subscriber` so SSO logins land with
  # at least minimal access.
  defaultRole: "subscriber"
  # Identity claim used to match the Keycloak `id_token` payload back
  # to a WP user. `preferred_username` is the canonical KC claim;
  # `email` is also valid when KC's email-as-username is enforced.
  identityKey: "preferred_username"
  # Keycloak group → WP role mapping. Default mirrors the Organization unified-
  # RBAC tier names. Operator may extend per their RBAC posture. The
  # plugin's `acl` setting consumes this when `acl_enabled=1`; default
  # ACL is OFF (every authenticated SSO user lands with `defaultRole`).
  roleMapping:
    administrator: "administrator"
    editor: "editor"
    author: "author"
    contributor: "contributor"
    subscriber: "subscriber"
  # ── openid-connect-generic plugin source (Refs #4322) ────────────────
  # The post-install `oidc-config` Job (templates/oidc-config-job.yaml)
  # must NOT shell out to `wp plugin install openid-connect-generic`,
  # which fetches the plugin zip from wordpress.org over egress and
  # hangs the hook (→ HelmRelease Ready=False) on an air-gapped or
  # slow-egress Sovereign. Instead the Job VENDORS the plugin from a
  # pinned GitHub release archive into its ephemeral wp-content, exactly
  # the way the pg4wp db.php drop-in is already seeded — a deterministic,
  # version-pinned source per docs/INVIOLABLE-PRINCIPLES.md #4.
  #
  # `repo`     — `<owner>/<name>` on GitHub. The official upstream is
  #              oidc-wp/openid-connect-generic (the same code wordpress.org
  #              redistributes).
  # `version`  — release tag. GitHub archives extract to
  #              `<name>-<version>` (tags here are UN-prefixed, unlike
  #              pg4wp's `v3.3.1`), so the Job copies from
  #              `openid-connect-generic-<version>/`.
  #
  # If the GitHub vendor fetch fails (fully air-gapped, no egress), the
  # Job LOGS and CONTINUES rather than failing the release — the OIDC
  # settings it writes live in Postgres, and the runtime Deployment's
  # wp-plugin-install initContainer seeds the actual plugin files onto
  # the persistent wp-content PVC, so the release still reaches Ready.
  plugin:
    repo: "oidc-wp/openid-connect-generic"
    version: "3.11.3"
  # `wp-cli` image (canonical wp-cli release). Used by the post-
  # install Job to run `wp plugin install --activate` + `wp option
  # update`. Pinned to a SemVer tag + manifest-list digest per
  # docs/INVIOLABLE-PRINCIPLES.md #4. The image bundles wp-cli on
  # top of the same WordPress core layout as the runtime image so
  # pg4wp's db.php drop-in (mounted via the wp-content PVC) loads
  # transparently — wp-cli boots core, core picks up the drop-in.
  cliImage:
    repository: "wordpress"
    tag: "cli-2.12.0-php8.3"
    # Manifest-list digest for `wordpress:cli-2.12.0-php8.3` (verified
    # against registry-1.docker.io 2026-05-05).
    digest: "sha256:cbdb19366ee143c5fb353181a0f0e2d4fea1562dd28b1c63cf4ec0d086f2fc2d"
    pullPolicy: IfNotPresent
# Legacy alias — preserves zero-downtime upgrade for clusters whose
# orchestrator overlays still emit `keycloak.{realmURL,clientID,
# clientSecretName}`. Fields below are deprecated and will be removed
# in chart 0.3.0; new overlays MUST emit `oidc.*`. The post-install
# Job in templates/oidc-config-job.yaml folds `keycloak.*` into
# `oidc.*` when the modern keys are at their values.yaml default.
keycloak:
  realmURL: ""
  clientID: ""
  clientSecretName: ""
  roleMapping: {}
# ─── G117.5 W3.D3 — per-Org realm + sovereign FQDN ──────────────────────
# Refs #2744. When `oidc.issuerURL` is left at the placeholder default,
# `_helpers.tpl bp-wordpress-tenant.oidcIssuerURL` derives the issuer
# URL as `https://auth.<sovereign.fqdn>/realms/<org.realm>` (or falls
# back to `sme-<orgSubdomain>` when `org.realm` is empty for back-compat
# with chart 0.3.x Organization-fleet overlays). G117 locked-decision #6:
# per-Catalyst-Org Keycloak realm. The orchestrator emit at
# `core/services/catalyst-api/internal/handler/sme_tenant_gitops.go`
# `smeTenantBPWordPress` will be updated to populate these in a follow-
# up; for now they default empty and the legacy issuerURL drives.
sovereign:
  fqdn: ""
org:
  slug: ""
  realm: ""
orgSubdomain: ""
# ─── G117.5 W3.D3 — kc_idp_hint defense-in-depth ────────────────────────
# When the per-Org realm has its IDR `defaultProvider=sovereign-broker`
# bound (W2.C4 #2794), this hint is REDUNDANT — KC auto-303s to the
# broker on every realm auth-request. Keeping the hint in
# `endpoint_login` is defense-in-depth (G117.5 audit pattern from
# `feedback_g113_sso_idr_defaultprovider_fix.md`) — every HAR capture
# carries the hint, so any "fell back to forms" failure mode tells
# you the realm-config didn't reach KC. Empty disables the hint append.
ssoIdpHint: "sovereign-broker"
# ─── First-install admin user (created via SSO mapping) ─────────────────
# The admin-user-job pre-seeds a wp_users row with `user_login = email`
# and the SSO email mapping so the Organization admin's first Keycloak login
# logs them in as the WP administrator without seeing the install wizard.
adminUser:
  # Operator-supplied, e.g. `admin@acme.com`. Same email as the Organization
  # admin's Keycloak account — that's how openid-connect-generic
  # matches the Keycloak `email` claim back to a wp_user. Empty
  # default means the admin-user Job is skipped (no admin pre-seed)
  # — the Organization's tenant-provisioning pipeline MUST set this value.
  email: ""
  # Display name shown in the WP admin bar. Defaults to the local-part
  # of the email (job-side) if left empty.
  displayName: ""
# ─── Default theme ──────────────────────────────────────────────────────
# The theme slug installed + activated by oidc-config-job. Operator-
# overridable. Default ships the latest WordPress yearly theme.
defaultTheme: "twentytwentyfive"
# ─── Media store (ADR-0015 D6, Refs #7067) ──────────────────────────────
# WHERE UPLOADED MEDIA LIVE.
#
#   s3  (default) — media go to the Sovereign's SeaweedFS S3 bucket
#       `media.s3.bucket` (default `replicated`) under the key prefix
#       `<org>/<app>/` (`media.s3.keyPrefix`, empty = `<namespace>/<fullname>`),
#       through the humanmade/S3-Uploads plugin baked into the runtime image
#       and loaded by the `openova-media-store` mu-plugin (no wp-admin step).
#       bp-seaweedfs >= 1.3.0 syncs every `replicated[-*]` bucket between the
#       regions (native `weed filer.sync`), so after a primary move the new
#       primary serves the same media. Media URLs keep their
#       `https://<host>/wp-content/uploads/...` shape (read path in the
#       mu-plugin), so existing post content keeps working.
#       wp-content itself becomes an emptyDir rebuilt from the image on every
#       Pod start, and DISALLOW_FILE_MODS makes themes/plugins immutable from
#       wp-admin — the code is the image, not region-local state. NO PVC.
#   pvc — LEGACY single-region shape: everything (media included) on the
#       region-local `wp-content` PVC below. REFUSED for any multi-region
#       openova.topology (the render fails; the catalyst-api / application-
#       controller D6 gate refuses the placement first).
#
# Credentials: never in values. `media.s3.credentials` names the SeaweedFS
# S3 Secret the chart REFLECTS into the release namespace (bp-reflector, the
# same bridge bp-gitea's objectStorage uses); bp-seaweedfs >= 1.3.1 marks the
# source reflection-allowed. Mounted as files (read per request), not env.
media:
  store: s3
  s3:
    # bp-seaweedfs S3 gateway (HTTP inside the cluster, see
    # platform/seaweedfs/chart/values.yaml seaweedfs.s3). Each region's
    # release talks to ITS OWN region's SeaweedFS; filer.sync replicates.
    endpoint: "http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
    # Namespace of the SeaweedFS S3 gateway — the NetworkPolicy egress peer.
    namespace: seaweedfs
    port: 8333
    # MUST be `replicated` or `replicated-<suffix>` — the names bp-seaweedfs
    # syncs cross-region (crossRegion.filerSync.buckets). The render fails on
    # any other name: a non-replicated bucket is a region-local volume again.
    bucket: replicated
    # Empty → `<Release.Namespace>/<fullname>` (= <org>/<app>).
    keyPrefix: ""
    # SigV4 signing region; SeaweedFS accepts any.
    region: us-east-1
    credentials:
      # Source Secret `<namespace>/<name>` reflected into this namespace.
      sourceNamespace: seaweedfs
      sourceName: seaweedfs-s3-secret
      accessKeyIdKey: admin_access_key_id
      secretAccessKeyKey: admin_secret_access_key
      # Empty → `<fullname>-media-s3`.
      secretName: ""
  # One-shot copy of media from the LEGACY wp-content PVC into the bucket
  # (`templates/media-migrate-job.yaml`, idempotent: objects already present
  # are skipped). auto = run when the legacy PVC `<fullname>-wp-content`
  # exists in the namespace (Helm lookup); always / never = force.
  migrateLegacyPvc: auto

# ─── Persistence ────────────────────────────────────────────────────────
# LEGACY (media.store=pvc only): /var/www/html/wp-content on a region-local
# PVC carrying themes, plugins and uploads. Not rendered under media.store=s3.
persistence:
  wpContent:
    enabled: true
    size: "10Gi"
    storageClass: "" # #3971 — empty ⇒ cluster-default durable cloud CSI; local-path FORBIDDEN
    accessModes:
      - ReadWriteOnce
# ─── Service ────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 80
# ─── ServiceAccount ─────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
# ─── Cilium Gateway API HTTPRoute (#3785 — canonical Sovereign exposure) ──
# A Catalyst Sovereign serves every customer host through the Cilium
# Gateway API (HTTPRoute → cilium-gateway-console), NOT traefik. This
# block drives templates/httproute.yaml — the route that actually makes
# `wordpress.<slug>.<pool>` reachable. Without a non-empty `gateway.host`
# the template renders nothing (fails closed, Inviolable Principle #4) —
# that was the #3785 root cause (only a dead traefik Ingress existed →
# envoy 404 despite a healthy Pod serving HTTP 302 internally). Mirrors
# platform/keycloak/chart (gateway:) + products/agenity/chart (httpRoute:).
gateway:
  enabled: true
  # host: wordpress.<slug>.<pool> — REQUIRED, no default per Inviolable
  # Principle #4. The org-tenant overlay (organization_gitops.go) wires
  # this to .WordPressHost. Empty ⇒ no HTTPRoute (no exposure).
  host: ""
  path: "/"
  # backendService / backendPort default to the chart's own Service
  # (bp-wordpress-tenant.fullname / service.port = 80). Operators with a
  # non-default release name may override.
  backendService: ""
  backendPort: 0
  # The per-Org pool host resolves to the console-ELB EIP which fronts the
  # DEDICATED cilium-gateway-console (#4054/#4070) — NOT the apps
  # cilium-gateway. The console Gateway carries the `*.<pool>` wildcard
  # TLS listener, so TLS terminates on the wildcard cert and no per-host
  # Certificate is needed. Parenting the apps gateway → 404 on the console
  # ELB (same trap bp-keycloak / bp-stalwart-tenant hit; see
  # org_console_tls.go consoleGatewayNamespace).
  parentRef:
    name: "cilium-gateway-console"
    namespace: "kube-system"
    # sectionName omitted — the console Gateway exposes one apex-bound
    # HTTPS listener per pool zone, matched by hostname filter. The `with`
    # guard in templates/httproute.yaml drops the field when blank.
    sectionName: ""
# ─── Legacy traefik Ingress + cert-manager TLS (#3785 — DEFAULT OFF) ──────
# DISABLED by default on Sovereigns. A Catalyst Sovereign runs Cilium
# Gateway API (see `gateway:` above), not traefik — the traefik Ingress
# never matched any backend, and the per-host `wordpress-tls` cert it
# requested sat False forever ("Issuing certificate as Secret does not
# exist") because no HTTP-01 / traefik solver runs there (#3785, live on
# the omantel.biz demo Org). Kept (default false) only for a non-Cilium
# dev cluster that genuinely runs a traefik IngressController + an
# HTTP-01-capable issuer; such overlays flip ingress.enabled=true AND
# gateway.enabled=false.
ingress:
  enabled: false
  className: "traefik"
  # Empty string → templates derive `wordpress.{{ .Values.orgDomain }}`.
  # Operator may set explicitly when BYO requires a non-derived host.
  host: ""
  tls:
    enabled: false
    issuer: "letsencrypt-prod" # cert-manager ClusterIssuer
    secretName: "wordpress-tls"
  annotations: {}
# ─── NetworkPolicy ──────────────────────────────────────────────────────
# Restrict egress to: cnpg cluster (Postgres :5432), Keycloak realm
# (HTTPS :443 — discovery + token endpoints), DNS (kube-dns :53),
# and ingress traffic (gateway namespace). External egress is allowed
# on :443 so WordPress can fetch the `openid-connect-generic` plugin
# zip + theme from wordpress.org during initContainer boot; the
# cluster's egress-gateway enforces destination policy globally.
networkPolicy:
  enabled: true
  ingress:
    # #3785: Cilium Gateway API traffic reaches the WordPress Pod with the
    # reserved `ingress` ENTITY identity (the Envoy proxy in the cilium
    # agent), which NO standard K8s NetworkPolicy selector can express — so
    # the gateway→backend hop times out (envoy 503 "upstream connect
    # error") even with a kube-system namespaceSelector. This toggle ships
    # an additive CiliumNetworkPolicy (templates/cilium-ingress-network
    # policy.yaml) with `fromEntities: [ingress]` — the canonical fix
    # (mirrors platform/newapi #3374). Gated on the cilium.io/v2 CRD being
    # present, so it no-ops on kind CI. Set false on a non-Cilium cluster.
    allowGatewayEntity: true
    # The Cilium Gateway envoy lives here (default kube-system) — admitted
    # by networkpolicy.yaml's standard K8s rule too (belt-and-suspenders;
    # the CNP above is the load-bearing one for the `ingress` entity).
    gatewayNamespace: "kube-system"
    # Legacy traefik path (dev clusters). Kept as a second admitted peer.
    fromNamespaceLabels:
      kubernetes.io/metadata.name: traefik
  egress:
    # bp-cnpg — defaults; namespace label may be overridden if the
    # tenant cluster lives in a non-default cnpg namespace.
    cnpgNamespaceLabel: "" # empty → match Release.Namespace
    cnpgPort: 5432
    # bp-keycloak — same as cnpg, defaults to .Release.Namespace
    # because the tenant Keycloak runs in the Organization vcluster's keycloak
    # namespace; operator overrides if it lives elsewhere.
    keycloakNamespaceLabel: "keycloak"
    keycloakPort: 8443
  # ─── CNPG-operator status-probe carve-out (#6311, Refs #3988 #4282) ────
  # This chart lands its CNPG Cluster in the Organization's OWN namespace,
  # which carries the `default-deny-all` + `allow-same-org` pair stamped by
  # the Organization controller's GitOps tree. `allow-same-org` re-opens
  # SAME-NAMESPACE traffic only, so the cnpg-system OPERATOR (a different
  # namespace) cannot reach the instance Pod's :8000/pg/status probe — the
  # Cluster then parks at "Instance Status Extraction Error: HTTP
  # communication issue" / Ready=False while Postgres is 1/1 Running and
  # serving SQL (measured on hw296 walktwo/wordpress-db with quota
  # eliminated as a variable; the control walkone/postgres, which carries
  # the #4282 carve-out, read "Cluster in healthy state" 3/3).
  #
  # templates/networkpolicy-cnpg-operator-probe.yaml opens ONLY those two
  # operator ports from ONLY the operator namespace — additive; it does not
  # weaken default-deny-all or allow-same-org. No broad consumer 5432 rule
  # (the bp-postgres #4442 `sharedConsumers` shape) is needed here: this
  # Cluster's only consumers are the WordPress Deployment + hook Jobs in the
  # SAME namespace, already admitted by allow-same-org.
  #
  # Set false only on a cluster whose per-Org namespaces carry NO
  # default-deny baseline (then the carve-out is inert anyway).
  cnpgOperator:
    enabled: true
    operatorNamespace: cnpg-system
    operatorStatusPort: 8000
    operatorMetricsPort: 9187
    # Cluster-DNS namespace for the policy's egress half (#5617 / #4437 class,
    # enforced by scripts/check-netpol-egress-completeness.py). Naming an
    # egress section makes the selected endpoint deny-by-default on egress
    # outside the union, and a per-Org namespace's CiliumNetworkPolicy already
    # constrains egress WITHOUT naming DNS — so a workload that ships no DNS
    # egress of its own cannot resolve anything. Additive: this can only widen
    # what allow-same-org and the per-Org CNP already permit.
    dnsNamespace: kube-system
# ─── ServiceMonitor ─────────────────────────────────────────────────────
# Default false per docs/BLUEPRINT-AUTHORING.md §11.2 (Observability
# toggles must default false). Operator opts in via per-cluster overlay
# once kube-prometheus-stack reconciles. WordPress itself doesn't expose
# /metrics — operator must layer a wp-prometheus exporter plugin or
# nginx/php-fpm sidecar before enabling this.
serviceMonitor:
  enabled: false
  interval: "30s"
  scrapeTimeout: "10s"
  path: "/metrics"
  labels: {}
