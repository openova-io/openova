#     can OVERRIDE the bytes at runtime without the chart clobbering
#     them on `helm upgrade`. Pattern source:
#     `feedback_chart_credential_persistence_defense.md` (G112 #2723 +
#     G111 #2724 exemplars).
#   - New `templates/sso-app-registration.yaml` — ConfigMap labelled
#     `sso.openova.io/app-registration` so bp-sso-bridge registers the
#     `wordpress` client in the per-Org realm (W2.C4 PR #2794
