#   - `templates/oidc-config-job.yaml` — endpoint_login now carries
#     `?kc_idp_hint=<ssoIdpHint>` defense-in-depth append. Default
#     `ssoIdpHint=sovereign-broker` matches the per-Org realm topology;
#     empty disables. Pattern source:
#     `feedback_g113_sso_idr_defaultprovider_fix.md`.
#   - Back-compat: `oidc.issuerURL`+`oidc.clientId`+`keycloak.*` legacy
#     paths preserved bit-for-bit; chart-0.3.x overlays continue to
#     render unchanged when `sovereign.fqdn` + `org.realm` left empty.
# 0.3.2 (Pillar 3 zero-tx-loss, 2026-05-20, Refs #2064):
#   - When `database.mode=active-hot-standby`, the rendered primary
#     CNPG Cluster CR now carries `synchronous_commit: "remote_apply"`
#     + `synchronous_standby_names: "FIRST 1 (<replica>)"` in its
#     postgresql.parameters block by DEFAULT. Mirrors bp-cnpg-pair
#     chart 0.1.2. The previous asynchronous-streaming default could
#     NOT honour the canonical Pillar 3 claim of "zero transactions
#     lost" on region-kill failover — chart 0.3.2 closes that gap.
#   - New `pg.activeHotStandby.replication.{mode,sync.commit,
#     sync.numSync}` block in values.yaml. Mode `async` exists for
#     forensic / lab use only; production deployments MUST use `sync`.
#   - Operator-facing trade-off (documented in values.yaml + DESIGN
#     of bp-cnpg-pair §7): primary BLOCKS new writes when replica is
#     unreachable; every COMMIT pays the inter-region RTT.
# 0.4.2 (#3971): CNPG storageClass empty ⇒ cluster-default durable cloud CSI; local-path FORBIDDEN.
# 0.4.3 (#4139): blueprint.yaml configSchema wpContent.storageClass.default local-path → ""
#   (was missed by #3971 — the schema default would re-introduce the FORBIDDEN
#   local-path class on a fresh install, denied by forbid-local-path-storage).
# 0.4.4 (#4139): active-hot-standby CNPG cluster declares synchronous replication via
#   the CNPG-native spec.postgresql.synchronous block instead of the raw
#   synchronous_standby_names parameter (CNPG FIXED param — the vcluster.cnpg.io
#   admission webhook rejected it: "Can't set fixed configuration parameter").
#   Mirrors bp-cnpg-pair primary-cluster.yaml (#3740). Also folds the #3985 rename
#   residue in oidcIssuerURL/ingressHost helpers (the gate that blocked 0.4.2/0.4.3
#   publish until repaired this session).
# 0.4.5 (#4152, Refs #3858 #4139): the WordPress runtime image is now the custom
#   ghcr.io/openova-io/openova/wordpress-tenant-pg build (official wordpress:6-php8.3-
#   apache + the pdo_pgsql/pgsql PHP extensions pg4wp REQUIRES to serve against
#   bp-cnpg Postgres — #800). The official image ships only mysqli/pdo_sqlite, so a
#   bare-official WordPress 500s on every request against Postgres (FINAL blocker,
#   root-caused live on omantel.biz demo Org / kom4dc). Built from image/Dockerfile,
#   published by .github/workflows/build-bp-wordpress-tenant-pg.yaml.
#   - values.yaml wordpress.image.repository → the full ghcr path; tag/digest
#     overwritten by the build workflow per build.
#   - _helpers.tpl wordpressImage + wpCliImage now SKIP the global.imageRegistry
#     prefix for a host-qualified repository (first "/"-segment has a "." or ":")
#     so a harbor overlay can't double-prefix the ghcr ref (mirrors the canonical
#     bp-sso-bridge.image #2940 skip); also tolerate an empty digest (omit @digest).
# 0.4.11 (#4152, Refs #3858): add `wordpress.image.pullSecrets` (default
#   `[{name: ghcr-pull}]`) and wire it into the Pod spec of the runtime
#   Deployment AND the admin-user Job. Since #4153 the runtime image is the
#   PRIVATE `ghcr.io/openova-io/openova/wordpress-tenant-pg` package, so the
#   kubelet's anonymous pull 401s ("failed to authorize: ... 401 Unauthorized")
#   and the Pod stalls in ImagePullBackOff (confirmed live on omantel.biz demo
#   Org / kom4dc). The old official `wordpress` image was public dockerhub, so
#   no pull secret was ever needed — hence the chart shipped none. `ghcr-pull`
#   is the canonical reflected Secret name (mirrors bp-newapi #952). The
#   oidc-config Job (public `wordpress:cli-*` image) and the database-secret-
#   sync Job (public proxy-dockerhub curl) intentionally keep NO pull secret.
#   Per Inviolable Principle #4 the list is overrideable (set `[]` on clusters
#   that mirror the image into a public registry).
# 0.4.12 (#4152, Refs #3858): FIX the demo-Org WordPress HTTP-500 restart-loop —
#   the FINAL convergence gap. Root cause was NOT pg4wp/WP-6.x/PHP-8.3
#   incompatibility (pg4wp + pdo_pgsql + pgsql are all present and working).
#   templates/database-secret.yaml seeded `data: { password: "" }`; reflector's
#   `reflects` mode copies only source keys ABSENT in the destination, so it
#   filled host/pgpass/uri/... but PRESERVED the empty Helm-seeded `password`
#   forever (reflector logs: `Updated 0`). WORDPRESS_DB_PASSWORD bound to "" →
#   pg4wp PDO `SQLSTATE[08006] fe_sendauth: no password supplied` → WP DB-boot
#   fatal → Apache 500 (empty body) → liveness fail → CrashLoop. The post-install
#   sync Job (safety net) never ran because the last HR upgrade FAILED (CNPG
#   webhook x509), so its post-upgrade hook never fired.
#   FIX: drop the `data.password: ""` seed entirely so reflector OWNS and
#   populates `password` from the CNPG `<cluster>-app` source; mark the
#   deployment's WORDPRESS_DB_PASSWORD secretKeyRef `optional: true` so the Pod
#   schedules during the brief pre-reflection window instead of
#   CreateContainerConfigError. Verified live (kom4dc demo Org): populating the
#   key → `PDO_OK`, `curl / → HTTP 302 Location: /wp-admin/install.php`, pod 1/1
#   Running 0 restarts; removing the key → reflector repopulated it (64 bytes)
#   in <5s. Sync Job retained as belt-and-suspenders.
# 0.4.13 (#3785): EXPOSE the purchased WordPress at its FQDN via the Cilium
#   Gateway API — the customer-facing end-user outcome ("WordPress reachable
#   signed-in at wordpress.<slug>.<pool>"). Root cause: the chart shipped ONLY
#   a networking.k8s.io/v1 traefik Ingress (templates/ingress.yaml), but a
#   Catalyst Sovereign runs Cilium Gateway API, not traefik — so NO HTTPRoute
#   ever matched the host and envoy returned a bare 404 even though the Pod was
#   Running 1/1 and served HTTP 302 internally (root-caused live on the
#   omantel.biz demo Org). Every WORKING per-Org product (bp-agenity,
#   bp-keycloak, bp-stalwart-tenant webmail) reaches its host through an
#   HTTPRoute on cilium-gateway-console; WordPress was the odd one out.
#   FIX:
#   - NEW templates/httproute.yaml — Cilium Gateway HTTPRoute gated on
#     gateway.enabled + gateway.host, parented (default) on the DEDICATED
#     cilium-gateway-console / kube-system (the per-Org pool host resolves to
#     the console-ELB EIP, #4054/#4070). Mirrors platform/keycloak/chart/
#     templates/httproute.yaml. The console Gateway's `*.<pool>` wildcard TLS
#     listener terminates TLS, so NO per-host Certificate is required.
#   - NEW gateway.* values block (enabled/host/path/backendService/backendPort/
#     parentRef) — host REQUIRED, no default (Inviolable Principle #4); empty ⇒
#     no route (fails closed).
#   - ingress.enabled + ingress.tls.enabled now DEFAULT FALSE. The traefik
#     Ingress never matched on a Sovereign and the per-host `wordpress-tls`
#     Certificate it requested sat False forever ("Issuing certificate as
#     Secret does not exist") because no HTTP-01 / traefik solver runs there.
#     Kept (off) only for non-Cilium dev clusters.
#   - networkpolicy.yaml ingress now admits the Gateway namespace (default
#     kube-system, networkPolicy.ingress.gatewayNamespace) in addition to the
#     legacy traefik namespace, so the NetworkPolicy is not the NEXT blocker
#     once the route lands.
#   Wired by products/catalyst/bootstrap/api/internal/handler/
#   organization_gitops.go (orgTenantBPWordPress): the WordPress HelmRelease
#   now emits gateway.{enabled,host,parentRef} instead of the dead ingress
#   block. Verified live: GET https://wordpress.<slug>.<pool>/ → 200 serving
#   the WordPress site (was 404).
# 0.4.16 (#4220, Refs #4155): FIX the demo-Org WordPress post-upgrade hook
#   DEADLOCK that left the HelmRelease Ready=False after the DB recovered.
#   Root cause: templates/oidc-config-job.yaml mounted the SAME ReadWriteOnce
#   `wp-content` PVC the runtime WordPress Deployment holds for its whole
#   lifetime. A Sovereign's only StorageClass is RWO (evs-ssd / Huawei EVS —
#   no RWX class exists), so the concurrent Job blocked forever on the kubelet
#   "Multi-Attach error for volume ... Volume is already used by pod(s)
#   bp-wordpress-tenant-..." → the post-install/post-upgrade hook never started
#   → Helm timed out → HR Ready=False (and on a COLD install the failed hook
#   rolls the release back, dropping the HTTPRoute → customer host 404).
#   Confirmed live on the omantel.biz demo Org (kom4dc): the oidc-config Job pod
#   sat ContainerCreating with FailedAttachVolume while the WordPress pod served
#   200 with the PVC attached.
#   FIX: the oidc-config Job now mounts its OWN emptyDir for wp-content (never
#   the shared PVC) and self-seeds the pg4wp `wp-content/db.php` Postgres-adapter
#   drop-in (same GitHub source + version 3.3.1 as the deployment's
#   wp-plugin-install initContainer) so wp-cli reaches the bp-cnpg Postgres
#   backend. The OIDC plugin settings + admin user persist in POSTGRES, not on
#   the PVC, so an ephemeral wp-content is correct + deadlock-free. The recovered
#   demo-Org HR converges Ready without the Multi-Attach stall.
# 0.4.17 (Refs #4220 #4155): FIX the oidc-config hook Job 404 that left a FRESH
#   Org's HelmRelease Ready=False. The 0.4.16 emptyDir self-seed (above) fetched
#   the pg4wp adapter from the GitHub tag archive but used the path
#   `.../tags/3.3.1.zip` — the release tag is `v3.3.1`, so the un-prefixed path
#   returns HTTP 404 ("curl: (22) The requested URL returned error: 404"). The
#   hook is hook-weight 10 (the first thing after db-secret-sync), so on a fresh
#   Org it failed on its VERY FIRST run → db.php never seeded → wp-cli could not
#   reach the bp-cnpg Postgres backend → the post-install/post-upgrade hook
#   errored → Helm timed out → HR Ready=False. The deployment's wp-plugin-install
#   initContainer already used the CORRECT `.../tags/v3.3.1.zip` (so the runtime
#   data-plane Pod served fine) — only the Job's URL was wrong, hence the split
#   where the WordPress Pod was 1/1 Running 302 but the HR stayed False.
#   FIX: align the Job's pg4wp fetch URL to `v3.3.1.zip` (identical to the
#   deployment). The extracted top-level dir is still `postgresql-for-wordpress-
#   3.3.1` (GitHub strips the `v`), so the cp paths are unchanged. Root-caused
#   live on the tkt0625 fresh Org (omantel.biz region-a, 2026-06-25): the live
#   oidc-config pod logged exactly `[oidc-config] seeding pg4wp db.php drop-in
#   (Postgres adapter)` then `curl: (22) ... error: 404`; `v3.3.1.zip` returns 200.
# 0.4.19 (Refs #4212): placementSchema aligned with spec.topology (Seam 4) —
#   modes[] now admit single-region/singleton/active-passive +
#   defaultOnMultiRegion=active-passive so a multi-region Sovereign's per-Org
#   WordPress resolves to primary+standby and the per-app Continuum producer
#   mints the per-Org Continuum CR (was singleton → no standby → no CR).
# 0.4.18 (Refs #4322): FIX the oidc-config hook Job TIMEOUT that left a FRESH
#   Org's HelmRelease Ready=False even though the WordPress Pod was 1/1 Running
#   serving HTTP 302 (the #4323 pg4wp fix above is validated at Pod level). After
#   step 0 seeds db.php OK, step 4 ran `wp plugin install openid-connect-generic
#   --activate`, which fetches the plugin zip from wordpress.org over egress.
#   Because this Job mounts an EPHEMERAL emptyDir (#4220) — not the runtime PVC
#   the deployment initContainer seeds the plugin onto — the plugin is never
#   present, so the install ALWAYS triggers that download; on a slow-egress /
#   air-gapped Sovereign (no wordpress.org reachability) it HANGS until the hook
#   deadline → post-upgrade hook timed out → HR Ready=False. Root-caused live on
#   the tkt0626 fresh Org (omantel.biz, chart 0.4.17).
#   FIX (two layers, structural):
#     1. VENDOR openid-connect-generic from a PINNED GitHub release archive
#        (`oidc.plugin.{repo,version}`, default oidc-wp/openid-connect-generic
#        3.11.3) into the Job's wp-content — the SAME deterministic mechanism
#        step 0 already uses for pg4wp. NO wordpress.org runtime fetch (air-gapped
#        Sovereigns can't reach it, so a runtime fetch was structurally wrong).
#        `wp plugin install` is removed entirely.
#     2. TOLERANT hook — the fetch is `--max-time` bounded and the whole
#        install/activate step LOGS + CONTINUES on failure (never fails the
#        release). A fully air-gapped Sovereign with zero egress still reaches
#        Ready: the OIDC settings persist in POSTGRES, and the runtime
#        Deployment's wp-plugin-install initContainer seeds the actual plugin
#        files onto the persistent PVC for serving.
#   tests/oidc-config.sh Case 8 asserts the Job has no `wp plugin install`, never
#   references wordpress.org, vendors from the pinned GitHub tag, and tolerates a
#   fetch failure — so the HR reaches Ready without ANY external plugin download.
# 0.4.21 (#4936): FIX the per-Org WordPress that never serves after a funnel
#   install (wordpress.<org>.<pool> → 404). Two independent chart defects:
#   1. DB-password reflector RACE vs Helm `--wait`. The chart created an EMPTY
#      `wordpress-database-secret` annotated to be reflector-mirrored from the
#      CNPG app Secret `<cluster>-app`. bp-reflector (a SEPARATE watch
#      controller) populated the `password` key ~6 min AFTER install — past
#      Helm's 5 m `--wait` → HR `InstallFailed: context deadline exceeded` →
#      the external HTTPRoute was never created (host 404); suspend/resume
#      re-hit the race → CrashLoopBackOff.
#      FIX: WORDPRESS_DB_PASSWORD (deployment) + WP_DB_PASSWORD (admin-user
#      Job) + WORDPRESS_DB_PASSWORD (oidc-config Job) now bind DIRECTLY to the
#      CNPG-generated `<cluster>-app` Secret's `password` key via secretKeyRef
#      (resolved by _helpers.tpl `cnpgAppSecret`). CNPG creates that Secret
#      WITH the real password when the Cluster CR is admitted — well inside the
#      `--wait` window — so there is NO async populate to race. DROPPED the
#      empty reflector Secret (templates/database-secret.yaml), the post-install
#      sync Job (templates/database-secret-sync-job.yaml), and the now-unused
#      `database.secretName` value. The deployment env no longer needs
#      `optional: true` (the key is always present once the Secret exists).
#   2. configSchema required orgDomain + adminUser — fields the console 'New
#      instance' dialog + funnel never collect → Application admission failed
#      `missing properties: 'orgDomain','adminUser'`. FIX: both are now
#      NON-required (the Organization controller derives orgDomain from the Org
#      domain + adminUser.email from the Org owner and injects them before
#      render). blueprint.yaml + the catalog-seed Blueprint CRs updated in
#      lockstep.
# 0.4.22 (#4951): FIX the per-Org WordPress that runs 1/1 but never serves
#   externally (wordpress.<org>.<pool> → Envoy 404, valid cert, no route). The
#   `oidc-config` post-install hook Job stayed Running 0/1 for 13 m+ (never
#   completed) → Helm post-install `timed out waiting for the condition` → HR
#   Failed → the org-controller never programmed the external HTTPRoute.
#   ROOT CAUSE (proven live hw235, Org acme235): the hook's POD WAS NEVER
#   CREATED. The per-Org namespace carries a `plan-quota` ResourceQuota
#   (limits.cpu=4 for the WHOLE vcluster-backed namespace) plus a LimitRange
#   that DEFAULTS every un-capped container to a 500m CPU limit. Steady-state
#   consumed 3750m (vcluster coredns 1000m + vcluster-0 500m + embedded
#   postgres 500m + openclaw 250m + WordPress Deployment 1000m + CNPG 500m),
#   leaving only 250m of `limits.cpu` headroom. The oidc-config Job requested
#   a 500m CPU LIMIT → the job-controller looped `FailedCreate: exceeded
#   quota: plan-quota, requested: limits.cpu=500m, used: 3750m, limited: 4` →
#   no pod → Job 0/1 forever → hook timeout. (NOT a script/keycloak hang — the
#   container never ran; kyverno did not reject it either, the Deployment runs
#   with the same securityContext.)
#   FIX — right-size the bp-wordpress-tenant footprint to fit a 4-CPU per-Org
#   plan alongside vcluster overhead, with durable headroom for its transient
#   bootstrap hooks:
#     1. wordpress.resources.limits.cpu 1 → 500m (a per-Org tenant site is
#        light; 500m CEILING / 100m request is ample) — frees 500m of durable
#        quota headroom.
#     2. oidc-config (weight 10) + admin-user (weight 15) hook Jobs
#        limits.cpu 500m → 250m (short, self-deleting wp-cli/PHP bootstraps).
#   Post-fix steady-state 3250m; a running hook peaks at 3500m ≤ 4000m (500m
#   margin) → the hook pod schedules, the Job completes, the HR reaches Ready,
#   and the org-controller programs the HTTPRoute → the site serves.
#   Also hardened the step-0 pg4wp `curl` with `--max-time 120` (mirrors the
#   step-4 OIDC-plugin vendor) so a black-holed GitHub egress can only FAIL
#   FAST (→ OnFailure retry) instead of hanging the hook indefinitely.
# 0.4.23 (#5623): the active-hot-standby pair must DECLARE what promotes its
#   standby, and the render FAILS CLOSED when it does not.
#   FOUND — hw292 G12 region-kill (2026-08-03): bp-cnpg-pair's region-B
#   dr-promoter promoted at T0+2m16s (RPO=0) while the three bp-postgres
#   shared-pg standbys, which render the identical shape, stayed
#   `pg_is_in_recovery()=t` for the whole outage because only bp-cnpg-pair
#   shipped a promoter. bp-postgres 0.2.18 ported it. THIS chart renders the
#   same cross-region standby (`replica.enabled: true` + pg_basebackup +
#   externalClusters, templates/cnpg-cluster.yaml) and ships NEITHER a promoter
#   NOR a `kind: Continuum` CR — and the mechanism its own template comment
#   names, "Continuum K-Cont-2", is a region-A-ONLY Deployment (verified live
#   2026-08-06 on hw292: region-B carries neither continuum-controller nor the
#   Continuum CRD) that orchestrates a PLANNED switchover. It dies with the
#   region it would fail away from — the #5137 root cause. `replica.enabled` is
#   additionally hard-coded here with no `topology.promoted` HR-value seam, so
#   even a hand-patch of the live Cluster CR is reverted by flux
#   drift-correction mid-outage (#5125-D1). Net: a customer ticking the HA box
#   got a standby nothing would ever promote, silently.
#   NOT FIXED BY FABRICATING A PROMOTER — a promoter that fires without a real
#   quorum/lease signal is the #5178 false-promote flap (hw266 TL2→TL25). The
#   proven bp-cnpg-pair actor latches durability by suspending a NAMED
#   HelmRelease, and this chart's HR is minted per-Application by the
#   application-controller, so there is no stable HR name at render time. That
#   seam is real design work, tracked on #5623.
#   SHIPPED — `pg.activeHotStandby.promotion.mechanism`, REQUIRED whenever the
#   pair renders. `manual` (operator-run promotion, RUNBOOKS §6.1) is the only
#   mechanism this chart can honour today; `dr-promoter` and `continuum` fail
#   closed naming exactly what is missing, so declaring an undelivered failover
#   is impossible. The declared value is stamped on the STANDBY Cluster CR as
#   `catalyst.openova.io/dr-promotion-mechanism`, so an operator can answer "who
#   promotes this?" from the live object during an outage instead of from a
#   values file. Singleton installs render byte-identical (no annotation, no
#   declaration required). Catalog-wide enforcement:
#   scripts/check-dr-pairs-declare-promotion.sh.
version: 0.4.23
appVersion: "6"
description: |
  Catalyst Blueprint scratch chart for in-vcluster WordPress, one
  instance per Organization tenant. Pre-wires:

    - SSO via the per-tenant Keycloak realm using the
      `openid-connect-generic` plugin (auto-create-on-first-login,
      configurable default role, Keycloak-group → WP-role mapping).
    - Postgres provisioned by bp-cnpg (Cluster CR) in the Organization tenant
      namespace; password mirrored via reflector + post-install Job.
    - PVC-backed `/var/www/html/wp-content/` for theme/plugin/upload
      persistence.
    - Ingress at `wordpress.<org-domain>` routed via the Organization's ingress
      with cert-manager TLS.
    - Idempotent post-install Jobs run via `wp-cli` that (a) `wp core
      install` + `wp plugin install openid-connect-generic --activate`
      + `wp option update openid_connect_generic_settings` pointing
      at the operator-supplied Keycloak realm + client, (b) pre-seed
      the Organization admin WP user with the SSO email mapping.

  This is a scratch chart — there is no first-party Helm chart for
  WordPress (the upstream WordPress project ships only a Docker image at
  `wordpress:6-php8.3-apache`). The `common` library subchart is
  declared as a Helm dependency so the BLUEPRINT-AUTHORING.md hollow-
  chart guard (issue #181) is satisfied; bp-newapi follows the same
  pattern.

  Pairs with bp-cnpg (Postgres), bp-keycloak (Organization-vcluster IdP),
  bp-reflector (Secret mirror), bp-cert-manager (ACME TLS).
type: application
