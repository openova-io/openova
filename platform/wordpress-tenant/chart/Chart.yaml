#   - New `pg.activeHotStandby.{enabled,primaryRegion,replicaRegion,
#     walStreaming,clusterMesh}` block in values.yaml.
#   - templates/cnpg-cluster.yaml now renders TWO Cluster.postgresql.cnpg.io
