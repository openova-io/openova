#   - Companion to catalog-seed bp-cnpg-pair Blueprint CR (Refs TBD-E8b).
# 0.4.0 (G117.5 W3.D3, 2026-06-02, Refs #2744):
#   - Per-Org KC realm SSO topology — new `sovereign.fqdn` + `org.slug`
#     + `org.realm` values block. When `oidc.issuerURL` is left at the
#     placeholder default, _helpers.tpl `oidcIssuerURL` auto-derives
