# Catalyst Blueprint umbrella metadata — the upstream chart is now resolved
# as a Helm subchart via Chart.yaml `dependencies:`. This values.yaml carries
# both:
#   1. The catalystBlueprint metadata block (provenance + version) so
#      observability/audit pipelines can inspect the artifact and report
#      which upstream chart + version is bundled.
#   2. The upstream subchart values overlay under the `valkey:` key
#      (umbrella-chart convention — the dependency name from Chart.yaml is
#      the values namespace).
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). The upstream valkey subchart
  # (Bitnami-style) exposes `valkey.image.registry` for registry override.
  # Per-Sovereign overlays wire that alongside this value. Tracked under #560.
  imageRegistry: ""
  # #4136 (omantel.biz kom4dc UAT 2026-06-22): the Bitnami valkey subchart
  # hard-fails the render ("Original containers have been substituted for
  # unrecognized ones", bitnami/charts#30850) the moment any image is
  # repointed off the `bitnami`/`bitnamilegacy` paths to the Sovereign-local
  # Harbor proxy (`harbor.openova.io/proxy-dockerhub/bitnamilegacy/…`, the
  # `valkey:`/`volumePermissions:` overrides below). The bytes are IDENTICAL
  # — proxy-dockerhub is a read-through cache of the same bitnamilegacy
  # archive — so skipping the registry-path verification is safe. Mirrors the
  # bp-keycloak posture (#3263). Per Inviolable Principle #4 this stays
  # operator-overridable.
  security:
    allowInsecureImages: true

catalystBlueprint:
  upstream: { chart: valkey, version: "5.5.1", repo: "https://charts.bitnami.com/bitnami" }

# ─── Upstream chart values (subchart key: valkey) ─────────────────────────
# `helm dependency build` resolves the upstream as a subchart; values here
# under the `valkey:` key flow into that subchart unchanged.
valkey:
  # Replication architecture (one primary + N replicas). Solo Sovereigns
  # use replicaCount: 0 to keep the StatefulSet shape stable while
  # paying for only one pod. Multi-node host clusters bump replicaCount
  # via cluster overlay.
  architecture: replication

  # ── Image refs via the on-Sovereign Harbor proxy-cache (#4136) ──────────
  # ROOT CAUSE (caught LIVE on omantel.biz kom4dc rtz vCluster, 2026-06-22):
  #   The upstream Bitnami valkey 5.5.1 subchart defaults its images to the
  #   BARE dockerhub refs `registry-1.docker.io/bitnami/valkey:latest` (main)
  #   and `registry-1.docker.io/bitnami/os-shell:latest` (volumePermissions
  #   init). Bitnami RELOCATED its free images to the `bitnamilegacy/*`
  #   archive in 2025-08, so `bitnami/valkey:latest` no longer exists, and the
  #   Sovereign node's registry mirror 404s the bare dockerhub path — the
  #   valkey-primary pod sat Init:ImagePullBackOff for 15h (4091 backoffs) →
  #   its `valkey-primary` Service had NO endpoint → every consumer that
  #   pings Redis (bp-newapi: `[FATAL] Redis ping test failed … connection
  #   refused`, 180 restarts) CrashLooped, 503-ing the newapi /console API.
  #
  # FIX (the proven repo-wide pattern — see keycloak/flux/cnpg/openbao):
  #   Route EVERY Bitnami image through `harbor.openova.io/proxy-dockerhub/
  #   bitnamilegacy/<image>:<PINNED-tag>`. The proxy serves PUBLIC images
  #   cred-free pre-cutover; the local Harbor takes over post-cutover. Tags
  #   are PINNED (never `latest`) and verified present in the proxy. The
  #   registry+repository split keeps the subchart's per-image override seam.
  #   Per-Sovereign overlays MAY still override registry/repository/tag.
  image:
    registry: harbor.openova.io
    repository: proxy-dockerhub/bitnamilegacy/valkey
    tag: 8.1.3-debian-12-r3
  volumePermissions:
    image:
      registry: harbor.openova.io
      repository: proxy-dockerhub/bitnamilegacy/os-shell
      tag: 12-debian-12-r50

  primary:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    # 1Gi PVC — adequate for session/state caches on solo Sovereigns;
    # cluster overlays bump for higher-volume Applications.
    persistence:
      enabled: true
      size: 1Gi

  replica:
    # Default 0 replicas for solo Sovereigns. Cluster overlays bump to
    # 2-3 for HA on multi-node host clusters.
    replicaCount: 0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    persistence:
      enabled: true
      size: 1Gi

  # Password auth OFF by default (TBD-V12 #2003, 2026-05-20).
  #
  # ROOT CAUSE (caught on t38 walk 2026-05-20):
  #   The bp-newapi chart's REDIS_CONN_STRING default is the
  #   passwordless URL `redis://valkey-primary.valkey.svc.cluster.local:
  #   6379` (platform/newapi/chart/values.yaml `valkey.url`). On every
  #   freshly franchised Sovereign the newapi Pod CrashLoopBackOff'd 45×
  #   on the Redis ping probe with `NOAUTH Authentication required`,
  #   blocking every Sandbox session (qwen-code + MCP) — the
  #   Pillar-4 verifier-killing bug.
  #
  # CONTRACT MATCH:
  #   The auth contract is set by the CONSUMER (bp-newapi). bp-newapi
  #   ships a passwordless connection string by default; the only way
  #   to make that work without churning every consumer chart is to
  #   flip bp-valkey's default to allow empty password. Other consumers
  #   that DO supply a password tolerate the change:
  #     - products/catalyst org-services (auth.yaml + gateway.yaml)
  #       read VALKEY_PASSWORD via secretKeyRef `optional: true` and
  #       fall back to the no-auth connect path in
  #       core/services/shared/db/valkey.go when the value is empty.
  #     - products/catalyst projector wraps the password Secret mount
  #       in `{{- with .Values.services.projector.valkey.passwordSecret
  #       }}` so an absent Secret just disables the password env var.
  #
  # FOLLOW-UP (deferred, scope of #1986 Pillar 4):
  #   Make bp-newapi read the bp-valkey-generated password via Secret
  #   reflection (mirror of the bp-valkey password Secret into the
  #   newapi namespace, env-var REDIS_PASSWORD wired into the
  #   conn-string template). At that point flip this back to
  #   `auth.enabled: true`. Tracked under issue #2003.
  #
  # Cluster overlays MAY still re-enable auth by setting
  # `valkey.auth.enabled: true` (and supplying matching consumer
  # password wiring) on per-Sovereign installs.
  auth:
    enabled: false

  # ── NetworkPolicy — ingress scoped to the DECLARED consumers (#5487) ────
  #
  # ROOT CAUSE (#5487, caught LIVE on hw291 2026-07-29):
  #   `networkPolicy.enabled: true` was restated here as "the Catalyst
  #   posture is default-deny", but the upstream bitnami template keys the
  #   ingress `from:` off a SECOND value — `networkPolicy.allowExternal`,
  #   which defaults to TRUE. With allowExternal true the rendered rule is
  #
  #       ingress:
  #         - ports: [{port: 6379}]        ← NO `from:` at all
  #
  #   and a Kubernetes ingress rule with no `from:` admits EVERY Pod in the
  #   cluster. Combined with `auth.enabled: false` below (TBD-V12 #2003 —
  #   no `requirepass`), any container foothold in any namespace could
  #   `redis-cli -h valkey-primary.valkey.svc` and run arbitrary commands.
  #   Verified live: `PING` → `+PONG` from an unrelated `grafana` Pod.
  #   Blast radius is not theoretical — this Valkey holds the gateway's
  #   rate-limit counters (a `FLUSHALL` disables the redeem limiter, #5484)
  #   and the `newapi-keyspace-credential` Context data below.
  #
  #   It ALSO silently defeated bp-plane-isolation (slot 26b), which already
  #   ships a `valkey-default-deny` NetworkPolicy admitting ONLY
  #   org-services + newapi: Kubernetes (and Cilium) take the UNION of every
  #   policy selecting a Pod, so one allow-all rule re-opened the whole
  #   namespace no matter how tight the sibling policy was.
  #
  # THE FIX — `allowExternal: false` is the only lever that emits a `from:`.
  #   It narrows the upstream rule to Pods IN THE RELEASE NAMESPACE carrying
  #   `valkey-client: "true"` plus valkey's own Pods (primary↔replica
  #   replication). `extraIngress` then names the real cross-namespace
  #   consumers. Auth stays OFF (see `auth` above) — this is the network
  #   half of the isolation that #2003 assumed was already there.
  #
  # THE CONSUMER SET (derived from the repo, not from guesswork; two
  # independent in-repo declarations agree):
  #   - `org-services` — the BSS control plane. `VALKEY_ADDR` is stamped
  #     into the org-services ConfigMap (products/catalyst/chart/templates/
  #     org-services/configmap.yaml) and consumed by the `auth` + `gateway`
  #     Deployments, both of which live in ns `org-services`.
  #   - `newapi`       — `valkey.url: redis://valkey-primary.valkey.svc…`
  #     (platform/newapi/chart/values.yaml); also the declared consumer of
  #     the `keyspaces[]` Context seeded by slot 17 (reflect.namespaces).
  #   Corroborated by platform/plane-isolation/chart/values.yaml, whose
  #   `namespace: valkey` component lists exactly
  #   `allowIngressFrom: [org-services, newapi]`.
  #
  # NOT included, deliberately (parity with bp-plane-isolation's list):
  #   - `catalyst-system` — the catalyst-projector dials Valkey but ships
  #     DEFAULT-OFF (`services.projector.enabled: false`). An operator who
  #     flips it on adds `catalyst-system` to BOTH lists.
  #   - `matrix` — `externalRedis.enabled: false` by default, same rule.
  #
  # MULTI-REGION: bp-valkey is a per-region install (slot 17 renders in
  # every region's own cluster) and its Services are NOT Cilium global
  # services (`service.cilium.io/global` is absent), so every consumer
  # dials its own region's `valkey-primary` ClusterIP and this policy is
  # correct on BOTH regions unchanged. Cilium AND-injects
  # `io.cilium.k8s.policy.cluster=<local>` into every selector derived from
  # a k8s NetworkPolicy, so a genuine cross-region dial (were Valkey ever
  # promoted to a global Service) would need an identity-based
  # CiliumNetworkPolicy carve-out — the proven #5406 shape in
  # platform/harbor/chart/templates/redis-crossregion-netpol.yaml. Adding
  # peers here would NOT work and must not be attempted with this key.
  #
  # Per Inviolable Principle #4 every element stays operator-overridable —
  # but note `extraIngress` is a LIST: an overlay that sets it REPLACES this
  # rule wholesale, so an overlay adding a consumer must restate these two
  # namespaces alongside its own.
  networkPolicy:
    enabled: true
    # false ⇒ the upstream ingress rule renders a real `from:` selector.
    # NEVER flip this back to true — that is the #5487 defect verbatim.
    allowExternal: false
    extraIngress:
      # Port MUST track `primary.containerPorts.valkey` (upstream default
      # 6379, restated in `contextsService.port` below).
      - ports:
          - port: 6379
            protocol: TCP
        from:
          - namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: In
                  values:
                    - org-services
                    - newapi
    # Metrics stays at the upstream default (`metrics.allowExternal: true`)
    # because `metrics.enabled` is false below — no metrics rule renders at
    # all. An operator enabling the exporter must scope that port to the
    # scraper's namespace in the same breath; leaving a guessed scraper
    # namespace here would silently break scraping instead.

  # Prometheus exporter sidecar + ServiceMonitor — DEFAULT OFF.
  #
  # Per docs/INVIOLABLE-PRINCIPLES.md #4 and docs/BLUEPRINT-AUTHORING.md
  # §11.2 (Observability toggles must default false): the
  # `monitoring.coreos.com/v1` CRDs that back ServiceMonitor /
  # PrometheusRule ship with kube-prometheus-stack — an Application
  # Blueprint installed AFTER the bootstrap-kit. Defaulting any of these
  # toggles `true` would render a CR on a fresh Sovereign before the CRD
  # exists, and the apiserver would reject it. Operator opts in via
  # per-cluster overlay (issue #182).
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
    prometheusRule:
      enabled: false

# ─── Catalyst-managed overlay values consumed by templates/ ───────────────

# ── Contexts (#3370 — the generality proof of the platform-wide reuse
# mechanism). bp-valkey declares `shareable: true` with contextSchema
# kind=keyspace, valuesKey=keyspaces (platform/valkey/blueprint.yaml).
# Each entry below is ONE Context: a consumer application's dedicated
# logical database index on this instance, materialized as a reflected
# connection Secret (templates/context-secrets.yaml) — the exact
# bp-postgres databases[] machinery shape, generalized only by the
# declaration.
#
# keyspaces:
#   - name: sessions          # the Context name
#     index: 2                # the dedicated logical database index
#     consumer:
#       blueprint: bp-newapi  # for the Contexts table
#       mode: shared
#     reflect:
#       secretName: newapi-keyspace-credential  # hub Secret name
#       namespaces: [newapi]                    # push targets
keyspaces: []

# The wire address stamped into every Context credential Secret. Host
# empty → derived as <release>-primary.<namespace>.svc.cluster.local
# (the bitnami subchart's primary Service).
contextsService:
  host: ""
  port: 6379

# ── Bootstrap self-registration (#3370) ─────────────────────────────────
# When enabled, the chart self-registers the apps.openova.io/v1
# Application CR for this instance (templates/application-cr.yaml) —
# the canonical representation every console surface reads, marked
# spec.bootstrap=true so the application-controller ADOPTS the slot
# HR's install (status-only reconcile). ONLY bootstrap-kit slots set
# this; console-created instances already carry a controller-created CR.
bootstrapOwned:
  enabled: false
  # Canonical placement token stamped onto the self-registered Application
  # CR's spec.placement (#3375 DoD-1 / #3768 / #3786). MUST be a canonical
  # mode (singleton / active-active / active-hot-standby / active-passive) —
  # NEVER the banned legacy dialect single-region / active-hotstandby, which
  # the read path (readTopology) would surface verbatim to the operator. A
  # leaf bootstrap app installs as one copy, so singleton is the truthful
  # effective mode.
  placement: singleton
  helmRelease:
    name: ""
    namespace: flux-system
