apiVersion: v2
name: bp-valkey
# 1.1.0 (#3370, 2026-06-12): Contexts — the generality proof of the
# platform-wide reuse mechanism on a NON-database blueprint. New
# Catalyst overlay templates:
#   - context-secrets.yaml: each `keyspaces[]` entry (the canonical
#     context entry shape: name + index + consumer.blueprint +
#     reflect.secretName/namespaces) materializes ONE reflected
#     credential Secret (host/port/index/uri, password when
#     valkey.auth.enabled) in the RELEASE namespace as a reflector
#     push source — the exact bp-postgres databases[] machinery
#     shape, generalized only by the blueprint.yaml contextSchema
#     declaration (kind=keyspace, valuesKey=keyspaces).
#   - application-cr.yaml: bootstrapOwned self-registration of the
#     canonical apps.openova.io/v1 Application CR (adoption-guarded,
#     Capabilities-gated — see bp-postgres 0.1.6).
# Default render is byte-compatible with 1.0.2 (keyspaces:[] +
# bootstrapOwned off → zero overlay resources); locked by
# tests/contexts-render.sh.
# 1.0.2 (TBD-V12 #2003, 2026-05-20): default valkey.auth.enabled flips
# from true → false to match bp-newapi's passwordless
# REDIS_CONN_STRING default. Pre-1.0.2 every freshly-franchised
# Sovereign hit `NOAUTH Authentication required` on the newapi
# Redis ping probe — 45× CrashLoopBackOff on t38 — blocking every
# Sandbox session (Pillar 4 qwen-code + MCP) and acting as the
# verifier-killing bug for the end-user DoD (#1986). Consumers that
# DO supply a password (catalyst org-services, projector) tolerate
# the change via `secretKeyRef optional: true` and `{{- with }}`
# gates that fall back to the no-auth connect path. See
# values.yaml under `valkey.auth` for the full rationale +
# follow-up to re-enable auth once bp-newapi mirrors the
# bp-valkey-generated password.
# 1.1.1 — #3370 hotfix: bootstrap Application CR stamps environmentRef +
#   regions so it admits under BOTH the pre-#3370 CRD (hard-required) and the
#   #3370 CRD (CEL-waived) — breaks the live upgrade-rollback deadlock that
#   blocked keycloak->gitea->catalyst-platform on hw130.
# 1.1.3 (#3375 / #3786, 2026-06-18): the bootstrap-owned Application CR's
# spec.placement now emits the CANONICAL token `singleton` (overridable via
# bootstrapOwned.placement) instead of the banned legacy `single-region`.
# readTopology serves spec.placement VERBATIM to the Topology tab + the
# Instances-table chip, so the legacy spelling leaked the banned word to the
# operator (hw159 #3375).
# 1.1.4 (#4136, omantel.biz kom4dc UAT 2026-06-22): route the Bitnami valkey
# subchart images through the on-Sovereign Harbor proxy-cache. The upstream
# 5.5.1 subchart defaulted main + volumePermissions images to the BARE
# dockerhub refs `registry-1.docker.io/bitnami/{valkey,os-shell}:latest`;
# Bitnami relocated its free images to `bitnamilegacy/*` in 2025-08, so
# `bitnami/valkey:latest` no longer exists and the Sovereign node registry
# mirror 404s the bare path → valkey-primary sat Init:ImagePullBackOff for
# 15h (4091 backoffs) → its Service had no endpoint → bp-newapi CrashLooped on
# the Redis ping (503-ing the newapi /console API, UAT 37/38/114). Pin
# valkey=8.1.3-debian-12-r3 + os-shell=12-debian-12-r50 via
# `harbor.openova.io/proxy-dockerhub/bitnamilegacy/…` + set
# global.security.allowInsecureImages:true (bitnami/charts#30850 render
# guard) — the proven bp-keycloak/bp-cnpg pattern. Chart-only.
# 1.1.5 (#5487, hw291 2026-07-29): SECURITY — the NetworkPolicy admitted the
# ENTIRE cluster on 6379. `networkPolicy.enabled: true` was restated in
# values.yaml as "the Catalyst posture is default-deny", but the upstream
# bitnami template keys the ingress `from:` off a SECOND value,
# `networkPolicy.allowExternal`, which defaults TRUE — so the rendered rule
# was `ingress: [{ports: [6379]}]` with no `from:`, and a k8s ingress rule
# with no `from:` admits every Pod in the cluster. Combined with
# `auth.enabled: false` (1.0.2 above — no requirepass) any container
# foothold in any namespace could run arbitrary commands against the shared
# cache holding the gateway's rate-limit counters (#5484) and the
# newapi-keyspace-credential Context data; `PING` → `+PONG` from an
# unrelated `grafana` Pod was the live proof. It also silently defeated
# bp-plane-isolation's `valkey-default-deny` (slot 26b), since k8s/Cilium
# take the UNION of every policy selecting a Pod. Fix: `allowExternal:
# false` (the only lever that emits a `from:`) + an `extraIngress` rule
# naming the two declared consumers — ns `org-services` (the auth + gateway
# Deployments that read VALKEY_ADDR) and ns `newapi` (its
# REDIS_CONN_STRING + the slot-17 keyspace Context). Auth stays OFF; this is
# the network half of the isolation #2003 assumed was already in place.
# Locked by tests/networkpolicy-ingress-scope.sh (vacuity check + two
# negative controls). Chart-only — no image or subchart change.
version: 1.1.5
description: |
  Catalyst-curated Blueprint umbrella chart for Valkey (Redis-compatible
  cache, BSD-3). Depends on the upstream `valkey` chart (Bitnami) as a
  Helm subchart so `helm dependency build` pulls the upstream payload
  into this artifact; the Catalyst overlay templates in templates/
  (label propagation, observability toggles defaulted off) sit alongside
  the upstream subchart and Helm renders both at install time.
  Catalyst-curated values flow into the upstream subchart under the
  `valkey:` key in values.yaml.
type: application
keywords: [catalyst, blueprint, valkey, redis, cache]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a Helm subchart so `helm dependency build`
# bundles it into the OCI artifact. Pinned to bitnami/valkey 5.5.1
# (matches platform/valkey/blueprint.yaml + values.yaml
# `catalystBlueprint.upstream.version`). Per
# docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the version is
# operator-bumpable via PR + Blueprint release.
dependencies:
  - name: valkey
    version: "5.5.1"
    repository: "https://charts.bitnami.com/bitnami"

annotations:
  # #2935 (2026-06-03): Blueprint-Release hollow-chart guard exemption.
  # Chart legitimately renders zero resources with default values
  # (default-off feature toggle or dependency-on-CRD pattern). Without
  # this annotation Blueprint-Release rejects publish.
  catalyst.openova.io/smoke-render-mode: "default-off"
