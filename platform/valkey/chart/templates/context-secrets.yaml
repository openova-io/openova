{{- /*
Per-keyspace Context credential Secrets (#3370 generality proof).

bp-valkey declares `shareable: true` with contextSchema kind=keyspace,
valuesKey=keyspaces (platform/valkey/blueprint.yaml). A Context for
valkey is a KEYSPACE: a dedicated logical database index on this one
instance plus a reflected connection Secret carrying the full wire
contract. This template materializes Contexts EXACTLY the way the
bp-postgres databases[] machinery does — a hub credential Secret in the
RELEASE namespace (always exists; the #3283 deadlock lesson) that is a
reflector PUSH source for the consumer namespaces — generalized only by
the declaration, no new controllers.

Entry shape (the canonical context entry, identical to bp-postgres
databases[] modulo the kind-specific field):

  keyspaces:
    - name: sessions          # the Context name
      index: 2                # the dedicated logical database index
      consumer:
        blueprint: bp-newapi  # for the Contexts table
        mode: shared
      reflect:
        secretName: newapi-keyspace-credential
        namespaces: [newapi]

The hub Secret carries: host, port, index, uri
(redis://host:port/index). When `valkey.auth.enabled` is true a
chart-minted password is added (lookup-stable across upgrades, the
role-secrets.yaml idiom) and the uri carries it.
*/ -}}
{{- $ctx := . }}
{{- $ns := .Release.Namespace }}
{{- $host := include "bp-valkey.serviceHost" . }}
{{- $port := .Values.contextsService.port | default 6379 }}
{{- $authEnabled := false }}
{{- if .Values.valkey }}{{- if .Values.valkey.auth }}{{- if .Values.valkey.auth.enabled }}{{- $authEnabled = true }}{{- end }}{{- end }}{{- end }}
{{- range .Values.keyspaces }}
{{- $ks := . }}
{{- if and $ks.reflect $ks.reflect.secretName }}
{{- $password := "" }}
{{- if $authEnabled }}
{{- $live := lookup "v1" "Secret" $ns $ks.reflect.secretName }}
{{- if and $live $live.data (index $live.data "password") }}
{{- $password = index $live.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ks.reflect.secretName | quote }}
  namespace: {{ $ns }}
  labels:
    {{- include "bp-valkey.labels" $ctx | nindent 4 }}
    catalyst.openova.io/context-kind: keyspace
    catalyst.openova.io/context-name: {{ $ks.name | quote }}
    {{- with $ks.consumer }}
    catalyst.openova.io/context-consumer: {{ .blueprint | default "" | quote }}
    {{- end }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with $ks.reflect.namespaces }}
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: {{ join "," . | quote }}
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: {{ join "," . | quote }}
    {{- end }}
type: Opaque
stringData:
  host: {{ $host | quote }}
  port: {{ $port | quote }}
  index: {{ $ks.index | default 0 | quote }}
  {{- if $authEnabled }}
  password: {{ $password | quote }}
  uri: {{ printf "redis://:%s@%s:%v/%v" $password $host $port ($ks.index | default 0) | quote }}
  {{- else }}
  uri: {{ printf "redis://%s:%v/%v" $host $port ($ks.index | default 0) | quote }}
  {{- end }}
{{- end }}
{{- end }}
