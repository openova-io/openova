{{- /*
Function test of bp-valkey (docs/RUNBOOKS.md section 4.5). `helm test` runs it.

It writes a random key with SET, reads it back with GET, removes it with DEL,
on the address consumers dial (bp-valkey.serviceHost, the address the Context
Secrets carry). The image is the chart's own Valkey image, which carries
valkey-cli.

The upstream subchart's NetworkPolicy admits port 6379 only from Pods that
carry the label "<fullname>-client: true", so the test Pod carries it.
<fullname> is computed the way the subchart computes it.

When valkey.auth.enabled is true, the password is read from the subchart's own
Secret (valkey.auth.existingSecret when set, otherwise <fullname>), mounted as
a file. The chart has no master gate, so the test always renders.

The kit installs this release without waiting for its workloads
(install.disableWait), so at install the test runs before the server is up: it
sends PING every 5 seconds until the answer is PONG, at most until 60 seconds
before its bound T, and fails naming the PING when no PONG came by then. T is
functionTest.timeoutSeconds, the Pod's activeDeadlineSeconds: the kit states
the install timeout of its release there (docs/RUNBOOKS.md section 4.5);
without it T is 300. The shell's clock starts with the container, while the
deadline counts from the Pod's start, the pull of the image included; so the
script also traps TERM, which the kubelet sends at the deadline, and then
prints the fail line naming the step it was in and the last answer (the trap
runs when the current command returns, within the grace period), instead of
ending without a word. The key holds the time and two random numbers. The
script never writes two dollar signs in a row: Kubernetes turns them into one
in a container's args before the shell reads them.
*/ -}}
{{- $bound := int ((.Values.functionTest | default dict).timeoutSeconds | default 300) }}
{{- $wait := sub $bound 60 }}
{{- $sub := .Values.valkey | default dict }}
{{- $name := $sub.nameOverride | default "valkey" }}
{{- $fullname := "" }}
{{- if $sub.fullnameOverride }}
{{- $fullname = $sub.fullnameOverride | trunc 63 | trimSuffix "-" }}
{{- else if contains $name .Release.Name }}
{{- $fullname = .Release.Name | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- $fullname = printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- $img := $sub.image | default dict }}
{{- $registry := (.Values.global).imageRegistry | default $img.registry }}
{{- $auth := $sub.auth | default dict }}
{{- $authSecret := $auth.existingSecret | default $fullname }}
{{- $authKey := "valkey-password" }}
{{- if and $auth.existingSecret $auth.existingSecretPasswordKey }}
{{- $authKey = $auth.existingSecretPasswordKey }}
{{- end }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-function-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    catalyst.openova.io/function-test: "true"
    {{ $fullname }}-client: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: {{ $bound }}
  automountServiceAccountToken: false
  containers:
    - name: function-test
      image: {{ printf "%s/%s:%s" $registry $img.repository (toString $img.tag) | quote }}
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: VALKEY_HOST
          value: {{ include "bp-valkey.serviceHost" . | quote }}
        - name: VALKEY_PORT
          value: {{ .Values.contextsService.port | default 6379 | quote }}
      {{- if $auth.enabled }}
      volumeMounts:
        - name: auth
          mountPath: /etc/function-test/auth
          readOnly: true
      {{- end }}
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          fail() { echo "FUNCTION-TEST fail {{ .Chart.Name }} $1"; exit 1; }
          oneline() { printf '%s' "$1" | tr '\n' ' ' | cut -c1-200; }
          cli=(valkey-cli -h "${VALKEY_HOST}" -p "${VALKEY_PORT}")
          if [ -f /etc/function-test/auth/password ]; then
            cli+=(-a "$(cat /etc/function-test/auth/password)" --no-auth-warning)
          fi
          out=""
          step="waiting for PONG to PING on ${VALKEY_HOST}:${VALKEY_PORT}"
          trap 'fail "TERM at the deadline of the Pod, after ${SECONDS} seconds of the script, while ${step}; last answer: $(oneline "${out}")"' TERM
          while [ "${SECONDS}" -lt {{ $wait }} ]; do
            out="$(timeout 10 "${cli[@]}" PING 2>&1)" && [ "${out}" = "PONG" ] && break
            sleep 5
          done
          [ "${out}" = "PONG" ] || fail "PING on ${VALKEY_HOST}:${VALKEY_PORT} was not answered with PONG within {{ $wait }} seconds: $(oneline "${out}")"
          step="writing, reading and removing a key on ${VALKEY_HOST}:${VALKEY_PORT}"
          key="function-test:$(date +%s):${RANDOM}:${RANDOM}"
          value="v${RANDOM}${RANDOM}"
          out="$("${cli[@]}" SET "${key}" "${value}" 2>&1)" || fail "SET on ${VALKEY_HOST}:${VALKEY_PORT} failed: $(oneline "${out}")"
          [ "${out}" = "OK" ] || fail "SET answered '$(oneline "${out}")', not OK"
          out="$("${cli[@]}" GET "${key}" 2>&1)" || fail "GET failed: $(oneline "${out}")"
          [ "${out}" = "${value}" ] || fail "GET returned '$(oneline "${out}")', not the value written"
          out="$("${cli[@]}" DEL "${key}" 2>&1)" || fail "DEL failed: $(oneline "${out}")"
          case "${out}" in
            1|"(integer) 1") ;;
            *) fail "DEL answered '$(oneline "${out}")', not 1" ;;
          esac
          echo "FUNCTION-TEST pass {{ .Chart.Name }} SET, GET and DEL of a random key on ${VALKEY_HOST}:${VALKEY_PORT} returned the value written"
  {{- if $auth.enabled }}
  volumes:
    - name: auth
      secret:
        secretName: {{ $authSecret | quote }}
        items:
          - key: {{ $authKey | quote }}
            path: password
  {{- end }}
