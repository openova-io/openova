apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-valkey
  labels:
    catalyst.openova.io/section: pts-4-1-data-services
spec:
  version: 1.1.5
  card:
    title: Valkey
    summary: |
      Redis-compatible in-memory cache (BSD-3 fork of Redis 7.2.4 under
      Linux Foundation governance). Bootstrap-kit slot 17 — used by
      Catalyst control-plane services for ephemeral session/state, and
      by Application-tier Apps that need a Redis wire-protocol cache.
      Replication via REPLICAOF (per-Application choice — see
      docs/SRE.md §2.5).
    icon: valkey.svg
    category: data
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  # ── Shareability + Contexts (#3370 generality proof) ────────────────
  # shareable: one Valkey instance serves many consumer applications,
  # each through its own Context — for valkey a KEYSPACE (a dedicated
  # logical database index + a reflected connection Secret). Contexts
  # are declared as Git-committed IaC in the instance's values under
  # `contextSchema.valuesKey` and materialize via the same machinery
  # shape as bp-postgres databases[]: per-context reflected credential
  # Secret pushed into the consumer namespace (chart/templates/
  # context-secrets.yaml).
  shareable: true
  contextSchema:
    # Kind label — the Context prefix the console renders (keyspace/<n>).
    kind: keyspace
    # Where Context entries live in the instance's IaC values. Every
    # entry follows the canonical context shape: name +
    # consumer.blueprint + reflect.secretName + reflect.namespaces
    # (+ kind-specific fields such as `index` here).
    valuesKey: keyspaces
    # What a Context needs (provisioning-journey inputs).
    needs:
      - name
      - index
    # What a Context produces (consumer-visible outputs).
    produces:
      - credentialSecret
  configSchema:
    type: object
    properties:
      architecture:
        type: string
        enum: [standalone, replication]
        default: replication
        description: |
          Standalone (single primary, no replicas) or replication (one
          primary + N replicas). Solo Sovereigns use replication with
          replicaCount: 0 to keep the StatefulSet shape stable while
          paying for only one pod.
      auth:
        type: object
        properties:
          enabled:
            type: boolean
            default: false
            description: |
              Enforce password auth on the Valkey wire protocol.
              Default false (TBD-V12 #2003) — matches bp-newapi's
              passwordless REDIS_CONN_STRING contract; flipping true
              requires every consumer chart (bp-newapi, catalyst
              org-services, projector) to wire the bp-valkey-
              generated password into their connection strings.
      metrics:
        type: object
        properties:
          enabled:
            type: boolean
            default: false
            description: |
              Sidecar Prometheus exporter (redis-exporter) on each pod.
              Cluster overlays flip true once kube-prometheus-stack
              reconciles (issue #182).
          serviceMonitor:
            type: object
            properties:
              enabled:
                type: boolean
                default: false
                description: |
                  monitoring.coreos.com/v1 ServiceMonitor — requires the
                  Prometheus Operator CRDs from kube-prometheus-stack.
  placementSchema:
    modes: [single-region, active-active, active-hotstandby]
    default: single-region            # Valkey replication is per-Application
    # G93.2 (Refs #2667) — On a multi-region Sovereign the canonical
    # Valkey topology is active-hotstandby: primary instance accepts
    # writes in regions[0], replica streams from primary in regions[1]
    # over Cilium ClusterMesh (REPLICAOF protocol per docs/SRE.md §2
    # replication matrix). Without this seam, a fresh Application
    # install on a 2-region Sovereign defaults to single-region and
    # the cross-region replica never spins up — Pillar 3 cache-warm-
    # failover is impossible.
    defaultOnMultiRegion: active-hotstandby
  # ── #3373: class-level placement SUGGESTION + allow-list ────────────────
  # Placement is an INSTANCE property (Application.spec.placement); this is
  # only the default every instance inherits silently — the provisioning
  # journey's generic advanced selector (and a direct Git edit of the
  # instance's spec.placement) may override it within allowedPlacements.
  # Founder §4 table target: rtz. Single render mechanism: the Flux
  # spec.kubeConfig.secretRef pivot — zero per-app placement code.
  defaultPlacement:
    vcluster: rtz
  allowedPlacements: [host, rtz]

  manifests:
    chart: ./chart
  # Valkey is a self-contained cache — only needs Flux Ready. The Flux HR
  # at clusters/_template/bootstrap-kit/17-valkey.yaml encodes this
  # dependsOn. Declared here for documentation parity; the
  # blueprint-controller does not yet reconcile this field.
  depends:
    - blueprint: bp-flux
      version: ^1.0
  upgrades:
    from: ["0.x"]
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-passive
    - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: sentinel
          mode: async
        switchover:
          mechanism: sentinel-failover
          rtoSeconds: 30
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: rtz
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: wire
    hostnameTemplate: valkey.{{.OrgDomain}}
    port: 6379
    protocol: tcp
    tls: false
    visibility: private
    launchDefault: false
    ssoEnabled: false
  multiInstance:
    enabled: true
    maxPerOrg: 10
    namingTemplate: '{{.AppName}}-{{.InstanceID}}'
    isolationLevel: namespace
  # ── /G117.1 ──
