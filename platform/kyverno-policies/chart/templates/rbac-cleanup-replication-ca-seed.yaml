{{- /*
The cleanup controller's right for the DeletingPolicy
replication-ca-seed-orphan (templates/cleanup/, check FND-G12). The deleting
controller lists the labelled Secrets and deletes the orphaned ones; the
policy's conditions list the HelmReleases and the cert-manager Certificates
of the Secret's namespace. The upstream cleanup ClusterRole grants none of
these.

Aggregated into that ClusterRole through the label the upstream chart selects
(rbac.kyverno.io/aggregate-to-cleanup-controller), like
rbac-cilium-read.yaml, so it survives a Kyverno upgrade. The narrowest form
RBAC allows: a Role cannot follow the Organization namespaces that appear at
run time, and RBAC cannot select by label, so it is a ClusterRole with list +
delete on Secrets (no get, watch, create, update or patch) and list on
HelmReleases and Certificates. Rendered only with the policy.
*/ -}}
{{- if .Values.cleanupPolicies.replicationCaSeedOrphan.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bp-kyverno-policies-cleanup-replication-ca-seed
  labels:
    app.kubernetes.io/name: bp-kyverno-policies
    app.kubernetes.io/managed-by: Helm
    catalyst.openova.io/blueprint: bp-kyverno-policies
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "delete"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["list"]
{{- end }}
