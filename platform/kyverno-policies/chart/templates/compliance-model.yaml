{{- /*
compliance-model.yaml - the one ComplianceModel object of the cluster
(ADR-0029, CMP-041). The kind is defined by crds/compliancemodel.yaml.

spec is model/model.yaml verbatim, plus `checks` and `exemptions`, which
this template builds.

`checks` is the list of model/checks.yaml, each entry verbatim and in its
order, less every check whose policy this render does not install: a check
whose values block compliancePolicies.<valuesKey> is a map with no true
`enabled`. That is the one switch each policy template of this chart reads
(it renders its policy only if compliancePolicies.<valuesKey>.enabled), so
the model and the installed policies come from the same value: a kit that
turns a policy off (the local pack turns forbidLocalPath off: its only
storage class is local-path) gets a model without that check, and check
CMP-G03 finds the two in agreement. With the chart's values every check is
in the model.

`exemptions`: for every namespace in the excludeNamespaces or
extraExcludeNamespaces list of the values block of a check of `checks`, one
entry naming that namespace, the checks whose lists hold it (in the order of
checks.yaml), and the reason and owner of the namespace in
model/exemptions.yaml.

The render fails when a data file is missing or does not parse, and when a
namespace of any exclude list under compliancePolicies has no reason in
model/exemptions.yaml: "exemption <namespace> has no reason".

A check whose block has no exclude list (useraccess-boundary: a UserAccess
has no namespace) contributes no exemption. The guard
tools/guards/cmd/check-compliance-model holds that every check's valuesKey
is a block of compliancePolicies that its own policy template reads.

The data files are release content: every installation of a release carries
the same model files, and nothing in values changes a weight. Values decide
only which checks the object names, through the switches of the policies.
*/ -}}
{{- $model := .Files.Get "model/model.yaml" | fromYaml -}}
{{- $checksDoc := .Files.Get "model/checks.yaml" | fromYaml -}}
{{- $reasonsDoc := .Files.Get "model/exemptions.yaml" | fromYaml -}}
{{- range $name, $doc := dict "model/model.yaml" $model "model/checks.yaml" $checksDoc "model/exemptions.yaml" $reasonsDoc -}}
{{- if or (not $doc) (hasKey $doc "Error") -}}
{{- fail (printf "compliance model: %s is missing or does not parse: %v" $name (get $doc "Error")) -}}
{{- end -}}
{{- end -}}
{{- $allChecks := get $checksDoc "checks" -}}
{{- $reasons := get $reasonsDoc "namespaces" -}}
{{- if not (kindIs "slice" $allChecks) -}}
{{- fail "compliance model: model/checks.yaml has no list checks" -}}
{{- end -}}
{{- $checks := list -}}
{{- range $c := $allChecks -}}
{{- $switch := index $.Values.compliancePolicies (get $c "valuesKey" | toString) -}}
{{- if or (not (kindIs "map" $switch)) (get $switch "enabled") -}}
{{- $checks = append $checks $c -}}
{{- end -}}
{{- end -}}
{{- if not (kindIs "map" $reasons) -}}
{{- fail "compliance model: model/exemptions.yaml has no map namespaces" -}}
{{- end -}}
{{- range $key, $block := .Values.compliancePolicies -}}
{{- if kindIs "map" $block -}}
{{- range $ns := concat (default (list) $block.excludeNamespaces) (default (list) $block.extraExcludeNamespaces) -}}
{{- $r := get $reasons $ns -}}
{{- if or (not (kindIs "map" $r)) (not (get $r "reason")) (not (get $r "owner")) -}}
{{- fail (printf "exemption %s has no reason" $ns) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $byNamespace := dict -}}
{{- range $c := $checks -}}
{{- $block := index $.Values.compliancePolicies (get $c "valuesKey" | toString) -}}
{{- if kindIs "map" $block -}}
{{- range $ns := concat (default (list) $block.excludeNamespaces) (default (list) $block.extraExcludeNamespaces) -}}
{{- $ids := default (list) (get $byNamespace $ns) -}}
{{- if not (has $c.id $ids) -}}
{{- $_ := set $byNamespace $ns (append $ids $c.id) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $exemptions := list -}}
{{- range $ns := keys $byNamespace | sortAlpha -}}
{{- $r := get $reasons $ns -}}
{{- $exemptions = append $exemptions (dict "namespace" $ns "checks" (get $byNamespace $ns) "reason" (get $r "reason") "owner" (get $r "owner")) -}}
{{- end -}}
{{- $spec := deepCopy $model -}}
{{- $_ := set $spec "checks" $checks -}}
{{- $_ := set $spec "exemptions" $exemptions -}}
apiVersion: compliance.openova.io/v1alpha1
kind: ComplianceModel
metadata:
  name: default
  labels:
    app.kubernetes.io/name: bp-kyverno-policies
    app.kubernetes.io/component: compliance-model
spec:
{{ toYaml $spec | indent 2 }}
