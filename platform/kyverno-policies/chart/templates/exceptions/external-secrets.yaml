{{- /*
external-secrets.yaml - the External Secrets Operator is exempt from
probes-present (CMP-067). The upstream chart external-secrets 0.10.7, the
dependency of bp-external-secrets, renders the Deployment external-secrets
with no probe and the Deployments external-secrets-webhook and
external-secrets-cert-controller with a readinessProbe only, and offers no
value that sets a livenessProbe. The engine honours an exception only in this
namespace (namespace-exceptions.yaml). Held by tools/guards/cmd/kit-policies,
which judges the kit's render.
*/ -}}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: external-secrets-probes
  namespace: catalyst-policy-exceptions
  labels:
    app.kubernetes.io/name: bp-kyverno-policies
    app.kubernetes.io/component: policy-exceptions
spec:
  policyRefs:
    - name: probes-present
      kind: ValidatingPolicy
  matchConditions:
    - name: scope
      expression: "object.metadata.?namespace.orValue('') == 'external-secrets-system' && object.kind == 'Deployment' && object.metadata.name in ['external-secrets', 'external-secrets-webhook', 'external-secrets-cert-controller']"
