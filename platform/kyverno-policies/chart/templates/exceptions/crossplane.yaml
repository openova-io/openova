{{- /*
crossplane.yaml - the Crossplane control plane is exempt from probes-present
(CMP-067). The upstream chart crossplane 2.4.3, the dependency of bp-crossplane,
renders the Deployment crossplane with a startupProbe only and the Deployment
crossplane-rbac-manager with no probe, and offers no value that sets a
livenessProbe or a readinessProbe. The engine honours an exception only in
this namespace (namespace-exceptions.yaml). Held by
tools/guards/cmd/kit-policies, which judges the kit's render.
*/ -}}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: crossplane-probes
  namespace: catalyst-policy-exceptions
  labels:
    app.kubernetes.io/name: bp-kyverno-policies
    app.kubernetes.io/component: policy-exceptions
spec:
  policyRefs:
    - name: probes-present
      kind: ValidatingPolicy
  matchConditions:
    - name: scope
      expression: "object.metadata.?namespace.orValue('') == 'crossplane-system' && object.kind == 'Deployment' && object.metadata.name in ['crossplane', 'crossplane-rbac-manager']"
