{{- /*
The reports controller's READ of the kinds two ValidatingPolicies MATCH.

Kyverno v1.19 marks a ValidatingPolicy ready only when the reports controller,
which scans the existing objects in the background, can get, list and watch
every resource of the policy's spec.matchConstraints (and of its autogen
targets): pkg/controllers/policystatus/controller.go,
reconcileRBACPermissionsCondition, a SubjectAccessReview for the ServiceAccount
kyverno-reports-controller. Without it the policy reports
RBACPermissionsGranted=False and stays not ready; the chart's function test
then fails. Measured on the standing two-region Sovereign on 26 November with
bp-kyverno 1.3.11 (v1.19.2):

  forbid-local-path-storage ready=false RBACPermissionsGranted=False:
    Policy is not ready for reporting, missing permissions:
    get /v1, Resource=persistentvolumes: ; list ... ; watch ... .

The engine's chart binds the Kubernetes role `view` to the reports controller,
and `view` holds no cluster-scoped kind: not persistentvolumes. HelmReleases
reach `view` only through Flux's own `flux-view` role (Flux's install manifest
aggregates it), which neither Kyverno chart renders, so substrate-stays-on-host
gets its read here too instead of from another Blueprint's RBAC.

A lookup's read is another class with its own roles (rbac-storageclass-read,
rbac-cilium-read). tests/apicall-rbac-correspondence.sh (C5) fails when a kind
a policy matches is not readable by the controller that needs it. Aggregated to
the reports controller only, through the label Kyverno's chart selects, so it
survives a Kyverno upgrade. Rendered only with the policies that need it.
*/ -}}
{{- $localPath := .Values.compliancePolicies.forbidLocalPath.enabled }}
{{- $substrate := .Values.compliancePolicies.substrateOnHost.enabled }}
{{- if or $localPath $substrate }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bp-kyverno-policies-reports-matched-read
  labels:
    app.kubernetes.io/name: bp-kyverno-policies
    app.kubernetes.io/managed-by: Helm
    catalyst.openova.io/blueprint: bp-kyverno-policies
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  {{- if $localPath }}
  # forbid-local-path-storage (baseline/23-forbid-local-path.yaml)
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if $substrate }}
  # substrate-stays-on-host (baseline/22-substrate-on-host.yaml)
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  {{- end }}
{{- end }}
