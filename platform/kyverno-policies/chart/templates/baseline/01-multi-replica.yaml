{{/*
K1 — multi-replica-drainability (resilience, permissive default).

Drainability gate: Deployment / StatefulSet must declare replicas >= 2 so
that voluntary node drains and rolling updates can keep at least one
replica serving traffic. Single-replica workloads are fine for batch
jobs and for explicitly-singleton services (databases with their own HA
mechanism), but for the general case they break the eviction contract.

Default mode is permissive (Audit) per docs/EPICS-1-6-unified-design.md
§4.3 — flipped to Enforce per-Environment via EnvironmentPolicy.spec.
compliance.modes.multiReplica.

Per docs/INVIOLABLE-PRINCIPLES.md #4 every value here is configurable
via .Values.compliancePolicies.multiReplica.* — operators override per
Sovereign overlay.
*/}}
{{- if .Values.compliancePolicies.multiReplica.enabled -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: multi-replica-drainability
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: resilience
  annotations:
    policies.kyverno.io/title: Workloads must declare 2+ replicas
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Deployments and StatefulSets must declare spec.replicas >= 2 so
      voluntary disruptions (node drains, rolling updates) can preserve
      at least one healthy replica.
spec:
  validationFailureAction: {{ include "bp-kyverno-policies.action" (dict "ctx" . "policy" .Values.compliancePolicies.multiReplica.action) }}
  background: true
  rules:
    - name: replicas-at-least-two
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
      exclude:
        any:
          - resources:
              namespaces:
                {{- range $ns := .Values.compliancePolicies.multiReplica.excludeNamespaces }}
                - {{ $ns }}
                {{- end }}
          {{- /*
            #4422 (2026-06-26): per-Org funnel cart stateful DBs (mysql/postgres
            single-PVC `strategy:Recreate`, redis cache) are LEGITIMATELY
            single-replica — a 2nd replica sharing one RWO PVC corrupts data, and
            MySQL primary-replica is not wired (the generator clamps replicas to
            1). The policy header already names 'explicitly-singleton services
            (databases ...)' as a valid exception, but the only mechanism was a
            namespace list, which can't enumerate the unbounded `org-<uuid>` per-Org
            namespaces. Exclude by the `openova.io/singleton-db: "true"` label the
            funnel DB generator stamps on the Deployment — exempts singletons in
            ANY namespace (current or future) while every other single-replica
            Deployment stays subject to the gate. Mirrors the cnpg.io/cluster
            label-exempt on the backup-configured policy (#3971). Operators can
            disable via .Values.compliancePolicies.multiReplica.excludeSingletonDB.
          */}}
          {{- if .Values.compliancePolicies.multiReplica.excludeSingletonDB }}
          - resources:
              selector:
                matchLabels:
                  openova.io/singleton-db: "true"
          {{- end }}
      validate:
        message: >-
          {{ `{{request.object.kind}}/{{request.object.metadata.name}}` }} declares
          fewer than 2 replicas. Drainability requires spec.replicas >= 2 so
          voluntary disruptions can keep at least one replica serving traffic.
          Bump spec.replicas, exempt this workload by adding its namespace to
          .Values.compliancePolicies.multiReplica.excludeNamespaces, or — for a
          deliberate single-replica stateful singleton (database/cache) — label
          it `openova.io/singleton-db: "true"`.
        pattern:
          spec:
            replicas: ">=2"
{{- end -}}
