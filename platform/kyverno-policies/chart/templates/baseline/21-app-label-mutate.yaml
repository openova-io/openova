{{/*
G98 (Refs #2644, 2026-06-01) — Auto-stamp `catalyst.openova.io/application`
label on Pods cluster-wide.

ROOT CAUSE this policy fixes:
  The Compliance scorecard's per-Application rollup (catalyst-api
  handler/compliance.go aggregating per-resource verdict rows into a
  Score per Application) requires every Pod to carry the
  `catalyst.openova.io/application=<app-name>` label. Most Helm
  charts upstream (gitea, harbor, openbao, grafana, etc.) don't stamp
  this label — they only stamp standard `app.kubernetes.io/instance`.
  Without app-label, the aggregation can only emit `sovereign`-scope
  rollups; per-Application drill-down is blank.

CANONICAL FIX (MUTATE, not VALIDATE):
  Kyverno MUTATE policy that copies `app.kubernetes.io/instance` into
  `catalyst.openova.io/application` on Pod CREATE and UPDATE, and on the Pod
  template of the seven controller kinds the legacy Pod rule's autogen
  expanded to (CMP-078; the kinds and the variable `labels` are explained in
  templates/mutate/00-stamp-cilium-enforced-label.yaml). Falls back to
  `app.kubernetes.io/name` when instance is unset. Both source labels
  are the K8s-recommended convention so coverage is broad without
  patching every upstream chart.

  Why MUTATE over VALIDATE:
    A VALIDATE policy would reject Pods missing the label — that
    breaks every existing chart on a fresh prov. MUTATE silently
    enriches; charts continue to install; per-Application rollups
    populate immediately on the next handover.

  Per docs/INVIOLABLE-PRINCIPLES.md #4 the policy is gated by
  `.Values.compliancePolicies.appLabelMutate.enabled` so an operator
  can override per Sovereign.

OPT-OUT (per-Pod): set `catalyst.openova.io/application` to any value
in the Pod spec — the match condition application-label-absent only adds
it when MISSING.

VERIFICATION (post-install):
  kubectl run smoke --image=busybox:1.36 -l app.kubernetes.io/instance=foo --restart=Never -- sleep 60
  kubectl get pod smoke -o jsonpath='{.metadata.labels.catalyst\.openova\.io/application}'
  # → "foo"

Multi-layer RCA per Principle 16:
  TRIGGER: upstream charts don't stamp the catalyst-specific label.
  INCIDENT-MGMT: previous "no rollup data" hidden because per-chart
    PR campaign would have been weeks of churn across N charts.
  DEFENSE: this MUTATE works for every chart at once, including
    future Blueprints, without chart-side cooperation.
  CONTAINMENT: ships as a single Kyverno MutatingPolicy in the
    existing bp-kyverno-policies bundle (no new chart, no new HR).
*/}}
{{- if and (hasKey .Values.compliancePolicies "appLabelMutate") .Values.compliancePolicies.appLabelMutate.enabled -}}
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: app-label-mutate
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: observability
  annotations:
    policies.kyverno.io/title: Auto-stamp catalyst.openova.io/application label
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: >-
      MUTATE policy: on Pod CREATE, copy app.kubernetes.io/instance into
      catalyst.openova.io/application when the latter is missing. Enables
      per-Application compliance rollups for every chart without per-chart
      patches.
spec:
  # Admission only, as the legacy background: false: no background scan and
  # no report results.
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "replicationcontrollers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["cronjobs", "jobs"]
  variables:
    # The labels of the Pod, or of the Pod template of a controller kind.
    - name: labels
      expression: >-
        object.kind == 'Pod' ? object.metadata.?labels.orValue({}) :
        object.kind == 'CronJob' ? object.?spec.?jobTemplate.?spec.?template.?metadata.?labels.orValue({}) :
        object.?spec.?template.?metadata.?labels.orValue({})
    # The legacy rules stamp-from-instance-label and its fallback
    # stamp-from-name-label-fallback: instance, or name when instance is empty.
    - name: application
      expression: >-
        variables.labels[?'app.kubernetes.io/instance'].orValue('') != '' ?
        variables.labels['app.kubernetes.io/instance'] :
        variables.labels[?'app.kubernetes.io/name'].orValue('')
  matchConditions:
    - name: exclude-namespaces
      expression: {{ include "bp-kyverno-policies.excludeNamespacesExpr" .Values.compliancePolicies.appLabelMutate.excludeNamespaces | quote }}
    # Only adds when absent — never overrides an operator-set value.
    - name: application-label-absent
      expression: "!('catalyst.openova.io/application' in variables.labels)"
    - name: source-label-set
      expression: "variables.application != ''"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          object.kind == 'Pod' ?
          Object{metadata: Object.metadata{labels: {"catalyst.openova.io/application": variables.application}}} :
          object.kind == 'CronJob' ?
          Object{spec: Object.spec{jobTemplate: Object.spec.jobTemplate{spec: Object.spec.jobTemplate.spec{template: Object.spec.jobTemplate.spec.template{metadata: Object.spec.jobTemplate.spec.template.metadata{labels: {"catalyst.openova.io/application": variables.application}}}}}}} :
          Object{spec: Object.spec{template: Object.spec.template{metadata: Object.spec.template.metadata{labels: {"catalyst.openova.io/application": variables.application}}}}}
{{- end }}
