{{/*
K2 — networkpolicy-present (security, permissive default).

A workload's namespace must contain at least one NetworkPolicy or
CiliumNetworkPolicy. Without one, all east-west traffic is wide-open
within the namespace (default-allow). Industry consensus is to enforce
a default-deny baseline + explicit allow rules per workload.

This policy fires on Namespace creation/update — two lookups
(resource.List) list the NetworkPolicies and CiliumNetworkPolicies of the
namespace, and it denies when both lists are empty.
Per-workload coverage (does any policy actually select
THIS Pod) is inspectable but expensive — deferred to W2 evaluator.

Default mode permissive per design §4.3.

A ValidatingPolicy of policies.kyverno.io since CMP-064 (the legacy
ClusterPolicy of the same name before); tests/networkpolicy-present holds its
suite.
*/}}
{{- if .Values.compliancePolicies.networkpolicyPresent.enabled -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: networkpolicy-present
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: security
  annotations:
    policies.kyverno.io/title: Namespaces must declare at least one NetworkPolicy
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Namespaces must contain at least one NetworkPolicy or
      CiliumNetworkPolicy so east-west traffic is mediated.
spec:
  validationActions: {{ include "bp-kyverno-policies.actions" (dict "ctx" . "policy" .Values.compliancePolicies.networkpolicyPresent.action) }}
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    # The policy judges Namespaces, so the list excludes them by name, as the
    # legacy rule's exclude by names did.
    - name: exclude-namespaces
      expression: "!(object.metadata.name in [{{ range $i, $ns := .Values.compliancePolicies.networkpolicyPresent.excludeNamespaces }}{{ if $i }}, {{ end }}'{{ $ns }}'{{ end }}])"
  {{- /*
    The CiliumNetworkPolicy lookup needs read on cilium.io, which
    templates/rbac-cilium-read.yaml grants (#5505); Kyverno's own roles cover
    networking.k8s.io. tests/apicall-rbac-correspondence.sh checks both.
    Without the Cilium kind the list fails and the result is an error, as the
    legacy apiCall's was.
  */}}
  variables:
    - name: networkPolicies
      expression: >-
        dyn(resource.List("networking.k8s.io/v1", "networkpolicies",
        object.metadata.name).items)
    - name: ciliumNetworkPolicies
      expression: >-
        dyn(resource.List("cilium.io/v2", "ciliumnetworkpolicies",
        object.metadata.name).items)
  validations:
    - expression: "size(variables.networkPolicies) > 0 || size(variables.ciliumNetworkPolicies) > 0"
      messageExpression: >-
        'Namespace ' + object.metadata.name + ' contains no NetworkPolicy and
        no CiliumNetworkPolicy. Add at least one policy to mediate east-west
        traffic.'
{{- end -}}
