{{/*
K1 — probes-present (resilience, ENFORCING default).

Every container in a Deployment / StatefulSet / DaemonSet must declare
both livenessProbe AND readinessProbe. Without these, kubelet can't
detect a wedged process and Service can't gate traffic during startup,
which routinely produces 503 cascades during rollouts.

Default mode enforcing per design §4.3 — this is one of the rules with
near-universal industry consensus, so blocking new violators is safer
than auditing.

Init containers and ephemeralContainers are NOT subject to this rule
(K8s API doesn't accept liveness/readiness probes on initContainers).
*/}}
{{- if .Values.compliancePolicies.probesPresent.enabled -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: probes-present
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: resilience
  annotations:
    policies.kyverno.io/title: Containers must declare liveness and readiness probes
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every primary container in a Deployment / StatefulSet / DaemonSet
      must declare both livenessProbe and readinessProbe. Without
      probes, kubelet can't detect a wedged process and Service can't
      gate traffic during startup.
spec:
  validationFailureAction: {{ include "bp-kyverno-policies.action" (dict "ctx" . "policy" .Values.compliancePolicies.probesPresent.action) }}
  background: true
  rules:
    - name: containers-must-have-liveness-and-readiness
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
      exclude:
        any:
          - resources:
              namespaces:
                {{- range $ns := .Values.compliancePolicies.probesPresent.excludeNamespaces }}
                - {{ $ns }}
                {{- end }}
      validate:
        message: >-
          Every container in
          {{ `{{request.object.kind}}/{{request.object.metadata.name}}` }} must
          declare both livenessProbe and readinessProbe.
        # The prior `validate.pattern` form `livenessProbe: {"?{}": "?*"}`
        # required a probe SUB-KEY literally matching the glob `?{}` — no real
        # probe field (httpGet / exec / tcpSocket / initialDelaySeconds …) can
        # ever match that, so the pattern denied EVERY workload (it never
        # admitted one — undetected because no gated chart reached admission).
        #
        # `livenessProbe: "?*"` does NOT work either: the `?*` wildcard only
        # matches NON-EMPTY SCALAR values, while `livenessProbe` is an OBJECT
        # (httpGet / exec / …) — empirically verified in the kind+kyverno
        # v1.18 harness that `"?*"` against an object field denies even a
        # compliant container.
        #
        # The robust, probe-handler-agnostic check is `validate.deny` with a
        # JMESPath count: "the number of containers that DECLARE the probe must
        # equal the total container count" (i.e. ALL containers carry it).
        # `containers[?livenessProbe]` filters to containers where the field is
        # present/truthy. This works for any handler type and autogen-expands
        # cleanly to `spec.template.spec.containers` for the matched workload
        # kinds. Empirically green across both directions in the harness.
        deny:
          conditions:
            any:
              - key: "{{ `{{ request.object.spec.template.spec.containers[?livenessProbe] | length(@) }}` }}"
                operator: NotEquals
                value: "{{ `{{ request.object.spec.template.spec.containers | length(@) }}` }}"
              - key: "{{ `{{ request.object.spec.template.spec.containers[?readinessProbe] | length(@) }}` }}"
                operator: NotEquals
                value: "{{ `{{ request.object.spec.template.spec.containers | length(@) }}` }}"
{{- end -}}
