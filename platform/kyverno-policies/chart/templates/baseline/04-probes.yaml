{{/*
K1 — probes-present (resilience, ENFORCING default).

Every container in a Deployment / StatefulSet / DaemonSet must declare
both livenessProbe AND readinessProbe. Without these, kubelet can't
detect a wedged process and Service can't gate traffic during startup,
which routinely produces 503 cascades during rollouts.

Default mode enforcing per design §4.3 — this is one of the rules with
near-universal industry consensus, so blocking new violators is safer
than auditing.

Init containers and ephemeralContainers are NOT subject to this rule
(K8s API doesn't accept liveness/readiness probes on initContainers).

A ValidatingPolicy of policies.kyverno.io since CMP-063 (the legacy
ClusterPolicy of the same name before); tests/probes-present holds its
suite.
*/}}
{{- if .Values.compliancePolicies.probesPresent.enabled -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: probes-present
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: resilience
  annotations:
    policies.kyverno.io/title: Containers must declare liveness and readiness probes
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every primary container in a Deployment / StatefulSet / DaemonSet
      must declare both livenessProbe and readinessProbe. Without
      probes, kubelet can't detect a wedged process and Service can't
      gate traffic during startup.
spec:
  validationActions: {{ include "bp-kyverno-policies.actions" (dict "ctx" . "policy" .Values.compliancePolicies.probesPresent.action) }}
  evaluation:
    background:
      enabled: true
  {{- /*
    A probe requirement judges what a workload declares when it is created
    or changed; it cannot judge its removal. Proven on hw307 (candidate
    rc/20261119T053558Z-6972370): Crossplane 2.4.3's deactivation of the old
    provider revision failed with "cannot delete provider package deployment
    ... probes-present" while the legacy rule also judged DELETE, and the old
    pod kept running. The resource rules match CREATE and UPDATE only, so a
    DELETE is never judged.
  */}}
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
  matchConditions:
    - name: exclude-namespaces
      expression: {{ include "bp-kyverno-policies.excludeNamespacesExpr" .Values.compliancePolicies.probesPresent.excludeNamespaces | quote }}
  validations:
    # A probe counts when it is a non-empty object, whatever its handler
    # (httpGet, exec, tcpSocket, grpc); an empty `{}` does not count, as the
    # legacy filter `containers[?livenessProbe]` did not count it (measured).
    - expression: >-
        object.spec.template.spec.containers.all(c,
        size(c.?livenessProbe.orValue({})) > 0 && size(c.?readinessProbe.orValue({})) > 0)
      messageExpression: >-
        'Every container in ' + object.kind + '/' + object.metadata.name +
        ' must declare both livenessProbe and readinessProbe.'
{{- end -}}
