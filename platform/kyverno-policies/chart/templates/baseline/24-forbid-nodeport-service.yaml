{{/*
K24 — §854 NodePort AUDIT guard (#5088).

THE MANDATE
===========
Founder, verbatim (§854, 2026-07-03): "YOU CAN NEVER EVER USE NODEPORT EVEN FOR
TESTING PURPOSE!!! ... FUCK THE NODEPORTS!!!" — the #1 ABSOLUTE ban. The gateway
is served DIRECT (cilium LB-IPAM VIP / shared-EIP, or Local-ETP + hostPort on the
hostNetwork cilium-envoy pods → node:443/:80), never a nodePort. A `type=NodePort`
Service — and a `type=LoadBalancer` Service that SILENTLY allocates nodePorts
(the `allocateLoadBalancerNodePorts` default is true) — both violate §854.

WHY THIS POLICY EXISTS
======================
§854 was enforced ONLY at chart-render time (per-chart `fail` guards in Helm
templates). Nothing caught a runtime / non-chart NodePort applied straight to a
live cluster. A live §854 walk (#5088, 2026-07-15) found 4 pre-existing NodePort
Services on the mothership that the render-time guards never saw. This Kyverno
policy closes that gap: it denies every `type=NodePort` Service, and every
`type=LoadBalancer` Service that does not explicitly set
`allocateLoadBalancerNodePorts: false`, cluster-wide, at admission AND in
background scans (PolicyReport rows → Compliance Dashboard).

WHY THE ACTION IS A FIXED Deny (NOT the bootstrap-window helper)
=================================================================
A NodePort is forbidden without exception, so the ban never weakens: its
validationActions are hardcoded `[Deny]`, as forbid-local-path-storage's are.
It started in Audit (#5088) and was flipped to Enforce once the live
violations were cleared and the Audit report showed zero false positives
(#5491); until CMP-079 the bootstrap window still held it at Audit. It no
longer does: the kit's workloads pass it (tools/guards/cmd/kit-policies), and
the cert-manager solver is carved out below. The value
`compliancePolicies.forbidNodePortService.action` stays in values.yaml (the
local pack's policy values set it) and this template does not read it.

CARVE-OUT — cert-manager ACME HTTP-01 solver Services
=====================================================
cert-manager's built-in HTTP-01 solver creates a `type=NodePort` Service per
in-flight ACME challenge, labelled `acme.cert-manager.io/http01-solver: "true"`
and named `cm-acme-http-solver-<rand>`. On the HAPPY path they GC when the
challenge completes — but that is a conditional, not a guarantee: when a
challenge never completes, the solver Service persists indefinitely (measured
live 2026-08-01: six solvers standing 70 days on stuck Certificates — #5561).
TRANSIENCE IS THE ONLY JUSTIFICATION for this carve-out, so a solver that is
not transient is NOT excused. Kyverno match/exclude cannot express age, which
is why the exclusion here is label-scoped; the age bound lives in
`scripts/check-live-nodeports.sh`, whose classifier splits TRANSIENT (younger
than the threshold) from STUCK (past it, or unknown age — fail-closed), and
STUCK-in-our-namespaces is FATAL. A clean PolicyReport from this policy is
therefore NOT evidence the solver class is healthy — only the live guard's
TRANSIENT/STUCK split is. The §854-clean long-term fix is to switch issuers to
the DNS-01 / gateway-API HTTP-01 solver so NO NodePort solver is ever created
(#5561 finding 2 tracks the http01-enabled default); until then this carve-out
keeps THIS policy's report actionable while the live guard carries the
stuck-solver signal.

Operator override: `--set compliancePolicies.forbidNodePortService.enabled=false`
disables it entirely; `.excludeNamespaces` adds per-namespace escapes (default
empty — NodePorts are forbidden EVERYWHERE, including kube-system, per §854).

A ValidatingPolicy of policies.kyverno.io since CMP-079 (the legacy
ClusterPolicy of the same name before, with one rule per validation);
tests/forbid-nodeport-service holds its suite.
*/}}
{{- if .Values.compliancePolicies.forbidNodePortService.enabled -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forbid-nodeport-service
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: network-exposure
  annotations:
    policies.kyverno.io/title: Forbid NodePort Services (§854)
    policies.kyverno.io/category: catalyst-network-exposure
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Service
    policies.kyverno.io/description: >-
      §854 (founder #1 ABSOLUTE ban): a Service must never be type=NodePort, and
      a type=LoadBalancer Service must set allocateLoadBalancerNodePorts=false so
      it does not silently allocate nodePorts. The gateway is served DIRECT
      (cilium LB-IPAM VIP / shared-EIP, or Local-ETP + hostPort), never a
      nodePort. Ships Audit; Enforce is the deliberate follow-up (#5088).
      cert-manager HTTP-01 solver Services are carved out.
spec:
  # HARDCODED Deny — NOT the bootstrap-window helper. See the header comment.
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  matchConditions:
    - name: exclude-namespaces
      expression: {{ include "bp-kyverno-policies.excludeNamespacesExpr" .Values.compliancePolicies.forbidNodePortService.excludeNamespaces | quote }}
    # The cert-manager ACME HTTP-01 solver, by its LABEL ONLY: a solver-shaped
    # name is no carve-out (#5564). Only a labelled NodePort is skipped, as the
    # legacy NodePort rule skipped it; a labelled LoadBalancer is still judged.
    - name: exclude-acme-http01-solver
      expression: >-
        !(object.spec.?type.orValue('') == 'NodePort' &&
        object.metadata.?labels.orValue({})[?'acme.cert-manager.io/http01-solver'].orValue('') == 'true')
  validations:
    # ── no Service may be type=NodePort ───────────────────────────────────
    - expression: "object.spec.?type.orValue('') != 'NodePort'"
      message: >-
        This Service is type=NodePort — FORBIDDEN by §854 (founder #1 ABSOLUTE
        ban). Never use a NodePort, not even for testing. Expose it DIRECT
        instead: a ClusterIP Service fronted by a gateway HTTPRoute/TCPRoute,
        or the cilium LB-IPAM VIP / shared-EIP (lbipam.cilium.io/sharing-key).
        See #5088.
    # ── a LoadBalancer Service must NOT allocate nodePorts ────────────────
    #    allocateLoadBalancerNodePorts defaults to true, so an unset one fails.
    - expression: >-
        object.spec.?type.orValue('') != 'LoadBalancer' ||
        object.spec.?allocateLoadBalancerNodePorts.orValue(true) == false
      message: >-
        This Service is type=LoadBalancer without
        allocateLoadBalancerNodePorts=false — it silently allocates a nodePort
        per port, violating §854. Set `spec.allocateLoadBalancerNodePorts:
        false` so no nodePort is opened. See #5088.
{{- end -}}
