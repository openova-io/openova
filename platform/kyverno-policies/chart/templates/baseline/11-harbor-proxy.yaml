{{/*
K1 — harbor-proxy-pull (governance, ENFORCING default).

Container images must be pulled through the Sovereign's local Harbor
proxy — references like `harbor.<sovereign-domain>/proxy-ghcr/...`,
`harbor.<sovereign-domain>/proxy-dockerhub/...`, etc. Direct pulls from
ghcr.io, docker.io, quay.io, etc. break the air-gap-ready posture and
the per-Sovereign vulnerability scanning gate.

The exact regex for the allowed registry prefix is operator-configurable
via .Values.compliancePolicies.harborProxyPull.allowedRegistryRegex
(per docs/INVIOLABLE-PRINCIPLES.md #4) — different Sovereigns are
deployed at different domains, so hardcoding `harbor.omantel.openova.io`
would fail every other Sovereign.

Default mode enforcing per design §4.3. Operators flip to Audit while
seeding the Harbor proxy on a fresh Sovereign and back to Enforce
after the proxy is warm.
*/}}
{{- if .Values.compliancePolicies.harborProxyPull.enabled -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: harbor-proxy-pull
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: governance
  annotations:
    policies.kyverno.io/title: Container images must pull through the Sovereign Harbor proxy
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Container images must reference a Sovereign-local Harbor proxy
      registry. Operator configures the allowed regex via
      .Values.compliancePolicies.harborProxyPull.allowedRegistryRegex.
spec:
  validationFailureAction: {{ include "bp-kyverno-policies.action" (dict "ctx" . "policy" .Values.compliancePolicies.harborProxyPull.action) }}
  background: true
  rules:
    - name: image-must-be-from-harbor-proxy
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                {{- range $ns := .Values.compliancePolicies.harborProxyPull.excludeNamespaces }}
                - {{ $ns }}
                {{- end }}
      validate:
        message: >-
          Container image does not match the allowed Harbor-proxy regex
          {{ .Values.compliancePolicies.harborProxyPull.allowedRegistryRegex | quote }}.
          Re-tag the image to pull through the Sovereign's local Harbor
          proxy (e.g. harbor.<sovereign-domain>/proxy-ghcr/...).
        foreach:
          # Wave 5.97 nil-safety fix: filter to containers with non-nil .image
          # to keep JMESPath regex_match from erroring on ephemeralContainers /
          # mutating-webhook-injected sidecars that admission-time lack .image.
          # Erroring policy + Kyverno admission webhook failurePolicy=Fail
          # blocked ALL pod creation cluster-wide pre-fix (verified hw02
          # bbd373de 2026-05-25 → 18 policies tripped same JMESPath nil bug).
          #
          # Wave 5.151 (hw30 #25 Pillar 5 fix-forward 2026-05-27): the prior
          # [?image] filter was INCOMPLETE — Pillar 5 cutover step 7
          # (cutover-catalyst-api-env-patch Job) failed with `regex_match
          # JMESPath query failed: Invalid type for: <nil>` when patching the
          # catalyst-api Deployment env. Some container in the Deployment
          # (probably an init container or admission-time-injected sidecar)
          # has an image that the [?image] truthiness filter doesn't catch
          # — e.g. an empty-string image OR a missing image on initContainers
          # which weren't in the list expression at all.
          #
          # G19 (Refs #2563, 2026-05-28): the previous cut used JMESPath
          # `concat(@, ...)` to union containers + initContainers, but
          # Kyverno's bundled go-jmespath does NOT include the `concat`
          # function — every admission errored with:
          #   "failed to evaluate list: JMESPath query failed: unknown
          #    function: concat"
          # → policy.failurePolicy=Fail → catalyst-api Deployment patches
          # rejected cluster-wide → bp-catalyst-platform stuck in Helm
          # rollback failure. Caught on hw46 multi-region (deployment
          # ba79375bdd69c46c) blocking bp-continuum + bp-sandbox cascade.
          #
          # Fix: split into TWO foreach entries — one for containers, one
          # for initContainers. No concat needed; each foreach iterates
          # its own list. Preconditions still skip empty/nil images.
          - list: "(request.object.spec.containers || request.object.spec.template.spec.containers || [])[?image]"
            preconditions:
              all:
                - key: '{{ `{{ element.image || ` }}{{ printf "%q" "" }}{{ ` }}` }}'
                  operator: NotEquals
                  value: ""
            deny:
              conditions:
                all:
                  # G40 (Refs #2594, 2026-05-29): inline `|| ""` nil-guard
                  # on element.image. Kyverno's variable-substitution pass for
                  # the deny clause runs BEFORE the precondition gate fires —
                  # when element.image is nil (e.g. mid-Helm-rollback pod-
                  # template-rewrite on catalyst-api: hw55 v7 21:10Z), regex_match
                  # errors with "Invalid type for: <nil>, expected: string"
                  # and the whole rule fails, NOT just this element. The
                  # precondition above stays as defense-in-depth but the
                  # inline guard ensures regex_match always receives a string.
                  # Empty string never matches the regex → condition stays
                  # `false` → deny.value=false → no spurious deny.
                  # Same nil-handling class as G19 #2563 (concat).
                  - key: '{{ printf `{{ regex_match(%q, element.image || %q) }}` .Values.compliancePolicies.harborProxyPull.allowedRegistryRegex "" }}'
                    operator: Equals
                    value: false
          - list: "(request.object.spec.initContainers || request.object.spec.template.spec.initContainers || [])[?image]"
            preconditions:
              all:
                - key: '{{ `{{ element.image || ` }}{{ printf "%q" "" }}{{ ` }}` }}'
                  operator: NotEquals
                  value: ""
            deny:
              conditions:
                all:
                  # G40 (Refs #2594, 2026-05-29): inline `|| ""` nil-guard
                  # on element.image. Kyverno's variable-substitution pass for
                  # the deny clause runs BEFORE the precondition gate fires —
                  # when element.image is nil (e.g. mid-Helm-rollback pod-
                  # template-rewrite on catalyst-api: hw55 v7 21:10Z), regex_match
                  # errors with "Invalid type for: <nil>, expected: string"
                  # and the whole rule fails, NOT just this element. The
                  # precondition above stays as defense-in-depth but the
                  # inline guard ensures regex_match always receives a string.
                  # Empty string never matches the regex → condition stays
                  # `false` → deny.value=false → no spurious deny.
                  # Same nil-handling class as G19 #2563 (concat).
                  - key: '{{ printf `{{ regex_match(%q, element.image || %q) }}` .Values.compliancePolicies.harborProxyPull.allowedRegistryRegex "" }}'
                    operator: Equals
                    value: false
{{- end -}}
