{{/*
K1 - harbor-proxy-pull (governance, ENFORCING default).

Container images must be pulled through the Sovereign's local Harbor
proxy. The allowed globs are operator-configurable via
.Values.compliancePolicies.harborProxyPull.allowedImagePatterns.
Default glob "harbor.STAR/proxy-STAR/STAR" matches every Sovereign's
proxy paths and is future-proof for new proxy sources.

G60 (Refs #2611, 2026-05-30): RE-ARCHITECTED. 7 prior rounds (G19
through G58) patched the regex_match + foreach + element.X expression
without ever asking the architectural question. ALL hit Kyverno's
JMESPath nil-substitution edge cases somewhere (empty initContainers,
sidecar injection, autogen Deployment variant, autogen=none + Pod
CREATE). G60 moved to the legacy kind's validate.anyPattern + glob, with
one rule per workload PATH-SHAPE (Pod / template-bearing / CronJob,
2026-06-11) because autogen did not path-expand anyPattern.

A ValidatingPolicy of policies.kyverno.io since CMP-063 (the legacy
ClusterPolicy of the same name before); tests/harbor-proxy-pull holds its
suite. The check is the one anyPattern made: the object passes when ONE
allowed pattern matches EVERY image of its containers and init containers.
A pattern is a glob as the legacy kind read it: `*` is any run of
characters (`/` included), `?` one character, and `|` separates
alternatives of which one must match. The chart turns each into anchored
regular expressions at render time; a pattern with an operator of the
legacy pattern language (`&`, or an alternative that starts with `!`, `<`
or `>`) has no such reading and fails the render.
*/}}
{{- if .Values.compliancePolicies.harborProxyPull.enabled -}}
{{- $patterns := list }}
{{- range $pat := .Values.compliancePolicies.harborProxyPull.allowedImagePatterns }}
{{- $alternatives := list }}
{{- range $glob := splitList "|" $pat }}
{{- $glob = trimAll " " $glob }}
{{- if or (contains "&" $glob) (hasPrefix "!" $glob) (hasPrefix "<" $glob) (hasPrefix ">" $glob) }}
{{- fail (printf "compliancePolicies.harborProxyPull.allowedImagePatterns: %q is not a glob (an operator of the legacy pattern language)" $pat) }}
{{- end }}
{{- $alternatives = append $alternatives (printf "r'^%s$'" (regexQuoteMeta $glob | replace "\\*" ".*" | replace "\\?" ".")) }}
{{- end }}
{{- $patterns = append $patterns (printf "[%s]" (join ", " $alternatives)) }}
{{- end }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: harbor-proxy-pull
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: governance
  annotations:
    # Autogen OFF: each workload PATH-SHAPE is read at its own path.
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Container images must pull through the Sovereign Harbor proxy
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Container images must reference a Sovereign-local Harbor proxy
      registry. Operator configures the allowed glob via
      .Values.compliancePolicies.harborProxyPull.allowedImagePattern.
spec:
  validationActions: {{ include "bp-kyverno-policies.actions" (dict "ctx" . "policy" .Values.compliancePolicies.harborProxyPull.action) }}
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    {{- /*
      2026-06-13: per-policy extra excludes (NOT the shared anchor).
      bp-powerdns pulls pdns-auth-50 + dnsdist-19 from raw docker.io
      because the proxy-docker Harbor project is not bootstrap-pullable
      on a fresh prov (#3380-D's reroute wedged hw131 + hw132).
      powerdns is a trusted first-party bootstrap component; exempt it
      from the image-source glob HERE only — it stays subject to every
      other policy. Same shape as flux-managed.extraExcludeNamespaces.
    */}}
    - name: exclude-namespaces
      expression: {{ include "bp-kyverno-policies.excludeNamespacesExpr" (concat .Values.compliancePolicies.harborProxyPull.excludeNamespaces .Values.compliancePolicies.harborProxyPull.extraExcludeNamespaces) | quote }}
    {{- /*
      #3859 (2026-06-19, first proven walkorg on hw167): a per-Org CUSTOMER
      vCluster syncs its OWN system pods (coredns, then the customer's apps)
      DOWN to its host namespace (`<svc>-x-kube-system-x-vcluster`). Those
      upstream images (coredns, the in-vCluster k8s payload) are NOT pulled
      through the Sovereign Harbor, so harbor-proxy-pull (Enforce) denies the
      synced pod → the vCluster never finishes bringing up its control plane
      → the customer Org stays VClusterProvisioning → #3376 funnel can never
      reach ACTIVE. Platform vClusters (mgmt/rtz/dmz) escape via the static
      excludeNamespaces; customer Org namespaces are slug-named (UNBOUNDED),
      so exempt by the `openova.io/organization` label the org-controller
      stamps on every per-Org vCluster namespace. The image-supply-chain
      governance for the CUSTOMER's chosen apps is enforced INSIDE the
      vCluster's own policy set, not on the host syncer shadow Pods.
    */}}
    - name: exclude-organization-namespaces
      expression: "!('openova.io/organization' in namespaceObject.?metadata.?labels.orValue({}))"
  variables:
    # The Pod spec at the real path of each kind.
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    # Every image of the containers and init containers.
    - name: images
      expression: >-
        variables.podSpec.containers.map(c, c.?image.orValue('')) +
        variables.podSpec.?initContainers.orValue([]).map(c, c.?image.orValue(''))
    # One list of anchored expressions per allowed pattern, one expression
    # per `|` alternative.
    - name: patterns
      expression: >-
        [{{ join ", " $patterns }}]
  validations:
    - expression: >-
        variables.patterns.exists(p, variables.images.all(i, p.exists(r, i.matches(r))))
      message: "Container image does not match any allowed Harbor-source glob (proxy-cache `*/proxy-*/*` or native-push `*/openova-io/*`). Re-tag the image to pull through the Sovereign's local Harbor (e.g. registry.<sov-fqdn>/proxy-ghcr/... or registry.<sov-fqdn>/openova-io/openova/<svc>:<tag>)."
{{- end -}}
