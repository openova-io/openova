{{/*
K1 — harbor-proxy-pull (governance, ENFORCING default).

Container images must be pulled through the Sovereign's local Harbor
proxy — references like `harbor.<sovereign-domain>/proxy-ghcr/...`,
`harbor.<sovereign-domain>/proxy-dockerhub/...`, etc. Direct pulls from
ghcr.io, docker.io, quay.io, etc. break the air-gap-ready posture and
the per-Sovereign vulnerability scanning gate.

The Harbor-proxy glob is operator-configurable via
.Values.compliancePolicies.harborProxyPull.allowedImagePattern
(per docs/INVIOLABLE-PRINCIPLES.md #4) — different Sovereigns deploy at
different domains; the default glob `harbor.*/proxy-*/*` matches every
Sovereign's proxy paths and is future-proof for new proxy sources.

Default mode enforcing per design §4.3. Operators flip to Audit while
seeding the Harbor proxy on a fresh Sovereign and back to Enforce
after the proxy is warm.
*/}}
{{/*
G60 (Refs #2611, 2026-05-30): RE-ARCHITECTED. 7 prior rounds (G19→G40→
G45→G51→G55→G58) patched the regex_match+foreach+element.X expression
without ever asking the architectural question. ALL hit Kyverno's
JMESPath nil-substitution edge cases somewhere (empty initContainers,
sidecar injection, autogen Deployment variant, autogen=none + Pod
CREATE). Conclusion in retrospective: `foreach + regex_match +
element.X` is architecturally incompatible with Kyverno 1.18's image-
context extraction across enough container-spec edge cases that no
expression-level tweak converges.

G60 drops the foreach + regex_match + element.X primitive entirely.
Replaces with Kyverno's CANONICAL `validate.pattern` + glob — the
oldest + most stable Kyverno primitive. Pattern validation uses
request.object-direct data (always populated server-side), no
JMESPath substitution path, no element.X nil race possible. Autogen
expands `containers.image` glob cleanly to `template.spec.containers.
image` for Deployment/StatefulSet/etc.

Trade-off: glob-only (not full regex). Glob `harbor.*/proxy-*/*` is
functionally equivalent to the original regex `^harbor\..+/proxy-
(ghcr|dockerhub|quay|registry-1\.docker\.io)/.*` AND future-proof for
new proxy sources (kyverno cosign mirror, new registry, etc.). The
4-explicit-source enumeration was never operationally desired — it
was an artifact of regex authoring.
*/}}
{{- if .Values.compliancePolicies.harborProxyPull.enabled -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: harbor-proxy-pull
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: governance
  annotations:
    policies.kyverno.io/title: Container images must pull through the Sovereign Harbor proxy
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Container images must reference a Sovereign-local Harbor proxy
      registry. Operator configures the allowed glob via
      .Values.compliancePolicies.harborProxyPull.allowedImagePattern.
spec:
  validationFailureAction: {{ include "bp-kyverno-policies.action" (dict "ctx" . "policy" .Values.compliancePolicies.harborProxyPull.action) }}
  background: true
  rules:
    - name: image-must-be-from-harbor-proxy
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                {{- range $ns := .Values.compliancePolicies.harborProxyPull.excludeNamespaces }}
                - {{ $ns }}
                {{- end }}
      validate:
        message: >-
          Container image does not match the allowed Harbor-proxy glob
          {{ .Values.compliancePolicies.harborProxyPull.allowedImagePattern | default "harbor.*/proxy-*/*" | quote }}.
          Re-tag the image to pull through the Sovereign's local Harbor
          proxy (e.g. harbor.<sovereign-domain>/proxy-ghcr/...).
        pattern:
          spec:
            # =(initContainers): match-if-exists; if Pod has no
            # initContainers, this clause is a no-op (Kyverno pattern
            # anchor semantics — `=(<key>)` is "conditional-on-presence").
            =(initContainers):
              - image: {{ .Values.compliancePolicies.harborProxyPull.allowedImagePattern | default "harbor.*/proxy-*/*" | quote }}
            containers:
              - image: {{ .Values.compliancePolicies.harborProxyPull.allowedImagePattern | default "harbor.*/proxy-*/*" | quote }}
{{- end -}}
