{{/*
K1 — harbor-proxy-pull (governance, ENFORCING default).

Container images must be pulled through the Sovereign's local Harbor
proxy — references like `harbor.<sovereign-domain>/proxy-ghcr/...`,
`harbor.<sovereign-domain>/proxy-dockerhub/...`, etc. Direct pulls from
ghcr.io, docker.io, quay.io, etc. break the air-gap-ready posture and
the per-Sovereign vulnerability scanning gate.

The exact regex for the allowed registry prefix is operator-configurable
via .Values.compliancePolicies.harborProxyPull.allowedRegistryRegex
(per docs/INVIOLABLE-PRINCIPLES.md #4) — different Sovereigns are
deployed at different domains, so hardcoding `harbor.omantel.openova.io`
would fail every other Sovereign.

Default mode enforcing per design §4.3. Operators flip to Audit while
seeding the Harbor proxy on a fresh Sovereign and back to Enforce
after the proxy is warm.
*/}}
{{- if .Values.compliancePolicies.harborProxyPull.enabled -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: harbor-proxy-pull
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: governance
  annotations:
    policies.kyverno.io/title: Container images must pull through the Sovereign Harbor proxy
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Container images must reference a Sovereign-local Harbor proxy
      registry. Operator configures the allowed regex via
      .Values.compliancePolicies.harborProxyPull.allowedRegistryRegex.
spec:
  validationFailureAction: {{ include "bp-kyverno-policies.action" (dict "ctx" . "policy" .Values.compliancePolicies.harborProxyPull.action) }}
  background: true
  rules:
    - name: image-must-be-from-harbor-proxy
      match:
        any:
          # G55 (Refs #2605, 2026-05-30): scope to Pod kind ONLY.
          # Kyverno's `images.containers` server-side context auto-
          # populates RELIABLY only for Pod admission. For Deployment/
          # StatefulSet/DaemonSet/Job/CronJob the image-extractor
          # returns entries with nil `.reference` → substitution-
          # before-eval crashes the JMESPath query with
          # "Invalid type for: <nil>". Pod admission is the canonical
          # enforcement boundary: every Deployment/etc. creates Pods
          # that go through the same admission gate, so Pod-level
          # enforcement is fully sufficient + architecturally correct
          # (this is the Kyverno-recommended pattern).
          #
          # Verified live hw63 v15 07:01Z: Pod admission successfully
          # blocked trivy-system/scan-vulnerabilityreport Pod with
          # this exact policy while Deployment/catalyst-api patch
          # failed with nil-JMESPath error. G19/G40/G45/G51 all tried
          # to patch the symptom on the broader match set; G55 fixes
          # the architectural mismatch.
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                {{- range $ns := .Values.compliancePolicies.harborProxyPull.excludeNamespaces }}
                - {{ $ns }}
                {{- end }}
      validate:
        message: >-
          Container image does not match the allowed Harbor-proxy regex
          {{ .Values.compliancePolicies.harborProxyPull.allowedRegistryRegex | quote }}.
          Re-tag the image to pull through the Sovereign's local Harbor
          proxy (e.g. harbor.<sovereign-domain>/proxy-ghcr/...).
        foreach:
          # G51 (Refs #2603, 2026-05-30): switch from
          # `request.object.spec.containers.*.image` (raw resource path) +
          # `not_null(element.image, "")` wrapper to `images.containers.*`
          # (Kyverno-populated server-side context). The raw path triggers
          # Kyverno's variable-substitution-before-JMESPath-eval bug:
          # `element.image` is rendered as literal `<nil>` when nil, which
          # the JMESPath parser rejects regardless of `not_null` wrapper
          # (Kyverno's go-jmespath does not support `not_null` as a
          # substitution-time function — it gets evaluated AFTER nil
          # substitution corrupts the expression).
          #
          # `images.containers` / `images.initContainers` are populated by
          # Kyverno's image-extractor server-side: each entry is a struct
          # with `.reference` (full OCI ref string), `.registry`, `.path`,
          # `.name`, `.tag`, `.digest`. Always strings, never Go-nil.
          # Entries for containers with empty image are simply absent from
          # the array (filtered server-side), not present-with-nil.
          #
          # `values(images.containers || `{}`)` defaults to empty object
          # when no containers, yielding empty iteration → no admission
          # error on resources without containers (e.g. mid-Helm-template-
          # rewrite, mutating-webhook injection states).
          #
          # Why G19 → G40 → G45 all failed: each tried to patch the symptom
          # (nil element.image) without escaping the raw-resource +
          # substitution path. G51 changes the data source to one that's
          # guaranteed-non-nil at substitution time.
          - list: "values(images.containers || `{}`)"
            deny:
              conditions:
                all:
                  - key: '{{ printf `{{ regex_match(%q, element.reference) }}` .Values.compliancePolicies.harborProxyPull.allowedRegistryRegex }}'
                    operator: Equals
                    value: false
          - list: "values(images.initContainers || `{}`)"
            deny:
              conditions:
                all:
                  - key: '{{ printf `{{ regex_match(%q, element.reference) }}` .Values.compliancePolicies.harborProxyPull.allowedRegistryRegex }}'
                    operator: Equals
                    value: false
{{- end -}}
