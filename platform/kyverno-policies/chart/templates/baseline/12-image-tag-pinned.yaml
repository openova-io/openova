{{/*
K1 — image-tag-pinned (governance, ENFORCING default).

Container images must be tagged with a non-`:latest`, non-empty tag.
`:latest` (or no tag, which K8s treats as `:latest`) means the running
bytes can change underneath any pod restart, breaking the
SHA-pinned audit-trail contract in CLAUDE.md §4a.

G60 (Refs #2611, 2026-05-30): RE-ARCHITECTED. See 11-harbor-proxy.yaml
G60 commentary for the full rationale — drops the foreach + regex_match
+ element.X primitive (which hit Kyverno's JMESPath nil-substitution
edge cases across 7 rounds) and replaces with canonical
`validate.pattern` + Kyverno's NEGATIVE-PATTERN anchor `X!(<value>)`
("must NOT equal"). Pattern validation uses request.object-direct data
(server-side populated, no JMESPath substitution, no element.X nil).

Trade-off: glob-only (not full regex). The original regex enforced
"must NOT end in :latest AND must NOT be tag-less". Glob equivalent
via Kyverno anchor semantics:
  - `X(<image>): "!*:latest"`  (negative anchor — image must NOT match)
  - `X(<image>): "*:*"`        (existence anchor — image MUST have a tag/digest)
*/}}
{{- if .Values.compliancePolicies.imageTagPinned.enabled -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: image-tag-pinned
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: governance
  annotations:
    policies.kyverno.io/title: Container images must be tag-pinned (no :latest)
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Container images must reference an explicit, non-:latest tag (or
      a @sha256: digest). Floating tags break SHA-pinned audit trails
      and reproducibility.
spec:
  validationFailureAction: {{ include "bp-kyverno-policies.action" (dict "ctx" . "policy" .Values.compliancePolicies.imageTagPinned.action) }}
  background: true
  rules:
    - name: image-must-not-be-latest
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                {{- range $ns := .Values.compliancePolicies.imageTagPinned.excludeNamespaces }}
                - {{ $ns }}
                {{- end }}
      validate:
        message: >-
          One or more containers reference an unpinned image (`:latest`
          or no tag/digest). Pin to an explicit tag or @sha256 digest.
        pattern:
          spec:
            # X(<key>): "<glob>" enforces the value to match. Use
            # negative wildcard "!*:latest" to deny :latest images.
            =(initContainers):
              - (image): "!*:latest"
            containers:
              - (image): "!*:latest"
{{- end -}}
