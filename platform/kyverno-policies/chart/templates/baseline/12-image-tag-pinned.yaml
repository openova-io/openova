{{/*
K1 — image-tag-pinned (governance, ENFORCING default).

Container images must be tagged with a non-`:latest`, non-empty tag.
`:latest` (or no tag, which K8s treats as `:latest`) means the running
bytes can change underneath any pod restart, breaking the
SHA-pinned audit-trail contract in CLAUDE.md §4a.

An image is pinned when it carries a `@sha256:<64 hex>` digest, OR a
`:<tag>` in its FINAL path segment (so a bare registry-port colon like
`host:5000/img` does NOT count as a tag), OR a `:<tag>` on a
single-segment image; and it must not end in `:latest`. Every container
and every init container of a Pod, of a Deployment / StatefulSet /
DaemonSet / Job template and of a CronJob's job template is judged, each
kind at its own path (the history of the path shapes, #2611, is in
11-harbor-proxy.yaml).

A ValidatingPolicy of policies.kyverno.io since CMP-063 (the legacy
ClusterPolicy of the same name before, with one rule per path shape);
tests/image-tag-pinned holds its suite.
*/}}
{{- if .Values.compliancePolicies.imageTagPinned.enabled -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: image-tag-pinned
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: governance
  annotations:
    # Autogen OFF: each workload PATH-SHAPE is read at its own path.
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Container images must be tag-pinned (no :latest)
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Container images must reference an explicit, non-:latest tag (or
      a @sha256: digest). Floating tags break SHA-pinned audit trails
      and reproducibility.
spec:
  validationActions: {{ include "bp-kyverno-policies.actions" (dict "ctx" . "policy" .Values.compliancePolicies.imageTagPinned.action) }}
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: exclude-namespaces
      expression: {{ include "bp-kyverno-policies.excludeNamespacesExpr" .Values.compliancePolicies.imageTagPinned.excludeNamespaces | quote }}
  variables:
    # The Pod spec at the real path of each kind.
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: images
      expression: >-
        variables.podSpec.containers.map(c, c.image) +
        variables.podSpec.?initContainers.orValue([]).map(c, c.image)
  validations:
    - expression: >-
        variables.images.all(i,
        (i.matches('^.*@sha256:[a-fA-F0-9]{64}$') ||
        i.matches('^[^@]*/[^/:]+:[^/:]+$') ||
        i.matches('^[^@/]+:[^/:]+$')) &&
        !i.matches('^.*:latest$'))
      message: "One or more containers reference an unpinned image (`:latest`, or no tag/digest which K8s resolves to `:latest`). Pin to an explicit non-`:latest` tag or a @sha256 digest."
{{- end -}}
