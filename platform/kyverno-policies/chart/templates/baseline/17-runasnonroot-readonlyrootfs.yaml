{{/*
K2 — runasnonroot-readonlyrootfs (security, permissive default).

Pod templates must declare:
  - spec.securityContext.runAsNonRoot: true (Pod-level OR container-level), AND
  - container.securityContext.readOnlyRootFilesystem: true on every container.

Restricting writeable rootfs reduces blast radius of a process
compromise and removes the most common malware persistence vector
(curl|sh into /tmp). Running as non-root is industry-standard and
matches Kubernetes Pod Security Standards "restricted".

Default mode permissive per design §4.3.
*/}}
{{- if .Values.compliancePolicies.runAsNonRootReadonlyRootFs.enabled -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: runasnonroot-readonlyrootfs
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: security
  annotations:
    policies.kyverno.io/title: Workloads must run non-root with read-only rootfs
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Pods must declare runAsNonRoot=true at Pod or container level
      AND every container must set readOnlyRootFilesystem=true.
spec:
  validationActions: {{ include "bp-kyverno-policies.actions" (dict "ctx" . "policy" .Values.compliancePolicies.runAsNonRootReadonlyRootFs.action) }}
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: exclude-namespaces
      expression: {{ include "bp-kyverno-policies.excludeNamespacesExpr" .Values.compliancePolicies.runAsNonRootReadonlyRootFs.excludeNamespaces | quote }}
  # Both validations read spec.template for every kind. A CronJob has no
  # spec.template, so it never complies (the legacy patterns read the same
  # path; measured).
  validations:
    - expression: >-
        has(object.spec.template) &&
        (object.spec.template.spec.?securityContext.?runAsNonRoot.orValue(false) == true ||
        object.spec.template.spec.containers.all(c, c.?securityContext.?runAsNonRoot.orValue(false) == true))
      message: >-
        This workload must set spec.template.spec.securityContext.runAsNonRoot=true
        (Pod-level) OR every container must set securityContext.runAsNonRoot=true.
    - expression: >-
        has(object.spec.template) &&
        object.spec.template.spec.containers.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true)
      message: >-
        Every container in this workload must set
        securityContext.readOnlyRootFilesystem=true.
{{- end -}}
