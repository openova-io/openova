{{/*
K1 — flux-managed (governance, ENFORCING default).

Every workload-rendering resource on a Sovereign must be managed by
Flux — i.e. owned by a Kustomization or HelmRelease, OR carry the
`app.kubernetes.io/managed-by: flux` label as a fallback. Direct
`kubectl apply` is the standing anti-pattern (see CLAUDE.md §4 — IaC
first).

Catalyst's mutate-add-openova-labels (slice E1) writes the
`openova.io/managed-by: flux` label when an ownerReference points at a
Flux resource, so this validate rule MAY be in tension with E1's mutate
on the very first admission cycle. To avoid the tension, this rule
checks `app.kubernetes.io/managed-by`, the canonical label the
upstream Flux controllers themselves write — not Catalyst's overlay
label.

Default mode enforcing per design §4.3.

A ValidatingPolicy of policies.kyverno.io since CMP-084 (the legacy
ClusterPolicy of the same name before); tests/flux-managed holds its
suite. Each exclude filter of the legacy rule is a match condition here,
so an object it spares is not judged (a skip); the Crossplane carve-out
was a deny condition and stays in the validation (a pass).
tools/guards/cmd/cronjob-jobs judges the Jobs of the kit's CronJobs
against this render, so its expressions keep to the forms that guard
reads.
*/}}
{{- if .Values.compliancePolicies.fluxManaged.enabled -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: flux-managed
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: governance
  annotations:
    policies.kyverno.io/title: Workloads must be managed by Flux
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Workload-rendering resources must carry
      `app.kubernetes.io/managed-by: flux` (the upstream Flux label) OR
      have an ownerReference pointing at a HelmRelease / Kustomization.
      Direct kubectl apply is rejected — IaC-first per
      docs/INVIOLABLE-PRINCIPLES.md #3.
spec:
  validationActions: {{ include "bp-kyverno-policies.actions" (dict "ctx" . "policy" .Values.compliancePolicies.fluxManaged.action) }}
  evaluation:
    background:
      enabled: true
  {{- /*
    Who manages an object is judged when it is created or changed, never
    when it is removed: the legacy rule also judged DELETE, which denied
    Crossplane's deletion of an old provider revision's Deployment (the
    same defect probes-present had, templates/baseline/04-probes.yaml).
    The resource rules match CREATE and UPDATE only, so a DELETE is never
    judged (tests/crossplane-runtime-suite-current.sh C3).
  */}}
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  matchConditions:
                {{- /*
                  #3248 follow-up (Refs #2737 #3236, first proven hw126): the
                  CNPG operator creates Services (`<cluster>-r/-ro/-rw`) and
                  utility Jobs with NO flux labels / ownerRefs — by design,
                  operator-owned objects can NEVER be Flux-managed. flux-managed
                  is the ONE Enforce policy whose denial is definitionally
                  impossible for these. Namespace-scoped per-policy extra
                  excludes (NOT the shared anchor — powerdns-admin also hosts a
                  real Deployment that must stay subject to every other policy).
                */}}
    - name: exclude-namespaces
      expression: {{ include "bp-kyverno-policies.excludeNamespacesExpr" (concat .Values.compliancePolicies.fluxManaged.excludeNamespaces .Values.compliancePolicies.fluxManaged.extraExcludeNamespaces) | quote }}
          {{- /*
            #3374 (2026-06-14): exclude CNPG operator-created objects by LABEL,
            cluster-wide, instead of by namespace. The per-namespace exclude
            above only covers CNPG clusters in dedicated namespaces (cnpg /
            shared-data / powerdns-admin). PER-APP CNPG clusters that land in a
            SHARED namespace — guacamole-pg in catalyst-system, newapi-pg in
            newapi, openova-flow-pg in catalyst-system — could not be excluded
            that way without also exempting the real Deployments that share the
            namespace. On hw133 a FRESH guacamole-pg Cluster was wedged at
            "Unable to create required cluster objects" because its operator-
            created Service/guacamole-pg-r was denied (the existing newapi-pg /
            openova-flow-pg Services only passed because they were created at
            bootstrap before Enforce engaged — grandfathered). Every CNPG
            operator object carries `app.kubernetes.io/managed-by: cloudnative-pg`;
            excluding on that label exempts ONLY operator-owned Services + utility
            Jobs in ANY namespace, while every Flux/Helm/kubectl workload stays
            gated. This is the definitional carve-out the namespace list was
            approximating. Refs #3374 #3248.
          */}}
    - name: exclude-cnpg-operator-objects
      expression: "object.metadata.?labels.orValue({})[?'app.kubernetes.io/managed-by'].orValue('') != 'cloudnative-pg'"
          {{- /*
            #3859 (2026-06-19, first proven walkorg on hw167): EVERY per-Org
            CUSTOMER vCluster is denied here. vCluster's syncer (0.33.x) detects
            the host service CIDR at startup by CREATING a throwaway probe
            Service (`test-service-delete-me-*`) and reading the apiserver's
            error — by design that probe can NEVER carry a flux label/ownerRef,
            so flux-managed (Enforce) denies it → vcluster-0 syncer CrashLoops
            ("failed to get service cidr") → the customer Org's vCluster never
            comes up → the Organization stays VClusterProvisioning forever → the
            #3376 funnel can never reach an ACTIVE Org. The platform vClusters
            (mgmt/rtz/dmz) only escape because their namespaces are in the static
            excludeNamespaces list above — but customer Org namespaces are named
            after the org slug (walkorg, acme, …), an UNBOUNDED set that cannot
            be a static list. The org-controller stamps every per-Org vCluster
            namespace with `openova.io/organization: <slug>`; exclude by that
            label so the CIDR-detection probe Service is admitted in ANY current
            or future customer Org, while real customer workloads inside the
            vCluster stay gated (they are synced objects, not host-namespace
            Services). Mirrors the by-label CNPG carve-out above.
          */}}
    - name: exclude-organization-namespaces
      expression: "!('openova.io/organization' in namespaceObject.?metadata.?labels.orValue({}))"
          {{- /*
            #4329 (2026-06-25, proven live on omantel.biz/kom4dc — ALL 11/11
            customer vClusters CrashLoopBackOff 277×/23h): the #3859 carve-out
            above only matches namespaces stamped `openova.io/organization`.
            The org-controller (post-#4295 single boundary producer) stamps
            exactly that on its `<slug>` namespaces — but the retired pre-#4295
            funnel `tenant-<slug>` boundary stamped `openova.io/tenant: <slug>`
            + `openova.io/managed-by: provisioning` instead, so its vCluster
            CIDR-probe Service is denied → the syncer's startup
            `failed to get service cidr` is fatal → vcluster-0 CrashLoops
            forever → the #4297 apps-in-vCluster keystone is unreachable.

            Rather than chase every boundary-label convention (organization vs
            tenant vs a not-yet-invented key), exclude the vCluster
            CIDR-detection probe Service DIRECTLY. vCluster 0.33.x
            (servicecidr/servicecidr.go) creates a throwaway Service named
            `test-service-delete-me-<rand>` purely to read the apiserver's
            ipFamily error, then deletes it — by design it can NEVER carry a
            Flux label/ownerRef. Matching it by name pattern (cluster-wide, in
            ANY namespace) admits ONLY that ephemeral probe while every real
            customer/operator Service stays fully gated. Convention-resilient:
            it survives any future drift in the Org-namespace label. Mirrors
            the by-label CNPG operator carve-out above — carve out the
            definitionally-unmanageable object, not the namespace.
          */}}
    - name: exclude-vcluster-cidr-probe
      expression: "!(object.kind == 'Service' && object.metadata.?name.orValue('').startsWith('test-service-delete-me-'))"
          {{- /*
            #4765 (2026-07-05, proven live hw224 region-a): Helm HOOK resources
            (carrying a `helm.sh/hook` annotation) are executed by Helm's action
            engine DIRECTLY and are NOT part of the manifest Flux's helm-controller
            post-renders — so they never receive the helm.toolkit.fluxcd.io/* labels.
            Worse, Helm force-stamps `app.kubernetes.io/managed-by: Helm` on apply
            (a template override of that label is silently dropped — Helm always
            wins), so a hook can NEVER satisfy any of this policy's three labels.
            A hook Job is nonetheless legitimately managed (by Helm, driven by a
            Flux HelmRelease). On a FRESH prov the hook slips through because it
            runs at bootstrap before Enforce engages; on a LIVE UPGRADE of a
            converged env kyverno denies it and Flux rolls the release back —
            proven on hw224 region-a, where bp-powerdns' zone-bootstrap
            post-upgrade hook kept being denied so the powerdns anycast Service was
            stranded on the forbidden NodePort (the LoadBalancer upgrade could
            never land). Carve out the definitionally-unmanageable Helm hook,
            mirroring the CNPG-operator + vCluster-probe carve-outs above. Additive
            (loosens only): a hook that should have been denied is at worst
            admitted; nothing new is ever denied.
            The annotation counts whatever its value, as the legacy filter
            `helm.sh/hook: "*"` read it.
          */}}
    - name: exclude-helm-hooks
      expression: "!('helm.sh/hook' in object.metadata.?annotations.orValue({}))"
  variables:
    - name: labels
      expression: object.metadata.?labels.orValue({})
            {{- /*
              Crossplane package runtimes (proven on hw307, candidate
              rc/20261119T053558Z-6972370, Crossplane core 1.20.14 -> 2.4.3).
              For every ProviderRevision and FunctionRevision, Crossplane's
              package manager creates a Deployment and a Service (and a
              ServiceAccount, which this policy does not match) in
              crossplane-system. An operator-created object can never be
              Flux-managed, so the rule denied them: the new provider
              revision's Deployment, the deletion of the old one, and the
              function's Service from its first install. The provider only
              ran because its first Deployment was created at bootstrap,
              before the policy enforced.

              The carve-out is the label the operator stamps, cluster-wide,
              as for the CNPG operator and the vCluster probe above, never a
              namespace. Crossplane 2.4.3 stamps NO label on the metadata of
              these objects (internal/controller/pkg/runtime/runtime.go,
              podSelectors, and runtime_override_options.go,
              DeploymentWithSelectors and ServiceWithSelectors): it stamps
              `pkg.crossplane.io/revision: <revision>` (and
              `pkg.crossplane.io/provider` or `pkg.crossplane.io/function`)
              on the Deployment's pod template and selector and on the
              Service's selector, and sets the revision as the controller
              owner. A match condition reads metadata labels only, so the
              carve-out is part of the validation: an object passes when it
              carries that label where Crossplane puts it AND its controller
              owner is a pkg.crossplane.io revision. A plain Deployment or
              Service in crossplane-system is still denied.
            */}}
    - name: crossplaneRevisionLabelled
      expression: >-
        object.?spec.?template.?metadata.?labels[?'pkg.crossplane.io/revision'].orValue('') != '' ||
        object.?spec.?selector[?'pkg.crossplane.io/revision'].orValue('') != ''
    - name: crossplaneOwnerKinds
      expression: >-
        object.metadata.?ownerReferences.orValue([]).filter(r,
        r.?controller.orValue(false) == true && r.?apiVersion.orValue('').startsWith('pkg.crossplane.io/')).map(r,
        r.?kind.orValue(''))
  {{- /*
    Wave 5.97 nil-safety: the policy reads the labels Flux applies, not
    ownerReferences. Flux sets helm.toolkit.fluxcd.io/name or
    kustomize.toolkit.fluxcd.io/name on every object it manages; a filter
    of ownerReferences failed on objects that have none, and admission
    failurePolicy=Fail then blocked every create cluster-wide.
  */}}
  validations:
    - expression: >-
        variables.labels[?'app.kubernetes.io/managed-by'].orValue('') == 'flux' ||
        variables.labels[?'helm.toolkit.fluxcd.io/name'].orValue('') != '' ||
        variables.labels[?'kustomize.toolkit.fluxcd.io/name'].orValue('') != '' ||
        (variables.crossplaneRevisionLabelled && size(variables.crossplaneOwnerKinds) > 0 &&
        variables.crossplaneOwnerKinds.all(k, k in ['ProviderRevision', 'FunctionRevision']))
      messageExpression: >-
        object.kind + '/' + object.metadata.name + ' is not Flux-managed. Add label
        `app.kubernetes.io/managed-by: flux` on metadata.labels OR attach an
        ownerReference to a HelmRelease / Kustomization.'
{{- end -}}
