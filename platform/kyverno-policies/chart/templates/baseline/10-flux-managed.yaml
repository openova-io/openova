{{/*
K1 — flux-managed (governance, ENFORCING default).

Every workload-rendering resource on a Sovereign must be managed by
Flux — i.e. owned by a Kustomization or HelmRelease, OR carry the
`app.kubernetes.io/managed-by: flux` label as a fallback. Direct
`kubectl apply` is the standing anti-pattern (see CLAUDE.md §4 — IaC
first).

Catalyst's mutate-add-openova-labels (slice E1) writes the
`openova.io/managed-by: flux` label when an ownerReference points at a
Flux resource, so this validate rule MAY be in tension with E1's mutate
on the very first admission cycle. To avoid the tension, this rule
checks `app.kubernetes.io/managed-by`, the canonical label the
upstream Flux controllers themselves write — not Catalyst's overlay
label.

Default mode enforcing per design §4.3.
*/}}
{{- if .Values.compliancePolicies.fluxManaged.enabled -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: flux-managed
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: governance
  annotations:
    policies.kyverno.io/title: Workloads must be managed by Flux
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Workload-rendering resources must carry
      `app.kubernetes.io/managed-by: flux` (the upstream Flux label) OR
      have an ownerReference pointing at a HelmRelease / Kustomization.
      Direct kubectl apply is rejected — IaC-first per
      docs/INVIOLABLE-PRINCIPLES.md #3.
spec:
  validationFailureAction: {{ include "bp-kyverno-policies.action" (dict "ctx" . "policy" .Values.compliancePolicies.fluxManaged.action) }}
  background: true
  rules:
    - name: workload-must-be-flux-managed
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
                - Service
                - Ingress
      exclude:
        any:
          - resources:
              namespaces:
                {{- range $ns := .Values.compliancePolicies.fluxManaged.excludeNamespaces }}
                - {{ $ns }}
                {{- end }}
                {{- /*
                  #3248 follow-up (Refs #2737 #3236, first proven hw126): the
                  CNPG operator creates Services (`<cluster>-r/-ro/-rw`) and
                  utility Jobs with NO flux labels / ownerRefs — by design,
                  operator-owned objects can NEVER be Flux-managed. flux-managed
                  is the ONE Enforce policy whose denial is definitionally
                  impossible for these. Namespace-scoped per-policy extra
                  excludes (NOT the shared anchor — powerdns-admin also hosts a
                  real Deployment that must stay subject to every other policy).
                */}}
                {{- range $ns := .Values.compliancePolicies.fluxManaged.extraExcludeNamespaces }}
                - {{ $ns }}
                {{- end }}
          {{- /*
            #3374 (2026-06-14): exclude CNPG operator-created objects by LABEL,
            cluster-wide, instead of by namespace. The per-namespace exclude
            above only covers CNPG clusters in dedicated namespaces (cnpg /
            shared-data / powerdns-admin). PER-APP CNPG clusters that land in a
            SHARED namespace — guacamole-pg in catalyst-system, newapi-pg in
            newapi, openova-flow-pg in catalyst-system — could not be excluded
            that way without also exempting the real Deployments that share the
            namespace. On hw133 a FRESH guacamole-pg Cluster was wedged at
            "Unable to create required cluster objects" because its operator-
            created Service/guacamole-pg-r was denied (the existing newapi-pg /
            openova-flow-pg Services only passed because they were created at
            bootstrap before Enforce engaged — grandfathered). Every CNPG
            operator object carries `app.kubernetes.io/managed-by: cloudnative-pg`;
            excluding on that label exempts ONLY operator-owned Services + utility
            Jobs in ANY namespace, while every Flux/Helm/kubectl workload stays
            gated. This is the definitional carve-out the namespace list was
            approximating. Refs #3374 #3248.
          */}}
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/managed-by: cloudnative-pg
          {{- /*
            #3859 (2026-06-19, first proven walkorg on hw167): EVERY per-Org
            CUSTOMER vCluster is denied here. vCluster's syncer (0.33.x) detects
            the host service CIDR at startup by CREATING a throwaway probe
            Service (`test-service-delete-me-*`) and reading the apiserver's
            error — by design that probe can NEVER carry a flux label/ownerRef,
            so flux-managed (Enforce) denies it → vcluster-0 syncer CrashLoops
            ("failed to get service cidr") → the customer Org's vCluster never
            comes up → the Organization stays VClusterProvisioning forever → the
            #3376 funnel can never reach an ACTIVE Org. The platform vClusters
            (mgmt/rtz/dmz) only escape because their namespaces are in the static
            excludeNamespaces list above — but customer Org namespaces are named
            after the org slug (walkorg, acme, …), an UNBOUNDED set that cannot
            be a static list. The org-controller stamps every per-Org vCluster
            namespace with `openova.io/organization: <slug>`; exclude by that
            label so the CIDR-detection probe Service is admitted in ANY current
            or future customer Org, while real customer workloads inside the
            vCluster stay gated (they are synced objects, not host-namespace
            Services). Mirrors the by-label CNPG carve-out above.
          */}}
          - resources:
              namespaceSelector:
                matchExpressions:
                  - key: openova.io/organization
                    operator: Exists
      validate:
        message: >-
          {{ `{{request.object.kind}}/{{request.object.metadata.name}}` }} is
          not Flux-managed. Add label
          `app.kubernetes.io/managed-by: flux` on metadata.labels OR
          attach an ownerReference to a HelmRelease / Kustomization.
        deny:
          conditions:
            all:
              - key: '{{ `{{ request.object.metadata.labels."app.kubernetes.io/managed-by" || '''' }}` }}'
                operator: NotEquals
                value: flux
              # Wave 5.97 nil-safety: check Flux-applied labels instead of
              # ownerReferences. Flux sets BOTH helm.toolkit.fluxcd.io/name AND
              # kustomize.toolkit.fluxcd.io/name on every resource it manages.
              # The original JMESPath filter `ownerReferences[?kind==X]` errors
              # when ownerReferences is nil (most kubectl-created Pods + debug
              # pods + admission-time injected sidecars), and admission webhook
              # failurePolicy=Fail blocks all pod creation cluster-wide.
              # Label-based check is nil-safe via the `||` JMESPath fallback.
              - key: '{{ `{{ request.object.metadata.labels."helm.toolkit.fluxcd.io/name" || '''' }}` }}'
                operator: Equals
                value: ''
              - key: '{{ `{{ request.object.metadata.labels."kustomize.toolkit.fluxcd.io/name" || '''' }}` }}'
                operator: Equals
                value: ''
{{- end -}}
