{{/*
K23 — FORBID the ephemeral k3s local-path provisioner (#3971).

THE MANDATE
===========
Founder, verbatim (#3971): "make the local paths not default even FORBIDDEN.
local path never ever ALLOWED!!"

k3s ships a `local-path` StorageClass backed by `rancher.io/local-path` — a
directory on the node's LOCAL disk with NO cloud block volume behind it. Any
node replacement (autoscaler, failed node, re-prov, disk loss) DESTROYS that
PV's data — prod Postgres 3×100Gi, openbao secrets, the customer-Org DB,
keycloak/gitea/harbor. That invalidates the BCP/DR model.

DEFENCE IN DEPTH
================
This is the THIRD of three layers that make local-path impossible:
  1. k3s `--disable=local-storage` (cloud-init) — the provisioner is NEVER
     installed on a fresh prov.
  2. The per-provider cloud CSI (bp-hcloud-csi slot 55a) installs the durable
     `hcloud-volumes` default StorageClass, and is a `dependsOn` of the
     stateful root slots so it is Ready before any PVC binds.
  3. THIS Kyverno ENFORCE policy — the admission guard that DENIES any
     PersistentVolumeClaim / StorageClass / PersistentVolume that references
     `local-path` or `rancher.io/local-path`, so no future chart, overlay, or
     operator can ever silently reintroduce non-durable node-local storage.
  + the Phase-1 provisioning DoD gate (catalyst-api) FAILS a prov whose
    resolved default StorageClass is still local-path.

WHY THE ACTION IS HARDCODED Deny (NOT the bootstrap-window helper)
=================================================================
Every OTHER policy in this chart resolves its action through
`bp-kyverno-policies.actions` (or the legacy `bp-kyverno-policies.action`),
which downgrades to Audit while `compliancePolicies.bootstrapMode` is true
(the Phase-1 window) so not-yet-ready workloads aren't fail-closed-blocked.
This policy is the EXCEPTION: it is a structural data-durability safety
invariant, and the local-path PVCs it forbids are created DURING that very
bootstrap window. An Audit-during-bootstrap downgrade would let every
stateful PVC land on ephemeral disk before the post-handover flip to
Enforce — exactly the failure #3971 exists to prevent. Its
validationActions are therefore hardcoded `[Deny]`. This is safe because
the cloud CSI default class is guaranteed Ready before any PVC binds
(layer 2), so NO legitimate bootstrap PVC needs local-path — the policy
never blocks a well-formed prov.

Operator override: `--set compliancePolicies.forbidLocalPath.enabled=false`
disables it entirely (e.g. an air-gapped single-node Sovereign deliberately
running on node-local disk with no cloud volumes). Per-namespace escape via
`.excludeNamespaces` (claims only: classes and volumes have no namespace).

A ValidatingPolicy of policies.kyverno.io since CMP-063 (the legacy
ClusterPolicy of the same name before, with one rule per kind);
tests/forbid-local-path-storage holds its suite.
*/}}
{{- if .Values.compliancePolicies.forbidLocalPath.enabled -}}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forbid-local-path-storage
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: storage-durability
  annotations:
    policies.kyverno.io/title: Forbid the ephemeral k3s local-path provisioner
    policies.kyverno.io/category: catalyst-storage-durability
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: PersistentVolumeClaim,StorageClass,PersistentVolume
    # Changes with the reports controller's read of persistentvolumes, so an
    # upgrade that grants it makes Kyverno check the permissions again.
    catalyst.openova.io/reports-read-checksum: {{ include "bp-kyverno-policies.reportsReadChecksum" . | quote }}
    policies.kyverno.io/description: >-
      local-path (rancher.io/local-path) is ephemeral node-local disk with no
      cloud block volume behind it — a node replacement destroys the data,
      invalidating BCP/DR. #3971 forbids it entirely: k3s runs
      --disable=local-storage and the durable per-provider cloud CSI is the
      only default StorageClass. This policy fail-closes any PVC / StorageClass
      / PV that references local-path.
spec:
  # HARDCODED Deny — NOT the bootstrap-window helper. See the header comment:
  # the local-path PVCs this forbids are created during the Phase-1 bootstrap
  # window, so an Audit-during-bootstrap downgrade would defeat the guard.
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims", "persistentvolumes"]
      - apiGroups: ["storage.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["storageclasses"]
  matchConditions:
    # A StorageClass and a PersistentVolume have the namespace '', which is in
    # no list of namespaces: only claims can be excluded.
    - name: exclude-namespaces
      expression: {{ include "bp-kyverno-policies.excludeNamespacesExpr" .Values.compliancePolicies.forbidLocalPath.excludeNamespaces | quote }}
  validations:
    # ── PVCs may not request the local-path StorageClass ──────────────────
    - expression: >-
        object.kind != 'PersistentVolumeClaim' ||
        !(object.spec.?storageClassName.orValue('') in ['local-path', 'rancher.io/local-path'])
      message: >-
        This PersistentVolumeClaim requests the FORBIDDEN local-path
        StorageClass. local-path is ephemeral node-local disk (no cloud block
        volume) — #3971 forbids it. Omit storageClassName to bind to the
        durable cluster-default cloud CSI (hcloud-volumes on Hetzner), or name
        an explicit durable class.
    # ── no StorageClass may use the local-path provisioner ────────────────
    #    (also catches a StorageClass literally named `local-path`).
    - expression: >-
        object.kind != 'StorageClass' ||
        (!(object.?provisioner.orValue('') in ['rancher.io/local-path', 'local-path']) &&
        object.metadata.name != 'local-path')
      message: >-
        This StorageClass uses the FORBIDDEN local-path provisioner
        (rancher.io/local-path) or is named `local-path`. #3971: local-path is
        ephemeral node-local disk — use a durable cloud CSI provisioner
        (csi.hetzner.cloud) instead.
    # ── no PV may declare the local-path StorageClass ─────────────────────
    - expression: >-
        object.kind != 'PersistentVolume' ||
        !(object.spec.?storageClassName.orValue('') in ['local-path', 'rancher.io/local-path'])
      message: >-
        This PersistentVolume declares the FORBIDDEN local-path StorageClass.
        #3971: local-path is ephemeral node-local disk — back PVs with a
        durable cloud CSI instead.
{{- end }}
