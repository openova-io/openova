# bp-kyverno-policies values — EPIC-1 (#1096) compliance policy library.
#
# Split from bp-kyverno (engine chart) per Issue #2019 to break a CRD
# install-ordering race: when policies + Kyverno CRDs land in the same
# Helm pass, the apiserver RESTMapper has not learned `ClusterPolicy`
# before Helm tries to apply policy CRs.
#
# This chart's HelmRelease is ordered AFTER the engine via the
# bootstrap-kit Kustomization.dependsOn chain (cross-kind dependsOn at
# the HR level is silently ignored per docs/INVIOLABLE-PRINCIPLES.md
# #14 — use Kustomization.dependsOn for cross-kind ordering).
#
# Schema per policy:
#   <name>:
#     enabled: bool                      # required — gate
#     action: "Audit" | "Enforce"        # default Audit; flipped per-Environment
#                                        # by EnvironmentPolicy.spec.compliance.modes
#                                        # (slice C2 controller, future)
#     excludeNamespaces: [string]        # control-plane ns exemption list
#     <policy-specific knobs>            # e.g. allowedRegistryRegex
#
# Default action is `Audit` for every policy (permissive mode). Per
# docs/EPICS-1-6-unified-design.md §4.3 some policies have an
# "enforcing" default mode — those defaults are applied by the future
# environment-controller when it materializes a default
# EnvironmentPolicy on every Environment, NOT here. This values file is
# the per-Sovereign baseline; the Environment-level defaults are the
# next layer up.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 — every value is overridable.
compliancePolicies:
  # Wave 5.90 phase 2 (#2436) — bootstrap-mode override.
  #
  # When true (DEFAULT, fresh-prov posture), every policy's effective
  # validationFailureAction is forced to "Audit" regardless of its
  # per-policy canonical action. PolicyReport rows still emit (visible
  # in the Compliance Dashboard), but admission passes — no Pod-create
  # gets fail-closed-blocked during Phase 1 bootstrap.
  #
  # The catalyst-api post-handover hook flips this to false once the
  # Sovereign reaches handover-complete; Flux re-reconciles bp-kyverno-
  # policies; Helm upgrades the ClusterPolicies to their canonical
  # Enforce mode where the per-policy values declare it.
  #
  # Manual operator override (skip the post-handover auto-flip):
  #   --set compliancePolicies.bootstrapMode=false
  # to install all policies at their canonical action immediately
  # (NOT recommended on fresh prov — see #2436 multi-layer RCA).
  bootstrapMode: true

  # K1 baseline policies
  #
  # Default = enabled: true with action: Audit (permissive). Per #1929 the
  # Compliance scorecard was empty on fresh Sovereigns because every policy
  # gate defaulted to false — only `useraccess-boundary` was installed.
  # Audit mode is non-blocking (admission still passes) so flipping defaults
  # to true is safe: every Sovereign immediately has 18 baseline policies
  # emitting PolicyReport rows, and operators can flip individual policies
  # to enabled: false or action: Enforce per Sovereign overlay.
  #
  # The 2 exceptions:
  #   - hubbleFlowsSeen — comment-only stub (W2 evaluator does the real
  #     check). Setting enabled=true renders nothing. Left false for
  #     symmetry with its DEFERRED status; future W2 cutover flips it.
  #   - cosignVerified  — verifyImages rule requires an operator-supplied
  #     publicKey. Empty default would render an INVALID policy that fails
  #     to install. Left false; operator opts in per Sovereign once cosign
  #     key bundle is supplied.
  multiReplica:
    enabled: true
    action: Audit
    # #4422: exempt deliberate single-replica stateful singletons (the per-Org
    # funnel cart's mysql/postgres single-PVC DBs + redis cache) by the
    # `openova.io/singleton-db: "true"` label the funnel generator stamps on the
    # Deployment — they CANNOT run >=2 replicas (one RWO PVC, no replication
    # wired) and span unbounded `org-<uuid>` namespaces the list can't enumerate.
    # Operators flip false to re-subject all singletons to the drainability gate.
    excludeSingletonDB: true
    excludeNamespaces: &complianceDefaultExcludes
      - kube-system
      - flux-system
      - cilium
      - cilium-gateway
      # dragonfly (#4640/#4637, 2026-06-30): bp-dragonfly is the P2P
      # registry-distribution layer — the per-node dfdaemon is containerd's
      # 127.0.0.1 mirror, peer to cilium as core image-path plumbing. Its
      # workloads run upstream third-party images (docker.io/dragonflyoss/* +
      # a docker.io/busybox init) that, by construction, CANNOT be required to
      # pull through the very registry they bootstrap (harbor-proxy-pull) and
      # carry the upstream chart's `:latest` busybox init (image-tag-pinned).
      # Post-cutover both Enforce policies denied the recycled dragonfly-client
      # DaemonSet → DS to 0 → node mirror dead → cutover wedged at step-07.
      # Same trust tier + same treatment as cilium/cert-manager/kyverno: exempt
      # from the compliance set via this shared anchor. (probes-present +
      # resource-requests are satisfied by the bp-dragonfly chart regardless.)
      - dragonfly
      - cert-manager
      - openova-system
      - catalyst
      # 2026-06-13: ns `sme` is the operator's tenant-provisioning control
      # plane (provisioning/ferretdb/billing/marketplace/catalog) — same
      # operator-trust tier as `catalyst`/`mgmt`/`rtz`/`sso-bridge` already
      # excluded. Its Deployments legitimately MIX a proxied util init
      # (alpine/k8s) with native openova-io main images; harbor-proxy-pull's
      # anyPattern requires per-pod homogeneity, so the mix is denied on
      # reinstall under Enforce (hw130 umbrella install blocked live). It is
      # NOT tenant workload — it provisions tenants. catalyst-system carries
      # the same shape (catalyst-api + util inits).
      - kyverno
      - monitoring
      - ingress
      # G84a/G87b #2637 (2026-06-01): the 3 vCluster syncer namespaces
      # host upstream loft-sh/vcluster StatefulSets we don't own. Their
      # Pod templates lack readOnlyRootFilesystem / runAsNonRoot /
      # probes-present / per-region affinity etc. Without these excludes,
      # Phase-2b bootstrapMode→false flip (post_handover_policy_enforce.go)
      # cascades into vCluster admission denial → all 3 vClusters
      # (dmz/mgmt/rtz) stuck Pending forever → dashboard vCluster
      # grouping shows only "host" because vCluster syncers never start
      # → Pillar 4 Sandbox (lives in vcluster) silently broken on every
      # HCS Sovereign that successfully completed Phase 1.
      # Verified live hw86 2026-06-01.
      - dmz
      - mgmt
      - rtz
      # G109 #2705 (2026-06-01): bp-sso-bridge reconciler is single-writer
      # by design (parallel ticks would race the Keycloak Client upserts +
      # OpenBao secret writes). `multiReplica` / `pdb` / `topologySpread` /
      # `hpa` policies would reject the chart's `replicas: 1`. A future
      # leader-election + fencing refactor could enable replicas>=2; until
      # then exempt the namespace. The per-workload
      # `policies.kyverno.io/exempt` annotation in the chart's
      # `deploymentAnnotations` is documentation-only — catalyst Kyverno
      # policies key on namespace-list exclusion (this anchor), not
      # per-workload annotation. Code-reviewer agent surfaced this gap
      # 2026-06-01T13:35Z (G109 review verdict PASS-with-caveats).
      - sso-bridge
      # falco (#5063, hw250 2026-07-14): host-eBPF runtime-security DaemonSet.
      # Its falcoctl sidecars carry no resources.requests and the main container
      # legitimately needs host root + a writable rootfs (kernel/eBPF access), so
      # it CANNOT satisfy resource-requests / runAsNonRoot / readOnlyRootFilesystem.
      # Original pods admit at prov time, but the self-sovereign-cutover deny-egress
      # fresh-pull proof ROLLS the DaemonSet → the recycled pod is DENIED by the
      # resource-requests Enforce policy → DS stuck 5/6 → egress-block-test FAIL
      # (step-08 wedged, exactly the #4640 dragonfly shape one tier up). A node
      # replacement / region-kill hits the identical block → general robustness,
      # not cutover-only. Same privileged trust tier as cilium/dragonfly: exempt.
      - falco

  pdb:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  topologySpread:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  probesPresent:
    enabled: true
    # Wave 5.53 (#2286) — EPIC #1094 acceptance requires ~half enforcing.
    # Probes are P0 reliability; Enforce by default.
    action: Enforce
    excludeNamespaces: *complianceDefaultExcludes

  resourceRequests:
    enabled: true
    # Wave 5.53 — P0 scheduler reliability; without requests workloads
    # over-commit nodes silently. Enforce by default.
    action: Enforce
    excludeNamespaces: *complianceDefaultExcludes

  resourceLimits:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  pvcExpansion:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  hpaEffective:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  ciliumL7Mtls:
    enabled: true
    # Wave 5.53 — zero-trust mesh enforcement; new workloads MUST opt
    # into the L7 mTLS policy via label. Enforce by default.
    action: Enforce
    excludeNamespaces: *complianceDefaultExcludes

  fluxManaged:
    enabled: true
    # Wave 5.53 — GitOps invariant. Out-of-band kubectl apply bypasses
    # the audit trail. Enforce by default.
    action: Enforce
    excludeNamespaces: *complianceDefaultExcludes
    # #3248 follow-up (Refs #2737 #3236, first proven hw126): operator-managed
    # data-plane namespaces. The CNPG operator creates Services
    # (`<cluster>-r`/`-ro`/`-rw`) and utility Jobs with NO flux labels or
    # ownerReferences — operator-owned objects definitionally cannot be
    # Flux-managed, so flux-managed (the ONLY Enforce policy whose match-kinds
    # include Service) denies "Unable to create required cluster objects" the
    # moment a gated CNPG Cluster first reaches admission. These namespaces
    # predate the data plane and were never in complianceDefaultExcludes
    # because no workload ran there until the hw126 gate-flips.
    #
    # Scoped to THIS policy only (not the shared anchor): powerdns-admin also
    # hosts a real `powerdns-admin` Deployment that MUST stay subject to every
    # other policy (probes / requests / image-pin). CNPG instance Pods carry
    # the cluster's harbor-proxied + pinned image and inherited resource
    # requests, so they still PASS 04/05/11/12 — only the operator-created
    # Service/Job (flux-unmanageable) needs this carve-out.
    extraExcludeNamespaces:
      - cnpg            # bp-cnpg-pair primary/replica Clusters → operator Services + Jobs
      - shared-data     # bp-postgres-shared (shared-pg) Cluster → operator Services + Jobs
      - powerdns-admin  # bp-powerdns-admin CNPG Cluster → operator Services + Jobs
      # 2026-06-19 (#3825, hw165): trivy-operator-spawned scan Jobs carry no
      # HelmRelease owner / flux label (operator-generated ephemera,
      # definitionally not Flux-managed — same class as the CNPG operator
      # Services/Jobs above). flux-managed (Enforce) denied every scan-job
      # create cluster-wide → trivy scanning dead. Exempt the scan-job
      # namespace here only; it stays subject to every other policy.
      - trivy-system    # trivy-operator scan Jobs (operator-generated, no flux owner) (#3825)

  harborProxyPull:
    enabled: true
    # Wave 5.53 — supply-chain integrity. All images MUST flow through
    # the Harbor proxy-cache (signature + SBOM + scan layer). Enforce.
    action: Enforce
    excludeNamespaces: *complianceDefaultExcludes
    # G60 (Refs #2611, 2026-05-30): renamed `allowedRegistryRegex` →
    # `allowedImagePattern` to reflect Kyverno glob semantics (not regex).
    # G60 drops the foreach+regex_match+element.X primitive in favor of
    # canonical `validate.pattern` + glob — request.object-direct data,
    # no JMESPath substitution, no element.X nil race.
    #
    # G64 (Refs #2613, 2026-05-30): broaden glob from `harbor.*/proxy-*/*`
    # to `*/proxy-*/*`. The SEMANTIC MARKER for "Harbor proxy" is the
    # `/proxy-<upstream>/<path>` URL pattern, NOT the `harbor.*` subdomain.
    # Sovereign HTTPRoute exposes Harbor at `registry.<sov-fqdn>` (per
    # bp-harbor HTTPRoute hostname, e.g. `registry.hw71.omani.works`).
    #
    # G66 (Refs #2615, 2026-05-31): allow registry.*/openova-io/* in
    # ADDITION to */proxy-*/* — Step 03 Phase A skopeo-PUSHES openova-io
    # application images NATIVELY into local Harbor (not via proxy-cache)
    # because Harbor's github-ghcr proxy-cache adapter cannot auth
    # ghcr.io reliably. Native-push path is `registry.<sov>/openova-io/
    # openova/<svc>:<tag>` — distinct from `registry.<sov>/proxy-*/...`.
    # Both are LEGITIMATE post-cutover image sources from the local
    # Sovereign Harbor: proxy-cache for anonymous public registries
    # (quay/docker/k8s/gcr) + native push for private openova-io.
    #
    # Switched single `allowedImagePattern` (string) → `allowedImagePatterns`
    # (list) + Kyverno's `anyPattern` to support multiple globs. The
    # legacy single-string `allowedImagePattern` is retained for backward
    # compatibility (used as fallback when list is empty).
    allowedImagePattern: "*/proxy-*/*"
    # #5017 (hw242, 2026-07-12): a THIRD entry with Kyverno `|` alternation.
    # Each anyPattern entry requires EVERY container in the pod to match
    # that ONE glob — a pod that legitimately MIXES proxy-cache sidecars
    # with a native-push openova-io image (e.g. huawei-evs-csi: 4x
    # proxy-k8s sig-storage sidecars + 1x openova-io evs-csi-plugin,
    # #4973 family) could NEVER be admitted: the all-proxy pattern fails
    # on the plugin, the all-openova-io pattern fails on the sidecars.
    # This wedged the CSI controller RS + node DS on hw242 and, through
    # bp-huawei-evs-csi, a 24-HelmRelease dependency cascade. The OR entry
    # admits mixed-source pods while still requiring every image to come
    # from the local Harbor.
    allowedImagePatterns:
      - "*/proxy-*/*"           # proxy-cache mode (cilium, cert-manager, postgres, etc.)
      - "*/openova-io/*"        # native-push mode (catalyst-api + all openova-io services post-cutover)
      - "*/proxy-*/* | */openova-io/*"  # mixed-source pods (proxy-cache sidecars + native-push plugin)
    # 2026-06-13: EXCLUDE the `powerdns` namespace from harbor-proxy-pull.
    # bp-powerdns's pdns-auth-50 + dnsdist-19 images pull from raw
    # `docker.io/powerdns/...` (see platform/powerdns/chart/values.yaml).
    # They CANNOT route through `harbor.openova.io/proxy-docker/...` because
    # that Harbor project is not reliably pullable by a fresh-prov node at
    # bootstrap — #3380-D's proxy-docker reroute wedged every fresh prov
    # (hw131 + hw132: powerdns pods never started → no DNS → no wildcard TLS
    # → console down). powerdns is a trusted first-party bootstrap component,
    # so exempt it from the image-source glob here (matches hw130's effective
    # state, where docker.io powerdns ran under kyverno without denial). This
    # is scoped to THIS policy only (per-policy extraExcludeNamespaces, NOT
    # the shared complianceDefaultExcludes anchor) — powerdns stays subject
    # to every OTHER policy (probes / requests / image-tag-pinned / etc.).
    # Same shape as the `flux-managed` extraExcludeNamespaces carve-out.
    # Follow-up: making proxy-docker bootstrap-pullable (cred-free like
    # proxy-ghcr) would let us drop this exclude and re-do #3380-D correctly.
    #
    # 2026-06-19 (#3825, hw165): the trivy-operator dynamically SPAWNS
    # vulnerability scan Jobs into `trivy-system`, imaged from
    # `mirror.gcr.io/aquasec/trivy` plus an operator-injected initContainer —
    # neither matches `*/proxy-*/*` or `*/openova-io/*`, so harbor-proxy-pull
    # (Enforce) denied EVERY scan-job create cluster-wide and trivy scanning
    # silently died (trivy-operator log: "creating scan job failed: …
    # image-from-harbor-proxy-workload"). The operator cannot re-tag its own
    # generated scan images through the Sovereign Harbor, so exempt the
    # scan-job namespace here only — same operator-spawned-ephemera shape as
    # the `powerdns` docker.io carve-out + the flux-managed cnpg/shared-data
    # carve-out below. `trivy-system` stays subject to every OTHER policy
    # (the operator Deployment + node-collector carry pinned images + requests).
    extraExcludeNamespaces:
      - powerdns
      - trivy-system   # trivy-operator-spawned scan Jobs use aquasec/trivy scanner images (#3825)
      # org-services (#3859, 2026-06-19): the BSS control-plane namespace was
      # renamed from `sme` → `org-services` (#3383 commit 7f6dfca23) but this
      # carve-out was NOT propagated. The `provisioning` Deployment (the
      # Organization-CR minter) legitimately MIXES a proxy-* util init
      # (harbor.openova.io/proxy-dockerhub/alpine/k8s — the wait-for-gitea-
      # token gate) with a native ghcr.io/openova-io main image; harbor-proxy-
      # pull's anyPattern requires per-Pod image HOMOGENEITY, so the mix is
      # denied under Enforce → provisioning ReplicaFailure (FailedCreate) →
      # tenant.created events are never consumed → NO Organization CR is
      # minted → the #3376 funnel can never reach an ACTIVE Org. This is the
      # exact mixed-source shape the stale `sme` exempt (line 89) was added
      # for on hw130. org-services stays subject to every OTHER policy.
      - org-services
      # crossplane-system (#4349, 2026-06-25, kom4dc dep 4635277cae4ffed9): the
      # bp-crossplane Deployment + crossplane-rbac-manager pull the upstream
      # control-plane image `xpkg.upbound.io/crossplane/crossplane:v1.18.0`
      # (Upbound's registry — Crossplane core is NOT mirrored into Harbor and
      # the chart's `global.imageRegistry` Harbor-rewrite is unset on a fresh
      # prov, #560). Neither `*/proxy-*/*` nor `*/openova-io/*` matches, so
      # harbor-proxy-pull (Enforce) denied the crossplane pod create
      # (ReplicaSet FailedCreate) → the bp-crossplane HR sat in a 15m-timeout
      # rollback loop → bp-crossplane-claims (dependsOn bp-crossplane) →
      # bp-catalyst-platform (dependsOn bp-crossplane-claims) never converged →
      # the org-controller roll was gated. crossplane-system is platform
      # plumbing (every comparable plumbing ns — cilium/cert-manager/kyverno —
      # is already exempt via complianceDefaultExcludes); exempt it here for
      # the image-source glob only. It stays subject to every OTHER policy.
      - crossplane-system
      # NOTE: `dragonfly` is NOT listed here — it is in the shared
      # complianceDefaultExcludes anchor (top of this file), which this policy's
      # excludeNamespaces references, so it is already covered for the
      # image-source glob AND every other compliance policy (see the anchor).

  imageTagPinned:
    enabled: true
    # Wave 5.53 — supply-chain reproducibility. `:latest` makes the
    # cluster state non-reproducible. Enforce by default.
    action: Enforce
    excludeNamespaces: *complianceDefaultExcludes

  prometheusScrape:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  # K2 added policies
  networkpolicyPresent:
    enabled: true
    action: Audit
    # Match on Namespace kind — `excludeNamespaces` here is consumed via
    # `resources.names` (the namespace IS the resource). Same default
    # exemption set as the workload policies.
    excludeNamespaces: *complianceDefaultExcludes

  otelInjected:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  hubbleFlowsSeen:
    # DEFERRED — see template stub for K2 #16. The Kyverno gate is a
    # no-op; W2 evaluator does the actual check. Setting enabled=true
    # today is harmless (renders nothing) but reserved as the cutover
    # knob once W2 lands so operators can toggle a single flag.
    enabled: false
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  runAsNonRootReadonlyRootFs:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  cosignVerified:
    # OFF by default — verifyImages rule requires an operator-supplied
    # cosign publicKey (PEM). Empty publicKey renders an INVALID policy
    # that fails to install. Per docs/INVIOLABLE-PRINCIPLES.md #4 we
    # surface the config gap rather than silently passing. Operator
    # opts in per Sovereign once the cosign key bundle is supplied.
    enabled: false
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes
    # Cosign verifyImages rule fields. Defaults reference openova-io
    # images only; operator extends per Sovereign.
    imageReferences:
      - "ghcr.io/openova-io/*"
    # Cosign public key (PEM). Empty default means the rule emits an
    # invalid policy until operator supplies a real key — surfaces the
    # config gap rather than silently passing. Per
    # docs/INVIOLABLE-PRINCIPLES.md #4 this is operator-configurable,
    # NOT hardcoded.
    publicKey: ""
    rekorURL: "https://rekor.sigstore.dev"

  secretNotInEnv:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  backupConfigured:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  # G92.6 (Refs #2665, 2026-06-01) — substrate-stays-on-host
  # architecture invariant policy. Per docs/DOD.md §A4 the substrate
  # components (Cilium-agent, Flux, Kyverno, cert-manager, ESO,
  # CNPG-operator, vCluster-syncers) MUST install on the host k3s
  # cluster, never inside a vCluster. The G92.1 (#2660) vcluster-
  # placement seam allowed any HelmRelease to opt into vCluster
  # installation via `spec.kubeConfig.secretRef`; a misconfigured
  # substrate HR using that seam would silently degrade the Sovereign
  # (Cilium-agent only running on vCluster's phantom nodes, Flux
  # reconciling only inside the vCluster's projection, etc.).
  #
  # This policy fail-closes any HelmRelease whose `metadata.name`
  # matches a substrate Blueprint AND whose `spec.kubeConfig` field is
  # set. Default action: Enforce (architectural invariant — not a soft
  # compliance recommendation). Operators on an air-gapped Sovereign
  # with bespoke substrate placement can override per-namespace via
  # excludeNamespaces.
  substrateOnHost:
    enabled: true
    action: Enforce
    # Substrate Blueprints — the canonical name set documented in
    # docs/DOD.md §A4. Operators MAY extend this list when shipping
    # a custom substrate component (rare); MUST NOT shrink it because
    # every name here protects an A4 invariant.
    substrateBlueprints:
      - bp-cilium
      - bp-flux
      - bp-kyverno
      - bp-kyverno-policies
      - bp-cert-manager
      - bp-cert-manager-powerdns-webhook
      - bp-cert-manager-dynadot-webhook
      - bp-external-secrets
      - bp-cnpg
      - bp-cnpg-pair
      - bp-mgmt-vcluster
      - bp-dmz-vcluster
      - bp-rtz-vcluster
      - bp-vcluster-helmrepo
    # Per-namespace escape hatch. The 3 vCluster syncer namespaces
    # (dmz/mgmt/rtz) legitimately host the bp-*-vcluster syncer
    # StatefulSets — the syncers themselves land on host k3s via
    # the bp-*-vcluster HR (which is itself substrate-on-host), but
    # their namespaces are carved out so per-Sovereign overlays
    # that re-deploy a syncer don't trip the policy.
    excludeNamespaces:
      - dmz
      - mgmt
      - rtz

  # #3971 — FORBID the ephemeral k3s local-path provisioner cluster-wide.
  # The founder mandate (verbatim): "make the local paths not default even
  # FORBIDDEN. local path never ever ALLOWED". k3s now runs
  # --disable=local-storage so the local-path provisioner is never installed;
  # this policy is the belt-and-braces admission guard that DENIES any
  # PersistentVolumeClaim / StorageClass / PersistentVolume that references
  # `local-path` or `rancher.io/local-path`, so a future chart/overlay/operator
  # can never silently reintroduce non-durable node-local storage.
  #
  # action is HARDCODED Enforce in the template (NOT gated by bootstrapMode):
  # this is a structural data-durability safety invariant, not a soft
  # compliance recommendation — it must fail-closed during the Phase-1
  # bootstrap window too (that's exactly when the stateful PVCs bind). The
  # cloud CSI (bp-hcloud-csi slot 55a) gates the stateful root slots so the
  # durable default class exists before any PVC binds — no legitimate
  # bootstrap PVC needs local-path, so Enforce-always cannot wedge the prov.
  forbidLocalPath:
    enabled: true
    # Genuinely-special namespaces that may need an escape hatch (none by
    # default — local-path is forbidden EVERYWHERE, including kube-system).
    excludeNamespaces: []

  # G98 (Refs #2644, 2026-06-01) — MUTATE policy that auto-stamps
  # `catalyst.openova.io/application` label on Pods cluster-wide.
  # Without this label, the Compliance scorecard's per-Application
  # rollup can only emit sovereign-scope verdicts; per-Application
  # drill-down stays blank because upstream charts don't stamp the
  # catalyst-specific label. MUTATE copies `app.kubernetes.io/instance`
  # (or `app.kubernetes.io/name` as fallback) into the catalyst label
  # using Kyverno's `+(label)` add-when-missing syntax — never
  # overrides an explicit operator-set value. Enabled by default since
  # the policy is non-rejecting (cannot block any workload) and
  # silently enriches every Pod on CREATE.
  appLabelMutate:
    enabled: true
    excludeNamespaces: *complianceDefaultExcludes

  # SYSTEMIC FIX (Refs #3268 #3263, 2026-06-11) — MUTATE policy that auto-stamps
  # `policy.cilium.io/enforced: "true"` on the Pod template of every always-on
  # workload that lacks it, BEFORE the 09-cilium-l7-mtls VALIDATE baseline runs.
  #
  # 30 of the 34 always-on bootstrap-kit charts inventoried in #3268 do NOT set
  # this label — each one DENIES at admission on its next roll once the baseline
  # enforces post-handover (proven live on keycloak hw126). The kube-apiserver
  # runs MUTATING webhooks BEFORE VALIDATING webhooks in the SAME admission
  # request, so this mutate stamps the missing label and the 09 validate then
  # admits the (already-mutated) object. ONE policy fixes the whole cohort —
  # including future Blueprints — instead of 30 per-chart label PRs.
  # Mutate-before-validate verified on a kind + kyverno v1.18 harness (see
  # template header + PR #3268-ref body).
  #
  # SAFETY: `policy.cilium.io/enforced` is a Catalyst-internal marker consumed by
  # the (not-yet-shipped) catalyst-network-controller (EPIC-5 #1100). Cilium
  # upstream does NOTHING with it; east-west mTLS is provided unconditionally by
  # WireGuard (`encryption.type: wireguard`) and SPIFFE per-connection mutual auth
  # is NOT enabled (bp-spire deferred). The label is therefore INERT on the
  # dataplane today — adding it changes zero traffic behavior, only satisfies the
  # Kyverno gate. Enabled by default (non-rejecting MUTATE cannot block any
  # workload; the `+(label)` add-when-missing + precondition make it idempotent).
  ciliumEnforcedLabelMutate:
    enabled: true
    excludeNamespaces: *complianceDefaultExcludes

  # EPIC #4286 mechanism B (Refs #4286, 2026-06-25) — MUTATE policy that
  # auto-injects the canonical basic-auth `spec.secretRef.name` on any Flux
  # GitRepository/HelmRepository/OCIRepository whose `spec.url` host targets the
  # Sovereign-local Gitea AND which has an empty/absent secretRef.
  #
  # WHY: bp-gitea ships `service.REQUIRE_SIGNIN_VIEW=true`
  # (platform/gitea/chart/values.yaml), so an ANONYMOUS git clone of the
  # in-cluster Gitea returns HTTP 401 "authentication required" for EVERY repo
  # (public included). A Flux source targeting the local Gitea WITHOUT a
  # secretRef is therefore structurally invalid — it sits "authentication
  # required" forever (the #4283/#4284/#4285 bug class across 4 generators).
  # Mechanism A (the shared `core/controllers/pkg/fluxsource` Go factory, #4285)
  # enforces this for the 3 in-tree Go generators; THIS policy is the admission
  # floor that ALSO covers sources from ANY OTHER origin (charts, Blueprints,
  # hand-applied CRs, a future fourth generator) — the regression-proof layer
  # that structurally defeats "the Nth generator forgets".
  #
  # The host law mirrors fluxsource.IsLocalSovereignSource exactly: a URL is
  # Sovereign-local when its host carries the `gitea` substring (the in-cluster
  # `gitea-http.gitea.svc...` service AND the per-Sovereign
  # `gitea.<loc>.<dom>` DNS). github.com catalog-mirror sources carry no such
  # substring and are left untouched (they need no auth). Scope is GITEA ONLY;
  # the local-Harbor leg (post-cutover registry pivot) reuses the same
  # admission guarantee and is the forward-looking follow-up the EPIC flags.
  #
  # MUTATE (not VALIDATE/deny): a deny would fail-closed any not-yet-migrated
  # generator and could wedge a fresh prov; the mutate silently injects the
  # secretRef so the source becomes authenticated + Ready=True. Idempotent — the
  # precondition fires ONLY when secretRef.name is empty/absent (never overrides
  # an operator-set or org-controller-set value) and the `+(secretRef)`
  # add-when-missing anchor is a second guard. Per docs/INVIOLABLE-PRINCIPLES.md
  # #4 the injected secret name + host marker are operator-overridable.
  #
  # Enabled by default — a non-rejecting MUTATE cannot block any workload; it
  # only enriches an otherwise-dead source. NOT bootstrapMode-gated (a mutate
  # has no validationFailureAction; it injects in Audit and Enforce alike).
  injectGiteaSourceSecretRef:
    enabled: true
    # Canonical flux-system basic-auth Secret (the gitea_admin PAT) minted by
    # the catalyst chart's gitea-flux-auth-secrets-sync-job — the EXACT secret
    # the correctly-wired organization-controller leg uses
    # (products/catalyst/chart/values.yaml:751). Operator-overridable.
    secretRefName: openova-org-tenants-git-auth
    # Host substring that marks a URL as targeting the Sovereign-local Gitea —
    # mirrors fluxsource.localSourceHostMarkers (`gitea`). Operator-overridable
    # for a Sovereign that renames its in-cluster Gitea host.
    giteaHostMarker: gitea
