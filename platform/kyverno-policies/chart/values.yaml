# bp-kyverno-policies values — EPIC-1 (#1096) compliance policy library.
#
# Split from bp-kyverno (engine chart) per Issue #2019 to break a CRD
# install-ordering race: when policies + Kyverno CRDs land in the same
# Helm pass, the apiserver RESTMapper has not learned `ClusterPolicy`
# before Helm tries to apply policy CRs.
#
# This chart's HelmRelease is ordered AFTER the engine via the
# bootstrap-kit Kustomization.dependsOn chain (cross-kind dependsOn at
# the HR level is silently ignored per docs/INVIOLABLE-PRINCIPLES.md
# #14 — use Kustomization.dependsOn for cross-kind ordering).
#
# Schema per policy:
#   <name>:
#     enabled: bool                      # required — gate
#     action: "Audit" | "Enforce"        # default Audit; flipped per-Environment
#                                        # by EnvironmentPolicy.spec.compliance.modes
#                                        # (slice C2 controller, future)
#     excludeNamespaces: [string]        # control-plane ns exemption list
#     <policy-specific knobs>            # e.g. allowedRegistryRegex
#
# Default action is `Audit` for every policy (permissive mode). Per
# docs/EPICS-1-6-unified-design.md §4.3 some policies have an
# "enforcing" default mode — those defaults are applied by the future
# environment-controller when it materializes a default
# EnvironmentPolicy on every Environment, NOT here. This values file is
# the per-Sovereign baseline; the Environment-level defaults are the
# next layer up.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 — every value is overridable.
compliancePolicies:
  # Wave 5.90 phase 2 (#2436) — bootstrap-mode override.
  #
  # When true (DEFAULT, fresh-prov posture), every policy's effective
  # validationFailureAction is forced to "Audit" regardless of its
  # per-policy canonical action. PolicyReport rows still emit (visible
  # in the Compliance Dashboard), but admission passes — no Pod-create
  # gets fail-closed-blocked during Phase 1 bootstrap.
  #
  # The catalyst-api post-handover hook flips this to false once the
  # Sovereign reaches handover-complete; Flux re-reconciles bp-kyverno-
  # policies; Helm upgrades the ClusterPolicies to their canonical
  # Enforce mode where the per-policy values declare it.
  #
  # Manual operator override (skip the post-handover auto-flip):
  #   --set compliancePolicies.bootstrapMode=false
  # to install all policies at their canonical action immediately
  # (NOT recommended on fresh prov — see #2436 multi-layer RCA).
  bootstrapMode: true

  # K1 baseline policies
  #
  # Default = enabled: true with action: Audit (permissive). Per #1929 the
  # Compliance scorecard was empty on fresh Sovereigns because every policy
  # gate defaulted to false — only `useraccess-boundary` was installed.
  # Audit mode is non-blocking (admission still passes) so flipping defaults
  # to true is safe: every Sovereign immediately has 18 baseline policies
  # emitting PolicyReport rows, and operators can flip individual policies
  # to enabled: false or action: Enforce per Sovereign overlay.
  #
  # The 2 exceptions:
  #   - hubbleFlowsSeen — comment-only stub (W2 evaluator does the real
  #     check). Setting enabled=true renders nothing. Left false for
  #     symmetry with its DEFERRED status; future W2 cutover flips it.
  #   - cosignVerified  — verifyImages rule requires an operator-supplied
  #     publicKey. Empty default would render an INVALID policy that fails
  #     to install. Left false; operator opts in per Sovereign once cosign
  #     key bundle is supplied.
  multiReplica:
    enabled: true
    action: Audit
    excludeNamespaces: &complianceDefaultExcludes
      - kube-system
      - flux-system
      - cilium
      - cilium-gateway
      - cert-manager
      - openova-system
      - catalyst
      - kyverno
      - monitoring
      - ingress

  pdb:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  topologySpread:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  probesPresent:
    enabled: true
    # Wave 5.53 (#2286) — EPIC #1094 acceptance requires ~half enforcing.
    # Probes are P0 reliability; Enforce by default.
    action: Enforce
    excludeNamespaces: *complianceDefaultExcludes

  resourceRequests:
    enabled: true
    # Wave 5.53 — P0 scheduler reliability; without requests workloads
    # over-commit nodes silently. Enforce by default.
    action: Enforce
    excludeNamespaces: *complianceDefaultExcludes

  resourceLimits:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  pvcExpansion:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  hpaEffective:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  ciliumL7Mtls:
    enabled: true
    # Wave 5.53 — zero-trust mesh enforcement; new workloads MUST opt
    # into the L7 mTLS policy via label. Enforce by default.
    action: Enforce
    excludeNamespaces: *complianceDefaultExcludes

  fluxManaged:
    enabled: true
    # Wave 5.53 — GitOps invariant. Out-of-band kubectl apply bypasses
    # the audit trail. Enforce by default.
    action: Enforce
    excludeNamespaces: *complianceDefaultExcludes

  harborProxyPull:
    enabled: true
    # Wave 5.53 — supply-chain integrity. All images MUST flow through
    # the Harbor proxy-cache (signature + SBOM + scan layer). Enforce.
    action: Enforce
    excludeNamespaces: *complianceDefaultExcludes
    # G60 (Refs #2611, 2026-05-30): renamed `allowedRegistryRegex` →
    # `allowedImagePattern` to reflect Kyverno glob semantics (not regex).
    # G60 drops the foreach+regex_match+element.X primitive in favor of
    # canonical `validate.pattern` + glob — request.object-direct data,
    # no JMESPath substitution, no element.X nil race.
    #
    # G64 (Refs #2613, 2026-05-30): broaden glob from `harbor.*/proxy-*/*`
    # to `*/proxy-*/*`. The SEMANTIC MARKER for "Harbor proxy" is the
    # `/proxy-<upstream>/<path>` URL pattern, NOT the `harbor.*` subdomain.
    # Sovereign HTTPRoute exposes Harbor at `registry.<sov-fqdn>` (per
    # bp-harbor HTTPRoute hostname, e.g. `registry.hw71.omani.works`).
    #
    # G66 (Refs #2615, 2026-05-31): allow registry.*/openova-io/* in
    # ADDITION to */proxy-*/* — Step 03 Phase A skopeo-PUSHES openova-io
    # application images NATIVELY into local Harbor (not via proxy-cache)
    # because Harbor's github-ghcr proxy-cache adapter cannot auth
    # ghcr.io reliably. Native-push path is `registry.<sov>/openova-io/
    # openova/<svc>:<tag>` — distinct from `registry.<sov>/proxy-*/...`.
    # Both are LEGITIMATE post-cutover image sources from the local
    # Sovereign Harbor: proxy-cache for anonymous public registries
    # (quay/docker/k8s/gcr) + native push for private openova-io.
    #
    # Switched single `allowedImagePattern` (string) → `allowedImagePatterns`
    # (list) + Kyverno's `anyPattern` to support multiple globs. The
    # legacy single-string `allowedImagePattern` is retained for backward
    # compatibility (used as fallback when list is empty).
    allowedImagePattern: "*/proxy-*/*"
    allowedImagePatterns:
      - "*/proxy-*/*"           # proxy-cache mode (cilium, cert-manager, postgres, etc.)
      - "*/openova-io/*"        # native-push mode (catalyst-api + all openova-io services post-cutover)

  imageTagPinned:
    enabled: true
    # Wave 5.53 — supply-chain reproducibility. `:latest` makes the
    # cluster state non-reproducible. Enforce by default.
    action: Enforce
    excludeNamespaces: *complianceDefaultExcludes

  prometheusScrape:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  # K2 added policies
  networkpolicyPresent:
    enabled: true
    action: Audit
    # Match on Namespace kind — `excludeNamespaces` here is consumed via
    # `resources.names` (the namespace IS the resource). Same default
    # exemption set as the workload policies.
    excludeNamespaces: *complianceDefaultExcludes

  otelInjected:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  hubbleFlowsSeen:
    # DEFERRED — see template stub for K2 #16. The Kyverno gate is a
    # no-op; W2 evaluator does the actual check. Setting enabled=true
    # today is harmless (renders nothing) but reserved as the cutover
    # knob once W2 lands so operators can toggle a single flag.
    enabled: false
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  runAsNonRootReadonlyRootFs:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  cosignVerified:
    # OFF by default — verifyImages rule requires an operator-supplied
    # cosign publicKey (PEM). Empty publicKey renders an INVALID policy
    # that fails to install. Per docs/INVIOLABLE-PRINCIPLES.md #4 we
    # surface the config gap rather than silently passing. Operator
    # opts in per Sovereign once the cosign key bundle is supplied.
    enabled: false
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes
    # Cosign verifyImages rule fields. Defaults reference openova-io
    # images only; operator extends per Sovereign.
    imageReferences:
      - "ghcr.io/openova-io/*"
    # Cosign public key (PEM). Empty default means the rule emits an
    # invalid policy until operator supplies a real key — surfaces the
    # config gap rather than silently passing. Per
    # docs/INVIOLABLE-PRINCIPLES.md #4 this is operator-configurable,
    # NOT hardcoded.
    publicKey: ""
    rekorURL: "https://rekor.sigstore.dev"

  secretNotInEnv:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes

  backupConfigured:
    enabled: true
    action: Audit
    excludeNamespaces: *complianceDefaultExcludes
