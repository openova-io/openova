apiVersion: v2
name: bp-kyverno-policies
description: |
  Catalyst Blueprint chart that ships the EPIC-1 (#1096) compliance policy
  library — 20 ClusterPolicy templates rendered against Kyverno CRDs that
  the engine chart (bp-kyverno) installs.

  Split from bp-kyverno (predecessor: chart 1.2.0 with policies in-tree)
  because installing the engine + policies in a SINGLE Helm pass creates a
  CRD-ordering race: the Kyverno upstream subchart installs
  ClusterPolicy/Policy CRDs via its `charts/crds/templates/`, but the
  apiserver's RESTMapper has not yet learned `kyverno.io/v1.ClusterPolicy`
  when Helm tries to apply the ClusterPolicy CRs in the same release.
  Separating into TWO Blueprints + ordering via `Kustomization.dependsOn`
  on the engine slot lets the engine reconcile + register its CRDs first,
  THEN the policy chart applies cleanly. See Issue #2019.

  This chart has NO upstream subchart — it is a pure overlay that emits
  ClusterPolicy CRs. CRDs are provided by the engine chart's upstream
  Kyverno subchart at slot 27.
type: application
# 1.0.22 (G60 RETROSPECTIVE #2611, 2026-05-30): META-AUDIT 7 closed.
# RE-ARCHITECTED harbor-proxy-pull + image-tag-pinned policies. After
# 7 rounds of regex_match+foreach+element.X patching (G19→G40→G45→G51→
# G55→G58) all hit Kyverno's JMESPath nil-substitution edge cases at
# different places (empty initContainers, sidecar injection, autogen
# Deployment variant, autogen=none + Pod CREATE).
#
# G60 drops the foreach+regex_match+element.X primitive ENTIRELY.
# Replaces with canonical `validate.pattern` + glob — oldest + most
# stable Kyverno primitive. Pattern validation uses request.object-
# direct data (server-side populated, no JMESPath substitution path,
# no element.X nil race). Autogen expands `containers.image` glob to
# `template.spec.containers.image` for Deployment/StatefulSet/etc.
#
# match.kinds restored to all Pod-spec-bearing kinds (G55 reverted).
# autogen annotation removed (G58 reverted) — pattern validation
# autogen-expansion is well-tested.
#
# allowedRegistryRegex → allowedImagePattern (rename for glob clarity)
# Default `harbor.*/proxy-*/*` covers all proxy paths + future-proof.
#
# 1.0.21 (G58 #2609): autogen=none — reverted in G60
# 1.0.20 (G55 #2605): match.kinds=[Pod] only — reverted in G60
version: 1.0.22
appVersion: "1.0.2"
keywords: [catalyst, blueprint, kyverno, policy, compliance, audit]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Opt out of the hollow-chart guard (Blueprint-Release workflow / issue #181):
# this chart legitimately ships only Catalyst-authored CRs (ClusterPolicy
# CRs that target the kyverno.io CRDs installed by bp-kyverno at slot 27).
# It has NO upstream Helm subchart to bundle. Same shape as
# bp-crossplane-claims (XRDs + Compositions, no upstream Crossplane subchart).
annotations:
  catalyst.openova.io/no-upstream: "true"
