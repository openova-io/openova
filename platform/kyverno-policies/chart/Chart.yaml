# 1.0.40 (EPIC #4286 mechanism B, 2026-06-25): NEW MUTATE policy
# `inject-gitea-source-secretref` (templates/mutate/01-...) — the ADMISSION FLOOR
# that auto-injects the canonical basic-auth `spec.secretRef.name`
# (openova-org-tenants-git-auth) on any Flux GitRepository/HelmRepository/
# OCIRepository whose `spec.url` host targets the Sovereign-local Gitea AND which
# has an empty/absent secretRef. bp-gitea ships `service.REQUIRE_SIGNIN_VIEW=true`
# (platform/gitea/chart/values.yaml), so an ANONYMOUS clone of the in-cluster
# Gitea returns HTTP 401 "authentication required" for EVERY repo — a
# secretRef-less local-Gitea source is therefore structurally invalid and sits
# "authentication required" forever (the #4283 → #4284 → #4285 bug class that
# recurred across 4 separate generators). Mechanism A (the shared
# `core/controllers/pkg/fluxsource` Go factory, #4285) closes this for the 3
# in-tree Go generators; THIS policy is the regression-proof admission layer that
# ALSO covers sources from ANY OTHER origin (charts, Blueprints, hand-applied
# CRs, a future fourth generator) — the layer that structurally defeats "the Nth
# generator forgets". The host law mirrors fluxsource.IsLocalSovereignSource
# (host carries the `gitea` substring): the in-cluster
# `gitea-http.gitea.svc.cluster.local` service AND the per-Sovereign
# `gitea.<loc>.<dom>` DNS match; github.com catalog-mirror sources do NOT and are
# left untouched. MUTATE (not VALIDATE/deny) so a not-yet-migrated generator is
# silently healed rather than fail-closed; idempotent — fires only when
# secretRef.name is empty/absent, never overrides the org-controller/operator
# value (the 19 catalyst-tenant-* sources are untouched). Scope is GITEA ONLY;
# the local-Harbor leg (post-bp-self-sovereign-cutover registry pivot) reuses the
# SAME admission guarantee and is the flagged follow-up. Mechanism D
# (env-controller cross-namespace secret reflection) is OUT OF SCOPE — it stacks
# behind the vcluster EPIC reshaping the env-controller. VERIFIED with
# `kyverno test tests/inject-gitea-source-secretref/` (5/5 pass): a secretRef-less
# in-cluster + per-Sovereign Gitea GitRepository (and an OCIRepository at a Gitea
# host) are mutate-injected with openova-org-tenants-git-auth; a github.com source
# is untouched; an already-secretRef'd source is untouched. Default ENABLED
# (non-rejecting mutate). Refs #4286 #4285 #4283.
# 1.0.36 (#3825, hw165, 2026-06-19): EXEMPT the `trivy-system` namespace from
# BOTH the flux-managed (10) and harbor-proxy-pull (11) Enforce policies via
# the existing per-policy `extraExcludeNamespaces` carve-outs. The
# trivy-operator dynamically SPAWNS vulnerability scan Jobs into `trivy-system`;
# those Jobs (a) carry no HelmRelease owner / `app.kubernetes.io/managed-by:
# flux` label (operator-generated ephemera — the operator definitionally cannot
# make its dynamic jobs Flux-managed, same class as the CNPG operator's
# Services/Jobs already exempted) and (b) are imaged from
# `mirror.gcr.io/aquasec/trivy` + an operator-injected initContainer, neither
# matching `*/proxy-*/*` or `*/openova-io/*`. On hw165 both Enforce policies
# denied EVERY scan-job create cluster-wide (trivy-operator log: "creating scan
# job failed: … workload-must-be-flux-managed … image-from-harbor-proxy-
# workload"), so trivy vulnerability scanning was silently dead. Scoped to
# THESE two policies only (operator-spawned scan-job ephemera) — `trivy-system`
# stays subject to every OTHER policy (the operator Deployment + node-collector
# pods carry pinned images + resource requests and still pass). Same proven
# shape as the `powerdns` (harbor-proxy) + `cnpg`/`shared-data`/`powerdns-admin`
# (flux-managed) carve-outs. values-only change; no template change.
# Refs #3825 #3642.
# 1.0.33 (2026-06-13): EXCLUDE the `powerdns` namespace from the
# harbor-proxy-pull (11) Enforce policy via a new per-policy
# `harborProxyPull.extraExcludeNamespaces` carve-out (same shape as the
# `flux-managed` extraExcludeNamespaces). bp-powerdns reverted its
# pdns-auth-50 + dnsdist-19 images back to raw `docker.io/powerdns/...`
# (bp-powerdns 1.2.14) because the `proxy-docker` Harbor project is NOT
# bootstrap-pullable on a fresh prov — #3380-D's proxy-docker reroute
# wedged EVERY fresh prov (hw131 + hw132: powerdns pods never started → no
# DNS → no wildcard TLS → console down). powerdns is a trusted first-party
# bootstrap component, so the docker.io images are exempt from the
# image-source glob; powerdns stays subject to every OTHER policy (scoped
# to THIS policy, NOT the shared complianceDefaultExcludes anchor). The
# carve-out is applied to all three harbor-proxy rules (pod / workload /
# cronjob). Re-doing #3380-D's proxy hardening correctly (proxy-docker
# made bootstrap-pullable, cred-free like proxy-ghcr) is a separate
# follow-up; once that lands the exclude can be dropped.
# 1.0.31 (Refs #3268 #3263, 2026-06-11): SYSTEMIC inoculation — NEW MUTATE policy
# `stamp-cilium-enforced-label` (templates/mutate/00-...) auto-stamps
# `policy.cilium.io/enforced: "true"` on the Pod template of every always-on
# bootstrap-kit workload that lacks it, BEFORE the 09-cilium-l7-mtls VALIDATE
# baseline evaluates the same admission request. The kube-apiserver runs MUTATING
# webhooks before VALIDATING webhooks within one request, so the stamp lands and
# 09 admits — fixing 30 of the 34 charts inventoried in #3268 at the owning layer
# instead of 30 per-chart label PRs (and future Blueprints for free). VERIFIED on
# a kind + kyverno v1.18 harness (matches the bp-kyverno engine pin): a Deployment
# missing the label was DENIED by 09 with the mutate absent, and ADMITTED with the
# label stamped on `spec.template.metadata.labels` once the mutate was present;
# an already-compliant Deployment was admitted UNCHANGED (idempotent via the
# `+(label)` add-when-missing anchor + a request.object precondition — the
# precondition is also what makes kyverno v1.18 register the resource mutating
# webhook at all). SAFETY: `policy.cilium.io/enforced` is a Catalyst-internal
# marker for the not-yet-shipped catalyst-network-controller (EPIC-5 #1100);
# Cilium upstream ignores it, WireGuard provides east-west mTLS unconditionally,
# and SPIFFE mutual-auth is OFF (bp-spire deferred) — so the label is INERT on the
# dataplane and safe to add broadly. A companion "Mutate B" (rewrite upstream
# images to the Harbor proxy, to fix the 11-harbor-proxy-pull violations on 26
# charts) was DESIGNED + proven idempotent on the SAME harness but DELIBERATELY
# NOT shipped: a static cluster-wide mutate cannot know the per-Sovereign Harbor
# host (`registry.<sov-fqdn>` post-cutover), and the only host it could hardcode
# is the mothership `harbor.openova.io` — which would re-tether sovereign clusters
# to the mothership and violate Pillar 5 / Principle #11 (the whole point of
# bp-self-sovereign-cutover). The docker proxy-project name is also drifted
# (`proxy-dockerhub` in 111 chart refs vs `proxy-docker`/`proxy-xpkg`/`proxy-ecr`
# in the cutover config — live mothership Harbor only has proxy-dockerhub/ghcr/
# gcr/k8s/quay), so a hardcoded rewrite would ImagePullBackOff some Sovereigns —
# strictly worse than a visible kyverno deny. The 26 charts with non-proxy images
# stay on the per-chart fix path; they are listed in the PR body.
# 1.0.30 (Refs #2737 #3236 #3248, 2026-06-11): EXCLUDE the operator-managed
# data-plane namespaces (`cnpg`, `shared-data`, `powerdns-admin`) from the
# `flux-managed` (10) Enforce policy. The CNPG operator creates Services
# (`<cluster>-r`/`-ro`/`-rw`) and utility Jobs with NO flux labels or
# ownerReferences — operator-owned objects definitionally cannot be
# Flux-managed, so flux-managed (the ONLY Enforce policy whose match-kinds
# include Service) denied "Unable to create required cluster objects" the
# moment a gated CNPG Cluster first reached admission on hw126. Those three
# namespaces predate the data plane and were never in the shared
# `complianceDefaultExcludes` anchor because no workload ran there until the
# first gate-flips. Scoped via a new per-policy `extraExcludeNamespaces` key
# (NOT the shared anchor): powerdns-admin also hosts a real `powerdns-admin`
# Deployment that MUST stay subject to every other policy, and CNPG instance
# Pods carry the harbor-proxied + pinned cluster image so they still PASS
# 04/05/11/12 — only the flux-unmanageable operator Service/Job needs the
# carve-out. Verified two-directionally on the same kind + kyverno v1.18
# harness as #3250 (CNPG Service in cnpg/shared-data/powerdns-admin →
# ADMITTED; identical no-flux Service in a non-excluded app namespace →
# DENIED; CNPG-shaped Pod with the pinned proxied image in cnpg → ADMITTED;
# CNPG-shaped Pod with a `:latest` image in cnpg → still DENIED, proving the
# Pod-path supply-chain policy stays enforced there).
# 1.0.29 (Refs #2737 #3236, 2026-06-11): FIX three baseline Enforce policies
# that had ALWAYS-FAIL validate patterns and had never admitted a single
# workload (undetected until a gated chart first reached admission on hw126):
#   - 04-probes: `{"?{}": "?*"}` required a probe SUB-KEY matching `?{}` (no
#     real probe field can) — and `"?*"` matches scalars only, not the probe
#     OBJECT. Switched to `validate.deny` with a JMESPath count (all
#     containers must declare both probes; handler-type agnostic).
#   - 11-harbor-proxy: the single `validate.anyPattern` rule wrote the Pod
#     path `spec.containers`; Kyverno autogen does NOT path-expand anyPattern
#     for workload controllers, so every Deployment was denied at the
#     non-existent `/spec/containers/`. Split into per-PATH-SHAPE rules
#     (Pod / template-bearing / CronJob) with `autogen-controllers: none`.
#     The `*/proxy-*/*` glob itself was always correct (`*` spans `/`).
#   - 12-image-tag-pinned: `(image): "!*:latest"` used a parenthesized
#     CONDITIONAL anchor (not a validation) → denied compliant `:0.4.2`;
#     also missed TAGLESS images. Switched to per-kind `validate.foreach`
#     + regex `deny` requiring a `@sha256` digest OR a real `:tag` in the
#     final path segment AND forbidding `:latest`.
# All three verified two-directionally on a local kind + kyverno v1.18
# harness (matches the bp-kyverno engine pin); 09-cilium-l7-mtls and
# 10-flux-managed left untouched and re-verified for no regression.
# 1.0.27 (G92.6 #2665, 2026-06-01): new K22 substrate-stays-on-host
# ClusterPolicy. Per docs/DOD.md §A4 the substrate components (Cilium,
# Flux, Kyverno, cert-manager, ESO, CNPG-operator, vCluster-syncers)
# MUST install on host k3s, never inside a vCluster. The policy fail-
# closes any HelmRelease whose metadata.name matches a substrate
# Blueprint AND whose spec.kubeConfig field is set — catches misuse
# of the G92.1 (#2660) vcluster-placement seam against substrate.
description: |
  Catalyst Blueprint chart that ships the EPIC-1 (#1096) compliance policy
  library — 20 ClusterPolicy templates rendered against Kyverno CRDs that
  the engine chart (bp-kyverno) installs.

  Split from bp-kyverno (predecessor: chart 1.2.0 with policies in-tree)
  because installing the engine + policies in a SINGLE Helm pass creates a
  CRD-ordering race: the Kyverno upstream subchart installs
  ClusterPolicy/Policy CRDs via its `charts/crds/templates/`, but the
  apiserver's RESTMapper has not yet learned `kyverno.io/v1.ClusterPolicy`
  when Helm tries to apply the ClusterPolicy CRs in the same release.
  Separating into TWO Blueprints + ordering via `Kustomization.dependsOn`
  on the engine slot lets the engine reconcile + register its CRDs first,
  THEN the policy chart applies cleanly. See Issue #2019.

  This chart has NO upstream subchart — it is a pure overlay that emits
  ClusterPolicy CRs. CRDs are provided by the engine chart's upstream
  Kyverno subchart at slot 27.
type: application
# 1.0.26 (G98 Refs #2644, 2026-06-01): NEW MUTATE policy
# `app-label-mutate` auto-stamps `catalyst.openova.io/application`
# label on Pods cluster-wide using `app.kubernetes.io/instance`
# (or `app.kubernetes.io/name` fallback) as source. Kyverno's
# `+(label)` add-when-missing syntax means no override of operator-
# set values. Unblocks per-Application Compliance scorecard rollups
# for every chart at once, without per-chart label-stamping PRs.
# Default ENABLED — non-rejecting MUTATE cannot block any workload.
# 1.0.22 (G60 RETROSPECTIVE #2611, 2026-05-30): META-AUDIT 7 closed.
# RE-ARCHITECTED harbor-proxy-pull + image-tag-pinned policies. After
# 7 rounds of regex_match+foreach+element.X patching (G19→G40→G45→G51→
# G55→G58) all hit Kyverno's JMESPath nil-substitution edge cases at
# different places (empty initContainers, sidecar injection, autogen
# Deployment variant, autogen=none + Pod CREATE).
#
# G60 drops the foreach+regex_match+element.X primitive ENTIRELY.
# Replaces with canonical `validate.pattern` + glob — oldest + most
# stable Kyverno primitive. Pattern validation uses request.object-
# direct data (server-side populated, no JMESPath substitution path,
# no element.X nil race). Autogen expands `containers.image` glob to
# `template.spec.containers.image` for Deployment/StatefulSet/etc.
#
# match.kinds restored to all Pod-spec-bearing kinds (G55 reverted).
# autogen annotation removed (G58 reverted) — pattern validation
# autogen-expansion is well-tested.
#
# allowedRegistryRegex → allowedImagePattern (rename for glob clarity)
# Default `harbor.*/proxy-*/*` covers all proxy paths + future-proof.
#
# 1.0.21 (G58 #2609): autogen=none — reverted in G60
# 1.0.20 (G55 #2605): match.kinds=[Pod] only — reverted in G60
# 1.0.23 (G64 #2613, 2026-05-30): broaden harbor-proxy-pull glob from
# `harbor.*/proxy-*/*` to `*/proxy-*/*`. G60 chose `harbor.*` as the
# subdomain prefix without checking actual deployed Harbor HTTPRoute
# hostname — Sovereigns expose Harbor at `registry.<sov>` subdomain.
# Verified live hw71 14:46Z: G62 chain finally landed harbor URLs on
# catalyst-api Deployment (`registry.hw71.omani.works/proxy-ghcr/...`)
# and policy still denied because of subdomain mismatch. SEMANTIC
# MARKER is the `/proxy-` path prefix (uniquely Harbor convention),
# not the subdomain. META-AUDIT 10 candidate locked in for post-ZT:
# policy-value-vs-actual-deployment consistency check.
#
# 1.0.24 (G66 #2615, 2026-05-31): switch validate.pattern (single
# glob) → validate.anyPattern (list of globs) to allow BOTH:
#   - `*/proxy-*/*` — proxy-cache mode (cilium/cert-manager/postgres)
#   - `*/openova-io/*` — native-push mode (catalyst-api + openova-io
#     services pushed by Step 03 Phase A skopeo into local Harbor)
# RCA: G55-G64 chain assumed Harbor proxy-cache could authenticate
# ghcr.io for openova-io PRIVATE packages. 45min hw73 validation
# proved otherwise — Harbor's github-ghcr adapter doesn't execute
# the 2-step token-endpoint flow ghcr.io requires. G66 pivots to
# native push for openova-io (immutable sovereignty per Pillar 5)
# while keeping proxy-cache for anonymous public registries.
# Lockstep with bp-self-sovereign-cutover 0.1.43 (Step 03 Phase A
# skopeo native-push + Step 07 REGISTRY drops /proxy-ghcr/ suffix).
# 1.0.34 (#3374 admin-tier, 2026-06-14): fix the resource-requests Enforce
# policy for CronJob. The single rule wrote `spec.template.spec.containers`
# (the Pod-controller path) and relied on Kyverno autogen to rewrite it to
# `spec.jobTemplate.spec.template.spec.containers` for CronJob — which did NOT
# fire for a freshly-created helm hook CronJob: bp-newapi's admin-promote
# CronJob (resources.requests PRESENT) was DENIED at `/spec/template/` and the
# whole bp-newapi upgrade was blocked (#3455). Pin `autogen-controllers: none`
# and split into explicit per-shape rules (Pod / template-bearing workload /
# CronJob), each at its real container path — mirrors the harbor-proxy policy
# (#2611) that solved the identical autogen-doesn't-expand class. No behavior
# change for Deployment/StatefulSet/DaemonSet/Job (still gated). Refs #3374.
# 1.0.35 (#3374 admin-tier, 2026-06-14): exclude CNPG operator-created objects
# from flux-managed by LABEL (app.kubernetes.io/managed-by: cloudnative-pg),
# cluster-wide, instead of only by namespace. A FRESH guacamole-pg CNPG Cluster
# (in shared catalyst-system) was wedged at "Unable to create required cluster
# objects" on hw133 because its operator-created Service/guacamole-pg-r was
# denied by flux-managed — the per-namespace exclude only covered dedicated
# CNPG namespaces (cnpg/shared-data/powerdns-admin), and catalyst-system /
# newapi host real Deployments that must stay gated. newapi-pg / openova-flow-pg
# only passed because they were bootstrap-grandfathered (kyverno validates on
# CREATE/UPDATE only) — a truly fresh prov hits the same wall. Excluding on the
# operator label exempts ONLY CNPG operator-owned Services + utility Jobs in any
# namespace; every Flux/Helm/kubectl workload stays gated. Refs #3374 #3248.
# 1.0.37 (#3859): add `org-services` to harbor-proxy-pull extraExcludeNamespaces
# (sme→org-services rename #3383 orphaned the mixed-image-Pod carve-out → the
# provisioning CR-minter was Enforce-denied → #3376 funnel could not go ACTIVE).
# 1.0.38 (#3971): K23 forbid-local-path-storage ClusterPolicy — ENFORCE-always
# (NOT bootstrapMode-gated) deny of any PVC/StorageClass/PV referencing
# local-path / rancher.io/local-path. The admission layer of the 3-layer
# local-path-FORBIDDEN defence (k3s --disable=local-storage + cloud CSI default
# + this policy). Founder: "local path never ever ALLOWED".
# 1.0.39 (#3971, hw178 dep 02bc518fcb1b4cb3, 2026-06-21): EXCLUDE CNPG-managed
# PVCs from the `pvc-must-be-velero-backed` rule (K2 backup-configured). The
# DB tier (harbor-pg / gitea-pg / guacamole-pg / pdns-pg / keycloak) runs on
# CloudNativePG, which creates each instance PVC WITHOUT Velero labels because
# it backs up via its OWN continuous barman / object-store WAL-streaming, not
# Velero. The over-broad rule flagged the entire DB tier as a backup-configured
# `fail` ("PVC harbor-pg-1 is not declared as part of a Velero backup"),
# stranding the database PVCs the moment the policy is Enforce. Added an
# `exclude.any[].resources.selector.matchExpressions` on `cnpg.io/cluster`
# Exists — exempts ONLY operator-backed CNPG PVCs in ANY namespace; genuinely-
# unprotected user PVCs stay subject to the velero-backed requirement. Mirrors
# the by-label CNPG carve-out on the flux-managed policy (#3374). Template-only
# behavior change + new test fixtures. Refs #3971.
# 1.0.42 (#4349, kom4dc dep 4635277cae4ffed9, 2026-06-25): EXEMPT crossplane-system
# from harbor-proxy-pull. bp-crossplane's control-plane pod pulls upstream
# xpkg.upbound.io/crossplane/crossplane:v1.18.0 (not Harbor-mirrored; chart
# imageRegistry-rewrite unset on a fresh prov), which matches neither
# */proxy-*/* nor */openova-io/*, so the Enforce policy denied the pod create →
# bp-crossplane rollback-loop → bp-crossplane-claims → bp-catalyst-platform
# never converged → org-controller roll gated. Added crossplane-system to the
# policy-scoped harborProxyPull.extraExcludeNamespaces (same shape as
# powerdns/trivy-system/org-services). Values-only change. Refs #4349 #4212.
# 1.0.43 (#4422, 2026-06-26): multi-replica-drainability now excludes Deployments
# labeled `openova.io/singleton-db: "true"` in ANY namespace (new
# multiReplica.excludeSingletonDB value, default true). The per-Org funnel cart's
# single-PVC stateful DBs (mysql/postgres, strategy:Recreate, no replication
# wired) + redis cache are deliberate singletons that span unbounded org-<uuid>
# namespaces the excludeNamespaces list can't enumerate. Mirrors the cnpg.io/
# cluster label-exempt on backup-configured (#3971). Template+values change.
# Refs #4422 #3376.
# 1.0.45 (#4765): flux-managed carve-out for Helm HOOK resources
#   (helm.sh/hook annotation) — hooks get no Flux labels + Helm force-stamps
#   managed-by:Helm, so a legit hook Job (bp-powerdns zone-bootstrap) was
#   Enforce-denied on live upgrade, stranding the powerdns anycast NodePort.
version: 1.0.47
appVersion: "1.0.2"
keywords: [catalyst, blueprint, kyverno, policy, compliance, audit]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Opt out of the hollow-chart guard (Blueprint-Release workflow / issue #181):
# this chart legitimately ships only Catalyst-authored CRs (ClusterPolicy
# CRs that target the kyverno.io CRDs installed by bp-kyverno at slot 27).
# It has NO upstream Helm subchart to bundle. Same shape as
# bp-crossplane-claims (XRDs + Compositions, no upstream Crossplane subchart).
annotations:
  catalyst.openova.io/no-upstream: "true"
