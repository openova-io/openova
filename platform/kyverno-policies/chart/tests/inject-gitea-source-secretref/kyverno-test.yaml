# EPIC #4286 mechanism B — Kyverno conformance test for the
# `inject-gitea-source-secretref` MUTATE policy, a MutatingPolicy since CMP-065.
#
# Run with the Kyverno CLI:
#   kyverno test platform/kyverno-policies/chart/tests/inject-gitea-source-secretref/
#
# `policy.yaml` is the render of the template with the chart defaults
# (committed so the test is self-contained + CI-runnable without a Helm pass in
# the test step); tests/suites-current.sh fails when it is not the current
# render, and its header gives the re-render command.
#
# CMP-065: every case passed on the legacy ClusterPolicy render first (kyverno
# CLI v1.19.2), each result naming the legacy rule given in its comment. Only
# policy.yaml and that key of each result (isMutatingPolicy: true) changed;
# the resources, the expected results and the patched resources are the same.
#
# SIX cases prove the EPIC's mechanism-B acceptance bullet
# ("an applied secretRef-less local-Gitea source is mutate-injected to carry the
# canonical secret; a github.com source is left untouched; an already-secretRef'd
# source is left untouched"):
#   1. in-cluster Gitea, no secretRef        → MUTATE (inject) → pass + patchedResource
#   2. per-Sovereign Gitea DNS, no secretRef  → MUTATE (inject) → pass + patchedResource
#   3. github.com public, no secretRef        → SKIP (condition 1 false) → result: skip
#   4. in-cluster Gitea WITH secretRef        → SKIP (condition 2 false, idempotent) → result: skip
#   5. OCIRepository at Gitea host, no secretRef → MUTATE (inject) → pass (cross-kind coverage)
#   6. in-cluster Gitea, secretRef naming no Secret → SKIP, left as it is on both kinds
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: inject-gitea-source-secretref-test
policies:
  - policy.yaml
resources:
  - resource-incluster-gitea-no-secretref.yaml
  - resource-persovereign-gitea-no-secretref.yaml
  - resource-github-public-no-secretref.yaml
  - resource-incluster-gitea-with-secretref.yaml
  - resource-ocirepository-gitea-no-secretref.yaml
results:
  # 1. secretRef-less in-cluster Gitea source → injected.
  - policy: inject-gitea-source-secretref
    isMutatingPolicy: true # legacy rule: inject-secretref-on-local-gitea-source
    resources:
      - catalyst-app-omantel-biz-agenity
    kind: GitRepository
    patchedResources: patched-incluster-gitea.yaml
    result: pass
  # 2. secretRef-less per-Sovereign Gitea DNS source → injected.
  - policy: inject-gitea-source-secretref
    isMutatingPolicy: true # legacy rule: inject-secretref-on-local-gitea-source
    resources:
      - openova-catalog-sovereign
    kind: GitRepository
    patchedResources: patched-persovereign-gitea.yaml
    result: pass
  # 3. github.com catalog-mirror → UNTOUCHED (no `gitea` host substring).
  - policy: inject-gitea-source-secretref
    isMutatingPolicy: true # legacy rule: inject-secretref-on-local-gitea-source
    resources:
      - openova
    kind: GitRepository
    result: skip
  # 4. already-secretRef'd local-Gitea source → UNTOUCHED (idempotent;
  #    never overrides the org-controller / operator-set value).
  - policy: inject-gitea-source-secretref
    isMutatingPolicy: true # legacy rule: inject-secretref-on-local-gitea-source
    resources:
      - catalyst-tenant-walkorg
    kind: GitRepository
    result: skip
  # 5. OCIRepository at a Gitea host, no secretRef → injected (cross-kind).
  - policy: inject-gitea-source-secretref
    isMutatingPolicy: true # legacy rule: inject-secretref-on-local-gitea-source
    resources:
      - catalyst-app-omantel-biz-chart
    kind: OCIRepository
    patchedResources: patched-ocirepository-gitea.yaml
    result: pass
  # 6. a secretRef that names no Secret → left as it is (CMP-065).
  - policy: inject-gitea-source-secretref
    isMutatingPolicy: true # legacy rule: inject-secretref-on-local-gitea-source
    resources:
      - catalyst-tenant-nameless
    kind: GitRepository
    result: skip
