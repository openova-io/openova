# EPIC #4286 mechanism B — INPUT fixture (NEGATIVE / idempotency): a local-Gitea
# GitRepository that ALREADY carries a secretRef (the correctly-wired
# organization-controller leg — the 19 live catalyst-tenant-* sources). The
# mutate policy MUST leave it UNTOUCHED (the match condition secretref-absent
# is false) — never override an operator/org-set value.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: catalyst-tenant-walkorg
  namespace: flux-system
spec:
  interval: 60s
  url: http://gitea-http.gitea.svc.cluster.local:3000/walkorg/walkorg.git
  ref:
    branch: main
  secretRef:
    name: openova-org-tenants-git-auth
---
# CMP-065: a secretRef that names no Secret is left as it is, on the legacy
# kind (its add-when-missing anchor) and on the new one (secretRef-absent).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: catalyst-tenant-nameless
  namespace: flux-system
spec:
  interval: 60s
  url: http://gitea-http.gitea.svc.cluster.local:3000/walkorg/walkorg.git
  secretRef: {}
