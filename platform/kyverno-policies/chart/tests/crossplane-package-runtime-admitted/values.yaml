# Case 10 of resources.yaml is judged as the DELETE that Crossplane's
# deactivation hook sends for the runtime Deployment of an inactive revision.
# Every other case is judged as a CREATE. probes-present, a ValidatingPolicy,
# is not listed: the command-line tool does not read per-resource values for
# that kind, and its resource rules match no DELETE (crossplane-runtime-suite-current.sh C3).
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
globalValues:
  request.operation: CREATE
policies:
  - name: flux-managed
    resources:
      - name: provider-opentofu-4aeddb701725
        values:
          request.operation: DELETE
