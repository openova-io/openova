apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: flux-managed
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: governance
  annotations:
    policies.kyverno.io/title: Workloads must be managed by Flux
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Workload-rendering resources must carry
      `app.kubernetes.io/managed-by: flux` (the upstream Flux label) OR
      have an ownerReference pointing at a HelmRelease / Kustomization.
      Direct kubectl apply is rejected — IaC-first per
      docs/INVIOLABLE-PRINCIPLES.md #3.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: workload-must-be-flux-managed
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
                - Service
                - Ingress
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
                - cilium
                - cilium-gateway
                - dragonfly
                - cert-manager
                - openova-system
                - catalyst
                - kyverno
                - monitoring
                - ingress
                - sso-bridge
                - falco
                - cnpg
                - shared-data
                - powerdns-admin
                - trivy-system
          - resources:
              selector:
                matchLabels:
                  app.kubernetes.io/managed-by: cloudnative-pg
          - resources:
              namespaceSelector:
                matchExpressions:
                  - key: openova.io/organization
                    operator: Exists
          - resources:
              kinds:
                - Service
              names:
                - "test-service-delete-me-*"
          - resources:
              annotations:
                helm.sh/hook: "*"
      validate:
        message: >-
          {{request.object.kind}}/{{request.object.metadata.name}} is
          not Flux-managed. Add label
          `app.kubernetes.io/managed-by: flux` on metadata.labels OR
          attach an ownerReference to a HelmRelease / Kustomization.
        deny:
          conditions:
            all:
              - key: '{{ request.object.metadata.labels."app.kubernetes.io/managed-by" || '''' }}'
                operator: NotEquals
                value: flux
              # Wave 5.97 nil-safety: check Flux-applied labels instead of
              # ownerReferences. Flux sets BOTH helm.toolkit.fluxcd.io/name AND
              # kustomize.toolkit.fluxcd.io/name on every resource it manages.
              # The original JMESPath filter `ownerReferences[?kind==X]` errors
              # when ownerReferences is nil (most kubectl-created Pods + debug
              # pods + admission-time injected sidecars), and admission webhook
              # failurePolicy=Fail blocks all pod creation cluster-wide.
              # Label-based check is nil-safe via the `||` JMESPath fallback.
              - key: '{{ request.object.metadata.labels."helm.toolkit.fluxcd.io/name" || '''' }}'
                operator: Equals
                value: ''
              - key: '{{ request.object.metadata.labels."kustomize.toolkit.fluxcd.io/name" || '''' }}'
                operator: Equals
                value: ''
            any:
              - key: '{{ request.object.spec.template.metadata.labels."pkg.crossplane.io/revision" || request.object.spec.selector."pkg.crossplane.io/revision" || '''' }}'
                operator: Equals
                value: ''
              - key: '{{ request.object.metadata.ownerReferences[?controller && starts_with(apiVersion, ''pkg.crossplane.io/'')].kind || '''' }}'
                operator: AnyNotIn
                value:
                  - ProviderRevision
                  - FunctionRevision
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: probes-present
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: resilience
  annotations:
    policies.kyverno.io/title: Containers must declare liveness and readiness probes
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every primary container in a Deployment / StatefulSet / DaemonSet
      must declare both livenessProbe and readinessProbe. Without
      probes, kubelet can't detect a wedged process and Service can't
      gate traffic during startup.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: containers-must-have-liveness-and-readiness
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
                - cilium
                - cilium-gateway
                - dragonfly
                - cert-manager
                - openova-system
                - catalyst
                - kyverno
                - monitoring
                - ingress
                - sso-bridge
                - falco
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: NotEquals
            value: DELETE
      validate:
        message: >-
          Every container in
          {{request.object.kind}}/{{request.object.metadata.name}} must
          declare both livenessProbe and readinessProbe.
        # The prior `validate.pattern` form `livenessProbe: {"?{}": "?*"}`
        # required a probe SUB-KEY literally matching the glob `?{}` — no real
        # probe field (httpGet / exec / tcpSocket / initialDelaySeconds …) can
        # ever match that, so the pattern denied EVERY workload (it never
        # admitted one — undetected because no gated chart reached admission).
        #
        # `livenessProbe: "?*"` does NOT work either: the `?*` wildcard only
        # matches NON-EMPTY SCALAR values, while `livenessProbe` is an OBJECT
        # (httpGet / exec / …) — empirically verified in the kind+kyverno
        # v1.18 harness that `"?*"` against an object field denies even a
        # compliant container.
        #
        # The robust, probe-handler-agnostic check is `validate.deny` with a
        # JMESPath count: "the number of containers that DECLARE the probe must
        # equal the total container count" (i.e. ALL containers carry it).
        # `containers[?livenessProbe]` filters to containers where the field is
        # present/truthy. This works for any handler type and autogen-expands
        # cleanly to `spec.template.spec.containers` for the matched workload
        # kinds. Empirically green across both directions in the harness.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.template.spec.containers[?livenessProbe] | length(@) }}"
                operator: NotEquals
                value: "{{ request.object.spec.template.spec.containers | length(@) }}"
              - key: "{{ request.object.spec.template.spec.containers[?readinessProbe] | length(@) }}"
                operator: NotEquals
                value: "{{ request.object.spec.template.spec.containers | length(@) }}"
