          runAsUser: 2000
        volumeMounts:
        - mountPath: /tls/server
          name: tls-server-certs
          readOnly: true
      securityContext:
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
      serviceAccountName: function-patch-and-transform-e9fec78aeef5
      volumes:
      - name: tls-server-certs
        secret:
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          - key: ca.crt
            path: ca.crt
          secretName: function-patch-and-transform-tls-server
---
