# 4. The function's Service, headless, port grpc. ADMITTED. This is the
#    object flux-managed refused on hw307 since the function's first install.
apiVersion: v1
kind: Service
metadata:
  name: function-patch-and-transform
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: pkg.crossplane.io/v1
    blockOwnerDeletion: true
    controller: true
    kind: FunctionRevision
    name: function-patch-and-transform-e9fec78aeef5
    uid: 3c9a2e70-5b1d-4f86-8a43-9e0d6c2b7f22
spec:
  clusterIP: None
  ports:
  - appProtocol: tls
    name: grpc
    port: 9443
    protocol: TCP
    targetPort: grpc
  selector:
    pkg.crossplane.io/function: function-patch-and-transform
    pkg.crossplane.io/revision: function-patch-and-transform-e9fec78aeef5
---
