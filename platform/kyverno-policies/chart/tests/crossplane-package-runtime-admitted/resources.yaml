# INPUT fixtures of the crossplane-package-runtime-admitted suite.
#
# Cases 1 to 4 are the objects Crossplane v2.4.3's package manager builds,
# produced by its own code (internal/controller/pkg/runtime: the builder
# NewDeploymentRuntimeBuilder with BuilderWithRuntimeConfig, and the
# overrides the provider and function hooks pass) from the two runtime
# configs in clusters/_template/infrastructure/providers/base, status
# dropped. Revision names are those of hw307. The ServiceAccount the
# builder also makes is left out: neither policy matches ServiceAccount.
# Note what Crossplane does NOT stamp: no label on the metadata of any of
# these objects. The package label sits on the Deployment's selector and
# pod template and on the Service's selector.
#
# check-crossplane-runtime-probes.py proves the runtime configs carry the
# probes that cases 1 and 2 show; crossplane-runtime-suite-current.sh
# proves policy.yaml is the current render of the two templates.
---
# 1. The Deployment of a ProviderRevision, as Crossplane 2.4.3 builds it with
#    the runtime config provider-opentofu. ADMITTED by both policies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-opentofu-81ec1e8dd865
  namespace: crossplane-system
  ownerReferences:
  - apiVersion: pkg.crossplane.io/v1
    blockOwnerDeletion: true
    controller: true
    kind: ProviderRevision
    name: provider-opentofu-81ec1e8dd865
    uid: 7d1f3b52-0c55-4a3e-9d0e-2b6f4f7c1a11
spec:
  replicas: 1
  selector:
    matchLabels:
      pkg.crossplane.io/provider: provider-opentofu
      pkg.crossplane.io/revision: provider-opentofu-81ec1e8dd865
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '8080'
        prometheus.io/scrape: 'true'
      labels:
        pkg.crossplane.io/provider: provider-opentofu
        pkg.crossplane.io/revision: provider-opentofu-81ec1e8dd865
    spec:
      containers:
      - args:
        - --max-reconcile-rate=2
        - --timeout=20m
        env:
        - name: TLS_CLIENT_CERTS_DIR
          value: /tls/client
        - name: TLS_SERVER_CERTS_DIR
          value: /tls/server
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PROVIDER_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['pkg.crossplane.io/provider']
        - name: REVISION_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['pkg.crossplane.io/revision']
        - name: REVISION_UID
          value: 7d1f3b52-0c55-4a3e-9d0e-2b6f4f7c1a11
        - name: WEBHOOK_TLS_CERT_DIR
          value: $(TLS_SERVER_CERTS_DIR)
        envFrom:
        - secretRef:
            name: cloud-credentials
            optional: true
        image: xpkg.upbound.io/upbound/provider-opentofu@sha256:b4690e8ffe0a963b1d7df64f18f409217600b2a3bda25d1e01e4bafde976e675
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              m="$(curl -sf --max-time 4 http://127.0.0.1:8080/metrics)" || exit 1
              printf '%s\n' "$m" | awk -v max=1800 '
                /^workqueue_longest_running_processor_seconds[{]/ {
                  v = $0; sub(/^[^}]*[}] /, "", v); split(v, f, " ")
                  if (f[1] + 0 > max) held = 1
                  if (index($0, "name=\"managed/workspace.opentofu.upbound.io\"")) seen = 1
                }
                END { if (seen && !held) exit 0; exit 1 }'
          failureThreshold: 6
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
        name: package-runtime
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 9443
          name: webhook
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /metrics
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "3"
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          runAsGroup: 2000
          runAsNonRoot: true
          runAsUser: 2000
        volumeMounts:
        - mountPath: /tls/client
          name: tls-client-certs
          readOnly: true
        - mountPath: /tls/server
          name: tls-server-certs
          readOnly: true
      securityContext:
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
      serviceAccountName: provider-opentofu-81ec1e8dd865
      volumes:
      - name: tls-client-certs
        secret:
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          - key: ca.crt
            path: ca.crt
          secretName: provider-opentofu-tls-client
      - name: tls-server-certs
        secret:
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          - key: ca.crt
            path: ca.crt
          secretName: provider-opentofu-tls-server
---
