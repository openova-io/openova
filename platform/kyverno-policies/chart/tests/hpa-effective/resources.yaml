# Inputs of the suite hpa-effective.

# 1. minReplicas 2: compliant.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: min-two
  namespace: example
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 2
  maxReplicas: 5
---
# 2. minReplicas 0: not compliant.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: min-zero
  namespace: example
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 0
  maxReplicas: 5
---
# 3. minReplicas not declared: not compliant.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: min-unset
  namespace: example
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  maxReplicas: 5
---
# 4. minReplicas 1 through the older API version: compliant.
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: min-one-v1
  namespace: example
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 1
  maxReplicas: 5
---
# 5. minReplicas 0 in an excluded namespace: excluded.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: min-zero
  namespace: kube-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 0
  maxReplicas: 5
