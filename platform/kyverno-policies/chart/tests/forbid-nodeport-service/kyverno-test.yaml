# Suite of the policy forbid-nodeport-service
# (templates/baseline/24-forbid-nodeport-service.yaml), #5088, CMP-079.
#
# Written on the legacy ClusterPolicy render first (window closed: Enforce),
# where every case passed with the kyverno CLI v1.19.2 and each result named
# one of its two rules. The ValidatingPolicy has no rule names and gives one
# result per Service: fail where a legacy rule failed, skip for the labelled
# NodePort solver the legacy NodePort rule excluded, pass for the rest. The
# resources (resource-services.yaml, 1 to 10) are the same; every refused form
# is still refused.
#
# policy.yaml is the render of the template with the chart defaults;
# tests/suites-current.sh fails when it is not the current render.
# Run: kyverno test platform/kyverno-policies/chart/tests/forbid-nodeport-service
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: forbid-nodeport-service-test
policies:
  - policy.yaml
resources:
  - resource-services.yaml
results:
  # A NodePort Service → DENIED (§854).
  - policy: forbid-nodeport-service
    isValidatingPolicy: true
    kind: Service
    resources:
      - openova-system/powerdns-api-ext
      - iogrid/cm-acme-http-solver-9xk2p
      - kube-system/system-nodeport
      - iogrid/solver-label-false
    result: fail
  # A LoadBalancer Service that allocates node ports → DENIED (§854).
  - policy: forbid-nodeport-service
    isValidatingPolicy: true
    kind: Service
    resources:
      - cilium-gateway/gateway-lb-leaky
      - cilium-gateway/gateway-lb-allocating
      - iogrid/solver-labelled-lb
    result: fail
  # No node port → admitted.
  - policy: forbid-nodeport-service
    isValidatingPolicy: true
    kind: Service
    resources:
      - openova-system/powerdns-api
      - cilium-gateway/gateway-lb-clean
    result: pass
  # The cert-manager HTTP-01 solver (NodePort with the label) → not judged.
  - policy: forbid-nodeport-service
    isValidatingPolicy: true
    kind: Service
    resources:
      - iogrid/cm-acme-http-solver-by-label
    result: skip
