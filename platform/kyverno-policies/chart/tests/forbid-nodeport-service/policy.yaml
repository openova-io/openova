apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: forbid-nodeport-service
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: network-exposure
  annotations:
    policies.kyverno.io/title: Forbid NodePort Services (§854)
    policies.kyverno.io/category: catalyst-network-exposure
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Service
    policies.kyverno.io/description: >-
      §854 (founder #1 ABSOLUTE ban): a Service must never be type=NodePort, and
      a type=LoadBalancer Service must set allocateLoadBalancerNodePorts=false so
      it does not silently allocate nodePorts. The gateway is served DIRECT
      (cilium LB-IPAM VIP / shared-EIP, or Local-ETP + hostPort), never a
      nodePort. Ships Audit; Enforce is the deliberate follow-up (#5088).
      cert-manager HTTP-01 solver Services are carved out.
spec:
  # HARDCODED Deny — NOT the bootstrap-window helper. See the header comment.
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  matchConditions:
    - name: exclude-namespaces
      expression: "!(object.metadata.?namespace.orValue('') in [])"
    # The cert-manager ACME HTTP-01 solver, by its LABEL ONLY: a solver-shaped
    # name is no carve-out (#5564). Only a labelled NodePort is skipped, as the
    # legacy NodePort rule skipped it; a labelled LoadBalancer is still judged.
    - name: exclude-acme-http01-solver
      expression: >-
        !(object.spec.?type.orValue('') == 'NodePort' &&
        object.metadata.?labels.orValue({})[?'acme.cert-manager.io/http01-solver'].orValue('') == 'true')
  validations:
    # ── no Service may be type=NodePort ───────────────────────────────────
    - expression: "object.spec.?type.orValue('') != 'NodePort'"
      message: >-
        This Service is type=NodePort — FORBIDDEN by §854 (founder #1 ABSOLUTE
        ban). Never use a NodePort, not even for testing. Expose it DIRECT
        instead: a ClusterIP Service fronted by a gateway HTTPRoute/TCPRoute,
        or the cilium LB-IPAM VIP / shared-EIP (lbipam.cilium.io/sharing-key).
        See #5088.
    # ── a LoadBalancer Service must NOT allocate nodePorts ────────────────
    #    allocateLoadBalancerNodePorts defaults to true, so an unset one fails.
    - expression: >-
        object.spec.?type.orValue('') != 'LoadBalancer' ||
        object.spec.?allocateLoadBalancerNodePorts.orValue(true) == false
      message: >-
        This Service is type=LoadBalancer without
        allocateLoadBalancerNodePorts=false — it silently allocates a nodePort
        per port, violating §854. Set `spec.allocateLoadBalancerNodePorts:
        false` so no nodePort is opened. See #5088.
