# The resources of ../resources.yaml run as a developer of the management
# Organization openova-internal (user-info.yaml beside this file): its
# Organization is in managementOrgs but developer is not in
# allowedCrossOrgTiers, so every grant into another Organization is refused;
# membership of the management Organization alone does not suffice (CMP-095).
#
# Run: kyverno test platform/kyverno-policies/chart/tests/useraccess-boundary
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: useraccess-boundary-management-developer-test
policies:
  - ../policy.yaml
resources:
  - ../resources.yaml
userinfo: user-info.yaml
results:
  - policy: useraccess-boundary
    isValidatingPolicy: true
    kind: UserAccess
    resources: [sample-acme-developer-wp, sample-cross-org-wp-grant, sample-first-org-scope-decides]
    result: fail
  - policy: useraccess-boundary
    isValidatingPolicy: true
    kind: UserAccess
    resources: [sample-application-only-grant, sample-empty-org-grant]
    result: skip
