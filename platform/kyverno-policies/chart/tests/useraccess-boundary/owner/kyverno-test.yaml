# The resources of ../resources.yaml run as an owner of the Organization acme
# (user-info.yaml beside this file): owner is in allowedCrossOrgTiers, but acme
# is not in managementOrgs, so a grant inside acme is admitted and a grant into
# another Organization is refused (CMP-095).
#
# Run: kyverno test platform/kyverno-policies/chart/tests/useraccess-boundary
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: useraccess-boundary-owner-test
policies:
  - ../policy.yaml
resources:
  - ../resources.yaml
userinfo: user-info.yaml
results:
  - policy: useraccess-boundary
    isValidatingPolicy: true
    kind: UserAccess
    resources: [sample-acme-developer-wp]
    result: pass
  - policy: useraccess-boundary
    isValidatingPolicy: true
    kind: UserAccess
    resources: [sample-cross-org-wp-grant, sample-first-org-scope-decides]
    result: fail
  - policy: useraccess-boundary
    isValidatingPolicy: true
    kind: UserAccess
    resources: [sample-application-only-grant, sample-empty-org-grant]
    result: skip
