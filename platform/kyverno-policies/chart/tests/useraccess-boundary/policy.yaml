apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: useraccess-boundary
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: rbac-boundary-policy
    catalyst.openova.io/policy-tier: governance
    catalyst.openova.io/policy-domain: rbac
  annotations:
    policies.kyverno.io/title: Internal-vs-customer Org boundary on UserAccess
    policies.kyverno.io/category: catalyst-rbac
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Denies UserAccess CRs whose openova.io/org scope differs from the
      requesting user's org claim, unless the requester is a member of
      the management Organization with tier=owner. Permissive Audit by
      default; per-Sovereign overlay flips to Enforce.
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["access.openova.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["useraccesses"]
  matchConditions:
    - name: has-org-scope
      expression: >-
        object.?spec.?scopes.orValue([]).exists(s, s.?key.orValue('') == 'openova.io/org') &&
        object.spec.scopes.filter(s, s.?key.orValue('') == 'openova.io/org')[0].?value.orValue('') != ''
  variables:
    - name: scopeOrg
      expression: "object.spec.scopes.filter(s, s.?key.orValue('') == 'openova.io/org')[0].value"
    - name: requesterOrgs
      expression: "request.userInfo.?extra[?'org'].orValue([])"
    - name: requesterTiers
      expression: "request.userInfo.?extra[?'tier'].orValue([])"
    - name: requesterOrg
      expression: "size(variables.requesterOrgs) > 0 ? variables.requesterOrgs[0] : ''"
    - name: requesterTier
      expression: "size(variables.requesterTiers) > 0 ? variables.requesterTiers[0] : ''"
    - name: managementOrgs
      expression: "['openova-internal']"
    - name: allowedTiers
      expression: "['owner', 'catalyst-owner']"
  validations:
    - expression: >-
        variables.scopeOrg == variables.requesterOrg ||
        (variables.requesterOrg != '' && variables.requesterOrg in variables.managementOrgs &&
        variables.requesterTier != '' && variables.requesterTier in variables.allowedTiers)
      message: >-
        UserAccess crosses Organization boundaries. Only the management
        Organization's owner (tier=owner in the openova-internal Org) may
        sign cross-Org grants. Adjust the scope's openova.io/org value to
        match your own Org or escalate the grant to a management-Org owner.
      messageExpression: >-
        'UserAccess crosses Organization boundaries: the request grants access to Org `' +
        variables.scopeOrg + '` but the requester is in Org `' +
        (variables.requesterOrg != '' ? variables.requesterOrg : '<unknown>') + '` (tier `' +
        (variables.requesterTier != '' ? variables.requesterTier : '<unknown>') +
        "`). Only the management Organization's owner (tier=owner in the openova-internal Org) may sign cross-Org grants. Adjust the scope's openova.io/org value to match your own Org or escalate the grant to a management-Org owner."
