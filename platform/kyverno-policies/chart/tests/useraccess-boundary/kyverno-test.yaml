# Suite of the policy useraccess-boundary
# (templates/baseline/25-useraccess-boundary.yaml), run as a developer of the
# Organization acme (user-info.yaml); owner/kyverno-test.yaml runs the same
# resources as an owner, management-owner/ and management-developer/ as an
# owner and a developer of the management Organization openova-internal.
#
# Written on the legacy ClusterPolicy render of
# platform/crossplane-claims/chart/templates/policies/userAccess-boundary.yaml
# first, where every case passed with the kyverno CLI v1.19.2 and each result
# named its one rule, deny-cross-org-grants. The ValidatingPolicy has no rule
# names; the resources (resources.yaml) and the verdicts are the same (CMP-086).
#
# policy.yaml is the render of the template with the chart defaults;
# tests/suites-current.sh fails when it is not the current render.
#
# Run: kyverno test platform/kyverno-policies/chart/tests/useraccess-boundary
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: useraccess-boundary-test
policies:
  - policy.yaml
resources:
  - resources.yaml
userinfo: user-info.yaml
results:
  - policy: useraccess-boundary
    isValidatingPolicy: true
    kind: UserAccess
    resources: [sample-acme-developer-wp]
    result: pass
  - policy: useraccess-boundary
    isValidatingPolicy: true
    kind: UserAccess
    resources: [sample-cross-org-wp-grant, sample-first-org-scope-decides]
    result: fail
  - policy: useraccess-boundary
    isValidatingPolicy: true
    kind: UserAccess
    resources: [sample-application-only-grant, sample-empty-org-grant]
    result: skip
