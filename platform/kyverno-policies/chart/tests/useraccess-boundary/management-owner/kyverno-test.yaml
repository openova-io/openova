# The resources of ../resources.yaml run as an owner of the management
# Organization openova-internal (user-info.yaml beside this file): its
# Organization is in managementOrgs and owner is in allowedCrossOrgTiers, so
# every grant is admitted, also the grants into acme and other-corp (CMP-095).
#
# Run: kyverno test platform/kyverno-policies/chart/tests/useraccess-boundary
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: useraccess-boundary-management-owner-test
policies:
  - ../policy.yaml
resources:
  - ../resources.yaml
userinfo: user-info.yaml
results:
  - policy: useraccess-boundary
    rule: deny-cross-org-grants
    kind: UserAccess
    resources: [sample-acme-developer-wp, sample-cross-org-wp-grant, sample-first-org-scope-decides]
    result: pass
  - policy: useraccess-boundary
    rule: deny-cross-org-grants
    kind: UserAccess
    resources: [sample-application-only-grant, sample-empty-org-grant]
    result: skip
