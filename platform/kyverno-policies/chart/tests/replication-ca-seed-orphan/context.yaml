# The HelmReleases the policy's resource.List sees, per namespace. Each one
# carries the label the application-controller stamps on every HelmRelease of
# an Application (catalyst.openova.io/app, render.LabelApp); the names are
# the controller's <app>-<cluster> names.
apiVersion: cli.kyverno.io/v1alpha1
kind: Context
metadata:
  name: context
spec:
  resources:
    # org-a: alpha is installed.
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: alpha-rtz-a
        namespace: org-a
        labels:
          catalyst.openova.io/app: alpha
    # org-b: beta is being uninstalled; helm-controller's finalizer holds it.
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: beta-rtz-a
        namespace: org-b
        labels:
          catalyst.openova.io/app: beta
        deletionTimestamp: "2026-11-23T16:41:46Z"
        finalizers:
          - finalizers.fluxcd.io
    # org-c holds no HelmRelease. gamma's name in ANOTHER namespace does not
    # count for org-c.
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: gamma-rtz-a
        namespace: org-other
        labels:
          catalyst.openova.io/app: gamma
    # org-d: delta-two is installed, delta-one is gone.
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: delta-two-rtz-a
        namespace: org-d
        labels:
          catalyst.openova.io/app: delta-two
    # org-e: a long Application name. The HelmRelease name is shortened by
    # render.HRNameFor (TestHRNameFor_SeedCleanupFixture pins this value);
    # the label keeps the whole name.
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: marketing-site-of-the-acme-trading-company-in-muscat-oman-7a7c1
        namespace: org-e
        labels:
          catalyst.openova.io/app: marketing-site-of-the-acme-trading-company-in-muscat-oman-2
