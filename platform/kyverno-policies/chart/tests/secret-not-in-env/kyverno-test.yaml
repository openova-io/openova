# Suite of the policy secret-not-in-env (templates/baseline/19-secret-not-in-env.yaml), CMP-063.
#
# Written on the legacy ClusterPolicy render first, where every case passed
# with the kyverno CLI v1.19.2 and each result named its rule (rule: <name>).
# The template is now a ValidatingPolicy, which has no rule names: only
# policy.yaml and that key of each result (isValidatingPolicy: true) changed;
# the resources and the expected results are the same.
# On the legacy kind the CLI reports an excluded resource as "Excluded" and
# accepts that for any expected result; the ValidatingPolicy gives it a skip.
# Cases 6, 8 and 10 had no result at all on the legacy kind (measured with
# kyverno apply: the rule's list held no container with env, so the rule gave
# nothing), and the CLI reported them as "Excluded" too: the ValidatingPolicy
# skips exactly those objects (match condition containers-with-env).
#
# policy.yaml is the render of the template with the chart defaults;
# tests/suites-current.sh fails when it is not the current render.
# Run: kyverno test platform/kyverno-policies/chart/tests/secret-not-in-env
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: secret-not-in-env-test
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - policy: secret-not-in-env
    isValidatingPolicy: true
    kind: Pod
    resources:
      - example/plaintext-password
    result: fail
  - policy: secret-not-in-env
    isValidatingPolicy: true
    kind: Pod
    resources:
      - example/secret-ref
    result: pass
  - policy: secret-not-in-env
    isValidatingPolicy: true
    kind: Pod
    resources:
      - example/lowercase-token
    result: fail
  - policy: secret-not-in-env
    isValidatingPolicy: true
    kind: Pod
    resources:
      - example/substring-key
    result: fail
  - policy: secret-not-in-env
    isValidatingPolicy: true
    kind: Pod
    resources:
      - example/empty-secret-value
    result: pass
  - policy: secret-not-in-env
    isValidatingPolicy: true
    kind: Pod
    resources:
      - example/init-plaintext
    result: skip
  - policy: secret-not-in-env
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/plaintext-token
    result: fail
  - policy: secret-not-in-env
    isValidatingPolicy: true
    kind: StatefulSet
    resources:
      - example/no-env
    result: skip
  - policy: secret-not-in-env
    isValidatingPolicy: true
    kind: Job
    resources:
      - example/plaintext-secret
    result: fail
  - policy: secret-not-in-env
    isValidatingPolicy: true
    kind: CronJob
    resources:
      - example/cron-plaintext
    result: skip
  - policy: secret-not-in-env
    isValidatingPolicy: true
    kind: DaemonSet
    resources:
      - kube-system/plaintext-agent
    result: skip
