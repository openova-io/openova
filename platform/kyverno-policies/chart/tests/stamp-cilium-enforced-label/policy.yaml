apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: stamp-cilium-enforced-label
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: security
  annotations:
    policies.kyverno.io/title: Auto-stamp policy.cilium.io/enforced on Pod templates
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      MUTATE policy: stamp `policy.cilium.io/enforced: "true"` on every Pod,
      and on the Pod template of every Deploy/SS/DS/RS/RC/Job/CronJob, that
      lacks it, so the 09-cilium-l7-mtls VALIDATE
      baseline admits it. Runs in the mutating-webhook phase BEFORE the
      validate phase of the same admission request.
spec:
  # MUTATE on admission only (no background scan needed; nothing to mutate on
  # already-admitted objects). Matches app-label-mutate (21).
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "replicationcontrollers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["cronjobs", "jobs"]
  variables:
    # The labels of the Pod, or of the Pod template of a controller kind.
    - name: labels
      expression: >-
        object.kind == 'Pod' ? object.metadata.?labels.orValue({}) :
        object.kind == 'CronJob' ? object.?spec.?jobTemplate.?spec.?template.?metadata.?labels.orValue({}) :
        object.?spec.?template.?metadata.?labels.orValue({})
  matchConditions:
    - name: exclude-namespaces
      expression: "!(object.metadata.?namespace.orValue('') in ['kube-system', 'flux-system', 'cilium', 'cilium-gateway', 'dragonfly', 'cert-manager', 'openova-system', 'catalyst', 'kyverno', 'monitoring', 'ingress', 'sso-bridge', 'falco'])"
    # Fire only when the label is ABSENT; never override a chart-set or
    # operator-set value.
    - name: enforced-label-absent
      expression: "!('policy.cilium.io/enforced' in variables.labels)"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          object.kind == 'Pod' ?
          Object{metadata: Object.metadata{labels: {"policy.cilium.io/enforced": "true"}}} :
          object.kind == 'CronJob' ?
          Object{spec: Object.spec{jobTemplate: Object.spec.jobTemplate{spec: Object.spec.jobTemplate.spec{template: Object.spec.jobTemplate.spec.template{metadata: Object.spec.jobTemplate.spec.template.metadata{labels: {"policy.cilium.io/enforced": "true"}}}}}}} :
          Object{spec: Object.spec{template: Object.spec.template{metadata: Object.spec.template.metadata{labels: {"policy.cilium.io/enforced": "true"}}}}}
