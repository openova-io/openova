# Suite of the policy prometheus-scrape (templates/baseline/13-prometheus-scrape.yaml), CMP-064.
#
# Written on the legacy ClusterPolicy render first, where every case passed
# with the kyverno CLI v1.19.2 and each result named its rule (rule: <name>).
# The template is now a ValidatingPolicy, which has no rule names: only
# policy.yaml and that key of each result (isValidatingPolicy: true) changed;
# the resources and the expected results are the same.
# The legacy rule's two patterns (annotation on the Pod template, label on
# the workload) are the two sides of one expression: cases 5 and 6 put each
# marker on the other object and fail on both kinds. On the legacy kind the
# CLI reports the excluded case 7 as "Excluded" and accepts that for any
# expected result; the ValidatingPolicy gives it a skip.
#
# policy.yaml is the render of the template with the chart defaults;
# tests/suites-current.sh fails when it is not the current render.
# Run: kyverno test platform/kyverno-policies/chart/tests/prometheus-scrape
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: prometheus-scrape-test
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - policy: prometheus-scrape
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/scrape-annotated
    result: pass
  - policy: prometheus-scrape
    isValidatingPolicy: true
    kind: StatefulSet
    resources:
      - example/operator-managed
    result: pass
  - policy: prometheus-scrape
    isValidatingPolicy: true
    kind: DaemonSet
    resources:
      - example/unobserved
    result: fail
  - policy: prometheus-scrape
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/scrape-false
    result: fail
  - policy: prometheus-scrape
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/annotation-on-workload
    result: fail
  - policy: prometheus-scrape
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/label-on-template
    result: fail
  - policy: prometheus-scrape
    isValidatingPolicy: true
    kind: DaemonSet
    resources:
      - kube-system/unobserved
    result: skip
