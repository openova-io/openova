# Failing case: missing both probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fail-probes
  namespace: example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fail-probes
  template:
    metadata:
      labels:
        app: fail-probes
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:v1.0.0
