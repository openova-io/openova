# Suite of the policy pdb-permits-eviction (templates/baseline/02-pdb.yaml), CMP-064.
#
# Written on the legacy ClusterPolicy render first, where every case passed
# with the kyverno CLI v1.19.2 and each result named its rule (rule: <name>).
# The template is now a ValidatingPolicy, which has no rule names: only
# policy.yaml and that key of each result (isValidatingPolicy: true) changed;
# the resources and the expected results are the same.
# The legacy rule's precondition (maxUnavailable is set) is the match
# condition maxunavailable-set: case 5 is skipped on both kinds. On the
# legacy kind the CLI reports the excluded case 6 as "Excluded" and accepts
# that for any expected result; the ValidatingPolicy gives it a skip.
#
# policy.yaml is the render of the template with the chart defaults;
# tests/suites-current.sh fails when it is not the current render.
# Run: kyverno test platform/kyverno-policies/chart/tests/pdb-permits-eviction
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pdb-permits-eviction-test
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - policy: pdb-permits-eviction
    isValidatingPolicy: true
    kind: PodDisruptionBudget
    resources:
      - example/max-one
    result: pass
  - policy: pdb-permits-eviction
    isValidatingPolicy: true
    kind: PodDisruptionBudget
    resources:
      - example/max-zero
    result: fail
  - policy: pdb-permits-eviction
    isValidatingPolicy: true
    kind: PodDisruptionBudget
    resources:
      - example/max-zero-percent
    result: fail
  - policy: pdb-permits-eviction
    isValidatingPolicy: true
    kind: PodDisruptionBudget
    resources:
      - example/max-ten-percent
    result: pass
  - policy: pdb-permits-eviction
    isValidatingPolicy: true
    kind: PodDisruptionBudget
    resources:
      - example/min-only
    result: skip
  - policy: pdb-permits-eviction
    isValidatingPolicy: true
    kind: PodDisruptionBudget
    resources:
      - kube-system/max-zero
    result: skip
