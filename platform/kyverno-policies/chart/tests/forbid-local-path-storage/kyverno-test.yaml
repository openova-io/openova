# Suite of the policy forbid-local-path-storage (templates/baseline/23-forbid-local-path.yaml), CMP-063.
#
# Written on the legacy ClusterPolicy render first, where every case passed
# with the kyverno CLI v1.19.2 and each result named its rule (rule: <name>).
# The template is now a ValidatingPolicy, which has no rule names: only
# policy.yaml and that key of each result (isValidatingPolicy: true) changed;
# the resources and the expected results are the same.
# The legacy policy had one rule per kind (claims, classes, volumes), each
# giving one result. The policy excludes no namespace by default (case 2).
#
# policy.yaml is the render of the template with the chart defaults;
# tests/suites-current.sh fails when it is not the current render.
# Run: kyverno test platform/kyverno-policies/chart/tests/forbid-local-path-storage
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: forbid-local-path-storage-test
policies:
  - policy.yaml
resources:
  - ../fixtures/forbid-local-path/pass-pvc.yaml
  - ../fixtures/forbid-local-path/fail-pvc.yaml
  - resources.yaml
results:
  - policy: forbid-local-path-storage
    isValidatingPolicy: true
    kind: PersistentVolumeClaim
    resources:
      - example/pass-pvc
    result: pass
  - policy: forbid-local-path-storage
    isValidatingPolicy: true
    kind: PersistentVolumeClaim
    resources:
      - example/pass-pvc-explicit-durable
    result: pass
  - policy: forbid-local-path-storage
    isValidatingPolicy: true
    kind: PersistentVolumeClaim
    resources:
      - example/fail-pvc
    result: fail
  - policy: forbid-local-path-storage
    isValidatingPolicy: true
    kind: StorageClass
    resources:
      - example-local-path
    result: fail
  - policy: forbid-local-path-storage
    isValidatingPolicy: true
    kind: StorageClass
    resources:
      - local-path
    result: fail
  - policy: forbid-local-path-storage
    isValidatingPolicy: true
    kind: PersistentVolumeClaim
    resources:
      - example/provisioner-name-class
    result: fail
  - policy: forbid-local-path-storage
    isValidatingPolicy: true
    kind: PersistentVolumeClaim
    resources:
      - kube-system/system-local-path
    result: fail
  - policy: forbid-local-path-storage
    isValidatingPolicy: true
    kind: StorageClass
    resources:
      - bare-provisioner
    result: fail
  - policy: forbid-local-path-storage
    isValidatingPolicy: true
    kind: StorageClass
    resources:
      - durable
    result: pass
  - policy: forbid-local-path-storage
    isValidatingPolicy: true
    kind: PersistentVolume
    resources:
      - pv-local-path
    result: fail
  - policy: forbid-local-path-storage
    isValidatingPolicy: true
    kind: PersistentVolume
    resources:
      - pv-durable
    result: pass
  - policy: forbid-local-path-storage
    isValidatingPolicy: true
    kind: PersistentVolume
    resources:
      - pv-no-class
    result: pass
