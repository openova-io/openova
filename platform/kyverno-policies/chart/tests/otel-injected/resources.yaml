# Inputs of the suite otel-injected. One workload per case; the number is
# the case of kyverno-test.yaml.

# 1. The one container is named otel-collector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-only
  namespace: example
spec:
  selector:
    matchLabels:
      app: collector-only
  template:
    metadata:
      labels:
        app: collector-only
    spec:
      containers:
        - name: otel-collector
          image: ghcr.io/example/otel-collector:v1.0.0
---
# 2. An app container beside an otel-collector sidecar: the legacy array pattern
# required EVERY container to be named otel-collector, so this fails.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-with-sidecar
  namespace: example
spec:
  selector:
    matchLabels:
      app: app-with-sidecar
  template:
    metadata:
      labels:
        app: app-with-sidecar
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:v1.0.0
        - name: otel-collector
          image: ghcr.io/example/otel-collector:v1.0.0
---
# 3. Annotated inject-java "true" (Instrumentation default in the same namespace).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inject-java
  namespace: example
spec:
  selector:
    matchLabels:
      app: inject-java
  template:
    metadata:
      labels:
        app: inject-java
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:v1.0.0
---
# 4. Annotated inject-python with a named Instrumentation.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inject-python
  namespace: example
spec:
  serviceName: inject-python
  selector:
    matchLabels:
      app: inject-python
  template:
    metadata:
      labels:
        app: inject-python
      annotations:
        instrumentation.opentelemetry.io/inject-python: "my-instrumentation"
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:v1.0.0
---
# 5. Annotated inject-nodejs with a namespace/name reference.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: inject-nodejs
  namespace: example
spec:
  selector:
    matchLabels:
      app: inject-nodejs
  template:
    metadata:
      labels:
        app: inject-nodejs
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "opentelemetry/default"
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:v1.0.0
---
