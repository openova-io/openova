# 8. Annotated inject-java with an empty value.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inject-empty
  namespace: example
spec:
  selector:
    matchLabels:
      app: inject-empty
  template:
    metadata:
      labels:
        app: inject-empty
      annotations:
        instrumentation.opentelemetry.io/inject-java: ""
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:v1.0.0
---
# 9. Annotated inject-sdk, a language the policy does not list.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inject-sdk
  namespace: example
spec:
  selector:
    matchLabels:
      app: inject-sdk
  template:
    metadata:
      labels:
        app: inject-sdk
      annotations:
        instrumentation.opentelemetry.io/inject-sdk: "true"
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:v1.0.0
---
# 10. Neither a collector container nor an annotation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uninstrumented
  namespace: example
spec:
  selector:
    matchLabels:
      app: uninstrumented
  template:
    metadata:
      labels:
        app: uninstrumented
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:v1.0.0
---
# 11. The annotation on the workload, not on its Pod template.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: annotation-on-workload
  namespace: example
  annotations:
    instrumentation.opentelemetry.io/inject-java: "true"
spec:
  selector:
    matchLabels:
      app: annotation-on-workload
  template:
    metadata:
      labels:
        app: annotation-on-workload
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:v1.0.0
---
# 12. Case 10 in kube-system, a namespace the chart defaults exclude.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uninstrumented
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: uninstrumented
  template:
    metadata:
      labels:
        app: uninstrumented
    spec:
      containers:
        - name: app
          image: ghcr.io/example/app:v1.0.0
