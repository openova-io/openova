apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: otel-injected
  labels:
    app.kubernetes.io/name: bp-kyverno
    app.kubernetes.io/component: compliance-policy
    catalyst.openova.io/policy-tier: compliance
    catalyst.openova.io/policy-domain: observability
  annotations:
    policies.kyverno.io/title: Workloads should be OTel-instrumented
    policies.kyverno.io/category: catalyst-compliance
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: >-
      Workloads should declare OpenTelemetry instrumentation via either
      an `otel-collector` sidecar container OR
      `instrumentation.opentelemetry.io/inject-*: "true"` annotation on
      the Pod template (auto-injection by the OTel operator).
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
  matchConditions:
    - name: exclude-namespaces
      expression: "!(object.metadata.?namespace.orValue('') in ['kube-system', 'flux-system', 'cilium', 'cilium-gateway', 'dragonfly', 'cert-manager', 'openova-system', 'catalyst', 'kyverno', 'monitoring', 'ingress', 'sso-bridge', 'falco'])"
  validations:
    # The six patterns of the legacy rule, any one of which passed:
    #   1. `containers: [{name: otel-collector}]`, an array pattern, which
    #      the legacy kind applied to EVERY container: it passed only when
    #      every container is named otel-collector (tests/otel-injected
    #      case 2), and this expression keeps that verdict.
    #   2-6. the annotation instrumentation.opentelemetry.io/inject-<lang>
    #      on the Pod template with any non-empty value (`?*`). The value
    #      names the Instrumentation the OTel Operator injects from: "true"
    #      (`default` in the same namespace), "<name>" (named, same
    #      namespace) or "<namespace>/<name>" (e.g. "opentelemetry/default",
    #      the CR bp-opentelemetry 1.1.0+ renders, Wave 5.36 #2210).
    - expression: >-
        object.spec.template.spec.containers.all(c, c.name == 'otel-collector') ||
        ['instrumentation.opentelemetry.io/inject-java',
        'instrumentation.opentelemetry.io/inject-python',
        'instrumentation.opentelemetry.io/inject-nodejs',
        'instrumentation.opentelemetry.io/inject-go',
        'instrumentation.opentelemetry.io/inject-dotnet'].exists(key,
        object.spec.template.?metadata.?annotations[?key].orValue('') != '')
      messageExpression: >-
        'Workload ' + object.kind + '/' + object.metadata.name + ' is not
        OTel-instrumented. Add an `otel-collector` sidecar OR annotate the Pod
        template with one of
        `instrumentation.opentelemetry.io/inject-{java,python,nodejs,go,dotnet}`
        set to `"true"` (same-NS default), `"<name>"` (same-NS named CR), or
        `"<namespace>/<name>"` (cross-NS, e.g. `"opentelemetry/default"` for
        the bp-opentelemetry-managed CR).'
