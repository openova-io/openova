# 5. Two constraints, hostname and another key: every constraint must name
#    hostname or zone, so not compliant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread-mixed-keys
  namespace: example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spread-mixed-keys
  template:
    metadata:
      labels:
        app: spread-mixed-keys
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: spread-mixed-keys
        - maxSkew: 1
          topologyKey: example.com/rack
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: spread-mixed-keys
      containers:
        - name: app
          image: ghcr.io/example/app:v1.0.0
---
