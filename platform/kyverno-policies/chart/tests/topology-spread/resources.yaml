# Inputs of the suite topology-spread.

# 1. Three replicas spread across hostname: compliant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread-hostname
  namespace: example
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spread-hostname
  template:
    metadata:
      labels:
        app: spread-hostname
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: spread-hostname
      containers:
        - name: app
          image: ghcr.io/example/app:v1.0.0
---
# 2. Two replicas spread across zone: compliant.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spread-zone
  namespace: example
spec:
  replicas: 2
  serviceName: spread-zone
  selector:
    matchLabels:
      app: spread-zone
  template:
    metadata:
      labels:
        app: spread-zone
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: spread-zone
      containers:
        - name: app
          image: ghcr.io/example/app:v1.0.0
---
# 3. Two replicas and no spread constraint: not compliant.
