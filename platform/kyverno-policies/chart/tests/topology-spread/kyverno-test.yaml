# Suite of the policy topology-spread (templates/baseline/03-topology-spread.yaml), CMP-062.
#
# Written on the legacy ClusterPolicy render first, where every case passed
# with the kyverno CLI v1.19.2 and each result named its rule (rule: <name>).
# The template is now a ValidatingPolicy, which has no rule names: only
# policy.yaml and that key of each result (isValidatingPolicy: true) changed;
# the resources and the expected results are the same.
#
# policy.yaml is the render of the template with the chart defaults;
# tests/suites-current.sh fails when it is not the current render.
# Run: kyverno test platform/kyverno-policies/chart/tests/topology-spread
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: topology-spread-test
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - policy: topology-spread
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/spread-hostname
    result: pass
  - policy: topology-spread
    isValidatingPolicy: true
    kind: StatefulSet
    resources:
      - example/spread-zone
    result: pass
  - policy: topology-spread
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/spread-empty-list
    result: pass
  - policy: topology-spread
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/no-spread
      - example/spread-other-key
      - example/spread-mixed-keys
    result: fail
  - policy: topology-spread
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/one-replica
      - example/replicas-unset
      - kube-system/no-spread
    result: skip
