# Suite of the policy resource-limits (templates/baseline/06-resource-limits.yaml), CMP-062.
#
# Written on the legacy ClusterPolicy render first, where every case passed
# with the kyverno CLI v1.19.2 and each result named its rule (rule: <name>).
# The template is now a ValidatingPolicy, which has no rule names: only
# policy.yaml and that key of each result (isValidatingPolicy: true) changed;
# the resources and the expected results are the same.
#
# policy.yaml is the render of the template with the chart defaults;
# tests/suites-current.sh fails when it is not the current render.
# Run: kyverno test platform/kyverno-policies/chart/tests/resource-limits
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: resource-limits-test
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - policy: resource-limits
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/limits-set
    result: pass
  - policy: resource-limits
    isValidatingPolicy: true
    kind: DaemonSet
    resources:
      - example/ds-limits-set
    result: pass
  - policy: resource-limits
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/no-limits
    result: fail
  - policy: resource-limits
    isValidatingPolicy: true
    kind: Job
    resources:
      - example/job-memory-limit-only
    result: fail
  - policy: resource-limits
    isValidatingPolicy: true
    kind: CronJob
    resources:
      - example/cronjob-limits-set
    result: fail
  - policy: resource-limits
    isValidatingPolicy: true
    kind: StatefulSet
    resources:
      - kube-system/sts-no-limits
    result: skip
