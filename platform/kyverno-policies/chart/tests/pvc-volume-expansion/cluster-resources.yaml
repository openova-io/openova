# The cluster the CLI evaluates against: the StorageClasses the policy's
# lookup reads and the namespaces of the claims in resources.yaml. The legacy
# rule's apiCall and the ValidatingPolicy's resource.Get both read this fake
# cluster (CLI v1.19.2).
apiVersion: cli.kyverno.io/v1alpha1
kind: ClusterResource
metadata:
  name: cluster-resources
spec:
  resources:
    - apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: expandable
      provisioner: example.com/block
      allowVolumeExpansion: true
    - apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: not-expandable
      provisioner: example.com/block
      allowVolumeExpansion: false
    # allowVolumeExpansion unset: the API server's default is false.
    - apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: unset
      provisioner: example.com/block
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: example
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: kube-system
