# Suite of the policy pvc-volume-expansion (templates/baseline/07-pvc-expansion.yaml), CMP-064.
#
# Written on the legacy ClusterPolicy render first, where every case passed
# with the kyverno CLI v1.19.2 and each result named its rule (rule: <name>).
# The template is now a ValidatingPolicy, which has no rule names: only
# policy.yaml and that key of each result (isValidatingPolicy: true) changed;
# the resources, the cluster and the expected results are the same.
# The StorageClasses are in cluster-resources.yaml, the CLI's fake cluster:
# the legacy apiCall and the new resource.Get both read it. Case 4 names a
# class that does not exist: the legacy GET failed, and the new policy reads
# the metadata of the null answer, so both give an error. The legacy
# precondition (a storageClassName is set) is the match condition
# storageclass-named: cases 5 and 6 are skipped on both kinds. On the legacy
# kind the CLI reports the excluded case 7 as "Excluded" and accepts that for
# any expected result; the ValidatingPolicy gives it a skip.
#
# policy.yaml is the render of the template with the chart defaults;
# tests/suites-current.sh fails when it is not the current render.
# Run: kyverno test platform/kyverno-policies/chart/tests/pvc-volume-expansion
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pvc-volume-expansion-test
clusterResources:
  - cluster-resources.yaml
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - policy: pvc-volume-expansion
    isValidatingPolicy: true
    kind: PersistentVolumeClaim
    resources:
      - example/on-expandable
    result: pass
  - policy: pvc-volume-expansion
    isValidatingPolicy: true
    kind: PersistentVolumeClaim
    resources:
      - example/on-not-expandable
    result: fail
  - policy: pvc-volume-expansion
    isValidatingPolicy: true
    kind: PersistentVolumeClaim
    resources:
      - example/on-unset
    result: fail
  - policy: pvc-volume-expansion
    isValidatingPolicy: true
    kind: PersistentVolumeClaim
    resources:
      - example/on-missing
    result: error
  - policy: pvc-volume-expansion
    isValidatingPolicy: true
    kind: PersistentVolumeClaim
    resources:
      - example/no-class
    result: skip
  - policy: pvc-volume-expansion
    isValidatingPolicy: true
    kind: PersistentVolumeClaim
    resources:
      - example/empty-class
    result: skip
  - policy: pvc-volume-expansion
    isValidatingPolicy: true
    kind: PersistentVolumeClaim
    resources:
      - kube-system/on-not-expandable
    result: skip
