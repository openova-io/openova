# Inputs of the suite harbor-proxy-pull. values.yaml beside this file gives
# the labels of the namespaces these objects are in.

# 1. A Pod pulled through a Harbor proxy project: compliant.
apiVersion: v1
kind: Pod
metadata:
  name: proxy-image
  namespace: example
spec:
  containers:
    - name: app
      image: harbor.example/proxy-ghcr/cloudnative-pg/postgresql:16.4-1
---
# 2. A Pod of a natively pushed image: compliant.
apiVersion: v1
kind: Pod
metadata:
  name: native-image
  namespace: example
spec:
  containers:
    - name: api
      image: registry.example/openova-io/openova/catalyst-api:1.0.0
---
# 3. A Pod with one container of each source: compliant (the third allowed
#    pattern admits either source per image).
apiVersion: v1
kind: Pod
metadata:
  name: mixed-sources
  namespace: example
spec:
  containers:
    - name: api
      image: registry.example/openova-io/openova/catalyst-api:1.0.0
    - name: proxy
      image: harbor.example/proxy-dockerhub/envoyproxy/envoy:v1.31.0
---
# 4. A Pod of a raw upstream image: not compliant.
apiVersion: v1
kind: Pod
metadata:
  name: raw-image
  namespace: example
spec:
  containers:
    - name: app
      image: docker.io/library/nginx:1.27
---
# 5. A Pod whose container is proxied and whose init container is raw: not compliant.
apiVersion: v1
kind: Pod
metadata:
  name: raw-init
  namespace: example
spec:
  initContainers:
    - name: wait
      image: docker.io/library/busybox:1.36
  containers:
    - name: app
      image: harbor.example/proxy-ghcr/example/app:v1.0.0
---
# 6. A Deployment pulled through a proxy project, init container too: compliant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxied-deployment
  namespace: example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proxied-deployment
  template:
    metadata:
      labels:
        app: proxied-deployment
    spec:
      initContainers:
        - name: wait
          image: harbor.example/proxy-dockerhub/library/busybox:1.36
      containers:
        - name: app
          image: harbor.example/proxy-ghcr/example/app:v1.0.0
---
# 7. A StatefulSet of a raw upstream image: not compliant.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raw-statefulset
  namespace: example
spec:
  serviceName: raw-statefulset
  selector:
    matchLabels:
      app: raw-statefulset
  template:
    metadata:
      labels:
        app: raw-statefulset
    spec:
      containers:
        - name: db
          image: quay.io/example/db:1.0.0
---
# 8. A Job of a natively pushed image: compliant.
apiVersion: batch/v1
kind: Job
metadata:
  name: native-job
  namespace: example
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: task
          image: registry.example/openova-io/openova/migrator:1.0.0
---
# 9. A CronJob pulled through a proxy project: compliant.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: proxied-cronjob
  namespace: example
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: task
              image: harbor.example/proxy-ghcr/example/task:v2.0.0
---
# 10. A CronJob of a raw upstream image: not compliant.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: raw-cronjob
  namespace: example
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: task
              image: ghcr.io/example/task:v2.0.0
---
# 11. A raw DaemonSet in a namespace of the shared exclusion list: not judged.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: raw-agent
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: raw-agent
  template:
    metadata:
      labels:
        app: raw-agent
    spec:
      containers:
        - name: agent
          image: docker.io/example/agent:1.0.0
---
# 12. A raw Pod in a namespace of this policy's own exclusion list: not judged.
apiVersion: v1
kind: Pod
metadata:
  name: raw-dns
  namespace: powerdns
spec:
  containers:
    - name: pdns
      image: docker.io/powerdns/pdns-auth-50:5.0.0
---
# 13. A raw Pod in an Organization's vCluster namespace: not judged.
apiVersion: v1
kind: Pod
metadata:
  name: synced-coredns
  namespace: acme
spec:
  containers:
    - name: coredns
      image: registry.k8s.io/coredns/coredns:v1.11.3
---
# 14. A raw Pod in a namespace without the Organization label: not compliant.
apiVersion: v1
kind: Pod
metadata:
  name: raw-unlabelled
  namespace: app-prod
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
