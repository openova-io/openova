# Suite of the policy image-tag-pinned (templates/baseline/12-image-tag-pinned.yaml), CMP-063.
#
# Written on the legacy ClusterPolicy render first, where every case passed
# with the kyverno CLI v1.19.2 and each result named its rule (rule: <name>).
# The template is now a ValidatingPolicy, which has no rule names: only
# policy.yaml and that key of each result (isValidatingPolicy: true) changed;
# the resources and the expected results are the same.
# On the legacy kind the CLI reports an excluded resource as "Excluded" and
# accepts that for any expected result; the ValidatingPolicy gives it a skip.
# The legacy policy had one rule per path shape (image-pinned-pod,
# image-pinned-workload, image-pinned-cronjob), each giving one result.
#
# policy.yaml is the render of the template with the chart defaults;
# tests/suites-current.sh fails when it is not the current render.
# Run: kyverno test platform/kyverno-policies/chart/tests/image-tag-pinned
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: image-tag-pinned-test
policies:
  - policy.yaml
resources:
  - ../fixtures/image-tag-pinned/pass-deployment.yaml
  - ../fixtures/image-tag-pinned/fail-deployment.yaml
  - resources.yaml
results:
  - policy: image-tag-pinned
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/pass-image-tag
    result: pass
  - policy: image-tag-pinned
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/fail-image-tag
    result: fail
  - policy: image-tag-pinned
    isValidatingPolicy: true
    kind: Pod
    resources:
      - example/digest-only
    result: pass
  - policy: image-tag-pinned
    isValidatingPolicy: true
    kind: Pod
    resources:
      - example/latest-and-digest
    result: pass
  - policy: image-tag-pinned
    isValidatingPolicy: true
    kind: Pod
    resources:
      - example/tagless
    result: fail
  - policy: image-tag-pinned
    isValidatingPolicy: true
    kind: Pod
    resources:
      - example/registry-port-no-tag
    result: fail
  - policy: image-tag-pinned
    isValidatingPolicy: true
    kind: Pod
    resources:
      - example/registry-port-tagged
    result: pass
  - policy: image-tag-pinned
    isValidatingPolicy: true
    kind: Pod
    resources:
      - example/single-segment-tagged
    result: pass
  - policy: image-tag-pinned
    isValidatingPolicy: true
    kind: StatefulSet
    resources:
      - example/init-latest
    result: fail
  - policy: image-tag-pinned
    isValidatingPolicy: true
    kind: Job
    resources:
      - example/job-pinned
    result: pass
  - policy: image-tag-pinned
    isValidatingPolicy: true
    kind: CronJob
    resources:
      - example/cron-tagless
    result: fail
  - policy: image-tag-pinned
    isValidatingPolicy: true
    kind: CronJob
    resources:
      - example/cron-pinned
    result: pass
  - policy: image-tag-pinned
    isValidatingPolicy: true
    kind: DaemonSet
    resources:
      - kube-system/latest-agent
    result: skip
