# Suite of the policy multi-replica-drainability (templates/baseline/01-multi-replica.yaml), CMP-062.
#
# Written on the legacy ClusterPolicy render first, where every case passed
# with the kyverno CLI v1.19.2 and each result named its rule (rule: <name>).
# The template is now a ValidatingPolicy, which has no rule names: only
# policy.yaml and that key of each result (isValidatingPolicy: true) changed;
# the resources and the expected results are the same.
#
# policy.yaml is the render of the template with the chart defaults;
# tests/suites-current.sh fails when it is not the current render.
# Run: kyverno test platform/kyverno-policies/chart/tests/multi-replica-drainability
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: multi-replica-drainability-test
policies:
  - policy.yaml
resources:
  - ../fixtures/multi-replica/pass-deployment.yaml
  - ../fixtures/multi-replica/fail-deployment.yaml
  - resources.yaml
results:
  - policy: multi-replica-drainability
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/pass-multi-replica
    result: pass
  - policy: multi-replica-drainability
    isValidatingPolicy: true
    kind: StatefulSet
    resources:
      - example/three-replicas
    result: pass
  - policy: multi-replica-drainability
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/fail-multi-replica
      - example/singleton-db-false
    result: fail
  - policy: multi-replica-drainability
    isValidatingPolicy: true
    kind: StatefulSet
    resources:
      - example/replicas-unset
    result: fail
  - policy: multi-replica-drainability
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - example/singleton-db
      - kube-system/one-replica
    result: skip
