# Resources of the suite app-label-mutate (CMP-078).
apiVersion: v1
kind: Pod
metadata:
  name: instance-only
  namespace: apps
  labels: {app.kubernetes.io/instance: shop}
spec:
  containers: [{name: app, image: harbor.example/app:1.0.0}]
---
apiVersion: v1
kind: Pod
metadata:
  name: name-only
  namespace: apps
  labels: {app.kubernetes.io/name: blog}
spec:
  containers: [{name: app, image: harbor.example/app:1.0.0}]
---
apiVersion: v1
kind: Pod
metadata:
  name: empty-instance
  namespace: apps
  labels: {app.kubernetes.io/instance: "", app.kubernetes.io/name: blog}
spec:
  containers: [{name: app, image: harbor.example/app:1.0.0}]
---
apiVersion: v1
kind: Pod
metadata:
  name: both
  namespace: apps
  labels: {app.kubernetes.io/instance: shop, app.kubernetes.io/name: blog}
spec:
  containers: [{name: app, image: harbor.example/app:1.0.0}]
---
apiVersion: v1
kind: Pod
metadata:
  name: operator-set
  namespace: apps
  labels: {app.kubernetes.io/instance: shop, catalyst.openova.io/application: billing}
spec:
  containers: [{name: app, image: harbor.example/app:1.0.0}]
---
apiVersion: v1
kind: Pod
metadata:
  name: empty-application
  namespace: apps
  labels: {app.kubernetes.io/instance: shop, catalyst.openova.io/application: ""}
spec:
  containers: [{name: app, image: harbor.example/app:1.0.0}]
---
apiVersion: v1
kind: Pod
metadata:
  name: no-source
  namespace: apps
  labels: {team: payments}
spec:
  containers: [{name: app, image: harbor.example/app:1.0.0}]
---
apiVersion: v1
kind: Pod
metadata:
  name: excluded
  namespace: kube-system
  labels: {app.kubernetes.io/instance: shop}
spec:
  containers: [{name: app, image: harbor.example/app:1.0.0}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: apps
spec:
  selector:
    matchLabels: {app.kubernetes.io/instance: web}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: web}
    spec:
      containers: [{name: app, image: harbor.example/app:1.0.0}]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: apps
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {app.kubernetes.io/name: report}
        spec:
          restartPolicy: Never
          containers: [{name: app, image: harbor.example/app:1.0.0}]
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: legacy-rc
  namespace: apps
spec:
  selector: {app.kubernetes.io/instance: legacy-rc}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: legacy-rc}
    spec:
      containers: [{name: app, image: harbor.example/app:1.0.0}]
