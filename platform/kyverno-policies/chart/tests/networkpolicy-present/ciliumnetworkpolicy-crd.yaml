# The CiliumNetworkPolicy kind for the Kyverno CLI's REST mapper: without it
# the CLI cannot load the CiliumNetworkPolicies of cluster-resources.yaml nor
# answer a lookup of them. Schema-free on purpose: only the kind is needed.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ciliumnetworkpolicies.cilium.io
spec:
  group: cilium.io
  names:
    kind: CiliumNetworkPolicy
    listKind: CiliumNetworkPolicyList
    plural: ciliumnetworkpolicies
    singular: ciliumnetworkpolicy
  scope: Namespaced
  versions:
    - name: v2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
