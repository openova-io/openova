# Suite of the policy networkpolicy-present (templates/baseline/14-networkpolicy-present.yaml), CMP-064.
#
# Written on the legacy ClusterPolicy render first, where every case passed
# with the kyverno CLI v1.19.2 and each result named its rule (rule: <name>).
# The template is now a ValidatingPolicy, which has no rule names: only
# policy.yaml and that key of each result (isValidatingPolicy: true) changed;
# the resources, the cluster and the expected results are the same.
# What each namespace holds is in cluster-resources.yaml, the CLI's fake
# cluster: the legacy apiCalls and the new resource.List both read it. The
# policy judges Namespaces and excludes them by name (case 5). On the legacy
# kind the CLI reports the excluded case 5 as "Excluded" and accepts that for
# any expected result; the ValidatingPolicy gives it a skip.
#
# policy.yaml is the render of the template with the chart defaults;
# tests/suites-current.sh fails when it is not the current render.
# Run: kyverno test platform/kyverno-policies/chart/tests/networkpolicy-present
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: networkpolicy-present-test
clusterResources:
  - cluster-resources.yaml
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - policy: networkpolicy-present
    isValidatingPolicy: true
    kind: Namespace
    resources:
      - with-np
    result: pass
  - policy: networkpolicy-present
    isValidatingPolicy: true
    kind: Namespace
    resources:
      - with-cnp
    result: pass
  - policy: networkpolicy-present
    isValidatingPolicy: true
    kind: Namespace
    resources:
      - with-both
    result: pass
  - policy: networkpolicy-present
    isValidatingPolicy: true
    kind: Namespace
    resources:
      - bare
    result: fail
  - policy: networkpolicy-present
    isValidatingPolicy: true
    kind: Namespace
    resources:
      - kube-system
    result: skip
