# ComplianceModel - the score model of the compliance plane (ADR-0029, CMP-041).
#
# A module kind of the Blueprint bp-kyverno-policies: its definition ships
# only in this chart, never in the platform chart (guard 13,
# tools/guards/cmd/check-compliance-model). Without this Blueprint the kind
# does not exist; catalyst-api registers its informer as optional and every
# score is then null with the reason "model not loaded".
#
# One object, named default, cluster-scoped, rendered by
# templates/compliance-model.yaml from the data files under model/. Nobody
# edits it in the cluster. The schema holds only the fields CMP-041 reads
# (version, levels, mandatoryCap, severityWeights, groups, axes, checks,
# exemptions); a field enters it with the package that adds its reader.
# Helm installs this file before the templates; kit slot 27a replaces it on
# upgrade (install.crds and upgrade.crds CreateReplace).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: compliancemodels.compliance.openova.io
  labels:
    app.kubernetes.io/name: bp-kyverno-policies
    app.kubernetes.io/component: compliance-model
spec:
  group: compliance.openova.io
  names:
    kind: ComplianceModel
    listKind: ComplianceModelList
    plural: compliancemodels
    singular: compliancemodel
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [version, levels, mandatoryCap, severityWeights, groups, axes, checks, exemptions]
              properties:
                version:
                  description: Semantic version, shown beside every score. Raised by any change to weights, bands, caps or mappings.
                  type: string
                  pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
                levels:
                  description: Score bands, sorted by min with the highest first; the last min is 0.
                  type: array
                  minItems: 2
                  maxItems: 10
                  items:
                    type: object
                    required: [name, min]
                    properties:
                      name:
                        type: string
                        minLength: 1
                      min:
                        type: integer
                        minimum: 0
                        maximum: 100
                mandatoryCap:
                  description: Upper bound of a subject's score while a mandatory check fails, in the listed environment types.
                  type: object
                  required: [value, environmentTypes]
                  properties:
                    value:
                      type: integer
                      minimum: 0
                      maximum: 100
                    environmentTypes:
                      type: array
                      items:
                        type: string
                severityWeights:
                  description: Weight of a check that states no weight.
                  type: object
                  required: [critical, high, medium, low]
                  properties:
                    critical:
                      type: integer
                      minimum: 0
                      maximum: 100
                    high:
                      type: integer
                      minimum: 0
                      maximum: 100
                    medium:
                      type: integer
                      minimum: 0
                      maximum: 100
                    low:
                      type: integer
                      minimum: 0
                      maximum: 100
                groups:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items:
                    type: object
                    required: [id, title, weight]
                    properties:
                      id:
                        type: string
                        pattern: '^[a-z][a-z0-9-]*$'
                      title:
                        type: string
                        minLength: 1
                      weight:
                        type: integer
                        minimum: 1
                        maximum: 100
                axes:
                  type: array
                  minItems: 1
                  maxItems: 30
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [id]
                  items:
                    type: object
                    required: [id, title, group, type, naText]
                    properties:
                      id:
                        type: string
                        pattern: '^[a-z][a-z0-9-]*$'
                      title:
                        type: string
                        minLength: 1
                      group:
                        type: string
                        minLength: 1
                      type:
                        type: string
                        enum: [checks, measure]
                      measure:
                        type: string
                        enum: [runtime-clean, memory-efficiency]
                      naText:
                        type: string
                        minLength: 1
                checks:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [id]
                  items:
                    type: object
                    required: [id, title, source, axis, severity, ownerSide, description, remediation]
                    properties:
                      id:
                        type: string
                        minLength: 1
                      title:
                        type: string
                        minLength: 1
                        maxLength: 80
                      source:
                        type: string
                        enum: [kyverno, evaluator, trivy-vulnerability, trivy-configaudit, trivy-exposedsecret, trivy-rbac]
                      axis:
                        type: string
                        minLength: 1
                      severity:
                        type: string
                        enum: [critical, high, medium, low]
                      weight:
                        type: integer
                        minimum: 0
                        maximum: 100
                      mandatory:
                        type: boolean
                      ownerSide:
                        type: string
                        enum: [organization, sovereign]
                      valuesKey:
                        type: string
                        minLength: 1
                      switchable:
                        type: boolean
                      description:
                        type: string
                        minLength: 1
                      remediation:
                        type: string
                        minLength: 20
                exemptions:
                  type: array
                  items:
                    type: object
                    required: [namespace, checks, reason, owner]
                    properties:
                      namespace:
                        type: string
                        minLength: 1
                      checks:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          minLength: 1
                      reason:
                        type: string
                        minLength: 20
                      owner:
                        type: string
                        minLength: 1
