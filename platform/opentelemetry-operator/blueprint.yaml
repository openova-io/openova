apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-opentelemetry-operator
  labels:
    catalyst.openova.io/section: pts-3-2-observability-and-tracing
spec:
  version: 1.0.6
  card:
    title: OpenTelemetry Operator
    summary: Manages OpenTelemetry Collector + auto-instrumentation CRs across the Sovereign — the operator layer behind the LGTM telemetry pipeline.
    icon: opentelemetry.svg
  visibility: unlisted
  owner:
    team: platform
    contact: platform@openova.io
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-opentelemetry-operator
  upgrades:
    from: ["0.x"]
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  endpoints: []
