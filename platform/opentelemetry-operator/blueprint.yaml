apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-opentelemetry-operator
  labels:
    catalyst.openova.io/section: pts-3-2-observability-and-tracing
spec:
  version: 1.0.6
  card:
    title: OpenTelemetry Operator
    summary: Manages OpenTelemetry Collector + auto-instrumentation CRs across the Sovereign — the operator layer behind the LGTM telemetry pipeline.
    icon: opentelemetry.svg
  visibility: unlisted
  owner:
    team: platform
    contact: platform@openova.io
  configSchema:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Master gate. Default off — installing this Blueprint is a no-op until flipped.
      defaultInstrumentation:
        type: object
        description: Default Instrumentation CR rendered into every Org namespace.
        properties:
          enabled:
            type: boolean
            default: false
          exporterEndpoint:
            type: string
            description: OTLP gRPC endpoint of the collector. Default points at bp-opentelemetry's Service.
          java:
            type: object
            properties:
              enabled: {type: boolean, default: true}
          nodejs:
            type: object
            properties:
              enabled: {type: boolean, default: true}
          python:
            type: object
            properties:
              enabled: {type: boolean, default: true}
          dotnet:
            type: object
            properties:
              enabled: {type: boolean, default: false}
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-opentelemetry-operator
  upgrades:
    from: ["0.x"]
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  endpoints: []
