{{- /*
G38 (Refs #2593, 2026-05-29): RBAC for the webhook-gate Job. Same
pattern as G26 #2581 webhook-gate-rbac for bp-external-secrets-stores.
Scoped to GET Endpoints in the opentelemetry namespace ONLY.
*/}}
{{- $gate := .Values.webhookGate | default dict -}}
{{- $enabled := true -}}
{{- if hasKey $gate "enabled" -}}
{{-   $enabled = $gate.enabled -}}
{{- end -}}
{{- if and $enabled .Values.defaultInstrumentation.enabled }}
{{- $svcNs := (($gate.service).namespace) | default "opentelemetry" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-webhook-gate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bp-opentelemetry-operator
    catalyst.openova.io/component: webhook-gate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-webhook-gate
  namespace: {{ $svcNs | quote }}
  labels:
    app.kubernetes.io/name: bp-opentelemetry-operator
    catalyst.openova.io/component: webhook-gate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-webhook-gate
  namespace: {{ $svcNs | quote }}
  labels:
    app.kubernetes.io/name: bp-opentelemetry-operator
    catalyst.openova.io/component: webhook-gate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-webhook-gate
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-webhook-gate
  apiGroup: rbac.authorization.k8s.io
{{- end }}
