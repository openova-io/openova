# Master gate. Activated by Wave 5.41 #2227 (chart-split unblock for #2215).
# Flipped to true to enable the Operator + default Instrumentation CR for
# all Sovereigns. EPIC #1094 OTel-auto-instr gap closure depends on this.
enabled: true

catalystBlueprint:
  upstream: { chart: opentelemetry-operator, version: "0.61.0", repo: "https://open-telemetry.github.io/opentelemetry-helm-charts" }

# Default Instrumentation CR rendered when enabled. Wave 5.41: the CR lives
# in the `opentelemetry` namespace (alongside the Catalyst-managed Collector
# deployed by bp-opentelemetry) so tenant workloads in other namespaces
# reference it as `opentelemetry/default` per the cross-NS form supported by
# the OTel Operator. Per-Application overrides live in per-namespace
# Instrumentation CRs that application-controller (slice C4 of #1095) renders
# from Blueprint.spec.observability.traces=otlp.
defaultInstrumentation:
  enabled: true
  namespace: opentelemetry
  name: default
  # OTLP gRPC endpoint of the Catalyst-managed collector deployed by
  # bp-opentelemetry into the `opentelemetry` namespace.
  exporterEndpoint: "http://opentelemetry-opentelemetry-collector.opentelemetry.svc:4317"
  # Sampler — parentbased_traceidratio is the bank-tier default. Operator
  # tunes per-Sovereign.
  sampler:
    type: "parentbased_traceidratio"
    argument: "0.25"
  # Per-language toggles. Each populates the corresponding section of
  # the Instrumentation spec — disabled languages won't auto-inject when
  # an annotation requests them.
  java:
    enabled: true
  nodejs:
    enabled: true
  python:
    enabled: true
  dotnet:
    enabled: false

# ─── Catalyst overlay values (consumed by templates/ in this chart) ───
# webhook-gate hook Job (G38 #2593). The published 1.0.4 OCI artifact
# predates the hook template — 1.0.5 is the FIRST release that ships it,
# so its image must be proxy-routed from day one (#5017): the hook runs
# post-install AND post-upgrade in the `opentelemetry` namespace, which
# is NOT in the kyverno harbor-proxy-pull exclude list — a raw
# `bitnamilegacy/kubectl` ref would be denied at admission and fail every
# install/upgrade of this chart. Same MIRROR-EVERYTHING pattern as
# platform/flux (Fix #163).
webhookGate:
  image: "harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4"

# ─── Upstream subchart values (subchart key: opentelemetry-operator) ──
opentelemetry-operator:
  manager:
    # Route the operator manager image through the Sovereign-local Harbor
    # proxy (#5017): the kyverno `harbor-proxy-pull` ClusterPolicy only
    # admits pod images matching `*/proxy-*/*` or `*/openova-io/*`; the
    # upstream default raw ghcr.io ref was DENIED when cutover step-08's
    # deny-egress roll recreated the pod on hw242, blocking cutoverComplete.
    # Tag defaults to the upstream chart appVersion (0.101.0) — unchanged.
    image:
      repository: harbor.openova.io/proxy-ghcr/open-telemetry/opentelemetry-operator/opentelemetry-operator
    # The upstream chart REQUIRES manager.collectorImage.repository to
    # be set (the operator needs to know which collector image to deploy
    # when an OpenTelemetryCollector CR is created without an explicit
    # image). Pin to the upstream contrib distribution; operators bump
    # via overlay per docs/INVIOLABLE-PRINCIPLES.md #4.
    collectorImage:
      repository: "otel/opentelemetry-collector-contrib"
    # cert-manager is the canonical webhook cert provider (bp-cert-manager
    # is in every Sovereign's bootstrap-kit). Operator uses
    # cert-manager-issued cert for its admission webhook.
    serviceAccount:
      create: true
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  # Route the kube-rbac-proxy sidecar image through the Sovereign-local
  # Harbor proxy (#5017) — same kyverno harbor-proxy-pull denial class as
  # the manager image above (upstream default is a raw quay.io ref). Tag
  # stays the upstream chart default (v0.15.0).
  kubeRBACProxy:
    image:
      repository: harbor.openova.io/proxy-quay/brancz/kube-rbac-proxy
  admissionWebhooks:
    certManager:
      enabled: true
