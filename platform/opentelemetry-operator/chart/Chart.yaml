apiVersion: v2
name: bp-opentelemetry-operator
version: 1.0.3
description: |
  Catalyst-curated Blueprint umbrella chart for the OpenTelemetry
  Operator. Wraps the upstream open-telemetry/opentelemetry-helm-charts
  `opentelemetry-operator` chart and ships the default Instrumentation CR.
  Wave 5.41 (#2227) activated this chart (was Phase-0 scaffold default-off)
  to fix the chicken-and-egg CRD-vs-CR issue surfaced by Wave 5.36 #2215:
  Helm 3 doesn't install subchart CRDs on UPGRADE. Splitting Operator+CRDs
  into this dedicated Blueprint + creating CRs in bp-opentelemetry via
  Flux dependsOn ordering eliminates the upgrade-time race.
type: application
keywords: [catalyst, blueprint, opentelemetry, observability, instrumentation]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

dependencies:
  - name: opentelemetry-operator
    version: "0.61.0"
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"
    condition: enabled
