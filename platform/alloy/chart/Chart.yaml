apiVersion: v2
name: bp-alloy
description: |
  Catalyst Blueprint umbrella chart for Grafana Alloy. Depends on the
  upstream `alloy` chart (grafana/helm-charts) as a Helm subchart so
  `helm dependency build` pulls the upstream payload into this artifact.
  Catalyst-curated values flow into the upstream subchart under the
  `alloy:` key in values.yaml.

  Alloy is the unified telemetry collector for the LGTM stack — receives
  OTLP / Prometheus scrape / log tails and forwards to bp-loki (logs),
  bp-mimir (metrics), bp-tempo (traces). Default controller is DaemonSet
  (one pod per node) so node + pod metrics + container logs are collected.
type: application
# 1.0.2 (#3760 hw161 converge-readiness): route the main Alloy image AND the
# config-reloader sidecar through the Sovereign Harbor proxy (proxy-dockerhub/
# grafana/alloy + proxy-quay/prometheus-operator/prometheus-config-reloader).
# The DaemonSet runs in the un-excluded `alloy` namespace, so the upstream
# docker.io/quay.io defaults were post-handover Enforce-deniable by the
# harbor-proxy-pull ClusterPolicy (the #3296/#3380-D delayed self-inflicted
# wound). Values-only image-registry change; the chart was never swept by
# #3380-D. Added to scripts/check-kyverno-proxy-images.sh to guard regressions.
#
# 1.0.3 (#3988, UAT row 222): make the chart INSTALLABLE AT ALL. The rendered
# DaemonSet could never satisfy the platform's OWN `probes-present` Kyverno
# ClusterPolicy (Enforce by default) — the alloy container carried readiness
# but no liveness, and the config-reloader sidecar carried neither. Every
# per-Organization namespace is outside that policy's exclude list, so
# bp-alloy was admission-DENIED for anyone installing it as an Application,
# agent or human. Measured live on hw296: all six `uat-agent-alloy-*`
# HelmReleases in ns `walkthree` failed with
#   validate.kyverno.svc-fail denied ... probes-present:
#   containers-must-have-liveness-and-readiness
# Fix is values-only: populate `alloy.alloy.livenessProbe` (httpGet
# /-/healthy — Alloy's own liveness endpoint, verified 200 against the live
# collector) and disable the config-reloader sidecar, whose upstream
# template emits NO probe fields and offers no knob at ANY published chart
# version (checked 1.8.0 and 1.11.1). Guarded by
# scripts/check-chart-probes-satisfy-policy.py, which renders this chart and
# evaluates the policy's own JMESPath predicate against the output.
version: 1.0.3
appVersion: "v1.16.0"
keywords: [catalyst, blueprint, alloy, observability, otlp, telemetry, collector]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Pinned to grafana/alloy 1.8.0 (appVersion v1.16.0) — current stable on
# 2026-04-29. Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the
# version is operator-bumpable via PR + Blueprint release.
dependencies:
  - name: alloy
    version: "1.8.0"
    repository: "https://grafana.github.io/helm-charts"
