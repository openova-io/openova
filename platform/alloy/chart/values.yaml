# Catalyst Blueprint umbrella metadata — the upstream chart is resolved as
# a Helm subchart via Chart.yaml `dependencies:`. Catalyst-curated values
# under the `alloy:` key flow into the upstream subchart unchanged.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

catalystBlueprint:
  upstream:
    chart: alloy
    version: "1.8.0"
    repo: "https://grafana.github.io/helm-charts"

# ─── Upstream chart values (subchart key: alloy) ─────────────────────────
alloy:
  # Pin upstream Alloy image tag — DO NOT use floating tags.
  #
  # #3760 harbor-proxy-glob (hw161 converge-readiness): route BOTH the main
  # Alloy image and the config-reloader sidecar through the Sovereign's local
  # Harbor proxy. The alloy DaemonSet runs in the `alloy` namespace, which is
  # NOT in the kyverno harbor-proxy-pull excludeNamespaces set (unlike
  # mgmt/dmz/rtz/kube-system). The upstream subchart defaults
  # (docker.io/grafana/alloy + quay.io/prometheus-operator/prometheus-config-
  # reloader) match NEITHER allowed glob (`*/proxy-*/*` or `*/openova-io/*`),
  # so once `compliancePolicies.bootstrapMode` flips to false post-handover
  # (post_handover_policy_enforce.go, phase 2b) the policy goes Enforce and the
  # next DaemonSet pod reschedule (node reboot / image roll / eviction) is
  # admission-DENIED — the #3296 delayed self-inflicted-wound shape #3380-D
  # fixed for the vCluster control-plane images. The alloy chart was never
  # swept by #3380-D (last touched #3179). proxy-dockerhub/proxy-quay are the
  # canonical proxy projects already used by bp-grafana/bp-openbao and named in
  # bp-self-sovereign-cutover values (`proxy-docker/grafana/alloy`,
  # `proxy-quay/...`). Bootstrap-mode Audit means this is byte-equivalent during
  # the fresh-prov convergence walk; the proxy path simply prevents the
  # post-handover/cutover-walk denial.
  image:
    registry: "harbor.openova.io"
    repository: proxy-dockerhub/grafana/alloy
    tag: "v1.16.0"
    pullPolicy: IfNotPresent
  # Config-reloader sidecar (upstream default quay.io/prometheus-operator/
  # prometheus-config-reloader) — same harbor-proxy-glob fix as the main image.
  #
  # #3988 (UAT row 222) — DISABLED. This is not a preference; the upstream
  # sidecar CANNOT satisfy the platform's own `probes-present` ClusterPolicy.
  # That policy is `Enforce` by default (platform/kyverno-policies/chart/
  # values.yaml compliancePolicies.probesPresent.action) and requires BOTH a
  # livenessProbe AND a readinessProbe on EVERY container of a Deployment /
  # StatefulSet / DaemonSet. The upstream watch-container template
  # (`alloy/templates/containers/_watch.yaml`, define "alloy.watch-container")
  # emits NO probe fields at all and exposes NO values knob for them —
  # verified against the pinned 1.8.0 AND against the newest published 1.11.1,
  # so this is not fixable by a chart bump. With the sidecar enabled the
  # rendered DaemonSet is therefore admission-DENIED in every namespace that
  # is not in probesPresent.excludeNamespaces, which is every per-Organization
  # namespace — i.e. bp-alloy was uninstallable as an Application by anyone.
  # Measured live on hw296 2026-08-14: all six `uat-agent-alloy-*`
  # HelmReleases in ns `walkthree` failed with
  #   admission webhook "validate.kyverno.svc-fail" denied the request:
  #   resource DaemonSet/walkthree/uat-agent-alloy-mgmt-a was blocked ...
  #   probes-present: containers-must-have-liveness-and-readiness
  #
  # Disabling the sidecar is the UPSTREAM-DESIGNED alternative, not a
  # capability loss: `alloy/templates/controllers/_pod.yaml` stamps a
  # `checksum/config` pod annotation EXACTLY WHEN `configReloader.enabled` is
  # false and a configMap content is set, so a config change rolls the pods
  # instead of hot-reloading them. Per-Sovereign overlays that would rather
  # keep hot-reload must ALSO add `alloy` (and their Org namespaces) to
  # probesPresent.excludeNamespaces — do not flip this back on alone.
  configReloader:
    enabled: false
    image:
      registry: "harbor.openova.io"
      repository: proxy-quay/prometheus-operator/prometheus-config-reloader
      tag: v0.81.0

  # Alloy runtime config. Empty by default — the upstream chart ships an
  # empty configMap that Alloy starts up against. Per-Sovereign overlays
  # populate `alloy.configMap.content` with the full Alloy config (OTLP
  # receivers + forwarders to Loki/Mimir/Tempo). Catalyst-side templates/
  # may render a default config in a follow-up PR once those Blueprints
  # have outputs declared.
  alloy:
    configMap:
      create: true
      content: ''

    clustering:
      enabled: false

    # ─── Probes — #3988 (UAT row 222), the same shape as #4347 on bp-loki ──
    # The upstream alloy container template renders a readinessProbe
    # unconditionally (httpGet /-/ready on `listenPort`) but leaves
    # `livenessProbe: {}` empty, so the rendered DaemonSet carries readiness
    # WITHOUT liveness and the `probes-present` Enforce ClusterPolicy denies
    # it. bp-loki (platform/loki/chart/values.yaml) and bp-mimir carry the
    # identical fix; bp-alloy was simply missed by that sweep.
    #
    # `/-/healthy` is Alloy's OWN liveness endpoint — it is deliberately NOT
    # a copy of the readiness path, because a liveness probe on `/-/ready`
    # would restart the pod every time a config load is merely slow.
    # Verified against the live collector on hw296 (alloy v1.16.0, pod
    # alloy-788mp, ns alloy): GET /-/healthy → 200, GET /-/ready → 200.
    #
    # The port is a literal because the upstream template renders this block
    # with a verbatim `toYaml` and cannot interpolate `listenPort` into it.
    # 12345 is the upstream `alloy.listenPort` default, which this chart does
    # not override; scripts/check-chart-probes-satisfy-policy.py asserts the
    # probe port matches a declared containerPort so the two cannot drift.
    livenessProbe:
      httpGet:
        path: /-/healthy
        port: 12345
        scheme: HTTP
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
      # 6 × 20s = tolerate ~2min of unresponsiveness before a restart. A
      # cold-start config load on a high-cardinality cluster can exceed one
      # period; restarting mid-load would loop.
      failureThreshold: 6

    # Storage path — emptyDir by default; per-Sovereign overlays MAY pin a
    # PVC for persistent WAL.
    storagePath: /tmp/alloy

    # Resources — modest defaults; per-Sovereign overlays bump for high-
    # cardinality clusters.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 512Mi

  # Controller — DaemonSet default (one Alloy pod per node) so node-level
  # metrics + container log tails work. Per-Sovereign overlays MAY flip to
  # `deployment` for a centralised collector model.
  controller:
    type: daemonset
    replicas: 1
    # Tolerations — Alloy is a DaemonSet; one pod MUST land on every node
    # including the control plane so CP-local kubelet logs + node metrics
    # are collected. PR #755 added a NoSchedule taint on the CP in multi-
    # node Sovereigns; without this toleration Alloy sits at desired=N-1
    # ready=N-1 and CP telemetry is silently lost (issue #769 audit). On
    # solo Sovereigns (worker_count=0) the CP is untainted, so this
    # toleration is a no-op.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  # ServiceMonitor — DEFAULT FALSE per docs/BLUEPRINT-AUTHORING.md §11.2.
  serviceMonitor:
    enabled: false

  # Service — ClusterIP; UI at port 12345.
  service:
    enabled: true
    type: ClusterIP

  # Ingress — DEFAULT FALSE; per-Sovereign overlays expose the Alloy UI via
  # cilium-gateway HTTPRoute when needed.
  ingress:
    enabled: false

  # NetworkPolicy — DEFAULT FALSE; the Catalyst-side NetworkPolicy template
  # in templates/ (when added) governs this for all bp-* charts uniformly.
  networkPolicy:
    enabled: false

  # RBAC — chart manages cluster-scoped Role+Binding so Alloy can discover
  # pod/node/service targets.
  rbac:
    create: true
  serviceAccount:
    create: true
    name: ""

  # CRDs — alloy ships PodLogs CRDs as opt-in install. DEFAULT FALSE because
  # they're cluster-scoped + may collide with existing kube-prometheus-stack
  # operator install. Per-Sovereign overlays flip on once the operator
  # is reconciled.
  crds:
    create: false

# ─── Catalyst overlay values (consumed by templates/ in this chart) ──────
alloyOverlay:
  networkPolicy:
    enabled: false
