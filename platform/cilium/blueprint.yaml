apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-cilium
spec:
  version: 1.4.23
  card:
    title: Cilium
    summary: Unified CNI + Service Mesh (eBPF). mTLS via WireGuard, Hubble observability, Gateway API.
    icon: cilium.svg
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  class: platform-component
  lifecycle: experimental
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-cilium
  upgrades:
    from: ["0.x"]
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ''
          clusters:
            - mgmt-A
            - mgmt-B
            - dmz-A
            - dmz-B
            - rtz-A
            - rtz-B
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  endpoints:
    - name: hubble
      hostnameTemplate: "hubble.{{.SovereignFQDN}}"
      port: 443
      protocol: https
      tls: true
      visibility: private
      launchDefault: false
