# Catalyst Blueprint umbrella metadata — the upstream chart is now resolved
# as a Helm subchart via Chart.yaml `dependencies:`. This values.yaml carries
# both:
#   1. The catalystBlueprint metadata block (provenance + version) so
#      observability/audit pipelines can inspect the artifact and report
#      which upstream chart + version is bundled.
#   2. The upstream subchart values overlay under the `cilium:` key
#      (umbrella-chart convention — the dependency name from Chart.yaml is
#      the values namespace).

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). The upstream cilium subchart
  # does not expose a single `image.registry` knob; per-Sovereign overlays
  # should set specific image paths (e.g. `cilium.image.repository`) in
  # conjunction with this value. Tracked under #560.
  imageRegistry: ""

catalystBlueprint:
  # Pinned to match Chart.lock (truth-on-disk). Aligned with Chart.yaml's
  # dependencies version. The previous "1.19.3" was provenance drift —
  # Chart.lock had been resolving 1.16.5 the whole time (EPIC-0 #1095 audit).
  upstream: { chart: cilium, version: "1.16.5", repo: "https://helm.cilium.io" }

# Catalyst-curated Cilium values per platform/cilium/README.md.
#
# Defaults assume a Catalyst Sovereign on bare-metal/VM Kubernetes (k3s on
# Hetzner is the canonical target). Cilium replaces both flannel and
# kube-proxy; k3s must be started with --flannel-backend=none and
# --disable-network-policy.

cilium:
  # kube-proxy replacement (faster + simpler than iptables). MUST be true
  # because we also set `bpf.masquerade: true` (line 54) — Cilium rejects
  # the BPF masquerade datapath without NodePort enabled, and Cilium only
  # auto-enables NodePort when kubeProxyReplacement is true:
  #   "BPF masquerade requires NodePort (--enable-node-port=\"true\")"
  # The Sovereign cloud-init pre-Flux Cilium install (infra/hetzner/
  # cloudinit-control-plane.tftpl `/var/lib/catalyst/cilium-values.yaml`)
  # already uses kubeProxyReplacement: true, so this aligns the Flux HR
  # overlay with the pre-Flux bootstrap. Symptom when divergent: CP
  # cilium-agent kept its old in-memory state and stayed Ready, but every
  # WORKER node that joined AFTER the Flux upgrade saw the new ConfigMap
  # with enable-bpf-masquerade=true + enable-node-port=false → fatal
  # "BPF masquerade requires NodePort" → cilium-agent CrashLoopBackOff →
  # node.cilium.io/agent-not-ready taint never lifts → every keycloak/
  # gitea/catalyst-platform/openbao/powerdns/mimir post-install Job pod
  # stays Pending → whole bootstrap-kit chain stalls.
  # Caught on prov #55 (8d85a64cb8807cdc, 2026-05-12). The DaemonSet
  # is started with kube-proxy-replacement off → NodePort off → masq off
  # incompat. Both single-node and multi-node Sovereigns hit this once
  # cluster-autoscaler scales workers.
  kubeProxyReplacement: true
  # k8sServiceHost: CP's stable private IP on the Sovereign's 10.0.1.0/24
  # subnet (cp1=10.0.1.2 per infra/hetzner/main.tf). Multi-node-aware:
  # works on the CP itself (10.0.1.2 IS its own private IP) AND on
  # workers (which need the CP's IP because k3s agents do NOT expose the
  # apiserver on localhost — only the supervisor on :6444). Previously
  # `127.0.0.1` here, which crashloop'd Cilium on every worker for
  # multi-node Sovereigns (issue #733). For air-gap / multi-CP / non-
  # Hetzner Sovereigns the canonical fix is to point this at the in-
  # cluster apiserver Service (kubernetes.default.svc.cluster.local) —
  # but that requires DNS up before Cilium, which is the chicken-egg
  # this whole config exists to solve. The Sovereign template subnet
  # is fixed at 10.0.1.0/24 so 10.0.1.2 is a stable load-bearing value.
  k8sServiceHost: 10.0.1.2
  k8sServicePort: 6443

  # eBPF-host-routing — bypasses iptables stack
  bpf:
    masquerade: true
    # qa-loop iter-12 Fix #54 Workstream 2 — fresh worker pods on
    # catalyst-omantel-biz-w2/w3 could not resolve github.com (BPF map
    # capacity exhaustion when a node first joins). Pre-allocate the
    # NAT/connection BPF map slots at agent startup so DNS lookups from
    # newly-scheduled pods succeed on the first eBPF socketLB hit instead
    # of falling through to iptables fallback (which on k3s with
    # --disable-network-policy is no-op — the lookup just fails).
    #
    # Cost: ~12 MiB extra RSS per cilium-agent. Benefit: DNS lookups from
    # pods on first-join workers don't transient-fail for the 30-90s
    # window the lazy-allocate path otherwise takes (see Cilium issue
    # cilium/cilium#28456 — "DNS races during node bring-up when BPF maps
    # allocate on-demand"). Worth the RSS cost; canonical fix per upstream.
    preallocateMaps: true

  # qa-loop iter-12 Fix #54 Workstream 2 — socket-level load-balancing
  # MUST stay in the host network namespace (default true is correct, but
  # we pin the value explicitly so a future upstream default-flip doesn't
  # silently re-introduce the per-pod-netns kube-proxy-replacement DNS
  # race). When socketLB runs in the pod netns (hostNamespaceOnly: false),
  # a brand-new pod's first DNS query can race with cilium-agent's
  # service-map sync and miss kube-dns; the lookup then falls back to
  # the iptables stack which on a kube-proxy-replacement cluster is
  # absent → DNS fails. Keeping socketLB host-only ensures every
  # pod-egress lookup goes through the cilium-agent's already-synced
  # service map.
  socketLB:
    hostNamespaceOnly: true

  # IPAM — k8s mode uses the k8s pod CIDR allocator (works with k3s defaults)
  ipam:
    mode: kubernetes

  # WireGuard mTLS for transparent encryption between every pod (per
  # platform/cilium/README.md "mTLS via WireGuard"). This is the
  # CANONICAL east-west mTLS layer for OpenOva Sovereign clusters —
  # 100% mesh enforcement at the kernel transport level. SPIFFE-based
  # workload identity is intentionally NOT enabled here; bp-spire was
  # dropped from the bootstrap-kit (founder direction 2026-05-03)
  # because (a) Cilium WireGuard already gives every connection
  # transparent encryption + node-level identity, and (b) ESO→OpenBao
  # auth uses K8s ServiceAccount auth method (TokenReview), not
  # JWT-SVID. Federation across Sovereigns or per-workload-fingerprint
  # attestation can re-introduce SPIRE later as an opt-in blueprint.
  encryption:
    enabled: true
    type: wireguard
    nodeEncryption: true

  # Pod/datapath MTU — explicitly pinned to account for the COMBINED
  # VXLAN tunnel + WireGuard node-encryption overhead. DO NOT remove or set
  # to 0 (auto) on this platform.
  #
  # The Catalyst datapath stacks two encapsulations on every cross-node
  # pod packet:
  #   1. routingMode=tunnel + tunnelProtocol=vxlan  → +50 bytes (VXLAN hdr).
  #      Both are upstream defaults (this chart sets neither key), so the
  #      datapath IS in VXLAN-tunnel mode unless an overlay overrides it.
  #   2. encryption.type=wireguard + nodeEncryption=true (above) → ~80 bytes
  #      (WireGuard transport overhead on cilium_wg0).
  #
  # Root-caused live on a Huawei me-east-215 (kom4dc) fresh prov (#4467):
  # cilium's AUTO-MTU detection read eth0=1500 and correctly programmed
  # cilium_wg0=1420 (eth0 − 80 WG), BUT left cilium_vxlan / cilium_host /
  # pod lxc* veths at 1500 — it did NOT compound the VXLAN overhead onto
  # the pod-facing devices when BOTH vxlan-tunnel AND wireguard were on.
  # Net: a pod emitting a full 1500-byte frame produces a 1550-byte VXLAN
  # packet that overflows the 1420 WireGuard MTU and is silently dropped
  # (DF set). Small packets (health probes, HTTP request lines) pass; large
  # ones (TCP data, HTTP response bodies, TLS handshakes) drop → ALL
  # cross-node pod-to-pod TCP to non-trivial payloads times out
  # (`curl: (28)`). Phase-1 convergence deadlocks (e.g. the
  # catalyst-gitea-token-mint Job can't reach gitea-http.gitea.svc:3000 on
  # another node → bp-catalyst-platform never finishes installing).
  #
  # Correct pod MTU = 1500 (eth0) − 50 (VXLAN) − 80 (WireGuard) = 1370.
  # A 1370-byte pod payload + 50 VXLAN = 1420 = exactly the cilium_wg0 MTU.
  # WireGuard node-encryption is ALWAYS-ON for every Catalyst Sovereign
  # (the canonical east-west mTLS layer — see the encryption block above),
  # so 1370 is a safe static default that never regresses a non-WG path.
  #
  # The upstream cilium chart's top-level `MTU` key renders cilium-config
  # `mtu: "1370"`, which sets the device MTU for exactly cilium_net /
  # cilium_host / cilium_vxlan / lxc (per the upstream values.yaml comment)
  # — the very devices left mis-sized by the auto path. `MTU: 0` (upstream
  # default) means auto-detect and reproduces the bug.
  #
  # Air-gapped / jumbo-frame (eth0 MTU != 1500) Sovereigns recompute as
  # `<eth0-mtu> − 80` (WG-only, native routing) in their per-Sovereign overlay
  # at clusters/<sov>/bootstrap-kit/01-cilium.yaml.
  #
  # #4656 (2026-07-04): switched to NATIVE routing (routingMode below) so
  # WireGuard encapsulates ONCE. VXLAN-inside-WireGuard was UNFIXABLE by any
  # MTU: pinning MTU makes cilium derive wg0 = MTU−80, so pod(MTU)+50(VXLAN)
  # ALWAYS exceeds wg0 (proven live hw224: host 1370 + 50 > wg0 1290). With
  # no VXLAN the WG-only MTU is eth0(1500)−80 = 1420.
  MTU: 1420

  # #4656: native routing (NOT the upstream vxlan-tunnel default). WireGuard
  # node-encryption then encapsulates cross-node pod traffic ONCE. Nodes are
  # L2-adjacent within a region (same VPC subnet) so autoDirectNodeRoutes
  # installs direct cross-node pod routes with no tunnel.
  #
  # ipv4NativeRoutingCIDR spans BOTH per-region k3s pod CIDRs — region-a
  # 10.42.0.0/16 + region-b 10.43.0.0/16 collapse to the /15 10.42.0.0/15 —
  # so a single chart value is correct for every region AND for single-region
  # Sovereigns (whose pod CIDR is a subset). Traffic to pod IPs inside this
  # CIDR is routed natively (never masqueraded); everything else egresses
  # NAT'd. The bootstrap cloud-init pins the tighter per-region cluster_cidr
  # explicitly; this chart overlay widens it to cover cross-region ClusterMesh.
  # ⚠️ 2-region ClusterMesh cross-region pod reach MUST be fresh-prov-verified
  # before merge (see #4656 spec) — this is the reviewable starting point.
  routingMode: native
  ipv4NativeRoutingCIDR: "10.42.0.0/15"
  autoDirectNodeRoutes: true

  # Hubble — network observability (L3/L4/L7 flows, DNS, drop, http metrics).
  #
  # DEFAULT OFF per docs/BLUEPRINT-AUTHORING.md §11.2 (Observability toggles
  # must default false) + INVIOLABLE-PRINCIPLES.md #4 (never hardcode).
  #
  # Hubble relay/ui depend on the kube-prometheus-stack
  # `monitoring.coreos.com/v1` ServiceMonitor CRD AND on Hubble metrics
  # being scraped — neither exists on a fresh Sovereign before the
  # observability tier (Application Blueprint bp-kube-prometheus-stack)
  # is reconciled. Worse: enabling `hubble.metrics.enabled` with values
  # like `dns:query;ignoreAAAA` causes the upstream Cilium chart to render
  # a ServiceMonitor unconditionally (verified on omantel.omani.works
  # 2026-04-29 — install fails with "no matches for kind ServiceMonitor in
  # version monitoring.coreos.com/v1").
  #
  # `metrics.enabled: null` (NOT [] and NOT a populated list) is the
  # exact value that makes the upstream Cilium chart skip the metrics
  # ServiceMonitor template branch — verified by reading the upstream
  # cilium 1.19.3 chart's _hubble.tpl.
  #
  # Operator opts in via clusters/<sovereign>/bootstrap-kit/01-cilium.yaml
  # values overlay once bp-kube-prometheus-stack reconciles (issue #182).
  hubble:
    enabled: true
    relay:
      # Default false — every Sovereign in production runs without the relay.
      # EPIC-5 (#1100) flips this on per-Sovereign via clusters/<sov>/bootstrap-kit/01-cilium.yaml
      # values overlay alongside the catalystOverlay.hubbleUI block below.
      enabled: false
    ui:
      enabled: false
    metrics:
      # `null` — not a list. Disables the upstream chart's metrics
      # ServiceMonitor template entirely.
      enabled: null
      serviceMonitor:
        enabled: false

  # Gateway API — replaces traditional ingress controllers
  gatewayAPI:
    enabled: true
    gatewayClass:
      # Force GatewayClass creation regardless of CRD presence at Helm
      # render time. Upstream default is "auto" which skips creation when
      # the gateway.networking.k8s.io CRDs are absent (Capabilities check
      # at helm install time). During bootstrap, bp-gateway-api runs AFTER
      # bp-cilium, so "auto" silently skips the GatewayClass — leaving
      # every HTTPRoute orphaned until the operator is manually restarted.
      # Forcing "true" ensures GatewayClass/cilium is always created.
      # Permanent fix for the cilium-gateway race (issue #503).
      create: "true"
    # hostNetwork mode OFF (#4682). The gateway is served the STANDARD
    # Gateway-API + Cilium way: the GatewayClass `cilium` controller
    # auto-creates a `cilium-gateway-<name>` Service of type=LoadBalancer,
    # envoy binds its normal UNPRIVILEGED proxy port inside the pod, and
    # the LoadBalancer Service owns the public :443/:80 contract. The LB
    # ExternalIP is materialised by hcloud-ccm (Hetzner) or a
    # CiliumLoadBalancerIPPool (Huawei, no-CCM — see gateway-lb-ipam-pool.yaml).
    #
    # Why hostNetwork MUST stay off: with hostNetwork ON, cilium-agent's
    # BPF socket-LB program intercepts envoy's bind() on privileged ports
    # and REJECTS it regardless of privileged:true / NET_BIND_SERVICE
    # (live-verified otech45-47). That intercept is the sole reason the
    # old design fell back to the NodePort-range :30443 host bind — a
    # workaround that ARCHITECTURE.md §854 forbids ("LoadBalancer type
    # Service — never NodePort"). With hostNetwork OFF envoy never does a
    # host bind, so the intercept never fires and :443 is served cleanly
    # through the LoadBalancer Service, identically inside and outside the
    # cluster (which is required for the segregated DMZ/RTZ multi-cluster
    # topology, where in-cluster ClusterIPs do not route across clusters).
    #
    # #4706 — PER-PROVIDER with the cilium 1.16.5 → 1.19.3 bump. The bind
    # rejection above was a 1.16.x gateway-api-hostNetwork bug (cilium-envoy
    # NACK'd "cannot bind 0.0.0.0:80"); 1.19 graduated hostNetwork out of
    # beta and fixes it, so envoy CAN bind node:443/:80 directly. On the
    # no-CCM Huawei provider this is the ONLY §854-clean gateway path: the
    # LoadBalancer VIP can't route through Huawei's 1:1-NAT'd EIP (hw208)
    # and nodePorts are forbidden — so the Huawei ELB targets
    # node-IP:443/:80 (a direct host bind, NOT a nodePort). Companion: the
    # gateway-elb member reconciler + tofu members target :443/:80.
    #
    # DEFAULT stays FALSE: on Hetzner the front door IS the hcloud-ccm-
    # materialised LoadBalancer Service — flipping hostNetwork there would
    # drop the CCM LB and break the Hetzner gateway. The bootstrap-kit
    # slot-01 HR wires this per-provider via the
    # CILIUM_GATEWAY_HOSTNETWORK_ENABLED substitute (huawei cloud-init sets
    # "true"; hetzner leaves it unset → default false).
    hostNetwork:
      enabled: false

  # L7 proxy via Envoy — for HTTPRoute, gRPCRoute, L7 NetworkPolicy
  envoy:
    enabled: true
    # #4706 — REQUIRED for the gateway-api hostNetwork host bind on
    # privileged ports (node:443/:80). Two knobs, both live-proven on hw217:
    #   1. NET_BIND_SERVICE must be ADDED to the envoy container caps (the
    #      list REPLACES the chart default [NET_ADMIN, SYS_ADMIN] — keep
    #      those two or the datapath breaks);
    #   2. keepCapNetBindService=true — cilium-envoy-starter DROPS ambient
    #      caps at exec unless told to keep NET_BIND_SERVICE; without it the
    #      container cap alone still yields "cannot bind '0.0.0.0:80':
    #      Permission denied" (observed live).
    # Inert on Hetzner (hostNetwork off → no privileged host bind attempted).
    securityContext:
      capabilities:
        envoy:
          - NET_ADMIN
          - SYS_ADMIN
          - NET_BIND_SERVICE
        keepCapNetBindService: true

  # L2 LoadBalancer announcements (alternative to MetalLB for bare-metal)
  l2announcements:
    enabled: false  # Catalyst uses Hetzner LB on cloud Sovereigns; flip true for bare-metal

  # Operator HA — single replica is fine for solo, bump to 2-3 for HA
  operator:
    replicas: 1

  # Pod resource requests/limits — tuned for k3s on cx32 (8 vCPU / 16 GB)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  # Prometheus scraping + ServiceMonitor — DEFAULT OFF.
  #
  # Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) and
  # docs/BLUEPRINT-AUTHORING.md §11.2 (Observability toggles must default
  # false): observability toggles MUST default `false` because the
  # `monitoring.coreos.com/v1` CRDs that back ServiceMonitor / PrometheusRule
  # ship with kube-prometheus-stack — a second-tier Application Blueprint
  # that itself depends on the bootstrap-kit (cilium first). Defaulting
  # `serviceMonitor.enabled: true` here creates a circular CRD dependency:
  # bp-cilium wants the CRD that bp-kube-prometheus-stack provides, but
  # bp-kube-prometheus-stack cannot install before bp-cilium. The
  # `trustCRDsExist=true` mitigation only suppresses Helm's render-time
  # gate; at install time the apiserver still rejects ServiceMonitor with
  # "no matches for kind ServiceMonitor in version monitoring.coreos.com/v1
  # — ensure CRDs are installed first" (verified on omantel.omani.works
  # 2026-04-29, issue #182).
  #
  # Operator opts in once the observability tier is reconciled. The opt-in
  # is a per-cluster values overlay at clusters/<sovereign>/bootstrap-kit/
  # 01-cilium.yaml `spec.values.cilium.prometheus.serviceMonitor.enabled:
  # true` — no rebuild of the Blueprint OCI artifact is required.
  prometheus:
    enabled: false
    serviceMonitor:
      enabled: false

# ─── Catalyst overlay templates (chart/templates/) ─────────────────────
#
# Templates that ride alongside the upstream cilium subchart. Every block
# is gated by an explicit `enabled: false` so installing the chart never
# regresses production behaviour — operator opts in via per-Sovereign
# overlay at clusters/<sov>/bootstrap-kit/01-cilium.yaml.

catalystOverlay:
  # Hubble UI exposed via Cilium Gateway with Keycloak OIDC. Activated
  # by EPIC-5 (#1100) as part of the zero-trust observability roll-out.
  #
  # Prerequisite to enable:
  #   1. cilium.hubble.relay.enabled = true
  #   2. cilium.hubble.ui.enabled    = true
  #   3. Keycloak realm has a `hubble-ui` OIDC client (ConfigMap
  #      configmap-sovereign-realm.yaml in bp-keycloak — wired by
  #      slice D1).
  #   4. Cilium Gateway exists with the wildcard cert (every Sovereign
  #      has this from clusters/_template/sovereign-tls/).
  hubbleUI:
    enabled: false
    # Hostname under the Sovereign domain. Per docs/NAMING-CONVENTION.md
    # §5.1 the canonical control-plane DNS pattern is
    # `{component}.{location-code}.{sovereign-domain}`, but every existing
    # bootstrap-kit HTTPRoute (gitea, auth/keycloak, grafana, harbor,
    # openbao, powerdns, console/catalyst-platform) uses the flat
    # `{component}.{sovereign-domain}` form because the Cilium Gateway's
    # wildcard cert + listener is `*.${SOVEREIGN_FQDN}` — a single-level
    # wildcard. Multi-level forms like `hubble.console.<fqdn>` would NOT
    # match `*.<fqdn>` (TLS wildcards are single-label). For consistency
    # this overlay uses the flat form.
    #
    # Two ways to populate this:
    #   1. Set hostname directly (full FQDN, e.g. "hubble.omantel.biz").
    #   2. Set sovereignFQDN (e.g. "omantel.biz") and the chart derives
    #      `hubble.<sovereignFQDN>` automatically — preferred for Flux
    #      envsubst flows where the Sovereign FQDN is the single source.
    # Explicit hostname wins when both are set.
    hostname: ""
    # Optional: when set AND hostname is empty, the chart auto-derives
    # `hubble.<sovereignFQDN>` so per-Sovereign overlays only need to
    # forward ${SOVEREIGN_FQDN} once (matches the gitea/auth/grafana
    # bootstrap-kit pattern). Empty = no auto-derivation.
    sovereignFQDN: ""
    # Reference to the Cilium Gateway that fronts this Sovereign's wildcard
    # cert. Defaults match clusters/_template/sovereign-tls/cilium-gateway.yaml,
    # which installs the Gateway into kube-system (NOT a separate
    # cilium-gateway namespace — the previous default was a stale leftover
    # from an earlier design that never landed).
    gatewayRef:
      name: cilium-gateway
      namespace: kube-system
    # Authentication mode at the gateway boundary.
    #
    # G117.5 W3.D1 #2744 (2026-06-02) — DECORATIVE-GATE REMOVED. Pre-fix
    # this knob defaulted to `oidc` and was emitted as an HTTPRoute
    # annotation `catalyst.openova.io/hubble-ui-auth: oidc`, BUT no
    # actual OIDC enforcement filter was ever attached — operators
    # were misled into thinking the route was protected when it was
    # not. Per Aux-2 audit
    # docs/sessions/2026-06-02-G117-sso-fanout-audit/tier-2/bp-cilium.md
    # the decorative annotation was dropped from the HTTPRoute template,
    # and this default flips `oidc` → `none` so per-Sovereign overlays
    # MUST consciously enable Hubble UI exposure on the unauthenticated
    # path until the oauth2-proxy sidecar lands (Aux-2 audit step 1, in
    # a follow-up Wave).
    #
    # G117.5 #2744 (2026-06-03) — ENFORCEMENT SHIPPED. The oauth2-proxy
    # sidecar (templates/hubble-ui-oauth2-proxy-{deployment,service,
    # secret}.yaml) now gives this knob real meaning:
    #   - `oidc`  → render the oauth2-proxy Deployment + Service + Secret
    #     and point the HTTPRoute at the proxy (port 80 → :4180). All
    #     public Hubble UI traffic is OIDC-authenticated against the
    #     sovereign realm `hubble-ui` client (silent via realm IDR
    #     defaultProvider=catalyst-pin, G113 #2725).
    #   - `none` → HTTPRoute targets the upstream hubble-ui Service
    #     directly (UNAUTHENTICATED — operator consciously accepts this).
    # Default stays `none` so an upgrade never silently introduces a new
    # Deployment without operator intent; per-Sovereign overlays flip to
    # `oidc` (see clusters/_template/bootstrap-kit/01-cilium.yaml) plus
    # forward sovereignFQDN so the proxy can build the OIDC issuer URL.
    # The bp-keycloak sovereign realm-import already codifies the
    # `hubble-ui` OIDC client + redirect URI /oauth2/callback.
    auth: none
    # Hubble UI Service ref. The bp-cilium HelmRelease installs Cilium
    # into kube-system (clusters/_template/bootstrap-kit/01-cilium.yaml
    # `targetNamespace: kube-system`), so the upstream subchart renders
    # the hubble-ui Service in kube-system. The previous default
    # `namespace: cilium` would have routed traffic to a non-existent
    # Service on every Sovereign.
    serviceRef:
      name: hubble-ui
      namespace: kube-system
      port: 80
    # G117.5 #2744 — oauth2-proxy sidecar config (only consumed when
    # auth=oidc). Renders into the same namespace as serviceRef.
    oauth2Proxy:
      # #5059 — in-cluster OIDC discovery/backchannel URL. When set, oauth2-proxy
      # runs OIDC discovery + jwks/redeem against this in-cluster keycloak Service
      # instead of hairpinning to the public issuer (which CrashLoops on a forced
      # roll under the step-08 deny-egress hold). --oidc-issuer-url + --login-url
      # stay PUBLIC. Verified live: http://keycloak.keycloak.svc.cluster.local
      # answers /realms/sovereign/.well-known/openid-configuration -> 200. Empty
      # (default) preserves current public-discovery behavior; the Catalyst
      # sovereign overlay sets it to the in-cluster keycloak URL.
      keycloakInternalURL: ""
      # When true (default), the chart manages the OIDC client-secret +
      # cookie-secret Secret via lookup-or-generate (see
      # templates/hubble-ui-oauth2-proxy-secret.yaml). Set false to bring
      # your own Secret named by `existingSecret` (keys: client-secret,
      # cookie-secret) — e.g. an ExternalSecret synced by bp-sso-bridge.
      chartManagedSecret: true
      existingSecret: hubble-ui-oauth2-proxy-sso
      # #3374 — converge the client-secret with Keycloak. The chart-
      # generated secret and the bp-keycloak realm-import's deterministic
      # tier2ClientSecret never matched, so the /oauth2/callback failed
      # `unauthorized_client` (hw130, founder-class regression). When
      # enabled (default), the chart (a) emits an AppRegistration
      # ConfigMap so bp-sso-bridge 0.2.3+ adopts the realm's hubble-ui
      # client and publishes the LIVE KC secret to OpenBao
      # `sso/sovereign/hubble-ui`, and (b) consumes it via ExternalSecret
      # `hubble-ui-oauth2-proxy-oidc` for OAUTH2_PROXY_CLIENT_SECRET.
      # #5416: OAUTH2_PROXY_COOKIE_SECRET now comes down the same
      # ExternalSecret (key `cookie-secret` <- bundle property
      # `cookie_secret`, published by bp-sso-bridge 0.2.26+). Chart-managed
      # meant lookup-or-generate, which mints a DIFFERENT value per region on
      # a 2-region Sovereign, so the two proxies behind the one shared
      # wildcard VIP rejected each other's session cookie. With
      # ssoBridgeSync off both keys stay chart-managed.
      ssoBridgeSync:
        enabled: true
        externalSecretStoreName: vault-region1
        refreshInterval: 1h
      # #4507 — oauth2-proxy --api-route regexes. The Hubble UI flow stream
      # is a gRPC-Web/Connect server-streaming XHR to /api/v1/...; a gRPC-Web
      # client cannot follow a 302 to the Keycloak login HTML page, so a
      # missing/expired session silently wedges the stream and flows never
      # render (UAT row 39). Listing the /api prefix here makes oauth2-proxy
      # return HTTP 401 (not 302-to-login) for these paths, so the SPA sees
      # the auth failure cleanly. These paths are STILL authenticated (unlike
      # skipAuthRoutes) — no unauthenticated-exposure regression.
      apiRoutes:
        - "^/api/"
      replicas: 1
      image:
        repository: quay.io/oauth2-proxy/oauth2-proxy
        tag: v7.6.0
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

  # #4656/#4854 — vpc-podcidr-route-reconciler: per-node pod-CIDR VPC routes
  # on no-CCM Huawei. #4807's whole-/16 peering routes only carry pod traffic
  # INTO the peer VPC; with no per-/24 entry in the VPC's OWN table, delivery
  # to the owning node depends on Huawei-fabric learning and black-holes
  # PER-NODE (hw228 wab0925, grafana 326× crashloop — #4854). A CronJob
  # reconciles one `type=ecs` route per node (`node.spec.podCIDR` ->
  # node's ECS id) in this cluster's own VPC route table; the peer region's
  # instance mirrors it for its side. podCIDRs are runtime data (k3s assigns
  # at registration), so this CANNOT live in tofu — and there is deliberately
  # no Huawei CCM/route-controller on these clusters.
  #
  # Enabled per-provider by the slot-01 HelmRelease substitute
  # HUAWEI_VPC_ROUTES_ENABLED (true on Huawei via cloud-init, absent on
  # Hetzner). The four huawei* creds are lifted from
  # flux-system/cloud-credentials via valuesFrom — never committed.
  vpcPodcidrRouteReconciler:
    enabled: false
    schedule: "*/5 * * * *"
    # alpine/k8s toolbox (bash + kubectl + jq + curl), proxied. NOTE (#4875):
    # this image does NOT ship the openssl CLI — the reconcile script apk-adds it
    # at start (the Huawei SDK-HMAC-SHA256 signer needs `openssl dgst`).
    image: "harbor.openova.io/proxy-dockerhub/alpine/k8s:1.30.0"
    # HCS endpoint domain — service endpoints derive as
    # https://vpc.<huaweiRegion>.<cloud>/ (same derivation as
    # platform/huawei-evs-csi values `cloud`).
    cloud: "kom4dc.nationalcloud.om"
    huaweiAccessKey: ""
    huaweiSecretKey: ""
    huaweiProjectId: ""
    huaweiRegion: ""
