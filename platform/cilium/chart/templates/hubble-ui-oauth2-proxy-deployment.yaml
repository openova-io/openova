{{- /*
G117.5 #2744 — Hubble UI OIDC enforcement via oauth2-proxy.

This Deployment + the companion Service close the Tier-2 SSO gap the
Aux-2 audit (docs/sessions/2026-06-02-G117-sso-fanout-audit/tier-2/
bp-cilium.md) scoped: the `hubble-ui` OIDC client was pre-declared in
bp-keycloak's sovereign realm-import, but NO enforcement layer ever sat
in front of the Hubble UI Service, so every Sovereign with the overlay
enabled exposed Hubble UI UNAUTHENTICATED.

oauth2-proxy runs the OIDC code-flow against the sovereign realm's
`hubble-ui` client, sets an encrypted session cookie, and reverse-proxies
authenticated traffic to the upstream hubble-ui Service. The HTTPRoute
(hubble-ui-httproute.yaml) routes the public hostname to THIS proxy
Service when auth=oidc, instead of straight to hubble-ui.

Silent SSO: the sovereign realm's Identity Provider Redirector already
has defaultProvider=catalyst-pin bound (G113 #2725), so KC auto-303s past
the login form. As defense-in-depth (matching wordpress-tenant W3.D3) the
oauth2-proxy `--login-url` also carries `kc_idp_hint=catalyst-pin`
explicitly, so the redirect to the catalyst-pin IdP is silent even if the
realm IDR default were ever cleared.

Gated by auth=oidc AND enabled AND a resolvable hostname.
*/ -}}
{{- $ov := .Values.catalystOverlay.hubbleUI -}}
{{- $hostname := $ov.hostname -}}
{{- if and (not $hostname) $ov.sovereignFQDN -}}
{{- $hostname = printf "hubble.%s" $ov.sovereignFQDN -}}
{{- end -}}
{{- $proxy := $ov.oauth2Proxy -}}
{{- if and $ov.enabled $hostname (eq $ov.auth "oidc") -}}
{{- $sovFQDN := $ov.sovereignFQDN -}}
{{- if and (not $sovFQDN) $ov.hostname -}}
{{- $sovFQDN = trimPrefix "hubble." $ov.hostname -}}
{{- end -}}
{{- if not $sovFQDN -}}
{{- fail "catalystOverlay.hubbleUI.auth=oidc requires sovereignFQDN (or a hubble.<fqdn> hostname) so oauth2-proxy can build the OIDC issuer URL" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-ui-oauth2-proxy
  namespace: {{ $ov.serviceRef.namespace | quote }}
  labels:
    app.kubernetes.io/name: bp-cilium
    app.kubernetes.io/component: hubble-ui-oauth2-proxy
    catalyst.openova.io/blueprint: bp-cilium
    catalyst.openova.io/blueprint-version: {{ .Chart.Version | quote }}
spec:
  replicas: {{ $proxy.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bp-cilium
      app.kubernetes.io/component: hubble-ui-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bp-cilium
        app.kubernetes.io/component: hubble-ui-oauth2-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: {{ printf "%s:%s" $proxy.image.repository $proxy.image.tag | quote }}
          imagePullPolicy: {{ $proxy.image.pullPolicy | default "IfNotPresent" | quote }}
          args:
            - --http-address=0.0.0.0:4180
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.{{ $sovFQDN }}/realms/sovereign
            {{- /* #5059: when keycloakInternalURL is set, run OIDC DISCOVERY +
               the jwks/redeem backchannel legs against the in-cluster keycloak
               Service instead of the PUBLIC issuer. oauth2-proxy's default
               boot-time discovery dials --oidc-issuer-url (auth.<fqdn>), which
               hairpins pod->gateway EIP->keycloak; under the step-08 deny-egress
               hold that round-trip exceeds the 30s discovery timeout on a
               freshly-rolled pod -> CrashLoop (hw250 live, #5059). --oidc-issuer-url
               stays PUBLIC (iss-claim validation must match the token's iss) and
               --login-url stays PUBLIC (browser redirect); only the machine
               backchannel goes internal. Same #3844 seam bp-gitea/oidc-gate use;
               verified live: http://keycloak.keycloak.svc.cluster.local/realms/
               sovereign/.well-known/openid-configuration -> 200 in-cluster.
               Empty (default) -> current public-discovery behavior, unchanged. */}}
            {{- $kcInternal := ($proxy.keycloakInternalURL) | default "" }}
            {{- if $kcInternal }}
            {{- $realm := printf "%s/realms/sovereign" (trimSuffix "/" $kcInternal) }}
            - --skip-oidc-discovery=true
            - --oidc-jwks-url={{ $realm }}/protocol/openid-connect/certs
            - --redeem-url={{ $realm }}/protocol/openid-connect/token
            {{- end }}
            - --client-id=hubble-ui
            - --redirect-url=https://{{ $hostname }}/oauth2/callback
            # Reverse-proxy authenticated requests to the upstream Hubble UI.
            - --upstream=http://{{ $ov.serviceRef.name }}.{{ $ov.serviceRef.namespace }}.svc.cluster.local:{{ $ov.serviceRef.port }}
            - --email-domain=*
            - --scope=openid profile email groups
            # Silent SSO: the sovereign realm's Identity Provider Redirector
            # already has defaultProvider=catalyst-pin bound (G113 #2725), so
            # the KC login form is bypassed. Appending the hint explicitly is
            # defense-in-depth (matches wordpress-tenant W3.D3).
            - --login-url=https://auth.{{ $sovFQDN }}/realms/sovereign/protocol/openid-connect/auth?kc_idp_hint=catalyst-pin
            - --cookie-secure=true
            - --cookie-name=_hubble_oauth2
            - --skip-provider-button=true
            - --set-xauthrequest=true
            - --reverse-proxy=true
            - --whitelist-domain={{ $hostname }}
            # #4507 — The Hubble UI flow stream is a gRPC-Web/Connect
            # server-streaming XHR to /api/v1/... A gRPC-Web client cannot
            # follow a 302 to the Keycloak login HTML page, so when the
            # oauth2-proxy session is missing/expired the default 302-to-login
            # silently wedges the flow stream — flows never render (UAT row
            # 39). --api-route makes oauth2-proxy return HTTP 401 (not 302)
            # for these paths, so the SPA observes the auth failure cleanly
            # and a top-level reload re-runs silent SSO. This still AUTHs the
            # path (unlike --skip-auth-route) — no unauthenticated exposure.
            {{- range $route := ($proxy.apiRoutes | default (list "^/api/")) }}
            - --api-route={{ $route }}
            {{- end }}
          env:
            # #3374: with ssoBridgeSync the client-secret comes from the
            # bp-sso-bridge-published ExternalSecret (the LIVE Keycloak
            # value) instead of the chart-generated one that Keycloak
            # never learned (the hw130 unauthorized_client 500).
            #
            # #5416: the cookie-secret now follows it. Chart-managed meant
            # `lookup`-or-generate, which mints a DIFFERENT value in each
            # region of a 2-region Sovereign (separate apiservers, separate
            # Flux/Helm) — and hubble.<fqdn> is fanned at both regions' envoys
            # by one shared wildcard VIP, so each proxy rejected the peer
            # region's session cookie. bp-sso-bridge 0.2.26 derives one value
            # per KC client into the OpenBao bundle and its multi-key
            # declaration delivers it alongside client-secret. With
            # ssoBridgeSync off, both keys stay on the chart-managed Secret
            # (single-region behaviour, unchanged).
            #
            # UPGRADE WINDOW: bp-sso-bridge must reach 0.2.26 for the
            # `cookie-secret` key to appear on hubble-ui-oauth2-proxy-oidc.
            # Both pins bump in the same commit; until the bridge's next tick
            # applies the 2-key ExternalSecret this Pod waits in
            # CreateContainerConfigError, then starts on its own. An older
            # bridge still applies the 1-key form (the declaration keeps the
            # legacy secretKey/property fields), so nothing else regresses.
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if $proxy.ssoBridgeSync.enabled }}
                  name: hubble-ui-oauth2-proxy-oidc
                  {{- else }}
                  name: {{ $proxy.existingSecret | quote }}
                  {{- end }}
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if $proxy.ssoBridgeSync.enabled }}
                  name: hubble-ui-oauth2-proxy-oidc
                  {{- else }}
                  name: {{ $proxy.existingSecret | quote }}
                  {{- end }}
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml $proxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end -}}
