{{- /*
#3374 (2026-06-13) — hubble-ui AppRegistration ConfigMap.

ROOT CAUSE this closes (measured live on hw130): the oauth2-proxy's
chart-generated client-secret (hubble-ui-oauth2-proxy-secret.yaml
lookup-or-generate) and the bp-keycloak realm-import's deterministic
`bp-keycloak.tier2ClientSecret` NEVER converge — Keycloak rejects the
code exchange with `unauthorized_client` and the /oauth2/callback 500s
(oauthproxy.go:881 "Error redeeming code ... Invalid client or Invalid
client credentials"). hubble-ui was the ONLY SSO client with no
bp-sso-bridge-published bundle (no hubble-ui secret under flux-system,
unlike gitea/grafana/harbor/openbao/powerdns-admin).

This ConfigMap is the documented bridge (see the PATTERN note in
hubble-ui-oauth2-proxy-secret.yaml): bp-sso-bridge's AppRegistration
watcher (0.2.3 #2801, configmap-reconciler.yaml
reconcile_app_registrations) upserts the client into the realm named by
data.realm, reads the LIVE KC-stored client_secret, and publishes the
bundle to OpenBao at `sso/<realm>/<client-id>` =
`sso/sovereign/hubble-ui`, where the companion
hubble-ui-oauth2-proxy-externalsecret.yaml resolves it. The watcher's
existing-client path PUTs a merged representation (template wins) and
PRESERVES the KC-side secret — so the realm-imported client is adopted,
not clobbered.

data.realm = "sovereign": the watcher only requires the realm to EXIST
(GET /admin/realms/<realm> == 200); the sovereign realm always does.

#3374 admin-tier (2026-06-14): client.json now seeds an oidc-audience-mapper.
After the secret-convergence fix (1.4.2) the 503 cleared but the OIDC callback
500'd on hw133 — oauth2-proxy's keycloak-oidc provider VERIFIES the ID token's
`aud` contains its own --client-id, and a vanilla confidential client only puts
a client into `aud` when the user holds a client role for it. emrah.baysal holds
none on hubble-ui, so `aud` was [realm-management account] and never hubble-ui
(oauthproxy.go:888 "audience ... does not match ... map[hubble-ui:{}]"). The
oidc-audience-mapper injects hubble-ui into the ID-token aud (id.token.claim=true
because oauth2-proxy checks the ID token) — the netbird realm-config idiom,
identical to the bp-oidc-gate openova-flow fix (#3447). bp-sso-bridge PUTs
client.json template-wins, so the mapper lands on the live hubble-ui client
zero-touch (the hubble-ui realm-import client carries no protocolMappers, so the
template array doesn't clobber anything).
*/ -}}
{{- $ov := .Values.catalystOverlay.hubbleUI -}}
{{- $hostname := $ov.hostname -}}
{{- if and (not $hostname) $ov.sovereignFQDN -}}
{{- $hostname = printf "hubble.%s" $ov.sovereignFQDN -}}
{{- end -}}
{{- $proxy := $ov.oauth2Proxy -}}
{{- if and $ov.enabled $hostname (eq $ov.auth "oidc") $proxy.ssoBridgeSync.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-ui-sso-registration
  namespace: {{ $ov.serviceRef.namespace | quote }}
  labels:
    app.kubernetes.io/name: bp-cilium
    app.kubernetes.io/component: hubble-ui-oauth2-proxy
    catalyst.openova.io/blueprint: bp-cilium
    sso.openova.io/app-registration: hubble-ui
data:
  realm: sovereign
  client.json: |
    {
      "clientId": "hubble-ui",
      "name": "Cilium Hubble UI (Tier-2 silent-SSO)",
      "enabled": true,
      "publicClient": false,
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "redirectUris": [
        "https://{{ $hostname }}/oauth2/callback"
      ],
      "webOrigins": [
        "https://{{ $hostname }}"
      ],
      "defaultClientScopes": ["web-origins", "acr", "profile", "roles", "email", "groups"],
      "protocolMappers": [
        {
          "name": "audience-hubble-ui",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-audience-mapper",
          "config": {
            "included.client.audience": "hubble-ui",
            "id.token.claim": "true",
            "access.token.claim": "true"
          }
        }
      ],
      "attributes": {
        "access.token.lifespan": "900"
      }
    }
  # #3374 (2026-06-14) — declare the ExternalSecret bp-sso-bridge must apply
  # for us. bp-cilium is bootstrap-kit slot 01 (the CNI), so it installs
  # before bp-external-secrets (slot 15); a chart-rendered ExternalSecret is
  # omitted at install time by the `.Capabilities` CRD-race guard and never
  # re-added (helm-controller drift-check uses the install-time capability
  # snapshot — see Chart.yaml 1.4.2). bp-sso-bridge's AppRegistration watcher
  # runs post-ESO with the CRD present and applies THIS declaration verbatim
  # every tick, materialising `hubble-ui-oauth2-proxy-oidc` in kube-system from
  # OpenBao sso/sovereign/hubble-ui — the secret the oauth2-proxy Deployment
  # consumes when ssoBridgeSync is enabled. Fresh-prov-safe + zero-touch.
  #
  # #5416 (2026-07-27) — `cookie-secret` joins `client-secret` in the SAME
  # declared Secret, via bp-sso-bridge 0.2.26's multi-key `data` form.
  #
  # WHY: the cookie secret was chart-managed
  # (hubble-ui-oauth2-proxy-secret.yaml, `lookup`-or-`randAlphaNum 32`). On a
  # 2-region Sovereign each region runs its own Flux/Helm against its own
  # apiserver, so the lookup misses in the second region and a DIFFERENT value
  # is minted there. hubble.<fqdn> is fanned at BOTH regions' envoys by one
  # shared wildcard VIP, so requests round-robin and each proxy rejects the
  # peer region's AES-encrypted session cookie ("cookie signature not valid" /
  # "CSRF token mismatch") — the exact defect measured on the bp-oidc-gate
  # instances on hw290 (#5416), same class, same chart idiom.
  #
  # The client secret never had that problem because it does not come from a
  # per-region generator: Keycloak owns it and bp-sso-bridge publishes it to
  # this bundle. Adding `cookie_secret` to the bundle (derived deterministically
  # from the KC client secret, the idiom the bundle's `session_secret` already
  # used) puts the cookie secret on the same proven carrier.
  externalSecret.json: |
    {
      "name": "hubble-ui-oauth2-proxy-oidc",
      "namespace": {{ $ov.serviceRef.namespace | quote }},
      "secretKey": "client-secret",
      "property": "client_secret",
      "data": [
        { "secretKey": "client-secret", "property": "client_secret" },
        { "secretKey": "cookie-secret", "property": "cookie_secret" }
      ]
    }
{{- end }}
