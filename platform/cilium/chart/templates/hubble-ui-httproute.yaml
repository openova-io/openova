{{/*
Hubble UI HTTPRoute — exposes the Cilium-managed Hubble UI Service via
the Sovereign's Cilium Gateway with the wildcard cert from
clusters/_template/sovereign-tls/.

Default-OFF at chart level: the gate `.Values.catalystOverlay.hubbleUI.enabled`
is false in chart/values.yaml so a bare `helm install bp-cilium .` never
ships an HTTPRoute. The bootstrap-kit overlay
clusters/_template/bootstrap-kit/01-cilium.yaml flips the gate to true
on every Sovereign and forwards SOVEREIGN_FQDN so the chart auto-derives
hubble.<SOVEREIGN_FQDN>. Per Sovereign opt-in checklist:
  1. cilium.hubble.relay.enabled = true   (in same overlay)
  2. cilium.hubble.ui.enabled    = true   (in same overlay)
  3. Keycloak realm has a `hubble-ui` OIDC client (slice D1)
  4. catalystOverlay.hubbleUI.hostname OR sovereignFQDN is set.

Hostname resolution order (first non-empty wins):
  1. .Values.catalystOverlay.hubbleUI.hostname        (explicit FQDN)
  2. printf "hubble.%s" .Values.catalystOverlay.hubbleUI.sovereignFQDN
                                                       (Flux envsubst path)
If neither is set, the route is not rendered — operator missed the
SOVEREIGN_FQDN substitute and the chart MUST not render an HTTPRoute
with an empty hostname (Cilium Gateway would NACK the Route).

Per docs/EPICS-1-6-unified-design.md §3.9 row 7 + §8 (EPIC-5).

G117.5 W3.D1 #2744 (2026-06-02) — DECORATIVE-GATE REMOVED per Aux-2 audit
docs/sessions/2026-06-02-G117-sso-fanout-audit/tier-2/bp-cilium.md.

PRE-FIX STATE (security-theater anti-pattern)
---------------------------------------------
The chart emitted a `catalyst.openova.io/hubble-ui-auth: oidc` annotation
on this HTTPRoute, read from `.Values.catalystOverlay.hubbleUI.auth`
which defaulted to `oidc`. NO actual OIDC enforcement filter was ever
attached — no CiliumEnvoyConfig, no HTTPRoute filter, no oauth2-proxy
sidecar. Operators reading the rendered HTTPRoute were misled into
believing the route was OIDC-protected when in reality every Sovereign
exposing Hubble UI via this overlay did so UNAUTHENTICATED. The
`oidc`-as-default made the manifest look strictly more secure than
`none` while emitting an identical traffic-routing spec — pure
security theater.

POST-FIX STATE (this PR)
------------------------
The misleading annotation is dropped from this template. The default
of `.Values.catalystOverlay.hubbleUI.auth` flips `oidc` → `none` in
values.yaml, with an updated comment that explicitly says no
enforcement layer ships today and points operators at the Aux-2 audit
doc for the planned oauth2-proxy sidecar work.

A future Wave wires oauth2-proxy in front of the Hubble UI Service per
Aux-2 audit step 1. The bp-keycloak 1.4.13 sovereign realm-import
already codifies the `hubble-ui` OIDC client (no-op until the sidecar
lands) so when the sidecar ships there is zero realm-side ordering
risk.

OPERATOR-FACING CONSEQUENCE
---------------------------
If a Sovereign overlay sets `catalystOverlay.hubbleUI.enabled: true`
AND keeps the upstream Cilium values `cilium.hubble.ui.enabled: true`
the Hubble UI is publicly exposed UNAUTHENTICATED. The chart now makes
this explicit via the `auth: none` default + this comment, instead of
implying OIDC enforcement that does not exist.
*/}}
{{- $ov := .Values.catalystOverlay.hubbleUI -}}
{{- $hostname := $ov.hostname -}}
{{- if and (not $hostname) $ov.sovereignFQDN -}}
{{- $hostname = printf "hubble.%s" $ov.sovereignFQDN -}}
{{- end -}}
{{- if and $ov.enabled $hostname -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: {{ $ov.serviceRef.namespace | quote }}
  labels:
    app.kubernetes.io/name: bp-cilium
    app.kubernetes.io/component: hubble-ui-overlay
    catalyst.openova.io/blueprint: bp-cilium
    catalyst.openova.io/blueprint-version: {{ .Chart.Version | quote }}
spec:
  parentRefs:
    - name: {{ $ov.gatewayRef.name | quote }}
      namespace: {{ $ov.gatewayRef.namespace | quote }}
  hostnames:
    - {{ $hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $ov.serviceRef.name | quote }}
          port: {{ $ov.serviceRef.port }}
{{- end -}}
