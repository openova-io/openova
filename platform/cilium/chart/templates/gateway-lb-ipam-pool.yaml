{{/*
#4682 (2026-07-01) — Cilium LoadBalancer IPAM pool for the Sovereign Gateway Service.

ROOT CAUSE this template fixes:
  With gatewayAPI.hostNetwork.enabled=false (the #4682 flip), Cilium's
  gateway-controller provisions the per-Sovereign Gateway as a
  `Service type=LoadBalancer` (`cilium-gateway-<name>` in kube-system).
  On the HCS (Huawei Cloud) provider there is NO cloud CCM, so a
  type=LoadBalancer Service stays Pending forever — no controller exists
  to allocate an ExternalIP. That would leave console/registry/all
  *.<fqdn> URLs with no public :443 front (the old workaround bound
  cilium-envoy on the host at :30443/:30080 via a privileged sysctl
  DaemonSet + ELB NodePort translation — now deleted per ARCHITECTURE
  §854, host-bind ≈ NodePort). Hetzner Sovereigns are unaffected —
  hcloud-ccm materialises a real LB for the gateway Service.

CANONICAL FIX (same pattern as clustermesh-lb-ipam-pool.yaml):
  Cilium itself acts as a LoadBalancer controller via the
  CiliumLoadBalancerIPPool CR (GA in Cilium 1.16+; 1.19.3 here). When
  enabled, Cilium watches Services type=LoadBalancer matching the
  serviceSelector and assigns an ExternalIP from this pool, with no
  cloud CCM dependency. For the Gateway on HCS the pool = this region's
  CP node public IPv4/32 (already provisioned by tofu, already the DNS
  A-record target that the Huawei ELB L4-passthrough-forwards :443→:443).

OPERATOR GATE:
  Enabled per-provider via the HelmRelease overlay substitute
  CILIUM_GATEWAY_LB_IPAM_ENABLED (true on HCS, unset on Hetzner). Per
  docs/PRINCIPLES.md #4 the chart never auto-enables.

VERIFICATION (post-fresh-prov on HCS):
  kubectl -n kube-system get svc -l io.cilium.gateway/owning-gateway=cilium-gateway \
    -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}'
  # → should equal the CP node's public IPv4, NOT empty (NOT Pending)
*/}}
{{- /* nil-safe: default values may omit cilium.gateway entirely
     (helm-lint evaluates with defaults; live values set it via the slot). */}}
{{- $lbIpam := dig "gateway" "lbIpam" (dict) (.Values.cilium | default dict) }}
{{- if $lbIpam }}
{{- if $lbIpam.enabled }}
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: sovereign-gateway
  labels:
    app.kubernetes.io/name: bp-cilium
    app.kubernetes.io/component: gateway-lb-ipam
    catalyst.openova.io/blueprint: bp-cilium
    catalyst.openova.io/blueprint-version: {{ .Chart.Version | quote }}
spec:
  # Per-region CIDR list, set by the per-provider cloudinit substitute
  # CILIUM_GATEWAY_LB_IPAM_CIDRS. For HCS: this region's CP-node public
  # IPv4/32. For Hetzner: leave lbIpam.enabled=false; hcloud-ccm handles LB.
  blocks:
    {{- range $lbIpam.cidrs }}
    - cidr: {{ . | quote }}
    {{- end }}
  serviceSelector:
    matchLabels:
      # Match the Service that Cilium's gateway-controller auto-creates
      # for the `cilium-gateway` Gateway (kube-system). Cilium labels the
      # generated Service io.cilium.gateway/owning-gateway=<gateway-name>.
      io.cilium.gateway/owning-gateway: cilium-gateway
{{- end }}
{{- end }}
