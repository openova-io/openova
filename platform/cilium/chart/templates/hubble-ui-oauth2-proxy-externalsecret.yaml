{{- /*
#3374 (2026-06-13) — materialise the bp-sso-bridge-published hubble-ui
client secret for the oauth2-proxy.

bp-sso-bridge's AppRegistration watcher (fed by the companion
hubble-ui-sso-registration-configmap.yaml) publishes the LIVE
Keycloak-stored client_secret to OpenBao at `sso/sovereign/hubble-ui`.
This ExternalSecret resolves it into `hubble-ui-oauth2-proxy-oidc`
(key `client-secret`), which the oauth2-proxy Deployment consumes for
OAUTH2_PROXY_CLIENT_SECRET when ssoBridgeSync is enabled — ending the
two-independent-secrets split that 500'd the /oauth2/callback on hw130
(`unauthorized_client`).

The cookie-secret intentionally STAYS in the chart-managed Secret
(hubble-ui-oauth2-proxy-secret.yaml): it is oauth2-proxy-local state
with no Keycloak counterpart, and the lookup-or-generate + keep policy
already gives it the right lifecycle.
*/ -}}
{{- $ov := .Values.catalystOverlay.hubbleUI -}}
{{- $hostname := $ov.hostname -}}
{{- if and (not $hostname) $ov.sovereignFQDN -}}
{{- $hostname = printf "hubble.%s" $ov.sovereignFQDN -}}
{{- end -}}
{{- $proxy := $ov.oauth2Proxy -}}
{{- if and $ov.enabled $hostname (eq $ov.auth "oidc") $proxy.ssoBridgeSync.enabled (.Capabilities.APIVersions.Has "external-secrets.io/v1beta1") }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hubble-ui-oauth2-proxy-oidc
  namespace: {{ $ov.serviceRef.namespace | quote }}
  labels:
    app.kubernetes.io/name: bp-cilium
    app.kubernetes.io/component: hubble-ui-oauth2-proxy
    catalyst.openova.io/blueprint: bp-cilium
    bp-sso-bridge.openova.io/consumer: bp-cilium
spec:
  refreshInterval: {{ $proxy.ssoBridgeSync.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $proxy.ssoBridgeSync.externalSecretStoreName | default "vault-region1" }}
    kind: ClusterSecretStore
  target:
    name: hubble-ui-oauth2-proxy-oidc
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        client-secret: "{{ "{{ .client_secret }}" }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: sso/sovereign/hubble-ui
        property: client_secret
{{- end }}
