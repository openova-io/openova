apiVersion: v2
name: bp-cilium
# 1.3.7 (G117.5 W3.D1 #2744, 2026-06-02): DECORATIVE-GATE REMOVED on
# the Hubble UI HTTPRoute overlay. The pre-fix chart emitted a
# `catalyst.openova.io/hubble-ui-auth: oidc` annotation read from
# `.Values.catalystOverlay.hubbleUI.auth` (default `oidc`), BUT no OIDC
# enforcement filter was ever attached — pure security theater. Per
# Aux-2 audit
# docs/sessions/2026-06-02-G117-sso-fanout-audit/tier-2/bp-cilium.md
# the misleading annotation is dropped from
# templates/hubble-ui-httproute.yaml and the `auth` default flips
# `oidc` → `none` in values.yaml. The bp-keycloak 1.4.13 sovereign
# realm-import pre-declares the `hubble-ui` OIDC client (no-op until
# the oauth2-proxy sidecar Wave lands; pre-declaration avoids a future
# bp-sso-bridge race). Refs #2744.
# 1.3.6 (G99 Refs #2648, 2026-06-01): NEW template clustermesh-lb-ipam-
# pool.yaml renders a CiliumLoadBalancerIPPool CR when
# clustermesh.apiserver.service.lbIpam.enabled=true. Lets Cilium itself
# allocate ExternalIP for the clustermesh-apiserver Service on providers
# with no cloud CCM (HCS today; bare-metal Sovereigns in future). Pool
# = per-region CP-node public IPv4/32 (operator-supplied via per-Sovereign
# overlay or per-provider cloudinit). Restores DoD §A3 compliance on HCS:
# ClusterMesh apiserver Service = LoadBalancer (NEVER NodePort). Replaces
# the G3 (#2534) NodePort 31333 workaround. Verification gate: cilium
# clustermesh status shows N-1/N-1 remote clusters Ready on every peer
# post-fresh-prov. Lockstep: HCS provider cloudinit must set
# CILIUM_LB_IPAM_ENABLED=true + CILIUM_LB_IPAM_CIDRS=<cp-pub-ip>/32 AND
# rip out CLUSTERMESH_SERVICE_TYPE=NodePort + CLUSTERMESH_NODE_PORT=31333
# in same merge wave. bootstrap-kit 01-cilium.yaml adds the substitute.
# 1.3.4 — prov #55 worker-cilium crashloop fix: flip kubeProxyReplacement
# false → true. Caught on 3-region prov 8d85a64cb8807cdc 2026-05-12: every
# worker node that joined AFTER the Flux helm-upgrade saw the rendered
# cilium-config with enable-bpf-masquerade=true + enable-node-port=false
# (because kubeProxyReplacement was false → Cilium left NodePort off →
# BPF masq datapath rejected at agent start: "BPF masquerade requires
# NodePort"). Worker cilium-agent CrashLoopBackOff → node.cilium.io/
# agent-not-ready taint never lifts → every keycloak/gitea/openbao/
# powerdns/mimir post-install Job pod stayed Pending → whole bootstrap-
# kit chain stalled at ~60% Ready. The Sovereign cloud-init pre-Flux
# Cilium already used kubeProxyReplacement: true (infra/hetzner/
# cloudinit-control-plane.tftpl:654, /var/lib/catalyst/cilium-values.yaml).
# This aligns the Flux HR overlay with the working pre-Flux bootstrap.
# 1.3.3 — qa-loop iter-16 Fix #70: Hubble UI HTTPRoute defaults corrected
# so every Sovereign exposes Hubble UI through the Cilium Gateway out of
# the box (TC-289 was NXDOMAIN on hubble.<sovereignFQDN>).
# Two real bugs in 1.3.2's HubbleUI overlay defaults:
#   - catalystOverlay.hubbleUI.gatewayRef.namespace was "cilium-gateway"
#     but the Sovereign Gateway lives in "kube-system" (see
#     clusters/_template/sovereign-tls/cilium-gateway.yaml + every other
#     bootstrap-kit HTTPRoute in clusters/_template/bootstrap-kit/).
#   - catalystOverlay.hubbleUI.serviceRef.namespace was "cilium" but the
#     bp-cilium HelmRelease installs Cilium into "kube-system"
#     (clusters/_template/bootstrap-kit/01-cilium.yaml `targetNamespace:
#     kube-system`), so hubble-ui Service is in kube-system.
# Plus: chart now derives hostname `hubble.<sovereignFQDN>` automatically
# when catalystOverlay.hubbleUI.sovereignFQDN is set (matches the
# canonical pattern used by gitea.<fqdn>, auth.<fqdn>, grafana.<fqdn>).
# 1.3.1 — qa-loop iter-12 Fix #54 Workstream 2: bpf.preallocateMaps=true
# + socketLB.hostNamespaceOnly=true defaults so fresh worker pods can
# resolve DNS reliably on first-join (cilium/cilium#28456 mitigation).
# Backward-compat: per-Sovereign overlays MAY override either knob.
version: 1.3.7
description: |
  Catalyst-curated Blueprint umbrella chart for Cilium. Depends on the
  upstream `cilium` chart as a Helm subchart so `helm dependency build`
  pulls the upstream payload into this artifact; the Catalyst overlay
  templates in templates/ (NetworkPolicy, ExternalSecret, ServiceMonitor)
  sit alongside the upstream subchart and Helm renders both at install
  time. Catalyst-curated values flow into the upstream subchart under the
  `cilium:` key in values.yaml.
type: application
keywords: [catalyst, blueprint, cilium]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a Helm subchart so `helm dependency build`
# bundles it into the OCI artifact. Pinned to cilium/cilium 1.19.3 (matches
# platform/cilium/blueprint.yaml + values.yaml `catalystBlueprint.upstream
# .version`). Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the
# version is operator-bumpable via PR + Blueprint release.
#
# 1.16.5 → 1.19.3 jump (2026-05-03): 1.16.x had buggy gateway-api hostNetwork
# mode where cilium-envoy NACK'd listeners with "cannot bind '0.0.0.0:80':
# Permission denied" and the loaded RDS for the Sovereign vhost only
# carried the default `/` route — `/auth/*` and `/api/*` HTTPRoute matches
# never reached envoy's live config. 1.18+ ships the mature Gateway API
# implementation (graduated from beta), 1.19 is the current stable line.
# Values shape verified compatible: gatewayAPI.hostNetwork.enabled,
# envoy.enabled, envoyConfig.enabled, encryption.type=wireguard,
# nodeEncryption — all unchanged.
dependencies:
  - name: cilium
    # Pinned to match Chart.lock (truth-on-disk). The previous "1.19.3"
    # value was provenance drift caught in EPIC-0 #1095 audit — Chart.lock
    # had been resolving to 1.16.5 the whole time. Aligning the declared
    # constraint with the locked version eliminates the lie. Bumping to a
    # newer Cilium minor is a separate slice that needs real upgrade
    # testing on a live data-plane cluster.
    version: "1.16.5"
    repository: "https://helm.cilium.io"
