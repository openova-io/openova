# 1.4.4 (#4467, 2026-06-26): pin cilium.MTU=1370 for the WireGuard+VXLAN
# datapath. Root-caused live on a Huawei me-east-215 (kom4dc) fresh prov:
# the chart runs routingMode=tunnel/tunnelProtocol=vxlan (upstream defaults
# — neither key is set here) WITH encryption.type=wireguard +
# nodeEncryption=true. Cilium's auto-MTU read eth0=1500 and correctly
# programmed cilium_wg0=1420 (eth0−80 WG) but did NOT compound the VXLAN
# (+50) overhead onto the pod-facing devices — cilium_vxlan / cilium_host /
# pod lxc* veths were left at 1500. A full-size 1500-byte pod frame then
# becomes a 1550-byte VXLAN packet that overflows the 1420 WireGuard MTU
# and is silently DF-dropped. Small packets (health probes, request lines)
# pass; large ones (TCP data, HTTP bodies, TLS handshakes) drop → EVERY
# cross-node pod-to-pod TCP to a non-trivial payload times out (curl 28).
# Phase-1 convergence deadlocks (catalyst-gitea-token-mint can't reach
# gitea-http.gitea.svc:3000 on another node → bp-catalyst-platform never
# finishes). Correct pod MTU = 1500 − 50 (VXLAN) − 80 (WireGuard) = 1370;
# 1370 + 50 VXLAN = 1420 = the cilium_wg0 MTU exactly. WireGuard is
# always-on for every Catalyst Sovereign so a static 1370 default never
# regresses a non-WG path. Lockstep: blueprint.yaml 1.4.4 + 01-cilium.yaml
# slot pin 1.4.4. New tests/mtu-wireguard-vxlan.sh render gate.
# 1.4.2 (#3374, 2026-06-14): hubble-ui oauth2-proxy client-secret is now
# delivered by bp-sso-bridge (which APPLIES the ExternalSecret from its own
# post-ESO reconciler), NOT by a chart-rendered ExternalSecret here. ROOT
# CAUSE measured on hw133: bp-cilium is bootstrap-kit slot 01 (the CNI —
# installs FIRST, long before bp-external-secrets at slot 15), so at install
# time `.Capabilities.APIVersions.Has "external-secrets.io/v1beta1"` is FALSE
# and the in-chart ExternalSecret was omitted (the #2988 CRD-race guard,
# correctly). Unlike grafana(25)/harbor(19)/gitea(effective-after-16a) —
# every other SSO consumer installs AFTER ESO so their guard is TRUE at
# install — the slot-01 CNI chart then NEVER upgrades (helm-controller
# drift-check re-renders with the release's INSTALL-TIME capability snapshot,
# not live cluster capabilities, so it forever reports "release in-sync" and
# the ExternalSecret was never added). Net effect: `hubble-ui-oauth2-proxy-
# oidc` Secret never created → oauth2-proxy stuck CreateContainerConfigError
# → hubble UI 503. An in-chart post-install hook cannot fix it either: a CNI
# hook that waits for ESO deadlocks (ESO's slot dependsOn the CNI being
# Ready). The correct home is bp-sso-bridge — it already publishes the live
# KC secret to OpenBao `sso/sovereign/hubble-ui` AND already applies
# ExternalSecrets for Tier-1/2 apps from a reconciler that runs post-ESO with
# the CRD present. This chart's hubble-ui-sso-registration ConfigMap now
# carries a `data.externalSecret.json` block declaring the exact target
# (name hubble-ui-oauth2-proxy-oidc, ns kube-system, key client-secret); the
# sso-bridge AppRegistration watcher applies it verbatim every tick. The old
# templates/hubble-ui-oauth2-proxy-externalsecret.yaml is REMOVED to avoid
# dual ownership. Fresh-prov-safe + zero-touch (no manual version bump
# needed). Lockstep: bp-sso-bridge 0.2.14 + 13b slot pin; 01-cilium.yaml pin
# → 1.4.2.
