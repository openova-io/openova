# 1.4.3 (#3374 admin-tier, 2026-06-14): seed an oidc-audience-mapper on the
# hubble-ui AppRegistration client so the bare URL lands signed-in. After
# 1.4.2 the secret-convergence fix landed (oauth2-proxy 1/1, no more 503) but
# the OIDC callback then returned HTTP 500 on hw133 (oauthproxy.go:888):
#   audience from claim aud with value [realm-management account] does not
#   match with any of allowed audiences map[hubble-ui:{}]
# oauth2-proxy's keycloak-oidc provider VERIFIES the ID token's `aud` carries
# its own --client-id; a vanilla confidential client only lists a client in
# `aud` when the user holds a client role for it, and emrah.baysal holds none
# on hubble-ui, so `aud` was [realm-management account] and never hubble-ui.
# The client.json now seeds an oidc-audience-mapper (included.client.audience
# =hubble-ui, id.token.claim=true because oauth2-proxy checks the ID token) —
# the netbird realm-config idiom, identical to the bp-oidc-gate openova-flow
# fix (#3447). bp-sso-bridge PUTs client.json template-wins every tick, so the
# mapper lands on the live hubble-ui client zero-touch.
# 1.4.10 (#4765 follow-up): docs-only bump in lockstep with slot 01
#   clustermesh.apiserver.tls.authMode=legacy (values live in the slot; the
#   1.19.3 migration default mounts a users CM external establish never makes).
# 1.4.11 (#4656, 2026-07-05): NATIVE routing (drop VXLAN). VXLAN-tunnel over
#   WireGuard node-encryption stacks two headers on every cross-node pod
#   packet (pod-MTU + 50B VXLAN > wg0), DF-dropping full-size cross-node pod
#   TCP — UNFIXABLE by any MTU pin (cilium derives wg0 = MTU−80, so
#   pod(MTU)+50 always exceeds wg0; #4467's MTU=1370 disproven live on hw224).
#   Fix: routingMode: native + ipv4NativeRoutingCIDR + autoDirectNodeRoutes so
#   WireGuard encapsulates ONCE and no VXLAN header stacks. MTU 1370 → 1420
#   (WG-only = eth0−80). ipv4NativeRoutingCIDR 10.42.0.0/15 spans both
#   per-region k3s pod CIDRs (region-a 10.42.0.0/16 + region-b 10.43.0.0/16).
#   Layers ON TOP of the 1.4.9/1.4.10 zero-nodeport + authMode=legacy work.
#   Needs a fresh 2-region prov to verify the cross-region ClusterMesh pod
#   path end-to-end (datapath change, not CI-provable). Refs #4656.
version: 1.4.15
description: |
  Catalyst-curated Blueprint umbrella chart for Cilium. Depends on the
  upstream `cilium` chart as a Helm subchart so `helm dependency build`
  pulls the upstream payload into this artifact; the Catalyst overlay
  templates in templates/ (NetworkPolicy, ExternalSecret, ServiceMonitor)
  sit alongside the upstream subchart and Helm renders both at install
  time. Catalyst-curated values flow into the upstream subchart under the
  `cilium:` key in values.yaml.
type: application
keywords: [catalyst, blueprint, cilium]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a Helm subchart so `helm dependency build`
# bundles it into the OCI artifact. Pinned to cilium/cilium 1.19.3 (matches
# platform/cilium/blueprint.yaml + values.yaml `catalystBlueprint.upstream
# .version`). Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the
# version is operator-bumpable via PR + Blueprint release.
#
# 1.16.5 → 1.19.3 jump (2026-05-03): 1.16.x had buggy gateway-api hostNetwork
# mode where cilium-envoy NACK'd listeners with "cannot bind '0.0.0.0:80':
# Permission denied" and the loaded RDS for the Sovereign vhost only
# carried the default `/` route — `/auth/*` and `/api/*` HTTPRoute matches
# never reached envoy's live config. 1.18+ ships the mature Gateway API
# implementation (graduated from beta), 1.19 is the current stable line.
# Values shape verified compatible: gatewayAPI.hostNetwork.enabled,
# envoy.enabled, envoyConfig.enabled, encryption.type=wireguard,
# nodeEncryption — all unchanged.
dependencies:
  - name: cilium
    # Pinned to match Chart.lock (truth-on-disk). The previous "1.19.3"
    # value was provenance drift caught in EPIC-0 #1095 audit — Chart.lock
    # had been resolving to 1.16.5 the whole time. Aligning the declared
    # constraint with the locked version eliminates the lie. Bumping to a
    # newer Cilium minor is a separate slice that needs real upgrade
    # testing on a live data-plane cluster.
    version: "1.19.3"
    repository: "https://helm.cilium.io"
