apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-openbao
  labels:
    catalyst.openova.io/section: pts-2-3-per-sovereign-supporting-services
    catalyst.openova.io/tier: catalyst-cp
spec:
  version: 1.2.32
  card:
    title: openbao
    summary: OpenBao secret backend. 3-node Raft per region (independent quorum, async perf-replication across regions). MPL 2.0 — drop-in Vault replacement.
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  # ── #3373: class-level placement SUGGESTION + allow-list ────────────────
  # Placement is an INSTANCE property (Application.spec.placement); this is
  # only the default every instance inherits silently — the provisioning
  # journey's generic advanced selector (and a direct Git edit of the
  # instance's spec.placement) may override it within allowedPlacements.
  # Founder §4 table target: mgmt. Single render mechanism: the Flux
  # spec.kubeConfig.secretRef pivot — zero per-app placement code.
  defaultPlacement:
    vcluster: mgmt
  allowedPlacements: [host, mgmt]

  manifests:
    chart: ./chart
  depends: []

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive. Within cluster: Raft consensus
  #   (3-5 replicas). Cross-cluster: async perf-replication (OSS uses
  #   snapshot+restore). Switchover: `bao operator raft transition-to-primary`
  #   on the standby; KV reads continue uninterrupted on replica throughout.
  #   Active-hot-standby disallowed by schema (requires sync mode); OpenBao
  #   OSS perf-replication is async-only.
  topology:
    supported:
      - active-passive
      - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: openbao-perf-replication
          mode: async
          lagSloSeconds: 30
        switchover:
          mechanism: raft-transition
          rtoSeconds: 60
          rpoSeconds: 30
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # Per audit: `vault.<sov>` or internal-only. Default to private (mTLS,
  # no Coraza WAF); operator may publish via per-Sovereign overlay.
  endpoints:
    - name: api
      # OpenBao is served at bao.<sov>: clusters/_template/bootstrap-kit/
      # 08-openbao.yaml sets gateway.host to bao.${SOVEREIGN_FQDN}. The earlier
      # vault.<sov> value pointed at a host with NO HTTPRoute → the console
      # launch-url would 404. Keep this aligned with the live gateway.host.
      hostnameTemplate: "bao.{{.SovereignFQDN}}"
      port: 8200
      protocol: https
      tls: true
      visibility: private
      launchDefault: true
      ssoEnabled: true
      # #3150 — silent-SSO OIDC-init path. OpenBao's UI is a SPA (Vault-UI
      # fork): OIDC is started client-side, so there is no server GET route to
      # land on. The deep-link pre-selects the `oidc` auth method in the UI so
      # the operator's one click triggers the OIDC flow, which — with the
      # realm-config IDR defaultProvider=catalyst-pin binding (bp-keycloak
      # 1.4.9+, NOT an auth_url query param; see chart values.yaml comment) —
      # re-uses the PIN silently. NOTE: requires the `oidc` auth method to be
      # mounted by the sso-configure Deployment; when that job is unhealthy the
      # UI falls back to ?with=token and silent SSO can't fire.
      #
      # The `?with=` value is the auth-method PATH with NO trailing slash.
      # `oidc%2F` (encoded trailing slash) made the Ember UI fail to match the
      # `oidc` mount → it reverted to `?with=token` (manual Token form) and the
      # malformed mount path broke the callback round-trip. Emit `?with=oidc`.
      ssoInitPath: "/ui/vault/auth?with=oidc"
      # #3226 — zero-click silent-SSO parity with grafana/harbor. OpenBao's
      # UI is a client-side SPA, so the ssoInitPath deep-link above can only
      # PRE-SELECT the OIDC method — the operator still has to click "Sign in
      # with OIDC". ssoShim:true makes catalyst-api's launch-url return its
      # server-side shim (`api.<fqdn>/catalyst/v1/apps/openbao/openbao-sso-init`)
      # instead. The shim asks Vault for the OIDC auth_url server-side and
      # 302s the browser to Keycloak (silent PIN) → Vault callback → landed
      # signed-in. If the auth_url POST fails, the shim falls back to the
      # ssoInitPath deep-link above (the Open button never 500s).
      ssoShim: true

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # OpenBao OIDC auth method federated to sovereign realm (G91 manual
  # recovery + G112 chart-cred persistence — see memory).
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true

  # ── G117.6: Multi-instance ─────────────────────────────────────────────
  multiInstance:
    enabled: false
