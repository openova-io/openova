apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-openbao
  labels:
    catalyst.openova.io/section: pts-2-3-per-sovereign-supporting-services
    catalyst.openova.io/tier: catalyst-cp
spec:
  version: 1.2.61  # lockstep with chart/Chart.yaml (#4879 snapshot-fetch: NoSuchBucket → graceful skip, not hard Job failure)
  card:
    title: openbao
    summary: OpenBao secret backend. 3-node Raft per region (independent quorum, async perf-replication across regions). MPL 2.0 — drop-in Vault replacement.
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  # ── #3373: class-level placement SUGGESTION + allow-list ────────────────
  # Placement is an INSTANCE property (Application.spec.placement); this is
  # only the default every instance inherits silently — the provisioning
  # journey's generic advanced selector (and a direct Git edit of the
  # instance's spec.placement) may override it within allowedPlacements.
  # Founder §4 table target: mgmt. Single render mechanism: the Flux
  # spec.kubeConfig.secretRef pivot — zero per-app placement code.
  defaultPlacement:
    vcluster: mgmt
  allowedPlacements: [host, mgmt]

  # placementSchema aligned with spec.topology below (#4212 Seam 3). The
  # application-controller validates an Application's spec.placement against
  # modes[] (blueprintAllowedModes) and derives the effective default from
  # default / defaultOnMultiRegion (EffectiveDefault). The spine
  # Application-CR producer stamps active-passive on a multi-region
  # Sovereign (matching topology.defaults.multi-region) — modes[] must
  # admit it AND defaultOnMultiRegion must name it so the placement is
  # accepted and the Continuum CR is minted.
  placementSchema:
    modes: [singleton, active-passive]
    default: singleton
    defaultOnMultiRegion: active-passive
    minRegions: 1
    maxRegions: 2

  manifests:
    chart: ./chart
  depends: []

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md +
  # CORRECTION #3492 (2026-06-15): mgmt-A=Active, mgmt-B=Passive. Within
  # cluster: Raft consensus. Cross-cluster: OpenBao OSS has NO perf-replication
  # (Enterprise-only); the real mechanism is a single STRETCHED RAFT cluster —
  # mgmt-B joins mgmt-A as a NON-VOTER via retry_join_as_non_voter (openbao
  # discussion #1842), so mgmt-B holds mgmt-A's LIVE KV (RPO≈0) over the same
  # Cilium ClusterMesh bp-cnpg-pair uses. Switchover (raft-transition): on a
  # region-kill bp-continuum runs the OSS peers.json recovery (write a single-
  # voter peers.json on the survivor + restart its Pod) — `transition-to-primary`
  # is Enterprise-only and absent in OSS (openbao PR #996). KV reads continue
  # uninterrupted on the replica until the single restart. Active-hot-standby
  # disallowed by schema (requires sync mode); the raft replication stream is
  # async.
  topology:
    supported:
      - active-passive
      - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          # `raft` = the OSS stretched-raft non-voter replication stream (NOT
          # the Enterprise-only `openbao-perf-replication`). #3492.
          backend: raft
          mode: async
          lagSloSeconds: 30
        switchover:
          mechanism: raft-transition
          rtoSeconds: 60
          rpoSeconds: 30
        placement:
          # #4402 (#4325 de-vcluster fallout): the `mgmt` plane vCluster was
          # removed; the spine lands host-native in its own host namespace
          # (openbao/keycloak/harbor/gitea). The #4334 spine producer drives
          # this Blueprint through the application-controller fan-out, which
          # resolved `tier: mgmt` → host ns `mgmt` (now absent) → the spine
          # Application Degraded with `namespaces "mgmt" not found` and never
          # reached the Continuum producer. Host placement = empty tier; keep
          # the mgmt-A/-B region designators for the multi-region split.
          # Mirrors the per-Org #4375/#4379 tier:rtz→'' repoint.
          tier: ''
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ''
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # Per audit: `vault.<sov>` or internal-only. Default to private (mTLS,
  # no Coraza WAF); operator may publish via per-Sovereign overlay.
  endpoints:
    - name: api
      # OpenBao is served at bao.<sov>: clusters/_template/bootstrap-kit/
      # 08-openbao.yaml sets gateway.host to bao.${SOVEREIGN_FQDN}. The earlier
      # vault.<sov> value pointed at a host with NO HTTPRoute → the console
      # launch-url would 404. Keep this aligned with the live gateway.host.
      hostnameTemplate: "bao.{{.SovereignFQDN}}"
      port: 8200
      protocol: https
      tls: true
      visibility: private
      launchDefault: true
      ssoEnabled: true
      # #3626 — the console "Open" button's silent-SSO launch target. OpenBao's
      # UI is a SPA (Vault-UI / Ember fork) whose OIDC login is POPUP-ONLY: the
      # callback route `vault.cluster.oidc-callback` `afterModel` does an
      # UNCONDITIONAL `window.opener.postMessage(...)` with no null-check and no
      # in-page completion. The console Open button window.open()s this URL as a
      # TOP-LEVEL tab, so any target that drives the Vault-UI OIDC flow directly
      # (the old `/ui/vault/auth?with=oidc` deep-link, or the #3226 server-side
      # shim that 302'd into `/ui/vault/auth/oidc/oidc/callback`) lands on a
      # top-level callback where `window.opener` is null →
      # "Cannot read properties of null (reading 'postMessage')" and the token
      # form, never signed-in (measured live hw133 #3374 + hw146 #3626).
      #
      # The fix (#3374): point the launch at the on-origin SSO landing page
      # `/sso/landing` (chart templates/sso-landing.yaml), which runs the OIDC
      # round-trip as a TOP-LEVEL window (auth_url → Keycloak silent → back to
      # /sso/landing?code → GET oidc/callback → reconstruct the Vault-UI token in
      # localStorage → /ui/vault/secrets). No popup, no window.opener, no
      # catalyst-api dependency. The OIDC role already allow-lists
      # https://bao.<fqdn>/sso/landing (sso-configure-deployment.yaml). This is
      # the SAME flow the bare-URL HTTPRoute redirect (/, /ui, /ui/) uses, so
      # the Open button and a bare-host visit now both land signed-in.
      #
      # Gated by sso.bareURL.enabled (default true); when disabled the landing
      # page is not rendered and this path 404s — operators who disable bare-URL
      # SSO must also re-point this endpoint.
      ssoInitPath: "/sso/landing"

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # OpenBao OIDC auth method federated to sovereign realm (G91 manual
  # recovery + G112 chart-cred persistence — see memory).
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true

  # ── G117.6: Multi-instance ─────────────────────────────────────────────
  multiInstance:
    enabled: false
