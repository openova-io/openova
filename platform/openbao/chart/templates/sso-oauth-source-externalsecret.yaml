{{- /*
G91.openbao (#2655) — OIDC client credentials Secret in the openbao
namespace.

bp-sso-bridge (G91.1 #2652) writes the canonical OIDC client bundle
into OpenBao at `secret/sso/openbao` with keys client_id,
client_secret, issuer_url, authorize_url, token_url, userinfo_url,
end_session_url. This ExternalSecret mirrors those into a regular K8s
Secret in the openbao namespace; the sso-configure Deployment
(templates/sso-configure-deployment.yaml) consumes the keys via env
vars and calls OpenBao's `bao write auth/oidc/config …` API.

Note: this Secret only materialises after bp-sso-bridge has first
written secret/sso/openbao (which happens on the bp-sso-bridge
Deployment's first tick after install). The sso-configure Deployment's
reconcile loop tolerates the Secret being absent on early ticks.
*/ -}}
{{/*
#2988 ESO-CRD guard (gold standard: bp-external-dns externalsecret.yaml):
without the Capabilities check, installing this chart on a cluster where
the external-secrets.io CRDs are not yet established fails at manifest-
build time ("no matches for kind ExternalSecret") and wedges the whole
install — caught live as the fresh-prov sso ExternalSecret CRD race and
reproduced verbatim by the bp-openbao fresh-prov CI gate (kind cluster,
no ESO). With the guard, the resource is simply omitted until the next
Flux reconcile re-renders once the CRD exists (Capabilities re-evaluated
every reconcile), so SSO wiring self-heals with zero manual touch.
*/}}
{{- if and .Values.sso.enabled (.Capabilities.APIVersions.Has "external-secrets.io/v1beta1") }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openbao-sso-oidc-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-openbao
    bp-sso-bridge.openova.io/consumer: bp-openbao
spec:
  refreshInterval: {{ .Values.sso.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.sso.externalSecretStoreName | default "vault-region1" }}
    kind: ClusterSecretStore
  target:
    name: openbao-sso-oidc-credentials
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "openbao" }}
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "openbao" }}
        property: client_secret
    - secretKey: issuer_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "openbao" }}
        property: issuer_url
{{- end }}
