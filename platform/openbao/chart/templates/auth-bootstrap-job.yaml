{{- /*
Catalyst auth-bootstrap Job — bp-openbao (issue #316).

Helm post-install/post-upgrade hook (weight 10, runs AFTER the init Job
at weight 5). Idempotent on every run:

  1. Wait for `bao status` to report Initialized=true (the init Job at
     weight 5 has already run; this is a defensive check).
  2. Use the K8s ServiceAccount mounted at /var/run/secrets/... to
     enable + configure the Kubernetes auth method on OpenBao.
  3. Bind the `external-secrets` role to the ESO ServiceAccount per
     `.Values.autoUnseal.kubernetesAuth`. ESO's ClusterSecretStore
     `vault-region1` (platform/external-secrets) authenticates via this
     role on every secret read.
  4. Mount the kv-v2 backend at `secret/` (matches
     platform/external-secrets/chart/values.yaml clusterSecretStore.path).

Why this is a SEPARATE Job from init-job.yaml:
  - Init Job consumes the seed Secret and never persists the root
    token — exit cleanly. Acceptance criterion #6 demands no root token
    in K8s Secrets.
  - Auth bootstrap requires a token to call `bao auth enable …`. The
    upstream openbao chart exposes a transient init token via the
    StatefulSet's emptyDir persistence. This Job uses `bao login -path`
    against the auto-unseal recovery key — which is loaded from
    OpenBao's internal Raft state, NOT from a K8s Secret.

Skip-render pattern (per #402): renders ONLY when both
`autoUnseal.enabled=true` AND `autoUnseal.kubernetesAuth.enabled=true`.
*/}}
{{- $au := .Values.autoUnseal | default dict -}}
{{- if $au.enabled -}}
{{- $kAuth := $au.kubernetesAuth | default dict -}}
{{- if $kAuth.enabled -}}
{{- $img := $au.image | default dict -}}
{{- $repo := $img.repository | default "quay.io/openbao/openbao" -}}
{{- $registry := .Values.global.imageRegistry | default "" -}}
{{- if $registry }}{{- $repo = printf "%s/%s" $registry $repo -}}{{- end -}}
{{- $tag := $img.tag | default "2.1.0" -}}
{{- $pullPolicy := $img.pullPolicy | default "IfNotPresent" -}}
{{- $baoAddr := $au.baoAddress | default (printf "http://%s-openbao:8200" .Release.Name) -}}
{{- $deadline := $au.activeDeadlineSeconds | default 600 -}}
{{- $backoff := $au.backoffLimit | default 6 -}}
{{- $mountPath := $kAuth.mountPath | default "kubernetes" -}}
{{- $role := $kAuth.role | default "external-secrets" -}}
{{- $saName := $kAuth.serviceAccountName | default "external-secrets" -}}
{{- $saNs := $kAuth.serviceAccountNamespace | default "external-secrets-system" -}}
{{- $kvMount := $kAuth.kvMountPath | default "secret" -}}
{{- $tokenTTL := $kAuth.tokenTTL | default "1h" -}}
{{- $tokenMaxTTL := $kAuth.tokenMaxTTL | default "24h" -}}
{{- /* #3825 (Refs #3642) — cross-cluster TokenReview inputs. After #3642
       OpenBao runs INSIDE the mgmt vCluster, but the ESO ServiceAccount whose
       JWT it must validate is issued by the HOST apiserver (host ns
       external-secrets-system). `kubernetes.default.svc` inside the pod is the
       vc-mgmt apiserver, which does NOT know that host token (and the host ns
       does not even exist in vc-mgmt) → every ESO login fails 403, all *-oidc
       ExternalSecrets stay unsynced. OpenBao's k8s-auth supports cross-cluster
       validation: point kubernetes_host at the HOST apiserver + supply a HOST
       token_reviewer_jwt + the HOST CA + disable_local_ca_jwt. The host SA
       token + CA arrive via a Secret minted HOST-side (placement slot-08
       hostDocuments) and mirrored into vc-mgmt by bp-mgmt-vcluster
       sync.fromHost.secrets (`openbao/*`). Pre-#3642 single-region (openbao
       host-side) leaves this disabled → render byte-identical. */ -}}
{{- $xcr := $kAuth.crossClusterTokenReview | default dict -}}
{{- $xcrEnabled := $xcr.enabled | default false -}}
{{- $xcrHostApi := $xcr.hostApiserver | default "https://10.96.0.1:443" -}}
{{- $xcrSecret := $xcr.tokenReviewerSecret | default dict -}}
{{- $xcrSecretName := $xcrSecret.name | default "openbao-host-token-reviewer" -}}
{{- $xcrTokenKey := $xcrSecret.tokenKey | default "token" -}}
{{- $xcrCaKey := $xcrSecret.caKey | default "ca.crt" -}}
{{- /* #3376 — catalyst-api handover-archive writer role inputs. */ -}}
{{- $capi := $kAuth.catalystApi | default dict -}}
{{- $capiEnabled := $capi.enabled | default false -}}
{{- $capiRole := $capi.role | default "catalyst-api" -}}
{{- $capiSaName := $capi.serviceAccountName | default "catalyst-api-cutover-driver" -}}
{{- $capiSaNs := $capi.serviceAccountNamespace | default "catalyst-system" -}}
{{- /* #3888 (Refs #3847) — prov-time openbao KV-seed inputs. When
       bootstrapSeed.enabled the Job reads a one-shot cloud-init Secret +
       writes its keys into <kvMountPath>/<kvPrefix>/* with the STILL-VALID
       root token, BEFORE revoking it, so ExternalSecrets can materialise
       evicted creds. Default-off + the seed mount is optional → inert. */ -}}
{{- $seed := $au.bootstrapSeed | default dict -}}
{{- $seedEnabled := $seed.enabled | default false -}}
{{- $seedSecretName := $seed.secretName | default "openbao-bootstrap-seed" -}}
{{- $seedKvPrefix := $seed.kvPrefix | default "bootstrap" -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-auth-bootstrap
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    catalyst.openova.io/blueprint: bp-openbao
    catalyst.openova.io/component: openbao-auth-bootstrap
    # kyverno `flux-managed` Enforce DENIES a Job without this label. Helm
    # hook Jobs are created by the helm-controller, not Flux, so stamp it
    # explicitly or the FIRST chart roll on a converged Enforce env fails
    # the post-upgrade hook and the HR rolls back (#3374 / #3296 class).
    app.kubernetes.io/managed-by: flux
spec:
  activeDeadlineSeconds: {{ $deadline }}
  backoffLimit: {{ $backoff }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        catalyst.openova.io/blueprint: bp-openbao
        catalyst.openova.io/component: openbao-auth-bootstrap
    spec:
      serviceAccountName: openbao-auto-unseal
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
{{- if $xcrEnabled }}
      # #3825 — mount the HOST token-reviewer Secret (host SA JWT + host CA),
      # mirrored host→vc-mgmt by bp-mgmt-vcluster sync.fromHost.secrets. The
      # Job reads token/ca.crt from here to configure cross-cluster TokenReview
      # against the HOST apiserver. optional:true so a fresh prov where the
      # mirror has not yet landed does not block scheduling — the script
      # soft-waits for the files and the Job's backoffLimit retries until the
      # synced Secret appears (eventually-consistent, same posture as the
      # SHARED_PG fromHost mirror).
      volumes:
        - name: host-token-reviewer
          secret:
            secretName: {{ $xcrSecretName | quote }}
            optional: true
{{- end }}
{{- if $seedEnabled }}
      # #3888 — mount the one-shot cloud-init seed Secret read-only. optional:
      # true so a prov that seeds nothing (or where the cloud-init key is
      # absent) does not block scheduling — the seed step soft-skips when the
      # mount directory is empty.
{{- if not $xcrEnabled }}
      volumes:
{{- end }}
        - name: bootstrap-seed
          secret:
            secretName: {{ $seedSecretName | quote }}
            optional: true
{{- end }}
      containers:
        - name: auth-bootstrap
          image: {{ printf "%s:%s" $repo $tag | quote }}
          imagePullPolicy: {{ $pullPolicy | quote }}
{{- if or $xcrEnabled $seedEnabled }}
          volumeMounts:
{{- if $xcrEnabled }}
            - name: host-token-reviewer
              mountPath: /var/run/openbao/host-token-reviewer
              readOnly: true
{{- end }}
{{- if $seedEnabled }}
            - name: bootstrap-seed
              mountPath: /var/run/openbao/bootstrap-seed
              readOnly: true
{{- end }}
{{- end }}
          env:
            - name: BAO_ADDR
              value: {{ $baoAddr | quote }}
            # #3825 — cross-cluster TokenReview against the HOST apiserver.
            - name: XCR_ENABLED
              value: {{ $xcrEnabled | quote }}
            - name: XCR_HOST_APISERVER
              value: {{ $xcrHostApi | quote }}
            - name: XCR_TOKEN_FILE
              value: {{ printf "/var/run/openbao/host-token-reviewer/%s" $xcrTokenKey | quote }}
            - name: XCR_CA_FILE
              value: {{ printf "/var/run/openbao/host-token-reviewer/%s" $xcrCaKey | quote }}
            - name: AUTH_MOUNT_PATH
              value: {{ $mountPath | quote }}
            - name: AUTH_ROLE
              value: {{ $role | quote }}
            - name: ESO_SA_NAME
              value: {{ $saName | quote }}
            - name: ESO_SA_NAMESPACE
              value: {{ $saNs | quote }}
            - name: KV_MOUNT_PATH
              value: {{ $kvMount | quote }}
            - name: TOKEN_TTL
              value: {{ $tokenTTL | quote }}
            - name: TOKEN_MAX_TTL
              value: {{ $tokenMaxTTL | quote }}
            # #3376 — catalyst-api handover-archive writer role inputs.
            - name: CATALYST_API_ROLE_ENABLED
              value: {{ $capiEnabled | quote }}
            - name: CATALYST_API_ROLE
              value: {{ $capiRole | quote }}
            - name: CATALYST_API_SA_NAME
              value: {{ $capiSaName | quote }}
            - name: CATALYST_API_SA_NAMESPACE
              value: {{ $capiSaNs | quote }}
            # #3888 — prov-time KV-seed inputs.
            - name: BOOTSTRAP_SEED_ENABLED
              value: {{ $seedEnabled | quote }}
            - name: BOOTSTRAP_SEED_DIR
              value: "/var/run/openbao/bootstrap-seed"
            - name: BOOTSTRAP_SEED_KV_PREFIX
              value: {{ $seedKvPrefix | quote }}
            # BAO_TOKEN sourced from openbao-root-token Secret that init-job
            # (post-install weight 5) writes from the bao operator init
            # output. Required so this Job's `bao auth enable`,
            # `bao secrets enable`, `bao policy write`, and `bao write
            # role/...` calls are authenticated. Without it bao returns
            # 403 Forbidden — caught live on otech43+otech44 because the
            # PR #663 commit only added the revoke logic, not the env
            # declaration that gates it.
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao-root-token
                  key: token
                  # Revoked (and normally deleted) after the first run; later
                  # runs generate a short-lived root from the unseal keys.
                  optional: true
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[openbao-auth-bootstrap] target BAO_ADDR=$BAO_ADDR"
              # ─── Wait for OpenBao initialised + unsealed ───────────────
              ATTEMPTS=0
              MAX_ATTEMPTS=60   # 5 minutes
              until OUT=$(bao status -format=json 2>/dev/null) && \
                    echo "$OUT" | grep -qE '"initialized"[[:space:]]*:[[:space:]]*true' && \
                    echo "$OUT" | grep -qE '"sealed"[[:space:]]*:[[:space:]]*false'; do
                ATTEMPTS=$((ATTEMPTS+1))
                if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
                  echo "[openbao-auth-bootstrap] FATAL: OpenBao not initialised+unsealed after $MAX_ATTEMPTS attempts"
                  echo "[openbao-auth-bootstrap] manual recovery: docs/RUNBOOK-PROVISIONING.md §openbao-auto-unseal"
                  exit 1
                fi
                echo "[openbao-auth-bootstrap] waiting for openbao initialized=true sealed=false (attempt $ATTEMPTS/$MAX_ATTEMPTS)"
                sleep 5
              done

              # ─── Privileged token for THIS run (ADR-0015, #7067) ───────
              # First install: BAO_TOKEN is the init root token (valid).
              # Every later install/upgrade: that token was revoked by the
              # first run, so generate a short-lived root from the unseal-key
              # shares (files/openbao-generate-root.sh) — it is revoked at the
              # end of this run, like the init token. Before 1.2.72 a re-run
              # exited 0 here, so NO later policy/role/mount change ever
              # reached a running Sovereign; now the hook re-asserts the
              # openbao-config-admin grant and the openbao-config reconciler
              # owns everything else. No unseal-key Secret (a pre-#539 init)
              # ⇒ WARN + exit 0, never a failed HR.
{{ .Files.Get "files/openbao-generate-root.sh" | indent 14 }}
              if ! bao token lookup >/dev/null 2>&1; then
                echo "[openbao-auth-bootstrap] init root token no longer valid — generating a short-lived root from the unseal-key shares"
                if GEN_TOKEN="$(bao_generate_root)" && [ -n "$GEN_TOKEN" ]; then
                  BAO_TOKEN="$GEN_TOKEN"; export BAO_TOKEN
                  bao token lookup >/dev/null 2>&1 || { echo "[openbao-auth-bootstrap] FATAL: generated root token does not authenticate"; exit 1; }
                  echo "[openbao-auth-bootstrap] short-lived root generated (revoked at the end of this run)"
                else
                  echo "[openbao-auth-bootstrap] WARN: cannot generate a root (openbao-unseal-keys missing or incomplete) — openbao-config-admin NOT re-asserted; see platform/openbao/README.md §Declarative configuration, one-time upgrade"
                  exit 0
                fi
              fi

              # ─── Idempotency: skip if auth method + role already exist ─
              # `bao auth list` returns 200 and the JSON includes the mount
              # path key (e.g. "kubernetes/") when the method is enabled.
              # If the role exists we have nothing to do — this run is
              # post-upgrade or a Job retry.
              EXISTING_AUTH=$(bao auth list -format=json 2>/dev/null || echo "{}")
              if echo "$EXISTING_AUTH" | grep -qE "\"$AUTH_MOUNT_PATH/\""; then
                echo "[openbao-auth-bootstrap] auth method $AUTH_MOUNT_PATH/ already enabled"
              else
                echo "[openbao-auth-bootstrap] enabling Kubernetes auth at $AUTH_MOUNT_PATH/"
                bao auth enable -path=$AUTH_MOUNT_PATH kubernetes
              fi

              # Configure the auth method. Two modes:
              #
              #   (default, openbao host-side) Validate ServiceAccount JWTs
              #   against the IN-CLUSTER apiserver — kubernetes_host is the
              #   standard cluster-DNS endpoint, the CA comes from the pod's
              #   own SA mount. This is correct whenever the ESO SA whose
              #   token OpenBao validates is issued by the SAME apiserver
              #   OpenBao runs against (single-region / Catalyst-Zero, and
              #   every env before #3642).
              #
              #   (#3825 cross-cluster, openbao in vc-mgmt) After #3642
              #   OpenBao runs INSIDE the mgmt vCluster but the ESO SA token
              #   it must validate is issued by the HOST apiserver. The pod's
              #   `kubernetes.default.svc` + local SA mount are the VC-MGMT
              #   apiserver, which cannot review the host token (it is unknown
              #   there, and ns external-secrets-system does not exist in
              #   vc-mgmt) → every ESO login 403s and all *-oidc
              #   ExternalSecrets stay unsynced. So point kubernetes_host at
              #   the HOST apiserver, supply a HOST token_reviewer_jwt + the
              #   HOST CA (from the mirrored openbao-host-token-reviewer
              #   Secret), and disable_local_ca_jwt so OpenBao does NOT fall
              #   back to its in-vCluster CA/token. The ESO role's
              #   bound_service_account_namespaces stays external-secrets-system
              #   (host ns) below — correct, because the review now runs
              #   against the host. (Restores the pre-#3642 host-token-review
              #   contract that `kubernetes.default.svc` provided natively when
              #   openbao was host-side.)
              echo "[openbao-auth-bootstrap] writing auth/$AUTH_MOUNT_PATH/config"
              if [ "${XCR_ENABLED}" = "true" ]; then
                echo "[openbao-auth-bootstrap] cross-cluster mode: TokenReview target = HOST apiserver ${XCR_HOST_APISERVER}"
                # Soft-wait for the host-mirrored token-reviewer Secret. On a
                # fresh prov the bp-mgmt-vcluster sync.fromHost mirror lands
                # eventually; until the files appear we exit non-zero so the
                # Job's backoffLimit retries (eventually-consistent, same
                # posture as the SHARED_PG fromHost mirror) rather than baking
                # an empty/local config.
                if [ ! -s "${XCR_TOKEN_FILE}" ] || [ ! -s "${XCR_CA_FILE}" ]; then
                  echo "[openbao-auth-bootstrap] host token-reviewer Secret not yet mirrored (${XCR_TOKEN_FILE} / ${XCR_CA_FILE} absent) — retry on next backoff once bp-mgmt-vcluster sync.fromHost lands it"
                  exit 1
                fi
                HOST_TR_JWT=$(cat "${XCR_TOKEN_FILE}")
                HOST_CA=$(cat "${XCR_CA_FILE}")
                bao write auth/$AUTH_MOUNT_PATH/config \
                  kubernetes_host="${XCR_HOST_APISERVER}" \
                  kubernetes_ca_cert="$HOST_CA" \
                  token_reviewer_jwt="$HOST_TR_JWT" \
                  disable_local_ca_jwt=true \
                  disable_iss_validation=true
              else
                KUBE_CA=$(cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)
                bao write auth/$AUTH_MOUNT_PATH/config \
                  kubernetes_host="https://kubernetes.default.svc" \
                  kubernetes_ca_cert="$KUBE_CA" \
                  disable_iss_validation=true
              fi

              # ─── #3374 (Refs #3642 #3825) SECOND mount: in-vCluster TokenReview ─
              # In cross-cluster mode the $AUTH_MOUNT_PATH mount above TokenReviews
              # against the HOST apiserver (correct for ESO, a host-SA role). But
              # the in-vCluster-SA roles — sso-configure (ns=this release ns),
              # sso-bridge, openbao-snapshot — present a JWT signed by the VCLUSTER
              # apiserver, which the host apiserver CANNOT validate ("invalid
              # signature, no keys found") → those logins 403 → silent SSO never
              # configures (measured live hw167 2026-06-19: openbao /sso/landing
              # chrome-error). Enable a parallel `kubernetes-vcluster/` mount that
              # validates against the IN-VCLUSTER apiserver using this Job's OWN
              # local SA + local CA: `kubernetes.default.svc` from a Pod inside the
              # vCluster IS the vCluster apiserver (NOT the host — that is only
              # reachable via the explicit 10.96.0.1 host-bridge), and the Job's SA
              # carries system:auth-delegator there (auto-unseal SA). disable_local_
              # ca_jwt stays default(false) so OpenBao uses its own in-pod token to
              # call the review. Runtime-gated on XCR_ENABLED: when XCR is off
              # (host-side openbao / Catalyst-Zero) the block is INERT — no second
              # mount is enabled and no role is rebound, so OpenBao behaviour is
              # unchanged (the single `kubernetes/` mount is already the in-cluster
              # apiserver). The gate is the same XCR_ENABLED env the host-bridge
              # config block above keys on.
              if [ "${XCR_ENABLED}" = "true" ]; then
                VC_AUTH_MOUNT_PATH="kubernetes-vcluster"
                VC_EXISTING_AUTH=$(bao auth list -format=json 2>/dev/null || echo "{}")
                if echo "$VC_EXISTING_AUTH" | grep -qE "\"$VC_AUTH_MOUNT_PATH/\""; then
                  echo "[openbao-auth-bootstrap] auth method $VC_AUTH_MOUNT_PATH/ already enabled"
                else
                  echo "[openbao-auth-bootstrap] enabling Kubernetes auth at $VC_AUTH_MOUNT_PATH/ (in-vCluster TokenReview)"
                  bao auth enable -path=$VC_AUTH_MOUNT_PATH kubernetes
                fi
                VC_KUBE_CA=$(cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)
                echo "[openbao-auth-bootstrap] writing auth/$VC_AUTH_MOUNT_PATH/config (kubernetes_host=in-vCluster apiserver)"
                bao write auth/$VC_AUTH_MOUNT_PATH/config \
                  kubernetes_host="https://kubernetes.default.svc" \
                  kubernetes_ca_cert="$VC_KUBE_CA" \
                  disable_iss_validation=true
              fi

              # ─── Ensure kv-v2 backend at $KV_MOUNT_PATH/ ────────────────
              EXISTING_MOUNTS=$(bao secrets list -format=json 2>/dev/null || echo "{}")
              if echo "$EXISTING_MOUNTS" | grep -qE "\"$KV_MOUNT_PATH/\""; then
                echo "[openbao-auth-bootstrap] kv backend $KV_MOUNT_PATH/ already mounted"
              else
                echo "[openbao-auth-bootstrap] mounting kv-v2 at $KV_MOUNT_PATH/"
                bao secrets enable -path=$KV_MOUNT_PATH -version=2 kv
              fi

              # ─── openbao-config-admin (ADR-0015, #7067) ─────────────────
              # Every ACL policy and auth role this chart needs (ESO read +
              # push, sso-bridge, sso-configure, catalyst-api, snapshot, the
              # peer-region trust) is DECLARATIVE desired state now
              # (templates/_config.tpl → ConfigMap openbao-config-desired),
              # applied continuously by the openbao-config Deployment. This
              # hook writes only that reconciler's own grant — scoped to
              # configuration surfaces, no secret data, no sys/raw, no seal.
              echo "[openbao-auth-bootstrap] writing openbao-config-admin policy + role/openbao-config-admin on auth/{{ include "openbao.configLoginMount" . }}"
              cat <<'EOF' | bao policy write openbao-config-admin -
{{ include "openbao.configAdminPolicy" . | indent 14 }}
              EOF
              bao write auth/{{ include "openbao.configLoginMount" . }}/role/openbao-config-admin \
                bound_service_account_names=openbao-config \
                bound_service_account_namespaces=$NAMESPACE \
                policies=openbao-config-admin \
                ttl=$TOKEN_TTL \
                max_ttl=$TOKEN_MAX_TTL

              # ─── #3888 (Refs #3847) prov-time KV-seed ──────────────────
              # Land per-deployment creds the cloud-init wrote into the
              # one-shot $BOOTSTRAP_SEED_DIR Secret mount into openbao KV at
              # $KV_MOUNT_PATH/$BOOTSTRAP_SEED_KV_PREFIX/* using the STILL-VALID
              # root token — this MUST run before the revoke below (after it
              # there is no token with write access to secret/*). This is the
              # mechanism #3890 flagged as missing: it lets a future inline
              # cloud-init Secret be evicted to a Flux ExternalSecret reading
              # `<prefix>/<name>` via the vault-region1 ClusterSecretStore.
              #
              # Seed Secret SHAPE: each data key is a KV path with `__` for `/`
              # (k8s Secret keys can't contain `/`); the projected file's body
              # is `field=value` lines. e.g. file `harbor-robot__token` with
              # body `token=<robot-token>` → `secret/bootstrap/harbor-robot`
              # field `token`. `bao kv put` overwrites (idempotent on retry +
              # upgrade). After a successful write the source K8s Secret is
              # DELETED so no plaintext cred lingers in etcd (same single-use
              # posture as openbao-recovery-seed). Default-off + optional mount
              # → when disabled or unseeded the dir is absent/empty and this
              # whole block soft-skips, byte-identically to the pre-#3888 chart.
              if [ "${BOOTSTRAP_SEED_ENABLED}" = "true" ] && [ -d "${BOOTSTRAP_SEED_DIR}" ]; then
                SEED_COUNT=0
                # Iterate the projected Secret files (skip k8s ..data symlinks
                # + dotfiles; a real seed key never starts with a dot). Malformed
                # entries are `continue`-skipped with a WARN so one bad key never
                # aborts the whole Job before the revoke; only a genuine
                # `bao kv put` failure (FATAL below) stops the run.
                for f in "${BOOTSTRAP_SEED_DIR}"/*; do
                  [ -f "$f" ] || continue
                  KEY=$(basename "$f")
                  case "$KEY" in .*) continue;; esac
                  # `__` → `/` to reconstruct the KV path; reject anything that
                  # is empty or would escape the prefix.
                  KVPATH=$(printf '%s' "$KEY" | sed 's#__#/#g')
                  case "$KVPATH" in ""|*..*|/*) echo "[openbao-auth-bootstrap] WARN: skipping malformed seed key '$KEY'"; continue;; esac
                  # Build `field=value` argv from the file body (one per line).
                  # Blank lines + lines without `=` are skipped. Values may
                  # contain `=` (only the FIRST splits field/value).
                  set --
                  while IFS= read -r line || [ -n "$line" ]; do
                    [ -n "$line" ] || continue
                    case "$line" in *=*) ;; *) continue;; esac
                    set -- "$@" "$line"
                  done < "$f"
                  if [ "$#" -eq 0 ]; then
                    echo "[openbao-auth-bootstrap] WARN: seed key '$KEY' had no field=value lines — skipping"
                    continue
                  fi
                  echo "[openbao-auth-bootstrap] seeding $KV_MOUNT_PATH/$BOOTSTRAP_SEED_KV_PREFIX/$KVPATH ($# field(s))"
                  if bao kv put "$KV_MOUNT_PATH/$BOOTSTRAP_SEED_KV_PREFIX/$KVPATH" "$@" >/dev/null; then
                    SEED_COUNT=$((SEED_COUNT+1))
                  else
                    echo "[openbao-auth-bootstrap] FATAL: bao kv put failed for $BOOTSTRAP_SEED_KV_PREFIX/$KVPATH"
                    exit 1
                  fi
                done
                if [ "$SEED_COUNT" -gt 0 ]; then
                  echo "[openbao-auth-bootstrap] seeded $SEED_COUNT key(s) into $KV_MOUNT_PATH/$BOOTSTRAP_SEED_KV_PREFIX/; deleting single-use seed Secret"
                  wget -qO- --no-check-certificate \
                    --header="Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                    --method=DELETE \
                    "https://kubernetes.default.svc/api/v1/namespaces/$NAMESPACE/secrets/{{ $seedSecretName }}" >/dev/null 2>&1 || \
                  echo "[openbao-auth-bootstrap] WARN: could not delete {{ $seedSecretName }} (busybox wget / RBAC); manual cleanup may be needed"
                else
                  echo "[openbao-auth-bootstrap] bootstrapSeed enabled but no seed keys present — nothing to seed"
                fi
              fi

              # ─── Revoke + cleanup root token ──────────────────────────
              # Acceptance criterion #6: the privileged root token must
              # not persist past the install window. Revoke it inside
              # bao first, then delete the K8s Secret that held it.
              echo "[openbao-auth-bootstrap] revoking root token"
              bao token revoke -self 2>&1 || echo "[openbao-auth-bootstrap] WARN: token revoke returned non-zero (may already be revoked)"
              echo "[openbao-auth-bootstrap] deleting transient openbao-root-token Secret"
              wget -qO- --no-check-certificate \
                --header="Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                --method=DELETE \
                "https://kubernetes.default.svc/api/v1/namespaces/$NAMESPACE/secrets/openbao-root-token" >/dev/null 2>&1 || \
              echo "[openbao-auth-bootstrap] WARN: --method=DELETE not supported (busybox wget); manual cleanup may be needed via kubectl"

              echo "[openbao-auth-bootstrap] Kubernetes auth bootstrap complete"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
{{- end }}
{{- end }}
