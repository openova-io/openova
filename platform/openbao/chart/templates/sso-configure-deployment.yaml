{{- /*
G91.openbao (#2655) — Continuous OIDC bootstrap reconciler.

Pattern mirrors platform/sso-bridge/chart/templates/configmap-reconciler.yaml
+ deployment.yaml. Single-replica Deployment running a 60s bash loop
that:

  1. Authenticates to OpenBao via K8s SA → role `sso-configure`
     (bound by auth-bootstrap-job.yaml to the
     openbao-sso-configure ServiceAccount in this namespace, with
     policy sso-configure-admin attached).
  2. Waits for the openbao-sso-oidc-credentials Secret (rendered by
     templates/sso-oauth-source-externalsecret.yaml).
  3. Enables the `oidc` auth method (idempotent — skips if already
     mounted at oidc/).
  4. Writes auth/oidc/config with oidc_discovery_url, client_id,
     client_secret, default_role=operator.
  5. Writes sys/policies/acl/sso-operator-admin with full superuser
     capabilities (so OIDC-onboarded operators are admins).
  6. Writes auth/oidc/role/operator binding token_policies=
     sso-operator-admin + groups_claim=groups + bound_claims to the
     adminGroup realm group + allowed_redirect_uris covering the UI
     callback + CLI loopback.

Why a Deployment instead of a Helm post-install hook:
  bp-openbao installs as a dependency of bp-sso-bridge — bp-sso-bridge
  doesn't run until after bp-openbao reconciles, so on first install
  the openbao-sso-oidc-credentials Secret doesn't yet exist. A
  one-shot Job would race the Secret materialisation; a continuous
  reconciler tolerates the Secret being absent on early ticks.

  Pattern also matches the prior auth-bootstrap-job's policy of
  letting the OpenBao auth surface re-converge on chart upgrade.
*/ -}}
{{- if .Values.sso.enabled }}
{{- /*
BAO_ADDR must resolve to the live OpenBao Service. With
spec.releaseName=openbao the upstream openbao subchart's `fullname`
template returns just `openbao` (Release.Name already CONTAINS the chart
name), so the Service is `openbao`, NOT `openbao-openbao`. Consume the
SAME `autoUnseal.baoAddress` override the auth-bootstrap Job uses (the
per-Sovereign overlay sets it to http://openbao.openbao.svc.cluster.local:8200);
fall back to the `<release>-openbao` default only when unset. The prior
hardcoded `{{ "{{" }} .Release.Name {{ "}}" }}-openbao` rendered
`openbao-openbao.<ns>.svc...` → NXDOMAIN → the reconciler never reached
the server → the oidc auth method was never configured → silent SSO never
worked. (#3150)
*/}}
{{- $baoAddrSSO := (.Values.autoUnseal | default dict).baoAddress | default (printf "http://%s-openbao.%s.svc.cluster.local:8200" .Release.Name .Release.Namespace) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-openbao
    app.kubernetes.io/name: openbao-sso-configure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-openbao
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openbao-sso-oidc-credentials"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-openbao
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-sso-configure
subjects:
  - kind: ServiceAccount
    name: openbao-sso-configure
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-openbao
data:
  reconcile.sh: |
    #!/usr/bin/env sh
    # bp-openbao sso-configure reconcile loop (G91.openbao #2655).
    set -u

    : "${BAO_ADDR:?BAO_ADDR must be set}"
    : "${BAO_K8S_AUTH_PATH:?BAO_K8S_AUTH_PATH must be set}"
    : "${BAO_K8S_AUTH_ROLE:?BAO_K8S_AUTH_ROLE must be set}"
    : "${OIDC_NAME:?OIDC_NAME must be set}"
    : "${OIDC_ADMIN_GROUP:?OIDC_ADMIN_GROUP must be set}"
    : "${OIDC_OPS_GROUP:?OIDC_OPS_GROUP must be set}"
    : "${OIDC_VIEWER_GROUP:?OIDC_VIEWER_GROUP must be set}"
    : "${OIDC_ALLOWED_REDIRECT_URIS:?OIDC_ALLOWED_REDIRECT_URIS must be set}"
    : "${INTERVAL_SECONDS:?INTERVAL_SECONDS must be set}"

    log() { printf '%s | %s\n' "$(date -u +%FT%TZ)" "$*"; }

    bao_login() {
      sa_token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
      BAO_TOKEN="$(wget -qO- --no-check-certificate \
        --header='Content-Type: application/json' \
        --post-data "{\"role\":\"${BAO_K8S_AUTH_ROLE}\",\"jwt\":\"${sa_token}\"}" \
        "${BAO_ADDR%/}/v1/auth/${BAO_K8S_AUTH_PATH}/login" \
        | sed -n 's/.*"client_token":"\([^"]*\)".*/\1/p')"
      if [ -z "${BAO_TOKEN}" ]; then
        log "WARN: bao login returned no client_token; sso-configure role may not yet be bound"
        return 1
      fi
    }

    bao_write() {
      # $1 = path, $2 = JSON payload
      wget -qO- --no-check-certificate \
        --header="X-Vault-Token: ${BAO_TOKEN}" \
        --header='Content-Type: application/json' \
        --post-data "$2" \
        "${BAO_ADDR%/}/v1/$1" >/dev/null 2>&1
      return $?
    }

    bao_get() {
      wget -qO- --no-check-certificate \
        --header="X-Vault-Token: ${BAO_TOKEN}" \
        "${BAO_ADDR%/}/v1/$1" 2>/dev/null
    }

    log "bp-openbao sso-configure starting; addr=${BAO_ADDR} interval=${INTERVAL_SECONDS}s"

    while true; do
      sleep "${INTERVAL_SECONDS}"

      # Skip until the ExternalSecret materialises.
      if [ ! -f /etc/sso-creds/client_id ] || [ ! -f /etc/sso-creds/client_secret ] || [ ! -f /etc/sso-creds/issuer_url ]; then
        log "openbao-sso-oidc-credentials Secret keys not yet present; bp-sso-bridge may not have run yet — waiting"
        continue
      fi

      CLIENT_ID="$(cat /etc/sso-creds/client_id 2>/dev/null)"
      CLIENT_SECRET="$(cat /etc/sso-creds/client_secret 2>/dev/null)"
      ISSUER_URL="$(cat /etc/sso-creds/issuer_url 2>/dev/null)"

      if [ -z "${CLIENT_ID}" ] || [ -z "${CLIENT_SECRET}" ] || [ -z "${ISSUER_URL}" ]; then
        log "ESO Secret present but a key is empty (CLIENT_ID=${CLIENT_ID:+set} CLIENT_SECRET=${CLIENT_SECRET:+set} ISSUER_URL=${ISSUER_URL:+set}) — waiting"
        continue
      fi

      if ! bao_login; then
        continue
      fi

      AUTH_LIST="$(bao_get sys/auth)"
      case "${AUTH_LIST}" in
        *'"oidc/"'*)
          log "oidc auth method already enabled at oidc/ — checking config"
          ;;
        *)
          log "enabling oidc auth method at oidc/"
          bao_write sys/auth/oidc "$(printf '{"type":"oidc","description":"%s"}' "${OIDC_NAME}")" \
            && log "...oidc auth enabled" \
            || { log "WARN: enabling oidc auth failed; retrying next tick"; continue; }
          ;;
      esac

      # Idempotent PUT — last write wins
      CONFIG_PAYLOAD="$(printf '{"oidc_discovery_url":"%s","oidc_client_id":"%s","oidc_client_secret":"%s","default_role":"operator"}' \
        "${ISSUER_URL}" "${CLIENT_ID}" "${CLIENT_SECRET}")"
      if bao_write auth/oidc/config "${CONFIG_PAYLOAD}"; then
        log "auth/oidc/config written (issuer=${ISSUER_URL})"
      else
        log "WARN: auth/oidc/config write failed; retrying next tick"
        continue
      fi

      # ── Policies (#3150) ──────────────────────────────────────────────
      # Two policies, mapped from the operator's realm group:
      #   sso-operator-admin  → full read/write/sudo (sovereign-admins / -ops)
      #   sso-operator-read   → read+list everywhere  (sovereign-viewers)
      # The role grants NO policy by token_policies; the effective policy is
      # attached via external identity groups keyed on the `groups` claim, so
      # a viewer never silently inherits admin (and an admin is not gated to
      # read). See the identity-group block below.
      ADMIN_POLICY_PAYLOAD='{"policy":"path \"*\" { capabilities = [\"read\",\"create\",\"update\",\"delete\",\"list\",\"sudo\"] }"}'
      if bao_write sys/policies/acl/sso-operator-admin "${ADMIN_POLICY_PAYLOAD}"; then
        log "sso-operator-admin policy written"
      fi
      READ_POLICY_PAYLOAD='{"policy":"path \"*\" { capabilities = [\"read\",\"list\"] }"}'
      if bao_write sys/policies/acl/sso-operator-read "${READ_POLICY_PAYLOAD}"; then
        log "sso-operator-read policy written"
      fi

      # Build allowed_redirect_uris as a JSON list of comma-separated env var entries.
      AURIS_JSON="["
      _first=1
      for uri in ${OIDC_ALLOWED_REDIRECT_URIS}; do
        if [ "${_first}" -eq 1 ]; then
          AURIS_JSON="${AURIS_JSON}\"${uri}\""
          _first=0
        else
          AURIS_JSON="${AURIS_JSON},\"${uri}\""
        fi
      done
      AURIS_JSON="${AURIS_JSON}]"

      # ── Role (#3150) ──────────────────────────────────────────────────
      # bound_claims.groups MUST list EVERY realm group a real operator can
      # carry, or OpenBao rejects login with
      #   "claim \"groups\" does not match any associated bound claim values".
      # The catalyst-pin / sovereign realm stamps `defaultGroups:
      # /sovereign-viewers` on EVERY federated user (platform/keycloak/chart/
      # templates/configmap-sovereign-realm.yaml), and the handover flow adds
      # the org operator to `sovereign-admins`; `sovereign-ops` is the third
      # privileged realm group. Binding to ONLY the admin group (the prior
      # behaviour) rejected the common case (a viewer) at the callback.
      # token_policies is the SAFE baseline (read-only); the admin uplift is
      # delivered by the external identity-group alias on sovereign-admins /
      # sovereign-ops below — so the bound_claim widening does NOT over-grant.
      BOUND_CLAIMS="$(printf '{"groups":["%s","%s","%s"]}' "${OIDC_ADMIN_GROUP}" "${OIDC_OPS_GROUP}" "${OIDC_VIEWER_GROUP}")"
      ROLE_PAYLOAD="$(printf '{"user_claim":"preferred_username","groups_claim":"groups","bound_audiences":["%s"],"bound_claims":%s,"allowed_redirect_uris":%s,"token_policies":["sso-operator-read"],"role_type":"oidc"}' \
        "${CLIENT_ID}" "${BOUND_CLAIMS}" "${AURIS_JSON}")"
      if bao_write auth/oidc/role/operator "${ROLE_PAYLOAD}"; then
        log "auth/oidc/role/operator written (groups=${OIDC_ADMIN_GROUP},${OIDC_OPS_GROUP},${OIDC_VIEWER_GROUP})"
      else
        log "WARN: auth/oidc/role/operator write failed; retrying next tick"
        continue
      fi

      # ── External identity groups: realm-group → policy (#3150) ─────────
      # OpenBao attaches policies from the `groups` claim only via external
      # identity groups whose alias name == the claim value AND whose alias
      # mount_accessor == the oidc auth mount accessor. Map:
      #   sovereign-admins → sso-operator-admin
      #   sovereign-ops    → sso-operator-admin
      #   sovereign-viewers→ (none extra; role baseline already read-only)
      OIDC_ACCESSOR="$(bao_get sys/auth | sed -n 's/.*"oidc\/":{[^}]*"accessor":"\([^"]*\)".*/\1/p')"
      if [ -z "${OIDC_ACCESSOR}" ]; then
        # Fallback: tolerant scan across the whole sys/auth body.
        OIDC_ACCESSOR="$(bao_get sys/auth | tr ',' '\n' | grep -A20 '"oidc/"' | sed -n 's/.*"accessor":"\(auth_oidc_[^"]*\)".*/\1/p' | head -1)"
      fi
      if [ -z "${OIDC_ACCESSOR}" ]; then
        log "WARN: could not resolve oidc auth mount accessor; admin-group mapping deferred to next tick"
      else
        map_admin_group() {
          # $1 = realm group name (claim value)
          _grp="$1"
          # Idempotent create/update of the external group with the admin policy.
          _gjson="$(bao_get "identity/group/name/${_grp}")"
          _gid="$(printf '%s' "${_gjson}" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')"
          if [ -z "${_gid}" ]; then
            bao_write "identity/group" "$(printf '{"name":"%s","type":"external","policies":["sso-operator-admin"]}' "${_grp}")" || return 1
            _gid="$(bao_get "identity/group/name/${_grp}" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')"
          else
            bao_write "identity/group/name/${_grp}" '{"type":"external","policies":["sso-operator-admin"]}' || return 1
          fi
          [ -z "${_gid}" ] && return 1
          # Idempotent alias: name == claim value, bound to this oidc mount.
          bao_write "identity/group-alias" "$(printf '{"name":"%s","mount_accessor":"%s","canonical_id":"%s"}' "${_grp}" "${OIDC_ACCESSOR}" "${_gid}")"
        }
        for g in "${OIDC_ADMIN_GROUP}" "${OIDC_OPS_GROUP}"; do
          if map_admin_group "${g}"; then
            log "external group ${g} → sso-operator-admin mapped"
          else
            log "WARN: mapping external group ${g} failed; retrying next tick"
          fi
        done
      fi

      log "tick complete — OIDC bootstrap converged"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-sso-configure
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-openbao
    app.kubernetes.io/name: openbao-sso-configure
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-sso-configure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-sso-configure
        catalyst.openova.io/blueprint: bp-openbao
      annotations:
        # Force re-roll when sso.sovereignFqdn or admin group change.
        checksum/sso-config: {{ printf "%s:%s:%s:%s:%s" (.Values.sso.sovereignFqdn | default "") (.Values.sso.adminGroup | default "") (.Values.sso.opsGroup | default "") (.Values.sso.viewerGroup | default "") (.Values.sso.clientId | default "openbao") | sha256sum }}
    spec:
      serviceAccountName: openbao-sso-configure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: harbor.openova.io/proxy-dockerhub/alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh"]
          args: ["/etc/openbao-sso/reconcile.sh"]
          env:
            - name: BAO_ADDR
              value: {{ $baoAddrSSO | quote }}
            - name: BAO_K8S_AUTH_PATH
              value: {{ .Values.autoUnseal.kubernetesAuth.mountPath | default "kubernetes" | quote }}
            - name: BAO_K8S_AUTH_ROLE
              value: "sso-configure"
            - name: OIDC_NAME
              value: "openova-sso"
            - name: OIDC_ADMIN_GROUP
              value: {{ .Values.sso.adminGroup | default "sovereign-admins" | quote }}
            # #3150 — every realm group a federated operator can carry must
            # be in the role's bound_claims or OpenBao rejects the callback
            # with "claim groups does not match any associated bound claim
            # values". sovereign-viewers is the realm `defaultGroups` value
            # stamped on EVERY PIN-federated user; sovereign-ops is the third
            # privileged group. admins/ops get the admin policy via external
            # identity-group mapping; viewers keep the read-only baseline.
            - name: OIDC_OPS_GROUP
              value: {{ .Values.sso.opsGroup | default "sovereign-ops" | quote }}
            - name: OIDC_VIEWER_GROUP
              value: {{ .Values.sso.viewerGroup | default "sovereign-viewers" | quote }}
            # OpenBao is served at `bao.<fqdn>` (clusters/_template/
            # bootstrap-kit/08-openbao.yaml sets gateway.host=bao.${SOVEREIGN_FQDN}).
            # `sso.sovereignFqdn` is the bare Sovereign FQDN, so the host prefix
            # MUST be `bao.`, NOT `openbao.` — the latter has no HTTPRoute (404)
            # and never matches the Keycloak `openbao` client's redirectUri
            # (https://bao.<fqdn>/ui/vault/auth/oidc/oidc/callback). With the
            # wrong host the OIDC callback's redirect_uri failed openbao's
            # allowed_redirect_uris check → silent SSO never completed. (#3150)
            - name: OIDC_ALLOWED_REDIRECT_URIS
              value: {{ printf "https://bao.%s/ui/vault/auth/oidc/oidc/callback http://localhost:8250/oidc/callback" (.Values.sso.sovereignFqdn | default "openbao.local") | quote }}
            - name: INTERVAL_SECONDS
              value: "60"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /etc/openbao-sso
              readOnly: true
            - name: sso-creds
              mountPath: /etc/sso-creds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: openbao-sso-configure
            defaultMode: 0555
        - name: sso-creds
          secret:
            secretName: openbao-sso-oidc-credentials
            optional: true
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
{{- end }}
