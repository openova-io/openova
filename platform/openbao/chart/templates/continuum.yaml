{{- /*
Catalyst DR contract for bp-openbao — the Continuum CR (#3492, the
openbao half of #3375).

Per docs/topology-matrix.md, bp-openbao = active-passive / switchover
mechanism `raft-transition`. The bp-continuum engine
(core/controllers/continuum) drives the region-kill promotion: on a kill
it runs the mechanism-agnostic steps (lease / drain-HTTP / flip-DNS /
audit) PLUS the raft-transition promote step. For OpenBao OSS that promote
step is a `peers.json` RECOVERY (NOT the Enterprise-only
`transition-to-primary`, which OSS does not have — openbao PR #996): the
RaftExecPromoter execs a peers.json rewrite naming ONLY the surviving
region-B node as a voter into <raftDataPath>/raft/peers.json, then restarts
the standby Pod; on restart raft reads peers.json and the survivor
self-elects as the sole writable leader (sequence.go step-6 via the
RaftExecPromoter). The cross-region stretched-raft (retry_join non-voter,
cross-region-raft-config.yaml) keeps region-B holding region-A's live KV so
the promotion has current data — no snapshot restore needed in the common
case. THIS Continuum CR tells the engine HOW to promote bp-openbao (the
mechanism) and WHERE (the standby Pod target + raft data dir).

🛑 Skip-render (per #402 — never `{{ fail }}`): the CR renders ONLY when
ALL THREE hold — `.Values.continuum.enabled=true`,
`.Values.snapshotReplication.role=secondary`, AND the `dr.openova.io/v1`
CRD is registered in the target cluster (`.Capabilities.APIVersions.Has`).
The Continuum CR describes promotion of the STANDBY → primary, so it belongs
on the standby (region-B) cluster; the active (region-A) cluster does not
host it. A default `helm template` is byte-identical to origin/main (gated
keys render nothing).

🛑 CRD-RACE GUARD (#3612 / #3568 — gold-standard pattern, cf bp-external-dns
/ #2988 / #3102 harbor-ESO `.Capabilities` guard): the
`continuums.dr.openova.io` CRD ships with bp-catalyst-platform
(products/catalyst/chart/crds/continuum.yaml, slot 13) — NOT with
bp-continuum (whose crds/ is intentionally empty). But slot 13 is
region-role=primary and is SUSPENDED on every secondary control plane
(`suspend: ${SECONDARY_HR_SUSPEND}`), so the Continuum CRD is NEVER
installed in region-B. Yet THIS CR renders on the SECONDARY
(role=secondary). Without the Capabilities guard, `helm install bp-openbao`
in region-B FAILS with `no matches for kind "Continuum" in version
"dr.openova.io/v1"` (verified live on hw145 region-b), cascading into
external-secrets-stores → sso-bridge / gitea / harbor / oidc-gate / newapi
/ powerdns-admin (all need openbao-backed secrets). The guard lets openbao
install WITHOUT the CR when the CRD is absent; the CR is added on the next
Flux reconcile if/when the CRD ever lands. NOTE: a `dependsOn
bp-catalyst-platform` is NOT a viable alternative — that dep is deliberately
suspended in region-B, so it would deadlock region-B openbao forever; the
Capabilities guard is the only correct fix.

The mechanism-agnostic lua-record / regions / hostnames blocks mirror the
shape the bp-cnpg-pair Continuum CR uses (the working reference) so the
flip-DNS step has a probe target + IP-set to write; per-Sovereign overlays
fill the real region names + IPs. (bp-cnpg-pair sidesteps this same race a
different way — it renders its CR only on the PRIMARY side, where the CRD is
present; openbao's DR contract genuinely belongs on the secondary, so it
needs the Capabilities guard instead.)
*/}}
{{- $c := .Values.continuum | default dict -}}
{{- $sr := .Values.snapshotReplication | default dict -}}
{{- $srRole := $sr.role | default "primary" -}}
{{- if and $c.enabled (eq $srRole "secondary") (.Capabilities.APIVersions.Has "dr.openova.io/v1") -}}
{{- $rt := $c.raftTransition | default dict -}}
{{- $lease := $c.leaseClient | default dict -}}
{{- $leaseCfg := $lease.config | default dict -}}
{{- $appHost := printf "bao.%s" ($c.pdmZone | default "") -}}
apiVersion: dr.openova.io/v1
kind: Continuum
metadata:
  name: {{ $c.name | default "cont-openbao" | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    catalyst.openova.io/blueprint: bp-openbao
    catalyst.openova.io/component: openbao-dr-continuum
    openova.io/application: openbao
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  applicationRef: openbao
  # primaryRegion = the ACTIVE region (dies in the kill); hotStandbyRegions =
  # this surviving region (promoted to primary by the raft-transition).
  primaryRegion: {{ $c.primaryRegion | quote }}
  hotStandbyRegions:
    - {{ $c.standbyRegion | quote }}
  rto: {{ printf "%ds" (int ($c.rtoSeconds | default 60)) | quote }}
  rpo: {{ printf "%ds" (int ($c.rpoSeconds | default 30)) | quote }}
  rtoSeconds: {{ int ($c.rtoSeconds | default 60) }}
  rpoSeconds: {{ int ($c.rpoSeconds | default 30) }}
  autoFailover: {{ $c.autoFailover | default false }}
  # ── #3492: raft-transition switchover mechanism (OSS peers.json recovery) ──
  # The engine dispatches the cordon + promote steps through the
  # RaftExecPromoter instead of the cnpg-pair cordon/replica-flip. The promote
  # step rewrites <raftDataPath>/raft/peers.json to name only the survivor as a
  # voter + restarts the Pod (OSS-correct; transition-to-primary is Enterprise).
  switchover:
    mechanism: raft-transition
    raftTransition:
      namespace: {{ .Release.Namespace | quote }}
      {{- if $rt.pod }}
      pod: {{ $rt.pod | quote }}
      {{- end }}
      podSelector: {{ $rt.podSelector | default "app.kubernetes.io/name=openbao" | quote }}
      container: {{ $rt.container | default "openbao" | quote }}
      # raftDataPath — the openbao raft store dir (upstream default
      # /openbao/data). peers.json recovery is written to <raftDataPath>/raft/.
      raftDataPath: {{ $rt.raftDataPath | default "/openbao/data" | quote }}
      {{- /* snapshotPath is the OPTIONAL last-resort restore for the
             degenerate non-stretched topology. Emitted ONLY when set — with
             cross-region stretched raft region-B already holds region-A's live
             KV, so the common case promotes from live state (no restore). */}}
      {{- with $rt.snapshotPath }}
      snapshotPath: {{ . | quote }}
      {{- end }}
      baoBinary: {{ $rt.baoBinary | default "bao" | quote }}
  pdmZone: {{ $c.pdmZone | quote }}
  leaseClient:
    kind: {{ $lease.kind | default "dns-quorum" | quote }}
    config:
      ttlSeconds: {{ int ($leaseCfg.ttlSeconds | default 30) }}
      renewSeconds: {{ int ($leaseCfg.renewSeconds | default 10) }}
      {{- with $leaseCfg.resolvers }}
      resolvers:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
  luaRecord:
    selector: ifurlup
    healthCheck:
      # OpenBao's unauthenticated health endpoint — a good liveness probe
      # target for the lua-record ifurlup selector.
      url: {{ printf "https://%s/v1/sys/health" $appHost | quote }}
      intervalSeconds: 5
      timeoutSeconds: 2
    hostnames:
      - {{ $appHost | quote }}
{{- end }}
