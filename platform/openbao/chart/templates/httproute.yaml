{{- /*
Catalyst HTTPRoute for OpenBao — bp-openbao (issue #387, Cilium Gateway
API migration). Exposes the OpenBao UI/API at bao.<sovereign-fqdn>.

The upstream openbao chart does not ship its own ingress template — UI
exposure is the operator's responsibility. This template provides it
through the per-Sovereign Cilium Gateway.

Backend reference: the upstream openbao chart's primary Service is
named per its `openbao.fullname` helper — when `.Release.Name` already
contains the chart name `openbao` (as with releaseName=openbao), the
helper returns just `.Release.Name`, so the Service ends up as `openbao`.
Only when the release name does NOT contain `openbao` does the Service
get the `<release>-openbao` form. We replicate that logic so the default
backend always matches the live Service.
*/}}
{{- if and .Values.gateway .Values.gateway.enabled -}}
{{- if .Values.gateway.host }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.gateway.name | default "openbao" | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-openbao
    catalyst.openova.io/component: openbao
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentRef.name | default "cilium-gateway" | quote }}
      namespace: {{ .Values.gateway.parentRef.namespace | default "kube-system" | quote }}
      {{- with .Values.gateway.parentRef.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
{{- if and .Values.sso .Values.sso.enabled .Values.sso.bareURL .Values.sso.bareURL.enabled }}
{{- $landingPath := .Values.sso.bareURL.landingPath | default "/sso/landing" }}
{{- /*
BARE-URL zero-click SSO (#3374, openbao-bare-url-landing). The contract:
typing bao.<fqdn>/ or bao.<fqdn>/ui/ in a fresh browser lands the operator
signed in — no token form.

ROOT CAUSE the prior shim never escaped (measured live hw133 2026-06-14):
OpenBao's Vault-UI (Ember) OIDC login is POPUP-ONLY — its callback route
does an UNCONDITIONAL `window.opener.postMessage(...)` with no null-check
and no in-page completion. The #3226 catalyst-api shim 302'd the WHOLE
browser tab into that callback, so `window.opener` was null and the bare
URL rendered the Ember error "Cannot read properties of null (reading
'postMessage')". A server-side full-page redirect into a popup-only
callback can NEVER land signed-in.

THE FIX: the bare paths redirect to /sso/landing — a tiny static page
served on THIS origin (templates/sso-landing.yaml) that runs the OIDC
round-trip as a TOP-LEVEL window (auth_url -> Keycloak silent -> back to
/sso/landing?code -> GET oidc/callback -> reconstruct the Vault-UI token in
localStorage -> /ui/vault/secrets). No popup, no window.opener, no
catalyst-api dependency (the redirect target is same-host, immune to a
mothership/catalyst-api roll-storm).

Loop-safety (the pdns-admin 0.1.11 lesson, #3353):
  - ONLY Exact `/`, `/ui`, `/ui/` are intercepted -> 302 to /sso/landing.
  - /sso/landing is its OWN PathPrefix backend (the static page), NOT a
    Vault UI route — never re-matched by the bare-path Exact rules.
  - The landing page short-circuits to /ui/vault/secrets when a valid
    token already exists (idempotent re-entry).
  - The OIDC callback /ui/vault/auth/oidc/oidc/callback and the post-login
    /ui/vault/secrets are NOT matched here (PathPrefix `/` backend serves
    them straight to OpenBao).
  - API clients use /v1/* — served by the `/` backend, never redirected.
Port is explicit 443 (the #3310 listener-port-leak class).
*/}}
    # The landing page itself (served by the openbao-sso-landing nginx).
    - matches:
        - path:
            type: PathPrefix
            value: {{ $landingPath | quote }}
      backendRefs:
        - name: openbao-sso-landing
          port: 80
{{- range $entry := list "/" "/ui" "/ui/" }}
    - matches:
        - path:
            type: Exact
            value: {{ $entry | quote }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ $.Values.gateway.host | quote }}
            port: 443
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ $landingPath | quote }}
            statusCode: 302
{{- end }}
{{- end }}
{{- /*
SEC-010: the OpenBao system paths are not served on the public route.
These prefixes lead to root-token generation, unseal, seal, init, rekey,
step-down, raw storage, key rotation, profiling, audit devices, server
configuration and replication. Each request to one of them is answered by
the gateway with a 302 to /ui/ on this host and reaches no backend. The
rules sit outside the bare-URL sign-in block, so they hold with it on and
off; they use the literal path "/ui/" because $landingPath exists only
inside that block. A PathPrefix matches whole path segments: /v1/sys/seal
does not match /v1/sys/seal-status, which the last rule still serves.
The catch-all rule of gateway.path stays the last rule.
*/}}
    - matches:
{{- range $prefix := list "/v1/sys/generate-root" "/v1/sys/generate-recovery-token" "/v1/sys/unseal" "/v1/sys/seal" "/v1/sys/init" "/v1/sys/rekey" "/v1/sys/rekey-recovery-key" "/v1/sys/step-down" }}
        - path:
            type: PathPrefix
            value: {{ $prefix | quote }}
{{- end }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ .Values.gateway.host | quote }}
            port: 443
            path:
              type: ReplaceFullPath
              replaceFullPath: "/ui/"
            statusCode: 302
    - matches:
{{- range $prefix := list "/v1/sys/raw" "/v1/sys/storage" "/v1/sys/rotate" "/v1/sys/pprof" "/v1/sys/audit" "/v1/sys/config" "/v1/sys/replication" }}
        - path:
            type: PathPrefix
            value: {{ $prefix | quote }}
{{- end }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ .Values.gateway.host | quote }}
            port: 443
            path:
              type: ReplaceFullPath
              replaceFullPath: "/ui/"
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.path | default "/" | quote }}
      backendRefs:
        - name: {{ .Values.gateway.backendService | default (ternary .Release.Name (printf "%s-openbao" .Release.Name) (contains "openbao" .Release.Name)) | quote }}
          port: {{ .Values.gateway.backendPort | default 8200 }}
{{- end }}
{{- end }}
