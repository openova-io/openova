apiVersion: v2
name: bp-openbao
# 1.2.26 (#3150, 2026-06-09): two sso-configure-deployment.yaml fixes that
# together defeated openbao silent SSO.
#   (a) BAO_ADDR hardcoded `<release>-openbao` → with spec.releaseName=openbao
#       the upstream fullname is just `openbao`, so `openbao-openbao.<ns>.svc`
#       was NXDOMAIN and the reconciler never reached the server → the oidc
#       auth method was never configured. Now consumes the same
#       `autoUnseal.baoAddress` override the auth-bootstrap Job uses.
#   (b) OIDC role allowed_redirect_uris hardcoded `openbao.<fqdn>` but OpenBao
#       is served at `bao.<fqdn>` (08-openbao.yaml gateway.host); the wrong
#       host had no HTTPRoute (404) and never matched the Keycloak `openbao`
#       client's redirectUri, so the OIDC callback's redirect_uri failed the
#       allowed_redirect_uris check. Now `bao.<fqdn>`.
# 1.2.23 (G117.5 #2744, 2026-06-02): SSO Tier-1 codification companion
# bump. Adds `sso.idpHint` value documenting that OpenBao's OIDC backend
# does NOT expose an `auth_url` query-param knob (per upstream
# builtin/credential/jwt/path_oidc.go createOIDCRequest); silent SSO via
# catalyst-pin is therefore delivered EXCLUSIVELY by the realm-config
# IDR `defaultProvider` binding shipped in bp-keycloak 1.4.9+. No
# behavioural change to the sso-configure Deployment loop. Bump is for
# value-schema parity with the other Tier-1 charts (bp-grafana,
# bp-gitea, bp-harbor) so per-Sovereign overlays can override the hint
# uniformly. Refs #2744.
# 1.2.17 (Fix #1902, TBD-A40, 2026-05-19): omit HTTPRoute parentRef
# sectionName by default — multi-zone Sovereigns rename HTTPS listeners
# to https-<sanitised-zone>, breaking NoMatchingListener with the prior
# pinned sectionName: https. Matches the catalyst-system fix in PR #1888.
# 1.2.38 — Refs #3373 Batch A (2026-06-14): bp-seaweedfs moved INTO the rtz
# vCluster; rewire the snapshot-replication s3 endpoint DEFAULT to the
# syncer-mangled host Service name. snapshotReplication is default-OFF, so the
# single-region render is byte-identical (the default applies only when enabled).
version: 1.2.38
# 1.2.37 (#3374, 2026-06-14): fix the sso-landing nginx ImagePullBackOff. The
# image was `harbor.openova.io/proxy-docker/library/nginx` but the live Harbor
# DockerHub proxy-cache project is `proxy-dockerhub` (proxy-docker does NOT
# exist → 401 Unauthorized on the manifest HEAD, landing pod ImagePullBackOff
# — measured on hw133). Corrected to proxy-dockerhub/library/nginx (the same
# convention the rest of the chart + every other bp-* uses; verified it pulls
# live). The kyverno `*/proxy-*/*` glob accepted both, which is why the render
# test passed — the project-existence is a runtime fact, not a glob fact.
# 1.2.36 (#3374, 2026-06-14): the 1.2.35 Blueprint-Release publish FAILED at
# the chart-integration-test step — tests/sso-landing-render.sh Case 4 piped
# the whole helm render into `grep -q`, which exits early and SIGPIPEs the
# producer ("printf: write error: Broken pipe") → under `set -o pipefail` the
# pipeline returned non-zero → 1.2.35 never reached the OCI registry, so the
# landing fix never reconciled. Rewrote every assertion to pipe-free bash
# substring matching (`case`/helper) so no large-input-into-grep-q exists;
# stress-ran 5x clean. Chart content is identical to 1.2.35 (the landing fix);
# this is a test/publish-unblock bump only.
# 1.2.35 (#3374, 2026-06-14): TRUE zero-click bare-URL — kill the popup-only
# OIDC-callback postMessage error. OpenBao's Vault-UI OIDC login is POPUP-ONLY
# (the callback route does an UNCONDITIONAL window.opener.postMessage with no
# null-check + no in-page completion). The #3226 catalyst-api shim 302'd the
# WHOLE browser tab into that callback → window.opener null → every bare-URL
# visit rendered "Cannot read properties of null (reading 'postMessage')"
# (measured live hw133 2026-06-14; the native popup login WORKED, proving the
# wire/policy were fine). Replaced the shim redirect with an on-origin landing
# page (templates/sso-landing.yaml): bare /, /ui, /ui/ now 302 to /sso/landing
# (SAME host — no catalyst-api dependency, immune to a mothership roll-storm),
# which runs the OIDC round-trip as a TOP-LEVEL window (auth_url → Keycloak
# silent via catalyst-pin → back to /sso/landing?code → GET oidc/callback →
# reconstruct the Vault-UI token in localStorage → /ui/vault/secrets). Added
# the landing redirect_uri to the OIDC role allowed_redirect_uris (KC client
# already allows it via `/*`). tests/sso-landing-render.sh pins the route +
# the captured localStorage shape so a future UI bump cannot silently regress.
# 1.2.34 (#3374, 2026-06-13): the openbao-sso-configure Deployment now rolls
# when reconcile.sh changes. The reconcile loop lives in a ConfigMap, so a
# SCRIPT change left the Pod template byte-identical → helm upgrade did NOT
# restart the pod → the running reconciler kept the STALE mounted ConfigMap
# (the 1.2.32/1.2.33 idempotency fix landed in the ConfigMap but the live
# pod never picked it up, so the false per-tick WARN persisted on hw133).
# Added a `checksum/reconcile-script: sha256(.Chart.Version)` Pod annotation —
# every chart bump (and the script-lockstep rule means a script change always
# bumps the chart) now forces the Deployment to roll onto the new script.
# 1.2.33 (#3374, 2026-06-13): the three openbao Job/CronJob templates
# (init-job, auth-bootstrap-job post-upgrade hooks + the snapshot-replication
# CronJob) now carry `app.kubernetes.io/managed-by: flux`. The kyverno
# `flux-managed` Enforce policy (baseline 10-flux-managed) gates Job + CronJob
# in the openbao namespace (NOT on its exclude list) and DENIES any without
# that label. Helm hook Jobs are created by the helm-controller, not Flux, so
# the FIRST chart roll on a converged Enforce env (hw133) failed the
# post-upgrade init-job hook → the HR rolled the 1.2.32 upgrade back to 1.2.31
# every attempt → the sso-configure idempotency fix never reached the cluster.
# Same landmine class as the gitea/harbor hook Jobs (#3296→#3297).
# 1.2.32 (#3374, 2026-06-13): sso-configure external identity-group mapping
# is now FULLY idempotent. The reconciler created each sovereign-admins /
# sovereign-ops → sso-operator-admin alias via POST identity/group-alias,
# which Vault 400s ("alias already exists") on EVERY tick after the first —
# so the loop logged "WARN: mapping external group … failed" forever even
# though tick-1 had bound it (verified live on hw133). Two fixes: (a) parse
# the canonical group id from data.canonical_id (not a greedy "id" match
# that could grab the alias sub-object's id and corrupt the binding); (b) on
# subsequent ticks UPDATE the existing alias via
# identity/group-alias/id/<alias_id> instead of re-creating it. The admin
# uplift was already live (tick-1 succeeded), but the false per-tick WARN
# masked genuine failures and the greedy id parse was a latent rebind hazard.
# 1.2.29 (#3374, 2026-06-13): BARE-URL zero-click SSO. The #3226 shim only
# fired from the console Open button; typing bao.<fqdn>/ui/ still showed the
# token form (founder-witnessed). The HTTPRoute now 302s the bare entry paths
# (Exact /, /ui, /ui/) to catalyst-api's openbao-sso-init shim with explicit
# port 443 (#3310 class) and an explicit hostname rewrite to api.<fqdn>.
# Loop-safe by construction (the pdns-admin 0.1.11 lesson): the shim's
# fallback (/ui/vault/auth?with=oidc), the OIDC callback
# (/ui/vault/auth/oidc/oidc/callback) and the post-login landing
# (/ui/vault/secrets) are all non-matching paths. Companion change:
# sso-configure tunes the oidc mount listing_visibility=unauth so a degraded
# shim falls back to a form that preselects OIDC, not Token. Gated on
# sso.bareURL.enabled (default true — the bare URL IS the #3374 contract).
# 1.2.28 (#3226, 2026-06-10): zero-click silent-SSO parity with grafana/harbor.
# blueprint.yaml endpoint declares ssoShim:true so catalyst-api's launch-url
# returns the server-side OpenBao SSO-init shim URL instead of the SPA
# deep-link. The shim asks Vault for the OIDC auth_url server-side and 302s the
# browser to Keycloak (silent PIN) → Vault callback → landed signed-in. No
# chart-template change; version bumped in lockstep with blueprint.yaml + the
# bootstrap-kit slot pin so the new blueprint OCI artifact publishes.
# 1.2.27 (#3150, 2026-06-10): OIDC callback now LANDS the operator logged-in.
# sso-configure reconciler: (1) bound_claims.groups widened to sovereign-admins
# + sovereign-ops + sovereign-viewers (the realm stamps defaultGroups
# /sovereign-viewers on EVERY federated operator → the prior admin-only
# bound_claim rejected the callback with "claim groups does not match any
# associated bound claim values"); (2) external identity-group aliases map
# admins/ops → sso-operator-admin and viewers → sso-operator-read (read-only
# baseline) so widening bound_claims does NOT over-grant.
# 1.2.20 (G91.openbao #2655, 2026-05-31): opt in to the bp-sso-bridge
# (G91.1 #2652) SSO framework. Top-level `sso:` block (defaults
# enabled=true). Adds: templates/sso-oauth-source-externalsecret.yaml
# (ExternalSecret reading bp-sso-bridge's OpenBao `secret/sso/openbao`
# bundle), templates/sso-configure-deployment.yaml (continuous
# Deployment reconciler that enables oidc auth + writes auth/oidc/config
# + sso-operator-admin policy + auth/oidc/role/operator using K8s SA
# auth via the new sso-configure role), and extends
# templates/auth-bootstrap-job.yaml to also create sso-bridge-write
# policy + sso-bridge K8s role (so bp-sso-bridge can write
# secret/sso/<clientId>) and sso-configure-admin policy +
# sso-configure K8s role.
# Per SECURITY.md §6.3 (App-level SSO).
description: |
  Catalyst-curated Blueprint umbrella chart for OpenBao. Depends on the
  upstream `openbao` chart as a Helm subchart so `helm dependency build`
  pulls the upstream payload into this artifact; the Catalyst overlay
  templates in templates/ (NetworkPolicy, ExternalSecret, ServiceMonitor)
  sit alongside the upstream subchart and Helm renders both at install
  time. Catalyst-curated values flow into the upstream subchart under the
  `openbao:` key in values.yaml.
type: application
keywords: [catalyst, blueprint, openbao]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a Helm subchart so `helm dependency build`
# bundles it into the OCI artifact. Pinned to openbao/openbao 0.16.0
# (matches platform/openbao/blueprint.yaml + values.yaml
# `catalystBlueprint.upstream.version`). Per
# docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the version is
# operator-bumpable via PR + Blueprint release.
dependencies:
  - name: openbao
    version: "0.16.0"
    repository: "https://openbao.github.io/openbao-helm"
