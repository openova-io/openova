apiVersion: v2
name: bp-openbao
# 1.2.26 (#3150, 2026-06-09): two sso-configure-deployment.yaml fixes that
# together defeated openbao silent SSO.
#   (a) BAO_ADDR hardcoded `<release>-openbao` → with spec.releaseName=openbao
#       the upstream fullname is just `openbao`, so `openbao-openbao.<ns>.svc`
#       was NXDOMAIN and the reconciler never reached the server → the oidc
#       auth method was never configured. Now consumes the same
#       `autoUnseal.baoAddress` override the auth-bootstrap Job uses.
#   (b) OIDC role allowed_redirect_uris hardcoded `openbao.<fqdn>` but OpenBao
#       is served at `bao.<fqdn>` (08-openbao.yaml gateway.host); the wrong
#       host had no HTTPRoute (404) and never matched the Keycloak `openbao`
#       client's redirectUri, so the OIDC callback's redirect_uri failed the
#       allowed_redirect_uris check. Now `bao.<fqdn>`.
# 1.2.23 (G117.5 #2744, 2026-06-02): SSO Tier-1 codification companion
# bump. Adds `sso.idpHint` value documenting that OpenBao's OIDC backend
# does NOT expose an `auth_url` query-param knob (per upstream
# builtin/credential/jwt/path_oidc.go createOIDCRequest); silent SSO via
# catalyst-pin is therefore delivered EXCLUSIVELY by the realm-config
# IDR `defaultProvider` binding shipped in bp-keycloak 1.4.9+. No
# behavioural change to the sso-configure Deployment loop. Bump is for
# value-schema parity with the other Tier-1 charts (bp-grafana,
# bp-gitea, bp-harbor) so per-Sovereign overlays can override the hint
# uniformly. Refs #2744.
# 1.2.17 (Fix #1902, TBD-A40, 2026-05-19): omit HTTPRoute parentRef
# sectionName by default — multi-zone Sovereigns rename HTTPS listeners
# to https-<sanitised-zone>, breaking NoMatchingListener with the prior
# pinned sectionName: https. Matches the catalyst-system fix in PR #1888.
version: 1.2.27
# 1.2.27 (#3150, 2026-06-10): OIDC callback now LANDS the operator logged-in.
# sso-configure reconciler: (1) bound_claims.groups widened to sovereign-admins
# + sovereign-ops + sovereign-viewers (the realm stamps defaultGroups
# /sovereign-viewers on EVERY federated operator → the prior admin-only
# bound_claim rejected the callback with "claim groups does not match any
# associated bound claim values"); (2) external identity-group aliases map
# admins/ops → sso-operator-admin and viewers → sso-operator-read (read-only
# baseline) so widening bound_claims does NOT over-grant.
# 1.2.20 (G91.openbao #2655, 2026-05-31): opt in to the bp-sso-bridge
# (G91.1 #2652) SSO framework. Top-level `sso:` block (defaults
# enabled=true). Adds: templates/sso-oauth-source-externalsecret.yaml
# (ExternalSecret reading bp-sso-bridge's OpenBao `secret/sso/openbao`
# bundle), templates/sso-configure-deployment.yaml (continuous
# Deployment reconciler that enables oidc auth + writes auth/oidc/config
# + sso-operator-admin policy + auth/oidc/role/operator using K8s SA
# auth via the new sso-configure role), and extends
# templates/auth-bootstrap-job.yaml to also create sso-bridge-write
# policy + sso-bridge K8s role (so bp-sso-bridge can write
# secret/sso/<clientId>) and sso-configure-admin policy +
# sso-configure K8s role.
# Per SECURITY.md §6.3 (App-level SSO).
description: |
  Catalyst-curated Blueprint umbrella chart for OpenBao. Depends on the
  upstream `openbao` chart as a Helm subchart so `helm dependency build`
  pulls the upstream payload into this artifact; the Catalyst overlay
  templates in templates/ (NetworkPolicy, ExternalSecret, ServiceMonitor)
  sit alongside the upstream subchart and Helm renders both at install
  time. Catalyst-curated values flow into the upstream subchart under the
  `openbao:` key in values.yaml.
type: application
keywords: [catalyst, blueprint, openbao]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a Helm subchart so `helm dependency build`
# bundles it into the OCI artifact. Pinned to openbao/openbao 0.16.0
# (matches platform/openbao/blueprint.yaml + values.yaml
# `catalystBlueprint.upstream.version`). Per
# docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the version is
# operator-bumpable via PR + Blueprint release.
dependencies:
  - name: openbao
    version: "0.16.0"
    repository: "https://openbao.github.io/openbao-helm"
