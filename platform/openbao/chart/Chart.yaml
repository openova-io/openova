apiVersion: v2
name: bp-openbao
# 1.2.60 (#4879, 2026-07-09): snapshot-FETCH robustness — the secondary's
# openbao-snapshot-fetch CronJob ran `s3api list-objects-v2` under `set -eu`,
# so a NoSuchBucket error (the local seaweedfs `openbao-snapshots` bucket not
# yet created — the primary creates it on its first successful ship) aborted
# the whole Job every tick (hard CronJob failure). Now a missing bucket is
# caught and treated like the already-handled EMPTY-bucket case: WARN + exit 0
# (a skipped tick, not a failure). Real list errors still abort loudly. The
# cross-region-replication half (seeding the bucket from region-A) is a larger
# separate change, deferred.
# 1.2.53 (#4343, 2026-06-25): set `injector.resources.requests` (cpu/memory)
# so the agent-injector Deployment satisfies the cluster-wide Kyverno
# `resource-requests` Enforce policy. Post-#4325 this chart installs into the
# native host namespace (not a vCluster) where the policy applies; the
# upstream injector defaults to empty resources → InstallFailed without this.
# 1.2.26 (#3150, 2026-06-09): two sso-configure-deployment.yaml fixes that
# together defeated openbao silent SSO.
#   (a) BAO_ADDR hardcoded `<release>-openbao` → with spec.releaseName=openbao
#       the upstream fullname is just `openbao`, so `openbao-openbao.<ns>.svc`
#       was NXDOMAIN and the reconciler never reached the server → the oidc
#       auth method was never configured. Now consumes the same
#       `autoUnseal.baoAddress` override the auth-bootstrap Job uses.
#   (b) OIDC role allowed_redirect_uris hardcoded `openbao.<fqdn>` but OpenBao
#       is served at `bao.<fqdn>` (08-openbao.yaml gateway.host); the wrong
#       host had no HTTPRoute (404) and never matched the Keycloak `openbao`
#       client's redirectUri, so the OIDC callback's redirect_uri failed the
#       allowed_redirect_uris check. Now `bao.<fqdn>`.
# 1.2.23 (G117.5 #2744, 2026-06-02): SSO Tier-1 codification companion
# bump. Adds `sso.idpHint` value documenting that OpenBao's OIDC backend
# does NOT expose an `auth_url` query-param knob (per upstream
# builtin/credential/jwt/path_oidc.go createOIDCRequest); silent SSO via
# catalyst-pin is therefore delivered EXCLUSIVELY by the realm-config
# IDR `defaultProvider` binding shipped in bp-keycloak 1.4.9+. No
# behavioural change to the sso-configure Deployment loop. Bump is for
# value-schema parity with the other Tier-1 charts (bp-grafana,
# bp-gitea, bp-harbor) so per-Sovereign overlays can override the hint
# uniformly. Refs #2744.
# 1.2.17 (Fix #1902, TBD-A40, 2026-05-19): omit HTTPRoute parentRef
# sectionName by default — multi-zone Sovereigns rename HTTPS listeners
# to https-<sanitised-zone>, breaking NoMatchingListener with the prior
# pinned sectionName: https. Matches the catalyst-system fix in PR #1888.
# 1.2.39 — Refs #3374 (2026-06-14): the 1.2.38 OCI publish NEVER landed on
# ghcr — its Blueprint Release run (commit 3d8042122, PR #3477) FAILED at the
# snapshot-replication-toggle.sh integration-test gate. #3477 rewired the s3
# endpoint default to the rtz-vCluster synced Service name but did NOT update
# the test's two endpoint assertions in lockstep, so Case 2 failed the render
# check and the helm-push to GHCR never ran → bp-openbao:1.2.38 = "chart pull
# error: not found" on every Sovereign + fresh prov. Test assertions corrected;
# version bumped so CI publishes a passing artifact. No chart-behaviour change.
# 1.2.38 — Refs #3373 Batch A (2026-06-14): bp-seaweedfs moved INTO the rtz
# vCluster; rewire the snapshot-replication s3 endpoint DEFAULT to the
# syncer-mangled host Service name. snapshotReplication is default-OFF, so the
# single-region render is byte-identical (the default applies only when enabled).
# NOTE: 1.2.38 was never published to ghcr (see 1.2.39 above).
# 1.2.41 (#3492, 2026-06-15): CORRECT the cross-region DR to the real OpenBao
# OSS mechanism. The 1.2.40 design (snapshot-restore + `transition-to-primary`)
# could not actually work: `transition-to-primary` does NOT exist in OpenBao
# OSS (only promote/demote voter-state, useless when all voters are dead —
# openbao PR #996), and a cross-cluster snapshot-restore onto an independently
# Shamir-initialised region-B yields undecryptable data (different barrier key)
# at only RPO=snapshot-interval. The OSS-correct mechanism (openbao discussion
# #1842) is a single STRETCHED RAFT cluster: region-B joins region-A as a
# NON-VOTER via retry_join + retry_join_as_non_voter=true (so it holds
# region-A's LIVE KV, RPO≈0, sharing region-A's barrier key over the same
# Cilium ClusterMesh bp-cnpg-pair uses). Adds: a top-level `crossRegion` block
# + templates/_helpers.tpl `openbao.crossRegionRaftConfig` (the retry_join
# non-voter raft.config) + templates/cross-region-raft-config.yaml (renders it
# into a ConfigMap on the secondary) + templates/cross-region-mesh-service.yaml
# (the ClusterMesh-global Service region-B's retry_join resolves, mirroring
# bp-cnpg-pair's replica-mesh-service). The Continuum CR's promote step is now
# OSS peers.json RECOVERY (raftTransition.raftDataPath; bp-continuum rewrites
# <raftDataPath>/raft/peers.json + restarts the survivor Pod) — NOT
# transition-to-primary; snapshotPath demoted to an OPTIONAL non-stretched
# fallback (default empty → promote from live replicated state). All
# crossRegion + snapshot + continuum keys default-OFF, so the single-region
# render stays byte-identical. tests/cross-region-render.sh added;
# tests/continuum-render.sh updated to the peers.json/raftDataPath shape.
# 1.2.40 (#3492, 2026-06-14): ship the openbao DR contract — a Continuum CR
# (templates/continuum.yaml) declaring switchover.mechanism=raft-transition +
# the standby Pod target so the bp-continuum engine can promote bp-openbao on
# a region-kill. (Mechanism corrected in 1.2.41 — transition-to-primary is not
# an OSS command; the design was unbuildable as written.)
# Skip-render gated on continuum.enabled=true AND snapshotReplication.role=
# secondary, so the default single-region render is byte-identical.
# 1.2.42 (Refs #3562 #3373, 2026-06-15): FIX the install-wedging orphan
# namespace. snapshot-replication.yaml defaulted the S3-creds Role/RoleBinding
# namespace ($credNs) to `seaweedfs`, but #3373 Batch A (#3477) re-homed
# bp-seaweedfs INTO the rtz vCluster, so the host `seaweedfs` namespace no
# longer exists → `helm install bp-openbao` FAILED with `namespaces
# "seaweedfs" not found` (×2), wedging the whole convergence chain
# (openbao→sso-bridge→gitea→catalyst-platform→console 000) on hw144. The
# CronJob already consumes the creds via secretKeyRef, which K8s resolves ONLY
# in the Pod's OWN (release) namespace — so the Secret + its RBAC belong there,
# never in seaweedfs. $credNs default flipped to .Release.Namespace
# (values credentialsSecret.namespace: "" → release ns); the reflected/seeded
# seaweedfs-s3-secret lands in the openbao ns (same bridge bp-gitea + catalyst
# qa-fixtures use). snapshotReplication stays default-OFF so the single-region
# render is byte-identical; the only enabled-path change is the RBAC namespace.
# tests/snapshot-replication-toggle.sh Case 2 gains a no-orphan-namespace +
# Role-present assertion. No upstream subchart change.
# 1.2.43 (#3612 / #3568, 2026-06-16): Capabilities-guard the Continuum CR so
# `helm install bp-openbao` no longer FAILS in the SECONDARY region of a
# 2-region prov. templates/continuum.yaml renders the `cont-openbao`
# Continuum CR (dr.openova.io/v1) when continuum.enabled=true AND
# snapshotReplication.role=secondary — i.e. ON the standby (region-B). But the
# `continuums.dr.openova.io` CRD ships ONLY with bp-catalyst-platform
# (products/catalyst/chart/crds/continuum.yaml, slot 13) — NOT with
# bp-continuum (its crds/ is intentionally empty) — and slot 13 is
# region-role=primary + SUSPENDED on every secondary CP (SECONDARY_HR_SUSPEND),
# so the CRD is NEVER installed in region-B. Result on hw145 region-b: `helm
# install bp-openbao` failed `no matches for kind "Continuum" in version
# "dr.openova.io/v1"`, cascading into external-secrets-stores → sso-bridge /
# gitea / harbor / oidc-gate / newapi / powerdns-admin. The render is now
# gated on `.Capabilities.APIVersions.Has "dr.openova.io/v1"` (gold-standard
# CRD-race pattern, cf bp-external-dns / #2988 / #3102): openbao installs
# WITHOUT the CR when the CRD is absent; the CR is added on the next Flux
# reconcile if/when the CRD lands. A `dependsOn bp-catalyst-platform` was NOT
# used — that dep is deliberately suspended in region-B and would deadlock
# region-B openbao forever; the Capabilities guard is the only correct fix.
# Default + single-region render stays byte-identical (the gated keys still
# render nothing). tests/continuum-render.sh Case 3 now passes
# `--api-versions dr.openova.io/v1`; new Case 4 proves the guard skips the CR
# (no install failure) when the CRD is absent. No upstream subchart change.
# 1.2.47 (#3687, extends #3370): bootstrap self-registration —
# templates/application-cr.yaml renders the canonical apps.openova.io/v1
# Application CR for the slot-08 HelmRelease (gated bootstrapOwned.enabled
