# Catalyst Blueprint umbrella metadata — the upstream chart is now resolved
# as a Helm subchart via Chart.yaml `dependencies:`. This values.yaml carries
# both:
#   1. The catalystBlueprint metadata block (provenance + version) so
#      observability/audit pipelines can inspect the artifact and report
#      which upstream chart + version is bundled.
#   2. The upstream subchart values overlay under the `openbao:` key
#      (umbrella-chart convention — the dependency name from Chart.yaml is
#      the values namespace).

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). When non-empty, the
  # init-job.yaml and auth-bootstrap-job.yaml templates prepend this value
  # to autoUnseal.image.repository. Tracked under #560.
  imageRegistry: ""

catalystBlueprint:
  upstream: { chart: openbao, version: "0.16.0", repo: "https://openbao.github.io/openbao-helm" }

# ─── Upstream chart values (subchart key: openbao) ────────────────────────
# Generated by docs/PROVISIONING-PLAN.md tickets [F] chart Pass 105+.
openbao:
  server:
    # #3375 — proxy-glob the server StatefulSet image through the local
    # Harbor (kyverno `harbor-proxy-pull` Enforce admits only `*/proxy-*/*`
    # or `*/openova-io/*`). The subchart defaults to `quay.io/openbao/openbao`,
    # which is denied on the next chart-roll of a converged Enforce env —
    # the same landmine that wedges the injector. Mirror the harbor chart's
    # proxy convention. (The currently-running server pod predates the
    # Enforce tightening; this guards the next roll.)
    image:
      registry: harbor.openova.io
      repository: proxy-quay/openbao/openbao
    ha:
      enabled: true
      replicas: 3
      raft:
        enabled: true
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }
    # #4347 — ENABLE the server livenessProbe. The upstream openbao subchart
    # ships `server.readinessProbe.enabled: true` but `server.livenessProbe.
    # enabled: false` (liveness off by default), so the rendered StatefulSet had
    # a readinessProbe but NO livenessProbe → the host-ns Kyverno
    # `probes-present` Enforce ClusterPolicy (which requires BOTH on every
    # container, after #4325 re-homed bp-openbao into a native host namespace)
    # would DENY the StatefulSet on its next roll. Enable the httpGet liveness
    # against /v1/sys/health with SEALED-TOLERANT query codes: a sealed /
    # uninitialized / standby node returns 204 (success) so kubelet does NOT
    # kill a healthy-but-sealed Pod (sealing needs an unseal, not a restart) —
    # this is exactly why upstream defaults it off; the codes make it safe to
    # turn on. Initial delay is generous so raft bootstrap + auto-unseal settle
    # before liveness starts checking.
    livenessProbe:
      enabled: true
      path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204&drsecondarycode=204&performancestandbycode=204"
      port: 8200
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 5
      successThreshold: 1
    dataStorage:
      size: 10Gi
  ui:
    enabled: true
  # Injector metrics endpoint — DEFAULT OFF.
  injector:
    metrics:
      enabled: false
    # #4343 — the agent-injector Deployment MUST declare resources.requests.
    # The upstream subchart defaults `injector.resources: {}` (empty), so the
    # injector container renders with NO requests. Pre-#4325 this chart ran
    # INSIDE a vCluster where the host's Kyverno `resource-requests` Enforce
    # ClusterPolicy didn't reach it; after the de-vcluster migration it
    # installs into the native host namespace and the first
    # `Deployment/openbao-agent-injector` admission is DENIED
    # (`requests-workload: Every container must declare resources.requests.cpu
    # and resources.requests.memory`), timing out the Helm install →
    # bp-openbao InstallFailed → wedges bp-external-secrets-stores →
    # bp-sso-bridge. Modest sidecar request (the injector is a lightweight
    # mutating-webhook controller).
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 128Mi }
    # #3375 — proxy-glob the agent-injector images through the Sovereign's
    # local Harbor so the kyverno `harbor-proxy-pull` Enforce policy admits
    # them. The upstream subchart defaults the injector to
    # `docker.io/hashicorp/vault-k8s` + the agent to `quay.io/openbao/openbao`
    # — raw registries that match NO allowed glob (`*/proxy-*/*` or
    # `*/openova-io/*`), so on a converged Enforce env the first chart-roll's
    # agent-injector ReplicaSet is DENIED, the Helm install times out and
    # rolls back, and the whole openbao→ESO→sso-bridge chain wedges (the
    # documented kyverno-roll landmine; harbor proved the same fix). Mirror
    # the harbor chart's `harbor.openova.io/proxy-dockerhub/...` convention.
    image:
      registry: harbor.openova.io
      repository: proxy-dockerhub/hashicorp/vault-k8s
    agentImage:
      registry: harbor.openova.io
      repository: proxy-quay/openbao/openbao
  # ServiceMonitor — DEFAULT OFF.
  #
  # Per docs/INVIOLABLE-PRINCIPLES.md #4 and docs/BLUEPRINT-AUTHORING.md
  # §11.2 (Observability toggles must default false). The upstream
  # openbao chart's `serviceMonitor.enabled` renders a
  # monitoring.coreos.com/v1 ServiceMonitor which the apiserver rejects
  # on a fresh Sovereign before bp-kube-prometheus-stack ships the CRD.
  # Upstream already defaults to false — set explicitly so a future
  # upstream bump cannot regress this. Operator opts in via per-cluster
  # overlay (issue #182).
  serviceMonitor:
    enabled: false

# ─── Catalyst HTTPRoute (Cilium Gateway API, issue #387) ──────────────────
# Exposes the OpenBao UI/API via Cilium Gateway. Per-Sovereign overlay
# supplies `gateway.host` (e.g. bao.<sovereign-fqdn>). parentRef defaults
# to cilium-gateway/kube-system, the per-Sovereign Gateway shipped by
# clusters/_template/bootstrap-kit/01-cilium.yaml.
gateway:
  enabled: true
  # host: bao.<sovereign-fqdn> — REQUIRED, no default per Inviolable Principle #4
  host: ""
  path: "/"
  # Backend Service — defaults to <release>-openbao (active-instance Service)
  backendService: ""
  backendPort: 8200
  parentRef:
    name: cilium-gateway
    namespace: kube-system
    # sectionName intentionally empty — multi-zone Sovereigns rename HTTPS
    # listeners to https-<sanitised-zone> (e.g. https-omani-works), so
    # pinning sectionName: https breaks NoMatchingListener. Cilium Gateway
    # matches by hostname filter. See PR #1888 / TBD-A40 / issue #1902.
    sectionName: ""

# ─── Auto-unseal flow (issue #316) ─────────────────────────────────────────
# Catalyst-curated post-install Job that runs `bao operator init` on a
# fresh OpenBao cluster, consuming a single-use recovery seed Secret
# created by cloud-init (see infra/hetzner/cloudinit-control-plane.tftpl
# `openbao-recovery-seed` block). The Job is idempotent — on a second run
# (e.g. helm upgrade) it sees `bao status` reporting Initialized=true and
# exits 0 without touching state.
#
# Default disabled so:
#   1. `helm template` with default values renders cleanly (no `fail` in
#      templates per #402 lesson — the with-values render path is opt-in
#      via `autoUnseal.enabled=true` rather than emit-and-fail).
#   2. Operators provisioning OpenBao OUTSIDE the cloud-init seed pipeline
#      (e.g. multi-region peer-transit unseal, air-gap operator-supplied
#      shards) can author their own init flow without this Job racing
#      them.
#
# Cluster overlay clusters/_template/bootstrap-kit/08-openbao.yaml flips
# `autoUnseal.enabled: true` per-Sovereign, after cloud-init has written
# the seed Secret.
autoUnseal:
  # Enable the post-install init Job. When false, NO init Job is rendered.
  enabled: false
  # K8s Secret created by cloud-init that carries the one-shot recovery
  # seed. The seed itself is generated on the control-plane node during
  # cloud-init (32 bytes from /dev/urandom) and written to this Secret in
  # the openbao namespace, with annotation
  # `openbao.openova.io/single-use: "true"`. The init Job reads it,
  # passes the bytes to `bao operator init -recovery-pgp-keys=…`, then
  # deletes the Secret on success.
  seedSecret:
    name: openbao-recovery-seed
    # Key inside the Secret's data field that holds the base64-encoded
    # recovery seed material.
    key: recovery-seed
  # Image used by the init Job — same upstream openbao image as the
  # StatefulSet, so the `bao` CLI is available without an extra layer.
  # Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) operator may
  # bump this to match a custom image.
  # #3375 — proxy-globbed through the local Harbor so kyverno's
  # harbor-proxy-pull Enforce policy admits the init Job's Pod on a
  # converged env (raw quay.io is denied → the init Job can't run →
  # openbao never initialises on a fresh roll).
  image:
    repository: harbor.openova.io/proxy-quay/openbao/openbao
    # Version pinned to match the upstream chart's openbao image. Bumped
    # together with catalystBlueprint.upstream.version.
    tag: "2.1.0"
    pullPolicy: IfNotPresent
  # Active-instance Service that the Job targets. Defaults to the
  # upstream chart's `<release>-openbao` Service (port 8200). Override
  # for non-default releaseName setups.
  baoAddress: ""
  # Job-level timeouts (seconds) — bounded so a stuck OpenBao doesn't
  # leave the Job pending indefinitely.
  activeDeadlineSeconds: 600
  backoffLimit: 6
  # ─── #5142/#5157 continuous unseal reconciler ─────────────────────────
  # The init Job above is a one-shot Helm post-install/upgrade hook: it
  # unseals at install/roll but never re-runs. After a region-kill
  # kills + recovers openbao-0's node, the Pod restarts SEALED (shamir
  # does not auto-unseal) and stays sealed — the secrets layer degrades
  # (SSO seeds, snapshot cron, catalyst-api). Observed live on hw261 after
  # region-kill G12. templates/unseal-reconciler.yaml re-applies the
  # persisted openbao-unseal-keys whenever the vault is sealed so a
  # region-kill recovery restores the secrets layer without operator
  # action (Pillar-3 DR recovery). Rendered only when autoUnseal.enabled
  # AND reconcile.enabled are both true.
  #
  # #5157: this is a DEPLOYMENT (continuous loop), NOT a CronJob. The hw263
  # region-kill G12 proved a CronJob is not robust to the event it guards —
  # the region-a control-plane (CronJob scheduler) dies with the region and
  # did not resume scheduling this reconciler for 40+ min on recovery
  # (Kyverno fail-closed FailedDelete wedged its loop). A Deployment pod
  # resumes its check-loop the instant its node recovers, independent of the
  # CronJob scheduler + per-tick admission. `schedule` is retained for
  # backward-compat but ignored; `intervalSeconds` is the loop cadence.
  reconcile:
    enabled: true
    # Loop cadence. 120s bounds post-region-kill sealed-time to ~2 min.
    intervalSeconds: 120
    schedule: "*/2 * * * *"   # legacy/no-op (superseded by intervalSeconds; #5157)
  # ─── #3888 (Refs #3847) prov-time openbao KV-seed ─────────────────────
  # The MISSING mechanism #3890 flagged: there is no way to land a
  # per-deployment cred into openbao KV at provision time, because the
  # auth-bootstrap Job revokes the init root token at the end of its run
  # (no other token holds write access to `secret/*`). Result: any inline
  # cloud-init Secret whose consumer reconciles at/before the
  # openbao→ESO→ClusterSecretStore pipeline (slots 08→15a) could not be
  # evicted to an ExternalSecret — there was nothing to read FROM.
  #
  # This block closes that gap. When `enabled: true` AND the cloud-init
  # writes a one-shot Secret (default name `openbao-bootstrap-seed`) into
  # the openbao namespace, the auth-bootstrap Job (which still holds the
  # valid root token) reads every `data` key from that Secret and writes it
  # into openbao KV at `<kvMountPath>/<kvPrefix>/<key>` BEFORE it revokes
  # the root token. ExternalSecrets can then materialise those creds via the
  # `vault-region1` ClusterSecretStore — exactly the delivery path #3888
  # wants so future inline Secrets can be evicted from cloud-init to Flux.
  #
  # Default-OFF + inert: when disabled, OR when the seed Secret is absent
  # (the seed mount is `optional: true`), the Job seeds nothing and behaves
  # byte-identically to the pre-#3888 chart. The seed Secret is single-use:
  # its keys are deleted from K8s after a successful KV write so no plaintext
  # cred lingers in etcd (same posture as openbao-recovery-seed). Each KV
  # write is idempotent (`bao kv put` overwrites), so Job retries + chart
  # upgrades are safe.
  #
  # Per-key shape: the seed Secret's data keys are openbao KV PATHS with
  # `__` standing in for `/` (k8s Secret keys cannot contain `/`), and each
  # value is a flat `field=value` newline-separated body. e.g. a data key
  # `harbor-robot__token` with value `token=<robot-token>` lands at
  # `secret/bootstrap/harbor-robot/token` with field `token`. A future
  # eviction adds one cloud-init `__`-key per evicted Secret + one
  # ExternalSecret CR reading it back. NO secret is evicted in #3888 itself
  # (each of the 5 #3890 STAY secrets still has an ordering/cycle blocker —
  # see platform/openbao/README.md §Bootstrap-KV-seed); this ships the
  # mechanism so the NEXT eviction is a pure data change.
  bootstrapSeed:
    enabled: false
    # One-shot Secret the cloud-init writes into the openbao namespace.
    secretName: openbao-bootstrap-seed
    # KV sub-path under <kvMountPath> the seeded creds land at. ESO
    # remoteRef.key values resolve to `<kvPrefix>/<name>`.
    kvPrefix: bootstrap
  # Enable Kubernetes auth method bootstrap as a second post-install Job.
  # When true the Job waits for `bao operator init` to succeed, then
  # `bao auth enable kubernetes` + `bao write auth/kubernetes/config …`,
  # binding the `external-secrets` role to the ESO ServiceAccount per
  # platform/external-secrets/chart/values.yaml `clusterSecretStore.kubernetesAuth`.
  kubernetesAuth:
    enabled: true
    # Auth mount inside OpenBao for the Kubernetes auth method.
    mountPath: kubernetes
    # Role granted to the ESO ServiceAccount.
    role: external-secrets
    # ESO ServiceAccount + namespace that the role binds to. Must match
    # platform/external-secrets/chart/values.yaml clusterSecretStore.kubernetesAuth.
    serviceAccountName: external-secrets
    serviceAccountNamespace: external-secrets-system
    # KV mount that the role grants read access to (matches
    # platform/external-secrets/chart/values.yaml clusterSecretStore.path).
    kvMountPath: secret
    # Token TTLs for ESO sessions.
    tokenTTL: "1h"
    tokenMaxTTL: "24h"
    # ─── #3376 — catalyst-api handover-archive writer role ────────────────
    # The Sovereign's catalyst-api seals the phase0 tofu archive at
    # secret/catalyst/tofu-phase0-archive (ReceiveTofuArchive) — the durable
    # handover marker the cutover's 425 gate keys on. It authenticates via
    # this Kubernetes-auth role (bound to the catalyst-api Pod's SA) and a
    # write policy scoped to secret/{data,metadata}/catalyst/*. No
    # long-lived static token at rest — the catalyst-api logs in with its
    # projected SA token (CATALYST_OPENBAO_K8S_AUTH_ROLE) and re-logs before
    # the lease expires.
    catalystApi:
      enabled: true
      role: catalyst-api
      serviceAccountName: catalyst-api-cutover-driver
      serviceAccountNamespace: catalyst-system
    # ─── #3825 (Refs #3642) — cross-cluster TokenReview ───────────────────
    # After #3642 OpenBao runs INSIDE the mgmt vCluster, but the ESO
    # ServiceAccount whose JWT it validates (external-secrets /
    # external-secrets-system) is issued by the HOST apiserver. The pod's
    # `kubernetes.default.svc` is the VC-MGMT apiserver, which cannot review
    # the host-issued token (the token is unknown there and the host ns does
    # not exist in vc-mgmt) → every ESO login 403s → all *-oidc
    # ExternalSecrets (oidc-gate-*, hubble-ui-oauth2-proxy, the per-app SSO
    # secrets) stay unsynced → the per-app SSO walk stays broken.
    #
    # When `enabled` the auth-bootstrap Job configures auth/kubernetes/config
    # to TokenReview against the HOST apiserver instead: kubernetes_host =
    # hostApiserver, token_reviewer_jwt + kubernetes_ca_cert read from the
    # mirrored `tokenReviewerSecret`, disable_local_ca_jwt=true (so OpenBao
    # does NOT fall back to its in-vCluster CA/token). This is OpenBao's
    # documented cross-cluster auth mode and RESTORES the pre-#3642 behaviour
    # (when openbao was host-side, `kubernetes.default.svc` WAS the host
    # apiserver and the host ESO token validated natively).
    #
    # The host SA token + host CA are minted HOST-side by bootstrap-kit
    # placement slot-08 hostDocuments (a host ServiceAccount bound to
    # system:auth-delegator + a kubernetes.io/service-account-token Secret the
    # host token-controller populates with `token` + `ca.crt`), then mirrored
    # host→vc-mgmt by bp-mgmt-vcluster `sync.fromHost.secrets` (the existing
    # `openbao/*` mapping). On a fresh prov the mirror lands eventually; the
    # Job soft-waits (backoffLimit retries) until the Secret appears.
    #
    # DEFAULT false: single-region / Catalyst-Zero / any env where openbao
    # stays HOST-side leaves this off → render byte-identical to pre-#3825 +
    # the in-cluster TokenReview path is unchanged. The franchised multi-
    # region Sovereign overlay (openbao in vc-mgmt) sets enabled=true — wired
    # by the bootstrap-kit slot-08 HR values block on a vCluster placement.
    crossClusterTokenReview:
      enabled: false
      # HOST apiserver address reachable from a vc-mgmt pod. vc-mgmt pods are
      # real host pods (shared CNI), so the HOST kube-apiserver ClusterIP is
      # reachable at the IP level even though the NAME kubernetes.default.svc
      # resolves to the vc-mgmt apiserver inside the pod. 10.96.0.1 is the
      # `kubernetes.default` ClusterIP (.1 of the service CIDR) — the SAME
      # constant bp-network-policies allow-system-namespaces +
      # bp-self-sovereign-cutover allow-lists encode as the host apiserver.
      #
      # ⚠️ PER-REGION CIDR: infra sets `--service-cidr=10.{96+regionIdx}.0.0/16`
      # (infra/providers/{huawei,hetzner}/main.tf region_service_cidr), so the
      # apiserver ClusterIP is 10.96.0.1 in the PRIMARY region, 10.97.0.1 in the
      # SECOND region, etc. The mgmt vCluster (hence openbao + this
      # auth-bootstrap Job) runs in the PRIMARY region, so 10.96.0.1 is correct
      # for the canonical topology. If a future placement runs vc-mgmt in a
      # non-primary region OR the service CIDR is customised, override this
      # per-Sovereign to 10.{96+regionIdx}.0.1.
      hostApiserver: "https://10.96.0.1:443"
      # The mirrored host token-reviewer Secret (host SA JWT + host CA). Name
      # MUST match the Secret minted by placement slot-08 hostDocuments in the
      # HOST openbao ns; the `openbao/*` fromHost mapping mirrors it into the
      # vc-mgmt openbao ns under the SAME name.
      tokenReviewerSecret:
        name: openbao-host-token-reviewer
        tokenKey: token
        caKey: ca.crt

# ─── G91.openbao (#2655) SSO opt-in ───────────────────────────────────────
# Per SECURITY.md §6.3 every Application Blueprint declares SSO support
# with a single value. bp-sso-bridge (G91.1 #2652) watches every HR with
# `sso.enabled: true` and reconciles a Keycloak Client + OpenBao
# `secret/sso/openbao` + ExternalSecret in this namespace.
#
# bp-openbao opens its UI + CLI to OIDC users via the `oidc` auth method,
# bound to the realm `sovereign-admins` group → sso-operator-admin policy
# (write-everything-anywhere). Local root token remains revoked after
# auth-bootstrap; the only privileged login surface post-bootstrap is OIDC.
sso:
  enabled: true
  realm: sovereign
  # Per-Sovereign cluster overlay sets this (e.g. `hw86.omani.works`). When
  # empty the sso-configure Deployment renders but its loop logs
  # "ESO Secret keys not yet present" forever — see templates/
  # sso-configure-deployment.yaml comments.
  sovereignFqdn: ""
  # OIDC client ID — defaults to "openbao" (bp-sso-bridge strips "bp-" from
  # the HR name).
  clientId: openbao
  externalSecretStoreName: vault-region1
  refreshInterval: 1h
  # Realm group → OpenBao policy mapping (#3150). The sovereign realm stamps
  # `defaultGroups: /sovereign-viewers` on EVERY PIN-federated operator, and
  # the handover flow additionally adds the org operator to `sovereign-admins`
  # (sovereign-ops is the third privileged group). ALL THREE must be in the
  # OIDC role's bound_claims or OpenBao rejects the callback with "claim
  # groups does not match any associated bound claim values". Policy uplift:
  #   adminGroup / opsGroup → sso-operator-admin (read/write/sudo everywhere)
  #   viewerGroup           → sso-operator-read  (read+list, role baseline)
  # delivered via external identity-group aliases on the oidc mount.
  adminGroup: sovereign-admins
  opsGroup: sovereign-ops
  viewerGroup: sovereign-viewers
  # G117.5 #2744 — Identity Provider hint. NOTE: OpenBao's OIDC
  # (jwt) backend builds the auth_url server-side via the hashicorp/cap
  # library and does NOT expose a knob to inject arbitrary query params
  # (per builtin/credential/jwt/path_oidc.go createOIDCRequest). Silent
  # SSO via catalyst-pin is therefore delivered EXCLUSIVELY by the
  # realm-config IDR `defaultProvider=catalyst-pin` binding shipped in
  # bp-keycloak 1.4.9+ (PR #2730) — NOT by an auth_url query-string. The
  # value below is kept for consistency with other Tier-1 charts + for
  # documentation; it is not consumed by the configure-deployment.
  idpHint: catalyst-pin
  # ── Bare-URL zero-click entry (#3374) ────────────────────────────────
  # Gateway-level interception of the bare entry paths (/, /ui, /ui/) ->
  # 302 to the on-origin SSO landing page (templates/sso-landing.yaml),
  # which completes the OIDC round-trip as a TOP-LEVEL window and lands the
  # operator in /ui/vault/secrets signed in. See the loop-safety + root-
  # cause analysis in templates/httproute.yaml + sso-landing.yaml. Disable
  # to fall back to the token form on bare entry (the founder-witnessed
  # #3374 failure).
  #
  # NOTE: the prior design 302'd the bare paths to catalyst-api's
  # openbao-sso-init shim (#3226). That shim full-page-redirected into
  # OpenBao's POPUP-ONLY OIDC callback (window.opener postMessage, no
  # null-check) and ALWAYS rendered the Ember "Cannot read properties of
  # null (reading 'postMessage')" error — measured live on hw133
  # 2026-06-14. The landing page replaces it; apiHost/shimPath are retained
  # only for reference and are no longer consumed by the HTTPRoute.
  bareURL:
    enabled: true
    # Path of the on-origin SSO landing page (served by the
    # openbao-sso-landing nginx Deployment). MUST stay in sync across
    # httproute.yaml, sso-landing.yaml, and OIDC_ALLOWED_REDIRECT_URIS.
    landingPath: /sso/landing
    # Vault OIDC auth-method mount + role the landing page drives. Match
    # the sso-configure Deployment (auth/oidc enable + role/operator).
    oidcMount: oidc
    oidcRole: operator
    # (Legacy, unused by the HTTPRoute since the landing-page fix — kept for
    # reference / external tooling that still reads them.)
    apiHost: ""
    shimPath: /catalyst/v1/apps/openbao/openbao-sso-init

# ─── SSO landing page (#3374) ────────────────────────────────────────────
# The tiny nginx that serves the on-origin bare-URL landing page. Rendered
# only when sso.bareURL.enabled. Image goes through the Harbor DockerHub
# proxy-cache project (kyverno harbor-proxy-pull Enforce — `*/proxy-*/*`).
# The project is `proxy-dockerhub` (the live convention — proxy-dockerhub/
# library/alpine, .../hashicorp/vault-k8s all pull; the bare `proxy-docker`
# project does NOT exist on Harbor and 401s the pull — measured on hw133).
ssoLanding:
  replicas: 1
  image:
    registry: harbor.openova.io
    repository: proxy-dockerhub/library/nginx
    tag: "1.27-alpine"

# ── Bootstrap self-registration (#3687, extends #3370) ───────────────────
# When a bootstrap-kit slot installs this chart, it flips
# bootstrapOwned.enabled=true so templates/application-cr.yaml renders the
# canonical apps.openova.io/v1 Application CR for the slot's HelmRelease
# (the instance card every console surface reads — /apps, Topology,
# showback). Default OFF so console-created instances are not double-carded.
# helmRelease names the owning Flux HelmRelease (the controller's adoption
# path mirrors its Ready condition); namespace is where that HR object
# lives (flux-system for the slot 08 HR).
bootstrapOwned:
  enabled: false
  # Canonical placement token stamped onto the self-registered Application
  # CR's spec.placement (#3375 DoD-1 / #3768 / #3786). MUST be a canonical
  # mode (singleton / active-active / active-hot-standby / active-passive) —
  # NEVER the banned legacy dialect single-region / active-hotstandby, which
  # the read path (readTopology) would surface verbatim to the operator. A
  # leaf bootstrap app installs as one copy, so singleton is the truthful
  # effective mode.
  placement: singleton
  helmRelease:
    name: ""
    namespace: flux-system

# ── Peer-region trust (ADR-0015, Refs #7067) ─────────────────────────────
# Every region runs its OWN OpenBao (independent raft, own unseal keys). A
# multi-region Application's shared material (bp-wordpress-tenant's
# replication CA + DB owner) is written ONCE by the primary region into EVERY
# region's OpenBao, so each region's ExternalSecrets read their own store.
# This block lets a peer region's ESO write into THIS OpenBao:
#
#   openbao-<self>     ClusterMesh-global Service with this region's active
#                      OpenBao as backend; every peer renders a selector-less
#                      stub of it (openbao-<peer>), so a peer's dial reaches
#                      only the owning region (the gitea-<region-id> pattern).
#   issuer             this OpenBao is the OIDC issuer for its own ESO:
#                      identity/oidc issuer http://openbao-<self>…:8200, key +
#                      role `openbao-peer-push` (aud = `audience`, claim
#                      openova_region=<self>). The ESO SA reads the token via
#                      the k8s-auth role `openbao-peer-token`.
#   jwt-peer-<peer>    one jwt auth mount per peer: oidc_discovery_url = the
#                      peer OpenBao's issuer over the mesh (its public signing
#                      keys, fetched and rotated by OpenBao itself — nothing is
#                      copied by hand). Role `openbao-peer-push` → policy
#                      create/update/read on <kv>/{data,metadata}/<kvPathPrefix>/*
#                      only (no delete, nothing outside the apps subtree).
#
# Why not the peer cluster's ServiceAccount issuer: every region's apiserver
# advertises the SAME issuer (https://kubernetes.default.svc.cluster.local),
# its JWKS needs an authenticated caller (system:service-account-issuer-
# discovery is bound to system:serviceaccounts only) and the jwks_uri is the
# apiserver's VPC-private address — measured on hw307 A and B, 2026-11-08.
#
# All of the OpenBao-side objects above are declarative desired state
# (templates/_config.tpl), applied by the openbao-config reconciler (§config).
# The jwt-peer-<peer> ops wait for the peer's discovery URL to answer.
#
# Off by construction for a single region: nothing renders unless `regions`
# names at least one region other than `selfRegion`. The bootstrap-kit slot
# (08-openbao.yaml) threads both from the region registry substitutes.
peerTrust:
  # This region's canonical id (SOVEREIGN_REGION_CANONICAL_LABEL).
  selfRegion: ""
  # The Sovereign region registry (SOVEREIGN_REGIONS_JSON).
  regions: ""
  # Per-region Service name prefix: openbao-<region-id>.
  servicePrefix: openbao-
  # Token audience shared by every region (the identity role client_id and
  # the peers' bound_audiences).
  audience: openbao-peer-push
  # KV subtree a peer may write (under autoUnseal.kubernetesAuth.kvMountPath).
  kvPathPrefix: openova/apps
  # Identity token lifetime; ESO refreshes it well inside this.
  tokenTTL: 1h

# ── Declarative OpenBao configuration (ADR-0015, Refs #7067) ─────────────
# Every ACL policy, auth role, auth mount and identity object the chart needs
# is rendered into ConfigMap openbao-config-desired (templates/_config.tpl)
# and applied every `intervalSeconds` by the openbao-config Deployment
# (templates/config-reconciler.yaml, files/openbao-config-reconcile.sh).
# It logs in as k8s-auth role openbao-config-admin (configuration surfaces
# only — templates/_config.tpl openbao.configAdminPolicy), which the
# auth-bootstrap hook writes on every install/upgrade: with the init root
# token the first time, afterwards with a short-lived root generated from
# the openbao-unseal-keys shares and revoked in the same run. A chart bump
# therefore reaches a running Sovereign with no manual root step.
# Rendered whenever the auth-bootstrap Job is (autoUnseal.enabled +
# autoUnseal.kubernetesAuth.enabled).
config:
  intervalSeconds: 60
  image: harbor.openova.io/proxy-dockerhub/library/alpine:3.20
