# Catalyst Blueprint umbrella metadata — the upstream chart is resolved as
# a Helm subchart via Chart.yaml `dependencies:`. Catalyst-curated values
# under the `policy-controller:` key flow into the upstream subchart unchanged.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

catalystBlueprint:
  upstream:
    chart: policy-controller
    version: "0.10.6"
    repo: "https://sigstore.github.io/helm-charts"

# ─── Upstream chart values (subchart key: policy-controller) ─────────────
policy-controller:
  # CRDs — installed by the umbrella so HelmRelease ordering works.
  installCRDs: true

  loglevel: info

  # Webhook namespace selector — solo-Sovereign default is opt-in via
  # `policy.sigstore.dev/include: "true"` namespace label. Per-Sovereign
  # overlays MAY widen to all `bp-*` namespaces by patching the webhook
  # ObjectSelector once the supply-chain rollout is complete.
  webhook:
    name: webhook
    replicaCount: 1
    # One replica, no disruption budget (#7922). The upstream chart's budget
    # (minAvailable 1) on the one webhook Pod refuses its eviction for ever:
    # on hw307 kured's drain of its worker never finished (4,510 refused
    # evictions in each 15-minute attempt, the node cordoned without end).
    # The single replica is the sizing of this chart: with failurePolicy
    # Ignore (below) a moment without the webhook blocks no admission, so a
    # budget protects nothing. An overlay that raises replicaCount to 2 or
    # more, for failurePolicy Fail, turns the budget back on with it.
    podDisruptionBudget:
      enabled: false
    # Pin upstream image — DO NOT use floating tags per
    # docs/INVIOLABLE-PRINCIPLES.md.
    #
    # Routed through the Sovereign-local Harbor proxy (#5017): the kyverno
    # `harbor-proxy-pull` ClusterPolicy only admits pod images matching
    # `*/proxy-*/*` or `*/openova-io/*`; the raw ghcr.io ref was DENIED when
    # cutover step-08's deny-egress roll recreated the pod on hw242. The
    # digest pin is preserved (`version` renders as `@sha256:...`).
    image:
      repository: harbor.openova.io/proxy-ghcr/sigstore/policy-controller/policy-controller
      version: "sha256:0bcd60beb93f4427c29cf3a669743caf58490e98ded4380c33c09f092734a6ab"
      pullPolicy: IfNotPresent

    # disable-tuf (#5017, proven live on hw242): the webhook binary panics at
    # startup fetching its TUF trust root from https://tuf-repo-cdn.sigstore.dev
    # — impossible under the cutover step-08 deny-egress hold (CrashLoopBackOff
    # → rollout never completes) and a sovereign-independence violation
    # (Principle #11): a Sovereign must never phone home to sigstore's public
    # CDN to boot. With TUF disabled, trust roots come from in-cluster
    # TrustRoot/ClusterImagePolicy CRs — none are installed by default (see
    # sigstoreOverlay.defaultClusterImagePolicy below), so the webhook stays
    # healthy and inert. Per-Sovereign overlays that enable signature
    # enforcement ship their own TrustRoot CR alongside the policy.
    extraArgs:
      disable-tuf: true
    # failurePolicy=Ignore on solo-Sovereign so a single-pod webhook
    # restart doesn't block all admission. Per-Sovereign overlays MAY flip
    # to Fail once 3-replica HA is in place.
    failurePolicy: Ignore
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    serviceAccount:
      create: true
    # The policy controller needs to reach Fulcio/Rekor/TUF for verification.
    # Per-Sovereign overlays SET trust-root configuration via ClusterImagePolicy.
    env: {}
    envFrom: {}

  # The post-delete hook Job leases-cleanup (CMP-067). The upstream default
  # pulls cgr.dev/chainguard/kubectl directly and sets no requests, which the
  # enforcing policies harbor-proxy-pull and resource-requests refuse when the
  # release is uninstalled. The hook runs `/bin/sh -c kubectl ...`, so it takes
  # the shell-and-kubectl image the kit's other hooks use, pinned, through the
  # proxy project proxy-dockerhub. Not proxy-chainguard: the mothership's
  # Harbor has no such project (measured 26 November), so it would not pull.
  leasescleanup:
    image:
      repository: harbor.openova.io/proxy-dockerhub/alpine/k8s
      version: "1.31.4"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  # ServiceMonitor — DEFAULT FALSE per docs/BLUEPRINT-AUTHORING.md §11.2.
  serviceMonitor:
    enabled: false

# ─── Catalyst overlay values (consumed by templates/ in this chart) ──────
# Reserved for Catalyst-side overlays (NetworkPolicy, default
# ClusterImagePolicy that requires signatures on `ghcr.io/openova-io/*`)
# added in a follow-up PR once bp-sigstore is consumed in
# clusters/_template/.
sigstoreOverlay:
  networkPolicy:
    enabled: false
  # Default ClusterImagePolicy — empty; per-Sovereign overlays SET to require
  # signatures on `ghcr.io/openova-io/*` images and other supply-chain trust
  # roots once bp-harbor + Cosign signing pipeline are wired.
  defaultClusterImagePolicy: ""
