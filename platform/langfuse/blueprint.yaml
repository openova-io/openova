apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-langfuse
  labels:
    catalyst.openova.io/section: pts-3-observability
spec:
  version: 1.1.0
  visibility: listed
  card:
    title: Langfuse
    family: llm-observability
    summary: LLM observability + evals. Traces, prompts, scores, datasets.
    description: Langfuse server backed by Postgres (bp-cnpg) and ClickHouse (bp-clickhouse) for trace storage.
    icon: langfuse.svg
    license: MIT
    tags: [ai, llm, observability, langfuse, traces]
    docs: https://langfuse.com/docs
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-passive
    - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: rtz
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: langfuse.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: "{{.OrgSlug}}"
    protocolMapper: oidc
    silentLogin: true
  # ── /G117.1 ──
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-langfuse
