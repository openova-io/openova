apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-guacamole
spec:
  version: 0.2.55
  card:
    title: Apache Guacamole
    summary: Clientless HTML5 remote-desktop gateway. Browser-based RDP / VNC / SSH and kubectl-exec into Pods, with Keycloak SSO. One Guacamole per Sovereign per ADR-0001 §11.
    description: Clientless HTML5 remote-desktop gateway. Browser-based RDP / VNC / SSH and kubectl-exec into Pods, with Keycloak SSO. One Guacamole per Sovereign per ADR-0001 §11.
    icon: guacamole.svg
  visibility: unlisted
  class: platform-component
  lifecycle: experimental
  placementSchema:
    modes: [single-region, active-hot-standby]
    default: single-region
  upgrades:
    from: ["0.x"]

  manifests:
    chart: bp-guacamole

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive. PG (session + connection config) via
  #   bp-cnpg-pair sync. Switchover: bp-continuum PG flip + DNS flip for
  #   guac.<sov> (~30s); in-progress remote-desktop sessions drop.
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  endpoints:
    - name: ui
      # #3150 (2026-06-10): host is `guacamole.<sov>` (the live HTTPRoute set
      # by clusters/_template/bootstrap-kit/52-bp-guacamole.yaml), NOT the
      # stale `guac.<sov>` which had no HTTPRoute → launch-url 404'd. Keep in
      # lockstep with the catalog-seed entry in
      # products/catalyst/chart/templates/catalog-seed/blueprints.yaml.
      hostnameTemplate: "guacamole.{{.SovereignFQDN}}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
      # #3150: the Guacamole WAR is served under Tomcat's `/guacamole/`
      # context path; bare `/` is a Tomcat 404 ROOT page. Land the launch on
      # the webapp root so the OpenID extension auto-initiates silent-SSO.
      ssoInitPath: "/guacamole/"

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true

