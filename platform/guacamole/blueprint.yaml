apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-guacamole
  labels:
    catalyst.openova.io/section: pts-3-1-networking-and-service-mesh
    catalyst.openova.io/category: platform
    catalyst.openova.io/tier: catalyst-cp
spec:
  version: 0.2.33
  card:
    title: Apache Guacamole
    summary: Clientless HTML5 remote-desktop gateway. Browser-based RDP / VNC / SSH and kubectl-exec into Pods, with Keycloak SSO and full session recording to SeaweedFS. One Guacamole per Sovereign per ADR-0001 §11.
    icon: guacamole.svg
    category: platform
  visibility: listed
  configSchema:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Default-OFF gate. Operator opts in via per-Sovereign overlay.
      hostname:
        type: string
        description: Browser-facing hostname (e.g. guacamole.<sovereign-fqdn>). Required when enabled.
      oidcIssuer:
        type: string
        description: Keycloak realm issuer URL. Required when enabled.
      recordingsSize:
        type: string
        default: "50Gi"
        description: Per-Sovereign session-recording PVC size.
  placementSchema:
    modes: [single-region]
    minRegions: 1
    maxRegions: 1
  upgrades:
    from: ["0.x"]
  # ── #3373: class-level placement SUGGESTION + allow-list ────────────────
  # Placement is an INSTANCE property (Application.spec.placement); this is
  # only the default every instance inherits silently — the provisioning
  # journey's generic advanced selector (and a direct Git edit of the
  # instance's spec.placement) may override it within allowedPlacements.
  # Founder §4 table target: mgmt. Single render mechanism: the Flux
  # spec.kubeConfig.secretRef pivot — zero per-app placement code.
  defaultPlacement:
    vcluster: mgmt
  allowedPlacements: [host, mgmt]

  manifests:
    chart: ./chart
  depends:
    - blueprint: bp-keycloak
      version: ^1
    - blueprint: bp-cilium
      version: ^1
    - blueprint: bp-seaweedfs
      version: ^1
    - blueprint: bp-sealed-secrets
      version: ^1
    - blueprint: bp-k8s-ws-proxy
      version: ^0

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive. PG (session + connection config) via
  #   bp-cnpg-pair sync. Switchover: bp-continuum PG flip + DNS flip for
  #   guac.<sov> (~30s); in-progress remote-desktop sessions drop.
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  endpoints:
    - name: ui
      # #3150 (2026-06-10): host is `guacamole.<sov>` (the live HTTPRoute set
      # by clusters/_template/bootstrap-kit/52-bp-guacamole.yaml), NOT the
      # stale `guac.<sov>` which had no HTTPRoute → launch-url 404'd. Keep in
      # lockstep with the catalog-seed entry in
      # products/catalyst/chart/templates/catalog-seed/blueprints.yaml.
      hostnameTemplate: "guacamole.{{.SovereignFQDN}}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
      # #3150: the Guacamole WAR is served under Tomcat's `/guacamole/`
      # context path; bare `/` is a Tomcat 404 ROOT page. Land the launch on
      # the webapp root so the OpenID extension auto-initiates silent-SSO.
      ssoInitPath: "/guacamole/"

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true

  # ── G117.6: Multi-instance ─────────────────────────────────────────────
  # Singleton per Sovereign per ADR-0001 §11.
  multiInstance:
    enabled: false
