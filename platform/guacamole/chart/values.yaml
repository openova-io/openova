# Catalyst Blueprint values for bp-guacamole.
#
# Per docs/INVIOLABLE-PRINCIPLES.md:
#   #1   waterfall — chart ships the full target shape (guacd + web +
#        OIDC + recordings + NetworkPolicy + Keycloak realm-config)
#        on the first cut; no "for now" subset.
#   #4   never hardcode — every operationally-meaningful value is
#        configurable via per-Sovereign overlay.
#   #4a  SHA-pinned images; CI fills .tag at promotion time. Empty
#        tag fails fast (see _helpers.tpl).
#   #5   credentials live in K8s Secrets, never in values.yaml.
#
# Default-OFF: `enabled: false` per the standard CC3 gate. Operators
# opt in via per-Sovereign overlay.

catalystBlueprint:
  upstream:
    chart: "" # scratch chart — no upstream Helm chart
    version: ""
    repo: ""
# Top-level enable gate. When false, NO resources render. Verified by
# `helm template` test in tests/.
guacamole:
  enabled: false
  # ── guacd: protocol backend ─────────────────────────────────────
  guacd:
    # Resource name. Defaults to `guacd` so the catalyst-api shells/issue
    # handler + qa-loop test matrix (TC-228 / TC-230 / TC-245 / TC-246)
    # can address the Deployment + Service by canonical short name.
    # Override only when running >1 Guacamole in the same namespace
    # (rare; ADR-0001 §11 caps at one Guacamole per Sovereign).
    name: guacd
    image:
      # Mirrored to GHCR by .github/workflows/build-bp-guacamole.yaml so
      # every Sovereign pulls from a registry we own (no Docker Hub rate
      # limits, no upstream availability risk). Bumped automatically by
      # CI when the upstream Apache Guacamole version is rolled.
      repository: ghcr.io/openova-io/openova/guacd
      # SHA-pinned per INVIOLABLE-PRINCIPLES #4a. CI populates this via
      # `yq eval -i ...`. Empty value fails the helm template render
      # (see _helpers.tpl `bp-guacamole.guacdImage`). Initial seed is
      # the upstream-tagged GHCR mirror; CI may pin to a digest tag.
      tag: "1.5.5"
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    port: 4822
  # ── guacamole webapp: Tomcat front-end ─────────────────────────
  webapp:
    # #3374: Deployment strategy. Recreate (not RollingUpdate) so the single
    # webapp Pod releases its volumes before the replacement starts — required
    # when recordings.persistence=true (RWO PVC) and harmless otherwise.
    strategy: Recreate
    # Resource name. Defaults to `guacamole-server` per the qa-loop test
    # matrix + catalyst-api shells/issue handler.
    name: guacamole-server
    image:
      # GHCR mirror of docker.io/guacamole/guacamole; see guacd.image
      # comment for the mirror rationale.
      repository: ghcr.io/openova-io/openova/guacamole-server
      tag: "1.5.5"
      pullPolicy: IfNotPresent
    # Single replica + 256Mi request: omantel chroot single-node-per-region
    # capacity profile. catalyst-api PVC pins it to one worker (w3 on
    # omantel), and 2× 512Mi guacamole webapp replicas saturated w3 so
    # catalyst-api Pod couldn't reschedule on chart roll. Sovereigns with
    # >1 worker per region can override via values.guacamole.webapp.replicas.
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi
    port: 8080
  # ── Recording (SeaweedFS PVC) ──────────────────────────────────
  recordings:
    # #3374: persistence DEFAULT false → the recordings volume is an emptyDir,
    # not a PVC. A persistent PVC pinned the webapp Pod to one node (on hw133
    # `seaweedfs-storage` resolves to rancher.io/local-path, whose PV carries a
    # hard node-affinity + RWO), and when that node was CPU-saturated the
    # post-DB-seed replica Pended forever → SSO users got no admin menu.
    # Session-capture recordings are not required for core function or the
    # admin walk. Operators with real distributed SeaweedFS RWX set this true.
    persistence: false
    # emptyDir sizeLimit when persistence=false.
    emptyDirSizeLimit: 2Gi
    # PVC name. Defaults to `guacamole-recordings`. Override only when
    # multiple Guacamole instances share a namespace.
    pvcName: guacamole-recordings
    pvcSize: 50Gi
    # hcloud-volumes is the canonical Hetzner CSI storageClass per
    # H6 (issue #1118 — `hcloud-volumes` standardisation across
    # Sovereigns). Override per-Sovereign for non-Hetzner clouds.
    storageClass: hcloud-volumes
    mountPath: /recordings
    # qa-loop iter-11 Fix #45 Cluster-A: when an existing PVC is bound
    # to a storageClass different from .storageClass above, the chart's
    # pre-upgrade hook deletes the PVC + bound PV so the new chart-side
    # PVC can be recreated cleanly. PersistentVolumeClaim.spec is K8s-
    # immutable on storageClassName, so without this hook a per-Sovereign
    # overlay flip (e.g. `local-path` → `seaweedfs-storage` after
    # bp-seaweedfs lands) would wedge the bp-guacamole HelmRelease in
    # `Failed to perform remediation: missing target release for rollback`.
    # Default ON because session-recording state on omantel today is
    # ephemeral; flip OFF on Sovereigns with long-lived recording data
    # (operator should snapshot first then re-enable for the upgrade).
    allowMigration: true
    # Image used by the migration hook. The canonical kubectl image
    # surface across OpenOva Sovereigns is docker.io/bitnamilegacy/kubectl
    # (the same one bp-keycloak's realm-config-cli post-deploy Job
    # pulls). Bitnami's 2025-08 secure-images cutover deleted all
    # versioned tags from docker.io/bitnami/kubectl (only :latest +
    # sha256-named tags remain) — bitnamilegacy is the deprecation-
    # fallback path which retains versioned tags AND bash/sh
    # (rancher/kubectl is distroless, would break inline shell). Operator
    # overrides for non-Hetzner Sovereigns by re-mirroring through
    # their own registry (per docs/INVIOLABLE-PRINCIPLES.md #4a — every
    # image traceable to a known-good SHA).
    # Fix #158 (2026-05-11): bumped 1.29.3 -> 1.30.7 to align with
    # k3s 1.30 server version on Hetzner Sovereigns.
    # Fix #163 (2026-05-11, MIRROR-EVERYTHING): explicit
    # harbor.openova.io/proxy-dockerhub prefix per CLAUDE.md inviolable
    # rule.
    migrationImage: harbor.openova.io/proxy-dockerhub/bitnamilegacy/kubectl:1.30.7
  # ── Keycloak OIDC ──────────────────────────────────────────────
  oidc:
    # Issuer URL — render in per-Sovereign overlay as
    # `https://auth.<sovereign-fqdn>/realms/sovereign`. Empty value
    # fails the helm template render (see _helpers.tpl
    # `bp-guacamole.oidcIssuer`).
    #
    # G117.5 W3.D1 #2744 (2026-06-02): the canonical realm is
    # `sovereign` (consolidated by bp-keycloak 1.4.13 — adds `guacamole`
    # client). The pre-this-fix example pointed at `/realms/catalyst`
    # which never matched the canonical sovereign-realm import.
    issuer: ""
    clientId: guacamole
    # G117.5 W3.D1 #2744 (2026-06-02): default ON. The new
    # templates/secret-sso-oidc-credentials.yaml emits a Helm
    # `lookup`-or-generate Secret named `.clientSecretRef.name` with
    # `helm.sh/resource-policy: keep`. The legacy SealedSecret +
    # pre-install bootstrap Job pair is preserved at
    # chartManagedSecret=false for operators on the GitOps-managed
    # cred-lifecycle path. Per memory
    # feedback_chart_credential_persistence_defense.md.
    chartManagedSecret: true
    # Client secret name + key — read by the Deployment via
    # secretKeyRef. The same name is materialised by EITHER the
    # chart-managed Secret (default chartManagedSecret=true) OR the
    # SealedSecret placeholder (chartManagedSecret=false). They are
    # mutually exclusive so the Secret name never collides.
    clientSecretRef:
      name: guacamole-oidc
      key: client-secret
    # Default-redirect URL — defaults to https://guacamole.<sovereign>/
    # but operator overlay sets the canonical hostname.
    redirectURI: ""
    # Optional groups claim from the IdP — Guacamole reads roles
    # from this claim and maps them to per-connection ACLs.
    groupsClaim: groups
  # ── PostgreSQL JDBC permission store (#3374) ───────────────────
  # The guacamole-auth-sso-openid extension AUTHENTICATES users but, alone,
  # carries NO permission store — every SSO user lands with zero connections
  # and NO admin (the #3374 DoD-7 gap; the image ships only the openid jar).
  # Wiring the bundled JDBC (postgresql) extension gives guacamole a real
  # permission store: POSTGRESQL_AUTO_CREATE_ACCOUNTS auto-provisions a JDBC
  # record for each SSO user on first login, OPENID_GROUPS_CLAIM_TYPE maps the
  # `groups` claim onto guacamole USER_GROUP entities, and the schema-seed Job
  # creates a `<adminGroup>` USER_GROUP holding the ADMINISTER system
  # permission — so every owner in `sovereign-admins` inherits guacamole admin
  # the moment they sign in. The image (guacamole/guacamole:1.5.5) already
  # bundles guacamole-auth-jdbc-postgresql + the driver + the schema SQL; the
  # entrypoint installs the JDBC extension automatically when POSTGRESQL_* is
  # set.
  database:
    # Master switch. Default ON: without it guacamole grants no admin, which
    # is the founder-witnessed #3374 gap. Set false to keep openid-only.
    enabled: true
    # Dedicated CNPG cluster (mirrors bp-gitea / bp-harbor / bp-newapi). The
    # JDBC schema needs CREATE TYPE/TABLE, so the seed Job applies it as the
    # CNPG superuser (enableSuperuserAccess below). ADR-0010 SHARING is a
    # follow-up — guacamole's schema-init is heavier than a single Database CR.
    cluster:
      enabled: true
      name: guacamole-pg
      namespace: "" # default .Release.Namespace
      instances: 1
      database: guacamole_db
      owner: guacamole
      imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql
      pgVersion: "16"
      storageSize: 5Gi
      storageClass: local-path
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    # The CNPG <cluster>-app Secret carries the rotating password; the
    # Deployment + seed Job read it (key `password`).
    appSecretName: "" # default "<cluster.name>-app"
    sslMode: require
    # Auto-provision a JDBC user record for each SSO-authenticated principal on
    # first login (so openid users exist in the permission store).
    autoCreateAccounts: true
    # The IdP group whose members become guacamole admins. A USER_GROUP entity
    # of this name is seeded with the ADMINISTER system permission; the openid
    # `groups` claim binds the SSO user into it. Elevation keys on the group,
    # never per-user (#3374 law §5).
    adminGroup: sovereign-admins
    # Image for the schema-seed Job's psql container (same CNPG postgres image
    # as the cluster — has psql). The schema SQL itself is copied out of the
    # guacamole webapp image by an initContainer.
    seedJob:
      backoffLimit: 6
      activeDeadlineSeconds: 420
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  # ── HTTPRoute (Cilium Gateway) ─────────────────────────────────
  httproute:
    enabled: true
    # Gateway reference. Defaults to the Sovereign's canonical
    # `cilium-gateway` in namespace `kube-system` (installed by
    # bootstrap-kit/01-cilium.yaml — every other Sovereign HTTPRoute
    # in catalyst-system/gitea/keycloak/harbor/grafana/openbao/etc.
    # parents to this gateway). Per-Sovereign overlay can rebind.
    # Fix (TBD-G6 / C12-004): previously defaulted to namespace
    # `gateway-system`, which has no Gateway on any Sovereign — the
    # HTTPRoute went Accepted=False with "no matching parent" on t22.
    parentRef:
      name: cilium-gateway
      namespace: kube-system
    # Bare-root entry (#3374): 302 `/` -> `/guacamole/` (the Tomcat WAR
    # context). Without it the bare hostname 404s on Tomcat's ROOT
    # context (the #3150 landmine). See guacamole-httproute.yaml.
    rootRedirect:
      enabled: true
    # Hostname this Guacamole answers on. Empty value fails the
    # helm template render (see _helpers.tpl `bp-guacamole.host`).
    hostname: ""
  # ── NetworkPolicy ─────────────────────────────────────────────
  # When enabled (default), a default-deny baseline is augmented with
  # selective egress to: keycloak (443), k8s-ws-proxy DaemonSet (8080),
  # SeaweedFS S3 endpoint (8333), and the kube-apiserver (443) for
  # the Pod-listing JSP shipped with Guacamole.
  networkPolicy:
    enabled: true
    keycloak:
      namespace: keycloak
      podSelector:
        app: keycloak
    k8sWsProxy:
      namespace: catalyst-system
      podSelector:
        app.kubernetes.io/name: bp-k8s-ws-proxy
    seaweedfs:
      namespace: seaweedfs
      podSelector:
        app: seaweedfs
        component: s3
  # ── NATS audit trail ──────────────────────────────────────────
  audit:
    nats:
      # JetStream subject Guacamole publishes session-open / session-close
      # events to. Consumed by the Sovereign's audit indexer (EPIC-1
      # compliance evaluators) — see canon §3 events bus.
      subject: catalyst.audit
      auditType: guacamole-session
      url: nats://nats-jetstream.nats-jetstream.svc.cluster.local:4222
  # ── Keycloak realm-config integration (DECOMMISSIONED 0.2.0) ───
  # G117.5 W3.D1 #2744 (2026-06-02): The chart previously emitted a
  # `bp-guacamole-realm-patch` ConfigMap (templates/keycloak-realm-
  # config.yaml) that bp-keycloak's keycloak-config-cli post-deploy
  # Job picked up. That ConfigMap targeted a `catalyst` realm,
  # divergent from the canonical `sovereign` realm consolidated by
  # bp-keycloak 1.4.10 (Tier-1 clients) and 1.4.13 (this Wave —
  # adds Tier-2 `guacamole` client to the same realm-import).
  #
  # The template was DELETED in 0.2.0; bp-keycloak's realm-import is
  # now the authoritative source for the `guacamole` client. Migration
  # path for operators on the legacy `catalyst` realm: re-render with
  # bp-guacamole 0.2.0 + bp-keycloak 1.4.13, then drop the obsolete
  # `bp-guacamole-realm-patch` ConfigMap from any pinned overlay.
  #
  # Per Aux-2 audit
  # docs/sessions/2026-06-02-G117-sso-fanout-audit/tier-2/bp-guacamole.md
  # step 4.
  # ── Pod-level security context ─────────────────────────────────
  # Both pods run as non-root with read-only root FS — only /tmp
  # and /recordings are writable.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  # ── Image pull secret ─────────────────────────────────────────
  # GHCR pull credentials. The catalyst-system namespace's `ghcr-pull`
  # secret is the canonical pull-credential surface across every
  # Sovereign (catalyst-api / catalyst-ui / guacd / guacamole-server /
  # all mount it), so the chart defaults to it. Operator overrides per
  # Sovereign for non-canonical credential names.
  imagePullSecrets:
    - name: ghcr-pull
