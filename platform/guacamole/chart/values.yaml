# Catalyst Blueprint values for bp-guacamole, the access plane (ADR-0033).
#
# ACC-102 removed the Guacamole web application, its PostgreSQL database, the
# seed Job, the CronJob, guacd and the recordings volume (decision A3). The
# chart renders one object: the bootstrap-owned Application, when the slot
# turns bootstrapOwned.enabled on. The access controller, its Service and the
# kinds arrive with ACC-103 and read `access`.

catalystBlueprint:
  upstream:
    chart: "" # scratch chart — no upstream Helm chart
    version: ""
    repo: ""
# ─── Global registry rewrite (matches catalyst / continuum chart pattern) ──
# When set, every openova-io image pull of this chart routes through this
# registry instead of ghcr.io. Per-Sovereign overlays leave this empty; the
# self-sovereign-cutover step-07 image pivot (#4885) sets it to
# registry.<sovereign-fqdn> so post-cutover pulls hit the Sovereign's own
# Harbor rather than ghcr.io (which the step-08 deny-egress hold blocks).
# Empty = no rewrite. The helper bp-guacamole.registryImage in
# templates/_helpers.tpl applies it; since ACC-102 the chart renders no image.
global:
  imageRegistry: ""
# ── Cross-region singleton discipline (#5358, ADR-0033 decision A21) ──────
# Slot 52 installs this chart in every region of a Sovereign. The access
# plane runs once per Sovereign, in the region whose role is primary; the
# other region reaches it over Cilium ClusterMesh.
#
# What reads these values since ACC-102:
#   role: a secondary region does not self-register the Application
#     (templates/application-cr.yaml through bp-guacamole.isMeshSecondary), so
#     the Sovereign has one instance card. An unknown role fails the render.
#   enabled: switches `role` on.
#   peerClusters: read by no template. ACC-102 deleted the cross-region
#     policy with the web application it admitted; slot 52 still stamps the
#     value. ACC-103 moves enabled, role and peerClusters under `access` and
#     adds the cross-region policy of the access controller.
crossRegion:
  # Honour `role`. Default OFF.
  enabled: false
  # This region's role in the pair: primary | secondary. Slot 52 stamps it
  # from the per-region ${SOVEREIGN_REGION_ROLE} cloud-init substitute.
  role: primary
  # Peer ClusterMesh cluster name(s) — the SAME source var bp-harbor (19),
  # bp-postgres (16a/16c/16d) and bp-cnpg-pair (16b) consume,
  # ${SOVEREIGN_PEER_CLUSTERMESH_NAMES}.
  peerClusters: []
# ── Access plane (ADR-0033) ──────────────────────────────────────────────
# The switch of the access controller, its Service and the kinds AccessTarget
# and AccessGrant, which ACC-103 adds. No template reads it before ACC-103.
access:
  enabled: true
# ── Bootstrap self-registration (#3687, extends #3370) ───────────────────
# When a bootstrap-kit slot installs this chart, it flips
# bootstrapOwned.enabled=true so templates/application-cr.yaml renders the
# canonical apps.openova.io/v1 Application CR for the slot's HelmRelease
# (the instance card every console surface reads — /apps, Topology,
# showback). Default OFF so console-created instances are not double-carded.
# helmRelease names the owning Flux HelmRelease (the controller's adoption
# path mirrors its Ready condition); namespace is where that HR object
# lives (flux-system for the slot 52 HR).
bootstrapOwned:
  enabled: false
  # Placement committed to Git (CTL-172; CTL-174 passes it in through the
  # slot's valuesFrom). Optional keys: `placement` (the shape of the
  # Application's spec.placement: the object {mode, ...} or a mode string)
  # and `regions` (a list of strings). A key that is set and not empty wins
  # over the live Application that templates/application-cr.yaml reads back,
  # and over the seed. Unset, the render is unchanged.
  intent: {}
  # Canonical placement token stamped onto the self-registered Application
  # CR's spec.placement (#3375 DoD-1 / #3768 / #3786). MUST be a canonical
  # mode (singleton / active-active / active-hot-standby / active-passive) —
  # NEVER the banned legacy dialect single-region / active-hotstandby, which
  # the read path (readTopology) would surface verbatim to the operator. A
  # leaf bootstrap app installs as one copy, so singleton is the truthful
  # effective mode.
  placement: singleton
  helmRelease:
    name: ""
    namespace: flux-system
