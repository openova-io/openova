{{- /* #3374: only provision the recordings PVC when persistence is enabled.
   Default is emptyDir (see guacamole-deployment.yaml volumes note) so the
   webapp Pod is not node-pinned to a local-path PV on a CPU-saturated node. */ -}}
{{- if and (include "bp-guacamole.renderWorkloads" .) .Values.guacamole.recordings.persistence -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bp-guacamole.recordingsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
    catalyst.openova.io/component: recordings
spec:
  # ReadWriteMany so guacd writes captures + the webapp's shipper
  # reads them concurrently. SeaweedFS-CSI honors RWX (verified by
  # canon §4 — H6 hcloud-volumes works the same way for solo-node
  # Sovereigns; per-Sovereign overlay swaps for SeaweedFS RWX on
  # multi-node clusters).
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.guacamole.recordings.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.guacamole.recordings.pvcSize | quote }}
{{- end }}
