{{- if and .Values.guacamole.enabled .Values.guacamole.networkPolicy.enabled -}}
# Default-deny baseline + selective egress for the Guacamole webapp.
# Mirrors the platform/network-policies (H8) pattern: ingress is
# inherited from the cluster-wide default-deny + the HTTPRoute
# Gateway's allow rule; egress here is the load-bearing surface that
# unbreaks the OIDC handshake + the kubectl-WS proxy.
#
# guacd has NO egress rule of its own — it only talks to k8s-ws-proxy
# (for kubectl exec) and the captures volume. The kubectl path goes
# via the webapp, so guacd's only allowed egress is internal
# (recordings volume = filesystem, not network).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bp-guacamole.webappName" . }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bp-guacamole.webappSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Keycloak — OIDC discovery + token endpoint.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.guacamole.networkPolicy.keycloak.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.guacamole.networkPolicy.keycloak.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8080  # internal Keycloak port (when fronted by Service)

    # k8s-ws-proxy DaemonSet — the webapp tunnels kubectl-exec sessions
    # via the per-node DaemonSet pods. Selector here matches the
    # bp-k8s-ws-proxy chart's pod labels.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.guacamole.networkPolicy.k8sWsProxy.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.guacamole.networkPolicy.k8sWsProxy.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080

    # SeaweedFS S3 — recording shipper PUTs sessions here.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.guacamole.networkPolicy.seaweedfs.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.guacamole.networkPolicy.seaweedfs.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8333

    # guacd — local protocol backend.
    - to:
        - podSelector:
            matchLabels:
              {{- include "bp-guacamole.guacdSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.guacamole.guacd.port }}

    # NATS JetStream — audit-event publish path. The audit URL lives in
    # the same namespace shape as the catalyst-curated bp-nats-jetstream.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nats-jetstream
      ports:
        - protocol: TCP
          port: 4222

    {{- $db := .Values.guacamole.database | default dict }}
    {{- if and (default true $db.enabled) ((default dict $db.cluster).enabled | default true) }}
    # PostgreSQL JDBC permission store (#3374) — the webapp reads/writes the
    # guacamole CNPG cluster for connection + permission state. The cluster
    # is provisioned by templates/cnpg-cluster.yaml in this same namespace;
    # CNPG labels its pods `cnpg.io/cluster: <name>`.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ (default dict $db.cluster).name | default "guacamole-pg" | quote }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
{{- if eq (include "bp-guacamole.ssoMode" .) "header" }}
---
# #5358 header-mode ingress guard. In sso.mode=header the webapp TRUSTS
# the identity header the bp-oidc-gate injects (guacamole-auth-header),
# so any pod that can dial the webapp :8080 directly could assert an
# arbitrary principal. This policy closes the direct path: ONLY the
# oidc-gate pods (which overwrite the inbound header with the
# session-derived value on every proxied request) may reach the webapp.
# Kubelet liveness/readiness probes bypass NetworkPolicy by design.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bp-guacamole.webappName" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bp-guacamole.webappSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- $sso := .Values.guacamole.sso | default dict }}
    {{- $gate := $sso.gate | default dict }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gate.namespace | default "oidc-gate" }}
          podSelector:
            matchLabels:
              {{- $gate.podSelector | default (dict "app.kubernetes.io/name" "bp-oidc-gate") | toYaml | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.guacamole.webapp.port }}
{{- end }}
{{- end }}
