{{- if and .Values.guacamole.enabled .Values.guacamole.networkPolicy.enabled -}}
# Default-deny baseline + selective egress for the Guacamole webapp.
# Mirrors the platform/network-policies (H8) pattern: ingress is
# inherited from the cluster-wide default-deny + the HTTPRoute
# Gateway's allow rule; egress here is the load-bearing surface that
# unbreaks the OIDC handshake + the kubectl-WS proxy.
#
# #5991 CORRECTION — this header used to say "guacd has NO egress rule
# of its own … the kubectl path goes via the webapp". That was true only
# while no connection used guacd's `kubernetes` protocol. That protocol
# dials the proxy FROM GUACD, over its own libwebsockets client, so with
# the cluster-shell connection seeded guacd needs egress of its own; the
# `guacd-egress` policy at the bottom of this file grants it, narrowly.
# The Sovereign runs a namespace-wide default-deny
# (bp-plane-isolation), so without that policy the connection renders in
# the list and times out on click — the exact half-working shape UAT row
# 115's vacuity guard is written against.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bp-guacamole.webappName" . }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bp-guacamole.webappSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Keycloak — OIDC discovery + token endpoint.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.guacamole.networkPolicy.keycloak.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.guacamole.networkPolicy.keycloak.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8080  # internal Keycloak port (when fronted by Service)

    # k8s-ws-proxy DaemonSet — the webapp tunnels kubectl-exec sessions
    # via the per-node DaemonSet pods. Selector here matches the
    # bp-k8s-ws-proxy chart's pod labels.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.guacamole.networkPolicy.k8sWsProxy.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.guacamole.networkPolicy.k8sWsProxy.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080

    # SeaweedFS S3 — recording shipper PUTs sessions here.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.guacamole.networkPolicy.seaweedfs.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.guacamole.networkPolicy.seaweedfs.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8333

    # guacd — local protocol backend.
    - to:
        - podSelector:
            matchLabels:
              {{- include "bp-guacamole.guacdSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.guacamole.guacd.port }}

    # NATS JetStream — audit-event publish path. The audit URL lives in
    # the same namespace shape as the catalyst-curated bp-nats-jetstream.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nats-jetstream
      ports:
        - protocol: TCP
          port: 4222

    {{- $db := .Values.guacamole.database | default dict }}
    {{- if and (default true $db.enabled) ((default dict $db.cluster).enabled | default true) }}
    # PostgreSQL JDBC permission store (#3374) — the webapp reads/writes the
    # guacamole CNPG cluster for connection + permission state. The cluster
    # is provisioned by templates/cnpg-cluster.yaml in this same namespace;
    # CNPG labels its pods `cnpg.io/cluster: <name>`.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ (default dict $db.cluster).name | default "guacamole-pg" | quote }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
{{- if eq (include "bp-guacamole.ssoMode" .) "header" }}
---
# #5358 header-mode ingress guard. In sso.mode=header the webapp TRUSTS
# the identity header the bp-oidc-gate injects (guacamole-auth-header),
# so any pod that can dial the webapp :8080 directly could assert an
# arbitrary principal. This policy closes the direct path: ONLY the
# oidc-gate pods (which overwrite the inbound header with the
# session-derived value on every proxied request) may reach the webapp.
# Kubelet liveness/readiness probes bypass NetworkPolicy by design.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bp-guacamole.webappName" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bp-guacamole.webappSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- $sso := .Values.guacamole.sso | default dict }}
    {{- $gate := $sso.gate | default dict }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gate.namespace | default "oidc-gate" }}
          podSelector:
            matchLabels:
              {{- $gate.podSelector | default (dict "app.kubernetes.io/name" "bp-oidc-gate") | toYaml | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.guacamole.webapp.port }}
{{- end }}
{{- $conn := (.Values.guacamole.database | default dict).connections | default dict }}
{{- $cs := $conn.clusterShell | default dict }}
{{- $connOn := true }}{{- if hasKey $conn "enabled" }}{{- $connOn = $conn.enabled }}{{- end }}
{{- $csOn := true }}{{- if hasKey $cs "enabled" }}{{- $csOn = $cs.enabled }}{{- end }}
{{- if and $connOn $csOn }}
---
# #5991 / UAT row 115 — guacd's own egress to bp-k8s-ws-proxy.
#
# guacd's `kubernetes` protocol opens its OWN WebSocket to the proxy
# (libwebsockets client inside guacd, not a call routed through the
# webapp), so the webapp's egress policy above does not cover it. The
# Sovereign applies a namespace-wide default-deny to `guacamole`
# (bp-plane-isolation ships podSelector:{} Ingress+Egress per component
# namespace), so absent this rule the seeded cluster-shell connection
# renders in ALL CONNECTIONS and then hangs on click.
#
# NetworkPolicies are additive, so this only GRANTS: it cannot narrow
# any existing allow, and it selects guacd — which carried no policy of
# its own before — rather than touching the webapp's rules.
#
# Scope is exactly two destinations: DNS (guacd resolves the proxy by
# its fully-qualified Service name, which is also the name it verifies
# the server certificate against) and the proxy's mTLS port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bp-guacamole.guacdName" . }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bp-guacamole.guacdSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $cs.targetProxyNamespace | default .Values.guacamole.networkPolicy.k8sWsProxy.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.guacamole.networkPolicy.k8sWsProxy.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $cs.proxyPort | default 8443 }}
{{- end }}
{{- end }}
