{{- /*
NOTE on the gate: Sprig's `default` is unsafe for booleans because
`default true false` returns true (false is treated as empty). We
explicitly check for "not equal to false" instead, so the chart-managed
path is ON unless the operator EXPLICITLY sets the value to false.
*/ -}}
{{- /* #5358: OIDC client-secret material is only consumed by the LEGACY
sso.mode=openid deployment env — in the default header mode the KC
client + secret belong to the bp-oidc-gate instance (bp-sso-bridge →
OpenBao → ExternalSecret in the oidc-gate namespace), so none of the
oidc secret templates render. */ -}}
{{- if and .Values.guacamole.enabled (eq (include "bp-guacamole.ssoMode" .) "openid") (ne (toString .Values.guacamole.oidc.chartManagedSecret) "false") -}}
{{/*
G117.5 W3.D1 #2744 — chart-managed OIDC client-secret Secret.

PATTERN (per memory feedback_chart_credential_persistence_defense.md)
------------------------------------------------------------------------
This Secret is the canonical replacement for the legacy
`templates/keycloak-client-secret.yaml` SealedSecret-with-empty-placeholder
+ `templates/oidc-secret-bootstrap-job.yaml` random-Job approach. Both
preceded the codification of the `guacamole` OIDC client in bp-keycloak
1.4.13's sovereign realm-import (G117.5 W3.D1 also).

Why a chart-managed Secret beats the prior shapes for this surface:

  - SealedSecret with empty placeholder REQUIRED an operator `kubeseal`
    step before Guacamole could authenticate. Fresh-prov walks therefore
    needed two manual interventions (bp-sealed-secrets pre-provision +
    `kubeseal` of the OIDC value) — both contradict the Phase-0
    automated-from-marketplace claim.
  - The pre-install Job generated a NEW random Secret on first install,
    which had no relationship to the value bp-keycloak's realm-import
    now codifies for the `guacamole` client. The two ends couldn't
    match without bp-sso-bridge bridging them, and bp-sso-bridge has
    not yet been integrated with bp-guacamole as of this Wave.

This template's `lookup`-or-generate path keeps the chart self-sufficient
for the install path: on first install Helm's `lookup` returns nothing →
a fresh 32-char alphanumeric value is generated; on every subsequent
reconcile, `lookup` returns the live Secret → the same value is reused.
`helm.sh/resource-policy: keep` ensures `helm uninstall` leaves the
Secret behind (matching the existing kubeseal-friendly SealedSecret
semantics that operators rely on).

LOCKSTEP WITH bp-keycloak REALM-IMPORT
------------------------------------------------------------------------
The bp-keycloak 1.4.13 sovereign realm-import declares the `guacamole`
client with a deterministic `secret` derived via
`bp-keycloak.tier2ClientSecret` (sha256 of Release.Name|Release.Namespace|
tier2-sso|guacamole, sourced from the bp-keycloak release context).
The two values won't match on a fresh-prov because bp-guacamole and
bp-keycloak are SEPARATE Helm releases with different Release.Name /
Release.Namespace — bp-guacamole CANNOT independently compute the
bp-keycloak-side value.

For the canonical end-to-end SSO chain to close (Guacamole → KC realm
→ catalyst-pin → console) the chart-side Secret MUST end up holding the
SAME value as the bp-keycloak realm-import. Two ways to bridge this
gap, both out of scope for this PR:

  1. Migrate to bp-sso-bridge — let bp-sso-bridge read the live KC
     client secret post-install and write it into OpenBao at
     `secret/sso/guacamole`; switch this template to an ExternalSecret
     (same pattern as powerdns-admin's
     sso-oauth-source-externalsecret.yaml).
  2. Operator-driven sync — after first install, the operator runs
     `kubectl -n keycloak get secret sovereign-realm-client-secret-guacamole
     -o jsonpath='{.data.client_secret}'` and applies it as a
     post-install patch on this Secret.

This PR codifies the AUTHORITATIVE side (bp-keycloak realm-import) and
the chart-side seam (this template + the deployment env wired through
to it). The bridge is a follow-up sub-EPIC.

OPERATOR ESCAPE HATCH
------------------------------------------------------------------------
`.Values.guacamole.oidc.chartManagedSecret: false` disables this template
entirely. Operators who prefer the SealedSecret path (e.g. for
GitOps-managed encrypted-at-rest cred lifecycle) keep the existing
`templates/keycloak-client-secret.yaml` SealedSecret behaviour. The
SealedSecret template's render-gate stays unchanged — the chart emits
BOTH templates iff this flag is true, which conflicts on the Secret
name. Operators must pick one path per Sovereign.
*/}}
{{- $secretName := .Values.guacamole.oidc.clientSecretRef.name -}}
{{- $secretKey := .Values.guacamole.oidc.clientSecretRef.key -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $value := "" -}}
{{- if $existing -}}
  {{- $value = index $existing.data $secretKey | default "" | b64dec -}}
{{- end -}}
{{- if not $value -}}
  {{- $value = randAlphaNum 32 -}}
{{- end -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Per memory feedback_chart_credential_persistence_defense.md: keep
    # the Secret around across helm uninstall so a reinstall finds the
    # same value via the lookup path above. Without this annotation the
    # next install would generate a NEW random value, breaking any KC
    # realm-import that has already cached the prior value.
    helm.sh/resource-policy: keep
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
    catalyst.openova.io/component: sso-oidc-credentials
type: Opaque
stringData:
  {{ $secretKey }}: {{ $value | quote }}
{{- end }}
