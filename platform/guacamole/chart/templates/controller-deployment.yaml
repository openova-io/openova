{{- /*
The access controller (ADR-0033), one replica, in the region that
bp-guacamole.controllerRendered names (decision A21). Port 8080 serves /healthz and
/metrics; the image is pinned by digest. ACCESS_IMAGE_GUACD and ACCESS_IMAGE_AGENT
name the images of the session pods it builds, each set once CI has written its digest.
*/ -}}
{{- if include "bp-guacamole.controllerRendered" . }}
{{- $a := .Values.access }}
{{- $img := $a.session.images }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.controllerLabels" . | nindent 4 }}
spec:
  replicas: {{ $a.controller.replicas }}
  selector:
    matchLabels:
      {{- include "bp-guacamole.controllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bp-guacamole.controllerLabels" . | nindent 8 }}
    spec:
      serviceAccountName: access-controller
      {{- with $a.controller.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "bp-guacamole.registryImage" (dict "repo" $a.controller.image.repository "digest" $a.controller.image.digest "what" "access.controller.image.digest" "root" $) | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --http-address=:8080
            - {{ printf "--sovereign-fqdn=%s" $a.sovereignFQDN | quote }}
            - {{ printf "--region-id=%s" $a.regionID | quote }}
            - {{ printf "--nats-url=%s" $a.nats.url | quote }}
            - {{ printf "--session-namespace=%s" .Release.Namespace | quote }}
            - {{ printf "--denied-target-namespaces=%s" (join "," $a.session.deniedTargetNamespaces) | quote }}
            - --leader-elect=true
          {{- if or $img.guacd.digest $img.agent.digest }}
          env:
            {{- if $img.guacd.digest }}
            - name: ACCESS_IMAGE_GUACD
              value: {{ include "bp-guacamole.registryImage" (dict "repo" $img.guacd.repository "digest" $img.guacd.digest "what" "access.session.images.guacd.digest" "root" $) | quote }}
            {{- end }}
            {{- if $img.agent.digest }}
            - name: ACCESS_IMAGE_AGENT
              value: {{ include "bp-guacamole.registryImage" (dict "repo" $img.agent.repository "digest" $img.agent.digest "what" "access.session.images.agent.digest" "root" $) | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml $a.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
{{- end }}
