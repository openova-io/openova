{{- if .Values.guacamole.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bp-guacamole.guacdName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
    catalyst.openova.io/component: guacd
spec:
  type: ClusterIP
  selector:
    {{- include "bp-guacamole.guacdSelectorLabels" . | nindent 4 }}
  ports:
    - name: guacd
      port: {{ .Values.guacamole.guacd.port }}
      targetPort: guacd
      protocol: TCP
{{- end }}
