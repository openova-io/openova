{{- /* #5358: no guacd Deployment on a crossRegion `secondary` region, so no
   Service either (unlike guacamole-server, guacd is never dialled across the
   mesh — each region's webapp uses its own). */ -}}
{{- if include "bp-guacamole.renderWorkloads" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bp-guacamole.guacdName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
    catalyst.openova.io/component: guacd
spec:
  type: ClusterIP
  selector:
    {{- include "bp-guacamole.guacdSelectorLabels" . | nindent 4 }}
  ports:
    - name: guacd
      port: {{ .Values.guacamole.guacd.port }}
      targetPort: guacd
      protocol: TCP
{{- end }}
