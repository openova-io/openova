{{- /*
#3374 (2026-06-14) — Guacamole JDBC schema-init + admin USER_GROUP seed.

The guacamole-auth-sso-openid extension authenticates SSO users but has no
permission store, so every SSO user lands with no connections and NO admin
(the founder-witnessed #3374 gap; blueprint.yaml's `rolesFromGroup:
sovereign-admins: admin` intent was unimplemented). This Job wires the
bundled JDBC (postgresql) permission store with a SINGLE container (CNPG
postgres image — has psql) that:
  a. applies 001-create-schema.sql ONCE (idempotent guard: skip if the
     `guacamole_entity` table already exists),
  b. creates a `<adminGroup>` USER_GROUP entity holding the ADMINISTER
     (+ CREATE_*) system permissions, so any SSO user whose `groups`
     claim contains <adminGroup> inherits guacamole admin. We DELIBERATELY
     do NOT seed the default guacadmin/guacadmin password account from
     002-create-admin-user.sql — admin is group-driven via SSO only.

#3374 admin-tier (2026-06-14) — the schema SQL is now VENDORED into the chart
(files/postgresql/001-create-schema.sql, the verbatim Apache Guacamole 1.5.5
schema, loaded into the scripts ConfigMap via .Files.Get) instead of being
copied at runtime from the guacamole webapp image by an initContainer. WHY:
the kyverno `harbor-proxy-pull` Enforce policy uses an `anyPattern` that
requires ONE allowed glob to match BOTH the initContainers AND the containers
of a Job. The guacamole webapp image is `ghcr.io/openova-io/...` (matches the
native-push glob `STAR/openova-io/STAR` only; the private image 404s through
the Harbor proxy-ghcr cache — verified live on hw133) while the CNPG psql
image is `harbor.openova.io/proxy-ghcr/...` (matches the proxy glob
`STAR/proxy-STAR/STAR` only). No single glob matches both, so the
mixed-registry initContainer+container Job was DENIED (rolled bp-guacamole
0.2.10 back to 0.2.8 on hw133, so the permission store never installed and SSO
users had no admin Settings menu). Vendoring the static, version-pinned schema
removes the second registry entirely so the Job is single-container (proxy
glob) and passes. The vendored SQL is pinned to
`.Values.guacamole.webapp.image.tag` (1.5.5); bump both together on upgrade.

Combined with the Deployment's POSTGRESQL_AUTO_CREATE_ACCOUNTS=true +
OPENID_GROUPS_CLAIM_TYPE=groups, an `emrah.baysal`-in-sovereign-admins SSO
login auto-creates the JDBC user, binds it into the USER_GROUP, and lands it
as admin.

DB-direct via the CNPG <cluster>-app Secret (host/port/dbname/user/password).
enableSuperuserAccess on the Cluster is for the schema DDL; the app owner here
owns the objects it creates, so the app credential suffices for the seed.

Skip-render: guacamole.enabled=false, database.enabled=false, or the
postgresql.cnpg.io CRD absent.
*/ -}}
{{- $db := .Values.guacamole.database | default dict -}}
{{- $cl := $db.cluster | default dict -}}
{{- /* #5358: seeds + enrols against the local CNPG store, which only the
   crossRegion `primary` region renders. */ -}}
{{- if and (include "bp-guacamole.renderWorkloads" .) (default true $db.enabled) (.Capabilities.APIVersions.Has "postgresql.cnpg.io/v1") }}
{{- $name := $cl.name | default "guacamole-pg" -}}
{{- $appSecret := $db.appSecretName | default (printf "%s-app" $name) -}}
{{- $adminGroup := $db.adminGroup | default "sovereign-admins" -}}
{{- $pgImage := printf "%s:%s" ($cl.imageName | default "harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql") ($cl.pgVersion | default "16") -}}
{{- $sj := $db.seedJob | default dict -}}
{{- $jobName := printf "%s-jdbc-seed" (include "bp-guacamole.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- /* #3374: per-minute CronJob that enrolls SSO-auto-created USERs into the
   <adminGroup> membership so admin is deterministic (the runtime OIDC-group
   name-match did not reach the owner live on hw133 — #3475). */ -}}
{{- $cronName := printf "%s-admin-enroll" (include "bp-guacamole.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- $promoteSchedule := $db.promoteSchedule | default "* * * * *" -}}
{{- /* #5991 / UAT row 115 (2026-08-13) — the CONNECTION PRODUCER.

   Everything above this line seeds IDENTITY: the <adminGroup> USER_GROUP, its
   ADMINISTER + CREATE_* system permissions, and the per-minute enrollment of
   each SSO-auto-created USER into that group. That is the RIGHT to create a
   connection; it created none, and `guacamole_connection` — created empty by
   the vendored Apache schema (files/postgresql/001-create-schema.sql:109) —
   stayed at zero rows on every Sovereign. A signed-in sovereign-admin
   therefore reached Guacamole successfully and landed on an empty ALL
   CONNECTIONS list. No producer existed anywhere in the repo (the
   `GuacamoleConnection` CRD + `relay-controller` the README used to describe
   were never written; catalyst-api's `GuacamoleClient` interface has no
   production implementation and `SetGuacamoleClient` no non-test caller).

   The target set is DECLARED in .Values.guacamole.database.connections and
   rendered into seed_connections() below, one block per target. An empty
   declared set renders an EMPTY body — this producer writes zero rows rather
   than invent one, which matters more than usual on a table that carries
   credentials.

   Credentials NEVER come from values, this template, or the ConfigMap (public
   repo): each target may name an OPTIONAL Secret, mounted read-only at
   /conn-cred/<connection-name>, whose keys are read at run time. The
   render-time guard below FAILS the template if a credential-shaped parameter
   is set from values instead. */ -}}
{{- $conn := $db.connections | default dict -}}
{{- /* `default true X` is UNSAFE for a bool: sprig treats false as empty and
   hands back the default, so `enabled: false` would arm the producer anyway.
   hasKey is the only correct off-switch here. */ -}}
{{- $connEnabled := true -}}
{{- if hasKey $conn "enabled" }}{{- $connEnabled = $conn.enabled -}}{{- end -}}
{{- $targets := list -}}
{{- if $connEnabled -}}
{{- $ns := $conn.nodeShell | default dict -}}
{{- $nsEnabled := true -}}
{{- if hasKey $ns "enabled" }}{{- $nsEnabled = $ns.enabled -}}{{- end -}}
{{- if $nsEnabled -}}
{{- $targets = append $targets (dict
      "name" ($ns.name | default "sovereign-node")
      "protocol" ($ns.protocol | default "ssh")
      "hostnameFromNodeIP" true
      "params" (dict "port" (toString ($ns.port | default 22)) "username" ($ns.username | default "root"))
      "credentialSecretName" ($ns.credentialSecretName | default "")) -}}
{{- end -}}
{{- range $e := ($conn.extra | default list) -}}
{{- $targets = append $targets (dict
      "name" (required "bp-guacamole: every guacamole.database.connections.extra entry needs a name" $e.name)
      "protocol" (required "bp-guacamole: every guacamole.database.connections.extra entry needs a protocol" $e.protocol)
      "hostnameFromNodeIP" false
      "params" ($e.parameters | default dict)
      "credentialSecretName" ($e.credentialSecretName | default "")) -}}
{{- end -}}
{{- end -}}
{{- /* Render-time guards. Each one has a live failure mode: a credential in
   values would be committed to a public repo, and a quote in a name or value
   would break out of the single-quoted shell word the target block renders. */ -}}
{{- $credentialParams := list "password" "passphrase" "private-key" "client-key" "client-cert" "secret" "token" "auth-token" -}}
{{- range $t := $targets -}}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $t.name) -}}
{{- fail (printf "bp-guacamole: connection name %q is not [A-Za-z0-9._-]{1,64} — the name is rendered into a shell word and a Secret mount path" $t.name) -}}
{{- end -}}
{{- /* A connection with no hostname is a broken row, and a broken row is
   exactly what row 115's vacuity guard is written against. The nodeShell
   target gets its hostname at run time from the downward API; every other
   target must declare one. */ -}}
{{- if and (not $t.hostnameFromNodeIP) (not (get $t.params "hostname")) -}}
{{- fail (printf "bp-guacamole: connection %q declares no `hostname` parameter — a connection with nowhere to dial is not a connection" $t.name) -}}
{{- end -}}
{{- range $k, $v := $t.params -}}
{{- if has $k $credentialParams -}}
{{- fail (printf "bp-guacamole: connection %q sets credential parameter %q from values. Credentials must come from a Secret named by credentialSecretName and read at run time — never from values, this chart, or a ConfigMap (this repo is public)." $t.name $k) -}}
{{- end -}}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" $k) -}}
{{- fail (printf "bp-guacamole: connection %q parameter name %q is not [A-Za-z0-9._-]+" $t.name $k) -}}
{{- end -}}
{{- if contains "'" (toString $v) -}}
{{- fail (printf "bp-guacamole: connection %q parameter %q value contains a single quote, which would break the rendered shell word" $t.name $k) -}}
{{- end -}}
{{- end -}}
{{- end -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $jobName }}-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
    catalyst.openova.io/component: jdbc-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  common.sh: |
    # Shared: build PSQL from the mounted CNPG -app Secret + wait for db + the
    # admin-enroll function (#3374). Sourced by seed.sh (one-shot) + promote.sh
    # (per-minute CronJob).
    set -eu
    # /cnpg in the Pod (the CNPG -app Secret projection). Overridable so the
    # chart's own test harness can run THIS script — not a copy of it —
    # against a throwaway Postgres (tests/connection-seed-sql.sh).
    CRED="${CRED:-/cnpg}"
    PGHOST="$(cat "${CRED}/host")"
    PGPORT="$(cat "${CRED}/port" 2>/dev/null || echo 5432)"
    PGDATABASE="$(cat "${CRED}/dbname")"
    PGUSER="$(cat "${CRED}/user" 2>/dev/null || cat "${CRED}/username")"
    PGPASSWORD="$(cat "${CRED}/password")"
    export PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD
    PSQL="psql -v ON_ERROR_STOP=1 -qtA"
    ADMIN_GROUP="{{ $adminGroup }}"
    wait_for_db() {
      i=0
      until [ "$i" -ge 60 ]; do
        if $PSQL -c "SELECT 1;" >/dev/null 2>&1; then echo "[jdbc-seed] db reachable"; return 0; fi
        i=$((i+1)); echo "[jdbc-seed] waiting for postgres ($i/60)"; sleep 5
      done
      echo "[jdbc-seed] FATAL: postgres unreachable after 5min" >&2; return 1
    }
    # enroll_admins (#3374): write a guacamole_user_group_member row binding every
    # JDBC USER into <ADMIN_GROUP>. POSTGRESQL_AUTO_CREATE_ACCOUNTS auto-creates a
    # USER per SSO principal on first login, but the OIDC-group → permission
    # name-match (EntityMapper.xml selectEffectiveGroupIdentifiers UNION branch)
    # did NOT reach the owner live (admin menu absent, membership table empty —
    # #3475). The membership-CTE branch of that same query DOES grant the group's
    # ADMINISTER once a row exists (proven live on hw133). Skip if the schema
    # isn't applied yet. Idempotent (NOT EXISTS guard). The sovereign realm's
    # catalyst-pin IdP already restricts who can authenticate, so enrolling SSO
    # users as admin is correct for this Sovereign-level guacamole (same model as
    # bp-newapi's promote CronJob).
    enroll_admins() {
      if ! $PSQL -c "SELECT to_regclass('public.guacamole_user_group_member');" 2>/dev/null | grep -q '^guacamole_user_group_member$'; then
        echo "[jdbc-seed] schema not yet present — enroll deferred"; return 0
      fi
      n="$($PSQL <<SQL
    INSERT INTO guacamole_user_group_member (user_group_id, member_entity_id)
    SELECT ug.user_group_id, u.entity_id
    FROM guacamole_user u
    JOIN guacamole_entity ue ON ue.entity_id = u.entity_id AND ue.type = 'USER'
    CROSS JOIN guacamole_user_group ug
    JOIN guacamole_entity ge ON ge.entity_id = ug.entity_id
       AND ge.name = '${ADMIN_GROUP}' AND ge.type = 'USER_GROUP'
    WHERE NOT EXISTS (
      SELECT 1 FROM guacamole_user_group_member m
      WHERE m.user_group_id = ug.user_group_id AND m.member_entity_id = u.entity_id
    )
    RETURNING member_entity_id;
    SQL
    )"
      cnt="$(printf '%s' "$n" | grep -c . || true)"
      echo "[jdbc-seed] enrolled ${cnt} user(s) into ${ADMIN_GROUP}"
    }
    # ── connection producer (#5991 / UAT row 115) ──────────────────────────
    # ensure_connection <name> <protocol>: create the connection if absent and
    # grant the admin USER_GROUP READ on it (what makes it render in ALL
    # CONNECTIONS for a member who is not a system admin).
    #
    # The absence guard is NOT EXISTS rather than ON CONFLICT because the
    # schema's UNIQUE (connection_name, parent_id) does NOT dedupe root-level
    # connections: parent_id is NULL there and Postgres treats NULLs as
    # distinct, so a bare INSERT adds one duplicate per run — and this runs
    # every minute from promote.sh.
    #
    # Every value crosses into SQL as a psql :'var' literal, never string
    # concatenation, so a hostname or key containing a quote cannot terminate
    # the statement.
    ensure_connection() {
      cname="$1"; cproto="$2"
      $PSQL -v cname="$cname" -v cproto="$cproto" -v agroup="$ADMIN_GROUP" <<'SQL'
    INSERT INTO guacamole_connection (connection_name, protocol)
    SELECT :'cname', :'cproto'
    WHERE NOT EXISTS (
      SELECT 1 FROM guacamole_connection
      WHERE connection_name = :'cname' AND parent_id IS NULL
    );
    UPDATE guacamole_connection SET protocol = :'cproto'
    WHERE connection_name = :'cname' AND parent_id IS NULL AND protocol <> :'cproto';
    INSERT INTO guacamole_connection_permission (entity_id, connection_id, permission)
    SELECT e.entity_id, c.connection_id, 'READ'::guacamole_object_permission_type
    FROM guacamole_entity e
    JOIN guacamole_connection c
      ON c.connection_name = :'cname' AND c.parent_id IS NULL
    WHERE e.name = :'agroup' AND e.type = 'USER_GROUP'
      AND NOT EXISTS (
        SELECT 1 FROM guacamole_connection_permission p
        WHERE p.entity_id = e.entity_id AND p.connection_id = c.connection_id
          AND p.permission = 'READ'
      );
    SQL
    }
    # set_connection_parameter <name> <param> <value>: converge one parameter.
    # Empty value writes nothing — an empty hostname is a broken connection,
    # not a connection.
    set_connection_parameter() {
      cname="$1"; pname="$2"; pvalue="$3"
      if [ -z "$pvalue" ]; then
        echo "[jdbc-seed] ${cname}: parameter ${pname} has no value — not written"
        return 0
      fi
      $PSQL -v cname="$cname" -v pname="$pname" -v pvalue="$pvalue" <<'SQL'
    INSERT INTO guacamole_connection_parameter (connection_id, parameter_name, parameter_value)
    SELECT c.connection_id, :'pname', :'pvalue'
    FROM guacamole_connection c
    WHERE c.connection_name = :'cname' AND c.parent_id IS NULL
    ON CONFLICT (connection_id, parameter_name)
    DO UPDATE SET parameter_value = EXCLUDED.parameter_value;
    SQL
    }
    # load_connection_credentials <name> <dir>: credential material is read
    # HERE, at run time, from a Secret mounted read-only — it is never in
    # values, in this chart, or in the ConfigMap. The mount is optional, so an
    # absent Secret leaves the connection credential-free (guacd then prompts
    # the signed-in sovereign-admin) instead of failing the seed.
    load_connection_credentials() {
      cname="$1"; dir="$2"
      [ -n "$dir" ] || return 0
      if [ ! -d "$dir" ]; then
        echo "[jdbc-seed] ${cname}: credential Secret not mounted — connection left credential-free"
        return 0
      fi
      for key in username password private-key passphrase; do
        [ -f "${dir}/${key}" ] || continue
        set_connection_parameter "$cname" "$key" "$(cat "${dir}/${key}")"
        echo "[jdbc-seed] ${cname}: ${key} sourced from the mounted Secret"
      done
    }
    # seed_connections: converge the DECLARED set. The per-target blocks are
    # rendered from .Values.guacamole.database.connections — declare nothing
    # and this function's body is empty, which is deliberate: zero rows beats
    # a fabricated one on a table that holds credentials.
    seed_connections() {
      if ! $PSQL -c "SELECT to_regclass('public.guacamole_connection');" 2>/dev/null | grep -q '^guacamole_connection$'; then
        echo "[jdbc-seed] schema not yet present — connection seeding deferred"; return 0
      fi
{{- range $t := $targets }}
      # ── target: {{ $t.name }} ({{ $t.protocol }}) ──
  {{- if $t.hostnameFromNodeIP }}
      # Hostname is this Sovereign's own node, learned from the downward API
      # (status.hostIP) — no cluster read, no node list baked into the chart.
      if [ -z "${NODE_IP:-}" ]; then
        echo "[jdbc-seed] {{ $t.name }}: NODE_IP empty — connection NOT written (a target is never invented)"
      else
        ensure_connection '{{ $t.name }}' '{{ $t.protocol }}'
        set_connection_parameter '{{ $t.name }}' 'hostname' "${NODE_IP}"
    {{- range $k, $v := $t.params }}
        set_connection_parameter '{{ $t.name }}' '{{ $k }}' '{{ toString $v }}'
    {{- end }}
        load_connection_credentials '{{ $t.name }}' "{{ if $t.credentialSecretName }}${CONN_CRED_DIR:-/conn-cred}/{{ $t.name }}{{ end }}"
      fi
  {{- else }}
      ensure_connection '{{ $t.name }}' '{{ $t.protocol }}'
    {{- range $k, $v := $t.params }}
      set_connection_parameter '{{ $t.name }}' '{{ $k }}' '{{ toString $v }}'
    {{- end }}
      load_connection_credentials '{{ $t.name }}' "{{ if $t.credentialSecretName }}${CONN_CRED_DIR:-/conn-cred}/{{ $t.name }}{{ end }}"
  {{- end }}
{{- end }}
      echo "[jdbc-seed] guacamole_connection holds $($PSQL -c 'SELECT count(*) FROM guacamole_connection;') row(s)"
    }
  seed.sh: |
    . "${SCRIPTS_DIR:-/scripts}/common.sh"
    echo "[jdbc-seed] target=${PGHOST}:${PGPORT}/${PGDATABASE} user=${PGUSER}"
    wait_for_db

    # (1) Apply the guacamole JDBC schema ONCE. The schema SQL (copied out of
    #     the guacamole image by the initContainer) creates the enum TYPEs +
    #     ~15 tables. Idempotency guard: skip when guacamole_entity exists.
    if $PSQL -c "SELECT to_regclass('public.guacamole_entity');" | grep -q '^guacamole_entity$'; then
      echo "[jdbc-seed] schema already present — skipping 001-create-schema.sql"
    else
      echo "[jdbc-seed] applying 001-create-schema.sql"
      $PSQL -f "${SCHEMA_DIR:-/schema}/001-create-schema.sql"
      echo "[jdbc-seed] schema applied"
    fi

    # (2) Seed the admin USER_GROUP (idempotent). Members inherit guacamole
    #     admin (ADMINISTER) + the CREATE_* system permissions. The openid
    #     extension binds an SSO user into this group when its `groups` claim
    #     contains the name. NO password account is created — SSO-only admin.
    #     ADMIN_GROUP is exported by common.sh.
    $PSQL <<SQL
    INSERT INTO guacamole_entity (name, type)
    SELECT '${ADMIN_GROUP}', 'USER_GROUP'
    WHERE NOT EXISTS (
      SELECT 1 FROM guacamole_entity WHERE name = '${ADMIN_GROUP}' AND type = 'USER_GROUP'
    );

    INSERT INTO guacamole_user_group (entity_id)
    SELECT entity_id FROM guacamole_entity
    WHERE name = '${ADMIN_GROUP}' AND type = 'USER_GROUP'
      AND entity_id NOT IN (SELECT entity_id FROM guacamole_user_group);

    INSERT INTO guacamole_system_permission (entity_id, permission)
    SELECT e.entity_id, p.permission::guacamole_system_permission_type
    FROM (VALUES
      ('CREATE_CONNECTION'),
      ('CREATE_CONNECTION_GROUP'),
      ('CREATE_SHARING_PROFILE'),
      ('CREATE_USER'),
      ('CREATE_USER_GROUP'),
      ('ADMINISTER')
    ) AS p(permission)
    JOIN guacamole_entity e ON e.name = '${ADMIN_GROUP}' AND e.type = 'USER_GROUP'
    WHERE NOT EXISTS (
      SELECT 1 FROM guacamole_system_permission sp
      WHERE sp.entity_id = e.entity_id
        AND sp.permission = p.permission::guacamole_system_permission_type
    );
    SQL
    echo "[jdbc-seed] admin USER_GROUP '${ADMIN_GROUP}' ensured with ADMINISTER"

    # (3) Enroll any already-present SSO-auto-created USER into the admin group
    #     (catch-up for owners who logged in before this seed ran). The
    #     per-minute admin-enroll CronJob covers first-login users going forward.
    enroll_admins

    # (4) Converge the declared connection set (#5991 / UAT row 115). Runs
    #     AFTER enrollment so a fault here can never cost the owner their
    #     admin grant, and again every minute from promote.sh.
    seed_connections
    echo "[jdbc-seed] done."
  promote.sh: |
    . "${SCRIPTS_DIR:-/scripts}/common.sh"
    wait_for_db
    enroll_admins
    seed_connections
  # Verbatim Apache Guacamole 1.5.5 PostgreSQL schema, vendored into the chart
  # (files/postgresql/001-create-schema.sql) and pinned to
  # .Values.guacamole.webapp.image.tag. Loaded here so the seed container needs
  # ONLY the CNPG postgres image (no mixed-registry initContainer → kyverno
  # harbor-proxy-pull anyPattern passes; see the header note).
  001-create-schema.sql: |
{{ .Files.Get "files/postgresql/001-create-schema.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
    catalyst.openova.io/component: jdbc-seed
    # kyverno `flux-managed` Enforce DENIES a Job without this label (helm
    # hook Jobs are helm-controller-created, no HR ownerReference). Without it
    # the post-upgrade seed fails and the HR rolls back — the exact landmine
    # that stalled bp-guacamole 0.2.10 on hw133 (#3374; #3434/#3296 class).
    app.kubernetes.io/managed-by: flux
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ $sj.backoffLimit | default 6 }}
  activeDeadlineSeconds: {{ $sj.activeDeadlineSeconds | default 420 }}
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "bp-guacamole.selectorLabels" . | nindent 8 }}
        catalyst.openova.io/component: jdbc-seed
    spec:
      restartPolicy: OnFailure
      {{- with .Values.guacamole.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        # SINGLE container (CNPG postgres image — has psql). The schema SQL is
        # vendored into the scripts ConfigMap (.Files.Get) and mounted at
        # /schema, so there is no second-registry initContainer for kyverno's
        # harbor-proxy-pull anyPattern to reject (see the header note).
        - name: jdbc-seed
          image: {{ $pgImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/seed.sh"]
          # #5991: the node-shell connection's hostname. The downward API is
          # the whole node-address mechanism — no cluster read, no RBAC, and
          # nothing about the Sovereign's addresses baked into a public chart.
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            # Same ConfigMap re-mounted read-only at /schema — seed.sh reads
            # /schema/001-create-schema.sql (the vendored schema key).
            - name: scripts
              mountPath: /schema
            - name: cnpg
              mountPath: /cnpg
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- range $i, $t := $targets }}
            {{- if $t.credentialSecretName }}
            - name: conn-cred-{{ $i }}
              mountPath: {{ printf "/conn-cred/%s" $t.name | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml ($sj.resources | default (dict "requests" (dict "cpu" "10m" "memory" "64Mi") "limits" (dict "cpu" "200m" "memory" "128Mi"))) | nindent 12 }}
      volumes:
        - name: scripts
          configMap:
            name: {{ $jobName }}-scripts
            defaultMode: 0555
        - name: cnpg
          secret:
            secretName: {{ $appSecret | quote }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        {{- range $i, $t := $targets }}
        {{- if $t.credentialSecretName }}
        # #5991: connection credential for {{ $t.name }} — optional, so the
        # connection is still produced (credential-free) when it is absent.
        - name: conn-cred-{{ $i }}
          secret:
            secretName: {{ $t.credentialSecretName | quote }}
            optional: true
        {{- end }}
        {{- end }}
---
{{- /* #3374 (2026-06-14): per-minute admin-enroll CronJob. Binds every
   SSO-auto-created JDBC USER into <adminGroup> membership so the owner's FIRST
   bare-URL SSO login lands as admin within ~1 min (the runtime OIDC-group
   name-match did not reach the owner live on hw133 — #3475). Reuses the
   one-shot seed Job's scripts ConfigMap (promote.sh → enroll_admins). */ -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $cronName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
    catalyst.openova.io/component: admin-enroll
    # kyverno `flux-managed` Enforce gates helm-hook CronJobs AND their spawned
    # Jobs (no HR ownerReference) — stamp managed-by=flux on both. Same landmine
    # that stalled the seed Job (#3374 / #3434 class).
    app.kubernetes.io/managed-by: flux
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "12"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  schedule: {{ $promoteSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 120
  jobTemplate:
    metadata:
      labels:
        {{- include "bp-guacamole.labels" . | nindent 8 }}
        catalyst.openova.io/component: admin-enroll
        app.kubernetes.io/managed-by: flux
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 120
      template:
        metadata:
          labels:
            {{- include "bp-guacamole.selectorLabels" . | nindent 12 }}
            catalyst.openova.io/component: admin-enroll
        spec:
          restartPolicy: OnFailure
          {{- with .Values.guacamole.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: admin-enroll
              image: {{ $pgImage | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/promote.sh"]
              # #5991: same downward-API node address as the seed Job — this
              # CronJob is the CONVERGING leg of the connection producer, so a
              # restored or rebuilt database returns to the declared set on its
              # own within one minute.
              env:
                - name: NODE_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: cnpg
                  mountPath: /cnpg
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                {{- range $i, $t := $targets }}
                {{- if $t.credentialSecretName }}
                - name: conn-cred-{{ $i }}
                  mountPath: {{ printf "/conn-cred/%s" $t.name | quote }}
                  readOnly: true
                {{- end }}
                {{- end }}
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: scripts
              configMap:
                name: {{ $jobName }}-scripts
                defaultMode: 0555
            - name: cnpg
              secret:
                secretName: {{ $appSecret | quote }}
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 8Mi
            {{- range $i, $t := $targets }}
            {{- if $t.credentialSecretName }}
            - name: conn-cred-{{ $i }}
              secret:
                secretName: {{ $t.credentialSecretName | quote }}
                optional: true
            {{- end }}
            {{- end }}
{{- end }}
