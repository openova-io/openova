{{- /* #5358: `renderWorkloads` is empty on a crossRegion `secondary` region —
   that region must run NO webapp Pod so its guacamole-server Service has zero
   local backends and falls through the ClusterMesh to the primary singleton. */ -}}
{{- if include "bp-guacamole.renderWorkloads" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bp-guacamole.webappName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
    catalyst.openova.io/component: webapp
spec:
  replicas: {{ .Values.guacamole.webapp.replicas }}
  # #3374 (2026-06-14): Recreate, not the default RollingUpdate. The webapp
  # mounts the `guacamole-recordings` PVC ReadWriteOnce (seaweedfs-pvc.yaml).
  # Under RollingUpdate the OLD pod keeps the RWO PVC bound to its node until
  # the NEW pod is Ready, so the new pod can never schedule — it Pends forever
  # with `volume node affinity conflict` + `Insufficient cpu` (caught live on
  # hw133: the post-#3374-DB-seed replica stuck Pending 40m while the stale
  # pre-seed pod — with no Postgres env, so no JDBC permission store — kept
  # serving, leaving SSO users with no admin menu). Recreate terminates the old
  # pod first → releases the RWO PVC → the new pod (with POSTGRESQL_* + JDBC)
  # schedules and enrolls SSO users into the sovereign-admins admin group.
  # Single-replica app (ADR-0001 §11 caps Guacamole at one per Sovereign), so
  # the brief Recreate gap is acceptable.
  strategy:
    type: {{ .Values.guacamole.webapp.strategy | default "Recreate" | quote }}
  selector:
    matchLabels:
      {{- include "bp-guacamole.webappSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bp-guacamole.labels" . | nindent 8 }}
        catalyst.openova.io/component: webapp
    spec:
      securityContext:
        {{- toYaml .Values.guacamole.podSecurityContext | nindent 8 }}
      {{- with .Values.guacamole.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: guacamole
          image: {{ include "bp-guacamole.webappImage" . | quote }}
          imagePullPolicy: {{ .Values.guacamole.webapp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.guacamole.webapp.port }}
              protocol: TCP
          env:
            # Backend protocol-handler — the guacd Service in this namespace.
            - name: GUACD_HOSTNAME
              value: {{ include "bp-guacamole.guacdName" . | quote }}
            - name: GUACD_PORT
              value: {{ .Values.guacamole.guacd.port | quote }}

            {{- $ssoMode := include "bp-guacamole.ssoMode" . }}
            {{- if eq $ssoMode "header" }}
            # SSO — header mode (#5358, DEFAULT). The Sovereign's
            # bp-oidc-gate (oauth2-proxy, slot 13c) fronts the public
            # hostname, runs the Keycloak AUTHORIZATION-CODE flow
            # server-side, and asserts the authenticated principal to
            # this webapp on every proxied request via the header below
            # (oauth2-proxy --pass-user-headers, default-on). The
            # image-bundled guacamole-auth-header extension consumes it.
            # No id_token ever transits the browser URL, so the #5358
            # implicit-flow fragment-replay ("Rejected OpenID token with
            # invalid/old nonce" → error page + session poison) is
            # structurally impossible. The webapp is reachable ONLY from
            # the gate pods (see networkpolicy.yaml ingress guard) —
            # header identity is trusted, so the direct path is closed.
            {{- $ssoHeader := ((.Values.guacamole.sso | default dict).header) | default dict }}
            - name: HEADER_ENABLED
              value: "true"
            - name: HTTP_AUTH_HEADER
              value: {{ $ssoHeader.name | default "X-Forwarded-Email" | quote }}
            {{- else }}
            # OIDC — LEGACY sso.mode=openid path (see values.yaml
            # guacamole.sso for why this is no longer the default:
            # upstream guacamole-auth-sso-openid is implicit-flow-only
            # through 1.6.0 and the SPA's fragment re-submission replays
            # the single-use nonce, #5358). Every value below is
            # operator-driven via per-Sovereign overlay, never hardcoded
            # (INVIOLABLE-PRINCIPLES #4). Empty values fail the helm
            # template render via _helpers.tpl.
            #
            # G117.5 W3.D1 #2744 — `?kc_idp_hint=catalyst-pin` appended
            # so the Guacamole webapp's auth redirect carries the IdP
            # hint as defense-in-depth alongside the sovereign realm IDR
            # `defaultProvider` (bp-keycloak 1.4.9, PR #2730). Hardens
            # against operator drift on the realm IDR config + per-Org
            # realm chains where IDR points at `sovereign-broker`. Refs
            # G113 `feedback_g113_sso_idr_defaultprovider_fix.md`.
            - name: OPENID_AUTHORIZATION_ENDPOINT
              value: "{{ include "bp-guacamole.oidcIssuer" . }}/protocol/openid-connect/auth?kc_idp_hint=catalyst-pin"
            - name: OPENID_JWKS_ENDPOINT
              value: "{{ include "bp-guacamole.oidcIssuer" . }}/protocol/openid-connect/certs"
            - name: OPENID_ISSUER
              value: "{{ include "bp-guacamole.oidcIssuer" . }}"
            - name: OPENID_CLIENT_ID
              value: {{ .Values.guacamole.oidc.clientId | quote }}
            - name: OPENID_REDIRECT_URI
              value: "{{ include "bp-guacamole.oidcRedirectURI" . }}"
            - name: OPENID_GROUPS_CLAIM_TYPE
              value: {{ .Values.guacamole.oidc.groupsClaim | quote }}
            # Client secret — pulled from the SealedSecret's resulting
            # Secret. The reference here keeps the plaintext OUT of the
            # ConfigMap / Deployment manifest (INVIOLABLE-PRINCIPLES #5).
            - name: OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.guacamole.oidc.clientSecretRef.name }}
                  key: {{ .Values.guacamole.oidc.clientSecretRef.key }}
                  optional: false
            {{- end }}

            {{- $db := .Values.guacamole.database | default dict }}
            {{- if and (default true $db.enabled) ((default dict $db.cluster).enabled | default true) }}
            # PostgreSQL JDBC permission store (#3374). The guacamole
            # entrypoint installs the bundled guacamole-auth-jdbc-postgresql
            # extension when POSTGRESQL_HOSTNAME is set; combined with the
            # SSO extension above (header or openid per sso.mode) it gives
            # SSO users a real permission store. AUTO_CREATE_ACCOUNTS
            # provisions a JDBC record per SSO principal on first login; the
            # schema-seed Job's <adminGroup> USER_GROUP (ADMINISTER) + the
            # #3374 admin-enroll CronJob membership rows make
            # sovereign-admins members land as admin (auth-source-agnostic).
            {{- $cl := $db.cluster | default dict }}
            {{- $clName := $cl.name | default "guacamole-pg" }}
            {{- $clNs := $cl.namespace | default .Release.Namespace }}
            - name: POSTGRESQL_HOSTNAME
              value: {{ printf "%s-rw.%s.svc.cluster.local" $clName $clNs | quote }}
            - name: POSTGRESQL_PORT
              value: "5432"
            - name: POSTGRESQL_DATABASE
              value: {{ $cl.database | default "guacamole_db" | quote }}
            # #3374 (2026-06-14): the env var is POSTGRESQL_USER, NOT
            # POSTGRESQL_USERNAME. The Apache Guacamole image entrypoint
            # (guacamole-docker .../bin/start.sh) requires POSTGRESQL_USER and
            # FATALs `Missing required environment variables ... POSTGRESQL_USER`
            # otherwise — which is exactly how the JDBC-enabled webapp pod
            # crash-looped the moment it finally scheduled on hw133 (the
            # POSTGRESQL_USERNAME name never matched, so the bundled JDBC
            # extension never connected and the permission store was unreachable
            # → no admin). Fixed to the upstream-canonical POSTGRESQL_USER.
            - name: POSTGRESQL_USER
              value: {{ $cl.owner | default "guacamole" | quote }}
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db.appSecretName | default (printf "%s-app" $clName) | quote }}
                  key: password
                  optional: false
            - name: POSTGRESQL_SSL_MODE
              value: {{ $db.sslMode | default "require" | quote }}
            - name: POSTGRESQL_AUTO_CREATE_ACCOUNTS
              value: {{ $db.autoCreateAccounts | default true | quote }}
            # When multiple auth extensions are present, the SSO extension
            # (header or openid per sso.mode) must run first so the SSO
            # identity is the authenticated principal and JDBC is the
            # permission store (not a second login); JDBC accounts are
            # auto-created/looked-up for it.
            - name: EXTENSION_PRIORITY
              value: {{ printf "%s, postgresql" $ssoMode | quote }}
            {{- end }}
            # #5598 — REST-session lifetime. The image entrypoint maps this
            # to the `api-session-timeout` property (upstream default 60
            # minutes). Behind the oidc-gate the OUTER session lives ~168h,
            # so the upstream default left the browser's cached GUAC_AUTH
            # token dead on any >60-min revisit: every session API call
            # 403'd PERMISSION_DENIED and the SPA rendered the bare
            # "An error has occurred" banner without re-authenticating
            # (hw292 access-log proof — see values.yaml
            # webapp.apiSessionTimeoutMinutes for the full evidence chain).
            # Aligned to the gate's cookie lifetime so the inner token
            # never expires before the outer session.
            - name: API_SESSION_TIMEOUT
              value: {{ .Values.guacamole.webapp.apiSessionTimeoutMinutes | default 10080 | quote }}
            # Recording path — guacd writes here; the webapp ships
            # captures off to SeaweedFS via the shipper container below.
            - name: RECORDING_PATH
              value: {{ .Values.guacamole.recordings.mountPath | quote }}
          volumeMounts:
            - name: recordings
              mountPath: {{ .Values.guacamole.recordings.mountPath }}
            - name: tmp
              mountPath: /tmp
            - name: tomcat-work
              mountPath: /usr/local/tomcat/work
            - name: tomcat-temp
              mountPath: /usr/local/tomcat/temp
            # The Apache Guacamole webapp writes its per-user runtime
            # state (logback marker file, optional auth state) to
            # ~/.guacamole on first start. With readOnlyRootFilesystem
            # the container cannot mkdir under $HOME unless we mount
            # a writable emptyDir there.
            #
            # IMPORTANT: we mount the PARENT directory (/home/guacamole)
            # rather than /home/guacamole/.guacamole itself. The official
            # guacamole image entrypoint runs
            # `rm -rf $GUACAMOLE_HOME` (== `/home/guacamole/.guacamole`)
            # before re-populating it on every start. If we mounted the
            # emptyDir at $GUACAMOLE_HOME directly the entrypoint would
            # fail with `rm: cannot remove '/home/guacamole/.guacamole':
            # Read-only file system` because you cannot unlink a mount
            # point from inside the container. Mounting the parent
            # makes .guacamole a regular subdirectory of the emptyDir
            # which the entrypoint can freely rm and recreate.
            - name: guacamole-home
              mountPath: /home/guacamole
          resources:
            {{- toYaml .Values.guacamole.webapp.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.guacamole.containerSecurityContext | nindent 12 }}
          # The Apache Guacamole webapp deploys under Tomcat's context
          # path `/guacamole/` (the WAR is `guacamole.war` so Tomcat
          # exposes it at `/<warname>/`). The container root path `/`
          # is NOT served by the webapp — it returns 404 from Tomcat's
          # ROOT context. Probing `/` previously caused liveness +
          # readiness probes to fail with HTTP 404, the kubelet to
          # restart the Pod every ~60s, and the kube-system Cilium
          # gateway to return 503 to the public hostname because no
          # endpoint was ever Ready (observed on t22, 5 restarts).
          # Probing `/guacamole/` matches the actual webapp root.
          # Operator-visible /guacamole.html → /guacamole/ redirect is
          # handled by the HTTPRoute (separate PR / TBD-G6 follow-up).
          livenessProbe:
            httpGet:
              path: /guacamole/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /guacamole/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        # #3374 (2026-06-14): recordings volume is emptyDir by DEFAULT
        # (recordings.persistence=false). The persistent PVC pinned the webapp
        # Pod to one node: on hw133 the `seaweedfs-storage` class is actually
        # backed by rancher.io/local-path, so the PVC's PV carries a HARD
        # node-affinity to the node that provisioned it (RWO). That node was at
        # 97% CPU requests, so the post-#3374-DB-seed replica (the one with the
        # POSTGRESQL_* env + JDBC permission store) Pended forever with `volume
        # node affinity conflict` + `Insufficient cpu`, while the stale pre-seed
        # pod kept serving with no admin menu. Session-capture recordings are
        # NOT required for core Guacamole or the admin walk, and a solo-node
        # local-path PVC is fragile anyway — so default to an emptyDir (no
        # node-pin → schedules on any node with CPU). Operators who run real
        # distributed SeaweedFS RWX flip recordings.persistence=true.
        - name: recordings
          {{- if .Values.guacamole.recordings.persistence }}
          persistentVolumeClaim:
            claimName: {{ include "bp-guacamole.recordingsName" . }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.guacamole.recordings.emptyDirSizeLimit | default "2Gi" | quote }}
          {{- end }}
        - name: tmp
          emptyDir: {}
        # Tomcat insists on writable work + temp dirs even with
        # readOnlyRootFilesystem. emptyDir mounts satisfy them
        # without compromising the rest of the FS.
        - name: tomcat-work
          emptyDir: {}
        - name: tomcat-temp
          emptyDir: {}
        - name: guacamole-home
          emptyDir: {}
{{- end }}
