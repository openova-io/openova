{{- /* #5358: guacd exists only to serve the local webapp; a crossRegion
   `secondary` region runs neither. */ -}}
{{- if include "bp-guacamole.renderWorkloads" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bp-guacamole.guacdName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-guacamole.labels" . | nindent 4 }}
    catalyst.openova.io/component: guacd
spec:
  replicas: {{ .Values.guacamole.guacd.replicas }}
  selector:
    matchLabels:
      {{- include "bp-guacamole.guacdSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bp-guacamole.labels" . | nindent 8 }}
        catalyst.openova.io/component: guacd
    spec:
      securityContext:
        {{- toYaml .Values.guacamole.podSecurityContext | nindent 8 }}
      {{- with .Values.guacamole.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: guacd
          image: {{ include "bp-guacamole.guacdImage" . | quote }}
          imagePullPolicy: {{ .Values.guacamole.guacd.image.pullPolicy }}
          ports:
            - name: guacd
              containerPort: {{ .Values.guacamole.guacd.port }}
              protocol: TCP
          # /recordings is mounted from the SeaweedFS-backed PVC; guacd
          # writes session captures here, which the webapp's S3 sidecar
          # ships off to the SeaweedFS bucket asynchronously.
          volumeMounts:
            - name: recordings
              mountPath: {{ .Values.guacamole.recordings.mountPath }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.guacamole.guacd.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.guacamole.containerSecurityContext | nindent 12 }}
          # guacd has no /healthz endpoint of its own — TCP probe on
          # the protocol port is the canonical liveness signal per
          # upstream guacamole-server docs.
          livenessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        # #3629: mirror the webapp's #3374 fallback — when
        # recordings.persistence is false (the default), the `recordings`
        # volume is an emptyDir, NOT the `guacamole-recordings` PVC. The
        # guacd-deployment.yaml volume block previously hard-referenced the
        # PVC unconditionally while seaweedfs-pvc.yaml only renders it under
        # `persistence: true`, so guacd FailedScheduling
        # (`persistentvolumeclaim "guacamole-recordings" not found`) forever
        # on the default path. Operators who run real distributed SeaweedFS
        # RWX flip recordings.persistence=true and both Pods bind the PVC.
        - name: recordings
          {{- if .Values.guacamole.recordings.persistence }}
          persistentVolumeClaim:
            claimName: {{ include "bp-guacamole.recordingsName" . }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.guacamole.recordings.emptyDirSizeLimit | default "2Gi" | quote }}
          {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
