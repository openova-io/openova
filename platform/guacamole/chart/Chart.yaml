apiVersion: v2
name: bp-guacamole
# 0.2.30 (#5358): SSO moves off the upstream implicit flow — new
# `guacamole.sso.mode` knob, DEFAULT `header`. Root cause (live on hw288):
# guacamole-auth-sso-openid is implicit-flow-only (response_type=id_token in
# the URL fragment) through 1.6.0 AND git master — no released version
# supports the authorization-code flow (verified against upstream
# ConfigurationService/AuthenticationProviderService source for 1.5.5, 1.6.0
# and master) — and the AngularJS SPA re-submits the fragment id_token via
# updateCurrentToken($location.search()) on EVERY route change while the
# server-side nonce is strictly single-use (NonceService.isValid removes on
# first test, 1.6.0 unchanged). The replay poisons the just-created session:
# "TokenValidationService - Rejected OpenID token with invalid/old nonce" →
# generic error page + local login form (UAT rows 35/115; 4/4 deterministic
# under Playwright). No 1.5.x/1.6.x config knob eliminates the replay, so the
# FIX moves the OIDC leg out of the browser: the Sovereign's bp-oidc-gate
# (oauth2-proxy, slot 13c) now fronts guacamole.<fqdn> running the
# authorization-code flow server-side (client secret via bp-sso-bridge →
# OpenBao → ExternalSecret) and asserts the principal to the webapp via
# X-Forwarded-Email (oauth2-proxy --pass-user-headers), consumed by the
# image-bundled guacamole-auth-header extension (HEADER_ENABLED=true) — no
# id_token ever transits the browser URL. JDBC permission store + the #3374
# admin-enroll CronJob are auth-source-agnostic and unchanged; usernames stay
# byte-identical (openid-username-claim-type default was `email`). In header
# mode the chart renders NO HTTPRoute (the slot-13c gate instance owns the
# hostname; a direct route would bypass auth) and adds a webapp ingress
# NetworkPolicy admitting ONLY the oidc-gate pods (header identity is
# trusted). sso.mode=openid preserves the legacy shape byte-identically for
# operators fronting guacamole with their own code-flow proxy. Lockstep:
# 52-bp-guacamole.yaml pin + 13c-bp-oidc-gate.yaml guacamole instance +
# blueprint.yaml + catalog-seed source.version → 0.2.30. Refs #5358.
# 0.2.28 (#4885): honour global.imageRegistry for the guacd + webapp openova-io
# images so the self-sovereign-cutover step-07 image pivot reaches these Pods.
# _helpers.tpl guacdImage/webappImage now route through a new registryImage
# helper (host-swap on the leading registry segment when global.imageRegistry is
# set; verbatim ghcr.io otherwise — default byte-identical pre-cutover). New
# `global.imageRegistry: ""` seam in values.yaml. The 3rd-party sidecar/curl
# images carry their own registry and are untouched. Lockstep: 52-bp-guacamole.yaml
# pin + blueprint.yaml + catalog-seed source.version → 0.2.28. Refs #4885.
# 0.2.17 (#3374, 2026-06-14): admin group-enrollment fix. After 0.2.16 landed
# the JDBC permission store (sovereign-admins USER_GROUP with ADMINISTER + the
# scheduling/POSTGRESQL_USER fixes), the owner STILL got no admin menu —
# `guacamole_user_group_member` was EMPTY (#3475 re-walk). ROOT CAUSE: Guacamole
# resolves a USER_GROUP's permissions via EITHER a membership row OR a runtime
# name-match against the OIDC `groups` claim (EntityMapper.xml
# selectEffectiveGroupIdentifiers); the runtime name-match did NOT reach the
# owner live even though the id_token carried groups:[sovereign-admins,...]. FIX:
# make admin DETERMINISTIC via the membership row — jdbc-schema-seed-job.yaml now
# enrolls every SSO-auto-created JDBC USER into <adminGroup> (POSTGRESQL_AUTO_
# CREATE_ACCOUNTS creates the USER on first login; an enroll writes the
# guacamole_user_group_member row). A per-minute admin-enroll CronJob covers
# first-login users; the post-upgrade seed Job runs a catch-up. Proven live on
# hw133: with the row, emrah resolves sovereign-admins → ADMINISTER (admin menu).
# The sovereign realm's catalyst-pin IdP already gates WHO authenticates, so
# enrolling SSO users as admin matches the chart intent (same model as
# bp-newapi's promote CronJob). New `database.promoteSchedule` knob. Lockstep:
# 52-bp-guacamole.yaml pin → 0.2.17. Refs #3374.
# 0.1.1 (qa-loop iter-7 Fix #39): canonical short resource names
# (`guacd`, `guacamole-server`, `guacamole-recordings`); GHCR-mirrored
# upstream images so every Sovereign pulls from a registry we own;
# realm-patch ConfigMap lands in `keycloak` namespace (was: realm-name,
# which would have failed on every Sovereign); `realmConfig.namespace`
# override surface for non-default bp-keycloak placements.
# 0.1.3 (Fix #39 follow-up): default imagePullSecrets to [{name:
# ghcr-pull}] so the Deployments can pull from private GHCR without
# per-Sovereign overlay. The `ghcr-pull` secret is the canonical
# pull-credential surface across every Sovereign.
# 0.1.5 (Fix #39 follow-up): add /home/guacamole/.guacamole emptyDir
# mount so the webapp's first-start mkdir succeeds with
# readOnlyRootFilesystem=true. Without it pods crash-looped with
# `mkdir: cannot create directory '/home/guacamole/.guacamole':
# Read-only file system`.
# 0.1.9 (qa-loop iter-11 Fix #45 Cluster-A): pre-install/pre-upgrade
# Helm hook (Job + per-release ServiceAccount/Role/RoleBinding +
# cluster-scoped ClusterRole/ClusterRoleBinding for PV cleanup) that
# detects when the existing `guacamole-recordings` PVC is bound to a
# storageClass different from `.Values.guacamole.recordings.storageClass`
# and deletes the PVC + bound PV so the chart-side PVC manifest can
# recreate cleanly. Closes the live bp-guacamole HelmRelease wedge on
# omantel iter-11 (`PersistentVolumeClaim ... is invalid: spec:
# Forbidden: spec is immutable after creation`). Operator escape hatch:
# `.Values.guacamole.recordings.allowMigration: false` suppresses the
# hook for Sovereigns with long-lived recording state.
# 0.1.11 (Fix #45 Cluster-A follow-up): default `migrationImage` is
# now `docker.io/bitnamilegacy/kubectl:1.29.3` (the canonical kubectl
# surface used across every other Catalyst Blueprint). The 0.1.9
# default `bitnami/kubectl:1.30.4` 401'd on omantel because the
# Sovereign's Harbor docker.io proxy doesn't have it cached, leaving
# the migration Job in ImagePullBackOff and the bp-guacamole HR
# Reconciling forever.
# 0.1.15 (Fix #158, 2026-05-11): migrationImage bumped from
# bitnamilegacy/kubectl:1.29.3 -> bitnamilegacy/kubectl:1.30.7 to align
# with k3s 1.30 server version on Hetzner Sovereigns + template
# fallback default no longer references the deleted bitnami path.
# 0.1.17 (Fix #163, 2026-05-11, MIRROR-EVERYTHING): migrationImage AND
# oidc-secret-bootstrap-job both gain explicit
# harbor.openova.io/proxy-dockerhub prefix per CLAUDE.md inviolable rule.
# 0.1.23 (Refs TBD-G4 phase 2, 2026-05-18): readiness + liveness probe
# paths flipped from `/` to `/guacamole/`. The Apache Guacamole webapp
# deploys at Tomcat's context path /guacamole/ (the WAR file is
# `guacamole.war` so Tomcat exposes it at /<warname>/). The container
# root path `/` returns 404 from Tomcat's empty ROOT context, so
# probing `/` made kubelet restart the Pod every ~60s and the kube-
# system Cilium gateway returned 503 to `https://guacamole.<sov>/`
# because no endpoint was ever Ready (observed on t22, 5 restarts).
# 0.2.0 (G117.5 W3.D1 #2744, 2026-06-02 — BREAKING): SSO consolidation
# into bp-keycloak 1.4.13 authoritative realm-import.
#   - Append `?kc_idp_hint=catalyst-pin` to OPENID_AUTHORIZATION_ENDPOINT
#     env so the Guacamole webapp's auth redirect carries the IdP hint
#     (defense-in-depth alongside the sovereign realm IDR
#     `defaultProvider`).
#   - DELETE templates/keycloak-realm-config.yaml — the divergent
#     `realm: catalyst` ConfigMap had been racing with the consolidated
#     `sovereign` realm-import codified in bp-keycloak 1.4.10 (Tier-1)
#     and 1.4.13 (Tier-2 — adds `guacamole` client to clients[]).
#     Operators on the canonical fresh-prov path stop seeing the old
#     `bp-guacamole-realm-patch` ConfigMap; bp-keycloak's keycloak-
#     config-cli post-deploy Job no longer applies it. Per Aux-2 audit
#     docs/sessions/2026-06-02-G117-sso-fanout-audit/tier-2/bp-guacamole.md
#     step 4.
#   - NEW templates/secret-sso-oidc-credentials.yaml — chart-managed
#     Secret using helm `lookup`-or-generate + `helm.sh/resource-policy:
#     keep` annotation, gated by `guacamole.oidc.chartManagedSecret`
#     (default ON; off preserves backward-compat with the existing
#     SealedSecret placeholder path). The new Secret materialises a
#     usable client-secret value at the chart's first install (vs the
#     old SealedSecret placeholder which required kubeseal). See memory
#     `feedback_chart_credential_persistence_defense.md` for the
#     containment pattern.
#   - Drop the now-stale `realmConfig.*` values block. The fields are
#     no-ops once keycloak-realm-config.yaml is deleted.
# Breaking-ness: existing operators relying on the `realm: catalyst`
# patch must migrate to the `sovereign` realm + bp-keycloak 1.4.13
# realm-import. Same 4-hop curl probe in the audit doc verifies the
# new path.
# Refs #2744.
# 0.2.2 (#3150, 2026-06-10): fix the default OIDC redirect_uri. The
# `bp-guacamole.oidcRedirectURI` helper derived `https://<host>/` (bare
# Tomcat ROOT) when the operator left `oidc.redirectURI` blank — which
# every Sovereign does. The guacamole-auth-sso-openid extension runs the
# OIDC *implicit* flow: Keycloak issues the id_token and redirects the
# browser back to that exact redirect_uri with the token in the URL
# fragment. Landing on the bare root meant the fragment hit Tomcat's 404
# ROOT page and the extension never consumed the token, so silent-SSO
# completed at Keycloak but the operator never landed logged-in. The
# helper default now appends the `/guacamole/` context path (the WAR is
# served there); the KC `guacamole` client's `redirectUris` wildcard
# `https://guacamole.<fqdn>/*` already accepts it. New g117-w3d1-sso-
# secret.sh Case 1b asserts the rendered OPENID_REDIRECT_URI ends with
# `/guacamole/`.
# 0.2.5 (#3374, 2026-06-13): bare-root entry — HTTPRoute 302s Exact `/` ->
# `/guacamole/` (explicit port 443, #3310 class), closing the TBD-G6
# follow-up: the bare hostname previously 404'd on Tomcat's ROOT context
# (founder-class #3150 landmine, re-measured live on hw130 2026-06-13).
# /guacamole/ itself already lands signed-in zero-click via the openid
# extension + catalyst-pin. NOTE the admin-elevation gap REMAINS: the chart
# ships the openid extension only (no JDBC permission store), so
# blueprint.yaml's `rolesFromGroup: sovereign-admins: admin` intent has no
# implementation — tracked under #3374 DoD row 7.
# 0.2.9 (#3374, 2026-06-14): CLOSES the admin-elevation gap the 0.2.5 note
# flagged. The openid extension authenticates SSO users but carries no
# permission store, so every SSO user landed with no connections and NO admin
# (founder-witnessed). New templates wire the bundled JDBC (postgresql)
# permission store: a dedicated CNPG cluster (cnpg-cluster.yaml), POSTGRESQL_*
# env on the webapp (guacamole-deployment.yaml) with AUTO_CREATE_ACCOUNTS +
# EXTENSION_PRIORITY="openid, postgresql", a schema-seed Job
# (jdbc-schema-seed-job.yaml) that applies the image-bundled
# 001-create-schema.sql once and seeds a `sovereign-admins` USER_GROUP holding
# ADMINISTER, and a netpol egress to :5432. With OPENID_GROUPS_CLAIM_TYPE=groups
# an SSO user in sovereign-admins auto-creates a JDBC record, binds into the
# group, and lands as guacamole admin. New `guacamole.database.*` values.
# Lockstep: 52-bp-guacamole.yaml pin → 0.2.9. Refs #3374.
# 0.2.11 (#3374 admin-tier, 2026-06-14): un-stall the seed Job on hw133. The
# 0.2.10 jdbc-schema-seed Job was DENIED on every reconcile (HR rolled back to
# 0.2.8) by TWO kyverno Enforce policies: (1) flux-managed — the hook Job
# carried managed-by=Helm (the helper) not flux; (2) harbor-proxy-pull — its
# anyPattern needs ONE allowed glob to match BOTH the initContainers AND the
# containers, but the guacamole-webapp initContainer was ghcr.io/openova-io/...
# (native-push glob) while the psql container was proxy-ghcr/cnpg... (proxy
# glob), and no single glob matched both. Fix: (a) stamp managed-by:flux on the
# Job; (b) VENDOR the Apache Guacamole 1.5.5 schema into the chart
# (files/postgresql/001-create-schema.sql, loaded into the scripts ConfigMap
# via .Files.Get) and drop the webapp initContainer, so the Job is
# single-container (CNPG psql, proxy glob) — no second registry for the
# anyPattern to reject. The vendored SQL is pinned to
# guacamole.webapp.image.tag (1.5.5); bump both together. Lockstep:
# 52-bp-guacamole.yaml pin → 0.2.11. Refs #3374 #3434 #3296.
# 0.2.13 (#3374 admin-tier, 2026-06-14): un-pin the webapp Pod so the JDBC
# permission store actually reaches a serving pod. After 0.2.11 the seed Job
# installed the sovereign-admins ADMINISTER USER_GROUP, but on hw133 the
# replacement webapp replica (the one carrying POSTGRESQL_* + the JDBC
# extension) Pended 40m+ with `volume node affinity conflict` + `Insufficient
# cpu` while the stale pre-DB pod kept serving with no admin menu. ROOT CAUSE:
# the recordings PVC's `seaweedfs-storage` class resolves to rancher.io/
# local-path here, so its PV carries a hard node-affinity (RWO) that pinned the
# Pod to a CPU-saturated node. Fix: (a) recordings.persistence DEFAULT false →
# emptyDir recordings (no node-pin → schedules on any node with CPU; the PVC +
# its migration hook/RBAC are skipped); (b) webapp.strategy=Recreate so the
# single Pod releases its volumes before the replacement starts. Session-capture
# recordings are not required for core function or the admin walk; operators with
# real distributed SeaweedFS RWX set recordings.persistence=true. Lockstep:
# 52-bp-guacamole.yaml pin → 0.2.13. Refs #3374.
# 0.2.15 (#3374 admin-tier, 2026-06-14): fix the POSTGRESQL_USER env name. Once
# 0.2.13 let the JDBC-enabled webapp pod schedule, it CRASH-LOOPED on hw133 with
# `FATAL: Missing required environment variables ... POSTGRESQL_USER` — the
# chart set POSTGRESQL_USERNAME, but the Apache Guacamole image entrypoint
# requires POSTGRESQL_USER. With the wrong name the bundled JDBC extension never
# connected → the permission store was unreachable → still no admin. Renamed to
# the upstream-canonical POSTGRESQL_USER. Lockstep: 52-bp-guacamole.yaml pin →
# 0.2.15. Refs #3374.
# 0.2.19 (#3629, 2026-06-16): guacd PVC-mount fallback. #3374 made the WEBAPP
# `recordings` volume an emptyDir when recordings.persistence=false (the
# default) but MISSED guacd-deployment.yaml, whose volume block still
# hard-referenced the gated-off `guacamole-recordings` PVC unconditionally.
# guacd therefore FailedScheduling forever on the default path
# (`persistentvolumeclaim "guacamole-recordings" not found`) — Pending in both
# regions on hw146. Mirror the webapp's emptyDir/PVC `if` into guacd. Lockstep:
# 52-bp-guacamole.yaml pin → 0.2.19. Refs #3629.
# 0.2.21 (#3642 host-bridge): the CNPG `Cluster` gate now honours an EXPLICIT
# `false` on guacamole.database.enabled / .cluster.enabled (the Helm
# `default true <bool>` idiom wrongly coerced a placement-supplied false back to
# true). Without this the #3642 host-bridge could NOT suppress the in-vCluster
# Cluster CR (host-rendered instead) — the Cluster double-rendered inside
# vc-mgmt where no cnpg-operator reconciles it. Default render byte-identical
# (the key is absent → gate stays true). Lockstep: 52-bp-guacamole.yaml pin.
# 0.2.21 (#3687, extends #3370): bootstrap self-registration —
# templates/application-cr.yaml renders the canonical apps.openova.io/v1
# Application CR for the slot-52 HelmRelease (gated bootstrapOwned.enabled
# + Capabilities apps.openova.io/v1) so the console /apps list, per-app
# Topology tab + showback resolve guacamole (no more "no Application CR").
# 0.2.23 (#3375 / #3786, 2026-06-18): the bootstrap-owned Application CR's
# spec.placement now emits the CANONICAL token `singleton` (overridable via
# bootstrapOwned.placement) instead of the banned legacy `single-region`.
# readTopology serves spec.placement VERBATIM to the Topology tab + the
# Instances-table chip, so the legacy spelling leaked the banned word to the
# operator (hw159 #3375).
# 0.2.26 (#3971): CNPG storageClass empty ⇒ cluster-default durable cloud CSI; local-path FORBIDDEN.
version: 0.2.33
appVersion: "1.5.5"
description: |
  Catalyst-authored Blueprint chart for Apache Guacamole — a clientless
  HTML5 remote-desktop gateway that brokers SSH / RDP / VNC sessions
  AND kubectl-exec sessions through one browser-accessible surface.
  Sessions land authenticated via Keycloak SSO, are recorded to
  SeaweedFS for compliance, and reach Pods inside the same Sovereign
  via the per-node k8s-ws-proxy DaemonSet (bp-k8s-ws-proxy).

  Per ADR-0001 §11: ONE Guacamole per Sovereign — Manara-style
  multi-cluster fan-out is intentionally NOT supported (Sovereigns
  stay self-sufficient).

  This is a scratch chart — no upstream Guacamole Helm chart is
  bundled. The container images are upstream `guacamole/guacd` and
  `guacamole/guacamole`, SHA-pinned per
  docs/INVIOLABLE-PRINCIPLES.md #4a. CI populates the SHA tags via
  `yq eval -i .image.tag = "<sha>"` when promoting a build into
  clusters/<sovereign>/.

  Includes:
    - guacd Deployment + Service (RDP/VNC/SSH protocol backend)
    - guacamole-web Deployment + Service (Tomcat front-end with OIDC)
    - HTTPRoute (Cilium Gateway) for browser ingress
    - SeaweedFS PVC for session recordings (50Gi default)
    - SealedSecret placeholder for the Keycloak OIDC client secret
    - NetworkPolicy: default-deny + selective egress to k8s-ws-proxy
      and Keycloak
    - ConfigMap consumed by keycloak-config-cli post-deploy Job
      (mirrors the existing pattern from platform/keycloak/chart/)
type: application
keywords: [catalyst, blueprint, guacamole, remote-desktop, oidc, recording]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io
annotations:
  # Default values render zero resources (guacamole.enabled=false).
  # The blueprint-release smoke gate honors this annotation and
  # accepts a short default render; chart/tests/render.sh covers the
  # enabled-render path with full --set overrides.
  catalyst.openova.io/smoke-render-mode: default-off
# Scratch chart — the binary surface is fully owned by Apache. The
# `sigstore/common` library subchart below is included ONLY to satisfy
# the platform-wide blueprint-release.yaml hollow-chart gate (issue
# #181) — every umbrella MUST declare at least one dependency.
# `common` is a tiny library chart (helper templates only, zero
# runtime resources). Mirrors the same pattern used by
# bp-cert-manager-dynadot-webhook + bp-coraza for the same reason.
dependencies:
  - name: common
    version: "0.1.3"
    repository: "https://sigstore.github.io/helm-charts"
