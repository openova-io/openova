apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-tempo
spec:
  version: 1.0.1  # lockstep with chart/Chart.yaml (#4347 harbor-proxy image for host-ns Kyverno harbor-proxy-pull Enforce)
  visibility: unlisted
  class: platform-component
  lifecycle: experimental
  card:
    title: Tempo
    description: Distributed tracing backend for the LGTM observability stack. Single-binary mode for solo Sovereign; tempo-distributed is a values toggle.
    icon: tempo.svg
    docs: https://grafana.com/docs/tempo/latest/


  topology:
    supported:
      - active-passive
      - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: s3-bucket-replication
          mode: async
          lagSloSeconds: 60
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 60
        placement:
          tier: ''
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ''
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # internal-only — queried by Grafana via in-cluster Service DNS.
  endpoints: []

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    silentLogin: true

  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-tempo
