apiVersion: v2
name: bp-cnpg
# 1.0.6 (G59 #2610, 2026-05-30): disable G21 webhookCertBootstrap by
# default. Live RCA on hw66 (e78e84ce2f232acc) 10:42Z: G21's
# self-signed cert in mounted Secret CONFLICTS with operator-internal
# cnpg-ca-secret CA written to MutatingWebhookConfiguration caBundle.
# Apiserver x509 verify fails ("parent certificate cannot sign this
# kind of certificate") → bp-catalyst-platform + bp-newapi Helm
# install denied. Trust upstream operator's self-managed cert flow;
# G53 webhook-gate Job remains as the readiness signal.
#
# 1.0.9 (Refs #3236 #2737): pin the cloudnative-pg operator image to the
# Harbor proxy-cache (harbor.openova.io/proxy-ghcr/cloudnative-pg/
# cloudnative-pg:1.29.0). The subchart renders both the operator pod's
# image AND the OPERATOR_IMAGE_NAME env (which the operator injects as the
# bootstrap-controller initContainer into every instance pod) from the same
# image.repository:image.tag — so the override proxies both in lockstep. Bare
# upstream ghcr.io ref violated the harbor-proxy baseline + flaky-ghcr-DNS
# ImagePullBackOff killed the cnpg-pair replica basebackup on hw126 region-B.
# webhookGate Job image proxied to proxy-dockerhub in the same pass.
# #3648 — bumped in lockstep with blueprint.yaml spec.version (producesInstances
# declaration) + the 16-cnpg.yaml bootstrap-kit pin.
#
# 1.0.11 (#4220, 2026-06-24): the G53 webhook-gate Job + G21 webhook-cert
# bootstrap now SKIP RENDERING in webhook-LESS mode. A per-Org bp-cnpg install
# sets cloudnative-pg.webhook.{mutating,validating}.create=false (#4143/#4201:
# the per-Org operator must NOT fight the platform cnpg-system operator for the
# cluster-singleton webhook configs). In that mode there is no webhook config to
# gate, AND the gate Job — created directly by Helm with no Flux owner — was
# DENIED by the flux-managed Kyverno Enforce policy
# (`workload-must-be-flux-managed`), so the bp-cnpg HelmRelease InstallFailed and
# the demo Org's WordPress (+ newapi/openclaw/stalwart) wedged Ready=False on
# `dependency bp-cnpg is not ready` (live omantel.biz dep 4635277cae4ffed9,
# #4220). New templates/_helpers.tpl `bp-cnpg.webhookGateEnabled` /
# `bp-cnpg.webhookConfigsCreated` centralise the decision: the gate renders ONLY
# when webhookGate.enabled (default true) AND the subchart is actually creating
# the webhook configs. This is a render-skip, NOT a policy exemption — the
# flux-managed guardrail stays fully in force. Single-operator installs
# (webhook configs created) keep the gate unchanged. Refs #4201 #4143.
#
# 1.0.12 (#4226, 2026-06-24): stamp `app.kubernetes.io/managed-by: flux` on the
# two Helm-hook Jobs (webhook-gate-hook.yaml, webhook-cert-bootstrap.yaml). In
# webhook-FULL mode (the PLATFORM cnpg-system install) the gate Job STILL renders
# — #4223 only skipped it for webhook-LESS per-Org installs — and it is created
# by the helm-controller with no Flux owner, so the flux-managed Kyverno Enforce
# policy DENIED it → bp-cnpg post-upgrade hook failed → Helm rollback → bp-cnpg
# Ready=False → bp-catalyst-platform (dependsOn bp-cnpg) wedged at 1.4.810,
# blocking the #4222 pool-PowerDNS catalyst-api roll and the #4179 funnel close
# (live omantel.biz dep 4635277cae4ffed9). The label is the policy's own
# documented escape (same as openbao init-job #3374, gitea/harbor hooks
# #3296→#3297) — guardrail stays fully in force. Refs #4179 #4223 #4220 #3374.
#
# 1.0.13 (G64 #4322, 2026-06-25): durable fix for the cnpg-system operator
# CORRUPTING the cluster-singleton webhook caBundle with a LEAF cert (CA:FALSE)
# instead of the cnpg-ca-secret CA (CA:TRUE). Upstream cloudnative-pg bug #9817
# (fix PR #9819 still UNMERGED): the operator's PKI reconciler injects the
# webhook clientConfig.caBundle from cnpg-webhook-cert tls.crt (the serving
# LEAF) and re-asserts it on an `@every 1h` tick + every restart. When the
# served leaf and the stale caBundle-leaf diverge (cert renewal/regen/restart)
# the apiserver fails `x509: certificate signed by unknown authority` → EVERY
# postgresql.cnpg.io/v1.Cluster create/patch rejected cluster-wide (wordpress-db,
# newapi-pg, all PG-backed apps). Live-confirmed on omantel.biz region-a.
# THREE changes (webhook-FULL platform install only — webhook-LESS per-Org
# installs skip all of it via bp-cnpg.webhookGateEnabled):
#   (1) cloudnative-pg.config.data.MANAGE_WEBHOOK_CONFIGURATIONS="false" — stops
#       the operator injecting (corrupting) the caBundle at the source (upstream
#       operator_conf opt-out for GitOps-managed CA injection; independent of
#       serving-cert/CA generation, so cnpg-ca-secret is still minted).
#   (2) templates/webhook-cabundle-reasserter.yaml — the GitOps-side CA injector:
#       a post-install/upgrade Helm-hook Job (weight 4) + a CronJob (every 10m)
#       that read cnpg-ca-secret ca.crt (validated CA:TRUE) and write it into
#       both webhook configs' caBundle. The CronJob self-heals against any
#       residual re-corruption (pre-flip operator pod) within minutes.
#   (3) webhook-gate-hook.yaml now asserts the caBundle is a CA (CA:TRUE), not
#       merely non-empty — the producer-side proof the reasserter landed; gate
#       image bumped 1.30.7 -> 1.31.4 for openssl. Refs #4322 #4143 #4201.
#
# 1.0.14 (G65 #4322, 2026-06-25): TWO durable fixes for the recurring
# cnpg-webhook caBundle re-hijack (the #4143/#4322 family).
#   (A) ROGUE-RBAC VECTOR — the per-Org operator could STILL patch the
#       cluster-singleton webhook. The upstream cloudnative-pg subchart's
#       `clusterwideRules` (get,patch on mutating/validatingwebhookconfigurations)
#       are included in the ClusterRole bp-cnpg-cloudnative-pg UNCONDITIONALLY,
#       even under config.clusterWide=false — so a namespace-scoped, webhook-less
#       per-Org operator was handed cluster-scoped webhook-patch and on each
#       restart over-wrote the shared caBundle with its own org-ns leaf cert
#       (CA:FALSE) → apiserver x509-fail → every CNPG Cluster create/patch
#       rejected cluster-wide (live omantel.biz org-7283eb4a, #4322). FIX: the
#       per-Org generator sets cloudnative-pg.rbac.create=false (subchart RBAC
#       off) + the new templates/per-org-operator-rbac.yaml renders REPLACEMENT
#       RBAC — a namespace Role (operator in-ns perms) + a minimal ClusterRole
#       (nodes + clusterimagecatalogs reads ONLY, NO webhookconfigurations). The
#       per-Org operator is now STRUCTURALLY INCAPABLE of patching the singleton.
#   (B) #4326 REASSERT-JOB BackoffLimitExceeded — the webhook-cabundle-reasserter
#       Job/CronJob ran `command: ["/bin/sh", ...]` with `set -euo pipefail`, but
#       the bitnami kubectl image's /bin/sh is DASH, which rejects
#       `set -o pipefail` ("Illegal option -o pipefail") → the script aborted on
#       its FIRST line every run → the post-upgrade hook failed
#       `BackoffLimitExceeded` → Helm rolled 1.0.13 back to 1.0.12, so the G64
#       reassert defense never held (reproduced live 2026-06-25, dep
#       4635277cae4ffed9). FIX: switch both to `command: ["/bin/bash", ...]`
#       (the image carries /bin/bash + /usr/bin/openssl; webhook-gate-hook.yaml
#       already uses bash). Refs #4322 #4143 #4201 #4326.
#
# 1.0.15 (#4813, 2026-07-07): the G65/1.0.14 fix (A) removed ALL
#       *webhookconfigurations verbs from the per-Org operator's minimal
#       ClusterRole to kill the caBundle hijack — but cnpg 1.29's operator
#       startup ALWAYS calls controller.ensurePKI(), which does a cluster-scoped
#       GET on the webhook configs to verify the caBundle, even for a
#       namespace-scoped per-Org operator. So the RBAC removal broke operator
#       STARTUP: "cannot get resource mutatingwebhookconfigurations at the
#       cluster scope" → CrashLoopBackOff → bp-cnpg InstallFailed → every
#       DB-backed per-Org app (wordpress/newapi/openclaw) DependencyNotReady on
#       an S-plan namespace-isolated Org (live-found hw228 walkstrangertwo, an
#       S-plan Org lands namespace per the #4292 tier gate). FIX: grant the
#       per-Org operator READ-ONLY get/list/watch on mutating/validating
#       webhookconfigurations — NO patch/update — so ensurePKI's GET succeeds
#       but the operator is STILL structurally incapable of PATCHing (hijacking)
#       the cluster-singleton caBundle (the hijack was the PATCH verb, not GET).
#       Needs a fresh S-plan (namespace) Org convergence to fully verify.
#       Refs #4813 #4322 #4293.
version: 1.0.15
description: |
  Catalyst-curated Blueprint umbrella chart for CloudNativePG. Depends on
  the upstream `cloudnative-pg` chart as a Helm subchart so
  `helm dependency build` pulls the upstream payload into this artifact;
  the Catalyst overlay templates in templates/ (label propagation,
  observability toggles defaulted off) sit alongside the upstream subchart
  and Helm renders both at install time. Catalyst-curated values flow into
  the upstream subchart under the `cloudnative-pg:` key in values.yaml.
type: application
keywords: [catalyst, blueprint, cnpg, cloudnative-pg, postgres, postgresql]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a Helm subchart so `helm dependency build`
# bundles it into the OCI artifact. Pinned to cnpg/cloudnative-pg 0.28.0
# (matches platform/cnpg/blueprint.yaml + values.yaml
# `catalystBlueprint.upstream.version`). Per
# docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the version is
# operator-bumpable via PR + Blueprint release.
dependencies:
  - name: cloudnative-pg
    version: "0.28.0"
    repository: "https://cloudnative-pg.github.io/charts"
