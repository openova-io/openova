{{- /*
G53 (Refs #2604, 2026-05-30): bp-cnpg post-install webhook readiness gate.

Background — the race we close
==============================
The upstream cloudnative-pg chart registers a MutatingWebhookConfiguration
`cnpg-mutating-webhook-configuration` + ValidatingWebhookConfiguration
`cnpg-validating-webhook-configuration` backed by Service
`cnpg-webhook-service` in `cnpg-system` namespace. The webhook cert is
issued by cert-manager (Certificate `cnpg-webhook-cert`) and the
caBundle field on the webhook configurations is populated by
cert-manager-cainjector via the annotation
`cert-manager.io/inject-ca-from`.

On cold install, bp-cnpg HR flips Ready=True the moment Helm reports
the release as Installed (all manifests applied) — typically BEFORE:
- cert-manager has issued the cert
- cainjector has noticed the Certificate Ready event
- cainjector has patched the caBundle on the webhook configs
- the apiserver has refreshed its webhook config cache + verified TLS
  trust to the cnpg-webhook-service endpoint

Dependents with `dependsOn: bp-cnpg` start their install IMMEDIATELY.
If their chart includes a `postgresql.cnpg.io/v1.Cluster` CR, the
apiserver calls the cnpg-webhook (mcluster.cnpg.io) and fails:

  x509: certificate signed by unknown authority (possibly because of
  "x509: invalid signature: parent certificate cannot sign this kind
  of certificate") while trying to verify candidate authority
  certificate "cnpg-webhook-service.cnpg-system.svc"

Helm install fails → HR Stalled (chart-default retries=4 exhausts) or
stuck retrying (G50-patched HRs only).

Caught live on hw61 v13 04:50Z (deployment bc232915d870bbc3):
bp-gitea Stalled RetriesExceeded, bp-harbor / bp-newapi /
bp-openova-flow-server / bp-powerdns all InstallFailed cascading from
the same cnpg-webhook race.

Pattern — mirror G38/G44/G49 (gate-at-producer)
================================================
1. webhook-gate-hook.yaml (this file): post-install + post-upgrade Job
   weight 5 — polls THREE conditions:
     (a) Endpoints `cnpg-webhook-service` in `cnpg-system` ≥1 ready address
     (b) MutatingWebhookConfiguration `cnpg-mutating-webhook-configuration`
         caBundle is non-empty (cainjector populated)
     (c) ValidatingWebhookConfiguration `cnpg-validating-webhook-configuration`
         caBundle is non-empty
   All three must clear. 300s budget, 2s interval.

2. webhook-gate-rbac.yaml: SA (release ns) + Role (cnpg-system ns for
   Endpoints GET) + RoleBinding + ClusterRole (Mutating/Validating
   WebhookConfiguration GET cluster-scope) + ClusterRoleBinding.
   hook-weight 0 (runs before the gate Job).

Helm marks the release Installed only when ALL post-install hooks
succeed. HR Ready=True only then. Dependents safely install.

Why not pre-install: the webhook Service + Configurations are CREATED
by THIS chart's regular templates. A pre-install hook would wait
forever because nothing exists yet. Post-install fires AFTER Helm
applies the regular templates, so the webhook IS coming up while the
gate polls. Same architectural decision as G38.

If the gate times out: bp-cnpg HR reports InstallFailed → Flux
remediation retries (chart-spec install.remediation.retries) — same
defense as the original G50 retry tuning. Both layers protect.
*/}}
{{- /*
1.0.11 (#4220): skip the gate entirely in webhook-LESS mode (per-Org install
sets cloudnative-pg.webhook.{mutating,validating}.create=false). See
templates/_helpers.tpl "bp-cnpg.webhookGateEnabled" — there is nothing for the
gate to poll, and the un-owned Helm-hook Job is denied by the flux-managed
Kyverno policy, wedging the whole Org cascade (#4220).
*/}}
{{- $gate := .Values.webhookGate | default dict -}}
{{- if eq (include "bp-cnpg.webhookGateEnabled" .) "true" }}
{{- $svcName := (($gate.service).name) | default "cnpg-webhook-service" -}}
{{- $svcNs := (($gate.service).namespace) | default "cnpg-system" -}}
{{- $mutName := $gate.mutatingWebhookName | default "cnpg-mutating-webhook-configuration" -}}
{{- $valName := $gate.validatingWebhookName | default "cnpg-validating-webhook-configuration" -}}
{{- $timeout := $gate.timeoutSeconds | default 300 -}}
{{- $interval := $gate.intervalSeconds | default 2 -}}
{{- /* G64 (#4322): kubectl image carries openssl so the gate can assert the
       caBundle is a CA (CA:TRUE), not merely non-empty. Default flipped from
       the openssl-less bitnamilegacy/kubectl:1.30.7 to the 1.31.4 ref already
       used by webhookCertBootstrap / the reasserter. The CA assertion degrades
       gracefully (warns, falls back to non-empty) if openssl is absent. */ -}}
{{- $image := $gate.image | default "harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4" -}}
{{- $pullPolicy := $gate.imagePullPolicy | default "IfNotPresent" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-webhook-gate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bp-cnpg
    app.kubernetes.io/instance: {{ .Release.Name }}
    catalyst.openova.io/component: webhook-gate
    # #4226: this Helm post-upgrade hook Job is created by the helm-controller,
    # not Flux directly, so the kyverno baseline `flux-managed` Enforce policy
    # (workload-must-be-flux-managed, which matches kind Job) DENIES it without
    # this label — wedging the platform (webhook-FULL) bp-cnpg upgrade into a
    # rollback loop, which in turn blocks the bp-catalyst-platform dependsOn.
    # #4223 only skipped this Job in webhook-LESS (per-Org) mode; the platform
    # cnpg-system install still renders it. Same landmine as openbao init-job
    # (#3374) and gitea/harbor sso-configure hooks (#3296→#3297).
    app.kubernetes.io/managed-by: flux
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bp-cnpg
        app.kubernetes.io/instance: {{ .Release.Name }}
        catalyst.openova.io/component: webhook-gate
    spec:
      serviceAccountName: {{ .Release.Name }}-webhook-gate
      restartPolicy: Never
      containers:
        - name: gate
          image: {{ $image | quote }}
          imagePullPolicy: {{ $pullPolicy | quote }}
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: WEBHOOK_SVC
              value: {{ $svcName | quote }}
            - name: WEBHOOK_NS
              value: {{ $svcNs | quote }}
            - name: MUT_WEBHOOK
              value: {{ $mutName | quote }}
            - name: VAL_WEBHOOK
              value: {{ $valName | quote }}
            - name: TIMEOUT_SECONDS
              value: {{ $timeout | quote }}
            - name: INTERVAL_SECONDS
              value: {{ $interval | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "cnpg webhook gate: poll (a) endpoints/${WEBHOOK_NS}/${WEBHOOK_SVC} ready, (b) MutatingWebhookConfiguration ${MUT_WEBHOOK} caBundle is a CA, (c) ValidatingWebhookConfiguration ${VAL_WEBHOOK} caBundle is a CA (budget=${TIMEOUT_SECONDS}s, interval=${INTERVAL_SECONDS}s)"
              # G64 (#4322): a NON-EMPTY caBundle is NOT enough — the upstream
              # cloudnative-pg #9817 bug populated it with the SERVING LEAF
              # (CA:FALSE), which works only until the served leaf rotates and
              # then x509-fails apiserver verification of the served chain. The
              # gate now asserts the caBundle is a genuine CA (BasicConstraints
              # CA:TRUE). The webhook-cabundle-reasserter Job (hook-weight 4,
              # runs BEFORE this gate at weight 5) writes the real CA from
              # cnpg-ca-secret; this gate is the producer-side proof it landed.
              HAVE_OPENSSL=0
              if command -v openssl >/dev/null 2>&1; then HAVE_OPENSSL=1; else
                echo "WARN: openssl not in image; falling back to non-empty caBundle check (cannot assert CA:TRUE)." >&2
              fi
              # caBundleIsCA <webhook-kind> <name> -> echoes "ca" | "leaf" | "empty"
              caBundleIsCA() {
                local kind="$1" name="$2" b64 pem bc
                b64="$(kubectl get "${kind}" "${name}" --ignore-not-found \
                  -o jsonpath='{.webhooks[0].clientConfig.caBundle}' 2>/dev/null || true)"
                if [ -z "${b64}" ]; then echo "empty"; return; fi
                if [ "${HAVE_OPENSSL}" -ne 1 ]; then echo "ca"; return; fi  # length-only fallback
                pem="$(printf '%s' "${b64}" | base64 -d 2>/dev/null || true)"
                bc="$(printf '%s' "${pem}" | openssl x509 -noout -ext basicConstraints 2>/dev/null || true)"
                case "${bc}" in
                  *CA:TRUE*) echo "ca" ;;
                  *)         echo "leaf" ;;
                esac
              }
              deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
              attempt=0
              while [ "$(date +%s)" -lt "${deadline}" ]; do
                attempt=$(( attempt + 1 ))
                # (a) Endpoint readiness
                ep_count="$(kubectl get endpoints "${WEBHOOK_SVC}" \
                  -n "${WEBHOOK_NS}" \
                  --ignore-not-found \
                  -o jsonpath='{range .subsets[*]}{.addresses[*].ip}{"\n"}{end}' 2>/dev/null \
                  | tr ' ' '\n' | grep -c . || true)"
                # (b)/(c) caBundle is a CA (CA:TRUE), not a leaf and not empty
                mut_ca="$(caBundleIsCA mutatingwebhookconfiguration "${MUT_WEBHOOK}")"
                val_ca="$(caBundleIsCA validatingwebhookconfiguration "${VAL_WEBHOOK}")"
                if [ "${ep_count}" -ge 1 ] && [ "${mut_ca}" = "ca" ] && [ "${val_ca}" = "ca" ]; then
                  echo "All three conditions cleared after ${attempt} attempt(s); endpoints=${ep_count} mut_caBundle=CA val_caBundle=CA."
                  exit 0
                fi
                echo "Attempt ${attempt}: endpoints=${ep_count} mut_caBundle=${mut_ca} val_caBundle=${val_ca}; sleeping ${INTERVAL_SECONDS}s."
                sleep "${INTERVAL_SECONDS}"
              done
              echo "FATAL: cnpg webhook gate did not clear within ${TIMEOUT_SECONDS}s (a caBundle is empty or a LEAF, not a CA)." >&2
              echo "Diagnose with:" >&2
              echo "  kubectl -n ${WEBHOOK_NS} get pods -l app.kubernetes.io/name=cloudnative-pg" >&2
              echo "  kubectl -n ${WEBHOOK_NS} get endpoints ${WEBHOOK_SVC}" >&2
              echo "  kubectl get mutatingwebhookconfiguration ${MUT_WEBHOOK} -o jsonpath='{.webhooks[0].clientConfig.caBundle}' | base64 -d | openssl x509 -noout -subject -ext basicConstraints" >&2
              echo "  kubectl get secret cnpg-ca-secret -n ${WEBHOOK_NS} -o jsonpath='{.data.ca\\.crt}' | base64 -d | openssl x509 -noout -subject -ext basicConstraints  # source CA (should be CA:TRUE)" >&2
              echo "  kubectl -n ${WEBHOOK_NS} get cronjob,job -l catalyst.openova.io/component=webhook-cabundle-reasserter  # the GitOps CA injector" >&2
              exit 1
{{- end }}
