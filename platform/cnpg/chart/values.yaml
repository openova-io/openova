# Catalyst Blueprint umbrella metadata — the upstream chart is now resolved
# as a Helm subchart via Chart.yaml `dependencies:`. This values.yaml carries
# both:
#   1. The catalystBlueprint metadata block (provenance + version) so
#      observability/audit pipelines can inspect the artifact and report
#      which upstream chart + version is bundled.
#   2. The upstream subchart values overlay under the `cloudnative-pg:` key
#      (umbrella-chart convention — the dependency name from Chart.yaml is
#      the values namespace).
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

# G21 (Refs #2570, 2026-05-28): pre-mint cnpg-webhook-cert Secret via
# cert-manager so cnpg's Deployment volume mount has a valid Secret
# to consume at pod-creation time. See
# templates/webhook-cert-bootstrap.yaml for the rationale (kubelet
# Secret-cache sync race under apiserver load).
#
# G59 (Refs #2610, 2026-05-30): DISABLE BY DEFAULT — META-AUDIT 1
# sub-class 8 surfaced live on hw66 (e78e84ce2f232acc) 10:42Z. G21's
# self-signed Issuer + pre-minted Secret CONFLICTS with CNPG operator's
# internal `cnpg-ca-secret` auto-CA-bootstrap workflow:
#   - G21 produces self-signed LEAF cert (CN==Issuer), writes to Secret
#   - Mounted cnpg-webhook-cert Secret contains that leaf
#   - cnpg-operator generates its OWN internal `cnpg-ca-secret`
#     (proper CA with isCA:true) + writes MutatingWebhookConfiguration
#     caBundle to be the cnpg-ca-secret CA chain
#   - Apiserver verifies served leaf (G21 self-signed) against MWC
#     caBundle (operator's cnpg-ca-secret) → x509 chain mismatch:
#     "parent certificate cannot sign this kind of certificate"
# Live verified hw66: ALL Cluster CR admissions fail (bp-catalyst-
# platform + bp-newapi Helm install denied). Even after kubectl-patch
# of MWC caBundle to match served cert, apiserver still rejects
# because self-signed LEAF can't act as CA.
#
# Resolution: disable G21 entirely. Trust upstream cnpg-operator's
# self-managed cert + cnpg-ca-secret flow which is internally
# consistent (cert it serves matches caBundle it writes). G53 (#2604)
# post-install webhook-gate Job remains to handle the readiness race
# G21 was originally addressing (polling Endpoints + caBundle non-
# empty + TLS Secret non-empty). Kubelet Secret-cache race on cold
# install is mitigated by G53's poll loop + operator's natural
# restart-on-failure cycle.
#
# β-flag grep before disable (60s): no upstream cnpg-chart flag for
# "trust pre-existing Secret, don't regen". γ (disable G21) is the
# minimum-intervention fix.
webhookCertBootstrap:
  enabled: false
  certDuration: 8760h
  certRenewBefore: 720h
  # Pinned to the in-Sovereign Harbor proxy-cache per
  # docs/INVIOLABLE-PRINCIPLES.md image-source rule.
  kubectlImage: harbor.openova.io/proxy-dockerhub/bitnamilegacy/kubectl:1.31.4

global:
  # When set, ALL image pulls in this chart route through this registry.
  # Used post-handover when the Sovereign's own Harbor takes over the
  # proxy_cache role from contabo's central Harbor. Empty = no rewrite
  # (image references use upstream defaults). The upstream cloudnative-pg
  # subchart exposes `cloudnative-pg.image.repository` for registry override.
  # Per-Sovereign overlays wire that alongside this value. Tracked under #560.
  imageRegistry: ""

catalystBlueprint:
  upstream: { chart: cloudnative-pg, version: "0.28.0", repo: "https://cloudnative-pg.github.io/charts" }

# ─── Upstream chart values (subchart key: cloudnative-pg) ─────────────────
# `helm dependency build` resolves the upstream as a subchart; values here
# under the `cloudnative-pg:` key flow into that subchart unchanged.
cloudnative-pg:
  # Install postgresql.cnpg.io CRDs as part of this chart. Required so
  # consumers of `postgresql.cnpg.io/v1.Cluster` (bp-powerdns,
  # bp-keycloak, bp-gitea, bp-langfuse, …) can gate themselves on bp-cnpg
  # via Flux HelmRelease `dependsOn`. The CRDs ship with the upstream
  # chart so a single Blueprint OCI artifact carries both controller +
  # CRDs.
  crds:
    create: true

  # Operator replicas — single replica is fine for solo Sovereigns;
  # cluster overlays bump to 2-3 for HA on multi-node host clusters.
  # CNPG operator is leader-elected, so multiple replicas are passive
  # standbys.
  replicaCount: 1

  resources:
    # G17 (Refs #2557, 2026-05-28): bumped memory.
    # 1st cut: 256/512Mi → 512Mi/1Gi unblocked init-OOM (exit code 2 ~25s
    # after "Kubernetes system metadata" log). But 1Gi limit hit RUNTIME
    # OOM on hw45 after cnpg started reconciling Cluster CRs (1-2 restarts
    # within 10 min) → webhook 502 → bp-gitea + bp-harbor + bp-openbao
    # install failures.
    # 2nd cut (G17b): bump to 1Gi/2Gi for steady-state headroom. cnpg
    # operator's informer cache + watch handlers + leader election +
    # validating-webhook server collectively need > 1Gi when the cluster
    # has multiple Postgres Clusters across multiple namespaces.
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi

  # PodMonitor for the operator — DEFAULT OFF.
  #
  # Per docs/INVIOLABLE-PRINCIPLES.md #4 and docs/BLUEPRINT-AUTHORING.md
  # §11.2 (Observability toggles must default false): the
  # `monitoring.coreos.com/v1` CRDs that back PodMonitor ship with
  # kube-prometheus-stack — an Application Blueprint installed AFTER the
  # bootstrap-kit. Defaulting `podMonitorEnabled: true` would render a
  # PodMonitor on a fresh Sovereign before the CRD exists, and the
  # apiserver would reject it with "no matches for kind PodMonitor in
  # version monitoring.coreos.com/v1". Operator opts in via per-cluster
  # overlay (issue #182).
  monitoring:
    podMonitorEnabled: false

  # Webhook is enabled by default in upstream — keep it that way (CNPG
  # uses the webhook to validate Cluster CRs). cert-manager (bp-cert-
  # manager) provides the TLS cert per Sovereign convention.
  webhook:
    # HCS startup-probe widening (#2989-followup — caught live on hw90).
    # Upstream default is failureThreshold 6 × periodSeconds 5 = 30s. On
    # slow HCS Kom4DC nodes the operator's leader-election + webhook-server
    # (:9443) bind exceeds 30s, so the startup probe kills the operator
    # before /readyz responds → CrashLoopBackOff ("failed startup probe")
    # that wedges the whole cascade (bp-openbao → bp-sso-bridge →
    # bp-catalyst-platform all dependsOn bp-cnpg). 30 × 5 = 150s gives
    # ample headroom; the probe only runs at startup, so there's no
    # steady-state cost.
    startupProbe:
      failureThreshold: 30
      periodSeconds: 5

  # TEMP debug-logging (#2989/cnpg-followup — caught live on hw90): the
  # operator exits code 2 SILENTLY ~after the "Kubernetes system metadata"
  # log (NOT OOMKilled, node has memory, webhook cert mounted) →
  # CrashLoopBackOff that wedges the cascade (bp-openbao→bp-sso-bridge→
  # bp-catalyst-platform all dependsOn bp-cnpg). At default info level the
  # log dies at "system metadata" with no reason. --log-level=debug surfaces
  # WHICH startup step fails (webhook bind / leader election / cert load) so
  # the real cause is collected, not guessed. Remove once root-caused.
  additionalArgs:
    - "--log-level=debug"

# ─── Catalyst-managed overlay values consumed by templates/ ───────────────

# G53 (Refs #2604, 2026-05-30): webhook-gate Job + RBAC defaults.
# Post-install hook polls cnpg-webhook-service Endpoints + Mutating/Validating
# WebhookConfiguration caBundle until all 3 cleared, BEFORE Helm marks the
# release Installed. Mirrors G38/G44/G49 producer-side gate pattern.
# Closes META-AUDIT 1 downstream-chart x509 cnpg-webhook race that blocked
# bp-gitea / bp-harbor / bp-newapi / bp-openova-flow-server / bp-powerdns
# on hw61 v13 04:50Z (deployment bc232915d870bbc3).
webhookGate:
  enabled: true
  service:
    name: cnpg-webhook-service
    namespace: cnpg-system
  mutatingWebhookName: cnpg-mutating-webhook-configuration
  validatingWebhookName: cnpg-validating-webhook-configuration
  timeoutSeconds: 300
  intervalSeconds: 2
  image: "bitnamilegacy/kubectl:1.30.7"
  imagePullPolicy: IfNotPresent
