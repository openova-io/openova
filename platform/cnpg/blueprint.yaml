apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-cnpg
  labels:
    catalyst.openova.io/section: pts-4-1-data-services
spec:
  # 1.0.13 (G64 #4322): lockstep with chart/Chart.yaml — durable fix for the
  # cnpg-system operator corrupting the webhook caBundle with a leaf cert.
  # 1.0.14 (G65 #4322): lockstep — (A) per-Org operator RBAC can no longer patch
  # the cluster webhook singleton (subchart rbac.create=false + minimal
  # replacement RBAC), (B) reasserter Job /bin/sh→/bin/bash (#4326 fix).
  version: 1.0.17
  card:
    title: CloudNativePG
    category: database
    family: postgres
    summary: PostgreSQL operator for Kubernetes (HA primary/replica, automated backups, point-in-time recovery).
    description: Production-grade Postgres operator. Provisions a Cluster CR per database with streaming replication, scheduled backups, and S3 PITR.
    icon: postgres.svg
    license: Apache-2.0
    tags: [database, postgres, sql, operator, ha]
    docs: https://cloudnative-pg.io/documentation/
  visibility: listed
  # ── producesInstances (#3648) ───────────────────────────────────────
  # bp-cnpg is the OPERATOR / engine; it PRODUCES shareable data-instances
  # of bp-postgres (each install of bp-postgres = one CNPG Cluster = one
  # data-instance card). This DECLARED edge is what the platform engine
  # reads to give bp-cnpg the engine-class-card treatment and to resolve a
  # consumer's `backingServices[].type: postgres` to the bp-postgres
  # instance HR — NO "postgres" string is hardcoded in the engine. A
  # future Redis/Valkey or Kafka operator declares the same stanza and
  # gets the identical treatment with zero engine code changes.
  producesInstances:
    kind: postgres                  # the engine-class id consumers name in backingServices[].type
    instanceBlueprint: bp-postgres  # each install of this Blueprint is one shareable data-instance
  configSchema:
    type: object
    properties:
      instances:
        type: integer
        default: 3
        minimum: 1
        maximum: 5
        description: "Number of Postgres replicas (incl. primary)."
      storage:
        type: object
        properties:
          size:
            type: string
            default: 10Gi
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-cnpg
  upgrades:
    from: ["0.x"]
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ''
          clusters:
            - mgmt-A
            - mgmt-B
            - dmz-A
            - dmz-B
            - rtz-A
            - rtz-B
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  endpoints: []
