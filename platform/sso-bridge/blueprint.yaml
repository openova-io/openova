apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-sso-bridge
spec:
  version: 0.2.30
  card:
    title: SSO Bridge
    summary: Catalyst SSO framework — watches every HelmRelease and auto-provisions Keycloak Clients + OpenBao client_secrets + ExternalSecrets for apps that declare sso.enabled. Mandatory infra. See SECURITY.md §6.3.
    icon: sso-bridge.svg
  visibility: unlisted              # mandatory infra
  class: platform-component
  lifecycle: experimental
  manifests:
    chart: bp-sso-bridge

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive. Stateless auth bridge (G91/G112/G113
  #   chain). Secrets via External-Secrets / openbao — no per-Pod state.
  #   Switchover: bp-continuum DNS flip.
  topology:
    supported: [active-passive, singleton]
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: none
          mode: none
        switchover:
          mechanism: none
        placement:
          tier: ''
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ''
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # internal-only — reconciler runs cluster-wide; no exposed HTTP surface.
  endpoints: []

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # sso-bridge IS the SSO plumbing layer; it federates other apps to the
  # sovereign realm. It does not itself have a user-facing login.
  sso:
    realm: sovereign
    protocolMapper: oidc
    silentLogin: false

  placementSchema:
    modes: [single-region]
    default: single-region
