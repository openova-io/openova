apiVersion: v2
name: bp-sso-bridge
version: 0.2.25
# 0.2.24 (#4458, 2026-06-26): EGRESS half of the #4448/#4449 sso-bridge↔openbao
# netpol gap. THE CILIUM TRAP: the `sso-bridge-reconciler-apiserver`
# CiliumNetworkPolicy attaches an egress rule to the reconciler endpoint, which
# flips the endpoint to CNP-ENFORCED egress (Cilium default-deny) and renders
# the sibling K8s `NetworkPolicy/bp-sso-bridge` egress allow-list (DNS, keycloak,
# openbao) INERT — a plain K8s-NP `to openbao:8200` cannot override a CNP that
# does not also name openbao (reserved-identity supersession, same class as
# 0.2.7/#2861 ipBlock-excludes-kube-apiserver + openclaw #4401 JWKS-egress).
# Pre-0.2.24 the CNP egress listed ONLY kube-apiserver, so the reconciler's
# `openbao.openbao.svc:8200` + `keycloak.keycloak.svc:8080` dials were silently
# policy-dropped at the Cilium datapath: `no OpenBao token` every tick, NO
# `secret/sso/*` bundle written, grafana/hubble 503 + gitea 500 (their SSO secret
# never seeded). §6's UAT walk caught the live failure; ade30ccb's #4449 note
# ("sso-bridge's OWN egress NetworkPolicy already permits openbao:8200") was true
# about the K8s-NP literal content but moot — the CNP supersedes it. Fix: the CNP
# egress now ALSO names kube-dns (name-resolution must survive CNP enforcement),
# keycloak, and openbao, keyed off the SAME `networkPolicy.*` namespace/port knobs
# the K8s NetworkPolicy uses so the two stay in lockstep + overlay-tunable. New
# chart test 4458-egress-cnp-openbao.sh guards the openbao egress entry. Refs
# #4458 #4449 #4448 #4437 #4347 #4325.
# 0.2.23 (#4437, 2026-06-26): re-read the keycloak credentials Secret EACH
# TICK so a reflected `addr`/`client-secret` change is picked up without a
# pod roll — the permanent fix for grafana (et al) 503 on omantel.biz.
#
# LIVE RCA (dep 4635277cae4ffed9): grafana Pod 2/3 CreateContainerConfigError
# → 503; secret `grafana-sso-oidc-credentials` NotFound; the chart-side
# ExternalSecret rendered fine but reported `SecretSyncedError: Secret does
# not exist` for `sso/grafana` — the ClusterSecretStore vault-region1 was
# Valid/Ready, so OpenBao was reachable but the path was UNSEEDED. bp-sso-
# bridge seeds `secret/sso/<app>`, but it was `skipping tick (no KC token)`
# on EVERY tick with `curl: (6) Could not resolve host:
# keycloak-x-keycloak-x-mgmt-vcluster.mgmt.svc.cluster.local`. #4325/#4347
# DE-VCLUSTERED the mgmt plane → keycloak moved back to host ns `keycloak`
# (`keycloak.keycloak.svc`) and bp-keycloak re-emitted the CORRECTED `addr`
# into catalyst-kc-sa-credentials. But KC_ADDR is consumed as an ENV VAR via
# secretKeyRef, and env-var secretKeyRef values are snapshotted at Pod start
# and NEVER hot-reload on Secret content change (only volume mounts do). The
# 4d-old reconciler Pod kept the stale KC_ADDR forever, dialing the dead host
# → no token → no `sso/grafana` seed → grafana chart ES failed → secret never
# created → Pod wedged → 503.
#   Fix (script): new `refresh_kc_credentials()` re-reads the live
#   catalyst-kc-sa-credentials + catalyst-kc-master-admin-credentials Secrets
#   by NAME at the start of every tick (before mint_kc_token), overriding the
#   boot env snapshot; KC_ADDR/KC_SA_* boot guards relaxed to "" so the
#   per-tick refresh can recover even a never-populated snapshot. RBAC already
#   grants secrets:get cluster-wide. Self-healing by construction: reflected
#   addr/secret drift is absorbed within one 60s tick, ZERO pod roll.
#   Fix (deployment): pass KC_CREDENTIALS_SECRET_NAME /
#   KC_MASTER_CREDENTIALS_SECRET_NAME / RECONCILER_NAMESPACE (downward API) so
#   the script reads the live Secret by name.
#   Fix (values): re-home the stale `mgmt` keycloak/openbao egress
#   NetworkPolicy namespaces back to the de-vclustered host namespaces
#   (`keycloak`/`openbao`) — once KC_ADDR is correct, Cilium egress must allow
#   traffic to that namespace or it is policy-dropped. (Reverts 0.2.21's `mgmt`
#   default, which was correct for the #3642 vCluster topology #4325 undid.)
# Sibling of #4344 (keycloak admin-password regen) — the same secretKeyRef-
# snapshot staleness trap on the SA client-secret, now also self-healed.
# Refs #4437 #4347 #4325.
# 0.2.22 (#3374 cleanup-race, 2026-06-19): STOP the app-registration
# ExternalSecret create-then-delete churn. cleanup_orphans() deletes any ES
# labelled `bp-sso-bridge.openova.io/managed=true` whose client-id is NOT in
# `current_cids` — but current_cids is built ONLY from the HR-discovery loop,
# so the 4 app-registration ESs (hubble-ui, newapi-admin, openova-flow,
# powerdns-admin), which ALSO carry that managed label (applied by
# upsert_per_org_client's externalSecret.json path), were created each tick by
# the app-registration phase then DELETED ~3s later by the orphan sweep in the
# SAME tick. The ES + backing Secret therefore did not exist most of the time,
# so the consuming oauth2-proxy (hubble-ui) had no client_secret →
# zero-click SSO token-exchange intermittently failed. Fix: track the set of
# app-registration clientIds whose ExternalSecret was successfully applied this
# tick in a new global APP_REG_ES_CIDS (reset at the top of
# reconcile_app_registrations, appended on a successful apply in
# upsert_per_org_client), and UNION it into current_cids before the
# cleanup_orphans call. Uninstall semantics preserved: a removed
# app-registration ConfigMap drops its cid from BOTH sets next tick and its ES
# is correctly swept. Verified live hw167 (28d4e96f): hubble-ui ES went from
# recreated-every-tick to a single stable creationTimestamp across 5+ ticks,
# Ready=True, and the Hubble UI lands the operator signed-in via zero-click SSO
# (namespace selector renders, no unauthorized_client). Pure script change, no
# values-default change, strictly an improvement for all 4 app-reg ESs. Refs
# #3374.
# 0.2.21 (#3820 #3642, 2026-06-18): default networkPolicy.keycloakNamespace +
# openbaoNamespace `keycloak`/`openbao` → `mgmt`. #3642 (+#3760/#3737) re-homed
# BOTH keycloak and openbao INTO the mgmt vCluster; their workload Pods now run
# in the `mgmt` HOST namespace (mangled `*-x-*-x-mgmt-vcluster`), the legacy
# host namespaces being EMPTY of the actual workload. Cilium enforces egress
# NetworkPolicy on the destination Pod's namespace+target-port, so the stale
# `keycloak`/`openbao` selectors matched NOTHING — the reconciler's
# `mint Keycloak admin token` curl timed out (curl(28)) every tick and NO
# `secret/sso/*` bundle was written, leaving grafana/harbor/openbao/gitea +
# every oidc-gate consumer without their SSO secret → 503. hw165 live RCA:
# reconciler timed out to keycloak even co-located on keycloak's own node; a
# probe Pod with a different name label (NOT selected by this policy) reached
# keycloak fine — the egress namespace selector was the sole wall. Once flipped
# to `mgmt` the reconciler minted tokens + reconciled all 7 SSO HRs.
# 0.2.20 (#3646, 2026-06-17): stamp the `catalyst.openova.io/reconciler`
# marker label on the sso-bridge-reconciler Deployment so the jobs canvas's
# generic §5a reconciler ingestion surfaces it as a kind=reconciler leaf
# with a HEALTH status (healthy/degraded/failing), never a one-shot row.
# 0.2.19 (#3374 Layer-C, 2026-06-17): DELETE the dead admin-by-default
# theater (#3685). grant_operator_admin (minted a per-Client `admin` role
# NO app reads — every app keys admin on the `groups` claim) and
# grant_operator_realm_roles (per-email catalyst-admin grant, now
# superseded by the realm-import group composite on /sovereign-admins) are
# both removed, along with the per-HR `sso.realmRolesGranted` plumbing. On
# hw150 with orgEmail="" these logged "skipping admin grant"/"skipping
# realm-role grant" every 60s tick and NEVER granted anything. The
# reconciler's job is now purely client-upsert + secret publication; admin
# is conferred ONLY by /sovereign-admins membership. No privilege outcome
# depends on the empty `orgEmail` ConfigMap key.
#
# 0.2.18 (#3374, 2026-06-14): add `sso.skipExternalSecret: true` opt-out.
# Apps that consume their OIDC secret as DIRECT env vars (grafana's
# `envFromSecret`) need keys named after the app's env-override contract
# (GF_AUTH_GENERIC_OAUTH_* / GF_SERVER_ROOT_URL), not the raw scalars this
# reconciler projects — and they ship their OWN chart-side ExternalSecret
# (with a target.template performing the rename + root_url derivation) that
# reads the SAME OpenBao `sso/<cid>` bundle. With 0.2.17 emitting into the
# targetNamespace, the raw-key bp-sso-bridge ES collided with grafana's
# transformed chart ES over `grafana-sso-oidc-credentials` and the raw win
# left grafana's generic_oauth unconfigured (empty client_id, redirect_uri →
# https://localhost/) → zero-click SSO failed. The flag makes the reconciler
# still WRITE the OpenBao bundle (the chart ES's data source) but SKIP the
# colliding raw-key K8s ExternalSecret. Default false → every other app
# (harbor/openbao/gitea/powerdns, all raw-key Job consumers) is byte-identical.
# Slot 25-grafana sets it. Refs #3374.
# 0.2.17 (#3374, 2026-06-14): emit the per-app OIDC ExternalSecret into the
# HR's `targetNamespace` (the namespace where the app POD actually runs),
# falling back to the HR's own namespace only when targetNamespace is unset.
# Every Tier-1 SSO slot installs its HR in flux-system but targets the app's
# own namespace (bp-grafana→grafana, bp-harbor→harbor, bp-openbao→openbao,
# bp-gitea→gitea, bp-powerdns-admin→powerdns-admin); the pre-fix code wrote
# the ES into the HR namespace (flux-system), so the projected
# `<cid>-sso-oidc-credentials` Secret landed in flux-system — invisible to
# the app Pod's `envFromSecret`. harbor/openbao/gitea were masked because
# their chart ALSO ships an ES rendering into the targetNamespace; grafana's
# chart ES is omitted by the install-time `.Capabilities` ESO-CRD-race guard,
# so grafana had NO ES in its own namespace → Pod stuck 2/3
# CreateContainerConfigError → grafana route 503 "no healthy upstream". This
# makes bp-sso-bridge deliver the OIDC secret to the correct namespace for
# every app regardless of whether the chart-side ES rendered. The default
# (in-place HR with no targetNamespace) render is byte-identical. Refs #3374.
# 0.2.16 (#3374, 2026-06-14): the AppRegistration watcher (upsert_per_org_
# client) now applies an OPTIONAL chart-declared ExternalSecret when the
# AppRegistration ConfigMap carries a `data["externalSecret.json"]` block
# ({name, namespace, secretKey, property}). This lets a chart that installs
# BEFORE bp-external-secrets — the slot-01 CNI bp-cilium (hubble-ui oauth2-
# proxy) — get its OIDC client-secret ExternalSecret created by THIS post-
# ESO reconciler instead of by its own chart template, which the slot-01
# install-time `.Capabilities` snapshot permanently omits (helm-controller
# drift never re-evaluates it; an in-chart CNI hook that waits for ESO would
# deadlock since ESO's slot dependsOn the CNI). The remoteRef key is always
# the canonical `sso/<realm>/<cid>` this function already writes. Purely
# additive: consumers without the field (6 Tier-3 apps + per-Org charts) are
# byte-identical. Lockstep: bp-cilium 1.4.2 ships the hubble-ui declaration.
# 0.2.15 (#2940 Pillar 5 anti-tether, 2026-06-08): the reconciler image's
# registry host is no longer hardcoded `harbor.openova.io` in
# `image.repository`. New `global.registryMirror` value (default
# `harbor.openova.io`) is the SINGLE source of truth for the registry
# host; `image.repository` is now the registry-relative path
# (`proxy-dockerhub/alpine/k8s`); new `bp-sso-bridge.image` helper in
# templates/_helpers.tpl composes `<mirror>/<repo>:<tag>`. Default render
# is byte-identical to 0.2.14 (still harbor.openova.io). A per-Sovereign
# overlay — or the bp-self-sovereign-cutover Step-04 registry pivot
# (ADR-0002) — re-points EVERY pull by setting global.registryMirror to
# the Sovereign's own Harbor. Backward-compat: a host-qualified
# `image.repository` (pre-#2940 shape) is still honoured verbatim by the
# helper. Slot 13b wires `${REGISTRY_MIRROR:=harbor.openova.io}`. Pure
# additive value + template helper; no behaviour change at defaults.
# Refs #2940.
# 0.2.8 (G117.5-followup #2914, 2026-06-03): dual-token KC mint —
# sovereign-realm SA token for in-realm operations + new master-realm
# admin token for POST /admin/realms (per-Org realm provisioning).
# The sovereign-realm SA cannot create realms because `create-realm`
# is a master-realm-only role. Pre-fix: provision_org_realm POSTed
# with the sovereign SA token → HTTP 403 → per-Org realms never
# materialised → 2-hop SSO federation undemoable.
#
# Implementation:
#   - New env vars KC_MASTER_REALM / KC_MASTER_ADMIN_USER /
#     KC_MASTER_ADMIN_PASSWORD sourced from
#     catalyst-kc-master-admin-credentials Secret (emitted by
#     bp-keycloak 1.4.18+, mirrored into sso-bridge ns by reflector,
#     `optional: true` on each env so first-install before mirror
#     fills doesn't crash the Pod).
#   - New `mint_kc_master_admin_token()` shell fn uses
#     grant_type=password against /realms/master/.../token with the
#     bitnami `admin` user creds (admin-cli client has
#     directAccessGrantsEnabled=true by default).
#   - provision_org_realm calls mint_kc_master_admin_token before
#     POST /admin/realms; if master creds unfilled (reflector hasn't
#     mirrored yet), tick skips gracefully + retries next iteration.
# Refs #2914 #2744.
# 0.2.7 (#2861 RCA, 2026-06-03): fix Cilium identity-mismatch on the
# kube-apiserver egress rule. The chart shipped `ipBlock: 0.0.0.0/0`
# for kube-API egress, which Cilium translates into the
# `reserved:world` identity. `reserved:world` EXCLUDES the special
# `reserved:kube-apiserver` identity assigned to in-cluster
# kube-apiserver Pods → every reconciler tick that called
# `kubectl get cm sovereign-fqdn` got `Policy denied identity
# 15466798->kube-apiserver` at the Cilium datapath. DNS still
# worked because the kube-dns rule uses namespaceSelector
# (identity-resolved through pod-labels, not ipBlock).
#
# Symptom on hw86: bp-sso-bridge logged `skipping tick` every 6
# minutes from 01:33Z onward; per-Org realm provisioning stalled;
# 4 prior containment attempts (cilium-agent restart, Pod restart,
# cordon+reschedule, delete CNP) did not help because none of them
# changed the NetworkPolicy rule that produced the verdict.
#
# Fix: replace the `ipBlock 0.0.0.0/0` rule with two narrower rules:
#   (a) explicit `default/component=apiserver,provider=kubernetes`
#       podSelector on ports 6443 + 443 (k3s + kubeadm Pod labels);
#   (b) namespaceSelector: {} on port 443 to keep ExternalSecret CR
#       writes flowing to per-app namespaces.
# Pure template change; no values-default change. Refs #2861 #2744.
# 0.2.6 (#2744 H8 walk, 2026-06-03): fix Cilium egress NetworkPolicy
# port mismatch that silently broke ALL per-Org realm provisioning
# for 24h+. The reconciler curl'd keycloak.keycloak.svc:80 (Service
# port) and hit curl(28) connect timeouts on every tick because
# Cilium enforces egress NetPol on the DESTINATION POD'S TARGET
# PORT (8080 here), NOT the Service port. The chart's egress rule
# allow-listed port 80 only → Cilium dropped 8080 traffic at
# bp-sso-bridge's pod, silently blocking ALL Tier-1/2/3 client
# upserts + per-Org realm imports. Fix: add `8080/TCP` to the
# keycloak-egress port list alongside the existing `80/TCP`
# (kept for back-compat with non-Cilium CNIs that may match on
# Service port). Operators overriding `networkPolicy.keycloakPort`
# in per-Sovereign overlays must enumerate the Pod target port too.
# Pure template change; no values default change. Refs #2744 #2834.
# 0.2.5 (G117.E2E-C1 #2816, 2026-06-03): fix sovereign-fqdn ConfigMap
# data-key contract drift — chart default `sovereignFqdnKey: sovereignFqdn`
# did not match the key actually emitted by bp-catalyst-platform
# (`fqdn`). Result: bp-sso-bridge `sovereign_fqdn()` returned empty on
# every tick, the loop logged `WARN: sovereign-fqdn ConfigMap missing;
# skipping tick` every 6 min, and Tier-1 OpenBao writes + per-Org realm
# reconciliation never happened. Caught live on hw86 (E2E-A6 4-hop SSO
# probe found token-exchange returning `unauthorized_client` because
# chart-side OIDC secrets — md5 32-hex via lookup-or-generate — never
# converged with KC realm-imported secrets — sha256 64-hex). Fix is
# values.yaml default only; no template/script changes; operators that
# already override sovereignFqdnKey in per-Sovereign overlays are
# unaffected. New chart test
# `tests/g117-e2e-a1-sovereign-fqdn-key-contract.sh` guards against
# future drift by asserting the chart default matches the emitter key.
# Refs #2816 #2737 #2743 #2744 #2683.
# 0.2.4 (G117.5c-followup #2807, 2026-06-02): extend Tier-3 per-Org
# OpenBao bundle to include `session_secret` so librechat's
# OPENID_SESSION_SECRET env var resolves via ExternalSecret. Derived
# deterministically from sha256(clientId|session|realm|client_secret)
# — render-stable across reconcile ticks, distinct from client_secret,
# and never rotates on its own. Other Tier-3 apps that don't reference
# the key just ignore it. Refs #2807.
# 0.2.3 (G117.5c #2801, 2026-06-02): Tier-3 AppRegistration ConfigMap
# watcher. Two new bash functions in templates/configmap-reconciler.yaml:
#   - upsert_per_org_client: for one ConfigMap labelled
#     `sso.openova.io/app-registration=<client-id>` carrying data.realm
#     + data.client.json, POST/PUT the client into the per-Org realm,
#     GET the KC-managed client_secret, persist the bundle (client_id,
#     client_secret, issuer_url, authorize_url, token_url, userinfo_url,
#     end_session_url, realm) to OpenBao at `sso/<realm>/<client-id>`
#     where the Tier-3 chart-side sso-externalsecret.yaml's remoteRef
#     resolves it. Idempotent: PUT on existing client (clientId is the
#     natural key); 409 swallow on POST race.
#   - reconcile_app_registrations: lists ConfigMaps with label
#     `sso.openova.io/app-registration` cluster-wide and calls
#     upsert_per_org_client on each. Runs every tick AFTER
#     reconcile_per_org_realms (so per-Org realms exist by the time we
#     POST clients into them) sharing the same KC admin token.
#     Idempotent end-to-end.
# Closes G117.5 W3.D2 verifier's GAP finding: chart-emitted Tier-3
# `sso.openova.io/app-registration` ConfigMaps were dormant; bp-sso-
# bridge HR-watcher only matched `.spec.values.sso.enabled=true` for
# Tier-1/2 mints into the sovereign realm. This loop closes the Tier-3
# loop into per-Org realms.
# No new RBAC verbs required (ClusterRole already has configmaps:list).
# Backwards-compatible: if no app-registration ConfigMaps exist, the
# new functions log nothing and return immediately. Refs #2801 #2744.
# 0.2.2 (G117.5 W2.C4 #2744, 2026-06-02): per-Org realm reconciler.
# Two new bash functions in templates/configmap-reconciler.yaml:
#   - provision_org_realm: for one per-Org realm ConfigMap (emitted by
#     bp-keycloak 1.4.12 via tenantRealms[]), POSTs /admin/realms to
#     import the Org realm (idempotent on 409), POST/PUTs the matching
#     <slug>-broker Client in the sovereign realm with the chart-derived
#     deterministic clientSecret, persists the secret in OpenBao at
#     kv/org/<slug>/keycloak/sovereign-broker-secret.
#   - reconcile_per_org_realms: lists all ConfigMaps with label
#     catalyst.openova.io/per-org-realm=true cluster-wide and calls
#     provision_org_realm on each. Runs every tick AFTER the per-app
#     SSO reconcile loop, sharing the same KC admin token. Idempotent
#     end-to-end: re-running on a healthy state is a no-op.
# No new RBAC verbs required (ClusterRole already has configmaps:list).
# Pairs with bp-keycloak 1.4.12 tenantRealms[] values list. Backwards-
# compatible: if no per-Org-realm ConfigMaps exist, the new functions
# log nothing and return immediately. Refs #2744.
# 0.1.1 (G91.catalyst-console-admin-self-grant #2659, 2026-05-31):
# extends the reconcile loop with:
#   - `grant_operator_realm_roles` — grants the operator user the
#     space-separated list of realm-roles named in the HR's
#     `.spec.values.sso.realmRolesGranted` array. Idempotent (Keycloak
#     swallows duplicate role-mappings). Required for #2659 because
#     bp-catalyst-platform's operator console (`catalyst-ui` Client,
#     pre-existing in the realm import) is gated by realm-roles
#     `catalyst-{viewer,developer,operator,admin,owner}`, not a per-
#     Client role.
#   - `.spec.values.sso.skipClientUpsert: true` opt-out flag — apps
#     that already have a pre-existing Keycloak Client (e.g.
#     `catalyst-ui`) can declare this to mark themselves opt-in for
#     the realm-role-grant path only; the framework then skips
#     upsert_client + emit_external_secret + per-Client `admin` grant.
# Backwards-compatible: every existing consumer (bp-gitea, bp-harbor,
# bp-openbao, bp-grafana, bp-sandbox) keeps the legacy per-Client
# upsert + admin path because neither new field is set.
description: |
  Catalyst SSO framework (G91 #2652). Reconciles a Keycloak Client per
  HelmRelease that declares `sso.enabled: true` in its values, stores the
  OAuth client_secret in OpenBao, emits an ExternalSecret CR in the app's
  namespace so the app picks up the secret declaratively, and grants the
  Sovereign operator (deployment.OrgEmail; sovereign-fqdn ConfigMap key
  `orgEmail`) the app's admin role.

  Per SECURITY.md §6.3 the configSchema contract is:

      sso:
        enabled: true

  ZERO additional knobs required from the app author — clientId, redirect
  URIs, scopes, mappers, secret storage path, and ExternalSecret target are
  derived from the HelmRelease name + the app's chart values + the
  Sovereign realm definition.

  Architecture (controller-loop in Bash, not controller-runtime Go):
    1. ServiceAccount + ClusterRole (HR list/watch cluster-wide, ExternalSecret
       create/patch in any ns, sovereign-fqdn ConfigMap read).
    2. Deployment running a single-replica reconcile loop (60s tick).
    3. Loop pulls every HelmRelease with `.spec.values.sso.enabled == true`,
       derives the per-app OIDC client spec, and:
         a. Mints a per-Sovereign Keycloak admin token via the
            catalyst-kc-sa-credentials Secret reflected from the keycloak
            namespace into catalyst-system (already in place per
            platform/keycloak/chart/templates/configmap-sovereign-realm.yaml).
         b. Upserts the Client (POST or PUT) including ProtocolMappers for
            username, email, groups, org.
         c. On first install: generates a 32-char client_secret and PUTs it
            into OpenBao at `secret/sso/<clientId>`.
            On upgrade: re-uses the value already in OpenBao (idempotent;
            no rotation on each tick).
         d. Emits an ExternalSecret CR in the HR's namespace
            (named `<clientId>-sso-oidc-credentials`) that mirrors the
            client_secret from OpenBao into a K8s Secret.
         e. Maps the operator's email → app's admin client-role.
       On HR deletion: deletes the Keycloak Client + OpenBao key + ESO CR.

  Why a Bash + kubectl + curl loop, not a controller-runtime Go binary
  ====================================================================
  Per Inviolable Principle #4 (waterfall-quality target-state) AND
  Principle #14 (no workarounds): the right tool for "sync ≤30 app
  Clients every minute" is a polling reconciler, not a per-event
  controller. Controller-runtime would add a Go module, CRD types, a new
  CI build path, and lockstep image promotion just to wrap the same
  Kubernetes informer pattern around a couple of Admin REST API calls.
  Pure bash + kubectl + curl + jq fits in this chart, ships zero new
  images (`harbor.openova.io/proxy-dockerhub/bitnamilegacy/kubectl:1.30.7`
  is already mirrored by every Sovereign per Fix #163), and stays in
  source on the operator's screen instead of in a remote binary.

  Optionally swap to controller-runtime when Catalyst grows a first-class
  KeycloakClient CRD (deferred — not on the current EPIC plate).
type: application
keywords: [catalyst, blueprint, sso, keycloak, openbao, external-secrets, oidc]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

annotations:
  catalyst.openova.io/no-upstream: "true"
  catalyst.openova.io/depends-on: "bp-keycloak,bp-openbao,bp-external-secrets-stores"
