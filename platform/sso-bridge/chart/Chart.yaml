apiVersion: v2
name: bp-sso-bridge
version: 0.2.7
# 0.2.7 (#2861 RCA, 2026-06-03): fix Cilium identity-mismatch on the
# kube-apiserver egress rule. The chart shipped `ipBlock: 0.0.0.0/0`
# for kube-API egress, which Cilium translates into the
# `reserved:world` identity. `reserved:world` EXCLUDES the special
# `reserved:kube-apiserver` identity assigned to in-cluster
# kube-apiserver Pods → every reconciler tick that called
# `kubectl get cm sovereign-fqdn` got `Policy denied identity
# 15466798->kube-apiserver` at the Cilium datapath. DNS still
# worked because the kube-dns rule uses namespaceSelector
# (identity-resolved through pod-labels, not ipBlock).
#
# Symptom on hw86: bp-sso-bridge logged `skipping tick` every 6
# minutes from 01:33Z onward; per-Org realm provisioning stalled;
# 4 prior containment attempts (cilium-agent restart, Pod restart,
# cordon+reschedule, delete CNP) did not help because none of them
# changed the NetworkPolicy rule that produced the verdict.
#
# Fix: replace the `ipBlock 0.0.0.0/0` rule with two narrower rules:
#   (a) explicit `default/component=apiserver,provider=kubernetes`
#       podSelector on ports 6443 + 443 (k3s + kubeadm Pod labels);
#   (b) namespaceSelector: {} on port 443 to keep ExternalSecret CR
#       writes flowing to per-app namespaces.
# Pure template change; no values-default change. Refs #2861 #2744.
# 0.2.6 (#2744 H8 walk, 2026-06-03): fix Cilium egress NetworkPolicy
# port mismatch that silently broke ALL per-Org realm provisioning
# for 24h+. The reconciler curl'd keycloak.keycloak.svc:80 (Service
# port) and hit curl(28) connect timeouts on every tick because
# Cilium enforces egress NetPol on the DESTINATION POD'S TARGET
# PORT (8080 here), NOT the Service port. The chart's egress rule
# allow-listed port 80 only → Cilium dropped 8080 traffic at
# bp-sso-bridge's pod, silently blocking ALL Tier-1/2/3 client
# upserts + per-Org realm imports. Fix: add `8080/TCP` to the
# keycloak-egress port list alongside the existing `80/TCP`
# (kept for back-compat with non-Cilium CNIs that may match on
# Service port). Operators overriding `networkPolicy.keycloakPort`
# in per-Sovereign overlays must enumerate the Pod target port too.
# Pure template change; no values default change. Refs #2744 #2834.
# 0.2.5 (G117.E2E-C1 #2816, 2026-06-03): fix sovereign-fqdn ConfigMap
# data-key contract drift — chart default `sovereignFqdnKey: sovereignFqdn`
# did not match the key actually emitted by bp-catalyst-platform
# (`fqdn`). Result: bp-sso-bridge `sovereign_fqdn()` returned empty on
# every tick, the loop logged `WARN: sovereign-fqdn ConfigMap missing;
# skipping tick` every 6 min, and Tier-1 OpenBao writes + per-Org realm
# reconciliation never happened. Caught live on hw86 (E2E-A6 4-hop SSO
# probe found token-exchange returning `unauthorized_client` because
# chart-side OIDC secrets — md5 32-hex via lookup-or-generate — never
# converged with KC realm-imported secrets — sha256 64-hex). Fix is
# values.yaml default only; no template/script changes; operators that
# already override sovereignFqdnKey in per-Sovereign overlays are
# unaffected. New chart test
# `tests/g117-e2e-a1-sovereign-fqdn-key-contract.sh` guards against
# future drift by asserting the chart default matches the emitter key.
# Refs #2816 #2737 #2743 #2744 #2683.
# 0.2.4 (G117.5c-followup #2807, 2026-06-02): extend Tier-3 per-Org
# OpenBao bundle to include `session_secret` so librechat's
# OPENID_SESSION_SECRET env var resolves via ExternalSecret. Derived
# deterministically from sha256(clientId|session|realm|client_secret)
# — render-stable across reconcile ticks, distinct from client_secret,
# and never rotates on its own. Other Tier-3 apps that don't reference
# the key just ignore it. Refs #2807.
# 0.2.3 (G117.5c #2801, 2026-06-02): Tier-3 AppRegistration ConfigMap
# watcher. Two new bash functions in templates/configmap-reconciler.yaml:
#   - upsert_per_org_client: for one ConfigMap labelled
#     `sso.openova.io/app-registration=<client-id>` carrying data.realm
#     + data.client.json, POST/PUT the client into the per-Org realm,
#     GET the KC-managed client_secret, persist the bundle (client_id,
#     client_secret, issuer_url, authorize_url, token_url, userinfo_url,
#     end_session_url, realm) to OpenBao at `sso/<realm>/<client-id>`
#     where the Tier-3 chart-side sso-externalsecret.yaml's remoteRef
#     resolves it. Idempotent: PUT on existing client (clientId is the
#     natural key); 409 swallow on POST race.
#   - reconcile_app_registrations: lists ConfigMaps with label
#     `sso.openova.io/app-registration` cluster-wide and calls
#     upsert_per_org_client on each. Runs every tick AFTER
#     reconcile_per_org_realms (so per-Org realms exist by the time we
#     POST clients into them) sharing the same KC admin token.
#     Idempotent end-to-end.
# Closes G117.5 W3.D2 verifier's GAP finding: chart-emitted Tier-3
# `sso.openova.io/app-registration` ConfigMaps were dormant; bp-sso-
# bridge HR-watcher only matched `.spec.values.sso.enabled=true` for
# Tier-1/2 mints into the sovereign realm. This loop closes the Tier-3
# loop into per-Org realms.
# No new RBAC verbs required (ClusterRole already has configmaps:list).
# Backwards-compatible: if no app-registration ConfigMaps exist, the
# new functions log nothing and return immediately. Refs #2801 #2744.
# 0.2.2 (G117.5 W2.C4 #2744, 2026-06-02): per-Org realm reconciler.
# Two new bash functions in templates/configmap-reconciler.yaml:
#   - provision_org_realm: for one per-Org realm ConfigMap (emitted by
#     bp-keycloak 1.4.12 via tenantRealms[]), POSTs /admin/realms to
#     import the Org realm (idempotent on 409), POST/PUTs the matching
#     <slug>-broker Client in the sovereign realm with the chart-derived
#     deterministic clientSecret, persists the secret in OpenBao at
#     kv/org/<slug>/keycloak/sovereign-broker-secret.
#   - reconcile_per_org_realms: lists all ConfigMaps with label
#     catalyst.openova.io/per-org-realm=true cluster-wide and calls
#     provision_org_realm on each. Runs every tick AFTER the per-app
#     SSO reconcile loop, sharing the same KC admin token. Idempotent
#     end-to-end: re-running on a healthy state is a no-op.
# No new RBAC verbs required (ClusterRole already has configmaps:list).
# Pairs with bp-keycloak 1.4.12 tenantRealms[] values list. Backwards-
# compatible: if no per-Org-realm ConfigMaps exist, the new functions
# log nothing and return immediately. Refs #2744.
# 0.1.1 (G91.catalyst-console-admin-self-grant #2659, 2026-05-31):
# extends the reconcile loop with:
#   - `grant_operator_realm_roles` — grants the operator user the
#     space-separated list of realm-roles named in the HR's
#     `.spec.values.sso.realmRolesGranted` array. Idempotent (Keycloak
#     swallows duplicate role-mappings). Required for #2659 because
#     bp-catalyst-platform's operator console (`catalyst-ui` Client,
#     pre-existing in the realm import) is gated by realm-roles
#     `catalyst-{viewer,developer,operator,admin,owner}`, not a per-
#     Client role.
#   - `.spec.values.sso.skipClientUpsert: true` opt-out flag — apps
#     that already have a pre-existing Keycloak Client (e.g.
#     `catalyst-ui`) can declare this to mark themselves opt-in for
#     the realm-role-grant path only; the framework then skips
#     upsert_client + emit_external_secret + per-Client `admin` grant.
# Backwards-compatible: every existing consumer (bp-gitea, bp-harbor,
# bp-openbao, bp-grafana, bp-sandbox) keeps the legacy per-Client
# upsert + admin path because neither new field is set.
description: |
  Catalyst SSO framework (G91 #2652). Reconciles a Keycloak Client per
  HelmRelease that declares `sso.enabled: true` in its values, stores the
  OAuth client_secret in OpenBao, emits an ExternalSecret CR in the app's
  namespace so the app picks up the secret declaratively, and grants the
  Sovereign operator (deployment.OrgEmail; sovereign-fqdn ConfigMap key
  `orgEmail`) the app's admin role.

  Per SECURITY.md §6.3 the configSchema contract is:

      sso:
        enabled: true

  ZERO additional knobs required from the app author — clientId, redirect
  URIs, scopes, mappers, secret storage path, and ExternalSecret target are
  derived from the HelmRelease name + the app's chart values + the
  Sovereign realm definition.

  Architecture (controller-loop in Bash, not controller-runtime Go):
    1. ServiceAccount + ClusterRole (HR list/watch cluster-wide, ExternalSecret
       create/patch in any ns, sovereign-fqdn ConfigMap read).
    2. Deployment running a single-replica reconcile loop (60s tick).
    3. Loop pulls every HelmRelease with `.spec.values.sso.enabled == true`,
       derives the per-app OIDC client spec, and:
         a. Mints a per-Sovereign Keycloak admin token via the
            catalyst-kc-sa-credentials Secret reflected from the keycloak
            namespace into catalyst-system (already in place per
            platform/keycloak/chart/templates/configmap-sovereign-realm.yaml).
         b. Upserts the Client (POST or PUT) including ProtocolMappers for
            username, email, groups, org.
         c. On first install: generates a 32-char client_secret and PUTs it
            into OpenBao at `secret/sso/<clientId>`.
            On upgrade: re-uses the value already in OpenBao (idempotent;
            no rotation on each tick).
         d. Emits an ExternalSecret CR in the HR's namespace
            (named `<clientId>-sso-oidc-credentials`) that mirrors the
            client_secret from OpenBao into a K8s Secret.
         e. Maps the operator's email → app's admin client-role.
       On HR deletion: deletes the Keycloak Client + OpenBao key + ESO CR.

  Why a Bash + kubectl + curl loop, not a controller-runtime Go binary
  ====================================================================
  Per Inviolable Principle #4 (waterfall-quality target-state) AND
  Principle #14 (no workarounds): the right tool for "sync ≤30 app
  Clients every minute" is a polling reconciler, not a per-event
  controller. Controller-runtime would add a Go module, CRD types, a new
  CI build path, and lockstep image promotion just to wrap the same
  Kubernetes informer pattern around a couple of Admin REST API calls.
  Pure bash + kubectl + curl + jq fits in this chart, ships zero new
  images (`harbor.openova.io/proxy-dockerhub/bitnamilegacy/kubectl:1.30.7`
  is already mirrored by every Sovereign per Fix #163), and stays in
  source on the operator's screen instead of in a remote binary.

  Optionally swap to controller-runtime when Catalyst grows a first-class
  KeycloakClient CRD (deferred — not on the current EPIC plate).
type: application
keywords: [catalyst, blueprint, sso, keycloak, openbao, external-secrets, oidc]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

annotations:
  catalyst.openova.io/no-upstream: "true"
  catalyst.openova.io/depends-on: "bp-keycloak,bp-openbao,bp-external-secrets-stores"
