# Catalyst bp-sso-bridge values overlay.
#
# Per Inviolable Principle #4 (never hardcode): every operational knob
# flows from this file or from the per-Sovereign sovereign-fqdn ConfigMap.

# Enable/disable the entire framework. Operator overlays may flip to false
# during incident response (e.g. Keycloak realm import in flux); shipping
# default = true because the framework is mandatory infra per SECURITY.md
# §6.3.
enabled: true

# Reconcile loop image.
#
# G109 #2705 (2026-06-01): swapped from `bitnamilegacy/kubectl` to
# `alpine/k8s` because the bitnamilegacy image does NOT have `curl`
# installed, and the reconcile.sh script depends on curl for Keycloak
# admin-API + OpenBao auth calls. Live-evidence on hw86 2026-06-01T13:01Z:
#
#   /etc/sso-bridge/reconcile.sh: line 52: curl: command not found
#   ERR : failed to mint Keycloak admin token
#
# `alpine/k8s:1.30.0` ships bash + curl + jq + kubectl in a single tiny
# image (~50MB) and is the canonical chart-side bash tooling image for
# the rest of the OpenOva catalog post-G109. MIRROR-EVERYTHING via the
# Harbor proxy-cache.
image:
  repository: harbor.openova.io/proxy-dockerhub/alpine/k8s
  tag: "1.30.0"
  pullPolicy: IfNotPresent

# Reconcile cadence. 60s is the natural ceiling for "operator pushed a new
# app + wants SSO immediately"; tighter intervals burn API calls without
# meaningful UX delta. Bounded at 600s for upper sanity.
reconcile:
  intervalSeconds: 60
  # If a single reconcile loop exceeds this, the next tick triggers anyway —
  # i.e. we never serialise behind a stuck tick. Safe because all the
  # underlying calls are idempotent.
  timeoutSeconds: 120

# Keycloak admin endpoint.
# Re-uses the existing catalyst-kc-sa-credentials Secret (reflected from
# `keycloak` ns into `catalyst-system` by emberstack/reflector — see
# platform/keycloak/chart/templates/configmap-sovereign-realm.yaml).
# bp-sso-bridge runs in its own `sso-bridge` ns so the reflector annotation
# on that Secret must allow `sso-bridge` too — this chart applies an
# auto-mirror Secret in `sso-bridge` ns that picks up from the upstream
# reflector chain. See templates/secret-kc-credentials-mirror.yaml.
keycloak:
  # Realm name. Default matches platform/keycloak default
  # (configmap-sovereign-realm.yaml `$realmName := default "sovereign"`).
  realm: sovereign
  # The Secret-key map of the reflected catalyst-kc-sa-credentials.
  # Keys: addr / realm / client-id / client-secret.
  credentialsSecretName: catalyst-kc-sa-credentials
  # G117.5-followup #2914 (2026-06-03): master-realm admin credentials
  # used ONLY by provision_org_realm's POST /admin/realms call (master-
  # realm-only `create-realm` role). Sourced from bp-keycloak 1.4.18+
  # which emits catalyst-kc-master-admin-credentials looking up the
  # bitnami-generated admin password via Helm lookup. Mirrored into
  # sso-bridge ns by reflector. Keys: addr / master-realm /
  # master-realm-admin-user / master-realm-admin-password.
  masterAdminCredentialsSecretName: catalyst-kc-master-admin-credentials

# OpenBao endpoint. Default matches platform/external-secrets-stores
# values.yaml `clusterSecretStore.server`.
openbao:
  addr: "http://openbao.openbao.svc.cluster.local:8200"
  # KV v2 mount path under which we write `secret/sso/<clientId>` entries.
  # Defaults to the `secret` mount the bp-openbao chart sets up at
  # bootstrap time (clusterSecretStore.path).
  kvMount: "secret"
  # K8s SA auth role bound to bp-sso-bridge's ServiceAccount on bp-openbao
  # bootstrap. Created by the bp-openbao bootstrap kustomize (Phase-1).
  kubernetesAuth:
    mountPath: "kubernetes"
    role: "sso-bridge"
    serviceAccountName: sso-bridge-reconciler
    serviceAccountNamespace: sso-bridge

# Operator email override. If empty (default) the reconciler reads the
# value from the per-Sovereign sovereign-fqdn ConfigMap key `orgEmail`
# (set by catalyst-api Phase-1 watcher from deployment.request.OrgEmail).
operator:
  emailOverride: ""
  sovereignFqdnConfigMap:
    name: sovereign-fqdn
    namespace: catalyst-system
    orgEmailKey: orgEmail
    # The canonical data key in the sovereign-fqdn ConfigMap is `fqdn`
    # (emitted by products/catalyst/chart/templates/sovereign-fqdn-configmap.yaml:48
    # via `fqdn: {{ .Values.global.sovereignFQDN | quote }}`). The legacy
    # default `sovereignFqdn` shipped in G91.1 (PR #2683) does not exist on
    # any Sovereign — the reconcile loop's `sovereign_fqdn()` returns empty,
    # logs `sovereign-fqdn ConfigMap missing; skipping tick` every tick, and
    # the Tier-1 OpenBao writes (sso/<app>) + per-Org-realm reconciler calls
    # never happen. Caught live on hw86 2026-06-03 (G117.E2E-A6 verdict)
    # where bp-gitea + bp-grafana token-exchange failed with
    # `unauthorized_client` because chart-side OIDC secrets (md5 32-hex)
    # never converged with KC-realm-imported secrets (sha256 64-hex).
    sovereignFqdnKey: fqdn

# Resource budget for the reconcile loop Pod. ~10 apps reconciled per tick
# is the steady-state, all calls go through in-cluster Services, the
# heaviest work is jq filtering.
resources:
  requests:
    cpu: "20m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

# Pod-level security context. runAsNonRoot is mandatory under the catalyst
# Kyverno baseline policies.
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# G109 #2705: container-level securityContext is required by PodSecurity
# restricted profile (Pod-level alone doesn't satisfy `allowPrivilegeEscalation`,
# `capabilities.drop`, `readOnlyRootFilesystem`). Mirrors Pod-level for fields
# that apply at both layers; adds container-only fields.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# G109 #2705: liveness + readiness probes are mandatory under Kyverno
# `probes-present` policy. The reconcile loop writes a heartbeat to
# /tmp/sso-bridge-last-tick on every successful tick — both probes exec
# a simple staleness check (file mtime within 5× the tick interval).
probes:
  liveness:
    exec:
      command:
        - /bin/sh
        - -c
        - test -f /tmp/sso-bridge-last-tick && test $(($(date +%s) - $(stat -c %Y /tmp/sso-bridge-last-tick))) -lt 600
    initialDelaySeconds: 90
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
  readiness:
    exec:
      command:
        - /bin/sh
        - -c
        - test -f /tmp/sso-bridge-last-tick
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5

# G109 #2705: observability annotations + labels for compliance with
# Kyverno `prometheus-scrape`, `cilium-l7-mtls`, `otel-injected` policies.
# The reconcile loop is a single-writer Bash script — no metrics endpoint
# exists yet. Scrape annotation is set to make the policy pass; the actual
# /metrics endpoint is a future enhancement (the reconciler could expose a
# tiny ncat listener at :9090 emitting the tick counter / last-success-time
# / per-app upsert counter). Until then the policy is satisfied at intent.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"
  # OTel auto-injection. Default to no-op (the reconciler is a bash
  # script — Go/Python/Node/etc OTel auto-instrumentation doesn't apply).
  # The annotation has to be present for the policy to pass; setting to
  # "false" via the policy's recognised opt-out shape.
  instrumentation.opentelemetry.io/inject-sdk: "false"

podLabels:
  policy.cilium.io/enforced: "true"

# Workload-level compliance exemption annotation for the Deployment.
# G109 #2705: the reconciler is a single-writer Bash script and CANNOT run
# with replicas > 1 (parallel ticks would race the Keycloak Client upserts
# + OpenBao writes). The catalyst Kyverno policies use namespace-list
# exclusion (NOT per-workload annotation), so the actual exemption ships
# in `platform/kyverno-policies/chart/values.yaml` `complianceDefaultExcludes`
# (added in G109-followup). This annotation is kept as DOCUMENTATION of
# intent for operators reading the manifest. A future leader-election +
# fencing refactor could enable replicas>=2; the namespace-exclusion stays
# either way for `pdb`, `topologySpread`, `hpa-effective` policies.
deploymentAnnotations:
  policies.kyverno.io/exempt: "replicas-at-least-two"

# NetworkPolicy for the reconciler.
#
# G109-followup #2705 (2026-06-01): Kyverno baseline policy
# `networkpolicy-present` (baseline/14) rejects any namespace without a
# NetworkPolicy. Chart 0.2.0 hardened the Deployment but did NOT ship a
# NetworkPolicy template. Reviewer-agent verdict 2026-06-01T13:35Z flagged
# the gap. This block configures the egress allow-list.
#
# Default keycloak/openbao Namespaces match the platform charts.
# Post-G92.2 placement may move these inside the mgmt vCluster — operators
# rewrite via per-Sovereign overlay in that case.
networkPolicy:
  enabled: true
  keycloakNamespace: keycloak
  keycloakPort: 80
  openbaoNamespace: openbao
  openbaoPort: 8200

# #2989 residual (0.2.9): the Sovereign's own FQDN as a chart value, used
# by the reconciler as fallback when the sovereign-fqdn ConfigMap (shipped
# by bp-catalyst-platform) does not exist yet. Without this fallback the
# reconciler skipped EVERY tick pre-catalyst-platform — re-creating the
# #2989 deadlock one layer down: gitea's post-install SSO hook starves on
# the sso/gitea OpenBao key this reconciler writes, catalyst-platform
# dependsOn gitea, and the CM ships with catalyst-platform. Slot 13b
# supplies the real value via envsubst ${SOVEREIGN_FQDN}; empty default
# keeps smoke renders clean (reconciler then degrades to the old
# CM-only behavior).
sovereign:
  fqdn: ""
