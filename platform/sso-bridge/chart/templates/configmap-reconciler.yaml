{{- /*
Reconcile loop script.

Single-binary bash that runs inside a bitnamilegacy/kubectl --request-timeout=15s image. Loops
every {reconcile.intervalSeconds}s. Each tick:

  1. Read OPERATOR_EMAIL from sovereign-fqdn ConfigMap (or
     values.operator.emailOverride if set).
  2. Mint Keycloak admin token via client_credentials grant against the
     catalyst-api-server SA client (catalyst-kc-sa-credentials Secret).
  3. Resolve OpenBao token via Kubernetes-SA login (audience = openbao).
  4. List HelmReleases cluster-wide; filter to those with
     `.spec.values.sso.enabled == true`.
  5. For each app:
     a. Compute clientId, redirectURIs, postLogoutURIs from
        chart values.
     b. Read existing Keycloak Client by clientId. If present, PUT updated
        Client object (redirectURIs / mappers may have changed). If
        absent, POST new Client with a randomly-minted 32-char secret.
     c. Resolve the client_secret to use for OpenBao storage:
        - Existing Client: KC always returns the stored secret; reuse it
          (Keycloak is the source of truth for SECRET, OpenBao is the
          distribution channel).
        - New Client: KC returned the secret we POSTed; that's the value.
     d. PUT into OpenBao at `secret/data/sso/<clientId>` (KV v2 path).
     e. Apply ExternalSecret CR in the HR's namespace:
        - Name: <clientId>-sso-oidc-credentials
        - Refresh: 1h
        - Target Secret name: <clientId>-sso-oidc-credentials
        - Data keys: client_id, client_secret, issuer_url, authorize_url,
          token_url, userinfo_url, redirect_uri.
     f. Resolve operator user by email in sovereign realm; if not present
        log warning (operator may sign in later via realm self-reg flow
        which seeds the User on first OIDC redirect).
     g. Ensure operator user has client-role 'admin' on this Client. If
        the role doesn't exist on the Client yet, create it (POST
        client-roles); then POST role-mapping.
  6. List ExternalSecret CRs labelled `bp-sso-bridge.openova.io/managed=true`
     and not matched by any current sso.enabled=true HR; delete those
     (cleanup on uninstall).

All HTTP calls retry once on transient 5xx. Hard-fail on 4xx other than
404 (404 on GET is expected for new Clients).

Idempotency:
  - Client UPSERT: clientId is the natural key; PUT overwrites.
  - OpenBao PUT: KV v2 versions data, last write wins.
  - ExternalSecret: kubectl --request-timeout=15s apply -f.
  - Role mapping: POST is idempotent on (user, client, role) — 409
    means already mapped, swallow.

Caveat (documented as a TBD in the issue):
  - In per-organization Keycloak topology (SECURITY.md §6.1) the realm
    name is `<orgSlug>` not `sovereign`. v0.1.0 ships shared-sovereign
    only (default for the hw86 debug env). A follow-up will resolve realm
    name from the Sovereign CRD `spec.keycloakTopology` + the HR's owning
    Organization label.
*/ -}}
{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-reconciler
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-sso-bridge
data:
  reconcile.sh: |
    #!/usr/bin/env bash
    # bp-sso-bridge reconcile loop (G91.1 #2652).
    # See chart Chart.yaml description for the contract.
    set -uo pipefail

    # 0.2.13 (hw91 ROOT CAUSE of every reconciler kubectl failure on this
    # prov): kubectl fell back to http://localhost:8080 — in-cluster
    # config was not engaging, so EVERY kubectl since the framework
    # shipped returned empty/refused here ("couldn't get current server
    # API group list ... localhost:8080"), masked as "CM missing" warns
    # and discovered-0 ticks by 2>/dev/null. Stop depending on env
    # injection entirely: synthesize an explicit kubeconfig from the
    # mounted ServiceAccount (token + CA + namespace are always present
    # — openbao_login already reads the same mount) and export it.
    # Correct in all worlds; /tmp is the chart's writable emptyDir.
    SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
    export KUBECONFIG=/tmp/sso-bridge-kubeconfig
    KAPI="https://${KUBERNETES_SERVICE_HOST:-kubernetes.default.svc}:${KUBERNETES_SERVICE_PORT:-443}"
    kubectl config set-cluster in-cluster \
      --server="${KAPI}" \
      --certificate-authority="${SA_DIR}/ca.crt" >/dev/null
    kubectl config set-credentials sa \
      --token="$(cat "${SA_DIR}/token")" >/dev/null
    kubectl config set-context in-cluster --cluster=in-cluster --user=sa \
      --namespace="$(cat "${SA_DIR}/namespace")" >/dev/null
    kubectl config use-context in-cluster >/dev/null
    kubectl version --request-timeout=10s >/dev/null 2>&1 \
      && echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) | kubeconfig bootstrap OK (server=${KAPI})" \
      || echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) | WARN: kubeconfig bootstrap probe failed (server=${KAPI}) — ticks will retry" >&2

    : "${KC_REALM:?KC_REALM must be set}"
    # 0.2.23 (#4437): KC_ADDR / KC_SA_CLIENT_ID / KC_SA_CLIENT_SECRET are NO
    # LONGER hard-required at boot — they are a boot-time secretKeyRef env
    # snapshot that NEVER hot-reloads when the reflected
    # catalyst-kc-sa-credentials Secret changes (the #4325 de-vcluster
    # addr correction was the live trap: the pod kept curling the dead
    # `keycloak-x-keycloak-x-mgmt-vcluster.mgmt.svc` host forever). The new
    # refresh_kc_credentials() re-reads the LIVE Secret at the start of
    # every tick, so the boot snapshot may be empty/stale; default to ""
    # under `set -u` and let the per-tick refresh populate them.
    KC_ADDR="${KC_ADDR:-}"
    KC_SA_CLIENT_ID="${KC_SA_CLIENT_ID:-}"
    KC_SA_CLIENT_SECRET="${KC_SA_CLIENT_SECRET:-}"
    : "${OPENBAO_ADDR:?OPENBAO_ADDR must be set}"
    : "${OPENBAO_KV_MOUNT:?OPENBAO_KV_MOUNT must be set}"
    : "${OPENBAO_K8S_AUTH_PATH:?OPENBAO_K8S_AUTH_PATH must be set}"
    : "${OPENBAO_K8S_AUTH_ROLE:?OPENBAO_K8S_AUTH_ROLE must be set}"
    : "${INTERVAL_SECONDS:?INTERVAL_SECONDS must be set}"
    : "${TIMEOUT_SECONDS:?TIMEOUT_SECONDS must be set}"
    : "${SOVEREIGN_FQDN_CM_NS:?SOVEREIGN_FQDN_CM_NS must be set}"
    : "${SOVEREIGN_FQDN_CM_NAME:?SOVEREIGN_FQDN_CM_NAME must be set}"
    : "${SOVEREIGN_FQDN_ORG_EMAIL_KEY:?SOVEREIGN_FQDN_ORG_EMAIL_KEY must be set}"
    : "${SOVEREIGN_FQDN_SOVEREIGN_FQDN_KEY:?SOVEREIGN_FQDN_SOVEREIGN_FQDN_KEY must be set}"

    OPERATOR_EMAIL_OVERRIDE="${OPERATOR_EMAIL_OVERRIDE:-}"

    # 0.2.23 (#4437): the keycloak credentials Secret names + the namespace
    # this reconciler runs in, so refresh_kc_credentials() can re-read the
    # LIVE Secret each tick (the KC_ADDR/KC_SA_* env vars below are only a
    # BOOT-TIME snapshot — see the function docstring). Safe fallbacks so an
    # older deployment.yaml (or a smoke render) still starts.
    KC_CREDENTIALS_SECRET_NAME="${KC_CREDENTIALS_SECRET_NAME:-catalyst-kc-sa-credentials}"
    KC_MASTER_CREDENTIALS_SECRET_NAME="${KC_MASTER_CREDENTIALS_SECRET_NAME:-catalyst-kc-master-admin-credentials}"
    RECONCILER_NAMESPACE="${RECONCILER_NAMESPACE:-$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo sso-bridge)}"

    log() { printf '%s | %s\n' "$(date -u +%FT%TZ)" "$*"; }
    warn() { log "WARN: $*" >&2; }
    err() { log "ERR : $*" >&2; }

    # ─── helpers ────────────────────────────────────────────────────────
    curl_kc() {
      # $1 = method, $2 = path-after-realm, $3 = body file (or empty)
      local method="$1" path="$2" body="${3:-}"
      local url="${KC_ADDR%/}/admin/realms/${KC_REALM}${path}"
      if [ -n "${body}" ]; then
        curl --max-time 20 --connect-timeout 7 -fsS -w '\n%{http_code}' -X "${method}" \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${body}" \
          "${url}" || true
      else
        curl --max-time 20 --connect-timeout 7 -fsS -w '\n%{http_code}' -X "${method}" \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${url}" || true
      fi
    }

    # 0.2.12 (hw91): every kubectl from this pod intermittently stalls
    # ~150s and large responses die mid-stream (node-local API-path
    # degradation, hw90-family). With --request-timeout=15s those become
    # fast failures; this wrapper retries 3x with a 2s pause so an
    # intermittently-healthy path still completes the tick. Usage:
    # k_retry <kubectl args...> — emits stdout of the first success.
    k_retry() {
      local attempt out
      for attempt in 1 2 3; do
        if out="$(kubectl --request-timeout=15s "$@" 2>/dev/null)" && [ -n "${out}" ]; then
          printf '%s' "${out}"
          return 0
        fi
        sleep 2
      done
      return 1
    }

    # 0.2.23 (#4437): re-read the keycloak credentials from the LIVE
    # catalyst-kc-sa-credentials / catalyst-kc-master-admin-credentials
    # Secrets at the start of every tick, overriding the boot-time
    # secretKeyRef env snapshot.
    #
    # WHY this is the permanent fix (live RCA, omantel.biz dep
    # 4635277cae4ffed9, 2026-06-26): #4325/#3642 de-vclustered the mgmt
    # plane, re-homing keycloak from the `mgmt` vCluster (syncer-mangled
    # Service `keycloak-x-keycloak-x-mgmt-vcluster.mgmt.svc`) back into the
    # native host ns `keycloak` (`keycloak.keycloak.svc`). bp-keycloak
    # re-emitted the CORRECTED `addr` into catalyst-kc-sa-credentials — but
    # KC_ADDR is consumed as an ENV VAR via secretKeyRef, and env-var
    # secretKeyRef values are snapshotted at Pod start and NEVER
    # propagate when the Secret content changes (only VOLUME-mounted
    # secrets hot-reload). The long-lived reconciler Pod therefore kept
    # curling the DEAD syncer-mangled host (`Could not resolve host` ->
    # `failed to mint Keycloak admin token` -> `skipping tick`), so the
    # OpenBao `sso/<app>` bundles (grafana/harbor/openbao/gitea/...) were
    # NEVER written -> every chart-side ExternalSecret reported
    # `SecretSyncedError: Secret does not exist` -> the *-sso-oidc-
    # credentials Secret never materialised -> the app Pod wedged at
    # CreateContainerConfigError -> 503. Re-reading the Secret each tick
    # makes the reconciler pick up any reflected addr/secret drift within
    # one interval, self-healing by construction (matches the idempotent-
    # tick design) with ZERO pod roll. Sibling of the #4344 keycloak
    # admin-password-regen drift (same secretKeyRef-snapshot trap on the
    # SA client-secret).
    refresh_kc_credentials() {
      local sec addr cid csec
      sec="$(k_retry get secret "${KC_CREDENTIALS_SECRET_NAME}" -n "${RECONCILER_NAMESPACE}" -o json)" || {
        warn "refresh_kc_credentials: could not read Secret ${RECONCILER_NAMESPACE}/${KC_CREDENTIALS_SECRET_NAME} (using boot env snapshot)"
        return 0
      }
      addr="$(printf '%s' "${sec}" | jq -r '.data.addr            // "" | @base64d')"
      cid="$(printf '%s'  "${sec}" | jq -r '.data["client-id"]    // "" | @base64d')"
      csec="$(printf '%s' "${sec}" | jq -r '.data["client-secret"]// "" | @base64d')"
      # Only override a field when the live Secret actually carries it, so a
      # transiently-empty reflected key never blanks a working value.
      [ -n "${addr}" ] && {
        if [ "${addr}" != "${KC_ADDR}" ]; then
          log "refresh_kc_credentials: KC_ADDR drift detected (was '${KC_ADDR:-<empty>}' -> '${addr}')"
        fi
        KC_ADDR="${addr}"
      }
      [ -n "${cid}" ]  && KC_SA_CLIENT_ID="${cid}"
      [ -n "${csec}" ] && KC_SA_CLIENT_SECRET="${csec}"

      # Master-realm admin creds (provision_org_realm). Optional Secret —
      # absent until reflector mirrors bp-keycloak's catalyst-kc-master-
      # admin-credentials; tolerate NotFound silently (same as the boot
      # env's `optional: true`).
      local msec
      msec="$(k_retry get secret "${KC_MASTER_CREDENTIALS_SECRET_NAME}" -n "${RECONCILER_NAMESPACE}" -o json)" || return 0
      local mrealm muser mpass
      mrealm="$(printf '%s' "${msec}" | jq -r '.data["master-realm"]              // "" | @base64d')"
      muser="$(printf '%s'  "${msec}" | jq -r '.data["master-realm-admin-user"]   // "" | @base64d')"
      mpass="$(printf '%s'  "${msec}" | jq -r '.data["master-realm-admin-password"]// "" | @base64d')"
      [ -n "${mrealm}" ] && KC_MASTER_REALM="${mrealm}"
      [ -n "${muser}" ]  && KC_MASTER_ADMIN_USER="${muser}"
      [ -n "${mpass}" ]  && KC_MASTER_ADMIN_PASSWORD="${mpass}"
      return 0
    }

    mint_kc_token() {
      if [ -z "${KC_ADDR}" ] || [ -z "${KC_SA_CLIENT_ID}" ] || [ -z "${KC_SA_CLIENT_SECRET}" ]; then
        err "keycloak credentials unresolved (KC_ADDR/KC_SA_CLIENT_ID/KC_SA_CLIENT_SECRET empty) — reflector may not have mirrored ${KC_CREDENTIALS_SECRET_NAME} yet"
        return 1
      fi
      KC_ADMIN_TOKEN="$(curl --max-time 20 --connect-timeout 7 -fsS \
        -X POST "${KC_ADDR%/}/realms/${KC_REALM}/protocol/openid-connect/token" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "grant_type=client_credentials" \
        -d "client_id=${KC_SA_CLIENT_ID}" \
        -d "client_secret=${KC_SA_CLIENT_SECRET}" \
        | jq -r '.access_token // empty')"
      if [ -z "${KC_ADMIN_TOKEN}" ]; then
        err "failed to mint Keycloak admin token"
        return 1
      fi
    }

    # G117.5-followup #2914 (2026-06-03): mint a MASTER-realm token via
    # grant_type=password against /realms/master/...token using the
    # bitnami-generated admin user credentials. Called by
    # provision_org_realm before any POST /admin/realms. Returns 1 if
    # any of the master credentials is unset (defensive: chart-side stub
    # may be empty before reflector back-fills from bp-keycloak 1.4.18+).
    # The admin-cli client is bootstrap-created by KC at master realm
    # init and has directAccessGrantsEnabled=true by default, so no
    # extra client config is required. Uses scope=openid to fetch a
    # minimal token (we only need realms admin permission).
    mint_kc_master_admin_token() {
      if [ -z "${KC_MASTER_REALM:-}" ] || [ -z "${KC_MASTER_ADMIN_USER:-}" ] || [ -z "${KC_MASTER_ADMIN_PASSWORD:-}" ]; then
        warn "KC master admin credentials unset (KC_MASTER_REALM/USER/PASSWORD) — reflector may not have mirrored bp-keycloak's catalyst-kc-master-admin-credentials yet"
        return 1
      fi
      KC_MASTER_ADMIN_TOKEN="$(curl --max-time 20 --connect-timeout 7 -fsS \
        -X POST "${KC_ADDR%/}/realms/${KC_MASTER_REALM}/protocol/openid-connect/token" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "grant_type=password" \
        -d "client_id=admin-cli" \
        -d "username=${KC_MASTER_ADMIN_USER}" \
        -d "password=${KC_MASTER_ADMIN_PASSWORD}" \
        | jq -r '.access_token // empty')"
      if [ -z "${KC_MASTER_ADMIN_TOKEN}" ]; then
        err "failed to mint Keycloak master admin token"
        return 1
      fi
    }

    openbao_login() {
      local sa_token
      sa_token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
      OPENBAO_TOKEN="$(curl --max-time 20 --connect-timeout 7 -fsS \
        -X POST "${OPENBAO_ADDR%/}/v1/auth/${OPENBAO_K8S_AUTH_PATH}/login" \
        -H "Content-Type: application/json" \
        -d "$(jq -nc --arg role "${OPENBAO_K8S_AUTH_ROLE}" --arg jwt "${sa_token}" '{role:$role, jwt:$jwt}')" \
        | jq -r '.auth.client_token // empty')"
      if [ -z "${OPENBAO_TOKEN}" ]; then
        err "failed to login to OpenBao"
        return 1
      fi
    }

    openbao_put() {
      # $1 = path (under kv mount), $2 = JSON string
      local path="$1" data="$2"
      local url="${OPENBAO_ADDR%/}/v1/${OPENBAO_KV_MOUNT}/data/${path}"
      local body
      body="$(jq -nc --argjson d "${data}" '{data:$d}')"
      local resp
      resp="$(curl --max-time 20 --connect-timeout 7 -fsS -w '\n%{http_code}' -X POST "${url}" \
        -H "X-Vault-Token: ${OPENBAO_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${body}")"
      local code
      code="$(printf '%s' "${resp}" | tail -n1)"
      if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
        warn "OpenBao PUT ${path} failed: code=${code} body=$(printf '%s' "${resp}" | head -n1)"
        return 1
      fi
    }

    operator_email() {
      if [ -n "${OPERATOR_EMAIL_OVERRIDE}" ]; then
        printf '%s' "${OPERATOR_EMAIL_OVERRIDE}"
        return 0
      fi
      kubectl --request-timeout=15s get cm "${SOVEREIGN_FQDN_CM_NAME}" -n "${SOVEREIGN_FQDN_CM_NS}" \
        -o jsonpath="{.data.${SOVEREIGN_FQDN_ORG_EMAIL_KEY}}" 2>/dev/null || true
    }

    sovereign_fqdn() {
      # #2989 residual (hw91 2026-06-04, 0.2.9): the CM ships with
      # bp-catalyst-platform, but gitea's post-install SSO hook needs the
      # sso/gitea OpenBao key THIS tick writes — and catalyst-platform
      # dependsOn gitea. Reading ONLY the CM re-created the #2989
      # deadlock one layer down (reconciler skipped every tick for 3h20m
      # on hw91 while gitea's hook starved). Fall back to the chart-value
      # FQDN (slot 13b envsubsts ${SOVEREIGN_FQDN}) so Tier-1 writes run
      # pre-catalyst-platform; only the orgEmail grant stays deferred.
      local v
      v="$(kubectl --request-timeout=15s get cm "${SOVEREIGN_FQDN_CM_NAME}" -n "${SOVEREIGN_FQDN_CM_NS}" \
        -o jsonpath="{.data.${SOVEREIGN_FQDN_SOVEREIGN_FQDN_KEY}}" 2>/dev/null || true)"
      if [ -n "${v}" ]; then printf '%s' "${v}"; else printf '%s' "${SOVEREIGN_FQDN_FALLBACK:-}"; fi
    }

    upsert_client() {
      # $1 = clientId, $2 = sovereignFQDN
      local cid="$1" fqdn="$2"
      local app_host="${cid}.${fqdn}"
      local issuer="https://auth.${fqdn}/realms/${KC_REALM}"

      # Lookup existing.
      local existing
      existing="$(curl --max-time 20 --connect-timeout 7 -fsS \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients?clientId=${cid}" \
        | jq -r '.[0] // empty')"

      local secret kc_id
      local template_path="/tmp/${cid}-client.json"
      # Render JSON via jq to avoid heredoc indentation collisions with the
      # outer YAML literal block (any heredoc body line with fewer leading
      # spaces than the block's indent would terminate the block early).
      jq -n \
        --arg cid    "${cid}" \
        --arg host   "${app_host}" \
        --arg realm  "${KC_REALM}" \
        '{
          clientId: $cid,
          name: ($cid + " (auto by bp-sso-bridge)"),
          description: ("OIDC client for " + $cid + ", auto-provisioned per SECURITY.md §6.3."),
          enabled: true,
          publicClient: false,
          standardFlowEnabled: true,
          directAccessGrantsEnabled: false,
          implicitFlowEnabled: false,
          serviceAccountsEnabled: false,
          redirectUris: [
            ("https://" + $host + "/oauth2/callback"),
            ("https://" + $host + "/oauth/redirect"),
            ("https://" + $host + "/login/oauth/callback"),
            ("https://" + $host + "/c/oidc/login_oidc"),
            ("https://" + $host + "/auth/realms/" + $realm + "/broker/" + $cid + "/endpoint"),
            ("https://" + $host + "/user/oauth2/" + $cid + "/callback"),
            ("https://" + $host + "/*")
          ],
          webOrigins: [
            ("https://" + $host)
          ],
          defaultClientScopes: ["web-origins","acr","profile","roles","email","groups","org"],
          optionalClientScopes: ["address","phone","offline_access","microprofile-jwt"],
          attributes: {
            "pkce.code.challenge.method": "",
            "access.token.lifespan": "900",
            "post.logout.redirect.uris": ("https://" + $host + "/*"),
            "backchannel.logout.url":    ("https://" + $host + "/oauth2/logout")
          }
        }' > "${template_path}"

      if [ -n "${existing}" ]; then
        kc_id="$(printf '%s' "${existing}" | jq -r '.id')"
        secret="$(curl --max-time 20 --connect-timeout 7 -fsS \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients/${kc_id}/client-secret" \
          | jq -r '.value // empty')"
        # PUT update — preserve KC's id, merge in template.
        local updated
        updated="$(jq -s '.[0] * .[1]' "${template_path}" <(printf '%s' "${existing}") )"
        printf '%s' "${updated}" > "${template_path}.updated"
        curl --max-time 20 --connect-timeout 7 -fsS -X PUT \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${template_path}.updated" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients/${kc_id}" >/dev/null || {
          warn "PUT client ${cid} failed"; return 1; }
      else
        # POST new; KC will mint its own secret. We then retrieve it.
        curl --max-time 20 --connect-timeout 7 -fsS -X POST \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${template_path}" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients" >/dev/null || {
          warn "POST client ${cid} failed"; return 1; }
        kc_id="$(curl --max-time 20 --connect-timeout 7 -fsS \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients?clientId=${cid}" \
          | jq -r '.[0].id')"
        secret="$(curl --max-time 20 --connect-timeout 7 -fsS \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients/${kc_id}/client-secret" \
          | jq -r '.value // empty')"
        log "created Keycloak Client ${cid} (kc-id=${kc_id})"
      fi

      printf '%s\n' "${secret}" > "/tmp/${cid}.secret"
      printf '%s\n' "${kc_id}" > "/tmp/${cid}.kc-id"
      printf '%s\n' "${issuer}" > "/tmp/${cid}.issuer"
    }

    # #3374 Layer-C (2026-06-17): grant_operator_admin + grant_operator_realm_roles
    # DELETED. They were the dead admin-by-default theater the founder
    # flagged (#3685 / #3374 §3-c):
    #
    #   - grant_operator_admin minted a per-Client `admin` role that NO app
    #     reads — every app keys admin on the `groups` claim
    #     (`sovereign-admins`), so the per-Client role was pure orphaned
    #     overhead. On hw150 with orgEmail="" it logged "skipping admin
    #     grant" every 60s tick and NEVER granted anything.
    #   - grant_operator_realm_roles granted the `catalyst-admin` realm role
    #     per-email — now SUPERSEDED by the realm-import group composite:
    #     `/sovereign-admins` carries `realmRoles: ["catalyst-admin"]`
    #     (configmap-sovereign-realm.yaml), so ANY member of the group gets
    #     catalyst-admin generically, conferred at realm import + reconciled
    #     by keycloak-config-cli — no per-email grant, no dependence on the
    #     empty `orgEmail` ConfigMap key.
    #
    # ONE admin authority remains: membership in /sovereign-admins. The
    # reconciler's job is now purely client-upsert + secret publication.

    emit_external_secret() {
      # $1 = clientId, $2 = HR namespace, $3 = skip-K8s-ExternalSecret (bool)
      local cid="$1" hrns="$2" skip_es="${3:-false}"
      local secret
      secret="$(cat "/tmp/${cid}.secret")"
      local issuer
      issuer="$(cat "/tmp/${cid}.issuer")"

      # Push client_secret + scalar bundle into OpenBao
      local bundle
      bundle="$(jq -nc \
        --arg cid "${cid}" \
        --arg secret "${secret}" \
        --arg issuer "${issuer}" \
        '{client_id:$cid, client_secret:$secret, issuer_url:$issuer,
          authorize_url:($issuer+"/protocol/openid-connect/auth"),
          token_url:($issuer+"/protocol/openid-connect/token"),
          userinfo_url:($issuer+"/protocol/openid-connect/userinfo"),
          end_session_url:($issuer+"/protocol/openid-connect/logout")}')"
      openbao_put "sso/${cid}" "${bundle}" || return 1

      # #3374 (2026-06-14) — `sso.skipExternalSecret: true` opt-out. Some
      # apps consume their OIDC secret as DIRECT env vars (grafana's
      # `envFromSecret`) and therefore need keys named after the app's
      # env-override contract (GF_AUTH_GENERIC_OAUTH_* / GF_SERVER_ROOT_URL),
      # NOT the raw `client_id`/`client_secret`/`authorize_url` scalars this
      # reconciler projects. Those apps ship their OWN chart-side
      # ExternalSecret with a `target.template` that performs the rename +
      # root_url derivation, reading the SAME OpenBao `sso/<cid>` bundle we
      # just wrote. For them we must persist the bundle to OpenBao (done
      # above) but NOT apply a raw-key K8s ExternalSecret of the same name —
      # it would fight the chart's transformed ES for ownership of
      # `<cid>-sso-oidc-credentials` and a raw-key win leaves the app's env
      # unconfigured (empty client_id, redirect_uri → https://localhost/).
      # Default false → every other app keeps the raw-key projection.
      if [ "${skip_es}" = "true" ]; then
        log "skip K8s ExternalSecret for ${cid} (sso.skipExternalSecret=true; OpenBao bundle written, chart-side ES owns the Secret)"
        return 0
      fi

      # Apply ExternalSecret CR in HR's namespace.
      # Render via printf with embedded newlines so every line has a leading
      # space (the YAML literal block requires consistent indent — heredocs
      # with column-0 body lines silently terminate the block).
      printf '%s\n' \
        "apiVersion: external-secrets.io/v1beta1" \
        "kind: ExternalSecret" \
        "metadata:" \
        "  name: ${cid}-sso-oidc-credentials" \
        "  namespace: ${hrns}" \
        "  labels:" \
        "    catalyst.openova.io/blueprint: bp-sso-bridge" \
        "    bp-sso-bridge.openova.io/managed: \"true\"" \
        "    bp-sso-bridge.openova.io/client-id: \"${cid}\"" \
        "spec:" \
        "  refreshInterval: 1h" \
        "  secretStoreRef:" \
        "    name: vault-region1" \
        "    kind: ClusterSecretStore" \
        "  target:" \
        "    name: ${cid}-sso-oidc-credentials" \
        "    creationPolicy: Owner" \
        "  dataFrom:" \
        "    - extract:" \
        "        key: sso/${cid}" \
        | kubectl --request-timeout=15s apply -f - >/dev/null
    }

    reconcile_one() {
      # $1 = HR JSON, $2 = operator email, $3 = sovereign fqdn
      local hr="$1" op_email="$2" fqdn="$3"
      local name ns
      name="$(printf '%s' "${hr}" | jq -r '.metadata.name')"
      # #3374 (2026-06-14) — the ExternalSecret MUST land in the namespace
      # where the app POD actually runs, which is the HR's `targetNamespace`
      # when set (every Tier-1 SSO slot installs the HR in `flux-system` but
      # targets the app's own ns: bp-grafana → grafana, bp-harbor → harbor,
      # bp-openbao → openbao, bp-gitea → gitea, bp-powerdns-admin →
      # powerdns-admin). The pre-fix code wrote the ES into the HR's OWN
      # namespace (.metadata.namespace = flux-system), so the projected
      # `<cid>-sso-oidc-credentials` Secret materialised in flux-system —
      # invisible to the app Pod's `envFromSecret`. harbor/openbao/gitea were
      # masked because their CHART also ships an ES that renders into the
      # targetNamespace; grafana's chart ES is omitted at install time by the
      # `.Capabilities` ESO-CRD-race guard (helm-controller never re-evaluates
      # the install-time capability snapshot on drift), so the ONLY grafana ES
      # was this one in flux-system → grafana Pod stuck 2/3
      # CreateContainerConfigError → route 503 "no healthy upstream". Targeting
      # the runtime namespace fixes grafana directly and makes the projection
      # correct for every app regardless of whether its chart-side ES rendered.
      # Falls back to .metadata.namespace when targetNamespace is unset
      # (byte-identical to the old behaviour for an in-place HR).
      ns="$(printf '%s' "${hr}" | jq -r '.spec.targetNamespace // .metadata.namespace')"

      # The clientId is the HR name (strip a leading "bp-" prefix if present
      # — bp-gitea is the HR, but the natural OIDC clientId is `gitea`).
      local cid="${name#bp-}"

      # G91.catalyst-console-admin-self-grant (#2659) — opt-out of
      # per-Client upsert. Apps that ship their own pre-existing Keycloak
      # Client via realm-import (e.g. `catalyst-ui` in the sovereign realm
      # JSON) can declare `.spec.values.sso.skipClientUpsert: true` so
      # bp-sso-bridge skips both upsert_client and emit_external_secret
      # (no client_secret to materialise).
      #
      # #3374 Layer-C (2026-06-17): the former per-HR
      # `sso.realmRolesGranted` -> grant_operator_realm_roles path is GONE.
      # Admin is now conferred ONLY by /sovereign-admins group membership
      # (the group composites catalyst-admin at realm import) — no per-app
      # realm-role grant, no dependence on the operator email. An app that
      # set skipClientUpsert=true purely to ride the realm-role grant (i.e.
      # bp-catalyst-platform) is now a no-op here and that is CORRECT: its
      # operator gets catalyst-admin from the group, not from this loop.
      local skip_upsert
      skip_upsert="$(printf '%s' "${hr}" | jq -r '.spec.values.sso.skipClientUpsert // false')"

      # #3374 — apps whose chart ships its own transformed ExternalSecret
      # (grafana: GF_AUTH_GENERIC_OAUTH_* env-override keys + GF_SERVER_ROOT_URL)
      # set sso.skipExternalSecret=true so this reconciler writes the OpenBao
      # bundle but does NOT apply a colliding raw-key K8s ExternalSecret.
      local skip_es
      skip_es="$(printf '%s' "${hr}" | jq -r '.spec.values.sso.skipExternalSecret // false')"

      log "reconcile ${name} (ns=${ns} clientId=${cid} skipUpsert=${skip_upsert} skipES=${skip_es})"

      if [ "${skip_upsert}" != "true" ]; then
        upsert_client "${cid}" "${fqdn}" || { err "upsert ${cid} failed"; return 1; }
        emit_external_secret "${cid}" "${ns}" "${skip_es}" || { err "emit-es ${cid} failed"; return 1; }
      else
        log "skipping client upsert + ExternalSecret for ${cid} (sso.skipClientUpsert=true)"
      fi
    }

    # ─── G117.5 W2.C4 #2744 — per-Org realm provisioning ─────────────────
    #
    # Tier-3 SSO topology: bp-keycloak chart renders one ConfigMap per
    # Org from values.tenantRealms[] (template configmap-per-org-realms.yaml),
    # each carrying:
    #   - label catalyst.openova.io/per-org-realm=true
    #   - label catalyst.openova.io/org-slug=<slug>
    #   - data.org-realm.json = complete realm-import JSON whose
    #     identityProviders[sovereign-broker] has clientId=<slug>-broker
    #     and a deterministic clientSecret derived chart-side from
    #     Release.Name|Release.Namespace|<slug>.
    #
    # On EVERY tick this function reads every per-Org ConfigMap and:
    #   1. POSTs /admin/realms with the realm JSON (KC 409 = already
    #      exists → swallow; first-tick 201 = created). The realm JSON
    #      lives in the ConfigMap so it's the source of truth — any
    #      operator who edits tenantRealms[] in values.yaml re-renders
    #      the ConfigMap and we'd re-import the modified realm.
    #      Today KC's POST /admin/realms is one-shot (refuses re-import
    #      to an existing realm), so structural changes after first
    #      import require operator-side manual reconcile — flagged as
    #      a follow-up TBD in memory feedback_g117_per_org_realm_2hop_pitfalls.md
    #   2. POSTs /admin/realms/sovereign/clients with a `<slug>-broker`
    #      Client carrying the same clientSecret the Org realm's
    #      sovereign-broker IdP expects. Idempotent: PUT the existing
    #      Client if it already exists (clientId is the natural key).
    #   3. PUTs the same secret into OpenBao at
    #      kv/org/<slug>/keycloak/sovereign-broker-secret so any
    #      operator-side automation can read it back.
    #
    # Cross-Org isolation guarantee: each per-Org realm issues id_tokens
    # with iss=https://auth.<sov-fqdn>/realms/<slug> so Org-A id_tokens
    # are rejected at the OIDC discovery layer by Org-B applications
    # whose configured issuer is different. The sovereign realm sits
    # one hop UP — apps in Org-A never see the sovereign-realm session
    # token directly.

    provision_org_realm() {
      # $1 = ConfigMap JSON (single item)
      local cm_json="$1"
      local slug realm_json broker_client_id
      slug="$(printf '%s' "${cm_json}" | jq -r '.metadata.labels["catalyst.openova.io/org-slug"] // empty')"
      if [ -z "${slug}" ]; then
        warn "per-org-realm ConfigMap missing org-slug label; skipping"
        return 0
      fi
      realm_json="$(printf '%s' "${cm_json}" | jq -r '.data["org-realm.json"] // empty')"
      if [ -z "${realm_json}" ]; then
        warn "per-org-realm ConfigMap for ${slug} missing data.org-realm.json; skipping"
        return 0
      fi

      # Extract the broker client secret from the realm JSON. The
      # bp-keycloak chart bakes the same deterministic value into BOTH
      # the IdP config (here) AND must register the matching Client in
      # the sovereign realm (we do that below). KC's POST /admin/realms
      # accepts the secret in identityProviders[].config.clientSecret;
      # the matching sovereign-realm Client gets the same value via
      # POST/PUT /admin/realms/sovereign/clients.
      local broker_secret
      broker_secret="$(printf '%s' "${realm_json}" | jq -r '.identityProviders[] | select(.alias=="sovereign-broker") | .config.clientSecret // empty')"
      if [ -z "${broker_secret}" ]; then
        warn "per-org-realm for ${slug} has no sovereign-broker clientSecret; skipping (chart misrender)"
        return 0
      fi

      broker_client_id="${slug}-broker"

      # ── Step 1: ensure the Org realm exists in KC. ──────────────────
      local realm_check
      # G117.5-followup #2914 (2026-06-03): POST /admin/realms is a
      # master-realm operation requiring the `create-realm` role from
      # master.realm-management. The sovereign-realm SA token bound to
      # KC_ADMIN_TOKEN lacks this role (sovereign realm has its own
      # realm-management client, not master's) → KC returns 403 on
      # every realm-creation attempt. Mint a SEPARATE token via
      # grant_type=password against /realms/master/ using the bitnami
      # admin user credentials (mirrored via catalyst-kc-master-admin-
      # credentials Secret from bp-keycloak 1.4.18+). When the master
      # credentials Secret is unfilled (first install before reflector
      # back-fills) the token mint fails gracefully — provision_org_realm
      # returns 1 and the next tick retries once the Secret materialises.
      if ! mint_kc_master_admin_token; then
        warn "per-org-realm[${slug}]: KC master admin token unavailable; skipping (will retry next tick)"
        return 1
      fi
      realm_check="$(curl --max-time 20 --connect-timeout 7 -sS -o /dev/null -w '%{http_code}' \
        -H "Authorization: Bearer ${KC_MASTER_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${slug}" || echo 000)"
      if [ "${realm_check}" = "200" ]; then
        log "per-org-realm[${slug}]: already exists; skipping realm POST"
      else
        local realm_post
        printf '%s' "${realm_json}" > "/tmp/${slug}-realm.json"
        realm_post="$(curl --max-time 20 --connect-timeout 7 -sS -o /dev/null -w '%{http_code}' -X POST \
          -H "Authorization: Bearer ${KC_MASTER_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@/tmp/${slug}-realm.json" \
          "${KC_ADDR%/}/admin/realms" || echo 000)"
        case "${realm_post}" in
          201) log "per-org-realm[${slug}]: realm created (HTTP 201)" ;;
          409) log "per-org-realm[${slug}]: realm already exists (HTTP 409)" ;;
          *)
            warn "per-org-realm[${slug}]: realm POST failed (HTTP ${realm_post})"
            return 1
            ;;
        esac
      fi

      # ── Step 2: ensure the <slug>-broker Client exists in SOVEREIGN realm. ──
      # The Client's redirectUri MUST match KC's broker callback shape:
      # https://auth.<fqdn>/realms/<org-slug>/broker/sovereign-broker/endpoint
      local fqdn
      fqdn="$(sovereign_fqdn)"
      if [ -z "${fqdn}" ]; then
        warn "per-org-realm[${slug}]: sovereign-fqdn unknown; cannot construct broker redirectUri"
        return 1
      fi
      local broker_redirect="https://auth.${fqdn}/realms/${slug}/broker/sovereign-broker/endpoint"

      local existing_broker
      existing_broker="$(curl --max-time 20 --connect-timeout 7 -sS \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients?clientId=${broker_client_id}" \
        | jq -r '.[0] // empty' || echo '')"

      local broker_client_json="/tmp/${slug}-broker-client.json"
      jq -n \
        --arg cid "${broker_client_id}" \
        --arg secret "${broker_secret}" \
        --arg redir "${broker_redirect}" \
        '{
          clientId: $cid,
          name: ($cid + " (auto by bp-sso-bridge for Org-realm federation)"),
          description: "G117.5 W2.C4 sovereign-broker Client. The matching Org realm IdP uses this clientId+secret to federate into the sovereign realm.",
          enabled: true,
          publicClient: false,
          standardFlowEnabled: true,
          directAccessGrantsEnabled: false,
          implicitFlowEnabled: false,
          serviceAccountsEnabled: false,
          secret: $secret,
          redirectUris: [$redir],
          webOrigins: [],
          defaultClientScopes: ["web-origins","acr","profile","roles","email","groups"],
          optionalClientScopes: ["address","phone","offline_access","microprofile-jwt"],
          attributes: {
            "access.token.lifespan": "900"
          }
        }' > "${broker_client_json}"

      if [ -n "${existing_broker}" ]; then
        local kc_id
        kc_id="$(printf '%s' "${existing_broker}" | jq -r '.id')"
        # PUT updates the Client (idempotent). Reuse existing KC id so the
        # PUT lands on the right row.
        local updated
        updated="$(jq -s '.[0] * .[1]' "${broker_client_json}" <(printf '%s' "${existing_broker}"))"
        printf '%s' "${updated}" > "${broker_client_json}.updated"
        # Re-pin the secret so chart-side derivation wins (KC keeps the
        # secret in a separate /client-secret endpoint, but PUT'ing the
        # whole representation with `secret` set updates it server-side).
        curl --max-time 20 --connect-timeout 7 -sS -X PUT \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${broker_client_json}.updated" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients/${kc_id}" -o /dev/null \
          && log "per-org-realm[${slug}]: broker Client updated (kc_id=${kc_id})" \
          || warn "per-org-realm[${slug}]: broker Client PUT failed"
      else
        local broker_post
        broker_post="$(curl --max-time 20 --connect-timeout 7 -sS -o /dev/null -w '%{http_code}' -X POST \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${broker_client_json}" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients" || echo 000)"
        case "${broker_post}" in
          201) log "per-org-realm[${slug}]: broker Client created (HTTP 201)" ;;
          409) log "per-org-realm[${slug}]: broker Client already exists (HTTP 409)" ;;
          *)
            warn "per-org-realm[${slug}]: broker Client POST failed (HTTP ${broker_post})"
            ;;
        esac
      fi

      # ── Step 3: persist broker secret in OpenBao for any operator-side
      #          automation (rotation, audit). Path is namespaced under
      #          the Org slug so cross-Org reads cannot collide.
      local bundle
      bundle="$(jq -nc \
        --arg cid "${broker_client_id}" \
        --arg secret "${broker_secret}" \
        --arg redir "${broker_redirect}" \
        --arg slug "${slug}" \
        '{client_id: $cid, client_secret: $secret, redirect_uri: $redir, org_slug: $slug}')"
      openbao_put "org/${slug}/keycloak/sovereign-broker-secret" "${bundle}" \
        && log "per-org-realm[${slug}]: broker secret persisted to OpenBao kv/org/${slug}/keycloak/sovereign-broker-secret" \
        || warn "per-org-realm[${slug}]: OpenBao PUT failed (non-fatal — KC has the secret already)"
    }

    reconcile_per_org_realms() {
      # List every ConfigMap with label per-org-realm=true (any namespace).
      # bp-keycloak emits them in the keycloak namespace by default but the
      # selector is namespace-agnostic in case of overlay shifts.
      local cms
      cms="$(kubectl --request-timeout=15s get configmaps -A \
        -l 'catalyst.openova.io/per-org-realm=true' \
        -o json 2>/dev/null | jq -c '.items[]?' || true)"
      [ -z "${cms}" ] && return 0
      local count=0
      while IFS= read -r cm; do
        [ -z "${cm}" ] && continue
        provision_org_realm "${cm}" || true
        count=$(( count + 1 ))
      done <<< "${cms}"
      [ "${count}" -gt 0 ] && log "per-org-realm: processed ${count} ConfigMap(s)"
      return 0
    }

    # ─── G117.5c #2801 — Tier-3 AppRegistration ConfigMap watcher ────────
    #
    # The 6 Tier-3 charts (bp-matrix, bp-langfuse, bp-temporal, bp-librechat,
    # bp-openmeter, bp-wordpress-tenant) emit a ConfigMap labelled
    # `sso.openova.io/app-registration=<client-id>` carrying:
    #
    #   - label sso.openova.io/app-registration = <client-id>   (the natural key)
    #   - data.realm        = per-Org KC realm name (== Org slug under G117.6)
    #   - data.client.json  = full KC Client representation (POSTable as-is)
    #
    # Unlike the legacy Tier-1/2 path (which discovers apps via HR-watcher
    # `.spec.values.sso.enabled=true` and mints into the SOVEREIGN realm),
    # Tier-3 apps mint into the PER-ORG realm. The realm name lives in the
    # ConfigMap `data.realm` field — that's the source of truth.
    #
    # This loop runs AFTER reconcile_per_org_realms so the per-Org realms
    # exist by the time we try to POST clients into them (KC returns 404
    # on /admin/realms/<unknown>/clients otherwise).
    #
    # Idempotency:
    #   1. Existing client (looked up by clientId, the natural key): PUT
    #      the merged representation to /admin/realms/<realm>/clients/<id>.
    #      The KC-side client_secret is preserved (KC has its own
    #      /client-secret endpoint we re-read to get the stored value).
    #   2. Absent client: POST to /admin/realms/<realm>/clients; KC mints
    #      a random secret which we then GET via /client-secret.
    #   3. 409 on POST (raced with another reconciler pod, or KC's own
    #      idempotency kicked in) is swallowed and we fall back to PUT.
    #
    # OpenBao path: `sso/<realm>/<client-id>` (under the KV mount).
    # This matches every Tier-3 chart's sso-externalsecret.yaml
    # remoteRef key — verified for bp-matrix, bp-langfuse, bp-temporal,
    # bp-librechat. The realm name is the Org slug (G117 locked-decision
    # #6) so cross-Org reads cannot collide.

    upsert_per_org_client() {
      # $1 = ConfigMap JSON
      local cm_json="$1"
      local cm_name cm_ns cid realm client_json
      cm_name="$(printf '%s' "${cm_json}" | jq -r '.metadata.name // empty')"
      cm_ns="$(printf '%s' "${cm_json}" | jq -r '.metadata.namespace // empty')"
      cid="$(printf '%s' "${cm_json}" | jq -r '.metadata.labels["sso.openova.io/app-registration"] // empty')"
      realm="$(printf '%s' "${cm_json}" | jq -r '.data.realm // empty')"
      client_json="$(printf '%s' "${cm_json}" | jq -r '.data["client.json"] // empty')"

      if [ -z "${cid}" ]; then
        warn "app-registration ConfigMap ${cm_ns}/${cm_name}: missing app-registration label; skipping"
        return 0
      fi
      if [ -z "${realm}" ]; then
        warn "app-registration[${cid}] ${cm_ns}/${cm_name}: missing data.realm; skipping"
        return 0
      fi
      if [ -z "${client_json}" ]; then
        warn "app-registration[${cid}] ${cm_ns}/${cm_name}: missing data.client.json; skipping"
        return 0
      fi

      # Validate realm exists before we try to POST a client into it.
      # KC returns 200 if the realm exists, 404 otherwise. We don't
      # auto-create per-Org realms here — that's reconcile_per_org_realms'
      # job and it runs first. If the realm isn't there yet, skip this
      # tick and wait for the next one (eventual consistency).
      local realm_check
      realm_check="$(curl --max-time 20 --connect-timeout 7 -sS -o /dev/null -w '%{http_code}' \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${realm}" || echo 000)"
      if [ "${realm_check}" != "200" ]; then
        warn "app-registration[${cid}]: per-Org realm '${realm}' not present yet (HTTP ${realm_check}); deferring to next tick"
        return 0
      fi

      # Look up existing Client by clientId (natural key).
      local existing kc_id secret
      existing="$(curl --max-time 20 --connect-timeout 7 -fsS \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${realm}/clients?clientId=${cid}" \
        | jq -r '.[0] // empty' || echo '')"

      local template_path="/tmp/app-reg-${realm}-${cid}.json"
      printf '%s' "${client_json}" > "${template_path}"

      if [ -n "${existing}" ]; then
        kc_id="$(printf '%s' "${existing}" | jq -r '.id')"
        # PUT update — preserve KC's id, merge in template (template wins).
        local updated
        updated="$(jq -s '.[1] * .[0]' "${template_path}" <(printf '%s' "${existing}"))"
        printf '%s' "${updated}" > "${template_path}.updated"
        curl --max-time 20 --connect-timeout 7 -fsS -X PUT \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${template_path}.updated" \
          "${KC_ADDR%/}/admin/realms/${realm}/clients/${kc_id}" >/dev/null || {
          warn "app-registration[${cid}]: PUT client in realm ${realm} failed"; return 1; }
        secret="$(curl --max-time 20 --connect-timeout 7 -fsS \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${KC_ADDR%/}/admin/realms/${realm}/clients/${kc_id}/client-secret" \
          | jq -r '.value // empty')"
        log "app-registration[${cid}]: updated existing client in realm ${realm} (kc_id=${kc_id})"
      else
        # POST new. Swallow 409 (raced with another pod or KC dedupe).
        local post_code
        post_code="$(curl --max-time 20 --connect-timeout 7 -sS -o /dev/null -w '%{http_code}' -X POST \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${template_path}" \
          "${KC_ADDR%/}/admin/realms/${realm}/clients" || echo 000)"
        case "${post_code}" in
          201) log "app-registration[${cid}]: created client in realm ${realm} (HTTP 201)" ;;
          409) log "app-registration[${cid}]: client already exists in realm ${realm} (HTTP 409 — idempotent)" ;;
          *)
            warn "app-registration[${cid}]: POST client in realm ${realm} failed (HTTP ${post_code})"
            return 1
            ;;
        esac
        kc_id="$(curl --max-time 20 --connect-timeout 7 -fsS \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${KC_ADDR%/}/admin/realms/${realm}/clients?clientId=${cid}" \
          | jq -r '.[0].id // empty')"
        if [ -z "${kc_id}" ]; then
          warn "app-registration[${cid}]: client lookup after POST returned empty; deferring secret persist"
          return 1
        fi
        secret="$(curl --max-time 20 --connect-timeout 7 -fsS \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${KC_ADDR%/}/admin/realms/${realm}/clients/${kc_id}/client-secret" \
          | jq -r '.value // empty')"
      fi

      if [ -z "${secret}" ]; then
        warn "app-registration[${cid}]: KC returned empty client_secret; deferring OpenBao PUT"
        return 1
      fi

      # Persist to OpenBao at `sso/<realm>/<cid>` so the chart-side
      # ExternalSecret can resolve. The bundle shape matches the
      # Tier-3 sso-externalsecret.yaml templates (client_id +
      # client_secret + issuer_url, plus the standard discovery URLs).
      #
      # G117.5c-followup #2807: librechat's ExternalSecret references
      # `property: session_secret` (for OPENID_SESSION_SECRET env var)
      # which the original W3.D5 bundle did not emit. Derive it
      # deterministically from cid+realm+client_secret so it is stable
      # across reconcile ticks AND distinct from client_secret. Other
      # Tier-3 apps that don't reference this key just ignore it.
      #
      # #5416 (2026-07-27) — `cookie_secret`, the SAME derivation idiom, for
      # oauth2-proxy's OAUTH2_PROXY_COOKIE_SECRET (bp-oidc-gate's three gates,
      # bp-agenity's per-Org gate, bp-cilium's hubble-ui gate).
      #
      # WHY IT BELONGS IN THIS BUNDLE: every gate chart used to mint its own
      # cookie secret with a `lookup`-or-`randAlphaNum 32` Helm template. On a
      # 2-region Sovereign each region runs its OWN Flux/Helm against its OWN
      # apiserver, so the lookup misses in the second region and a DIFFERENT
      # 32-char value is generated there. Both regions serve the one hostname
      # behind one shared wildcard VIP, so requests round-robin and each gate
      # rejects the peer region's AES-encrypted session cookie — measured live
      # on hw290 for all three bp-oidc-gate instances (`cookie signature not
      # valid, removing session` + `CSRF token mismatch, potential attack`, on
      # BOTH regions in the same window; guacamole's SPA never rendered because
      # its ~10 parallel XHRs cannot survive the resulting 302/401 storm).
      #
      # The sibling `client_secret` was ALREADY region-consistent, and this is
      # exactly why: it is not generated per region at all — it is read from
      # Keycloak (whose DB is shared across both regions, #4915) and published
      # HERE, then delivered to each region by an ExternalSecret resolving the
      # same `sso/<realm>/<cid>` bundle through the ClusterSecretStore. Riding
      # the same carrier is what makes the cookie secret consistent; deriving
      # it from `${secret}` is what keeps it secret-grade rather than guessable
      # from public inputs (fqdn/realm/clientId are all public).
      #
      # LENGTH: oauth2-proxy's secretBytes() base64url-decodes the value first
      # and requires 16/24/32 bytes. 32 hex chars decode cleanly to 24 bytes
      # (AES-192) on every tick, in every region — so truncate the digest to 32
      # rather than passing the full 64-char hex, which decodes to 48 bytes and
      # is REJECTED at startup ("cookie_secret must be 16, 24, or 32 bytes").
      # Distinct from session_secret (different domain-separation tag) so a
      # consumer of one never gains the other.
      local issuer session_secret cookie_secret
      issuer="https://auth.$(sovereign_fqdn)/realms/${realm}"
      session_secret="$(printf '%s|session|%s|%s' "${cid}" "${realm}" "${secret}" | sha256sum | awk '{print $1}')"
      cookie_secret="$(printf '%s|cookie|%s|%s' "${cid}" "${realm}" "${secret}" | sha256sum | awk '{print substr($1,1,32)}')"
      local bundle
      bundle="$(jq -nc \
        --arg cid "${cid}" \
        --arg secret "${secret}" \
        --arg session "${session_secret}" \
        --arg cookie "${cookie_secret}" \
        --arg issuer "${issuer}" \
        --arg realm "${realm}" \
        '{client_id:$cid, client_secret:$secret, session_secret:$session,
          cookie_secret:$cookie,
          issuer_url:$issuer, realm:$realm,
          authorize_url:($issuer+"/protocol/openid-connect/auth"),
          token_url:($issuer+"/protocol/openid-connect/token"),
          userinfo_url:($issuer+"/protocol/openid-connect/userinfo"),
          end_session_url:($issuer+"/protocol/openid-connect/logout")}')"
      openbao_put "sso/${realm}/${cid}" "${bundle}" \
        && log "app-registration[${cid}]: secret persisted to OpenBao ${OPENBAO_KV_MOUNT}/data/sso/${realm}/${cid}" \
        || { warn "app-registration[${cid}]: OpenBao PUT failed"; return 1; }

      # #3374 (2026-06-14) — OPTIONAL chart-declared ExternalSecret.
      # Some AppRegistration consumers (notably bp-cilium's hubble-ui
      # oauth2-proxy) live in a chart that installs BEFORE bp-external-
      # secrets (the slot-01 CNI), so the chart's OWN ExternalSecret
      # template is omitted at install time by the `.Capabilities` CRD-
      # race guard and — because helm-controller's drift-check re-renders
      # with the release's install-time capability snapshot, never live —
      # is never added on a later reconcile. The consuming chart therefore
      # cannot self-deliver the Secret. bp-sso-bridge CAN: this reconciler
      # runs long after ESO is up (CRD present, kubectl working) and is not
      # subject to any Helm capability snapshot. When the ConfigMap carries
      # `data["externalSecret.json"]` we apply the declared ExternalSecret
      # verbatim here, every tick (idempotent). Consumers that omit the
      # field (the 6 Tier-3 apps + per-Org charts) are unaffected.
      #
      # Declared shape — single-key (the original #3374 form):
      #   { "name": "<es+secret name>", "namespace": "<target ns>",
      #     "secretKey": "<key in the produced Secret>",
      #     "property": "<property in the OpenBao bundle, e.g. client_secret>" }
      #
      # #5416 (2026-07-27) — MULTI-key form, for a consumer that needs two
      # bundle properties in ONE Secret (bp-cilium's hubble-ui oauth2-proxy
      # wants `client-secret` <- client_secret AND `cookie-secret` <-
      # cookie_secret; the cookie secret must come down the SAME carrier or it
      # diverges per region, the #5416 defect):
      #   { "name": ..., "namespace": ...,
      #     "data": [ {"secretKey": "client-secret", "property": "client_secret"},
      #               {"secretKey": "cookie-secret", "property": "cookie_secret"} ] }
      # `data` wins when present; otherwise the single-key fields are used, so
      # every pre-#5416 declaration renders a byte-identical ExternalSecret.
      #
      # The remoteRef key is ALWAYS the canonical sso/<realm>/<cid> this
      # function just wrote — callers never override the storage path.
      local es_decl
      es_decl="$(printf '%s' "${cm_json}" | jq -r '.data["externalSecret.json"] // empty')"
      if [ -n "${es_decl}" ]; then
        local es_name es_ns es_key es_prop es_pairs es_data_yaml es_summary
        es_name="$(printf '%s' "${es_decl}" | jq -r '.name // empty')"
        es_ns="$(printf '%s' "${es_decl}" | jq -r '.namespace // empty')"
        # Normalise both declared shapes to a TSV stream of `<secretKey>\t<property>`.
        es_pairs="$(printf '%s' "${es_decl}" | jq -r 'def entries: if (.data | type) == "array" then .data else [{secretKey: .secretKey, property: .property}] end; entries[] | select((.secretKey // "") != "") | [.secretKey, (.property // "client_secret")] | @tsv' 2>/dev/null || true)"
        es_data_yaml=""
        es_summary=""
        while IFS=$'\t' read -r es_key es_prop; do
          [ -z "${es_key}" ] && continue
          es_data_yaml="${es_data_yaml}$(printf '    - secretKey: %s\n      remoteRef:\n        key: sso/%s/%s\n        property: %s' "${es_key}" "${realm}" "${cid}" "${es_prop}")"$'\n'
          es_summary="${es_summary}${es_key}<-${es_prop} "
        done <<< "${es_pairs}"
        if [ -z "${es_name}" ] || [ -z "${es_ns}" ] || [ -z "${es_data_yaml}" ]; then
          warn "app-registration[${cid}]: externalSecret.json present but missing name/namespace/secretKey; skipping ES apply"
        else
          # Render via printf (consistent leading-space indent — the same
          # convention emit_external_secret uses; column-0 heredoc body
          # lines silently terminate a YAML literal block).
          if { printf '%s\n' \
            "apiVersion: external-secrets.io/v1beta1" \
            "kind: ExternalSecret" \
            "metadata:" \
            "  name: ${es_name}" \
            "  namespace: ${es_ns}" \
            "  labels:" \
            "    catalyst.openova.io/blueprint: bp-sso-bridge" \
            "    bp-sso-bridge.openova.io/managed: \"true\"" \
            "    bp-sso-bridge.openova.io/client-id: \"${cid}\"" \
            "spec:" \
            "  refreshInterval: 1h" \
            "  secretStoreRef:" \
            "    name: vault-region1" \
            "    kind: ClusterSecretStore" \
            "  target:" \
            "    name: ${es_name}" \
            "    creationPolicy: Owner" \
            "  data:"; printf '%s' "${es_data_yaml}"; } \
            | kubectl --request-timeout=15s apply -f - >/dev/null 2>&1; then
            log "app-registration[${cid}]: applied ExternalSecret ${es_ns}/${es_name} (${es_summary}from sso/${realm}/${cid})"
            # #3374-cleanup-race (2026-06-19): record this clientId in the
            # app-registration keep-list so the main loop's cleanup_orphans
            # does NOT treat the ES we just applied (labelled managed=true,
            # client-id=${cid}) as an orphan. current_cids is built only
            # from the HR-discovery loop, so without this the app-reg ES is
            # created here then deleted ~3s later in the same tick. Append
            # only on successful apply — a failed/deferred apply leaves the
            # cid out, so a genuinely-gone declaration is still swept.
            APP_REG_ES_CIDS="${APP_REG_ES_CIDS} ${cid}"
          else
            warn "app-registration[${cid}]: ExternalSecret apply ${es_ns}/${es_name} failed (CRD not ready yet? retry next tick)"
          fi
        fi
      fi
    }

    reconcile_app_registrations() {
      # List every ConfigMap with label sso.openova.io/app-registration
      # (any namespace, any value — value is the clientId).
      #
      # #3374-cleanup-race (2026-06-19): reset the keep-list of
      # app-registration clientIds that own a bp-sso-bridge-managed
      # ExternalSecret. upsert_per_org_client appends to APP_REG_ES_CIDS
      # whenever it APPLIES an ExternalSecret (the `externalSecret.json`
      # path — hubble-ui, newapi-admin, openova-flow, powerdns-admin). The
      # main loop unions this into current_cids BEFORE cleanup_orphans so
      # the orphan sweep does NOT delete an ES the app-registration phase
      # just created this very tick. Without this the app-registration ESs
      # carry the `managed=true` label but are never in current_cids (that
      # set is built only from the HR-discovery loop), so cleanup_orphans
      # deleted them every tick — create-then-delete churn that left the
      # consuming Secret absent most of the time (SSO token-exchange
      # intermittently broken). Reset here, not at loop top, so the global
      # is fresh per tick regardless of early returns.
      APP_REG_ES_CIDS=""
      local cms
      cms="$(kubectl --request-timeout=15s get configmaps -A \
        -l 'sso.openova.io/app-registration' \
        -o json 2>/dev/null | jq -c '.items[]?' || true)"
      [ -z "${cms}" ] && return 0
      local count=0
      while IFS= read -r cm; do
        [ -z "${cm}" ] && continue
        upsert_per_org_client "${cm}" || true
        count=$(( count + 1 ))
      done <<< "${cms}"
      [ "${count}" -gt 0 ] && log "app-registration: processed ${count} ConfigMap(s)"
      return 0
    }

    cleanup_orphans() {
      # $1 = space-separated list of currently-managed clientIds
      local current=" $1 "
      local managed
      managed="$(kubectl --request-timeout=15s get externalsecrets -A \
        -l 'bp-sso-bridge.openova.io/managed=true' \
        -o json | jq -c '.items[] | {name:.metadata.name, ns:.metadata.namespace, cid:.metadata.labels["bp-sso-bridge.openova.io/client-id"]}')"
      while IFS= read -r row; do
        [ -z "${row}" ] && continue
        local cid name ns
        cid="$(printf '%s' "${row}" | jq -r '.cid')"
        name="$(printf '%s' "${row}" | jq -r '.name')"
        ns="$(printf '%s' "${row}" | jq -r '.ns')"
        case "${current}" in
          *" ${cid} "*) ;;  # still managed
          *)
            log "cleanup orphan ExternalSecret ${ns}/${name} (clientId=${cid})"
            kubectl --request-timeout=15s delete externalsecret "${name}" -n "${ns}" --ignore-not-found >/dev/null || true
            ;;
        esac
      done <<< "${managed}"
    }

    # ─── main loop ──────────────────────────────────────────────────────
    log "bp-sso-bridge reconciler starting; realm=${KC_REALM} addr=${KC_ADDR} interval=${INTERVAL_SECONDS}s"

    # #3374-cleanup-race (2026-06-19): app-registration ES keep-list,
    # repopulated each tick by reconcile_app_registrations. Init here so the
    # global is always defined under `set -u` even before the first reset.
    APP_REG_ES_CIDS=""

    while true; do
      tick_started="$(date +%s)"
      tick_deadline=$(( tick_started + TIMEOUT_SECONDS ))

      # G109 #2705: heartbeat for liveness/readiness probes. Updating on
      # every tick (even skipped ones) signals the loop is alive — the
      # liveness probe in deployment.yaml expects this file's mtime to be
      # within 10 min. Skipped ticks (no KC token, no OpenBao token,
      # no Sovereign FQDN ConfigMap) still touch the file because the
      # reconciler IS alive, just degraded upstream.
      touch /tmp/sso-bridge-last-tick

      # 0.2.13: bound SA tokens rotate (~1h) — refresh the synthesized
      # kubeconfig's credential each tick so long-lived pods keep working.
      kubectl config set-credentials sa --token="$(cat "${SA_DIR}/token")" >/dev/null 2>&1 || true

      # 0.2.23 (#4437): re-read the live keycloak credentials Secret BEFORE
      # minting the token, so a reflected addr/secret change (the #4325
      # de-vcluster host correction, or a #4344 admin-password regen) is
      # picked up THIS tick — the boot-time secretKeyRef env snapshot never
      # hot-reloads on its own.
      refresh_kc_credentials

      mint_kc_token || { warn "skipping tick (no KC token)"; sleep "${INTERVAL_SECONDS}"; continue; }
      openbao_login || { warn "skipping tick (no OpenBao token)"; sleep "${INTERVAL_SECONDS}"; continue; }

      log "tick: tokens minted (kc + openbao)"
      op_email="$(operator_email)"
      fqdn="$(sovereign_fqdn)"
      log "tick: identity resolved (fqdn=${fqdn:-<empty>} orgEmail=${op_email:+set}${op_email:-unset})"
      [ -z "${fqdn}" ] && { warn "sovereign-fqdn ConfigMap missing; skipping tick"; sleep "${INTERVAL_SECONDS}"; continue; }

      # 0.2.11 (hw91 ROOT-ROOT cause of the silent-SSO chain): discovery
      # previously matched ONLY HRs with spec.values.sso.enabled==true —
      # but the bootstrap-kit slots inject sso.sovereignFqdn and leave
      # `enabled` to the CHART DEFAULT, which never appears in HR
      # spec.values. Result: on a fresh prov exactly ONE HR matched
      # (bp-catalyst-platform) and sso/gitea etc. could NEVER be written
      # by this reconciler — the manual G91 recovery on hw86 had masked
      # this since the framework shipped. Match either signal the slots
      # actually emit: explicit enabled==true OR a non-empty
      # sso.sovereignFqdn (the 6 Tier-1+ slots: openbao, gitea, harbor,
      # grafana, sandbox, powerdns-admin).
      hrs_json="$(k_retry get hr -A -o json \
        | jq -c '.items[] | select((.spec.values.sso // {}) | (.enabled == true) or ((.sovereignFqdn // "") != ""))' || true)"
      discovered=$(printf '%s' "${hrs_json}" | grep -c . || true)
      log "tick: discovered ${discovered} sso-capable HR(s)"
      current_cids=""
      reconciled_count=0
      while IFS= read -r hr; do
        [ -z "${hr}" ] && continue
        # Guard against tick exceeding budget — bail out to next loop.
        now="$(date +%s)"
        if [ "${now}" -ge "${tick_deadline}" ]; then
          warn "tick budget exceeded; deferring remaining HRs to next tick"
          break
        fi
        # 0.2.10 (hw91): refresh the liveness mtime per-HR. The probe
        # killed the pod mid-FIRST-tick whenever the per-HR work ran
        # past 10 min (timeout-less curls could freeze it silently) —
        # the reconciler then NEVER completed a tick. With per-HR
        # touches a healthy-but-slow tick survives; a genuinely hung
        # curl is now bounded by --max-time so the loop always advances.
        touch /tmp/sso-bridge-last-tick
        name="$(printf '%s' "${hr}" | jq -r '.metadata.name')"
        cid="${name#bp-}"
        current_cids="${current_cids} ${cid}"
        reconcile_one "${hr}" "${op_email}" "${fqdn}" || true
      done <<< "${hrs_json}"

      # G117.5 W2.C4 #2744 — per-Org realm import + sovereign-broker
      # Client registration. Idempotent: realms with HTTP 409 are
      # already imported; broker Clients are upserted by clientId.
      # This runs AFTER the HR-driven app-Client loop so the sovereign
      # KC admin token minted at tick start is still valid.
      log "tick: phase per-org-realms"
      reconcile_per_org_realms || true

      # G117.5c #2801 — Tier-3 AppRegistration ConfigMap watcher.
      # Reads every ConfigMap labelled `sso.openova.io/app-registration`,
      # upserts the matching Client in the per-Org realm specified by
      # `data.realm`, and PUTs the bundle (client_id + client_secret +
      # issuer + discovery URLs) to OpenBao at `sso/<realm>/<client-id>`
      # where the Tier-3 chart-side sso-externalsecret.yaml's remoteRef
      # resolves it. MUST run AFTER reconcile_per_org_realms so the
      # per-Org realms exist before we POST clients into them.
      log "tick: phase app-registrations"
      reconcile_app_registrations || true

      # #3374-cleanup-race (2026-06-19): the orphan sweep keeps any ES whose
      # client-id is in the union of (a) the HR-discovery clientIds
      # (current_cids) AND (b) the app-registration clientIds that own a
      # bp-sso-bridge-applied ExternalSecret this tick (APP_REG_ES_CIDS,
      # populated by upsert_per_org_client on a successful ES apply). The
      # app-reg ESs (hubble-ui, newapi-admin, openova-flow, powerdns-admin)
      # carry the managed=true label but never appeared in current_cids, so
      # cleanup_orphans was deleting them every tick right after creating
      # them. Uninstall semantics are preserved: when an app-registration
      # ConfigMap is removed, its cid drops out of BOTH sets next tick and
      # the orphan ES is correctly swept.
      cleanup_orphans "${current_cids}${APP_REG_ES_CIDS}" || true

      tick_done="$(date +%s)"
      log "tick complete in $(( tick_done - tick_started ))s (discovered=${discovered:-0} reconciled=${reconciled_count:-0} managed=${current_cids:-none})"
      sleep "${INTERVAL_SECONDS}"
    done
{{- end }}
