{{- /*
Reconcile loop script.

Single-binary bash that runs inside a bitnamilegacy/kubectl image. Loops
every {reconcile.intervalSeconds}s. Each tick:

  1. Read OPERATOR_EMAIL from sovereign-fqdn ConfigMap (or
     values.operator.emailOverride if set).
  2. Mint Keycloak admin token via client_credentials grant against the
     catalyst-api-server SA client (catalyst-kc-sa-credentials Secret).
  3. Resolve OpenBao token via Kubernetes-SA login (audience = openbao).
  4. List HelmReleases cluster-wide; filter to those with
     `.spec.values.sso.enabled == true`.
  5. For each app:
     a. Compute clientId, redirectURIs, postLogoutURIs from
        chart values.
     b. Read existing Keycloak Client by clientId. If present, PUT updated
        Client object (redirectURIs / mappers may have changed). If
        absent, POST new Client with a randomly-minted 32-char secret.
     c. Resolve the client_secret to use for OpenBao storage:
        - Existing Client: KC always returns the stored secret; reuse it
          (Keycloak is the source of truth for SECRET, OpenBao is the
          distribution channel).
        - New Client: KC returned the secret we POSTed; that's the value.
     d. PUT into OpenBao at `secret/data/sso/<clientId>` (KV v2 path).
     e. Apply ExternalSecret CR in the HR's namespace:
        - Name: <clientId>-sso-oidc-credentials
        - Refresh: 1h
        - Target Secret name: <clientId>-sso-oidc-credentials
        - Data keys: client_id, client_secret, issuer_url, authorize_url,
          token_url, userinfo_url, redirect_uri.
     f. Resolve operator user by email in sovereign realm; if not present
        log warning (operator may sign in later via realm self-reg flow
        which seeds the User on first OIDC redirect).
     g. Ensure operator user has client-role 'admin' on this Client. If
        the role doesn't exist on the Client yet, create it (POST
        client-roles); then POST role-mapping.
  6. List ExternalSecret CRs labelled `bp-sso-bridge.openova.io/managed=true`
     and not matched by any current sso.enabled=true HR; delete those
     (cleanup on uninstall).

All HTTP calls retry once on transient 5xx. Hard-fail on 4xx other than
404 (404 on GET is expected for new Clients).

Idempotency:
  - Client UPSERT: clientId is the natural key; PUT overwrites.
  - OpenBao PUT: KV v2 versions data, last write wins.
  - ExternalSecret: kubectl apply -f.
  - Role mapping: POST is idempotent on (user, client, role) — 409
    means already mapped, swallow.

Caveat (documented as a TBD in the issue):
  - In per-organization Keycloak topology (SECURITY.md §6.1) the realm
    name is `<orgSlug>` not `sovereign`. v0.1.0 ships shared-sovereign
    only (default for the hw86 debug env). A follow-up will resolve realm
    name from the Sovereign CRD `spec.keycloakTopology` + the HR's owning
    Organization label.
*/ -}}
{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-reconciler
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-sso-bridge
data:
  reconcile.sh: |
    #!/usr/bin/env bash
    # bp-sso-bridge reconcile loop (G91.1 #2652).
    # See chart Chart.yaml description for the contract.
    set -uo pipefail

    : "${KC_REALM:?KC_REALM must be set}"
    : "${KC_ADDR:?KC_ADDR must be set}"
    : "${KC_SA_CLIENT_ID:?KC_SA_CLIENT_ID must be set}"
    : "${KC_SA_CLIENT_SECRET:?KC_SA_CLIENT_SECRET must be set}"
    : "${OPENBAO_ADDR:?OPENBAO_ADDR must be set}"
    : "${OPENBAO_KV_MOUNT:?OPENBAO_KV_MOUNT must be set}"
    : "${OPENBAO_K8S_AUTH_PATH:?OPENBAO_K8S_AUTH_PATH must be set}"
    : "${OPENBAO_K8S_AUTH_ROLE:?OPENBAO_K8S_AUTH_ROLE must be set}"
    : "${INTERVAL_SECONDS:?INTERVAL_SECONDS must be set}"
    : "${TIMEOUT_SECONDS:?TIMEOUT_SECONDS must be set}"
    : "${SOVEREIGN_FQDN_CM_NS:?SOVEREIGN_FQDN_CM_NS must be set}"
    : "${SOVEREIGN_FQDN_CM_NAME:?SOVEREIGN_FQDN_CM_NAME must be set}"
    : "${SOVEREIGN_FQDN_ORG_EMAIL_KEY:?SOVEREIGN_FQDN_ORG_EMAIL_KEY must be set}"
    : "${SOVEREIGN_FQDN_SOVEREIGN_FQDN_KEY:?SOVEREIGN_FQDN_SOVEREIGN_FQDN_KEY must be set}"

    OPERATOR_EMAIL_OVERRIDE="${OPERATOR_EMAIL_OVERRIDE:-}"

    log() { printf '%s | %s\n' "$(date -u +%FT%TZ)" "$*"; }
    warn() { log "WARN: $*" >&2; }
    err() { log "ERR : $*" >&2; }

    # ─── helpers ────────────────────────────────────────────────────────
    curl_kc() {
      # $1 = method, $2 = path-after-realm, $3 = body file (or empty)
      local method="$1" path="$2" body="${3:-}"
      local url="${KC_ADDR%/}/admin/realms/${KC_REALM}${path}"
      if [ -n "${body}" ]; then
        curl -fsS -w '\n%{http_code}' -X "${method}" \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${body}" \
          "${url}" || true
      else
        curl -fsS -w '\n%{http_code}' -X "${method}" \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${url}" || true
      fi
    }

    mint_kc_token() {
      KC_ADMIN_TOKEN="$(curl -fsS \
        -X POST "${KC_ADDR%/}/realms/${KC_REALM}/protocol/openid-connect/token" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "grant_type=client_credentials" \
        -d "client_id=${KC_SA_CLIENT_ID}" \
        -d "client_secret=${KC_SA_CLIENT_SECRET}" \
        | jq -r '.access_token // empty')"
      if [ -z "${KC_ADMIN_TOKEN}" ]; then
        err "failed to mint Keycloak admin token"
        return 1
      fi
    }

    openbao_login() {
      local sa_token
      sa_token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
      OPENBAO_TOKEN="$(curl -fsS \
        -X POST "${OPENBAO_ADDR%/}/v1/auth/${OPENBAO_K8S_AUTH_PATH}/login" \
        -H "Content-Type: application/json" \
        -d "$(jq -nc --arg role "${OPENBAO_K8S_AUTH_ROLE}" --arg jwt "${sa_token}" '{role:$role, jwt:$jwt}')" \
        | jq -r '.auth.client_token // empty')"
      if [ -z "${OPENBAO_TOKEN}" ]; then
        err "failed to login to OpenBao"
        return 1
      fi
    }

    openbao_put() {
      # $1 = path (under kv mount), $2 = JSON string
      local path="$1" data="$2"
      local url="${OPENBAO_ADDR%/}/v1/${OPENBAO_KV_MOUNT}/data/${path}"
      local body
      body="$(jq -nc --argjson d "${data}" '{data:$d}')"
      local resp
      resp="$(curl -fsS -w '\n%{http_code}' -X POST "${url}" \
        -H "X-Vault-Token: ${OPENBAO_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "${body}")"
      local code
      code="$(printf '%s' "${resp}" | tail -n1)"
      if [ "${code}" != "200" ] && [ "${code}" != "204" ]; then
        warn "OpenBao PUT ${path} failed: code=${code} body=$(printf '%s' "${resp}" | head -n1)"
        return 1
      fi
    }

    operator_email() {
      if [ -n "${OPERATOR_EMAIL_OVERRIDE}" ]; then
        printf '%s' "${OPERATOR_EMAIL_OVERRIDE}"
        return 0
      fi
      kubectl get cm "${SOVEREIGN_FQDN_CM_NAME}" -n "${SOVEREIGN_FQDN_CM_NS}" \
        -o jsonpath="{.data.${SOVEREIGN_FQDN_ORG_EMAIL_KEY}}" 2>/dev/null || true
    }

    sovereign_fqdn() {
      kubectl get cm "${SOVEREIGN_FQDN_CM_NAME}" -n "${SOVEREIGN_FQDN_CM_NS}" \
        -o jsonpath="{.data.${SOVEREIGN_FQDN_SOVEREIGN_FQDN_KEY}}" 2>/dev/null || true
    }

    upsert_client() {
      # $1 = clientId, $2 = sovereignFQDN
      local cid="$1" fqdn="$2"
      local app_host="${cid}.${fqdn}"
      local issuer="https://auth.${fqdn}/realms/${KC_REALM}"

      # Lookup existing.
      local existing
      existing="$(curl -fsS \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients?clientId=${cid}" \
        | jq -r '.[0] // empty')"

      local secret kc_id
      local template_path="/tmp/${cid}-client.json"
      # Render JSON via jq to avoid heredoc indentation collisions with the
      # outer YAML literal block (any heredoc body line with fewer leading
      # spaces than the block's indent would terminate the block early).
      jq -n \
        --arg cid    "${cid}" \
        --arg host   "${app_host}" \
        --arg realm  "${KC_REALM}" \
        '{
          clientId: $cid,
          name: ($cid + " (auto by bp-sso-bridge)"),
          description: ("OIDC client for " + $cid + ", auto-provisioned per SECURITY.md §6.3."),
          enabled: true,
          publicClient: false,
          standardFlowEnabled: true,
          directAccessGrantsEnabled: false,
          implicitFlowEnabled: false,
          serviceAccountsEnabled: false,
          redirectUris: [
            ("https://" + $host + "/oauth2/callback"),
            ("https://" + $host + "/oauth/redirect"),
            ("https://" + $host + "/login/oauth/callback"),
            ("https://" + $host + "/c/oidc/login_oidc"),
            ("https://" + $host + "/auth/realms/" + $realm + "/broker/" + $cid + "/endpoint"),
            ("https://" + $host + "/user/oauth2/" + $cid + "/callback"),
            ("https://" + $host + "/*")
          ],
          webOrigins: [
            ("https://" + $host)
          ],
          defaultClientScopes: ["web-origins","acr","profile","roles","email","groups","org"],
          optionalClientScopes: ["address","phone","offline_access","microprofile-jwt"],
          attributes: {
            "pkce.code.challenge.method": "",
            "access.token.lifespan": "900",
            "post.logout.redirect.uris": ("https://" + $host + "/*"),
            "backchannel.logout.url":    ("https://" + $host + "/oauth2/logout")
          }
        }' > "${template_path}"

      if [ -n "${existing}" ]; then
        kc_id="$(printf '%s' "${existing}" | jq -r '.id')"
        secret="$(curl -fsS \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients/${kc_id}/client-secret" \
          | jq -r '.value // empty')"
        # PUT update — preserve KC's id, merge in template.
        local updated
        updated="$(jq -s '.[0] * .[1]' "${template_path}" <(printf '%s' "${existing}") )"
        printf '%s' "${updated}" > "${template_path}.updated"
        curl -fsS -X PUT \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${template_path}.updated" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients/${kc_id}" >/dev/null || {
          warn "PUT client ${cid} failed"; return 1; }
      else
        # POST new; KC will mint its own secret. We then retrieve it.
        curl -fsS -X POST \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${template_path}" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients" >/dev/null || {
          warn "POST client ${cid} failed"; return 1; }
        kc_id="$(curl -fsS \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients?clientId=${cid}" \
          | jq -r '.[0].id')"
        secret="$(curl -fsS \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients/${kc_id}/client-secret" \
          | jq -r '.value // empty')"
        log "created Keycloak Client ${cid} (kc-id=${kc_id})"
      fi

      printf '%s\n' "${secret}" > "/tmp/${cid}.secret"
      printf '%s\n' "${kc_id}" > "/tmp/${cid}.kc-id"
      printf '%s\n' "${issuer}" > "/tmp/${cid}.issuer"
    }

    grant_operator_admin() {
      # $1 = clientId, $2 = operator email
      local cid="$1" email="$2"
      [ -z "${email}" ] && { warn "no operator email; skipping admin grant for ${cid}"; return 0; }

      local user_id
      user_id="$(curl -fsS \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${KC_REALM}/users?email=${email}&exact=true" \
        | jq -r '.[0].id // empty')"

      if [ -z "${user_id}" ]; then
        warn "operator user '${email}' not yet provisioned in realm ${KC_REALM}; admin grant deferred until first sign-in"
        return 0
      fi

      local kc_id
      kc_id="$(cat "/tmp/${cid}.kc-id")"

      # Ensure client-role 'admin' exists on this Client.
      local has_admin
      has_admin="$(curl -fsS \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients/${kc_id}/roles/admin" \
        -o /dev/null -w '%{http_code}')"
      if [ "${has_admin}" = "404" ]; then
        curl -fsS -X POST \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{"name":"admin","description":"Application admin (auto by bp-sso-bridge)"}' \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients/${kc_id}/roles" >/dev/null
      fi

      # Look up the role representation (id + name).
      local role_rep
      role_rep="$(curl -fsS \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients/${kc_id}/roles/admin")"

      # POST role-mapping for the user. Idempotent — Keycloak swallows duplicates.
      curl -fsS -X POST \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "[${role_rep}]" \
        "${KC_ADDR%/}/admin/realms/${KC_REALM}/users/${user_id}/role-mappings/clients/${kc_id}" >/dev/null || true
    }

    grant_operator_realm_roles() {
      # $1 = operator email, $2 = space-separated list of realm-role names
      # Some apps (e.g. catalyst-console, which has a pre-existing
      # catalyst-ui Client in the realm import) need the operator granted
      # REALM-level roles rather than per-Client roles. The realm-role
      # 'catalyst-admin' grants full operator-console privileges via the
      # realm's catalyst-{viewer,developer,operator,admin,owner} composite
      # chain (configmap-sovereign-realm.yaml).
      local email="$1" roles="$2"
      [ -z "${email}" ] && { warn "no operator email; skipping realm-role grant"; return 0; }
      [ -z "${roles}" ] && return 0

      local user_id
      user_id="$(curl -fsS \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${KC_REALM}/users?email=${email}&exact=true" \
        | jq -r '.[0].id // empty')"
      if [ -z "${user_id}" ]; then
        warn "operator user '${email}' not yet provisioned; realm-role grant deferred"
        return 0
      fi

      for role_name in ${roles}; do
        local role_rep
        role_rep="$(curl -fsS \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/roles/${role_name}" 2>/dev/null)"
        if [ -z "${role_rep}" ] || ! printf '%s' "${role_rep}" | jq -e '.id' >/dev/null 2>&1; then
          warn "realm-role '${role_name}' not found in realm ${KC_REALM}; skipping grant"
          continue
        fi
        # POST role-mapping for the user (realm-level). Idempotent.
        curl -fsS -X POST \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "[${role_rep}]" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/users/${user_id}/role-mappings/realm" >/dev/null \
          && log "granted realm-role '${role_name}' to ${email}" \
          || warn "POST realm role-mapping '${role_name}' for ${email} failed"
      done
    }

    emit_external_secret() {
      # $1 = clientId, $2 = HR namespace
      local cid="$1" hrns="$2"
      local secret
      secret="$(cat "/tmp/${cid}.secret")"
      local issuer
      issuer="$(cat "/tmp/${cid}.issuer")"

      # Push client_secret + scalar bundle into OpenBao
      local bundle
      bundle="$(jq -nc \
        --arg cid "${cid}" \
        --arg secret "${secret}" \
        --arg issuer "${issuer}" \
        '{client_id:$cid, client_secret:$secret, issuer_url:$issuer,
          authorize_url:($issuer+"/protocol/openid-connect/auth"),
          token_url:($issuer+"/protocol/openid-connect/token"),
          userinfo_url:($issuer+"/protocol/openid-connect/userinfo"),
          end_session_url:($issuer+"/protocol/openid-connect/logout")}')"
      openbao_put "sso/${cid}" "${bundle}" || return 1

      # Apply ExternalSecret CR in HR's namespace.
      # Render via printf with embedded newlines so every line has a leading
      # space (the YAML literal block requires consistent indent — heredocs
      # with column-0 body lines silently terminate the block).
      printf '%s\n' \
        "apiVersion: external-secrets.io/v1beta1" \
        "kind: ExternalSecret" \
        "metadata:" \
        "  name: ${cid}-sso-oidc-credentials" \
        "  namespace: ${hrns}" \
        "  labels:" \
        "    catalyst.openova.io/blueprint: bp-sso-bridge" \
        "    bp-sso-bridge.openova.io/managed: \"true\"" \
        "    bp-sso-bridge.openova.io/client-id: \"${cid}\"" \
        "spec:" \
        "  refreshInterval: 1h" \
        "  secretStoreRef:" \
        "    name: vault-region1" \
        "    kind: ClusterSecretStore" \
        "  target:" \
        "    name: ${cid}-sso-oidc-credentials" \
        "    creationPolicy: Owner" \
        "  dataFrom:" \
        "    - extract:" \
        "        key: sso/${cid}" \
        | kubectl apply -f - >/dev/null
    }

    reconcile_one() {
      # $1 = HR JSON, $2 = operator email, $3 = sovereign fqdn
      local hr="$1" op_email="$2" fqdn="$3"
      local name ns
      name="$(printf '%s' "${hr}" | jq -r '.metadata.name')"
      ns="$(printf '%s' "${hr}" | jq -r '.metadata.namespace')"

      # The clientId is the HR name (strip a leading "bp-" prefix if present
      # — bp-gitea is the HR, but the natural OIDC clientId is `gitea`).
      local cid="${name#bp-}"

      # G91.catalyst-console-admin-self-grant (#2659) — pull per-HR
      # `.spec.values.sso.realmRolesGranted` (list of strings). Some apps
      # need REALM-level role grants on the operator rather than (or in
      # addition to) the per-Client `admin` role — most notably
      # bp-catalyst-platform, whose operator console uses a pre-existing
      # `catalyst-ui` Client from the realm import and is gated by
      # realm-roles `catalyst-{viewer,developer,operator,admin,owner}`
      # rather than a per-Client role. Empty/missing = legacy
      # per-Client-only grant.
      local realm_roles
      realm_roles="$(printf '%s' "${hr}" | jq -r '(.spec.values.sso.realmRolesGranted // []) | join(" ")')"

      # G91.catalyst-console-admin-self-grant (#2659) — opt-out of
      # per-Client upsert + per-Client-`admin` grant. Apps that ship
      # their own pre-existing Keycloak Client via realm-import (e.g.
      # `catalyst-ui` in the sovereign realm JSON) can declare
      # `.spec.values.sso.skipClientUpsert: true` to mark themselves
      # opt-in for the realm-role-grant path only — bp-sso-bridge then
      # skips both upsert_client and emit_external_secret (no
      # client_secret to materialise) and ONLY runs realm-role grant.
      local skip_upsert
      skip_upsert="$(printf '%s' "${hr}" | jq -r '.spec.values.sso.skipClientUpsert // false')"

      log "reconcile ${name} (ns=${ns} clientId=${cid} realmRoles='${realm_roles}' skipUpsert=${skip_upsert})"

      if [ "${skip_upsert}" != "true" ]; then
        upsert_client "${cid}" "${fqdn}" || { err "upsert ${cid} failed"; return 1; }
        emit_external_secret "${cid}" "${ns}" || { err "emit-es ${cid} failed"; return 1; }
        grant_operator_admin "${cid}" "${op_email}" || warn "grant-admin ${cid} non-fatal"
      else
        log "skipping client upsert + ExternalSecret for ${cid} (sso.skipClientUpsert=true)"
      fi

      if [ -n "${realm_roles}" ]; then
        grant_operator_realm_roles "${op_email}" "${realm_roles}" || warn "grant-realm-roles ${realm_roles} non-fatal"
      fi
    }

    # ─── G117.5 W2.C4 #2744 — per-Org realm provisioning ─────────────────
    #
    # Tier-3 SSO topology: bp-keycloak chart renders one ConfigMap per
    # Org from values.tenantRealms[] (template configmap-per-org-realms.yaml),
    # each carrying:
    #   - label catalyst.openova.io/per-org-realm=true
    #   - label catalyst.openova.io/org-slug=<slug>
    #   - data.org-realm.json = complete realm-import JSON whose
    #     identityProviders[sovereign-broker] has clientId=<slug>-broker
    #     and a deterministic clientSecret derived chart-side from
    #     Release.Name|Release.Namespace|<slug>.
    #
    # On EVERY tick this function reads every per-Org ConfigMap and:
    #   1. POSTs /admin/realms with the realm JSON (KC 409 = already
    #      exists → swallow; first-tick 201 = created). The realm JSON
    #      lives in the ConfigMap so it's the source of truth — any
    #      operator who edits tenantRealms[] in values.yaml re-renders
    #      the ConfigMap and we'd re-import the modified realm.
    #      Today KC's POST /admin/realms is one-shot (refuses re-import
    #      to an existing realm), so structural changes after first
    #      import require operator-side manual reconcile — flagged as
    #      a follow-up TBD in memory feedback_g117_per_org_realm_2hop_pitfalls.md
    #   2. POSTs /admin/realms/sovereign/clients with a `<slug>-broker`
    #      Client carrying the same clientSecret the Org realm's
    #      sovereign-broker IdP expects. Idempotent: PUT the existing
    #      Client if it already exists (clientId is the natural key).
    #   3. PUTs the same secret into OpenBao at
    #      kv/org/<slug>/keycloak/sovereign-broker-secret so any
    #      operator-side automation can read it back.
    #
    # Cross-Org isolation guarantee: each per-Org realm issues id_tokens
    # with iss=https://auth.<sov-fqdn>/realms/<slug> so Org-A id_tokens
    # are rejected at the OIDC discovery layer by Org-B applications
    # whose configured issuer is different. The sovereign realm sits
    # one hop UP — apps in Org-A never see the sovereign-realm session
    # token directly.

    provision_org_realm() {
      # $1 = ConfigMap JSON (single item)
      local cm_json="$1"
      local slug realm_json broker_client_id
      slug="$(printf '%s' "${cm_json}" | jq -r '.metadata.labels["catalyst.openova.io/org-slug"] // empty')"
      if [ -z "${slug}" ]; then
        warn "per-org-realm ConfigMap missing org-slug label; skipping"
        return 0
      fi
      realm_json="$(printf '%s' "${cm_json}" | jq -r '.data["org-realm.json"] // empty')"
      if [ -z "${realm_json}" ]; then
        warn "per-org-realm ConfigMap for ${slug} missing data.org-realm.json; skipping"
        return 0
      fi

      # Extract the broker client secret from the realm JSON. The
      # bp-keycloak chart bakes the same deterministic value into BOTH
      # the IdP config (here) AND must register the matching Client in
      # the sovereign realm (we do that below). KC's POST /admin/realms
      # accepts the secret in identityProviders[].config.clientSecret;
      # the matching sovereign-realm Client gets the same value via
      # POST/PUT /admin/realms/sovereign/clients.
      local broker_secret
      broker_secret="$(printf '%s' "${realm_json}" | jq -r '.identityProviders[] | select(.alias=="sovereign-broker") | .config.clientSecret // empty')"
      if [ -z "${broker_secret}" ]; then
        warn "per-org-realm for ${slug} has no sovereign-broker clientSecret; skipping (chart misrender)"
        return 0
      fi

      broker_client_id="${slug}-broker"

      # ── Step 1: ensure the Org realm exists in KC. ──────────────────
      local realm_check
      realm_check="$(curl -sS -o /dev/null -w '%{http_code}' \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${slug}" || echo 000)"
      if [ "${realm_check}" = "200" ]; then
        log "per-org-realm[${slug}]: already exists; skipping realm POST"
      else
        local realm_post
        printf '%s' "${realm_json}" > "/tmp/${slug}-realm.json"
        realm_post="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@/tmp/${slug}-realm.json" \
          "${KC_ADDR%/}/admin/realms" || echo 000)"
        case "${realm_post}" in
          201) log "per-org-realm[${slug}]: realm created (HTTP 201)" ;;
          409) log "per-org-realm[${slug}]: realm already exists (HTTP 409)" ;;
          *)
            warn "per-org-realm[${slug}]: realm POST failed (HTTP ${realm_post})"
            return 1
            ;;
        esac
      fi

      # ── Step 2: ensure the <slug>-broker Client exists in SOVEREIGN realm. ──
      # The Client's redirectUri MUST match KC's broker callback shape:
      # https://auth.<fqdn>/realms/<org-slug>/broker/sovereign-broker/endpoint
      local fqdn
      fqdn="$(sovereign_fqdn)"
      if [ -z "${fqdn}" ]; then
        warn "per-org-realm[${slug}]: sovereign-fqdn unknown; cannot construct broker redirectUri"
        return 1
      fi
      local broker_redirect="https://auth.${fqdn}/realms/${slug}/broker/sovereign-broker/endpoint"

      local existing_broker
      existing_broker="$(curl -sS \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients?clientId=${broker_client_id}" \
        | jq -r '.[0] // empty' || echo '')"

      local broker_client_json="/tmp/${slug}-broker-client.json"
      jq -n \
        --arg cid "${broker_client_id}" \
        --arg secret "${broker_secret}" \
        --arg redir "${broker_redirect}" \
        '{
          clientId: $cid,
          name: ($cid + " (auto by bp-sso-bridge for Org-realm federation)"),
          description: "G117.5 W2.C4 sovereign-broker Client. The matching Org realm IdP uses this clientId+secret to federate into the sovereign realm.",
          enabled: true,
          publicClient: false,
          standardFlowEnabled: true,
          directAccessGrantsEnabled: false,
          implicitFlowEnabled: false,
          serviceAccountsEnabled: false,
          secret: $secret,
          redirectUris: [$redir],
          webOrigins: [],
          defaultClientScopes: ["web-origins","acr","profile","roles","email","groups"],
          optionalClientScopes: ["address","phone","offline_access","microprofile-jwt"],
          attributes: {
            "access.token.lifespan": "900"
          }
        }' > "${broker_client_json}"

      if [ -n "${existing_broker}" ]; then
        local kc_id
        kc_id="$(printf '%s' "${existing_broker}" | jq -r '.id')"
        # PUT updates the Client (idempotent). Reuse existing KC id so the
        # PUT lands on the right row.
        local updated
        updated="$(jq -s '.[0] * .[1]' "${broker_client_json}" <(printf '%s' "${existing_broker}"))"
        printf '%s' "${updated}" > "${broker_client_json}.updated"
        # Re-pin the secret so chart-side derivation wins (KC keeps the
        # secret in a separate /client-secret endpoint, but PUT'ing the
        # whole representation with `secret` set updates it server-side).
        curl -sS -X PUT \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${broker_client_json}.updated" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients/${kc_id}" -o /dev/null \
          && log "per-org-realm[${slug}]: broker Client updated (kc_id=${kc_id})" \
          || warn "per-org-realm[${slug}]: broker Client PUT failed"
      else
        local broker_post
        broker_post="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${broker_client_json}" \
          "${KC_ADDR%/}/admin/realms/${KC_REALM}/clients" || echo 000)"
        case "${broker_post}" in
          201) log "per-org-realm[${slug}]: broker Client created (HTTP 201)" ;;
          409) log "per-org-realm[${slug}]: broker Client already exists (HTTP 409)" ;;
          *)
            warn "per-org-realm[${slug}]: broker Client POST failed (HTTP ${broker_post})"
            ;;
        esac
      fi

      # ── Step 3: persist broker secret in OpenBao for any operator-side
      #          automation (rotation, audit). Path is namespaced under
      #          the Org slug so cross-Org reads cannot collide.
      local bundle
      bundle="$(jq -nc \
        --arg cid "${broker_client_id}" \
        --arg secret "${broker_secret}" \
        --arg redir "${broker_redirect}" \
        --arg slug "${slug}" \
        '{client_id: $cid, client_secret: $secret, redirect_uri: $redir, org_slug: $slug}')"
      openbao_put "org/${slug}/keycloak/sovereign-broker-secret" "${bundle}" \
        && log "per-org-realm[${slug}]: broker secret persisted to OpenBao kv/org/${slug}/keycloak/sovereign-broker-secret" \
        || warn "per-org-realm[${slug}]: OpenBao PUT failed (non-fatal — KC has the secret already)"
    }

    reconcile_per_org_realms() {
      # List every ConfigMap with label per-org-realm=true (any namespace).
      # bp-keycloak emits them in the keycloak namespace by default but the
      # selector is namespace-agnostic in case of overlay shifts.
      local cms
      cms="$(kubectl get configmaps -A \
        -l 'catalyst.openova.io/per-org-realm=true' \
        -o json 2>/dev/null | jq -c '.items[]?' || true)"
      [ -z "${cms}" ] && return 0
      local count=0
      while IFS= read -r cm; do
        [ -z "${cm}" ] && continue
        provision_org_realm "${cm}" || true
        count=$(( count + 1 ))
      done <<< "${cms}"
      [ "${count}" -gt 0 ] && log "per-org-realm: processed ${count} ConfigMap(s)"
      return 0
    }

    # ─── G117.5c #2801 — Tier-3 AppRegistration ConfigMap watcher ────────
    #
    # The 6 Tier-3 charts (bp-matrix, bp-langfuse, bp-temporal, bp-librechat,
    # bp-openmeter, bp-wordpress-tenant) emit a ConfigMap labelled
    # `sso.openova.io/app-registration=<client-id>` carrying:
    #
    #   - label sso.openova.io/app-registration = <client-id>   (the natural key)
    #   - data.realm        = per-Org KC realm name (== Org slug under G117.6)
    #   - data.client.json  = full KC Client representation (POSTable as-is)
    #
    # Unlike the legacy Tier-1/2 path (which discovers apps via HR-watcher
    # `.spec.values.sso.enabled=true` and mints into the SOVEREIGN realm),
    # Tier-3 apps mint into the PER-ORG realm. The realm name lives in the
    # ConfigMap `data.realm` field — that's the source of truth.
    #
    # This loop runs AFTER reconcile_per_org_realms so the per-Org realms
    # exist by the time we try to POST clients into them (KC returns 404
    # on /admin/realms/<unknown>/clients otherwise).
    #
    # Idempotency:
    #   1. Existing client (looked up by clientId, the natural key): PUT
    #      the merged representation to /admin/realms/<realm>/clients/<id>.
    #      The KC-side client_secret is preserved (KC has its own
    #      /client-secret endpoint we re-read to get the stored value).
    #   2. Absent client: POST to /admin/realms/<realm>/clients; KC mints
    #      a random secret which we then GET via /client-secret.
    #   3. 409 on POST (raced with another reconciler pod, or KC's own
    #      idempotency kicked in) is swallowed and we fall back to PUT.
    #
    # OpenBao path: `sso/<realm>/<client-id>` (under the KV mount).
    # This matches every Tier-3 chart's sso-externalsecret.yaml
    # remoteRef key — verified for bp-matrix, bp-langfuse, bp-temporal,
    # bp-librechat. The realm name is the Org slug (G117 locked-decision
    # #6) so cross-Org reads cannot collide.

    upsert_per_org_client() {
      # $1 = ConfigMap JSON
      local cm_json="$1"
      local cm_name cm_ns cid realm client_json
      cm_name="$(printf '%s' "${cm_json}" | jq -r '.metadata.name // empty')"
      cm_ns="$(printf '%s' "${cm_json}" | jq -r '.metadata.namespace // empty')"
      cid="$(printf '%s' "${cm_json}" | jq -r '.metadata.labels["sso.openova.io/app-registration"] // empty')"
      realm="$(printf '%s' "${cm_json}" | jq -r '.data.realm // empty')"
      client_json="$(printf '%s' "${cm_json}" | jq -r '.data["client.json"] // empty')"

      if [ -z "${cid}" ]; then
        warn "app-registration ConfigMap ${cm_ns}/${cm_name}: missing app-registration label; skipping"
        return 0
      fi
      if [ -z "${realm}" ]; then
        warn "app-registration[${cid}] ${cm_ns}/${cm_name}: missing data.realm; skipping"
        return 0
      fi
      if [ -z "${client_json}" ]; then
        warn "app-registration[${cid}] ${cm_ns}/${cm_name}: missing data.client.json; skipping"
        return 0
      fi

      # Validate realm exists before we try to POST a client into it.
      # KC returns 200 if the realm exists, 404 otherwise. We don't
      # auto-create per-Org realms here — that's reconcile_per_org_realms'
      # job and it runs first. If the realm isn't there yet, skip this
      # tick and wait for the next one (eventual consistency).
      local realm_check
      realm_check="$(curl -sS -o /dev/null -w '%{http_code}' \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${realm}" || echo 000)"
      if [ "${realm_check}" != "200" ]; then
        warn "app-registration[${cid}]: per-Org realm '${realm}' not present yet (HTTP ${realm_check}); deferring to next tick"
        return 0
      fi

      # Look up existing Client by clientId (natural key).
      local existing kc_id secret
      existing="$(curl -fsS \
        -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
        "${KC_ADDR%/}/admin/realms/${realm}/clients?clientId=${cid}" \
        | jq -r '.[0] // empty' || echo '')"

      local template_path="/tmp/app-reg-${realm}-${cid}.json"
      printf '%s' "${client_json}" > "${template_path}"

      if [ -n "${existing}" ]; then
        kc_id="$(printf '%s' "${existing}" | jq -r '.id')"
        # PUT update — preserve KC's id, merge in template (template wins).
        local updated
        updated="$(jq -s '.[1] * .[0]' "${template_path}" <(printf '%s' "${existing}"))"
        printf '%s' "${updated}" > "${template_path}.updated"
        curl -fsS -X PUT \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${template_path}.updated" \
          "${KC_ADDR%/}/admin/realms/${realm}/clients/${kc_id}" >/dev/null || {
          warn "app-registration[${cid}]: PUT client in realm ${realm} failed"; return 1; }
        secret="$(curl -fsS \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${KC_ADDR%/}/admin/realms/${realm}/clients/${kc_id}/client-secret" \
          | jq -r '.value // empty')"
        log "app-registration[${cid}]: updated existing client in realm ${realm} (kc_id=${kc_id})"
      else
        # POST new. Swallow 409 (raced with another pod or KC dedupe).
        local post_code
        post_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          -H "Content-Type: application/json" \
          --data-binary "@${template_path}" \
          "${KC_ADDR%/}/admin/realms/${realm}/clients" || echo 000)"
        case "${post_code}" in
          201) log "app-registration[${cid}]: created client in realm ${realm} (HTTP 201)" ;;
          409) log "app-registration[${cid}]: client already exists in realm ${realm} (HTTP 409 — idempotent)" ;;
          *)
            warn "app-registration[${cid}]: POST client in realm ${realm} failed (HTTP ${post_code})"
            return 1
            ;;
        esac
        kc_id="$(curl -fsS \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${KC_ADDR%/}/admin/realms/${realm}/clients?clientId=${cid}" \
          | jq -r '.[0].id // empty')"
        if [ -z "${kc_id}" ]; then
          warn "app-registration[${cid}]: client lookup after POST returned empty; deferring secret persist"
          return 1
        fi
        secret="$(curl -fsS \
          -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
          "${KC_ADDR%/}/admin/realms/${realm}/clients/${kc_id}/client-secret" \
          | jq -r '.value // empty')"
      fi

      if [ -z "${secret}" ]; then
        warn "app-registration[${cid}]: KC returned empty client_secret; deferring OpenBao PUT"
        return 1
      fi

      # Persist to OpenBao at `sso/<realm>/<cid>` so the chart-side
      # ExternalSecret can resolve. The bundle shape matches the
      # Tier-3 sso-externalsecret.yaml templates (client_id +
      # client_secret + issuer_url, plus the standard discovery URLs).
      local issuer
      issuer="https://auth.$(sovereign_fqdn)/realms/${realm}"
      local bundle
      bundle="$(jq -nc \
        --arg cid "${cid}" \
        --arg secret "${secret}" \
        --arg issuer "${issuer}" \
        --arg realm "${realm}" \
        '{client_id:$cid, client_secret:$secret, issuer_url:$issuer, realm:$realm,
          authorize_url:($issuer+"/protocol/openid-connect/auth"),
          token_url:($issuer+"/protocol/openid-connect/token"),
          userinfo_url:($issuer+"/protocol/openid-connect/userinfo"),
          end_session_url:($issuer+"/protocol/openid-connect/logout")}')"
      openbao_put "sso/${realm}/${cid}" "${bundle}" \
        && log "app-registration[${cid}]: secret persisted to OpenBao ${OPENBAO_KV_MOUNT}/data/sso/${realm}/${cid}" \
        || { warn "app-registration[${cid}]: OpenBao PUT failed"; return 1; }
    }

    reconcile_app_registrations() {
      # List every ConfigMap with label sso.openova.io/app-registration
      # (any namespace, any value — value is the clientId).
      local cms
      cms="$(kubectl get configmaps -A \
        -l 'sso.openova.io/app-registration' \
        -o json 2>/dev/null | jq -c '.items[]?' || true)"
      [ -z "${cms}" ] && return 0
      local count=0
      while IFS= read -r cm; do
        [ -z "${cm}" ] && continue
        upsert_per_org_client "${cm}" || true
        count=$(( count + 1 ))
      done <<< "${cms}"
      [ "${count}" -gt 0 ] && log "app-registration: processed ${count} ConfigMap(s)"
      return 0
    }

    cleanup_orphans() {
      # $1 = space-separated list of currently-managed clientIds
      local current=" $1 "
      local managed
      managed="$(kubectl get externalsecrets -A \
        -l 'bp-sso-bridge.openova.io/managed=true' \
        -o json | jq -c '.items[] | {name:.metadata.name, ns:.metadata.namespace, cid:.metadata.labels["bp-sso-bridge.openova.io/client-id"]}')"
      while IFS= read -r row; do
        [ -z "${row}" ] && continue
        local cid name ns
        cid="$(printf '%s' "${row}" | jq -r '.cid')"
        name="$(printf '%s' "${row}" | jq -r '.name')"
        ns="$(printf '%s' "${row}" | jq -r '.ns')"
        case "${current}" in
          *" ${cid} "*) ;;  # still managed
          *)
            log "cleanup orphan ExternalSecret ${ns}/${name} (clientId=${cid})"
            kubectl delete externalsecret "${name}" -n "${ns}" --ignore-not-found >/dev/null || true
            ;;
        esac
      done <<< "${managed}"
    }

    # ─── main loop ──────────────────────────────────────────────────────
    log "bp-sso-bridge reconciler starting; realm=${KC_REALM} addr=${KC_ADDR} interval=${INTERVAL_SECONDS}s"

    while true; do
      tick_started="$(date +%s)"
      tick_deadline=$(( tick_started + TIMEOUT_SECONDS ))

      # G109 #2705: heartbeat for liveness/readiness probes. Updating on
      # every tick (even skipped ones) signals the loop is alive — the
      # liveness probe in deployment.yaml expects this file's mtime to be
      # within 10 min. Skipped ticks (no KC token, no OpenBao token,
      # no Sovereign FQDN ConfigMap) still touch the file because the
      # reconciler IS alive, just degraded upstream.
      touch /tmp/sso-bridge-last-tick

      mint_kc_token || { warn "skipping tick (no KC token)"; sleep "${INTERVAL_SECONDS}"; continue; }
      openbao_login || { warn "skipping tick (no OpenBao token)"; sleep "${INTERVAL_SECONDS}"; continue; }

      op_email="$(operator_email)"
      fqdn="$(sovereign_fqdn)"
      [ -z "${fqdn}" ] && { warn "sovereign-fqdn ConfigMap missing; skipping tick"; sleep "${INTERVAL_SECONDS}"; continue; }

      hrs_json="$(kubectl get hr -A -o json 2>/dev/null \
        | jq -c '.items[] | select((.spec.values.sso // {}).enabled == true)')"
      current_cids=""
      while IFS= read -r hr; do
        [ -z "${hr}" ] && continue
        # Guard against tick exceeding budget — bail out to next loop.
        now="$(date +%s)"
        if [ "${now}" -ge "${tick_deadline}" ]; then
          warn "tick budget exceeded; deferring remaining HRs to next tick"
          break
        fi
        name="$(printf '%s' "${hr}" | jq -r '.metadata.name')"
        cid="${name#bp-}"
        current_cids="${current_cids} ${cid}"
        reconcile_one "${hr}" "${op_email}" "${fqdn}" || true
      done <<< "${hrs_json}"

      # G117.5 W2.C4 #2744 — per-Org realm import + sovereign-broker
      # Client registration. Idempotent: realms with HTTP 409 are
      # already imported; broker Clients are upserted by clientId.
      # This runs AFTER the HR-driven app-Client loop so the sovereign
      # KC admin token minted at tick start is still valid.
      reconcile_per_org_realms || true

      # G117.5c #2801 — Tier-3 AppRegistration ConfigMap watcher.
      # Reads every ConfigMap labelled `sso.openova.io/app-registration`,
      # upserts the matching Client in the per-Org realm specified by
      # `data.realm`, and PUTs the bundle (client_id + client_secret +
      # issuer + discovery URLs) to OpenBao at `sso/<realm>/<client-id>`
      # where the Tier-3 chart-side sso-externalsecret.yaml's remoteRef
      # resolves it. MUST run AFTER reconcile_per_org_realms so the
      # per-Org realms exist before we POST clients into them.
      reconcile_app_registrations || true

      cleanup_orphans "${current_cids}" || true

      tick_done="$(date +%s)"
      log "tick complete in $(( tick_done - tick_started ))s (managed=${current_cids:-none})"
      sleep "${INTERVAL_SECONDS}"
    done
{{- end }}
