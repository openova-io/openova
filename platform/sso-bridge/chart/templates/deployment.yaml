{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso-bridge-reconciler
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-sso-bridge
    # #3646 §5a — opt this long-running reconciler INTO the jobs canvas:
    # the generic reconciler reader (helmwatch.ListReconcilerObservations)
    # surfaces a Deployment carrying this marker as a kind=reconciler leaf
    # with a HEALTH status (healthy/degraded/failing), never a one-shot
    # "Succeeded". Without the marker a Deployment is not the operator's
    # to drive, so it stays out of the canvas.
    catalyst.openova.io/reconciler: "true"
    app.kubernetes.io/name: sso-bridge-reconciler
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate            # single-writer reconciler; no parallel ticks
  selector:
    matchLabels:
      app.kubernetes.io/name: sso-bridge-reconciler
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sso-bridge-reconciler
        app.kubernetes.io/instance: {{ .Release.Name }}
        catalyst.openova.io/blueprint: bp-sso-bridge
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Trigger Pod restart whenever the reconcile script CM changes
        # (no separate watch / SIGHUP path — Kubernetes does this for us).
        checksum/reconciler: {{ include (print $.Template.BasePath "/configmap-reconciler.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: sso-bridge-reconciler
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: reconciler
          # #2940 Pillar 5: registry host is composed from
          # global.registryMirror (single source of truth) by the
          # bp-sso-bridge.image helper — no hardcoded harbor.openova.io.
          image: "{{ include "bp-sso-bridge.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # G109 #2705: container-level securityContext is mandatory under
          # PodSecurity restricted (Pod-level alone doesn't satisfy
          # allowPrivilegeEscalation / capabilities / readOnlyRootFilesystem).
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/bin/bash"]
          args: ["/etc/sso-bridge/reconcile.sh"]
          # G109 #2705: liveness + readiness probes are mandatory under
          # Kyverno `probes-present`. Probes check the reconcile loop's
          # heartbeat file at /tmp/sso-bridge-last-tick (configmap-reconciler.yaml
          # writes this on every successful tick).
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          env:
            - name: KC_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.credentialsSecretName }}
                  key: addr
            - name: KC_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KC_SA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.credentialsSecretName }}
                  key: client-id
            - name: KC_SA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.credentialsSecretName }}
                  key: client-secret
            # G117.5-followup #2914 (2026-06-03): master-realm admin
            # credentials for POST /admin/realms in provision_org_realm.
            # optional: true on each — chart-side stub Secret may be
            # empty until reflector back-fills from bp-keycloak 1.4.18+.
            # The reconciler's mint_kc_master_admin_token() returns
            # non-zero if any are blank, logs a clear warn, and the tick
            # skips per-Org realm provisioning gracefully.
            - name: KC_MASTER_REALM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.masterAdminCredentialsSecretName }}
                  key: master-realm
                  optional: true
            - name: KC_MASTER_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.masterAdminCredentialsSecretName }}
                  key: master-realm-admin-user
                  optional: true
            - name: KC_MASTER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.masterAdminCredentialsSecretName }}
                  key: master-realm-admin-password
                  optional: true
            - name: OPENBAO_ADDR
              value: {{ .Values.openbao.addr | quote }}
            - name: OPENBAO_KV_MOUNT
              value: {{ .Values.openbao.kvMount | quote }}
            - name: OPENBAO_K8S_AUTH_PATH
              value: {{ .Values.openbao.kubernetesAuth.mountPath | quote }}
            - name: OPENBAO_K8S_AUTH_ROLE
              value: {{ .Values.openbao.kubernetesAuth.role | quote }}
            - name: INTERVAL_SECONDS
              value: {{ .Values.reconcile.intervalSeconds | quote }}
            - name: TIMEOUT_SECONDS
              value: {{ .Values.reconcile.timeoutSeconds | quote }}
            - name: SOVEREIGN_FQDN_CM_NS
              value: {{ .Values.operator.sovereignFqdnConfigMap.namespace | quote }}
            - name: SOVEREIGN_FQDN_CM_NAME
              value: {{ .Values.operator.sovereignFqdnConfigMap.name | quote }}
            - name: SOVEREIGN_FQDN_ORG_EMAIL_KEY
              value: {{ .Values.operator.sovereignFqdnConfigMap.orgEmailKey | quote }}
            - name: SOVEREIGN_FQDN_SOVEREIGN_FQDN_KEY
              value: {{ .Values.operator.sovereignFqdnConfigMap.sovereignFqdnKey | quote }}
            - name: OPERATOR_EMAIL_OVERRIDE
              value: {{ .Values.operator.emailOverride | quote }}
            # #2989 residual (0.2.9): chart-value FQDN fallback so ticks
            # run before catalyst-platform ships the sovereign-fqdn CM.
            - name: SOVEREIGN_FQDN_FALLBACK
              value: {{ .Values.sovereign.fqdn | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: reconciler-script
              mountPath: /etc/sso-bridge
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: reconciler-script
          configMap:
            name: {{ .Release.Name }}-reconciler
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
{{- end }}
