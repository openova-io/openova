{{- /*
Mirror of catalyst-kc-sa-credentials into the `sso-bridge` namespace.

The Secret originates in the `keycloak` ns (created by
platform/keycloak/chart/templates/configmap-sovereign-realm.yaml) and is
auto-mirrored by emberstack/reflector into `catalyst-system` via the
annotations on the source. To extend the mirror chain to `sso-bridge` we
ship a STUB Secret here with `reflector.v1.k8s.emberstack.com/reflects:
keycloak/catalyst-kc-sa-credentials` — reflector picks it up, copies the
source's data into our stub, and keeps it in sync.

Pattern mirrors platform/catalyst-platform/chart/templates/
keycloak-sa-credentials-mirror.yaml (canonical seam for SA cred
distribution).

Why this is safe — reflector is the only writer:
  - On first install, the stub has empty `data:`. Reflector matches the
    annotation and writes the source's bytes within a single reconcile
    interval (~5s).
  - On upgrade, the stub stays empty in Helm's view, reflector overwrites
    after the upgrade reconcile, and the reconciler Pod's secretRef mount
    re-reads via kubelet's atomic Secret volume update.
  - If reflector is unhealthy, the reconciler will start with empty creds,
    log a clear error ("KC_CLIENT_SECRET unset; reflector not running?"),
    and exit non-zero; the Deployment's restart policy + CrashLoopBackoff
    surfaces the substrate failure to the operator.
*/ -}}
{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.credentialsSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-sso-bridge
    catalyst.openova.io/component: keycloak-sa-credentials-mirror
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "keycloak/{{ .Values.keycloak.credentialsSecretName }}"
type: Opaque
{{- end }}
