# Master gate. Default off — installing this Blueprint is a no-op until
# flipped. EPIC-6 (#1101) flips it as part of the multi-region
# substrate roll-out (CNPG primary/replica needs hcloud-volumes).
enabled: false

# Flip the cluster's default StorageClass to hcloud-volumes. Default
# false — destructive change for Pods relying on the previous default's
# binding semantics. Operator schedules an in-place migration plan
# (drain, repvc, copy-data) before flipping this on a running Sovereign.
defaultStorageClass: false

catalystBlueprint:
  upstream: { chart: hcloud-csi, version: "2.13.0", repo: "https://charts.hetzner.cloud" }

# Reference to the SealedSecret holding the HCLOUD_TOKEN. Plaintext NEVER
# on the CR per docs/INVIOLABLE-PRINCIPLES.md #10. The upstream subchart
# expects the secret to be mounted in the controller Deployment via env var.
hetznerTokenSecretRef:
  name: hcloud-csi-token
  key: token

# 2026-05-17 t143 (C9-006): Hetzner API token plaintext. Default empty —
# Flux `valuesFrom` populates this at HelmRelease apply time from the
# canonical flux-system/cloud-credentials Secret (key `hcloud-token`)
# cloud-init writes during Phase 0 (mirrors bp-hcloud-ccm wiring at
# clusters/_template/bootstrap-kit/55-bp-hcloud-ccm.yaml). When
# non-empty, templates/hcloud-token-secret.yaml renders the
# `<hetznerTokenSecretRef.name>` Secret in the chart's targetNamespace
# so the subchart's controller can authenticate to the Hetzner API.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #10 (credentials never on CR / Git),
# this stays empty in committed YAML; the live value lands at apply
# time from cloud-credentials and is never persisted to Git.
hetznerToken: ""

# Catalyst-managed StorageClass list. Each entry renders an independent
# StorageClass — operators can add fast-ssd / archive variants per
# Sovereign without editing this chart. Named `catalystStorageClasses`
# to avoid collision with the upstream `hcloud-csi.storageClasses` key
# (different shape — upstream has its own list under that name).
#
# #3971 — reclaimPolicy is `Retain` (NOT `Delete`): the FIRST entry is the
# cluster-default SC for EVERY stateful PVC on the Sovereign (cnpg 3×100Gi,
# openbao secrets, customer-Org DB, …). `Retain` keeps the backing Hetzner
# Cloud Volume alive when a PVC/PV is deleted (node replacement, autoscaler
# churn, accidental PVC delete) so production data survives — the durable
# fix for the P0 "PVCs land on ephemeral local-path" blocker. Operators
# reclaim a `Released` PV's volume deliberately (it is never auto-deleted).
catalystStorageClasses:
  - name: hcloud-volumes
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    parameters: {}

# VolumeSnapshotClass for backup workflows (Velero etc.). #3971 — default ON
# so every Sovereign has storage-level snapshots out of the box (the
# upstream hcloud-csi subchart ships the snapshot.storage.k8s.io/v1 CRDs +
# external-snapshotter sidecar). deletionPolicy Retain mirrors the SC so a
# deleted VolumeSnapshot never silently drops the cloud snapshot.
volumeSnapshotClass:
  enabled: true
  name: hcloud-volumes-snapshots
  deletionPolicy: Retain

# ─── Upstream subchart values (subchart key: hcloud-csi) ──────────────
hcloud-csi:
  # The upstream chart's secret reference shape — wired to our SealedSecret.
  controller:
    hcloudToken:
      existingSecret:
        name: hcloud-csi-token
        key: token
    replicas: 2
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  # Disable the upstream chart's StorageClass install — Catalyst overlay
  # templates (chart/templates/storageclass.yaml) render them with our
  # naming + annotations. The upstream schema expects this key as an
  # array; passing [] suppresses upstream-rendered StorageClasses entirely.
  storageClasses: []
