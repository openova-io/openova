apiVersion: v2
name: bp-hcloud-csi
# 1.1.0 (2026-05-17 t143 C9-006): add templates/hcloud-token-secret.yaml
# so the chart self-renders the `hcloud-csi-token` Secret from
# `.Values.hetznerToken` (populated via Flux valuesFrom from
# flux-system/cloud-credentials). Without this Secret the controller
# pods cannot authenticate to the Hetzner API; the StorageClass exists
# but every PVC fails to provision with a 401 from the CSI driver.
# Mirrors bp-hcloud-ccm 1.0.0 wiring.
# 1.2.0 (2026-06-20 #3971): wire into the bootstrap-kit (slot 55a) so EVERY
# fresh Hetzner Sovereign installs the CSI + flips the cluster-default
# StorageClass to hcloud-volumes. The default SC now uses reclaimPolicy
# Retain (production-data durability) and ships the VolumeSnapshotClass ON.
# Closes the P0 blocker where every PVC landed on ephemeral k3s local-path.
# 1.2.1 (2026-06-20 #3971): default-class-hook comment updated for the
# local-path-FORBIDDEN model (k3s --disable=local-storage + Kyverno deny):
# on a fresh prov the hook's demote step is a no-op (local-path never exists);
# it only heals an UPGRADE from a pre-#3971 cluster with a stale default.
version: 1.2.2
description: |
  Catalyst-curated Blueprint umbrella chart for the Hetzner Cloud CSI
  driver. Provides the hcloud-volumes StorageClass for multi-node stateful
  workloads. Default off — operator opts in deliberately per-Sovereign
  per docs/INVIOLABLE-PRINCIPLES.md #4.

  Wraps the upstream hetznercloud/csi-driver Helm chart as a subchart so
  `helm dependency build` bundles it into the OCI artifact. Catalyst
  overlay templates in templates/ (StorageClass, default-annotation,
  VolumeSnapshotClass) sit alongside.
type: application
keywords: [catalyst, blueprint, csi, storage, hetzner]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a subchart. Pinned conservatively — bumps
# require manual upgrade testing on a live Sovereign per
# docs/INVIOLABLE-PRINCIPLES.md #4 + the lessons learned from the bp-cilium
# provenance drift (slice H1).
dependencies:
  - name: hcloud-csi
    version: "2.13.0"
    repository: "https://charts.hetzner.cloud"
    condition: enabled

annotations:
  # #2935 (2026-06-03): Blueprint-Release hollow-chart guard exemption.
  # Chart legitimately renders zero resources with default values
  # (default-off feature toggle or dependency-on-CRD pattern). Without
  # this annotation Blueprint-Release rejects publish.
  catalyst.openova.io/smoke-render-mode: "default-off"
