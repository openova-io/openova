apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-llm-gateway
  labels:
    catalyst.openova.io/category: ai-runtime
    catalyst.openova.io/section: pts-4-6-llm-serving
spec:
  version: 1.0.2
  card:
    title: LLM Gateway
    category: ai
    family: llm-routing
    summary: Multi-provider LLM router with rate limits, cost tracking, and prompt caching.
    description: Provider-agnostic LLM gateway (OpenAI, Anthropic, Bedrock, local). Pairs with bp-langfuse for traces.
    icon: llm-gateway.svg
    license: Apache-2.0
    tags: [ai, llm, gateway, routing, cost]
    docs: https://github.com/openova-io/openova/tree/main/platform/llm-gateway
  visibility: listed
  owner:
    team: ai-platform
    contact: ai-platform@openova.io
  configSchema:
    type: object
    properties:
      replicas:
        type: integer
        default: 2
        minimum: 1
        maximum: 8
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-llm-gateway
  upgrades:
    from: ["0.x"]
  observability:
    metrics: prometheus
    logs: stdout
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-active
    - singleton
    defaults:
      multi-region: active-active
      single-region: singleton
    perTopology:
      active-active:
        replication:
          backend: none
          mode: none
        switchover:
          mechanism: none
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: active
      singleton:
        placement:
          tier: rtz
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: llm.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: "{{.OrgSlug}}"
    protocolMapper: oidc
    silentLogin: true
  # ── /G117.1 ──
