apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-llm-gateway
  labels:
    catalyst.openova.io/category: ai-runtime
    catalyst.openova.io/section: pts-4-6-llm-serving
spec:
  version: 1.0.2
  card:
    title: LLM Gateway
    category: ai
    family: llm-routing
    summary: Multi-provider LLM router with rate limits, cost tracking, and prompt caching.
    description: Provider-agnostic LLM gateway (OpenAI, Anthropic, Bedrock, local). Pairs with bp-langfuse for traces.
    icon: llm-gateway.svg
    license: Apache-2.0
    tags: [ai, llm, gateway, routing, cost]
    docs: https://github.com/openova-io/openova/tree/main/platform/llm-gateway
  visibility: listed
  owner:
    team: ai-platform
    contact: ai-platform@openova.io
  configSchema:
    type: object
    properties:
      replicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 16
      auth:
        type: object
        properties:
          mode:
            type: string
            enum: [keycloak, masterKey, hybrid]
            default: keycloak
            description: |
              `keycloak` = OIDC-only (every caller authenticates via
              bp-keycloak realm). `masterKey` = static per-tenant master
              keys (dev only — operators MUST NOT enable in production).
              `hybrid` = Keycloak for human callers, master keys for
              CI/automation accounts.
          keycloak:
            type: object
            properties:
              issuer:
                type: string
                description: Keycloak realm issuer URL (https://keycloak.<env>.<sovereign-domain>/realms/<realm>).
              audience:
                type: string
                default: llm-gateway
      audit:
        type: object
        properties:
          enabled:
            type: boolean
            default: true
            description: Enable CNPG-backed audit log (every prompt + response stored for compliance).
      backends:
        type: object
        properties:
          anthropic:
            type: object
            properties:
              enabled:
                type: boolean
                default: false
                description: |
                  Forward Claude requests via the operator's
                  OAuth/Max subscription. NEVER set an ANTHROPIC_API_KEY
                  — the gateway uses subscription tokens issued by the
                  operator's Claude account.
          bedrock:
            type: object
            properties:
              enabled:
                type: boolean
                default: false
          vertex:
            type: object
            properties:
              enabled:
                type: boolean
                default: false
          vllm:
            type: object
            properties:
              enabled:
                type: boolean
                default: false
          anthropicAdapter:
            type: object
            properties:
              enabled:
                type: boolean
                default: false
                description: Route OpenAI-compatible callers to Claude via bp-anthropic-adapter.
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-llm-gateway
  upgrades:
    from: ["0.x"]
  observability:
    metrics: prometheus
    logs: stdout
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-active
    - singleton
    defaults:
      multi-region: active-active
      single-region: singleton
    perTopology:
      active-active:
        replication:
          backend: none
          mode: none
        switchover:
          mechanism: none
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: active
      singleton:
        placement:
          tier: rtz
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: llm.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: "{{.OrgSlug}}"
    protocolMapper: oidc
    silentLogin: true
  # ── /G117.1 ──
