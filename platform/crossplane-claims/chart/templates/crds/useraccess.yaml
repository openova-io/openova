{{- if .Values.userAccess.enabled }}
# CRD: useraccesses.access.openova.io — Catalyst Sovereign IAM intent.
#
# ⚠️ HISTORY (Refs #4773): this was previously a Crossplane
# CompositeResourceDefinition (XRD) with `claimNames: {kind: UserAccess}`
# — i.e. UserAccess was a Crossplane *Claim* whose composite was
# XUserAccess. That coupling is REMOVED. It caused an unbounded composite
# leak: with the legacy Composition retired by default (qa-loop iter-16
# Fix #71, `userAccess.compositionEnabled=false`), every UserAccess Claim
# spawned an XUserAccess XR that could never select a Composition
# (`cannot select Composition: no compatible Compositions found`). The
# per-Org producer (organization-controller `upsertUserAccess`) rewrites
# `spec` wholesale on every reconcile, wiping the `spec.resourceRef` the
# Crossplane claim controller writes back — so the claim controller
# re-spawned a fresh XR each loop. hw224 accumulated 5,726 orphaned
# XUserAccess composites over ~10h, and the churn starved the shared
# Crossplane reconcile queue, holding the crossplane-adoption
# CloudAdoption CRs at Ready=False.
#
# The canonical realization path is the in-cluster
# catalyst-useraccess-controller
# (core/controllers/useraccess/, deployed by
# products/catalyst/chart/templates/controllers/useraccess-controller-*),
# which reconciles UserAccess CRs directly into RoleBinding /
# ClusterRoleBinding objects — no Crossplane, no provider-kubernetes
# (which is not installed on production Sovereigns). Since Crossplane is
# no longer part of this path, UserAccess is a PLAIN CRD. Nothing spawns
# an XUserAccess XR, so the leak cannot recur.
#
# Scope: Cluster (Refs #4773 follow-up) — a single UserAccess grant spans
# MANY namespaces by design and can materialize CLUSTER-scoped bindings:
#   • the useraccess-controller emits ClusterRoleBinding objects for
#     wildcard / empty-scope grants (owner-seed, `namespaces: ["*"]`), and
#   • it emits RoleBinding objects into the target application / org /
#     env namespaces, which are DIFFERENT from wherever the CR itself
#     would live (the org-controller writes the CR "centrally" but the
#     RoleBinding lands in the Org's own namespace).
# Every materialized binding carries an ownerReference back to this CR so
# K8s garbage-collects them on delete (no finalizer). Kubernetes ownerRef
# rules make that IMPOSSIBLE for a namespaced owner:
#   • a cluster-scoped ClusterRoleBinding may only be owned by a
#     cluster-scoped owner — a namespaced owner is an unresolvable
#     ownerRef (OwnerRefInvalidNamespace), the binding is never GC'd, and
#   • a RoleBinding in namespace M may only reference a namespaced owner
#     in the SAME namespace M — an ownerRef to a UserAccess in a
#     different namespace is treated as ABSENT and the GC DELETES the
#     freshly-created RoleBinding within seconds.
# So a namespaced UserAccess cannot own its bindings: grants either leak
# (CRBs) or are immediately garbage-collected (cross-namespace RBs) — the
# 0-RoleBindings symptom on hw224. A cluster-scoped UserAccess CAN own
# both (namespaced dependents may name a cluster-scoped owner in ANY
# namespace, and cluster-scoped dependents may name a cluster-scoped
# owner) — exactly the reason Organization (the org-controller's own
# parent CR) is cluster-scoped too. The producers are updated lockstep to
# stop stamping a namespace (organization-controller `upsertUserAccess`,
# catalyst-api `user_access_owner_seed.go` / `rbac_assign.go` /
# `user_access.go`, and the qa-fixtures).
#
# The GVK (access.openova.io/v1alpha1, kind UserAccess) and GVR
# (useraccesses) are UNCHANGED, so the catalyst-useraccess-controller,
# catalyst-api handlers, and the userAccess-boundary Kyverno policy all
# continue to bind to the same resource. Only the composite type
# `xuseraccesses.access.openova.io` (kind XUserAccess) is gone.
#
# Per docs/PRINCIPLES.md:
#   #3  Sovereign IAM grants are reconciled by a native controller
#       (RoleBinding/ClusterRoleBinding), not by catalyst-api kubectl.
#   #4  Role names are the three canonical openova:application-*
#       ClusterRoles (admin/editor/viewer); spec.applications[].role is
#       one of {admin, editor, viewer} and the controller rewrites it.

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: useraccesses.access.openova.io
  labels:
    catalyst.openova.io/component: useraccess
    catalyst.openova.io/iam-plane: "true"
spec:
  group: access.openova.io
  scope: Cluster
  names:
    kind: UserAccess
    listKind: UserAccessList
    plural: useraccesses
    singular: useraccess
    categories:
      - catalyst
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [user, sovereignRef]
              properties:
                user:
                  type: object
                  description: |
                    Identity of the principal receiving access. Either
                    keycloakSubject (an OIDC `sub` claim, binding a single
                    user) or keycloakGroups (a list of group names, binding
                    every member of those groups) or both. The controller
                    emits one RoleBinding subject per identity.
                  properties:
                    keycloakSubject:
                      type: string
                      description: |
                        OIDC `sub` claim — the Keycloak user's stable id.
                        Renders as a RoleBinding subject of kind=User,
                        name="oidc:<subject>" (matches the api-server
                        --oidc-username-prefix convention).
                    keycloakGroups:
                      type: array
                      items:
                        type: string
                      description: |
                        Keycloak group names. Each renders as an additional
                        RoleBinding subject of kind=Group,
                        name="oidc:<group>" (matches --oidc-groups-prefix).
                sovereignRef:
                  type: string
                  description: |
                    Sovereign identifier — a single DNS label (no dots).
                    Carried as an ops/audit label on the materialized
                    RoleBindings.
                  pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
                applications:
                  type: array
                  description: |
                    Legacy per-Application grant list (admin/editor/viewer
                    short-enum, slice #322 shape). One entry per
                    (Application × role) grant. An entry may name explicit
                    namespaces, vClusters (rendered as additional
                    namespaces with the vCluster prefix), or omit both —
                    in which case catalyst-api expands the grant against
                    Application.k8s_namespaces before applying.

                    EPIC-3 (#1098) UserAccess CRs authored via the
                    /rbac/assign endpoint use the new tierRoleRef + scopes
                    fields instead and may omit applications entirely.
                    Both shapes coexist during EPIC-3 rollout.
                  items:
                    type: object
                    required: [app, role]
                    properties:
                      app:
                        type: string
                        description: |
                          Application slug as registered in catalyst-api
                          (e.g. helmwatch, ai-inference).
                        pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
                      role:
                        type: string
                        description: |
                          One of admin | editor | viewer. The controller
                          rewrites this to the canonical ClusterRole name
                          openova:application-<role>.
                        enum: [admin, editor, viewer]
                      namespaces:
                        type: array
                        items:
                          type: string
                        description: |
                          Explicit namespace list for this grant. When
                          omitted, catalyst-api resolves it from the
                          Application's k8s_namespaces field before writing
                          the CR. A `["*"]` entry materializes a
                          ClusterRoleBinding instead of per-namespace
                          RoleBindings.
                      vClusters:
                        type: array
                        items:
                          type: string
                        description: |
                          vCluster names — rendered as additional
                          namespaces using the catalyst convention
                          `vcluster-<name>`.
                providerConfigRef:
                  type: object
                  description: |
                    Retained for backward-compatibility with CRs authored
                    against the legacy Crossplane Claim shape. Ignored by
                    the catalyst-useraccess-controller. Most callers leave
                    this unset.
                  properties:
                    name:
                      type: string
                tierRoleRef:
                  type: string
                  description: |
                    Tier ClusterRole this UserAccess targets — one of
                    `openova:tier-{viewer,developer,operator,admin,owner}`
                    (the 5 catalog tiers shipped by EPIC-3 (#1098) slice
                    T1's tier-clusterroles.yaml).

                    Authored by the find-or-create-role endpoint
                    (`POST /api/v1/sovereigns/{id}/rbac/assign`, slice A1)
                    when an operator picks a tier in the multi-grant
                    editor. The useraccess-controller binds this
                    ClusterRole on the target via RoleBinding /
                    ClusterRoleBinding depending on whether scopes
                    narrow the target to a namespace.

                    When unset, the legacy `applications[*].role` short
                    enum (admin/editor/viewer → openova:application-*)
                    is used. Both fields can co-exist during EPIC-3
                    rollout — tierRoleRef takes precedence when both set.
                  pattern: '^openova:tier-(viewer|developer|operator|admin|owner)$'
                scopes:
                  type: array
                  description: |
                    Manara DNA label-based scope tags. Each entry is a
                    `{key, value}` pair from the canonical openova.io
                    label vocabulary.

                    Semantics: AND-within (all scopes must match the
                    target), OR-across UserAccess CRs (any matching CR
                    grants access). The wildcard scope
                    `[{key: "*", value: "*"}]` means cluster-wide.

                    Empty list = cluster-wide (same as wildcard scope).

                    Authored by the /rbac/assign endpoint and consumed by
                    the useraccess-controller's label-matching engine at
                    `core/controllers/internal/labels/`.
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key:
                        type: string
                        description: |
                          Label key from the canonical openova.io
                          vocabulary (e.g. `openova.io/application`,
                          `openova.io/env-type`, `openova.io/org`). The
                          wildcard `*` matches any key.
                      value:
                        type: string
                        description: |
                          Label value (e.g. `wordpress`, `dev`,
                          `acme-corp`). The wildcard `*` matches any
                          value.
            status:
              type: object
              # Preserve the catalyst-useraccess-controller's status writes
              # (phase, roleBindings[], and the EPIC-3 tier conditions
              # EnforcedScopeApplied / TierResolved / BindingsReconciled)
              # rather than pruning them to the documented subset below.
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                  description: |
                    Pending → Active on first successful reconcile; Failed
                    on a hard error. Surfaced to the access-matrix UI.
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:        { type: string }
                      status:      { type: string }
                      reason:      { type: string }
                      message:     { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                rolebindingsCreated:
                  type: integer
                  description: |
                    Count of RoleBinding / ClusterRoleBinding objects this
                    UserAccess owns. Surfaced to the user-access editor
                    UI's "<n> grants active" badge.
      additionalPrinterColumns:
        - name: SOVEREIGN
          type: string
          jsonPath: .spec.sovereignRef
        - name: USER
          type: string
          jsonPath: .spec.user.keycloakSubject
        - name: PHASE
          type: string
          jsonPath: .status.phase
        - name: GRANTS
          type: integer
          jsonPath: .status.rolebindingsCreated
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
{{- end }}
