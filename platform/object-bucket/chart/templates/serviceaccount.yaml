{{- /* The identity of the Jobs; producer "binding" of bp-openbao binds this name in seaweedfs.namespace. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "objectBucket.labels" . | nindent 4 }}
automountServiceAccountToken: false
