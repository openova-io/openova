# Catalyst Blueprint umbrella metadata — the upstream chart is resolved as
# a Helm subchart via Chart.yaml `dependencies:`. Catalyst-curated values
# under the `reloader:` key flow into the upstream subchart unchanged.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is configurable; cluster overlays in clusters/<sovereign>/
# may override any of these without rebuilding the Blueprint OCI artifact.

catalystBlueprint:
  upstream:
    chart: reloader
    version: "2.2.11"
    repo: "https://stakater.github.io/stakater-charts"

# ─── Upstream chart values (subchart key: reloader) ──────────────────────
reloader:
  # ─── Harbor proxy-cache pull (#3296, #3903) ──────────────────────────────
  # The upstream subchart renders its image from `image.repository` (when no
  # digest is set), which defaults to the un-proxied `ghcr.io/stakater/reloader`
  # — fails to pull on an IPv4-only kom4dc prov and is DENIED by kyverno
  # `harbor-proxy-pull` (Enforce; globs `*/proxy-*/*`, `*/openova-io/*`). Swap
  # the host to the Harbor proxy-ghcr cache, preserving the repo path. We do
  # NOT set global.imageRegistry (that path would re-introduce the bare
  # `image.name` host-less ref). Tag stays pinned at v1.4.16.
  image:
    repository: harbor.openova.io/proxy-ghcr/stakater/reloader
    tag: "v1.4.16"
    pullPolicy: IfNotPresent
  # Reloader controller — single replica (the upstream chart uses leader
  # election when scaled, but a single-pod restart only delays a rotation
  # by ≤30s in practice).
  reloader:
    replicaCount: 1

    deployment:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

      # Cluster-wide watch — Reloader watches every namespace by default.
      # Per-Sovereign overlays MAY narrow via `--namespaces-to-watch`.
      env:
        open: []

      # SecurityContext — non-root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

    # Reload strategy — `annotations` mode bumps a pod-template annotation
    # (reloader.stakater.com/last-reloaded-from) on the watched workload,
    # triggering rollout regardless of how the ConfigMap/Secret is referenced
    # (envFrom, valueFrom, or volume mount).
    #
    # `env-vars` mode (the previous default) ONLY injects a checksum env var
    # for ConfigMaps referenced via `envFrom`. Workloads that read a single
    # key via `valueFrom: configMapKeyRef` are NOT reloaded under `env-vars`,
    # producing the SOVEREIGN_FQDN race that broke handover on every fresh
    # Sovereign (otech62-64, 2026-05-03): Pod started before
    # `clusters/_template/sovereign-tls/sovereign-fqdn-configmap.yaml` had
    # been applied, valueFrom collapsed to "", and Reloader never rolled
    # the Pod when the CM appeared.
    #
    # Switching to `annotations` makes the
    # `configmap.reloader.stakater.com/reload: "sovereign-fqdn"` annotation
    # on catalyst-api work as advertised.
    reloadStrategy: "annotations"

    # ServiceMonitor — DEFAULT FALSE per docs/BLUEPRINT-AUTHORING.md §11.2.
    serviceMonitor:
      enabled: false

    # RBAC — chart manages its own ClusterRole + ServiceAccount.
    rbac:
      enabled: true
    serviceAccount:
      create: true

    # Watchers — both ConfigMaps and Secrets, the default Catalyst posture.
    watchGlobally: true
    isOpenshift: false

# ─── Catalyst overlay values (consumed by templates/ in this chart) ──────
# Reserved for Catalyst-side overlays (NetworkPolicy) added in a follow-up
# PR once bp-reloader is consumed in clusters/_template/.
reloaderOverlay:
  networkPolicy:
    enabled: false
