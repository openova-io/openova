apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-reloader
spec:
  version: 1.0.3
  visibility: unlisted
  class: platform-component
  lifecycle: experimental
  card:
    title: Reloader
    summary: Watches ConfigMap/Secret changes and triggers rolling restarts of the Deployments/StatefulSets that consume them — keeps workloads in sync with rotated credentials.
    icon: reloader.svg
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ''
          clusters:
            - mgmt-A
            - mgmt-B
            - dmz-A
            - dmz-B
            - rtz-A
            - rtz-B
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-reloader
  endpoints: []
