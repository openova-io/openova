apiVersion: v2
name: bp-k8s-ws-proxy
# 0.1.17 (#5991 / UAT row 115): an mTLS listener on :8443 as a SECOND way
# to present the same authority, plus workload-name resolution of the pod
# segment. Both are ADDITIVE — the plaintext :8080 listener and the HMAC
# credential are byte-identical to 0.1.16.
#
# WHY. Row 115 asserts a signed-in sovereign-admin sees a non-empty
# Guacamole connections list. bp-guacamole 0.2.38 shipped the producer,
# but every connection it could seed either prompted for a credential the
# platform does not hold or could not authenticate to this proxy at all:
# Apache guacd CANNOT send the X-Catalyst-HMAC headers. Its `kubernetes`
# protocol builds the WebSocket upgrade through libwebsockets with no
# hook for custom HTTP headers, and builds the PATH with a literal
# snprintf (guacamole-server 1.5.5, src/protocols/kubernetes/{kubernetes,
# url}.c). The one credential it CAN present is a TLS client certificate
# (client-cert / client-key / ca-cert, src/protocols/kubernetes/ssl.c).
#
# So this chart mints that certificate from a PRIVATE CA it also owns
# (templates/certs.yaml: selfSigned Issuer → CA → CA Issuer → server leaf
# + client leaf — the same four-object shape every cert-manager webhook
# in this repo uses), allowlists exactly that one identity on the new
# listener, and mirrors the client Secret into the `guacamole` namespace
# via reflector. The CA signs two leaves and nothing else, so holding
# some other cert-manager certificate on the Sovereign grants nothing
# here.
#
# The listener does NOT open a second way in by itself: mTLS auth is live
# only when CLIENT_CERT_ALLOWED_SUBJECTS is non-empty, and the binary
# refuses to start when an allowlist has no CA to verify against. The
# whole TLS block is additionally gated on the cert-manager.io/v1 CRD, so
# a cluster without cert-manager renders zero TLS objects rather than a
# Secret mount nothing satisfies (that Pod would never start and the exec
# proxy would be DOWN, not merely un-upgraded — tests/mtls-render.sh
# asserts the OFF state is COMPLETE, both halves, for exactly that
# reason).
#
# podAliasLabel (default app.kubernetes.io/name) is what keeps a SEEDED
# connection working: a Guacamole connection is a row written once and
# read on every click, so a literal DaemonSet pod name in it goes stale
# at the first rollout. The literal Pod name is still tried FIRST, and a
# workload name matching nothing is a hard 404, never a guess.
#
# 0.1.1 (qa-loop iter-7 Fix #39): canonical workload name `k8s-ws-proxy`
# regardless of release name — DaemonSet + Service + ClusterRole +
# ClusterRoleBinding all named `k8s-ws-proxy` so the catalyst-api
# shells/issue handler + qa-loop test matrix (TC-236, TC-237) can
# address them without release-name knowledge.
# 0.1.4 (Fix #39 follow-up): default imagePullSecrets to [{name:
# ghcr-pull}] so the DaemonSet can pull from private GHCR without
# per-Sovereign overlay. The `ghcr-pull` secret is the canonical
# pull-credential surface across every Sovereign (catalyst-api,
# catalyst-ui, k8s-ws-proxy all mount it).
# Note: build-k8s-ws-proxy.yaml's promote job will auto-bump this to
# 0.1.5 on merge (with the new image SHA in values.yaml). Slot pin
# at 0.1.5 so omantel reconciles against the chart that carries
# BOTH the imagePullSecrets default AND the new image SHA.
# 0.1.6 (qa-loop bounded-cycle Wave 5 Fix #78, Gap E): adds
# templates/hmac-bootstrap-job.yaml — a Helm pre-install/pre-upgrade
# hook (weight -10) that auto-generates the `k8s-ws-proxy-hmac` Secret
# from /dev/urandom when absent. Pre-this, on every fresh Sovereign
# the DaemonSet pods sat ContainerCreating forever with
# "secret k8s-ws-proxy-hmac not found" because the chart referenced
# but never created it (audit prov #7 Gap E). Idempotent on upgrade
# (preserves existing key — rotating it would invalidate every
# in-flight catalyst-api signature). build-k8s-ws-proxy.yaml's promote
# job will auto-bump this to 0.1.7 on merge with the new image SHA;
# slot pins should be lifted to 0.1.7 once that promote runs.
# 0.1.8 (qa-loop bounded-cycle Fix #95, regression of Fix #78):
# explicit hook-weight ordering for the hmac-bootstrap quartet so the
# ServiceAccount lands BEFORE the Job that references it. Fix #78 set
# SA/Role/RoleBinding=0 and Job=-10; per Helm semantics (lower weights
# run first within the same hook phase) this caused the Job to be
# applied BEFORE its SA, surfacing on prov #8 as
# `serviceaccount "k8s-ws-proxy-hmac-bootstrap" not found` →
# CrashLoopBackOff → bp-k8s-ws-proxy HR Stalled → bp-guacamole blocked.
# Fix #95 weights: SA=-20 (first), Role+RoleBinding=-15, Job=-10
# (last; preserves Fix #78 render-test gate 3a). Render gate 9 added
# in tests/render.sh asserts the four-tier ordering. build-k8s-ws-
# proxy.yaml's promote job will auto-bump to 0.1.9 with the new image
# SHA on merge; bootstrap-kit slot pins should be lifted to 0.1.9 once
# that promote runs.
# 0.1.10 (Fix #163, 2026-05-11, MIRROR-EVERYTHING): hmac-bootstrap-job
# hook image switched from curlimages/curl:8.10.1 to
# harbor.openova.io/proxy-dockerhub/curlimages/curl:8.10.1 per CLAUDE.md
# inviolable rule.
# 0.1.15 (#4961 Refs #4885 #3379): the image helper (_helpers.tpl
# bp-k8s-ws-proxy.image) now honours global.imageRegistry — host-swaps the
# leading registry segment (ghcr.io → registry.<sov-fqdn>) when set, verbatim
# ghcr.io ref when empty (byte-identical pre-cutover). Required so the
# self-sovereign-cutover step-07 registry pivot (which patches this HR's
# spec.values.global.imageRegistry) actually reaches the DaemonSet image —
# without it the literal ghcr.io ref 401s under the step-08 deny-egress hold and
# cutoverComplete stays false. Mirrors the bp-openova-flow-server.image (#4563)
# idiom. Slot-51 pin moves in lockstep. NB: build-k8s-ws-proxy.yaml's promote job
# auto-bumps this patch +1 (→ 0.1.16) with the new image SHA on merge; the slot
# pin is auto-lifted to the published version by blueprint-release (TBD-A6 hook).
version: 0.1.18
appVersion: "0.1.0"
description: |
  Catalyst-authored Blueprint chart for the k8s-ws-proxy DaemonSet —
  the per-node WebSocket exec proxy that bridges HMAC-signed upstream
  callers (catalyst-api, Guacamole) onto the local kube-apiserver
  /api/v1/.../pods/exec stream.

  Per docs/INVIOLABLE-PRINCIPLES.md the binary is shipped as a
  DaemonSet so connections stay node-local; the Service binds with
  `internalTrafficPolicy: Local` so kube-proxy routes onto the local
  pod regardless of caller.

  Default-OFF gate: `enabled: false`. Operator opts in via per-Sovereign
  overlay AND populates the SHA-pinned image tag via CI.

  See `core/cmd/k8s-ws-proxy/DESIGN.md` for the wire contract +
  failure-mode matrix.
type: application
keywords: [catalyst, blueprint, k8s, exec, websocket, daemonset]
annotations:
  # Default values render zero resources (k8sWsProxy.enabled=false).
  # The blueprint-release smoke gate honors this annotation and
  # accepts a short default render; chart/tests/render.sh covers the
  # enabled-render path with full --set overrides.
  catalyst.openova.io/smoke-render-mode: default-off
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io
dependencies:
  - name: common
    version: "0.1.3"
    repository: "https://sigstore.github.io/helm-charts"
