apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-k8s-ws-proxy
  labels:
    catalyst.openova.io/section: pts-3-3-security-and-policy
    catalyst.openova.io/category: platform
    catalyst.openova.io/tier: catalyst-cp
spec:
  version: 0.1.21
  card:
    title: k8s-ws-proxy
    category: platform
    summary: Per-node WebSocket exec proxy bridging HMAC-signed callers (catalyst-api, Guacamole) onto the local kube-apiserver pods/exec stream. DaemonSet with node-local internalTrafficPolicy.
    icon: k8s-ws-proxy.svg
  visibility: unlisted
  configSchema:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
      tmuxCascade:
        type: boolean
        default: false
        description: Wrap exec sessions in shared `catalyst-ops` tmux. Only enable on bastion nodes.
      allowedNamespaces:
        type: array
        items: { type: string }
        default: []
        description: Optional namespace allowlist. Empty = all namespaces.
  placementSchema:
    modes: [single-region]
    default: single-region
  upgrades:
    from: ["0.x"]
  manifests:
    chart: bp-k8s-ws-proxy

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive. Stateless WebSocket proxy — routing
  #   comes from Kubernetes API which Catalyst-api supplies. Switchover:
  #   bp-continuum DNS flip; new connections route to standby Pod
  #   immediately, in-flight WS sessions drop.
  topology:
    supported: [active-passive, singleton]
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: none
          mode: none
        switchover:
          mechanism: none
        placement:
          tier: ""
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ""
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  # internal-only — proxied by catalyst-api; not exposed via Gateway.
  endpoints: []

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # No direct user-facing surface; HMAC-signed upstream auth (not OIDC).
  # Realm declared for admission-webhook completeness.
  sso:
    realm: sovereign
    protocolMapper: oidc
    silentLogin: false

