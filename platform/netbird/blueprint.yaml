apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-netbird
  labels:
    catalyst.openova.io/section: pts-3-1-networking-and-service-mesh
    catalyst.openova.io/category: platform
spec:
  version: 0.1.1
  card:
    title: NetBird
    summary: WireGuard-based zero-trust mesh + remote-access overlay. Operators / engineers / customer admins enroll devices via Keycloak SSO and reach Sovereign-internal services from any laptop. Includes management + signal + coturn (TURN/STUN). One NetBird per Sovereign per ADR-0001 §11.
    icon: netbird.svg
    category: platform
  visibility: listed
  configSchema:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
        description: Default-OFF gate. Operator opts in via per-Sovereign overlay.
      domain:
        type: string
        description: Browser-facing hostname (e.g. netbird.<sovereign-fqdn>). Required when enabled.
      oidcIssuer:
        type: string
        description: Keycloak realm issuer URL. Required when enabled.
      dataStoreSize:
        type: string
        default: "5Gi"
        description: Per-Sovereign management-state PVC size.
  placementSchema:
    modes: [single-region]
    minRegions: 1
    maxRegions: 1
  upgrades:
    from: ["0.x"]
  manifests:
    chart: ./chart
  depends:
    - blueprint: bp-keycloak
      version: ^1
    - blueprint: bp-cilium
      version: ^1
    - blueprint: bp-sealed-secrets
      version: ^1
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: mgmt
          clusters:
            - mgmt-A
            - mgmt-B
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters:
            - mgmt-A
          roles:
            mgmt-A: singleton
  endpoints:
    - name: ui
      hostnameTemplate: netbird.{{.SovereignFQDN}}
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
      # #3150 — silent-SSO OIDC-init path. The NetBird dashboard is a React SPA
      # (oidc-client PKCE) that auto-starts the OIDC redirect on load when no
      # session is present, so the init path is the SPA root "/" — the dashboard
      # bounces straight to Keycloak (kc_idp_hint=catalyst-pin via the realm-config
      # IDR default-provider binding) → silent PIN re-use. NetBird is default-OFF
      # (configSchema.enabled=false) and NOT installed on hw124 — a witnessed
      # Playwright landing is required when it is first enabled to confirm the
      # SPA auto-starts (vs needing a deep-link query param).
      ssoInitPath: "/"
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  multiInstance:
    enabled: false
