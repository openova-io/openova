apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-temporal
spec:
  version: 1.1.1
  card:
    title: Temporal
    summary: Durable workflow orchestration. Code-first, language-agnostic, exactly-once execution.
    description: Temporal cluster + Web UI. Backed by Postgres (bp-cnpg) for durable state.
    icon: temporal.svg
    license: MIT
    tags: [workflow, orchestration, temporal, durable]
    docs: https://docs.temporal.io/
  visibility: listed
  class: application
  lifecycle: experimental
  configSchema:
    type: object
    properties:
      historyShards:
        type: integer
        default: 512
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-temporal
  upgrades:
    from: ["0.x"]
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-passive
    - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          tier: ''
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: ''
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: temporal.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: "{{.OrgSlug}}"
    protocolMapper: oidc
    silentLogin: true
  # ── /G117.1 ──
