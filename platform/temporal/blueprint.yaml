apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-temporal
  labels:
    catalyst.openova.io/section: pts-4-3-workflow-and-processing
spec:
  version: 1.1.1
  card:
    title: Temporal
    category: workflow
    family: orchestration
    summary: Durable workflow orchestration. Code-first, language-agnostic, exactly-once execution.
    description: Temporal cluster + Web UI. Backed by Postgres (bp-cnpg) for durable state.
    icon: temporal.svg
    license: MIT
    tags: [workflow, orchestration, temporal, durable]
    docs: https://docs.temporal.io/
  visibility: listed
  configSchema:
    type: object
    properties:
      web:
        type: object
        properties:
          enabled:
            type: boolean
            default: true
            description: Enable the Temporal Web UI.
      auth:
        type: object
        properties:
          enabled:
            type: boolean
            default: false
            description: Enable Keycloak OIDC integration via `--auth-claim-mapper`. Operator opt-in once bp-keycloak is reconciled and a realm/client exists.
      persistence:
        type: object
        properties:
          mode:
            type: string
            enum: [embedded, external]
            default: external
            description: external = Catalyst-curated CNPG Cluster (recommended); embedded = chart-bundled bitnami postgresql (dev only).
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-temporal
  upgrades:
    from: ["0.x"]
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-passive
    - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: rtz
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: temporal.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: "{{.OrgSlug}}"
    protocolMapper: oidc
    silentLogin: true
  # ── /G117.1 ──
