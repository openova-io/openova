apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-openclaw
  labels:
    catalyst.openova.io/category: ai-runtime
    catalyst.openova.io/section: pts-4-7-agentic-workspace
spec:
  version: 0.2.17
  card:
    title: OpenClaw
    summary: |
      Per-user agentic workspace for Organization tenants. A multi-tenant
      controller deployment in the Organization tenant namespace authenticates
      end users via the Organization-vcluster Keycloak realm and spawns one
      runtime pod per active session. Each runtime pod reads ONLY two
      env vars (NEWAPI_BASE_URL + NEWAPI_KEY) mounted from the per-user
      `newapi-key-{uuid}` Secret rendered by the unified-rbac user-create
      hook (ADR-0003). Identity-blind by construction.
    icon: openclaw.svg
    category: ai-runtime
    tags: [openclaw, agentic, workspace, organization, keycloak, newapi, multi-tenant, per-user-pod]
    documentation: https://github.com/openova-io/openova/blob/main/platform/openclaw/README.md
    license: Apache-2.0
  visibility: listed
  owner:
    team: ai-platform
    contact: ai-platform@openova.io
  configSchema:
    type: object
    required: [keycloak, tenant, newapi, ingress]
    properties:
      controller:
        type: object
        properties:
          replicas:
            type: integer
            default: 1
            minimum: 1
            maximum: 5
          image:
            type: object
            required: [tag]
            properties:
              tag:
                type: string
                description: SHA-pinned tag for the controller image (operator-supplied).
      keycloak:
        type: object
        required: [realmURL, clientSecretName]
        properties:
          realmURL:
            type: string
            description: Full Organization-vcluster Keycloak realm issuer URL (e.g. https://keycloak.acme.example/realms/acme).
          clientID:
            type: string
            default: openclaw
          clientSecretName:
            type: string
            description: ExternalSecret name carrying OIDC_CLIENT_SECRET.
      newapi:
        type: object
        required: [baseURL]
        properties:
          baseURL:
            type: string
            description: NewAPI customer-facing hostname (e.g. https://newapi.<otech-fqdn>).
      tenant:
        type: object
        required: [namespace]
        properties:
          namespace:
            type: string
            description: Organization tenant namespace where per-user pods are spawned and newapi-key-{uuid} Secrets are read.
      perUserPod:
        type: object
        properties:
          image:
            type: object
            required: [tag]
            properties:
              tag:
                type: string
                description: SHA-pinned tag for the runtime image (operator-supplied).
          idleTimeoutMinutes:
            type: integer
            default: 30
            minimum: 1
            maximum: 480
            description: Reaper deletes per-user pods idle for longer than this.
      ingress:
        type: object
        required: [host]
        properties:
          host:
            type: string
            description: Controller public hostname (e.g. openclaw.<org-domain>).
          tls:
            type: object
            properties:
              issuer:
                type: string
                default: letsencrypt-dns01-prod-powerdns
                description: cert-manager ClusterIssuer (DNS-01 PowerDNS — the canonical per-Org Sovereign issuer; letsencrypt-prod does not exist on a real Sovereign, #4246).
  placementSchema:
    modes: [single-region]
    default: single-region
  # Founder NS-1 placement mandate (2026-06-12): every app declares its
  # vCluster zone. OpenClaw is a TENANT-FACING workspace controller +
  # per-user runtime pods — production workload class, rtz per the
  # ARCHITECTURE §4 zone model (the audit's one undeclared app).
  # #3375 ROW-AMENDMENT (founder-adjudicate): the 2026-06-02 agreement
  # row for bp-openclaw is TBD (scaffold). The prior declaration used a
  # non-canonical `single-region` perTopology key with no `supported[]`,
  # which fails the canonical-enum gate. Pending the founder's real row,
  # this is the safe scaffold default matching bp-qa-app: singleton in
  # the rtz tier on rtz-A. See docs/topology-matrix.md §ROW-AMENDMENTS.
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          # #4375 (#4325 de-vcluster fallout): the `rtz` plane vCluster was
          # removed; per-Org apps land host-native in their OWN Org namespace
          # (#4297 keystone). Host placement = empty tier; keep the rtz-A
          # region designator (clusters/roles).
          tier: ''
          clusters:
            - rtz-A
          roles:
            rtz-A: singleton
  # #5389 — bp-openclaw is `visibility: listed` (customer-installable) and
  # chart/templates/httproute.yaml publishes a real Cilium-Gateway front door,
  # yet the Blueprint declared NO endpoints at all. Both console surfaces read
  # that list and both went dark: Handler.userUIGatePasses fails closed on an
  # empty endpoints[], so AppDetail rendered no hero Open CTA and the AppsPage
  # grid rendered no button; HandleGetLaunchURL's pickEndpoint returned nil, so
  # GET /catalyst/v1/apps/bp-openclaw/launch-url answered 404
  # endpoint-not-found. Exactly the bp-newapi row-114 defect, second instance.
  #
  # The host is the one README.md §Exposure and the org-gitops overlay agree on
  # (organization_gitops.go: owHost = console.<sub>.<parent> with the leftmost
  # label swapped to `openclaw`) — i.e. openclaw.<subdomain>.<parentDomain>,
  # which is what {{.OrgDomain}} resolves to.
  #
  # No ssoInitPath: the controller (controller/main.go rootHandler) has no
  # app-local OIDC-init route — bare `/` serves a landing page and every other
  # path requires a bearer JWT — so the launch URL uses the legacy app-root +
  # `prompt=none&kc_idp_hint=catalyst-pin` shape. Declaring a path the app does
  # not serve would trade a dark button for a 404.
  endpoints:
    - name: console
      hostnameTemplate: openclaw.{{.OrgDomain}}
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: true
  sso:
    realm: '{{.OrgSlug}}'
    protocolMapper: oidc
    groupsClaim: groups
  manifests:
    chart: ./chart
  depends:
    - blueprint: bp-newapi
      version: ^1.0
      alias: gateway
    - blueprint: bp-keycloak
      version: ^1.0
      alias: idp
    - blueprint: bp-cert-manager
      version: ^1.0
      alias: tls
  upgrades:
    from: []
  observability:
    metrics: prometheus
    logs: stdout
