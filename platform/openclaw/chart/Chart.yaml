apiVersion: v2
name: bp-openclaw
version: 0.2.15
appVersion: "0.2.0"
description: |
  Catalyst Blueprint chart for the OpenClaw workspace controller pattern
  — a multi-tenant controller deployment in an Organization tenant namespace plus
  per-user runtime pods spawned on demand. Implements decision [A] of
  epic #795 (locked) and the user-side of ADR-0003 (consumes the
  `newapi-key-{user-uuid}` Secrets rendered by the unified-rbac hook).

  Deployment shape:
    - One controller Deployment per Organization tenant namespace. Authenticates
      end users via the per-tenant Keycloak realm (OIDC) and validates
      the JWT signature + sub claim before spawning a per-user pod.
    - Per-user pods carry NEWAPI_BASE_URL + NEWAPI_KEY (plus their
      OpenAI-compatible aliases OPENAI_API_BASE / OPENAI_API_KEY +
      LLM_DEFAULT_MODEL) mounted from the per-user Secret labelled
      `catalyst.openova.io/org-user-uuid=<uuid>`. The runtime image is
      identity-blind: no Keycloak code, no key-management code.

  This chart ships ZERO upstream Helm subchart bytes — there is no
  upstream OpenClaw Helm chart. The runtime image
  (ghcr.io/openova-io/openova/openclaw-runtime) is built by the existing
  event-driven CI workflow off platform/openclaw/runtime/ and pinned by
  SHA in the consuming overlay (per Inviolable Principle 4 — never use
  floating tags in production manifests).

  Pairs with bp-newapi (per-tenant OpenAI-compatible LLM gateway),
  bp-keycloak (per-tenant realm), bp-cert-manager (per-host TLS).

  Changelog
  ─────────
  0.2.12 (2026-06-26, #4272 #4407 — controller TLS-trust: verify the PUBLIC
          LE cert on the OIDC issuer, the 4th + FINAL openclaw layer)
    - After 0.2.11 opened public-HTTPS egress so the JWKS hairpin REACHED
      auth.<fqdn>, a live re-walk found /readyz STILL 503 — now at the TLS
      handshake: `tls: failed to verify certificate: x509: certificate
      signed by unknown authority`. auth.<fqdn> serves a valid Let's Encrypt
      cert (curl from a CA-bundled pod verifies it), but the controller did
      not.
        • ROOT CAUSE (controller binary, not chart bytes): main.go
          buildAPIClient() did `tlsCfg.RootCAs = clusterPool`, REPLACING the
          system root pool with ONLY the in-cluster api-server CA (Go does
          not merge system roots once RootCAs is set). main() hands that SAME
          CA-pinned client to the OIDC verifier, so the discovery/JWKS fetch
          to the public LE-signed issuer could not be verified → /readyz 503
          forever. Masked until 0.2.6/0.2.11 egress fixes let the call reach
          the handshake.
        • THE FIX: base the trust pool on x509.SystemCertPool() (so the
          public LE roots stay trusted) and APPEND the in-cluster api-server
          CA (so api-server calls still verify) — one client trusts BOTH
          peers. Off-cluster (no SA CA file) the system pool stands alone.
          Regression unit-test: the combined pool verifies a cluster-CA-
          signed leaf AND preserves the system roots (the old replace-pool
          behaviour drops them). Controller image rebuilds on merge; the CI
          deploy-bot bumps controller.image.tag to the new SHA.
  0.2.11 (2026-06-26, #4272 — public-HTTPS egress for the JWKS hairpin: the
          TITULAR egress-NetworkPolicy gap, the LAST openclaw layer)
    - After 0.2.10 made the issuer RESOLVABLE (auth.<fqdn>/realms/sovereign), a
      live re-walk (fresh Org w4282walk) found the controller STILL 0/1 with
      /readyz 503: the issuer is correct + in-cluster-reachable, but the
      controller's CILIUM egress allowed ONLY the kube-apiserver entity, so the
      /readyz `ensureKeys` JWKS fetch to the PUBLIC auth.<fqdn> host (console-ELB
      EIP, hairpinned back through the in-cluster Cilium Gateway on :443) was
      egress-denied → 503 forever. This is the "NetworkPolicy assumption" in
      #4272's own title — the final layer the prior two fixes (#4397 secret,
      #4399 issuer) exposed.
        • ROOT CAUSE: the companion CiliumNetworkPolicy
          (cilium-ingress-networkpolicy.yaml) already attaches an `egress` block
          (kube-apiserver entity, 0.2.6). On Cilium, the moment a CNP attaches
          ANY egress rule to an endpoint, that endpoint's egress is
          CNP-enforced. The K8s NetworkPolicy's `ipBlock 0.0.0.0/0 :443` rule
          (networkpolicy.yaml `allowPublicHttps`) does NOT match the reserved
          identities the JWKS hairpin carries — `world` for the external EIP,
          `cluster`/`host`/`remote-node` for the gateway bounce — the exact
          `policy-cidr-match-mode: ""` behaviour documented in
          platform/external-dns/chart/templates/ciliumnetworkpolicy.yaml. So the
          K8s NP world-:443 egress is INERT for the hairpin once the CNP egress
          block exists.
        • THE FIX: add a `toEntities` :443 egress to the CNP over the SAME
          identity set the products/catalyst baseline-cilium-gateway allow-world
          CNP admits (world + cluster + host + remote-node), covering BOTH the
          genuine-external resolution AND the in-cluster gateway hairpin. Gated
          on the new `networkPolicy.egress.allowPublicHttps` (default true) +
          `publicHttpsEntities` / `publicHttpsPort`; the template now emits the
          CNP `egress:` block when EITHER the apiserver OR the public-HTTPS rule
          is enabled, each independently gated, still behind the cilium.io/v2
          Capabilities check (CRD-less kind CI unaffected). The funnel generator
          (core/services/provisioning/gitops generateOpenClawHR) now stamps
          `networkPolicy.egress.allowPublicHttps: true` explicitly so a funnel
          openclaw renders the carve-out independent of any chart-default flip.
  0.2.10 (2026-06-26, #4272 — resolvable OIDC issuer when per-Org realm OFF)
    - DOC-ONLY chart change paired with the provisioning-layer fix that
      stops the funnel generator emitting an UNRESOLVABLE OIDC issuer. After
      0.2.9 let the controller Pod START on a per-Org-realm-disabled Org, a
      live re-walk found /readyz still 503: the funnel overlay set
      `oidc.issuerURL` to the PER-ORG realm host
      `https://keycloak.<slug>.<parent>/realms/org-<slug>`, but per-Org realms
      are disabled on the Sovereign (CATALYST_PER_ORG_REALM_ENABLED=false) → no
      such bp-keycloak host exists → that hostname is NXDOMAIN. The controller's
      /readyz handler runs the JWKS `ensureKeys` fetch against the issuer's
      `.well-known/openid-configuration`; an NXDOMAIN issuer fails the fetch →
      /readyz 503 forever → openclaw.<slug>/ serves public HTTP 503.
        • THE FIX (provisioning layer, not chart bytes): the funnel generator
          (core/services/provisioning/gitops) now points the issuer at the
          RESOLVABLE shared realm `https://auth.<sovereign-fqdn>/realms/sovereign`
          — the SAME live issuer the console + every other Sovereign app uses —
          whenever SOVEREIGN_FQDN is set. Its discovery + JWKS endpoints are
          live, so ensureKeys succeeds and /readyz returns 200. The shared-realm
          host/name come from the Sovereign config (SOVEREIGN_FQDN +
          CATALYST_KC_REALM, default `sovereign`), never hardcoded. Empty
          SOVEREIGN_FQDN (Catalyst-Zero / a cluster that DOES run per-Org
          realms) falls back to the per-Org realm host (NO-REGRESS).
        • The chart's `oidc.issuerURL` value is unchanged — it has always been
          the overlay-supplied issuer; the controller's /readyz JWKS gate is
          unchanged. NOTE: OIDC *login* additionally needs openclaw's client
          registered in the shared realm (the 0.2.9 self-gen secret + this
          resolvable issuer get the Pod to /readyz-200; full login-client
          registration in the shared realm is follow-up beyond the #4272
          /readyz-200 acceptance).
  0.2.9 (2026-06-26, #4272 #4307 — FINAL gate)
    - Self-generate the per-Org OIDC client_secret + make the controller's
      OIDC secretKeyRef optional, so the controller Pod STARTS on a funnel
      Org where CATALYST_PER_ORG_REALM_ENABLED=false (the intentional
      default → no per-Org bp-keycloak realm → the authoritative
      `openclaw-oidc-client-secret` Secret is never created → the required
      OIDC_CLIENT_SECRET secretKeyRef → CreateContainerConfigError → Pod
      never started; the live #4272/#4307 final blocker on a cart Org).
        • New templates/oidc-client-secret.yaml: lookup-or-generate the
          client_secret Secret (mirrors bp-wordpress-tenant sso-secret.yaml),
          emitting BOTH `OIDC_CLIENT_SECRET` + `client-secret` keys with
          helm.sh/resource-policy: keep so bp-keycloak's
          configmap-tenant-realm.yaml (when a per-Org realm IS installed) can
          land the authoritative bytes without either side clobbering the
          other. Gated on new value `oidc.selfSignClientSecret` (default true).
        • controller-deployment.yaml: OIDC_CLIENT_SECRET / KEYCLOAK_CLIENT_
          SECRET secretKeyRefs now `optional: true` so the Pod schedules in
          the pre-seed window (matches the already-optional LLM apiKey refs);
          /readyz still gates real OIDC reachability so SSO correctness holds.
  0.2.6 (2026-06-25, #4272)
    - Add in-cluster Kubernetes API egress for the controller pod-reaper.
      Even after 0.2.5 (public-host JWKS :443) + #4300, the controller
      stayed 0/1 on a fresh Org with `reaper: list pods 10.96.0.1:443
      context deadline exceeded`. Root cause: the reaper dials the
      `kubernetes.default` ClusterIP (10.96.0.1:443), which Cilium
      classifies as the reserved `kube-apiserver` ENTITY — no K8s
      NetworkPolicy selector (podSelector / namespaceSelector / ipBlock,
      even 0.0.0.0/0 EXCLUDES it) can express it, so the K8s NP's
      kube-system :443 rule did NOT admit it → every apiserver call
      default-denied → never Ready.
        • cilium-ingress-networkpolicy.yaml: add an `egress` block with
          `toEntities: [kube-apiserver]` → :443/:6443 (the canonical idiom
          from platform/sso-bridge cilium-networkpolicy-apiserver.yaml). The
          CNP now opens BOTH the ingress (gateway + kubelet probe) AND the
          egress (apiserver) reserved-entity hops; each half is independently
          gated (`networkPolicy.ingress.allowGatewayEntity` /
          `networkPolicy.egress.allowApiserverEntity`, both default true) and
          the whole template stays gated on the cilium.io/v2 Capabilities
          check (CRD-less kind CI installs unaffected).
  0.2.5 (2026-06-25, #4272)
    - Rework NetworkPolicy + exposure for the Cilium-Gateway Sovereign
      topology (was traefik + separate-keycloak-namespace). The controller
      ran but stayed 0/1 (not Ready) because its /readyz handler gates on
      OIDC-JWKS reachability and the issuer is the PUBLIC host
      (https://keycloak.<org>.<pool>/realms/org-<org>) — that JWKS fetch
      hairpins out to the console-ELB EIP and back through the Cilium
      Gateway on :443, but the old K8s NetworkPolicy only allowed :443 to
      kube-system and :8443 to a separate `keycloak` namespace → JWKS
      egress-denied → readyz 503 → never Ready.
        • K8s NetworkPolicy: add public-host HTTPS egress
          (`networkPolicy.controller.egress.allowPublicHttps`, default true,
          :443 to 0.0.0.0/0 with optional CIDR `except`) for the JWKS
          hairpin; ingress `fromNamespaceLabels` now defaults EMPTY (the
          dead traefik-namespace rule is gone — the gateway hop is a
          reserved entity no K8s selector can express).
        • New CiliumNetworkPolicy (cilium-ingress-networkpolicy.yaml):
          `fromEntities:[ingress,host,remote-node]` → controller :8080,
          admitting BOTH the Cilium Gateway Envoy (`ingress`) and the
          kubelet readiness/liveness probe (`host`/`remote-node`). Gated on
          the cilium.io/v2 Capabilities check + `networkPolicy.ingress.
          allowGatewayEntity` (default true). Mirrors bp-agenity (#4180) +
          bp-newapi (#3374).
        • New HTTPRoute (httproute.yaml) on `cilium-gateway-console`/
          kube-system (wildcard `*.<pool>` TLS listener ⇒ no per-host cert),
          replacing the INERT traefik Ingress. `httpRoute.enabled` default
          false; `ingress.enabled` flipped to default false (the traefik
          Ingress is never reconciled on a Sovereign and its `openclaw-tls`
          Certificate sits False forever). assertNoPlaceholders no longer
          trips on `ingress.host` when the Ingress is disabled.
  0.2.4 (2026-06-24, #4246)
    - Add `imagePullSecrets: [ghcr-pull]` (new top-level `imagePullSecrets`
      value) to the controller Deployment AND the per-user-pod template.
      The controller (`openclaw-controller`) + per-user-pod (`openclaw-
      runtime`) images live under the PRIVATE
      `ghcr.io/openova-io/openova/*` path; without a pull credential the
      kubelet pulled them anonymously → `401 Unauthorized` → ImagePullBackOff
      so the per-Org bp-openclaw HR never converged. The `ghcr-pull` Secret
      is reflected into every per-Org namespace (see cloud-init `org-.*`
      reflector match, #4246). Overlays may override/clear `imagePullSecrets`.
  0.2.0 (2026-05-05, umbrella #915)
    - Add canonical `oidc.{issuerURL,clientId,clientSecret}` block
      (per-tenant Keycloak SSO).
    - Add canonical `llm.{baseURL,apiKey,defaultModel}` block
      (per-tenant NewAPI as OpenAI-compatible LLM gateway).
    - Controller now emits OIDC_*, LLM_*, OPENAI_API_{BASE,KEY},
      LLM_DEFAULT_MODEL envs (legacy KEYCLOAK_*/NEWAPI_BASE_URL_DEFAULT
      retained for back-compat).
    - Per-user pods now also carry OPENAI_API_BASE / OPENAI_API_KEY /
      LLM_DEFAULT_MODEL.
    - Legacy `keycloak.*` / `newapi.*` keys remain as fallbacks.
  0.1.0 (2026-04, epic #795)
    - Initial chart: controller Deployment + per-user pod ConfigMap.
type: application
keywords: [catalyst, blueprint, openclaw, organization, workspace-controller, per-user-pod, llm, agent]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io
# No upstream Helm chart — every byte of this Blueprint is Catalyst-
# authored. The blueprint-release workflow's hollow-chart guard
# (issue #181) requires either a `dependencies:` block OR this
# annotation; we use the annotation. The runtime container image is a
# separate OCI artifact built via .github/workflows/openclaw-runtime.yaml
# (event-driven on push to platform/openclaw/runtime/**), not a Helm
# subchart.
annotations:
  catalyst.openova.io/no-upstream: "true"
  catalyst.openova.io/depends-on: "bp-newapi,bp-keycloak,bp-cert-manager"
  catalyst.openova.io/owner-epic: "795"
  catalyst.openova.io/adr: "0003"
