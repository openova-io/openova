# bp-openclaw values.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every
# operationally-meaningful value is configurable; cluster overlays in
# clusters/<sovereign>/bootstrap-kit/ may override any of these without
# rebuilding the Blueprint OCI artifact.
#
# Required at install time (overlay MUST set):
#   - oidc.issuerURL             (per-tenant Keycloak realm OIDC issuer)
#   - oidc.clientSecret.name     (ExternalSecret with OIDC client_secret)
#   - llm.baseURL                (per-tenant NewAPI OpenAI-compatible endpoint)
#   - llm.apiKey.name            (Secret carrying NewAPI bearer token)
#   - tenant.namespace           (Organization tenant namespace where per-user pods run)
#   - ingress.host               (controller public hostname)
#   - controller.image.tag       (SHA-pinned tag)
#   - perUserPod.image.tag       (SHA-pinned tag)
#
# Legacy keys `keycloak.*` and `newapi.*` remain accepted for back-compat
# (they fall back when the canonical `oidc.*` / `llm.*` block omits a
# field); new overlays SHOULD use the canonical blocks. See umbrella
# epic #915 (per-tenant SSO + per-tenant NewAPI gateway DoD).
#
# Placeholder defaults below let `helm template` smoke-render cleanly in
# CI without --set (mirroring the bp-self-sovereign-cutover pattern).
# Runtime use with the placeholder values is non-functional by design;
# the chart's integration tests + deploy-time validation enforce real
# values on actual installs.

catalystBlueprint:
  upstream:
    chart: "" # scratch chart — no upstream Helm chart
    version: ""
    repo: ""
    images:
      controller: "ghcr.io/openova-io/openova/openclaw-controller"
      runtime: "ghcr.io/openova-io/openova/openclaw-runtime"
# When `true`, _helpers.tpl :: assertNoPlaceholders fails render with a
# helpful error if any placeholder default is still in place. Per-cluster
# Flux overlays MUST set this to `true` so a bad overlay (forgot to set
# tenant.namespace, etc.) fails install fast instead of installing a
# non-functional release. Default `false` so CI's helm-template smoke
# render passes (the smoke run uses defaults — placeholders are valid
# bytes for render-time syntax checks but non-functional at runtime).
assertNoPlaceholders: false
# ─── Image pull secrets (#4246) ──────────────────────────────────────────
# The controller + per-user-pod images live under the PRIVATE
# `ghcr.io/openova-io/openova/*` registry path, so every Pod that runs them
# MUST present a dockerconfigjson pull credential. On a Sovereign the
# `ghcr-pull` Secret is seeded in flux-system by cloud-init and reflected
# into every per-Org namespace via the emberstack reflector (`org-.*`
# match, #4246). Without these `imagePullSecrets` the kubelet falls back to
# an anonymous pull → `failed to fetch anonymous token … 401 Unauthorized`
# → ImagePullBackOff (bp-openclaw never converged on the demo Org). Default
# to the canonical `ghcr-pull` name; an overlay may override or clear it for
# clusters that mirror these images into a pull-through cache.
imagePullSecrets:
  - name: ghcr-pull
# ─── Controller (multi-tenant) ───────────────────────────────────────────
controller:
  enabled: true
  replicas: 1
  image:
    # Operator-supplied SHA tag at install time. Placeholder default lets
    # smoke render pass; real installs MUST override (per Inviolable
    # Principle 4 — no floating tags in production).
    repository: ghcr.io/openova-io/openova/openclaw-controller
    tag: "7ade865" # OVERRIDE on install with SHA-pinned tag
    pullPolicy: IfNotPresent
  port: 8080
  # #4389/#4292: per-Org LimitRange maxLimitRequestRatio {cpu:1,memory:1}
  # rejects Burstable pods (a funnel Org's boundary forces Guaranteed QoS).
  # Render requests==limits so the controller pod is admitted.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  probes:
    liveness:
      path: /healthz
      port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /readyz
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
# ─── Auth: per-tenant Keycloak (OIDC) — canonical block ─────────────────
# The controller validates inbound end-user JWTs against the Organization's own
# Keycloak realm. It NEVER uses the OTECH-ops realm, NEVER trusts a JWT
# from outside the Organization vcluster.
#
# Per umbrella epic #915 the orchestrator (catalyst-api smeTenantBPOpenClaw
# template) emits this block per-tenant: `oidc.issuerURL` resolves to
# https://keycloak.<tenant-domain>/realms/<tenant>, `oidc.clientId` to
# `openclaw`, and `oidc.clientSecret.name` to the per-tenant Keycloak
# client-secret (Secret rendered by bp-keycloak post-install).
oidc:
  # Required at install time: full realm issuer URL (the OIDC `iss` claim
  # the controller will validate JWTs against). Placeholder default lets
  # `helm template` smoke-render pass.
  issuerURL: "https://keycloak.example.local/realms/example"
  # OIDC client registered in the per-tenant Keycloak realm.
  clientId: "openclaw"
  # OIDC client_secret. Loaded from a K8s Secret via secretKeyRef so the
  # plaintext NEVER lands in the HelmRelease values block (Inviolable
  # Principle 10 — credential hygiene). Required Secret key:
  # OIDC_CLIENT_SECRET. Provisioned by the Organization-tenant onboarding pipeline
  # (epic #795 ticket #804).
  clientSecret:
    # Secret name (defaults to legacy `keycloak.clientSecretName` if
    # unset — see _helpers.tpl).
    name: "openclaw-oidc"
    key: "OIDC_CLIENT_SECRET"
  # #4272/#4307 (FINAL gate): chart-side lookup-or-generate of the OIDC
  # client_secret Secret (templates/oidc-client-secret.yaml). On a funnel
  # Org (or any Org where CATALYST_PER_ORG_REALM_ENABLED=false) NO per-Org
  # bp-keycloak realm is installed, so the authoritative
  # `openclaw-oidc-client-secret` Secret that bp-keycloak's
  # configmap-tenant-realm.yaml would emit is never created → the controller
  # Pod's required OIDC_CLIENT_SECRET secretKeyRef → CreateContainerConfigError.
  # Default ON: self-generate a stable client_secret so the Pod starts
  # zero-touch. When the authoritative realm-config DOES seed the Secret it
  # wins (both carry helm.sh/resource-policy: keep + lookup-or-generate, so
  # this fallback re-emits the existing bytes — a no-op). An overlay whose
  # realm-config is guaranteed to seed first may set this false.
  selfSignClientSecret: true
# ─── LLM gateway: per-tenant NewAPI ─────────────────────────────────────
# OpenClaw uses the per-tenant NewAPI as its OpenAI-compatible LLM
# gateway (NOT direct OpenAI). The orchestrator points this at
# https://api.<tenant-domain>/v1; NewAPI then routes to the configured
# channel (e.g. a partner-hosted Qwen — wired by C4 of #915).
#
# Per ADR-0003 §3.3 each end-user has a per-user Secret rendered by
# the unified-rbac hook carrying `base-url` + `api-key`; per-user pods
# read those at session-start. The chart-level `llm.*` block carries the
# CONTROLLER-side defaults (used for /readyz probes, fallback when the
# per-user Secret is missing the field, and for the OpenAI-compatible
# `LLM_DEFAULT_MODEL` env that NewAPI maps to a channel).
llm:
  # Required at install time. The customer-facing OpenAI-compatible
  # endpoint (i.e. NewAPI's /v1 surface). Placeholder default lets
  # smoke render pass.
  baseURL: "https://newapi.example.local/v1"
  # Bearer token sourced from a K8s Secret (Inviolable Principle 10).
  # Required Secret key: NEWAPI_KEY (or `api-key` for ADR-0003-aligned
  # per-user secrets). Per-user pods continue to read the per-user
  # `newapi-key-{uuid}` Secret per ADR-0003 §3.3; this controller-side
  # secret is the controller's own service-token (used for /readyz
  # probes and for any controller-side LLM call that pre-dates a user
  # session).
  apiKey:
    name: "openclaw-llm-apikey"
    key: "NEWAPI_KEY"
  # The default OpenAI-compatible model identifier sent on /v1/chat/
  # completions when the client doesn't override. NewAPI uses the
  # `model` field to select a channel; for the umbrella #915 DoD this
  # is "qwen3.6" — C4 wires the partner-hosted channel routing at
  # tenant-create time.
  defaultModel: "qwen3.6"
# ─── Legacy aliases (back-compat, deprecated) ───────────────────────────
# Old overlays may still set `keycloak.*` / `newapi.*`. The chart's
# helpers prefer `oidc.*` / `llm.*` and fall back to these when the
# canonical block is unset (or still at placeholder). Removed once every
# overlay has migrated.
keycloak:
  realmURL: ""
  clientID: ""
  clientSecretName: ""
newapi:
  baseURL: ""
# ─── Tenant namespace ────────────────────────────────────────────────────
# Organization tenant namespace where:
#   - per-user pods are created and deleted
#   - newapi-key-{uuid} Secrets are read by the controller's ServiceAccount
tenant:
  # Required at install time. Placeholder default lets smoke render pass.
  namespace: "org-example"
# ─── Per-user pod template ───────────────────────────────────────────────
# These values are baked into a ConfigMap; the controller renders the
# pod-spec at session-start time, substituting NEWAPI_KEY (Secret ref)
# and NEWAPI_BASE_URL (env value).
perUserPod:
  image:
    repository: ghcr.io/openova-io/openova/openclaw-runtime
    tag: "34ff594" # OVERRIDE on install with SHA-pinned tag
    pullPolicy: IfNotPresent
  # #4389/#4292: Guaranteed QoS for the per-Org LimitRange.
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # Idle-session reaper — controller deletes the per-user pod after
  # this many minutes without inbound traffic. Default 30 minutes.
  idleTimeoutMinutes: 30
  # Optional extra env vars baked into every per-user pod (operator
  # overlay may extend, e.g. for HTTP proxy, telemetry endpoint, etc.).
  extraEnv: []
# ─── Service ─────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
# ─── ServiceAccount ──────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
# ─── Ingress (traefik, NON-Sovereign only) ───────────────────────────────
# DEFAULT OFF (#4272). A Sovereign runs the Cilium Gateway API, NOT traefik —
# a `networking.k8s.io/v1` Ingress is INERT there (never reconciled) and its
# per-host `openclaw-tls` Certificate sits False forever (no HTTP-01 solver).
# Public exposure on a Sovereign is the `httpRoute` block below. Operators on a
# non-Cilium cluster that genuinely runs traefik may set ingress.enabled=true.
ingress:
  enabled: false
  className: "traefik"
  # Required when ingress.enabled=true. Placeholder default lets smoke render.
  host: "openclaw.example.local"
  tls:
    enabled: true
    # DNS-01 PowerDNS ClusterIssuer — the canonical per-Org issuer on every
    # Sovereign (#4246). `letsencrypt-prod` does NOT exist on a real
    # Sovereign and the Cilium-gateway Sovereign wires no per-host HTTP-01
    # solver, so DNS-01 is required.
    issuer: "letsencrypt-dns01-prod-powerdns" # cert-manager ClusterIssuer
    secretName: "openclaw-tls"
  annotations: {}
# ─── HTTPRoute (Cilium Gateway API — the Sovereign exposure) ──────────────
# #4272: the canonical per-Org HTTP exposure on a Sovereign. Attaches the
# controller's public host to the DEDICATED console Gateway whose `*.<pool>`
# wildcard TLS listener terminates TLS (so NO per-host Certificate is needed),
# mirroring products/agenity (#4180) + platform/keycloak. Default OFF so smoke
# render passes without a host; the org-gitops overlay sets enabled + hostnames.
httpRoute:
  enabled: false
  # Per-Org host(s) — e.g. [openclaw.<slug>.<pool>]. Empty ⇒ template renders
  # nothing (the guard fails closed, matching the agenity pattern).
  hostnames: []
  parentRef:
    # console-isolation (#4054/#4070): openclaw.<slug>.<pool> resolves to the
    # dedicated console-ELB EIP fronting the ISOLATED cilium-gateway-console
    # (NOT the apps cilium-gateway). The console Gateway carries the *.<pool>
    # wildcard TLS listener so TLS terminates on the wildcard cert; parenting
    # the apps gateway → envoy 404 on the console ELB.
    name: "cilium-gateway-console"
    namespace: "kube-system"
    # sectionName omitted by default — the console Gateway exposes a single
    # apex-bound HTTPS listener per Org zone, matched by the hostname filter.
    sectionName: ""
  # Backend path prefix (the controller serves the UI/API at /).
  path: "/"
# ─── NetworkPolicy ───────────────────────────────────────────────────────
# K8s NetworkPolicy (Pod-selectable hops) + a companion CiliumNetworkPolicy
# (cilium-ingress-networkpolicy.yaml) for the reserved-ENTITY hops that NO K8s
# selector can express. Controller egress:
#   - K8s api-server (pod create/delete; kube-system endpoint) + DNS
#   - in-cluster Keycloak Service (when the issuer is in-cluster)
#   - public-host HTTPS (the /readyz OIDC-JWKS hairpin to the Cilium Gateway
#     on :443 — #4272; the issuer is the PUBLIC host so it cannot use the
#     in-cluster Service name)
#   - per-user pod range in tenant namespace (proxy WebSocket/SSE)
# Controller ingress:
#   - Cilium Gateway Envoy (`ingress` entity) + kubelet probe (`host` /
#     `remote-node` entities) — admitted by the CNP, NOT the K8s NP
#     (#4272 — reserved entities are not Pod-selectable).
# Controller egress (reserved-entity, CNP-only):
#   - in-cluster Kubernetes API (`kube-apiserver` entity, 10.96.0.1:443) —
#     the pod-reaper hop; the K8s NP kube-system :443 rule does NOT match the
#     apiserver entity, so it MUST be admitted by the CNP toEntities carve-out
#     (#4272 — else `reaper: list pods 10.96.0.1:443 context deadline exceeded`
#     keeps the controller 0/1, beyond the #4300 public-host JWKS :443 fix).
# Per-user pods receive their NetworkPolicy from a controller-rendered
# template at session-start, NOT from this chart.
networkPolicy:
  enabled: true
  # Cilium-Gateway awareness (#4272). The CNP fromEntities carve-out admits
  # the gateway + kubelet-probe hops the K8s NP cannot select.
  ingress:
    # Emit the CiliumNetworkPolicy fromEntities carve-out. Default ON (a
    # Sovereign needs it). A non-Cilium overlay (e.g. kind CI w/o the CRD, or
    # a traefik cluster) can set this false — the template is also gated on the
    # cilium.io/v2 Capabilities check so it never breaks CRD-less installs.
    allowGatewayEntity: true
    # Reserved entities admitted to the controller :8080:
    #   - ingress      : the Cilium Gateway Envoy (public hop)
    #   - host         : the kubelet readiness/liveness probe (same node)
    #   - remote-node   : the kubelet probe when scheduled on another node
    gatewayEntities:
      - ingress
      - host
      - remote-node
  # Reserved-ENTITY EGRESS (#4272). The controller's pod-reaper + every
  # apiserver call (list/create/delete per-user pods, get/list Secrets) dials
  # the in-cluster Kubernetes API at the `kubernetes.default` ClusterIP
  # (10.96.0.1:443). Cilium classifies that destination as the reserved
  # `kube-apiserver` ENTITY — no K8s NetworkPolicy selector can express it
  # (even ipBlock 0.0.0.0/0 EXCLUDES it), so the K8s NP's kube-system :443
  # rule does NOT admit it → `reaper: list pods 10.96.0.1:443 context deadline
  # exceeded` → the controller never becomes Ready (0/1). The companion CNP
  # opens this hop additively. #4300 fixed the public-host JWKS :443 egress
  # but left this in-cluster-API hop denied — this knob closes that gap.
  egress:
    # Emit the CiliumNetworkPolicy toEntities egress carve-out for the
    # apiserver. Default ON (a Sovereign needs it). A non-Cilium overlay can
    # set this false — the template is also gated on the cilium.io/v2
    # Capabilities check so it never breaks CRD-less installs.
    allowApiserverEntity: true
    # Reserved entities the controller may egress to. `kube-apiserver` is the
    # canonical entity for the in-cluster API (10.96.0.1:443) on both a k3s
    # host-process apiserver and a managed cluster.
    apiserverEntities:
      - kube-apiserver
    # Ports the apiserver listens on. 443 is the in-cluster `kubernetes`
    # Service port; 6443 covers k3s/embedded apiservers fronted directly.
    apiserverPorts:
      - "443"
      - "6443"
    # ── Public-host HTTPS egress, CNP layer (the TITULAR #4272 gap) ────────
    # The controller's /readyz fetches the OIDC issuer's JWKS at the PUBLIC
    # host (https://auth.<fqdn>/realms/<realm> on a Sovereign whose per-Org
    # realm is disabled — the SAME issuer the console resolves, #4399). That
    # host resolves to the console-ELB EIP, so the fetch hairpins OUT to the
    # EIP and BACK IN through the in-cluster Cilium Gateway on :443. The K8s
    # NetworkPolicy already allows `ipBlock 0.0.0.0/0 :443` — but the moment
    # THIS CNP attaches an `egress` block to the controller endpoint (for the
    # apiserver hop above), Cilium makes the controller's egress CNP-enforced,
    # and an `ipBlock 0.0.0.0/0` rule does NOT match the reserved identities
    # the hairpin carries (`world` for the genuine-external EIP, but
    # `cluster`/`host`/`remote-node` for the gateway bounce — the exact
    # `policy-cidr-match-mode: ""` behaviour documented in
    # platform/external-dns/chart/templates/ciliumnetworkpolicy.yaml). So the
    # JWKS hairpin is egress-denied → `ensureKeys` fails → /readyz 503 → the
    # controller stays 0/1 forever. THIS is the LAST openclaw layer (#4272).
    #
    # The canonical Cilium expression is a `toEntities` :443 egress over the
    # SAME identity set the baseline-cilium-gateway allow-world CNP admits
    # (world + cluster + host + remote-node), so both the genuine-external
    # resolution AND the in-cluster gateway hairpin are covered. Default ON (a
    # Sovereign needs it). Set false on a fully in-cluster overlay whose
    # issuer resolves to an in-namespace Keycloak Service.
    allowPublicHttps: true
    # Reserved entities the controller may egress to on the public-HTTPS port.
    # `world` covers the genuine external EIP; `cluster`/`host`/`remote-node`
    # cover the JWKS hairpin bounced back through the in-cluster Cilium Gateway
    # (the reserved-identity hop no ipBlock can express). Mirrors the allow-set
    # in products/catalyst baseline-cilium-gateway.yaml.
    publicHttpsEntities:
      - world
      - cluster
      - host
      - remote-node
    # Port the public OIDC issuer (auth.<fqdn>) terminates TLS on. 443 is the
    # console-ELB / Cilium-Gateway HTTPS listener.
    publicHttpsPort: 443
  controller:
    ingress:
      # K8s namespace-selector ingress. EMPTY on a Sovereign — the gateway hop
      # is the reserved `ingress` entity (admitted by the CNP above), and a
      # traefik-namespace rule would be a dead no-op. A genuine-traefik overlay
      # may set {kubernetes.io/metadata.name: traefik} here.
      fromNamespaceLabels: {}
    # Egress targets — operator may extend if Organization-vcluster Keycloak
    # reaches the controller via a different namespace label.
    egress:
      keycloakNamespaceLabel: "keycloak"
      keycloakPort: 8443
      # Public-host HTTPS egress for the /readyz OIDC-JWKS hairpin (#4272).
      # The controller's OIDC issuer is the PUBLIC host so the JWKS fetch
      # hairpins out to the console-ELB EIP and back through the Cilium Gateway
      # on :443. No Pod selector can name an external EIP ⇒ egress to the world
      # on :443 is required, else readyz 503 → never Ready. Set false on a
      # fully in-cluster overlay whose issuer is an in-namespace Service.
      allowPublicHttps: true
      publicHttpsPort: 443
      # Optional CIDR exclusions (e.g. lock down to the console-ELB EIP /32 on
      # a hardened overlay). Empty ⇒ the whole 0.0.0.0/0 :443 is permitted.
      publicHttpsExcept: []
# ─── ServiceMonitor ──────────────────────────────────────────────────────
# Default false per docs/BLUEPRINT-AUTHORING.md §11.2 (Observability
# toggles must default false). Operator opts in via per-cluster overlay
# once kube-prometheus-stack reconciles.
serviceMonitor:
  enabled: false
  interval: "30s"
  scrapeTimeout: "10s"
  path: "/metrics"
  labels: {}
