{{- /*
oidc-client-secret.yaml — chart-side lookup-or-generate of the per-Org
OpenClaw OIDC client_secret (#4272 / #4307 — FINAL gate).

WHY THIS EXISTS — the per-Org-realm-disabled gap.

On a Sovereign the canonical source of this Secret is bp-keycloak's
`configmap-tenant-realm.yaml`, which find-or-generates a confidential
`openclaw` client in the per-Org realm and emits a K8s Secret named
`openclaw-oidc-client-secret` carrying the `OIDC_CLIENT_SECRET` key. BUT
that template runs ONLY when a per-Org bp-keycloak realm is installed for
the Org — which the funnel/generic path SKIPS, and which the
org-controller's per-Org-realm auto-wiring also skips when
`CATALYST_PER_ORG_REALM_ENABLED=false` (the intentional default). With no
per-Org realm, the Secret is NEVER created → the controller Deployment's
`OIDC_CLIENT_SECRET` secretKeyRef (required) → `CreateContainerConfigError`
→ the Pod never starts (the live #4272/#4307 final blocker on a funnel Org).

THE FIX — mirror bp-wordpress-tenant's `sso-secret.yaml`: a `lookup`-or-
generate fallback so a fresh funnel Org WITHOUT a per-Org bp-keycloak realm
still gets a stable `openclaw-oidc-client-secret` and the controller Pod
starts. When bp-keycloak's `configmap-tenant-realm.yaml` (or an
ExternalSecret) later lands the REAL client_secret bytes, this template MUST
NOT clobber them — hence the `lookup` fallback + `helm.sh/resource-policy:
keep`: on every reconcile we read the existing Secret bytes and re-emit
them, so the chart upgrade is a no-op once the Secret is populated by the
authoritative realm-config. Both templates use `resource-policy: keep`, so
neither yanks the Secret out from under the other.

Emits BOTH keys (`OIDC_CLIENT_SECRET` + `client-secret`) to match the
bp-keycloak realm-config Secret shape exactly, so a later realm-config
upgrade reads the existing bytes back (its lookup keys off `client-secret`)
and stays a no-op.

Gated OFF when `oidc.selfSignClientSecret=false` (an operator overlay whose
realm-config is guaranteed to seed the Secret first may disable the chart-
side fallback). Default ON so the zero-touch funnel path converges.
*/}}
{{- if .Values.oidc.selfSignClientSecret }}
{{- $secretName := include "bp-openclaw.oidc.clientSecretName" . -}}
{{- $secretKey := include "bp-openclaw.oidc.clientSecretKey" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $clientSecret := "" -}}
{{- if $existing -}}
{{- /* Prefer the authoritative key the deployment reads; fall back to the
       realm-config's `client-secret` key so an upgrade after the realm-config
       has populated the Secret re-emits the SAME bytes (no drift). */ -}}
{{- $clientSecret = index $existing.data $secretKey | default (index $existing.data "client-secret") | default "" | b64dec -}}
{{- end -}}
{{- if not $clientSecret -}}
{{- $clientSecret = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-openclaw.labels" . | nindent 4 }}
    catalyst.openova.io/sso-client-secret: "true"
    catalyst.openova.io/oidc-client: openclaw
  annotations:
    # keep so a `helm uninstall` (or a paused realm-config reconcile) doesn't
    # yank the Secret out from under a still-running controller / realm import.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $secretKey }}: {{ $clientSecret | quote }}
  client-secret: {{ $clientSecret | quote }}
{{- end }}
