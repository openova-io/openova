apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-spire
  labels:
    catalyst.openova.io/section: pts-2-3-per-sovereign-supporting-services
spec:
  version: 1.1.7
  card:
    title: spire
    summary: SPIFFE/SPIRE workload identity. 5-min rotating SVIDs. Server on mgt cluster + agent per host cluster.
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  manifests:
    chart: ./chart
  depends: []
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: mgmt
          clusters:
            - mgmt-A
            - mgmt-B
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters:
            - mgmt-A
          roles:
            mgmt-A: singleton
  multiInstance:
    enabled: false
