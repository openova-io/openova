apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-kserve
spec:
  version: 1.0.0
  card:
    title: KServe
    summary: "Kubernetes-native model serving — InferenceService CRD, multi- framework predictors (vLLM, TorchServe, Triton, SKLearn), inference graphs. Wraps the upstream `kserve/kserve` chart and ships a Catalyst-curated `RawDeployment` mode (no per-InferenceService Knative Service hop by default — KServe writes Deployments directly), with **Knative still installed** (via bp-knative) for Application-tier Blueprints that opt in to scale-to-zero on a per- InferenceService basis. Used by bp-cortex (composite AI Hub Blueprint). "
    description: "Kubernetes-native model serving — InferenceService CRD, multi- framework predictors (vLLM, TorchServe, Triton, SKLearn), inference graphs. Wraps the upstream `kserve/kserve` chart and ships a Catalyst-curated `RawDeployment` mode (no per-InferenceService Knative Service hop by default — KServe writes Deployments directly), with **Knative still installed** (via bp-knative) for Application-tier Blueprints that opt in to scale-to-zero on a per- InferenceService basis. Used by bp-cortex (composite AI Hub Blueprint). "
    icon: kserve.svg
  visibility: unlisted              # bootstrap-kit infrastructure component
  class: platform-component
  lifecycle: experimental
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-kserve
  upgrades:
    from: ["0.x"]
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-active
    - singleton
    defaults:
      multi-region: active-active
      single-region: singleton
    perTopology:
      active-active:
        replication:
          backend: none
          mode: none
        switchover:
          mechanism: none
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: active
      singleton:
        placement:
          tier: rtz
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: kserve.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: '{{.OrgSlug}}'
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  # ── /G117.1 ──
