apiVersion: v2
name: bp-reflector
# 1.0.1 (Refs #7067): memory sized from hw307 evidence — request 32Mi→128Mi,
#   limit 128Mi→512Mi. Region A OOMKilled 508 times in 67d (43.7 MB of
#   Secrets watched, steady 95Mi against the 128Mi limit), region B 44 times.
#   ADR-0015 D1 kubeconfig mirroring and the cutover ghcr-pull fan-out now
#   depend on it. Upstream 7.1.288 offers no watch narrowing (values.yaml).
version: 1.0.2
description: |
  Catalyst-curated Blueprint umbrella chart for emberstack/reflector.
  Reflector mirrors Kubernetes Secrets and ConfigMaps across namespaces
  by watching for reflector.v1.k8s.emberstack.com/* annotations on the
  source resource. On every Sovereign, flux-system/ghcr-pull carries
  these annotations so it auto-mirrors to every namespace, eliminating
  the ImagePullBackOff surface that was caused by cross-namespace secret
  propagation gaps (issue #543).

  dependsOn: bp-flux (03) — must be slot 05a to land after sealed-secrets
  and before spire.
type: application
keywords: [catalyst, blueprint, reflector, secret-mirror]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a Helm subchart so `helm dependency build`
# bundles it into the OCI artifact. Pinned to reflector 7.1.288 (latest
# stable as of 2026-05). Per INVIOLABLE-PRINCIPLES.md #4 (never hardcode)
# the version is operator-bumpable via PR + Blueprint release.
dependencies:
  - name: reflector
    version: "7.1.288"
    # Vendored copy (charts/reflector, unmodified upstream 7.1.288 bytes),
    # like bp-seaweedfs: the upstream index now lists chart URLs as the
    # relative path `repository/reflector/…`, which Helm misreads as a repo
    # alias ("repo repository not found"), so `helm dependency build` from
    # https://emberstack.github.io/helm-charts can no longer resolve it
    # (CI helm-lint on PR #7085; Refs #7067).
    repository: "file://charts/reflector"
annotations:
  catalyst.openova.io/vendored-subchart: "reflector@7.1.288"
  catalyst.openova.io/vendored-reason: "upstream index lists relative chart URLs Helm cannot resolve"
