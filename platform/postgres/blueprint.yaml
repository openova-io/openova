apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-postgres
  labels:
    catalyst.openova.io/section: pts-4-1-data-services
    catalyst.openova.io/companion: bp-cnpg
spec:
  # 0.2.8 (#4460): -mesh/-mesh-rw global Service aliases decoupled from the
  # cnpg-pair flip (render on the multi-region signal; region-B NXDOMAIN fix).
  # 0.2.10 (#4846): cross-region DR admission is an identity-based
  # CiliumNetworkPolicy (io.cilium.k8s.policy.cluster) — the 0.2.9 ipBlock was
  # inert for ClusterMesh remote endpoints. values crossRegionPeerClusters.
  # 0.2.13 (#5224): role-secrets side-gate — a replica-role region never mints
  # role/hub Secrets (incl. the pre-flip window); password set single-sourced
  # from the primary region (#4915 remedy class).
  # 0.2.14 (#5473): replication-source Service selectorType r -> rw; `r`
  # selected ALL instances, so a standby could serve as the DR source.
  # 0.2.15 (#5504): bootstrap.initdb.secret now names the owner's roleSecret;
  # initdb previously minted the owner with the generated <cluster>-app
  # password, so every consumer got 28P01 while CNPG reported reconciled.
  version: 0.2.16
  card:
    title: PostgreSQL
    summary: |
      A reusable, shareable PostgreSQL data-instance. Each install is ONE
      CNPG Cluster — the engine — and a first-class App card. Consumers
      SHARE it via isolated databases + per-consumer roles (ADR-0010):
      the binding is pure declarative YAML (a CNPG `Database` CR + a
      `managed.roles` entry + a reflected connection Secret + a Flux
      `dependsOn` edge) reconciled by Flux + the CNPG operator. NO custom
      controller and NO Crossplane. topology: active-hot-standby renders
      the Pillar-3 synchronous-replication shape (ADR-0004).
    icon: postgres.svg
    category: data
  # listed — this IS the operator-facing data-instance card (unlike
  # bp-cnpg, the engine OPERATOR, which stays unlisted). The PostgreSQL
  # ENGINE CLASS is shown once via bp-cnpg under Platform/engines; the N
  # data-instances (gitea-pg, harbor-pg, shared-pg, …) are bp-postgres
  # App cards.
  visibility: listed
  # ── Shareability + Contexts (#3370) ─────────────────────────────────
  # shareable: instances of this Blueprint support multi-application
  # reuse — one instance serves many consumer applications, each through
  # its own Context (the first-class child entity a consumer occupies;
  # for postgres: an isolated database + login role). Contexts are
  # declared as Git-committed IaC in the instance's values under
  # `contextSchema.valuesKey` and materialize exactly as the existing
  # databases[] machinery does (Database CR + managed role + reflected
  # credential Secret — see chart/templates/role-secrets.yaml).
  shareable: true
  contextSchema:
    # Kind label — the Context prefix the console renders (db/gitea).
    kind: db
    # Where Context entries live in the instance's IaC values. Every
    # entry follows the canonical context shape: name +
    # consumer.blueprint + reflect.secretName + reflect.namespaces
    # (+ kind-specific fields such as `owner` here).
    valuesKey: databases
    # What a Context needs (provisioning-journey inputs).
    needs:
      - name
      - owner
    # What a Context produces (consumer-visible outputs).
    produces:
      - credentialSecret
  configSchema:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
        description: |
          Master gate. false → the install renders ZERO resources (an
          empty Ready release). The bootstrap-kit slot 16a wires this to
          ${SOVEREIGN_ENABLE_SHARED_PG:=false} so a non-sharing Sovereign
          gets a Ready bp-postgres-shared HR without deploying an unused
          shared-pg Cluster.
      instance:
        type: object
        description: |
          The data instance (one CNPG Cluster). name surfaces as the
          App-card title and the dependsOn target consumers reference.
        properties:
          name:
            type: string
            default: postgres
            description: Cluster name = the data-instance identity.
          storageSize:
            type: string
            default: "5Gi"
            description: Per-instance PVC size (k8s resource quantity).
          pgVersion:
            type: string
            default: "16"
            description: PostgreSQL major version (CNPG image tag).
      topology:
        type: object
        properties:
          mode:
            type: string
            enum: [singleton, active-hot-standby]
            default: singleton
            description: |
              singleton = single-instance Cluster (no cross-region HA).
              active-hot-standby = multi-instance Cluster with synchronous
              replication across regions (ADR-0004 Pillar-3 zero-tx-loss).
          instances:
            type: integer
            minimum: 1
            maximum: 5
            default: 1
      databases:
        type: array
        description: |
          The bindings. Each entry = one consumer SHARING this engine:
          renders a `Database` CR (isolated DB) + a managed role + an
          optional reflected connection Secret. N entries = N consumers
          on one Cluster. The catalyst-layer generator writes these from
          a consumer's spec.backingServices declaration (ADR-0010).
        items:
          type: object
          required: [name, owner]
          properties:
            name:
              type: string
              description: The isolated database name on the shared Cluster.
            owner:
              type: string
              description: The per-consumer login role (CNPG-managed).
            passwordSecret:
              type: string
              description: |
                Secret CNPG reconciles the role password FROM. Empty →
                `<instance>-<owner>`.
            consumer:
              type: object
              properties:
                blueprint:
                  type: string
                  description: Consumer Blueprint id (for the Consumers table).
                mode:
                  type: string
                  enum: [private, shared]
                  description: Binding provenance (display only).
            reflect:
              type: object
              properties:
                secretName:
                  type: string
                namespaces:
                  type: array
                  items: { type: string }
  placementSchema:
    # ONE canonical placement vocabulary (#3375 DoD-1, #3768 follow-up).
    # The catalog New-instance picker + the inline-edit topology checkboxes
    # read these modes off the live wire (the catalog-item-version endpoint
    # serves spec.placementSchema verbatim in `raw`; the FE reads
    # `placementSchema.modes` — CatalogDetail.readTopologies). #3768 unified
    # the CRD / canonicaliser / TS editors but missed THIS source, which
    # still served the BANNED legacy dialect `single-region` / `active-active`
    # (2 of 4 modes, both legacy spellings) — exactly what the hw158 #3375
    # walk caught on the wire. Aligned to placement.CanonicalModes
    # (singleton / active-active / active-hot-standby / active-passive) so the
    # picker offers all four canonical classes and never a banned spelling.
    # The validator still folds any legacy value, but the source now emits
    # canonical end-to-end. (postgres genuinely materialises only singleton +
    # active-hot-standby per spec.topology.supported below; placementSchema
    # advertises the full canonical class set the editor vocabulary spans.)
    modes: [singleton, active-active, active-hot-standby, active-passive]
    default: singleton
  manifests:
    chart: ./chart
  # Runtime dependencies — Flux gates Apply until each is reconciled.
  depends:
    # CNPG operator + CRDs (Cluster + Database + managed.roles). bp-cnpg
    # is the ENGINE; bp-postgres is the INSTANCE. The Flux dependsOn edge
    # for a bp-postgres instance HR is bp-cnpg.
    - blueprint: bp-cnpg
      version: ^1
      alias: cnpg
    # bp-reflector mirrors the CNPG-generated role Secret into consumer
    # namespaces (externalDatabase mode).
    - blueprint: bp-reflector
      version: ^1
      alias: reflector
  upgrades:
    from: ["0.x"]
  # ── Topology — multi-region BCP ─────────────────────────────────────
  topology:
    supported:
      - singleton
      - active-hot-standby
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: rtz
          clusters:
            - rtz-A
          roles:
            rtz-A: singleton
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 10
          rpoSeconds: 0
        placement:
          tier: rtz
          clusters:
            - rtz-A
            - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
  # ── multiInstance — N data-instances per Org ────────────────────────
  # Each install of bp-postgres is a distinct data instance (gitea-pg,
  # harbor-pg, a shared shared-pg, …). Catalog cards show the instance
  # count + "+ New instance".
  multiInstance:
    enabled: true
    maxPerOrg: 0           # 0 = unlimited
    namingTemplate: '{{.AppName}}-{{.InstanceID}}'
    isolationLevel: namespace
