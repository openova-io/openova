# bp-postgres — data-instance values.
#
# An install of this chart renders ONE CNPG Cluster (the shareable
# Postgres engine = one App card) plus, per entry in `databases[]`, the
# declarative binding objects that let a consumer share the engine:
#   - a `Database` CR (isolated DB on this Cluster)
#   - a `Cluster.spec.managed.roles[]` entry (per-consumer login role)
#   - a reflected connection Secret into the consumer's namespace
#
# Everything below flows from values per Inviolable Principle #4 (never
# hardcode). The catalyst-layer generator (ADR-0010) writes these values
# into the instance HR when a consumer declares `spec.backingServices`.

# ── Master gate (safe-by-default) ───────────────────────────────────────
# When false the chart renders ZERO Kubernetes resources — the install is
# an empty (but Ready) release. The bootstrap-kit slot 16a wires this to
# ${SOVEREIGN_ENABLE_SHARED_PG:=false} so a Sovereign that is NOT sharing a
# Postgres engine still gets a Ready bp-postgres-shared HR (satisfying the
# unconditional bp-gitea / bp-harbor dependsOn edge) WITHOUT deploying an
# unused shared-pg Cluster. Default is `true` here so a DIRECT chart
# consumer (and the render gate) keeps the full reuse-proof render shape —
# the OFF state is opt-in via the slot's envsubst seam, the same pattern as
# slot 16b's cnpgPair.enabled / slot 62's CONTINUUM_ENABLED. The `toString`
# comparison is the Sprig-safe boolean idiom (a literal `false` is not
# "empty", so a plain `if .Values.enabled` would misfire — see memory
# feedback_sprig_default_bool_unsafe).
enabled: true

# ── The data instance (one CNPG Cluster) ────────────────────────────────
instance:
  # Cluster name = the data-instance identity. Surfaces as the App-card
  # title and as the `dependsOn` target consumers reference. e.g.
  # `gitea-pg`, `harbor-pg`, or a shared `shared-pg`.
  name: postgres
  # Namespace the Cluster (and its CNPG-generated Secrets) live in.
  # Empty → .Release.Namespace.
  namespace: ""

  # CNPG postgres image. Defaults to the mothership Harbor proxy cache so
  # fresh-prov bootstrap pulls through Harbor instead of throttling on
  # anonymous ghcr (#3058). Post-cutover Step-04's containerd mirror
  # redirects harbor.openova.io → local Harbor.
  imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql
  pgVersion: "16"

  # Storage for the engine's PVCs.
  storageSize: 5Gi
  # #3971 — empty ⇒ CNPG binds to the cluster-DEFAULT StorageClass (the
  # durable cloud CSI: hcloud-volumes on Hetzner). NEVER "local-path": k3s
  # runs --disable=local-storage so the ephemeral provisioner is FORBIDDEN
  # (and a Kyverno ENFORCE policy DENIES any local-path reference). Per-
  # Sovereign overlay MAY pin an explicit durable class; it must not be
  # local-path.
  storageClass: ""

  # #4282 — requests == limits (Guaranteed QoS). A per-Org bp-postgres
  # placed in a vCluster tier has its CNPG Cluster CR routed HOST-SIDE into
  # the Application's own per-Org namespace (#4398), where the catalyst
  # tenant kustomization stamps a `plan-limits` LimitRange enforcing
  # `maxLimitRequestRatio: {cpu: 1, memory: 1}` (Guaranteed-only, zero
  # overcommit — the per-Org plan-tier economics). A request<limit ratio
  # (the old 100m/500m = 5:1 cpu, 256Mi/512Mi = 2:1 memory) is DENIED by
  # that LimitRange, so the CNPG operator's `<cluster>-1-initdb` job pod is
  # `forbidden: cpu max limit to request ratio per Container is 1, but
  # provided ratio is 5` and the Cluster hangs in "Setting up primary"
  # forever. Setting requests == limits makes the engine pod (and every
  # CNPG-spawned job/instance pod that inherits Cluster.spec.resources)
  # Guaranteed, so it satisfies the per-Org LimitRange AND the host
  # shared-data path (no LimitRange there) unchanged.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Postgres GUCs applied to the Cluster. active-hot-standby mode appends
  # the synchronous-replication parameters (ADR-0004) on top of these.
  parameters:
    max_connections: "100"
    shared_buffers: "64MB"
    effective_cache_size: "192MB"
    work_mem: "4MB"
    maintenance_work_mem: "64MB"
    log_statement: "ddl"
    log_min_duration_statement: "1000"

  # enableSuperuserAccess keeps a -superuser Secret for incident-response
  # introspection (consistent with the legacy per-consumer Clusters).
  enableSuperuserAccess: true

  monitoring:
    enablePodMonitor: false

# ── Topology (multi-region BCP) ─────────────────────────────────────────
# singleton          → one single-instance Cluster (no cross-region HA).
# active-hot-standby → the bp-cnpg-pair SPLIT-SIDE cross-region shape
#                      (#3375 / #3571). A 2-region Sovereign is two SEPARATE
#                      ClusterMesh-joined clusters, so the data instance
#                      renders a PRIMARY Cluster (keeps the instance name so
#                      the consumer host `<instance>-rw` is unchanged) on
#                      region A and a REPLICA follower Cluster on region B
#                      streaming WAL over the ClusterMesh-global `-mesh`
#                      Service with synchronous_commit=remote_apply (ADR-0004
#                      Pillar-3 zero-tx-loss). bp-continuum drives switchover.
#                      This is the PROVEN mechanism (hw128 region-kill PASS,
#                      RTO 18s / RPO 0) — NOT the old single-Cluster region
#                      antiAffinity, which only spread within ONE stretched
#                      cluster (the hw126 fallacy that could never schedule
#                      region-B pods on cluster-A).
topology:
  mode: singleton
  # crossRegion (boolean, default false) — the bootstrap-kit slots wire this to
  # ${SOVEREIGN_ENABLE_CNPG_PAIR:-false}, the SAME post-mesh-confirm signal
  # bp-cnpg-pair's cnpgPair.enabled rides (catalyst-api patches it onto every
  # region's Kustomization ONLY after ClusterMesh is established + the primary's
  # replica-auth Secrets sync). When true it renders the active-hot-standby
  # (cnpg-pair split-side) shape EVEN with mode left at singleton — the boolean
  # seam exists because envsubst can substitute a plain true/false but cannot
  # turn it into the `active-hot-standby` mode STRING (that needs tofu template
  # logic, unavailable for a RUNTIME catalyst-api substitute patch). Either
  # `mode: active-hot-standby` OR `crossRegion: true` activates the pair.
  # Default false → singleton, byte-identical to pre-0.2.0.
  crossRegion: false
  # Instance count for the SINGLETON Cluster. Default 1 keeps the singleton
  # render unchanged. (active-hot-standby uses haInstances instead, so a slot
  # can flip crossRegion without ever touching this singleton field.)
  instances: 1
  # Per-side instance count for the active-hot-standby pair (primary half AND
  # replica half each get this many). Canonical 3 per bp-cnpg-pair. Decoupled
  # from `instances` so the singleton render's instance count is never
  # perturbed by the crossRegion flip.
  haInstances: 3
  # ── Split-side — WHICH HALF of the cross-region pair this install renders.
  # primary|replica|secondary (secondary aliases replica so the bootstrap-kit
  # substitutes the per-region SOVEREIGN_REGION_ROLE verbatim). Empty/unset →
  # primary, so a singleton install (where the split never applies) is
  # unchanged. ONLY consulted in active-hot-standby mode.
  side: primary
  # ── Region pinning (active-hot-standby only). Canonical openova.io/region
  # node labels the primary / replica Cluster CRs pin on. Stamped from the
  # cloud-init SOVEREIGN_PRIMARY_REGION / SOVEREIGN_REPLICA_REGION substitutes.
  #
  # 🛑 REQUIRED in active-hot-standby (#5639, chart 0.2.17). The empty defaults
  # below are the SINGLETON defaults — singleton renders no nodeAffinity and
  # consumes no region. The moment `mode: active-hot-standby` or
  # `crossRegion: true` is set, both halves pin a REQUIRED nodeAffinity on these
  # values, and the chart now REFUSES to render rather than emitting
  # `openova.io/region In [""]` (bp-postgres.primaryRegion /
  # bp-postgres.replicaRegion in _helpers.tpl). Leaving them empty in the HA
  # shape produced hw292's per-Org primary: Pending for 7+ hours behind a
  # HelmRelease that reported `install succeeded`. replica.region is consulted
  # only where the follower half renders (side=replica|secondary).
  primary:
    region: ""
  replica:
    region: ""
  # Synchronous replication knobs (only consulted in active-hot-standby).
  replication:
    mode: sync           # sync (Pillar-3 default) | async (forensic/lab)
    sync:
      commit: remote_apply  # on | remote_write | remote_apply
      numSync: 1

  # ── DR failover promotion seam (#5623, mirror of bp-cnpg-pair 0.2.12) ──
  # When true, the REPLICA half's Cluster CR renders `replica.enabled: false`
  # → CNPG promotes it to a writable primary. Region-kill failover MUST flip
  # this on the region-B HelmRelease DESIRED state
  # (`spec.values.topology.promoted: true`) — NEVER a `kubectl patch` of the
  # live Cluster CR, which flux/kustomize reverts mid-outage (the hw256 G12
  # lesson, #5125). The dr-promoter actor (below) drives exactly this value
  # and then suspend-latches the HR so drift-correction cannot re-demote the
  # survivor. Default/absent ⇒ replica mode (backward-safe; only consulted on
  # the active-hot-standby replica half). See replica-cluster.yaml.
  promoted: false

  # ── Failover-readiness probe threshold (#5623 / #5133) ────────────────
  # The failover-readiness probe Pod (failover-readiness.yaml, side=replica)
  # flips its Ready condition when the standby's WAL APPLY lag falls below
  # targetLagSeconds; the dr-promoter actor gates promotion on that Ready
  # signal (a lagging standby is never promoted — data safety over RTO).
  # Only consulted on the active-hot-standby replica half.
  walStreaming:
    targetLagSeconds: 30
    timeoutSeconds: 60

  # ── Region-B AUTOMATIC DR promotion (#5623) ───────────────────────────
  # The shared-pg pairs render the EXACT bp-cnpg-pair replica shape but had
  # NO region-local promoter, so on the hw292 G12 region-kill (2026-08-03)
  # their region-B replicas stayed read-only for the WHOLE outage while
  # bp-cnpg-pair's own dr-promoter auto-promoted at T0+2m16s — keycloak (a
  # shared-pg consumer) unrecoverable in region-B. This ships the SAME proven
  # promoter shape on the shared-pg replica half: a region-B-local Deployment
  # (Deployment NOT CronJob — #5157: a CronJob scheduler dies with the region)
  # whose signals container watches the LOCAL replica's WAL receiver AND
  # POSITIVELY probes region-A liveness (pg_isready of the `-mesh` primary
  # endpoint over the ClusterMesh — #5178), and whose actor promotes via the
  # `topology.promoted` HR-value seam + a durable suspend latch (#5218) only
  # after the region-A-loss clock has held primaryDownHoldSeconds AND the pair
  # reached streaming steady-state (steadyStateArmSeconds — #5220) AND the
  # failover-readiness probe is Ready. DATA FENCE: rendered ONLY when
  # replication.mode=sync (remote_apply + FIRST 1 pinned to the cross-region
  # replica means the old primary cannot COMMIT while its sync standby is
  # unreachable/diverged — automatic promotion can never lose or fork
  # committed data). The full #5245 durable-substitute handoff, TL-ahead
  # re-promote and region-A dr-failback leg are deliberately NOT ported here
  # (follow-up); as with bp-cnpg-pair 0.2.14–0.2.17 the operator lifts the
  # suspend latch on region-A recovery (RUNBOOKS §6.1).
  autoPromote:
    enabled: true
    # Poll cadence for both containers.
    intervalSeconds: 10
    # The region-A-loss clock (local WAL stream absent AND region-A
    # unreachable) must hold CONTINUOUSLY this long before the actor promotes.
    # An intra-region primary restart/switchover reconnects in seconds and
    # clears the clock; 120s auto-recovers a real region kill in ~2-4 min.
    primaryDownHoldSeconds: 120
    # #5178 startup grace — a freshly-(re)started replica still completing its
    # first catchup must NEVER trip the promote clock. Must exceed a normal
    # basebackup+catchup.
    startupGraceSeconds: 300
    # #5178 region-A liveness probe timeout (seconds) for the pg_isready of the
    # `-mesh` primary endpoint. Only rc=2 (no response) counts as unreachable;
    # every other result fail-safes to "region-A alive" (do NOT promote).
    livenessProbeTimeoutSeconds: 5
    # #5218 same-tick durable latch — after flipping the HR promoted value the
    # actor polls (bounded by this) until helm renders replica.enabled=false,
    # then IMMEDIATELY suspends the HR so kustomize's SSA re-apply of the atomic
    # spec.values cannot reclaim the nested `promoted` key and re-demote in the
    # gap. A ceiling on the fast path (the per-tick self-heal is the backstop),
    # never a correctness dependency.
    promoteRenderWaitSeconds: 90
    # #5220 steady-state ARM gate — the promoter is INELIGIBLE to promote until
    # the signals container has OBSERVED the replica actively STREAMING from
    # region-A held CONTINUOUSLY this long. A convergence-time transient (a
    # primary restart-storm, or a replica that never streamed) must never look
    # like a region kill. Once armed it stays armed for the pod's life.
    steadyStateArmSeconds: 180
    # The flux HelmRelease whose DESIRED state (spec.values.topology.promoted)
    # carries the promotion. Per-instance: the bootstrap-kit slots 16a/16c/16d
    # stamp bp-postgres-shared / -shared-b / -shared-c respectively.
    hr:
      name: bp-postgres-shared
      namespace: flux-system
    # kubectl-bearing image for the actor container. Same harbor-proxy-pull-
    # compliant (`*/proxy-*/*`) prefix as the signals/postgres image so the
    # whole Pod matches ONE kyverno anyPattern glob.
    kubectlImage:
      repository: harbor.openova.io/proxy-dockerhub/alpine/k8s
      tag: "1.30.0"
      pullPolicy: IfNotPresent

  # ── Cilium ClusterMesh — the canonical inter-region replication transport
  # (ADR-0001 §9). The primary's `-mesh` global Service publishes its read
  # endpoint across the mesh; the replica's externalCluster dials it. OFF
  # would force an out-of-band public endpoint, which is NOT supported.
  # Only consulted in active-hot-standby.
  clusterMesh:
    enabled: true
    # affinity: local → primary region keeps reads local; the replica region
    # (zero local backends with cnpg-role=primary) falls through to remote.
    affinity: local
  # ── NetworkPolicy carve-out. The platform default-deny CCNP
  # (bp-network-policies) covers shared-data; these knobs open the
  # cross-region + own-cluster replication path + the CNPG operator status
  # probe (the #3322 + hw126 carve-outs bp-cnpg-pair proved). The operator
  # status-probe rule is ALSO consulted for the SINGLETON path
  # (networkpolicy-singleton-operator-probe.yaml) because #4398 routes a
  # per-Org singleton Cluster host-side into a default-deny per-Org namespace
  # where the cross-namespace cnpg-system operator probe would otherwise be
  # denied (#4282).
  networkPolicy:
    enabled: true
    operatorNamespace: cnpg-system
    operatorStatusPort: 8000
    operatorMetricsPort: 9187
    # sharedConsumers (#4442) — when true, the SINGLETON operator-probe
    # NetworkPolicy ALSO opens 5432 to every in-cluster namespace
    # (namespaceSelector:{}), restoring cross-namespace consumer reach.
    #
    # Why this is needed for the HOST shared-data instances (slots 16a/16c/
    # 16d): the singleton operator-probe NP (networkpolicy-singleton-
    # operator-probe.yaml, #4282/#4398) selects the Cluster's Pods with
    # policyTypes:[Ingress], which makes them DEFAULT-DENY on every unlisted
    # ingress — including consumer 5432. That template was written for the
    # #4398 PER-ORG path, where the per-Org namespace carries an
    # `allow-same-org` policy covering same-Org consumers. The HOST
    # `shared-data` instances have NO allow-same-org pair and their consumers
    # (keycloak, gitea, harbor, grafana, powerdns, newapi, catalyst-api …)
    # live in OTHER namespaces, so the probe-only NP silently default-denies
    # their 5432 → keycloak-0 → shared-pg-rw JDBC timeout, the whole SSO chain
    # down (live regression on fresh prov b9f9590b, 2026-06-26). This is the
    # SINGLETON analogue of the 0.2.1/#3577 active-hot-standby consumer-allow
    # (networkpolicy.yaml lines 42-62) — the AHS path already carries it, the
    # singleton path lost it when #4282 added the probe-only NP.
    #
    # Default false keeps the #4398 per-Org render byte-identical (per-Org
    # consumers are same-Org, covered by allow-same-org — no broad open). The
    # host shared-data slots set it true.
    sharedConsumers: false
    # crossRegionPeerClusters (#4846) — the Cilium ClusterMesh cluster.name(s)
    # of the OTHER region('s) cluster, allowed to reach this instance's 5432 for
    # cross-region replication + shared-consumer reach. REQUIRED in a 2-region
    # (active-hot-standby) Sovereign.
    #
    # WHY an identity-based CiliumNetworkPolicy, NOT a k8s-NetworkPolicy ipBlock
    # (the #4847/#4848 inert-fix correction): the region-b sources (keycloak/
    # grafana consumers + the region-b replica's pg_basebackup/WAL streaming)
    # arrive over ClusterMesh as KNOWN Cilium endpoints carrying their OWN pod
    # security identity. A k8s-netpol `ipBlock` matches ONLY a CIDR identity,
    # which Cilium assigns SOLELY to IPs that are NOT known endpoints — so a
    # ClusterMesh remote pod is never a CIDR-identity match → `match none` →
    # deny. (The #4846 ipBlock shipped INERT; proven with cilium-dbg on hw228.)
    # A k8s-netpol label selector is ALSO implicitly local-cluster-scoped
    # (Cilium ANDs `io.cilium.k8s.policy.cluster=<local>`), so it can't match a
    # remote endpoint either. The CORRECT admission is a CiliumNetworkPolicy
    # whose `fromEndpoints` selects the peer cluster(s) by the
    # `io.cilium.k8s.policy.cluster` label — this exact shape made region-b→
    # region-a pg_isready succeed and the DR replica basebackup complete on
    # hw228. The bootstrap-kit wires this to the peer region's ClusterMesh
    # name(s) (SOVEREIGN_PEER_CLUSTERMESH_NAMES, stamped by catalyst-api at the
    # post-mesh cnpg-pair flip). EMPTY (default) → singleton renders NO
    # CiliumNetworkPolicy (byte-identical single-region default).
    crossRegionPeerClusters: []

# ── Continuum DR contract (#4986, #3375 rows 51/52/56/57/64) ─────────────
# The per-app Continuum.dr.openova.io CR (`dr-<instance>`) that fronts the
# active-hot-standby CNPG pair so the console per-app Topology DR panel renders
# (catalyst-api /continuums/dr-<app>/replication-status discovers the pair by
# the catalyst.openova.io/cnpg-pair label → source:live). templates/continuum.yaml
# renders it ONLY on a 2-region active-hot-standby PRIMARY-side install (both
# topology.primary.region + topology.replica.region non-empty). A singleton
# emits nothing (byte-identical single-region default).
continuum:
  # enabled — opt-out for an operator running a 2-region pair WITHOUT the
  # continuum-controller (no DR contract to reconcile). Default true: every
  # active-hot-standby shared-pg gets its DR roster row + Topology DR panel.
  enabled: true
  # autoFailover false → the panel arms a MANUAL switchover (RPO/health
  # preflight before confirm); no unattended promotion. Pillar-3 default.
  autoFailover: false
  # Recovery objectives surfaced on the CR (informational; the CRD validates
  # the `^[0-9]+(s|m|h)$` form). rpo empty → omitted.
  rto: "30s"
  rpo: ""
  # Lease witness backend — k8s-lease (a native coordination.k8s.io/v1 Lease)
  # is the air-gappable, self-sovereign default (#3829). Enum:
  # [k8s-lease, cloudflare-kv, dns-quorum].
  leaseClient:
    kind: k8s-lease

# ── Bindings (the shareable part) ───────────────────────────────────────
# Each entry binds ONE consumer to this instance. The chart renders a
# Database CR + a managed role + (optionally) a reflected connection
# Secret. Two entries = two consumers SHARING this one Cluster (two
# isolated databases + two roles).
#
# 0.1.5 (#3188): bindings may SHARE one owner (N databases, ONE role +
# ONE password — the Organization-mesh shape). The role Secret + managed.roles
# entry are deduped per unique owner; database names with underscores
# are legal (the Database CR's k8s name is sanitized, spec.name keeps
# the real Postgres name).
#
# databases:
#   - name: registry        # the isolated database name
#     owner: harbor         # the per-consumer login role (CNPG manages it)
#     # The consumer app Secret CNPG reconciles the role password FROM.
#     # Convention: CNPG auto-generates `<instance>-<owner>` when CNPG
#     # bootstraps the role, OR point at an existing Secret with a
#     # `password` key. When empty, the chart names it `<instance>-<owner>`.
#     passwordSecret: ""
#     consumer:
#       blueprint: bp-harbor   # for the Consumers (bindings) table
#       mode: shared           # private | shared (provenance, display only)
#     # Reflect a connection Secret into the consumer namespace so its
#     # chart runs in externalDatabase mode. Omit `reflect` to skip
#     # (consumer reads the CNPG Secret in-namespace).
#     reflect:
#       secretName: harbor-database-secret  # name in the consumer ns
#       namespaces: [harbor]                # target namespace(s)
#       # Optional STATIC keys rendered verbatim into the hub Secret —
#       # lets an env-style consumer (grafana envFromSecrets) read its
#       # native variable names. NEVER put credentials here (Principle
#       # #10) — use passwordAliases for the minted password.
#       extraData: {}
#       # Optional extra key names carrying the chart-minted password
#       # (e.g. [GF_DATABASE_PASSWORD]) — same render scope as the role
#       # Secret so aliases never drift.
#       passwordAliases: []
databases: []

# ── Bootstrap self-registration (#3370) ─────────────────────────────────
# When enabled, the chart self-registers the Application CR
# (apps.openova.io/v1) for this instance — the canonical representation
# every console surface reads (templates/application-cr.yaml). ONLY the
# bootstrap-kit slots set this (16a/16c/16d): console-created instances
# already carry a controller-created Application CR, so the default is
# OFF to keep "N instances ⇒ exactly N cards" true.
bootstrapOwned:
  enabled: false
  # The owning Flux HelmRelease — the application-controller's adoption
  # path observes its Ready condition for the instance's status; console
  # projections dedupe HR-derived rows against it.
  helmRelease:
    name: ""
    namespace: flux-system
