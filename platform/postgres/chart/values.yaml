# bp-postgres — data-instance values.
#
# An install of this chart renders ONE CNPG Cluster (the shareable
# Postgres engine = one App card) plus, per entry in `databases[]`, the
# declarative binding objects that let a consumer share the engine:
#   - a `Database` CR (isolated DB on this Cluster)
#   - a `Cluster.spec.managed.roles[]` entry (per-consumer login role)
#   - a reflected connection Secret into the consumer's namespace
#
# Everything below flows from values per Inviolable Principle #4 (never
# hardcode). The catalyst-layer generator (ADR-0010) writes these values
# into the instance HR when a consumer declares `spec.backingServices`.

# ── Master gate (safe-by-default) ───────────────────────────────────────
# When false the chart renders ZERO Kubernetes resources — the install is
# an empty (but Ready) release. The bootstrap-kit slot 16a wires this to
# ${SOVEREIGN_ENABLE_SHARED_PG:=false} so a Sovereign that is NOT sharing a
# Postgres engine still gets a Ready bp-postgres-shared HR (satisfying the
# unconditional bp-gitea / bp-harbor dependsOn edge) WITHOUT deploying an
# unused shared-pg Cluster. Default is `true` here so a DIRECT chart
# consumer (and the render gate) keeps the full reuse-proof render shape —
# the OFF state is opt-in via the slot's envsubst seam, the same pattern as
# slot 16b's cnpgPair.enabled / slot 62's CONTINUUM_ENABLED. The `toString`
# comparison is the Sprig-safe boolean idiom (a literal `false` is not
# "empty", so a plain `if .Values.enabled` would misfire — see memory
# feedback_sprig_default_bool_unsafe).
enabled: true

# ── The data instance (one CNPG Cluster) ────────────────────────────────
instance:
  # Cluster name = the data-instance identity. Surfaces as the App-card
  # title and as the `dependsOn` target consumers reference. e.g.
  # `gitea-pg`, `harbor-pg`, or a shared `shared-pg`.
  name: postgres
  # Namespace the Cluster (and its CNPG-generated Secrets) live in.
  # Empty → .Release.Namespace.
  namespace: ""

  # CNPG postgres image. Defaults to the mothership Harbor proxy cache so
  # fresh-prov bootstrap pulls through Harbor instead of throttling on
  # anonymous ghcr (#3058). Post-cutover Step-04's containerd mirror
  # redirects harbor.openova.io → local Harbor.
  imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql
  pgVersion: "16"

  # Storage for the engine's PVCs.
  storageSize: 5Gi
  storageClass: local-path

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Postgres GUCs applied to the Cluster. active-hot-standby mode appends
  # the synchronous-replication parameters (ADR-0004) on top of these.
  parameters:
    max_connections: "100"
    shared_buffers: "64MB"
    effective_cache_size: "192MB"
    work_mem: "4MB"
    maintenance_work_mem: "64MB"
    log_statement: "ddl"
    log_min_duration_statement: "1000"

  # enableSuperuserAccess keeps a -superuser Secret for incident-response
  # introspection (consistent with the legacy per-consumer Clusters).
  enableSuperuserAccess: true

  monitoring:
    enablePodMonitor: false

# ── Topology (multi-region BCP) ─────────────────────────────────────────
# singleton          → one single-instance Cluster (no cross-region HA).
# active-hot-standby → the bp-cnpg-pair SPLIT-SIDE cross-region shape
#                      (#3375 / #3571). A 2-region Sovereign is two SEPARATE
#                      ClusterMesh-joined clusters, so the data instance
#                      renders a PRIMARY Cluster (keeps the instance name so
#                      the consumer host `<instance>-rw` is unchanged) on
#                      region A and a REPLICA follower Cluster on region B
#                      streaming WAL over the ClusterMesh-global `-mesh`
#                      Service with synchronous_commit=remote_apply (ADR-0004
#                      Pillar-3 zero-tx-loss). bp-continuum drives switchover.
#                      This is the PROVEN mechanism (hw128 region-kill PASS,
#                      RTO 18s / RPO 0) — NOT the old single-Cluster region
#                      antiAffinity, which only spread within ONE stretched
#                      cluster (the hw126 fallacy that could never schedule
#                      region-B pods on cluster-A).
topology:
  mode: singleton
  # crossRegion (boolean, default false) — the bootstrap-kit slots wire this to
  # ${SOVEREIGN_ENABLE_CNPG_PAIR:-false}, the SAME post-mesh-confirm signal
  # bp-cnpg-pair's cnpgPair.enabled rides (catalyst-api patches it onto every
  # region's Kustomization ONLY after ClusterMesh is established + the primary's
  # replica-auth Secrets sync). When true it renders the active-hot-standby
  # (cnpg-pair split-side) shape EVEN with mode left at singleton — the boolean
  # seam exists because envsubst can substitute a plain true/false but cannot
  # turn it into the `active-hot-standby` mode STRING (that needs tofu template
  # logic, unavailable for a RUNTIME catalyst-api substitute patch). Either
  # `mode: active-hot-standby` OR `crossRegion: true` activates the pair.
  # Default false → singleton, byte-identical to pre-0.2.0.
  crossRegion: false
  # Instance count for the SINGLETON Cluster. Default 1 keeps the singleton
  # render unchanged. (active-hot-standby uses haInstances instead, so a slot
  # can flip crossRegion without ever touching this singleton field.)
  instances: 1
  # Per-side instance count for the active-hot-standby pair (primary half AND
  # replica half each get this many). Canonical 3 per bp-cnpg-pair. Decoupled
  # from `instances` so the singleton render's instance count is never
  # perturbed by the crossRegion flip.
  haInstances: 3
  # ── Split-side — WHICH HALF of the cross-region pair this install renders.
  # primary|replica|secondary (secondary aliases replica so the bootstrap-kit
  # substitutes the per-region SOVEREIGN_REGION_ROLE verbatim). Empty/unset →
  # primary, so a singleton install (where the split never applies) is
  # unchanged. ONLY consulted in active-hot-standby mode.
  side: primary
  # ── Region pinning (active-hot-standby only). Canonical openova.io/region
  # node labels the primary / replica Cluster CRs pin on. Stamped from the
  # cloud-init SOVEREIGN_PRIMARY_REGION / SOVEREIGN_REPLICA_REGION substitutes.
  primary:
    region: ""
  replica:
    region: ""
  # Synchronous replication knobs (only consulted in active-hot-standby).
  replication:
    mode: sync           # sync (Pillar-3 default) | async (forensic/lab)
    sync:
      commit: remote_apply  # on | remote_write | remote_apply
      numSync: 1
  # ── Cilium ClusterMesh — the canonical inter-region replication transport
  # (ADR-0001 §9). The primary's `-mesh` global Service publishes its read
  # endpoint across the mesh; the replica's externalCluster dials it. OFF
  # would force an out-of-band public endpoint, which is NOT supported.
  # Only consulted in active-hot-standby.
  clusterMesh:
    enabled: true
    # affinity: local → primary region keeps reads local; the replica region
    # (zero local backends with cnpg-role=primary) falls through to remote.
    affinity: local
  # ── NetworkPolicy carve-out (active-hot-standby only). The platform
  # default-deny CCNP (bp-network-policies) covers shared-data; these knobs
  # open the cross-region + own-cluster replication path + the CNPG operator
  # status probe (the #3322 + hw126 carve-outs bp-cnpg-pair proved).
  networkPolicy:
    enabled: true
    operatorNamespace: cnpg-system
    operatorStatusPort: 8000
    operatorMetricsPort: 9187

# ── Bindings (the shareable part) ───────────────────────────────────────
# Each entry binds ONE consumer to this instance. The chart renders a
# Database CR + a managed role + (optionally) a reflected connection
# Secret. Two entries = two consumers SHARING this one Cluster (two
# isolated databases + two roles).
#
# 0.1.5 (#3188): bindings may SHARE one owner (N databases, ONE role +
# ONE password — the SME-mesh shape). The role Secret + managed.roles
# entry are deduped per unique owner; database names with underscores
# are legal (the Database CR's k8s name is sanitized, spec.name keeps
# the real Postgres name).
#
# databases:
#   - name: registry        # the isolated database name
#     owner: harbor         # the per-consumer login role (CNPG manages it)
#     # The consumer app Secret CNPG reconciles the role password FROM.
#     # Convention: CNPG auto-generates `<instance>-<owner>` when CNPG
#     # bootstraps the role, OR point at an existing Secret with a
#     # `password` key. When empty, the chart names it `<instance>-<owner>`.
#     passwordSecret: ""
#     consumer:
#       blueprint: bp-harbor   # for the Consumers (bindings) table
#       mode: shared           # private | shared (provenance, display only)
#     # Reflect a connection Secret into the consumer namespace so its
#     # chart runs in externalDatabase mode. Omit `reflect` to skip
#     # (consumer reads the CNPG Secret in-namespace).
#     reflect:
#       secretName: harbor-database-secret  # name in the consumer ns
#       namespaces: [harbor]                # target namespace(s)
#       # Optional STATIC keys rendered verbatim into the hub Secret —
#       # lets an env-style consumer (grafana envFromSecrets) read its
#       # native variable names. NEVER put credentials here (Principle
#       # #10) — use passwordAliases for the minted password.
#       extraData: {}
#       # Optional extra key names carrying the chart-minted password
#       # (e.g. [GF_DATABASE_PASSWORD]) — same render scope as the role
#       # Secret so aliases never drift.
#       passwordAliases: []
databases: []

# ── Bootstrap self-registration (#3370) ─────────────────────────────────
# When enabled, the chart self-registers the Application CR
# (apps.openova.io/v1) for this instance — the canonical representation
# every console surface reads (templates/application-cr.yaml). ONLY the
# bootstrap-kit slots set this (16a/16c/16d): console-created instances
# already carry a controller-created Application CR, so the default is
# OFF to keep "N instances ⇒ exactly N cards" true.
bootstrapOwned:
  enabled: false
  # The owning Flux HelmRelease — the application-controller's adoption
  # path observes its Ready condition for the instance's status; console
  # projections dedupe HR-derived rows against it.
  helmRelease:
    name: ""
    namespace: flux-system
