apiVersion: v2
name: bp-postgres
version: 0.1.3
appVersion: "0.1.2"
description: |
  Catalyst-authored data-instance Blueprint for a shareable, reusable
  PostgreSQL engine. Each install of bp-postgres = ONE
  postgresql.cnpg.io/v1.Cluster (the data instance, a first-class App
  card) reconciled by the CNPG operator that bp-cnpg installs. Per
  ADR-0010 the binding model is pure declarative YAML:

    - one CNPG Cluster CR (the engine; multiInstance + topology aware)
    - N declarative `Database` CRs (databases.postgresql.cnpg.io) — one
      isolated database per consumer on the shared Cluster
    - N `Cluster.spec.managed.roles[]` entries — one per-consumer login
      role, password reconciled from the consumer's app Secret
    - N reflected connection Secrets (bp-reflector) into consumer
      namespaces so each consumer chart runs in externalDatabase mode

  Sharing = N Databases + N roles on ONE Cluster. Ref-count = the Flux
  dependency graph (a consumer HR dependsOn the bp-postgres instance,
  NOT the bp-cnpg operator). NO custom controller and NO Crossplane are
  involved — CNPG's own `Cluster`/`Database`/`managed.roles` CRDs are the
  off-the-shelf primitives (Inviolable Principle #2), reconciled by Flux.

  This chart ships ZERO upstream Helm subchart bytes — every byte is
  Catalyst-authored, on top of the CNPG CRDs bp-cnpg installs. The
  blueprint-release hollow-chart guard (#181) is satisfied via the
  `catalyst.openova.io/no-upstream` annotation.

  Changelog
  ─────────
  0.1.2 (2026-06-11, Refs #3283)
    - FATAL deadlock fix: connection-secret.yaml now creates each reflected
      connection Secret in the RELEASE namespace (shared-data, which always
      exists) instead of the consumer namespace (gitea/harbor, which is
      created by the consumer Blueprints that dependsOn THIS HR). The hub
      Secret PULLS from the CNPG role Secret (reflects) AND is a reflection
      SOURCE (reflection-allowed + reflection-auto-enabled + reflection-
      auto-namespaces) so bp-reflector push-copies a same-named copy into
      each consumer namespace once it appears. Breaks the bp-postgres-shared
      ⟲ bp-gitea/bp-harbor circular deadlock (`namespaces "gitea" not
      found`) that wedged any SHARED_PG=true prov (confirmed live hw127).
      The four annotation keys mirror bp-gitea/bp-harbor cnpg-cluster.yaml
      inheritedMetadata. No dependsOn edge change.
  0.1.1 (2026-06-10, Refs #3188)
    - Master gate `.Values.enabled` (default true). OFF → the chart
      renders ZERO Kubernetes resources (empty Ready release). The
      bootstrap-kit slot 16a wires it to ${SOVEREIGN_ENABLE_SHARED_PG:=
      false} so a non-sharing Sovereign still gets a Ready bp-postgres-
      shared HR (satisfying the unconditional bp-gitea / bp-harbor
      dependsOn) WITHOUT deploying an unused shared-pg Cluster. Sprig-safe
      `ne (toString .Values.enabled) "false"` idiom. No change to the
      default reuse-proof render shape.
  0.1.0 (2026-06-10, ADR-0010, Refs #3188)
    - Initial chart: one CNPG Cluster + per-consumer Database CRs +
      managed.roles + reflected connection Secrets, all driven by
      values.yaml (`databases[]` list). topology.mode active-hot-standby
      renders the synchronous-replication shape per ADR-0004; singleton
      renders a single-instance Cluster.
type: application
keywords:
  - openova
  - catalyst
  - blueprint
  - postgres
  - postgresql
  - cnpg
  - data
  - backing-service
  - shareable
maintainers:
  - name: OpenOva Catalyst
    email: hati.yildiz@openova.io

# No upstream Helm chart — every byte is Catalyst-authored on top of the
# CNPG CRDs that bp-cnpg installs (bp-cnpg is a hard dependency declared
# in blueprint.yaml + the Flux dependsOn edge, NOT a Helm subchart). The
# blueprint-release hollow-chart guard (#181) accepts the annotation.
annotations:
  catalyst.openova.io/no-upstream: "true"
  # Default-values render is intentionally short. Every template (the CNPG
  # Cluster, the Database CRs, the reflected connection Secrets) is gated on
  # `.Capabilities.APIVersions.Has "postgresql.cnpg.io/v1"` — the CNPG CRD is
  # NOT registered during the blueprint-release offline `helm template` smoke
  # render, so the Cluster/Database never render there. The default
  # `databases: []` also renders zero binding Secrets. The result is an empty
  # render, which the smoke-render guard flags as "suspiciously short" unless
  # this annotation declares the short render expected — the same pattern the
  # directly-analogous bp-cnpg-pair (slot 16b) and 30+ sibling charts use. The
  # enabled-render path (1 Cluster + N Databases + N roles + N Secrets, with
  # `--api-versions postgresql.cnpg.io/v1`) is fully covered by the unit test
  # chart/tests/postgres-render.sh, which CI runs via the `tests/*.sh` gate.
  catalyst.openova.io/smoke-render-mode: "default-off"
  catalyst.openova.io/depends-on: "bp-cnpg,bp-reflector"
  catalyst.openova.io/issue: "3188"
