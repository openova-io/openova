apiVersion: v2
name: bp-postgres
# 0.2.18 — #5623 (Refs #5137 #5178 #5218 #5220 #5133 #5157): region-B AUTOMATIC DR
#   promotion for the shared-pg pairs. The three shared-pg instances render the EXACT
#   bp-cnpg-pair split-side replica shape but shipped NO region-local promoter, so on
#   the hw292 G12 region-kill (2026-08-03, dep 1c56518035a83e03, cutoverComplete=true)
#   bp-cnpg-pair's own region-B dr-promoter auto-promoted at T0+2m16s (RPO=0) while all
#   three shared-pg replicas stayed pg_is_in_recovery()=t for the WHOLE outage —
#   keycloak (a shared-pg consumer) and every platform database read-only, the auth
#   path unrecoverable in region-B (the gateway 503'd on four fresh-TCP samples). This
#   ports the PROVEN bp-cnpg-pair dr-promoter (chart 0.2.17) onto the shared-pg replica
#   half, templated with bp-postgres's own naming helpers + the shared-pg HR-value seam:
#     - templates/dr-promoter.yaml — a side=replica-gated Deployment (NOT a CronJob,
#       #5157) whose signals container watches the LOCAL replica's WAL receiver AND
#       POSITIVELY probes region-A liveness (pg_isready of the -mesh endpoint over the
#       ClusterMesh — #5178), and whose actor promotes via the topology.promoted
#       HR-value seam + a durable spec.suspend latch (#5218, custom field-manager) only
#       after the region-A-loss clock held primaryDownHoldSeconds AND the pair reached
#       streaming steady-state (steadyStateArmSeconds — #5220) AND the failover-readiness
#       probe is Ready (#5133). Anti-flap: never re-promote an already-diverged cluster.
#     - templates/failover-readiness.yaml — the #5133 LSN apply==receive promotability
#       probe (streaming_replica mutual-TLS).
#     - replica-cluster.yaml now drives replica.enabled from the topology.promoted VALUE
#       (mirror of bp-cnpg-pair 0.2.12 / #5125-D1) so the promotion is the DESIRED state
#       flux drift-correction RE-AFFIRMS, never a live-object patch it reverts mid-outage.
#     - networkpolicy.yaml admits the promoter signals + probe to the replica 5432 and
#       adds the probe egress; dr-promoter.yaml carries its own egress CNP (apiserver +
#       kube-dns + replica 5432 + the region-A liveness probe by peer identity).
#   DATA FENCE: rendered ONLY when replication.mode=sync (the old primary cannot commit
#   while its sync standby is unreachable — automatic promotion can never lose or fork
#   committed data). Default-OFF preserved: singleton / primary / async / autoPromote-off
#   render ZERO promoter resources (byte-identical to 0.2.17). The #5245 durable-substitute
#   handoff, TL-ahead re-promote and region-A dr-failback leg bp-cnpg-pair added on top
#   (0.2.18-0.2.23) are NOT ported (follow-up); as with bp-cnpg-pair 0.2.14-0.2.17 the
#   suspend latch holds the survivor writable through the outage and the operator lifts it
#   on region-A recovery (RUNBOOKS §6.1). New values under topology: promoted, walStreaming,
#   autoPromote.*. tests/postgres-render.sh Cases 20a-20d added. LIVE region-kill proof on
#   the shared-pg pairs is owed on the next 2-region G12 walk. Lockstep: 16a/16c/16d HR
#   pins + blueprint.yaml + catalog-seed → 0.2.18.
# 0.2.17 — #5639 (Refs #960 #3986): FAIL CLOSED on an unresolvable region. Both
#   active-hot-standby Cluster halves pin a REQUIRED nodeAffinity on the
#   `openova.io/region` node label, and both read the value straight off
#   `.Values.topology.{primary,replica}.region` — whose values.yaml default is
#   the EMPTY STRING. An install that never set the key therefore rendered
#   `openova.io/region In [""]`, which no node can ever satisfy: not a slow
#   schedule, unschedulable forever. Proven live on hw292 2026-08-03 — the
#   per-Org Cluster `hw292-omani-works/postgres` sat at
#   phase="Setting up primary" for 7+ hours with `FailedScheduling: 0/4 nodes
#   are available: 4 node(s) didn't match Pod's node affinity/selector` while
#   all four nodes carried `openova.io/region=hw-me-east-215-a-rtz-prod`; the
#   CONTROL, a cnpg/cnpg-pair primary on the same cluster, carried
#   `openova.io/region=[hw-me-east-215-a-rtz-prod]` and was healthy. The
#   HelmRelease reported `install succeeded` the whole time — Helm rendered
#   valid YAML and the apiserver accepted the Cluster, so every status surface
#   showed a green badge over a database with no running primary.
#   templates/_helpers.tpl gains `bp-postgres.primaryRegion` +
#   `bp-postgres.replicaRegion`, each a Helm `required` naming the exact missing
#   key; cluster.yaml (label + nodeAffinity) and replica-cluster.yaml (same two
#   sites) now resolve through them. This is the guard bp-wordpress-tenant
#   (validateActiveHotStandbyRegions) and bp-cnpg-pair (validateRegions) have
#   always had — bp-postgres was the chart that drifted. SINGLETON RENDER IS
#   BYTE-IDENTICAL to 0.2.16 (no region is consumed there), and the bootstrap-kit
#   slots are unaffected: cloud-init stamps SOVEREIGN_PRIMARY_REGION /
#   SOVEREIGN_REPLICA_REGION unconditionally. blueprint.yaml + catalog-seed
#   configSchema now declare `topology.primary.region`, which the per-Org install
#   door (catalyst-api defaultedParameters) emits alongside topology.mode.
#   Lockstep: 16a/16c/16d HR pins + blueprint.yaml + catalog-seed → 0.2.17.
# 0.2.16 — #5311 (Refs #4901 #4986 #4987 #5337): templates/continuum.yaml now
#   populates `spec.cnpgPair` (name = instanceName, namespace = the Cluster ns)
#   on the dr-<instance> Continuum CR. dr-shared-pg{,-b,-c} previously carried
#   only the `catalyst.openova.io/cnpg-pair` LABEL (enough for the console DR
#   WAL-lag panel via catalyst-api continuum_live.go label discovery) but NOT
#   this spec field, so the continuum-controller's standby observe gate
#   (continuum_controller.go:420 — `spec.CNPGPair != ""`) was skipped and the
#   #5311 pg_stat_replication probe never engaged → `standbyAvailable` stayed
#   UNSET for the shared-pg pairs even though they render a genuine 2-region
#   streaming pair. Trivial + self-contained: the value is the SAME instance
#   name the label + the two Cluster halves already stamp; the CNPG
#   `<primary>-replication` Secret + the existing all-namespace 5432 ingress on
#   `-allow-replication-to-primary` already satisfy the probe (no #5337-style
#   NetworkPolicy carve-out needed — this chart's shared-pg policy already
#   admits catalyst-system). Mirrors bp-cnpg-pair's continuum.yaml. Lockstep:
#   16a/16c/16d HR pins + blueprint.yaml + catalog-seed → 0.2.16.
# 0.2.15 — #5504 (Refs #5499): the FIRST binding's owner was minted TWICE with
# different credentials — bootstrap.initdb created it with CNPG's generated
# `<cluster>-app` password, while managed.roles declared it with the
# roleSecret. initdb's credential is what Postgres keeps, so every consumer
# (handed the roleSecret) got SQLSTATE 28P01 while CNPG reported the role
# `reconciled` over a password that never took effect. bootstrap.initdb.secret
# now names the SAME roleSecret, so the role is born with one source of truth.
# Proven live on hw291: shared-pg-harbor REJECTED as user harbor while
# shared-pg-app AUTHENTICATED; gitea + keycloak (not the initdb owner) both
# authenticated. Harbor down held cutover step-02/03 closed at 9%.
# 0.2.14 — #5473 (Refs #4986): the cross-region replication-source Service
# declared `selectorType: r`, which CNPG expands to a selector matching EVERY
# instance (`cnpg.io/podRole: instance`), not the primary. The mesh Service
# therefore load-balanced across all 3 pods, so a standby could answer as the
# replication source — the DR pair replicated FROM a replica, while status
# reported Healthy / lag 0 throughout. Corrected to `selectorType: rw`
# (primary only), matching what bp-cnpg-pair already declares. Guarded by a
# both-directions render assertion in tests/postgres-render.sh.
#   → 0.2.14.
# 0.2.13 — #5224 (Refs #5220 #4915 #4878; the hw273 harbor 28P01 lockout):
#   role-secrets.yaml gate `not renderReplicaHalf` → `not isReplicaSide`, so a
#   region stamped side=secondary (SOVEREIGN_REGION_ROLE, present from the
#   FIRST render) NEVER mints role-password/hub Secrets — including the #4460
#   PRE-FLIP window where crossRegion (SOVEREIGN_ENABLE_CNPG_PAIR) is still
#   false and the old gate let the secondary mint its own randAlphaNum
#   passwords, frozen forever by `helm.sh/resource-policy: keep` (hw273:
#   region-b shared-pg-harbor sha 59fd1fef… vs region-a 26f87b29…; gitea/
#   keycloak likewise). Those divergent local Secrets are the ammunition for
#   the #5220 G12 promote-flap casualty: a role password asserted from the
#   replica region's local set against the shared `-mesh-rw` write endpoint
#   clobbers the primary's canonical password, and CNPG cannot self-heal (it
#   detects drift ONLY via passwordSecret resourceVersion — managedRolesStatus
#   stayed "reconciled" at rv 28321 while the DB rejected that very password).
#   The replica region consumes region-A's authoritative hub Secrets via the
#   existing catalyst-api cross-mesh sync (#4915/#4918 remedy class + #4878
#   restarts), so the pair's password set is single-sourced by construction.
#   Companion (same PR): continuum-controller re-asserts role passwords
#   through CNPG's managed-roles contract (passwordSecret rv touch) on every
#   acting-primary transition. Primary/singleton render byte-identical; the
#   ONLY delta is the pre-flip secondary, which now renders ZERO Secrets.
#   tests/postgres-render.sh Case 4g added (pre-flip secondary → ZERO
#   Secrets). Lockstep: 16a/16c/16d HR pins + blueprint.yaml + catalog-seed
#   → 0.2.13.
# 0.2.4 — #3878 (companion to #3876, the cycle-1 vc-mgmt DB-secret deadlock):
#   add the optional `reflect.mangledTarget` knob. When a binding declares it,
#   the chart emits a SECOND hub connection Secret named with the vCluster
#   syncer-mangled object name `<secretName>-x-<vclusterNamespace>-x-<vcluster>`
#   (default vcluster `mgmt-vcluster`) and auto-pushes it (emberstack reflector
#   annotations) into the vCluster's host namespace (default `mgmt`). That
#   mangled object is EXACTLY the host Secret an in-vc-mgmt pod mounts in
#   single-namespace mode (`MountVolume.SetUp … secret
#   "<secretName>-x-<ns>-x-mgmt-vcluster" not found`). WHY: #3642 re-homed
#   keycloak/gitea/harbor/grafana INTO vc-mgmt; their pod-mounted DB Secrets
#   reached the in-vc pod ONLY via the bp-mgmt-vcluster `sync.fromHost.secrets`
#   namespace wildcards, which #3876 REMOVED because on vcluster 0.23.0 a Secret
#   that is BOTH fromHost-imported AND pod-mounted (so the toHost necessary-sync
#   ALSO claims it) makes the from-host/to-host syncers fight → context deadline
#   exceeded → app `Init:0/2` 20m+. With #3876 alone the DB Secret reaches the
#   pod NOWHERE. This mangled-name reflect is the native delivery #3876's RCA
#   promised: the DB Secret is NEVER fromHost-imported (no syncer contention →
#   no deadlock) yet the live-password object the kubelet mounts is materialised
#   by the host reflector (no missing credential on a fresh prov). It is the
#   durable form of the hw167 hand-fix (validation agent created the keycloak DB
