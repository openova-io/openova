apiVersion: v2
name: bp-postgres
# 0.1.10 — #3375: sanitize the per-OWNER role-Secret name (roleSecretName
#   helper) so an owner with a legal-Postgres underscore (e.g. `openova_flow`)
#   renders the valid k8s Secret name `<instance>-openova-flow` instead of the
#   RFC-1123-invalid `<instance>-openova_flow`. On hw133 the shared-pg-c HR was
#   Stalled ("Secret \"shared-pg-c-openova_flow\" is invalid: metadata.name …")
#   which blocked the WHOLE bp-catalyst-platform dependsOn chain from upgrading
#   (catalyst-ui frozen on the old image). 0.1.5 already sanitized the Database
#   CR names but missed the role-Secret name — this closes that gap. spec roles
#   + username keep the real underscore'd identifier (Postgres allows it).
# 0.1.9 — #3370: pin bump (no template change vs 0.1.8) so helm-controller
#   performs a HelmRelease UPGRADE on already-converged Sovereigns. The
#   application-cr.yaml self-registration is Capabilities-gated on
#   apps.openova.io/v1; on hw133 the shared-pg{,-b,-c} HRs were INSTALLED at
#   bootstrap (revision .v1) BEFORE the umbrella shipped that CRD, so the gate
#   was false at install time and the Application CRs never rendered
#   (`kubectl get applications -A` → 0 while 3 engines ran). helm-controller
#   only re-renders chart templates on an upgrade, and an upgrade only fires on
#   a new chart version — hence this lockstep bump. The CRD is now registered,
#   so the upgrade renders the 3 bootstrap-owned Application CRs.
# 0.1.7 — #3370 hotfix: bootstrap Application CR stamps environmentRef +
#   regions so it admits under BOTH the pre-#3370 CRD (hard-required) and the
#   #3370 CRD (CEL-waived) — breaks the live upgrade-rollback deadlock that
#   blocked keycloak->gitea->catalyst-platform on hw130.
version: 0.1.10
appVersion: "0.1.2"
description: |
  Catalyst-authored data-instance Blueprint for a shareable, reusable
  PostgreSQL engine. Each install of bp-postgres = ONE
  postgresql.cnpg.io/v1.Cluster (the data instance, a first-class App
  card) reconciled by the CNPG operator that bp-cnpg installs. Per
  ADR-0010 the binding model is pure declarative YAML:

    - one CNPG Cluster CR (the engine; multiInstance + topology aware)
    - N declarative `Database` CRs (databases.postgresql.cnpg.io) — one
      isolated database per consumer on the shared Cluster
    - N `Cluster.spec.managed.roles[]` entries — one per-consumer login
      role, password reconciled from the consumer's app Secret
    - N reflected connection Secrets (bp-reflector) into consumer
      namespaces so each consumer chart runs in externalDatabase mode

  Sharing = N Databases + N roles on ONE Cluster. Ref-count = the Flux
  dependency graph (a consumer HR dependsOn the bp-postgres instance,
  NOT the bp-cnpg operator). NO custom controller and NO Crossplane are
  involved — CNPG's own `Cluster`/`Database`/`managed.roles` CRDs are the
  off-the-shelf primitives (Inviolable Principle #2), reconciled by Flux.

  This chart ships ZERO upstream Helm subchart bytes — every byte is
  Catalyst-authored, on top of the CNPG CRDs bp-cnpg installs. The
  blueprint-release hollow-chart guard (#181) is satisfied via the
  `catalyst.openova.io/no-upstream` annotation.

  Changelog
  ─────────
  0.1.10 (2026-06-14, Refs #3375 — role-Secret name RFC-1123 sanitization)
    - _helpers.tpl: new `bp-postgres.k8sName` sanitizer; `roleSecretName`
      now sanitizes the owner segment so an owner like `openova_flow` yields
      the valid `<instance>-openova-flow` Secret name (was the invalid
      `<instance>-openova_flow`). cluster.yaml managed.roles[].passwordSecret
      and role-secrets.yaml share the helper so the CNPG role reference and
      the created Secret stay in lockstep. The PG role name + username keep
      the verbatim underscore'd identifier. Unblocks hw133 shared-pg-c (was
      Stalled on the invalid Secret name → blocked the bp-catalyst-platform
      dependsOn chain). Completes the 0.1.5 Database-CR-name sanitization,
      which had missed the role-Secret path.
  0.1.9 (2026-06-14, Refs #3370 — pin bump to fire the live upgrade)
    - No template change vs 0.1.8. The application-cr.yaml self-registration
      (Capabilities-gated on apps.openova.io/v1) never materialized on
      already-converged Sovereigns: the shared-pg{,-b,-c} HRs were INSTALLED
      at bootstrap BEFORE the umbrella shipped that CRD (gate false → CR
      skipped), and helm-controller does NOT re-render templates without a
      HelmRelease UPGRADE, which only fires on a new chart version. This
      lockstep version + slot-pin bump (16a/16c/16d) triggers that upgrade;
      the CRD is now registered so the 3 bootstrap-owned Application CRs
      render → 3 Deployment cards + the catalog Instances list populate.
    - slot 16d (shared-pg-c) gains two more Context bindings — `newapi`
      (consumer bp-newapi) + `openova-flow` (consumer bp-openova-flow) — so
      shared-pg-c exposes the spec §5 target set (sme + newapi + openova-flow)
      and the two embedded consumer Clusters can adopt it.
  0.1.6 (2026-06-12, Refs #3370 — Contexts + bootstrap self-registration)
    - templates/application-cr.yaml: when the slot opts in via
      bootstrapOwned.enabled, the chart self-registers the
      apps.openova.io/v1 Application CR for this instance (the canonical
      G117 representation), marked spec.bootstrap=true so the
      application-controller ADOPTS the existing install (status-only
      reconcile — zero duplicate HelmReleases) instead of re-rendering
      it. Gated on `.Capabilities.APIVersions.Has "apps.openova.io/v1"`
      (the cluster.yaml CNPG-CRD idiom) so first-bootstrap ordering
      (this chart installs before bp-catalyst-platform ships the CRD)
      stays wedge-free. spec.parameters.databases carries the
      instance's Context declarations (blueprint contextSchema kind=db,
      valuesKey=databases) verbatim for the generic console Contexts
      projection. Default OFF — console-created instances already carry
      a controller-created Application CR.
  0.1.5 (2026-06-12, Refs #3188 — founder NS-2 three-instance model)
    - Same-owner bindings: managed.roles + the role-password Secret are
      deduped per UNIQUE owner, so one role can own N isolated databases
      (the SME-mesh shape: sme_auth + sme_billing + sme_documents all
      owned by role `sme`). One password per owner, stable across the
      dedupe (lookup role Secret -> lookup any hub of that owner -> mint).
    - Database CR k8s names sanitized (`replace "_" "-"`) so databases
      with legal-Postgres underscores render valid RFC-1123 CR names;
      spec.name keeps the real database name verbatim.
    - Hub connection Secret gains `uri` (CNPG-app-Secret-parity
      postgresql:// connection string, the powerdns-admin #3189 A3
      adoption contract) + optional per-binding `reflect.extraData`
      (static keys, e.g. grafana's GF_DATABASE_TYPE/HOST/NAME/USER) +
      `reflect.passwordAliases` (extra key names carrying the minted
      password, e.g. GF_DATABASE_PASSWORD) so env-style consumers bind
      via upstream envFromSecrets with zero consumer-chart templates.
    - Enables the 3-instance bootstrap-kit shape: slots 16a (shared-pg) +
      16c (shared-pg-b) + 16d (shared-pg-c) are three installs of THIS
      chart, all gated on SOVEREIGN_ENABLE_SHARED_PG.
  0.1.2 (2026-06-11, Refs #3283)
    - FATAL deadlock fix: connection-secret.yaml now creates each reflected
      connection Secret in the RELEASE namespace (shared-data, which always
      exists) instead of the consumer namespace (gitea/harbor, which is
      created by the consumer Blueprints that dependsOn THIS HR). The hub
      Secret PULLS from the CNPG role Secret (reflects) AND is a reflection
      SOURCE (reflection-allowed + reflection-auto-enabled + reflection-
      auto-namespaces) so bp-reflector push-copies a same-named copy into
      each consumer namespace once it appears. Breaks the bp-postgres-shared
      ⟲ bp-gitea/bp-harbor circular deadlock (`namespaces "gitea" not
      found`) that wedged any SHARED_PG=true prov (confirmed live hw127).
      The four annotation keys mirror bp-gitea/bp-harbor cnpg-cluster.yaml
      inheritedMetadata. No dependsOn edge change.
  0.1.1 (2026-06-10, Refs #3188)
    - Master gate `.Values.enabled` (default true). OFF → the chart
      renders ZERO Kubernetes resources (empty Ready release). The
      bootstrap-kit slot 16a wires it to ${SOVEREIGN_ENABLE_SHARED_PG:=
      false} so a non-sharing Sovereign still gets a Ready bp-postgres-
      shared HR (satisfying the unconditional bp-gitea / bp-harbor
      dependsOn) WITHOUT deploying an unused shared-pg Cluster. Sprig-safe
      `ne (toString .Values.enabled) "false"` idiom. No change to the
      default reuse-proof render shape.
  0.1.0 (2026-06-10, ADR-0010, Refs #3188)
    - Initial chart: one CNPG Cluster + per-consumer Database CRs +
      managed.roles + reflected connection Secrets, all driven by
      values.yaml (`databases[]` list). topology.mode active-hot-standby
      renders the synchronous-replication shape per ADR-0004; singleton
      renders a single-instance Cluster.
type: application
keywords:
  - openova
  - catalyst
  - blueprint
  - postgres
  - postgresql
  - cnpg
  - data
  - backing-service
  - shareable
maintainers:
  - name: OpenOva Catalyst
    email: hati.yildiz@openova.io

# No upstream Helm chart — every byte is Catalyst-authored on top of the
# CNPG CRDs that bp-cnpg installs (bp-cnpg is a hard dependency declared
# in blueprint.yaml + the Flux dependsOn edge, NOT a Helm subchart). The
# blueprint-release hollow-chart guard (#181) accepts the annotation.
annotations:
  catalyst.openova.io/no-upstream: "true"
  # Default-values render is intentionally short. Every template (the CNPG
  # Cluster, the Database CRs, the reflected connection Secrets) is gated on
  # `.Capabilities.APIVersions.Has "postgresql.cnpg.io/v1"` — the CNPG CRD is
  # NOT registered during the blueprint-release offline `helm template` smoke
  # render, so the Cluster/Database never render there. The default
  # `databases: []` also renders zero binding Secrets. The result is an empty
  # render, which the smoke-render guard flags as "suspiciously short" unless
  # this annotation declares the short render expected — the same pattern the
  # directly-analogous bp-cnpg-pair (slot 16b) and 30+ sibling charts use. The
  # enabled-render path (1 Cluster + N Databases + N roles + N Secrets, with
  # `--api-versions postgresql.cnpg.io/v1`) is fully covered by the unit test
  # chart/tests/postgres-render.sh, which CI runs via the `tests/*.sh` gate.
  catalyst.openova.io/smoke-render-mode: "default-off"
  catalyst.openova.io/depends-on: "bp-cnpg,bp-reflector"
  catalyst.openova.io/issue: "3188"
