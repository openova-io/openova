{{- /*
The data-instance: ONE CNPG Cluster — the shareable Postgres engine.

Per ADR-0010 each install of bp-postgres renders exactly one Cluster CR.
Consumers SHARE it via the per-binding Database CRs (database.yaml) +
the per-binding managed.roles entries assembled below from databases[].

Capabilities gate (#190 pattern, mirrors bp-gitea/bp-harbor): bp-cnpg
ships the postgresql.cnpg.io/v1 CRD. On a cold install before bp-cnpg is
reconciling, the apiserver rejects this Cluster. The gate skips the
template until the CRD is registered. The Flux dependsOn edge
(bp-postgres-<name> dependsOn bp-cnpg) makes this a no-op in practice.

Master gate (.Values.enabled, default true): when the slot disables sharing
(${SOVEREIGN_ENABLE_SHARED_PG:=false}) the chart renders ZERO resources so
the HR is an empty Ready release. Sprig-safe `ne (toString …) "false"` —
a literal `false` is not "empty", so a plain `if` would misfire (memory
feedback_sprig_default_bool_unsafe).

active-hot-standby split-side (#3375 / #3571): a 2-region Sovereign is two
SEPARATE ClusterMesh-joined clusters, so the data instance renders the
proven bp-cnpg-pair split-side shape rather than a single stretched Cluster
(the hw126 fallacy: one Cluster CR's region-B pods can never schedule on
cluster-A). This file renders the PRIMARY half — the Cluster KEEPS the
instance name (so the consumer host `<instance>-rw` is unchanged) plus the
ClusterMesh-global `-mesh` Service. The REPLICA half is replica-cluster.yaml
(gated to side=replica), which this template skips entirely.
*/ -}}
{{- if and (ne (toString .Values.enabled) "false") (.Capabilities.APIVersions.Has "postgresql.cnpg.io/v1") (not (include "bp-postgres.renderReplicaHalf" .)) }}
{{- $ahs := eq (include "bp-postgres.activeHotStandby" .) "true" }}
{{- $sync := and $ahs (eq (default "sync" .Values.topology.replication.mode) "sync") }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "bp-postgres.instanceName" . }}
  namespace: {{ include "bp-postgres.namespace" . }}
  labels:
    {{- include "bp-postgres.labels" . | nindent 4 }}
    {{- if $ahs }}
    # bp-continuum's switchover sequencer + the Catalyst projector locate
    # the pair via these labels (mirrors bp-cnpg-pair's primary CR). The
    # `-rw` Service of THIS named Cluster is the consumer-facing write
    # endpoint; the cnpg-pair label ties it to the replica half for DR.
    openova.io/cnpg-role: primary
    openova.io/region: {{ .Values.topology.primary.region | quote }}
    catalyst.openova.io/cnpg-pair: {{ include "bp-postgres.instanceName" . | quote }}
    {{- end }}
spec:
  {{- if $ahs }}
  {{- /* active-hot-standby PRIMARY half — the cnpg-pair primary shape.
       instances = haInstances (the pair canonical 3, decoupled from the
       singleton `instances` so a crossRegion flip never perturbs singleton).
       Region-pinning via node-affinity (the operator's idiomatic region
       seam) — NOT the old `affinity.topologyKey` antiAffinity, which only
       spread within ONE stretched cluster (the hw126 fallacy). */}}
  instances: {{ .Values.topology.haInstances | default 3 }}
  primaryUpdateMethod: switchover
  imageName: {{ include "bp-postgres.imageRef" . | quote }}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: openova.io/region
                operator: In
                values: [{{ .Values.topology.primary.region | quote }}]
    podAntiAffinityType: preferred
  {{- else }}
  instances: {{ .Values.topology.instances | default 1 }}
  imageName: {{ include "bp-postgres.imageRef" . | quote }}
  {{- end }}

  bootstrap:
    initdb:
      {{- /*
      Bootstrap the instance with the FIRST binding's database+owner so
      the Cluster is never database-less. Additional bindings are
      provisioned declaratively via Database CRs (database.yaml). When no
      bindings are declared, fall back to a neutral `app` database.
      */ -}}
      {{- $first := first .Values.databases }}
      database: {{ (default (dict) $first).name | default "app" | quote }}
      owner: {{ (default (dict) $first).owner | default "app" | quote }}

  {{- /*
  managed.roles — one declarative per-consumer login role per binding.
  CNPG reconciles CREATE/ALTER ROLE + password from the named Secret on
  every reconcile, so a Secret rotation or initdb-vs-Secret drift is
  ALTER USER'd away (the bp-gitea Wave-5.35 #2211 lesson, generalised).
  0.1.5 (#3188): deduped per UNIQUE owner — bindings may share one owner
  (the Organization mesh's org_auth/org_billing/org_documents all owned by `org`),
  which is N Database CRs on ONE role. The passwordSecret is taken from
  the FIRST binding declaring the owner, matching role-secrets.yaml.

  managed.services (clusterMesh.enabled, primary side — #4460): the
  ClusterMesh-global `-mesh` (read) + `-mesh-rw` (write) Service aliases the
  secondary region resolves cross-mesh. Declared via CNPG's
  `spec.managed.services.additional[]` (CNPG ≥1.22) so CNPG owns the
  Service and applies the `service.cilium.io/global` annotation to the
  right object (the bp-cnpg-pair 0.1.1 fix for "refusing to reconcile
  service: <name>-r, not owned by the cluster"). selectorType: r =
  read-replica endpoint; the secondary region has zero local backends
  matching it, so Cilium's local-affinity routing falls through to this
  primary region. Previously gated on $ahs (crossRegion=true), which made the
  alias appear only after the LATE cnpg-pair flip — but the secondary's
  consumer host is baked to `-mesh-rw` at cloud-init regardless, so the alias
  must exist the moment the mesh peers (#4460). Now gated on the multi-region
  meshGlobalServices signal + side=primary; post-flip render is byte-identical.

  PRIMARY-SIDE ONLY: these managed Services carry REAL local backends (this
  named Cluster's `-rw`/`-r` selectors), so they may render only where the
  authoritative primary lives. On the SECONDARY side (side=secondary, which in
  the pre-flip singleton window still renders THIS singleton Cluster) the
  same-named aliases must be the zero-backend STUB (replica-mesh-service.yaml)
  so the secondary's reads/writes cross the mesh to region-A — never to its own
  local pre-flip singleton DB.
  */ -}}
  {{- $meshSvc := and (eq (include "bp-postgres.meshGlobalServices" .) "true") (eq (include "bp-postgres.side" .) "primary") }}
  {{- if or .Values.databases $meshSvc }}
  managed:
    {{- if .Values.databases }}
    roles:
      {{- $seenOwners := dict }}
      {{- range .Values.databases }}
      {{- if not (hasKey $seenOwners .owner) }}
      {{- $_ := set $seenOwners .owner true }}
      - name: {{ .owner | quote }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ include "bp-postgres.roleSecretName" (dict "ctx" $ "db" .) | quote }}
      {{- end }}
      {{- end }}
    {{- end }}
    {{- if $meshSvc }}
    services:
      additional:
        # #5473 — selectorType MUST be `rw` (primary only), not `r`.
        # CNPG expands `r` to {cnpg.io/cluster, cnpg.io/podRole: instance},
        # which selects EVERY instance — primary and standbys alike. This
        # Service is the cross-region REPLICATION SOURCE, so with `r` the
        # region-b replica's WAL receiver dials the mesh alias and lands on
        # whichever instance the Service happens to pick. Measured live on
        # hw291: all three shared-pg*-mesh Services resolved to 3 endpoints,
        # and 2 of 3 DR pairs were replicating through a STANDBY (shared-pg
        # via shared-pg-3, shared-pg-c via shared-pg-c-1) — a cascade whose
        # RPO is not primary-anchored, whose severing point is an ordinary
        # standby pod no runbook protects, and which lands differently on
        # every reconnect. shared-pg-b hit the primary by luck, 1-in-3.
        # `rw` is what bp-cnpg-pair's replication Service already uses
        # (primary-cluster.yaml), and what the write alias 30 lines below
        # uses; this was the one place the pattern drifted. Nothing observed
        # it, because the Continuum CRs for these pairs carry no standby
        # probe and reported Healthy/lag-0 throughout.
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: {{ include "bp-postgres.replicationServiceName" . }}
              labels:
                {{- include "bp-postgres.labels" . | nindent 16 }}
                catalyst.openova.io/cnpg-pair: {{ include "bp-postgres.instanceName" . | quote }}
                catalyst.openova.io/role: replication-source
              annotations:
                # Cilium ClusterMesh — publish this Service across every peer.
                service.cilium.io/global: "true"
                service.cilium.io/affinity: {{ .Values.topology.clusterMesh.affinity | quote }}
                catalyst.openova.io/blueprint: bp-postgres
            spec:
              type: ClusterIP
              ports:
                - name: postgres
                  port: 5432
                  targetPort: 5432
                  protocol: TCP
        # ClusterMesh-global WRITE alias (#3629). selectorType: rw → the
        # PRIMARY instance only, so the cross-region CONSUMER apps
        # (grafana/keycloak/powerdns-admin) get a host that resolves in BOTH
        # regions and always routes WRITES to the current primary. The
        # replica region has zero local backends matching this selector, so
        # Cilium's affinity routing falls through to this primary region; a
        # same-named stub (replica-mesh-service.yaml) keeps the host from
        # NXDOMAIN-ing on the replica cluster. (The `<instance>-rw` name is
        # reserved by CNPG, hence the `-mesh-rw` alias.)
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: {{ include "bp-postgres.writeServiceName" . }}
              labels:
                {{- include "bp-postgres.labels" . | nindent 16 }}
                catalyst.openova.io/cnpg-pair: {{ include "bp-postgres.instanceName" . | quote }}
                catalyst.openova.io/role: write-endpoint
              annotations:
                service.cilium.io/global: "true"
                service.cilium.io/affinity: {{ .Values.topology.clusterMesh.affinity | quote }}
                catalyst.openova.io/blueprint: bp-postgres
            spec:
              type: ClusterIP
              ports:
                - name: postgres
                  port: 5432
                  targetPort: 5432
                  protocol: TCP
    {{- end }}
  {{- end }}
  # inheritedMetadata: CNPG propagates these onto every Secret it generates
  # (<instance>-app, <instance>-<role>, <instance>-superuser). bp-reflector
  # requires the SOURCE Secret to carry reflection-allowed before it copies
  # data into a DESTINATION Secret in a consumer namespace. This is the
  # CNPG v1.24+ mechanism (#584); setting annotations on the Cluster
  # metadata directly does NOT propagate to generated Secrets.
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"

  postgresql:
    parameters:
      {{- range $k, $v := .Values.instance.parameters }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}
      {{- /*
      active-hot-standby + sync: append the synchronous-replication GUCs
      (ADR-0004). The replica region's externalCluster connects via the
      `streaming_replica` user CNPG provisions automatically.
      `synchronous_commit = remote_apply` blocks COMMIT until the replica
      has REPLAYED the WAL — the Pillar-3 zero-tx-loss bar. It is a
      SETTABLE GUC so it stays a raw parameter.

      `synchronous_standby_names` is NOT settable as a raw parameter — CNPG
      marks it a FIXED configuration parameter and the admission webhook
      REJECTS any explicit set ("Can't set fixed configuration parameter",
      verified live CNPG 1.29.0 hw124 #3195). We therefore declare it via
      CNPG's NATIVE `spec.postgresql.synchronous` block below (CNPG ≥1.24);
      the operator derives `synchronous_standby_names` from it, matching the
      replica Cluster CR's name as the standby application_name. This is the
      exact bp-cnpg-pair primary shape (the old raw-parameter form was the
      pre-#3195 trap that wedged hw124).
      */ -}}
      {{- if $ahs }}
      max_wal_senders: "10"
      max_replication_slots: "10"
      wal_level: "logical"
      {{- if $sync }}
      synchronous_commit: {{ default "remote_apply" .Values.topology.replication.sync.commit | quote }}
      {{- end }}
      {{- end }}
    {{- if $sync }}
    # ── Synchronous replication — CNPG-native (NOT a raw parameter) ────
    # method=first + number=N renders `synchronous_standby_names =
    # FIRST N (...)`; CNPG fills the standby application_name from the
    # connected replica Cluster (<instance>-replica). dataDurability=required
    # strictly enforces the zero-tx-loss bar: COMMIT blocks when fewer than
    # `number` healthy synchronous standbys are connected (Pillar-3).
    synchronous:
      method: first
      number: {{ int (default 1 .Values.topology.replication.sync.numSync) }}
      dataDurability: required
    {{- end }}

  resources:
    {{- toYaml .Values.instance.resources | nindent 4 }}

  storage:
    size: {{ .Values.instance.storageSize | default "5Gi" }}
    # #3971 — when storageClass is empty, OMIT the field so CNPG binds to the
    # cluster DEFAULT StorageClass (the durable cloud CSI — hcloud-volumes on
    # Hetzner). Never default to "local-path": k3s now runs
    # --disable=local-storage so the ephemeral local-path provisioner does not
    # exist, and a Kyverno ENFORCE policy DENIES any local-path reference.
    {{- with .Values.instance.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}

  enableSuperuserAccess: {{ .Values.instance.enableSuperuserAccess | default false }}

  monitoring:
    enablePodMonitor: {{ (default (dict) .Values.instance.monitoring).enablePodMonitor | default false }}
{{- end }}
