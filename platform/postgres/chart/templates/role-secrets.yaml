{{- /*
Per-OWNER role password Secret + per-binding HUB CONNECTION Secret —
rendered TOGETHER in one scope so every Secret carrying a given owner's
password carries the SAME password on every render including the very
first (two separate templates each calling randAlphaNum would mint two
different values on a fresh install).

Why the chart mints the password (0.1.3, #3285 hw130 layer 1): CNPG only
auto-generates the bootstrap owner's credentials; managed.roles[].
passwordSecret is CONSUMED by CNPG, never created. The prior design
waited on Secrets that could not exist.

Why the hub renders its data directly (0.1.4, #3285 hw130 layer 3): the
former `reflects:` pull hit two reflector limitations live — (a) a
destination created BEFORE its source is never retried (the exact
behavior platform/gitea/chart's sync-job comment documented when IT
abandoned this pattern), and (b) reflector refuses to fan out a Secret
that is itself a mirror, so the hub never auto-pushed either. With the
password chart-owned there is nothing to pull: the hub renders the full
connection contract below and stays a clean PUSH source (#3283
source-side pattern) for the consumer namespaces.

0.1.5 (#3188 three-instance model): bindings may now SHARE one owner
(e.g. the Organization mesh's org_auth + org_billing + org_documents databases
all owned by role `org`). The role-password Secret + the managed.roles
entry are deduped per UNIQUE owner — N same-owner bindings = N Database
CRs but ONE role + ONE password. The hub Secret also gains:
  - `uri` — the CNPG-app-Secret-parity connection string
    (postgresql://owner:password@host:port/dbname) so URI-style
    consumers (powerdns-admin's SQLALCHEMY_DATABASE_URI, #3189 A3
    pattern) adopt the instance with a values-only secretKeyRef swap.
  - `reflect.extraData` — optional STATIC keys rendered verbatim, so an
    env-style consumer (grafana's upstream envFromSecrets) reads its
    native variable names (GF_DATABASE_TYPE, GF_DATABASE_HOST, ...).
  - `reflect.passwordAliases` — optional extra key names carrying the
    chart-minted password (GF_DATABASE_PASSWORD), kept in the same
    render scope so aliases NEVER drift from the role password.

Stability: password = lookup(live role Secret) || lookup(live hub
Secret) || randAlphaNum — upgrades never rotate under a running
consumer; resource-policy keep guards release replaces.

Split-side (#3375 / #3571, tightened by #5224): the role-password + hub
connection Secrets are PRIMARY-side only. CNPG's managed.roles[].passwordSecret
is consumed by the PRIMARY Cluster; the replica follower has no managed roles
of its own (it streams the primary's catalog), and the consumer-facing hub
Secrets reflect out of the primary region's shared-data.

Gate = isReplicaSide, NOT renderReplicaHalf (#5224 — the hw273 harbor 28P01
lockout). renderReplicaHalf is `activeHotStandby AND side=replica`, and
activeHotStandby rides topology.crossRegion = SOVEREIGN_ENABLE_CNPG_PAIR,
which flips LATE (post-mesh-convergence, the #4460 pre-flip window). side,
by contrast, is stamped from SOVEREIGN_REGION_ROLE at cloud-init — present
from the very FIRST render. Under the old renderReplicaHalf gate the
secondary region's pre-flip renders (side=secondary, crossRegion=false)
passed the gate and MINTED their own random role passwords (`lookup` finds
nothing locally → randAlphaNum), which `helm.sh/resource-policy: keep` then
preserved forever — a permanently DIVERGENT per-region password set (hw273:
region-b shared-pg-harbor sha 59fd1fef… vs region-a 26f87b29…). Any DR
promote/failback actor that asserts a role password from those local
Secrets against the shared write endpoint then clobbers the primary's
canonical password (the #5220 G12 flap casualty). Gating on the region ROLE
alone means a replica-side region NEVER mints role/hub Secrets — including
the pre-flip singleton window — and instead consumes the primary region's
authoritative values via the catalyst-api cross-mesh hub-secret sync
(the #4915/#4918 keycloak single-sourcing remedy class + #4878), so the
pair's password set is single-sourced by construction. The pre-flip
placeholder singleton Cluster still renders on the secondary (deliberate,
#4460); its managed.roles reference Secrets that do not exist there, which
CNPG surfaces as a pending role reconcile on the throwaway placeholder —
strictly better than a divergent credential that outlives the placeholder.
*/ -}}
{{- if and (ne (toString .Values.enabled) "false") (not (include "bp-postgres.isReplicaSide" .)) }}
{{- $ctx := . }}
{{- $ns := .Release.Namespace }}
{{- $instance := include "bp-postgres.instanceName" . }}
{{- /* Pass 1 — resolve ONE stable password per UNIQUE owner. The role
Secret name is taken from the FIRST binding declaring that owner (per-
binding passwordSecret overrides therefore apply owner-wide). */ -}}
{{- $owners := dict }}
{{- range .Values.databases }}
{{- $db := . }}
{{- if not (hasKey $owners $db.owner) }}
{{- $roleName := include "bp-postgres.roleSecretName" (dict "ctx" $ctx "db" $db) }}
{{- $password := "" }}
{{- $liveRole := lookup "v1" "Secret" $ns $roleName }}
{{- if and $liveRole $liveRole.data $liveRole.data.password }}
{{- $password = $liveRole.data.password | b64dec }}
{{- end }}
{{- $_ := set $owners $db.owner (dict "roleName" $roleName "password" $password) }}
{{- end }}
{{- /* Hub fallback: any reflect-bearing binding of this owner whose live
hub Secret still holds the password (release-replace recovery). */ -}}
{{- $rec := get $owners $db.owner }}
{{- if and (not $rec.password) $db.reflect $db.reflect.secretName }}
{{- $liveHub := lookup "v1" "Secret" $ns $db.reflect.secretName }}
{{- if and $liveHub $liveHub.data $liveHub.data.password }}
{{- $_ := set $rec "password" ($liveHub.data.password | b64dec) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Pass 2 — mint where nothing live exists, then emit ONE role
Secret per unique owner (sorted-key iteration = deterministic order). */ -}}
{{- range $owner, $rec := $owners }}
{{- if not $rec.password }}
{{- $_ := set $rec "password" (randAlphaNum 32) }}
{{- end }}
---
# Role password Secret — CNPG managed.roles[].passwordSecret contract
# (kubernetes.io/basic-auth: username + password). ONE per unique owner.
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: {{ $rec.roleName | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "bp-postgres.labels" $ctx | nindent 4 }}
    catalyst.openova.io/binding: {{ $owner | quote }}
  annotations:
    helm.sh/resource-policy: keep
stringData:
  username: {{ $owner | quote }}
  password: {{ $rec.password | quote }}
{{- end }}
{{- /* Pass 3 — hub connection Secrets, one per binding declaring
`reflect`, each carrying its owner's (deduped) password. */ -}}
{{- /* Consumer-facing DB host (#3629). In active-hot-standby the consumer
apps may run in EITHER region, and the named primary Cluster's `<instance>-rw`
Service is region-LOCAL (it exists only where the primary runs), so a consumer
in the replica region that dials `<instance>-rw` gets NXDOMAIN. Point the hub
`host`/`uri` at the ClusterMesh-global WRITE alias `<instance>-mesh-rw` (a
`selectorType: rw` managed Service on the primary + a replica-side stub) so the
host resolves in BOTH regions and routes WRITES to the current primary. Single-
region (singleton, no mesh) keeps `<instance>-rw` so the render stays byte-
identical to pre-0.2.2. */ -}}
{{- $consumerHost := printf "%s-rw.%s.svc.cluster.local" $instance $ns }}
{{- if eq (include "bp-postgres.activeHotStandby" $ctx) "true" }}
{{- $consumerHost = printf "%s.%s.svc.cluster.local" (include "bp-postgres.writeServiceName" $ctx) $ns }}
{{- end }}
{{- range .Values.databases }}
{{- $db := . }}
{{- if and $db.reflect $db.reflect.secretName }}
{{- $password := (get $owners $db.owner).password }}
{{- /* Build the connection-contract stringData ONCE so every hub copy of
this binding (the consumer-namespace copy below AND the optional vc-mgmt
mangled-name copy in Pass 4) carries byte-identical data — same minted
password, same host, same extraData/host/alias keys. A divergent copy would
hand an in-vCluster pod a different password than the host CNPG role. */ -}}
{{- $data := dict
      "username" $db.owner
      "user" $db.owner
      "password" $password
      "dbname" $db.name
      "host" $consumerHost
      "port" "5432"
      "uri" (printf "postgresql://%s:%s@%s:5432/%s" $db.owner $password $consumerHost $db.name) }}
{{- range $k, $v := $db.reflect.extraData }}{{ $_ := set $data $k $v }}{{ end }}
{{- range $hk := $db.reflect.hostKeys }}{{ $_ := set $data $hk $consumerHost }}{{ end }}
{{- range $hpk := $db.reflect.hostPortKeys }}{{ $_ := set $data $hpk (printf "%s:5432" $consumerHost) }}{{ end }}
{{- range $alias := $db.reflect.passwordAliases }}{{ $_ := set $data $alias $password }}{{ end }}
---
# Hub connection Secret — lives in the release namespace (always exists;
# the #3283 anti-deadlock source-side pattern) and auto-pushes a
# same-named copy into each consumer namespace as it appears.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $db.reflect.secretName | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "bp-postgres.labels" $ctx | nindent 4 }}
    catalyst.openova.io/binding-secret: {{ $db.name | quote }}
  annotations:
    helm.sh/resource-policy: keep
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: {{ join "," $db.reflect.namespaces | quote }}
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: {{ join "," $db.reflect.namespaces | quote }}
stringData:
  # $consumerHost = `<instance>-rw` (singleton) or the ClusterMesh-global
  # `<instance>-mesh-rw` write alias (active-hot-standby) so the host
  # resolves in BOTH regions — see the $consumerHost note above (#3629).
  # The connection-contract keys (username/user/password/dbname/host/port/uri
  # + any extraData/hostKeys/hostPortKeys/passwordAliases) are pre-assembled
  # in $data above so this copy and the optional vc-mgmt mangled copy
  # (Pass 4) never drift.
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- /* Pass 4 — vc-mgmt mangled-name delivery (#3878, companion to #3876).
When a binding declares `reflect.mangledTarget`, emit a SECOND hub Secret
named with the vCluster syncer-mangled object name
`<secretName>-x-<vclusterNamespace>-x-<vcluster>` (default vcluster
`mgmt-vcluster`) and auto-push it into the host namespace the vCluster runs
in (`hostNamespace`, default `mgmt`). That mangled object is EXACTLY the host
secret the in-vc-mgmt pod mounts in single-namespace mode (the failure string
`MountVolume.SetUp … secret "<secretName>-x-<ns>-x-mgmt-vcluster" not found`).

This is the native, host-reflector-driven delivery #3876's RCA comment
promised: the pod-mounted DB Secret is NEVER `sync.fromHost.secrets`-imported
(no from-host syncer claim → no from-host↔to-host ownership fight → no
`context deadline exceeded` deadlock), yet the live-password object the
kubelet mounts is materialised by this reflector copy → no missing credential
on a fresh prov. The reflector preserves the source name on the auto-push, so
the source Secret MUST itself be named the mangled string — hence a dedicated
copy rather than an extra namespace on the plain hub Secret. Data is
byte-identical to the plain hub copy ($data, assembled once above). */ -}}
{{- if $db.reflect.mangledTarget }}
{{- $mt := $db.reflect.mangledTarget }}
{{- $vc := default "mgmt-vcluster" $mt.vcluster }}
{{- $vcNs := required "reflect.mangledTarget.vclusterNamespace is required" $mt.vclusterNamespace }}
{{- $hostNs := default "mgmt" $mt.hostNamespace }}
{{- $mangledName := printf "%s-x-%s-x-%s" $db.reflect.secretName $vcNs $vc }}
---
# vc-mgmt mangled-name hub Secret (#3878). Auto-pushed into the vCluster's
# host namespace as the exact object the in-vc-mgmt pod mounts — delivering
# the DB credential natively WITHOUT a `sync.fromHost.secrets` mirror of the
# pod-mounted Secret (which deadlocks on vcluster 0.23.0 per #3876).
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $mangledName | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "bp-postgres.labels" $ctx | nindent 4 }}
    catalyst.openova.io/binding-secret: {{ $db.name | quote }}
    catalyst.openova.io/vcluster-mangled-target: {{ $hostNs | quote }}
  annotations:
    helm.sh/resource-policy: keep
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: {{ $hostNs | quote }}
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: {{ $hostNs | quote }}
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
