{{- /*
Replica-side ClusterMesh global Service stub (#3375 / #3571).

Cilium ClusterMesh global services are merged BY NAME+NAMESPACE: a Service
participates in the mesh only if a same-named + same-namespace Service exists
in EVERY consuming cluster, each annotated `service.cilium.io/global: "true"`
(upstream Cilium ClusterMesh contract). On the split-side topology the
primary side's `<instance>-mesh` Service is CNPG-managed on cluster-A (via
the primary Cluster CR's `spec.managed.services.additional[]`) — but
cluster-B has no primary Cluster CR, so nothing creates the local Service the
replica's `externalClusters.connectionParameters.host` resolves: without this
stub, DNS for `<instance>-mesh` is NXDOMAIN on cluster-B and the replica can
never open its streaming connection.

This stub:
  - carries the SAME name (`<instance>-mesh`), port (5432), and
    global/affinity annotations as the primary side's managed Service, so
    Cilium merges the two into one global service;
  - uses the primary Cluster's `-r`-equivalent selector
    (`cnpg.io/cluster: <instance>`), which matches ZERO Pods on cluster-B —
    so every connection routes across the mesh to the primary region's
    backends (the `affinity: local` hint falls through to remote when no
    local backend exists);
  - does NOT collide with CNPG ownership: the local CNPG operator on
    cluster-B manages only the replica Cluster's Services
    (`<instance>-replica-r/-ro/-rw`), never this name. (The bp-cnpg-pair
    0.1.0 "refusing to reconcile service" incident was a SAME-cluster
    collision with the primary CR's auto-created `-r` — not possible here,
    the primary CR lives on the other cluster.)

This is the bp-cnpg-pair replica-mesh-service.yaml shape, with the names
keyed off the data instance (`<instance>`) instead of `<fullname>-primary`.
*/ -}}
{{- /* #4460: the secondary-side stub renders whenever the multi-region
   meshGlobalServices signal is set AND this is the SECONDARY side — DECOUPLED
   from $ahs/renderReplicaHalf. In the PRE-FLIP singleton window region-B is
   side=secondary but $ahs=false, so it renders the singleton primary Cluster
   (cluster.yaml) — whose local managed Services are #4460-suppressed on the
   secondary side precisely so this zero-backend stub owns the `-mesh`/`-mesh-rw`
   names instead. That makes the secondary's baked `-mesh-rw` host route
   cross-mesh to region-A's primary the moment the mesh peers, NOT to region-B's
   own pre-flip singleton DB. Post-flip (renderReplicaHalf=true) the render is
   byte-identical to the prior gate. */ -}}
{{- /* #6796 — the stub is zero-backend ONLY if its selector matches no local Pod,
   and in the PRE-FLIP window it did not: the selector below is byte-identical to
   CNPG's own `-rw` selector (`cnpg.io/cluster: <instance>` + `instanceRole:
   primary`), and the #4460 placeholder singleton `<instance>` Cluster on this
   very cluster carries exactly those Pod labels. So suppressing the managed
   alias changed NOTHING about the endpoint set — the stub selected the
   placeholder's primary Pod, `affinity: local` preferred it, and every
   secondary-region write landed on the throwaway DB whose managed roles were
   reconciled off Secrets #5224 deliberately never mints there. Measured live on
   hw307 (dep 9a1f230f, 2026-09-02): region-B `shared-pg-mesh-rw` endpoints =
   10.43.6.197 (the local placeholder shared-pg-1), keycloak-0 CrashLoopBackOff on
   `FATAL: password authentication failed for user "keycloak"` while region A
   was Ready off the same reflected Secret.

   In the pre-flip window (bp-postgres.preFlipSecondary) the selector therefore
   carries one extra term no Pod ever carries, `catalyst.openova.io/mesh-backends:
   remote-only`, making the local endpoint set empty BY CONSTRUCTION so Cilium's
   local-affinity routing falls through the mesh to region A. This is the same
   "zero Pods by construction" idiom peer-mesh-service.yaml already relies on,
   stated explicitly instead of by coincidence of names. Post-flip the placeholder
   is gone and the #6753 consumerAliasCluster selector is unchanged: steady
   (`<instance>`, zero local Pods) and promoted (`<instance>-replica`, REAL local
   backends) renders are byte-identical to 0.2.25. */ -}}
{{- $preFlip := eq (include "bp-postgres.preFlipSecondary" .) "true" }}
{{- if and (ne (toString .Values.enabled) "false") (eq (include "bp-postgres.meshGlobalServices" .) "true") (ne (include "bp-postgres.side" .) "primary") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bp-postgres.replicationServiceName" . }}
  namespace: {{ include "bp-postgres.namespace" . }}
  labels:
    {{- include "bp-postgres.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "bp-postgres.instanceName" . | quote }}
    catalyst.openova.io/role: replication-source
  annotations:
    # Cilium ClusterMesh — same annotations as the primary side's
    # CNPG-managed Service so the mesh merges both into one global service.
    # Zero local backends here → traffic crosses the mesh.
    service.cilium.io/global: "true"
    service.cilium.io/affinity: {{ .Values.topology.clusterMesh.affinity | quote }}
    catalyst.openova.io/blueprint: bp-postgres
spec:
  type: ClusterIP
  selector:
    # #6753 — selects the cluster that CURRENTLY holds the writable primary:
    # `<instance>` in steady state (zero Pods here → cross-mesh to region-A),
    # or the promoted `<instance>-replica` after a #6149 promote (this IS the
    # local promoted cluster on the replica side → REAL local backends, so the
    # ClusterMesh-global `-mesh` alias actually has endpoints again). Byte-
    # identical to `<instance>` whenever the pair is not failed over.
    cnpg.io/cluster: {{ include "bp-postgres.consumerAliasCluster" . }}
    {{- if $preFlip }}
    # #6796 — pre-flip window: the local #4460 placeholder `<instance>` Cluster
    # carries this very cnpg.io/cluster label, so without this term the "stub"
    # selects its Pods and shadows region A. No Pod carries it → zero local
    # backends → cross-mesh.
    catalyst.openova.io/mesh-backends: remote-only
    {{- end }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
{{- /*
Replica-side stub for the ClusterMesh-global WRITE alias `<instance>-mesh-rw`
(#3629). The primary side declares it `selectorType: rw` via the primary
Cluster CR's managed.services (cluster.yaml); this same-named stub (zero local
backends) lets Cilium merge the two into one global service so the cross-region
CONSUMER apps' write host resolves on cluster-B and routes across the mesh to
the primary region's primary instance. Selector adds the CNPG primary-role
label so a same-cluster match would only ever be the local primary (none on the
replica side) — identical merge semantics to the `-mesh` read stub above.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bp-postgres.writeServiceName" . }}
  namespace: {{ include "bp-postgres.namespace" . }}
  labels:
    {{- include "bp-postgres.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "bp-postgres.instanceName" . | quote }}
    catalyst.openova.io/role: write-endpoint
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/affinity: {{ .Values.topology.clusterMesh.affinity | quote }}
    catalyst.openova.io/blueprint: bp-postgres
spec:
  type: ClusterIP
  selector:
    # #6753 — `-rw` selector (primary instance) of the cluster that CURRENTLY
    # holds the writable primary. Steady state → `<instance>` (zero Pods here →
    # cross-mesh to region-A). After a #6149 promote → the LOCAL promoted
    # `<instance>-replica`'s primary Pod (REAL backends), so consumer WRITES to
    # `<instance>-mesh-rw` reach region-B's writable survivor instead of dead-
    # ending on the demoted named cluster. Byte-identical when not failed over.
    cnpg.io/cluster: {{ include "bp-postgres.consumerAliasCluster" . }}
    cnpg.io/instanceRole: primary
    {{- if $preFlip }}
    # #6796 — pre-flip window: this is CNPG's own `-rw` selector, and the local
    # #4460 placeholder's primary Pod satisfies it (hw307: region-B mesh-rw →
    # 10.43.6.197, the throwaway DB → keycloak 28P01). The extra term no Pod
    # carries empties the local endpoint set so writes cross the mesh.
    catalyst.openova.io/mesh-backends: remote-only
    {{- end }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
{{- end }}
