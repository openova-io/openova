{{- /*
NetworkPolicy carve-out for active-hot-standby cross-region replication
(#3375 / #3571).

The platform default-deny CCNP (bp-network-policies) denies all pod-to-pod
traffic by default. In active-hot-standby mode this NetworkPolicy opens the
minimum required paths so the cnpg-pair shape can stream WAL + the CNPG
operator can extract instance status. It is the bp-cnpg-pair networkpolicy.yaml
shape, keyed off this data instance's Cluster names, side-gated per the
split-side topology (a podSelector is evaluated against LOCAL endpoints, so
each side renders only the policies selecting its own Cluster's Pods).

Singleton mode renders NOTHING here — single-region instances have no
cross-region replication path to open, so the default render is byte-identical
to today (no NetworkPolicy object at all).
*/ -}}
{{- if and (ne (toString .Values.enabled) "false") (include "bp-postgres.activeHotStandby" .) .Values.topology.networkPolicy.enabled }}
{{- $isReplica := include "bp-postgres.renderReplicaHalf" . }}
{{- if not $isReplica }}
---
# PRIMARY side: allow the primary Cluster's Pods to accept connections from
# the cluster's SHARED-PG CONSUMERS (keycloak, gitea, harbor, grafana,
# powerdns, newapi, openova-flow, catalyst-api … → <instance>-rw:5432) AND
# the replica Cluster's Pods (delivered into this region by ClusterMesh) AND
# their OWN cluster (instance-to-instance streaming + the multi-instance
# pg_basebackup join — the #3322 own-cluster gap that sat >1h "Creating" on
# hw130) AND the CNPG operator's status/metrics probe.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bp-postgres.instanceName" . }}-allow-replication-to-primary
  namespace: {{ include "bp-postgres.namespace" . }}
  labels:
    {{- include "bp-postgres.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "bp-postgres.instanceName" . | quote }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "bp-postgres.instanceName" . }}
  policyTypes: [Ingress]
  ingress:
    # SHARED-PG CONSUMERS (#3577): the data instance is SHARED — its consumers
    # live in MANY namespaces (keycloak, gitea, harbor, grafana, powerdns,
    # powerdns-admin, org-services, newapi, catalyst-system, …) and every one dials the
    # primary's `<instance>-rw` Service on 5432. This NetworkPolicy selects ALL
    # primary-CR Pods, so it default-denies EVERY ingress it does not list —
    # including all of those consumer connections (on hw144 keycloak-0 →
    # shared-pg-rw timed out, JDBC Acquisition timeout, the whole SSO chain
    # down). The pre-0.2.0 singleton shared-pg carried NO NetworkPolicy at all,
    # so consumers reached 5432 unrestricted; this rule restores that reach
    # under the platform default-deny CCNP. `namespaceSelector: {}` matches
    # Pods in EVERY namespace (the established repo idiom — harbor/guacamole/vpa
    # use it for the same broad in-cluster consumer reachability) so no real
    # consumer is missed — the #3572 regression was OVER-restriction, not under.
    # This is a data-tier engine (consumers only WRITE app SQL on 5432), so the
    # broad allow is scoped to a single port; the replication / own-cluster /
    # operator carve-outs below remain intact.
    - from:
        - namespaceSelector: {}
      ports:
        - port: 5432
          protocol: TCP
    # The replica Cluster's Pods (cross-cluster via ClusterMesh — the
    # selector matches by Pod label regardless of source cluster).
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "bp-postgres.replicaName" . }}
      ports:
        - port: 5432
          protocol: TCP
    # OWN-cluster pods (#3322 carve-out): this policy selects ALL primary-CR
    # Pods, default-denying the cluster's OWN internal 5432 (instance-2's
    # pg_basebackup join, instance-to-instance streaming, switchover rejoin).
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "bp-postgres.instanceName" . }}
      ports:
        - port: 5432
          protocol: TCP
    # CNPG operator status + metrics probe — without this the operator cannot
    # extract instance status and the Cluster phase stalls at "Instance Status
    # Extraction Error" (hw126 symptom).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.topology.networkPolicy.operatorNamespace }}
      ports:
        - port: {{ .Values.topology.networkPolicy.operatorStatusPort }}
          protocol: TCP
        - port: {{ .Values.topology.networkPolicy.operatorMetricsPort }}
          protocol: TCP
{{- if gt (len .Values.topology.networkPolicy.crossRegionPeerClusters) 0 }}
---
# CROSS-REGION DR (#4846): the REPLICA region's Pods (consumers + the replica
# Cluster's pg_basebackup / WAL streaming) reach the primary's 5432 over Cilium
# ClusterMesh. They arrive as KNOWN Cilium endpoints carrying their OWN pod
# security identity — NOT a CIDR identity — so a k8s-NetworkPolicy `ipBlock`
# rule NEVER admits them: Cilium assigns a CIDR identity ONLY to IPs that are
# NOT known endpoints, so a ClusterMesh remote pod is `match none` → deny (the
# #4847 ipBlock shipped inert; proven on hw228). A k8s-netpol label selector is
# ALSO implicitly local-cluster-scoped (Cilium ANDs `io.cilium.k8s.policy.
# cluster=<local>`), so it can't match a remote endpoint either. The CORRECT
# admission is an identity-based CiliumNetworkPolicy selecting the peer
# cluster(s) by the `io.cilium.k8s.policy.cluster` label — this exact shape made
# region-b→region-a pg_isready succeed + the DR replica basebackup complete on
# hw228. Gated on crossRegionPeerClusters (the peer ClusterMesh name(s), stamped
# by catalyst-api at the post-mesh cnpg-pair flip); EMPTY (singleton /
# single-region) → NO CNP → byte-identical default render.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "bp-postgres.instanceName" . }}-crossregion-dr-primary
  namespace: {{ include "bp-postgres.namespace" . }}
  labels:
    {{- include "bp-postgres.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "bp-postgres.instanceName" . | quote }}
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "bp-postgres.instanceName" . }}
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: io.cilium.k8s.policy.cluster
              operator: In
              values:
                {{- range .Values.topology.networkPolicy.crossRegionPeerClusters }}
                - {{ . | quote }}
                {{- end }}
            # ANY-NAMESPACE (#4854 row 67 L2): a namespaced CNP's fromEndpoints
            # is implicitly ANDed with `k8s:io.kubernetes.pod.namespace=<this
            # policy's namespace>` (proven live on hw228 — the derived selector
            # carried `namespace=shared-data`). Without this Exists expression the
            # rule admits ONLY peer-region Pods in shared-data (the DR replica),
            # silently denying every cross-region SHARED-PG CONSUMER in another
            # namespace (grafana ns=grafana, keycloak, gitea, harbor, powerdns …)
            # → `Policy denied` DROP at the primary's bpf_lxc. Referencing the
            # namespace label here suppresses the implicit same-namespace AND, so
            # the rule matches consumers in EVERY peer-region namespace — the
            # cross-cluster mirror of the in-region `namespaceSelector:{}` above.
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
{{- end }}
{{- end }}
{{- if $isReplica }}
---
# REPLICA side: allow the replica Cluster's Pods to accept connections from
# their OWN cluster (instance-2 joins instance-1 via the replica's -rw
# Service on 5432 — the #3322 own-cluster gap) AND from the CNPG operator's
# status/metrics probe.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bp-postgres.instanceName" . }}-allow-replication-to-replica
  namespace: {{ include "bp-postgres.namespace" . }}
  labels:
    {{- include "bp-postgres.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "bp-postgres.instanceName" . | quote }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "bp-postgres.replicaName" . }}
  policyTypes: [Ingress]
  ingress:
    # OWN-cluster pods (#3322 carve-out): the replica Cluster's instance-2
    # joins instance-1 via the replica's -rw Service on 5432; without an
    # explicit allow for the replica's OWN cnpg.io/cluster label it
    # default-denies that join (hw130 24h wedge).
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "bp-postgres.replicaName" . }}
      ports:
        - port: 5432
          protocol: TCP
    # CNPG operator status + metrics probe — the replica side selects its own
    # instance CR Pods, so it needs the same operator carve-out as the primary.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.topology.networkPolicy.operatorNamespace }}
      ports:
        - port: {{ .Values.topology.networkPolicy.operatorStatusPort }}
          protocol: TCP
        - port: {{ .Values.topology.networkPolicy.operatorMetricsPort }}
          protocol: TCP
{{- if gt (len .Values.topology.networkPolicy.crossRegionPeerClusters) 0 }}
---
# CROSS-REGION DR (#4846): the PRIMARY region's Pods (the primary Cluster
# streaming to this replica + consumers reading the replica's -mesh-rw) reach
# the replica's 5432 over ClusterMesh as KNOWN endpoints with their OWN pod
# identity — an `ipBlock` never matches them (same inert-ipBlock root cause as
# the primary side above). Admit them by cluster identity via a
# CiliumNetworkPolicy selecting the peer ClusterMesh name(s). EMPTY → no CNP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "bp-postgres.instanceName" . }}-crossregion-dr-replica
  namespace: {{ include "bp-postgres.namespace" . }}
  labels:
    {{- include "bp-postgres.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "bp-postgres.instanceName" . | quote }}
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "bp-postgres.replicaName" . }}
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: io.cilium.k8s.policy.cluster
              operator: In
              values:
                {{- range .Values.topology.networkPolicy.crossRegionPeerClusters }}
                - {{ . | quote }}
                {{- end }}
            # ANY-NAMESPACE (#4854 row 67 L2): a namespaced CNP's fromEndpoints
            # is implicitly ANDed with `k8s:io.kubernetes.pod.namespace=<this
            # policy's namespace>` (proven live on hw228 — the derived selector
            # carried `namespace=shared-data`). Without this Exists expression the
            # rule admits ONLY peer-region Pods in shared-data (the DR replica),
            # silently denying every cross-region SHARED-PG CONSUMER in another
            # namespace (grafana ns=grafana, keycloak, gitea, harbor, powerdns …)
            # → `Policy denied` DROP at the primary's bpf_lxc. Referencing the
            # namespace label here suppresses the implicit same-namespace AND, so
            # the rule matches consumers in EVERY peer-region namespace — the
            # cross-cluster mirror of the in-region `namespaceSelector:{}` above.
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
{{- end }}
{{- end }}
{{- end }}
