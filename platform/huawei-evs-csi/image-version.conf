# The version tag the driver image is published under, read by
# scripts/check-appversion-bumped-with-source.sh (Refs #7938). A build never
# pushes a version tag that exists, so a change of driver-src must bump the
# -idc.N suffix of DRIVER_TAG in the build workflow, or it is never published.
version-file: .github/workflows/build-bp-huawei-evs-csi.yaml
version-key: DRIVER_TAG
sources: platform/huawei-evs-csi/driver-src
