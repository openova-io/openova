# bp-huawei-evs-csi — Huawei EVS block-storage CSI for HCS/kom4dc.
#
# Driver: the OPEN-SOURCE huaweicloud-csi-driver EVS plugin
# (provisioner `evs.csi.huaweicloud.com`) — NOT the closed-source CCE
# `everest` add-on (disk.csi.everest.io). The everest add-on is bound to
# CCE's agency / IAM pod-identity, ships no public manifests, and cannot run
# on a bare k3s cluster. The open-source driver is purpose-built for
# self-managed clusters: it authenticates with a portable AK/SK INI
# cloud-config and self-discovers each node's ECS server-id from the
# OpenStack metadata service — confirmed reachable on the live hw174 nodes
# (169.254.169.254/openstack/latest/meta_data.json → uuid + availability_zone
# me-east-215a). Verified directly from the driver source (pkg/config/cloud.go,
# pkg/utils/metadatas/metadata.go, pkg/evs/driver.go,nodeserver.go).
#
# Master gate. Default off — a bare `helm install` renders ZERO resources
# (mirrors bp-hcloud-csi). The bootstrap-kit slot 55b flips this true on
# Huawei provs only (HUAWEI_HR_SUSPEND-gated). On Hetzner the slot is
# default-suspended, so this chart never installs there.
enabled: false

# Flip `evs-ssd` to the cluster-default StorageClass (renders the
# is-default-class annotation + runs the default-class flip hook). Tracks
# `enabled` from the slot. Default false so a bare install is reversible.
defaultStorageClass: false

# ─── Huawei AK/SK cloud-config (the driver reads this to call the EVS API) ──
# These values are populated at HelmRelease apply time via Flux `valuesFrom`
# against the canonical flux-system/cloud-credentials Secret (keys
# huawei-ak / huawei-sk / huawei-project-id / huawei-region — seeded by the
# Huawei cloud-init Phase 0). Per docs/PRINCIPLES.md #10 (credentials NEVER
# on the CR / in Git) these stay EMPTY in committed YAML; the live values land
# at apply time and are never persisted. When huaweiAccessKey is empty the
# cloud-config Secret template renders nothing, so a default-off / Hetzner
# render is a clean no-op.
huaweiAccessKey: ""
huaweiSecretKey: ""
huaweiProjectId: ""
huaweiRegion: ""

# `cloud` — the HCS API domain suffix. The driver derives every service
# endpoint as `https://<service>.<region>.<cloud>/` (verified in
# pkg/config/cloud.go newServiceClient). For kom4dc this resolves EVS to
# `https://evs.me-east-215.kom4dc.nationalcloud.om/` — exactly the live
# endpoint probed on hw174.
cloud: "kom4dc.nationalcloud.om"

# `auth-url` — the HCS IAM v3 token endpoint. Pin it EXPLICITLY: the driver's
# auto-default drops the region (`https://iam.<cloud>:443/v3/`) which is wrong
# for HCS. The slot substitutes the live region.
authUrl: "https://iam.me-east-215.kom4dc.nationalcloud.om/v3"

# everest must skip TLS verification against the on-prem HCS CA (not in the
# standard trust store) — mirrors the tofu provider's `insecure = true`.
insecureSkipTLSVerify: true

# `idc` — the OpenOva no-Keystone AK/SK bypass switch (#3971). HCS deployments
# like kom4dc / me-east-215 do NOT publish the Keystone v3 catalog/token
# endpoints (every `/v3/auth/*` path → APIGW.0101 "API does not exist"), so the
# off-the-shelf driver CrashLoops at startup before it ever issues an EVS call.
# When idc=true the PATCHED driver (ghcr.io/openova-io/openova/evs-csi-plugin)
# skips `openstack.Authenticate` (the catalog fetch) entirely and signs every
# EVS request directly with SDK-HMAC-SHA256 AK/SK request signing — the EVS data
# API works fine with AK/SK (tofu provisions EVS disks the same way). Requires a
# non-empty project-id (no Keystone to resolve project-name → project-id). HCS is
# the only target for this chart, so default true; set false only if a Sovereign
# ever runs against PUBLIC Huawei Cloud (which publishes Keystone normally).
idc: true

# ─── StorageClass(es) ───────────────────────────────────────────────────
# The FIRST entry is promoted to cluster-default when defaultStorageClass is
# true. HCS me-east-215 exposes only `SSD` and `SAS` EVS volume types
# (confirmed live via the EVS cinder list-volume-types probe, main.tf line
# ~1066) — SSD is pinned for production IOPS. The volume-type parameter key is
# the FLAT `type` key (verified in pkg/evs/nodeserver.go:512 — NOT everest's
# `everest.io/disk-volume-type`).
#
# reclaimPolicy: Delete (#4350, kom4dc dep 4635277cae4ffed9, 2026-06-25).
# WAS Retain — but Retain on the CLUSTER-DEFAULT class is an EVS-volume LEAK:
# Huawei EVS enforces a project-wide volume-COUNT hard quota (400), and with
# Retain every PVC that is deleted/churned (re-prov, Org teardown, pod
# reschedule, StatefulSet replica scale-down) leaves its backing EVS volume
# ALIVE under a `Released` PV — still billed, still counting against the 400.
# Live forensic on kom4dc: 72 Bound + 63 Released PVs in region-a alone (66
# more in region-B) drove the project to EVS.1034 "volume count exceeded" /
# 413 "Maximum number of volumes allowed (400) exceeded" → every new PVC
# (gitea-shared-storage, harbor-jobservice, seaweedfs, per-Org wordpress
# replicas) stuck Pending → bp-gitea False → bp-catalyst-platform (dependsOn
# bp-gitea) never converged. Delete reclaim frees the EVS volume when the PV
# is released, so churn no longer leaks count quota. Stateful tiers that need
# true retain-on-delete durability (CNPG already streams its own barman WAL
# backups, so it does NOT) can opt into a dedicated retain class via an extra
# catalystStorageClasses entry; the cluster-DEFAULT must be Delete to bound
# the volume count.
catalystStorageClasses:
  - name: evs-ssd
    volumeType: SSD
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    fsType: ext4

# VolumeSnapshotClass for storage-level DR / backup (Velero etc.). The EVS
# driver supports snapshots, but the VolumeSnapshotClass kind requires the
# `snapshot.storage.k8s.io` CRDs (the external-snapshotter / snapshot-controller
# stack) to be present on the cluster. The Catalyst bootstrap-kit does NOT
# install those CRDs anywhere (#4030 — verified live on hw176: no
# snapshot-controller, no volumesnapshotclasses CRD), so rendering this object
# makes `helm install` fail at manifest-build time
# (`no matches for kind "VolumeSnapshotClass" in version
# "snapshot.storage.k8s.io/v1"`) → the whole EVS-CSI release never installs →
# no evs-ssd StorageClass → the storage tier wedges. The CORE storage path
# (evs-ssd StorageClass + CSIDriver + driver pods that the 12 stateful PVCs
# need) does NOT depend on this class, so it defaults OFF. Flip true only on a
# cluster that already carries the snapshot.storage.k8s.io CRDs.
volumeSnapshotClass:
  enabled: false
  name: evs-snapshots
  deletionPolicy: Delete

# ─── driver + sidecar images ────────────────────────────────────────────
# The EVS driver is the OpenOva-PATCHED huaweicloud-csi-driver (#3971): the
# upstream v0.1.x driver does an upfront Keystone catalog/token fetch
# (openstack.Authenticate) that HCS me-east-215's IAM APIGW does NOT publish
# (every /v3/auth/* → APIGW.0101), so it CrashLoops at startup. Our fork (built
# from platform/huawei-evs-csi/driver-src by build-bp-huawei-evs-csi.yaml) adds
# the `idc` no-Keystone bypass: when cloud-config idc=true it skips the catalog
# fetch and signs every EVS request directly with SDK-HMAC-SHA256 AK/SK signing.
# Published to ghcr.io/openova-io/openova/evs-csi-plugin; on kom4dc the
# containerd registry mirror (registry_mirror_yaml_huawei) rewrites ghcr.io →
# harbor.openova.io/proxy-ghcr transparently, so the Kyverno harbor-proxy-pull
# policy passes. Sidecar images are repointed to registry.k8s.io (identical
# paths/tags) via the harbor proxy-k8s cache.
#
# Sidecar tags pinned to the versions the upstream deploy manifests ship (the
# six sig-storage sidecars). Driver tag = the patched fork's release tag.
# imagePullSecrets for the PRIVATE driver image. The patched driver
# (ghcr.io/openova-io/openova/evs-csi-plugin) is a PRIVATE ghcr package, so the
# CSI controller + node pods need the `ghcr-pull` dockerconfigjson secret to
# authenticate to ghcr (#4037 — without it the kubelet falls back to an
# anonymous ghcr token → 401 Unauthorized → ImagePullBackOff → the driver never
# runs → every evs-ssd PVC stays Pending → storage tier wedges behind a green
# evs-ssd StorageClass). The `ghcr-pull` Secret is minted in flux-system by
# cloud-init and reflected (emberstack reflector) into the chart's
# targetNamespace — the cloud-init reflection-allowed/auto-namespaces list MUST
# include `huawei-evs-csi` (fixed in the same #4037). The six sidecar images are
# public harbor proxy-k8s mirrors and need no secret.
imagePullSecrets:
  - name: ghcr-pull

# ─── Global registry rewrite (matches catalyst / continuum chart pattern) ──
# When set, the openova-io DRIVER image (image.driver, below) routes through
# this registry instead of ghcr.io. Per-Sovereign overlays leave this empty;
# the self-sovereign-cutover step-07 image pivot (#4885) sets it to
# registry.<sovereign-fqdn> so the driver pulls from the Sovereign's own Harbor
# post-cutover (the step-08 deny-egress hold blocks ghcr.io). Empty = no rewrite.
# The six sidecar images (image.sidecars.*) are PUBLIC harbor.openova.io proxy-k8s
# mirrors — 3rd-party, NOT openova-io — so they carry their own registry and are
# deliberately NOT rewritten by this seam. The driverImage helper in
# templates/_helpers.tpl performs the host-swap.
global:
  imageRegistry: ""

image:
  driver:
    repository: ghcr.io/openova-io/openova/evs-csi-plugin
    tag: "v0.1.11-idc.1"
    pullPolicy: IfNotPresent
  sidecars:
    provisioner:
      repository: harbor.openova.io/proxy-k8s/sig-storage/csi-provisioner
      tag: "v3.0.0"
    attacher:
      repository: harbor.openova.io/proxy-k8s/sig-storage/csi-attacher
      tag: "v3.3.0"
    resizer:
      repository: harbor.openova.io/proxy-k8s/sig-storage/csi-resizer
      tag: "v1.3.0"
    snapshotter:
      repository: harbor.openova.io/proxy-k8s/sig-storage/csi-snapshotter
      tag: "v4.2.1"
    nodeDriverRegistrar:
      repository: harbor.openova.io/proxy-k8s/sig-storage/csi-node-driver-registrar
      tag: "v2.4.0"
    livenessProbe:
      repository: harbor.openova.io/proxy-k8s/sig-storage/livenessprobe
      tag: "v2.5.0"

# kubelet root dir — k3s uses /var/lib/kubelet. CRITICAL override: the
# upstream node DaemonSet hardcodes CCE's pods path
# (/mnt/paas/kubernetes/kubelet); on k3s it MUST be <kubeletDir>/pods or the
# node plugin can't bind-mount volumes into Pods.
kubeletDir: /var/lib/kubelet

# Cluster name passed to the driver --cluster flag (used for volume metadata
# tagging). The slot substitutes the Sovereign FQDN slug.
clusterName: catalyst

# Controller resourcing (HA — 2 replicas across nodes for multi-node provs).
controller:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# Node plugin (DaemonSet — one per node, privileged for mount).
node:
  resources:
    requests: { cpu: 25m, memory: 48Mi }
    limits: { memory: 192Mi }
