{{/*
huaweicloud-csi-driver EVS node plugin — DaemonSet on every node.

Runs the EVS plugin in node mode (format + mount the attached EVS device into
the Pod's volume path) + the node-driver-registrar sidecar (registers the CSI
socket with the kubelet) + a liveness probe. Mirrors the upstream
deploy/evs-csi-plugin/kubernetes/csi-evs-node.yaml, with the CCE-specific
pods-mount path (/mnt/paas/kubernetes/kubelet) replaced by the k3s default
(<kubeletDir>/pods) — CRITICAL for k3s, else volumes can't mount into Pods.

The node plugin self-discovers THIS node's ECS server-id from the OpenStack
metadata service (http://169.254.169.254/openstack/latest/meta_data.json →
uuid), verified reachable on the live kom4dc nodes — so NO cloud-controller-
manager / providerID is required (the --nodeid flag is deprecated and ignored;
verified in cmd/evs-csi-plugin/main.go). It mounts the cloud-config for the
EVS attach-status queries.

Privileged (bidirectional mount propagation, host /dev + kubelet dir). Gated
on .Values.enabled.
*/}}
{{- if .Values.enabled }}
{{- $img := .Values.image -}}
{{- $kubelet := .Values.kubeletDir | default "/var/lib/kubelet" -}}
{{- $pluginDir := printf "%s/plugins/evs.csi.huaweicloud.com" $kubelet -}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-evs-node
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bp-huawei-evs-csi
    app.kubernetes.io/component: node
    catalyst.openova.io/blueprint: bp-huawei-evs-csi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bp-huawei-evs-csi
      app.kubernetes.io/component: node
  # OnDelete: an upgrade changes the template and replaces NO Pod. The plugin
  # stages each EVS volume (NodeStage, the kubelet's globalmount) in its own
  # mount namespace, so a replaced Pod drops the globalmount of every volume
  # attached to its node, and an EVS-backed Pod that restarts there stays
  # ContainerCreating ("globalmount does not exist", exit 32; hw251, hw271)
  # until the volume detaches. A node takes the new template only when its
  # Pod is deleted after the node is drained (README "Upgrading the node
  # plugin"); a new node gets it at once.
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bp-huawei-evs-csi
        app.kubernetes.io/component: node
    spec:
      {{- with .Values.imagePullSecrets }}
      # Private driver image (ghcr.io/openova-io/openova/evs-csi-plugin) needs the
      # ghcr-pull dockerconfigjson secret — #4037.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: csi-evs-node-sa
      priorityClassName: system-node-critical
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        # Named evs-driver-registrar up to 1.0.13. Helm diffs an upgrade
        # against the last DEPLOYED release. Where 1.0.12 failed, that is
        # 1.0.11 (no probe), while the live container still has 1.0.12's
        # httpGet probes: under the old name the patch kept httpGet beside
        # exec and the API server refused it (more than 1 handler type). A
        # new name makes the patch delete the old container whole and add
        # this one (tests/upgrade-over-failed.sh).
        - name: node-driver-registrar
          # #4973: honour global.imageRegistry so step-07 cutover pivot reaches
          # the sidecar too (post-cutover deny-egress blocks harbor.openova.io).
          image: "{{ include "bp-huawei-evs-csi.sidecarImage" (dict "repository" $img.sidecars.nodeDriverRegistrar.repository "tag" $img.sidecars.nodeDriverRegistrar.tag "global" .Values.global) }}"
          imagePullPolicy: {{ $img.driver.pullPolicy | default "IfNotPresent" }}
          args:
            - "--v=2"
            - "--csi-address=$(ADDRESS)"
            - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
          # Probes on every container (CMP-067): probes-present enforces after
          # the bootstrap window. No --http-endpoint: in v2.4.0 it registers
          # /healthz on a private ServeMux and serves the default one, so
          # /healthz answers 404 for ever (cmd/csi-node-driver-registrar/
          # node_register.go, httpServer). The probe upstream documents for
          # this version is the exec mode below: it passes while the file
          # <dir of --kubelet-registration-path>/registration exists, which the
          # registrar writes when the kubelet calls GetInfo. The path is
          # literal, an exec probe expands no $(VAR); it equals
          # DRIVER_REG_SOCK_PATH, and that directory is mounted below.
          livenessProbe:
            exec:
              command:
                - /csi-node-driver-registrar
                - --kubelet-registration-path={{ $pluginDir }}/csi.sock
                - --mode=kubelet-registration-probe
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /csi-node-driver-registrar
                - --kubelet-registration-path={{ $pluginDir }}/csi.sock
                - --mode=kubelet-registration-probe
            periodSeconds: 10
            timeoutSeconds: 15
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: {{ $pluginDir }}/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
            # The node's plugin directory at its own path, writable, so the
            # registrar can write its registration probe file under a
            # read-only root file system.
            - name: plugin-dir
              mountPath: {{ $pluginDir }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
        - name: liveness-probe
          # #4973: honour global.imageRegistry (see node-driver-registrar above).
          image: "{{ include "bp-huawei-evs-csi.sidecarImage" (dict "repository" $img.sidecars.livenessProbe.repository "tag" $img.sidecars.livenessProbe.tag "global" .Values.global) }}"
          imagePullPolicy: {{ $img.driver.pullPolicy | default "IfNotPresent" }}
          args:
            - "--csi-address=/csi/csi.sock"
            - "--health-port=9810"
          # Its own listener; /healthz on it asks the driver, and the driver's
          # container probes that.
          livenessProbe:
            tcpSocket:
              port: 9810
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 9810
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
        - name: evs-csi-plugin
          # #4885: honour global.imageRegistry so step-07 cutover pivot reaches
          # the driver Pod (sidecars stay on their harbor.openova.io mirrors).
          image: "{{ include "bp-huawei-evs-csi.driverImage" . }}"
          imagePullPolicy: {{ $img.driver.pullPolicy | default "IfNotPresent" }}
          args:
            - "/bin/evs-csi-plugin"
            - "--v=2"
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--cloud-config=/etc/evs/cloud-config"
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9810
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9810
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: {{ $kubelet }}/pods
              mountPropagation: Bidirectional
            - name: device-dir
              mountPath: /dev
            - name: sys-dir
              mountPath: /sys
            - name: evs-config
              mountPath: /etc/evs/
              readOnly: true
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
          securityContext:
            privileged: true
            capabilities:
              add: [SYS_ADMIN]
            allowPrivilegeEscalation: true
      volumes:
        - name: registration-dir
          hostPath:
            path: {{ $kubelet }}/plugins_registry/
            type: DirectoryOrCreate
        - name: plugin-dir
          hostPath:
            path: {{ $kubelet }}/plugins/evs.csi.huaweicloud.com/
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
            path: {{ $kubelet }}/pods
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
            type: Directory
        - name: sys-dir
          hostPath:
            path: /sys
            type: Directory
        - name: evs-config
          secret:
            secretName: cloud-config
{{- end }}
