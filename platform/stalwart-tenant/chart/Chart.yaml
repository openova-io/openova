apiVersion: v2
name: bp-stalwart-tenant
# 0.1.2 (#915) — wire Keycloak OIDC SSO end-to-end so the per-tenant
# Stalwart authenticates webmail / IMAP / SMTP users against the Organization's
# vcluster-local Keycloak realm (epic #915 DoD #2 — alice's mailbox
# logs in via her tenant Keycloak, NOT a shared otech-level IdP).
#
# What 0.1.1 had: the chart shipped values for `keycloak.realmURL`,
# `keycloak.clientID`, `keycloak.clientSecretName` AND a placeholder
# `[directory.keycloak]` block in the bootstrap config.toml. Three
# things broke the actual SSO contract on a fresh tenant:
#   a. the orchestrator's `smeTenantBPStalwart` template (catalyst-api/
#      sme_tenant_gitops.go) emitted ONLY `domain.primary` + `ingress`
#      values — never a `keycloak.*` block. Fresh tenants ran with the
#      chart's empty default `keycloak.realmURL: ""` so no OIDC
#      handshake was possible. Wordpress/openclaw both passed the
#      realmURL — Stalwart was left out.
#   b. the chart's TOML used the pre-0.16 Stalwart key layout
#      (`type = "oidc"`, `url = ...`, `client-id = ...`, kebab-case).
#      Stalwart 0.16+ moved directory definitions to the settings KV
#      store; the OIDC schema serdes camelCase
#      (`@type = "Oidc"`, `issuerUrl`, `claimUsername`, `claimName`,
#      `claimGroups`, `requireScopes`) — verified against the upstream
#      registry schema (crates/registry/src/schema/structs.rs). The
#      kebab-case TOML block was silently ignored.
#   c. the setupJob that registers the OIDC directory via the
#      `/api/settings` admin endpoint was disabled by default
#      (operator-opt-in) — so even when the values landed correctly
#      the actual Stalwart instance still had no OIDC directory at
#      runtime.
#
# 0.1.2 fixes:
#   1. orchestrator emits per-tenant `keycloak.realmURL` =
#      `https://keycloak.<sub>.<parent>/realms/org-<sub>` + `clientID`
#      = `stalwart` + `clientSecretName` = `stalwart-oidc-client-secret`
#      + `oidcExternalSecret.remoteRef.key` =
#      `sovereign/<otech-fqdn>/stalwart/<tenant>/oidc`. Mirrors the
#      bp-wordpress-tenant + bp-openclaw shape so all three apps SSO
#      against the SAME tenant realm with their distinct client IDs
#      (#915 C1 registers all three clients in the realm).
#   2. config.toml emits `[oauth]` block + setup Job seeds the
#      directory entry into Stalwart's settings KV store via the
#      `/api/settings` admin endpoint with the canonical camelCase
#      keys (`directory.keycloak.@type = "Oidc"`, `issuerUrl`,
#      `claimUsername`, `claimName`, `claimGroups`, `requireScopes`).
#      The settings POST is idempotent (assert_empty=false) — re-runs
#      on Helm upgrade without breaking existing logins.
#   3. setupJob defaults to enabled (was off in 0.1.1 because the
#      canonical stalwart-cli image was unpublished). The Job re-uses
#      the upstream Stalwart container which already ships
#      `stalwart-cli` + `curl` — no new image needed.
#
# Per #817 Chart.yaml version MUST equal blueprint.yaml spec.version.
# 0.1.3 (Fix #1902, TBD-A40, 2026-05-19): omit HTTPRoute parentRef
# sectionName by default — multi-zone Sovereigns rename HTTPS listeners
# to https-<sanitised-zone>, breaking NoMatchingListener with the prior
# pinned sectionName: https. Matches the catalyst-system fix in PR #1888.
# 0.1.4 (#4139): default image registry docker.io → harbor.openova.io/proxy-dockerhub
#   for BOTH the StatefulSet + the mailbox-provision setup Job, so the kom4dc node
#   cold-pull does not traverse the public internet (ImagePullBackOff on fresh prov).
# 0.1.5 (#4148): the per-Org Stalwart never converged on a fresh prov — three
#   chart bugs, all diagnosed + live-validated on the omantel.biz demo Org (kom4dc):
#     a. image tag v0.16.3 CrashLooped on the v0.15-era TOML this chart emits
#        (Stalwart v0.16.x rewrote the config parser → `expected value at line 1
#        column 2`). Pinned image v0.16.3 → v0.15.5 (StatefulSet + setup Job),
#        matching the WORKING bp-stalwart-sovereign chart. appVersion → 0.15.5.
#     b. no explicit --config arg → the StatefulSet inherited the image's
#        default `--config /etc/stalwart/config.json` (wrong path + format) and
#        started in bootstrap mode. Added explicit
#        `args: [--config, /opt/stalwart/etc/config.toml]`.
#     c. config.toml's [certificate.default] reads /etc/stalwart/tls/{tls.crt,
#        tls.key} but the StatefulSet mounted no such volume → cert file absent
#        → config parse fails. Added a `tls` Secret volume + readOnly mount at
#        /etc/stalwart/tls, plus a cert-manager Certificate (templates/
#        certificate.yaml) for mail.<tenant-domain> that materialises the
#        Secret zero-touch (secret name configurable via stalwart.tls.secretName,
#        default stalwart-tls).
# 0.1.7 (#4307): per-Org webmail returned 404 at mail.<pool> despite a 1/1
#   Running Pod, AND the HR wedged Ready=False "context deadline exceeded".
#   Two live-validated root causes on the omantel.biz demo Org (kom4dc):
#     a. WEBMAIL 404 — the HTTPRoute parented the APPS cilium-gateway, whose
#        only listeners are `*.<sovereign-fqdn>`. The per-Org webmail host
#        `mail.<slug>.<pool>` matched no listener →
#        Accepted=False/NoMatchingListenerHostname → the gateway served a
#        default 404. Fixed: default ingress.webmail.parentRef.name →
#        `cilium-gateway-console` (carries the `*.<pool>` wildcard listener;
#        matches the wordpress/keycloak/agenity per-Org convention).
#     b. WEBMAIL 503-after-fix — Cilium Gateway traffic carries the reserved
#        `ingress` ENTITY, which no K8s NetworkPolicy selector can match, so
#        the gateway→backend hop would time out (envoy 503) once the route is
#        Accepted. Added templates/cilium-ingress-networkpolicy.yaml with
#        `fromEntities: [ingress]` for the webmail ports (8080/8443), gated on
#        networkPolicy.ingress.allowGatewayEntity + the cilium.io/v2 CRD.
#        Mirrors platform/wordpress-tenant #3785 + platform/newapi #3374.
#     c. HR install-timeout — the non-optional stalwart-tls mount blocks the
#        Pod at ContainerCreating until cert-manager issues the DNS-01 leaf,
#        and Flux's default --wait blocked on StatefulSet readiness BEFORE
#        running the post-install setup Job (a Helm hook) → install timed out,
#        HR stuck InstallFailed, Job never fired. Added
#        spec.manifests.helmRelease.disableWait in blueprint.yaml so the
#        per-Org Application render path stamps install/upgrade.disableWait.
#        Mirrors bp-newapi #4246/#4278.
# 0.1.8 (#4307): per-Org HR STILL Ready=False after 0.1.7 despite a 1/1
#   Running Pod AND disableWait rendering true/true on the per-Org HR.
#   Live diagnosis on the tkt0625 demo Org (omantel.biz region-a) showed
#   the residual False was NOT the cert-mount wait and NOT a hook runtime
#   failure — the HR was InstallFailed/RetriesExceeded because the
#   post-install setup Job (templates/mailbox-provision-job.yaml) declared
#   NO `resources.requests`, so the Sovereign's Kyverno
#   `resource-requests/requests-workload` admission policy DENIED the Job
#   at creation ("Every container must declare resources.requests.cpu and
#   resources.requests.memory"). The denied hook failed the Helm install.
#   Fix: added `mailboxProvisioner.setupJob.resources` (req 10m/32Mi, lim
#   100m/64Mi — overridable) and wired it onto the Job container. The
#   StatefulSet already declared resources (stalwart.resources); only the
#   hook Job was missing them. Mirrors the bp-newapi hook-Job convention.
version: 0.1.10
appVersion: "0.15.5"
description: |
  Catalyst Blueprint scratch chart for a per-Org (per-vcluster) dedicated
  Stalwart mail server. Implements locked decision [Q3] of EPIC #795
  (Organization-tenant turnkey experience) — every Organization on a Sovereign gets its
  OWN Stalwart instance in its tenant namespace, with its OWN domain,
  OWN MTA reputation, and OWN queue. NOT a shared otech-level multi-
  domain Stalwart.

  Footprint trade-off (registered in #795): per-Org Stalwart multiplies
  mail-server resources by N tenants. The trade buys stronger isolation,
  per-customer DKIM/SPF/DMARC posture, and clean blast-radius separation
  on outbound IP reputation.

  Connects to:
    - bp-keycloak           (per-Org-vcluster Keycloak realm — OIDC SSO
                             for webmail and admin API)
    - bp-external-secrets   (admin password + JMAP/IMAP signing material;
                             remoteRef under
                             kv/sovereign/<sov>/stalwart/<tenant>/admin)
    - bp-cert-manager       (TLS for mail.<org-domain> webmail Ingress
                             via cert-manager ClusterIssuer)
    - bp-powerdns           (free-subdomain mode: chart records DKIM/SPF/
                             DMARC required values in a ConfigMap; the
                             unified-rbac console UI surfaces them OR a
                             follow-up Job posts them to PowerDNS API)

  Customer surface: webmail UI at https://mail.<domain.primary>
  (Stalwart's built-in webadmin/JMAP); plus SMTP/IMAP via LoadBalancer.

  Per-tenant mailbox provisioning is event-driven (ADR-0003 §3): the
  unified-rbac service POSTs Stalwart's `/api/principal` admin API when
  the Organization admin creates a new user. The chart ships an ExternalSecret
  binding the admin API token a follow-up controller mints during install.

  Stalwart expression-language gotcha (per stalwart_expression_syntax.md
  memory, 2026-04-14): equality matchers MUST use `==` not `=` — a
  single `=` is assignment and silently never matches. The bootstrap
  config.toml in templates/config-configmap.yaml audits clean for this.

  See platform/stalwart-tenant/README.md for DKIM/SPF/DMARC setup,
  free-subdomain vs BYO domain mode, and the Organization admin runbook.
type: application
keywords: [catalyst, blueprint, stalwart, mail, smtp, imap, jmap, organization, multi-tenant, vcluster]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Scratch chart — Stalwart upstream does not publish a first-party Helm
# chart (contabo-mkt apps/stalwart/* in openova-private is hand-rolled
# Kustomize, not a chart). The Catalyst overlay templates (StatefulSet,
# Services, Ingress, ConfigMap, NetworkPolicy, ExternalSecret consumers,
# mailbox-provision Job) are entirely in templates/ in this chart. The
# `sigstore/common` library subchart below is included ONLY to satisfy
# the platform-wide blueprint-release.yaml hollow-chart gate (issue #181)
# — every umbrella MUST declare at least one dependency. `common` is a
# tiny library chart (helper templates only, zero runtime resources) and
# contributes nothing to the rendered manifests of bp-stalwart-tenant.
dependencies:
  - name: common
    version: "0.1.3"
    repository: "https://sigstore.github.io/helm-charts"

annotations:
  # #2935 (2026-06-03): Blueprint-Release hollow-chart guard exemption.
  # Chart legitimately renders zero resources with default values
  # (default-off feature toggle or dependency-on-CRD pattern). Without
  # this annotation Blueprint-Release rejects publish.
  catalyst.openova.io/smoke-render-mode: "default-off"
