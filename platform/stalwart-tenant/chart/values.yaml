# Catalyst Blueprint scratch chart for per-Org (per-vcluster) Stalwart mail.
#
# Per docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), every operationally-
# meaningful value is operator-supplied at install time; cluster overlays
# in the per-Org GitOps overlay may override any of these
# without rebuilding the Blueprint OCI artifact. The Organization's domain, the
# Keycloak realm URL, the admin secret name, and the webmail/SMTP hosts are
# all required values surfaced by configSchema in blueprint.yaml.

catalystBlueprint:
  upstream:
    chart: ""              # scratch chart — no upstream Helm chart
    version: ""
    repo: ""
    images:
      stalwart: "docker.io/stalwartlabs/stalwart"

# ─── Stalwart application ──────────────────────────────────────────────────
# Single replica per tenant (footprint trade-off registered in #795).
# Stalwart stores all state in RocksDB on a PVC — no horizontal-scale
# requirement at the Organization tier. Resource requests are sized for a small
# Organization (≤ 50 mailboxes, ≤ 5 GB mail spool); operators may bump per-tenant.
stalwart:
  enabled: true
  replicas: 1

  # Pin upstream image — DO NOT use floating tags per
  # docs/INVIOLABLE-PRINCIPLES.md #4. Sovereign-local Harbor proxy-cache
  # mirrors `docker.io/stalwartlabs/stalwart` so runtime pulls don't
  # traverse the public internet (issue #560 + ADR-0001 §11.5). The
  # `global.imageRegistry` value (when set by the per-Sovereign overlay
  # post-handover) rewrites the registry on every pull.
  #
  # #4148 — PINNED to v0.15.5 (was v0.16.3). Stalwart v0.16.x rewrote the
  # config parser: the v0.15-era TOML this chart emits in
  # templates/config-configmap.yaml made the v0.16.3 image CrashLoop at
  # startup with `⚠️ Startup failed: Failed to parse data store settings at
  # /opt/stalwart/etc/config.toml: expected value at line 1 column 2` (the
  # JSON-style parser choking on `[server]`). The WORKING bp-stalwart-sovereign
  # chart runs v0.15.5 against the SAME TOML shape and stays 1/1 Running.
  # Validated live on the omantel.biz demo Org (kom4dc): hand-patching the
  # StatefulSet to v0.15.5 + the --config arg + the TLS mount brought the pod
  # to 1/1 Running. Digest intentionally cleared — the `.image` helper honours
  # `tag` when `digest` is empty, and we did not have a verified v0.15.5 digest
  # at fix time. A per-Sovereign overlay may re-pin a digest if desired.
  image:
    # #4139 — pull through the Sovereign Harbor proxy-dockerhub project so the
    # kom4dc node cold-pull does NOT traverse the public internet to docker.io
    # (which ImagePullBackOffs on a fresh prov, mirroring the #3859 vcluster
    # coredns + #4137 valkey bitnamilegacy fixes). A per-Sovereign overlay
    # may still rewrite this via `global.imageRegistry` post-handover.
    registry: harbor.openova.io/proxy-dockerhub
    repository: stalwartlabs/stalwart
    tag: "v0.15.5"
    digest: ""
    pullPolicy: IfNotPresent
    # Per-Sovereign Harbor pull secret. Empty by default — Sovereign
    # bootstrap-kit overlay supplies the tenant-namespace dockercfg
    # secret name once Harbor proxy-cache is wired (ADR-0001 §11.5).
    pullSecrets: []

  # ─── Server TLS certificate (#4148) ──────────────────────────────────
  # The bootstrap config.toml's `[certificate.default]` block references
  # `%{file:/etc/stalwart/tls/tls.crt}%` + `tls.key`. Stalwart reads those
  # files at parse time, so the StatefulSet MUST mount a kubernetes.io/tls
  # Secret at `/etc/stalwart/tls` or the config never parses and the pod
  # CrashLoops (root cause #3 — verified live on the omantel.biz demo Org).
  #
  # `secretName` is the kubernetes.io/tls Secret the StatefulSet mounts
  # read-only at `/etc/stalwart/tls` (keys `tls.crt` + `tls.key`). When
  # `certificate.enabled=true` (default) the chart emits a cert-manager
  # Certificate for `mail.<tenant-domain>` against `certificate.issuer`,
  # which cert-manager materialises INTO this same Secret name — so the
  # mount is satisfied zero-touch on a fresh prov. Operators who want to
  # reflect an existing per-Org wildcard Secret instead may set
  # `certificate.enabled=false` and point `secretName` at the reflected
  # Secret (Inviolable Principle #4 — every knob overridable).
  tls:
    secretName: "stalwart-tls"
    certificate:
      # Emit a cert-manager Certificate for mail.<tenant-domain> →
      # `secretName`. Default ON so a fresh tenant gets a real leaf cert
      # with NO operator action. Skipped automatically when the tenant
      # domain is empty (smoke-render-safe).
      enabled: true
      # ClusterIssuer to sign against. Defaults to the DNS-01 PowerDNS
      # ClusterIssuer every Sovereign installs (`letsencrypt-dns01-prod-
      # powerdns`) — the canonical per-Org issuer (matches catalyst-api's
      # CATALYST_CONSOLE_TLS_CLUSTER_ISSUER default + the org-controller's
      # consoleTLSDefaultClusterIssuer). `letsencrypt-prod` does NOT exist
      # on a real Sovereign (issue #4246); DNS-01 is also required because
      # the Cilium-gateway Sovereign does not wire a per-host HTTP-01
      # solver. A per-Sovereign overlay may swap to a staging issuer.
      issuerKind: "ClusterIssuer"
      issuer: "letsencrypt-dns01-prod-powerdns"
      duration: "2160h"      # 90d
      renewBefore: "360h"    # 15d

  # #4389/#4292: per-Org LimitRange maxLimitRequestRatio {cpu:1,memory:1}
  # forces Guaranteed QoS — render requests==limits or the StatefulSet pod is
  # 'forbidden: limit to request ratio is 1'.
  #
  # CPU right-sized 1 -> 500m (2026-07-07): a guaranteed FULL core for an idle
  # per-Org mailserver was 50% of the entire S-plan quota (plan-quota caps
  # requests.cpu at 2). Live on hw228 walk-stranger (S-plan): stalwart-0 at 1000m
  # + mysql 250m + wordpress 100m + webmail 250m = 1600m used, leaving only 400m
  # — so bp-openclaw's controller (requests 500m) was quota-DENIED
  # ('exceeded quota: plan-quota, requested cpu=500m, used=1600m, limited=2') and
  # UAT rows 224/232 (#4272 openclaw Ready + /readyz) stayed red. openclaw and
  # stalwart-tenant co-default on the S funnel bundle but were never co-sized to
  # fit 2 vCPU. 500m guaranteed is ample for an idle demo mailserver and frees the
  # headroom openclaw needs. Refs #4272 #4307 #4292.
  resources:
    requests:
      cpu: "500m"
      memory: 1Gi
    limits:
      cpu: "500m"
      memory: 1Gi

  # SecurityContext — non-root + NET_BIND_SERVICE (issue #898).
  #
  # Stalwart's upstream image (docker.io/stalwartlabs/stalwart:v0.15.5)
  # creates an in-image `stalwart` user at UID 2000 and ships the
  # binary at /usr/local/bin/stalwart with file capability
  # `cap_net_bind_service=ep`. The binary needs that capability to
  # bind 25/465/587/143/993 directly (no entrypoint demotion script
  # in this image — the binary is the entrypoint).
  #
  # The 0.1.0 chart ran as UID 65534 with `drop: ALL` — kernel
  # refuses to elevate file capabilities when the caller's bounding
  # set is empty, so exec failed at startup with `operation not
  # permitted` on every fresh tenant (otech103 evidence in #898).
  #
  # 0.1.1 fix: align with the image's native UID 2000, drop ALL
  # then add ONLY NET_BIND_SERVICE. fsGroup 2000 ensures the PVC
  # at /opt/stalwart is writable by the stalwart user without
  # privileged chown.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 2000
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]
      add: ["NET_BIND_SERVICE"]

  # Liveness/readiness via stalwart-cli healthcheck. The CLI authenticates
  # against the local management API using the admin credentials the chart
  # mounts from `admin.secretName` (key ADMIN_PASSWORD). NEVER hardcode
  # the password in the probe (per global CLAUDE.md credential hygiene).
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# ─── Domain configuration ────────────────────────────────────────────────
# `domain.primary` is the Organization's mail domain — every mailbox is
# `<user>@<domain.primary>`. Two modes:
#   - Free subdomain (default): operator overlay sets
#     `acme.<otech-fqdn>` (e.g. acme.omantel.omani.works). The chart
#     emits `stalwart-dns-records-required` ConfigMap and a follow-up
#     Job posts MX/SPF/DKIM/DMARC to the otech PowerDNS API.
#   - BYO domain: operator overlay sets the Organization's own domain
#     (e.g. acme.com). The ConfigMap is still emitted; the Organization admin
#     pastes the records into their public DNS provider. Smoke test
#     in #804 asserts the records are reachable post-creation.
domain:
  # REQUIRED — no default per Inviolable Principle #4.
  # Example: "acme.omantel.omani.works" (free-sub) or "acme.com" (BYO).
  primary: ""

  # mode: "free-subdomain" | "byo"
  # When "free-subdomain", the dns-records-job.yaml hook attempts a
  # PowerDNS API call (operator-supplied creds via dns.powerdns.*).
  # When "byo", the chart only renders the records ConfigMap and the
  # job no-ops (records become the Organization admin's responsibility).
  mode: "free-subdomain"

# ─── Keycloak OIDC integration (Organization-vcluster Keycloak) ─────────────────
#
# Stalwart's webmail and admin API authenticate against the Organization's
# vcluster-local Keycloak realm. The clientID is registered as a
# confidential OIDC client during vcluster provisioning (#804); the
# chart consumes the client secret from `keycloak.clientSecretName`.
keycloak:
  # REQUIRED — Organization-vcluster Keycloak realm issuer URL.
  # Example: "https://auth.acme.<otech-fqdn>/realms/org-acme"
  realmURL: ""
  # OIDC client ID registered in the Organization realm. Convention: "stalwart".
  clientID: "stalwart"
  # ExternalSecret/Secret name carrying the OIDC client secret.
  # Required key: OIDC_CLIENT_SECRET.
  clientSecretName: "stalwart-oidc"
  # Scope set requested. `email` and `profile` map Keycloak claims to
  # Stalwart principal fields; `groups` allows future role-based ACLs.
  scopes:
    - openid
    - email
    - profile
    - groups

  # ExternalSecret render gate for the OIDC client secret. When true
  # (default), the chart emits an ExternalSecret that pulls the OIDC
  # client secret from OpenBao at the canonical path
  # `sovereign/<sovereign-fqdn>/stalwart/<tenant>/oidc` (property
  # OIDC_CLIENT_SECRET). Operator overlay supplies the per-tenant
  # `remoteRef.key`. EMPTY at chart level — the ExternalSecret renders
  # only when `enabled=true` AND `remoteRef.key` is non-empty; otherwise
  # the lookup-or-generate fallback (oidc-client-secret.yaml) owns it.
  oidcExternalSecret:
    enabled: true
    refreshInterval: "1h"
    secretStoreRef:
      kind: "ClusterSecretStore"
      name: "vault-region1"
    remoteRef:
      key: ""
      property: "OIDC_CLIENT_SECRET"

  # #4307/#4272 (FINAL gate): chart-side lookup-or-generate of the OIDC
  # client_secret Secret (templates/oidc-client-secret.yaml) — mirrors this
  # chart's admin-secret.yaml auto-provision. On a funnel Org (or any Org
  # where CATALYST_PER_ORG_REALM_ENABLED=false) NO per-Org bp-keycloak realm
  # is installed, so the authoritative `stalwart-oidc-client-secret` Secret
  # that bp-keycloak's configmap-tenant-realm.yaml would emit is never
  # created; with no ExternalSecret remoteRef.key either, the StatefulSet's
  # required OIDC_CLIENT_SECRET secretKeyRef → CreateContainerConfigError.
  # Default ON: self-generate a stable client_secret so the Pod starts
  # zero-touch. Auto-provisioning is SKIPPED when the ExternalSecret is
  # active (oidcExternalSecret.enabled + remoteRef.key) so the two never
  # fight over the Secret. An overlay may opt out via enabled=false.
  oidcAutoProvision:
    enabled: true

# ─── Mail-spool persistence ────────────────────────────────────────────
# Stalwart RocksDB lives on a PVC. Resize via volumeClaimTemplates
# (StatefulSet) — accessModes ReadWriteOnce per-replica is sufficient
# given replicas: 1.
persistence:
  spool:
    size: 20Gi
    # storageClassName: empty = cluster default. Sovereign overlay sets
    # the per-Sovereign default (e.g. "hcloud-volumes" on Hetzner,
    # "local-path" on k3s) — Inviolable Principle #4.
    storageClassName: ""
    accessModes:
      - ReadWriteOnce

# ─── Admin credentials ─────────────────────────────────────────────────
# `admin.secretName` carries the Stalwart admin (initial superuser)
# password. Two resolution paths, in order:
#   1. operator-supplied SealedSecret named `<secretName>` already
#      present in Release.Namespace — chart references it as-is
#      (`existingSecret` semantics).
#   2. ExternalSecret rendered by templates/admin-externalsecret.yaml
#      sourcing from the operator's OpenBao at the canonical path
#      `kv/sovereign/<sov-fqdn>/stalwart/<tenant>/admin` (property
#      ADMIN_PASSWORD), via a ClusterSecretStore (default `vault-region1`,
#      shipped by bp-external-secrets-stores).
admin:
  # Default name; per-tenant overlay overrides if naming convention
  # differs (Inviolable Principle #4).
  secretName: "stalwart-admin"
  # Local admin user name baked into the bootstrap config. Stalwart's
  # initial superuser. Webmail SSO covers regular users (Keycloak); this
  # account is for the rescue-shell admin path only.
  username: "admin"
  # Auto-provision render gate (#898). When true (default), the chart
  # emits `templates/admin-secret.yaml` which materialises the
  # `<secretName>` Secret with a random 32-char ADMIN_PASSWORD via
  # lookup-persistence (mirrors gitea-admin-secret + marketplace-api-
  # secrets, #830/#887). Set false to opt out — operator pre-creates
  # a SealedSecret OR the ExternalSecret block below is wired with a
  # non-empty remoteRef.key (auto-provision auto-disables in that
  # case, no double-bind).
  #
  # Per docs/INVIOLABLE-PRINCIPLES.md #10 the generated value is
  # written ONLY into the Secret bytes — NEVER echoed or persisted
  # elsewhere. It survives helm upgrade / Flux reconcile via lookup.
  autoProvision:
    enabled: true
  # ExternalSecret render gate — when true (default), the chart emits an
  # ExternalSecret that pulls the admin password from OpenBao. Disable
  # when the operator pre-creates the SealedSecret and wants no churn.
  externalSecret:
    enabled: true
    refreshInterval: "1h"
    secretStoreRef:
      kind: "ClusterSecretStore"
      name: "vault-region1"
    # `key` is the OpenBao path under the ClusterSecretStore base mount.
    # Convention per docs/INVIOLABLE-PRINCIPLES.md #4:
    #   sovereign/<sovereign-fqdn>/stalwart/<tenant>/admin
    # Operator overlay supplies the per-tenant value. EMPTY at the chart
    # level — render fails closed if `externalSecret.enabled=true` and
    # `remoteRef.key` is unset.
    remoteRef:
      key: ""
      property: "ADMIN_PASSWORD"

# ─── Service exposure ──────────────────────────────────────────────────
# SMTP (25), submission (587), submissions (465), IMAPS (993), and HTTP
# (8080 webmail/JMAP) — split across two Services:
#   - service.mail   : LoadBalancer for SMTP/IMAP (public mail traffic)
#   - service.web    : ClusterIP for webmail/JMAP (front by Cilium
#                      Gateway HTTPRoute, NOT a public LB — TLS
#                      termination at the gateway).
service:
  # LoadBalancer (mail traffic — externally routable for MX delivery).
  smtp:
    type: LoadBalancer
    # externalTrafficPolicy=Local preserves source IP for IP-based
    # reputation/RBL policy in Stalwart. k3s ServiceLB and Hetzner
    # cloud-controller-manager both honour this.
    externalTrafficPolicy: Local
    # annotations: per-Sovereign overlay supplies cloud-LB hints
    # (e.g. load-balancer.hetzner.cloud/location: nbg1).
    annotations: {}
    ports:
      smtp: 25
      submission: 587
      submissions: 465
  # IMAP and submission share the SMTP LoadBalancer above; this block is
  # intentionally a thin alias to keep the values surface explicit.
  imap:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations: {}
    ports:
      imaps: 993
      imap: 143
  # ClusterIP for webmail UI + JMAP — fronted by Cilium Gateway HTTPRoute
  # (per ADR-0001 + bp-keycloak gateway pattern). NEVER a public LB —
  # gateway terminates TLS via cert-manager.
  web:
    type: ClusterIP
    ports:
      http: 8080
      https: 443

# ─── Webmail SPA (#4307) ───────────────────────────────────────────────
# Stalwart v0.15.5 is a mail SERVER (JMAP/IMAP/SMTP + a webadmin API) — it
# ships NO end-user webmail SPA. Live probes on the omantel.biz demo Org
# (2026-06-24) confirmed `/`, `/login`, `/webadmin` all return 404 from the
# Stalwart HTTP listener; only `/jmap/session` returns 200. So routing
# `mail.<slug>` straight at Stalwart's `-web` Service is STRUCTURALLY 404 for
# a browser user — there is no login page to serve.
#
# This block bundles SnappyMail — a lightweight, single-container PHP webmail
# that speaks IMAP+SMTP directly (NO database; stores config + per-user data
# as files under /var/lib/snappymail). It is the canonical webmail pairing for
# Stalwart. The webmail Deployment+Service is fronted by the `mail.<slug>`
# HTTPRoute (re-pointed off Stalwart onto this Service), pre-seeded with this
# Stalwart server as the default login domain so the user lands on a working
# login page. Stalwart's own webadmin/JMAP stays reachable in-cluster on the
# `-web` Service and (optionally) on a separate `mailadmin.<slug>` host.
#
# Roundcube was the considered fallback but needs its own MySQL/Postgres DB —
# heavier footprint, an extra StatefulSet + Secret per Org. SnappyMail's
# fileystem-only model fits the per-Org footprint trade-off (#795) far better,
# so it is the default. Gate via webmail.enabled so the pairing is explicit
# and an overlay can opt a BYO-webmail Org out.
webmail:
  enabled: true
  image:
    # #4307 — pull SnappyMail through the Sovereign Harbor proxy-dockerhub
    # project so the node cold-pull does NOT traverse the public internet
    # (mirrors the stalwart image + bp-newapi #4139 convention). A per-
    # Sovereign overlay may rewrite via global.imageRegistry post-handover.
    registry: harbor.openova.io/proxy-dockerhub
    repository: djmaze/snappymail
    # Pin upstream (Inviolable Principle #4 — no floating tags). v2.38.2 is a
    # current stable SnappyMail release; an overlay may re-pin a digest.
    tag: "v2.38.2"
    digest: ""
    pullPolicy: IfNotPresent
    # Per-Sovereign Harbor pull secret — empty by default; the bootstrap-kit
    # overlay reflects the org-namespace ghcr/dockercfg secret name.
    pullSecrets: []
  replicas: 1
  # SnappyMail HTTP listener (upstream djmaze/snappymail default).
  containerPort: 8888
  # #4389/#4292: per-Org LimitRange maxLimitRequestRatio {cpu:1,memory:1}
  # forces Guaranteed QoS — render requests==limits.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # SnappyMail's official image (the-djmaze/.docker/release/Dockerfile) ends
  # with `USER root`: its entrypoint MUST start as root to
  # `chown -R www-data:www-data /var/lib/snappymail` + create the default
  # config, then supervisord drops nginx + php-fpm to the alpine `www-data`
  # user (UID/GID 82). Forcing runAsNonRoot would break that entrypoint chown.
  # This mirrors the bp-wordpress-tenant runtime (runAsUser:0 / runAsNonRoot:
  # false) which the Sovereign already admits — the per-Org Kyverno
  # `runasnonroot` policy is permissive (audit) by design §4.3; the ENFORCED
  # gate is resource-requests (declared below). fsGroup 82 makes the PVC mount
  # group-writable by www-data so the dropped services can write.
  podSecurityContext:
    runAsUser: 0
    runAsNonRoot: false
    fsGroup: 82
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]
      # The entrypoint chown/chmod the data volume as root before demotion.
      add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
  # ─── Default login domain (pre-seed) ──────────────────────────────────
  # SnappyMail auto-lists any `<domain>.json` placed under its data dir at
  # `_data_/_default_/domains/`. The chart renders one for the tenant's mail
  # domain (templates/webmail-domain-configmap.yaml) pointing IMAP/SMTP at the
  # in-cluster Stalwart Services, and an initContainer copies it into the data
  # dir on start so the login page works zero-touch. `type` is the secure
  # mode: 0=None, 1=STARTTLS, 2=SSL/TLS.
  domainSeed:
    enabled: true
    imap:
      # In-cluster Stalwart IMAP Service (service-imap.yaml). 993 = implicit
      # TLS (type 2). The Stalwart leaf cert is for mail.<domain>, not the
      # in-cluster Service DNS name, so peer verification is disabled for this
      # internal hop (the public TLS terminates at the Cilium gateway).
      port: 993
      type: 2
    smtp:
      # In-cluster Stalwart SMTP submission Service (service-smtp.yaml). 587 =
      # STARTTLS (type 1), with SMTP AUTH enabled.
      port: 587
      type: 1
  # SnappyMail persists per-user settings + sessions on disk. A small PVC
  # keeps them across pod rolls. emptyDir is acceptable for a stateless
  # login-only surface; default to a PVC for durability.
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  # Liveness/readiness on the SnappyMail HTTP port.
  probes:
    liveness:
      initialDelaySeconds: 20
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
  # ─── Stalwart webadmin/JMAP route (optional, separate host) ────────────
  # The `mail.<slug>` HTTPRoute now fronts the SnappyMail webmail Service (see
  # ingress-webmail.yaml). Stalwart's own webadmin/JMAP is still reachable
  # in-cluster on the `-web` Service; an operator who wants it publicly
  # exposed can flip this to render a SECOND HTTPRoute on `mailadmin.<slug>`
  # (host composed from the tenant domain) → the Stalwart `-web` Service. OFF
  # by default — the per-Org admin UI is an operator surface, not customer-
  # facing, and is reachable via in-cluster port-forward / the console.
  adminRoute:
    enabled: false
    # Empty = composed as `mailadmin.<tenant-domain>`. Operator overlay may
    # override for a vanity host.
    host: ""

# ─── Webmail Ingress / HTTPRoute ───────────────────────────────────────
# The `mail.<domain.primary>` HTTPRoute fronts the SnappyMail webmail Service
# (#4307 — see the `webmail` block above), NOT the Stalwart mail server, which
# ships no end-user SPA. Two backends in front of the chart:
#   - Cilium Gateway HTTPRoute (ADR-0001 §"gateway") at
#     `mail.<domain.primary>`, parentRef the per-Sovereign cilium-gateway
#     in kube-system. This is the canonical Sovereign exposure.
#   - Optional `traefik` Ingress fallback (kept for sandbox/k3s setups
#     where the Cilium Gateway is not yet provisioned).
ingress:
  webmail:
    # mode: "gateway" | "ingress"
    # "gateway" (DEFAULT) renders an HTTPRoute against cilium-gateway.
    # "ingress" renders a networking.k8s.io/v1 Ingress with the supplied
    # ingressClassName.
    mode: "gateway"
    # Default host: mail.<domain.primary>. Operator overlay overrides
    # for vanity hosts (Inviolable Principle #4 — empty here triggers
    # the helper to compose mail.<domain.primary>; an explicit string
    # wins).
    host: ""
    path: "/"
    # #4307 — the route backend. Default targets the SnappyMail webmail
    # Service (`<fullname>-webmail` on webmail.containerPort) when
    # webmail.enabled, so `mail.<slug>/` serves a webmail login UI instead of
    # the Stalwart server's bare 404. EMPTY here = the chart's webmailRoute
    # helpers auto-resolve to the webmail Service (or, when webmail.enabled is
    # false, fall back to the Stalwart `-web` Service for backward compat). An
    # overlay may pin an explicit backend Service+port.
    backendService: ""
    backendPort: 0
    # Gateway parentRef — the DEDICATED cilium-gateway-console (#4307),
    # NOT the apps cilium-gateway. The per-Org webmail host
    # `mail.<slug>.<pool>` resolves to the console-ELB EIP which fronts the
    # ISOLATED console Gateway (#4054/#4070), and ONLY the console Gateway
    # carries the `*.<pool>` (e.g. `*.demo.omani.homes`) wildcard listener.
    # Parenting the apps cilium-gateway (whose only listeners are
    # `*.<sovereign-fqdn>`) made the HTTPRoute go
    # `Accepted=False reason=NoMatchingListenerHostname` → the gateway served
    # a default 404 for mail.<pool> despite a healthy 1/1 Pod (verified live
    # on the omantel.biz demo Org 2026-06-24). Mirrors the
    # bp-wordpress-tenant / bp-keycloak / bp-agenity per-Org convention which
    # all parent cilium-gateway-console. See org_console_tls.go
    # consoleGatewayNamespace.
    parentRef:
      name: cilium-gateway-console
      namespace: kube-system
      # sectionName intentionally empty — the console Gateway exposes one
      # wildcard HTTPS listener per pool zone, matched by hostname filter.
      # Pinning a sectionName breaks NoMatchingListener on multi-zone pools.
      # See PR #1888 / TBD-A40 / issue #1902 / #4307.
      sectionName: ""
    # cert-manager Certificate (mode=ingress only). Gateway mode relies
    # on the gateway's wildcard cert.
    tls:
      enabled: true
      # See note above — `letsencrypt-prod` is absent on Sovereigns (#4246).
      issuer: "letsencrypt-dns01-prod-powerdns"
      secretName: "stalwart-webmail-tls"
    # ingress fallback (mode=ingress)
    ingressClassName: "traefik"
    annotations: {}

# ─── Mailbox provisioning hook (event-driven, ADR-0003 §3) ─────────────
# When the unified-rbac service in the OTECH control plane creates an
# Organization user, it publishes a `org.user.created` event to NATS. The
# subscriber that lives alongside this Stalwart calls Stalwart's
# `/api/principal` admin API to provision the mailbox.
#
# Two delivery shapes (operator chooses):
#   - Inline subscriber (default OFF): the chart ships a Deployment
#     `mailbox-provisioner` that subscribes to NATS and calls Stalwart.
#     Disabled by default to keep first-install footprint small;
#     #804 (tenant provisioning pipeline) flips it on per-tenant.
#   - One-shot Job (default ON): the chart ships a Job that runs at
#     install time to seed the admin principal in Stalwart and create
#     the OIDC client config inside Stalwart's RocksDB so OIDC login
#     works from t=0.
mailboxProvisioner:
  # Run-once setup Job (admin principal + OIDC directory entry in
  # Stalwart's runtime settings KV store). Re-uses the upstream
  # stalwart container (ships `stalwart-cli` AND `curl` for HTTP calls)
  # — no separate `stalwart-cli` image needed (#915, replaces the
  # 0.1.1 default-off posture).
  #
  # 0.1.2 (#915): defaults to enabled so a fresh tenant has working
  # Keycloak OIDC at t=0. The Job POSTs the OIDC directory entry to
  # `/api/settings` with the canonical camelCase keys
  # (`directory.keycloak.@type = "Oidc"`, `issuerUrl`, `claimUsername`,
  # `claimName`, `claimGroups`, `requireScopes`) the upstream registry
  # schema expects. Idempotent: re-runs on Helm upgrade leave the
  # existing directory in place.
  setupJob:
    enabled: true
    image:
      # Re-use the upstream Stalwart image which already ships curl +
      # stalwart-cli. SHA-pinned via the same digest as the StatefulSet
      # so the bytes trace back to a single source (#898 / #560 ADR-0001
      # §11.5 — Sovereign-local Harbor proxy-cache rewrites at runtime).
      # #4139 — the mailbox-provision-job template composes `repository:tag`
      # directly (no registry field), so the harbor proxy path is carried in
      # the repository value, matching the StatefulSet's registry default and
      # avoiding the docker.io cold-pull ImagePullBackOff on kom4dc.
      # #4148 — PINNED to v0.15.5 in lockstep with the StatefulSet image so the
      # setup-Job's stalwart-cli / curl bytes trace back to the SAME running
      # image. Digest cleared (tag-pinned) per the StatefulSet note above.
      repository: harbor.openova.io/proxy-dockerhub/stalwartlabs/stalwart
      tag: "v0.15.5"
      digest: ""
      pullPolicy: IfNotPresent
    # Job timeout — the Stalwart pod must be Ready before the Job's
    # API calls succeed. 10 min is generous for cold starts on small
    # nodes.
    activeDeadlineSeconds: 600
    backoffLimit: 6
    # 0.1.8 (#4307) — the setup Job container MUST declare
    # resources.requests.{cpu,memory} or the Sovereign's Kyverno
    # `resource-requests/requests-workload` admission policy DENIES the
    # Job at creation ("Every container must declare resources.requests.cpu
    # and resources.requests.memory"). On the tkt0625 demo Org the
    # StatefulSet Pod was 1/1 Running and `disableWait` rendered true/true,
    # yet the HR wedged InstallFailed/RetriesExceeded because this
    # post-install Helm hook Job was rejected at admission and never
    # created. A short-lived curl/stalwart-cli bootstrap needs almost
    # nothing — mirror the bp-newapi hook-Job footprint
    # (database-secret-sync-job etc.). Overridable per Inviolable
    # Principle #4.
    # #4389/#4292: Guaranteed QoS for the per-Org LimitRange (the setup Job
    # runs in the Org ns too).
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 64Mi
  # Continuous NATS subscriber Deployment. OFF by default at chart
  # level — turned on by the per-tenant overlay in #804 once the Organization
  # vcluster's NATS subject is known.
  natsSubscriber:
    enabled: false
    natsURL: ""
    subject: "org.user.created"

# ─── DKIM/SPF/DMARC records ────────────────────────────────────────────
# Two paths:
#   - Free-subdomain (default): the chart emits the required record set
#     (MX, SPF, DKIM-pubkey, DMARC) to a ConfigMap
#     `stalwart-dns-records-required` AND ships a Job that POSTs them
#     to the operator's PowerDNS API (creds via secret reference). The
#     unified-rbac console UI reads the ConfigMap to display "DNS
#     setup complete" status to the Organization admin.
#   - BYO: the same ConfigMap is emitted; the Job no-ops (mode flag);
#     Organization admin copies the records into their own DNS provider.
dns:
  # PowerDNS API endpoint (free-subdomain mode only). Empty for BYO.
  powerdns:
    enabled: false
    apiURL: ""                           # e.g. https://pdns.<otech-fqdn>/api
    # ExternalSecret name carrying the PowerDNS API key. Required key:
    # PDNS_API_KEY. Sourced from the otech-level PowerDNS bootstrap
    # secret (ADR-0001).
    apiKeySecretName: ""
    zone: ""                             # parent zone, e.g. "<otech-fqdn>"
  # DKIM key generation — Stalwart handles this internally on first boot
  # and exposes the public key via the admin API. The setup Job reads
  # it back and records it in the ConfigMap. Selector default `dkim`.
  dkim:
    selector: "dkim"
    algorithm: "ed25519-sha256"
  # SPF record content (rendered into the ConfigMap). The mx + ip4 hints
  # are filled at render time from the LoadBalancer external IP (post
  # service-ready) — the bootstrap Job runs after the LB IP is known.
  spf:
    policy: "-all"                       # -all = hard fail; ~all = soft
  # DMARC policy.
  dmarc:
    policy: "reject"                     # reject | quarantine | none
    rua: ""                              # operator-supplied (e.g. dmarc@<domain>)

# ─── ServiceAccount ────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ─── NetworkPolicy ─────────────────────────────────────────────────────
# Default-deny posture at the namespace level (per ADR-0001 multi-tenant
# isolation). Explicit allows:
#   Ingress  — webmail traffic from the gateway namespace; SMTP/IMAP
#              from anywhere (public mail traffic via LoadBalancer).
#   Egress   — Keycloak (OIDC), DNS, NATS (provisioner subscriber),
#              public SMTP for outbound delivery (port 25 to anywhere).
networkPolicy:
  enabled: true
  ingress:
    fromGatewayNamespaceLabels:
      kubernetes.io/metadata.name: kube-system
    # #4307 — Cilium Gateway API traffic reaches the webmail Pod with the
    # reserved `ingress` ENTITY identity (the Envoy proxy embedded in the
    # cilium agent), which NO standard K8s NetworkPolicy selector
    # (podSelector / namespaceSelector / ipBlock) can express — so the
    # gateway→backend hop times out (envoy 503 "upstream connect error")
    # even with the kube-system namespaceSelector above. This toggle ships
    # an additive CiliumNetworkPolicy (templates/cilium-ingress-network
    # policy.yaml) with `fromEntities: [ingress]` for the webmail HTTP ports
    # — the canonical fix (mirrors platform/wordpress-tenant #3785 +
    # platform/newapi #3374). Gated on the cilium.io/v2 CRD being present so
    # it no-ops on kind CI. Set false on a non-Cilium cluster.
    allowGatewayEntity: true
  egress:
    # bp-keycloak (OIDC discovery + token endpoint)
    - namespaceLabel: keycloak
      port: 8443
    # bp-nats-jetstream (mailbox-provisioner subscriber)
    - namespaceLabel: nats
      port: 4222
    # PowerDNS (otech-level) for DKIM/SPF/DMARC publishing
    - namespaceLabel: powerdns
      port: 8081

# ─── ServiceMonitor ────────────────────────────────────────────────────
# Default false per docs/BLUEPRINT-AUTHORING.md §11.2 (Observability
# toggles must default false). Operator opts in via per-cluster overlay.
serviceMonitor:
  enabled: false
  interval: "30s"
  scrapeTimeout: "10s"
  path: "/metrics"
  port: "http"

# ─── Global registry override (post-handover Harbor) ───────────────────
global:
  imageRegistry: ""
