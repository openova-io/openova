{{- /*
Stalwart per-tenant StatefulSet — single replica with PVC for the
RocksDB mail spool. Per docs/INVIOLABLE-PRINCIPLES.md #4 every knob is
operator-tunable; per ADR-0001 the per-Sovereign Harbor proxy-cache is
honoured via `global.imageRegistry`.
*/}}
{{- if .Values.stalwart.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bp-stalwart-tenant.fullname" . }}
  labels:
    {{- include "bp-stalwart-tenant.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "bp-stalwart-tenant.fullname" . }}-headless
  replicas: {{ .Values.stalwart.replicas }}
  selector:
    matchLabels:
      {{- include "bp-stalwart-tenant.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bp-stalwart-tenant.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the bootstrap config or DNS-records ConfigMap
        # changes. RocksDB persists user state across restarts so the
        # config-only roll is safe.
        checksum/config: {{ include (print $.Template.BasePath "/config-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "bp-stalwart-tenant.serviceAccountName" . }}
      {{- with .Values.stalwart.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.stalwart.podSecurityContext | nindent 8 }}
      containers:
        - name: stalwart
          image: {{ include "bp-stalwart-tenant.image" . | quote }}
          imagePullPolicy: {{ .Values.stalwart.image.pullPolicy }}
          # #4148 — pin the config path explicitly. The upstream image's
          # default CMD is `--config /etc/stalwart/config.json` (wrong path
          # AND wrong format); inheriting it made the pod start in bootstrap
          # mode ("No configuration file was found") on a fresh tenant. The
          # bp-stalwart-sovereign pod runs the same explicit
          # `--config /opt/stalwart/etc/config.toml` invocation. Pinning it
          # here makes the StatefulSet image-version-independent.
          args: ["--config", "/opt/stalwart/etc/config.toml"]
          securityContext:
            {{- toYaml .Values.stalwart.containerSecurityContext | nindent 12 }}
          ports:
            - name: smtp
              containerPort: 25
              protocol: TCP
            - name: submission
              containerPort: 587
              protocol: TCP
            - name: submissions
              containerPort: 465
              protocol: TCP
            - name: imap
              containerPort: 143
              protocol: TCP
            - name: imaps
              containerPort: 993
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            {{- include "bp-stalwart-tenant.adminPasswordEnv" . | nindent 12 }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.clientSecretName | quote }}
                  key: OIDC_CLIENT_SECRET
                  # #4307/#4272 (FINAL gate): optional so the StatefulSet Pod
                  # can SCHEDULE before the OIDC client_secret Secret is
                  # reflected/seeded (the chart self-generates it via
                  # oidc-client-secret.yaml, but the kubelet evaluates env-
                  # secretKeyRef at container start — a non-optional ref hard-
                  # fails CreateContainerConfigError if the Secret lags the Pod).
                  # Matches the already-optional ref in mailbox-provision-job.yaml.
                  optional: true
            - name: STALWART_DOMAIN
              value: {{ include "bp-stalwart-tenant.tenantDomain" . | quote }}
            - name: STALWART_HOSTNAME
              value: {{ include "bp-stalwart-tenant.webmailHost" . | quote }}
          resources:
            {{- toYaml .Values.stalwart.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/stalwart
            - name: config
              mountPath: /opt/stalwart/etc
              readOnly: true
            # #4148 — the bootstrap config.toml's [certificate.default]
            # block references %{file:/etc/stalwart/tls/tls.crt}% +
            # tls.key. Without this mount the cert file is absent and the
            # whole config fails to parse (root cause #3, verified live).
            - name: tls
              mountPath: /etc/stalwart/tls
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: {{ .Values.stalwart.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.stalwart.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.stalwart.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.stalwart.probes.liveness.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: {{ .Values.stalwart.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.stalwart.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.stalwart.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.stalwart.probes.readiness.failureThreshold }}
      volumes:
        - name: config
          configMap:
            name: {{ include "bp-stalwart-tenant.configMapName" . }}
            items:
              - key: config.toml
                path: config.toml
        # #4148 — kubernetes.io/tls Secret carrying tls.crt + tls.key.
        # Emitted by templates/certificate.yaml (cert-manager Certificate
        # for mail.<tenant-domain>) when stalwart.tls.certificate.enabled,
        # or an operator-reflected per-Org wildcard Secret of the same name.
        - name: tls
          secret:
            secretName: {{ .Values.stalwart.tls.secretName | quote }}
            # NON-optional on purpose. If the Secret is not yet present the
            # kubelet holds the pod at ContainerCreating until cert-manager
            # issues the leaf into it — then it starts clean. An `optional:
            # true` mount would let the pod start with an EMPTY /etc/stalwart/
            # tls, the cert file would be absent, and the config.toml parse
            # would fail → CrashLoop (the exact bug this fixes). Blocking at
            # ContainerCreating until the cert exists is the correct
            # convergence behaviour and matches bp-stalwart-sovereign.
  volumeClaimTemplates:
    # #5615-followup (2026-08-06, live hw292 funnel Org uatco): use the
    # STABLE label subset here, never the full bp-stalwart-tenant.labels
    # helper. volumeClaimTemplates[].metadata is immutable post-create on
    # a StatefulSet — a version-bearing label (helm.sh/chart,
    # app.kubernetes.io/version) here means EVERY future chart bump
    # permanently blocks `helm upgrade` for any Org whose StatefulSet
    # already exists ("Forbidden: updates to statefulset spec ...
    # forbidden"). See templates/_helpers.tpl stableLabels + the
    # volumeclaimtemplate-stable-labels.sh guard.
    - metadata:
        name: data
        labels:
          {{- include "bp-stalwart-tenant.stableLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.spool.accessModes | nindent 10 }}
        {{- if .Values.persistence.spool.storageClassName }}
        storageClassName: {{ .Values.persistence.spool.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.spool.size | quote }}
{{- end }}
