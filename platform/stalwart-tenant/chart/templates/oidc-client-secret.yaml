{{- /*
oidc-client-secret.yaml — chart-side lookup-or-generate of the per-Org
Stalwart OIDC client_secret (#4307 / #4272 — FINAL gate).

WHY THIS EXISTS — the per-Org-realm-disabled gap (mirrors admin-secret.yaml).

On a Sovereign the canonical source of this Secret is bp-keycloak's
`configmap-tenant-realm.yaml`, which find-or-generates a confidential
`stalwart` client in the per-Org realm and emits a K8s Secret named
`stalwart-oidc-client-secret` carrying the `OIDC_CLIENT_SECRET` key. BUT that
template runs ONLY when a per-Org bp-keycloak realm is installed for the Org —
which the funnel/generic path SKIPS, and which the org-controller's per-Org-
realm auto-wiring also skips when `CATALYST_PER_ORG_REALM_ENABLED=false` (the
intentional default). With no per-Org realm AND no operator-supplied
`oidcExternalSecret.remoteRef.key`, the Secret is NEVER created → the
StatefulSet's required `OIDC_CLIENT_SECRET` secretKeyRef →
CreateContainerConfigError → the Pod never starts (the live #4307/#4272 final
blocker on a funnel Org).

THE FIX — mirror this chart's own admin-secret.yaml: a `lookup`-or-generate
fallback so a fresh per-Org install WITHOUT a per-Org bp-keycloak realm AND
WITHOUT an authoritative ExternalSecret still gets a stable
`stalwart-oidc-client-secret` and the StatefulSet Pod starts. The setup Job
(mailbox-provision-job.yaml) then registers the Stalwart-side OIDC directory
using this secret. When bp-keycloak's realm-config (or an ExternalSecret) later
lands the REAL client_secret bytes, this template re-emits the existing bytes
(lookup) → a no-op; both sides carry helm.sh/resource-policy: keep.

Render gates (skip auto-provisioning when an authoritative source is in play),
matching admin-secret.yaml's switch:
  1. `keycloak.oidcAutoProvision.enabled=false` — operator opts out (they
     pre-create the Secret in the tenant namespace).
  2. `keycloak.oidcExternalSecret.enabled=true` AND `.remoteRef.key` non-empty
     — the ExternalSecret in oidc-externalsecret.yaml owns the Secret; two
     controllers fighting over the same Secret is the known anti-pattern.

Per docs/INVIOLABLE-PRINCIPLES.md #10: the random value is generated by
sprig's randAlphaNum inside the lookup-or-generate switch and lives ONLY in the
resulting Secret bytes.
*/}}
{{- $k := .Values.keycloak -}}
{{- $auto := $k.oidcAutoProvision | default dict -}}
{{- $autoEnabled := dig "enabled" true $auto -}}
{{- $eso := $k.oidcExternalSecret | default dict -}}
{{- $esoRemote := $eso.remoteRef | default dict -}}
{{- $esoActive := and $eso.enabled $esoRemote.key -}}
{{- if and $autoEnabled (not $esoActive) -}}
{{- $secretName := $k.clientSecretName -}}
{{- $namespace := .Release.Namespace -}}
{{- /* ---- Persistent random via lookup ---- */ -}}
{{- $existing := lookup "v1" "Secret" $namespace $secretName -}}
{{- $clientSecret := "" -}}
{{- if and $existing $existing.data -}}
  {{- /* Prefer the authoritative OIDC_CLIENT_SECRET key the StatefulSet reads;
         fall back to the realm-config's `client-secret` key so an upgrade after
         the realm-config has populated the Secret re-emits the SAME bytes. */ -}}
  {{- $clientSecret = index $existing.data "OIDC_CLIENT_SECRET" | default (index $existing.data "client-secret") | default "" | b64dec -}}
{{- end -}}
{{- if not $clientSecret -}}
  {{- $clientSecret = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "bp-stalwart-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/component: stalwart-oidc-client-secret
    catalyst.openova.io/oidc-client: stalwart
  annotations:
    # keep so a `helm uninstall` (or a paused realm-config / ExternalSecret
    # reconcile) doesn't yank the Secret out from under the running StatefulSet
    # or the realm import (mirrors admin-secret.yaml / the realm-config Secret).
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  OIDC_CLIENT_SECRET: {{ $clientSecret | quote }}
  client-secret: {{ $clientSecret | quote }}
{{- end }}
