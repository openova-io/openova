{{- /*
Webmail HTTP exposure. Two modes (operator chooses via
.Values.ingress.webmail.mode):

  1. "gateway" (DEFAULT) — Cilium Gateway API HTTPRoute. parentRef the
     per-Sovereign cilium-gateway in kube-system (ADR-0001 +
     bp-keycloak/templates/httproute.yaml pattern). TLS terminates at
     the gateway via the gateway's wildcard cert.

  2. "ingress" — networking.k8s.io/v1 Ingress. Useful in sandbox/k3s
     setups where the Cilium Gateway is not yet provisioned. Pairs with
     a cert-manager Certificate (rendered alongside).

Per docs/INVIOLABLE-PRINCIPLES.md #4 the host is composed from
domain.primary by default; operator overlay may override.
*/}}
{{- if .Values.stalwart.enabled }}
{{- $host := include "bp-stalwart-tenant.webmailHost" . -}}
{{- /* #4307 — front the SnappyMail webmail Service (NOT the Stalwart server,
       which ships no end-user SPA → bare 404). webmailRouteBackend resolves
       to the webmail Service when webmail.enabled, else the Stalwart -web
       Service for back-compat. */ -}}
{{- $svc := include "bp-stalwart-tenant.webmailRouteBackend" . -}}
{{- $port := include "bp-stalwart-tenant.webmailRoutePort" . -}}
{{- /* Skip if host is empty (smoke-render-safe per default values). */ -}}
{{- if $host }}

{{- if eq .Values.ingress.webmail.mode "gateway" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bp-stalwart-tenant.fullname" . }}-webmail
  labels:
    {{- include "bp-stalwart-tenant.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.webmail.parentRef.name | quote }}
      namespace: {{ .Values.ingress.webmail.parentRef.namespace | quote }}
      {{- with .Values.ingress.webmail.parentRef.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.ingress.webmail.path | default "/" | quote }}
      backendRefs:
        - name: {{ $svc | quote }}
          port: {{ $port | int }}
{{- else if eq .Values.ingress.webmail.mode "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bp-stalwart-tenant.fullname" . }}-webmail
  labels:
    {{- include "bp-stalwart-tenant.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.webmail.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.webmail.tls.issuer | quote }}
    {{- end }}
    {{- with .Values.ingress.webmail.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.webmail.ingressClassName | quote }}
  {{- if .Values.ingress.webmail.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Values.ingress.webmail.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.webmail.path | default "/" | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $svc | quote }}
                port:
                  number: {{ $port | int }}
{{- end }}
{{- end }}
{{- end }}

{{- /* #4307 — optional Stalwart webadmin/JMAP route on a SEPARATE host
       (`mailadmin.<slug>`), since `mail.<slug>` now fronts the SnappyMail SPA.
       OFF by default — the per-Org admin UI is an operator surface. Gateway
       mode only (mirrors the primary route's parentRef + wildcard-listener
       TLS). */ -}}
{{- if and .Values.stalwart.enabled .Values.webmail.enabled .Values.webmail.adminRoute.enabled }}
{{- $adminHost := include "bp-stalwart-tenant.adminHost" . -}}
{{- $adminSvc := printf "%s-web" (include "bp-stalwart-tenant.fullname" .) -}}
{{- if and $adminHost (eq .Values.ingress.webmail.mode "gateway") }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bp-stalwart-tenant.fullname" . }}-webadmin
  labels:
    {{- include "bp-stalwart-tenant.labels" . | nindent 4 }}
    catalyst.openova.io/component: stalwart-webadmin
spec:
  parentRefs:
    - name: {{ .Values.ingress.webmail.parentRef.name | quote }}
      namespace: {{ .Values.ingress.webmail.parentRef.namespace | quote }}
      {{- with .Values.ingress.webmail.parentRef.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    - {{ $adminHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: {{ $adminSvc | quote }}
          port: {{ .Values.service.web.ports.http | int }}
{{- end }}
{{- end }}
