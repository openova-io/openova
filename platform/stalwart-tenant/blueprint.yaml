apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-stalwart-tenant
  labels:
    catalyst.openova.io/category: communication
    catalyst.openova.io/section: pts-4-5-communication
spec:
  # 0.1.2 (#915) — Keycloak OIDC end-to-end. Orchestrator now emits
  # `keycloak.realmURL` + `clientID` + `clientSecretName` for the
  # per-tenant Keycloak realm; chart's bootstrap config.toml + the
  # post-install Job seed the OIDC directory in Stalwart's settings
  # store with the canonical camelCase keys
  # (`directory.keycloak.@type = "Oidc"`, `issuerUrl`, `claimUsername`,
  # `claimName`, `claimGroups`). setupJob defaults to enabled so a
  # fresh tenant has working OIDC at t=0.
  # 0.1.5 (#4148) — the per-Org Stalwart never converged on a fresh prov.
  # Three chart bugs, all live-validated on the omantel.biz demo Org (kom4dc):
  # (a) image v0.16.3 CrashLooped on this chart's v0.15-era TOML (v0.16.x
  # parser rewrite) → pinned v0.15.5 to match bp-stalwart-sovereign; (b) no
  # explicit --config arg → inherited the image's wrong default config path
  # → fixed with args: [--config, /opt/stalwart/etc/config.toml]; (c)
  # config.toml's [certificate.default] read /etc/stalwart/tls/* with no such
  # mount → added a tls Secret volume + a cert-manager Certificate for
  # mail.<tenant-domain> (secret name via stalwart.tls.secretName).
  # 0.1.7 (#4307) — per-Org webmail 404 + HR install-timeout, both live-fixed
  # on the omantel.biz demo Org: (a) HTTPRoute now defaults to parent
  # cilium-gateway-console (was the apps cilium-gateway → NoMatchingListener
  # 404); (b) added a CiliumNetworkPolicy fromEntities:[ingress] so the
  # gateway→backend hop is admitted (else envoy 503); (c) added
  # manifests.helmRelease.disableWait so the non-optional cert mount + Flux
  # --wait no longer deadlock the post-install setup Job (HR was Ready=False
  # "context deadline exceeded"). Mirrors bp-newapi + bp-wordpress-tenant.
  # 0.1.8 (#4307): the per-Org HR stayed Ready=False even with a 1/1
  # Running Pod + disableWait=true/true. Root cause was NOT the wait or a
  # hook runtime failure — the post-install setup Job
  # (mailbox-provision-job.yaml) declared NO resources.requests, so the
  # Sovereign's Kyverno `resource-requests/requests-workload` policy
  # DENIED the Job at admission ("Every container must declare
  # resources.requests.cpu and resources.requests.memory"). The denied
  # hook failed the Helm install → HR InstallFailed/RetriesExceeded.
  # Added setupJob.resources (10m/32Mi req, 100m/64Mi lim, overridable)
  # and wired it onto the Job container. Verified live on the tkt0625
  # demo Org (omantel.biz region-a).
  # 0.1.12 (#4307): a LIVE re-walk after the 0.1.11 pod/HR/route/DNS/TLS
  # gaps were fixed found `mail.<slug>/` STILL 404 — Stalwart v0.15.5 is a
  # mail SERVER (JMAP/IMAP/SMTP + webadmin API) that ships NO end-user
  # webmail SPA (`/`, `/login`, `/webadmin` all 404; only `/jmap/session`
  # 200). Bundled SnappyMail (single-container PHP webmail, IMAP+SMTP, no
  # DB) as a webmail Deployment+Service+PVC, pre-seeded with this Stalwart
  # server as the default login domain (IMAP `<fullname>-imap`:993 SSL,
  # SMTP `<fullname>-smtp`:587 STARTTLS), and re-pointed the `mail.<slug>`
  # HTTPRoute backendRef off the Stalwart `-web` Service onto the webmail
  # Service. Gateway→webmail hop admitted on port 8888 in the K8s + Cilium
  # NetworkPolicies. Gated behind webmail.enabled (default true). Stalwart
  # webadmin stays in-cluster on `-web` with an optional default-off
  # `mailadmin.<slug>` HTTPRoute.
  # Per #817 Chart.yaml version MUST equal blueprint.yaml spec.version.
  # 0.1.14 (#5615): §854 — allocateLoadBalancerNodePorts:false + nodePort: 0
  # on the SMTP/IMAP LoadBalancer Services so the Kyverno guard admits them.
  version: 0.1.14
  card:
    title: Stalwart (per-Organization)
    summary: |
      Dedicated per-Org (per-vcluster) Stalwart mail server. Implements
      locked decision [Q3] of EPIC #795 — every Organization on a Sovereign gets
      its OWN Stalwart instance in its Organization namespace, with its OWN
      domain, OWN MTA reputation, and OWN queue. NOT a shared otech-
      level multi-domain Stalwart.

      Webmail UI at `https://mail.<org-domain>`; SMTP/IMAP via
      LoadBalancer. SSO authenticated against the Organization-vcluster Keycloak
      realm (NOT otech-level Keycloak). Per-user mailbox provisioning
      is event-driven (ADR-0003 §3).
    icon: stalwart.svg
    category: communication
    tags: [mail, smtp, imap, jmap, organization, per-organization, vcluster, sso, oidc]
    documentation: https://stalw.art/
    license: AGPL-3.0
  visibility: listed
  owner:
    team: platform
    contact: catalyst@openova.io
  configSchema:
    type: object
    required: [keycloak]
    properties:
      # `domain` is the canonical mail-domain shape (post-#897). The
      # chart's `tenantDomain` helper additionally accepts a legacy
      # string-shape `domain: <fqdn>` (pre-#897 catalyst-api builds)
      # and a forward-looking `tenant.domain` block (#898). Either
      # the chart-level `domain` block OR `tenant.domain` MUST resolve
      # to a non-empty FQDN at runtime — the helper fails closed
      # otherwise.
      domain:
        type: object
        properties:
          primary:
            type: string
            description: Mail domain (free-sub like 'acme.<otech-fqdn>' or BYO like 'acme.com').
          mode:
            type: string
            enum: [free-subdomain, byo]
            default: free-subdomain
      tenant:
        type: object
        description: |
          Forward-looking tenant block (#898). When `tenant.domain` is
          set it takes priority over the legacy `domain` block. Useful
          for orchestrators that want a flat per-tenant values shape.
        properties:
          domain:
            type: string
            description: Mail domain (alternative to `domain.primary`).
          mode:
            type: string
            enum: [free-subdomain, byo]
      keycloak:
        type: object
        required: [realmURL]
        properties:
          realmURL:
            type: string
            description: Organization-vcluster Keycloak realm issuer URL (e.g. https://auth.<org-domain>/realms/org).
          clientID:
            type: string
            default: stalwart
          clientSecretName:
            type: string
            default: stalwart-oidc
      persistence:
        type: object
        properties:
          spool:
            type: object
            properties:
              size:
                type: string
                default: 20Gi
              storageClassName:
                type: string
                description: Empty = cluster default; per-Sovereign overlay supplies.
      admin:
        type: object
        properties:
          secretName:
            type: string
            default: stalwart-admin
          username:
            type: string
            default: admin
          autoProvision:
            type: object
            description: |
              Auto-provision the admin Secret with a random
              ADMIN_PASSWORD when no ExternalSecret/SealedSecret is
              wired (#898). Defaults to enabled so fresh tenants
              boot without operator intervention.
            properties:
              enabled:
                type: boolean
                default: true
      webmail:
        type: object
        description: |
          End-user webmail SPA (#4307). Stalwart ships no webmail UI, so the
          chart bundles SnappyMail (single-container PHP webmail, IMAP+SMTP, no
          DB) and fronts `mail.<slug>` with it. Default ON.
        properties:
          enabled:
            type: boolean
            default: true
      ingress:
        type: object
        properties:
          webmail:
            type: object
            properties:
              mode:
                type: string
                enum: [gateway, ingress]
                default: gateway
              host:
                type: string
                description: Empty = composed as 'mail.<domain.primary>'.
      dns:
        type: object
        properties:
          spf:
            type: object
            properties:
              policy:
                type: string
                enum: ["-all", "~all"]
                default: "-all"
          dmarc:
            type: object
            properties:
              policy:
                type: string
                enum: [reject, quarantine, none]
                default: reject
              rua:
                type: string
                description: Empty = composed as 'dmarc@<domain.primary>'.
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: ./chart
    helmRelease:
      # #4307 — the StatefulSet mounts the `stalwart-tls` Secret NON-optional
      # so the Pod blocks at ContainerCreating until cert-manager issues the
      # mail.<tenant-domain> leaf via DNS-01 (can take several minutes). With
      # Flux's default --wait, helm-controller blocks on StatefulSet readiness
      # BEFORE running the post-install setup Job (a post-install Helm hook) →
      # the install burns its budget and exits `context deadline exceeded`, the
      # HR wedges InstallFailed/RetriesExceeded, and the OIDC-directory-seeding
      # Job never fires (verified live on the omantel.biz demo Org 2026-06-24:
      # Pod 1/1 Running, HR Ready=False, NO setup Job present). disableWait lets
      # the release reach hook execution so the Job runs and the HR converges.
      # Mirrors bp-newapi #4246/#4278. Propagates to the per-Org Application
      # render path via core/controllers/pkg/render (manifests.go DisableWait).
      disableWait: true
  depends:
    - blueprint: bp-keycloak
      version: ^1.3
      alias: idp
    - blueprint: bp-external-secrets
      version: ^1.0
      alias: eso
    - blueprint: bp-cert-manager
      version: ^1.0
      alias: certs
    - blueprint: bp-powerdns
      version: ^1.0
      alias: dns
      optional: true
  upgrades:
    from: []
  observability:
    metrics: prometheus
    logs: stdout
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-passive
    - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      active-passive:
        replication:
          backend: cnpg-pair
          mode: sync
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 60
          rpoSeconds: 0
        placement:
          # #4375 (#4325 de-vcluster fallout): the `rtz` plane vCluster was
          # removed; per-Org apps land host-native in their OWN Org namespace
          # (#4297 keystone). Host placement = empty tier; keep the rtz-A/-B
          # region designators (clusters/roles) for the multi-region split.
          tier: ''
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
      singleton:
        placement:
          tier: ''
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: webmail
    hostnameTemplate: mail.{{.OrgSlug}}.{{.SovereignFQDN}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  - name: smtp
    hostnameTemplate: mail.{{.OrgSlug}}.{{.SovereignFQDN}}
    port: 587
    protocol: tcp
    tls: true
    visibility: public
    launchDefault: false
    ssoEnabled: false
  - name: imap
    hostnameTemplate: mail.{{.OrgSlug}}.{{.SovereignFQDN}}
    port: 993
    protocol: tcp
    tls: true
    visibility: public
    launchDefault: false
    ssoEnabled: false
  sso:
    realm: '{{.OrgSlug}}'
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  multiInstance:
    enabled: false
    maxPerOrg: 1
    namingTemplate: '{{.AppName}}-{{.InstanceID}}'
    isolationLevel: namespace
  # ── /G117.1 ──
