apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-livekit
spec:
  version: 1.0.0
  card:
    title: LiveKit
    summary: "WebRTC SFU for real-time video, audio, and data. Powers the Huawei iFlytek voice demo and any Application that needs sub-second media routing. Pairs with bp-stunner for K8s-native TURN/STUN — Catalyst routes LiveKit's TURN config at the stunner Service so SFU traffic survives the host cluster's NAT boundary. Hetzner firewall opens UDP 50000-60000 (LiveKit's RTC port range) per the operator's per-Sovereign overlay. "
    description: "WebRTC SFU for real-time video, audio, and data. Powers the Huawei iFlytek voice demo and any Application that needs sub-second media routing. Pairs with bp-stunner for K8s-native TURN/STUN — Catalyst routes LiveKit's TURN config at the stunner Service so SFU traffic survives the host cluster's NAT boundary. Hetzner firewall opens UDP 50000-60000 (LiveKit's RTC port range) per the operator's per-Sovereign overlay. "
    icon: livekit.svg
    license: Apache-2.0
    tags: [webrtc, sfu, video, audio, communication, application]
    docs: https://docs.livekit.io
  visibility: listed
  class: application
  lifecycle: experimental
  owner:
    team: platform
    contact: platform@openova.io
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-livekit
  upgrades:
    from: ["0.x"]
  observability:
    metrics: prometheus
    logs: stdout
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-active
    - singleton
    defaults:
      multi-region: active-active
      single-region: singleton
    perTopology:
      active-active:
        replication:
          backend: none
          mode: none
        switchover:
          mechanism: none
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: active
      singleton:
        placement:
          tier: rtz
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: livekit.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: '{{.OrgSlug}}'
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  # ── /G117.1 ──
