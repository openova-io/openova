apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-openova-flow-server
spec:
  version: 0.2.7
  visibility: unlisted
  card:
    title: OpenOva Flow server
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
