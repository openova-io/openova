apiVersion: v2
name: sandbox
description: |
  Wave 1 deployment chart for sandbox-controller — the Catalyst-built
  reconciler for `sandbox.openova.io/v1.Sandbox` CRs.

  Per products/sandbox/docs/architecture.md §7 the sandbox-controller
  is the sister of organization-controller (one-CR-per-Sandbox-user,
  per-Org-vcluster materialization). Wave 1 installs the Deployment +
  ClusterRole + ClusterRoleBinding + ServiceAccount; Wave 2 adds the
  pty-server + openova-sandbox-mcp Deployments inside each Sandbox
  namespace.

  The `Sandbox` CRD itself ships separately under
  products/catalyst/chart/crds/sandbox.yaml (PR #1615).

  This chart is opt-in via `.Values.enabled` (default false) so an
  operator can keep Sandbox off-by-default on a Sovereign until the
  Wave 2 pty-server + token issuance flow is also rolled in.
type: application
annotations:
  # Catalyst-authored umbrella; no upstream OCI dep (controller built in-house).
  # Required so blueprint-release.yaml's umbrella-shape gate accepts this chart
  # (see issue #181 + docs/BLUEPRINT-AUTHORING.md §11.1).
  catalyst.openova.io/no-upstream: "true"
  catalyst.openova.io/smoke-render-mode: "default-off"
# 0.3.2 (Service-name-mismatch audit 2026-05-20, sibling of TBD-V14
# #2017 + TBD-V16 #2021): correct three additional in-cluster MCP env
# defaults that pointed at Services no chart renders, all reachable on
# the canonical Pillar-4 Sandbox journey:
#   * `mcp.marketplaceAPIURL` —
#     `marketplace-api.marketplace.svc.cluster.local:8082`
#     → actual `marketplace-api.catalyst-system.svc.cluster.local:80`
#     (Service defined in
#     products/catalyst/chart/templates/marketplace-api/service.yaml,
#     bp-catalyst-platform releaseName=catalyst-platform ns=catalyst-system,
#     Service.ports[0].port=80 targetPort 8080).
#   * `mcp.storage.s3Endpoint` —
#     `seaweedfs.storage.svc.cluster.local:8333`
#     → actual `seaweedfs-s3.seaweedfs.svc.cluster.local:8333`
#     (bp-seaweedfs releaseName=seaweedfs ns=seaweedfs renders the S3
#     Service via the vendored seaweedfs subchart's
#     `seaweedfs.componentName "s3"` helper).
#   * `mcp.keycloak.adminURL` —
#     `keycloak.keycloak.svc.cluster.local:8080`
#     → actual `keycloak.keycloak.svc.cluster.local:80` (bitnami
#     keycloak chart 25.2.0 service.ports.http defaults to 80, verified
#     against the upstream values.yaml).
# Mirrors the bp-sandbox chart default + the sandbox-controller env
# default (core/controllers/sandbox/cmd/sandbox-controller/main.go) +
# the MCP server's documented env contract
# (products/sandbox/mcp-server/internal/tools/env.go).
#
# 0.3.1 (TBD-V14, issue #2015, 2026-05-20): default
# `env.newapiBaseURL` was `http://newapi.newapi.svc.cluster.local:3000`,
# but the canonical bp-newapi ClusterIP Service is named via
# `bp-newapi.fullname` (release `newapi` + chart `bp-newapi`
# => `newapi-bp-newapi`) per platform/newapi/chart/templates/_helpers.tpl.
# The bootstrap-kit overlay does NOT override `env.newapiBaseURL`, so
# every Sovereign sandbox-controller resolved a DNS name no Service
# publishes — `POST /admin/tokens/sandbox` returned `no such host`
# and the canonical Pillar-4 customer journey (qwen-code Sandbox
# session → TokenMint) stalled. Verified via
# `helm template newapi platform/newapi/chart/ -s templates/service.yaml`
# → metadata.name: newapi-bp-newapi. Walker on t38 (chart 1.4.216,
# substrate be4f78bc872e2c56) caught the live regression.
version: 0.3.2
appVersion: "0.3.2"
keywords:
  - catalyst
  - sandbox
  - controller
  - reconciler
  - openova
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io
