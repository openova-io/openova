apiVersion: v2
name: sandbox
description: |
  Wave 1 deployment chart for sandbox-controller — the Catalyst-built
  reconciler for `sandbox.openova.io/v1.Sandbox` CRs.

  Per products/sandbox/docs/architecture.md §7 the sandbox-controller
  is the sister of organization-controller (one-CR-per-Sandbox-user,
  per-Org-vcluster materialization). Wave 1 installs the Deployment +
  ClusterRole + ClusterRoleBinding + ServiceAccount; Wave 2 adds the
  pty-server + openova-sandbox-mcp Deployments inside each Sandbox
  namespace.

  The `Sandbox` CRD itself ships separately under
  products/catalyst/chart/crds/sandbox.yaml (PR #1615).

  This chart is opt-in via `.Values.enabled` (default false) so an
  operator can keep Sandbox off-by-default on a Sovereign until the
  Wave 2 pty-server + token issuance flow is also rolled in.
type: application
annotations:
  # Catalyst-authored umbrella; no upstream OCI dep (controller built in-house).
  # Required so blueprint-release.yaml's umbrella-shape gate accepts this chart
  # (see issue #181 + docs/BLUEPRINT-AUTHORING.md §11.1).
  catalyst.openova.io/no-upstream: "true"
  catalyst.openova.io/smoke-render-mode: "default-off"
# 0.3.6 (TBD-V22 #1986 F1, 2026-05-20): expose a configurable PTY-stdout
# replay ring buffer (default 1 MiB, up from a hardcoded 256 KiB
# literal). Adds two new env vars: on the sandbox-controller Deployment
# (SANDBOX_RING_BUFFER_BYTES, sourced from values
# `runtime.ringBufferBytes`) and on every per-Sandbox pty-server
# StatefulSet (same name, threaded by the controller via
# gitops.Inputs.RingBufferBytes). The pty-server's session package now
# exposes DefaultRingBytes + LoadDefaultRingBytesFromEnv + a 16 MiB
# MaxRingBytes ceiling (operator-misconfiguration safety; clamped +
# logged). Closes Pillar-4 audit finding F1: the documented multi-
# device "close laptop, open phone" replay claim
# (products/sandbox/docs/user-journey.md Scene 6) was unbacked at
# 256 KiB because a real Plan-mode / file-listing / multi-turn agent
# session rolls the buffer in well under a minute. Memory-budget
# reasoning: 16 MiB × 10 concurrent PTY sessions = 160 MiB worst-case,
# well under typical Sandbox Pod memory limits. No CRD changes;
# additive only, no breaking changes to existing operator overlays.
# Bootstrap-kit pin lockstep at
# clusters/_template/bootstrap-kit/19a-bp-sandbox.yaml 0.3.5 → 0.3.6.
# Rebased on top of PR #2052 (0.3.5 A4 dispatch).
#
# 0.3.5 (TBD-P4 A4 #1986, 2026-05-20): controller now dispatches per
# Sandbox.spec.agentCatalogue[0]. The pty-server StatefulSet renders
# SANDBOX_DEFAULT_AGENT into the container env so pty-server's
# lazy-spawn-on-attach branch (products/sandbox/pty-server/internal/
# server/routes.go: lazySpawn) execs the right agent binary on the first
# WS attach. Before this bump only the claude-code BYOS branch had any
# controller-side effect — the 6-row FE agent dropdown was cosmetic
# for every other slug (aider/cursor-agent/little-coder/opencode/
# qwen-code/sovereign-shell) because the env was unrendered and
# lazySpawn returned 404 on every fresh attach (blank xterm panel).
# An empty catalogue keeps the env unrendered to preserve the 404
# behaviour for hand-rolled CRs without a chosen agent.
#
# 0.3.4 (TBD-P4 B2 #1986, 2026-05-20): close the EOF-crash hole left
# by 0.3.3 (B3 mcp.json injection). The `command: /usr/local/bin/
# openova-sandbox-mcp` referenced by 0.3.3's mcp.json was ENOENT
# because the binary lived only behind a separate per-Sandbox MCP
# Deployment — and that Deployment was crash-looping with EOF on
# startup (the binary reads os.Stdin and a Pod has no stdin pipe).
# This slice (1) bundles the openova-sandbox-mcp binary INSIDE the
# pty-server image at /usr/local/bin/openova-sandbox-mcp via a
# multi-stage Dockerfile build, (2) deletes the EOF-crashing
# `deployment-mcp.yaml` from the rendered manifests, and (3)
# relocates the canonical SANDBOX_* env block from the deleted MCP
# Deployment onto the pty-server StatefulSet so the env reaches the
# MCP subprocess via os.Environ() inheritance
# (session/session.go:92 → agent → MCP child). Combined with PR
# #2049 (B3) the agent now spawns a real MCP subprocess on session
# start. Rendered file count drops from 14 (0.3.3) to 13 (this
# version): 6 fixed + 1 kust + 2 repo PVCs + 3 wave-8 runtime + 1
# MCP-config ConfigMap.
#
# 0.3.3 (TBD-P4 B3 #1986, 2026-05-20): inject mcp.json config so agent
# CLIs (claude-code, qwen-code, cursor-agent) auto-discover the
# openova-sandbox-mcp server on session start. New `configmap-mcp-config.yaml`
# carries the canonical "mcpServers" schema; the pty-server StatefulSet
# mounts it at every canonical agent-config path (~/.claude.json,
# ~/.qwen/settings.json, ./.mcp.json, .cursor/mcp.json) via subPath
# projections.
#
# 0.3.2 (TBD-V21 #2032, 2026-05-20): ship the 4 remaining MCP env-var
# residuals not covered by PR #1987 — manifests.go now emits
# `SANDBOX_TOKEN` (mounted from the per-Sandbox Secret's
# `LLM_GATEWAY_TOKEN` key; same source as the existing `LLM_GATEWAY_TOKEN`
# mount), `SANDBOX_JWT_SECRET` (mounted from the reflected
# `newapi-bp-newapi-token-signing-key` Secret's `SIGNING_KEY` key; paired
# with bp-newapi 1.4.31 extending `reflectorNamespaces` to include the
# `sandbox-.*` regex pattern), and `SANDBOX_REPOS` (CSV of
# `sb.Spec.Repos[].giteaRepo` slugs). Also fixes a pre-existing
# case-mismatch bug at the MCP + pty-server `LLM_GATEWAY_TOKEN`/
# `OPENAI_API_KEY` secretKeyRef — the key ref was lowercase
# `llm-gateway-token` while the Secret writes uppercase
# `LLM_GATEWAY_TOKEN`. `optional: true` on the mount silently no-opped
# the mismatch to an empty value → every agent CLI spawned in the pty-
# server shell ran without an LLM bearer, and every `marketplace.*`
# tool call on the MCP returned "SANDBOX_TOKEN not set". `Inputs`
# struct gains `JWTSigningKeySecretName` / `JWTSigningKeySecretKey` /
# `SandboxRepos` fields; `Render()` populates `SandboxRepos` from
# `in.Repos` and defaults the JWT Secret coordinates to
# `newapi-bp-newapi-token-signing-key` + `SIGNING_KEY`.
#
# 0.3.1 (TBD-V14, issue #2015, 2026-05-20): default
# `env.newapiBaseURL` was `http://newapi.newapi.svc.cluster.local:3000`,
# but the canonical bp-newapi ClusterIP Service is named via
# `bp-newapi.fullname` (release `newapi` + chart `bp-newapi`
# => `newapi-bp-newapi`) per platform/newapi/chart/templates/_helpers.tpl.
# The bootstrap-kit overlay does NOT override `env.newapiBaseURL`, so
# every Sovereign sandbox-controller resolved a DNS name no Service
# publishes — `POST /admin/tokens/sandbox` returned `no such host`
# and the canonical Pillar-4 customer journey (qwen-code Sandbox
# session → TokenMint) stalled. Verified via
# `helm template newapi platform/newapi/chart/ -s templates/service.yaml`
# → metadata.name: newapi-bp-newapi. Walker on t38 (chart 1.4.216,
# substrate be4f78bc872e2c56) caught the live regression.
version: 0.3.7
appVersion: "0.3.7"
keywords:
  - catalyst
  - sandbox
  - controller
  - reconciler
  - openova
maintainers:
