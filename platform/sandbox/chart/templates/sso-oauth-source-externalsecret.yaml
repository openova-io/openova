{{- /*
G91.sandbox (#2657) — OIDC client credentials Secret.

bp-sso-bridge (G91.1 #2652) writes the canonical OIDC client bundle into
OpenBao at `secret/sso/sandbox` (or whatever .Values.sso.clientId is).
This ExternalSecret materialises the bundle into a Secret in the
sandbox-controller's namespace; the sandbox-controller reads the keys
via env vars on its Pod and propagates them into the per-Sandbox
pty-server PodSpec so each per-user Sandbox UI is OIDC-fronted.

Default `enabled: true` keeps the framework opt-in single-knob per
SECURITY.md §6.3.
*/ -}}
{{/*
#2988 ESO-CRD guard (gold standard: bp-external-dns externalsecret.yaml):
without the Capabilities check, installing this chart on a cluster where
the external-secrets.io CRDs are not yet established fails at manifest-
build time ("no matches for kind ExternalSecret") and wedges the whole
install — caught live as the fresh-prov sso ExternalSecret CRD race and
reproduced verbatim by the bp-openbao fresh-prov CI gate (kind cluster,
no ESO). With the guard, the resource is simply omitted until the next
Flux reconcile re-renders once the CRD exists (Capabilities re-evaluated
every reconcile), so SSO wiring self-heals with zero manual touch.
*/}}
{{- if and .Values.enabled .Values.sso.enabled (.Capabilities.APIVersions.Has "external-secrets.io/v1beta1") }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sandbox-sso-oidc-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-sandbox
    bp-sso-bridge.openova.io/consumer: bp-sandbox
spec:
  refreshInterval: {{ .Values.sso.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.sso.externalSecretStoreName | default "vault-region1" }}
    kind: ClusterSecretStore
  target:
    name: sandbox-sso-oidc-credentials
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "sandbox" }}
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "sandbox" }}
        property: client_secret
    - secretKey: issuer_url
      remoteRef:
        key: sso/{{ .Values.sso.clientId | default "sandbox" }}
        property: issuer_url
{{- end }}
