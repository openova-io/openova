{{- if .Values.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sandbox.fullname" . }}
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sandbox.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sandbox.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
