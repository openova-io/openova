{{- /*
sandbox-controller Deployment (Wave 1 + Wave 8).

Reconciles Sandbox.sandbox.openova.io/v1 CRs into per-Sandbox manifests
(namespace + RBAC + PVCs + Secret + pty-server StatefulSet + MCP
Deployment + Service + HTTPRoute) written to the per-Org
`catalyst-tenant` Gitea repo at `sandbox/<owner-uid>/`. Flux on the
host cluster picks them up and reconciles into the Org vcluster.
*/ -}}
{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sandbox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sandbox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "sandbox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sandbox.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sandbox.fullname" . }}
      automountServiceAccountToken: true
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "sandbox.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          args:
            - "--leader-elect={{ .Values.leaderElection.enabled }}"
            - "--metrics-bind-address=:8080"
            - "--health-probe-bind-address=:8081"
          env:
            - name: CATALYST_HOST_CLUSTER
              value: {{ required "values.env.hostCluster MUST be set for sandbox-controller (e.g. hz-fsn-rtz-prod)" .Values.env.hostCluster | quote }}
            - name: CATALYST_SOVEREIGN_FQDN
              value: {{ required "values.env.sovereignFQDN MUST be set for sandbox-controller (e.g. omantel.omani.works)" .Values.env.sovereignFQDN | quote }}
            - name: CATALYST_GITEA_URL
              value: {{ .Values.env.giteaURL | default "http://gitea-http.gitea.svc.cluster.local:3000" | quote }}
            - name: CATALYST_GITEA_BRANCH
              value: {{ .Values.env.giteaBranch | default "main" | quote }}
            - name: CATALYST_TENANT_REPO_NAME
              value: {{ .Values.env.tenantRepoName | default "catalyst-tenant" | quote }}
            - name: CATALYST_GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.giteaTokenSecret.name | default "catalyst-gitea-token" | quote }}
                  key: {{ .Values.giteaTokenSecret.key | default "token" | quote }}
                  optional: true
            # Wave 8 runtime — per-Sandbox pty-server / MCP / NEWAPI.
            # `required` on the three image / URL inputs fails Helm
            # render fast if the per-Sovereign overlay forgets to wire
            # them (Inviolable Principle #4a — no silent :latest).
            - name: SANDBOX_PTY_SERVER_IMAGE
              value: {{ required "values.runtime.ptyServerImage MUST be set (SHA-pinned per docs/INVIOLABLE-PRINCIPLES.md #4a)" .Values.runtime.ptyServerImage | quote }}
            - name: SANDBOX_MCP_IMAGE
              value: {{ required "values.runtime.mcpImage MUST be set (SHA-pinned per docs/INVIOLABLE-PRINCIPLES.md #4a)" .Values.runtime.mcpImage | quote }}
            - name: SANDBOX_NEWAPI_URL
              value: {{ required "values.runtime.newapiURL MUST be set (e.g. https://newapi.<sov-fqdn>/v1 - newapi-proxy-contract.md)" .Values.runtime.newapiURL | quote }}
            - name: SANDBOX_LLM_GATEWAY_TOKEN_SECRET
              value: {{ .Values.runtime.llmGatewayTokenSecret | default "sandbox-tokens" | quote }}
            - name: SANDBOX_BYOS_SECRET_PREFIX
              value: {{ .Values.runtime.byosSecretPrefix | default "sandbox-byos-claude-code" | quote }}
            - name: SANDBOX_IDLE_TIMEOUT_MINUTES
              value: {{ .Values.runtime.idleTimeoutMinutes | default 30 | quote }}
            # Wave 9 — NewAPI bridge wiring. The controller calls
            # POST /admin/tokens/sandbox to mint per-Sandbox HS256
            # bearers; without these two env vars wired the controller
            # logs a warning at startup and skips the token-mint path
            # — namespace + RBAC + PVCs + pty-server StatefulSet still
            # land so a fresh-prov Sovereign with bridge-handler
            # rollout pending stays usable for the gitops scaffolding.
            - name: NEWAPI_BASE_URL
              value: {{ .Values.env.newapiBaseURL | default "http://newapi.newapi.svc.cluster.local:3000" | quote }}
            - name: NEWAPI_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.newapiAdminSecret.name | default "newapi-bp-newapi-token-signing-key" | quote }}
                  key: {{ .Values.newapiAdminSecret.key | default "ADMIN_SECRET" | quote }}
                  optional: true
            - name: NEWAPI_DEFAULT_CHANNELS
              value: {{ .Values.env.newapiDefaultChannels | default "" | quote }}
            {{- range $k, $v := .Values.extraEnv }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 15
{{- end }}
