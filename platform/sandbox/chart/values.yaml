# Wave 1 + Wave 8 sandbox-controller values.
#
# Default-off per the chart README — flip `enabled: true` in a
# per-Sovereign overlay once the controller's image tag is SHA-stamped
# by CI and the per-Org `catalyst-tenant` Gitea repo exists (i.e.
# organization-controller has reconciled at least once).

# enabled gates EVERY templated resource. Default off.
enabled: false
nameOverride: ""
fullnameOverride: ""
replicas: 1
image:
  repository: ghcr.io/openova-io/openova/sandbox-controller
  tag: "6f24ea2"
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: ghcr-pull
leaderElection:
  enabled: true
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
# Env wiring — every knob is an env var per Inviolable Principle #4.
env:
  hostCluster: ""
  sovereignFQDN: ""
  giteaURL: "http://gitea-http.gitea.svc.cluster.local:3000"
  giteaBranch: "main"
  tenantRepoName: "catalyst-tenant"
  # NewAPI bridge base URL the controller POSTs to /admin/tokens/sandbox
  # against. The catalyst-api mounts the bridge handler (PR #1638)
  # alongside the rest of its REST surface, so this defaults to the
  # in-cluster NewAPI service. Per Inviolable Principle #4 every
  # operator may override via per-Sovereign overlay.
  newapiBaseURL: "http://newapi.newapi.svc.cluster.local:3000"
  # Comma-separated list of NewAPI channel names every freshly-minted
  # Sandbox token is allowed to target. Empty disables the token-mint
  # path (controller logs + emits a NoAllowedChannels condition on
  # affected Sandbox CRs). Operator MUST set this to the channels
  # surfaced by the per-Sovereign NewAPI rollout (`qwen` today —
  # products/sandbox/docs/newapi-proxy-contract.md §2).
  newapiDefaultChannels: ""
# runtime — Wave 8 per-Sandbox pty-server / MCP / NEWAPI wiring.
# Surfaced as env on the controller; the controller renders these into
# the per-Sandbox StatefulSet + Deployment + HTTPRoute.
runtime:
  # SHA-pinned pty-server image. Empty default fails-fast via the
  # deployment.yaml `required` guard (Inviolable Principle #4a).
  # Auto-bumped by .github/workflows/build-sandbox-pty-server.yaml.
  ptyServerImage: "ghcr.io/openova-io/openova/sandbox-pty-server:042b444"
  # SHA-pinned openova-sandbox-mcp image. Auto-bumped by
  # .github/workflows/build-sandbox-mcp-server.yaml. 1b0e86c is the
  # last pre-#1658 green build; the rebuilt workflow (repo-root context)
  # will land the next real SHA on the next push to main.
  mcpImage: "ghcr.io/openova-io/openova/sandbox-mcp-server:042b444"
  # Sovereign LLM gateway endpoint (newapi-proxy-contract.md §1).
  # Bootstrap-kit overlay sets `https://newapi.${SOVEREIGN_FQDN}/v1`.
  newapiURL: ""
  # In-namespace Secret the pty-server reads LLM_GATEWAY_TOKEN /
  # OPENAI_API_KEY from (key `llm-gateway-token`).
  llmGatewayTokenSecret: "sandbox-tokens"
  # Prefix for the per-user BYOS Secret (`<prefix>-<owner-uid>`).
  byosSecretPrefix: "sandbox-byos-claude-code"
  # Idle timeout (minutes) — architecture.md §7.
  idleTimeoutMinutes: 30
# Secret holding the Gitea PAT the controller authenticates with.
# Defaults to the same Secret organization-controller uses
# (catalyst-gitea-token / key=token) — single source of truth per
# #957/#1052.
giteaTokenSecret:
  name: "catalyst-gitea-token"
  key: "token"
# Secret holding the NewAPI bridge admin bearer the controller passes
# as `Authorization: Bearer <ADMIN_SECRET>` on every call to POST
# /admin/tokens/sandbox. Defaults to the chart-emitted name from
# platform/newapi/chart/templates/sandbox-token-signing-key-secret.yaml.
#
# The newapi chart's `bp-newapi.fullname` helper renders as
# `<release>-<chart>` (e.g. release `newapi` + chart `bp-newapi` =>
# `newapi-bp-newapi`), and the signing-key Secret template appends
# `-token-signing-key`, so the canonical name in a stock Sovereign is
# `newapi-bp-newapi-token-signing-key`. Per-Sovereign overlays may
# override via either side of the wire (newapi chart's
# `sandboxTokenSigningKey.autoSecretName` or this value here).
#
# Cross-namespace mount: the canonical wiring is via emberstack/
# reflector — the source Secret carries
# `reflector.v1.k8s.emberstack.com/reflection-{allowed,auto}-namespaces`
# annotations naming the sandbox-controller's namespace so a mirror
# of the Secret materialises locally. The chart template uses an
# `optional: true` secretKeyRef so a fresh-prov Sovereign with the
# reflector mirror still in flight does NOT crash the controller —
# it starts in gitops-only mode and picks up the token-mint path
# once the env var lands on a Pod restart.
newapiAdminSecret:
  name: "newapi-bp-newapi-token-signing-key"
  key: "ADMIN_SECRET"
# D31 active-hot-standby — Sovereign-level opt-in for the cross-region
# CNPG ReplicaCluster shape on every Sandbox-provisioned database. When
# `cnpg.activeHotStandby.enabled` parses truthy (true/1/yes/on) AND
# both region keys are non-empty AND distinct, the MCP server's
# `sandbox.db.provision` handler materialises a primary + replica
# Cluster.postgresql.cnpg.io pair (one each in the two regions) instead
# of a single Cluster. Mirrors the bp-cnpg-pair pattern + the
# bp-wordpress-tenant `pg.activeHotStandby.*` value contract (PR
# #1562). Default-off keeps every existing Sandbox on single-Cluster
# CNPG (zero regression).
#
# The chart surfaces this stanza to the sandbox-controller as three
# env vars (SOVEREIGN_ENABLE_HOT_STANDBY, SOVEREIGN_PRIMARY_REGION,
# SOVEREIGN_REPLICA_REGION) which the controller in turn propagates
# into every per-Sandbox MCP Pod via gitops.Inputs. Bootstrap-kit slot
# 61 (clusters/_template/bootstrap-kit/61-bp-sandbox.yaml) wires
# operator overrides from the per-Sovereign overlay's envsubst
# placeholders — flip one knob and BOTH the marketplace tenant path
# (sme_tenant_gitops.go) AND the sandbox.db plane render the HA shape.
#
# Region keys MUST match the canonical openova.io/region node label
# value (e.g. `hz-fsn-rtz-prod`, `hz-hel-rtz-prod`). The CNPG operator's
# nodeAffinity matches on this label to pin the primary + replica
# StatefulSet Pods to the right regions.
cnpg:
  activeHotStandby:
    enabled: ""
    primaryRegion: ""
    replicaRegion: ""
# Wave 14 — Grafana dashboard for Sandbox runtime observability.
#
# Default-off (zero regression). When `grafanaDashboard.enabled=true` the
# chart renders ONE ConfigMap (`<release>-dashboard`) labelled
# `grafana_dashboard: "1"`. The upstream grafana/grafana sidecar
# (`kiwigrid/k8s-sidecar`) auto-discovers ConfigMaps with that label
# across all namespaces and loads the JSON into Grafana on the next
# reconcile.
#
# Panels (products/sandbox/docs/architecture.md §7 +
# newapi-proxy-contract.md):
#   1. Active Sandboxes (count of Sandbox CRs)
#   2. pty-server Pods Ready %
#   3. MCP Pods Ready %
#   4. WebSocket Connections (Gauge)
#   5. PVC Usage % per Sandbox
#   6. Idle-Timeout Scale-Down Events / hour
#   7. newapi Token Mint Requests / hour (filter tool="sandbox-controller")
#
# Per Inviolable Principle #11 (no fabricated metrics) panels whose
# metric emitter has not yet rolled out across the fleet render as
# "No data" rather than a synthetic number; this is documented inline
# on each panel's description field.
grafanaDashboard:
  enabled: false
# Wave 15 (PR #1674 follow-up) — ServiceMonitor for Prometheus scrape
# of the controller's :8080 /metrics endpoint. Surfaces every controller-
# runtime auto-instrumented metric plus the Wave 15 emitter
# `sandbox_controller_idle_timeout_events_total` (labelled by namespace,
# read by the Grafana panel "Idle-Timeout Scale-Down Events / hour").
#
# DEFAULT FALSE per docs/BLUEPRINT-AUTHORING.md §11.2 — kube-prometheus-
# stack lands at slot 25; charts that ship a default-true ServiceMonitor
# break Helm install on pre-slot-25 Sovereigns. The template also gates
# on `monitoring.coreos.com/v1` capability so even a stale per-Sovereign
# overlay that sets enabled=true on a cluster without the Operator CRD
# skip-renders gracefully.
serviceMonitor:
  enabled: false
  interval: "30s"
  scrapeTimeout: "10s"
  path: "/metrics"
  labels: {}
  # namespace override — defaults to .Release.Namespace.
  namespace: ""
extraEnv: {}
