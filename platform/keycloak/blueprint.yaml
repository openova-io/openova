apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-keycloak
spec:
  # 1.5.13 — #6870 (Refs #6509): catalyst-ui `post.logout.redirect.uris` = `+`
  #   (Keycloak expands it to the client's redirectUris), so sign-out from a
  #   per-Org console returns to that console's /login instead of 400 "Invalid
  #   redirect uri" (hw307). Single-zone Sovereigns: same behaviour, the
  #   sovereign-admin host is the first redirectUri.
  version: 1.5.19
  card:
    title: Keycloak
    summary: Open-source Identity and Access Management. OIDC + SAML + social login + realm-per-Organization.
    description: Per-Organization Keycloak realm with pre-seeded OIDC client. Pairs with bp-wordpress-tenant for SSO.
    icon: keycloak.svg
    license: Apache-2.0
    tags: [identity, sso, oidc, saml, iam, keycloak]
    docs: https://www.keycloak.org/documentation
  visibility: unlisted
  class: platform-component
  lifecycle: experimental

  configSchema:
    type: object
    required: [realmName]
    properties:
      realmName:
        type: string
        description: "Keycloak realm name (e.g. org-<orgslug>)."
      adminUser:
        type: string
        default: admin
  # placementSchema aligned with spec.topology below (#4212 Seam 3). The
  # spine Application-CR producer stamps active-hot-standby on a multi-region
  # Sovereign (matching topology.defaults.multi-region) — modes[] must admit
  # it AND defaultOnMultiRegion must name it so the placement is accepted and
  # the Continuum CR is minted.
  placementSchema:
    modes: [singleton, active-hot-standby]
    default: singleton
    defaultOnMultiRegion: active-hot-standby

  manifests:
    chart: bp-keycloak

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive. KC realm config + sessions in PG
  #   replicated via bp-cnpg-pair sync (remote_apply); user sessions are
  #   JWT (stateless on KC). Switchover: PG promote → KC pod on standby is
  #   already running → DNS flip auth.<sov> (~30s TTL).
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          # #4402 (#4325 de-vcluster fallout): the `mgmt` plane vCluster was
          # removed; the spine lands host-native in its own host namespace.
          # The #4334 spine producer drives this Blueprint through the
          # application-controller fan-out, which resolved `tier: mgmt` → host
          # ns `mgmt` (now absent) → `namespaces "mgmt" not found` and never
          # reached the Continuum producer. Host placement = empty tier; keep
          # the mgmt-A/-B region designators. Mirrors #4375/#4379.
          tier: ''
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ''
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  endpoints:
    - name: ui
      hostnameTemplate: "auth.{{.SovereignFQDN}}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: false   # KC is itself the IdP, not a downstream SSO consumer

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # KC is the source of truth for the `sovereign` realm. Operators land
  # in the admin console via direct auth, not silent SSO through itself.
  sso:
    realm: sovereign
    protocolMapper: oidc
    silentLogin: false

