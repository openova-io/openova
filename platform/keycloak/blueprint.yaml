apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-keycloak
  labels:
    catalyst.openova.io/section: pts-2-3-per-sovereign-supporting-services
    catalyst.openova.io/tier: catalyst-cp
spec:
  version: 1.5.7
  card:
    title: keycloak
    summary: Keycloak — user identity. Topology decided by Sovereign CRD spec.keycloakTopology (per-organization for Organizations, shared-sovereign for corporate).
  visibility: unlisted              # mandatory infra, auto-installed by bootstrap kit
  # ── #3373: class-level placement SUGGESTION + allow-list ────────────────
  # Placement is an INSTANCE property (Application.spec.placement); this is
  # only the default every instance inherits silently — the provisioning
  # journey's generic advanced selector (and a direct Git edit of the
  # instance's spec.placement) may override it within allowedPlacements.
  # Founder §4 table target: mgmt. Single render mechanism: the Flux
  # spec.kubeConfig.secretRef pivot — zero per-app placement code.
  defaultPlacement:
    vcluster: mgmt
  allowedPlacements: [host, mgmt]

  # placementSchema aligned with spec.topology below (#4212 Seam 3). The
  # spine Application-CR producer stamps active-hot-standby on a multi-region
  # Sovereign (matching topology.defaults.multi-region) — modes[] must admit
  # it AND defaultOnMultiRegion must name it so the placement is accepted and
  # the Continuum CR is minted.
  placementSchema:
    modes: [singleton, active-hot-standby]
    default: singleton
    defaultOnMultiRegion: active-hot-standby
    minRegions: 1
    maxRegions: 2

  manifests:
    chart: ./chart
  # bp-postgres (#3370): Keycloak's database is a Context on a SHAREABLE
  # bp-postgres data-instance (slot 09 wires keycloak's HR dependsOn
  # bp-postgres-shared). Declaring the shareable INSTANCE Blueprint here
  # (not just the engine) makes the console New-instance wizard render the
  # generic PostgreSQL backing selector (Create new / Reuse existing).
  depends:
    - blueprint: bp-postgres
      version: ^0

  # ── G117.1: Topology declaration ────────────────────────────────────────
  # Per docs/sessions/2026-06-02-per-blueprint-topology-audit.md:
  #   mgmt-A=Active, mgmt-B=Passive. KC realm config + sessions in PG
  #   replicated via bp-cnpg-pair sync (remote_apply); user sessions are
  #   JWT (stateless on KC). Switchover: PG promote → KC pod on standby is
  #   already running → DNS flip auth.<sov> (~30s TTL).
  topology:
    supported:
      - active-hot-standby
      - singleton
    defaults:
      multi-region: active-hot-standby
      single-region: singleton
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          # #4402 (#4325 de-vcluster fallout): the `mgmt` plane vCluster was
          # removed; the spine lands host-native in its own host namespace.
          # The #4334 spine producer drives this Blueprint through the
          # application-controller fan-out, which resolved `tier: mgmt` → host
          # ns `mgmt` (now absent) → `namespaces "mgmt" not found` and never
          # reached the Continuum producer. Host placement = empty tier; keep
          # the mgmt-A/-B region designators. Mirrors #4375/#4379.
          tier: ''
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: ''
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton

  # ── G117.3: Endpoints ──────────────────────────────────────────────────
  endpoints:
    - name: ui
      hostnameTemplate: "auth.{{.SovereignFQDN}}"
      port: 443
      protocol: https
      tls: true
      visibility: public
      launchDefault: true
      ssoEnabled: false   # KC is itself the IdP, not a downstream SSO consumer

  # ── G117.4 + G117.5: SSO ───────────────────────────────────────────────
  # KC is the source of truth for the `sovereign` realm. Operators land
  # in the admin console via direct auth, not silent SSO through itself.
  sso:
    realm: sovereign
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: false

  # ── G117.6: Multi-instance ─────────────────────────────────────────────
  # Singleton per Sovereign — one Keycloak per Catalyst control plane.
  multiInstance:
    enabled: false
