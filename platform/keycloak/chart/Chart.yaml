apiVersion: v2
name: bp-keycloak
# 1.4.14 (G117.5b #2789, 2026-06-02): SSO client-secret rotation knob.
# Adds optional .Values.sso.tier1ClientSecretSalt — when non-empty, the
# Tier-1/Tier-2/Tier-3 client-secret derivation helpers in _helpers.tpl
# append it to the SHA-256 seed, atomically rotating every derived SSO
# client secret in the realm-import on next helm upgrade. Empty default
# preserves render-stability + back-compat (existing Sovereigns keep
# their current secrets across this upgrade). bp-sso-bridge auto-
# discovers the new secrets on its next tick. Refs #2789.
# 1.4.13 (G117.5 W3.D1 #2744, 2026-06-02): Tier-2 silent-SSO clients
# codified in the sovereign realm-import. New entries appended to clients[]:
#   - guacamole       (redirectUris: https://guacamole.<sov-fqdn>/*)
#   - powerdns-admin  (redirectUris: https://pdns-admin.<sov-fqdn>/oidc/authorized + https://pdns-admin.<sov-fqdn>/*)
#   - hubble-ui       (redirectUris: https://hubble.<sov-fqdn>/oauth2/callback)
# Each client's `secret` is derived via the new
# `bp-keycloak.tier2ClientSecret` named template (sha256sum of
# Release.Name|Release.Namespace|tier2-sso|clientId — namespaced apart
# from `tier1ClientSecret` so the two tiers can rotate independently).
# Pattern mirrors 1.4.10 Tier-1 codification; same realm, same
# catalyst-pin IDR `defaultProvider`, same `kc_idp_hint` defense-in-depth
# at the per-app chart level. The hubble-ui client is pre-declared even
# though the bp-cilium oauth2-proxy sidecar is not yet shipped (decorative
# `auth: oidc` annotation removed in same PR per Aux-2 tier-2/bp-cilium.md
# audit) — codifying ahead of consumer avoids a race when the sidecar
# lands and lets the realm-import stay authoritative. Refs #2744.
# 1.4.12 (G117.5 W2.C4 #2744, 2026-06-02): Per-Org realm fan-out template.
# New file templates/configmap-per-org-realms.yaml iterates
# `.Values.tenantRealms[]` (default empty — no-op) and emits one ConfigMap
# per Org each carrying a complete realm-import JSON with:
#   - identityProviders[sovereign-broker] = keycloak-oidc IdP federating
#     into https://auth.<sov-fqdn>/realms/sovereign (the 2nd hop of the
#     3-hop Tier-3 SSO chain Org-realm → sovereign-realm → catalyst-pin)
#   - authenticatorConfig[sovereign-broker-redirector] +
#     authenticationFlows[browser] IDR binding so KC auto-303s every
#     unauthenticated realm auth-request to the broker WITHOUT showing
#     the username/password form (G113 #2725 pattern carried over)
#   - first broker login auto link flow (G113 Bug-6 carryover —
#     bypasses KC SMTP for federated-identity auto-link)
#   - groups clientScope mandatory (G91 manual recovery — missing groups
#     claim breaks role-based authz at every consumer app)
#   - clients[] empty (bp-sso-bridge registers Tier-3 app clients at
#     runtime per its provision_org_realm reconciler routine)
# Per-Org broker secret derived deterministically via the new
# `bp-keycloak.tenantBrokerClientSecret` helper (sha256 of Release.Name|
# Release.Namespace|orgSlug) so chart upgrades don't rotate secrets and
# bp-sso-bridge re-derives the same value when it registers the
# matching `<slug>-broker` Client in the sovereign realm.
# Cross-Org isolation invariant: each Org realm issues id_tokens with
# `iss=https://auth.<sov>/realms/<slug>` — Org-A tokens are rejected at
# OIDC-discovery by Org-B applications. Refs #2744.
# 1.4.11 (G113 #2725 Bug-6 codification, 2026-06-02): codify the runtime
# pre-link workaround for KC first-broker-login flow. The default flow
# fires `idp-confirm-link` (REQUIRED) + `Verify Existing Account by Email`
# whenever the federated catalyst-pin user collides by email with an
# existing realm user — both steps require KC SMTP. On Sovereigns whose
# KC SMTP is not yet wired up the broker callback hangs. Runtime
# workaround on hw86 was per-user POST /admin/realms/sovereign/users/
# {id}/federated-identity/{alias} (HTTP 204) — manual pre-link. Codified
# equivalent: a new custom top-level authentication flow `first broker
# login auto link` with only `idp-create-user-if-unique` (ALT) +
# `idp-auto-link` (ALT). The catalyst-pin IdP's firstBrokerLoginFlowAlias
# now points at it; trustEmail=true (already set) makes the auto-link
# trigger on email match WITHOUT any SMTP or user prompt. Refs #2725.
# 1.4.10 (G117.5 #2744, 2026-06-02): Tier-1 silent-SSO clients codified
# in the sovereign realm-import. New entries appended to clients[]:
#   - grafana       (redirectUris: https://grafana.<sov-fqdn>/*)
#   - gitea         (redirectUris: https://gitea.<sov-fqdn>/*)
#   - harbor        (redirectUris: https://registry.<sov-fqdn>/*)
#   - openbao       (redirectUris: https://bao.<sov-fqdn>/ui/vault/auth/
#                    oidc/oidc/callback + http://localhost:8250/oidc/callback)
# Each client's `secret` is derived deterministically via the new
# `bp-keycloak.tier1ClientSecret` named template (sha256sum of
# Release.Name|Release.Namespace|clientId — stable across renders, unique
# per Sovereign). bp-sso-bridge's reconcile loop discovers these on its
# first tick (existing-client codepath: KC returns the stored secret;
# bridge reuses it) and distributes the bundle to OpenBao
# `secret/sso/<clientId>`. Codifies the manual step "create realm + 4
# clients manually" from feedback_sso_manual_recovery_procedure.md
# Step 2. Refs #2744.
# 1.4.9 (G113 #2725 followup, 2026-06-02): codify the runtime KC fix
# discovered while debugging hw86 silent-SSO. The sovereign realm import
# now ships `authenticatorConfig: [{alias: catalyst-pin-redirector,
# config: {defaultProvider: catalyst-pin}}]` + an `authenticationFlows`
# override on the `browser` flow that binds that config to the
# `identity-provider-redirector` execution. Without this, even with
# `kc_idp_hint=catalyst-pin` passed by each per-app SSO config, KC
# silently fell through to the username/password form. Live evidence
# 2026-06-02 12:08Z: 4-hop no-cookie SSO probe failed → POST
# /admin/realms/sovereign/authentication/executions/{id}/config with the
# same payload returned HTTP 201 → next probe verified 4-hop chain
# end-to-end (Grafana → KC realm auth 303 → KC broker /catalyst-pin/login
# 303 → catalyst-api /oidc/auth 303 → console /login 302 on no-cookie).
# Refs #2725.
# 1.4.8 (G112 #2721, 2026-06-01): postgresql.auth.existingSecret pivot —
# new templates/postgresql-credentials.yaml materialises a stable
# `keycloak-postgresql` Secret via lookup-or-generate +
# helm.sh/resource-policy: keep. Eliminates the password-mismatch
# crashloop when bp-keycloak HR re-installs while the postgres STS
# volumeClaimTemplate PVC persists (caught live hw86 2026-06-01).
# 1.4.6 (Fix #1902, TBD-A40, 2026-05-19): omit HTTPRoute parentRef
# sectionName by default — multi-zone Sovereigns rename HTTPS listeners
# to https-<sanitised-zone>, breaking NoMatchingListener with the prior
# pinned sectionName: https. Matches the catalyst-system fix in PR #1888.
version: 1.4.14
description: |
  Catalyst-curated Blueprint umbrella chart for Keycloak. Depends on the
  upstream `keycloak` chart (bitnami) as a Helm subchart so
  `helm dependency build` pulls the upstream payload into this artifact;
  the Catalyst overlay templates in templates/ (HTTPRoute, sovereign realm
  ConfigMap, tenant realm ConfigMap) sit alongside the upstream subchart and
  Helm renders both at install time. Catalyst-curated values flow into the
  upstream subchart under the `keycloak:` key in values.yaml.
  Phase-8b (issue #604): adds catalyst-ui PKCE client, catalyst-api-server
  service-account client with impersonate role, token-exchange enabled on
  sovereign realm, WebAuthn Required Actions, and SMTP configuration.
  1.4.0 (issue #915 / C1): tenant-mode realm import. When
  realmConfig.tenant.enabled=true the chart emits a per-tenant realm with
  wordpress / openclaw / stalwart OIDC clients pre-registered, plus the
  matching `wordpress-oidc-client-secret` / `openclaw-oidc-client-secret`
  / `stalwart-oidc-client-secret` Secrets the downstream
  bp-wordpress-tenant / bp-openclaw / bp-stalwart-tenant charts consume
  via secretKeyRef. Sovereign-mode unchanged. Closes the chart-side gap
  left by orchestrator PR #911 (which already emits realmConfig.tenant.*).
  1.4.1 (qa-loop iter-4 Fix #23): grant catalyst-api-server service-account
  manage-realm + view-realm + view-clients on realm-management so the
  EPIC-3 T2 tier-role bootstrap goroutine (KEYCLOAK_BOOTSTRAP_TIER_ROLES=
  true) can materialize the catalog-tier realm-roles + composite chain
  at catalyst-api startup. Without these, GET /admin/realms/<r>/roles/<n>
  returned 403 and EnsureRealmRole gave up after 5 retries → TC-248
  failure on the access-matrix UI.
  1.5.0 (qa-loop iter-12 Fix #53, target-state realm-per-Sovereign):
  parameterize the realm name via .Values.sovereignRealm.name (default
  "sovereign" for backward compat). Per-Sovereign overlays now set this
  to the tenant short-name (e.g. omantel.omani.works → "omantel") so
  matrix tests asserting `/admin/realms/<tenant>/...` paths PASS. Both
  the realm import JSON (`"realm": "<name>"`) and the catalyst-kc-sa-
  credentials Secret `realm` key flow from the same value, keeping
  Keycloak realm and catalyst-api CATALYST_KC_REALM env in sync. Closes
  TC-124, TC-125, TC-159, TC-160, TC-161, TC-176, TC-190, TC-285.
  1.4.5 (issue #146, post-#140 retune — prov #21 + #22 hung 30+ min on
  bp-keycloak install): Fix #140 set availabilityCheck.timeout=900s +
  HR install/upgrade.timeout=30m + remediation.retries=3. In practice
  the 900s per-attempt window meant a single failed availability check
  busted the 30m HR window before Job-level backoff could retry —
  AND each HR remediation triggered a full Helm uninstall+reinstall,
  losing all hook-Pod state and restarting Liquibase from zero
  (90m+ wasted wall-clock). On top, Liquibase + JVM cold-start
  legitimately took 5-10min before the StatefulSet's Service had
  Endpoints, but the Bitnami Pod's livenessProbe (initialDelaySeconds
  300) was killing it mid-migration on slower-disk Sovereigns.
  Three coupled changes for target-state fix:
    - keycloakConfigCli.availabilityCheck.timeout 900s → 300s. Faster
      failure means more attempts fit inside 30m HR envelope (~5 vs.
      ~1.5 with 900s). Each 300s window still covers one full
      Liquibase pass + JVM warm-up (typical 90-180s).
    - HR install.remediation.retries + upgrade.remediation.retries
      3 → 1 (in clusters/_template/bootstrap-kit/09-keycloak.yaml).
      The Job's own backoffLimit=5 handles transient races without
      losing state; HR-level remediation is reserved for genuine
      release-failure.
    - keycloak.startupProbe.enabled=true (failureThreshold 360 ×
      periodSeconds 5 = 30m budget). startupProbe is an exclusive
      kubelet gate — livenessProbe + readinessProbe are SUSPENDED
      until startupProbe passes, so slow Liquibase isn't killed
      mid-migration. keycloak.livenessProbe.initialDelaySeconds
      300 → 60 (cold-start protection now lives in startupProbe).
  All knobs operator-overridable via valuesFrom (Principle #4). TODO
  follow-up: move realm-import OUT of the bitnami post-install Helm
  hook into a Catalyst-owned Job that runs after Keycloak Service
  has Endpoints — decouples HR-Ready from realm-imported.
  1.4.4 (issue #140, post-upgrade hook regression on prov #21): Fix #129
  set 600s + backoffLimit=5, which works for fresh-install but races on
  upgrade. On prov #21 (f84f6c3ff2b60296, 2026-05-11) the chart-roll on
  contabo (PR #1346/#1347 stack) triggered an HR UPGRADE; the keycloak
  StatefulSet rolled, Helm fired the post-upgrade hook before the new
  Pod's admin endpoint recovered (Liquibase re-validation + JVM cold
  start on freshly-provisioned node), and the inner 600s availability
  window expired before the first attempt found Keycloak Ready. With
  backoffLimit=5 + 10s..6m exponential backoff the worst-case wall clock
  exceeds the parent HR's 15m upgrade.timeout → Helm aborts the hook →
  "post-upgrade hooks failed". Target-state fix:
    - keycloakConfigCli.availabilityCheck.timeout 600s → 900s (15m inner
      wait covers a single rolling-restart + Liquibase cycle without
      retry, eliminating most backoff time)
    - keycloakConfigCli.cleanupAfterFinished.enabled true (1h TTL) so
      stale hook Pods don't race the before-hook-creation delete on
      subsequent upgrades
    - HR install.timeout + upgrade.timeout 15m → 30m
      (clusters/_template/bootstrap-kit/09-keycloak.yaml) so Helm's
      outer hook-wait accommodates the inner 15m availability window
      plus normal backoff.
  Coupled chart + HR move per Principle #3 (no half-fix). All knobs stay
  operator-overridable via valuesFrom (Principle #4).
  1.4.3 (issue #129, post-upgrade hook timeout wedge): bump bitnami
  keycloakConfigCli.availabilityCheck.timeout 120s → 600s and
  backoffLimit 1 → 5. Fresh-Sovereign provision #15 (otech
  0ad3687ddd72deb7) wedged at phase1-watching because the
  keycloak-config-cli Job (rendered as a Helm post-install/post-upgrade
  hook by the bitnami subchart's default annotations) timed out twice
  inside its 120s availability window before Postgres+Liquibase finished
  bootstrapping Keycloak. Helm reported "post-upgrade hooks failed:
  timed out waiting for the condition" → bp-keycloak HR never reached
  Ready → bp-gitea (dependsOn keycloak OIDC) blocked → bp-self-sovereign-
  cutover never converged. New defaults sit comfortably inside the parent
  HR's 15m install/upgrade timeout. Both knobs remain per-Sovereign
  overridable via valuesFrom (Inviolable Principle #4: no hardcoding).
type: application
keywords: [catalyst, blueprint, keycloak]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a Helm subchart so `helm dependency build`
# bundles it into the OCI artifact. Pinned to bitnami/keycloak 25.2.0
# (matches platform/keycloak/blueprint.yaml + values.yaml
# `catalystBlueprint.upstream.version`). Per
# docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the version is
# operator-bumpable via PR + Blueprint release.
#
# Bitnami consolidated their tag scheme around 2025-09 (see
# https://github.com/bitnami/charts/issues/30852): the original
# `bitnami/keycloak:<x>-debian-12-rN` tags now 404 in the registry. The
# preserved historic tags live under `bitnamilegacy/keycloak` (read-only
# archive). values.yaml overrides image.registry/image.repository to point
# every Bitnami image used by this chart at `bitnamilegacy/*` so installs
# succeed. Long-term we will migrate to a Catalyst-built or upstream
# replacement Keycloak image (issue #191 follow-up).
dependencies:
  - name: keycloak
    version: "25.2.0"
    repository: "https://charts.bitnami.com/bitnami"
