# 1.4.33 (#3813, Refs #3642, 2026-06-18): the catalyst-api-server SA client
# secret (the value baked into the sovereign realm import's
# `catalyst-api-server` client + the catalyst-kc-sa-credentials Secret) is
# now derived DETERMINISTICALLY via the new
# `bp-keycloak.catalystApiServerClientSecret` helper instead of
# `randAlphaNum 32`. After #3642 keycloak runs in the mgmt vCluster, so the
# Secret + the reflector that mirrored it to the HOST catalyst-system /
# sso-bridge are both inside vc-mgmt — the host catalyst-api never sees the
# credential and /auth/handover 401s (zero-login dead; verified live hw163).
# The durable fix re-creates catalyst-kc-sa-credentials HOST-side from a
# bridge in bp-catalyst-platform; for that bridge to carry the SAME value
# baked into Keycloak the value must be REPRODUCIBLE from the keycloak
# release coordinates (release name + namespace), which a random string is
# not. The helper uses the SAME SHA256-seed seam as the existing
# tier1ClientSecret / pinBrokerClientSecret derivations (namespace+release
# scoped → unique per Sovereign; honours .sso.tier1ClientSecretSalt). The
# upgrade-lookup branch still wins on an already-installed realm, so no
# rotation on existing envs. Default single-region render byte-identical
# except the SA secret value (was random → now derived; both 64/32-char
# opaque strings, no consumer cares about the literal). Refs #3642 #3736.
# 1.4.35 (#3741/#3852, 2026-06-19): SHORTEN the 1.4.34 powerdns-admin client
# `description` from 831 -> ~190 chars. Keycloak stores public.CLIENT.DESCRIPTION
# as varchar(255); the 1.4.34 prose (full two-callback rationale) blew the cap →
# the blueprint-release `g117-e2e-realm-client-description-255-cap.sh` gate failed
# → bp-keycloak:1.4.34 NEVER published (slot-09 pinned an unpublished tag). The
# behavioural fix (BOTH /oauth2/callback + /oidc/authorized) is unchanged; only the
# description string is trimmed so the import batch no longer aborts. The full
# rationale lives in this changelog + PR #3869.
# 1.4.34 (#3741/#3852, 2026-06-19): the realm-seed `powerdns-admin` client now
# registers BOTH callbacks — `/oauth2/callback` (the oauth2-proxy gate) AND
# `/oidc/authorized` (PDA's native authlib callback). 1.4.30 (#3741) had
# stripped `/oidc/authorized` on the premise the app was 'gated, not
# native-OIDC', but the bp-oidc-gate HTTPRoute 302s the bare root to PDA's
# `/oidc/login` (rootRedirectPath), which fires pda-legacy's OWN OIDC flow —
# PDA ignores oauth2-proxy's X-Auth-Request-* headers so it must session-auth
# itself — and authlib sends redirect_uri=…/oidc/authorized. With only
# /oauth2/callback registered, KC rejected that second hop ("Invalid parameter:
# redirect_uri", measured live hw167 dep 28d4e96f96407bbb, UAT row 3374-11) →
# the operator never landed on /dashboard. Restoring /oidc/authorized alongside
# /oauth2/callback (the aud-mapper stays) makes config-cli FULL-managed reconcile
# keep the correct two-URI shape, matching the bp-oidc-gate 0.1.4 AppRegistration
# (appNativeCallbackPath:/oidc/authorized). The `/*` wildcard from the dead
# pre-#3374 shape is NOT restored — the two explicit callbacks are exact.
# 1.4.36 (#4054/#4070/#3374, 2026-06-23): the per-Org TENANT realm import
# (configmap-tenant-realm.yaml) now registers a `catalyst-ui` public PKCE
# client (redirectUris console.<slug>.<zone>/* + *.<slug>.<zone>/*, webOrigins
# '+', PKCE S256). The per-Org operator console (console.<slug>.<pool-zone>)
# discovers oidcIssuer=keycloak.<slug>.<zone>/realms/org-<slug> and redirects
# with client_id=catalyst-ui; the tenant realm previously shipped only
# wordpress/openclaw/stalwart → the console OIDC redirect 400'd ("Client not
# found") and ALL Org SSO broke (verified live on omantel.biz demo Org, where
# the client had to be hand-created). Descriptions trimmed <255 (catalyst-ui
# 162, wordpress 258→195) so the config-cli JDBC batch never overflows the
# varchar(255) cap; the 255-cap gate now AUDITS the tenant realm (was SKIP).
# The org-keycloak HTTPRoute parentRef move to cilium-gateway-console is an
# orchestrator-side change (organization_gitops.go), not a chart change.
# 1.4.37 (#3934, Refs #3642, 2026-06-23): account-console SSO-landing fix —
# Keycloak's built-in `account-console` + `security-admin-console` clients were
# force-bounced by the sovereign realm's identity-provider-redirector
# (defaultProvider=catalyst-pin) into /broker/catalyst-pin/login, which 400s
# `cookie_not_found` on a hint-less, cookie-less nav → operator saw "We are
# sorry... cookie not found" (4th SSO-landing surface broken by the #3642
# mgmt-vCluster pivot, caught live hw182). The realm import now declares a
# second top-level browser flow `browser-no-idp` (identical to `browser` minus
# the auto-delegating redirector) and binds the two consoles to it via
# authenticationFlowBindingOverrides.browser. The SSO app clients
# (gitea/harbor/openbao/oidc-gate) keep the `browser` flow + defaultProvider
# delegation untouched — gitea in the mgmt-vCluster placement still relies on
# it (its openidConnect provider cannot carry a kc_idp_hint).
# 1.4.38 (#4163, Refs #4163, 2026-06-23): FIX the 1.4.37 regression — the new
# `browser-no-idp` flow (builtIn:false) referenced the standard `forms` subflow,
# but keycloak-config-cli resolves the built-in `forms` ONLY for builtIn:true
# flows. For a CUSTOM flow every referenced subflow must be EXPLICITLY declared
# as a non-top-level flow in the same realm JSON, so 1.4.37 aborted the import
# in 2.6s with `Non-toplevel flow not found: forms` → bp-keycloak post-upgrade
# hook failed → the whole mgmt-vCluster SSO tier (oidc-gate/sso-bridge/grafana/
# gitea/powerdns-admin/newapi) wedged Ready=False (caught live dep
# 4635277cae4ffed9 region-B). The fix gives browser-no-idp its OWN declared
# forms subflow (`browser-no-idp-forms`, topLevel:false) + a declared
# conditional-OTP child (`browser-no-idp-conditional-otp`: conditional-user-
# configured + auth-otp-form, so OTP survives), mirroring KC's built-in forms.
# The original `browser` flow (builtIn:true) keeps the bare built-in `forms`
# untouched — the SSO-app-client delegation path is not touched. A new chart
# test (tests/realm-flow-subflow-resolution.sh) statically reproduces config-
# cli's subflow-resolution rule across all realm templates so this class can
# never regress silently again.
# 1.5.1 (#4220, 2026-06-24): JUMP THE VERSION ABOVE THE STALE 1.5.0. An OLD
# bp-keycloak:1.5.0 OCI artifact (published 2026-05-10 from the qa-loop iter-12
# `version: 1.5.0` line — see the 1.5.0 changelog stanza further down) still
# sits on ghcr.io/openova-io. The per-Org bp-keycloak HelmRelease pins
# `chart.spec.version: "*"`, and SemVer ranks 1.5.0 ABOVE every 1.4.x — so Flux
# resolved `*` to the STALE 1.5.0, which predates the #3263/#2737 proxy-dockerhub
# image fix (landed 1.4.23, 2026-06-11). That stale chart still references bare
# `docker.io/bitnamilegacy/…` images, so the `harbor-proxy-pull` Kyverno Enforce
# policy DENIED the bp-keycloak StatefulSet initContainer + the
# bp-keycloak-postgresql container on the demo Org of the permanent omantel.biz
# Sovereign (dep 4635277cae4ffed9, verified live 2026-06-24) → the customer's
# WordPress (+ newapi/openclaw/stalwart) stayed Ready=False on `dependency
# bp-keycloak is not ready`. The DURABLE fix is to publish a tag that SemVer-ranks
# ABOVE 1.5.0 carrying the CURRENT values.yaml (every Bitnami image already routed
# through `harbor.openova.io/proxy-dockerhub/bitnamilegacy/…`, matching the
# allowed glob `*/proxy-*/*`), so `*` resolves to THIS chart and the proxied
# images pass admission. No chart-content change beyond the version line + this
# changelog — the 1.4.38 templates/values are byte-identical and already
# proxy-compliant. Refs #3785 (sibling proxy-class defect for the WP image).
# 1.5.6 (#5334, 2026-07-23): DROP `roles` from the `powerdns-admin` client's
# defaultClientScopes. The oauth2-proxy/oidc-gate session for pdns-admin stuffed
# the full ~44 realm+client role graph into the browser cookie → >4 KB → oauth2-
# proxy split-cookie → intermittent "Secured with OAuth2 Proxy" callback 500 (the
# ONLY per-service SSO that failed on hw286; native-OIDC grafana/gitea/harbor are
# immune via server-side sessions). The gate does no role auth and PDA maps only
# username/email, so dropping `roles` shrinks the session to
# [sovereign-admins sovereign-viewers] and the cookie falls under 4 KB. `groups`
# retained (Tier-2 convention, guarded by g117-5-tier2-sso-clients.sh). Kept in
# lockstep with bp-oidc-gate 0.1.7 instances.yaml. ONLY the powerdns-admin client
# block changed — no other client's scopes touched.
version: 1.5.7
description: |
  1.5.2 (#4246): the per-tenant `openclaw-oidc-client-secret` Secret now
  emits BOTH `client-secret` AND `OIDC_CLIENT_SECRET` keys (it previously
  emitted only `client-secret`). The bp-openclaw controller Deployment
  reads key `OIDC_CLIENT_SECRET`, so the single-key Secret left the per-Org
  Pod in CreateContainerConfigError "couldn't find key OIDC_CLIENT_SECRET".
  Mirrors the dual-key shape already used by the stalwart Secret.
  Catalyst-curated Blueprint umbrella chart for Keycloak. Depends on the
  upstream `keycloak` chart (bitnami) as a Helm subchart so
  `helm dependency build` pulls the upstream payload into this artifact;
  the Catalyst overlay templates in templates/ (HTTPRoute, sovereign realm
  ConfigMap, tenant realm ConfigMap) sit alongside the upstream subchart and
  Helm renders both at install time. Catalyst-curated values flow into the
  upstream subchart under the `keycloak:` key in values.yaml.
  Phase-8b (issue #604): adds catalyst-ui PKCE client, catalyst-api-server
  service-account client with impersonate role, token-exchange enabled on
  sovereign realm, WebAuthn Required Actions, and SMTP configuration.
  1.4.0 (issue #915 / C1): tenant-mode realm import. When
  realmConfig.tenant.enabled=true the chart emits a per-tenant realm with
  wordpress / openclaw / stalwart OIDC clients pre-registered, plus the
  matching `wordpress-oidc-client-secret` / `openclaw-oidc-client-secret`
  / `stalwart-oidc-client-secret` Secrets the downstream
  bp-wordpress-tenant / bp-openclaw / bp-stalwart-tenant charts consume
  via secretKeyRef. Sovereign-mode unchanged. Closes the chart-side gap
  left by orchestrator PR #911 (which already emits realmConfig.tenant.*).
  1.4.1 (qa-loop iter-4 Fix #23): grant catalyst-api-server service-account
  manage-realm + view-realm + view-clients on realm-management so the
  EPIC-3 T2 tier-role bootstrap goroutine (KEYCLOAK_BOOTSTRAP_TIER_ROLES=
  true) can materialize the catalog-tier realm-roles + composite chain
  at catalyst-api startup. Without these, GET /admin/realms/<r>/roles/<n>
  returned 403 and EnsureRealmRole gave up after 5 retries → TC-248
  failure on the access-matrix UI.
  1.5.0 (qa-loop iter-12 Fix #53, target-state realm-per-Sovereign):
  parameterize the realm name via .Values.sovereignRealm.name (default
  "sovereign" for backward compat). Per-Sovereign overlays now set this
  to the tenant short-name (e.g. omantel.omani.works → "omantel") so
  matrix tests asserting `/admin/realms/<tenant>/...` paths PASS. Both
  the realm import JSON (`"realm": "<name>"`) and the catalyst-kc-sa-
  credentials Secret `realm` key flow from the same value, keeping
  Keycloak realm and catalyst-api CATALYST_KC_REALM env in sync. Closes
  TC-124, TC-125, TC-159, TC-160, TC-161, TC-176, TC-190, TC-285.
  1.4.5 (issue #146, post-#140 retune — prov #21 + #22 hung 30+ min on
  bp-keycloak install): Fix #140 set availabilityCheck.timeout=900s +
  HR install/upgrade.timeout=30m + remediation.retries=3. In practice
  the 900s per-attempt window meant a single failed availability check
  busted the 30m HR window before Job-level backoff could retry —
  AND each HR remediation triggered a full Helm uninstall+reinstall,
  losing all hook-Pod state and restarting Liquibase from zero
  (90m+ wasted wall-clock). On top, Liquibase + JVM cold-start
  legitimately took 5-10min before the StatefulSet's Service had
  Endpoints, but the Bitnami Pod's livenessProbe (initialDelaySeconds
  300) was killing it mid-migration on slower-disk Sovereigns.
  Three coupled changes for target-state fix:
    - keycloakConfigCli.availabilityCheck.timeout 900s → 300s. Faster
      failure means more attempts fit inside 30m HR envelope (~5 vs.
      ~1.5 with 900s). Each 300s window still covers one full
      Liquibase pass + JVM warm-up (typical 90-180s).
    - HR install.remediation.retries + upgrade.remediation.retries
      3 → 1 (in clusters/_template/bootstrap-kit/09-keycloak.yaml).
      The Job's own backoffLimit=5 handles transient races without
      losing state; HR-level remediation is reserved for genuine
      release-failure.
    - keycloak.startupProbe.enabled=true (failureThreshold 360 ×
      periodSeconds 5 = 30m budget). startupProbe is an exclusive
      kubelet gate — livenessProbe + readinessProbe are SUSPENDED
      until startupProbe passes, so slow Liquibase isn't killed
      mid-migration. keycloak.livenessProbe.initialDelaySeconds
      300 → 60 (cold-start protection now lives in startupProbe).
  All knobs operator-overridable via valuesFrom (Principle #4). TODO
  follow-up: move realm-import OUT of the bitnami post-install Helm
  hook into a Catalyst-owned Job that runs after Keycloak Service
  has Endpoints — decouples HR-Ready from realm-imported.
  1.4.4 (issue #140, post-upgrade hook regression on prov #21): Fix #129
  set 600s + backoffLimit=5, which works for fresh-install but races on
  upgrade. On prov #21 (f84f6c3ff2b60296, 2026-05-11) the chart-roll on
  contabo (PR #1346/#1347 stack) triggered an HR UPGRADE; the keycloak
  StatefulSet rolled, Helm fired the post-upgrade hook before the new
  Pod's admin endpoint recovered (Liquibase re-validation + JVM cold
  start on freshly-provisioned node), and the inner 600s availability
  window expired before the first attempt found Keycloak Ready. With
  backoffLimit=5 + 10s..6m exponential backoff the worst-case wall clock
  exceeds the parent HR's 15m upgrade.timeout → Helm aborts the hook →
  "post-upgrade hooks failed". Target-state fix:
    - keycloakConfigCli.availabilityCheck.timeout 600s → 900s (15m inner
      wait covers a single rolling-restart + Liquibase cycle without
      retry, eliminating most backoff time)
    - keycloakConfigCli.cleanupAfterFinished.enabled true (1h TTL) so
      stale hook Pods don't race the before-hook-creation delete on
      subsequent upgrades
    - HR install.timeout + upgrade.timeout 15m → 30m
      (clusters/_template/bootstrap-kit/09-keycloak.yaml) so Helm's
      outer hook-wait accommodates the inner 15m availability window
      plus normal backoff.
  Coupled chart + HR move per Principle #3 (no half-fix). All knobs stay
  operator-overridable via valuesFrom (Principle #4).
  1.4.3 (issue #129, post-upgrade hook timeout wedge): bump bitnami
  keycloakConfigCli.availabilityCheck.timeout 120s → 600s and
  backoffLimit 1 → 5. Fresh-Sovereign provision #15 (otech
  0ad3687ddd72deb7) wedged at phase1-watching because the
  keycloak-config-cli Job (rendered as a Helm post-install/post-upgrade
  hook by the bitnami subchart's default annotations) timed out twice
  inside its 120s availability window before Postgres+Liquibase finished
  bootstrapping Keycloak. Helm reported "post-upgrade hooks failed:
  timed out waiting for the condition" → bp-keycloak HR never reached
  Ready → bp-gitea (dependsOn keycloak OIDC) blocked → bp-self-sovereign-
  cutover never converged. New defaults sit comfortably inside the parent
  HR's 15m install/upgrade timeout. Both knobs remain per-Sovereign
  overridable via valuesFrom (Inviolable Principle #4: no hardcoding).
type: application
keywords: [catalyst, blueprint, keycloak]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# Upstream chart pulled in as a Helm subchart so `helm dependency build`
# bundles it into the OCI artifact. Pinned to bitnami/keycloak 25.2.0
# (matches platform/keycloak/blueprint.yaml + values.yaml
# `catalystBlueprint.upstream.version`). Per
# docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode) the version is
# operator-bumpable via PR + Blueprint release.
#
# Bitnami consolidated their tag scheme around 2025-09 (see
# https://github.com/bitnami/charts/issues/30852): the original
# `bitnami/keycloak:<x>-debian-12-rN` tags now 404 in the registry. The
# preserved historic tags live under `bitnamilegacy/keycloak` (read-only
# archive). values.yaml overrides image.registry/image.repository to point
# every Bitnami image used by this chart at `bitnamilegacy/*` so installs
# succeed. Long-term we will migrate to a Catalyst-built or upstream
# replacement Keycloak image (issue #191 follow-up).
dependencies:
  - name: keycloak
    version: "25.2.0"
    repository: "https://charts.bitnami.com/bitnami"
