# fetch host → fixes EVERY autodiscovery consumer at the owning layer.
# New templates/keycloak-frontend-env.yaml ConfigMap wired via
# keycloak.extraEnvVarsCM.
# 1.4.23 (#3263 #2737, 2026-06-11): kyverno-baseline-Enforce compliance for
# the keycloak + keycloak-postgresql StatefulSets AND the keycloak-config-cli
# Job — the IdP for ALL SSO. After the baseline policies began enforcing on
# hw126, the #3264 roll recreated keycloak-0 and kyverno DENIED it (every SSO
# surface fell back to a bare login page). Two Enforce drivers, now satisfied:
#   - harbor-proxy-pull (Enforce): repoint EVERY Bitnami image off bare
#     `docker.io/bitnamilegacy/…` to the Sovereign-local Harbor proxy-cache
#     `harbor.openova.io/proxy-dockerhub/bitnamilegacy/…` (keycloak,
#     keycloak-config-cli, postgresql, postgres-exporter, os-shell) so each
#     image matches the allowed glob `*/proxy-*/*`. Requires
#     global.security.allowInsecureImages=true (the umbrella chart hard-fails
#     the render on a non-bitnami registry path; bytes are identical).
#   - cilium-l7-mtls (Enforce): add pod-template label
#     `policy.cilium.io/enforced: "true"` via keycloak.podLabels +
#     keycloak.postgresql.primary.podLabels (selector-safe — bitnami
#     common.labels.matchLabels picks only name/instance into the immutable
#     selector). The config-cli Job is NOT matched by cilium-l7-mtls (Job is
#     not in its match-kinds).
# Also added a cpu limit on the keycloak container so the (Audit-mode)
# resource-limits policy row stays clean. resource-requests (Enforce),
# probes-present (Enforce), image-tag-pinned (Enforce), flux-managed (Enforce)
# were already satisfied. Render-proven per-container, helm lint clean.
# Refs #3263 #2737.
#
# 1.4.24 (founder NS-3, #3263, 2026-06-12): owner is admin-by-default. The
# sovereign realm import seeds the deployment owner
# (.Values.sovereignRealm.ownerEmail, threaded from tofu org_email via the
# bootstrap-kit ${SOVEREIGN_OWNER_EMAIL} substitution) into
# /sovereign-admins + /sovereign-viewers at bootstrap. Root cause of the
# hw130 1/5-admin measurement: the catalyst-pin broker creates the owner
# with ZERO groups on first SSO login, and every per-app admin mapping
# (grafana role_attribute_path, gitea --admin-group, harbor
# oidc_admin_group, openbao group alias) keys on sovereign-admins. The
# broker's first-broker-login auto-link flow (idp-create-user-if-unique →
# idp-auto-link, trustEmail=true) links the owner's first SSO login to the
# pre-seeded user by email match — no prompt, no conflict. Guarded: user
# renders only when ownerEmail contains "@" (skips empty AND unsubstituted
# ${SOVEREIGN_OWNER_EMAIL} literals on pre-existing envs). defaultGroups
# stays /sovereign-viewers only. Render test
# tests/sovereign-realm-owner-admin-seed.sh.
# 1.4.27 (#3374, 2026-06-13): sovereign-admin model for the KC admin console
# — the IdP's own UI was the last login-form holdout (bare auth.<fqdn>/
# 302'd to /admin/master/console/ = master-realm local form, measured live
# on hw130 2026-06-13). Two changes: (a) realm import grants /sovereign-
# admins the realm-management `realm-admin` client role (generic on the
# group, never per-user; keycloak-config-cli re-applies so existing realms
# reconcile); (b) the HTTPRoute 302s the bare root to
# /admin/sovereign/console/ (explicit port 443, #3310 class), which
# authenticates silently via the sovereign realm's catalyst-pin IDR. The
# master console remains reachable at its full path (break-glass untouched).
# Gated on gateway.bareURLAdminRedirect.enabled (default true).
# 1.4.28 (#3374, 2026-06-14): add https://bao.<fqdn>/sso/landing to the
# `openbao` Tier-1 client redirectUris. The bp-openbao bare-URL zero-click
# fix routes the bare paths to an on-origin landing page at /sso/landing
# that runs the OIDC round-trip as a top-level window (kills the popup-only
# postMessage error). Its auth_url call sets redirect_uri=<landing>, so
# Keycloak must allow it — without this the authorize request 400s "Invalid
# parameter: redirect_uri" (measured live hw133 2026-06-14). keycloak-config-
# cli reconciles the realm on every post-upgrade Job, so this lands on both
# fresh provs AND the existing live client. (The OpenBao OIDC role's
# allowed_redirect_uris already carries it via bp-openbao 1.2.35+.)
#
# 1.4.29 (#3374 Layer-C, 2026-06-17): ONE admin authority. The sovereign
# realm import now (a) defines the catalyst-{viewer,developer,operator,
# admin,owner} composite realm-role chain (previously these were ONLY
# strings the catalyst-api self-signed into a PIN JWT — System A, never
# real KC roles), and (b) composites `realmRoles: ["catalyst-admin"]`
# onto the `/sovereign-admins` group. ONE membership now lights up the
# Catalyst console (catalyst-admin), the Keycloak admin console
# (realm-management:realm-admin), AND every app keying on the `groups`
# claim — no self-signed assertion, no per-email grant. keycloak-config-
# cli re-applies the import so the composite reaches existing realms too.
