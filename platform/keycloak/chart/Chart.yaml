name: bp-keycloak
# 1.5.4 (#4344, Refs #4325 #4340, 2026-06-25): STABLE master-realm admin
# password across HR re-install + topology re-home. The #4325 de-vcluster
# moved keycloak from the mgmt vCluster into the host `keycloak` namespace
# and did a FRESH helm install there; the bitnami subchart's
# `common.secrets.passwords.manage` regenerated a fresh random admin-password
# (no prior `keycloak` Secret in the brand-new namespace) while the keycloak
# DB PERSISTS (external CNPG, days old). Keycloak only honours
# KC_BOOTSTRAP_ADMIN_PASSWORD on an EMPTY-DB first boot, so the master `admin`
# user kept its ORIGINAL password → keycloak-config-cli got HTTP 401
# invalid_user_credentials → the sovereign-realm import never ran → bp-keycloak
# HR never Ready → bp-gitea (gitea-http NXDOMAIN) → every Org GiteaOrgFailed →
# bp-catalyst-platform never rolled (#4340 org-controller blocked). Root-caused
# live omantel.biz kom4dc dep 4635277cae4ffed9. Durable fix (mirrors the 1.4.8
# postgresql-credentials defense): new templates/admin-credentials.yaml
# materialises a `keycloak-admin` Secret via lookup-or-generate +
# helm.sh/resource-policy: keep, and values.yaml wires the bitnami subchart at
# it (keycloak.auth.existingSecret=keycloak-admin + passwordSecretKey=
# admin-password). BOTH the StatefulSet's KC_BOOTSTRAP_ADMIN_PASSWORD and
# keycloak-config-cli's KEYCLOAK_PASSWORD read that one stable Secret, so the
# password can never regenerate or diverge across reinstall/re-home. The
# master-admin-credentials emission now sources from `keycloak-admin` too. New
# chart test tests/admin-password-stable.sh locks all of it. Refs #4344 #4325 #4340.
# 1.4.21 (#3150, 2026-06-09): federated user must inherit ZERO Keycloak
# required actions on EVERY path. The sovereign realm is passwordless (every
# user authenticates only through the catalyst-pin OIDC broker) but a fresh
# catalyst-pin federation was hitting two stacked prompts. Three coupled
# realm-import fixes (all live-proven on hw124 2026-06-09):
#   1. UPDATE_PASSWORD.defaultAction true -> false. Being a realm DEFAULT
#      action, KC stamped it onto every brand-new federated user created by
#      the `first broker login auto link` flow's idp-create-user-if-unique
#      step, bouncing first-time-via-SSO operators to
#      /login-actions/required-action?execution=UPDATE_PASSWORD.
#   2. Declarative user-profile `components` block marking firstName +
#      lastName OPTIONAL (email stays required). The catalyst-pin id_token
#      carries no name claims; KC's DEFAULT profile requires names for role
#      `user`, injecting a transient VERIFY_PROFILE interrupt that
#      updateProfileFirstLoginMode does NOT suppress — only making the names
#      optional does. (After fix 1, the live chain still terminated at
#      VERIFY_PROFILE until this landed.)
#   3. catalyst-pin IdP updateProfileFirstLoginMode pinned "off" — belt-and-
#      suspenders against the legacy review-profile path.
# trustEmail=true already suppresses VERIFY_EMAIL. Live-proof: pre-fix a
# fresh federation created requiredActions=["UPDATE_PASSWORD"] then bounced
# to VERIFY_PROFILE; post-fix the same federation yields requiredActions=[]
# and the chain returns 302+authorization-code to the console callback with
# ZERO profile/password prompts. New chart test
# tests/sovereign-realm-federated-no-required-actions.sh locks all of it.
# Refs #3150.
# 1.4.20 (#3150, 2026-06-09): enable `implicitFlowEnabled: true` on the
# sovereign-realm `guacamole` Tier-2 client. Apache Guacamole's
# guacamole-auth-sso-openid extension (1.5.5) implements ONLY the OIDC
# implicit flow (response_type=id_token token) — with implicit flow
# disabled, KC returned `error=unauthorized_client … Implicit flow is
# disabled for the client` and guacamole.<fqdn> silent-SSO 404'd at the
# OIDC bounce. Verified live on hw124: post-fix the same auth request 303s
# to the catalyst-pin broker login (no unauthorized_client). Only the
# guacamole client gets implicit flow; all other Tier-1/Tier-2 clients
# stay implicitFlowEnabled:false. tests/g117-5-tier2-sso-clients.sh Case 7
# locks the invariant. Refs #3150.
# 1.4.18 (G117.5-followup #2914, 2026-06-03): emit
# catalyst-kc-master-admin-credentials Secret carrying the bitnami-
# generated master-realm `admin` user creds (looked up from the
# bitnami `keycloak` Secret) so bp-sso-bridge can mint a master-realm
# token via grant_type=password and call POST /admin/realms for
# per-Org realm provisioning. The existing catalyst-kc-sa-credentials
# Secret is sovereign-realm-scoped and cannot create realms (master-
# realm-only `create-realm` role). Both Secrets carry matching
# reflector annotations so sso-bridge's stub mirrors auto-fill.
# Operator overrides via .Values.keycloakAdminPasswordOverride.
# Pairs with bp-sso-bridge 0.2.8 dual-token mint. Refs #2914 #2744.
# 1.4.17 (G117.5c #2744 H21, 2026-06-03): extend
# catalyst-kc-sa-credentials reflector whitelist to include `sso-bridge`
# namespace alongside the existing `catalyst-system` entry. The source
# Secret in keycloak ns previously only allowed reflection into
# catalyst-system; the bp-sso-bridge chart's stub mirror Secret
# (platform/sso-bridge/chart/templates/secret-kc-credentials-mirror.yaml,
# carrying `reflector.v1.k8s.emberstack.com/reflects:
# keycloak/catalyst-kc-sa-credentials`) was rejected by reflector because
# `sso-bridge` was absent from BOTH `reflection-allowed-namespaces` AND
# `reflection-auto-namespaces` on the source — the stub Secret stayed
# at DATA: 0, the sso-bridge-reconciler Pod hit
# CreateContainerConfigError, and G117.5c per-Org realm fan-out + Tier-3
# AppRegistration watcher couldn't reach Keycloak. Caught live H18 walk
# on hw86 2026-06-03 (H21 RCA). Companion to PR #2849 (NetPol port-8080
# fix on the sso-bridge → keycloak reach path): #2849 unblocks the L4
# reach, this PR fills in the L7 credential bundle the reconciler needs
# to authenticate. Refs #2744 #2849 #2856.
# 1.4.16 (G117.E2E-A7 #2816, 2026-06-03): trim two MORE realm-import
# descriptions PR #2824 (1.4.15) missed because its regression test only
# covered configmap-sovereign-realm.yaml. The varchar(255) cap applies
# to EVERY realm-import the chart can emit, not just the sovereign one:
#   - configmap-tenant-realm.yaml stalwart client          288 → 137
#   - configmap-per-org-realms.yaml "first broker login auto
#     link" flow (per-Org realm, G117.5 W2.C4 fan-out)     266 →  99
# The per-Org one is the gating fix for G117.E2E-A7: when bp-sso-bridge's
# `provision_org_realm` POSTs a per-Org realm via the Admin API, the
# 266-char flow description was triggering the same `varchar(255)`
# constraint error on the per-Org realm row insert. Caught while
# attempting the W2.C4 walk on hw86.
# Extends tests/g117-e2e-realm-client-description-255-cap.sh (added in
# PR #2824) to cover all 3 realm-config templates so future descriptions
# can't regress this on any code path. Refs #2816 #2744.
# 1.4.15 (G117.E2E-A1 #2816, 2026-06-03): truncate two Tier-2 client
# descriptions that exceeded the Keycloak DB schema's varchar(255) cap on
# `public.CLIENT.DESCRIPTION`. Reproduces the same anti-pattern as PR
# #1285 (catalyst-api-server 2026-05-15) but for the Tier-2 clients
# introduced by PR #2802 (G117.5 W3.D1):
#   - powerdns-admin: 283 chars  → 137 chars
#   - hubble-ui:      259 chars  → 175 chars
# Any single >255-char description aborts the JDBC batch import in
# keycloak-config-cli with `PSQLException: ERROR: value too long for
# type character varying(255)`, the post-upgrade Job exhausts its
# backoffLimit, Helm rolls back, and the entire downstream stack
# (bp-sso-bridge, bp-catalyst-platform, bp-grafana, …) stalls Ready=False
# on `dependency 'flux-system/bp-keycloak' is not ready`. Caught live on
# hw86 2026-06-03 blocking the G117.E2E-A1 hw86 stabilization. New
# chart test `tests/g117-e2e-realm-client-description-255-cap.sh`
# guards against future drift by re-asserting the cap at render time
# for every client + flow + authenticatorConfig description in the
# realm-import. Refs #2816 #2802 #1285.
# 1.4.14 (G117.5b #2789, 2026-06-02): SSO client-secret rotation knob.
# Adds optional .Values.sso.tier1ClientSecretSalt — when non-empty, the
# Tier-1/Tier-2/Tier-3 client-secret derivation helpers in _helpers.tpl
# append it to the SHA-256 seed, atomically rotating every derived SSO
# client secret in the realm-import on next helm upgrade. Empty default
# preserves render-stability + back-compat (existing Sovereigns keep
# their current secrets across this upgrade). bp-sso-bridge auto-
# discovers the new secrets on its next tick. Refs #2789.
# 1.4.13 (G117.5 W3.D1 #2744, 2026-06-02): Tier-2 silent-SSO clients
# codified in the sovereign realm-import. New entries appended to clients[]:
#   - guacamole       (redirectUris: https://guacamole.<sov-fqdn>/*)
#   - powerdns-admin  (redirectUris: https://pdns-admin.<sov-fqdn>/oidc/authorized + https://pdns-admin.<sov-fqdn>/*)
#   - hubble-ui       (redirectUris: https://hubble.<sov-fqdn>/oauth2/callback)
# Each client's `secret` is derived via the new
# `bp-keycloak.tier2ClientSecret` named template (sha256sum of
# Release.Name|Release.Namespace|tier2-sso|clientId — namespaced apart
# from `tier1ClientSecret` so the two tiers can rotate independently).
# Pattern mirrors 1.4.10 Tier-1 codification; same realm, same
# catalyst-pin IDR `defaultProvider`, same `kc_idp_hint` defense-in-depth
# at the per-app chart level. The hubble-ui client is pre-declared even
# though the bp-cilium oauth2-proxy sidecar is not yet shipped (decorative
# `auth: oidc` annotation removed in same PR per Aux-2 tier-2/bp-cilium.md
# audit) — codifying ahead of consumer avoids a race when the sidecar
# lands and lets the realm-import stay authoritative. Refs #2744.
# 1.4.12 (G117.5 W2.C4 #2744, 2026-06-02): Per-Org realm fan-out template.
# New file templates/configmap-per-org-realms.yaml iterates
# `.Values.tenantRealms[]` (default empty — no-op) and emits one ConfigMap
# per Org each carrying a complete realm-import JSON with:
#   - identityProviders[sovereign-broker] = keycloak-oidc IdP federating
#     into https://auth.<sov-fqdn>/realms/sovereign (the 2nd hop of the
#     3-hop Tier-3 SSO chain Org-realm → sovereign-realm → catalyst-pin)
#   - authenticatorConfig[sovereign-broker-redirector] +
#     authenticationFlows[browser] IDR binding so KC auto-303s every
#     unauthenticated realm auth-request to the broker WITHOUT showing
#     the username/password form (G113 #2725 pattern carried over)
#   - first broker login auto link flow (G113 Bug-6 carryover —
#     bypasses KC SMTP for federated-identity auto-link)
#   - groups clientScope mandatory (G91 manual recovery — missing groups
#     claim breaks role-based authz at every consumer app)
#   - clients[] empty (bp-sso-bridge registers Tier-3 app clients at
#     runtime per its provision_org_realm reconciler routine)
# Per-Org broker secret derived deterministically via the new
# `bp-keycloak.tenantBrokerClientSecret` helper (sha256 of Release.Name|
# Release.Namespace|orgSlug) so chart upgrades don't rotate secrets and
# bp-sso-bridge re-derives the same value when it registers the
# matching `<slug>-broker` Client in the sovereign realm.
# Cross-Org isolation invariant: each Org realm issues id_tokens with
# `iss=https://auth.<sov>/realms/<slug>` — Org-A tokens are rejected at
# OIDC-discovery by Org-B applications. Refs #2744.
# 1.4.11 (G113 #2725 Bug-6 codification, 2026-06-02): codify the runtime
# pre-link workaround for KC first-broker-login flow. The default flow
# fires `idp-confirm-link` (REQUIRED) + `Verify Existing Account by Email`
# whenever the federated catalyst-pin user collides by email with an
# existing realm user — both steps require KC SMTP. On Sovereigns whose
# KC SMTP is not yet wired up the broker callback hangs. Runtime
# workaround on hw86 was per-user POST /admin/realms/sovereign/users/
# {id}/federated-identity/{alias} (HTTP 204) — manual pre-link. Codified
# equivalent: a new custom top-level authentication flow `first broker
# login auto link` with only `idp-create-user-if-unique` (ALT) +
# `idp-auto-link` (ALT). The catalyst-pin IdP's firstBrokerLoginFlowAlias
# now points at it; trustEmail=true (already set) makes the auto-link
# trigger on email match WITHOUT any SMTP or user prompt. Refs #2725.
# 1.4.10 (G117.5 #2744, 2026-06-02): Tier-1 silent-SSO clients codified
# in the sovereign realm-import. New entries appended to clients[]:
#   - grafana       (redirectUris: https://grafana.<sov-fqdn>/*)
#   - gitea         (redirectUris: https://gitea.<sov-fqdn>/*)
#   - harbor        (redirectUris: https://registry.<sov-fqdn>/*)
#   - openbao       (redirectUris: https://bao.<sov-fqdn>/ui/vault/auth/
#                    oidc/oidc/callback + http://localhost:8250/oidc/callback)
# Each client's `secret` is derived deterministically via the new
# `bp-keycloak.tier1ClientSecret` named template (sha256sum of
# Release.Name|Release.Namespace|clientId — stable across renders, unique
# per Sovereign). bp-sso-bridge's reconcile loop discovers these on its
# first tick (existing-client codepath: KC returns the stored secret;
# bridge reuses it) and distributes the bundle to OpenBao
# `secret/sso/<clientId>`. Codifies the manual step "create realm + 4
# clients manually" from feedback_sso_manual_recovery_procedure.md
# Step 2. Refs #2744.
# 1.4.9 (G113 #2725 followup, 2026-06-02): codify the runtime KC fix
# discovered while debugging hw86 silent-SSO. The sovereign realm import
# now ships `authenticatorConfig: [{alias: catalyst-pin-redirector,
# config: {defaultProvider: catalyst-pin}}]` + an `authenticationFlows`
# override on the `browser` flow that binds that config to the
# `identity-provider-redirector` execution. Without this, even with
# `kc_idp_hint=catalyst-pin` passed by each per-app SSO config, KC
# silently fell through to the username/password form. Live evidence
# 2026-06-02 12:08Z: 4-hop no-cookie SSO probe failed → POST
# /admin/realms/sovereign/authentication/executions/{id}/config with the
# same payload returned HTTP 201 → next probe verified 4-hop chain
# end-to-end (Grafana → KC realm auth 303 → KC broker /catalyst-pin/login
# 303 → catalyst-api /oidc/auth 303 → console /login 302 on no-cookie).
# Refs #2725.
# 1.4.8 (G112 #2721, 2026-06-01): postgresql.auth.existingSecret pivot —
# new templates/postgresql-credentials.yaml materialises a stable
