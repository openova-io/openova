{{- /*
Catalyst HTTPRoute for Keycloak — bp-keycloak (issue #387, Cilium Gateway
API migration). Replaces the upstream chart's networking.k8s.io/v1.Ingress
on Sovereigns; the upstream `keycloak.ingress.enabled` is set to `false`
in values.yaml so this is the sole HTTP exposure.

Pattern from docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode):
  - `gateway.host` — operator-supplied; fails closed if absent
  - `gateway.parentRef` — defaults to cilium-gateway in kube-system
                          (the per-Sovereign Gateway from bootstrap-kit
                          01-cilium.yaml)

Backend reference: the upstream bitnami/keycloak chart uses Helm's
`fullname` template which TRIMS the chart-name suffix when the Release.Name
already contains it. With releaseName=keycloak (bootstrap-kit default), the
bitnami fullname returns "keycloak" (not "keycloak-keycloak"). The default
backendService MUST use `.Release.Name` directly (issue #598).
Operators can override via `gateway.backendService` for non-default
release names.
*/}}
{{- if and .Values.gateway .Values.gateway.enabled -}}
{{- if .Values.gateway.host }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.gateway.name | default "keycloak" | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-keycloak
    catalyst.openova.io/component: keycloak
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentRef.name | default "cilium-gateway" | quote }}
      namespace: {{ .Values.gateway.parentRef.namespace | default "kube-system" | quote }}
      {{- with .Values.gateway.parentRef.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
{{- if and .Values.gateway.bareURLAdminRedirect .Values.gateway.bareURLAdminRedirect.enabled }}
{{- /*
BARE-URL sovereign-admin entry (#3374). Keycloak's own root previously
302'd to /admin/master/console/ — the MASTER realm, whose only auth is
the local username/password form (no catalyst-pin broker): the last
login-form holdout on the Sovereign. The SOVEREIGN realm's admin console
(/admin/<realm>/console/) authenticates through that realm's browser
flow — silent catalyst-pin — and accepts /sovereign-admins members via
the realm-management `realm-admin` group role shipped in the realm
import. So the gateway sends the bare root there instead.
Loop-safety: one-way hop; the admin console SPA lives entirely under
/admin/<realm>/console/ and never redirects back to `/`. The master
console stays reachable at its full path (break-glass untouched, law
#3374 §2.6). Port explicit 443 (the #3310 class).
*/}}
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            port: 443
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ printf "/admin/%s/console/" (.Values.gateway.bareURLAdminRedirect.realm | default "sovereign") | quote }}
            statusCode: 302
{{- end }}
{{- if and .Values.gateway.accountConsoleRedirect .Values.gateway.accountConsoleRedirect.enabled .Values.sovereignFQDN }}
{{- /*
ACCOUNT-CONSOLE INTERCEPT (#6090, UAT row 109 clause b).

Keycloak's built-in account console CANNOT work on this Sovereign, and that
is definitional rather than a defect: a Keycloak-native account console
cannot mint a REST token from a PIN-brokered session (#688). What it did
instead was worse than refusing. Measured on hw293: the User reaches
/realms/<realm>/account/, the catalyst-pin IdP completes SILENTLY, and the
browser lands on a page whose entire body text is "Loading the Account
Console" — held 20+ seconds, document.title "Account Management", zero
h1/h2, NO error text, no diagnosis, no way out. The backend was healthy
(/account/config answered 200), so this is the stock keycloak.v2 SPA
swallowing its own failed bootstrap behind the placeholder.

Row 109 requires that reaching it directly "fails loud and legibly". An
infinite silent spinner is the exact opposite, and it is the one outcome a
User cannot act on.

Gateway API v1 has no direct-response filter — RequestRedirect is the only
mechanism here — so the intercept sends the User to the console surface that
DOES serve their profile, which is the same surface clause (a) already passes
on (/settings renders the owner with no second login). A visible one-hop
bounce to a working page is legible; a spinner that never resolves is not.

SCOPED TO THE TWO SPA ENTRY PATHS, deliberately Exact and never PathPrefix.
`/realms/<realm>/account/config` and the rest of the account REST surface
must keep answering — a PathPrefix here would capture them and turn a UI
problem into an API outage. Catching only the document entry means the SPA
never boots, so it never reaches the bootstrap it cannot complete.

Loop-safety: the redirect leaves this host entirely (auth.<fqdn> →
console.<fqdn>), so it cannot re-enter itself. Port is explicit 443 — the
#3310 class the bare-URL rule above already records, where Gateway API
otherwise copies the cilium listener port into Location.
*/}}
    - matches:
        - path:
            type: Exact
            value: {{ printf "/realms/%s/account" (.Values.sovereignRealm.name | default "sovereign") | quote }}
        - path:
            type: Exact
            value: {{ printf "/realms/%s/account/" (.Values.sovereignRealm.name | default "sovereign") | quote }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: {{ printf "console.%s" .Values.sovereignFQDN | quote }}
            port: 443
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ .Values.gateway.accountConsoleRedirect.path | default "/settings" | quote }}
            statusCode: 302
{{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.path | default "/" | quote }}
      backendRefs:
        - name: {{ .Values.gateway.backendService | default .Release.Name | quote }}
          port: {{ .Values.gateway.backendPort | default 80 }}
{{- end }}
{{- end }}
