{{- /*
Catalyst bp-keycloak — Sovereign realm import ConfigMap + catalyst-api service-account
credentials Secret (issue #604 / #608, Phase-8b handover).

This single template owns BOTH resources so they share the same generated
service-account client secret. Splitting them into two files would re-run
randAlphaNum independently, producing two different secrets and a permanent
authentication mismatch between Keycloak (realm import) and catalyst-api
(env vars). One file → one Helm template scope → one shared variable.

What this file emits
────────────────────
1. ConfigMap  {{ "{{ .Release.Name }}" }}-sovereign-realm-config (keycloak ns)
   - Holds the realm JSON imported by the upstream bitnami/keycloak chart's
     keycloak-config-cli post-deploy Job (existingConfigmap reference in
     values.yaml keycloak.keycloakConfigCli.existingConfigmap).
   - Defines the `sovereign` realm: catalyst-ui (PKCE), kubectl (public),
     catalyst-api-server (confidential service-account with realm-management
     impersonate + manage-users + view-users + query-users + manage-realm +
     view-realm + view-clients role mappings — manage-realm/view-realm let
     the catalyst-api EPIC-3 T2 tier-role bootstrap goroutine create the
     catalyst-{viewer,developer,operator,admin,owner} realm-roles + composite
     chain at startup; view-clients is needed to inspect the realm during
     reconciliation. See products/catalyst/bootstrap/api/internal/keycloak/
     realm_bootstrap.go for the bootstrap plan).

2. Secret    catalyst-kc-sa-credentials (keycloak ns)
   - Mirrored cross-namespace into catalyst-system by emberstack/reflector
     (bootstrap-kit slot 05a). The mirror's keys (addr, realm, client-id,
     client-secret) are consumed by catalyst-api as env vars
     CATALYST_KC_ADDR / CATALYST_KC_REALM / CATALYST_KC_SA_CLIENT_ID /
     CATALYST_KC_SA_CLIENT_SECRET — see products/catalyst/chart/templates/
     api-deployment.yaml secretKeyRef section. Without this Secret the
     /auth/handover endpoint returns "server misconfiguration: keycloak
     not configured" (auth_handover.go:169).

Secret-value resolution order (first match wins)
────────────────────────────────────────────────
  1. operator-supplied .Values.catalystApiServerClientSecret (cluster overlay)
  2. existing Secret in keycloak ns (helm `lookup` → idempotent on upgrade)
  3. fresh `randAlphaNum 32` (zero-touch on first install)

Pattern mirrors platform/powerdns/chart/templates/api-credentials-secret.yaml
(canonical seam for self-bootstrapping per-Sovereign credentials, ADR-0001
§11.3 anti-duplication). Both resources render in the same template pass so
the shared `$saSecret` variable carries through.

Why this is the canonical seam vs. a post-install Job
─────────────────────────────────────────────────────
The realm import already creates the catalyst-api-server client with role
mappings (clientScopeMappings.realm-management). The realm import takes a
literal client secret in the JSON — keycloak-config-cli persists it. So the
secret value is determined at chart-render time, not by a follow-up Admin-API
script. A Job-based approach would have to: (a) wait for Keycloak Ready, (b)
mint an admin token, (c) PUT the client secret, (d) write the K8s Secret —
that's four failure modes the lookup-or-generate pattern eliminates.

Canonical seam: platform/keycloak/chart/templates/configmap-sovereign-realm.yaml

Tenant-mode mutual exclusion (issue #915, C1)
─────────────────────────────────────────────
When `realmConfig.tenant.enabled=true` the chart is being installed for an
Organization tenant (per-tenant Keycloak with a tenant realm + per-app OIDC clients
for wordpress / openclaw / stalwart). In that mode the tenant realm
ConfigMap (templates/configmap-tenant-realm.yaml) emits a ConfigMap with
the SAME name expected by `keycloakConfigCli.existingConfigmap`
(`{{"{{ .Release.Name }}"}}-sovereign-realm-config`) so the upstream
keycloak-config-cli Job imports the tenant realm instead. To avoid two
ConfigMaps colliding on the same name, this Sovereign template skips when
tenant mode is on. The orchestrator (A3 / PR #911) currently sets BOTH
`sovereignRealm.enabled=true` and `realmConfig.tenant.enabled=true` in the
tenant emit; tenant takes precedence here.
*/}}
{{- if and .Values.sovereignRealm.enabled (not (and .Values.realmConfig (and .Values.realmConfig.tenant .Values.realmConfig.tenant.enabled))) }}
{{- /* ── Resolve realm name (per-Sovereign tenant short-name) ─────────── */}}
{{- $realmName := default "sovereign" .Values.sovereignRealm.name -}}
{{- /* ── Resolve catalyst-api-server client secret ─────────────────────── */}}
{{- $saSecretName := "catalyst-kc-sa-credentials" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $saSecretName -}}
{{- $saSecret := "" -}}
{{- if $existing -}}
  {{- /* Idempotent: reuse on upgrade so the realm-import client secret
         stays stable across Helm reconciles. */ -}}
  {{- $saSecret = index $existing.data "client-secret" | b64dec -}}
{{- end -}}
{{- if .Values.catalystApiServerClientSecret -}}
  {{- /* Operator override wins — useful for replicating an existing
         per-Sovereign secret from a sealed-secret or external store. */ -}}
  {{- $saSecret = .Values.catalystApiServerClientSecret -}}
{{- end -}}
{{- if not $saSecret -}}
  {{- /* #3813 (Refs #3642): genuine first install. Was `randAlphaNum 32`,
         but after #3642 keycloak runs in vc-mgmt, so this Secret + realm
         client are stranded inside the vCluster — the host catalyst-api /
         organization-controller / sso-bridge never see them. The durable
         fix re-creates catalyst-kc-sa-credentials HOST-side from a bridge
         in products/catalyst/chart; for that bridge to carry the SAME
         value baked here it must be REPRODUCIBLE from the keycloak release
         coordinates, which a random string is not. The
         `bp-keycloak.catalystApiServerClientSecret` helper derives it
         deterministically (same SHA256 seam as tier1ClientSecret /
         pinBrokerClientSecret already use) so the host bridge re-derives
         the identical secret. Still namespace+release-scoped (unique per
         Sovereign) + honours .sso.tier1ClientSecretSalt rotation. The
         lookup branch above still wins on upgrade so an already-installed
         realm keeps its stored secret; this only sets the first-install
         value. Per INVIOLABLE-PRINCIPLES #10 no plaintext credential is
         committed — the value is computed at render time, never echoed to
         chart source or disk. */ -}}
  {{- $saSecret = include "bp-keycloak.catalystApiServerClientSecret" (dict "ctx" .) -}}
{{- end -}}
{{- /* Keycloak base URL — issue #781.
       This URL is consumed EXCLUSIVELY by the in-cluster catalyst-api Pod
       (via the catalyst-kc-sa-credentials Secret reflected into
       catalyst-system) for intra-cluster OAuth client_credentials calls
       (token mint, EnsureUser, etc.). It is NEVER exposed to browsers —
       browsers reach Keycloak through the Cilium Gateway HTTPRoute at
       https://<gateway.host>.

       Why we use the in-cluster Service URL, not https://auth.<sov-fqdn>:
       on a Sovereign, the cluster's CoreDNS resolves *.<sov-fqdn> via the
       upstream resolvers — it does NOT forward to the in-cluster
       PowerDNS that holds those records. Result: Pod-side lookups of
       auth.<sov-fqdn> return NXDOMAIN even though public DNS is healthy.
       Caught live on otech94 2026-05-04: handover URL returned
       `{"error":"keycloak error: ensure user"}` from a
       `dial tcp: lookup auth.otech94.omani.works ... no such host`
       inside the catalyst-api Pod.

       The fix: write the Service URL into the Secret. CoreDNS resolves
       <release>.<namespace>.svc.cluster.local natively (kube-dns plugin),
       so the lookup never leaves the cluster. The HTTPRoute hostname
       (.Values.gateway.host) is unaffected — it remains the operator-
       facing URL for browsers. Inviolable Principle #4 (never hardcode)
       still holds: the URL is computed from .Release.Name + .Release.Namespace,
       both runtime-configurable via the bp-keycloak HelmRelease. */ -}}
{{- $kcAddr := printf "http://%s.%s.svc.cluster.local" .Release.Name .Release.Namespace -}}
{{- /* ── Declarative user-profile config (#3150) ───────────────────────────
     Keycloak 24+ has the declarative user profile ALWAYS ON. Its default
     config marks `firstName` and `lastName` as required for the `user`
     role. The catalyst-pin OIDC id_token carries only email (+ groups) —
     NO given/family name — so when the broker creates a brand-new
     federated user, Keycloak's first-broker-login evaluates the user
     profile, finds firstName/lastName missing, and injects a TRANSIENT
     VERIFY_PROFILE interrupt (this is NOT a stored required action and is
     NOT suppressed by updateProfileFirstLoginMode — it is a profile-
     completeness gate). Live-proven on hw124 2026-06-09: after fixing
     UPDATE_PASSWORD the chain still terminated at
     /login-actions/required-action?execution=VERIFY_PROFILE.

     Fix: ship a declarative-user-profile component in the realm import
     that drops `required` from firstName + lastName (email stays
     required). With the names optional the profile is "complete" for a
     name-less federated user, so no VERIFY_PROFILE fires — the broker
     returns the authorization code with zero prompts. keycloak-config-cli
     imports realm `components` reliably; the `kc.user.profile.config`
     value MUST be a single-element array whose element is a JSON STRING
     (Keycloak stores the profile as serialized JSON), so we build the
     map with Go templating then `toJson`-encode it twice: once for the
     inner profile document, once (implicitly, via the realm being valid
     JSON) for the surrounding string. */ -}}
{{- $userProfileDoc := dict
    "attributes" (list
      (dict "name" "username" "displayName" "${username}"
        "validations" (dict "length" (dict "min" 3 "max" 255) "username-prohibited-characters" (dict) "up-username-not-idn-homograph" (dict))
        "permissions" (dict "view" (list "admin" "user") "edit" (list "admin" "user"))
        "multivalued" false)
      (dict "name" "email" "displayName" "${email}"
        "validations" (dict "email" (dict) "length" (dict "max" 255))
        "required" (dict "roles" (list "user"))
        "permissions" (dict "view" (list "admin" "user") "edit" (list "admin" "user"))
        "multivalued" false)
      (dict "name" "firstName" "displayName" "${firstName}"
        "validations" (dict "length" (dict "max" 255) "person-name-prohibited-characters" (dict))
        "permissions" (dict "view" (list "admin" "user") "edit" (list "admin" "user"))
        "multivalued" false)
      (dict "name" "lastName" "displayName" "${lastName}"
        "validations" (dict "length" (dict "max" 255) "person-name-prohibited-characters" (dict))
        "permissions" (dict "view" (list "admin" "user") "edit" (list "admin" "user"))
        "multivalued" false)
    )
    "groups" (list
      (dict "name" "user-metadata" "displayHeader" "User metadata" "displayDescription" "Attributes, which refer to user metadata")
    )
-}}
{{- $userProfileConfigJSON := toJson $userProfileDoc -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-sovereign-realm-config
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-keycloak
    catalyst.openova.io/component: keycloak-config-cli
    {{- with .Values.sovereignFQDN }}
    catalyst.openova.io/sovereign-fqdn: {{ . | quote }}
    {{- end }}
data:
  sovereign-realm.json: |
    {
      "realm": {{ $realmName | quote }},
      "enabled": true,
      "displayName": {{ default "Sovereign" .Values.sovereignRealm.displayName | quote }},
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "accessTokenLifespan": 900,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 28800,
      "attributes": {
        "token-exchange": "true"
      },
      {{- if and .Values.smtp .Values.smtp.host }}
      "smtpServer": {
        "host": {{ .Values.smtp.host | quote }},
        "port": {{ .Values.smtp.port | default "587" | quote }},
        "from": {{ .Values.smtp.from | default "noreply@openova.io" | quote }},
        "fromDisplayName": "Sovereign Cloud",
        "ssl": {{ .Values.smtp.ssl | default "false" | quote }},
        "starttls": {{ .Values.smtp.starttls | default "true" | quote }},
        "auth": {{ .Values.smtp.auth | default "true" | quote }}
        {{- if and .Values.smtp.user .Values.smtp.user }},
        "user": {{ .Values.smtp.user | quote }}
        {{- end }}
      },
      {{- end }}
      "defaultGroups": [
        "/sovereign-viewers"
      ],
      {{- /*
      #3374 Layer-C (2026-06-17) — ONE admin authority: the catalyst-*
      realm-role chain.

      The operator console's RBAC (auth.go / whoami) keys on the
      `catalyst-{viewer,developer,operator,admin,owner}` realm roles.
      Before this block those roles existed ONLY as strings the
      catalyst-api PIN-mint asserted in a self-signed JWT (System A in
      #3374 §3-c) — they were NEVER real Keycloak realm roles, so a
      genuinely Keycloak-federated operator (catalyst-ui PKCE) could not
      be admin no matter what groups they held. Defining them here as
      real composite realm roles makes the console-RBAC vocabulary a
      first-class part of the realm, grantable + compositable like any
      other role — the precondition for the `/sovereign-admins` group
      below to confer `catalyst-admin` generically.

      Inheritance composite chain (viewer < developer < operator <
      admin < owner), mirroring whoamiTierInheritance in auth.go: each
      higher role `composites.realm` the one below it, so holding
      `catalyst-admin` effectively grants viewer/developer/operator too
      — the SAME inheritance the whoamiInjectTierRoles projection
      applies, now sourced from Keycloak rather than synthesized.
      */ -}}
      "roles": {
        "realm": [
          { "name": "catalyst-viewer",    "description": "Catalyst console: read-only operator." },
          { "name": "catalyst-developer", "description": "Catalyst console: developer tier.",
            "composite": true, "composites": { "realm": ["catalyst-viewer"] } },
          { "name": "catalyst-operator",  "description": "Catalyst console: operator tier.",
            "composite": true, "composites": { "realm": ["catalyst-developer"] } },
          { "name": "catalyst-admin",     "description": "Catalyst console: admin tier (BSS + RBAC nav).",
            "composite": true, "composites": { "realm": ["catalyst-operator"] } },
          { "name": "catalyst-owner",     "description": "Catalyst console: Sovereign owner.",
            "composite": true, "composites": { "realm": ["catalyst-admin"] } }
        ]
      },
      {{- /*
      #3374 (2026-06-13) — sovereign-admin access model for the Keycloak
      admin console (the IdP's own UI, the last login-form holdout).
      Members of /sovereign-admins receive the realm-management
      `realm-admin` composite client role, so the SOVEREIGN realm's own
      admin console (/admin/sovereign/console/) accepts them — and that
      console authenticates through the sovereign realm's browser flow,
      i.e. silently via the catalyst-pin IDR. Zero-click, generic on the
      group (law: elevation keys on sovereign-admins, never per-user).
      keycloak-config-cli re-applies the import, so this reconciles onto
      existing realms too. The master realm + its local form remain
      untouched (not the default path; bp-keycloak httproute now 302s
      the bare root to the sovereign realm console).

      #3374 Layer-C (2026-06-17) — ONE membership lights up ALL surfaces.
      The group now composites BOTH the KC-console role (realm-management
      `realm-admin`, the IdP's own UI) AND the `catalyst-admin` realm
      role (the operator console's RBAC), via `realmRoles`. This closes
      the #3374 §3-c disjunction: previously the group carried ONLY
      realm-management:realm-admin, so a federated operator in
      /sovereign-admins could surf the Keycloak admin console but the
      Catalyst console did NOT see them as admin (it relied on the
      self-signed `catalyst-owner` System-A constant). Now the SINGLE
      decision point — membership in /sovereign-admins — confers admin on
      every surface (console, KC console, and every app keying on the
      `groups` claim). No self-signed assertion, no per-email grant, no
      unreconciled one-shot. keycloak-config-cli re-applies the import so
      this composites onto existing realms too.
      */ -}}
      "groups": [
        {
          "name": "sovereign-admins",
          "realmRoles": ["catalyst-admin"],
          "clientRoles": {
            "realm-management": ["realm-admin"]
          }
        },
        { "name": "sovereign-ops" },
        { "name": "sovereign-viewers" }
      ],
      {{- /*
      #3150 (2026-06-09): declarative user-profile with firstName/lastName
      OPTIONAL. The catalyst-pin id_token has no name claims; with the KC
      default profile (names required for role `user`) a fresh federated
      user is bounced to VERIFY_PROFILE. Dropping `required` from firstName
      + lastName makes the name-less federated profile "complete" so no
      profile prompt fires. See the $userProfileDoc builder near the top of
      this template for the rationale. The value is a single-element array
      whose element is the serialized profile JSON string.
      */ -}}
      "components": {
        "org.keycloak.userprofile.UserProfileProvider": [
          {
            "providerId": "declarative-user-profile",
            "config": {
              "kc.user.profile.config": [
                {{ $userProfileConfigJSON | toJson }}
              ]
            }
          }
        ]
      },
      {{- /*
      #3150 (2026-06-09): UPDATE_PASSWORD `defaultAction` MUST be false.

      Every user on this realm authenticates EXCLUSIVELY through the
      catalyst-pin OIDC broker (PIN -> catalyst-api session -> federated
      identity) — there are NO local passwords. When the broker creates
      a brand-new federated user via the `first broker login auto link`
      flow's `idp-create-user-if-unique` step, Keycloak stamps the realm's
      DEFAULT required actions onto that fresh user. With
      `UPDATE_PASSWORD.defaultAction=true` the new operator was immediately
      bounced to /login-actions/required-action?execution=UPDATE_PASSWORD —
      a password-set prompt that makes no sense for a passwordless
      broker-only realm and directly violates the founder requirement
      "user will NEVER be asked by Keycloak for auth."

      Live-proof on hw124 (2026-06-09): a fresh catalyst-pin federation
      created user newop-...@hw124.omani.works with
      requiredActions=["UPDATE_PASSWORD"], and the OIDC chain terminated
      on the UPDATE_PASSWORD required-action interrupt instead of
      returning the authorization `code`. Flipping defaultAction->false
      removes UPDATE_PASSWORD from the default set so federated users are
      created with an EMPTY requiredActions list and the chain returns
      302+code with no profile/password prompt on every path — including
      a first-time-via-SSO operator who never PIN-logged-in before.

      The action stays `enabled:true` (still available for the rare
      self-service password-set case) but is no longer auto-applied to
      every new user. This is ONE of three coupled #3150 fixes that
      together yield an empty requiredActions list on every path:
        1. UPDATE_PASSWORD.defaultAction=false (here) — no password prompt.
        2. declarative user-profile with firstName/lastName OPTIONAL (the
           `components` block above) — no VERIFY_PROFILE prompt. (The
           catalyst-pin id_token carries no name claims; KC's DEFAULT
           profile requires names for role `user`, which injects a
           transient VERIFY_PROFILE interrupt that updateProfileFirstLogin
           Mode does NOT suppress — only making the names optional does.)
        3. trustEmail=true on the catalyst-pin IdP — no VERIFY_EMAIL.
      updateProfileFirstLoginMode:off (set on the IdP below) is a fourth,
      belt-and-suspenders guard against the legacy review-profile path.
      Live-proven on hw124 2026-06-09: with all of these a fresh
      federation returns 302+code with ZERO prompts.
      */ -}}
      "requiredActions": [
        {
          "alias": "UPDATE_PASSWORD",
          "name": "Update Password",
          "providerId": "UPDATE_PASSWORD",
          "enabled": true,
          "defaultAction": false,
          "priority": 30,
          "config": {}
        },
        {
          "alias": "webauthn-register",
          "name": "Webauthn Register",
          "providerId": "webauthn-register",
          "enabled": true,
          "defaultAction": false,
          "priority": 70,
          "config": {}
        },
        {
          "alias": "webauthn-register-passwordless",
          "name": "Webauthn Register Passwordless",
          "providerId": "webauthn-register-passwordless",
          "enabled": true,
          "defaultAction": false,
          "priority": 80,
          "config": {}
        }
      ],
      "clientScopes": [
        {
          "name": "groups",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "groups",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "required-actions",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "required-actions",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "requiredActions",
                "id.token.claim": "true",
                "access.token.claim": "false",
                "claim.name": "requiredActions",
                "userinfo.token.claim": "true",
                "multivalued": "true",
                "jsonType.label": "String"
              }
            }
          ]
        },
        {
          "name": "org",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "org",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "org",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "org_id",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            }
          ]
        }
      ],
      "clients": [
        {
          "clientId": "kubectl",
          "name": "kubectl (per-Sovereign K8s api-server OIDC client)",
          "description": "Public OIDC client for kubectl OIDC login against k3s api-server (issue #326). Left intact from bp-keycloak 1.2.x.",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "implicitFlowEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": [
            "http://localhost:8000",
            "http://localhost:8000/*",
            "urn:ietf:wg:oauth:2.0:oob"
          ],
          "webOrigins": [
            "+"
          ],
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "email",
            "groups",
            "org"
          ],
          "optionalClientScopes": [
            "address",
            "phone",
            "offline_access",
            "microprofile-jwt"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "access.token.lifespan": "900"
          }
        },
        {
          "clientId": "catalyst-ui",
          "name": "Catalyst UI (Sovereign console)",
          "description": "Public PKCE client for the catalyst-ui SPA at console.<sovereignFQDN>. ID token includes groups + requiredActions claims for first-login UX (issue #604).",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "implicitFlowEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": [
            "https://console.{{ .Values.sovereignFQDN }}/*"
          ],
          "webOrigins": [
            "https://console.{{ .Values.sovereignFQDN }}"
          ],
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "email",
            "groups",
            "org"
          ],
          "optionalClientScopes": [
            "address",
            "phone",
            "offline_access",
            "microprofile-jwt",
            "required-actions"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "access.token.lifespan": "900",
            "post.logout.redirect.uris": "https://console.{{ .Values.sovereignFQDN }}/*"
          }
        },
        {{- /*
        #3934 part-4 (Refs #3642): bind Keycloak's built-in account + admin
        consoles to the `browser-no-idp` flow so they are NOT force-bounced
        into the catalyst-pin broker (which 400s `cookie_not_found` on a
        hint-less, cookie-less nav). These are KC realm-import DEFAULT clients;
        re-declaring them by clientId MERGES the override onto the default
        client (KC keeps every unspecified default attribute, incl. the
        baseUrl/redirectUris the import generates for them). Only the
        authenticationFlowBindingOverrides.browser field is asserted here —
        everything else stays KC-default. `account` is the account REST
        client (no browser flow); only the two consoles need the override.
        */ -}}
