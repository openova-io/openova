        "off" here is the explicit, durable guard so a future declarative
        user-profile change or a flow edit can never re-surface a profile
        prompt. Combined with trustEmail=true (no VERIFY_EMAIL) and
        UPDATE_PASSWORD.defaultAction=false (no password prompt — see the
        requiredActions block above) the federated user is created with an
        EMPTY requiredActions list on EVERY path.
        */ -}}
        {
          "alias": "catalyst-pin",
          "displayName": "Catalyst PIN Sign-In",
          "providerId": "oidc",
          "enabled": true,
          "trustEmail": true,
          "updateProfileFirstLoginMode": "off",
          "storeToken": false,
          "addReadTokenRoleOnCreate": false,
          "authenticateByDefault": false,
          "linkOnly": false,
          "firstBrokerLoginFlowAlias": "first broker login auto link",
          "config": {
            "clientId": "catalyst-pin",
            {{- /*
            G113 Step 5: use the shared named template
            `bp-keycloak.pinBrokerClientSecret` (defined in _helpers.tpl)
            so this realm-config and templates/pin-broker-secret.yaml
            ALWAYS emit the same value — including on first install where
            no K8s Secret exists yet.
            */ -}}
            "clientSecret": {{ include "bp-keycloak.pinBrokerClientSecret" . | quote }},
            "clientAuthMethod": "client_secret_post",
            "authorizationUrl": "https://api.{{ .Values.sovereignFQDN }}/oidc/auth",
            "tokenUrl": "https://api.{{ .Values.sovereignFQDN }}/oidc/token",
            "userInfoUrl": "https://api.{{ .Values.sovereignFQDN }}/oidc/userinfo",
            "jwksUrl": "https://api.{{ .Values.sovereignFQDN }}/oidc/certs",
            "issuer": "https://api.{{ .Values.sovereignFQDN }}",
            "defaultScope": "openid email profile groups",
            "syncMode": "FORCE",
            "validateSignature": "true",
            "useJwksUrl": "true",
            "guiOrder": "1"
          }
        }
      ],
      {{- /*
      Owner is admin-by-default (founder NS-3, #3263).

      Live measurement hw130 (2026-06-12): the deployment owner
      (ownerEmail) lands 1/5 admin — grafana maps to Viewer, gitea /admin
      Forbidden, harbor has no Administration nav — because the
      catalyst-pin broker's `idp-create-user-if-unique` creates the owner
      with ZERO group memberships on first SSO login. The handover-time
      `EnsureUser(email, "sovereign-admins")` (auth_handover.go:244) only
      fires at franchise handover, never on the normal pre-handover PIN
      walk. Every per-app admin mapping already keys on `sovereign-admins`
      (grafana role_attribute_path, gitea --admin-group, harbor
      oidc_admin_group, openbao identity-group alias), so the ONE root
      fix is seeding the owner into that group at bootstrap, here in the
      realm import.

      Why a pre-created user is safe with the broker:
        The catalyst-pin IdP's `first broker login auto link` flow runs
        idp-create-user-if-unique (sees the email already exists → not
        unique) and falls through to idp-auto-link, which — with
        trustEmail=true — links the federated identity to THIS user by
        email match, no prompt, no SMTP. That is exactly the path the
        realm already documents for catalyst-api EnsureUser-created
        users (see the identityProviders comment below). syncMode FORCE
        only re-syncs mapper-driven profile fields; the realm defines no
        IdP group mappers, so the seeded memberships persist across
        logins.

      Why NOT realm defaultGroups: adding /sovereign-admins to
      defaultGroups would make EVERY future federated user (any tenant
      user authenticating into the sovereign realm) a full admin — the
      default stays /sovereign-viewers only.

      keycloak-config-cli reconciles a managed user's group list to
      exactly the listed set on every import run, so /sovereign-viewers
      is listed explicitly (defaultGroups only applies at creation;
      without it here a later re-import would strip viewer membership).
      Fields not listed (federatedIdentities, attributes) are left
      untouched — the broker link survives re-imports.

      Guards: skip when ownerEmail is empty (Catalyst-Zero installs) OR
      lacks "@" — an env provisioned before the SOVEREIGN_OWNER_EMAIL
      substitute-map var existed leaves the literal `${SOVEREIGN_OWNER_EMAIL}`
      in the HR values; the "@" check makes that a no-op instead of a
      junk user. Lowercased: KC stores usernames/emails lowercase and the
      broker matches by lowercase email.
      */ -}}
      {{- $ownerEmail := lower (trim (default "" .Values.sovereignRealm.ownerEmail)) }}
      "users": [
        {{- if and $ownerEmail (contains "@" $ownerEmail) }}
        {
          "username": {{ $ownerEmail | quote }},
          "email": {{ $ownerEmail | quote }},
          "enabled": true,
          "emailVerified": true,
          "groups": [
            "/sovereign-admins",
            "/sovereign-viewers"
          ]
        },
        {{- end }}
        {
          "username": "service-account-catalyst-api-server",
          "enabled": true,
          "serviceAccountClientId": "catalyst-api-server",
          "clientRoles": {
            "realm-management": [
              "impersonation",
              "manage-users",
              "view-users",
              "query-users",
              "manage-realm",
              "view-realm",
              "view-clients",
              "manage-clients"
            ]
          }
        }
      ]
    }
---
{{- /* ── catalyst-kc-sa-credentials Secret ─────────────────────────────────
       Mirrored to catalyst-system by reflector. Keys MUST match the
       secretKeyRef.key values in products/catalyst/chart/templates/
       api-deployment.yaml: addr / realm / client-id / client-secret. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $saSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-keycloak
    catalyst.openova.io/component: catalyst-api-sa-credentials
    {{- with .Values.sovereignFQDN }}
    catalyst.openova.io/sovereign-fqdn: {{ . | quote }}
    {{- end }}
  annotations:
    catalyst.openova.io/comment: |
      catalyst-api-server OIDC client credentials. The client itself is
      created in the sovereign realm by the keycloak-config-cli realm
      import (see ConfigMap above). This Secret carries the same
      client-secret value used in the realm JSON so catalyst-api can
      authenticate to Keycloak via OAuth2 client_credentials grant for
      /auth/handover and impersonation calls.

      First-install: Helm `lookup` returns nothing -> randAlphaNum 32 ->
      both this Secret and the realm JSON share the value (single
      template scope).
      Upgrade: Helm `lookup` returns existing Secret -> re-emits same
      bytes -> realm JSON re-emits same bytes -> no rotation, no drift.
      Operator override: set .Values.catalystApiServerClientSecret in
      cluster overlay to pin a known value (e.g. for sealed-secret
      replication scenarios).
    # Reflector cross-namespace mirror — catalyst-api lives in
    # catalyst-system (bootstrap-kit slot 13) AND bp-sso-bridge's
    # reconciler runs in `sso-bridge` (G117.5c Tier-3 AppRegistration
    # watcher). Both downstream namespaces MUST be in the allow- +
    # auto- whitelists or reflector refuses to copy the source bytes
    # into their stub mirror Secrets. Caught live H18 walk on hw86
    # 2026-06-03: sso-bridge stub stayed empty (DATA: 0), reconciler
    # Pod stuck in CreateContainerConfigError. bp-sso-bridge's stub
    # template platform/sso-bridge/chart/templates/
    # secret-kc-credentials-mirror.yaml carries the corresponding
    # `reflector.v1.k8s.emberstack.com/reflects:
    # keycloak/catalyst-kc-sa-credentials` annotation — extending the
    # source-side whitelist here is the missing other-half. Refs #2744
    # #2856.
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "catalyst-system,sso-bridge"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "catalyst-system,sso-bridge"
type: Opaque
stringData:
  addr: {{ $kcAddr | quote }}
  realm: {{ $realmName | quote }}
  client-id: "catalyst-api-server"
  client-secret: {{ $saSecret | quote }}
---
{{- /* ── catalyst-kc-master-admin-credentials Secret (G117.5-followup #2914, 2026-06-03) ─
       The sovereign-realm catalyst-api-server SA (above) cannot call
       POST /admin/realms because `create-realm` is a master-realm role.
       This Secret carries the bitnami-generated master `admin` user
       credentials (looked up from the bitnami `keycloak` Secret in the
       same ns) so bp-sso-bridge can mint a master-realm token via
       grant_type=password against /realms/master/.../token and create
       per-Org realms. Mirrored to sso-bridge ns via reflector.

       Helm lookup pattern: on first install (Secret not yet present)
       this template emits an empty stringData.master-realm-admin-password
       — the bp-sso-bridge reconciler logs "KC master password unset" and
       sleeps the tick; reflector picks up the bitnami Secret on the
       NEXT reconcile after bp-keycloak Ready and back-fills our Secret
       via the upgrade path. Operator overrides via
       .Values.keycloakAdminPasswordOverride (sealed-secret replication).
*/}}
{{- $masterAdminUser := default "admin" .Values.keycloak.auth.adminUser -}}
{{- $masterAdminPassword := "" -}}
{{- if .Values.keycloakAdminPasswordOverride -}}
  {{- $masterAdminPassword = .Values.keycloakAdminPasswordOverride -}}
{{- else -}}
  {{- /* #4344: source the admin password from the STABLE parent-chart
         `keycloak-admin` Secret (templates/admin-credentials.yaml) that the
         bitnami subchart now reads via keycloak.auth.existingSecret. With
         existingSecret set the subchart no longer creates its own `keycloak`
         Secret, so the legacy bitnami lookup would always miss. Fall back to
         the bitnami `keycloak` Secret for back-compat on any older topology
         where existingSecret was unset and the subchart owned the Secret. */ -}}
  {{- $stableAdmin := lookup "v1" "Secret" .Release.Namespace "keycloak-admin" -}}
  {{- if and $stableAdmin $stableAdmin.data (index $stableAdmin.data "admin-password") -}}
    {{- $masterAdminPassword = index $stableAdmin.data "admin-password" | b64dec -}}
  {{- else -}}
    {{- $bitnamiAdmin := lookup "v1" "Secret" .Release.Namespace "keycloak" -}}
    {{- if and $bitnamiAdmin $bitnamiAdmin.data (index $bitnamiAdmin.data "admin-password") -}}
      {{- $masterAdminPassword = index $bitnamiAdmin.data "admin-password" | b64dec -}}
    {{- end -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: catalyst-kc-master-admin-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-keycloak
    catalyst.openova.io/component: catalyst-master-admin-credentials
  annotations:
    catalyst.openova.io/comment: |
      Master-realm admin credentials used by bp-sso-bridge for the
      POST /admin/realms call in provision_org_realm. Closes #2914.
      First-install: empty until bitnami subchart's admin-password
      Secret reconciles; reflector then back-fills the mirrored stub
      in sso-bridge ns on the next interval.
    # #2937 (2026-06-03): persist Secret across helm uninstall.
    # Without this, helm uninstall + reinstall would clear the
    # cached password, lookup returns nil, reflector copies a NEW
    # value from bitnami's regenerated Secret, and the sovereign
    # realm admin credentials drift. Pattern matches the equivalent
    # defense on bp-openbao recovery-seed and bp-keycloak postgres
    # (memory feedback_chart_credential_persistence_defense).
    helm.sh/resource-policy: keep
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "sso-bridge"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "sso-bridge"
type: Opaque
stringData:
  addr: {{ $kcAddr | quote }}
  master-realm: "master"
  master-realm-admin-user: {{ $masterAdminUser | quote }}
  master-realm-admin-password: {{ $masterAdminPassword | quote }}
{{- end }}
