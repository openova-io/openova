# bp-oidc-gate — the ONE generic OIDC gate (#3374).
#
# Each instances[] entry gates one external app behind oauth2-proxy with
# zero-click Keycloak SSO (sovereign realm, silent via catalyst-pin).
# The chart renders, per instance:
#   - Deployment oidc-gate-<name> (oauth2-proxy, the proven hubble-ui
#     arg set from bp-cilium G117.5 #2744)
#   - Service oidc-gate-<name> (:80 -> :4180)
#   - HTTPRoute owning the instance hostname on the Sovereign gateway
#   - AppRegistration ConfigMap (bp-sso-bridge mints/adopts the KC
#     client + publishes the LIVE secret to OpenBao sso/sovereign/<cid>)
#   - ExternalSecret oidc-gate-<name>-oidc (client-secret AND cookie-secret
#     from the one OpenBao bundle — #5416; the cookie secret used to be a
#     chart-minted per-region Secret, which diverged between regions and
#     made each gate reject the peer region's session cookie)

global:
  # Harbor proxy-cache prefix (kyverno harbor-proxy-pull glob `*/proxy-*/*`
  # is Enforce outside the excluded system namespaces — the bp-cilium
  # hubble proxy only survives on raw quay.io because kube-system is
  # excluded; this chart's namespace is NOT).
  registryMirror: "harbor.openova.io"

# Sovereign FQDN (per-Sovereign overlay; e.g. hw130.omantel.biz).
# REQUIRED for hostname/issuer derivation per Inviolable Principle #4 —
# instances render nothing without it (or an explicit hostname).
sovereignFQDN: ""

# Keycloak realm the gated clients live in.
realm: sovereign

# In-cluster Keycloak base URL the gate pods use for the BACKCHANNEL OIDC
# legs (discovery + token redeem + JWKS + userinfo) — #3844.
#
# WHY: oauth2-proxy does its OIDC discovery (and every backchannel call) at
# `--oidc-issuer-url` by default, which is the PUBLIC issuer
# `https://auth.<fqdn>/realms/<realm>`. On Huawei/kom4dc a Pod cannot dial
# the Sovereign's own public EIP — the EIP is ELB-DNAT'd and does NOT
# hairpin back in (same class as #3241 nodeIPAM EIP-DNAT) — so startup
# discovery times out and the gate NEVER initialises ("error while discovery
# OIDC configuration: dial tcp <eip>:443: i/o timeout" → CrashLoop, hw167).
#
# FIX: dial the in-cluster keycloak Service for the backchannel legs while
# keeping the PUBLIC issuer for the browser-facing auth/redirect URLs and for
# the `iss`-claim validation. bp-keycloak pins KC_HOSTNAME to the public URL
# (keycloak-frontend-env.yaml) so the public issuer matches the token `iss`
# even when the endpoints are fetched internally; the gate uses
# `--skip-oidc-discovery` + explicit `--redeem-url`/`--oidc-jwks-url`
# (internal) and `--login-url` (public). This is the same internal-URL seam
# bp-gitea uses (`sso.keycloakInternalURL`).
#
# Set empty to restore the pre-#3844 public-discovery behavior (non-Catalyst
# installs / clusters where the public issuer DOES hairpin).
keycloakInternalURL: "http://keycloak.keycloak.svc.cluster.local"

image:
  # Rendered as <registryMirror>/<repository>:<tag> — matches the
  # harbor-proxy-pull `*/proxy-*/*` glob.
  repository: proxy-quay/oauth2-proxy/oauth2-proxy
  tag: v7.6.0
  pullPolicy: IfNotPresent

externalSecretStoreName: vault-region1
refreshInterval: 1h

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

# ── Gated app instances ──────────────────────────────────────────────
# instances:
#   - name: openova-flow            # instance name (DNS-safe)
#     enabled: true
#     clientId: openova-flow        # KC client (sovereign realm)
#     hostname: ""                  # default <name>.<sovereignFQDN>
#     upstream: http://openova-flow-server.catalyst-system.svc.cluster.local:80
#     skipJwtBearerTokens: true     # token-bearing machine callers pass
#     skipAuthRoutes: []            # oauth2-proxy --skip-auth-route
#                                   # entries (METHOD=^path-regex)
#     replicas: 1
#     # rootRedirectPath (#3374 Layer-A): for an app that ships its OWN OIDC
#     # (e.g. pda-legacy authlib) — NOT a login-less binary. oauth2-proxy
#     # authenticates the browser at the gate then proxies path-for-path, so a
#     # bare-root hit reaches the app's `/` which 302s to the app's OWN login
#     # FORM (a manual "Sign in with…" button = zero-click FAIL, measured live
#     # hw159). Set this to the app's native OIDC login entrypoint (e.g.
#     # `/oidc/login`) and the gate 302s ONLY the bare root (Exact `/`) there,
#     # so the app starts its own silent KC round-trip and lands signed-in with
#     # zero clicks. Loop-safe: only the Exact bare root is redirected; the
#     # app's login/callback/dashboard paths flow through untouched. Default
#     # unset → no root redirect (byte-identical to a login-less app).
#     rootRedirectPath: ""          # e.g. "/oidc/login"
#     rootRedirectPort: 443         # the Sovereign HTTPS listener port
#     # appNativeCallbackPath (#3741/#3852): the gated app's OWN native-OIDC
#     # callback path. Set ONLY for apps that ship their own OIDC (pda-legacy
#     # authlib = `/oidc/authorized`) and are reached via rootRedirectPath. The
#     # gate 302s the bare root to the app's `/oidc/login`, which fires the
#     # app's NATIVE OIDC flow (the app ignores oauth2-proxy X-Auth-Request-*
#     # headers, so it must session-auth itself); authlib then sends
#     # redirect_uri=https://<host><appNativeCallbackPath>. This path is added
#     # as a SECOND redirectUri on the KC client (alongside the gate's
#     # /oauth2/callback) so KC accepts the app's native hop — without it KC
#     # returns "Invalid parameter: redirect_uri" (hw167 UAT row 3374-11).
#     # Login-less gated apps (openova-flow) leave this unset → only
#     # /oauth2/callback registers (byte-identical to the pre-#3741 shape).
#     appNativeCallbackPath: ""     # e.g. "/oidc/authorized"
#     # spaTokenSeed (#4556): for an app whose SPA gates on a CLIENT-SIDE
#     # bootstrap token EVEN when its daemon API is unauthenticated. The
#     # agenity/chepherd `/app/` SPA shows "Paste the bootstrap token" purely
#     # because localStorage['chepherd-token'] is empty — it never probes the
#     # daemon's auth mode (which runs CHEPHERD_AUTH_MODE=none, so the API is
#     # actually open). The SPA ingests a `?token=` URL param on mount, and
#     # because the daemon is unauthenticated any value is accepted. Setting
#     # this 302s the bare root (Exact `/`), AFTER the gate's full KC SSO, to
#     # `<dashboardPath>?token=<value>` so the SPA seeds localStorage and lands
#     # authenticated with NO paste. value is a SENTINEL (never verified — the
#     # daemon auth is off; it only satisfies the SPA presence-check). Mutually
#     # exclusive with rootRedirectPath. Default unset → no redirect rule. This
#     # is the durable path because the upstream daemon's oidc authMode is a
#     # non-functional scaffold (OIDCProvider.Validate → ErrNotSupported, #128).
#     spaTokenSeed:
#       dashboardPath: "/app/"      # the SPA route that ingests ?token=
#       value: "sso"                # sentinel token (daemon auth is off)
#       port: 443                   # external HTTPS port for the Location header
instances: []
