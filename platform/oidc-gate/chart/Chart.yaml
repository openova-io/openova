apiVersion: v2
name: bp-oidc-gate
# 0.1.0 (#3374, 2026-06-13): the ONE generic OIDC gate. A single reusable
# oauth2-proxy front for external apps that ship NO native OIDC (the law:
# one component, never N bespoke hacks). Per gated app the chart renders an
# instance set: Deployment + Service + HTTPRoute (owning the app's public
# hostname) + cookie-secret (lookup-or-generate, keep) + an AppRegistration
# ConfigMap (bp-sso-bridge 0.2.3+ mints/adopts the Keycloak client in the
# sovereign realm and publishes the LIVE client_secret to OpenBao
# sso/sovereign/<clientId>) + an ExternalSecret consuming it — the exact
# credential topology that fixed hubble-ui in bp-cilium 1.4.1 (#3374),
# generalised. Silent zero-click via kc_idp_hint=catalyst-pin login-url +
# --skip-provider-button, the proven hubble-ui oauth2-proxy arg set
# (G117.5 #2744). Machine paths: per-instance skipAuthRoutes (regex,
# METHOD=^path form) + --skip-jwt-bearer-tokens so token-bearing
# service-to-service callers pass without a browser session.
#
# 0.1.1 (#3374, 2026-06-14): FIX the openova-flow bare-URL 500. The
# minted KC client emitted `aud: [realm-management account]` with no
# self-clientId, so oauth2-proxy's ID-token audience verification
# rejected every callback (oauthproxy.go:888) — the bare URL never landed
# signed-in. client.json now seeds an oidc-audience-mapper injecting the
# clientId into the ID-token aud; bp-sso-bridge PUT (template-wins) lands
# it on the live pre-existing client zero-touch.
#
# 0.1.2 (#3374 Layer-A, 2026-06-17): COVERAGE — the generic gate now
# fronts powerdns-admin (slot 13c), replacing its structurally-fragile
# bespoke root-redirect (the OIDC callback shares /login, so the redirect
# looped + was reverted in pda 0.1.11). No chart-template change: the
# coverage is purely additional `instances:` entries + the per-app chart
# disabling its own HTTPRoute (slot 11a gateway.enabled=false) so the
# gate is the single hostname owner. Adding the gate to a NEW app is now
# one `instances:` entry — proven by the disabled `sso-generality-probe`
# instance in the slot (#3374 DoD box 10a generality proof).
# 0.1.3 (#3374, 2026-06-18): rootRedirectPath — bare-root → app-native
# OIDC login. 0.1.2's gate coverage of powerdns-admin did NOT achieve
# zero-click: oauth2-proxy auths the BROWSER at the gate then proxies
# path-for-path, so a bare-root hit reached PDA's `/`, whose unauth Flask
# session 302s to PDA's `/login` FORM with a manual "Sign in using
# OpenID Connect" button (measured live hw159: bare URL landed on the
# form, zero-click FAIL — a "Sign in with…" button = FAIL per the
# contract). PDA ships its OWN authlib OIDC (unlike the login-less
# openova-flow) and ignores oauth2-proxy's X-Auth-Request-* headers,
# honouring only its own /oidc/login→KC round-trip. New per-instance
# `rootRedirectPath` (+ optional `rootRedirectPort`, default 443): the
# gate's HTTPRoute now 302s ONLY the bare root (Exact `/`) to that path
# (e.g. `/oidc/login`) so the app starts its own SILENT KC round-trip
# (kc_idp_hint=catalyst-pin) and lands signed-in — zero clicks, two
# silent KC hops. Loop-safe (the pda 0.1.11 lesson): only the Exact bare
# root is redirected; the app's login/callback/dashboard paths flow
# through untouched and the post-login lands on /dashboard/, never
# revisiting `/`. Default unset → byte-identical to a login-less gated
# app (openova-flow renders no redirect rule). Slot 13c sets
# rootRedirectPath:/oidc/login on the powerdns-admin instance.
# 0.1.4 (#3741/#3852, 2026-06-19): appNativeCallbackPath — register the
# gated app's OWN native-OIDC callback as a SECOND redirectUri on the KC
# client. 0.1.3 made the bare root 302 to the app's /oidc/login, which
# fires PDA's authlib OIDC flow; authlib sends
# redirect_uri=https://<host>/oidc/authorized. But the AppRegistration
# (and the keycloak realm seed, post-#3741) registered ONLY the gate's own
# /oauth2/callback, so KC rejected that second hop with "Invalid parameter:
# redirect_uri" (measured live hw167, dep 28d4e96f96407bbb, UAT row
# 3374-11 — the gate-level browser auth succeeded but PDA's native hop
# never landed). #3741 had stripped /oidc/authorized on the wrong premise
# the app was "gated, not native-OIDC"; in fact pda-legacy authlib must
# session-auth ITSELF (it ignores oauth2-proxy's X-Auth-Request-* headers),
# so the native callback is load-bearing. New per-instance
# `appNativeCallbackPath`: when set, the AppRegistration client.json adds
# `https://<host><appNativeCallbackPath>` alongside /oauth2/callback. Slot
# 13c sets appNativeCallbackPath:/oidc/authorized on the powerdns-admin
# instance; the keycloak realm seed (bp-keycloak 1.4.34) carries the same
# two URIs so config-cli FULL-managed reconcile keeps the client correct.
# Login-less gated apps (openova-flow) leave it unset → only /oauth2/callback
# registers (byte-identical to the pre-0.1.4 shape).
version: 0.1.4
appVersion: "7.6.0"
description: |
  Catalyst generic OIDC gate — a per-app oauth2-proxy instance set that
  brings login-less external apps under the Sovereign zero-click SSO
  contract (#3374): fresh browser -> bare URL -> Keycloak sovereign
  realm (silent via catalyst-pin) -> signed in. Used for apps with no
  native OIDC support (first consumer: openova-flow); any app can be
  gated by adding an instances[] entry. Client secrets converge with
  Keycloak via bp-sso-bridge AppRegistration + ExternalSecret.
keywords:
  - catalyst
  - sso
  - oauth2-proxy
  - zero-click
sources:
  - https://github.com/openova-io/openova
annotations:
  catalyst.openova.io/blueprint: bp-oidc-gate
  # Catalyst-authored only — no upstream chart dependency (oauth2-proxy is
  # consumed as an image, not a subchart).
  catalyst.openova.io/no-upstream: "true"
  # Default values render nothing by design: instances[] is empty and
  # sovereignFQDN is operator-driven (Inviolable Principle #4 fail-closed).
  # The bootstrap-kit slot 13c supplies both.
  catalyst.openova.io/smoke-render-mode: "default-off"
