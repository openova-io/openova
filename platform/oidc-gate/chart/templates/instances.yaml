{{- /*
bp-oidc-gate per-instance resource set (#3374).

One oauth2-proxy instance per gated app. Arg set mirrors the WALKED
hubble-ui proxy (bp-cilium G117.5 #2744) — keycloak-oidc provider,
skip-provider-button, kc_idp_hint=catalyst-pin login-url for the silent
zero-click chain. Credential topology mirrors the #3374 hubble-ui fix:
the client secret is the LIVE Keycloak value published by bp-sso-bridge
(AppRegistration ConfigMap -> OpenBao sso/<realm>/<clientId> ->
ExternalSecret); the cookie secret is gate-local (lookup-or-generate +
keep — no KC counterpart).

Loop-safety per the pdns-admin 0.1.11 lesson: the gate's own callback
(/oauth2/callback) is SERVED by oauth2-proxy itself, never redirected;
already-authenticated sessions pass straight to the upstream
(idempotent); skipAuthRoutes lets machine paths through untouched.
*/ -}}
{{- $root := . -}}
{{- range $inst := .Values.instances }}
{{- if ne (toString $inst.enabled | default "true") "false" }}
{{- $hostname := include "bp-oidc-gate.instanceHostname" (dict "root" $root "inst" $inst) }}
{{- if $hostname }}
{{- $cid := $inst.clientId | default $inst.name }}
{{- $gateName := printf "oidc-gate-%s" $inst.name }}
{{- $issuer := printf "https://auth.%s/realms/%s" $root.Values.sovereignFQDN $root.Values.realm }}
---
# ── cookie secret (gate-local; lookup-or-generate, survives uninstall) ──
{{- $existing := lookup "v1" "Secret" $root.Release.Namespace (printf "%s-cookie" $gateName) }}
{{- $cookieSecret := "" }}
{{- if $existing }}
{{- $cookieSecret = index $existing.data "cookie-secret" | default "" | b64dec }}
{{- end }}
{{- if not $cookieSecret }}{{- $cookieSecret = randAlphaNum 32 }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-cookie" $gateName | quote }}
  namespace: {{ $root.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "bp-oidc-gate.labels" $root | nindent 4 }}
    catalyst.openova.io/component: {{ $gateName | quote }}
type: Opaque
stringData:
  cookie-secret: {{ $cookieSecret | quote }}
---
# ── AppRegistration — bp-sso-bridge mints/adopts the KC client ─────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-sso-registration" $gateName | quote }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "bp-oidc-gate.labels" $root | nindent 4 }}
    sso.openova.io/app-registration: {{ $cid | quote }}
data:
  realm: {{ $root.Values.realm | quote }}
  client.json: |
    {
      "clientId": {{ $cid | quote }},
      "name": {{ printf "OIDC gate — %s" $inst.name | quote }},
      "enabled": true,
      "publicClient": false,
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      "redirectUris": [
        "https://{{ $hostname }}/oauth2/callback"
      ],
      "webOrigins": [
        "https://{{ $hostname }}"
      ],
      "defaultClientScopes": ["web-origins", "acr", "profile", "roles", "email", "groups"],
      "attributes": {
        "access.token.lifespan": "900"
      }
    }
{{- if $root.Capabilities.APIVersions.Has "external-secrets.io/v1beta1" }}
---
# ── client secret — the LIVE KC value via bp-sso-bridge + OpenBao ──────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-oidc" $gateName | quote }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "bp-oidc-gate.labels" $root | nindent 4 }}
    bp-sso-bridge.openova.io/consumer: bp-oidc-gate
spec:
  refreshInterval: {{ $root.Values.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $root.Values.externalSecretStoreName | default "vault-region1" }}
    kind: ClusterSecretStore
  target:
    name: {{ printf "%s-oidc" $gateName | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        client-secret: "{{ "{{ .client_secret }}" }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: {{ printf "sso/%s/%s" $root.Values.realm $cid | quote }}
        property: client_secret
{{- end }}
---
# ── oauth2-proxy Deployment ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $gateName | quote }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "bp-oidc-gate.labels" $root | nindent 4 }}
    catalyst.openova.io/component: {{ $gateName | quote }}
spec:
  replicas: {{ $inst.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bp-oidc-gate
      catalyst.openova.io/component: {{ $gateName | quote }}
  template:
    metadata:
      labels:
        {{- include "bp-oidc-gate.labels" $root | nindent 8 }}
        catalyst.openova.io/component: {{ $gateName | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: {{ printf "%s/%s:%s" $root.Values.global.registryMirror $root.Values.image.repository $root.Values.image.tag | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args:
            - --http-address=0.0.0.0:4180
            - --provider=keycloak-oidc
            - --oidc-issuer-url={{ $issuer }}
            - --client-id={{ $cid }}
            - --redirect-url=https://{{ $hostname }}/oauth2/callback
            - --upstream={{ $inst.upstream }}
            - --email-domain=*
            - --scope=openid profile email groups
            # Silent zero-click: the realm IDR defaultProvider plus the
            # explicit hint cover both realm-config drift directions
            # (G113 #2725 / G117.5 #2744).
            - --login-url={{ $issuer }}/protocol/openid-connect/auth?kc_idp_hint=catalyst-pin
            - --cookie-secure=true
            - --cookie-name=_oidc_gate_{{ $inst.name | replace "-" "_" }}
            - --skip-provider-button=true
            - --set-xauthrequest=true
            - --reverse-proxy=true
            - --whitelist-domain={{ $hostname }}
            {{- if $inst.skipJwtBearerTokens }}
            # Machine callers presenting a Bearer JWT from the same
            # issuer pass without a browser session.
            - --skip-jwt-bearer-tokens=true
            {{- end }}
            {{- range $route := $inst.skipAuthRoutes }}
            - --skip-auth-route={{ $route }}
            {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-oidc" $gateName | quote }}
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-cookie" $gateName | quote }}
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
---
# ── Service ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ $gateName | quote }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "bp-oidc-gate.labels" $root | nindent 4 }}
    catalyst.openova.io/component: {{ $gateName | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bp-oidc-gate
    catalyst.openova.io/component: {{ $gateName | quote }}
  ports:
    - name: http
      port: 80
      targetPort: 4180
      protocol: TCP
---
# ── HTTPRoute — the gate OWNS the app's public hostname ───────────────
# The gated app's own HTTPRoute must be disabled (two HTTPRoutes on one
# hostname is undefined routing) — e.g. slot 56 flips
# flowServer.httproute.enabled=false when the openova-flow instance is
# active here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $gateName | quote }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "bp-oidc-gate.labels" $root | nindent 4 }}
    catalyst.openova.io/component: {{ $gateName | quote }}
spec:
  parentRefs:
    - name: {{ ($inst.gatewayRef).name | default "cilium-gateway" | quote }}
      namespace: {{ ($inst.gatewayRef).namespace | default "kube-system" | quote }}
  hostnames:
    - {{ $hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $gateName | quote }}
          port: 80
{{- end }}
{{- end }}
{{- end }}
