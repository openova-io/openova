{{- /*
bp-oidc-gate per-instance resource set (#3374).

One oauth2-proxy instance per gated app. Arg set mirrors the WALKED
hubble-ui proxy (bp-cilium G117.5 #2744) — keycloak-oidc provider,
skip-provider-button, kc_idp_hint=catalyst-pin login-url for the silent
zero-click chain. Credential topology mirrors the #3374 hubble-ui fix:
the client secret is the LIVE Keycloak value published by bp-sso-bridge
(AppRegistration ConfigMap -> OpenBao sso/<realm>/<clientId> ->
ExternalSecret); the cookie secret is gate-local (lookup-or-generate +
keep — no KC counterpart).

Loop-safety per the pdns-admin 0.1.11 lesson: the gate's own callback
(/oauth2/callback) is SERVED by oauth2-proxy itself, never redirected;
already-authenticated sessions pass straight to the upstream
(idempotent); skipAuthRoutes lets machine paths through untouched.

Audience contract (0.1.1, #3374): oauth2-proxy's keycloak-oidc provider
VERIFIES the ID token's `aud` claim contains its own --client-id during
the callback code exchange. A vanilla Keycloak confidential client emits
`aud: [realm-management account]` (the user's default role audiences) and
NEVER its own clientId unless the user holds a client role — so the gate
500'd every callback ("audience from claim aud with value
[realm-management account] does not match ... map[openova-flow:{}]",
oauthproxy.go:888). The client.json below therefore seeds an
oidc-audience-mapper that injects <clientId> into the ID token aud (the
netbird realm-config idiom). bp-sso-bridge POSTs client.json verbatim and
shallow-merges template-wins on PUT, so the mapper reaches both freshly
minted and pre-existing clients on the next reconcile tick — zero-touch.
*/ -}}
{{- $root := . -}}
{{- range $inst := .Values.instances }}
{{- if ne (toString $inst.enabled | default "true") "false" }}
{{- $hostname := include "bp-oidc-gate.instanceHostname" (dict "root" $root "inst" $inst) }}
{{- if $hostname }}
{{- $cid := $inst.clientId | default $inst.name }}
{{- $gateName := printf "oidc-gate-%s" $inst.name }}
{{- $issuer := printf "https://auth.%s/realms/%s" $root.Values.sovereignFQDN $root.Values.realm }}
{{- /*
#3844 — backchannel-via-internal-Service. When keycloakInternalURL is set,
the gate SKIPS OIDC discovery (which otherwise dials the public issuer EIP —
unhairpinnable from inside the cluster on Huawei/kom4dc → CrashLoop) and
points the backchannel legs (redeem/jwks/userinfo) at the in-cluster
keycloak Service, keeping `--oidc-issuer-url` + `--login-url` public (browser
leg + `iss` validation). KC_HOSTNAME is pinned public by bp-keycloak so the
public issuer matches the token `iss` even though the doc is fetched
internally. Empty → restore pre-#3844 public-discovery behavior.
*/ -}}
{{- $kcInternal := trimSuffix "/" ($root.Values.keycloakInternalURL | default "") }}
{{- $internalRealm := "" }}
{{- if $kcInternal }}{{- $internalRealm = printf "%s/realms/%s" $kcInternal $root.Values.realm }}{{- end }}
---
# ── cookie secret (gate-local; lookup-or-generate, survives uninstall) ──
{{- $existing := lookup "v1" "Secret" $root.Release.Namespace (printf "%s-cookie" $gateName) }}
{{- $cookieSecret := "" }}
{{- if $existing }}
{{- $cookieSecret = index $existing.data "cookie-secret" | default "" | b64dec }}
{{- end }}
{{- if not $cookieSecret }}{{- $cookieSecret = randAlphaNum 32 }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-cookie" $gateName | quote }}
  namespace: {{ $root.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "bp-oidc-gate.labels" $root | nindent 4 }}
    catalyst.openova.io/component: {{ $gateName | quote }}
type: Opaque
stringData:
  cookie-secret: {{ $cookieSecret | quote }}
---
# ── AppRegistration — bp-sso-bridge mints/adopts the KC client ─────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-sso-registration" $gateName | quote }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "bp-oidc-gate.labels" $root | nindent 4 }}
    sso.openova.io/app-registration: {{ $cid | quote }}
data:
  realm: {{ $root.Values.realm | quote }}
  client.json: |
    {
      "clientId": {{ $cid | quote }},
      "name": {{ printf "OIDC gate — %s" $inst.name | quote }},
      "enabled": true,
      "publicClient": false,
      "standardFlowEnabled": true,
      "directAccessGrantsEnabled": false,
      {{- /*
      #3741/#3852 (hw167 UAT row 3374-11) — TWO callbacks register when the
      gated app ships its OWN native OIDC (appNativeCallbackPath set):
        1. /oauth2/callback — the oauth2-proxy gate's own callback.
        2. <appNativeCallbackPath> — the app's native callback (pda-legacy
           authlib = /oidc/authorized). The gate 302s the bare root to the
           app's /oidc/login (rootRedirectPath); that fires the app's OWN
           OIDC flow (the app ignores oauth2-proxy X-Auth-Request-* headers
           and must session-auth itself), and its authlib sends
           redirect_uri=https://<host><appNativeCallbackPath>. #3741 stripped
           this on the wrong premise the app was 'gated, not native-OIDC' →
           KC 'Invalid parameter: redirect_uri' on the second hop. Login-less
           gated apps (openova-flow) leave appNativeCallbackPath unset → only
           /oauth2/callback registers (byte-identical to the old shape).
      */ -}}
      "redirectUris": [
        "https://{{ $hostname }}/oauth2/callback"{{- if $inst.appNativeCallbackPath }},
        "https://{{ $hostname }}{{ $inst.appNativeCallbackPath }}"{{- end }}
      ],
      "webOrigins": [
        "https://{{ $hostname }}"
      ],
      {{- /*
        #5334 — `roles` DROPPED from the gate clients' default scopes. With it,
        oauth2-proxy's keycloak-oidc provider stuffed the full ~44 realm+client
        role graph into the browser-cookie session → >4 KB → split cookie →
        intermittent "Secured with OAuth2 Proxy" 500 on the proxied callback
        (worst on pdns-admin's double-OIDC flow). The gate does NO group/role
        authorization (no --allowed-groups) and requests no `roles` scope, so
        dropping it shrinks the session to [sovereign-admins sovereign-viewers]
        for EVERY instance (openova-flow/agenity too). `groups` retained. Kept in
        lockstep with the config-cli powerdns-admin client seed.
      */ -}}
      "defaultClientScopes": ["web-origins", "acr", "profile", "email", "groups"],
      "protocolMappers": [
        {
          "name": {{ printf "audience-%s" $cid | quote }},
          "protocol": "openid-connect",
          "protocolMapper": "oidc-audience-mapper",
          "config": {
            "included.client.audience": {{ $cid | quote }},
            "id.token.claim": "true",
            "access.token.claim": "true"
          }
        }
      ],
      "attributes": {
        "access.token.lifespan": "900"
      }
    }
{{- if $root.Capabilities.APIVersions.Has "external-secrets.io/v1beta1" }}
---
# ── client secret — the LIVE KC value via bp-sso-bridge + OpenBao ──────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-oidc" $gateName | quote }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "bp-oidc-gate.labels" $root | nindent 4 }}
    bp-sso-bridge.openova.io/consumer: bp-oidc-gate
spec:
  refreshInterval: {{ $root.Values.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $root.Values.externalSecretStoreName | default "vault-region1" }}
    kind: ClusterSecretStore
  target:
    name: {{ printf "%s-oidc" $gateName | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        client-secret: "{{ "{{ .client_secret }}" }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: {{ printf "sso/%s/%s" $root.Values.realm $cid | quote }}
        property: client_secret
{{- end }}
---
# ── oauth2-proxy Deployment ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $gateName | quote }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "bp-oidc-gate.labels" $root | nindent 4 }}
    catalyst.openova.io/component: {{ $gateName | quote }}
spec:
  replicas: {{ $inst.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bp-oidc-gate
      catalyst.openova.io/component: {{ $gateName | quote }}
  template:
    metadata:
      labels:
        {{- include "bp-oidc-gate.labels" $root | nindent 8 }}
        catalyst.openova.io/component: {{ $gateName | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: {{ printf "%s/%s:%s" $root.Values.global.registryMirror $root.Values.image.repository $root.Values.image.tag | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args:
            - --http-address=0.0.0.0:4180
            - --provider=keycloak-oidc
            # PUBLIC issuer — used for `iss`-claim validation + (when discovery
            # is NOT skipped) the discovery fetch. KC_HOSTNAME is pinned public
            # by bp-keycloak so tokens carry this `iss` even when the backchannel
            # endpoints are dialed in-cluster (#3844).
            - --oidc-issuer-url={{ $issuer }}
            - --client-id={{ $cid }}
            - --redirect-url=https://{{ $hostname }}/oauth2/callback
            - --upstream={{ $inst.upstream }}
            - --email-domain=*
            - --scope=openid profile email groups
{{- if $internalRealm }}
            # #3844 — skip discovery against the public EIP (unhairpinnable
            # from inside the cluster on Huawei/kom4dc → i/o timeout → gate
            # CrashLoop). Backchannel legs dial the in-cluster keycloak Service;
            # the browser-facing --login-url + --redirect-url stay public.
            - --skip-oidc-discovery=true
            - --redeem-url={{ $internalRealm }}/protocol/openid-connect/token
            - --oidc-jwks-url={{ $internalRealm }}/protocol/openid-connect/certs
            - --profile-url={{ $internalRealm }}/protocol/openid-connect/userinfo
{{- end }}
            # Silent zero-click: the realm IDR defaultProvider plus the
            # explicit hint cover both realm-config drift directions
            # (G113 #2725 / G117.5 #2744).
            - --login-url={{ $issuer }}/protocol/openid-connect/auth?kc_idp_hint=catalyst-pin
            - --cookie-secure=true
            - --cookie-name=_oidc_gate_{{ $inst.name | replace "-" "_" }}
            - --skip-provider-button=true
            - --set-xauthrequest=true
            - --reverse-proxy=true
            - --whitelist-domain={{ $hostname }}
            {{- if $inst.skipJwtBearerTokens }}
            # Machine callers presenting a Bearer JWT from the same
            # issuer pass without a browser session.
            - --skip-jwt-bearer-tokens=true
            {{- end }}
            {{- range $route := $inst.skipAuthRoutes }}
            - --skip-auth-route={{ $route }}
            {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-oidc" $gateName | quote }}
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-cookie" $gateName | quote }}
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
---
# ── Service ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ $gateName | quote }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "bp-oidc-gate.labels" $root | nindent 4 }}
    catalyst.openova.io/component: {{ $gateName | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bp-oidc-gate
    catalyst.openova.io/component: {{ $gateName | quote }}
  ports:
    - name: http
      port: 80
      targetPort: 4180
      protocol: TCP
---
# ── HTTPRoute — the gate OWNS the app's public hostname ───────────────
# The gated app's own HTTPRoute must be disabled (two HTTPRoutes on one
# hostname is undefined routing) — e.g. slot 56 flips
# flowServer.httproute.enabled=false when the openova-flow instance is
# active here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $gateName | quote }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "bp-oidc-gate.labels" $root | nindent 4 }}
    catalyst.openova.io/component: {{ $gateName | quote }}
spec:
  parentRefs:
    - name: {{ ($inst.gatewayRef).name | default "cilium-gateway" | quote }}
      namespace: {{ ($inst.gatewayRef).namespace | default "kube-system" | quote }}
  hostnames:
    - {{ $hostname | quote }}
  rules:
{{- if hasKey $inst "spaTokenSeed" }}
{{- /*
#4556 — SPA bootstrap-token SEED (zero-click for a token-paste SPA).

WHY THIS IS NEEDED for an app whose SPA gates on a CLIENT-SIDE token even
when its daemon API is unauthenticated (agenity/chepherd: the daemon runs
CHEPHERD_AUTH_MODE=none so authMiddleware is a no-op and every /api/v1/*
request passes, but the `/app/` SPA — web/src/components/ws/Dashboardws.svelte
in the upstream agenity-org/agenity build — shows "Welcome back / Paste the
bootstrap token chepherd printed at startup" purely because
`localStorage['chepherd-token']` is empty: its mount logic is
`if (getToken()) startLiveLoop(); else needLogin = true;`, with NO probe of
the daemon's auth mode). So even after the gate has done the FULL Keycloak
SSO and the API is open, the User is stuck at a token-paste screen — the
exact #4556 item-3 fault on the agnstar North-Star walk.

The SPA ingests a `?token=` URL query param on mount (Dashboardws L1144-1152:
`new URL(location.href).searchParams.get('token')` → localStorage → strip),
and because the daemon is unauthenticated ANY non-empty token value is
accepted. So the durable zero-click seam is: 302 the bare root to
`<dashboardPath>?token=<value>` AFTER the gate's SSO. Cilium Gateway API
ReplaceFullPath carries the query verbatim (verified live: Location =
`https://<host>/app/?token=<value>`), and oauth2-proxy preserves the
path+query through the KC round-trip in its `state` param, so the User lands
on `/app/?token=<value>`, the SPA seeds localStorage, strips the param, and
renders the workspace authenticated — NO paste.

WHY NOT daemon CHEPHERD_AUTH_MODE=oidc: the upstream OIDCProvider.Validate
(internal/auth/auth.go) is a non-functional scaffold that returns
ErrNotSupported ("oidc validation not yet wired, #128"), AND rs.AuthToken is
set ONLY in local mode (cmd/run.go) — so oidc mode would leave the API open
yet still demand a localStorage token, and 401 if Validate is ever reached.
The token-seed is the only path that works against the shipped upstream
without forking the SPA.

The `value` is a SENTINEL — it is never verified (auth is off on the daemon),
it exists only to make the SPA's presence-check pass. Loop-safe exactly like
rootRedirectPath: only the Exact bare root is redirected; /app/, /_astro/*,
/api/*, /healthz, the WS all fall through to the catch-all backend untouched,
and the post-seed SPA lives at /app/ which never revisits `/`. Mutually
exclusive with rootRedirectPath (an app is EITHER native-OIDC needing a login
redirect OR a token-paste SPA needing a seed). Default unset → no rule
(byte-identical to a login-less gated app).
*/}}
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: {{ $inst.spaTokenSeed.port | default 443 }}
            statusCode: 302
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ printf "%s?token=%s" ($inst.spaTokenSeed.dashboardPath | default "/app/") ($inst.spaTokenSeed.value | default "sso") | quote }}
{{- else if $inst.rootRedirectPath }}
{{- /*
#3374 Layer-A (powerdns-admin) — bare-root → app-native OIDC login path.

WHY THIS IS NEEDED for an app that ships its OWN OIDC (pda-legacy authlib),
not just a login-less binary (openova-flow). oauth2-proxy authenticates the
BROWSER at the gate (zero-click via kc_idp_hint) and then PROXIES path-for-
path to the upstream — it does NOT rewrite `/`. So a bare-root hit reaches
PDA's `/`, which (PDA's Flask session being unauthenticated, separate from
the gate cookie) 302s to PDA's `/login` FORM with a manual "Sign in using
OpenID Connect" button. The operator then sees a login form = the zero-click
contract FAILS (measured live on hw159, #3374). oauth2-proxy's
X-Auth-Request-* headers don't help — pda-legacy's authlib consumes only its
own `/oidc/login`→KC round-trip, never header-asserted identity.

FIX: redirect ONLY the bare root (Exact `/`) to the app's native OIDC login
entrypoint (rootRedirectPath, e.g. `/oidc/login`). The chain then is:
  bare `/` → (gate 302) → `/oidc/login` → (gate proxies, browser already
  gate-authed silently) → PDA `/oidc/login` → KC (silent, kc_idp_hint) →
  PDA `/oidc/authorized` → PDA session → `/login` authed-guard → `/dashboard`.
Two silent KC round-trips, ZERO clicks.

LOOP-SAFE (the pda 0.1.11 lesson, exactly): the redirect fires ONLY on the
Exact bare root; `/oidc/login`, `/oidc/authorized`, `/login` and `/dashboard`
all flow through the catch-all backend untouched, and PDA's post-login lands
on `/dashboard/` which NEVER revisits `/`. An OIDC error degrades to PDA's
visible form, never a redirect loop. Gateway API matches the most-specific
path (Exact `/` here) ahead of the PathPrefix `/` catch-all regardless of
rule order, so this rule wins for the bare root and ONLY the bare root.
Default unset → byte-identical to a login-less gated app (openova-flow).
*/}}
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            port: {{ $inst.rootRedirectPort | default 443 }}
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ $inst.rootRedirectPath | quote }}
            statusCode: 302
{{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $gateName | quote }}
          port: 80
{{- end }}
{{- end }}
{{- end }}
