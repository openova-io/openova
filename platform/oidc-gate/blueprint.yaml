apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-oidc-gate
  labels:
    catalyst.openova.io/section: pts-2-3-per-sovereign-supporting-services
    catalyst.openova.io/tier: catalyst-cp
spec:
  # 0.1.6 (#4556): spaTokenSeed — TRUE zero-click for a token-paste SPA
  # (agenity/chepherd). 302s the bare root, post-SSO, to /app/?token=<sentinel>
  # so the SPA seeds localStorage and lands authenticated with NO paste.
  # 0.1.9 (#5617): the chart ships its own per-instance CiliumNetworkPolicy
  # pair (gateway-ingress + egress with kube-dns / Keycloak backchannel /
  # upstream) instead of relying on bp-plane-isolation leaving the oidc-gate
  # namespace's egress open. Lockstep with platform/oidc-gate/chart +
  # the bootstrap-kit slot 13c pin.
  version: 0.1.9
  card:
    title: oidc-gate
    summary: |
      The ONE generic OIDC gate (#3374). A per-app oauth2-proxy instance
      set that brings login-less external apps under the Sovereign
      zero-click SSO contract: fresh browser -> bare URL -> Keycloak
      sovereign realm (silent via catalyst-pin) -> signed in. Client
      secrets converge with Keycloak via bp-sso-bridge AppRegistration
      ConfigMaps + ExternalSecrets. First gated instance: openova-flow.
      Mandatory infra — auto-installed by the bootstrap-kit (slot 13c).
  visibility: unlisted              # mandatory infra
  manifests:
    chart: ./chart
  depends:
    - bp-cilium
    - bp-keycloak
    - bp-external-secrets-stores

  # ── Topology declaration ────────────────────────────────────────────
  # Stateless reverse-proxy instances; cookie secret is per-cluster
  # local. Per-cluster active; switchover is bp-continuum DNS flip.
  topology:
    supported:
      - active-passive
      - singleton
    defaults:
      multi-region: active-passive
      single-region: singleton
    perTopology:
      # Stateless oauth2-proxy instance set — no PG, no PVC, no
      # StatefulSet. The per-cluster cookie secret is local; nothing
      # cross-region to replicate (replication.backend: none). Failover
      # is a bp-continuum DNS flip of the gated app's hostname to the
      # mgmt-B instance, identical to the bp-sso-bridge peer. Completes
      # the contract the topology declaration owed (#3375 DoD-3): an
      # HA-supported topology must carry a populated perTopology block.
      active-passive:
        replication:
          backend: none
          mode: none
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: mgmt
          clusters: [mgmt-A, mgmt-B]
          roles:
            mgmt-A: active
            mgmt-B: passive
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
