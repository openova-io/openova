apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-vllm
  labels:
    catalyst.openova.io/category: ai-runtime
    catalyst.openova.io/section: pts-4-6-llm-serving
spec:
  version: 1.0.1
  card:
    title: vLLM
    summary: High-throughput LLM inference engine with PagedAttention. OpenAI-compatible API. GPU-accelerated when nvidia.com/gpu is available; CPU fallback for non-GPU dev Sovereigns.
    icon: vllm.svg
    category: ai-runtime
    tags: [llm, inference, openai-compatible, gpu, ai]
    documentation: https://docs.vllm.ai/
    license: Apache-2.0
  visibility: listed
  owner:
    team: ai-platform
    contact: ai-platform@openova.io
  configSchema:
    type: object
    properties:
      model:
        type: string
        default: "meta-llama/Llama-3.1-8B-Instruct"
        description: HuggingFace model ID or in-cluster path served by vLLM.
      replicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 16
      gpu:
        type: object
        properties:
          enabled:
            type: boolean
            default: false
            description: Set true on a GPU-equipped Sovereign. When false, vLLM runs on CPU (dev only — not for production traffic).
          count:
            type: integer
            default: 1
            description: Number of `nvidia.com/gpu` units to request when gpu.enabled=true.
      maxModelLen:
        type: integer
        default: 8192
        description: Maximum context length passed to vLLM via --max-model-len.
      gpuMemoryUtilization:
        type: number
        default: 0.9
        description: Fraction of GPU memory vLLM may use (--gpu-memory-utilization).
  placementSchema:
    modes: [single-region, active-active]
    default: single-region
  # ── #3373: class-level placement SUGGESTION + allow-list ────────────────
  # Placement is an INSTANCE property (Application.spec.placement); this is
  # only the default every instance inherits silently — the provisioning
  # journey's generic advanced selector (and a direct Git edit of the
  # instance's spec.placement) may override it within allowedPlacements.
  # Founder §4 table target: rtz. Single render mechanism: the Flux
  # spec.kubeConfig.secretRef pivot — zero per-app placement code.
  defaultPlacement:
    vcluster: rtz
  allowedPlacements: [host, rtz]

  manifests:
    chart: ./chart
  depends:
    - blueprint: bp-kserve
      version: ^1.0
      alias: kserve
  upgrades:
    from: ["0.x"]
  observability:
    metrics: prometheus
    logs: stdout
  # ── G117.1 (Wave-1/B3) — topology + endpoints + sso + multiInstance ──
  topology:
    supported:
    - active-active
    - singleton
    defaults:
      multi-region: active-active
      single-region: singleton
    perTopology:
      active-active:
        replication:
          backend: none
          mode: none
        switchover:
          mechanism: none
        placement:
          tier: rtz
          clusters:
          - rtz-A
          - rtz-B
          roles:
            rtz-A: active
            rtz-B: active
      singleton:
        placement:
          tier: rtz
          clusters:
          - rtz-A
          roles:
            rtz-A: singleton
  endpoints:
  - name: ui
    hostnameTemplate: vllm.{{.OrgDomain}}
    port: 443
    protocol: https
    tls: true
    visibility: public
    launchDefault: true
    ssoEnabled: true
  sso:
    realm: '{{.OrgSlug}}'
    protocolMapper: oidc
    groupsClaim: groups
    rolesFromGroup:
      sovereign-admins: admin
    silentLogin: true
  multiInstance:
    enabled: true
    maxPerOrg: 10
    namingTemplate: '{{.AppName}}-{{.InstanceID}}'
    isolationLevel: namespace
  # ── /G117.1 ──
