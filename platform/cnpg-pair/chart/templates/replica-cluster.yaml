{{- /*
Replica CNPG Cluster CR.

CNPG's "replica cluster" pattern (`replica.enabled: true` +
`bootstrap.pg_basebackup` + `externalClusters[]`) lets a Cluster CR
follow a remote primary's WAL stream while staying a regular CNPG
Cluster locally. The replica cannot be written to until promoted;
promotion is done by Continuum K-Cont-2 via a CNPG
`cnpg.io/cluster.replicaCluster` annotation flip + the operator's
switchover routine.

Replication source-discovery: the replica resolves the primary via
the Cilium ClusterMesh-shared Service exposed by the primary Cluster
CR's `spec.managed.services.additional[]` entry (since chart 0.1.1).
The `service.cilium.io/global: "true"` annotation on that Service
makes it visible across every connected mesh peer; ClusterMesh's
local-affinity routing falls through to the remote region because
the replica region has zero local backends matching the selector.
THIS IS THE replication source-of-truth — see DESIGN.md "replica
source discovery".

History: chart 0.1.0 carried a standalone `service-replication.yaml`
template that pre-created the Service; CNPG refused to reconcile
("not owned by the cluster") and the primary Cluster phase stuck at
"Unable to create required cluster objects". Phase-2 multi-region
incident #3 (qa-loop-state/incidents.md, 2026-05-09).

Side-gating (chart 0.2.0): this CR renders ONLY on side=replica — it
must be APPLIED ON cluster-B (the replica region's own cluster), where
its region-B node-affinity matches the local nodes. Chart ≤0.1.x
rendered it on the primary cluster and the CR could never schedule
(hw126: FailedScheduling 0/4 nodes). The pg_basebackup +
externalClusters design below is precisely CNPG's separate-cluster
replica pattern; only the apply TARGET was wrong.
*/ -}}
{{- if and .Values.cnpgPair.enabled (include "cnpg-pair.isReplicaSide" .) }}
{{- include "cnpg-pair.validateRegions" . }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "cnpg-pair.replicaName" . }}
  labels:
    {{- include "cnpg-pair.labels" . | nindent 4 }}
    openova.io/cnpg-role: replica
    openova.io/region: {{ .Values.cnpgPair.replica.region | quote }}
    catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
  annotations:
    catalyst.openova.io/blueprint: bp-cnpg-pair
    catalyst.openova.io/cnpg-pair-role: replica
    catalyst.openova.io/cnpg-pair-name: {{ include "cnpg-pair.fullname" . | quote }}
spec:
  instances: {{ .Values.cnpgPair.replica.instances }}
  imageName: {{ include "cnpg-pair.imageRef" . | quote }}

  storage:
    size: {{ .Values.cnpgPair.replica.storage.size | quote }}
    {{- with .Values.cnpgPair.replica.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}

  resources:
    {{- toYaml .Values.cnpgPair.replica.resources | nindent 4 }}

  # ── Shared client CA (#5245) ──────────────────────────────────────
  # Pin this cluster's CLIENT CA to the primary cluster's CA Secret
  # (already synced cluster-A → cluster-B at the post-mesh flip, with
  # ca.crt + ca.key — live-verified hw275). CNPG then issues THIS
  # cluster's `<replica>-replication` streaming_replica leaf from that
  # CA (cluster_pki.go: a BYO clientCASecret carrying ca.key generates
  # the replication leaf when replicationTLSSecret is unset), so every
  # local consumer (failover-readiness + the promoter signals) keeps
  # mounting `<replica>-replication` unchanged — AND region-A's own
  # `-primary-replication` cert (same CA) now authenticates here too.
  # That reverse-direction auth is what the #5245 failback rides:
  # the demoted region-A streams FROM this cluster (post-promote)
  # presenting the only client cert cluster-A natively holds. Server
  # certs are untouched — but NOTE (0.2.20, hw278 live-proof):
  # sslmode=require skips server-chain verification ONLY when no
  # sslRootCert is supplied; libpq/pgx upgrade `require` to verify-ca
  # semantics the moment a root cert IS provided. The forward stream
  # below carries sslRootCert=-primary-ca and verifies fine (that CA
  # signs region-A's server leafs); the failback stream
  # (primary-cluster.yaml demoted shape) carries NO root cert, because
  # THIS cluster's server chain is signed by its own `-replica-ca`,
  # which cluster-A does not hold.
  certificates:
    clientCASecret: {{ include "cnpg-pair.fullname" . }}-primary-ca

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: openova.io/region
                operator: In
                values: [{{ .Values.cnpgPair.replica.region | quote }}]
    podAntiAffinityType: required

  # ── Replica-cluster mode ─────────────────────────────────────────
  # `replica.enabled: true` configures this Cluster as a CNPG replica
  # cluster: instances bootstrap via streaming replication from the
  # named externalCluster source. Continuum K-Cont-2's switchover
  # path promotes this CR by flipping it to `replica.enabled: false`.
  #
  # #5125 Defect-1 (DR durability): `enabled` is DRIVEN BY THE
  # `replica.promoted` VALUE, not a live-object patch. Region-kill
  # failover must patch the region-B HelmRelease DESIRED state
  # (`spec.values.cnpgPair.replica.promoted: true`), NOT `kubectl patch`
  # this live Cluster CR. A live-object patch is REVERTED by flux
  # drift-correction mid-outage — on hw256 G12 (2026-07-15, T0+2m07s,
  # region-a still SHUTOFF) helm-controller ran "correct cluster drift"
  # on bp-cnpg-pair and reset `replica.enabled` back to `true`, silently
  # re-demoting the promoted survivor to read-only against a dead source.
  # Driving promotion through the HR value makes the failed-over state the
  # DESIRED state, so drift-correction RE-AFFIRMS the promotion instead of
  # undoing it. Default `promoted: false` ⇒ `enabled: true` (normal
  # replica); a missing value is also treated as replica (backward-safe).
  replica:
    enabled: {{ not (.Values.cnpgPair.replica.promoted | default false) }}
    source: {{ include "cnpg-pair.fullname" . }}-primary

  # ── Bootstrap from primary ──────────────────────────────────────
  # CNPG REQUIRES an explicit bootstrap stanza on a replica Cluster:
  # `replica.enabled: true` alone leaves the Cluster phase stuck at
  # "Setting up primary" (caught live on omantel-hel 2026-05-09,
  # Phase-2 incident #3 in qa-loop-state/incidents.md). The
  # `pg_basebackup` source pulls the initial heap from the named
  # externalCluster (resolved via the ClusterMesh-global `-mesh`
  # Service exposed by the primary's `spec.managed.services.additional`
  # entry), then the replica streams WAL continuously over the same
  # connection.  `database` + `owner` MUST match the primary's
  # bootstrap.initdb — they identify the seed database the replica
  # considers "owned".
  bootstrap:
    pg_basebackup:
      source: {{ include "cnpg-pair.fullname" . }}-primary
      database: {{ .Values.cnpgPair.primary.bootstrap.database | quote }}
      owner:    {{ .Values.cnpgPair.primary.bootstrap.owner | quote }}

  externalClusters:
    - name: {{ include "cnpg-pair.fullname" . }}-primary
      connectionParameters:
        # Cilium ClusterMesh-global Service alias — managed by CNPG
        # via the primary Cluster's `spec.managed.services.additional`
        # entry (selectorType: r, name: <name>-mesh, annotated
        # service.cilium.io/global: "true"). The hostname resolves
        # locally and ClusterMesh's affinity routing reaches the
        # primary region's read-replica endpoint over the private
        # mesh; since the replica region has zero local backends
        # matching the selector, traffic crosses to the primary.
        host: {{ include "cnpg-pair.replicationServiceName" . }}
        port: "5432"
        user: streaming_replica
        sslmode: require
        # Application database — bootstrap will pull WAL via
        # `replication=true` regardless, but `dbname` is required
        # for the connection-string parser.
        dbname: {{ .Values.cnpgPair.primary.bootstrap.database | quote }}
      # streaming_replica auth: CNPG provisions a TLS client cert for
      # the streaming_replica role on every Cluster CR; the replica
      # mounts it from the primary's `-replication` Secret. ESO/External-
      # Secrets sync this Secret across clusters in production; in the
      # in-cluster test path the secret is reflected via the
      # bp-reflector annotation set in the per-Sovereign overlay.
      sslKey:
        name: {{ include "cnpg-pair.fullname" . }}-primary-replication
        key: tls.key
      sslCert:
        name: {{ include "cnpg-pair.fullname" . }}-primary-replication
        key: tls.crt
      sslRootCert:
        name: {{ include "cnpg-pair.fullname" . }}-primary-ca
        key: ca.crt

  # ── Reverse-direction replication Service (#5245) ─────────────────
  # Publish THIS cluster's writable endpoint across the mesh as
  # `<fullname>-replica-mesh` — the exact mirror of the primary side's
  # `-primary-mesh` (CNPG-managed additional Service, selectorType rw,
  # Cilium-global). Pre-promote this tracks the designated primary (a
  # standby — no consumers); POST-PROMOTE it is the writable survivor
  # region-A's failback rides: the failback actor's peer probe and the
  # demoted region-A's externalCluster both resolve this name (the
  # side=primary local stub in peer-mesh-service.yaml completes the
  # by-name global-service merge). CNPG re-points `rw` at whatever
  # instance is current, so the alias tracks promotion/demotion with
  # no chart change (#3740 idiom).
  {{- if .Values.cnpgPair.clusterMesh.enabled }}
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: {{ include "cnpg-pair.peerReplicationServiceName" . }}
              labels:
                {{- include "cnpg-pair.labels" . | nindent 16 }}
                catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
                catalyst.openova.io/role: failback-source
              annotations:
                service.cilium.io/global: "true"
                service.cilium.io/affinity: {{ .Values.cnpgPair.clusterMesh.affinity | quote }}
                catalyst.openova.io/blueprint: bp-cnpg-pair
            spec:
              type: ClusterIP
              ports:
                - name: postgres
                  port: 5432
                  targetPort: 5432
                  protocol: TCP
  {{- end }}

  # `hot_standby` is intentionally OMITTED — see primary-cluster.yaml
  # for the rationale. PostgreSQL 16 hard-pins it to `on` for any
  # Cluster running with `replica.enabled: true`, and CNPG rejects
  # the explicit set with phase "Unable to create required cluster
  # objects". Caught live on omantel-hel 2026-05-09.
  postgresql:
    parameters:
      max_wal_senders: "10"
      max_replication_slots: "10"
      wal_level: "logical"

  enableSuperuserAccess: false
{{- end }}
