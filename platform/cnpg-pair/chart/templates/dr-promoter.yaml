{{- /*
Region-B DR auto-promoter (#5137 — chart 0.2.13).

WHY THIS EXISTS
---------------
hw261 region-kill G12 (2026-07-16) proved the DR ORCHESTRATOR was
single-region: the Continuum controller + its `dr` CR live on region-A
(bp-continuum slot 62 is SECONDARY_HR_SUSPEND'ed; the Continuum CRD
ships in bp-catalyst-platform slot 13, ALSO suspended on secondaries),
so a real region-kill takes the orchestrator down WITH the region it
must fail away from. failover-readiness correctly said "promotable"
(1/1, #5133) but NO ACTOR acted on it — the operator promoted by hand.

This Deployment is the region-B actor that survives the loss of
region-A. It is rendered ONLY on side=replica (the same split-side
gating as failover-readiness), so it runs ON cluster-B with zero
dependency on anything in region-A.

WHY A DEPLOYMENT, NOT A CronJob (#5157 — proven hw263→hw264)
------------------------------------------------------------
A region-local actor that must run DURING a region outage is a
continuous Deployment loop: a CronJob's scheduler is the (regional)
control plane and does not reliably resume after recovery (openbao
stayed SEALED 40+ min on hw263). Same delivery wrapper as the
openbao-unseal-reconciler.

WHY IT PATCHES THE HELMRELEASE, NEVER THE LIVE Cluster CR (#5125-D1)
--------------------------------------------------------------------
On hw256 G12 a live `kubectl patch spec.replica.enabled=false` was
REVERTED by flux drift-correction at T0+2m07s, silently re-demoting
the promoted survivor mid-outage. bp-cnpg-pair ≥0.2.12 drives
`replica.enabled` from the `cnpgPair.replica.promoted` VALUE, so the
promoter flips the region-B HelmRelease DESIRED state
(`spec.values.cnpgPair.replica.promoted: true`) — helm-controller then
renders `replica.enabled:false` and CNPG promotes. This is
byte-identical to the RUNBOOKS §6.1 operator command; the
operator-manual path keeps working (the actor no-ops when already
promoted).

DURABILITY — the SUSPEND latch (#5178 Defect-B)
-----------------------------------------------
The 0.2.13 header CLAIMED the HR-value patch was durable ("field-manager
keeps ownership of a field git never claims"). hw266 G12 DISPROVED it:
`spec.values` on a HelmRelease is an ATOMIC RawExtension, wholly owned by
the flux Kustomization (kustomize-controller) that applies slot 16b. Its
next SSA re-apply reclaims `spec.values` and DROPS the promoter's nested
`promoted` key → helm re-renders `replica.enabled:true` → CNPG re-demotes.
The demoted survivor then fails to re-stream (its timeline has advanced),
the promoter sees "receiver down" again and re-promotes → the timeline
runs away (hw266: TL2→TL25), permanently breaking replication.

So the actor makes the promotion durable by SUSPENDING the HR
(`spec.suspend: true`) once helm has rendered the promotion. `spec.suspend`
is NOT in slot 16b's manifest, so kustomize-controller does not own it and
its drift-correction cannot remove it; a suspended HR freezes helm-
controller, so even after kustomize reverts the atomic `spec.values` the
promoted release is NOT re-rendered and the survivor stays writable. The
operator un-suspends after re-cloning the stale side (RUNBOOKS §6.1).

HOW IT DECIDES (region-B-local signals + a POSITIVE region-A probe)
-------------------------------------------------------------------
1. PRIMARY LOSS — `signals` container (postgres image, the same
   streaming_replica client-cert auth as failover-readiness #5133).
   #5178 Defect-A: a stalled LOCAL `pg_stat_wal_receiver` is NOT proof
   region-A died — a healthy replica is legitimately non-`streaming` for
   long stretches during catchup / receiver `starting`/`waiting`/restart /
   a cross-region blip. So the container arms the promote clock ONLY when
   BOTH hold: (a) the LOCAL WAL receiver is ABSENT (no row at all — the
   `catchup`/`starting`/`waiting` alive states do NOT count as down), AND
   (b) a DIRECT pg_isready of the region-A primary over the ClusterMesh
   (`-primary-mesh`:5432 — the exact endpoint the replica streams from)
   returns "no response". region-A REACHABLE + local stream stalled ⇒
   replication fault ⇒ log + DO NOT promote. A STARTUP GRACE
   (`startupGraceSeconds`) additionally holds the clock clear while a
   fresh replica finishes its first catchup. The clock must then hold
   CONTINUOUSLY for `autoPromote.primaryDownHoldSeconds` (120s).
   FAIL-SAFE: if no cross-region liveness path is wired (clusterMesh off
   or crossRegionPeerClusters empty) the actor observes but NEVER
   promotes — there is no way to positively prove region-A is gone.
2. PROMOTABILITY — the failover-readiness Pod's Ready condition
   (the #5133 LSN apply==receive signal): the standby has APPLIED
   everything it RECEIVED.
3. ANTI-FLAP — the actor never re-promotes a cluster that has ALREADY
   diverged (left the source timeline), and once promoted it latches
   (suspend) so it can neither re-demote nor re-promote (#5178).

STEADY-STATE ARM GATE + TIMELINE-DIVERGENCE SURFACING (#5220)
------------------------------------------------------------
hw273 G12 exposed a FALSE-POSITIVE promotion: on a fresh, still-
converging pair the primary restart-stormed (clean exit 0 ×5) and the
cross-region WAL stream + region-b→region-a mesh reach both dropped for
>120s while region-A stayed ALIVE on timeline 1. Every liveness signal
the promoter has (the cnpg WAL stream, the pg_isready of `-primary-mesh`)
rides the SAME region-b→region-a datapath, so a link flap is
indistinguishable from a real death over that link — the pg_isready gate
alone could not veto it. The #5178 startup grace (a fixed timer from pod
start) did not help either: the restart-storm hit AFTER the grace window.

(A) ARM GATE — the promoter is INELIGIBLE to promote until the signals
    container has OBSERVED region-b's replica actively STREAMING from
    region-A (a live walreceiver row + a set receive-LSN — the #5239
    non-privileged streaming signal, since `streaming_replica` cannot
    read the privileged pg_stat_wal_receiver.status column) CONTINUOUSLY
    for `steadyStateArmSeconds`. Until that steady-state is reached the actor
    REFUSES every promote (a region-A-down signal before the first stable
    stream is a convergence-time transient, never a real kill). Once
    armed it STAYS armed for the pod's life — a real death AFTER
    steady-state promotes normally. This kills the hw273 class at the
    source: a pair that never streamed cannot promote.
(B) TIMELINE-DIVERGENCE SURFACING — a standby that can NEVER re-stream
    from a REACHABLE region-A (it left the source timeline in a prior
    promotion: "highest timeline N of the primary is behind recovery
    timeline N+1") is recorded ONCE on the HR (dr-timeline-diverged-at)
    and logged loudly, so the wedge is DIAGNOSED + monitored instead of a
    silent FATAL loop. The re-clone stays the operator's RUNBOOKS §6.1
    action (NON-destructive here): a 2-node actor cannot prove WHICH side
    is authoritative, so auto-destroying region-b's PGDATA could lose a
    real survivor's committed writes — a worse failure than the wedge.
    #5219's durable suspend latch is UNCHANGED — with (A) the promoter
    only ever latches a promotion decided AFTER steady-state, so it can
    no longer cement a convergence-time false positive.

ANTI-SPLIT-BRAIN — why acting on a region-local signal is data-safe
-------------------------------------------------------------------
The pair runs synchronous replication (remote_apply + FIRST 1 pinned
to the cross-region replica + dataDurability:required — #3740). That
gives a structural data fence with NO third-site witness:
  - During the outage/partition, the region-A primary CANNOT COMMIT
    (its only synchronous standby is unreachable) — so there is
    nothing committed on A that B does not already have (RPO=0), and
    a mere partition (A alive, mesh dead) cannot diverge committed
    data either.
  - After region-A recovers, its old primary still cannot durably
    commit: the promoted region-B replica has left the timeline, the
    walsender connection is rejected, and FIRST 1 stays unsatisfied —
    the stale side is write-fenced until the operator re-clones it
    (RUNBOOKS §6.1 step 5 / #5125 Defect-2).
For this reason the promoter renders ONLY when replication.mode=sync
(see cnpg-pair.autoPromoteActive) — async mode has no fence.

The k8s-lease witness cannot arbitrate here: a coordination.k8s.io
Lease lives in ONE cluster's apiserver, and a 2-region Sovereign is
two SEPARATE clusters — each side would trivially hold "its own"
lease. The sync-rep data fence is the arbiter that actually holds
during a region-kill. (A future 3rd-site witness generalizes this;
tracked on #5137.)
*/ -}}
{{- if (include "cnpg-pair.autoPromoteActive" .) }}
{{- $ap := .Values.cnpgPair.replica.autoPromote }}
{{- $hr := $ap.hr | default dict }}
{{- $hrName := $hr.name | default "bp-cnpg-pair" }}
{{- $hrNamespace := $hr.namespace | default "flux-system" }}
{{- $kimg := $ap.kubectlImage | default dict }}
{{- $krepo := $kimg.repository | default "harbor.openova.io/proxy-dockerhub/alpine/k8s" }}
{{- $ktag := $kimg.tag | default "1.30.0" }}
{{- $kpull := $kimg.pullPolicy | default "IfNotPresent" }}
{{- $interval := $ap.intervalSeconds | default 10 }}
{{- $hold := $ap.primaryDownHoldSeconds | default 120 }}
{{- $startupGrace := $ap.startupGraceSeconds | default 300 }}
{{- $probeTimeout := $ap.livenessProbeTimeoutSeconds | default 5 }}
{{- $renderWait := $ap.promoteRenderWaitSeconds | default 90 }}
{{- /* #5220 (A) — the continuous-streaming steady-state the signals container
       must OBSERVE before the actor is EVER eligible to promote (kills the
       hw273 convergence-time false positive). #5220 (B) — how long a standby
       must be unable to re-stream from a REACHABLE region-A before the wedge
       is flagged as a timeline divergence. */ -}}
{{- $armSeconds := $ap.steadyStateArmSeconds | default 180 }}
{{- $tlDivergeHold := $ap.timelineDivergenceHoldSeconds | default 300 }}
{{- $peerClusters := .Values.cnpgPair.networkPolicy.crossRegionPeerClusters | default list }}
{{- /* #5178 — the region-A liveness gate is meaningful ONLY when the mesh
       egress to region-A can actually be wired: clusterMesh on AND at least
       one peer ClusterMesh name. Without it the actor observes but NEVER
       promotes (fail-safe), because it has no way to POSITIVELY prove
       region-A is gone. */ -}}
{{- $livenessEnabled := and .Values.cnpgPair.clusterMesh.enabled (gt (len $peerClusters) 0) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cnpg-pair.fullname" . }}-dr-promoter
  labels:
    {{- include "cnpg-pair.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
    catalyst.openova.io/role: dr-promoter
---
# Local-namespace reads: failover-readiness Pod Ready condition + the
# replica Cluster CR's replica.enabled state.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cnpg-pair.fullname" . }}-dr-promoter
  labels:
    {{- include "cnpg-pair.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get]
    resourceNames: [{{ include "cnpg-pair.replicaName" . }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cnpg-pair.fullname" . }}-dr-promoter
  labels:
    {{- include "cnpg-pair.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cnpg-pair.fullname" . }}-dr-promoter
subjects:
  - kind: ServiceAccount
    name: {{ include "cnpg-pair.fullname" . }}-dr-promoter
    namespace: {{ .Release.Namespace }}
---
# The promotion surface: get (idempotence + suspend-state read) + patch
# (merge-patch of spec.values.cnpgPair.replica.promoted AND, for the #5178
# durable latch, spec.suspend) on EXACTLY the bp-cnpg-pair HelmRelease —
# resourceNames-pinned, no list/create/delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cnpg-pair.fullname" . }}-dr-promoter
  namespace: {{ $hrNamespace }}
  labels:
    {{- include "cnpg-pair.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
rules:
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, patch]
    resourceNames: [{{ $hrName }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cnpg-pair.fullname" . }}-dr-promoter
  namespace: {{ $hrNamespace }}
  labels:
    {{- include "cnpg-pair.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cnpg-pair.fullname" . }}-dr-promoter
subjects:
  - kind: ServiceAccount
    name: {{ include "cnpg-pair.fullname" . }}-dr-promoter
    namespace: {{ .Release.Namespace }}
---
# Egress for the promoter Pod. The kube-apiserver is a reserved Cilium
# entity a vanilla k8s NetworkPolicy cannot express (#4428 idiom — under
# kube-proxy-replacement the apiserver VIP resolves to the reserved
# `kube-apiserver` identity, which is neither a pod nor `world`), so the
# whole egress allow-list lives in ONE CiliumNetworkPolicy: apiserver
# (kubectl) + kube-dns (service-name resolution) + the replica cluster's
# 5432 (the signals psql) + (#5178) the region-A primary's 5432 across the
# ClusterMesh (the signals pg_isready liveness probe). Everything else
# stays denied.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "cnpg-pair.fullname" . }}-dr-promoter-egress
  labels:
    {{- include "cnpg-pair.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
spec:
  endpointSelector:
    matchLabels:
      catalyst.openova.io/role: dr-promoter
      catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . }}
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ include "cnpg-pair.replicaName" . }}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
{{- if $livenessEnabled }}
    # #5178 region-A liveness probe path — the signals container pg_isready's
    # the region-A primary over the mesh (the SAME `-primary-mesh`:5432 the
    # replica streams from) to POSITIVELY confirm region-A is gone before
    # arming the promote clock. Cross-region ClusterMesh endpoints carry
    # their OWN pod identity; a plain local `toEndpoints` is implicitly ANDed
    # with the LOCAL cluster (Cilium `io.cilium.k8s.policy.cluster=<local>`)
    # and never matches the remote primary (#4846), so admit the peer
    # cluster(s) by identity. EMPTY crossRegionPeerClusters (or clusterMesh
    # off) → this rule is absent AND $livenessEnabled=false → the actor
    # fail-safes to observe-only (never promotes).
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ include "cnpg-pair.primaryName" . }}
          matchExpressions:
            - key: io.cilium.k8s.policy.cluster
              operator: In
              values:
                {{- range $peerClusters }}
                - {{ . | quote }}
                {{- end }}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cnpg-pair.fullname" . }}-dr-promoter
  labels:
    {{- include "cnpg-pair.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
    catalyst.openova.io/role: dr-promoter
  annotations:
    catalyst.openova.io/blueprint: bp-cnpg-pair
spec:
  replicas: 1
  # Single actor; never two promotion loops at once (#5157 shape).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cnpg-pair.selectorLabels" . | nindent 6 }}
      catalyst.openova.io/role: dr-promoter
  template:
    metadata:
      labels:
        {{- include "cnpg-pair.selectorLabels" . | nindent 8 }}
        catalyst.openova.io/role: dr-promoter
        catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
        # kyverno cilium-l7-mtls (Enforce) — required on the Pod
        # template or the Deployment is DENIED at admission (#3238).
        policy.cilium.io/enforced: "true"
    spec:
      # The actor runs in the replica region — the half that survives a
      # region-A kill (same pin as failover-readiness).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: openova.io/region
                    operator: In
                    values: [{{ .Values.cnpgPair.replica.region | quote }}]
      serviceAccountName: {{ include "cnpg-pair.fullname" . }}-dr-promoter
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        # ── signals — PRIMARY-LOSS detector (#5178 liveness-gated) ────
        # psql (streaming_replica client cert, the #5133 auth pattern)
        # against the LOCAL replica `-rw` for pg_stat_wal_receiver state,
        # PLUS a POSITIVE region-A liveness probe (pg_isready of the
        # `-primary-mesh` endpoint over the ClusterMesh). The promote
        # clock (epoch-in-file) is armed ONLY when the LOCAL WAL receiver
        # is ABSENT (`catchup`/`starting`/`waiting`/streaming all count as
        # ALIVE) AND region-A is genuinely UNREACHABLE, and never during
        # the startup grace. It is CLEARED the moment the receiver returns,
        # region-A answers, the replica leaves recovery (already promoted),
        # psql itself fails (fail-safe: an unhealthy local replica must
        # never look like a dead primary), or no liveness path is wired.
        - name: signals
          image: {{ include "cnpg-pair.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.cnpgPair.image.pullPolicy | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              CONN="host={{ include "cnpg-pair.replicaName" . }}-rw port=5432 dbname=postgres user=streaming_replica sslmode=require sslcert=/tls/client/tls.crt sslkey=/tls/client/tls.key"
              # 'promoted'   — NOT in recovery: the local cluster is writable
              #                (already promoted / diverged off the source TL).
              # 'streaming'  — WAL receiver process ALIVE and it has received WAL
              #                over the stream (receive-LSN set) — the pair is
              #                genuinely streaming right now.
              # 'receiving'  — a WAL receiver row EXISTS but no WAL has been
              #                received yet (the brief connect/handshake window)
              #                — region-A is delivering WAL, ALIVE, not dead.
              # 'noreceiver' — no WAL receiver row at all → POTENTIAL loss.
              #
              # #5239 — the arm gate MUST decide "streaming" from signals the
              # probe role can actually READ. The signals psql authenticates as
              # `streaming_replica` (client cert), which lacks pg_read_all_stats
              # / pg_monitor, so PostgreSQL NULLs the privileged columns of
              # pg_stat_wal_receiver for it — `status` is ALWAYS NULL
              # (live-confirmed hw274). The former `status = 'streaming'`
              # predicate was therefore NEVER true → the pair NEVER armed → a
              # real region-kill would refuse to promote (DR failover dead on
              # every env). A privilege GRANT is not a clean fix here:
              # `streaming_replica` is a CNPG RESERVED role (barred from
              # spec.managed.roles), and it does not yet exist at initdb
              # postInitSQL time (ConfigureNewInstance runs postInitSQL before
              # the operator creates streaming_replica), so a GRANT would fail
              # and wedge the whole primary bootstrap. Instead detect streaming
              # with objects EVERY role can read on a standby:
              #   - pg_is_in_recovery()       — PUBLIC-executable
              #   - the pg_stat_wal_receiver ROW — its `pid` (hence EXISTS) is
              #                                    visible to all; only the
              #                                    detail columns are NULLed
              #   - pg_last_wal_receive_lsn() — PUBLIC-executable
              # The ROW-EXISTS guard is what makes pg_last_wal_receive_lsn() safe
              # here: that function's value PERSISTS after a receiver stops, so
              # ALONE it is not proof of CURRENT streaming — but the view holds a
              # row ONLY while a walreceiver process is live, so requiring BOTH
              # (row present AND receive-LSN set) is a true "streaming right now"
              # signal that resets the instant the receiver dies (row vanishes →
              # STATE becomes 'noreceiver'). Everything else in the #5220/#5178
              # arm gate + latch is unchanged; only this signal is made readable.
              Q="SELECT CASE
                WHEN NOT pg_is_in_recovery() THEN 'promoted'
                WHEN EXISTS (SELECT 1 FROM pg_stat_wal_receiver) AND pg_last_wal_receive_lsn() IS NOT NULL THEN 'streaming'
                WHEN EXISTS (SELECT 1 FROM pg_stat_wal_receiver) THEN 'receiving'
                ELSE 'noreceiver'
              END"
              STARTED=$(date -u +%s)
              echo "[dr-promoter/signals] loop started (interval=${INTERVAL_SECONDS}s startupGrace=${STARTUP_GRACE_SECONDS}s primaryLiveness=${PRIMARY_LIVENESS_ENABLED} primaryMeshHost=${PRIMARY_MESH_HOST})"
              clear_clock() {
                if [ -f /shared/primary-wal-down-since ]; then
                  echo "$(date -u +"%FT%TZ") [dr-promoter/signals] $1 — hold clock cleared"
                fi
                # Clears the promote clock AND (#5220 B) the replication-fault /
                # timeline-divergence markers — any state that reaches a normal
                # clock-clear (streaming/receiving/promoted/unknown/real-kill
                # arming/grace) means the pair is NOT in the persistent
                # can't-re-stream wedge, so a resolved wedge fully resets.
                rm -f /shared/primary-wal-down-since /shared/replication-fault-since /shared/timeline-diverged /shared/timeline-diverged-recorded
              }
              while true; do
                : > /shared/signals-alive
                STATE=$(psql "${CONN}" -tAXc "${Q}" 2>/dev/null || echo "unknown")
                NOW=$(date -u +%s)
                # ── #5220 (A) — steady-state ARM gate ──────────────────────
                # The promoter must OBSERVE the pair reach a stable STREAMING
                # steady-state before ANY region-A-death is believable. A
                # convergence-time transient — a primary restart-storm, or a
                # replica that has not streamed even once (the hw273 #5220
                # false positive) — must never arm the promoter → never
                # promote. Once armed it STAYS armed for the pod's life (a real
                # death AFTER steady-state promotes normally); a brief
                # non-streaming blip only RESTARTS the arm window, never
                # un-arms. Runs every tick, independent of the startup grace
                # (streaming observed during the grace window still counts).
                if [ "${STATE}" = "streaming" ]; then
                  if [ ! -f /shared/armed ]; then
                    if [ ! -f /shared/streaming-since ]; then
                      echo "${NOW}" > /shared/streaming-since
                      echo "$(date -u +"%FT%TZ") [dr-promoter/signals] first stable stream observed — arm window ${STEADY_STATE_ARM_SECONDS}s started; promoter stays DISARMED until continuous streaming holds (#5220)"
                    else
                      SSINCE=$(cat /shared/streaming-since 2>/dev/null || echo "${NOW}")
                      if [ "$((NOW - SSINCE))" -ge "${STEADY_STATE_ARM_SECONDS}" ]; then
                        : > /shared/armed
                        echo "$(date -u +"%FT%TZ") [dr-promoter/signals] ARMED — streaming steady-state held $((NOW - SSINCE))s (>=${STEADY_STATE_ARM_SECONDS}s); region-A-death detection is now live (#5220)"
                      fi
                    fi
                  fi
                else
                  # Any non-streaming state breaks the continuity requirement
                  # → restart the arm window. NEVER un-arms once armed.
                  rm -f /shared/streaming-since
                fi
                # STARTUP GRACE — a fresh replica still doing its first
                # catchup must never arm the clock (#5178).
                if [ "$((NOW - STARTED))" -lt "${STARTUP_GRACE_SECONDS}" ]; then
                  clear_clock "startup grace ($((NOW - STARTED))s<${STARTUP_GRACE_SECONDS}s, state=${STATE})"
                  sleep "${INTERVAL_SECONDS}"; continue
                fi
                case "${STATE}" in
                  promoted)
                    # Left recovery → already promoted/diverged. Mark it so
                    # the actor never re-promotes (anti-flap #5178).
                    : > /shared/diverged
                    clear_clock "state=promoted (local cluster writable)"
                    ;;
                  streaming|receiving)
                    clear_clock "state=${STATE} (WAL receiver alive)"
                    ;;
                  unknown)
                    clear_clock "state=unknown (local replica probe failed — fail-safe)"
                    ;;
                  noreceiver)
                    # LOCAL WAL stream absent — the 0.2.13 bug promoted here on
                    # the LOCAL signal alone (hw266). #5178: require a POSITIVE
                    # region-A-unreachable proof first.
                    if [ "${PRIMARY_LIVENESS_ENABLED}" != "true" ]; then
                      clear_clock "state=noreceiver but NO region-A liveness path (clusterMesh off / crossRegionPeerClusters empty) — auto-promote inert, fail-safe"
                    elif pg_isready -h "${PRIMARY_MESH_HOST}" -p 5432 -t "${PROBE_TIMEOUT}" -q; then
                      # region-A REACHABLE + local WAL absent ⇒ replication
                      # fault, NOT a region kill. Clear the PROMOTE clock, but
                      # (#5220 B) TRACK how long this fault persists: a standby
                      # that can NEVER re-stream from a reachable region-A is
                      # the timeline-divergence wedge (region-B left the source
                      # timeline in a prior promotion and can never stream from
                      # the lower-TL source). Do NOT call clear_clock here — it
                      # would wipe the fault clock we are trying to accrue.
                      if [ -f /shared/primary-wal-down-since ]; then
                        echo "$(date -u +"%FT%TZ") [dr-promoter/signals] state=noreceiver but region-A REACHABLE — replication fault, NOT a region kill; hold clock cleared"
                      fi
                      rm -f /shared/primary-wal-down-since
                      if [ ! -f /shared/replication-fault-since ]; then
                        echo "${NOW}" > /shared/replication-fault-since
                        echo "$(date -u +"%FT%TZ") [dr-promoter/signals] state=noreceiver but region-A REACHABLE (pg_isready ok @ ${PRIMARY_MESH_HOST}) — replication fault (data safety: NOT promoting); tracking for timeline-divergence (#5220)"
                      fi
                      FSINCE=$(cat /shared/replication-fault-since 2>/dev/null || echo "${NOW}")
                      if [ "$((NOW - FSINCE))" -ge "${TL_DIVERGENCE_HOLD_SECONDS}" ] && [ ! -f /shared/timeline-diverged ]; then
                        : > /shared/timeline-diverged
                        echo "$(date -u +"%FT%TZ") [dr-promoter/signals] TIMELINE-DIVERGENCE WEDGE: region-B has been unable to stream from a REACHABLE region-A for $((NOW - FSINCE))s (>=${TL_DIVERGENCE_HOLD_SECONDS}s) — the replica has left the source timeline and can never re-stream from the lower-TL source. Region-B must be RE-CLONED from region-A (RUNBOOKS §6.1); the actor records it on the HR (#5220)"
                      fi
                    else
                      RC=$?
                      if [ "${RC}" -eq 2 ]; then
                        if [ ! -f /shared/primary-wal-down-since ]; then
                          echo "${NOW}" > /shared/primary-wal-down-since
                          echo "$(date -u +"%FT%TZ") [dr-promoter/signals] WAL receiver ABSENT and region-A UNREACHABLE (pg_isready rc=2 @ ${PRIMARY_MESH_HOST}) — primary loss; hold clock started"
                        fi
                      else
                        clear_clock "state=noreceiver, region-A probe ambiguous (pg_isready rc=${RC}) — fail-safe, NOT arming"
                      fi
                    fi
                    ;;
                esac
                sleep "${INTERVAL_SECONDS}"
              done
          env:
            - name: PGCONNECT_TIMEOUT
              value: "5"
            # #5178 region-A liveness probe target — the SAME ClusterMesh
            # `-primary-mesh` endpoint the replica streams from (templated
            # from the replicationServiceName helper, never hardcoded).
            - name: PRIMARY_MESH_HOST
              value: {{ include "cnpg-pair.replicationServiceName" . | quote }}
            - name: PRIMARY_LIVENESS_ENABLED
              value: {{ if $livenessEnabled }}"true"{{ else }}"false"{{ end }}
            - name: PROBE_TIMEOUT
              value: {{ $probeTimeout | quote }}
            - name: STARTUP_GRACE_SECONDS
              value: {{ $startupGrace | quote }}
            - name: INTERVAL_SECONDS
              value: {{ $interval | quote }}
            # #5220 (A) steady-state arm window + (B) timeline-divergence hold.
            - name: STEADY_STATE_ARM_SECONDS
              value: {{ $armSeconds | quote }}
            - name: TL_DIVERGENCE_HOLD_SECONDS
              value: {{ $tlDivergeHold | quote }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test -f /shared/signals-alive && test -z \"$(find /shared/signals-alive -mmin +1)\""
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["test", "-f", "/shared/signals-alive"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsUser: 26   # postgres in upstream cnpg image
            runAsGroup: 26
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: tmp
              mountPath: /tmp
            - name: replication-cert
              mountPath: /tls/client
              readOnly: true
        # ── actor — the PROMOTER + durable SUSPEND LATCH (#5178 / #5218) ─
        # Each tick runs in a subshell (a persistent fault retries next
        # tick instead of crashing the pod — #5157 shape). A shell helper
        # `suspend_hr` sets spec.suspend=true, READBACK-VERIFIES it landed,
        # and logs loudly (RBAC/conflict) on failure so a stuck latch is
        # diagnosable in the actor-container log. Ordering:
        #   1. SELF-HEAL LATCH (every tick, independent of the hold clock) —
        #      if the promotion is DRIVEN + RENDERED (HR promoted=true AND
        #      local Cluster replica.enabled=false) OR the local cluster has
        #      already left recovery (/shared/diverged), and the HR is NOT
        #      suspended, RE-ASSERT spec.suspend=true. Idempotent: it latches
        #      the promoted release AND re-freezes within one interval if
        #      anything ever un-suspends the HR. Both arms require POSITIVE
        #      render evidence, so it can never freeze a pre-render HR and
        #      strand an un-rendered promotion.
        #   2. ANTI-FLAP — already suspended (latched) ⇒ done. HR promoted
        #      but not yet rendered ⇒ WAIT for the render (do NOT suspend a
        #      pre-render HR — a suspended HR is not reconciled by helm, so
        #      the promotion would never land).
        #   3. PROMOTE — hold expired → NOT already diverged → local Cluster
        #      still a replica → failover-readiness Ready (#5133). Flip the HR
        #      desired state (the RUNBOOKS §6.1 seam), then STAY IN THE SAME
        #      TICK (#5218): poll until helm renders replica.enabled=false and
        #      suspend IMMEDIATELY. This shrinks the promote→suspend window
        #      from a full interval (the 0.2.14 next-tick latch, which let
        #      kustomize revert spec.values and re-demote mid-outage on hw271)
        #      to seconds; the step-1 self-heal is the backstop.
        - name: actor
          image: {{ printf "%s:%s" $krepo $ktag | quote }}
          imagePullPolicy: {{ $kpull | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              # suspend_hr <reason> — patch spec.suspend=true (+ latched-at
              # annotation), then READBACK-VERIFY it landed. spec.suspend is a
              # field flux's Kustomization (slot 16b) does NOT own, so its SSA
              # drift-correction cannot remove it; a suspended HR freezes
              # helm-controller so the reverted atomic spec.values can no
              # longer re-render replica.enabled=true and re-demote the
              # survivor (#5178 Defect-B / #5218). Returns non-zero (logged)
              # if the patch or the readback fails — the caller re-asserts next
              # tick, so an RBAC/conflict fault is self-healing AND diagnosable.
              suspend_hr() {
                _reason="$1"
                if kubectl -n "${HR_NAMESPACE}" patch helmrelease "${HR_NAME}" --type merge -p "{\"metadata\":{\"annotations\":{\"catalyst.openova.io/dr-auto-promote-latched-at\":\"$(date -u +"%FT%TZ")\"}},\"spec\":{\"suspend\":true}}" >/dev/null 2>&1; then
                  _v=$(kubectl -n "${HR_NAMESPACE}" get helmrelease "${HR_NAME}" -o jsonpath='{.spec.suspend}' 2>/dev/null || echo "")
                  if [ "${_v}" = "true" ]; then
                    echo "$(date -u +"%FT%TZ") [dr-promoter/actor] LATCHED (${_reason}): HR ${HR_NAMESPACE}/${HR_NAME} spec.suspend=true VERIFIED — promotion durable; flux drift-correction can no longer revert spec.values and re-demote the survivor (#5178 Defect-B / #5218)"
                    return 0
                  fi
                  echo "$(date -u +"%FT%TZ") [dr-promoter/actor] ERROR (${_reason}): spec.suspend patch accepted but readback='${_v}' (expected true) — HR NOT frozen; re-asserting next tick (#5218)"
                  return 1
                fi
                echo "$(date -u +"%FT%TZ") [dr-promoter/actor] ERROR (${_reason}): spec.suspend patch FAILED (RBAC/conflict?) — HR NOT frozen; re-asserting next tick (#5218)"
                return 1
              }
              echo "[dr-promoter/actor] loop started (hold=${HOLD_SECONDS}s interval=${INTERVAL_SECONDS}s renderWait=${PROMOTE_RENDER_WAIT_SECONDS}s hr=${HR_NAMESPACE}/${HR_NAME})"
              while true; do
                : > /shared/actor-alive
                (
                  set -eu
                  SUSPENDED=$(kubectl -n "${HR_NAMESPACE}" get helmrelease "${HR_NAME}" -o jsonpath='{.spec.suspend}' 2>/dev/null || echo "")
                  HR_PROMOTED=$(kubectl -n "${HR_NAMESPACE}" get helmrelease "${HR_NAME}" -o jsonpath='{.spec.values.cnpgPair.replica.promoted}' 2>/dev/null || echo "")
                  REPLICA_ENABLED=$(kubectl -n "${NAMESPACE}" get clusters.postgresql.cnpg.io "${REPLICA_CLUSTER}" -o jsonpath='{.spec.replica.enabled}' 2>/dev/null || echo "")
                  DIVERGED=""; [ -f /shared/diverged ] && DIVERGED="true"

                  # #5220 (B) — TIMELINE-DIVERGENCE surfacing (non-destructive).
                  # The signals container sets /shared/timeline-diverged when a
                  # standby has been unable to re-stream from a REACHABLE
                  # region-A for TL_DIVERGENCE_HOLD_SECONDS (it left the source
                  # timeline in a prior promotion: "highest timeline N of the
                  # primary is behind recovery timeline N+1"). Record it ONCE on
                  # the HR so the wedge is DIAGNOSED + monitored instead of a
                  # silent FATAL loop. Re-clone stays the operator's RUNBOOKS
                  # §6.1 action: a 2-node actor cannot prove WHICH side is
                  # authoritative, so auto-destroying region-B's PGDATA could
                  # lose a real survivor's committed writes. Runs regardless of
                  # suspend/promote state (a latched false promotion IS the
                  # wedge the operator must un-stick). Uses the existing HR
                  # get/patch RBAC — no new privileges.
                  if [ -f /shared/timeline-diverged ] && [ ! -f /shared/timeline-diverged-recorded ]; then
                    if kubectl -n "${HR_NAMESPACE}" patch helmrelease "${HR_NAME}" --type merge -p "{\"metadata\":{\"annotations\":{\"catalyst.openova.io/dr-timeline-diverged-at\":\"$(date -u +"%FT%TZ")\",\"catalyst.openova.io/dr-timeline-diverged-action\":\"re-clone region-B from region-A per RUNBOOKS 6.1 — the replica left the source timeline and cannot re-stream (#5220)\"}}}" >/dev/null 2>&1; then
                      : > /shared/timeline-diverged-recorded
                      echo "$(date -u +"%FT%TZ") [dr-promoter/actor] TIMELINE-DIVERGENCE recorded on HR ${HR_NAMESPACE}/${HR_NAME} (dr-timeline-diverged-at) — region-B cannot re-stream from a reachable region-A; RE-CLONE region-B per RUNBOOKS 6.1 (#5220)"
                    else
                      echo "$(date -u +"%FT%TZ") [dr-promoter/actor] WARN: could not annotate HR with timeline-divergence (RBAC/conflict?) — wedge still logged by signals; retrying next tick (#5220)"
                    fi
                  fi

                  # 1. SELF-HEAL LATCH — keep an already-rendered promotion
                  #    durable. Fires on the post-promote tick AND re-freezes
                  #    the HR if anything ever un-suspends it. Both arms require
                  #    POSITIVE render evidence (replica.enabled=false OR the
                  #    cluster already left recovery) so it can never freeze a
                  #    pre-render HR and strand the promotion.
                  if [ "${SUSPENDED}" != "true" ] && { { [ "${HR_PROMOTED}" = "true" ] && [ "${REPLICA_ENABLED}" = "false" ]; } || [ "${DIVERGED}" = "true" ]; }; then
                    suspend_hr "self-heal" || true
                    exit 0
                  fi
                  # 2. ANTI-FLAP — latched ⇒ done.
                  if [ "${SUSPENDED}" = "true" ]; then
                    exit 0
                  fi
                  # Promote driven but not yet rendered (replica.enabled still
                  # true, not diverged) — WAIT for helm; never suspend now (a
                  # suspended HR is not reconciled, the promote would never
                  # land) and never re-promote.
                  if [ "${HR_PROMOTED}" = "true" ]; then
                    echo "$(date -u +"%FT%TZ") [dr-promoter/actor] HR promoted=true but not yet rendered (replica.enabled='${REPLICA_ENABLED}') — waiting for helm-controller; self-heal latch suspends the instant it renders (#5218)"
                    exit 0
                  fi

                  # 3. PROMOTE decision (not promoted, not suspended).
                  # #5220 ARM GATE — never promote until the pair has OBSERVED a
                  # stable streaming steady-state (the signals container sets
                  # /shared/armed after STEADY_STATE_ARM_SECONDS of continuous
                  # streaming). A region-A-down signal BEFORE the first stable
                  # stream is a convergence-time transient (the hw273 false
                  # positive: primary restart-storm before the pair ever
                  # streamed), NEVER a real kill. This is the primary #5220 fix:
                  # a pair that never reached steady-state can never promote, so
                  # #5219's suspend latch can never cement a false positive.
                  if [ ! -f /shared/armed ]; then
                    if [ -f /shared/primary-wal-down-since ]; then
                      echo "$(date -u +"%FT%TZ") [dr-promoter/actor] REFUSING promote: region-A-down signal present but the DR pair never reached streaming steady-state (UNARMED) — convergence-time transient, not a real kill; holding (#5220)"
                    fi
                    exit 0
                  fi
                  [ -f /shared/primary-wal-down-since ] || exit 0
                  DOWN_SINCE=$(cat /shared/primary-wal-down-since)
                  NOW=$(date -u +%s)
                  DOWN_FOR=$((NOW - DOWN_SINCE))
                  if [ "${DOWN_FOR}" -lt "${HOLD_SECONDS}" ]; then
                    echo "$(date -u +"%FT%TZ") [dr-promoter/actor] region-A unreachable ${DOWN_FOR}s < hold ${HOLD_SECONDS}s — waiting"
                    exit 0
                  fi
                  # ANTI-FLAP: never re-promote a cluster that already left the
                  # source timeline — that IS the runaway (hw266 TL2→TL25).
                  if [ -f /shared/diverged ]; then
                    echo "$(date -u +"%FT%TZ") [dr-promoter/actor] REFUSING promote: local cluster already diverged (left the source timeline) — re-clone required, NOT re-promote (RUNBOOKS §6.1 / #5178 anti-flap)"
                    exit 0
                  fi
                  if [ "${REPLICA_ENABLED}" != "true" ]; then
                    echo "$(date -u +"%FT%TZ") [dr-promoter/actor] local Cluster CR replica.enabled=${REPLICA_ENABLED} — not a replica; nothing to promote"
                    exit 0
                  fi
                  READY=$(kubectl -n "${NAMESPACE}" get pod -l "${READY_SELECTOR}" -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}')
                  if ! echo "${READY}" | grep -qw True; then
                    echo "$(date -u +"%FT%TZ") [dr-promoter/actor] failover-readiness NOT Ready (got: '${READY}') — standby not promotable; holding (data safety over RTO)"
                    exit 0
                  fi
                  echo "$(date -u +"%FT%TZ") [dr-promoter/actor] PROMOTING: region-A WAL stream absent AND region-A unreachable ${DOWN_FOR}s >= ${HOLD_SECONDS}s AND failover-readiness Ready — patching HR desired state (#5125-D1 seam)"
                  kubectl -n "${HR_NAMESPACE}" patch helmrelease "${HR_NAME}" --type merge -p "{\"metadata\":{\"annotations\":{\"catalyst.openova.io/dr-auto-promoted-at\":\"$(date -u +"%FT%TZ")\",\"catalyst.openova.io/dr-auto-promote-reason\":\"region-A WAL stream absent and region-A unreachable ${DOWN_FOR}s; failover-readiness Ready (#5137/#5178)\"}},\"spec\":{\"values\":{\"cnpgPair\":{\"replica\":{\"promoted\":true}}}}}"
                  echo "$(date -u +"%FT%TZ") [dr-promoter/actor] PROMOTED (step 1/2): HR ${HR_NAMESPACE}/${HR_NAME} spec.values.cnpgPair.replica.promoted=true — helm-controller renders replica.enabled:false → CNPG promotes"
                  # 3b. SAME-TICK DURABLE LATCH (#5218) — do NOT wait for the
                  #     next tick. Poll until helm renders replica.enabled=false
                  #     (the promotion has LANDED), then suspend IMMEDIATELY so
                  #     kustomize cannot reclaim the atomic spec.values and
                  #     re-demote in the gap. Bounded; the step-1 self-heal is
                  #     the backstop if the render outlasts the ceiling.
                  RE=""
                  i=0
                  while [ "${i}" -lt "${PROMOTE_RENDER_WAIT_SECONDS}" ]; do
                    RE=$(kubectl -n "${NAMESPACE}" get clusters.postgresql.cnpg.io "${REPLICA_CLUSTER}" -o jsonpath='{.spec.replica.enabled}' 2>/dev/null || echo "")
                    if [ "${RE}" = "false" ]; then
                      echo "$(date -u +"%FT%TZ") [dr-promoter/actor] PROMOTION RENDERED (step 2/2): replica.enabled=false after ${i}s — suspending HR now (#5218)"
                      suspend_hr "post-promote same-tick" || true
                      break
                    fi
                    i=$((i + 1))
                    sleep 1
                  done
                  if [ "${RE}" != "false" ]; then
                    echo "$(date -u +"%FT%TZ") [dr-promoter/actor] NOTE: helm has not rendered replica.enabled=false within ${PROMOTE_RENDER_WAIT_SECONDS}s of the promote patch (replica.enabled='${RE}') — the per-tick self-heal latch will suspend the instant it renders (#5218)"
                  fi
                ) || echo "[dr-promoter/actor] tick returned non-zero — retry in ${INTERVAL_SECONDS}s"
                sleep "${INTERVAL_SECONDS}"
              done
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HR_NAME
              value: {{ $hrName | quote }}
            - name: HR_NAMESPACE
              value: {{ $hrNamespace | quote }}
            - name: HOLD_SECONDS
              value: {{ $hold | quote }}
            - name: INTERVAL_SECONDS
              value: {{ $interval | quote }}
            # #5218 — ceiling on the same-tick post-promote poll that waits
            # for helm to render replica.enabled=false before suspending.
            - name: PROMOTE_RENDER_WAIT_SECONDS
              value: {{ $renderWait | quote }}
            - name: REPLICA_CLUSTER
              value: {{ include "cnpg-pair.replicaName" . | quote }}
            - name: READY_SELECTOR
              value: "catalyst.openova.io/role=failover-readiness-probe,catalyst.openova.io/cnpg-pair={{ include "cnpg-pair.fullname" . }}"
            # kubectl writes its discovery/http cache under $HOME.
            - name: HOME
              value: /tmp
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test -f /shared/actor-alive && test -z \"$(find /shared/actor-alive -mmin +1)\""
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["test", "-f", "/shared/actor-alive"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: shared
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # THIS replica cluster's own CNPG-issued streaming_replica client
        # cert (exists locally on cluster-B, no cross-cluster sync) —
        # 0440 root:26, the perms libpq requires for an sslkey (#5133).
        - name: replication-cert
          secret:
            secretName: {{ include "cnpg-pair.replicaName" . }}-replication
            defaultMode: 0440
{{- end }}
