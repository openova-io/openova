{{- /*
Primary CNPG Cluster CR.

The CNPG operator (installed by bp-cnpg) reconciles this CR into the
StatefulSet + Services + PDB + WAL archive that make up the primary
side of the cluster-pair. Per ADR-0001 §2.7, the Cluster CR IS the
truth — Continuum K-Cont-2 reads `status.currentPrimary`, the per-
instance replication slots, and `status.replicaCluster` annotations
to drive switchover.

Region-pinning: the `openova.io/region` node-affinity term (paired
with the matching label on this CR) ensures the operator schedules
all instances inside the configured Hetzner region.
*/ -}}
{{- if .Values.cnpgPair.enabled }}
{{- include "cnpg-pair.validateRegions" . }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "cnpg-pair.primaryName" . }}
  labels:
    {{- include "cnpg-pair.labels" . | nindent 4 }}
    openova.io/cnpg-role: primary
    openova.io/region: {{ .Values.cnpgPair.primary.region | quote }}
    catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
  annotations:
    catalyst.openova.io/blueprint: bp-cnpg-pair
    catalyst.openova.io/cnpg-pair-role: primary
    catalyst.openova.io/cnpg-pair-name: {{ include "cnpg-pair.fullname" . | quote }}
spec:
  instances: {{ .Values.cnpgPair.primary.instances }}
  primaryUpdateMethod: switchover
  imageName: {{ include "cnpg-pair.imageRef" . | quote }}

  storage:
    size: {{ .Values.cnpgPair.primary.storage.size | quote }}
    storageClass: {{ .Values.cnpgPair.primary.storage.storageClass | quote }}

  resources:
    {{- toYaml .Values.cnpgPair.primary.resources | nindent 4 }}

  bootstrap:
    initdb:
      database: {{ .Values.cnpgPair.primary.bootstrap.database | quote }}
      owner:    {{ .Values.cnpgPair.primary.bootstrap.owner | quote }}

  # Region pinning — node-affinity is the operator's idiomatic seam
  # for region selection (Cluster CR Pods land on nodes whose
  # openova.io/region label matches). nodeSelector is intentionally
  # NOT used: it can't express the "MUST be in region A" constraint
  # under controller-managed taints/tolerations.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: openova.io/region
                operator: In
                values: [{{ .Values.cnpgPair.primary.region | quote }}]
    podAntiAffinityType: required

  # Postgres config: the replica region's externalCluster connects
  # via `streaming_replica` user, which CNPG provisions automatically
  # as part of the Cluster's role bootstrap. Replication slots are
  # auto-created so a brief replica disconnect does not lose WAL.
  #
  # `hot_standby` is intentionally OMITTED — PostgreSQL 16 hard-pins it
  # to `on` (it is a fixed parameter in postgres' GUC table) and the
  # CNPG operator rejects any explicit set with phase
  # "Unable to create required cluster objects" (BlockedConfigurationParameter).
  # CNPG injects the correct value automatically when the Cluster CR is a
  # primary that may serve replicas. Caught live on omantel-fsn 2026-05-09
  # (Phase-2 multi-region incident #3 in qa-loop-state/incidents.md).
  postgresql:
    parameters:
      max_wal_senders: "10"
      max_replication_slots: "10"
      wal_level: "logical"
      {{- /*
      Synchronous replication (Pillar 3 zero-tx-loss).

      `synchronous_commit = remote_apply` blocks the primary's COMMIT
      until the replica has REPLAYED the WAL (strongest durability;
      replica-side SELECTs see the row before COMMIT returns). This is a
      SETTABLE GUC, so it stays a raw parameter here.

      `synchronous_standby_names` is NOT settable as a raw parameter —
      CNPG marks it a FIXED configuration parameter (the operator owns
      it) and the admission webhook REJECTS any explicit set in
      `parameters` with "Can't set fixed configuration parameter".
      Verified live against CNPG 1.29.0 (hw124, 2026-06-10, #3195). We
      therefore declare synchronous replication via CNPG's NATIVE
      `spec.postgresql.synchronous` block (CNPG ≥1.24) below — the
      operator derives `synchronous_standby_names` from it
      (`FIRST <number> (<replica application_name>)`). The replica's
      externalCluster streaming connection defaults application_name to
      the replica Cluster CR's name, which CNPG matches automatically.

      Mode "async" exists for forensic / lab use only; the rendered
      manifest then omits both the parameter AND the synchronous block,
      falling back to the PostgreSQL default (synchronous_commit=on,
      no standbys forced).
      */ -}}
      {{- if eq (default "sync" .Values.cnpgPair.replication.mode) "sync" }}
      synchronous_commit: {{ default "remote_apply" .Values.cnpgPair.replication.sync.commit | quote }}
      {{- end }}
    {{- if eq (default "sync" .Values.cnpgPair.replication.mode) "sync" }}
    # ── Synchronous replication — CNPG-native (NOT a raw parameter) ────
    # method=first + number=N renders `synchronous_standby_names =
    # FIRST N (...)`; CNPG fills the standby application_name(s) from the
    # connected replicas. dataDurability=required strictly enforces the
    # zero-tx-loss bar: COMMIT blocks when fewer than `number` healthy
    # synchronous standbys are connected (the Pillar-3 durability claim).
    synchronous:
      method: first
      number: {{ int (default 1 .Values.cnpgPair.replication.sync.numSync) }}
      dataDurability: required
    {{- end }}

  # ── Replication-source Service (managed by CNPG, annotated for ──────
  #   Cilium ClusterMesh global routing) ──────────────────────────────
  #
  # CNPG creates an `<name>-r` Service automatically (read-replica
  # endpoint, selectorType: r). The chart used to hand-create this
  # Service in templates/service-replication.yaml which CNPG refused
  # to reconcile ("refusing to reconcile service: <name>-r, not owned
  # by the cluster"). Phase-2 incident #3 in qa-loop-state/incidents.md.
  #
  # The fix: declare an *additional* managed Service through CNPG's
  # `spec.managed.services.additional[]` API (CNPG ≥ 1.22). The Service
  # name is `<cluster-name>-mesh` (avoids collision with the auto-
  # created `-r`) and carries the `service.cilium.io/global: "true"`
  # annotation so Cilium ClusterMesh publishes it across every peer.
  # The replica's externalCluster connectionParameters.host points at
  # this Service name.
  {{- if .Values.cnpgPair.clusterMesh.enabled }}
  managed:
    services:
      additional:
        - selectorType: r
          serviceTemplate:
            metadata:
              name: {{ include "cnpg-pair.replicationServiceName" . }}
              labels:
                {{- include "cnpg-pair.labels" . | nindent 16 }}
                catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
                catalyst.openova.io/role: replication-source
              annotations:
                # ── Cilium ClusterMesh — make this Service global ──
                # NEW seam: bp-cnpg-pair is the canonical user of the
                # `service.cilium.io/global` annotation pattern.
                service.cilium.io/global: "true"
                service.cilium.io/affinity: {{ .Values.cnpgPair.clusterMesh.affinity | quote }}
                catalyst.openova.io/blueprint: bp-cnpg-pair
            spec:
              type: ClusterIP
              ports:
                - name: postgres
                  port: 5432
                  targetPort: 5432
                  protocol: TCP
  {{- end }}

  # Allow the CNPG operator to run automatic switchover within this
  # primary cluster (e.g. instance pod replacement). Cross-cluster
  # switchover (primary↔replica failover) is driven by Continuum
  # K-Cont-2 — NOT by CNPG itself.
  enableSuperuserAccess: false
{{- end }}
