{{- /*
NetworkPolicy carve-out for cluster-pair replication traffic.

The platform default-deny CCNP (H8 seam — `platform/network-policies`)
denies all pod-to-pod traffic by default. This NetworkPolicy opens
the minimum required paths:

  1. Replication: the replica cluster's Pods MAY reach the primary
     cluster's `-r` Service on 5432 (cross-cluster via ClusterMesh).
  2. Probe: the failover-readiness probe Pod MAY reach the replica
     cluster's `-r` Service on 5432 (intra-cluster, in replica region).
  3. Operator status: the CNPG operator (cloudnative-pg, in
     `cnpgPair.networkPolicy.operatorNamespace` = cnpg-system) MAY reach
     EACH instance Pod's status web server (operatorStatusPort = 8000)
     and metrics exporter (operatorMetricsPort = 9187). A k8s
     NetworkPolicy selecting the instance Pods default-denies all OTHER
     ingress to them — including the operator's status probe — so without
     this carve-out the Cluster phase stalls at "Instance Status
     Extraction Error" (the hw126 symptom: primary 1/1 Running yet phase
     = extraction error). Both the primary-side and the replica-side
     ingress policies need it because each side selects its own instance
     CR Pods.

Everything else stays denied — no Egress to the public Internet, no
Ingress except from the explicit selectors below.

This is a NamespacePolicy (NetworkPolicy in apps/v1 sense), NOT a
CiliumClusterwideNetworkPolicy — the chart targets a single
namespace, and the H8 platform CCNP already covers the cluster-
scoped default-deny.

Side-gating (chart 0.2.0): a NetworkPolicy must be applied on the
cluster whose Pods it selects (podSelector is evaluated against LOCAL
endpoints) — so the replication-ingress policy (selects primary CR
Pods) renders on side=primary, and the probe policies (select replica
CR Pods + the probe Pod) render on side=replica.
*/ -}}
{{- if and .Values.cnpgPair.enabled .Values.cnpgPair.networkPolicy.enabled }}
{{- if (include "cnpg-pair.isPrimarySide" .) }}
---
# Allow primary CR Pods to accept replication connections from any
# Pod with `cnpg.io/cluster=<replica>` label. ClusterMesh delivers
# the replica region's Pods identity into the primary region; the
# selector matches by Pod label regardless of source cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cnpg-pair.fullname" . }}-allow-replication-to-primary
  labels:
    {{- include "cnpg-pair.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "cnpg-pair.primaryName" . }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "cnpg-pair.replicaName" . }}
      ports:
        - port: 5432
          protocol: TCP
    # OWN-cluster pods (0.2.2, hw130 live find): this policy selects ALL
    # primary-CR Pods, default-denying the cluster's OWN internal 5432 —
    # instance-2's pg_basebackup join, instance-to-instance streaming,
    # and any switchover rejoin. hw130 sat "Creating a new replica" >1h,
    # the join pod's SYNs dropped (cilium monitor: "Policy denied …
    # 5432 tcp SYN"). hw128's region-kill walk never caught it: those
    # writes ran via kubectl exec (unix socket — never crossed the
    # wire). Only a live multi-instance join exercises this path.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "cnpg-pair.primaryName" . }}
      ports:
        - port: 5432
          protocol: TCP
    # CNPG operator status + metrics probe — without this the operator
    # cannot extract the primary instance's status and the Cluster phase
    # stalls at "Instance Status Extraction Error".
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.cnpgPair.networkPolicy.operatorNamespace }}
      ports:
        - port: {{ .Values.cnpgPair.networkPolicy.operatorStatusPort }}
          protocol: TCP
        - port: {{ .Values.cnpgPair.networkPolicy.operatorMetricsPort }}
          protocol: TCP
{{- end }}
{{- if (include "cnpg-pair.isReplicaSide" .) }}
---
# Allow failover-readiness probe Pod to reach the replica's `-r`
# Service on 5432 (Egress) AND allow the replica cluster's Pods to
# accept the connection (Ingress, intra-cluster).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cnpg-pair.fullname" . }}-allow-probe-to-replica
  labels:
    {{- include "cnpg-pair.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "cnpg-pair.replicaName" . }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              catalyst.openova.io/role: failover-readiness-probe
              catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
      ports:
        - port: 5432
          protocol: TCP
    # #3322 OWN-CLUSTER carve-out: the replica Cluster's instance-2 joins
    # instance-1 via the replica's -rw Service on 5432. This netpol selects
    # the replica Pods, so without an explicit allow for the replica's OWN
    # cnpg.io/cluster label it default-denies that join → instance-2 wedges
    # at "Creating a new replica" (dial timeout to replica-rw:5432), exactly
    # the primary side's own-cluster gap (lines above). hw130 caught this
    # live (24h wedge). Mirror the primary carve-out.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "cnpg-pair.replicaName" . }}
      ports:
        - port: 5432
          protocol: TCP
    # CNPG operator status + metrics probe — the replica side selects its
    # own instance CR Pods, so it needs the same operator carve-out as the
    # primary or the replica Cluster phase stalls at "Instance Status
    # Extraction Error" too.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.cnpgPair.networkPolicy.operatorNamespace }}
      ports:
        - port: {{ .Values.cnpgPair.networkPolicy.operatorStatusPort }}
          protocol: TCP
        - port: {{ .Values.cnpgPair.networkPolicy.operatorMetricsPort }}
          protocol: TCP
---
# Egress carve-out for the probe Pod — must resolve DNS and reach
# the replica's `-r` Service on 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cnpg-pair.fullname" . }}-probe-egress
  labels:
    {{- include "cnpg-pair.labels" . | nindent 4 }}
    catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
spec:
  podSelector:
    matchLabels:
      catalyst.openova.io/role: failover-readiness-probe
      catalyst.openova.io/cnpg-pair: {{ include "cnpg-pair.fullname" . | quote }}
  policyTypes: [Egress]
  egress:
    # DNS to kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Replica CR Pods on 5432
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "cnpg-pair.replicaName" . }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
{{- end }}
