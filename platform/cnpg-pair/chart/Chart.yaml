  0.2.11 (2026-07-16, failover-readiness false-negative fix — region-kill DR promotion, Refs #5133)
    - FIX (Pillar-3 region-kill DR): the failover-readiness probe reported
      `lag=999999s ≥ threshold=30s — NOT promotable` on a region-b replica
      that was a byte-caught-up SYNCHRONOUS standby (pg_stat_replication on
      the primary: state=streaming, sync_state=sync, empty replay_lag), so it
      sat 0/1 Ready and a region-kill of region-a would NOT have promoted
      region-b even though the replica was genuinely promotable. Caught live
      on hw260 (dep 1e42924ea1656aac, 2026-07-16). TWO defects:
        • AUTH (the always-firing cause of the 999999 sentinel): the probe
          connected as `user=postgres`, but both Cluster CRs set
          `enableSuperuserAccess: false`, so that superuser can NEVER
          authenticate over TCP — every poll failed auth → `|| echo 999999`.
          The probe now authenticates as `streaming_replica` via the
          CNPG-issued client cert (CNPG default pg_hba
          `hostssl postgres streaming_replica all cert`), mounting THIS replica
          cluster's own `<replica>-replication` (tls.crt/tls.key) Secret (0440,
          root:26 — the perms libpq requires for an sslkey) with sslmode=require.
          Same streaming_replica-cert pattern the externalCluster streaming
          connection already uses.
        • LAG MEASURE: `now() - pg_last_xact_replay_timestamp()` is a
          replay-recency clock, NOT a replication-lag measure — on a
          caught-up standby of an idle primary it grows unbounded (false lag)
          and returns NULL when no xact has been replayed. Replaced with an
          LSN comparison: `pg_last_wal_replay_lsn() >= pg_last_wal_receive_lsn()`
          → the standby applied everything it received → 0 lag. This is
          idle-safe AND region-kill-safe (when region-a dies the WAL receiver
          freezes and replay catches up to it → 0 → promotable, with no
          dependency on the dead primary). A genuinely-behind async standby
          (received > replayed) still falls through to a seconds-based apply
          lag the `targetLagSeconds` threshold gates.
    - The probe now targets the replica cluster's `-rw` Service (the
      designated primary CNPG would promote) instead of `-r` (round-robin).
    - Render-gate test (chart/tests/cnpg-pair-render.sh) Case 13 asserts the
      probe authenticates as streaming_replica (NOT the disabled postgres
      superuser), uses the LSN receive-vs-replay caught-up check, and mounts
      the replication cert + CA.
    - Default-OFF contract UNCHANGED: cnpgPair.enabled=false renders ZERO
      resources on BOTH sides. Resource COUNTS unchanged (one Secret volume
      added to the existing failover-readiness Deployment).

  0.2.6 (2026-06-24, cross-region replica streams from PRIMARY not a standby — RPO=0 completion, Refs #3740 / #3375)
    - FIX (Pillar-3 zero-tx-loss, the missing half of the 0.2.5 fix): the
      ClusterMesh replication-source Service (`-primary-mesh`, consumed by
      the replica's externalCluster) now uses `selectorType: rw` (PRIMARY
      only) instead of `selectorType: r` (ALL instances). 0.2.5 correctly
      pinned `synchronous_standby_names = FIRST 1 ("<replicaName>")`, but
      the `r` selector round-robins the cross-region replica's WAL receiver
      across the primary AND its local HA standbys (cnpg.io/podRole=
      instance). When it landed on a LOCAL STANDBY the replica CASCADED off
      that standby — a cascaded standby can never be a synchronous standby
      of the primary, so the replica appeared in pg_stat_replication only on
      the STANDBY (sync_state=async, sender pg_is_in_recovery()=t) and NEVER
      on the primary. `FIRST 1 ("<replicaName>")` then stayed permanently
      unsatisfiable, and with dataDurability:required the primary BLOCKED
      ALL WRITES. Caught LIVE on omantel.biz kom4dc (2026-06-23): replica
      byte-caught-up, its walsender on primary-3 [a standby], and an INSERT
      on the real primary (primary-2) hung. `rw` selects ONLY the current
      primary (cnpg.io/instanceRole=primary, a single endpoint), so the
      replica streams DIRECTLY from the primary's walsender → it appears in
      the PRIMARY's pg_stat_replication → standbyNamesPre matches →
      sync_state=sync → RPO=0. CNPG re-points the `-rw` selector at the
      newly-promoted instance after a Continuum switchover, so the mesh
      alias keeps tracking the live primary with no chart change.
    - Render-gate test (chart/tests/cnpg-pair-render.sh) now asserts
      `selectorType: rw` on the side=primary mesh Service (and that `r` is
      NOT used there).
    - Default-OFF contract UNCHANGED: cnpgPair.enabled=false renders ZERO
      resources on BOTH sides. Resource COUNTS unchanged (one selectorType
      value flipped r→rw).

  0.2.5 (2026-06-17, cross-region sync target — RPO=0 fix, Refs #3740 / #3375)
    - FIX (Pillar-3 zero-tx-loss): the primary Cluster CR's CNPG-native
      `spec.postgresql.synchronous` block now pins the CROSS-REGION
      replica as the synchronous standby via
      `standbyNamesPre: [<replicaName>]` + `maxStandbyNamesFromCluster: 0`.
      Before this, CNPG auto-populated `synchronous_standby_names` from the
      LOCAL cluster's own instance Pods only (default
      maxStandbyNamesFromCluster is unbounded). In the split-side topology
      (0.2.0) the cross-region standby is a SEPARATE Cluster CR on
      cluster-B, which CNPG never adds, so `FIRST 1` was satisfied by a
      LOCAL region-A HA peer and the cross-region replica streamed ASYNC
      (sync_state=async). A region-kill then loses in-flight transactions
      → the canonical "zero transactions lost" claim was VIOLATED. Caught
      LIVE on hw158 (2026-06-17): the region-B replica was byte-for-byte
      caught up yet pg_stat_replication showed it async while a local
      primary-2 was sync. After the fix `synchronous_standby_names =
      FIRST 1 ("<replicaName>")` and the primary blocks COMMIT until the
      cross-region replica has applied the WAL → RPO=0. The
      replica-unreachable → primary-blocks-writes trade-off is unchanged
      and already disclosed in values.yaml / DESIGN.md.
    - Render-gate test (chart/tests/cnpg-pair-render.sh) now asserts
      `maxStandbyNamesFromCluster: 0` AND the replica name in
      `standbyNamesPre` on the side=primary render.
    - Default-OFF contract UNCHANGED: cnpgPair.enabled=false renders ZERO
      resources on BOTH sides; async mode still omits the synchronous block.
      Resource COUNTS unchanged (two fields added inside the existing
      synchronous block).

  0.2.1 (2026-06-11, operator status-probe carve-out, Refs #3236 / #3195 / #2737)
    - FIX: the per-side ingress NetworkPolicies (allow-replication-to-
      primary on side=primary, allow-probe-to-replica on side=replica)
      each select their cluster's CNPG instance Pods and declare
      `policyTypes: [Ingress]` — which default-denies ALL other ingress
      to those Pods, including the CNPG operator's status probe. On hw126
      the primary instance was 1/1 Running yet the Cluster phase stalled
      at "Instance Status Extraction Error" because the operator (in
      cnpg-system) could not reach the instance status web server.
      Both ingress policies now also allow namespaceSelector
      kubernetes.io/metadata.name=<operatorNamespace> (default
      cnpg-system) to the instance status port (default 8000) and the
      Prometheus metrics port (default 9187). The replication 5432 rules
      are untouched. New values knobs: networkPolicy.operatorNamespace /
      operatorStatusPort / operatorMetricsPort.
    - Default-OFF contract UNCHANGED: cnpgPair.enabled=false renders ZERO
      resources on BOTH sides. Resource COUNTS are unchanged (rules added
      to existing policies, no new objects).

  0.2.0 (2026-06-11, split-side topology, Refs #3236 / #3195 / #2737)
    - TOPOLOGY-DESIGN CHANGE: new `cnpgPair.side: primary|replica`
      knob (default `primary`; `secondary` accepted as an alias for
      `replica` so the bootstrap-kit can substitute the per-region
      SOVEREIGN_REGION_ROLE verbatim). Chart ≤0.1.x rendered the
      whole pair in ONE release on the primary cluster and claimed
      "CNPG schedules each side to its region via node-affinity" —
      that only holds on a single stretched cluster. A real 2-region
      Sovereign is two SEPARATE k3s clusters joined by ClusterMesh,
      so the replica Cluster CR + failover-readiness Deployment
      pinned to region-B node labels could NEVER schedule on
      cluster-A (hw126: FailedScheduling 0/4 nodes, affinity requires
      openova.io/region=hw-me-east-215-b-rtz-prod — every cluster-A
      node is ...-a-rtz-prod). 0.2.0 splits the render per side:
        side=primary → primary Cluster CR + `-primary-mesh` global
        Service + audit-config ConfigMap (bp-continuum's prerequisite
        probe reads it on the primary cluster) + replication-ingress
        NetworkPolicy + Continuum CR (when continuum.enabled) +
        helm-test resources.
        side=replica → replica Cluster CR (pg_basebackup +
        externalClusters over the ClusterMesh-global Service — the
        canonical CNPG separate-cluster replica pattern, unchanged) +
        a local `-primary-mesh` Service stub (Cilium merges global
        services BY NAME+NAMESPACE across clusters; without a local
        Service object the host would be NXDOMAIN on cluster-B — its
        selector matches zero local Pods so traffic crosses the mesh)
        + failover-readiness Deployment + probe NetworkPolicies.
      Slot 16b now applies the HR on BOTH control planes (the
      SECONDARY_HR_SUSPEND suspend is removed) with
      `side: ${SOVEREIGN_REGION_ROLE:-primary}`.
    - Region validation now also runs on the replica-side render
      (previously only the primary template called validateRegions).
    - Default-OFF contract UNCHANGED: cnpgPair.enabled=false renders
      ZERO resources on BOTH sides (byte-identical empty render).
    - The replica side still mounts the primary's `-replication` /
      `-ca` Secrets for streaming auth; on separate clusters those
      Secrets must be synced cluster-A → cluster-B (ESO/reflector per
      the per-Sovereign overlay) — contract unchanged from 0.1.x,
      now explicit because the sides live on different clusters.

  0.1.4 (2026-06-11, kyverno-Enforce compliance re-cut, Refs #3236 / #2737)
    - The cnpgPair gate flipped TRUE for the first time on hw126 (#3238),
      so the chart's auxiliary workloads reached kyverno Enforce admission
      for the first time in history. The `failover-readiness` Deployment
      was DENIED on four baseline policies; this re-cut makes every
      rendered container compliant:
        • cilium-l7-mtls: added `policy.cilium.io/enforced: "true"` to the
          failover-readiness Pod template labels.
        • probes-present: the probe container now declares BOTH a
          livenessProbe (heartbeat /tmp/alive freshness — proves the poll
          loop is not wedged) AND the existing readinessProbe (/tmp/ready
          — promotability). The two probes answer different questions, so
          a lagging-but-healthy replica no longer kills the probe Pod.
        • harbor-proxy-pull + image-tag-pinned: the default
          `cnpgPair.image.repository` is now
          `harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql`
          (matching the slot-16b override and every sibling CNPG chart);
          the required-tag fail-fast already bars `:latest`.
      Also re-tagged the helm-test `test-replication` Pod image to the same
      Harbor proxy prefix (helm-test Pods are NOT Flux-reconciled, but the
      prefix is fixed for consistency + manual-`helm test` admission).
    - The CNPG primary/replica `Cluster` CRs are NOT kyverno-matched (the
      `Cluster` kind is absent from every baseline policy `kinds:` list),
      so their `imageName` is left to the shared `cnpgPair.imageRef` helper
      — which now resolves to the Harbor proxy prefix anyway.
    - Default-OFF contract UNCHANGED: a disabled (single-region) install
      still renders ZERO resources, byte-identical to 0.1.3.

  0.1.3 (2026-06-10, Pillar-3 bootstrap-kit enablement, Refs #3195 / #3189)
    - New `templates/continuum.yaml`: optional production
      `Continuum.dr.openova.io/v1` CR seed pointing at THIS cluster-
      pair, gated `continuum.enabled` (default false) AND
      `cnpgPair.enabled`. Closes G6 of the Pillar-3 gap analysis (no
      Continuum CR seeded → continuum-controller idle). Distinct from
      the qaFixtures Continuum CR (QA-only). The Continuum CRD's strict
      4-segment region pattern forces a SEPARATE region seam
      (`continuum.primaryRegion` / `continuum.hotStandbyRegion`,
      canonical `hz-fsn-rtz-prod` form) from the cnpg-pair node-region
      labels (Huawei multi-segment `hw-me-east-215-a-rtz-prod`) — same
      split as the QA-fixtures cnpgPairPrimaryRegion vs primaryRegion.
      Fail-fast on empty continuum regions when continuum.enabled=true.
    - Default-OFF on BOTH new gates — a single-region or continuum-less
      install renders ZERO additional resources (byte-identical).
    - Shipped via the new bootstrap-kit slot 16b-bp-cnpg-pair.yaml,
      gated ${SOVEREIGN_ENABLE_HOT_STANDBY:-false} so single-region
      provs are unchanged. (chart templates themselves unchanged for
      the primary/replica/audit/probe path.)

  0.1.2 (2026-05-20, Pillar 3 zero-tx-loss fix, Refs #2064)
    - Default replication MODE is now SYNCHRONOUS
      (`replication.mode: sync` + `synchronous_commit: remote_apply`
      + `synchronous_standby_names: FIRST 1 (<replica>)`). The
      asynchronous-streaming default in chart 0.1.1 could not honour
      the canonical Pillar 3 claim of "zero transactions lost" on
      region-kill failover; chart 0.1.2 closes that gap.
    - New configSchema knob `replication.mode` (sync|async,
      default sync) + `replication.sync.commit` + `.sync.numSync`.
    - `async` mode kept for forensic / lab use only; production
      deployments MUST stay on `sync`. See DESIGN.md §7 for the
      failure-mode disclosure (replica-unreachable → primary blocks
      writes, replica RTT → per-commit latency tax).
    - Render-gate test extended: assert `synchronous_commit` +
      `synchronous_standby_names` present on primary by default;
      assert both ABSENT when `replication.mode=async`.

  0.1.1 (2026-05-09, qa-loop iter-6 fix-33, #1101)
    - Fix: drop hand-rendered service-replication.yaml; the replication
      Service is now declared via primary CNPG Cluster's
      `spec.managed.services.additional` so CNPG owns it (resolves
      "refusing to reconcile service: <name>-r, not owned by the cluster"
      caught live on omantel-fsn 2026-05-09 — Phase-2 incident #3).
    - Fix: remove `hot_standby: "on"` from both Cluster CRs'
      postgresql.parameters (PG16 hard-pins it; CNPG rejects explicit
      set with phase "Unable to create required cluster objects").
    - Fix: add `bootstrap.pg_basebackup` to replica Cluster CR so the
      replica actually pulls the initial heap from the primary
      (without it the replica phase stuck at "Setting up primary").
    - Add: helm test asserting primary readiness, -mesh Service exists
      with Cilium global annotation, and pg_isready against -rw endpoint.
    - Render-gate test: expected resource count 8 → 7 (Service removed).

  0.1.0 (2026-05-09, slice C-DB-1, #1101)
    - Initial chart: primary + replica + replication Service +
      failover-readiness Pod + NetworkPolicy + audit-config ConfigMap.
    - Default-OFF (`cnpgPair.enabled: false`).
    - Fail-fast on empty `image.tag` per Inviolable Principle #4a.
