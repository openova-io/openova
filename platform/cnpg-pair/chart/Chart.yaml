# 0.2.18 (#5245): region-kill FAILBACK — the DR chain gains its missing return
# leg. hw275 G12 (dep 7886def2e61c63aa, 2026-07-19): after a CLEAN forward
# promote (region-B writable TL2, latched), recovering region-A did NOT
# converge — region-A resumed its OLD TL1 primary role (it never knew it was
# killed), region-B could never re-stream ("highest timeline 1 of the primary
# is behind recovery timeline 2" walreceiver FATAL every 5s, forever), and the
# HR stayed suspend-latched: cross-region replication permanently dead, no
# actor anywhere owned the failback. FOUR pieces:
# (1) LATCH DURABILITY (root cause of the observed re-demote): every actor
#     write now uses a CUSTOM --field-manager (dr-promoter / dr-failback).
#     kustomize-controller's managed-fields cleanup REPLACES kubectl-prefixed
#     managers with itself on EVERY reconcile and drops the claimed fields
#     absent from its manifest — hw275 live-proof: kustomize Apply 06:55:20
#     stripped spec.suspend → helm redeployed reverted values 06:55:23 (the
#     mid-recovery RE-DEMOTE, release v4) → self-heal re-latched 06:55:27; 19
#     re-latches in 30 min; the HR's dr-auto-promoted-at annotation was
#     stripped the same way. Custom managers are not in the cleanup list
#     (live precedent: catalyst-api's substitute flips persist).
# (2) DURABLE HANDOFF + LATCH LIFT: the suspend latch stays the mid-outage
#     mechanism (helm-only, no source dependency), but once the promotion is
#     latched+rendered the actor writes it into the SOURCE — bootstrap-kit
#     Kustomization postBuild.substitute SOVEREIGN_CNPG_PAIR_PROMOTED="true"
#     (slot 16b renders `promoted: ${SOVEREIGN_CNPG_PAIR_PROMOTED:-false}`) —
#     verifies the HR renders promoted=true, then UNSUSPENDS. Drift-correction
#     now RE-AFFIRMS the promotion and flux is fully reconciled again (no
#     forever-frozen HR). Self-heal re-latches if the substitute is ever lost.
# (3) TL-AHEAD RE-PROMOTE (state-X recovery, the #5220-B wedge made
#     actionable): a standby whose OWN timeline is strictly HIGHER than its
#     reachable source's (IDENTIFY_SYSTEM arithmetic — readable by
#     streaming_replica via the replication protocol, no pg_control privileges)
#     holds every acknowledged commit (pre-divergence it was the mandatory
#     remote_apply sync target; post-divergence the lower-TL side is
#     write-fenced by its unsatisfiable FIRST 1). The promoter re-promotes it
#     through the substitute seam — bypassing the #5220 arm gate (a TL-ahead
#     standby can never stream, so it could never arm; the TL arithmetic is a
#     strictly stronger proof no link flap can manufacture), max once per pod
#     lifetime, never after /shared/diverged (the hw266 runaway guard holds).
# (4) dr-failback ACTOR (side=primary, NEW): detects the post-failover
#     geometry from region-A — local writable on TL n + the pinned sync
#     standby ABSENT + the peer REACHABLE, WRITABLE and on a HIGHER timeline
#     over the NEW `-replica-mesh` global Service (reverse mirror of
#     `-primary-mesh`: CNPG-managed rw Service on the replica Cluster + a
#     zero-backend stub on cluster-A) — then demotes + RE-CLONES region-A onto
#     region-B's line: flips substitute SOVEREIGN_CNPG_PAIR_DEMOTED="true"
#     (slot 16b → `primary.demoted`), waits for kustomize to render, and
#     deletes the stale Cluster CR so helm re-creates it as a pg_basebackup
#     replica of region-B (primary-cluster.yaml demoted shape: replica cluster
#     + externalCluster over `-replica-mesh`, synchronous block omitted).
#     Direction is fixed by the data: sync remote_apply + FIRST 1 pinned +
#     dataDurability:required means region-B ⊇ every acked commit region-A
#     ever made (post-recovery region-A is write-fenced by the same
#     unsatisfiable FIRST 1) — only never-acked WAL is discarded, which RPO=0
#     already discards; re-cloning region-B from region-A would destroy acked
#     post-promote writes and is never automatic. pg_rewind is deliberately
#     not used (no CNPG cross-cluster trigger; basebackup is deterministic for
#     every WAL-tail geometry). Destruction is bounded: delete only the
#     resourceNames-pinned Cluster CR (PVCs owner-GC), only with a <60s-fresh
#     peer-writable-and-ahead proof, and a fresh clone is NEVER deleted (wedge
#     escalation only re-clones a CR predating the failback episode). AUTH:
#     the rejoin stream + peer probe present region-A's own
#     `-primary-replication` cert, accepted by region-B because the replica
#     Cluster now pins certificates.clientCASecret to the SHARED `-primary-ca`
#     (already synced A→B with ca.key at the post-mesh flip, live-verified
#     hw275; CNPG generates `<replica>-replication` from a BYO client CA when
#     replicationTLSSecret is unset — cluster_pki.go — so every existing
#     consumer keeps its mounts).
# End state after a kill+recover cycle: region-B primary / region-A streaming
# replica, both HRs unsuspended, desired state at the source. The controlled
# switchback to original roles stays a sovereign-admin action (RUNBOOKS §6.1).
# Forward-path gates ALL unchanged: #5220 arm gate, #5239 readable signals,
# #5218 same-tick latch, 120s hold, pg_isready gate, startup grace, sync-only
# fence. New values: primary.demoted, primary.failback.{enabled,intervalSeconds,
# peerAheadHoldSeconds,startupGraceSeconds,livenessProbeTimeoutSeconds,
# wedgeHoldSeconds,kustomization,hr,kubectlImage},
# replica.autoPromote.kustomization. Side=primary gains the `-replica-mesh`
# stub Service always (+1) and the dr-failback stack when peers are wired
# (+7). Validation REQUIRES a fresh 2-region prov kill+recover G12 (the
# failback only reproduces via a real kill + os-start recovery). Lockstep slot
# 16b pin → 0.2.18.
# 0.2.17 (#5239): dr-promoter ARM GATE never armed — the #5220 steady-state arm
# gate detected "streaming" via `pg_stat_wal_receiver WHERE status = 'streaming'`,
# but the signals container authenticates as `streaming_replica` (client cert),
# which lacks pg_read_all_stats/pg_monitor, so PostgreSQL NULLs the privileged
# columns of pg_stat_wal_receiver for it — `status` is ALWAYS NULL (live-confirmed
# hw274: pg_has_role('streaming_replica','pg_read_all_stats','MEMBER')=f;
# SELECT status FROM pg_stat_wal_receiver → NULL). The `status = 'streaming'`
# predicate was therefore NEVER true → the pair NEVER armed → /shared/armed never
# written → #5220's actor REFUSED every promote → a real region-kill would NOT
# fail over (DR failover dead on every env, worse than the #5220 false-promote it
# replaced). A GRANT is NOT a clean fix: `streaming_replica` is a CNPG RESERVED
# role (barred from spec.managed.roles) AND does not yet exist at initdb
# postInitSQL time (ConfigureNewInstance runs postInitSQL BEFORE the operator
# creates streaming_replica), so a GRANT would fail and wedge the whole primary
# bootstrap of the platform's shared-pg. Fix: detect "streaming" with objects
# EVERY role can read on a standby — a live pg_stat_wal_receiver ROW (its `pid`,
# hence EXISTS, is visible to all; only the detail columns are NULLed) AND
# pg_last_wal_receive_lsn() IS NOT NULL (both PUBLIC-executable). The row-EXISTS
# guard neutralises the one hazard of pg_last_wal_receive_lsn() (its value
# persists after a receiver stops): the view holds a row ONLY while a walreceiver
# process is live, so requiring BOTH is a true "streaming right now" signal that
# resets the instant the receiver dies. Everything else in #5220/#5219/#5178 is
# UNCHANGED (the arm window, the same-tick suspend latch, the refuse-while-unarmed
# guard, the timeline-divergence surfacing) — only the streaming signal is made
# readable by the probe role. No resource-count/RBAC/env change (script only).
# Lockstep slot 16b pin → 0.2.17.
# 0.2.16 (#5220): dr-promoter FALSE-POSITIVE fix — steady-state ARM gate +
# timeline-divergence surfacing. On hw273 G12 the 0.2.15 promoter FALSE-PROMOTED
# region-B during a TRANSIENT region-A unreachability (primary restart-storm +
# cross-region WAL-stream blip during convergence) while region-A stayed ALIVE on
# timeline 1, and #5219's durable suspend latch then CEMENTED the false promotion
# permanently (region-B TL2, walreceiver FATAL-loop forever, region-A sync-wedged
# on the never-connecting standby). Root cause: every liveness signal the
# region-B promoter has (the cnpg WAL stream, the pg_isready of `-primary-mesh`)
# rides the SAME region-B→region-A datapath, so a link flap is indistinguishable
# from a real death over that link — the #5178 pg_isready gate false-positived
# identically, and the #5178 startup grace (a FIXED timer from pod start) had
# already expired when the restart-storm hit minutes into the env's life. TWO
# fixes: (A) ARM GATE — the actor is INELIGIBLE to promote until the signals
# container has OBSERVED region-B's replica actively STREAMING from region-A
# (walreceiver status=streaming) CONTINUOUSLY for steadyStateArmSeconds (180s). A
# region-A-down signal BEFORE the first stable stream is a convergence-time
# transient, never a real kill; a pair that never reached steady-state can never
# promote, so #5219's latch can never cement a false positive (this kills the
# hw273 class at the source). Once armed it stays armed for the pod's life — a
# real region-A death AFTER steady-state promotes normally. (B)
# TIMELINE-DIVERGENCE SURFACING — a standby that can NEVER re-stream from a
# REACHABLE region-A for timelineDivergenceHoldSeconds (300s) is recorded ONCE on
# the HR (dr-timeline-diverged-at) + logged loudly, so the wedge is DIAGNOSED +
# monitored instead of a silent FATAL loop. The re-clone stays the operator's
# RUNBOOKS §6.1 action (NON-destructive here): a 2-node actor cannot prove WHICH
# side is authoritative, so auto-destroying region-B's PGDATA could lose a real
# survivor's committed writes — a worse failure than the wedge. #5219's durable
# suspend latch + the 120s primaryDownHold + the region-A pg_isready gate + the
# sync-only fence are ALL unchanged. No resource-count or RBAC change (the signals
# container gains 2 env vars; script logic only). Lockstep slot 16b pin → 0.2.16.
# 0.2.15 (#5218): dr-promoter durable-suspend RACE fix — on hw271 G12 the promote
# fired at T0+2m29s (region-B writable, TL2) but was RE-DEMOTED mid-outage (a
# second "primary loss" re-detected ~T0+7m while region-A was still down), so the
# survivor latched as a diverged TL2 standby and the failover effectively failed.
# The 0.2.14 latch suspended the HR only on the NEXT actor tick (up to a full
# intervalSeconds after the promote), leaving a window in which kustomize-
# controller's SSA re-apply reclaimed the atomic spec.values, dropped the nested
# `promoted` key, and helm re-rendered replica.enabled=true → re-demote. Fix: the
# actor now stays IN THE SAME TICK after flipping promoted=true — it polls until
# helm renders replica.enabled=false (bounded by promoteRenderWaitSeconds) and
# suspends IMMEDIATELY, collapsing the promote→suspend window to seconds; a
# per-tick SELF-HEAL latch re-asserts spec.suspend on every loop while the cluster
# is promoted/diverged (idempotent — re-freezes if anything un-suspends the HR);
# and a suspend_hr helper READBACK-VERIFIES every suspend and logs RBAC/conflict
# failures. The suspend is NEVER set before the render (a suspended HR is not
# reconciled by helm, so the promotion would never land). All 0.2.14 decision
# gates unchanged (120s hold, positive region-A pg_isready gate, sync-only render,
# startup grace, anti-flap divergence latch). No RBAC change (the flux-system Role
# already grants get+patch on the one HR). No resource-count change. Lockstep slot
# 16b → 0.2.15.
# 0.2.14 (#5178): dr-promoter regression fix — the 0.2.13 promoter FALSE-PROMOTED
# a healthy replica against a LIVE region-A and its promotion was NON-DURABLE, so
# on hw266 G12 it ran the region-B Postgres timeline away (TL2→TL25) and
# permanently broke cross-region replication. Two fixes: (A) POSITIVE region-A
# liveness gate — the signals container arms the promote clock ONLY when the LOCAL
# WAL receiver is ABSENT (catchup/starting/waiting count as ALIVE) AND a direct
# pg_isready of the `-primary-mesh` endpoint over the mesh is UNREACHABLE, plus a
# startupGraceSeconds window; region-A reachable + local stall ⇒ replication
# fault, DO NOT promote; no liveness path wired ⇒ observe-only (fail-safe). (B)
# durable + latched promotion — after helm renders the promote the actor SUSPENDS
# the HR (spec.suspend, a field flux's Kustomization does not own → survives
# drift-correction), and it NEVER re-promotes an already-diverged cluster
# (anti-flap). Adds one region-A egress rule to the dr-promoter-egress CNP (gated
# on crossRegionPeerClusters). No resource-count change. Lockstep slot 16b → 0.2.14.
