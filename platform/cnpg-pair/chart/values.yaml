# bp-cnpg-pair — Catalyst Blueprint values.
#
# Slice C-DB-1 of EPIC-6 (#1101). Active-hotstandby CNPG cluster-pair
# across two Hetzner regions, WAL streaming over Cilium ClusterMesh.
#
# Per docs/INVIOLABLE-PRINCIPLES.md:
#   #1 — target-state shape; ship full primary + replica + service.
#   #4 — never hardcode region/storageClass/imageRepo; everything is
#        operator-tunable via configSchema → Application.spec.parameters.
#   #4a — image SHA-pinned (no `:latest`); fail-fast on empty tag.

cnpgPair:
  # Default-OFF gate. Per ADR-0001 §9 the cluster-pair pattern is
  # opt-in per Application; the chart MUST render zero resources when
  # disabled so platform overlays can include it without side effects.
  enabled: false

  # ── Side — WHICH HALF of the pair this install renders (chart 0.2.0) ──
  # A 2-region Sovereign is TWO SEPARATE k8s clusters linked by Cilium
  # ClusterMesh (kom4dc mimics this with 2 VPCs) — NOT one stretched
  # cluster. Chart ≤0.1.x rendered BOTH Cluster CRs in one release and
  # relied on node-affinity to "schedule each side to its region", which
  # only works on a stretched cluster: on separate clusters the replica
  # Cluster + failover-readiness probe pinned to region-B labels can
  # NEVER schedule on cluster-A (hw126: FailedScheduling 0/4 nodes,
  # affinity requires openova.io/region=hw-me-east-215-b-rtz-prod).
  #
  # side=primary renders the region-A half ONLY:
  #   primary Cluster CR + `*-primary-mesh` global Service (via
  #   managed.services.additional) + audit-config ConfigMap (bp-continuum
  #   slot 62 runs on the primary cluster and prerequisite-probes this
  #   ConfigMap) + the replication-ingress NetworkPolicy + the optional
  #   Continuum CR + the helm-test resources.
  # side=replica renders the region-B half ONLY:
  #   replica Cluster CR (pg_basebackup + externalClusters streaming the
  #   primary's WAL over the ClusterMesh-global `-mesh` Service) +
  #   failover-readiness probe Deployment (its region-B affinity now
  #   matches the nodes it runs on) + the probe NetworkPolicies.
  #
  # The bootstrap-kit slot 16b stamps this from the per-region
  # SOVEREIGN_REGION_ROLE substitute (cloud-init), whose value domain is
  # primary|secondary (infra/providers/*/main.tf sovereign_region_role)
  # — the chart normalizes "secondary" to the replica side so the slot
  # can substitute the role verbatim. Accepted values:
  # primary | replica | secondary (≡ replica); anything else fails the
  # render.
  side: primary

  # ── Primary region ────────────────────────────────────────────────
  primary:
    # Hetzner region key (matches openova.io/region label on nodes per
    # G1 multi-region wiring). NEVER hardcode — operator passes this
    # via configSchema. Empty string with enabled=true triggers a
    # template-time `required` error.
    region: ""
    # ── DR FAILBACK demotion (#5245) — mirror of replica.promoted ────
    # When true, the side=primary Cluster CR renders as a REPLICA
    # CLUSTER of region-B (replica.enabled:true + bootstrap.pg_basebackup
    # + externalClusters streaming region-B's promoted primary over the
    # `-replica-mesh` global Service), and the synchronous block is
    # OMITTED (a standby carries no sync fence). This is the region-A
    # rejoin shape after a region-kill promote: the recovered region-A
    # must DISCARD its stale timeline and re-clone onto region-B's
    # promoted line — never the reverse (region-B's line ⊇ every
    # ACKNOWLEDGED commit, structurally: sync remote_apply + FIRST 1
    # pinned to the cross-region replica + dataDurability:required means
    # region-A could never ack a commit region-B lacked, before OR after
    # the kill — post-recovery region-A is write-fenced by the same
    # unsatisfiable FIRST 1).
    #
    # The durable channel for this flag is the bootstrap-kit
    # Kustomization postBuild substitute SOVEREIGN_CNPG_PAIR_DEMOTED
    # (slot 16b renders `demoted: ${SOVEREIGN_CNPG_PAIR_DEMOTED:-false}`),
    # patched by the dr-failback actor with its own field manager —
    # kustomize-controller then renders the demotion as ITS OWN desired
    # state, so drift-correction RE-AFFIRMS it (no suspend latch needed
    # on this side; see the #5245 latch-durability note in dr-promoter).
    demoted: false
    # ── Region-A automatic DR FAILBACK (#5245) ───────────────────────
    # hw275 G12 proved the failback leg was missing: after a clean
    # forward promote (region-B TL2) and a region-A recovery, region-A
    # resumed its OLD TL1 primary role and region-B could never
    # re-stream ("highest timeline 1 of the primary is behind recovery
    # timeline 2" FATAL loop) — cross-region replication permanently
    # dead. failback ships a region-A-local actor (side=primary only)
    # that detects the post-failover geometry from POSITIVE signals
    # (local writable on TL n; the pinned sync standby absent; the peer
    # REACHABLE + WRITABLE + on an EQUAL-OR-HIGHER timeline over the
    # `-replica-mesh` global Service — 0.2.19 #5245 hw277: region-A's
    # os-start HA failover bumped it to the SAME TL as region-B's
    # promote, so the 0.2.18 strictly-higher gate deadlocked in a
    # 57-minute split-brain) and then demotes + RE-CLONES region-A onto
    # region-B's line via the SOVEREIGN_CNPG_PAIR_DEMOTED substitute
    # seam. The one destructive act (deleting the local stale Cluster
    # CR so helm re-creates it as a pg_basebackup replica of region-B)
    # is gated on the peer being PROVABLY writable + equal-or-ahead at
    # that exact tick — the sync fence (FIRST 1 + dataDurability:
    # required), not the bare TL number, is the authority proof; the TL
    # bound only refuses the anomalous peer-BEHIND geometry.
    failback:
      enabled: true
      intervalSeconds: 10
      # The peer-ahead evidence (local primary + sync standby absent +
      # peer writable on an EQUAL-or-higher TL — hw277 #5245: a
      # strictly-higher gate is structurally unsatisfiable when the
      # recovered region's local failover matched the survivor's TL)
      # must hold CONTINUOUSLY this long before the actor flips the
      # demotion substitute. A transient mesh blip or a replica restart
      # clears the clock.
      peerAheadHoldSeconds: 120
      # A freshly-(re)started signals container must never act on a
      # half-observed geometry.
      startupGraceSeconds: 300
      # pg_isready timeout for the peer probe.
      livenessProbeTimeoutSeconds: 5
      # How long an in-place-demoted standby (a Cluster CR that CNPG
      # demoted in place, keeping its stale TL-n PGDATA) may sit unable
      # to stream from a writable+ahead peer before the actor escalates
      # to the re-clone (delete + fresh pg_basebackup). A fresh clone
      # created AFTER the failback started is NEVER deleted (bounded
      # destruction: at most one re-clone per failback episode).
      wedgeHoldSeconds: 600
      # The flux Kustomization whose postBuild.substitute map carries
      # the durable SOVEREIGN_CNPG_PAIR_DEMOTED flip (the catalyst-api
      # enableCNPGPairAfterFullMesh precedent — a custom field manager
      # on the Kustomization spec survives every reconcile).
      kustomization:
        name: bootstrap-kit
        namespace: flux-system
      # The region-A HelmRelease (annotations + reconcile nudges only —
      # the desired state itself rides the substitute).
      hr:
        name: bp-cnpg-pair
        namespace: flux-system
      # kubectl-bearing image for the actor container (same
      # harbor-proxy-pull-compliant prefix as the dr-promoter's).
      kubectlImage:
        repository: harbor.openova.io/proxy-dockerhub/alpine/k8s
        tag: "1.30.0"
        pullPolicy: IfNotPresent
    instances: 3
    storage:
      size: 100Gi
      # H6 (bp-hcloud-csi) provides this StorageClass. Per the seam
      # Cloud-agnostic (#3253 hw126 RCA): empty = the cluster's DEFAULT
      # StorageClass (local-path on k3s/Huawei). `hcloud-volumes` only
      # exists where bp-hcloud-csi runs — hardcoding it wedged every
      # non-Hetzner prov with "storageclass not found" (PVC Pending
      # forever). Hetzner overlays set it via the slot substitute.
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
    # Bootstrap the application database. Future slices may hoist
    # this into configSchema for per-Application names; for the
    # C-DB-3 acceptance-test we need a known database name.
    bootstrap:
      database: app
      owner: app

  # ── Replica region ────────────────────────────────────────────────
  # CNPG replica cluster — `replica.enabled: true` +
  # `bootstrap.pg_basebackup` + an `externalClusters[]` entry pointing
  # at the primary region's replication endpoint. The replication
  # endpoint is the `<name>-primary-mesh` Service that CNPG creates
  # from the primary Cluster CR's `spec.managed.services.additional`
  # block (chart 0.1.1) — annotated `service.cilium.io/global: "true"`
  # so Cilium ClusterMesh publishes it across every connected peer.
  replica:
    region: ""
    # ── DR failover promotion (#5125 Defect-1) ──────────────────────
    # When true, the replica Cluster CR renders `replica.enabled: false`
    # → CNPG promotes it to a writable primary. Region-kill failover
    # MUST flip this on the region-B HelmRelease's DESIRED state
    # (`spec.values.cnpgPair.replica.promoted: true`), never by
    # `kubectl patch`-ing the live Cluster CR: a live-object patch is
    # reverted by flux drift-correction mid-outage (hw256 G12), silently
    # re-demoting the survivor. Driving it through HR values makes the
    # failover the desired state so drift-correction re-affirms it.
    # See RUNBOOKS.md §6.1 (region-kill failover) + replica-cluster.yaml.
    promoted: false
    # ── Region-B AUTOMATIC DR promotion (#5137) ─────────────────────
    # hw261 G12 proved the DR orchestrator (Continuum controller + dr
    # CR) is single-region: it dies WITH the killed primary region, so
    # nothing acted on a promotable standby — the operator promoted by
    # hand. autoPromote ships a region-B-local actor (side=replica
    # only, like failover-readiness) that survives region-A loss:
    #   Deployment `<fullname>-dr-promoter` — a continuous loop
    #   (Deployment NOT CronJob, #5157: a CronJob's scheduler dies
    #   with the region) with two containers:
    #     signals — psql (streaming_replica cert, #5133 auth) against
    #       the LOCAL replica -rw for pg_stat_wal_receiver state, PLUS
    #       (#5178) a POSITIVE region-A liveness probe: a direct
    #       pg_isready of the `-primary-mesh` endpoint over the
    #       ClusterMesh (the SAME source the replica streams from). It
    #       arms the promote clock ONLY when the local WAL stream is
    #       absent AND region-A is genuinely unreachable — a local
    #       stream stall with region-A still reachable is a REPLICATION
    #       fault, never a region kill, so it does NOT promote.
    #     actor  — when the region-A-loss clock has held for
    #       primaryDownHoldSeconds AND the failover-readiness probe is
    #       Ready (LSN apply==receive, promotable) AND the local
    #       Cluster CR is still a replica AND the HR value is not
    #       already promoted AND the cluster has NOT already diverged, it
    #       merge-patches the region-B
    #       HelmRelease DESIRED state
    #       (spec.values.cnpgPair.replica.promoted: true — the exact
    #       RUNBOOKS §6.1 command / #5125-D1 seam). Flux then renders
    #       replica.enabled:false and CNPG promotes the survivor. The
    #       actor then LATCHES the promotion durable by suspending the HR
    #       (#5178 Defect-B — spec.suspend is a field flux's Kustomization
    #       does NOT own, so drift-correction can no longer revert the
    #       promoted release and flap the timeline away).
    # DATA SAFETY: only rendered when replication.mode=sync — with
    # remote_apply + FIRST 1 pinned to the cross-region replica +
    # dataDurability:required, the old primary cannot COMMIT while its
    # sync standby is unreachable or diverged, so automatic promotion
    # can never lose or fork committed data (RPO=0), partition or
    # kill alike. The operator-manual HR patch keeps working; the
    # actor no-ops when the value is already true.
    #
    # #5178 REGRESSION FIX (hw266 G12): the 0.2.13 promoter inferred
    # "region-A dead" from the LOCAL WAL receiver alone and false-promoted
    # a healthy replica against a live region-A, and the HR-value promote
    # was reverted by flux → a promote/demote TIMELINE-DIVERGENCE flap
    # (TL2→TL25). 0.2.14 adds (A) the positive region-A liveness gate +
    # startupGraceSeconds + treating catchup/starting/waiting receiver
    # states as alive, and (B) the durable suspend latch + anti-flap
    # divergence guard.
    autoPromote:
      enabled: true
      # Poll cadence for both containers.
      intervalSeconds: 10
      # The region-A-loss clock (local WAL stream absent AND region-A
      # unreachable) must hold CONTINUOUSLY this long before the actor
      # promotes. An intra-region primary restart / instance switchover
      # reconnects the receiver in seconds and clears the clock — 120s
      # keeps those events from triggering a cross-region promotion while
      # still auto-recovering a real region kill in ~2-4 min end-to-end.
      primaryDownHoldSeconds: 120
      # #5178 startup grace — a freshly-(re)started replica still
      # completing its first catchup (walreceiver absent/`starting`) must
      # NEVER trip the promote clock. For the whole grace window from
      # signals-container start the clock is held clear regardless of
      # receiver state. Must exceed a normal basebackup+catchup; 300s is
      # conservative for the C-DB-3 100Gi seed.
      startupGraceSeconds: 300
      # #5178 region-A liveness probe timeout (seconds) — the pg_isready
      # of the `-primary-mesh` endpoint. Kept short so a genuine region
      # kill is detected within the poll cadence; only a rc=2 (no
      # response) counts as unreachable, every other result fail-safes to
      # "region-A alive" (do NOT promote).
      livenessProbeTimeoutSeconds: 5
      # #5218 same-tick durable latch — after the actor flips the HR
      # DESIRED state (promoted=true) it stays IN THE SAME tick, polling the
      # local Cluster CR until helm has rendered replica.enabled=false, then
      # IMMEDIATELY suspends the HR. This collapses the promote→suspend gap
      # from a full intervalSeconds (the 0.2.14 next-tick latch) to seconds,
      # so kustomize-controller's SSA re-apply of the atomic spec.values
      # cannot reclaim the nested `promoted` key and re-demote the survivor
      # in the window. Bounds how long that in-tick poll waits for the render
      # (a slow helm-controller); if it is exceeded the per-tick self-heal
      # latch suspends the instant the render lands, so this is a ceiling on
      # the fast path, never a correctness dependency. Must exceed a normal
      # helm-controller reconcile of the promoted HR.
      promoteRenderWaitSeconds: 90
      # #5220 (A) steady-state ARM gate — the promoter is INELIGIBLE to
      # promote until the signals container has OBSERVED region-B's replica
      # actively STREAMING from region-A (walreceiver status=streaming) held
      # CONTINUOUSLY this long. A convergence-time transient — a primary
      # restart-storm, or a replica that has not streamed even once (the
      # hw273 #5220 false positive, which fired minutes into the env's life
      # while region-A stayed ALIVE on timeline 1) — must never look like a
      # region kill. Every liveness signal the promoter has (the cnpg WAL
      # stream, the pg_isready of `-primary-mesh`) rides the SAME region-B→
      # region-A datapath, so a link flap is indistinguishable from a real
      # death over that link; requiring an OBSERVED stable stream first is
      # what rules out the never-converged case. Once satisfied the promoter
      # latches ARMED for the pod's life — a real region-A death AFTER
      # steady-state promotes normally. Must exceed a couple of poll
      # intervals so a momentary streaming blip during churn never arms.
      steadyStateArmSeconds: 180
      # #5220 (B) timeline-divergence detection hold — a standby that cannot
      # re-stream from a REACHABLE region-A for this long is the
      # timeline-divergence wedge (region-B left the source timeline in a
      # prior promotion and can never stream from the lower-TL source:
      # "highest timeline N of the primary is behind recovery timeline N+1").
      # The signals container flags it and the actor records it ONCE on the
      # HR (dr-timeline-diverged-at) so the wedge is DIAGNOSED + monitored
      # instead of a silent FATAL loop. The re-clone stays the operator's
      # RUNBOOKS §6.1 action (NON-destructive here): a 2-node actor cannot
      # prove WHICH side is authoritative, so auto-destroying region-B's
      # PGDATA could lose a real survivor's committed writes. Must FAR exceed
      # a normal basebackup+catchup so a slow first stream is never
      # mis-flagged as a divergence.
      timelineDivergenceHoldSeconds: 300
      # The flux HelmRelease whose DESIRED state carries the promotion
      # (bootstrap-kit slot 16b defaults).
      hr:
        name: bp-cnpg-pair
        namespace: flux-system
      # ── #5245 durable-promotion handoff target ──────────────────────
      # The flux Kustomization that applies slot 16b. hw275 G12 proved
      # the #5219 suspend latch is NOT durable: kustomize-controller's
      # managed-fields cleanup claims every `kubectl*`-managed field on
      # each reconcile (fluxcd kustomization_controller.go — managers
      # matching the `kubectl` prefix are replaced and their fields,
      # absent from the manifest, are REMOVED), so `spec.suspend` +
      # the DR annotations were stripped every bootstrap-kit reconcile
      # and helm re-demoted the promoted survivor in the seconds before
      # the self-heal re-latched (hw275: kustomize Apply 06:55:20 →
      # helm re-demote 06:55:23 → re-latch 06:55:27). Two fixes ride
      # this value: (a) every actor patch now uses a CUSTOM field
      # manager (`dr-promoter`), which the cleanup list does not match,
      # so the latch survives; (b) once the promotion is rendered the
      # actor performs a DURABLE HANDOFF — it patches this
      # Kustomization's postBuild.substitute
      # SOVEREIGN_CNPG_PAIR_PROMOTED="true" so kustomize itself renders
      # `replica.promoted: true` into the HR desired state, verifies the
      # render, then LIFTS the suspend latch (the reconciled-topology
      # end state: flux fully unfrozen, drift-correction re-affirming
      # the promotion).
      kustomization:
        name: bootstrap-kit
        namespace: flux-system
      # kubectl-bearing image for the actor container. Same
      # harbor-proxy-pull-compliant (`*/proxy-*/*`) prefix as the
      # signals/postgres image so the whole Pod matches ONE kyverno
      # anyPattern glob (the #3195 single-source constraint).
      kubectlImage:
        repository: harbor.openova.io/proxy-dockerhub/alpine/k8s
        tag: "1.30.0"
        pullPolicy: IfNotPresent
    instances: 3
    storage:
      size: 100Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi

  # ── WAL streaming + promotability threshold ───────────────────────
  walStreaming:
    # Replica becomes promotable when its WAL lag (lastReplayedLSN
    # delta against primary's currentLSN) falls below this threshold.
    # The failover-readiness probe Pod consumes this value; Continuum
    # K-Cont-2 reads it back from the Cluster CR status before
    # initiating a switchover.
    targetLagSeconds: 30
    # Hard ceiling on probe wait — exceed this and the probe goes
    # NotReady, surfacing the lag in the UI's status panel.
    timeoutSeconds: 60

  # ── Replication MODE — sync (DEFAULT) vs async ────────────────────
  # CANONICAL PILLAR-3 CLAIM (CLAUDE.md §0): "zero transactions lost".
  # Asynchronous-streaming replication CANNOT meet this claim — any
  # in-flight transaction at primary-kill time is lost. Synchronous
  # replication (PostgreSQL `synchronous_commit = remote_apply` +
  # `synchronous_standby_names = "FIRST 1 (<replica>)"`) blocks the
  # primary's COMMIT until the replica has REPLAYED the WAL, which is
  # the bar required for zero-tx-loss on region-kill failover.
  #
  # Trade-off (must be disclosed to operators):
  #   - Every commit waits one round-trip to the replica region. On
  #     Hetzner FSN <-> HEL the RTT is ~10ms; on geographically
  #     distant pairs (e.g. EU <-> US) the RTT may reach ~100ms and
  #     EVERY transaction sees that latency.
  #   - If the replica is unreachable, the primary BLOCKS WRITES
  #     until the replica recovers (or the operator runs a documented
  #     `ALTER SYSTEM SET synchronous_standby_names = ''` break-glass
  #     to downgrade to async, with explicit RPO loss acceptance).
  #     This is by design — losing availability is the price of
  #     zero-tx-loss durability.
  #
  # Mode "async" exists for forensic / lab use only; production
  # deployments MUST run "sync" to honour the pillar.
  replication:
    mode: sync

    # Synchronous knobs — applied to the primary CNPG Cluster CR's
    # postgresql.parameters block when mode=sync.
    sync:
      # PostgreSQL synchronous_commit level. Options (least to most
      # durable):
      #   - "on"          (default for PG): WAL flushed to disk on
      #                    primary AND replica before COMMIT returns.
      #   - "remote_write": replica has received but not necessarily
      #                    flushed WAL to disk. Allows replica-side
      #                    OS crash to lose tx. NOT canonical.
      #   - "remote_apply": replica has REPLAYED the WAL (visible to
      #                    SELECTs on the replica) before COMMIT
      #                    returns. STRONGEST DURABILITY — canonical
      #                    for Pillar 3 zero-tx-loss.
      # Stick with remote_apply unless an overlay has a specific RPO
      # reason to relax.
      commit: remote_apply
      # Number of synchronous standbys required to acknowledge before
      # COMMIT returns. For a 2-region pair (primary + 1 replica),
      # 1 is canonical. Increase only when the topology has multiple
      # replicas in distinct fault domains.
      numSync: 1

  # ── Cilium ClusterMesh ────────────────────────────────────────────
  # Multi-region transport. Per ADR-0001 §9 ClusterMesh is the ONLY
  # canonical inter-region transport for replication traffic. Setting
  # this false disables the replication Service entirely; replica
  # would then need an out-of-band public endpoint, which is NOT
  # supported (failover-readiness probe will fail closed). Toggle
  # exists for forensic/debug isolation only.
  clusterMesh:
    enabled: true
    # Affinity hint for the global service: prefer local backends,
    # fall through to remote when local is absent. The replica region
    # has zero local backends with `cnpg-role=primary`, so traffic
    # crosses the mesh; the primary region keeps reads local.
    affinity: local

  # ── Audit (NATS) ──────────────────────────────────────────────────
  # The audit-config ConfigMap declares the NATS subject + audit-type
  # set this Blueprint emits when the failover-readiness state flips.
  # Continuum K-Cont-2 picks up these subjects via the same ConfigMap
  # to wire its replication-lag + switchover audit publisher.
  audit:
    nats:
      subject: catalyst.audit
      auditType: cnpg-pair
      # Event types this Blueprint contributes to the audit stream.
      # Continuum extends this list with continuum-switchover-* etc.
      eventTypes:
        - cnpg-pair-replica-promotable
        - cnpg-pair-replica-degraded
        - cnpg-pair-wal-lag-threshold-breach

  # ── Image (CNPG postgres image) ──────────────────────────────────
  # CNPG operator pulls the postgres binary image from this reference.
  # The TAG IS REQUIRED — empty triggers a template-time fail-fast.
  # Per Inviolable Principle #4a, production overlays MUST set a
  # SHA digest (not a floating tag); a versioned tag is acceptable
  # in pre-prod but cluster overlays should pin to digest.
  image:
    # harbor-proxy-pull compliant default (kyverno harbor-proxy-pull
    # ClusterPolicy, Enforce). The failover-readiness Deployment reaches
    # kyverno admission and is DENIED unless its image matches the
    # Sovereign-Harbor proxy glob `*/proxy-*/*`. This is the exact prefix
    # bp-gitea / bp-harbor / bp-powerdns / bp-postgres use for their CNPG
    # Clusters — a public image proxy-ghcr serves cred-free pre-cutover,
    # redirected to the local Harbor by cutover Step-04 post-handover.
    # The bootstrap-kit slot 16b already pins this same repository; the
    # default now matches so the standalone chart renders compliant too.
    repository: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql
    # REQUIRED — empty fails the render. Example pin:
    #   tag: "16.3-23"
    tag: ""
    pullPolicy: IfNotPresent

  # ── NetworkPolicy ────────────────────────────────────────────────
  # The platform default-deny CCNP (H8 seam) covers this namespace by
  # default; this overlay opens ONLY the replication path between the
  # two CNPG Cluster CR Pod selectors plus the failover-readiness
  # probe Pod. Toggle exists in case an overlay carries its own
  # NetworkPolicy stack.
  networkPolicy:
    enabled: true
    # The CNPG operator (cloudnative-pg) runs in this namespace and
    # polls EACH instance Pod's status web server to extract instance
    # status. A k8s NetworkPolicy selecting the instance Pods
    # default-denies all other ingress to them, so without an explicit
    # carve-out the operator's status probe is blocked and the Cluster
    # phase stalls at "Instance Status Extraction Error" (caught live on
    # hw126: primary 1/1 Running, phase = extraction error). These knobs
    # open the operator → instance status/metrics paths.
    operatorNamespace: cnpg-system
    # Instance manager status web server — the port the operator polls
    # for instance status/health (cloudnative-pg 1.29.0). NOT the
    # postgres 5432 port and NOT the metrics port.
    operatorStatusPort: 8000
    # Prometheus metrics exporter on each instance Pod. Opened from the
    # operator namespace too so a PodMonitor/serviceMonitor scraping from
    # cnpg-system (or the operator's own metrics collection) is not
    # default-denied once the gate flips ON.
    operatorMetricsPort: 9187
    # crossRegionPeerClusters (#4846) — the Cilium ClusterMesh cluster.name(s)
    # of the PEER region('s) cluster, allowed to reach the pair's 5432 for
    # cross-region replication. REQUIRED: the podSelector `cnpg.io/cluster=
    # <replica>` rule above claims to match "regardless of source cluster", but
    # k8s NetworkPolicy pod/namespace selectors are implicitly local-cluster-
    # scoped (Cilium ANDs io.cilium.k8s.policy.cluster=<local>), so ClusterMesh
    # REMOTE-cluster Pods (the region-b replica streaming from + pg_basebackup'
    # ing the region-a primary) are NEVER matched → default-denied → the replica
    # wedges "Creating a new replica" (hw130 24h wedge).
    #
    # The #4846 fix FIRST tried an `ipBlock: {cidr}` here, but that is INERT for
    # ClusterMesh traffic: a k8s-netpol `ipBlock` matches ONLY a CIDR identity,
    # which Cilium assigns SOLELY to IPs that are NOT known endpoints. A
    # ClusterMesh remote pod IS a known endpoint carrying its own pod security
    # identity, so the ipBlock is never consulted → `match none` → deny (proven
    # with cilium-dbg on hw228). The CORRECT admission is an identity-based
    # CiliumNetworkPolicy whose `fromEndpoints` selects the peer cluster(s) by
    # the `io.cilium.k8s.policy.cluster` label — this exact shape made region-b→
    # region-a pg_isready + the DR basebackup succeed on hw228. The bootstrap-kit
    # wires this to the peer region's ClusterMesh name(s)
    # (SOVEREIGN_PEER_CLUSTERMESH_NAMES, stamped by catalyst-api at the post-mesh
    # cnpg-pair flip). EMPTY → no CiliumNetworkPolicy.
    crossRegionPeerClusters: []

  # ── Continuum DR contract seed (#3195, Refs #3189) ────────────────
  # When `continuum.enabled: true` AND `cnpgPair.enabled: true`, the
  # chart also renders a `Continuum.dr.openova.io/v1` CR that points at
  # THIS cluster-pair, so the continuum-controller (bp-continuum slot
  # 62) has a production DR contract to reconcile instead of sitting
  # idle. This is the production analogue of the QA-fixtures Continuum
  # CR (which is qaFixtures-gated, QA-only). Default-OFF so a cnpg-pair
  # installed without a running continuum-controller does not emit an
  # orphan CR; the bootstrap-kit slot flips it true in lockstep with
  # the cnpg-pair enable gate (both ride ${SOVEREIGN_ENABLE_HOT_STANDBY}).
  #
  # The CRD (dr.openova.io/v1.Continuum) ships with bp-catalyst-platform
  # (slot 13) — render only succeeds once that CRD is installed; the
  # bootstrap-kit sequences slot 13 well before slot 16b.
  continuum:
    enabled: false
    # Logical Application this DR contract protects. For the platform-
    # level cluster-pair this is the platform control plane itself.
    applicationRef: catalyst-platform
    # ── Continuum CR region labels — DISTINCT seam from the cnpg-pair
    # node-region labels above ──────────────────────────────────────
    # The Continuum CRD validates primaryRegion / hotStandbyRegions
    # against the strict 4-segment pattern `^[a-z]+-[a-z]+-[a-z]+-[a-z]+$`
    # (e.g. `hz-fsn-rtz-prod`). The cnpg-pair `cnpgPair.primary.region`
    # values are the `openova.io/region` NODE label, which on Huawei is a
    # multi-segment code (`hw-me-east-215-a-rtz-prod`) that does NOT match
    # the Continuum pattern. So the Continuum CR carries its OWN canonical
    # 4-segment region labels — exactly the QA-fixtures split
    # (cnpgPairPrimaryRegion=fsn1 vs primaryRegion=hz-fsn-rtz-prod). These
    # MUST be set (canonical 4-segment) before continuum.enabled=true;
    # leaving them empty trips the chart's continuum-region fail-fast.
    primaryRegion: ""
    hotStandbyRegion: ""
    # rto / rpo SLO targets. Pillar-3 canonical: RTO 30s, RPO 0 (sync
    # WAL). rpoSeconds=0 asserts zero-tx-loss; the controller gates the
    # promote step on WAL-lag below this before flipping primary.
    rto: "30s"
    rpo: "0s"
    rtoSeconds: 30
    rpoSeconds: 0
    # autoFailover stays FALSE by default — a region-kill promote is an
    # operator-confirmed action until the lease-witness + multi-vantage
    # DNS probe are validated on a fresh 2-region prov (Phase-2 walk).
    autoFailover: false
    # Lease witness — k8s-lease (#3829) is the air-gappable DEFAULT: a
    # native coordination.k8s.io/v1 Lease in the control-plane cluster,
    # zero external dependency, durable etcd-backed CAS. This replaces
    # the dns-quorum default, which was a never-completed Phase-1 POC
    # (nil TXTWriter → every Acquire failed) wired against placeholder
    # resolvers (10.43.0.11/.12 aren't DNS servers) → the cnpg-pair
    # Continuum CR sat Degraded/LeaseHeld=False forever on omantel.biz.
    # The continuum-controller ClusterRole already grants
    # coordination.k8s.io/leases {get,list,...,create,update}, so no RBAC
    # change is needed. The Lease object lands in the controller's
    # namespace (override via leaseClient.namespace).
    leaseClient:
      kind: k8s-lease
      ttlSeconds: 30
      renewSeconds: 10
    # PDM zone for the lua-record flip target. Empty => the controller
    # falls back to the in-cluster pool-domain-manager Service default.
    pdmZone: ""
