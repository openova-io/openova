apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-cnpg-pair
  labels:
    catalyst.openova.io/companion: bp-cnpg
spec:
  # 0.2.9 (#4846): cross-region DR admission is an identity-based
  # CiliumNetworkPolicy (io.cilium.k8s.policy.cluster) — the 0.2.8 ipBlock was
  # inert for ClusterMesh remote endpoints. values crossRegionPeerClusters.
  # 0.2.11 (#5133): failover-readiness probe no longer false-negatives on a
  # caught-up SYNCHRONOUS standby — authenticates as streaming_replica (the
  # postgres superuser is disabled) and measures apply lag via LSN
  # receive-vs-replay (idle- + region-kill-safe). Unblocks region-kill DR
  # promotion (Pillar 3).
  # 0.2.13 (#5137): region-B AUTOMATIC DR promotion — side=replica renders a
  # dr-promoter Deployment (#5157 shape) that survives region-A loss: when the
  # WAL stream is dead ≥ hold AND failover-readiness is Ready, it patches the
  # region-B HR desired state (replica.promoted=true, the #5125-D1 seam) so
  # CNPG promotes the survivor with ZERO operator action. sync-mode-only
  # (the remote_apply/dataDurability fence is the anti-split-brain arbiter).
  # 0.2.14 (#5178): dr-promoter regression fix — (A) a POSITIVE region-A
  # liveness gate (pg_isready of `-primary-mesh` over the mesh) + startup grace
  # so the actor no longer false-promotes a healthy replica against a live
  # region-A, and (B) a durable SUSPEND latch + anti-flap divergence guard so a
  # real promotion sticks instead of flapping the timeline away (hw266 G12).
  # 0.2.15 (#5218): dr-promoter durable-suspend RACE fix — on hw271 G12 the
  # promote fired but was re-demoted mid-outage because the 0.2.14 latch only
  # suspended the HR on the NEXT actor tick, leaving a window for kustomize to
  # revert spec.values and re-render replica.enabled=true. The actor now
  # suspends IN THE SAME TICK as the promote (once helm renders) and re-asserts
  # spec.suspend every loop while promoted/diverged (self-heal), with readback
  # verification. All decision gates unchanged.
  # 0.2.16 (#5220): dr-promoter FALSE-POSITIVE fix — on hw273 G12 the 0.2.15
  # promoter false-promoted region-B during a transient region-A blip while
  # region-A stayed ALIVE on TL1, and #5219's suspend latch cemented it (region-B
  # TL2, walreceiver FATAL-loop forever). (A) an ARM GATE makes the actor
  # ineligible to promote until it has OBSERVED continuous streaming steady-state
  # (steadyStateArmSeconds) — a never-converged pair can never promote, so the
  # latch never cements a false positive; (B) a persistent can't-re-stream wedge
  # is SURFACED on the HR (dr-timeline-diverged-at), the re-clone staying the
  # operator's RUNBOOKS §6.1 action (non-destructive). #5219 latch + 120s hold +
  # pg_isready gate + sync fence unchanged.
  # 0.2.17 (#5239): the #5220 arm gate NEVER armed — it read "streaming" from
  # pg_stat_wal_receiver.status, unreadable to the streaming_replica probe role
  # (no pg_read_all_stats → status ALWAYS NULL, live-confirmed hw274), so the pair
  # never armed and the actor refused every promote (DR failover dead). Fix:
  # detect streaming from PUBLIC-readable signals — a live pg_stat_wal_receiver
  # ROW (EXISTS visible to all) AND pg_last_wal_receive_lsn() non-null. A GRANT
  # was not viable (streaming_replica is CNPG-reserved and absent at postInitSQL
  # time). All #5220/#5219/#5178 gates unchanged; script-only.
  # 0.2.18 (#5245): region-kill FAILBACK — the missing return leg. hw275 G12:
  # after a clean forward promote, recovered region-A resumed its stale TL1
  # primary role while promoted region-B FATAL-looped as a TL2 standby —
  # replication permanently dead. (1) latch durability: every actor write uses
  # a custom --field-manager (kustomize's managed-fields cleanup strips
  # kubectl-managed fields each reconcile — the observed mid-recovery
  # re-demote); (2) durable handoff: the promotion moves into the
  # bootstrap-kit Kustomization substitute SOVEREIGN_CNPG_PAIR_PROMOTED and
  # the suspend latch is LIFTED once source-rendered; (3) TL-ahead
  # re-promote: a standby provably ahead of its reachable source
  # (IDENTIFY_SYSTEM arithmetic) re-promotes through the substitute seam;
  # (4) NEW side=primary dr-failback actor: on a held peer-writable-and-ahead
  # proof it demotes region-A (SOVEREIGN_CNPG_PAIR_DEMOTED → the primary
  # Cluster renders as a pg_basebackup replica of region-B over the new
  # `-replica-mesh` global Service) and re-clones the stale line — bounded
  # destruction, sync-fence data-safety (region-B ⊇ every acked commit).
  # Shared client CA on the replica Cluster (clientCASecret=-primary-ca) lets
  # region-A's own cert authenticate the rejoin stream.
  # 0.2.19 (#5245): dr-failback TL-EQUALITY deadlock + fail-loud peer probe.
  # hw277 G12 live-proved the 0.2.18 failback wedge is NOT DNS (the
  # `-replica-mesh` stub existed on cluster-A since install and the bare name
  # resolves from the actor pod — the same proven form the WAL path uses):
  # region-A's os-start HA failover bumped its timeline to the SAME number as
  # region-B's promote (TL2==TL2), so the strict TL_peer>TL_local gate was
  # structurally unsatisfiable → 57-minute split-brain until region-B's
  # independent TL-ahead re-promote broke the tie; the chain then converged
  # end-to-end. Fixes: (1) TL gate `>` → `>=` — the sync fence, not the TL
  # number, is the authority proof (side gating + promoter anti-flap carry
  # the single-actor asymmetry; peer-BEHIND stays fail-safe + loud);
  # (2) fail-loud peer probe: NXDOMAIN / unreachable / in-recovery /
  # TL-unreadable / TL-behind each log on transition + ~5-min heartbeat —
  # no more silent wedge. Script-only; no schema/RBAC/resource delta.
  # 0.2.20 (#5245): dr-failback RE-CLONE CONVERGENCE — the hw278 residual.
  # hw278 G12 live-proved the 0.2.19 chain fires clean (demote at 122s held
  # on the -ge gate, wedge escalation + bounded delete at +10min) and the
  # RE-CLONE ITSELF then wedged silently for 5+ hours: the pgbasebackup
  # bootstrap FATAL-looped on `x509: certificate signed by unknown
  # authority` (the demoted externalCluster pinned sslRootCert to region-A's
  # OWN -primary-ca while the dialed server is region-B's replica Cluster,
  # signed by region-B's own -replica-ca — libpq/pgx upgrade sslmode=require
  # to verify-ca whenever a root cert IS supplied), and the Cluster-CR
  # delete had GC'd the CNPG-issued PKI Secrets so a FRESH CA orphaned
  # region-B's synced clientCASecret trust. Fixes: (1) no sslRootCert on the
  # rejoin stream (forward pin kept); (2) preserve_pki strips the Secret
  # ownerReferences before every delete (RBAC +secrets get/patch, pinned);
  # (3) ConsistentSystemID divergence escalation (divergenceGraceSeconds,
  # default 180, pre-episode-bounded) + episode-marker self-heal +
  # post-re-clone convergence watch + psql-dark writable probe — a wedged
  # re-clone can never be silent again.
  # 0.2.21 (#5331): dr-failback VERIFIED CONVERGENCE — the hw285 residual.
  # hw285 G12 had a clean failover (region-B RPO=0) but a FALSE failback: a
  # divergent in-place-demoted region-A (ConsistentSystemID=False) was
  # declared "CONVERGED: re-cloned and streaming" 10s into the 180s divergence
  # grace with NO re-clone, because the CONVERGED gate keyed off the local
  # 'streaming' signal alone (a walreceiver row + a set receive-LSN that a
  # divergent equal-LSN standby also has). Fixes: (1) the CONVERGED gate now
  # ALSO requires CNPG's ConsistentSystemID=True (its own consistent-lineage
  # attestation — cannot hold on a divergent fork; LSN-equality is NOT used);
  # (2) the D2a divergence escalation gates on that verdict alone (dropping
  # the `! -f converged-streaming` conjunct that let a false 'streaming'
  # suppress the re-clone and reset the divergence clock), and the signals
  # 'streaming' arm keeps the peer-writable proof fresh so the escalation no
  # longer starves; post-re-clone watch keys off converged-recorded.
  # Script-only; no schema/RBAC/resource delta.
  # 0.2.22 (#5311): NetworkPolicy carve-out admitting the continuum-controller
  # (catalyst-system) to the primary -rw:5432 so its standby probe can read
  # pg_stat_replication and surface status.standbyAvailable on a TRUE 2-region
  # topology (the #5335 Secret-RBAC fix was necessary-not-sufficient; the
  # connection was still NetworkPolicy-dropped — hw287 residual). NetworkPolicy
  # + values only; no schema/RBAC/resource delta to the Cluster CRs.
  # 0.2.25 (#6874 D1): dr-failback re-creates the Cluster it deletes — the actor
  # forces the HR render (reconcile.fluxcd.io/forceAt = requestedAt) right after
  # every recloned-at record and re-forces every ~120s while the Cluster is
  # absent. hw307: the annotation alone left the Cluster absent for 75 min because
  # the HR's stored release already held the demoted manifest ("in-sync").
  # Script-only.
  # 0.2.24 (#6148): dr-failback peer-ahead write-guard — region-A stays
  # writable through the 120s hold and its commits are discarded by the
  # re-clone; the actor now denies client ingress to :5432 for the duration
  # of the hold via a CiliumNetworkPolicy, exempting replication and its own
  # timeline probe, and removes it on clear_hold.
  # 0.2.23 (#5388): dr-failback starvation surfacing — when the post-failover
  # geometry candidate persists with the peer unobservable (the hw290 G12 leg-6
  # rebooted-region datapath shape, #5339), the actor records
  # dr-failback-starved-at + reason on the HR instead of idling silently at D0
  # while a split-brain persists. Script + env + value only.
  # 0.2.26 (#6874 D2): dr-promoter two-clock primary-loss classification —
  # `-primary-mesh` is the primary-only alias, so it went dark with no elected
  # primary and a CNPG LOCAL failover (hw307, on bp-postgres's port of this actor)
  # outlasted the 120s hold. New `-primary-mesh-any` all-instances alias (both
  # sides) + autoPromote.primaryMissingHoldSeconds (600s) for "region-A alive but
  # primary-less"; "no instance answers" keeps the 120s hold. +1 Service per side.
  # 0.2.27 (#6874 D5): dr-promoter /shared/diverged anti-flap marker self-clears
  # once the local cluster is a consistent streaming replica again
  # (replica.enabled=true + ConsistentSystemID=True + walreceiver streaming); the
  # actor releases its own stale suspend latch when no promotion drives the HR,
  # and the diverged arms of the self-heal AND the #5245 handoff no longer fire
  # on a consistent replica (hw307: a stale marker re-froze the HR after the
  # switchback; here it would also re-promote via the substitute). Script only.
  # 0.2.29: opt-in CNPG distributed topology (cnpgPair.distributed) — the seam the
  # continuum-controller drives for a LOSSLESS planned cross-region switchover
  # (demotion token -> promotion token) through the bootstrap-kit substitutes
  # SOVEREIGN_CNPG_PAIR_{DISTRIBUTED,ACTIVE_PRIMARY,PROMOTION_TOKEN}. Default off.
  version: 0.2.37
  card:
    title: CNPG Cluster-Pair (Active-Hotstandby DR)
    summary: Active-hot-standby CNPG cluster-pair across two regions. WAL streams over Cilium ClusterMesh for cross-region DR.
    description: Catalyst-curated Blueprint that renders a primary postgresql.cnpg.io/v1.Cluster CR in region A + a replica Cluster CR in region B configured as a CNPG replica cluster (replica.enabled=true + externalCluster) streaming WAL over a Cilium ClusterMesh-shared Service. Failover-readiness probe Pod flips Ready when WAL lag < threshold so Continuum K-Cont-2 can promote on operator-triggered switchover.
    icon: cnpg-pair.svg
    license: Apache-2.0
    tags: [database, postgres, ha, dr, disaster-recovery, multi-region, active-hot-standby, clustermesh, cnpg]
    docs: https://cloudnative-pg.io/documentation/
  visibility: unlisted
  class: platform-component
  lifecycle: experimental

  configSchema:
    type: object
    required: [primary, replica, image]
    properties:
      primary:
        type: object
        required: [region]
        properties:
          region:
            type: string
            description: "Region key for the primary CNPG Cluster (e.g. hz-fsn-rtz-prod). Must differ from replica.region."
          instances:
            type: integer
            default: 3
            minimum: 3
            maximum: 5
          storage:
            type: object
            properties:
              size:
                type: string
                default: "100Gi"
              storageClass:
                type: string
                default: hcloud-volumes
      replica:
        type: object
        required: [region]
        properties:
          region:
            type: string
            description: "Region key for the replica CNPG Cluster. Must differ from primary.region."
          instances:
            type: integer
            default: 3
            minimum: 3
            maximum: 5
          storage:
            type: object
            properties:
              size:
                type: string
                default: "100Gi"
              storageClass:
                type: string
                default: hcloud-volumes
      walStreaming:
        type: object
        properties:
          targetLagSeconds:
            type: integer
            default: 30
            minimum: 1
            maximum: 600
          timeoutSeconds:
            type: integer
            default: 60
            minimum: 5
            maximum: 600
      clusterMesh:
        type: object
        properties:
          enabled:
            type: boolean
            default: true
            description: "Cilium ClusterMesh transport for WAL. Disabling is FORENSIC ONLY — public-TLS replication is unsupported per ADR-0001 §9."
          affinity:
            type: string
            default: local
            description: "ClusterMesh affinity hint (local|remote|none)."
      image:
        type: object
        required: [tag]
        properties:
          repository:
            type: string
            default: ghcr.io/cloudnative-pg/postgresql
          tag:
            type: string
            description: "REQUIRED — empty triggers a template-time fail-fast. Example: '16.3-23' or 'sha256:<digest>'."

  placementSchema:
    modes: [active-hot-standby]
    default: active-hot-standby
    minRegions: 2
    maxRegions: 2

  manifests:
    chart: bp-cnpg-pair


  upgrades:
    # Migration path from single-region bp-cnpg installs: an
    # operator promotes a single-region CNPG Cluster to a pair by
    # installing this Blueprint and running a one-shot promotion
    # job (delivered in C-DB-3 acceptance harness). Documented in
    # DESIGN.md "single→pair migration".
    from: ["1.x"]
  topology:
    supported: [active-hot-standby]
    defaults:
      multi-region: active-hot-standby
      single-region: active-hot-standby
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 30
          rpoSeconds: 0
        placement:
          tier: ""
          clusters: [rtz-A, rtz-B]
          roles:
            rtz-A: active
            rtz-B: passive
  endpoints: []
