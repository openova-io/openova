apiVersion: catalyst.openova.io/v1alpha1
kind: Blueprint
metadata:
  name: bp-cnpg-pair
  labels:
    catalyst.openova.io/section: pts-9-disaster-recovery
    catalyst.openova.io/companion: bp-cnpg
spec:
  # 0.2.9 (#4846): cross-region DR admission is an identity-based
  # CiliumNetworkPolicy (io.cilium.k8s.policy.cluster) — the 0.2.8 ipBlock was
  # inert for ClusterMesh remote endpoints. values crossRegionPeerClusters.
  # 0.2.11 (#5133): failover-readiness probe no longer false-negatives on a
  # caught-up SYNCHRONOUS standby — authenticates as streaming_replica (the
  # postgres superuser is disabled) and measures apply lag via LSN
  # receive-vs-replay (idle- + region-kill-safe). Unblocks region-kill DR
  # promotion (Pillar 3).
  # 0.2.13 (#5137): region-B AUTOMATIC DR promotion — side=replica renders a
  # dr-promoter Deployment (#5157 shape) that survives region-A loss: when the
  # WAL stream is dead ≥ hold AND failover-readiness is Ready, it patches the
  # region-B HR desired state (replica.promoted=true, the #5125-D1 seam) so
  # CNPG promotes the survivor with ZERO operator action. sync-mode-only
  # (the remote_apply/dataDurability fence is the anti-split-brain arbiter).
  # 0.2.14 (#5178): dr-promoter regression fix — (A) a POSITIVE region-A
  # liveness gate (pg_isready of `-primary-mesh` over the mesh) + startup grace
  # so the actor no longer false-promotes a healthy replica against a live
  # region-A, and (B) a durable SUSPEND latch + anti-flap divergence guard so a
  # real promotion sticks instead of flapping the timeline away (hw266 G12).
  # 0.2.15 (#5218): dr-promoter durable-suspend RACE fix — on hw271 G12 the
  # promote fired but was re-demoted mid-outage because the 0.2.14 latch only
  # suspended the HR on the NEXT actor tick, leaving a window for kustomize to
  # revert spec.values and re-render replica.enabled=true. The actor now
  # suspends IN THE SAME TICK as the promote (once helm renders) and re-asserts
  # spec.suspend every loop while promoted/diverged (self-heal), with readback
  # verification. All decision gates unchanged.
  # 0.2.16 (#5220): dr-promoter FALSE-POSITIVE fix — on hw273 G12 the 0.2.15
  # promoter false-promoted region-B during a transient region-A blip while
  # region-A stayed ALIVE on TL1, and #5219's suspend latch cemented it (region-B
  # TL2, walreceiver FATAL-loop forever). (A) an ARM GATE makes the actor
  # ineligible to promote until it has OBSERVED continuous streaming steady-state
  # (steadyStateArmSeconds) — a never-converged pair can never promote, so the
  # latch never cements a false positive; (B) a persistent can't-re-stream wedge
  # is SURFACED on the HR (dr-timeline-diverged-at), the re-clone staying the
  # operator's RUNBOOKS §6.1 action (non-destructive). #5219 latch + 120s hold +
  # pg_isready gate + sync fence unchanged.
  # 0.2.17 (#5239): the #5220 arm gate NEVER armed — it read "streaming" from
  # pg_stat_wal_receiver.status, unreadable to the streaming_replica probe role
  # (no pg_read_all_stats → status ALWAYS NULL, live-confirmed hw274), so the pair
  # never armed and the actor refused every promote (DR failover dead). Fix:
  # detect streaming from PUBLIC-readable signals — a live pg_stat_wal_receiver
  # ROW (EXISTS visible to all) AND pg_last_wal_receive_lsn() non-null. A GRANT
  # was not viable (streaming_replica is CNPG-reserved and absent at postInitSQL
  # time). All #5220/#5219/#5178 gates unchanged; script-only.
  # 0.2.18 (#5245): region-kill FAILBACK — the missing return leg. hw275 G12:
  # after a clean forward promote, recovered region-A resumed its stale TL1
  # primary role while promoted region-B FATAL-looped as a TL2 standby —
  # replication permanently dead. (1) latch durability: every actor write uses
  # a custom --field-manager (kustomize's managed-fields cleanup strips
  # kubectl-managed fields each reconcile — the observed mid-recovery
  # re-demote); (2) durable handoff: the promotion moves into the
  # bootstrap-kit Kustomization substitute SOVEREIGN_CNPG_PAIR_PROMOTED and
  # the suspend latch is LIFTED once source-rendered; (3) TL-ahead
  # re-promote: a standby provably ahead of its reachable source
  # (IDENTIFY_SYSTEM arithmetic) re-promotes through the substitute seam;
  # (4) NEW side=primary dr-failback actor: on a held peer-writable-and-ahead
  # proof it demotes region-A (SOVEREIGN_CNPG_PAIR_DEMOTED → the primary
  # Cluster renders as a pg_basebackup replica of region-B over the new
  # `-replica-mesh` global Service) and re-clones the stale line — bounded
  # destruction, sync-fence data-safety (region-B ⊇ every acked commit).
  # Shared client CA on the replica Cluster (clientCASecret=-primary-ca) lets
  # region-A's own cert authenticate the rejoin stream.
  version: 0.2.18
  card:
    title: CNPG Cluster-Pair (Active-Hotstandby DR)
    summary: |
      Active-hotstandby CNPG cluster-pair across two Sovereign regions
      (two separate clusters joined by Cilium ClusterMesh). Each
      cluster installs the chart with `side` selecting its half:
      side=primary renders the primary postgresql.cnpg.io/v1.Cluster
      CR + the ClusterMesh-global replication Service in region A;
      side=replica renders the replica Cluster CR in region B
      (replica.enabled=true + externalCluster, CNPG's separate-cluster
      replica pattern) streaming WAL over the mesh Service, plus the
      failover-readiness probe Pod that flips Ready when WAL lag <
      threshold so Continuum K-Cont-2 can promote on operator-
      triggered switchover. Per ADR-0001 §9 the replication transport
      is ClusterMesh — never public TLS.
    icon: cnpg-pair.svg
    category: data
  visibility: listed

  configSchema:
    type: object
    required:
      - primary
      - replica
      - image
    properties:
      side:
        type: string
        enum: [primary, replica, secondary]
        default: primary
        description: |
          WHICH HALF of the pair this install renders (chart 0.2.0
          split-side topology). A 2-region Sovereign is two SEPARATE
          clusters joined by Cilium ClusterMesh, so each cluster
          applies the same chart and renders exactly its own half:
          `primary` → primary Cluster CR + mesh Service + audit-config
          (region A); `replica` → replica Cluster CR + failover-
          readiness probe (region B). `secondary` is accepted as an
          alias for `replica` so the bootstrap-kit slot can substitute
          the per-region SOVEREIGN_REGION_ROLE value verbatim.
      primary:
        type: object
        required: [region]
        properties:
          region:
            type: string
            enum:
              - hz-fsn-rtz-prod
              - hz-hel-rtz-prod
              - hz-nbg-mgt-prod
            description: |
              Hetzner region key for the primary CNPG Cluster.
              MUST differ from `replica.region`. Matches the
              `openova.io/region` label on data-plane nodes.
          instances:
            type: integer
            minimum: 3
            maximum: 5
            default: 3
            description: |
              Number of CNPG instances in the primary region.
              CNPG operator places one Pod per node via anti-
              affinity; minimum 3 for HA quorum.
          storage:
            type: object
            properties:
              size:
                type: string
                default: "100Gi"
                description: |
                  Per-instance PVC size. Use Kubernetes resource
                  quantities (e.g. "100Gi", "1Ti").
              storageClass:
                type: string
                default: ""
                description: |
                  StorageClass for the primary's PVCs. H6's
                  bp-hcloud-csi provides `hcloud-volumes` on every
                  Hetzner Sovereign.
      replica:
        type: object
        required: [region]
        properties:
          region:
            type: string
            enum:
              - hz-fsn-rtz-prod
              - hz-hel-rtz-prod
              - hz-nbg-mgt-prod
            description: |
              Hetzner region for the replica. MUST differ from
              `primary.region` — UI install-flow validates this
              before submitting the Application CR; the chart's
              _helpers.tpl `cnpg-pair.validateRegions` re-asserts
              at template-render time.
          instances:
            type: integer
            minimum: 3
            maximum: 5
            default: 3
          storage:
            type: object
            properties:
              size:
                type: string
                default: "100Gi"
              storageClass:
                type: string
                default: ""
      walStreaming:
        type: object
        properties:
          targetLagSeconds:
            type: integer
            minimum: 1
            maximum: 600
            default: 30
            description: |
              Replica becomes promotable when WAL replay lag drops
              below this threshold (seconds). Continuum K-Cont-2
              gates switchover on the failover-readiness Pod's
              Ready condition, which derives from this threshold.
          timeoutSeconds:
            type: integer
            minimum: 5
            maximum: 600
            default: 60
      clusterMesh:
        type: object
        properties:
          enabled:
            type: boolean
            default: true
            description: |
              When true (DEFAULT, REQUIRED for production), the
              replication Service carries the
              `service.cilium.io/global: "true"` annotation so
              Cilium ClusterMesh exposes it cross-region.
              Disabling this is FORENSIC ONLY — replication
              traffic over public TLS is NOT supported per
              ADR-0001 §9.
          affinity:
            type: string
            enum: [local, remote, none]
            default: local
            description: |
              ClusterMesh affinity hint. `local` (DEFAULT) keeps
              the primary region's reads inside the region and
              falls through to the replica region only when no
              local primary backend exists.
      replication:
        type: object
        properties:
          mode:
            type: string
            enum: [sync, async]
            default: sync
            description: |
              Replication MODE.

              `sync` (DEFAULT, canonical for Pillar 3 zero-tx-loss):
              configures the primary CNPG Cluster CR with
              `synchronous_commit = remote_apply` and
              `synchronous_standby_names = FIRST 1 (<replica>)`.
              COMMIT on the primary blocks until the replica has
              replayed the WAL. This is the bar required for
              region-kill failover with zero transactions lost.

              `async` (forensic/lab only): leaves the primary at
              PostgreSQL's default async streaming. In-flight
              transactions at primary-kill time are LOST.
              Production deployments MUST use `sync`.
          sync:
            type: object
            properties:
              commit:
                type: string
                enum: [on, remote_write, remote_apply]
                default: remote_apply
                description: |
                  PostgreSQL `synchronous_commit` level (strongest
                  durability = `remote_apply`: replica must have
                  REPLAYED the WAL before COMMIT returns).
              numSync:
                type: integer
                minimum: 1
                maximum: 3
                default: 1
                description: |
                  Number of synchronous standbys required to ACK
                  COMMIT. For a 2-region pair (primary + 1 replica)
                  the canonical value is 1.
      image:
        type: object
        required: [tag]
        properties:
          repository:
            type: string
            default: ghcr.io/cloudnative-pg/postgresql
            description: |
              CNPG postgres image. Per Inviolable Principle #4a
              cluster overlays SHOULD pin to a digest in production.
          tag:
            type: string
            description: |
              REQUIRED — empty triggers a template-time fail-fast.
              Example: `16.3-23` (versioned) or
              `sha256:<digest>` (digest, recommended).

  placementSchema:
    # The cluster-pair IS the placement — primary + replica are the
    # two regions. Replication is SYNCHRONOUS by default
    # (`synchronous_commit = remote_apply` + `synchronous_standby_names
    # = FIRST 1 (<replica>)`) to honour the Pillar 3 zero-transactions-
    # lost claim. Operators may opt down to asynchronous streaming via
    # `replication.mode: async` for forensic / lab use; production
    # deployments MUST stay on `sync`. Multi-replica-region (active-
    # active for Postgres) is out of scope per master-brief §9.6.
    modes: [active-hotstandby]
    # G93.2 (Refs #2667) — bp-cnpg-pair has exactly one mode, so this
    # is the only sensible default. The application-controller
    # consults defaultOnMultiRegion when an Application CR omits
    # spec.placement on a multi-region Sovereign — for bp-cnpg-pair
    # that's the target-state Pillar 3 shape by definition.
    default: active-hotstandby
    defaultOnMultiRegion: active-hotstandby
    minRegions: 2
    maxRegions: 2

  manifests:
    chart: ./chart

  # Runtime dependencies — the install flow gates Apply until each
  # of these Blueprints is reconciled in the target Sovereign.
  depends:
    # CNPG operator + CRDs — bp-cnpg umbrella over upstream
    # cnpg/cloudnative-pg 0.28.0 ships postgresql.cnpg.io/v1 CRDs.
    # We use those CRDs without installing a second copy.
    - blueprint: bp-cnpg
      version: ^1
      alias: cnpg
    # H6 — Hetzner Cloud CSI driver + `hcloud-volumes` StorageClass.
    - blueprint: bp-hcloud-csi
      version: ^1
      alias: csi
    # ClusterMesh — bp-cilium with mesh enabled (per H1 hardening
    # in EPIC-5 #1100). The chart fails open-but-degraded if
    # ClusterMesh is disabled (replica can't reach primary), so
    # the dependency is structural.
    - blueprint: bp-cilium
      version: ^1
      alias: cilium

  upgrades:
    # Migration path from single-region bp-cnpg installs: an
    # operator promotes a single-region CNPG Cluster to a pair by
    # installing this Blueprint and running a one-shot promotion
    # job (delivered in C-DB-3 acceptance harness). Documented in
    # DESIGN.md "single→pair migration".
    from: ["1.x"]
  topology:
    supported:
      - active-hot-standby
    defaults:
      multi-region: active-hot-standby
      single-region: active-hot-standby
    perTopology:
      active-hot-standby:
        replication:
          backend: cnpg-pair
          mode: sync
          lagSloSeconds: 0
        switchover:
          mechanism: bp-continuum
          rtoSeconds: 10
          rpoSeconds: 0
        placement:
          tier: rtz
          clusters:
            - rtz-A
            - rtz-B
          roles:
            rtz-A: active
            rtz-B: passive
  multiInstance:
    enabled: false
