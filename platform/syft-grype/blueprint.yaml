apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-syft-grype
  labels:
    catalyst.openova.io/section: pts-3-3-security-and-policy
spec:
  version: 1.0.0
  visibility: unlisted
  card:
    title: Syft + Grype
    summary: SBOM generation (Syft) + vulnerability scanning (Grype) for the Sovereign supply chain — produces and scans image bills-of-materials in the CI/admission path.
    icon: grype.svg
  topology:
    supported: [singleton]
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: mgmt
          clusters: [mgmt-A]
          roles:
            mgmt-A: singleton
  placementSchema:
    modes: [single-region]
    default: single-region
  manifests:
    chart: bp-syft-grype
  endpoints: []
