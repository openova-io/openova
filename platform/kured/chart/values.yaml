# bp-kured values. The kit slot installs this chart into kube-system.

# Settings of the upstream kured chart. Each line names the kured flag it sets.
kured:
  # The DaemonSet, its lock annotation (weave.works/kured-node-lock) and its
  # Pods are named kured, whatever the release is called.
  fullnameOverride: kured
  configuration:
    rebootSentinel: /var/run/reboot-required  # --reboot-sentinel: the file unattended upgrades write
    period: 30m                               # --period: a node-local file check, no call to any service; see "A drain that cannot finish"
    concurrency: 1                            # --concurrency: one node at a time per cluster
    startTime: "00:30"                        # --start-time: the reboot span opens
    endTime: "22:00"                          # --end-time: the reboot span closes; the hours left are the upgrade window
    timeZone: UTC                             # --time-zone
    rebootDays: [su, mo, tu, we, th, fr, sa]  # --reboot-days: every day
    drainTimeout: 10m                         # --drain-timeout: a node that cannot drain is not rebooted; see "A drain that cannot finish"
    lockTtl: 1h                               # --lock-ttl: a crashed lock holder cannot block for ever
    lockReleaseDelay: 5m                      # --lock-release-delay: the node settles before the next one
    # A drain that cannot finish (#7922). kured 1.23 drains with the kubectl
    # drain library and leaves its EvictErrorRetryDelay at 0, and no flag of
    # kured sets it (cmd/kured/main.go, drain()); kubectl's own CLI sets 5s.
    # The eviction API answers a refusal by a disruption budget with 429, so
    # kured retries the eviction at once, paced only by client-go's default
    # 5 requests a second: measured on hw307, one refusal every 0.200 s,
    # 4,510 in each 15-minute drain. kured cannot slow that rate, so these
    # three settings bound what a drain that cannot finish costs:
    #   --drain-timeout ends the attempt: at most 10 minutes of refusals. A
    #   drain that can finish takes far less: 32 s for 23 Pods on hw307. The
    #   drain evicts all Pods at once and waits for the slowest; a CNPG
    #   instance's smart shutdown waits at most 180 s (its default) before
    #   it stops fast.
    #   --lock-release-delay keeps the node cordoned and the lock held for
    #   5 more minutes after a failed attempt (kured releases the lock, with
    #   that delay, before it uncordons).
    #   --period decides when kured tries again. Ticks queue while an attempt
    #   runs, so with a period at or below drain timeout + lock release delay
    #   the next attempt starts in the same second and the node is never
    #   schedulable again (hw307: cordoned 20 minutes of every 20, the lock
    #   never free for another node). The period must exceed their sum
    #   (tests/render.sh asserts it): 30m leaves the node schedulable and the
    #   lock free for 15 minutes of every 30, at most 10 minutes of refusals.
    # The settings are read by the acceptance check INF-G01 from the
    # DaemonSet, so its limits follow: a node unschedulable for longer than
    # drain timeout + lock release delay (15 minutes) fails it, and it waits
    # period + lock release delay + 15 minutes (50 minutes) for a restart.
    # --blocking-pod-selector: no reboot of a node while an upgrade Job Pod of
    # the system-upgrade-controller runs on it. One selector; the comma means
    # AND. The second key leaves out the controller's own Pod, which carries
    # the first label too and would block its node for ever.
    blockingPodSelector:
      - upgrade.cattle.io/controller=system-upgrade-controller,upgrade.cattle.io/plan
    annotateNodes: true                       # --annotate-nodes: the console can show "reboot pending"
    # --lock-annotation: the annotation of its own DaemonSet in which kured
    # takes its lock before it drains a node. See "The install hold" below.
    lockAnnotation: catalyst.openova.io/kured-install-hold
  # The install hold. kured is told to take its lock in the annotation below,
  # and the chart creates the DaemonSet with that annotation already holding a
  # lock: one that names something that is no node and has no time limit.
  # That is kured's own manual hold. Every node logs "Lock already held" and
  # no node is drained or restarted, and there is no moment without it.
  # A Sovereign is installed and handed over with the hold in place: a restart
  # of a node cuts the Helm installs in flight and the steps of the hand-over
  # chain. The last step of the chain (bp-self-sovereign-cutover, step
  # egress-block-test, after its verdict) releases it in every region by
  # writing the ConfigMap flux-system/bp-kured-install-hold, which the kit
  # slot reads as values. Its one value sets configuration.lockAnnotation to
  # kured's own default, weave.works/kured-node-lock. kured then
  # locks in that annotation, which this chart never writes, and the
  # annotation below stays on the DaemonSet and is read by nothing.
  dsAnnotations:
    catalyst.openova.io/kured-install-hold: '{"nodeID":"catalyst-install-hold","TTL":0}'
  # kured runs on every node that is not a control-plane node, whatever its
  # taints. A region has one control-plane node, and its restart is an outage
  # of the region's API server, so kured never restarts a control-plane node:
  # that restart is a person's decision. node-patch-config below runs on
  # control-plane nodes too, so they install their security updates all the
  # same. A Sovereign with three or more control-plane nodes per region sets
  # this key to null and kured takes them in turn like any other node.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  tolerations:
    - operator: Exists

# The DaemonSet node-patch-config writes the node's two unattended-upgrade
# files under /etc/apt/apt.conf.d and rewrites them when their content differs.
nodePatchConfig:
  # The image of node-patch-config and of the function test: a shell with
  # cmp, cp, mv, chmod and sleep, and kubectl. No default: the kit slot sets
  # it with the registry prefix of the Sovereign. Left empty, the install
  # fails: the DaemonSet has a container without an image.
  image: ""
