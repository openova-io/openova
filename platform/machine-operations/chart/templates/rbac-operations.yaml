{{- if .Values.enabled }}
# Access of the operations controller. It reads Machines, ScanPolicies and
# HardeningBaselines, writes MachineRuns, the status of Machines and
# ScanPolicies, and the hardening PolicyReports. Jobs and Pods it reaches only
# in the release namespace, through a Role. It has no verb on Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: machine-controller-operations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-machine-operations.labels" . | nindent 4 }}
    app.kubernetes.io/component: operations
---
# The service account of the node-mode runner Jobs. It has no role and no
# token: a Job writes no object.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mr-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-machine-operations.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: machine-controller-operations
  labels:
    {{- include "bp-machine-operations.labels" . | nindent 4 }}
    app.kubernetes.io/component: operations
rules:
  - apiGroups: [machines.openova.io]
    resources: [machines]
    verbs: [get, list, watch]
  - apiGroups: [machines.openova.io]
    resources: [machines/status]
    verbs: [patch]
  - apiGroups: [machines.openova.io]
    resources: [machineruns]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [machines.openova.io]
    resources: [machineruns/status]
    verbs: [get, update, patch]
  - apiGroups: [machines.openova.io]
    resources: [scanpolicies, hardeningbaselines]
    verbs: [get, list, watch]
  - apiGroups: [machines.openova.io]
    resources: [scanpolicies/status]
    verbs: [update, patch]
  - apiGroups: [wgpolicyk8s.io]
    resources: [policyreports]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: machine-controller-operations
  labels:
    {{- include "bp-machine-operations.labels" . | nindent 4 }}
    app.kubernetes.io/component: operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: machine-controller-operations
subjects:
  - kind: ServiceAccount
    name: machine-controller-operations
    namespace: {{ .Release.Namespace }}
---
# The runner Jobs and their Pods, and leader election: the Lease
# machine-controller-operations and the Events that record who holds it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: machine-controller-operations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-machine-operations.labels" . | nindent 4 }}
    app.kubernetes.io/component: operations
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [machine-controller-operations]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: machine-controller-operations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-machine-operations.labels" . | nindent 4 }}
    app.kubernetes.io/component: operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: machine-controller-operations
subjects:
  - kind: ServiceAccount
    name: machine-controller-operations
    namespace: {{ .Release.Namespace }}
{{- end }}
