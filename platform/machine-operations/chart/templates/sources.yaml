{{- if and .Values.enabled .Values.sources.nodes.enabled }}
# The built-in source nodes: the Kubernetes Nodes of this cluster. Its Machines
# live in the same namespace, catalyst-infra.
apiVersion: machines.openova.io/v1alpha1
kind: MachineSource
metadata:
  name: nodes
  namespace: catalyst-infra
  labels:
    {{- include "bp-machine-operations.labels" . | nindent 4 }}
spec:
  type: nodes
{{- end }}
