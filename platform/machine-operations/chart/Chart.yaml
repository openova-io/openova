apiVersion: v2
name: bp-machine-operations
version: 0.1.4
description: |
  Machine operations on the platform's own nodes. This version ships the five
  custom resource definitions of the group machines.openova.io (Machine,
  MachineSource, ScanPolicy, HardeningBaseline, MachineRun) and the inventory
  controller with the built-in source nodes, switched on by the value enabled.
type: application
keywords: [catalyst, blueprint, machines, inventory]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

annotations:
  catalyst.openova.io/no-upstream: "true"
  catalyst.openova.io/smoke-render-mode: default-off
