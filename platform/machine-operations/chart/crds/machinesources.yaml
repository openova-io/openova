apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machinesources.machines.openova.io
  labels:
    app.kubernetes.io/name: bp-machine-operations
spec:
  group: machines.openova.io
  scope: Namespaced
  names:
    kind: MachineSource
    listKind: MachineSourceList
    singular: machinesource
    plural: machinesources
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Sightings
          type: integer
          jsonPath: .status.lastEnumeration.sightings
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: |
            MachineSource is one place the inventory controller reads machines from.
            The controller keeps one Machine for every machine the source lists.
            Fields that are not listed here are dropped.
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [nodes]
                  description: What the source lists. nodes is the Kubernetes Nodes of this cluster.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.type is immutable
                suspended:
                  type: boolean
                  default: false
                  description: true means no enumeration, and no machine becomes stale.
                stale:
                  type: object
                  description: How machines that the source no longer lists are handled.
                  properties:
                    holdPercent:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 20
                      description: A sweep that would mark more than this percentage of the active machines, and at least holdMinimum, is held.
                    holdMinimum:
                      type: integer
                      minimum: 0
                      default: 10
                    retireAfter:
                      type: string
                      pattern: '^([0-9]+(h|m|s))+$'
                      default: 720h
                      description: A machine that is stale for this long becomes Retired.
                    purgeAfter:
                      type: string
                      pattern: '^([0-9]+(h|m|s))+$'
                      default: 2160h
                      description: A machine that is retired for this long is deleted.
                    releaseHoldFor:
                      type: string
                      default: ""
                      description: When it equals status.held.enumerationId, the held sweep is applied.
            status:
              type: object
              properties:
                lastEnumeration:
                  type: object
                  required: [id, startedAt, finishedAt, complete, sightings, created, markedStale]
                  properties:
                    id:
                      type: string
                      description: A ULID.
                    startedAt:
                      type: string
                      format: date-time
                    finishedAt:
                      type: string
                      format: date-time
                    complete:
                      type: boolean
                    sightings:
                      type: integer
                    created:
                      type: integer
                    markedStale:
                      type: integer
                    scopes:
                      type: array
                      items:
                        type: object
                        required: [name, readable, count]
                        properties:
                          name:
                            type: string
                          readable:
                            type: boolean
                          error:
                            type: string
                          count:
                            type: integer
                held:
                  type: object
                  description: Present while a sweep is held.
                  required: [enumerationId, wouldMarkStale, live, since]
                  properties:
                    enumerationId:
                      type: string
                    wouldMarkStale:
                      type: integer
                    live:
                      type: integer
                    since:
                      type: string
                      format: date-time
                conditions:
                  type: array
                  description: Ready, Complete (the last enumeration read every scope) and StaleHold.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                        enum: [Ready, Complete, StaleHold]
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
