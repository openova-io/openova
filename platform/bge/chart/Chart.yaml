apiVersion: v2
name: bp-bge
description: |
  Catalyst Blueprint chart for embeddings and reranking on CPU.

  One Infinity server (github.com/michaelfeil/infinity, MIT) serves one
  embedding model and at most one reranker, by default
  granite-embedding-107m-multilingual (384 dimensions) and
  mmarco-mMiniLMv2-L12-H384-v1, both on the ONNX engine. Routes:
  POST /v1/embeddings and POST /v1/rerank on a ClusterIP Service; the
  platform's model gateway is the one caller. See README.md.
type: application
version: 1.0.1
appVersion: "0.0.78"
keywords: [catalyst, blueprint, embeddings, reranker, infinity, ai]
maintainers:
  - name: OpenOva Catalyst
    email: catalyst@openova.io

# The chart's objects are all in templates/. The `sigstore/common` library
# chart below is declared only for the hollow-chart gate of
# blueprint-release.yaml (issue #181: every chart declares at least one
# dependency); it renders nothing.
dependencies:
  - name: common
    version: "0.1.3"
    repository: "https://sigstore.github.io/helm-charts"
