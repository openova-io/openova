{{- if include "bp-bge.serving" . }}
{{- /* The identity the Secrets Store CSI driver presents for the hub-token file. No token is mounted into the Pod. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bp-bge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bp-bge.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
