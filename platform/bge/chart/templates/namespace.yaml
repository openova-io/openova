{{- /*
The release namespace (the kit's target namespace is model-serving). It is the
one object the chart renders when home or enabled is false. Flux keeps the
release record in the HelmRelease's own namespace, so the chart may create the
namespace it installs into. Every Pod of the chart meets the restricted Pod
Security Standard.
*/ -}}
{{- include "bp-bge.validate" . }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    catalyst.openova.io/blueprint: bp-bge
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
