# bp-bge: one embedding model and at most one reranker, served on CPU by one
# Infinity server (README.md). Every name below is read by templates/.
#
# The five keys home, enabled, embedding, reranker and cache are the Blueprint's
# configSchema (blueprint.yaml). The chart refuses at render what that schema
# refuses (templates/_helpers.tpl, "bp-bge.validate").

# Set by the kit slot from MODEL_PLANE_HOME. The chart renders its workloads
# only when home and enabled are both true; otherwise it renders the Namespace
# only.
home: false
# Set by the kit slot from MODEL_PLANE_EMBEDDINGS.
enabled: false

# The embedding model. source is oci://<host>/<path>@sha256:<64 hex> (a model
# image of the Sovereign's registry, README.md "Model image") or
# hf://<owner>/<name>, which needs revision, the 40-character commit.
# dimensions is the length of the vector; the function test asserts it.
embedding:
  source: hf://ibm-granite/granite-embedding-107m-multilingual
  revision: d6cffd338414d6a1c1f5decfad5fec62eebc90d5
  servedName: granite-embedding-107m-multilingual
  dimensions: 384

# The reranker, optional. Same rules for source and revision. Both models come
# from the same kind of source.
reranker:
  source: hf://cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  revision: 1427fd652930e4ba29e8149678df786c240d8825
  servedName: mmarco-mminilmv2-l12-h384-v1

# The weights volume. Without cache it is an emptyDir of 10Gi; with it a
# PersistentVolumeClaim of sizeGi (at least 10) in storageClass ("" is the
# Sovereign's default class).
# cache:
#   sizeGi: 10
#   storageClass: ""

# ── Not part of the configSchema ────────────────────────────────────────────

# The server image, by digest (MIT, github.com/michaelfeil/infinity).
image: docker.io/michaelf34/infinity:0.0.78-cpu@sha256:5401a057f16f82a7a1202369f674dc15695fe37d8517f3c0263fdfb88b2e2717
port: 7997

resources:
  requests:
    cpu: "2"
    memory: 5Gi
  limits:
    cpu: "4"
    memory: 8Gi

# A model-hub token for a gated hf:// model: the name of a SecretProviderClass
# in the release namespace whose object hf-token is the token. It is mounted by
# the Secrets Store CSI driver as /var/run/secrets/openova/hf-token. "" mounts
# nothing.
hubToken:
  secretProviderClass: ""

# The NetworkPolicy of the release: ingress on the serving port only from
# gatewayNamespace and from the release's own function test; egress to cluster
# DNS, and to the model hub on TCP 443 only when hubEgress is true. An hf://
# source with the policy on and hubEgress false is refused at render: the
# server could not fetch its model.
networkPolicy:
  enabled: true
  gatewayNamespace: model-gateway
  hubEgress: false

# The function test (templates/tests/function-test.yaml). timeoutSeconds is the
# bound T of docs/RUNBOOKS.md section 4.5; the kit slot states it.
functionTest:
  image: harbor.openova.io/proxy-dockerhub/alpine/k8s:1.31.4
  timeoutSeconds: 300
