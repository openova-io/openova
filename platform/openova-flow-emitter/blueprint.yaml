apiVersion: catalyst.openova.io/v1
kind: Blueprint
metadata:
  name: bp-openova-flow-emitter
spec:
  version: 0.1.2
  visibility: unlisted
  card:
    title: OpenOva Flow emitter
  topology:
    supported:
      - singleton
    defaults:
      multi-region: singleton
      single-region: singleton
    perTopology:
      singleton:
        placement:
          tier: ""
          clusters: [mgmt-A, mgmt-B, dmz-A, dmz-B, rtz-A, rtz-B]
          roles:
            mgmt-A: singleton
            mgmt-B: singleton
            dmz-A: singleton
            dmz-B: singleton
            rtz-A: singleton
            rtz-B: singleton
