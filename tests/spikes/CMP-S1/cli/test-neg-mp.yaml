kind: Test
metadata:
  name: cmp-s1-neg-mp
policies:
  - mpol.yaml
resources:
  - resources.yaml
results:
  - policy: new-add-label
    isMutatingPolicy: true
    kind: ConfigMap
    resources:
      - spike-mut/cm-1
    patchedResources: patched-wrong.yaml
    result: pass
