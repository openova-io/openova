# In-cluster OCI registry that serves the stand-in chart. ClusterIP only;
# the job reaches it with kubectl port-forward to push the chart.
apiVersion: v1
kind: Namespace
metadata:
  name: spike-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: spike-registry
spec:
  replicas: 1
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /v2/, port: 5000}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: spike-registry
spec:
  type: ClusterIP
  selector: {app: registry}
  ports:
    - port: 5000
      targetPort: 5000
