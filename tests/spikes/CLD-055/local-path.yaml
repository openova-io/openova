# CLD-055 spike: the storage class the shared template leaves out
# (k3s runs with --disable=local-storage). A HelmRelease of the upstream
# local-path provisioner chart, as CLD-086 would add it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/rancher/local-path-provisioner
  ref:
    tag: v0.0.30
  ignore: |
    /*
    !/deploy/chart
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path
  namespace: flux-system
spec:
  interval: 1h
  releaseName: local-path
  targetNamespace: local-path-storage
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
        namespace: flux-system
  values:
    storageClass:
      create: true
      defaultClass: true
      name: local-path
