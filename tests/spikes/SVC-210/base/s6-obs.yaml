# Lab test SVC-210 fixture slot: one trivial HelmRelease, like one kit slot file.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: svc210-obs
  namespace: svc210
  labels:
    app.kubernetes.io/part-of: svc210
    catalyst.openova.io/ring: observability
spec:
  interval: 10m
  releaseName: svc210-obs
  dependsOn:
    - name: svc210-found
  chart:
    spec:
      chart: ./tests/spikes/SVC-210/chart
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: svc210
        namespace: flux-system
  install:
    remediation:
      retries: 3
