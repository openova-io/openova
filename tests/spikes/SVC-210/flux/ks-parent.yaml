# Parent Kustomization with variable substitution on. It applies, from Git,
# a kit Kustomization object that carries a delete patch. The question: does
# "$patch" survive the parent's substitution unchanged?
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: svc210-parent
  namespace: flux-system
spec:
  interval: 10m
  path: ./tests/spikes/SVC-210/parent
  prune: true
  sourceRef:
    kind: GitRepository
    name: svc210
  wait: false
  timeout: 5m
  postBuild:
    substitute:
      SOVEREIGN_FQDN: svc210.example.test
