# Every ring on: no entry in spec.patches. Same reconcile settings as the
# Sovereign's kit Kustomization (prune, wait, 5m timeout, postBuild substitute).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: svc210-kit
  namespace: flux-system
spec:
  interval: 10m
  path: ./tests/spikes/SVC-210/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: svc210
  wait: true
  timeout: 5m
  postBuild:
    substitute:
      SOVEREIGN_FQDN: svc210.example.test
