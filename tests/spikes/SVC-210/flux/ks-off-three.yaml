# Three rings off at once, one patch entry per ring. "commerce" has no
# member in the fixture: a patch whose selector matches nothing must not
# break the build.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: svc210-kit
  namespace: flux-system
spec:
  interval: 10m
  path: ./tests/spikes/SVC-210/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: svc210
  wait: true
  timeout: 5m
  postBuild:
    substitute:
      SOVEREIGN_FQDN: svc210.example.test
  patches:
    - target:
        kind: HelmRelease
        labelSelector: "catalyst.openova.io/ring=operations"
      patch: |
        $patch: delete
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: any
    - target:
        kind: HelmRelease
        labelSelector: "catalyst.openova.io/ring=observability"
      patch: |
        $patch: delete
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: any
    - target:
        kind: HelmRelease
        labelSelector: "catalyst.openova.io/ring=commerce"
      patch: |
        $patch: delete
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: any
