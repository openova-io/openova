# A kit Kustomization object as it would sit in a Sovereign's repository.
# Suspended: only its stored text is examined, it never reconciles.
# The annotation proves that the parent's substitution really ran.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: svc210-kit-from-git
  namespace: flux-system
  annotations:
    svc210.openova.io/fqdn: ${SOVEREIGN_FQDN}
spec:
  suspend: true
  interval: 10m
  path: ./tests/spikes/SVC-210/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: svc210
  patches:
    - target:
        kind: HelmRelease
        labelSelector: "catalyst.openova.io/ring=operations"
      patch: |
        $patch: delete
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: any
