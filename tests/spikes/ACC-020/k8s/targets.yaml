# Targets of lab test ACC-020 on the throwaway k3s. Every Service is
# ClusterIP; nothing is exposed on a node port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sshd
  namespace: spike
spec:
  replicas: 1
  selector:
    matchLabels: {app: sshd}
  template:
    metadata:
      labels: {app: sshd}
    spec:
      containers:
        - name: sshd
          image: spike.local/sshd:1
          imagePullPolicy: Never
          ports: [{containerPort: 22}]
          readinessProbe:
            tcpSocket: {port: 22}
            periodSeconds: 2
          volumeMounts:
            - name: ca
              mountPath: /etc/ssh/ca
              readOnly: true
      volumes:
        - name: ca
          configMap:
            name: sshd-ca
---
apiVersion: v1
kind: Service
metadata:
  name: sshd
  namespace: spike
spec:
  type: ClusterIP
  selector: {app: sshd}
  ports:
    - {name: ssh, port: 22, targetPort: 22}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vnc
  namespace: spike
spec:
  replicas: 1
  selector:
    matchLabels: {app: vnc}
  template:
    metadata:
      labels: {app: vnc}
    spec:
      containers:
        - name: vnc
          image: spike.local/vnc:1
          imagePullPolicy: Never
          ports: [{containerPort: 5900}]
          readinessProbe:
            tcpSocket: {port: 5900}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: vnc
  namespace: spike
spec:
  type: ClusterIP
  selector: {app: vnc}
  ports:
    - {name: vnc, port: 5900, targetPort: 5900}
---
apiVersion: v1
kind: Pod
metadata:
  name: exec-target
  namespace: acme
  labels: {app.kubernetes.io/name: exec-target}
spec:
  containers:
    - name: main
      image: docker.io/library/busybox:1.36.1
      command: ["sh", "-c", "sleep 86400"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-ws-proxy
  namespace: catalyst-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spike-k8s-ws-proxy
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spike-k8s-ws-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spike-k8s-ws-proxy
subjects:
  - kind: ServiceAccount
    name: k8s-ws-proxy
    namespace: catalyst-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-ws-proxy
  namespace: catalyst-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: bp-k8s-ws-proxy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: bp-k8s-ws-proxy}
    spec:
      serviceAccountName: k8s-ws-proxy
      containers:
        - name: proxy
          image: spike.local/k8s-ws-proxy:main
          imagePullPolicy: Never
          env:
            - {name: SHARED_SECRET_FILE, value: /etc/proxy/hmac}
            - {name: TLS_CERT_FILE, value: /etc/proxy/tls.crt}
            - {name: TLS_KEY_FILE, value: /etc/proxy/tls.key}
            - {name: TLS_CLIENT_CA_FILE, value: /etc/proxy/ca.crt}
            - {name: CLIENT_CERT_ALLOWED_SUBJECTS, value: guacd.guacamole.svc.cluster.local}
            - {name: ALLOWED_NAMESPACES, value: acme}
            - {name: LOG_LEVEL, value: debug}
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          ports:
            - {containerPort: 8080, name: http}
            - {containerPort: 8443, name: https}
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 2
          volumeMounts:
            - name: files
              mountPath: /etc/proxy
              readOnly: true
      volumes:
        - name: files
          configMap:
            name: proxy-files
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-ws-proxy
  namespace: catalyst-system
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: bp-k8s-ws-proxy}
  ports:
    - {name: https, port: 8443, targetPort: 8443}
