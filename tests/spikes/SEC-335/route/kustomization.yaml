apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - all.yaml
patches:
  - target:
      kind: StatefulSet
      name: keycloak
    patch: |-
      - op: test
        path: /spec/template/spec/volumes/1/projected/sources/0/secret/name
        value: keycloak-admin
      - op: remove
        path: /spec/template/spec/volumes/1/projected/sources/0
