<?xml version="1.0" encoding="UTF-8"?>
<!--
  OpenOva mark — the canonical brand glyph.

  Two interlocking arcs (the "OO" pattern). Use this as the icon-only
  variant in compact spaces (favicons, app icons, sidebar mark, "powered
  by OpenOva" lockup icon-position).

  Per Wave 5.70 (#2371), this asset is public + CC-BY-SA-4.0 licensed
  so third-party Blueprint authors (chepherd v0.5 onward) can use it
  with attribution. See brand/README.md for usage rules + lockup
  variants.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" fill="none" aria-label="OpenOva">
  <defs>
    <linearGradient id="oo-mark-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <path
    d="M 300 88.1966 A 150 150 0 1 0 350 200 A 150 150 0 1 1 400 311.8034"
    fill="none"
    stroke="url(#oo-mark-grad)"
    stroke-width="100"
    stroke-linecap="butt"
  />
</svg>
