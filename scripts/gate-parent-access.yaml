# The access of the gate to the parent (FND-079, docs/ledger/plan/spikes/FND-079.md): the objects of
# it that this file holds. The rest of the access (namespace, ServiceAccount, the RoleBinding
# gate-jobs, quota) is not in this file and stays as recorded.
#
#   Role gate-jobs       gains create, get and delete on networkpolicies of its own namespace:
#                        scripts/gate-parent-job.sh creates one NetworkPolicy per run, named as the
#                        run's Job, for the run's Pods only (label batch.kubernetes.io/job-name), with
#                        TCP 6443 and 443 to the addresses of the install under test, /32 each, and
#                        deletes it with the Job.
#   NetworkPolicy gate-egress   the namespace's standing policy: default deny, DNS only. The range
#                        5.37.79.0/24 it allowed before is gone: an install's addresses come from the
#                        cloud's pool and are known only when it exists.
#   Role and RoleBinding catalyst/acceptance-gate-cld-g12   what gate check CLD-G12
#                        (scripts/check-zero-change-plan.sh) needs to run kubectl exec in the parent's
#                        engine Pod (deploy/catalyst-api of the namespace catalyst): get on the
#                        Deployment catalyst-api, get and list on pods, create on pods/exec, in that
#                        namespace only, for the ServiceAccount acceptance-gate/gate. FND-079 recorded
#                        them; the parent did not hold them ("cannot get resource deployments in the
#                        namespace catalyst", gate runs of November 2026). No Secret, no other
#                        namespace, nothing cluster-wide.
#
# Applied on the parent with its admin kubeconfig (creates the objects that are missing and sets the
# others to this file):
#   kubectl apply --server-side --force-conflicts -f scripts/gate-parent-access.yaml
# scripts/check-gate-parent-access.py keeps this file narrow (rules P5 and P6).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gate-jobs
  namespace: acceptance-gate
  labels: {openova.io/work-package: FND-079}
rules:
- {apiGroups: [batch], resources: [jobs], verbs: [create, get, list, watch, delete]}
- {apiGroups: [""], resources: [pods], verbs: [create, get, list, watch, delete]}
- {apiGroups: [""], resources: [pods/log], verbs: [get]}
- {apiGroups: [""], resources: [secrets], verbs: [create, delete]}
- {apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [create, get, delete]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gate-egress
  namespace: acceptance-gate
  labels: {openova.io/work-package: FND-079}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
  - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acceptance-gate-cld-g12
  namespace: catalyst
  labels: {openova.io/work-package: FND-079}
rules:
- {apiGroups: [apps], resources: [deployments], resourceNames: [catalyst-api], verbs: [get]}
- {apiGroups: [""], resources: [pods], verbs: [get, list]}
- {apiGroups: [""], resources: [pods/exec], verbs: [create]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acceptance-gate-cld-g12
  namespace: catalyst
  labels: {openova.io/work-package: FND-079}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: acceptance-gate-cld-g12}
subjects:
- {kind: ServiceAccount, name: gate, namespace: acceptance-gate}
