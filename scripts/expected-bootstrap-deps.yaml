  # ---- Slot 60 — bp-vcluster-helmrepo (convergence blocker #2 —
  # per-tenant vCluster source install on Sovereign).
  # Pre-stages the upstream loft-sh vcluster Helm chart source on the
  # Sovereign cluster so the Organization controller
  # (core/controllers/organization) can render per-tenant
  # `helm.toolkit.fluxcd.io/v2 HelmRelease` CRs that reference
  # `chart.spec.sourceRef name=loft namespace=vcluster-system`. Without
  # this slot, every per-tenant vcluster HelmRelease fails Source
  # reconcile with "HelmRepository.source.toolkit.fluxcd.io \"loft\"
  # not found" → no tenant vCluster is ever spawned. Different layer
  # from slots 54/58/59 which bundle the upstream chart as a subchart
  # for the Sovereign-tier DMZ/MGMT/RTZ vClusters. Default-ON; ships
  # NO upstream subchart (same shape as bp-gateway-api).
  - slot: 60
    name: bp-vcluster-helmrepo
    depends_on:
      - bp-flux
    wave: present

  # ---- Slot 19a — bp-sandbox sandbox-controller (PR #1622, originally slot 61).
  # Renumbered 61 → 19a in Wave 11 convergence fix (PR #1652, 2026-05-18)
  # to sequence AFTER bp-harbor (slot 19). Reconciles
  # `sandbox.openova.io/v1.Sandbox` CRs into per-Sandbox manifests written
  # to the per-Org `catalyst-tenant` Gitea repo (sister of organization-
  # controller). Without this slot, Sandbox CRs sit unhandled — the
  # controller never deploys on Sovereigns. Gated default-OFF via
  # ${SANDBOX_ENABLED:-false} on the bootstrap-kit Kustomization substitute.
  # dependsOn:
  #   - bp-vcluster-helmrepo (slot 60) — Wave 2 wires per-Sandbox
  #     HelmReleases that resolve through this Flux source.
  #   - bp-catalyst-platform (slot 13) — provides `catalyst-system`
  #     Namespace + the `catalyst-gitea-token` Secret the controller's
  #     CATALYST_GITEA_TOKEN env reads via secretKeyRef.
  #   - bp-harbor (slot 19) — Wave 11 convergence fix (PR #1652).
  #     After bp-self-sovereign-cutover Step-06 phase-1 rewrites every
  #     HelmRepository URL `oci://ghcr.io/openova-io` →
  #     `oci://harbor.<sov-fqdn>/openova-io`, source-controller fetches
  #     the sandbox chart through harbor.<sov-fqdn>. Without this edge,
  #     bp-sandbox tries to resolve before bp-harbor is Ready and sits
  #     Reconciling for the full bootstrap-kit timeout. Chicken-and-egg
  #     same shape as Wave 7 #1610 (bp-hcloud-csi REMOVED), resolved by
  #     sequencing rather than removal so the slot remains available.
  - slot: "19a"
    name: bp-sandbox
    # G92.5 #2664 (2026-06-01): RTZ vCluster placement adds
    # bp-rtz-vcluster as a new edge — vc-rtz Secret + the
    # sync.toHost.customResources policy both materialise from that
    # release before sandbox's helm-controller pivot can succeed.
    depends_on:
      - bp-rtz-vcluster
      - bp-vcluster-helmrepo
      - bp-catalyst-platform
      - bp-harbor
      # #3102/#3104 (2026-06-08): sandbox renders an ExternalSecret; the HR's
      # dependsOn gained bp-external-secrets (ESO CRD/webhook ready first) — this
      # edge was added to the HR in #3102 but not declared here, causing the
      # dependency-graph-audit drift that's been red on main (#3104).
      - bp-external-secrets
    wave: present

  # ---- Slot 62 — bp-continuum DR orchestrator (Pillar-3 unblock).
  # Issue #2065 (TBD-V14, 2026-05-20). Reconciles Continuum.dr.openova.io/v1
  # CRs and executes the switchover sequence on lease loss + replication
  # health drop (drain HTTPRoute → flip lua-record → flip CNPG primary →
  # audit on NATS). Default-OFF gate via ${CONTINUUM_ENABLED:-false} on
  # the bootstrap-kit Kustomization substitute; operators flip on once
  # bp-cnpg-pair + lease witness are configured.
  #
  # dependsOn:
  #   - bp-catalyst-platform (slot 13) — owns the `dr.openova.io/v1.Continuum`
  #     CRD that the controller watches. Without this edge, Helm render-time
  #     Capabilities gate fails the install (no matches for kind "Continuum").
  #   - bp-nats-jetstream (slot 7) — catalyst.audit publish target the
  #     controller emits switchover audit events to.
  #   - bp-powerdns (slot 11) — pool-domain-manager fronts PowerDNS; the
  #     controller POSTs lua-record commits during the flip step.
  #
  # bp-cnpg-pair (Pillar-3 follow-up #2068) is intentionally NOT in
  # dependsOn — chart ships default-OFF so the controller installs and
  # waits idle until operators flip the gate after wiring bp-cnpg-pair.
  - slot: 62
    name: bp-continuum
    depends_on: [bp-catalyst-platform, bp-nats-jetstream, bp-powerdns]
    wave: present

