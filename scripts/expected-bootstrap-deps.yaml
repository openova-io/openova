# Expected dependency DAG for clusters/_template/bootstrap-kit/*.yaml
#
# Authoritative spec: docs/ARCHITECTURE.md §2.
# Consumed by:        scripts/check-bootstrap-deps.sh
# Updated by:         W2.K0 (slots 01-14 baseline + slots 15-48 forward declarations)
#                     W2.K1, K2, K3, K4 PRs add the corresponding HR files; this
#                     file already declares the expected deps for those slots so
#                     each W2 PR can be mechanically verified at merge time.
#
# Schema:
#   slots:
#     - slot: <int>             # numeric prefix on the HR file (01..48)
#       name: <string>          # value of metadata.name on the HelmRelease
#       depends_on: [<string>]  # ordered or unordered; comparison is set-based
#       wave: <"present"|"W2.K1"|"W2.K2"|"W2.K3"|"W2.K4">
#
# Comparison semantics enforced by check-bootstrap-deps.sh:
#   - Each HR file present on disk MUST declare exactly the depends_on set listed
#     here (missing edges -> error, extra edges -> error).
#   - HRs declared here but not yet present on disk are reported as "deferred"
#     (info, not an error) so that this file can be the static authoritative list
#     while W2.K1..K4 land their HR files in series.
#   - The graph is checked for cycles after merging declared+actual edges.
#
# The slot-numbering convention is documented in BOOTSTRAP-KIT-EXPANSION-PLAN.md §3.

slots:
  # ---- Tier 0-4: present today (post-PR-247 baseline) -----------------------
  - slot: 1
    name: bp-cilium
    # G65 (META-AUDIT 1 sub-class 11, #2105 / #2106): Cilium 1.16's
    # `gatewayAPI.enabled=true` controller fails to start with `CRD
    # gateway.networking.k8s.io/v1.Gateway not found` unless the
    # upstream Kubernetes Gateway API CRDs are already registered with
    # the apiserver. The cleanest fix is dep ordering — install
    # bp-gateway-api FIRST (slot 1a's chart is CRD-only and has no
    # cluster-network requirement), then bp-cilium. Same shape as
    # bp-crossplane-claims dependsOn bp-crossplane (CRD provider →
    # CRD consumer).
    depends_on: [bp-gateway-api]
    wave: present
  - slot: 1a
    name: bp-gateway-api
    # Upstream Kubernetes Gateway API CRDs (Standard channel — issue #503).
    # G65 (2026-05-31): bp-gateway-api ships first (no upstream cluster
    # dep) and bp-cilium gates on its Ready. This chart is CRD-only +
    # tiny so it converges before bp-cilium's controller image pull.
    depends_on: []
    wave: present
  - slot: 2
    name: bp-cert-manager
    depends_on: [bp-cilium]
    wave: present
  - slot: "02a"
    name: bp-cert-manager-issuers
    # The two Catalyst Let's Encrypt ClusterIssuers (letsencrypt-dns01-prod,
    # letsencrypt-http01-prod). Split from bp-cert-manager (issue #3734) to
    # resolve the helm-controller RESTMapper-cache CRD-ordering race — the
    # ClusterIssuer CRs cannot live in the same Helm release as the
    # cert-manager subchart that registers their CRD (the cached RESTMapper,
    # built before the CRD exists, never refreshes → `no matches for kind
    # "ClusterIssuer"` on the in-release hook → InstallFailed loop, live
    # hw157). A separate HR gets a fresh reconcile after bp-cert-manager is
    # Ready whose RESTMapper maps the kind. Mirrors bp-external-secrets ↔
    # bp-external-secrets-stores and bp-crossplane ↔ bp-crossplane-claims.
    depends_on: [bp-cert-manager]
    wave: present
  - slot: 3
    name: bp-flux
    depends_on: [bp-cert-manager]
    wave: present
  - slot: 4
    name: bp-crossplane
    depends_on: [bp-flux]
    wave: present
  - slot: 5
    name: bp-sealed-secrets
    depends_on: [bp-cert-manager]
    wave: present
  - slot: "5a"
    name: bp-reflector
    # emberstack/reflector — secret/configmap mirror controller (issue #543).
    # Propagates ghcr-pull secret to every namespace so cross-namespace
    # ImagePullBackOff gaps are eliminated. Slot 5a: after sealed-secrets,
    # before spire. dependsOn bp-cert-manager (CRDs must exist).
    # Used by bp-gitea + bp-harbor to propagate CNPG-generated pg-app Secrets.
    depends_on: [bp-cert-manager]
    wave: present
  - slot: 6
    name: bp-dragonfly
    # bp-dragonfly (#4639) — per-cluster P2P container-image distribution
    # (Manager + Scheduler + Seed Peer + per-node dfdaemon DaemonSet). dfdaemon
    # serves each node's containerd registry-mirror at 127.0.0.1:4001; each blob
    # is fetched from ghcr ONCE per cluster then distributed P2P over the LAN.
    # Replaces the centralized bastion proxy-cache + per-cloud hairpin registry-
    # pivot. Ordered EARLY (after CNI + flux, before the image-heavy components)
    # so later HRs' pulls flow through the mesh. dependsOn bp-cilium — dfdaemon
    # is hostNetwork and the P2P mesh rides the pod network (CNI must be Ready).
    # Self-contained per cluster — no cross-plane/cross-region image path. The
    # post-cutover registry-pivot (ghcr → local Harbor) is a SEPARATE later step.
    depends_on: [bp-cilium]
    wave: present
  - slot: 7
    name: bp-nats-jetstream
    # G92.2 #2661 (2026-06-01): MGMT vCluster placement. HR carries
    # spec.kubeConfig.secretRef → vc-mgmt + dependsOn bp-mgmt-vcluster
    # so the install gates on the vCluster being Ready (otherwise the
    # kubeconfig Secret doesn't exist and helm-controller errors).
    depends_on: []
    wave: present
  - slot: 8
    name: bp-openbao
    # bp-gateway-api dep (issue #503): chart ships an HTTPRoute template;
    # gateway.networking.k8s.io/v1 CRDs must be registered before install.
    # bp-cnpg dep (issue #512): post-install init hook (`bao operator init`)
    # races cnpg readiness on a fresh Sovereign, hitting the 15m install
    # timeout. Explicit dep makes Flux wait for cnpg Ready=True first.
    # G92.2 #2661 (2026-06-01): MGMT vCluster placement added
    # bp-mgmt-vcluster as a new edge — REVERTED by G105-followup
    # PR #2697/#2715/#2717/#2719/#2720 (vCluster lacks Gateway API +
    # ExternalSecret CRDs + mgmt namespace inside itself). App installs
    # on HOST until vCluster CRD sync ships.
    # #3642 (2026-06-17): RE-ADDED via the OSS host-bridge — openbao re-homes
    # into the mgmt vCluster (placement.yaml vcluster:mgmt + hostBridge:), so
    # the runtime edge is back (the vc-mgmt Secret must be Ready first). The
    # route + SSO ExternalSecret are HOST-rendered by the host-bridge, so no
    # loft.sh license is needed.
    depends_on: [bp-gateway-api, bp-cnpg]
    wave: present
  - slot: 9
    name: bp-keycloak
    # bp-gateway-api dep (issue #503): chart ships an HTTPRoute template.
    # G92.2 #2661 (2026-06-01): MGMT vCluster placement added
    # bp-mgmt-vcluster — REVERTED by G105-followup (see slot 8 note).
    # #3373 (2026-06-13): MGMT vCluster placement RESTORED behind the 3
    # platform-level coupling fixes (vcluster CRD-sync for HTTPRoute/
    # ExternalSecret + gateway.backendService alias + ESO-in-HR-ns) —
    # bp-mgmt-vcluster edge re-added; placement now lives in
    # clusters/_template/bootstrap-kit/placement.yaml (placement-as-data).
    # bp-postgres-shared dep (#3188 three-instance model): when keycloak
    # SHARES the shared-pg instance A (SOVEREIGN_KEYCLOAK_PG_OWN_CLUSTER=
    # false), gate on it so the keycloak Database + role + reflected
    # keycloak-database-secret exist first. Harmless in the default 1:1
    # path (empty-Ready release) — same shape as slots 10/19. No cycle:
    # bp-postgres-shared ← {bp-cnpg ← bp-flux, bp-reflector ←
    # bp-cert-manager}; none of those reaches bp-keycloak.
    depends_on: [bp-cert-manager, bp-gateway-api, bp-postgres-shared]
    wave: present
  - slot: 10
    name: bp-gitea
    # bp-gateway-api dep (issue #503): chart ships an HTTPRoute template.
    # bp-cnpg dep (issue #584): chart ships a CNPG Cluster CR; postgresql.cnpg.io/v1
    # CRD must be registered before bp-gitea applies so Capabilities gate fires.
    # bp-postgres-shared dep (ADR-0010 #3188): when gitea SHARES the shared-pg
    # data-instance (SOVEREIGN_GITEA_PG_OWN_CLUSTER=false), gate on the shared
    # instance so its gitea Database + role + reflected secret exist first.
    # Harmless in the default 1:1 path (dependency just waits for shared-pg Ready).
    # G92.3 #2662 (2026-06-01): MGMT vCluster placement added
    # bp-mgmt-vcluster — REVERTED by G105-followup (see slot 8 note).
    # #3373 (2026-06-13): restored (placement-as-data; see slot 09 note).
    depends_on: [bp-keycloak, bp-gateway-api, bp-cnpg, bp-postgres-shared]
    wave: present
  - slot: 11
    name: bp-powerdns
    # bp-gateway-api dep (issue #503): chart ships an api-httproute.yaml template.
    # bp-cnpg dep: chart's templates/cnpg-cluster.yaml renders a
    # postgresql.cnpg.io/v1.Cluster gated on Capabilities.APIVersions.
    # Without this dep Helm renders before the CRD is registered, the
    # gate evaluates false, the Cluster CR is silently skipped, CNPG
    # never creates pdns-pg-app, and powerdns Pods fail at boot with
    # "secret pdns-pg-app not found" (caught live during otech28).
    depends_on: [bp-cert-manager, bp-gateway-api, bp-cnpg]
    wave: present
  - slot: "11a"
    name: bp-powerdns-admin
    # G91.powerdns-admin (#2656, 2026-05-31): PowerDNS-Admin web UI on
    # top of bp-powerdns. Chart constructed in-house (no upstream Helm).
    # bp-powerdns dep — PDA reads PDNS_API_URL + pdns-api-credentials
    # which only land after slot 11 Ready. bp-cnpg dep — chart ships
    # its own pda-pg Cluster CR. bp-keycloak + bp-sso-bridge — SSO via
    # G91.1 framework. bp-external-secrets-stores — pda-sso-oidc-
    # credentials ExternalSecret. bp-reflector — mirrors CNPG-generated
    # pda-pg-app Secret into pda-database-secret in the chart namespace.
    # bp-gateway-api — HTTPRoute.
    # bp-postgres-shared-b (#3370): pda adopts the shared-pg-b `pda`
    # Context when SOVEREIGN_PDA_PG_OWN_CLUSTER=false (one-flag
    # enable_shared_pg contract); harmless empty-Ready edge otherwise.
    depends_on:
      - bp-powerdns
      - bp-cnpg
      - bp-keycloak
      - bp-sso-bridge
      - bp-external-secrets-stores
      - bp-reflector
      - bp-gateway-api
      - bp-postgres-shared-b
    wave: present
  - slot: 12
    name: bp-external-dns
    # bp-reflector dep (issue #543): external-dns HTTPRoute uses reflector-mirrored
    # ghcr-pull secret; reflector must be Ready before external-dns deploys.
    depends_on: [bp-cert-manager, bp-powerdns, bp-reflector]
    wave: present
  - slot: "12a"
    name: bp-sovereign-tls-vars
    # #5187: pure ConfigMap render off cloud-init substitute values already
    # known at this point in the DAG (SOVEREIGN_FQDN / PARENT_DOMAINS_YAML /
    # consoleGateway ports) — no CRDs, no cluster-network requirement, no
    # dependency on any other slot. Installs on EVERY region (no
    # region-role/suspend gate), unlike bp-catalyst-platform (slot 13,
    # primary-only) which used to render this same ConfigMap.
    depends_on: []
    wave: present
  - slot: 13
    name: bp-catalyst-platform
    # bp-gateway-api dep (issue #503): umbrella chart ships catalyst-ui +
    # catalyst-api HTTPRoute templates.
    # bp-keycloak + bp-cnpg deps (issue #512): umbrella post-install Jobs
    # bootstrap OIDC clients + seed PG schemas; both deps take 5+ min to
    # reach Ready on a fresh Sovereign, racing the 15m install timeout.
    # Explicit deps make Flux wait for both Ready=True before umbrella starts.
    # bp-crossplane-claims dep (chart-roll-rca iter-15, 2026-05-10): owns
    # the access.openova.io/v1alpha1 XRD that qa-fixtures UserAccess CRs
    # require. Without this edge, slot 13 races slot 14 and umbrella
    # upgrade fails admission with `no matches for kind "UserAccess"`.
    # #3373 (2026-06-13): bp-mgmt-vcluster — the umbrella now installs
    # INSIDE the mgmt vCluster (placement-as-data; see slot 09 note).
    # bp-postgres-shared-c (#3370): the Organization mesh adopts shared-pg-c's
    # org_* Contexts when SOVEREIGN_ORG_PG_OWN_CLUSTER=false (one-flag
    # enable_shared_pg contract); harmless empty-Ready edge otherwise.
    depends_on: [bp-gitea, bp-gateway-api, bp-keycloak, bp-cnpg, bp-crossplane-claims, bp-postgres-shared-c]
    wave: present
  - slot: 14
    name: bp-crossplane-claims
    depends_on: [bp-crossplane]
    wave: present
  - slot: "13b"
    name: bp-sso-bridge
    # G91.1 framework (Refs #2652, worker-1 commit 174a0ad3): the
    # bp-sso-bridge reconciler watches every HR cluster-wide; when an
    # HR declares `sso.enabled: true` it materialises the matching
    # Keycloak Client + ExternalSecret + grants the Sovereign operator
    # the per-app admin role. Needs bp-keycloak (Sovereign realm) +
    # bp-openbao (KV2 client_secret store) + bp-catalyst-platform
    # (sovereign-fqdn ConfigMap with `orgEmail` key) all Ready.
    depends_on: [bp-keycloak, bp-openbao]
    wave: present
  - slot: "13c"
    name: bp-oidc-gate
    # #3374: the ONE generic OIDC gate — per-app oauth2-proxy instances
    # bringing login-less external apps (first: openova-flow) under the
    # zero-click SSO contract. Needs bp-cilium (gateway), bp-keycloak
    # (sovereign realm issuer) and bp-external-secrets-stores
    # (ClusterSecretStore vault-region1 for the client-secret
    # ExternalSecret). Deliberately NOT bp-sso-bridge — the gate serves
    # 302s before the client bundle lands; the ExternalSecret converges
    # eventually (same pattern as the Tier-1/2 SSO apps).
    depends_on: [bp-cilium, bp-keycloak, bp-external-secrets-stores]
    wave: present

  # ---- Tier 5: storage + DB (W2.K1, slots 15-19) ----------------------------
  - slot: 15
    name: bp-external-secrets
    # MUST NOT dependOn bp-openbao (#2985/#2986): openbao ships an ExternalSecret
    # needing THIS HR's CRD, so depending on openbao deadlocks the fresh-prov
    # cascade. The ESO controller needs only cert-manager (webhook TLS); the
    # openbao-backed SecretStore binding lives on bp-external-secrets-stores (15a).
    depends_on: [bp-cert-manager]
    wave: W2.K1
  - slot: 15a
    name: bp-external-secrets-stores
    # Default ClusterSecretStore CR(s). Split from bp-external-secrets@1.0.0
    # at PR #334 (issue #331) to resolve CRD-ordering deadlock —
    # ClusterSecretStore CR cannot live in the same Helm release as the ESO
    # subchart that registers its CRD. Mirrors bp-crossplane ↔
    # bp-crossplane-claims pattern.
    depends_on: [bp-external-secrets, bp-openbao]
    wave: W2.K1
  - slot: 16
    name: bp-cnpg
    # #3971 / #892 — gate on BOTH per-provider cloud-CSI slots so the durable
    # default StorageClass EVERY cnpg PVC (shared-pg / cnpg-pair / harbor /
    # keycloak / gitea downstream) needs EXISTS before any PVC binds now that
    # k3s runs --disable=local-storage (local-path FORBIDDEN). On Hetzner the
    # default class is bp-hcloud-csi's hcloud-volumes; on Huawei it is
    # bp-huawei-evs-csi's evs-ssd. bp-hcloud-csi renders EMPTY on Huawei (Ready
    # with NO class), so gating on it ALONE froze Huawei PVCs classless before
    # evs-ssd landed (hw182). Both CSI slots are active-but-empty on the OTHER
    # provider so neither dependsOn deadlocks.
    depends_on: [bp-flux, bp-hcloud-csi, bp-huawei-evs-csi]
    wave: W2.K1
  - slot: 16a
    name: bp-postgres-shared
    # ADR-0010 (#3188): the SHARED bp-postgres data-instance (shared-pg).
    # ONE CNPG Cluster that bp-harbor + bp-gitea run off via two isolated
    # Database CRs + two roles. Pure declarative YAML — no controller, no
    # Crossplane. dependsOn bp-cnpg (the operator + CRDs) + bp-reflector
    # (mirrors the role Secrets into the harbor + gitea namespaces).
    depends_on: [bp-cnpg, bp-reflector]
    wave: W2.K1
  # bp-cnpg-pair (slot 16b) — Pillar-3 cross-region DR primitive (#3195,
  # Refs #3189). Depends on bp-cnpg (slot 16) which provides the
  # postgresql.cnpg.io Cluster CRD + mutating webhook the pair's Cluster
  # CRs gate on. SAFE-BY-DEFAULT: gated ${SOVEREIGN_ENABLE_HOT_STANDBY}
  # so single-region renders zero resources (HR installs an empty
  # release). The check-bootstrap-deps audit keys on the HR's static
  # dependsOn (the gate is a values-substitute, orthogonal to the DAG).
  - slot: 16b
    name: bp-cnpg-pair
    depends_on: [bp-cnpg]
    wave: present
  # bp-postgres-shared-b (slot 16c) + bp-postgres-shared-c (slot 16d) —
  # instances B + C of the #3188 three-instance model (founder NS-2):
  # three installs of the SAME bp-postgres chart, all gated
  # ${SOVEREIGN_ENABLE_SHARED_PG}. B (shared-pg-b) carries grafana
  # (flipped, slot 25) + powerdns/powerdns-admin (ready-to-adopt); C
  # (shared-pg-c) carries the Organization mesh (ready-to-adopt). Same edges as
  # 16a: bp-cnpg (operator + CRDs), bp-reflector (hub-Secret push).
  - slot: 16c
    name: bp-postgres-shared-b
    depends_on: [bp-cnpg, bp-reflector]
    wave: W2.K1
  - slot: 16d
    name: bp-postgres-shared-c
    depends_on: [bp-cnpg, bp-reflector]
    wave: W2.K1
  - slot: 17
    name: bp-valkey
    # #3373 Batch A (2026-06-14): bp-valkey moved INTO the rtz vCluster
    # (placement.yaml) — the generator adds the bp-rtz-vcluster runtime edge
    # (the vc-rtz Secret doesn't exist until that HR is Ready). Same pattern as
    # loki/mimir/tempo declaring bp-mgmt-vcluster.
    depends_on: [bp-flux]
    wave: W2.K1
  - slot: 18
    name: bp-seaweedfs
    # #3373 Batch A (2026-06-14): bp-seaweedfs moved INTO the rtz vCluster
    # (placement.yaml) — the generator adds the bp-rtz-vcluster runtime edge
    # (the vc-rtz Secret doesn't exist until that HR is Ready). Same pattern as
    # loki/mimir/tempo declaring bp-mgmt-vcluster.
    depends_on: [bp-flux, bp-cert-manager]
    wave: W2.K1
  - slot: 19
    name: bp-harbor
    # bp-seaweedfs dependency REMOVED per ADR-0001 §13 (cloud-direct).
    # Harbor on Sovereigns writes blobs directly to cloud Object Storage
    # (Hetzner / R2 / S3 / Azure / GCS), not via SeaweedFS. See
    # clusters/_template/bootstrap-kit/19-harbor.yaml lines 35-37.
    # bp-gateway-api dep (issue #503): chart ships an HTTPRoute template;
    # gateway.networking.k8s.io/v1 CRDs must be registered first.
    # G92.3 #2662 (2026-06-01): MGMT vCluster placement adds
    # bp-mgmt-vcluster as a new edge.
    # #3052-followup (2026-06-04, hw95): the chart ships an
    # externalsecret.external-secrets.io — Harbor must wait for the
    # external-secrets admission webhook to be serving or its create
    # fails ("failed calling webhook validate.externalsecret") → 6
    # install failures → Stalled (#2988 pattern).
    # bp-postgres-shared dep (ADR-0010 #3188): when harbor SHARES the
    # shared-pg data-instance (SOVEREIGN_HARBOR_PG_OWN_CLUSTER=false), gate
    # on the shared instance so its registry Database + role + reflected
    # secret exist first. Harmless in the default 1:1 path.
    depends_on: [bp-cnpg, bp-cert-manager, bp-gateway-api, bp-external-secrets, bp-postgres-shared]
    wave: W2.K1
  - slot: 6a
    name: bp-self-sovereign-cutover
    # Post-handover self-sovereignty cutover (issue #791). Filename
    # carries the 06a- prefix to colocate cohorts visually but the slot
    # depends on bp-gitea + bp-harbor and therefore actually installs
    # AFTER both. Chart ships dormant — catalyst-api stamps Jobs from
    # the chart's PodSpec ConfigMaps only on operator-driven trigger.
    #
    # NOTE: PR #1875 attempted to add `sovereign-tls` to this list
    # but that was reverted by PR #1879 — `sovereign-tls` is a Flux
    # Kustomization, not a HelmRelease, so HelmRelease.dependsOn
    # cannot reference it (helm-controller logged "not found", chart
    # parked Stalled, handover never fired). The cross-kind ordering
    # is now enforced upstream by the cloud-init / Kustomization
    # graph rather than by an entry in this list.
    #
    # #4639: + bp-dragonfly. The cutover registry-pivot (step-04, the
    # Dragonfly rewrite) flips the bp-dragonfly dfdaemon mesh's upstream
    # ghcr -> local Harbor + adds the registry.<fqdn> -> cilium-gateway
    # hostAlias. The dfdaemon DaemonSet + seed-peer + their ConfigMaps
    # (slot 06) must exist before step-04 can patch them, so the cutover
    # HR depends on bp-dragonfly being Ready.
    depends_on: [bp-gitea, bp-harbor, bp-dragonfly]
    wave: W2.K1

  # ---- Tier 6: observability (W2.K2, slots 19c, 20-26) ---------------------
  - slot: 19c
    name: bp-opentelemetry-operator
    # Wave 5.41 (#2227) chart-split — Operator + CRDs in this slot, Collector
    # + CR in slot 20. Eliminates the Helm-3-doesn't-install-subchart-CRDs-on-
    # upgrade race that broke hw01 across Wave 5.36/5.38/5.39/5.40.
    depends_on: [bp-cert-manager]
    wave: W2.K2
  - slot: 20
    name: bp-opentelemetry
    # dependsOn bp-opentelemetry-operator added by Wave 5.41 chart-split so
    # the Collector (this chart) installs only AFTER the Instrumentation CRD
    # is registered. Without the operator-Ready gate, the upgrade path from
    # Wave 5.36's bundled-Operator shape would re-fail on hw01.
    depends_on: [bp-cert-manager, bp-opentelemetry-operator]
    wave: W2.K2
  - slot: 21
    name: bp-alloy
    depends_on: [bp-opentelemetry]
    wave: W2.K2
  # #2745 (2026-06-12): loki/mimir/tempo re-homed INSIDE the mgmt
  # vCluster (NS-1 founder DoD, audit PROMOTE-NOW). Each gains the
  # bp-mgmt-vcluster edge so the install gates on the vc-mgmt
  # kubeconfig Secret existing before helm-controller attempts the
  # kubeConfig pivot (same shape as bp-coraza/bp-dmz-vcluster G92.4).
  #
  # Refs #840 (2026-06-18): bp-seaweedfs edge REMOVED from all three —
  # mirrors the slot-19 bp-harbor seaweedfs-dep removal (ADR-0001 §13).
  # The DEFAULT renders are filesystem (loki), bundled MinIO (mimir),
  # local PVC (tempo) — NONE consume SeaweedFS S3 (the "MUST overlay to
  # S3" was specced in slot-comments but never written). The old edge was
  # a FALSE coupling that gated the LGTM stack — and grafana (which
  # dependsOn loki/mimir/tempo) — on the rtz-vCluster seaweedfs HR reaching
  # Ready, needlessly wedging convergence in the SECONDARY region when
  # seaweedfs is slow/not-Ready there (hw159 region-b 41/55). A future
  # overlay that flips any of them to SeaweedFS S3 MUST re-add the edge.
  - slot: 22
    name: bp-loki
    depends_on: []
    wave: W2.K2
  - slot: 23
    name: bp-mimir
    depends_on: []
    wave: W2.K2
  - slot: 24
    name: bp-tempo
    depends_on: []
    wave: W2.K2
  - slot: 25
    name: bp-grafana
    # bp-gateway-api dep (issue #503): chart ships an HTTPRoute template.
    # bp-postgres-shared-b dep (#3188 three-instance model): when grafana
    # SHARES the shared-pg-b instance, gate on it so the reflector-pushed
    # grafana-database-env hub Secret exists before grafana's Deployment
    # references it (envFromSecrets, optional=false in shared mode).
    # Harmless in the default path (empty-Ready release).
    # bp-external-secrets dep (#3374, 2026-06-14): grafana's chart guards on
    # the ESO CRD (.Capabilities .Has "external-secrets.io/v1beta1") and gates
    # on bp-external-secrets so the ESO webhook is serving before grafana's
