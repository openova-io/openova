# The exception register: every Secret object that the platform allows in a
# platform namespace (decision record 0018, S17). Guard G10
# (scripts/check-secret-object-register.sh) checks this file on every pull
# request; gate check SEC-G11 counts the Secrets of the gate Sovereign that no
# entry matches.
#
# Classes. K: a Kubernetes or controller interface accepts only a Secret
# reference; kept, reviewed yearly. U: an upstream chart's pod can consume
# nothing else today; names its removal package. T: a transitional stop-gap;
# names its removal package. An Application credential is never class K.
#
# allowedUnmatched is the census limit of SEC-G11: in each region, at most this
# many Secrets of the platform namespaces match no entry. SEC-096 set it to 432,
# the highest count of one region in the first gate record that ran SEC-G11,
# docs/ledger/acceptance/hw307-20261115T124804Z-66a6.json. Only SEC-248 changes
# it again, and it may only be lowered. An entry is added or removed by the
# package that adds or removes its Secret.
schema: openova.io/secret-object-register/v1
allowedUnmatched: 432
entries:
  - id: gateway-wildcard-tls
    namespace: kube-system
    name: "^sovereign-wildcard-tls-[a-z0-9-]+$"
    class: K
    consumer: "Gateway listener certificateRefs (clusters/_template/sovereign-tls/cilium-gateway.yaml)"
    reason: "A Gateway listener takes its certificate only from a Secret; cert-manager writes it."
    removal: none
    reviewBy: "2027-11-01"
  - id: shared-pg-operator
    namespace: shared-data
    name: "^shared-pg(-b|-c)?(-replica)?-(ca|replication|server|superuser)$"
    class: K
    consumer: "CloudNativePG Clusters shared-pg, shared-pg-b and shared-pg-c (kit slots 16a, 16c, 16d)"
    reason: "The database operator writes its certificates and its replication and superuser logins as Secrets."
    removal: none
    reviewBy: "2027-11-01"
  - id: shared-pg-role-passwords
    namespace: shared-data
    name: "^(shared-pg-(harbor|gitea|keycloak)|shared-pg-b-(grafana|pdns|pda)|shared-pg-c-(org|newapi|openova-flow))$"
    class: U
    consumer: "CloudNativePG Cluster spec.managed.roles[].passwordSecret (platform/postgres/chart/templates/role-secrets.yaml)"
    reason: "The database operator reads a managed role's password only from a Secret."
    removal: SEC-290
    reviewBy: "2027-11-01"
  - id: keycloak-admin
    namespace: keycloak
    name: "^keycloak-admin$"
    class: U
    consumer: "keycloak.auth.existingSecret of the upstream Keycloak chart (platform/keycloak/chart/templates/admin-credentials.yaml)"
    reason: "The upstream Keycloak pod reads its administrator password only from a Secret."
    removal: SEC-341
    reviewBy: "2027-11-01"
  - id: gitea-oauth-source
    namespace: gitea
    name: "^gitea-oauth-source-credentials$"
    class: U
    consumer: "the sign-on configurer of bp-gitea (platform/gitea/chart/templates/sso-configure-deployment.yaml)"
    reason: "The sign-on client secret reaches Gitea through a Secret until its pods take a mounted file."
    removal: SEC-342
    reviewBy: "2027-11-01"
  - id: harbor-sso-oidc
    namespace: harbor
    name: "^harbor-sso-oidc-credentials$"
    class: U
    consumer: "the sign-on configurer of bp-harbor (platform/harbor/chart/templates/sso-configure-deployment.yaml)"
    reason: "The sign-on client secret reaches Harbor through a Secret until its pods take a mounted file."
    removal: SEC-343
    reviewBy: "2027-11-01"
  - id: grafana-sso-oidc
    namespace: grafana
    name: "^grafana-sso-oidc-credentials$"
    class: U
    consumer: "envFromSecret of the upstream Grafana chart (platform/grafana/chart/values.yaml)"
    reason: "The upstream Grafana pod reads its sign-on client secret only from a Secret."
    removal: SEC-344
    reviewBy: "2027-11-01"
  - id: pda-sso-oidc
    namespace: powerdns-admin
    name: "^pda-sso-oidc-credentials$"
    class: U
    consumer: "envFrom.secretRef of the PowerDNS-Admin Deployment (platform/powerdns-admin/chart/templates/deployment.yaml)"
    reason: "PowerDNS-Admin reads its sign-on settings only from the environment."
    removal: SEC-345
    reviewBy: "2027-11-01"
  - id: registry-pull-login
    namespace: "*"
    name: "^ghcr-pull$"
    class: T
    consumer: "imagePullSecrets of the kit HelmReleases (kit key REGISTRY_PULL_SECRET), copied into the platform namespaces by the reflector"
    reason: "One shared pull login, written by cloud-init into flux-system, until each Sovereign gets a robot of its own."
    removal: SOV-810
    reviewBy: "2027-11-01"
  - id: cloud-credentials
    namespace: flux-system
    name: "^cloud-credentials$"
    class: T
    consumer: "HelmRelease spec.valuesFrom of the kit and the OpenTofu provider of Crossplane"
    reason: "The cloud provisioning credential, written by cloud-init, until the provider pods read a mounted file."
    removal: SEC-198
    reviewBy: "2027-11-01"
  - id: binding-harbor
    namespace: "*"
    name: "^harbor-database-secret(-x-harbor-x-mgmt-vcluster)?$"
    class: T
    consumer: "the database binding of bp-harbor (kit slot 16a, reflect.secretName)"
    reason: "Reflected binding Secret of the shared PostgreSQL, until bp-harbor takes its database login by injection."
    removal: SEC-234
    reviewBy: "2027-11-01"
  - id: binding-gitea
    namespace: "*"
    name: "^gitea-database-secret(-x-gitea-x-mgmt-vcluster)?$"
    class: T
    consumer: "the database binding of bp-gitea (kit slot 16a, reflect.secretName)"
    reason: "Reflected binding Secret of the shared PostgreSQL, until bp-gitea takes its database login by injection."
    removal: SEC-233
    reviewBy: "2027-11-01"
  - id: binding-keycloak
    namespace: "*"
    name: "^keycloak-database-secret(-x-keycloak-x-mgmt-vcluster)?$"
    class: T
    consumer: "the database binding of bp-keycloak (kit slot 16a, reflect.secretName)"
    reason: "Reflected binding Secret of the shared PostgreSQL, until bp-keycloak takes its database login by injection."
    removal: SEC-221
    reviewBy: "2027-11-01"
  - id: binding-grafana
    namespace: "*"
    name: "^grafana-database-env(-x-grafana-x-mgmt-vcluster)?$"
    class: T
    consumer: "the database binding of bp-grafana (kit slot 16c, reflect.secretName)"
    reason: "Reflected binding Secret of the shared PostgreSQL, until Grafana takes its database login by injection."
    removal: SEC-344
    reviewBy: "2027-11-01"
  - id: binding-powerdns
    namespace: "*"
    name: "^pdns-database-secret$"
    class: T
    consumer: "the database binding of bp-powerdns (kit slot 16c, reflect.secretName)"
    reason: "Reflected binding Secret of the shared PostgreSQL, until bp-powerdns takes its database login by injection."
    removal: SEC-235
    reviewBy: "2027-11-01"
  - id: binding-powerdns-admin
    namespace: "*"
    name: "^pda-shared-database-secret$"
    class: T
    consumer: "the database binding of bp-powerdns-admin (kit slot 16c, reflect.secretName)"
    reason: "Reflected binding Secret of the shared PostgreSQL, until bp-powerdns-admin takes its database login by injection."
    removal: SEC-236
    reviewBy: "2027-11-01"
  - id: binding-org-services
    namespace: "*"
    name: "^org-database-secret$"
    class: T
    consumer: "the database binding of the Organization services of bp-catalyst-platform (kit slot 16d, reflect.secretName)"
    reason: "Reflected binding Secret of the shared PostgreSQL, until the Organization services take their database login by injection."
    removal: SEC-224
    reviewBy: "2027-11-01"
  - id: parent-bootstrap-token
    namespace: kube-system
    name: "^parent-bootstrap-token$"
    class: T
    consumer: "the token of the kubeconfig that each region posts back to the parent at first boot (ServiceAccount kube-system/parent-bootstrap, infra/providers/_shared/cloudinit-control-plane.tftpl)"
    reason: "Kubernetes keeps a ServiceAccount token without expiry only in a Secret of type kubernetes.io/service-account-token; the parent reaches the Sovereign with it until the parent release revokes that access."
    removal: SOV-435
    reviewBy: "2027-11-01"
  - id: mail-server-tls
    namespace: platform
    name: "^bp-stalwart-sovereign-mail-tls$"
    class: K
    consumer: "the certificate of the submission host mail.<fqdn>, mounted by the Sovereign's own mail server (platform/stalwart-sovereign/chart/templates/certificate.yaml, kit slot 95)"
    reason: "cert-manager writes an issued certificate only as a Secret; the mail server reads it from a mounted volume."
    removal: none
    reviewBy: "2027-11-01"
metadataAccess: []
