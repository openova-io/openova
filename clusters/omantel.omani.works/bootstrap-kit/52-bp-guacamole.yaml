# bp-guacamole — omantel-side bootstrap-kit slot. See
# clusters/_template/bootstrap-kit/37-bp-guacamole.yaml for the full
# canonical comment-block + dependency rationale.
#
# qa-loop iter-7 Fix #39: closes the gap surfaced by Fix #36's
# scope-narrow confession. CI workflow .github/workflows/build-bp-guacamole.yaml
# mirrors upstream Apache Guacamole 1.5.5 to GHCR and publishes
# bp-guacamole:0.1.1; this slot installs it on omantel so
# TC-228/TC-230/TC-245/TC-246 flip PASS.

---
apiVersion: v1
kind: Namespace
metadata:
  name: guacamole
  labels:
    catalyst.openova.io/sovereign: omantel.omani.works
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-guacamole
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-guacamole
  namespace: flux-system
spec:
  interval: 15m
  releaseName: guacamole
  targetNamespace: catalyst-system
  dependsOn:
    - name: bp-cilium
    - name: bp-cert-manager
    - name: bp-keycloak
    - name: bp-sealed-secrets
    - name: bp-seaweedfs
    - name: bp-k8s-ws-proxy
  chart:
    spec:
      chart: bp-guacamole
      # 0.1.9 (qa-loop iter-11 Fix #45 Cluster-A): storageClass-
      # migration pre-install/pre-upgrade hook. The live bp-guacamole HR
      # wedged on omantel iter-11 because the existing
      # `guacamole-recordings` PVC was bound to local-path while the
      # in-cluster HR object had `seaweedfs-storage` (drift between
      # the on-disk overlay below and what was already on the API
      # server). With this version the chart's pre-upgrade hook reads
      # the existing PVC and either no-ops (storageClass matches) or
      # deletes the PVC + bound PV so the post-render PVC manifest
      # creates cleanly with whatever storageClass is desired.
      version: 0.1.9
      sourceRef:
        kind: HelmRepository
        name: bp-guacamole
        namespace: flux-system
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    remediation:
      retries: 3
  values:
    guacamole:
      enabled: true
      httproute:
        # The chroot Sovereign exposes services under omantel.biz —
        # see live HTTPRoutes in catalyst-system (catalyst-ui hostname
        # console.omantel.biz). Per-Sovereign cutover overlay rewrites
        # this hostname; the slot ships the canonical
        # `guacamole.<sovereign-fqdn>` shape.
        hostname: guacamole.omantel.biz
      oidc:
        # `auth.omantel.biz` is the live Keycloak hostname per the
        # bp-keycloak HTTPRoute on omantel. Realm name `catalyst`
        # matches bp-keycloak's realm-config-cli default.
        issuer: https://auth.omantel.biz/realms/catalyst
      recordings:
        # #3971: local-path is FORBIDDEN — k3s runs
        # --disable=local-storage (the ephemeral provisioner is never
        # installed) and the K23 Kyverno ENFORCE policy DENIES any
        # local-path PVC/StorageClass. omantel runs on Huawei (kom4dc)
        # where the durable cloud CSI class is `evs-ssd`
        # (bp-huawei-evs-csi, slot 55b) — pin it so a future
        # recordings.persistence=true flip binds a durable EVS volume,
        # not the chart's Hetzner default (hcloud-volumes). Recordings
        # stay an emptyDir until persistence is enabled (chart default
        # recordings.persistence=false, #3374).
        storageClass: evs-ssd
      webapp:
        # Memory-constrained omantel cluster — only one webapp
        # replica fits alongside the rest of the catalyst-system
        # stack. Multi-region Sovereigns scale this to chart default
        # (2) via per-Sovereign overlay.
        replicas: 1
