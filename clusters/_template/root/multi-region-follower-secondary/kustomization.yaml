# Region layout multi-region-follower, region role secondary: see ../base-primary/kustomization.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base-primary
patches:
  - patch: '{apiVersion: kustomize.toolkit.fluxcd.io/v1, kind: Kustomization, metadata: {name: sovereign-region-bootstrap, namespace: flux-system}, spec: {path: ./clusters/_template/sovereign-region/multi-region-follower}}'
  - patch: '{$patch: delete, apiVersion: kustomize.toolkit.fluxcd.io/v1, kind: Kustomization, metadata: {name: infrastructure-providers, namespace: flux-system}}'
