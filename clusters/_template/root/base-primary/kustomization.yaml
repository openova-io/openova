# The child Kustomizations of first boot, one file each (SOV-146). First boot applies the one root
# Kustomization sovereign-root (SOV-154), whose path is the folder <region layout>-<region role>
# here, or root/<region role> in a provider's overlay when the provider renders no region
# Kustomization. Every other folder builds this one and patches it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bootstrap-kit.yaml
  - sovereign-tls.yaml
  - bootstrap-kit-crs.yaml
  - sovereign-region-bootstrap.yaml
  - infrastructure-providers.yaml
