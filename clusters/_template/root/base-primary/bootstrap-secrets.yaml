# bootstrap-secrets Kustomization (SEC-153) — renders the bootstrap Secrets
# harbor-robot-token, pdm-basicauth, sovereign-tls-secrets (flux-system) and
# catalyst-handover-jwt-public (catalyst-system) from the manifests in
# clusters/_template/bootstrap-secrets and the values of the seed Secret
# flux-system/bootstrap-seed, which first boot creates from its one file of raw
# values (infra/providers/_shared/cloudinit-control-plane.tftpl). Only the
# values travel in the node's user data; names, namespaces and reflector
# annotations live in Git.
#
# bootstrap-kit dependsOn this Kustomization, so the Secrets exist before
# their first consumer (the platform API of slot 13, the DNS-01 solver through
# sovereign-tls) starts. It needs only the seed Secret and the namespaces
# flux-system and catalyst-system, which first boot creates. It dependsOn
# bootstrap-seed, whose Job builds the seed from the four Secrets on a
# Sovereign installed before the seed existed (and finds it on any other), so
# it never renders without the seed. The substituteFrom is not optional: a
# missing seed stops the build, it never renders an empty value or a literal
# ${NAME} into a live Secret. wait:true with a short timeout: a Secret is
# ready once applied, so the kit waits seconds, and a missing seed shows here,
# named, instead of as a consumer that cannot start.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bootstrap-secrets
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  path: ./clusters/_template/bootstrap-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: openova
  dependsOn:
    - name: bootstrap-seed
  wait: true
  timeout: 2m
  postBuild:
    substituteFrom:
      - kind: Secret
        name: bootstrap-seed
