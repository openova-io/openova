# bootstrap-secrets Kustomization (SEC-153, SEC-154) — renders six bootstrap
# Secrets, harbor-robot-token, pdm-basicauth, sovereign-tls-secrets, ghcr-pull,
# object-storage (flux-system) and catalyst-handover-jwt-public
# (catalyst-system), from the manifests in the shared folder
# clusters/_template/bootstrap-secrets (no pack overlay) and the values of the
# seed Secret flux-system/bootstrap-seed, which first boot creates from its one
# file of raw values (infra/providers/_shared/cloudinit-control-plane.tftpl).
# Only the values travel in the node's user data; names, namespaces, types,
# keys and reflector annotations live in Git. cloud-credentials is not
# rendered here: first boot applies it.
#
# bootstrap-kit dependsOn this Kustomization, so the Secrets exist before
# their first consumer (the kit's first pull with ghcr-pull, the platform API
# of slot 13, the DNS-01 solver through sovereign-tls, the registry and backup
# charts with object-storage) starts. It needs only the seed Secret and the
# namespaces flux-system and catalyst-system, which first boot creates. It
# dependsOn bootstrap-seed, whose Job builds the seed from the bootstrap
# Secrets on a Sovereign installed before the seed existed, and adds to the
# seed the values it lacks on a Sovereign installed before a Secret joined it
# (and finds them on any other), so it never renders without them.
# The substituteFrom is not optional: a missing seed stops the build, it never
# renders an empty value or a literal ${NAME} into a live Secret. Every NAME
# the templates reference comes only from this Secret source (guard G1). wait:true
# with a short timeout: a Secret is ready once applied, so the kit waits
# seconds, and a missing seed shows here, named, instead of as a consumer that
# cannot start.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bootstrap-secrets
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  path: ./clusters/_template/bootstrap-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: openova
  dependsOn:
    - name: bootstrap-seed
  wait: true
  timeout: 2m
  postBuild:
    substituteFrom:
      - kind: Secret
        name: bootstrap-seed
