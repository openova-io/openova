# PRIMARY-REGION ONLY (#4521): the Crossplane adoption seam is a
# once-per-Sovereign primary-CP concern — the post-handover applier
# (handler/post_handover_adoption_apply.go) server-side-applies the
# CloudAdoption CRs ONCE against the primary cluster from the primary's
# tofu state, observing the Sovereign's cloud resources. Secondary-region
# CPs SUSPEND their HRs (SECONDARY_HR_SUSPEND) and never need their own
# provider install, so gating these two Kustomizations to the primary
# keeps the secondary cloud-init under the 32256B Hetzner cap (its
# headroom was already thin) AND avoids a duplicate provider package pull
# per region.
# infrastructure-providers Kustomization — LAYER 1 of the two-layer
# Crossplane bootstrap (#4521, Refs #4212 #4488, un-gates #4002/#4018).
# Installs ONLY the Provider PACKAGE CR provider-opentofu, from the one
# path ./providers on every cloud. CLD-023 deleted the Hetzner overlay
# and its native provider-hcloud.
#
# WHY THIS IS A SEPARATE KUSTOMIZATION (#4521): the Provider CR and the
# `tf.upbound.io/v1beta1` ProviderConfig that CONSUMES the CRD the
# Provider registers were previously batched in ONE Kustomization. Flux
# server-side dry-runs a Kustomization ATOMICALLY; the ProviderConfig
# dry-run failed `no matches for kind "ProviderConfig" in version
# "tf.upbound.io/v1beta1"` (the CRD does not exist until the provider
# installs) → the WHOLE apply was rejected → the Provider CR itself never
# applied → the provider never installed → its CRD never registered →
# permanent ordering deadlock (`infrastructure-config Ready=False`,
# `kubectl get providers.pkg.crossplane.io` empty). Splitting the
# Provider CR into THIS layer (whose only CRD is pkg.crossplane.io/v1,
# already landed by bp-crossplane at slot 04) lets it apply cleanly; the
# LAYER-2 `infrastructure-config` `dependsOn`s this + carries the
# CRD-CONSUMING ProviderConfig/CloudAdoption. The established
# bootstrap-kit → bootstrap-kit-crs CRD-then-CR idiom.
#
# wait:false — the Crossplane provider PACKAGE pull is a day-2 surface
# that must NEVER gate Phase-1 (sacred-thin cloud-init). retryInterval
# short so the Provider re-applies promptly after bp-crossplane lands
# pkg.crossplane.io (no dependsOn on bp-crossplane: it lives inside
# bootstrap-kit which this already depends on). ORDERING is the pure
# bootstrap-kit-crs idiom: layer-2 `dependsOn`s this (Provider CR applied)
# AND retries its own dry-run (retryInterval) until the provider finishes
# registering tf.upbound.io — no healthCheck needed (and kstatus has no
# reliable Ready signal for a crossplane Provider's Healthy/Installed
# conditions anyway).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-providers
  namespace: flux-system
spec:
  interval: 5m
  # NO dependsOn (pure bootstrap-kit-crs idiom): the Provider CR's only
  # CRD is pkg.crossplane.io/v1 (landed by bp-crossplane INSIDE
  # bootstrap-kit). retryInterval short so the apply RETRIES until that
  # CRD registers, then applies — without gating on the ~50 leaf-app HRs
  # (a dependsOn on wait:true bootstrap-kit would needlessly delay it).
  retryInterval: 1m
  path: ./clusters/_template/infrastructure/providers
  prune: true
  sourceRef:
    kind: GitRepository
    name: openova
  wait: false
  # SOV-130: reads sovereign-variables like the Kustomizations above. The
  # providers tree names no variable today, so nothing in it changes.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: sovereign-variables
  # #4600 — NO XPKG_REGISTRY postBuild substitution on ANY cloud.
  # provider-opentofu pulls DIRECTLY from xpkg.upbound.io (the manifest's
  # XPKG_REGISTRY := xpkg.upbound.io default) on Hetzner AND Huawei.
  # The former Huawei-only `harbor.openova.io/proxy-xpkg` substitution
  # (#4488/#4491/#4542) was an ARTIFICIAL bastion-Harbor tether whose
  # `proxy-xpkg` project never existed → 401 → provider-opentofu
  # Installed=False → adoption seam inert. Its "poisoned NAT" premise is
  # FALSE: xpkg.upbound.io answers HTTP 401 (the anon-auth challenge) in
  # 0.43s direct from the live Huawei Sovereign, and crossplane-system
  # has no egress NetworkPolicy. Cutover step-11 already pivots the raw
  # `xpkg.upbound.io/...` spec.package to `harbor.<fqdn>/proxy-xpkg`
  # post-handover, so Principle #11 sovereignty is unaffected.
# NOTE (#4521): LAYER 2 — the CRD-CONSUMING `infrastructure-config` Flux
# Kustomization (ProviderConfig + the Observe-first CloudAdoption
# placeholder) is NOT inlined here. It ships as a COMMITTED Flux
# Kustomization CR in the providers tree
# (clusters/_template/infrastructure/providers/
# infrastructure-config-kustomization.yaml), applied by THIS
# `infrastructure-providers` Kustomization above and `dependsOn`ing it.
# That keeps the second Kustomization OFF the byte-capped cloud-init
# render (the #1981/#3884 "evict bloat out of cloud-init" precedent — a
# third inline Kustomization pushed the 3-region Hetzner render past the
# 32256B cap). The committed CR needs NO postBuild: the placeholder
# CloudAdoption's only token (SOVEREIGN_FQDN) is now a static
# `pending-generation` (it is a no-op overwritten by the post-handover
# generator), so it renders identically on every Sovereign.
