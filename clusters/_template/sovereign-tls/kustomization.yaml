apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cilium-gateway-cert.yaml
  - cilium-gateway.yaml
  # powerdns-api-credentials Secret (#3888 / Refs #3847) — the DNS-01 API key
  # the bp-cert-manager-powerdns-webhook solver reads to issue the wildcard
  # cert above. Evicted OUT of cloud-init into this Flux-reconciled tier so it
  # is no longer an imperative orphan pruned by bootstrap-kit (the #3847 wedge).
  # Lands in `cert-manager`; value from the ${POWERDNS_API_KEY} postBuild
  # substitute.
  - powerdns-api-credentials.yaml
  # Watch+rollout-restart Job for cilium-envoy. cilium-envoy's xDS SDS
  # subscription does NOT recover after the initial-fetch timeout, so a
  # fresh Sovereign whose envoy started before the wildcard cert was
  # issued serves no listener forever. This Job waits for the Secret
  # then bumps the DaemonSet, restoring the listener within ≤90s of
  # the cert appearing. See file header for full root cause + design
  # rationale (qa-loop bounded-cycle Provision #7).
  - cilium-envoy-tls-restart-job.yaml
  # C7-007 (2026-05-17 t143) — one-shot cleanup of the pre-PR-O legacy
  # `sovereign-wildcard-tls` Certificate + Secret pair. Idempotent
  # (`--ignore-not-found`), runs once per Flux reconciliation
  # generation. Fresh Sovereigns succeed as a no-op; pre-PR-O
  # Sovereigns delete the orphan resources. Removable from the list
  # once every live prov has reconciled past it.
  - legacy-cert-cleanup-job.yaml
  # #3066 — self-healing guard for cert-manager's nextPrivateKey "secret
  # already exists" loop that wedges the wildcard TLS cert → console=000.
  # Watches the cert for ~14m; on the stuck signature (temp nextPrivateKey
  # secret present + no Ready CertificateRequest) it clears the temp
  # secret + stuck CR so cert-manager re-issues clean. Best-effort, never
  # touches a healthy cert. Removable once an upstream cert-manager bump
  # fixes the adopt-vs-create race. See file header (verified live hw97).
  - cert-stuck-nextprivatekey-guard.yaml
