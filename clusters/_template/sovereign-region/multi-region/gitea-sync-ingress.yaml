# The gitea namespace runs default-deny (bp-gitea gitea-default-deny); Cilium
# evaluates its namespace selectors cluster-locally. Admit the peer regions'
# region-git-sync Jobs (any ClusterMesh cluster) to Gitea HTTP only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gitea-allow-crossregion-git-sync-ingress
  namespace: gitea
  labels:
    catalyst.openova.io/component: region-git-sync
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gitea
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gitea
            k8s:app.kubernetes.io/component: region-git-sync
          matchExpressions:
            - key: io.cilium.k8s.policy.cluster
              operator: Exists
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # ADR-0015 D8 (Refs #7067): every region's Continuum reads the region
    # files and commits transition phases + the lease file through the
    # WRITER region's Gitea (gitea-<writer-region-id>). Without this rule a
    # follower region's Continuum timed out on every read ("TransitionBlocked:
    # read regions/... from the writer Gitea: context deadline exceeded").
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: catalyst-system
            k8s:app.kubernetes.io/name: continuum-controller
          matchExpressions:
            - key: io.cilium.k8s.policy.cluster
              operator: Exists
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
