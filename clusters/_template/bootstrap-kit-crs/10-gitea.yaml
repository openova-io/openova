# placement-generated (#3804 / Refs #3642) — host-bridge CRD-dependent CRs
# for slot 10-gitea.yaml. SOURCE OF TRUTH: clusters/_template/bootstrap-kit/
# placement.yaml (the matching slot's hostBridge.hostDocuments). Edit THERE
# + run scripts/render-slot-placement.py fix — never hand-edit this file.
#
# Reconciled by the `bootstrap-kit-crs` Flux Kustomization (defined in
# infra/providers/_shared/cloudinit-control-plane.tftpl), which
# `dependsOn: [bootstrap-kit]` so these gateway.networking.k8s.io /
# external-secrets.io / postgresql.cnpg.io CRs are validated + applied
# only AFTER their operator CRDs exist — never in the bootstrap-kit atomic
# dry-run (the fresh-prov `no matches for kind` deadlock, hw161).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: mgmt
  labels:
    catalyst.openova.io/blueprint: bp-gitea
    catalyst.openova.io/component: gitea
    catalyst.openova.io/host-bridge: mgmt
spec:
  parentRefs:
  - name: cilium-gateway
    namespace: kube-system
  hostnames:
  - gitea.${SOVEREIGN_FQDN}
  rules:
  - matches:
    - path:
        type: Exact
        value: /user/login
    filters:
    - type: RequestRedirect
      requestRedirect:
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /user/oauth2/openova-sso
        statusCode: 302
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: gitea-http-x-gitea-x-mgmt-vcluster
      namespace: mgmt
      port: 3000
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitea-oauth-source-credentials
  namespace: gitea
  labels:
    catalyst.openova.io/blueprint: bp-gitea
    bp-sso-bridge.openova.io/consumer: bp-gitea
    catalyst.openova.io/host-bridge: mgmt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-region1
    kind: ClusterSecretStore
  target:
    name: gitea-oauth-source-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          catalyst.openova.io/blueprint: bp-gitea
          bp-sso-bridge.openova.io/consumer: bp-gitea
      data:
        key: '{{ .client_id }}'
        secret: '{{ .client_secret }}'
        issuer_url: '{{ .issuer_url }}'
        authorize_url: '{{ .authorize_url }}?kc_idp_hint=catalyst-pin'
        token_url: '{{ .token_url }}'
        userinfo_url: '{{ .userinfo_url }}'
  data:
  - secretKey: client_id
    remoteRef:
      key: sso/gitea
      property: client_id
  - secretKey: client_secret
    remoteRef:
      key: sso/gitea
      property: client_secret
  - secretKey: issuer_url
    remoteRef:
      key: sso/gitea
      property: issuer_url
  - secretKey: authorize_url
    remoteRef:
      key: sso/gitea
      property: authorize_url
  - secretKey: token_url
    remoteRef:
      key: sso/gitea
      property: token_url
  - secretKey: userinfo_url
    remoteRef:
      key: sso/gitea
      property: userinfo_url
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-pg
  namespace: gitea
  labels:
    catalyst.openova.io/blueprint: bp-gitea
    catalyst.openova.io/component: gitea
    catalyst.openova.io/host-bridge: mgmt
spec:
  instances: 1
  imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql:16
  bootstrap:
    initdb:
      database: gitea
      owner: gitea
  managed:
    roles:
    - name: gitea
      ensure: present
      login: true
      passwordSecret:
        name: gitea-pg-app
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: 'true'
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: gitea
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: 'true'
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: gitea
  postgresql:
    parameters:
      max_connections: '100'
      shared_buffers: 64MB
      effective_cache_size: 192MB
      work_mem: 4MB
      maintenance_work_mem: 64MB
      log_statement: ddl
      log_min_duration_statement: '1000'
  storage:
    size: 5Gi
    storageClass: local-path
  enableSuperuserAccess: true
  monitoring:
    enablePodMonitor: false
