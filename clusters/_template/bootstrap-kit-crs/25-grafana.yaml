# placement-generated (#3804 / Refs #3642) — host-bridge CRD-dependent CRs
# for slot 25-grafana.yaml. SOURCE OF TRUTH: clusters/_template/bootstrap-kit/
# placement.yaml (the matching slot's hostBridge.hostDocuments). Edit THERE
# + run scripts/render-slot-placement.py fix — never hand-edit this file.
#
# Reconciled by the `bootstrap-kit-crs` Flux Kustomization (defined in
# infra/providers/_shared/cloudinit-control-plane.tftpl), which
# `dependsOn: [bootstrap-kit]` so these gateway.networking.k8s.io /
# external-secrets.io / postgresql.cnpg.io CRs are validated + applied
# only AFTER their operator CRDs exist — never in the bootstrap-kit atomic
# dry-run (the fresh-prov `no matches for kind` deadlock, hw161).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: mgmt
  labels:
    catalyst.openova.io/blueprint: bp-grafana
    catalyst.openova.io/component: grafana
    catalyst.openova.io/host-bridge: mgmt
spec:
  parentRefs:
  - name: cilium-gateway
    namespace: kube-system
  hostnames:
  - grafana.${SOVEREIGN_FQDN}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: grafana-x-grafana-x-mgmt-vcluster
      namespace: mgmt
      port: 80
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-sso-oidc-credentials
  namespace: grafana
  labels:
    catalyst.openova.io/blueprint: bp-grafana
    bp-sso-bridge.openova.io/consumer: bp-grafana
    catalyst.openova.io/host-bridge: mgmt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-region1
    kind: ClusterSecretStore
  target:
    name: grafana-sso-oidc-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: '{{ .client_id }}'
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: '{{ .client_secret }}'
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: '{{ .authorize_url }}?kc_idp_hint=catalyst-pin'
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: '{{ .token_url }}'
        GF_AUTH_GENERIC_OAUTH_API_URL: '{{ .userinfo_url }}'
        GF_SERVER_ROOT_URL: https://grafana.${SOVEREIGN_FQDN}/
  data:
  - secretKey: client_id
    remoteRef:
      key: sso/grafana
      property: client_id
  - secretKey: client_secret
    remoteRef:
      key: sso/grafana
      property: client_secret
  - secretKey: authorize_url
    remoteRef:
      key: sso/grafana
      property: authorize_url
  - secretKey: token_url
    remoteRef:
      key: sso/grafana
      property: token_url
  - secretKey: userinfo_url
    remoteRef:
      key: sso/grafana
      property: userinfo_url
