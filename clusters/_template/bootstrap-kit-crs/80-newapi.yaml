# placement-generated (#3804 / Refs #3642) — host-bridge CRD-dependent CRs
# for slot 80-newapi.yaml. SOURCE OF TRUTH: clusters/_template/bootstrap-kit/
# placement.yaml (the matching slot's hostBridge.hostDocuments). Edit THERE
# + run scripts/render-slot-placement.py fix — never hand-edit this file.
#
# Reconciled by the `bootstrap-kit-crs` Flux Kustomization (defined in
# infra/providers/_shared/cloudinit-control-plane.tftpl), which
# `dependsOn: [bootstrap-kit]` so these gateway.networking.k8s.io /
# external-secrets.io / postgresql.cnpg.io CRs are validated + applied
# only AFTER their operator CRDs exist — never in the bootstrap-kit atomic
# dry-run (the fresh-prov `no matches for kind` deadlock, hw161).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: newapi-bp-newapi-public
  namespace: mgmt
  labels:
    catalyst.openova.io/blueprint: bp-newapi
    catalyst.openova.io/component: newapi-public-route
    catalyst.openova.io/host-bridge: mgmt
spec:
  parentRefs:
  - name: cilium-gateway
    namespace: kube-system
  hostnames:
  - newapi.${SOVEREIGN_FQDN}
  rules:
  - matches:
    - path:
        type: Exact
        value: /
    backendRefs:
    - name: newapi-bp-newapi-x-newapi-x-mgmt-vcluster
      namespace: mgmt
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: newapi-bp-newapi-x-newapi-x-mgmt-vcluster
      namespace: mgmt
      port: 3000
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalyst-newapi-admin-token
  namespace: newapi
  labels:
    catalyst.openova.io/blueprint: bp-newapi
    catalyst.openova.io/host-bridge: mgmt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-region1
  target:
    name: catalyst-newapi-admin-token
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: 'true'
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: catalyst-system
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: 'true'
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: catalyst-system
  data:
  - secretKey: ADMIN_API_TOKEN
    remoteRef:
      key: sovereign/${SOVEREIGN_FQDN}/newapi/admin-token
      property: ADMIN_API_TOKEN
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: newapi-bp-newapi-oidc-sync
  namespace: newapi
  labels:
    catalyst.openova.io/blueprint: bp-newapi
    bp-sso-bridge.openova.io/consumer: bp-newapi
    catalyst.openova.io/host-bridge: mgmt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-region1
    kind: ClusterSecretStore
  target:
    name: newapi-oidc
    creationPolicy: Merge
    template:
      type: Opaque
      mergePolicy: Merge
      data:
        OIDC_CLIENT_SECRET: '{{ .client_secret }}'
  data:
  - secretKey: client_secret
    remoteRef:
      key: sso/sovereign/newapi-admin
      property: client_secret
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: newapi-bp-newapi-newapi-pg
  namespace: newapi
  annotations:
    helm.sh/resource-policy: keep
  labels:
    catalyst.openova.io/blueprint: bp-newapi
    catalyst.openova.io/host-bridge: mgmt
spec:
  instances: 1
  imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql:16.4
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: newapi
      owner: newapi
---
apiVersion: v1
kind: Secret
metadata:
  name: newapi-bp-newapi-newapi-db-dsn
  namespace: newapi
  labels:
    catalyst.openova.io/blueprint: bp-newapi
    catalyst.openova.io/host-bridge: mgmt
type: Opaque
data:
  SQL_DSN: ''
