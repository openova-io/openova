---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: mgmt
  labels:
    catalyst.openova.io/blueprint: bp-openbao
    catalyst.openova.io/component: openbao
    catalyst.openova.io/host-bridge: mgmt
spec:
  parentRefs:
  - name: cilium-gateway
    namespace: kube-system
  hostnames:
  - bao.${SOVEREIGN_FQDN}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /sso/landing
    backendRefs:
    - name: openbao-sso-landing-x-openbao-x-mgmt-vcluster
      namespace: mgmt
      port: 80
  - matches:
    - path:
        type: Exact
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: bao.${SOVEREIGN_FQDN}
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /sso/landing
        statusCode: 302
  - matches:
    - path:
        type: Exact
        value: /ui
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: bao.${SOVEREIGN_FQDN}
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /sso/landing
        statusCode: 302
  - matches:
    - path:
        type: Exact
        value: /ui/
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: bao.${SOVEREIGN_FQDN}
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /sso/landing
        statusCode: 302
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: openbao-x-openbao-x-mgmt-vcluster
      namespace: mgmt
      port: 8200
---
apiVersion: external-secrets.io/v1beta1
