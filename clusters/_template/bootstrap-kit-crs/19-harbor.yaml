# placement-generated (#3804 / Refs #3642) — host-bridge CRD-dependent CRs
# for slot 19-harbor.yaml. SOURCE OF TRUTH: clusters/_template/bootstrap-kit/
# placement.yaml (the matching slot's hostBridge.hostDocuments). Edit THERE
# + run scripts/render-slot-placement.py fix — never hand-edit this file.
#
# Reconciled by the `bootstrap-kit-crs` Flux Kustomization (defined in
# infra/providers/_shared/cloudinit-control-plane.tftpl), which
# `dependsOn: [bootstrap-kit]` so these gateway.networking.k8s.io /
# external-secrets.io / postgresql.cnpg.io CRs are validated + applied
# only AFTER their operator CRDs exist — never in the bootstrap-kit atomic
# dry-run (the fresh-prov `no matches for kind` deadlock, hw161).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: mgmt
  labels:
    catalyst.openova.io/blueprint: bp-harbor
    catalyst.openova.io/component: harbor
    catalyst.openova.io/host-bridge: mgmt
spec:
  parentRefs:
  - name: cilium-gateway
    namespace: kube-system
  hostnames:
  - registry.${SOVEREIGN_FQDN}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: harbor-x-harbor-x-mgmt-vcluster
      namespace: mgmt
      port: 80
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-sso-oidc-credentials
  namespace: harbor
  labels:
    catalyst.openova.io/blueprint: bp-harbor
    bp-sso-bridge.openova.io/consumer: bp-harbor
    catalyst.openova.io/host-bridge: mgmt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-region1
    kind: ClusterSecretStore
  target:
    name: harbor-sso-oidc-credentials
    creationPolicy: Owner
  data:
  - secretKey: client_id
    remoteRef:
      key: sso/harbor
      property: client_id
  - secretKey: client_secret
    remoteRef:
      key: sso/harbor
      property: client_secret
  - secretKey: issuer_url
    remoteRef:
      key: sso/harbor
      property: issuer_url
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-pg
  namespace: harbor
  labels:
    catalyst.openova.io/blueprint: bp-harbor
    catalyst.openova.io/component: harbor
    catalyst.openova.io/host-bridge: mgmt
spec:
  instances: 1
  imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql:16
  bootstrap:
    initdb:
      database: registry
      owner: harbor
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: 'true'
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: harbor
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: 'true'
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: harbor
  postgresql:
    parameters:
      max_connections: '100'
      shared_buffers: 64MB
      effective_cache_size: 192MB
      work_mem: 4MB
      maintenance_work_mem: 64MB
      log_statement: ddl
      log_min_duration_statement: '1000'
  storage:
    size: 5Gi
    storageClass: local-path
  enableSuperuserAccess: true
  monitoring:
    enablePodMonitor: false
