apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# clusters/_template/infrastructure/providers/hetzner — the Hetzner
# Provider-install overlay (#4521, Refs #1947 #4212). On Hetzner the
# `infrastructure-providers` Flux Kustomization points its cloud-conditional
# `path` HERE, so this overlay installs the cloud-agnostic ../base
# (provider-opentofu) PLUS the Hetzner-NATIVE provider-hcloud.
#
# Like the cross-cloud provider-opentofu, provider-hcloud is a CRD-introducing
# package: it registers `hcloud.crossplane.io` (ProviderConfig, Server,
# LoadBalancer, Network …). Its ProviderConfig lives in the SECOND layer
# (../../hetzner/provider-config-hcloud.yaml) so it is dry-run only AFTER this
# Provider registers `hcloud.crossplane.io/v1beta1` — same #4521 ordering fix.
#
# `../base` is a SIBLING of this dir, so the reference is free of the kustomize
# ancestor-cycle / security errors a `../`-to-parent reference would hit.
resources:
  - ../base
  - provider-hcloud.yaml
