# Crossplane provider-opentofu — the cross-cloud OpenTofu→Crossplane
# adoption seam (ADR-0011, Refs #4002).
#
# WHY THIS PROVIDER (not provider-hcloud / provider-huaweicloud natively):
# the Sovereign's Phase-0 substrate is built by the OpenTofu modules at
# infra/providers/{hetzner,huawei}. provider-opentofu's `Workspace`
# managed resource wraps those already-endpoint-configured modules and
# adopts the live cloud resources by `crossplane.io/external-name`
# (the cloud resource id) WITHOUT re-provisioning — one mechanism for
# EVERY cloud. The native provider-huaweicloud (v0.0.x) gives no
# confidence it can reach the on-prem HCS custom endpoints
# (`*.me-east-215.kom4dc.nationalcloud.om`, insecure TLS) that the tofu
# module already handles. See ADR-0011 §Decision for the full rationale.
#
# Installed AFTER bp-crossplane lands the apiextensions CRDs (slot 04), by the
# `infrastructure-providers` Flux Kustomization (LAYER 1 of the two-layer
# crossplane bootstrap, #4521) — the SEPARATE Provider-install Kustomization
# that must go Healthy BEFORE the ProviderConfig/CloudAdoption config layer
# (`infrastructure-config`) is dry-run. Adoption claims (CloudAdoption) and the
# ProviderConfig `default` they reference live in ../../base (LAYER 2).
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-opentofu
  labels:
    catalyst.openova.io/component: crossplane
    catalyst.openova.io/adoption-seam: "true"
spec:
  # upbound provider-opentofu — tracks the OpenTofu fork (license-clean,
  # unlike provider-terraform which is frozen at Terraform 1.5.7 / BSL).
  # Catalyst is an OpenTofu shop (required_version >= 1.6.0) so this is
  # the native fit. Pinned digest-pinnable tag.
  #
  # #4600 — the package pulls DIRECTLY from xpkg.upbound.io on EVERY cloud
  # (Hetzner AND Huawei). XPKG_REGISTRY carries no postBuild substitution
  # anywhere, so Flux expands the `:=` default to the clean upstream coords.
  #
  # The former Huawei-only `harbor.openova.io/proxy-xpkg` substitution
  # (#4488/#4491/#4542) was an ARTIFICIAL dependency on the BASTION Harbor:
  # it routed the Crossplane package pull through `harbor.openova.io`, whose
  # `proxy-xpkg` proxy-cache project never existed → the package manager got
  # `401 project proxy-xpkg not found` → provider-opentofu stayed
  # INSTALLED=False → no workspaces.tf.upbound.io CRD → every CloudAdoption
  # Ready=False (the #4002/#4018 adoption seam inert). The "fix" (#4541 / PR
  # #4542) was to create that project on the bastion Harbor — gated on a
  # founder-only BASTION_HARBOR_ADMIN_TOKEN. The founder confirmed the whole
  # bastion tether is artificial.
  #
  # Its stated justification — a reputation-blocklisted ("poisoned") kom4dc
  # NAT EIP that allegedly stalls a direct xpkg.upbound.io pull — is FALSE.
  # Live-tested 2026-06-28 from the running Huawei Sovereign
  # (91dc0591 / omantel.biz / me-east-215): a pod in crossplane-system's
  # network context reaches `https://xpkg.upbound.io/v2/upbound/
  # provider-opentofu/manifests/v1.1.3` with HTTP 401 (the EXPECTED
  # anonymous-auth challenge — full TCP+TLS+HTTP path works) in 0.43s, NOT a
  # timeout, and crossplane-system carries no egress NetworkPolicy
  # (unrestricted egress). The Crossplane xpkg fetcher (go-containerregistry
  # K8sFetcher) does bypass the node containerd registries.yaml mirror, but
  # that no longer matters: it dials xpkg.upbound.io directly and succeeds.
  #
  # The self-sovereign-cutover step-11 (#2034) pivots this raw
  # `xpkg.upbound.io/...` spec.package to `harbor.<SOVEREIGN_FQDN>/proxy-xpkg`
  # post-handover (the pivot job already matches the upstream-host shape — it
  # is the Hetzner shape it has always handled), so Principle #11 sovereignty
  # is unaffected. The `:=` default keeps a raw `kustomize build`
  # (CI / no-substitution) on the upstream coords.
  package: ${XPKG_REGISTRY:=xpkg.upbound.io}/upbound/provider-opentofu:v1.1.3
  # Inherit the cluster's image-pull behaviour from the runtime config
  # below (so post-cutover the Sovereign's own Harbor can proxy it).
  runtimeConfigRef:
    name: provider-opentofu
---
# DeploymentRuntimeConfig — grants the provider-opentofu controller the
# cloud credentials it needs to run `tofu` against the real cloud APIs.
#
# The same `cloud-credentials` Secret (namespace flux-system) that
# provider-hcloud's ProviderConfig consumes is mounted here as env on the
# CONTROLLER pod. NOTE: the live per-Workspace cloud auth is set by the
# opentofu-cloud-adoption Composition's spec.forProvider.env[] (HW_*/
# HCLOUD_*) — see provider-config-opentofu.yaml header — not by this
# controller env. The cloud-init Tofu module plants the Secret with keys:
#   hcloud-token        (Hetzner)
#   huawei-ak / huawei-sk / huawei-project-id / huawei-region (Huawei HCS)
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-opentofu
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              # Cloud creds surfaced as env vars the inline tofu modules
              # reference via `var`/`TF_VAR_*`. Optional so a Hetzner-only
              # Sovereign (no huawei-* keys) still starts the controller.
              envFrom:
                - secretRef:
                    name: cloud-credentials
                    optional: true
