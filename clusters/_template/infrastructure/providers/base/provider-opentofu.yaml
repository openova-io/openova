# Crossplane provider-opentofu — the cross-cloud OpenTofu→Crossplane
# adoption seam (ADR-0011, Refs #4002).
#
# WHY THIS PROVIDER (not provider-hcloud / provider-huaweicloud natively):
# the Sovereign's Phase-0 substrate is built by the OpenTofu modules at
# infra/providers/{hetzner,huawei}. provider-opentofu's `Workspace`
# managed resource wraps those already-endpoint-configured modules and
# adopts the live cloud resources by `crossplane.io/external-name`
# (the cloud resource id) WITHOUT re-provisioning — one mechanism for
# EVERY cloud. The native provider-huaweicloud (v0.0.x) gives no
# confidence it can reach the on-prem HCS custom endpoints
# (`*.me-east-215.kom4dc.nationalcloud.om`, insecure TLS) that the tofu
# module already handles. See ADR-0011 §Decision for the full rationale.
#
# Installed AFTER bp-crossplane lands the apiextensions CRDs (slot 04), by the
# `infrastructure-providers` Flux Kustomization (LAYER 1 of the two-layer
# crossplane bootstrap, #4521) — the SEPARATE Provider-install Kustomization
# that must go Healthy BEFORE the ProviderConfig/CloudAdoption config layer
# (`infrastructure-config`) is dry-run. Adoption claims (CloudAdoption) and the
# ProviderConfig `default` they reference live in ../../base (LAYER 2).
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-opentofu
  labels:
    catalyst.openova.io/component: crossplane
    catalyst.openova.io/adoption-seam: "true"
spec:
  # upbound provider-opentofu — tracks the OpenTofu fork (license-clean,
  # unlike provider-terraform which is frozen at Terraform 1.5.7 / BSL).
  # Catalyst is an OpenTofu shop (required_version >= 1.6.0) so this is
  # the native fit. Pinned by the digest of release v1.1.11.
  #
  # #4600/#4620 — the package pulls DIRECTLY from xpkg.upbound.io on EVERY
  # cloud (Hetzner AND Huawei), HARDCODED on the package line below. There is
  # no postBuild anywhere to resolve a VAR:=default placeholder, so the host
  # MUST be a literal — a placeholder would ship un-substituted (the #4620 bug
  # that left provider-opentofu Installed=False on the live 8fd457a8 prov).
  #
  # The former Huawei-only `harbor.openova.io/proxy-xpkg` substitution
  # (#4488/#4491/#4542) was an ARTIFICIAL dependency on the BASTION Harbor:
  # it routed the Crossplane package pull through `harbor.openova.io`, whose
  # `proxy-xpkg` proxy-cache project never existed → the package manager got
  # `401 project proxy-xpkg not found` → provider-opentofu stayed
  # INSTALLED=False → no workspaces.tf.upbound.io CRD → every CloudAdoption
  # Ready=False (the #4002/#4018 adoption seam inert). The "fix" (#4541 / PR
  # #4542) was to create that project on the bastion Harbor — gated on a
  # founder-only BASTION_HARBOR_ADMIN_TOKEN. The founder confirmed the whole
  # bastion tether is artificial.
  #
  # Its stated justification — a reputation-blocklisted ("poisoned") kom4dc
  # NAT EIP that allegedly stalls a direct xpkg.upbound.io pull — is FALSE.
  # Live-tested 2026-06-28 from the running Huawei Sovereign
  # (91dc0591 / omantel.biz / me-east-215): a pod in crossplane-system's
  # network context reaches `https://xpkg.upbound.io/v2/upbound/
  # provider-opentofu/manifests/v1.1.3` with HTTP 401 (the EXPECTED
  # anonymous-auth challenge — full TCP+TLS+HTTP path works) in 0.43s, NOT a
  # timeout, and crossplane-system carries no egress NetworkPolicy
  # (unrestricted egress). The Crossplane xpkg fetcher (go-containerregistry
  # K8sFetcher) does bypass the node containerd registries.yaml mirror, but
  # that no longer matters: it dials xpkg.upbound.io directly and succeeds.
  #
  # The self-sovereign-cutover step-11 (#2034) pivots this raw
  # `xpkg.upbound.io/...` spec.package to `harbor.<SOVEREIGN_FQDN>/proxy-xpkg`
  # post-handover (the pivot job already matches the upstream-host shape — it
  # is the Hetzner shape it has always handled), so Principle #11 sovereignty
  # is unaffected. #4620 — the host is HARDCODED to xpkg.upbound.io rather
  # than an XPKG_REGISTRY:=xpkg.upbound.io placeholder: Flux only resolves a
  # VAR:=default placeholder when a Kustomization postBuild exists, and the
  # inline infrastructure-providers Kustomization has NONE — so the raw
  # placeholder shipped verbatim and provider-opentofu stayed Installed=False
  # on the live 8fd457a8 prov. step-11 pivots this literal host post-handover.
  package: xpkg.upbound.io/upbound/provider-opentofu@sha256:b4690e8ffe0a963b1d7df64f18f409217600b2a3bda25d1e01e4bafde976e675
  # Inherit the cluster's image-pull behaviour from the runtime config
  # below (so post-cutover the Sovereign's own Harbor can proxy it).
  runtimeConfigRef:
    name: provider-opentofu
---
# DeploymentRuntimeConfig — grants the provider-opentofu controller the
# cloud credentials it needs to run `tofu` against the real cloud APIs.
#
# The same `cloud-credentials` Secret (namespace flux-system) that
# provider-hcloud's ProviderConfig consumes is mounted here as env on the
# CONTROLLER pod. NOTE: the live per-Workspace cloud auth is set by the
# opentofu-cloud-adoption Composition's spec.forProvider.env[] (HW_*/
# HCLOUD_*) — see provider-config-opentofu.yaml header — not by this
# controller env. The cloud-init Tofu module plants the Secret with keys:
#   hcloud-token        (Hetzner)
#   huawei-ak / huawei-sk / huawei-project-id / huawei-region (Huawei HCS)
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-opentofu
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              # CLD-068, measured on the Sovereign on 27 Nov 2026 and held by
              # tools/guards/cmd/opentofu-runtime. Workers: the default is one;
              # 24 Workspaces polled every 10 minutes are 144 reconciles an hour,
              # and the one worker did 3452 in the 29.6 hours before it was held
              # (116.7 an hour), so it was behind even then. --timeout=20m is the
              # default, written out because the liveness probe is bound to it:
              # all tofu calls of a reconcile share it, plus 30 s for the status
              # write (crossplane-runtime v2.0.0), so after 1230 s one is held.
              args:
                - --max-reconcile-rate=2
                - --timeout=20m
              # Cloud creds surfaced as env vars the inline tofu modules
              # reference via `var`/`TF_VAR_*`. Optional so a Hetzner-only
              # Sovereign (no huawei-* keys) still starts the controller.
              envFrom:
                - secretRef:
                    name: cloud-credentials
                    optional: true
              # SOV-342: the OpenTofu CLI configuration (the ProviderConfig default
              # copies /etc/opentofu/cli/.tofurc into each Workspace's folder) and the
              # pull credential it names (/etc/opentofu/oci/config.json): providers
              # are installed only from the OCI provider mirror, never from the
              # public registry.
              volumeMounts:
                - name: opentofu-cli-config
                  mountPath: /etc/opentofu/cli
                  readOnly: true
                - name: opentofu-pull-credential
                  mountPath: /etc/opentofu/oci
                  readOnly: true
              # #4739: resources.requests are MANDATORY. The host-ns Kyverno
              # `resource-requests` + `resource-limits` Enforce policies DENY any
              # pod that omits both cpu+memory requests. Without this the
              # provider-opentofu pod is admission-denied on EVERY restart /
              # fresh-prov ("Every container must declare resources.requests.cpu
              # and resources.requests.memory") → deployment 0/1,
              # UnhealthyPackageRevision → ALL crossplane CloudAdoptions stuck
              # non-Ready (rows 206/207/239, live-observed hw225 2026-07-05).
              # CLD-068 limits. At 500m the container was throttled in 230349 of
              # 722486 periods and held back 242.6 ms in each: it asked for 2.93
              # CPUs and ran 5.85 times slower, and a reconcile got at most 600
              # CPU-seconds in its 20 minutes. 3 CPUs run one plan at that peak
              # unthrottled and two 1.95 times slower: 600 CPU-seconds take 205 s
              # or 400 s. One plan beside the provider (152 MiB resident) fit in
              # 512Mi with no memory event, so two need 152 + 2 x 360 = 872 MiB.
              # Requests unchanged: the throttling was the limit's.
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: "3"
                  memory: 1Gi
              # The Kyverno policy probes-present (Enforce) refuses a
              # Deployment whose containers lack a liveness or a readiness
              # probe. Crossplane 2.4.3 creates a new Deployment for every
              # new ProviderRevision, so without these probes every upgrade
              # of this provider is refused and the old pod keeps running.
              #
              # What the runtime serves: HTTP GET /metrics on port 8080.
              # provider-opentofu v1.1.11 (cmd/provider/main.go) builds its
              # manager with no Metrics and no HealthProbeBindAddress option,
              # so controller-runtime v0.19.0 serves metrics on its default
              # ":8080" (pkg/metrics/server/server.go, DefaultBindAddress) and
              # serves no health endpoint. Crossplane declares the same port on
              # the runtime container as `metrics` (internal/controller/pkg/
              # runtime/runtime.go, MetricsPortNumber = 8080). The server
              # starts with the manager, after the RBAC pre-check, so the
              # liveness probe waits 30 s and tolerates 2 minutes of silence.
              #
              # CLD-068 liveness: read /metrics in the container (sh, curl and
              # busybox awk) and fail when it does not answer, does not list the
              # Workspace queue, or shows a queue holding one item over 1800 s; a
              # reconcile ends by 1230 s. v1.1.11 can hold a worker forever after
              # a timeout kill: runCommand (internal/opentofu/opentofu.go) calls
              # Cmd.Wait while its goroutine's Cmd.Output waits too, and the loser
              # blocks on os/exec's one context result (measured: 208099 s). The
              # restart frees it; Workspace state is in the kubernetes backend.
              # v1.2.0 runs one Cmd.Output with Cmd.Cancel.
              readinessProbe:
                httpGet:
                  path: /metrics
                  port: 8080
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
              livenessProbe:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - |
                      m="$(curl -sf --max-time 4 http://127.0.0.1:8080/metrics)" || exit 1
                      printf '%s\n' "$m" | awk -v max=1800 '
                        /^workqueue_longest_running_processor_seconds[{]/ {
                          v = $0; sub(/^[^}]*[}] /, "", v); split(v, f, " ")
                          if (f[1] + 0 > max) held = 1
                          if (index($0, "name=\"managed/workspace.opentofu.upbound.io\"")) seen = 1
                        }
                        END { if (seen && !held) exit 0; exit 1 }'
                initialDelaySeconds: 30
                periodSeconds: 20
                timeoutSeconds: 5
                failureThreshold: 6
          # SOV-342: the volumes the container package-runtime mounts. The pull
          # credential is the Secret that REGISTRY_PULL_SECRET names, read only (the
          # reflector keeps the copy of flux-system/ghcr-pull here; its writers are
          # named in clusters/_template/bootstrap-secrets/ghcr-pull.yaml). optional:
          # a pod without it still starts, and tofu init then fails on the missing
          # credential file instead of reaching another source.
          volumes:
            - name: opentofu-cli-config
              configMap:
                name: opentofu-cli-config
            - name: opentofu-pull-credential
              secret:
                secretName: ${REGISTRY_PULL_SECRET:=ghcr-pull}
                optional: true
                items:
                  - key: .dockerconfigjson
                    path: config.json
