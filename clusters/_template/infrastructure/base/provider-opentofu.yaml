# Crossplane provider-opentofu — the cross-cloud OpenTofu→Crossplane
# adoption seam (ADR-0011, Refs #4002).
#
# WHY THIS PROVIDER (not provider-hcloud / provider-huaweicloud natively):
# the Sovereign's Phase-0 substrate is built by the OpenTofu modules at
# infra/providers/{hetzner,huawei}. provider-opentofu's `Workspace`
# managed resource wraps those already-endpoint-configured modules and
# adopts the live cloud resources by `crossplane.io/external-name`
# (the cloud resource id) WITHOUT re-provisioning — one mechanism for
# EVERY cloud. The native provider-huaweicloud (v0.0.x) gives no
# confidence it can reach the on-prem HCS custom endpoints
# (`*.me-east-215.kom4dc.nationalcloud.om`, insecure TLS) that the tofu
# module already handles. See ADR-0011 §Decision for the full rationale.
#
# Installed AFTER bp-crossplane lands the apiextensions CRDs (slot 04),
# by the `infrastructure` Flux Kustomization (clusters/<fqdn>/infrastructure).
# Adoption claims (CloudAdoption) reference its ProviderConfig `default`.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-opentofu
  labels:
    catalyst.openova.io/component: crossplane
    catalyst.openova.io/adoption-seam: "true"
spec:
  # upbound provider-opentofu — tracks the OpenTofu fork (license-clean,
  # unlike provider-terraform which is frozen at Terraform 1.5.7 / BSL).
  # Catalyst is an OpenTofu shop (required_version >= 1.6.0) so this is
  # the native fit. Pinned digest-pinnable tag.
  #
  # #4488 — the registry HOST is a Flux postBuild substitution var
  # (set by the infrastructure-config Kustomization in cloud-init,
  # cloud-conditional):
  #   - Hetzner → `xpkg.upbound.io` (the upstream default — Hetzner's NAT
  #     to xpkg is clean, the package pulls direct).
  #   - Huawei  → `harbor.openova.io/proxy-xpkg` (the upstream pull-through
  #     project on the mothership Harbor). On kom4dc the Crossplane xpkg
  #     fetcher uses go-containerregistry DIRECTLY (it does NOT honour the
  #     node containerd registries.yaml mirror — verified against the
  #     crossplane v1.18 K8sFetcher), so the `xpkg.upbound.io` route in
  #     registry_mirror_yaml_huawei is INERT for provider packages and the
  #     fetcher would otherwise dial xpkg.upbound.io over the reputation-
  #     blocklisted ("poisoned") kom4dc NAT EIP and stall → provider-
  #     opentofu never reaches INSTALLED=True → no workspaces.tf.upbound.io
  #     CRD → every CloudAdoption composite Ready=False (the #4002/#4018
  #     adoption seam stays inert at runtime). proxy-xpkg is TLS-valid and
  #     reachable over NAT; this install is `wait:false` / OFF the Phase-1
  #     critical path, so its day-2 slowness is tolerable. Same host shape
  #     the self-sovereign-cutover step-11 (#2034) pivots to post-handover
  #     (harbor.<SOVEREIGN_FQDN>/proxy-xpkg/...). The `:=` default keeps a
  #     raw `kustomize build` (CI / no-substitution) on the upstream coords.
  package: ${XPKG_REGISTRY:=xpkg.upbound.io}/upbound/provider-opentofu:v1.1.3
  # Inherit the cluster's image-pull behaviour from the runtime config
  # below (so post-cutover the Sovereign's own Harbor can proxy it).
  runtimeConfigRef:
    name: provider-opentofu
---
# DeploymentRuntimeConfig — grants the provider-opentofu controller the
# cloud credentials it needs to run `tofu` against the real cloud APIs.
#
# The same `cloud-credentials` Secret (namespace flux-system) that
# provider-hcloud's ProviderConfig consumes is mounted here as env on the
# CONTROLLER pod. NOTE: the live per-Workspace cloud auth is set by the
# opentofu-cloud-adoption Composition's spec.forProvider.env[] (HW_*/
# HCLOUD_*) — see provider-config-opentofu.yaml header — not by this
# controller env. The cloud-init Tofu module plants the Secret with keys:
#   hcloud-token        (Hetzner)
#   huawei-ak / huawei-sk / huawei-project-id / huawei-region (Huawei HCS)
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-opentofu
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              # Cloud creds surfaced as env vars the inline tofu modules
              # reference via `var`/`TF_VAR_*`. Optional so a Hetzner-only
              # Sovereign (no huawei-* keys) still starts the controller.
              envFrom:
                - secretRef:
                    name: cloud-credentials
                    optional: true
