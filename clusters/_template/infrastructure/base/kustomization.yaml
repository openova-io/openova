apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# clusters/_template/infrastructure/base — the CLOUD-AGNOSTIC Crossplane
# object-model layer (ADR-0011, Refs #4002 #4018 #4212).
#
# Installs ONLY resources that work on EVERY cloud:
#   - provider-opentofu        — the cross-cloud OpenTofu→Crossplane adoption
#                                seam (Workspace inline module does read-only
#                                `data` lookups against Hetzner OR Huawei).
#   - provider-config-opentofu — drives every CloudAdoption's Workspace;
#                                cloud auth flows via the Workspace env[].
#   - adoption-claims.yaml     — the Observe-first CloudAdoption placeholder;
#                                the provisioner's post-handover applier
#                                (handler/post_handover_adoption_apply.go)
#                                server-side-applies the REAL resource ids.
#
# Referenced by the top-level ../kustomization.yaml (Huawei path) AND by the
# ../hetzner overlay (Hetzner path, which adds the native provider-hcloud).
# Sibling-dir layout so the hetzner overlay can `../base`-reference this
# without the kustomize ancestor-cycle / security-boundary errors.
resources:
  - provider-opentofu.yaml
  - provider-config-opentofu.yaml
  - adoption-claims.yaml
