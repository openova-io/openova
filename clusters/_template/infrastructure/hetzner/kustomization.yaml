apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# clusters/_template/infrastructure/hetzner — the Hetzner CONFIG overlay (#1947
# #4212 #4521). This is the SECOND of the two-layer crossplane bootstrap on
# Hetzner. The `infrastructure-config` Flux Kustomization points its
# cloud-conditional `path` HERE, so this overlay carries the CRD-CONSUMING
# config objects only: the cloud-agnostic ../base (provider-config-opentofu +
# the Observe-first CloudAdoption placeholder) PLUS the Hetzner-NATIVE
# provider-config-hcloud.
#
# The Provider PACKAGE CRs (provider-opentofu + provider-hcloud) live in
# ../../infrastructure/providers/hetzner and are applied FIRST by the
# `infrastructure-providers` Flux Kustomization. provider-config-hcloud is a
# `hcloud.crossplane.io/v1beta1` ProviderConfig — a CRD that provider-hcloud
# registers — so, exactly like the cross-cloud ProviderConfig, it MUST be
# dry-run only AFTER its Provider installs. Batching it with the Provider CR
# hit the same #4521 atomic-dry-run deadlock; `infrastructure-config`
# `dependsOn: [infrastructure-providers]` is the fix.
#
# provider-hcloud gives Crossplane native day-2 CRUD over Hetzner resources and
# needs the `hcloud-token` key in flux-system/cloud-credentials — which only a
# Hetzner Sovereign plants. On Huawei the same Kustomization points at ../
# (base only): the cross-cloud provider-opentofu handles adoption, no native
# provider package. `../base` is a SIBLING of this dir, so the reference is
# free of the kustomize ancestor-cycle / security errors a `../`-to-parent
# reference would hit.
resources:
  - ../base
  - provider-config-hcloud.yaml
