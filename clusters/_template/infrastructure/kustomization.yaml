apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# clusters/_template/infrastructure — the Crossplane object-model layer
# entrypoint for HUAWEI (and any non-Hetzner cloud) (#4212, un-gates
# #4002/#4018). It pulls in the cloud-agnostic ./base — provider-opentofu +
# provider-config-opentofu + the Observe-first CloudAdoption placeholder —
# all of which work on every cloud.
#
# The single `infrastructure-config` Flux Kustomization (cloud-init) points
# its cloud-conditional `path` HERE on Huawei (base only) and at ./hetzner
# on Hetzner (base + native provider-hcloud). Before #4212 the whole
# Kustomization was hard-gated to Hetzner, so on Huawei Crossplane owned
# NOTHING and `kubectl get providers.pkg.crossplane.io` was empty (the
# #4002/#4018 gap this un-gates).
resources:
  - base
