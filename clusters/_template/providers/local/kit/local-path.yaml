# The storage class of the local provider pack. k3s runs with
# --disable=local-storage, so the kit installs the upstream local-path
# provisioner and makes its class local-path the cluster default: the storage
# gate (slot 15b) waits for the class that SOVEREIGN_CNPG_STORAGE_CLASS names
# to be the default. Listed in kustomization.yaml by
# scripts/generators/local-kit.py.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/rancher/local-path-provisioner
  ref:
    tag: v0.0.30
  ignore: |
    /*
    !/deploy/chart
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path
  namespace: flux-system
spec:
  interval: 1h
  releaseName: local-path
  targetNamespace: local-path-storage
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
        namespace: flux-system
  values:
    storageClass:
      create: true
      defaultClass: true
      name: local-path
      provisionerName: rancher.io/local-path
