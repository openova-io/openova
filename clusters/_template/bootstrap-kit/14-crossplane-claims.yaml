# bp-crossplane-claims — Catalyst Day-2 CRUD XRDs (compose.openova.io/v1alpha1)
# + default Hetzner-backed Compositions. Split out of bp-crossplane at
# release 1.1.3 to resolve intra-chart CRD-ordering: a single Helm release
# cannot install a CRD AND a CR of that CRD's kind in one apply pass —
# the apiserver rejects the CR because the CRD is not yet registered.
#
# Wrapper chart:  platform/crossplane-claims/chart/
# Reconciled by:  Flux on the new Sovereign's k3s control plane, AFTER
#                 bp-crossplane is Ready (dependsOn below) — at which point
#                 the apiextensions.crossplane.io/v1 CRDs that the upstream
#                 crossplane subchart registers are live.

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-crossplane-claims
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-crossplane-claims
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "14"
spec:
  interval: 15m
  releaseName: crossplane-claims
  targetNamespace: crossplane-system
  # bp-crossplane installs the apiextensions.crossplane.io/v1 CRDs
  # (CompositeResourceDefinition, Composition) via the upstream subchart's
  # CRD payload. We MUST wait until that HelmRelease reports Ready=True
  # before applying the XRDs+Compositions in this chart, otherwise the
  # apiserver returns:
  #   no matches for kind "CompositeResourceDefinition" in version
  #   "apiextensions.crossplane.io/v1" -- ensure CRDs are installed first
  dependsOn:
    - name: bp-crossplane
  chart:
    spec:
      chart: bp-crossplane-claims
      # 1.1.3 (qa-loop iter-16 Fix #71): legacy XUserAccess Composition
      # gated behind new `userAccess.compositionEnabled` (default false).
      # The catalyst-useraccess-controller is now the canonical day-2
      # path; the Composition was setting `Ready=False` on every CR
      # because (a) provider-kubernetes is not installed and (b) post-EPIC-3
      # CRs use `tierRoleRef` not `applications[0]`. The composite
      # controller's status-write was overwriting the controller's
      # `Ready=True`. Disabling the Composition (and `defaultCompositionRef`)
      # leaves the controller in sole charge of `useraccesses.access.openova.io`
      # while the XRD itself stays installed (it owns the CRD the
      # controller watches).
      # 1.1.4 (Fix #158): kubectlImage switched from bitnami/kubectl:1.31
      # (deleted from Docker Hub 2025-08) to bitnamilegacy/kubectl:1.31.4.
      # 1.2.0 (ADR-0011 / #4002): adds the cloud-agnostic XCloudAdoption XRD
      # + opentofu-cloud-adoption Composition — the OpenTofu→Crossplane
      # adoption seam. Crossplane now OBSERVES the Phase-0 cloud resources
      # (ELB / nodes / VPC) by external-name on BOTH Hetzner and Huawei.
      # 1.3.0 (Refs #4773): UserAccess de-coupled from Crossplane — the
      # XRD/Claim (which spawned XUserAccess composites that could never
      # bind, an unbounded leak that starved the shared Crossplane reconcile
      # queue and held crossplane-adoption CloudAdoption CRs at Ready=False)
      # is replaced by a plain namespaced CRD reconciled by the
      # catalyst-useraccess-controller. Removes the retired legacy
      # Composition + the `userAccess.compositionEnabled` toggle.
      # 1.3.4 (#5270): cloudadoption Huawei endpoint hosts use the real HCS
      # region — the kom4dc 2-VPC-mimic pseudo-region suffix (-a/-b) is
      # stripped for the API host only (the me-east-215-a/-b hosts are
      # NXDOMAIN; 16/24 adoptions never Observed on hw278).
      version: 1.3.4
      sourceRef:
        kind: HelmRepository
        name: bp-crossplane-claims
        namespace: flux-system
  # Event-driven install: Helm completes when manifests apply, not when the
  # XRD-backed CRs reach Ready. dependsOn on bp-crossplane already gates this
  # HR on the upstream CRDs being live; disableWait replaces PR #221's
  # blanket spec.timeout: 15m band-aid.
  install:
    timeout: 15m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
