# bp-postgres (shared instance B) — Catalyst bootstrap-kit Blueprint, slot 16c.
#
# THREE-INSTANCE MODEL (founder NS-2, Refs #3188): instance B of three.
# A second install of the SAME bp-postgres chart (slot 16a header has the
# full model): CNPG Cluster `shared-pg-b` in shared-data carrying the
# observability + DNS consumers:
#
#   - grafana (bp-grafana, slot 25) — FLIPPED zero-touch. The hub Secret
#     `grafana-database-env` renders the upstream grafana chart's native
#     env contract (GF_DATABASE_TYPE/HOST/NAME/USER + the minted
#     GF_DATABASE_PASSWORD alias) via reflect.extraData/passwordAliases
#     (chart 0.1.5); slot 25's grafana.envFromSecrets picks it up once
#     reflector pushes it into ns grafana. Grafana migrates its own
#     schema on first boot, so the empty database is the correct start.
#   - pdns (bp-powerdns, slot 11) — READY-TO-ADOPT. Database + role +
#     hub Secret (`pdns-database-secret`) are declared here, but the
#     consumer flip is a per-app follow-up: bp-powerdns applies the
#     gpgsql auth-5.0.3 schema via its own Cluster's initdb
#     postInitApplicationSQL, and CNPG Database CRs have no schema hook —
#     the flip needs a schema-bootstrap path in the bp-powerdns chart.
#   - pda (bp-powerdns-admin, slot 11a) — READY-TO-ADOPT. Database +
#     role + hub Secret (`pda-shared-database-secret` — the chart's own
#     reflector mirror already owns the `pda-database-secret` name) are
#     declared; the hub's `uri` key is the exact SQLALCHEMY_DATABASE_URI
#     contract (#3189 A3), so the follow-up flip is a values-only
#     databaseSecret.name swap once bp-powerdns-admin gates its bundled
#     pda-pg Cluster.
#
# SAFE-BY-DEFAULT: same SOVEREIGN_ENABLE_SHARED_PG gate as 16a — OFF
# renders ZERO resources (empty Ready release), so non-sharing provs are
# byte-identical to today. The shared-data Namespace + the bp-postgres
# HelmRepository are declared ONCE in 16a (kustomize build rejects
# duplicates); this slot is the HelmRelease only.
#
# Wrapper chart: platform/postgres/chart/
# Reconciled by: Flux on the new Sovereign's k3s control plane.

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # bp-postgres-shared-b is the instance-B data-instance HR. Consumers
  # (bp-grafana today; bp-powerdns/bp-powerdns-admin post-adoption)
  # dependsOn THIS, not bp-cnpg, per ADR-0010. releaseName matches
  # instance.name so Cluster + Secrets are named consistently.
  name: bp-postgres-shared-b
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "16c"
    catalyst.openova.io/data-instance: shared-pg-b
spec:
  interval: 15m
  releaseName: shared-pg-b
  targetNamespace: shared-data
  # Same edges as 16a: the CNPG operator (CRDs + webhook) must be
  # reconciling before the Cluster/Database CRs apply; bp-reflector
  # pushes the hub Secrets into consumer namespaces as they appear.
  dependsOn:
    - name: bp-cnpg
      namespace: flux-system
    - name: bp-reflector
      namespace: flux-system
  chart:
    spec:
      chart: bp-postgres
      # Pinned in lockstep with 16a/16d — see 16a for the chart
      # changelog. 0.1.5 ships the env-style hub (reflect.extraData +
      # passwordAliases) + the `uri` key this slot's bindings rely on.
      # 0.1.6 ships the #3370 bootstrapOwned Application-CR
      # self-registration. 0.1.9 is the pin bump that fires the live
      # helm-controller upgrade so the Capabilities-gated Application CR
      # finally renders on already-converged Sovereigns.
      # 0.1.10 (#3375): role-Secret name RFC-1123 sanitization (lockstep
      # bump with 16a/16d — underscore-owner fix, see chart changelog).
      # 0.2.0 (#3571, Refs #3375 North-Star-4): active-hot-standby = REAL
      # bp-cnpg-pair split-side cross-region shape (shared-pg-b primary keeps
      # its name so grafana/powerdns hosts are unchanged + shared-pg-b-mesh
      # global Service + shared-pg-b-replica follower). Gated by
      # topology.crossRegion below (SOVEREIGN_ENABLE_CNPG_PAIR). Single-region
      # stays a byte-identical singleton. Lockstep bump with 16a/16d.
      # 0.2.1 (#3577, Refs #3572 #3322): consumer-ingress carve-out — the 0.2.0
      # primary NetworkPolicy default-denied every consumer's shared-pg-b-rw:5432
      # (grafana/powerdns hub on hw144). Adds TCP 5432 from any in-cluster Pod;
      # replication/own-cluster/operator carve-outs unchanged. Lockstep 16a/16d.
      # 0.2.4 (#3878, companion to #3876): the grafana binding declares
      # reflect.mangledTarget so grafana-database-env is delivered natively into
      # vc-mgmt as the syncer-mangled host object (no fromHost mirror → no
      # vcluster-0.23.0 deadlock, no missing GF_DATABASE_* env). Lockstep with
      # 16a/16d. Refs #3876 #3374 #3737.
      # 0.2.8 (#4460, Refs #4439 #4436 #4275): shared-pg-b's `-mesh`/`-mesh-rw`
      # global Service aliases decoupled from the cnpg-pair flip → render on the
      # multi-region signal so cross-region grafana/powerdns/pda hosts resolve the
      # moment the mesh peers. Lockstep with 16a/16d.
      # 0.2.10 (#4846): identity-based cross-region DR CiliumNetworkPolicy
      # (crossRegionPeerClusters) replaces the inert ipBlock. Lockstep 16a/16d.
      # 0.2.13 (#5224, Refs #5220 #4915): role-secrets side-gate — a region
      # stamped side=secondary NEVER mints role/hub Secrets (incl. the #4460
      # pre-flip window); the pair's password set is single-sourced from
      # region-A. Lockstep with the other 16* bp-postgres slots.
      # 0.2.14 (#5473): replication-source Service selectorType r -> rw —
      # `r` matched every instance, so a standby could serve as DR source.
      version: 0.2.14
      sourceRef:
        kind: HelmRepository
        name: bp-postgres
        namespace: flux-system
  install:
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    # Same master gate as 16a — one switch for all three instances.
    enabled: ${SOVEREIGN_ENABLE_SHARED_PG:=false}
    # Bootstrap self-registration (#3370) — see 16a.
    bootstrapOwned:
      enabled: true
      helmRelease:
        name: bp-postgres-shared-b
        namespace: flux-system
    instance:
      name: shared-pg-b
      namespace: shared-data
      storageSize: 10Gi
    # Cross-region active-hot-standby (#3571) — see 16a for the full design.
    # crossRegion rides SOVEREIGN_ENABLE_CNPG_PAIR (catalyst-api post-mesh
    # flip); OFF/single-region renders a byte-identical singleton. side from
    # SOVEREIGN_REGION_ROLE; regions from the canonical node labels. When ON:
    # side=primary → named shared-pg-b Cluster (grafana/powerdns host
    # shared-pg-b-rw unchanged) + shared-pg-b-mesh; side=secondary →
    # shared-pg-b-replica follower streaming WAL over the mesh.
    topology:
      mode: singleton
      crossRegion: ${SOVEREIGN_ENABLE_CNPG_PAIR:-false}
      side: ${SOVEREIGN_REGION_ROLE:-primary}
      instances: 1
      primary:
        region: '${SOVEREIGN_PRIMARY_REGION:-}'
      replica:
        region: '${SOVEREIGN_REPLICA_REGION:-}'
      # #4442 — HOST shared-data instance: open 5432 to cross-namespace
      # consumers (the singleton operator-probe NP otherwise default-denies
      # them). See slot 16a for the full rationale.
      networkPolicy:
        sharedConsumers: true
        # crossRegionPeerClusters (#4846) — admit the PEER region's pods to 5432
        # by CLUSTER IDENTITY so region-b consumers (keycloak/grafana/…) + the
        # region-b replica's pg_basebackup reach the primary. k8s-netpol label
        # rules are implicitly local-cluster-scoped, and a k8s `ipBlock` never
        # matches a ClusterMesh remote endpoint (it matches only a CIDR identity,
        # which Cilium assigns solely to NON-endpoint IPs) — so the chart renders
        # an identity-based CiliumNetworkPolicy selecting io.cilium.k8s.policy.
        # cluster instead. SOVEREIGN_PEER_CLUSTERMESH_NAMES is stamped by
        # catalyst-api (enableCNPGPairAfterFullMesh) with the peer region's mesh
        # name(s) at the post-mesh cnpg-pair flip, as a YAML flow-sequence e.g.
        # [hw228-me-east-b]. Only consumed in active-hot-standby; DEFAULT [] →
        # singleton renders NO CiliumNetworkPolicy (byte-identical default).
        crossRegionPeerClusters: ${SOVEREIGN_PEER_CLUSTERMESH_NAMES:-[]}
    databases:
      # grafana — FLIPPED (see header). The extraData keys are grafana's
      # native GF_DATABASE_* env contract; GF_DATABASE_HOST carries
      # host:port in one var per grafana's [database].host convention.
      - name: grafana
        owner: grafana
        consumer:
          blueprint: bp-grafana
          mode: shared
        reflect:
          secretName: grafana-database-env
          namespaces: [grafana]
          extraData:
            GF_DATABASE_TYPE: postgres
            GF_DATABASE_NAME: grafana
            GF_DATABASE_USER: grafana
            GF_DATABASE_SSL_MODE: disable
          # GF_DATABASE_HOST carries host:port in one var (grafana's
          # [database].host convention). #3629: declared as a hostPortKey so
          # the chart renders the topology-aware $consumerHost
          # (shared-pg-b-rw singleton, or the ClusterMesh-global
          # shared-pg-b-mesh-rw write alias under active-hot-standby) instead
          # of a region-local literal that NXDOMAIN'd grafana in region-B.
          hostPortKeys: [GF_DATABASE_HOST]
          passwordAliases: [GF_DATABASE_PASSWORD]
          # #3878 (companion to #3876): grafana runs INSIDE vc-mgmt (#3642).
          # Deliver grafana-database-env natively into vc-mgmt by reflecting
          # the vCluster-syncer-mangled host object into ns `mgmt` (the object
          # the grafana pod mounts via envFromSecrets). The env Secret is NOT
          # fromHost-imported (#3876 dropped the grafana/* wildcard), so the
          # from-host/to-host syncers never deadlock over it AND the GF_DATABASE_*
          # env is present on a fresh prov. The mangled copy carries the SAME
          # GF_DATABASE_* keys as the consumer-namespace copy.
          mangledTarget:
            vclusterNamespace: grafana
      # pdns — READY-TO-ADOPT (schema-bootstrap follow-up, see header).
      - name: pdns
        owner: pdns
        consumer:
          blueprint: bp-powerdns
          mode: shared
        reflect:
          secretName: pdns-database-secret
          namespaces: [powerdns]
      # pda — READY-TO-ADOPT (values-only flip once the bundled pda-pg
      # Cluster is gated; the `uri` key is the #3189 A3 contract).
      - name: pda
        owner: pda
        consumer:
          blueprint: bp-powerdns-admin
          mode: shared
        reflect:
          secretName: pda-shared-database-secret
          namespaces: [powerdns-admin]
