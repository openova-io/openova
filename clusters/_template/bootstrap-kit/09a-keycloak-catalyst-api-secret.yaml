# bp-keycloak Phase-8b (issue #604) — catalyst-api-server OIDC client credentials.
#
# This SealedSecret delivers the CATALYST_KC_SA_CLIENT_SECRET env var to the
# catalyst-api Deployment in catalyst-system namespace. The secret value is
# generated at provisioning time by the OpenTofu provisioner (a random 32-char
# alphanumeric string) and baked into the Keycloak realm JSON simultaneously
# (via bp-keycloak HelmRelease valuesFrom — see 09-keycloak.yaml).
#
# Naming convention: keycloak-catalyst-api-server-credentials
#   Matches what bp-catalyst-platform chart expects for:
#     env CATALYST_KC_SA_CLIENT_SECRET → secretKeyRef.name = keycloak-catalyst-api-server-credentials
#     env CATALYST_KC_SA_CLIENT_ID     → secretKeyRef.name = keycloak-catalyst-api-server-credentials
#     env CATALYST_KC_ADDR             → secretKeyRef.name = keycloak-catalyst-api-server-credentials
#     env CATALYST_KC_REALM            → secretKeyRef.name = keycloak-catalyst-api-server-credentials
#
# This file is a TEMPLATE — envsubst replaces ${SOVEREIGN_FQDN} when generating
# per-Sovereign bootstrap-kit directories. The `encryptedData` fields are set by
# the provisioner (kubeseal --cert from the per-Sovereign sealed-secrets controller)
# and committed to the per-Sovereign cluster directory.
#
# IMPORTANT: encryptedData fields below are PLACEHOLDER only. Real values are
# generated and sealed by the provisioner. Never commit real sealed data here —
# this template file stays generic across all Sovereigns.

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-catalyst-api-server-credentials
  namespace: catalyst-system
  annotations:
    # Phase-8b: generated at provisioning time, sealed with per-Sovereign public key
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
    catalyst.openova.io/managed-by: provisioner
spec:
  encryptedData:
    # PLACEHOLDER — provisioner replaces these with real sealed values
    CATALYST_KC_ADDR: PLACEHOLDER_SEALED_VALUE
    CATALYST_KC_REALM: PLACEHOLDER_SEALED_VALUE
    CATALYST_KC_SA_CLIENT_ID: PLACEHOLDER_SEALED_VALUE
    CATALYST_KC_SA_CLIENT_SECRET: PLACEHOLDER_SEALED_VALUE
  template:
    metadata:
      name: keycloak-catalyst-api-server-credentials
      namespace: catalyst-system
      labels:
        catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
        catalyst.openova.io/component: keycloak-oidc-client
    type: Opaque
