# bp-kyverno — Catalyst bootstrap-kit Blueprint #27 (W2.K3, Tier 7 — Security/Policy).
# Kubernetes-native admission policy engine. Validating/mutating/generating
# admission control via ClusterPolicy/Policy CRDs. HA mode with separate
# admission/background/cleanup/reports controllers. The first guardrail
# downstream Catalyst Apps land behind once the platform is bootstrapped.
#
# Wrapper chart: platform/kyverno/chart/ (umbrella over upstream
# kyverno/kyverno chart, Catalyst-curated values under the `kyverno:` key).
# Reconciled by: Flux on the new Sovereign's k3s control plane.
#
# dependsOn:
#   - bp-cilium — Kyverno admission webhooks need a working CNI + Service
#     mesh substrate to receive AdmissionReview requests from the apiserver.
#     Cilium is the root of the Catalyst-Zero DAG; until it is Ready the
#     apiserver→webhook path is not reachable and Kyverno install is racy.
#   - bp-cert-manager — TBD-V53 #2128 root-cause fix. Kyverno 1.3.0+ uses
#     cert-manager to provision its admission-webhook TLS Secret BEFORE the
#     kyverno main container starts (see platform/kyverno/chart/values.yaml
#     comment on certManager.enabled). Without this dependsOn the Helm
#     release can apply while cert-manager's controller / cainjector /
#     webhook are still rolling out — the Certificate CR is created but
#     stays Issuing, the wait-for-tls-secret initContainer pins the kyverno
#     Pod in Init forever, and the bootstrap-kit Kustomization wedges on
#     the cert-manager → kyverno chain. bp-cert-manager is slot 02 (well
#     above slot 27) and exposes Ready=True only after its webhook serves
#     correctly, so the dependsOn is sequential not just topological.

---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-kyverno
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-kyverno
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "27"
spec:
  interval: 15m
  releaseName: kyverno
  targetNamespace: kyverno
  dependsOn:
    - name: bp-cilium
    - name: bp-cert-manager
  chart:
    spec:
      chart: bp-kyverno
      # 1.3.0 (TBD-V53 #2128): cold-start race fix — cert-manager-issued
      # TLS + wait-for-tls-secret initContainer.
      # 1.3.2 (G54 #2605, 2026-05-30): self-referential webhook-gate Job
      # closes META-AUDIT 1 sub-class 3 — kyverno admission webhook
      # registered before kyverno-svc Pod ready blocks own Secret CREATE
      # via failurePolicy: Fail. Verified deadlock on hw62 v14 06:11Z.
      version: 1.3.2
      sourceRef:
        kind: HelmRepository
        name: bp-kyverno
        namespace: flux-system
  # Event-driven install: Kyverno HA mode brings up four controller
  # Deployments (admission, background, cleanup, reports) plus the
  # admission webhook TLS bootstrap. Pod Ready is multi-minute on a
  # cold cluster; Helm `--wait` would hold the HR's Ready=True signal
  # past the point where downstream HRs could legitimately reconcile.
  # disableWait lets Flux mark this Ready as soon as manifests apply.
  install:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
