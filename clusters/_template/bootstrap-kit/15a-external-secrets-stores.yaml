# bp-external-secrets-stores — Catalyst bootstrap-kit Blueprint, slot 15a
# (sub-slot of 15, follows bp-external-secrets controller).
#
# Owns the default ClusterSecretStore CR(s) wiring ESO to bp-openbao.
# Split from bp-external-secrets@1.0.0 (issue #331) to resolve the
# CRD-ordering deadlock — Helm's `before-hook-creation` delete policy on
# the in-line ClusterSecretStore hook ran a kubectl-style lookup of the
# CR before the upstream chart's CRDs finished registering, deadlocking
# the install with `no matches for kind ClusterSecretStore` (incident on
# otech.omani.works 2026-04-30).
#
# Mirrors the bp-crossplane (controller) ↔ bp-crossplane-claims (CRs)
# split shape from PR #247.
#
# Wrapper chart: platform/external-secrets-stores/chart/
# Catalyst-curated values: platform/external-secrets-stores/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-external-secrets-stores
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-external-secrets-stores
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "15a"
spec:
  interval: 15m
  releaseName: external-secrets-stores
  targetNamespace: external-secrets-system
  # Order — Flux will not start install until bp-external-secrets reaches
  # Ready=True (which means: upstream ESO controller running AND CRDs
  # registered) AND bp-openbao reaches Ready (the secret backend the
  # ClusterSecretStore points at).
  dependsOn:
    - name: bp-external-secrets
    - name: bp-openbao
  chart:
    spec:
      chart: bp-external-secrets-stores
      # 1.0.3 (issue #147 / prov #23): bump webhookGate.timeoutSeconds
      # 300 -> 600. Fix #141's 300s budget raced on prov #23
      # (`3ea80c75e1568a5c`, 3rd consecutive FAIL of this HR) where
      # cold-node image pull (+60-120s, no warmed cache) compounded on
      # cert-manager's own earlier retry latency, pushing total webhook
      # convergence past 300s. 600s = realistic max cold-start budget.
      #
      # 1.0.2 (issue #141 / prov #21): bump webhookGate.timeoutSeconds
      # 60 -> 300. Fix #137's 60s budget raced on prov #21
      # (`f84f6c3ff2b60296`, HR FAILED `failed pre-install: timed out`)
      # where webhook convergence took 75-105s on slow Hetzner cold-start.
      #
      # 1.0.1 (issue #137 / prov #20): pre-install hook gates the
      # ClusterSecretStore apply on the upstream ESO admission webhook
      # actually being dial-able (Pod-Ready ≠ Endpoints-populated +
      # cert-manager Cert mounted + CABundle injected). Without it the
      # HR FAILED with `exceeded max retries` on cold-cluster provisions
      # even though dependsOn (bp-external-secrets) was satisfied.
      #
      # 1.0.4 (Fix #158): webhookGate hook image switched from
      # bitnami/kubectl:1.30.4 (deleted from Docker Hub 2025-08) to
      # bitnamilegacy/kubectl:1.30.7.
      # 1.0.6 (G26 Refs #2581, 2026-05-29): add explicit cpu/memory
      # requests + limits on the webhook-gate Job container so the
      # bp-kyverno-policies 05-resource-requests + 06-resource-limits
      # ClusterPolicies admit the pre-install hook on HCS Sovereigns
      # (denied live on hw54 13:46Z → HR Unknown → downstream HRs
      # blocked). 10m/32Mi req + 100m/128Mi lim — sized for ~15s
      # kubectl-poll loop, no idle headroom needed.
      version: 1.0.6
      sourceRef:
        kind: HelmRepository
        name: bp-external-secrets-stores
        namespace: flux-system
  # Event-driven install per docs/INVIOLABLE-PRINCIPLES.md #3 (Flux
  # dependsOn is the gate, not Helm timeout).
  install:
    disableWait: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    timeout: 15m
    remediation:
      retries: 3
