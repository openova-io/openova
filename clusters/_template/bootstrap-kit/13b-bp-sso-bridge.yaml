# bp-sso-bridge — Catalyst bootstrap-kit Blueprint #13b
# (G91.1 framework — Refs #2652).
#
# G91.1 (worker-1 commit 174a0ad3) shipped the chart at platform/sso-bridge/
# but NO bootstrap-kit slot. Result: chart existed but never installed on
# any Sovereign → every G91 sub-ticket (G91.gitea / G91.harbor / G91.openbao
# / G91.grafana / G91.sandbox / G91.powerdns-admin / G91.catalyst-console-
# admin-self-grant) shipped chart values with `sso.enabled: true` but the
# reconciler that materialises the Keycloak Client + grants the operator
# admin role was never running. THIS slot installs it.
#
# Lead PR (Refs G91 #2646, 2026-06-01): adds the canonical install slot.
#
# Reconciled by: Flux on the new Sovereign's k3s control plane, AFTER
# bp-keycloak (slot 09) reaches Ready (Sovereign realm + admin client),
# bp-openbao (slot 08) reaches Ready (KV2 secrets store the client_secret),
# and bp-catalyst-platform (slot 13) reaches Ready (sovereign-fqdn
# ConfigMap with `orgEmail` key that bp-sso-bridge reads to determine
# which user gets the per-app admin grant).
#
# Wrapper chart: platform/sso-bridge/chart/

---
apiVersion: v1
kind: Namespace
metadata:
  name: sso-bridge
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-sso-bridge
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  # G2722 #2722 (2026-06-01): private GHCR registry — secretRef:
  # ghcr-pull required, else helm-controller falls back to anonymous
  # auth and the OCI pull returns 401. Caught live on hw86 — bp-sso-
  # bridge HR stuck SourceNotReady blocking the reconciler Pod. Every
  # other slot file already has this; 13b was the only one missing it.
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-sso-bridge
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "13b"
spec:
  interval: 15m
  releaseName: sso-bridge
  targetNamespace: sso-bridge
  dependsOn:
    # MUST NOT dependOn bp-catalyst-platform (#2989): catalyst-platform
    # dependsOn bp-gitea, and gitea's install hard-blocks on the `sso/gitea`
    # OpenBao secret that THIS reconciler writes → 3-way deadlock
    # (gitea → catalyst-platform → sso-bridge → sso/gitea → gitea), wedging
    # fresh provs at ~45/56 (caught live on hw89). The reconciler only needs
    # keycloak (catalyst-api-server SA Client, reflector-mirrored) + openbao
    # for the Tier-1 SSO bootstrap; the operator-admin grant (which needs the
    # catalyst-api orgEmail ConfigMap) is already deferred gracefully when
    # orgEmail is absent (configmap-reconciler.yaml: "skipping admin grant;
    # deferred until first sign-in", return 0) and re-runs on a later
    # reconcile once catalyst-api is up. So sso-bridge runs early, writes
    # sso/<app>, and gitea/catalyst-platform install behind it.
    - name: bp-keycloak
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    - name: bp-openbao
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  chart:
    spec:
      chart: bp-sso-bridge
      # 0.2.15 (#2940 Pillar 5 anti-tether, 2026-06-08): reconciler image
      # registry host now driven by global.registryMirror (single source
      # of truth) — see the values.global.registryMirror overlay below.
      # Default render unchanged (harbor.openova.io). Refs #2940.
      # 0.2.8 (G117.5-followup #2914, 2026-06-03): dual-token KC mint —
      # adds master-realm token via grant_type=password against
      # /realms/master/...token using bitnami-generated admin user creds
      # (mirrored from bp-keycloak 1.4.18+'s catalyst-kc-master-admin-
      # credentials Secret via reflector). Unblocks per-Org realm
      # provisioning (POST /admin/realms previously 403'd because
      # sovereign-realm SA lacks master-realm create-realm role).
      # Refs #2914 #2744.
      # 0.2.7 (#2861 RCA, 2026-06-03): fix Cilium `reserved:world` vs
      # `reserved:kube-apiserver` identity mismatch on the kube-API
      # egress rule. `ipBlock 0.0.0.0/0` excluded the apiserver
      # identity → every `kubectl get cm sovereign-fqdn` tick was
      # dropped at Cilium policy verdict. Replaced with explicit
      # default/component=apiserver podSelector. Unblocks per-Org
      # realm provisioning on hw86. Refs #2861 #2744.
      # 0.2.6 (#2744 H8 walk, 2026-06-03): fix Cilium egress NetworkPolicy
      # port mismatch — chart's egress rule allow-listed only the
      # keycloak Service port (80), but Cilium enforces on the Pod's
      # target port (8080). Result: ALL bp-sso-bridge → keycloak admin
      # calls timed out (curl(28)) for 24h+, blocking per-Org realm
      # provisioning + Tier-1/2/3 client upserts. Adds 8080/TCP
      # alongside the existing 80/TCP allow. Refs #2744 #2834.
      # 0.2.3 (G117.5c #2801, 2026-06-02): Tier-3 AppRegistration ConfigMap
      # watcher. New upsert_per_org_client + reconcile_app_registrations
      # shell functions read ConfigMaps labelled
      # `sso.openova.io/app-registration=<client-id>` cluster-wide,
      # POST/PUT the matching Client into the per-Org realm specified in
      # `data.realm`, then PUT the bundle to OpenBao at
      # `sso/<realm>/<client-id>` where the Tier-3 chart-side
      # sso-externalsecret.yaml resolves it. Closes G117.5 W3.D2
      # verifier's GAP finding — Tier-3 chart-emitted ConfigMaps were
      # dormant. Refs #2801 #2744.
      # 0.2.2 (G117.5 W2.C4 #2744, 2026-06-02): per-Org realm reconciler —
      # provision_org_realm + reconcile_per_org_realms shell functions that
      # import per-Org realms (emitted by bp-keycloak 1.4.12 tenantRealms[])
      # via KC Admin API + register matching <slug>-broker Client in the
      # sovereign realm + persist broker secret in OpenBao kv/org/<slug>/...
      # 0.1.1 (G91-fu, Refs #2659, edc55c08 PR #2676): adds realm-role
      # grant + skipClientUpsert opt-out for charts whose Keycloak Client
      # is realm-imported at bp-keycloak install time (catalyst-ui etc.).
      # 0.2.16 (#3374, 2026-06-14): AppRegistration watcher applies an
      # optional chart-declared ExternalSecret (data["externalSecret.json"])
      # so a before-ESO chart (slot-01 bp-cilium hubble-ui) gets its OIDC
      # client-secret ExternalSecret from THIS post-ESO reconciler — fixes
      # the hubble oauth2-proxy CreateContainerConfigError (slot-01 install-
      # time .Capabilities snapshot permanently omits the chart's own ES).
      # Lockstep: bp-cilium 1.4.2 ships the hubble-ui declaration. Refs #3374.
      # 0.2.17 (#3374, 2026-06-14): emit the per-app OIDC ExternalSecret into
      # the HR's targetNamespace (where the app Pod runs) instead of the HR's
      # own namespace (flux-system). Fixes grafana's 2/3
      # CreateContainerConfigError → 503: the chart-side grafana ES is omitted
      # by the install-time .Capabilities ESO-CRD-race guard, so the bp-sso-
      # bridge ES was the only one — and it landed in flux-system, invisible to
      # the grafana Pod's envFromSecret. Default (in-place HR) render
      # byte-identical. Refs #3374.
      # 0.2.18 (#3374, 2026-06-14): add sso.skipExternalSecret opt-out so apps
      # with a chart-side transformed ES (grafana: GF_AUTH_GENERIC_OAUTH_* +
      # GF_SERVER_ROOT_URL) get the OpenBao bundle written but NOT a colliding
      # raw-key K8s ExternalSecret. 0.2.17's targetNamespace move made the raw
      # bp-sso-bridge ES fight grafana's chart ES over grafana-sso-oidc-
      # credentials → raw win left generic_oauth unconfigured (empty client_id,
      # redirect_uri https://localhost/). Slot 25-grafana sets the flag.
      # Default false → harbor/openbao/gitea/powerdns byte-identical. Refs #3374.
      # 0.2.20 (#3646, 2026-06-17): stamp the catalyst.openova.io/reconciler
      # marker on the reconciler Deployment so the jobs canvas surfaces it as a
      # kind=reconciler HEALTH leaf. Label-only addition → render otherwise
      # byte-identical. Refs #3646.
      # 0.2.19: reconciler configmap generic gate coverage (#3374).
      # 0.2.21: keycloak/openbao egress namespace default → mgmt (#3820 #3642).
      # 0.2.22: #3374 — app-registration ExternalSecrets no longer self-deleted by the orphan sweep each tick.
      # 0.2.23 (#4437): re-read the keycloak credentials Secret EACH TICK so a
      #   reflected addr/secret change (the #4325 de-vcluster host correction;
      #   a #4344 admin-pw regen) is picked up with ZERO pod roll. The boot
      #   secretKeyRef env snapshot (KC_ADDR) never hot-reloads, so the long-
      #   lived reconciler kept dialing the dead keycloak-x-...-mgmt-vcluster
      #   host → no KC token → no sso/<app> seed → grafana(+all) 503. Also
      #   re-homes the stale `mgmt` keycloak/openbao egress NetworkPolicy
      #   namespaces back to host ns keycloak/openbao (post-#4325/#4347).
      #   Refs #4437 #4347 #4325.
      # 0.2.24 (#4458): EGRESS half of the #4448/#4449 sso-bridge↔openbao gap.
      #   The sso-bridge-reconciler-apiserver CiliumNetworkPolicy attaches an
      #   egress rule → the reconciler endpoint becomes CNP-ENFORCED egress, so
      #   the sibling K8s-NP openbao/keycloak/DNS egress allow is INERT (Cilium
      #   reserved-identity supersession, same class as 0.2.7/#2861). Pre-fix the
      #   CNP listed ONLY kube-apiserver → openbao:8200 + keycloak:8080 dials
      #   policy-dropped → `no OpenBao token` every tick → grafana/hubble 503,
      #   gitea 500. Fix: CNP egress now also names kube-dns + keycloak + openbao.
      #   #4449 fixed the INGRESS side; this is the EGRESS side. Refs #4458 #4449.
      version: 0.2.25
      sourceRef:
        kind: HelmRepository
        name: bp-sso-bridge
        namespace: flux-system
  # #2989 residual (0.2.9): the reconciler needs the Sovereign FQDN
  # BEFORE bp-catalyst-platform ships the sovereign-fqdn ConfigMap —
  # gitea's post-install SSO hook starves on the sso/gitea key the
  # reconciler writes, and catalyst-platform dependsOn gitea. The
  # chart-value fallback breaks that residual cycle; the CM (with
  # orgEmail) still wins once it exists.
  values:
    # #2940 Pillar 5 anti-tether: the reconciler image's registry host.
    # Default `harbor.openova.io` (the mothership Harbor proxy-cache) keeps
    # the bootstrap pull working out-of-the-box; the
    # `${REGISTRY_MIRROR:=harbor.openova.io}` substitution lets a
    # per-Sovereign overlay (or the bp-self-sovereign-cutover Step-04
    # registry pivot, ADR-0002) re-point the host to the Sovereign's OWN
    # Harbor in one place without editing the chart.
    global:
      registryMirror: ${REGISTRY_MIRROR:=harbor.openova.io}
    sovereign:
      fqdn: ${SOVEREIGN_FQDN}
  install:
    timeout: 5m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 5m
    disableWait: true
    remediation:
      retries: 3
