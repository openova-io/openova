# bp-sso-bridge — Catalyst bootstrap-kit Blueprint #13b
# (G91.1 framework — Refs #2652).
#
# G91.1 (worker-1 commit 174a0ad3) shipped the chart at platform/sso-bridge/
# but NO bootstrap-kit slot. Result: chart existed but never installed on
# any Sovereign → every G91 sub-ticket (G91.gitea / G91.harbor / G91.openbao
# / G91.grafana / G91.sandbox / G91.powerdns-admin / G91.catalyst-console-
# admin-self-grant) shipped chart values with `sso.enabled: true` but the
# reconciler that materialises the Keycloak Client + grants the operator
# admin role was never running. THIS slot installs it.
#
# Lead PR (Refs G91 #2646, 2026-06-01): adds the canonical install slot.
#
# Reconciled by: Flux on the new Sovereign's k3s control plane, AFTER
# bp-keycloak (slot 09) reaches Ready (Sovereign realm + admin client),
# bp-openbao (slot 08) reaches Ready (KV2 secrets store the client_secret),
# and bp-catalyst-platform (slot 13) reaches Ready (sovereign-fqdn
# ConfigMap with `orgEmail` key that bp-sso-bridge reads to determine
# which user gets the per-app admin grant).
#
# Wrapper chart: platform/sso-bridge/chart/

---
apiVersion: v1
kind: Namespace
metadata:
  name: sso-bridge
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-sso-bridge
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  # G2722 #2722 (2026-06-01): private GHCR registry — secretRef:
  # ghcr-pull required, else helm-controller falls back to anonymous
  # auth and the OCI pull returns 401. Caught live on hw86 — bp-sso-
  # bridge HR stuck SourceNotReady blocking the reconciler Pod. Every
  # other slot file already has this; 13b was the only one missing it.
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-sso-bridge
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "13b"
spec:
  interval: 15m
  releaseName: sso-bridge
  targetNamespace: sso-bridge
  dependsOn:
    # G105-followup2 #2697 (2026-06-01): bp-keycloak + bp-openbao HRs
    # reverted to flux-system ns (G92.x slot-level forcing dropped).
    - name: bp-keycloak
    - name: bp-openbao
    - name: bp-catalyst-platform
  chart:
    spec:
      chart: bp-sso-bridge
      # 0.2.3 (G117.5c #2801, 2026-06-02): Tier-3 AppRegistration ConfigMap
      # watcher. New upsert_per_org_client + reconcile_app_registrations
      # shell functions read ConfigMaps labelled
      # `sso.openova.io/app-registration=<client-id>` cluster-wide,
      # POST/PUT the matching Client into the per-Org realm specified in
      # `data.realm`, then PUT the bundle to OpenBao at
      # `sso/<realm>/<client-id>` where the Tier-3 chart-side
      # sso-externalsecret.yaml resolves it. Closes G117.5 W3.D2
      # verifier's GAP finding — Tier-3 chart-emitted ConfigMaps were
      # dormant. Refs #2801 #2744.
      # 0.2.2 (G117.5 W2.C4 #2744, 2026-06-02): per-Org realm reconciler —
      # provision_org_realm + reconcile_per_org_realms shell functions that
      # import per-Org realms (emitted by bp-keycloak 1.4.12 tenantRealms[])
      # via KC Admin API + register matching <slug>-broker Client in the
      # sovereign realm + persist broker secret in OpenBao kv/org/<slug>/...
      # 0.1.1 (G91-fu, Refs #2659, edc55c08 PR #2676): adds realm-role
      # grant + skipClientUpsert opt-out for charts whose Keycloak Client
      # is realm-imported at bp-keycloak install time (catalyst-ui etc.).
      version: 0.2.5
      sourceRef:
        kind: HelmRepository
        name: bp-sso-bridge
        namespace: flux-system
  install:
    timeout: 5m
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    timeout: 5m
    disableWait: true
    remediation:
      retries: 3
