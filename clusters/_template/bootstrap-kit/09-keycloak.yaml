# bp-keycloak — Catalyst bootstrap-kit Blueprint. User identity. Topology decided by Sovereign CRD spec.keycloakTopology.
#
# Wrapper chart: platform/keycloak/chart/
# Catalyst-curated values: platform/keycloak/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.
#
# G92.2 #2661 (2026-06-01): the HelmRelease installs INSIDE the MGMT
# vCluster via Flux v2 spec.kubeConfig.secretRef → vc-mgmt (kubeconfig
# Secret exported by bp-mgmt-vcluster slot 58). Per docs/SOVEREIGN-
# MULTI-REGION-DOD.md §A4 user identity (IdP) lives in MGMT so the
# Keycloak admin URL is co-located with catalyst-api / openova-flow-
# server. The Keycloak chart ships its own bundled Bitnami postgresql
# subchart (NOT a CNPG Cluster CR), so the move is clean — no
# cross-vCluster CR reconciler is needed. The HR CR itself lives in
# host ns `mgmt` so helm-controller resolves the kubeConfig Secret
# from the same namespace (Flux v2 SecretReference contract).

---
# Host namespace for keycloak's shared-pg connection Secret (keycloak-database-secret).
# #3642 re-homed keycloak into the mgmt vCluster, but it consumes shared-pg (host).
# bp-postgres-shared's connection-secret.yaml has bp-reflector AUTO-PUSH the
# keycloak-database-secret into the keycloak namespace — but the reflector can only
# push once that namespace EXISTS. With keycloak in the vCluster, its HOST namespace
# is never created by its own HR, so the push silently no-ops → keycloak-0 hangs
# Init with `secret "keycloak-database-secret" not found` → bp-keycloak never Ready
# → bp-gitea/bp-catalyst-platform wait → console 000 (caught live on hw162, frozen
# 49/64). Declaring it here (Flux applies Namespace kinds first) gives the reflector
# its push target; the vCluster fromHost keycloak/* mirror then delivers it into the
# vCluster. gitea/harbor/grafana/guacamole/newapi declare theirs; keycloak+openbao
# were the gaps (Refs #3642 #3731 #3804).
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-keycloak
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-keycloak
  # G92.2 #2661: HR lives in host ns `mgmt` (where bp-mgmt-vcluster
  # exports vc-mgmt Secret). helm-controller authenticates against the
  # G105-followup #2697 (2026-06-01): metadata.namespace reverted to
  # flux-system. With G92.x slot-level forcing dropped, the HR no
  # longer needs to colocate with vc-mgmt. Reverting also restores
  # the Helm valuesFrom lookup of secrets like 'object-storage'
  # (cloud-init seeds it in flux-system; lookup is in HR's own ns).
  namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  labels:
    catalyst.openova.io/slot: "09"
spec:
  interval: 15m
  releaseName: keycloak
  targetNamespace: keycloak
  dependsOn:
    - name: bp-cert-manager
      namespace: flux-system
    # bp-gateway-api (issue #503): chart ships an HTTPRoute template;
    # gateway.networking.k8s.io/v1 CRDs must be registered first.
    - name: bp-gateway-api
      namespace: flux-system
    # bp-postgres-shared (#3188 three-instance model): when keycloak
    # SHARES the shared-pg instance A (SOVEREIGN_KEYCLOAK_PG_OWN_CLUSTER
    # =false), gate on it so the keycloak Database + role + reflected
    # keycloak-database-secret exist first. Harmless in the default 1:1
    # path — bp-postgres-shared is an empty Ready release within seconds
    # of bp-cnpg + bp-reflector (the same unconditional-edge shape
    # bp-gitea slot 10 + bp-harbor slot 19 already carry).
    - name: bp-postgres-shared
      namespace: flux-system
  chart:
    spec:
      chart: bp-keycloak
      # 1.5.0 (qa-loop iter-12 Fix #53A): adds .Values.sovereignRealm.name
      # parameter so each Sovereign owns its KC realm named after the tenant
      # short-name (omantel chroot → "omantel"). Default `sovereign` is kept
      # in the chart for backward compat with overlays not yet migrated.
      # 1.4.5 (issue #146, prov #21+#22 hung 30+ min on bp-keycloak install):
      # post-#140 retune. (a) availabilityCheck.timeout 900s → 300s — coarser
      # retry was busting HR window before backoff could retry; faster
      # failure means more attempts fit. (b) startupProbe enabled with 30m
      # budget so slow Liquibase doesn't get killed by livenessProbe mid-
      # migration. (c) livenessProbe.initialDelaySeconds 300 → 60 (cold-
      # start protection now lives in startupProbe). Coupled HR change
      # below: install/upgrade.remediation.retries 3 → 1 (Job's own
      # backoffLimit handles retries without losing state across Helm
      # restarts). Together: ≤ 30m wall-clock vs. 90m+ before.
      # 1.4.4 (issue #140, post-upgrade hook regression on prov #21): bumps
      # keycloakConfigCli.availabilityCheck.timeout 600s → 900s + adds
      # cleanupAfterFinished (1h TTL) so stale hook Pods don't race
      # before-hook-creation deletes on subsequent upgrades. Coupled with
      # the install/upgrade timeout bump below (15m → 30m) so Helm's
      # outer hook-wait accommodates the inner 15m availability window.
      # 1.4.3 (issue #129): bumped keycloakConfigCli.availabilityCheck.timeout
      # 120s → 600s + backoffLimit 1 → 5 (fresh-install wedge).
      # 1.4.12 (G117.5 W2.C4 #2744, 2026-06-02): per-Org realm template
      # configmap-per-org-realms.yaml + new tenantRealms[] values list.
      # Default empty (no-op for existing Sovereigns); populated entries
      # emit one ConfigMap per Org bearing a complete realm-import JSON
      # with sovereign-broker IdP for 2-hop federation into the
      # sovereign realm. bp-sso-bridge 0.2.2 picks these up and
      # registers the matching <slug>-broker Client in the sovereign
      # realm. Cross-Org isolation enforced at issuer level.
      # 1.4.11 (G113 #2725 Bug-6, 2026-06-02): realm import adds the
      # `first broker login auto link` custom flow + switches catalyst-pin
      # IdP's firstBrokerLoginFlowAlias to it — bypasses KC SMTP for
      # first-broker-login email-collision handling on Sovereigns whose
      # KC SMTP is not yet wired.
      # 1.4.13 (G117.5 W3.D1 #2744, 2026-06-02): Tier-2 silent-SSO clients
      # (guacamole, powerdns-admin, hubble-ui) codified in sovereign
      # realm-import via the new `bp-keycloak.tier2ClientSecret` helper.
      # Pattern mirrors Tier-1 1.4.10 fan-out; same realm + same
      # catalyst-pin IDR. Refs #2744.
      # 1.4.14 (G117.5b #2789, 2026-06-02): adds optional
      # .Values.sso.tier1ClientSecretSalt knob. When non-empty, the
      # Tier-1/Tier-2/Tier-3 client-secret derivation helpers append
      # it to the SHA-256 seed, atomically rotating every derived SSO
      # client secret on next helm upgrade. Empty default preserves
      # render-stability + back-compat. Refs #2789.
      # 1.4.15 (G117.E2E-A1 #2816, 2026-06-03): trim Tier-2 sovereign-realm
      # client descriptions (powerdns-admin, hubble-ui) below varchar(255)
      # so keycloak-config-cli stops crashing on every upgrade. Refs #2816.
      # 1.4.16 (G117.E2E-A7 #2816, 2026-06-03): extends the trim to the
      # tenant-realm + per-Org-realm templates that PR #2824 left
      # unaddressed. The per-Org case is the gating fix for the W2.C4
      # cross-Org silent-SSO walk on hw86. Refs #2816 #2744.
      # 1.4.17 (G117.5c #2744 H21, 2026-06-03): extend
      # catalyst-kc-sa-credentials reflector whitelist on the source
      # Secret to include `sso-bridge` ns alongside `catalyst-system`.
      # Unblocks bp-sso-bridge reconciler Pod which had been stuck in
      # CreateContainerConfigError because the local stub Secret stayed
      # empty (DATA: 0) — reflector refused to copy from a source that
      # didn't list `sso-bridge` in its allow + auto namespaces. Caught
      # live H18 walk on hw86 2026-06-03 (H21 RCA). Companion to
      # PR #2849 (NetPol port-8080 fix). Refs #2744 #2849 #2856.
      # 1.4.18 (G117.5-followup #2914, 2026-06-03): emit new
      # catalyst-kc-master-admin-credentials Secret (looks up bitnami
      # admin user password via Helm lookup, adds reflector annotations
      # so bp-sso-bridge ns mirrors it) so the new bp-sso-bridge 0.2.8
      # can mint a master-realm token for POST /admin/realms. Closes
      # 403-on-realm-create gap caught live during #2744 walk.
      # 1.4.21 (#3150, 2026-06-09): federated user inherits ZERO Keycloak
      # required actions — UPDATE_PASSWORD.defaultAction false +
      # catalyst-pin IdP updateProfileFirstLoginMode off. Live-proven on
      # hw124 (fresh federation -> requiredActions=[]). Refs #3150.
      # 1.4.22 (#3263 #3150 #2737, 2026-06-11): pin KC frontend URL to the
      # public https://auth.${SOVEREIGN_FQDN} (KC_HOSTNAME +
      # KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true) so the OIDC discovery doc emits
      # the PUBLIC authorize endpoint — gitea (and every autodiscovery
      # consumer) no longer 307s the browser to the in-cluster
      # keycloak.keycloak.svc.cluster.local issuer (hw126 UAT FAIL).
      # 1.4.23 (#3263 #2737, 2026-06-11): kyverno-baseline-Enforce compliance
      # for the keycloak + keycloak-postgresql StatefulSets and the config-cli
      # Job (the IdP for ALL SSO). The #3264 roll recreated keycloak-0 after
      # the baseline began enforcing → kyverno DENIED it (harbor-proxy-pull on
      # bare docker.io/bitnamilegacy images + missing cilium-l7-mtls label) →
      # keycloak 0/1 → every SSO surface a bare login page. Repointed all
      # Bitnami images through the local Harbor proxy-cache + added the
      # policy.cilium.io/enforced label on both StatefulSets.
      # 1.4.24 (founder NS-3 #3263, 2026-06-12): owner is admin-by-default.
      # Realm import seeds sovereignRealm.ownerEmail (threaded below from
      # ${SOVEREIGN_OWNER_EMAIL}, i.e. the deployment's org_email) into
      # /sovereign-admins + /sovereign-viewers at bootstrap, so grafana/
      # gitea/harbor/openbao admin mappings (all keyed on sovereign-admins)
      # elevate the owner on first SSO login. The catalyst-pin broker
      # auto-links to the pre-seeded user by email (trustEmail=true flow).
      # 1.4.25: hook Job managed-by:flux (kyverno Enforce, #3297 class).
      # 1.4.26: config-cli right-sized 500m->100m (requests-wedge on hw130).
      # 1.4.29: sovereign-realm configmap one-admin-authority (#3374).
      # 1.4.30: powerdns-admin realm client -> /oauth2/callback + aud-mapper,
      #         matching the bp-oidc-gate AppRegistration (#3741, hw158 row 6).
      # 1.4.31 (#3687, extends #3370): bootstrap self-registration — the
      # chart renders the canonical apps.openova.io/v1 Application CR for
      # this slot's HelmRelease so the console /apps list, per-app Topology
      # tab + showback resolve keycloak (no more "no Application CR").
      # 1.4.34 (#3741/#3852): powerdns-admin realm client registers BOTH
      #         /oauth2/callback AND /oidc/authorized — 1.4.30 over-stripped
      #         the native authlib callback, so the gate's bare-root→/oidc/login
      #         redirect 'Invalid parameter: redirect_uri'd on PDA's own OIDC
      #         hop (hw167 UAT row 3374-11). Lockstep with bp-oidc-gate 0.1.4.
      # 1.4.36 (#4054/#4070/#3374): per-Org tenant realm now registers the
      #         catalyst-ui public PKCE client so the per-Org console
      #         (console.<slug>.<zone>) OIDC redirect resolves instead of 400ing.
      # 1.4.37 (#3934, Refs #3642): account-console SSO-landing — KC's built-in
      #         account-console + security-admin-console now bind to a new
      #         `browser-no-idp` flow so a hint-less, cookie-less nav is NOT
      #         force-bounced into /broker/catalyst-pin/login (400 cookie_not_
      #         found → "We are sorry"). The SSO app clients keep the delegating
      #         `browser` flow untouched (gitea/harbor/openbao/oidc-gate). 4th
      #         SSO-landing surface from the #3642 pivot, caught live hw182.
      # 1.4.38 (#4163): FIX the 1.4.37 realm-import regression — `browser-no-idp`
      #         (a custom builtIn:false flow) referenced the built-in `forms`
      #         subflow, which keycloak-config-cli resolves ONLY for builtIn:true
      #         flows → import aborted `Non-toplevel flow not found: forms` →
      #         bp-keycloak post-upgrade hook failed → mgmt-vCluster SSO tier
      #         wedged Ready=False (live dep 4635277cae4ffed9 region-B). Fix:
      #         declare browser-no-idp its OWN forms + conditional-OTP subflows
      #         (OTP preserved); original `browser` flow untouched.
      # 1.5.1 (#4220): jump above the STALE ghcr bp-keycloak:1.5.0 (published
      #         2026-05-10, pre-proxy-dockerhub-fix) so the per-Org HR's
      #         chart.spec.version:"*" stops resolving to it (SemVer 1.5.0 >
      #         1.4.38) and its non-proxied bitnamilegacy images stop tripping
      #         harbor-proxy-pull. Chart content byte-identical to 1.4.38.
      # 1.5.3 — #4212 Seam 3: placementSchema aligned with spec.topology
      #   (modes[] admit active-hot-standby + defaultOnMultiRegion). Chart bumped in lockstep.
      # 1.5.4 — #4344 (Refs #4325 #4340): STABLE master-realm admin password. The
      #   #4325 de-vcluster re-homed keycloak into the host `keycloak` ns with a
      #   FRESH helm install → the bitnami subchart regenerated the admin-password
      #   while the keycloak DB persisted → keycloak-config-cli HTTP 401 → realm
      #   import never ran → bp-keycloak HR not-Ready → bp-gitea/bp-catalyst-platform
      #   wedged. New templates/admin-credentials.yaml materialises a stable
      #   `keycloak-admin` Secret (lookup-or-generate + resource-policy: keep) and
      #   values.yaml wires keycloak.auth.existingSecret=keycloak-admin so the
      #   password is reused (never regenerated) across reinstall + re-home. Chart
      #   + blueprint bumped in lockstep.
      version: 1.5.6
      sourceRef:
        kind: HelmRepository
        name: bp-keycloak
        namespace: flux-system
  # Event-driven install: Keycloak DB schema migration + realm import is
  # legitimately multi-minute on first install (PostgreSQL backend +
  # 100+ Liquibase changesets). Helm install completes when manifests
  # apply; downstream dependsOn checks Ready=True independently.
  # Replaces PR #221 spec.timeout: 15m.
  #
  # 15m → 30m bump (issue #140, post-upgrade hook regression on prov #21):
  # `disableWait: true` skips Pod-Ready waits but does NOT skip Helm hook
  # waits — Helm always blocks on hook-Pod completion bounded by this
  # timeout. The bp-keycloak chart's keycloak-config-cli post-install/
  # post-upgrade hook now has an inner availabilityCheck.timeout of 900s
  # (15m), and on chart-roll-triggered upgrades the keycloak StatefulSet
  # rolling-restart + Liquibase re-validation can consume that full
  # window. 30m gives Helm room to wait out one full inner attempt plus
  # exponential backoff if needed, without blowing past Flux's HR timer.
  # If you bump availabilityCheck.timeout further, bump THIS too.
  # remediation.retries 3 → 1 (issue #146, prov #21+#22 hung 30+ min):
  # Flux HR remediation does a full Helm uninstall+reinstall on each retry,
  # losing all hook-Pod state and restarting Liquibase from zero. With 3
  # retries × 30m HR timeout = up to 90m of wasted work before Flux gives
  # up. The keycloak-config-cli Job already retries internally via
  # `backoffLimit: 5` (set in chart values.yaml) — Job-level backoff
  # preserves Keycloak's state and only re-runs the realm-import sidecar.
  # HR-level remediation is reserved for genuine release-failure (e.g.
  # invalid manifest) where a clean reinstall is the right answer; one
  # retry is sufficient for that. Job-level vs. HR-level retry is the
  # correct separation per the bitnami subchart's design.
  install:
    # G92.2 #2661: createNamespace=true so helm-controller provisions
    # the inner `keycloak` namespace inside the mgmt vCluster on first
    # install.
    createNamespace: true
    disableWait: true
    timeout: 30m
    remediation:
      retries: 1
  upgrade:
    disableWait: true
    timeout: 30m
    remediation:
      retries: 1
  # Per-Sovereign overrides — issue #387 + #604 + qa-loop iter-12 Fix #53A:
  # Wire the per-Sovereign hostname into the HTTPRoute template and
  # sovereign realm ConfigMap (catalyst-ui redirect URIs). The HTTPRoute
  # attaches to cilium-gateway/kube-system installed by 01-cilium.yaml.
  #
  # sovereignRealm.name: per `feedback_no_mvp_no_workarounds.md` target-state
  # rule, each Sovereign owns its KC realm named after the tenant short-name.
  # The bootstrap-kit Kustomization's postBuild.substitute supplies
  # SOVEREIGN_REALM_NAME (canonical: first label of SOVEREIGN_FQDN, e.g.
  # `omantel` for omantel.biz). When unset the envsubst rule
  # ${VAR:=default} resolves to "sovereign" — backward-compat with
  # overlays that haven't been migrated.
  values:
    # ── Bootstrap self-registration (#3687, extends #3370) ──────────────
    # The chart self-registers the Application CR for keycloak (the
    # canonical instance representation every console surface reads),
    # marked spec.bootstrap=true so the application-controller ADOPTS this
    # HR's install instead of re-rendering it (zero duplicate HRs).
    bootstrapOwned:
      enabled: true
      helmRelease:
        name: bp-keycloak
        namespace: flux-system
    sovereignFQDN: ${SOVEREIGN_FQDN}
    # sovereignRealm.ownerEmail (founder NS-3 #3263): the deployment owner's
    # email — cloud-init threads tofu's org_email into the bootstrap-kit
    # Kustomization substitute map as SOVEREIGN_OWNER_EMAIL. The realm import
    # seeds this user into /sovereign-admins so the owner is admin-by-default
    # in every SSO-consuming app. On envs provisioned BEFORE the substitute
    # var existed, Flux leaves the literal `${SOVEREIGN_OWNER_EMAIL}` in
    # place — the chart's contains-"@" guard turns that into a no-op (no
    # junk user) instead of a render failure.
    sovereignRealm:
      name: ${SOVEREIGN_REALM_NAME:=sovereign}
      ownerEmail: "${SOVEREIGN_OWNER_EMAIL}"
      host: auth.${SOVEREIGN_FQDN}
    # Restored 2026-06-13: the #3373 slot regeneration replaced gateway.host
    # with the vCluster backendService alias; the #3391 residue strip then
    # removed the whole block — chart renders NO HTTPRoute without
    # gateway.host (auth.<fqdn> 404'd live).
    gateway:
      enabled: true  # #4291 DE-VCLUSTER — keycloak renders its OWN HTTPRoute natively in host ns `keycloak` (was suppressed by the #3642 host-bridge)
      host: auth.${SOVEREIGN_FQDN}
    # ── Shared-instance flip (#3188 three-instance model) ───────────────
    # Default OWN_CLUSTER=true → the bundled bitnami postgresql subchart
    # renders exactly as today (the externalDatabase block is UNREAD when
    # postgresql.enabled=true — default single-region render byte-
    # identical, proven by the chart-render diff in the PR). Cloud-init
    # computes OWN_CLUSTER=false from the same enable_shared_pg var that
    # turns slot 16a ON (one-flag contract, #3285/#3309 gitea/harbor
    # shape): the subchart StatefulSet is skipped and Keycloak runs in
    # externalDatabase mode against the shared-pg `keycloak` database +
    # role, reading credentials from the reflector-pushed hub Secret
    # `keycloak-database-secret` (#3283 push pattern; the Pod sits in
    # CreateContainerConfigError for the few seconds between namespace
    # creation and the reflector push, then starts — kubelet retries).
    # Keycloak's Liquibase owns the schema, so the empty database is the
    # correct starting state. The bitnami subchart builds KC_DB_URL from
    # the static host/port/database below; the password comes from the
    # hub Secret via existingSecret/existingSecretPasswordKey. NOTE: do
    # NOT set existingSecretUserKey — bitnami 25.2.0 consults it even
    # when postgresql.enabled=true (KC_DB_USERNAME flips to a _FILE
    # mount), which would break the default own-cluster render; the
    # plain `user` value below carries the username instead (it matches
    # the hub Secret's role by construction).
    keycloak:
      postgresql:
        enabled: ${SOVEREIGN_KEYCLOAK_PG_OWN_CLUSTER:=true}
      externalDatabase:
        # #3629: host is a substitution var (the SAME pattern bp-gitea slot 10
        # `${SOVEREIGN_GITEA_PG_HOST:=…}` + bp-harbor slot 19
        # `${SOVEREIGN_HARBOR_PG_HOST:=…}` already use) instead of a hardcoded
        # literal. Default `shared-pg-rw.shared-data…` keeps single-region
        # byte-identical, but bitnami's externalDatabase.host is a scalar (no
        # secretKeyRef), so the cross-region overlay must flip it to the
        # ClusterMesh-global WRITE alias `shared-pg-mesh-rw.shared-data…` —
        # the region-local `-rw` Service NXDOMAINs keycloak in the replica
        # region (hw146: keycloak-0 JGroups JDBC `UnknownHostException
        # shared-pg-rw`). bp-postgres 0.2.2 publishes the `-mesh-rw` alias on
        # the primary + a replica stub so the value resolves in BOTH regions.
        host: ${SOVEREIGN_KEYCLOAK_PG_HOST:=shared-pg-rw.shared-data.svc.cluster.local}
        port: 5432
        user: keycloak
        database: keycloak
        existingSecret: keycloak-database-secret
        existingSecretPasswordKey: password
