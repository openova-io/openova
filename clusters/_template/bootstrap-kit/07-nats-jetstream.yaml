# bp-nats-jetstream — Catalyst bootstrap-kit Blueprint. Catalyst's control-plane event spine. Per-Org Account isolation. KV bucket per Environment.
#
# Wrapper chart: platform/nats-jetstream/chart/
# Catalyst-curated values: platform/nats-jetstream/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.
#
# G92.2 #2661 (2026-06-01): the HelmRelease installs INSIDE the MGMT
# vCluster via Flux v2 spec.kubeConfig.secretRef → vc-mgmt (kubeconfig
# Secret exported by bp-mgmt-vcluster slot 58). Per docs/SOVEREIGN-
# MULTI-REGION-DOD.md §A4 the control-plane event bus lives in MGMT
# so it's co-located with catalyst-api / openova-flow-server / org-
# services — all consumers reach NATS via in-vCluster DNS without
# touching the host. The HR CR itself lives in host ns `mgmt` so
# helm-controller resolves the kubeConfig Secret from the same
# namespace (Flux v2 SecretReference contract).

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-nats-jetstream
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-nats-jetstream
  # G92.2 #2661: HR lives in host ns `mgmt` (where bp-mgmt-vcluster
  # G105-followup4 #2697 (2026-06-01): metadata.namespace reverted
  # to flux-system. G92.x slot-level forcing dropped (see slot
  # 09-keycloak.yaml header comment for the rationale).
  namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  labels:
    catalyst.openova.io/slot: "07"
spec:
  interval: 15m
  releaseName: nats-jetstream
  # targetNamespace = the inner namespace INSIDE the mgmt vCluster.
  # The vCluster syncer maps it back to host as
  # `<inner>-x-nats-system-x-mgmt` — the Catalyst-side consumers stay
  # inside the vCluster and resolve `nats-jetstream.nats-system.svc.
  # cluster.local` natively via vCluster CoreDNS.
  targetNamespace: nats-system
  # dependsOn: (key removed #4341) — #4325 de-vcluster dropped the last
  # `- name: bp-mgmt-vcluster` array item; leaving the bare `dependsOn:` key
  # rendered `dependsOn: null`, which the HelmRelease CRD rejects
  # (`spec.dependsOn must be of type array`) and wedged the WHOLE
  # bootstrap-kit Kustomization. With the planes now native host namespaces
  # there is no vc-mgmt Secret gate, so NATS has no remaining hard dependency.
  chart:
    spec:
      chart: bp-nats-jetstream
      # 1.3.5 — #4347: every workload container now clears the host-ns Kyverno
      #   `probes-present` + `harbor-proxy-pull` Enforce policies (post-#4325
      #   de-vcluster, `nats-system` is a native host ns). All 4 dockerhub
      #   images route through the Harbor proxy; reloader + nats-box get exec
      #   probes via the nats `merge` knob; the nack dep bumped 0.29.0->0.34.0
      #   + `controlLoop: true` so the jetstream-controller renders HTTP probes.
      # 1.3.4 — #4343: server/reloader/nats-box resources moved to the
      #   container.merge knob (the inert container.resources block was
      #   silently dropped) so every container clears the host-ns Kyverno
      #   resource-requests Enforce policy (post-#4325).
      version: 1.3.5
      sourceRef:
        kind: HelmRepository
        name: bp-nats-jetstream
        namespace: flux-system
  # Event-driven install: NATS StatefulSet with JetStream raft initialisation
  # — quorum formation across N replicas is legitimately multi-minute on
  # cold start. Helm install completes when manifests apply; downstream
  # dependsOn checks Ready=True independently. Replaces PR #221 timeout.
  install:
    # G92.2 #2661: createNamespace=true so helm-controller provisions
    # the inner `nats-system` namespace inside the mgmt vCluster on
    # first install (no host-side Namespace YAML needed — the inner
    # namespace is the vCluster's view).
    createNamespace: true
    timeout: 15m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
