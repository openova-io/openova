# storage-ready — bootstrap-kit slot 15b, the neutral storage gate (chart
# platform/storage-ready). Its hook Job succeeds when the StorageClass named by
# SOVEREIGN_CNPG_STORAGE_CLASS is the cluster default; after 10 minutes it
# fails and Flux retries. Slots that bind volumes (16-cnpg first) depend on
# storage-ready and on no cloud-specific disk-driver release. The chart comes
# through the HelmRepository bp-flux of slot 03 (the same OCI registry).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: storage-ready
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "15b"
    catalyst.openova.io/ring: foundation
spec:
  interval: 15m
  releaseName: storage-ready
  targetNamespace: flux-system
  dependsOn:
    - name: bp-flux
  chart:
    spec:
      chart: bp-storage-ready
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: bp-flux
        namespace: flux-system
  values:
    expectedClass: ${SOVEREIGN_CNPG_STORAGE_CLASS}
  # Longer than the 10 minutes the hook Job may wait.
  install:
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
