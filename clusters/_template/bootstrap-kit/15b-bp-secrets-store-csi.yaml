# bp-secrets-store-csi — bootstrap-kit slot 15b, the Secrets Store CSI driver
# (chart platform/secrets-store-csi). It mounts values from OpenBao into Pods
# as memory-backed files through the OpenBao CSI provider that slot 08 runs
# (openbao.csi.enabled), so it depends on bp-openbao. Secret sync is off in
# the chart: a mounted value never becomes a Secret object (gate check
# SEC-G08). The chart comes through the HelmRepository bp-flux of slot 03 (the
# same OCI registry).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-secrets-store-csi
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "15b"
    catalyst.openova.io/ring: foundation
spec:
  interval: 15m
  releaseName: secrets-store-csi
  targetNamespace: kube-system
  dependsOn:
    - name: bp-openbao
  chart:
    spec:
      chart: bp-secrets-store-csi
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: bp-flux
        namespace: flux-system
  install:
    timeout: 10m
    remediation:
      retries: -1
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
