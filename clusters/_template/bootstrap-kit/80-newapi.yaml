# bp-newapi — Catalyst Application Blueprint, bootstrap-kit slot 80.
# Multi-tenant LLM marketplace gateway. Ships in backend-only mode: the
# OpenAI-compatible API at api.<sovereign-fqdn>/v1/* is customer-facing;
# the upstream's portal UI is disabled at ingress; Catalyst replaces it
# as the customer surface; NewAPI's admin UI at admin.<sovereign-fqdn>
# is exposed only to ops staff (Keycloak-gated).
#
# This slot enables the Organization-tenant turnkey experience (epic #795). The
# Catalyst signup hook (delivered by unified-rbac in #802 against the
# contract recorded in ADR-0003) reads the `catalyst-newapi-admin-token`
# Secret rendered by this chart's ExternalSecret to issue per-user API
# keys against NewAPI's admin API at
# `http://newapi-bp-newapi.newapi.svc.cluster.local:3000` (canonical
# in-cluster Service URL — the bp-newapi `<Release.Name>-<Chart.Name>`
# helper renders `newapi-bp-newapi` for `releaseName: newapi` against
# chart `bp-newapi`; pre-TBD-V15 / #2021 this comment cited the
# wrong bare-`newapi` Service name).
#
# Wrapper chart: platform/newapi/chart/
# Catalyst-curated values: platform/newapi/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.

---
apiVersion: v1
kind: Namespace
metadata:
  name: newapi
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-newapi
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-newapi
  namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  labels:
    catalyst.openova.io/slot: "80"
spec:
  interval: 15m
  releaseName: newapi
  targetNamespace: newapi
  dependsOn:
    # #4291 DE-VCLUSTER — the slot-80a host-seams companion is RETIRED; newapi
    # renders its OWN CNPG Cluster + DSN-sync Job natively in host ns `newapi`
    # (placement.role=all, cnpg.enabled=true), so the dependsOn bp-newapi-host-
    # seams edge is removed (the seams are now in THIS HR's own render).
    - name: bp-openbao
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    - name: bp-keycloak
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    - name: bp-cnpg
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  chart:
    spec:
      chart: bp-newapi
      # 1.4.0 (issue #943, 2026-05-05): auto-provision CNPG-backed
      # Postgres + chart-emitted SESSION_SECRET/CRYPTO_SECRET so a
      # Sovereign install lands a real Pod without operator intervention.
      # Pre-#943 the Deployment silently skipped render whenever
      # database.existingSecret OR credentials.existingSecret was
      # empty (the bootstrap-kit overlay supplies neither), so NewAPI
      # never came up and alice signup gate 5 (LLM) timed out. Both
      # auto-provisions are capability-gated on bp-cnpg's CRD and
      # operator-overridable per Inviolable Principle #4.
      # 1.3.0: defaultChannels.qwenPartner (channel #1 = a partner-hosted
      # Qwen3-family model at an operator-supplied endpoint) + post-install
      # /post-upgrade `channel-seed` Helm hook Job that idempotently POSTs
      # default channels into NewAPI's admin API. Issue #915 (epic Organization
      # tenant integration DoD: alice → OpenClaw → NewAPI → partner-hosted
      # Qwen end-to-end).
      # 1.2.0: Traefik Middleware gated behind ingress.middleware.enabled.
      # 1.4.1 (issue #952, 2026-05-05): Pod imagePullSecrets templated +
      # default to `[{name: ghcr-pull}]` so kubelet authenticates pulls
      # of the PRIVATE newapi-mirror + metering-sidecar images. Paired
      # with cloud-init adding `newapi` to flux-system/ghcr-pull's
      # reflector auto-namespaces list.
      # 1.4.2 (qa-loop bounded-cycle audit prov #7 Gap F, 2026-05-10):
      # `.Values.newapi.image.tag` repointed from `v0.4.5` (fictitious —
      # never built by any CI workflow) to `v0.13.2` (actual upstream
      # Calcium-Ion/new-api Docker Hub release, mirrored into
      # ghcr.io/openova-io/openova/newapi-mirror by the new
      # `.github/workflows/build-bp-newapi.yaml` workflow). Pre-1.4.2
      # the NewAPI Pod ImagePullBackOff'd 403 on every fresh Sovereign,
      # blocking alice signup gate 5 (LLM).
      # 1.4.4 (qa-loop bounded-cycle audit prov #20 Fix #138, 2026-05-11):
      # add pre-install/pre-upgrade hook that polls the external-secrets
      # validating-admission webhook until it returns a structured HTTP
      # response — closes the race between bp-external-secrets reaching
      # HR Ready=True and the apiserver-side EndpointSlice for the
      # webhook Service being observable. Pre-1.4.4 the chart's
      # ExternalSecret apply was rejected with `no endpoints available
      # for service "external-secrets-webhook"` on every fresh provision,
      # blocking the chart from reaching Ready and the Catalyst signup
      # hook (ADR-0003 §3.2) from finding the admin-token Secret.
      # 1.4.10 (fix-convergence-wave11, 2026-05-18): gate the
      # defaultChannels.qwenPartner entry on attestation-complete
      # rather than hard-failing the helm template. Pre-1.4.10 the
      # chart raised `commercial-contract attestation requires accountId`
      # on every Sovereign that opted in to marketplace
      # (MARKETPLACE_ENABLED=true) without ALSO supplying a signed
      # commercial contract's `LLM_PARTNER_ACCOUNT_ID` /
      # `LLM_PARTNER_CONTRACT_REF` envsubst variables. Post-1.4.10
      # the chart silently skips the qwenPartner channel when
      # attestation is incomplete; once the operator overlay supplies
      # the attestation values the channel composes on the next
      # reconcile.
      # 1.4.12 (PR #1677, 2026-05-18): default
      # `.Values.sandboxTokenSigningKey.reflectorNamespaces` flipped
      # from `"sandbox"` → `"catalyst-system,sandbox"`. Pre-1.4.12 the
      # chart-emitted `newapi-bp-newapi-token-signing-key` Secret was
      # mirrored only into a `sandbox` namespace (which does NOT exist
      # on a stock Sovereign — bp-sandbox installs into
      # `catalyst-system` per slot 19a `targetNamespace`); the sandbox-
      # controller's `NEWAPI_ADMIN_SECRET` env var (secretKeyRef
      # `optional: true`) landed EMPTY, the controller silently dropped
      # into gitops-only mode, and zero per-Sandbox LLM-gateway tokens
      # were ever minted (operator-visible only via the controller's
      # `newapi_admin_secret_set=false` startup log). Caught on t22
      # 2026-05-18 (TBD-D14). Bumping the pin pulls the post-#1677
      # default so reflector mirrors into `catalyst-system` too.
      # 1.4.14 (current main, 2026-05-18): latest upstream-tracking
      # chart cut — includes 1.4.12's reflector fix.
      # 1.4.19 (TBD-A12 #1798, 2026-05-18): add startupProbe so kubelet
      # does NOT SIGKILL the binary at the 50s mark while GORM
      # AutoMigrate is still in-flight on the freshly-provisioned empty
      # `newapi` CNPG database. Pre-1.4.19 the empty DB on t22 sat with
      # ZERO tables after 29 CrashLoopBackOff restarts — every kill
      # raced AutoMigrate's first CREATE TABLE call mid-TLS-handshake;
      # pg_stat_activity on the CNPG primary showed no `newapi` user
      # connections because the kill happened before the GORM
      # connection pool's first wire write completed. Probe budget:
      # 30 × 10s = 5 min, comfortably above the observed 60-120s
      # ceiling on cpx21/cpx31 nodes with sslmode=require.
      # TBD-A39 #1834 (2026-05-19): bp-newapi 1.4.27 replaces the
      # Helm-`lookup`-based DSN Secret render (which raced CNPG on
      # first install and committed an empty password — t32 newapi
      # Pod was 21x CrashLoopBackOff with `password authentication
      # failed for user "newapi"`) with a post-install Job that polls
      # `<cluster>-app` and PATCHes the SQL_DSN bytes. Canonical
      # database-secret-sync-job pattern lifted from
      # platform/gitea/chart/templates/database-secret-sync-job.yaml
      # (issue #830 Bug 2) + platform/wordpress-tenant/chart/templates/
      # database-secret-sync-job.yaml (issue #1786).
      # 1.4.29 (TBD-A52 #1944): default Valkey URL was
      # `valkey.valkey.svc.cluster.local` which is NXDOMAIN — the
      # bp-valkey bitnami chart with architecture=replication exposes
      # `valkey-primary` / `valkey-replicas` / `valkey-headless`, not a
      # plain `valkey` Service. Caused 31× CrashLoopBackOff on t34.
      # bp-newapi 1.4.29 ships the corrected
      # `valkey-primary.valkey.svc.cluster.local` default.
      # 1.4.31 (TBD-V21 #2032, 2026-05-20): extend default
      # `sandboxTokenSigningKey.reflectorNamespaces` to include the
      # `sandbox-.*` regex pattern so emberstack/reflector mirrors the
      # SIGNING_KEY Secret into every per-Sandbox namespace. Paired with
      # bp-sandbox 0.3.2 which mounts SIGNING_KEY as the MCP's
      # `SANDBOX_JWT_SECRET` env (closes auth-gate-stays-in-test-mode
      # silent-breakage).
      # 1.4.33 (TBD-V15 #2021, 2026-05-20): catalyst-newapi-admin-token
      # ExternalSecret target now carries reflector mirror annotations
      # (default to `catalyst-system`) so the rendered Secret is
      # available in the catalyst-api Pod's namespace via secretKeyRef.
      # Companion to bp-catalyst-platform 1.4.225 which adds the
      # secretKeyRef itself + the corrected CATALYST_NEWAPI_ADDR
      # literal (`http://newapi-bp-newapi.newapi.svc.cluster.local:3000`).
      # 1.4.39 — F1a (TBD-V45 follow-up #2115, 2026-05-20): renamed the
      # qwenPartner default channel row's `name` to `qwen` so the row
      # matches the sandbox-controller default AllowedChannels=["qwen"]
      # (envsubst SANDBOX_DEFAULT_CHANNELS:-qwen at slot 19a:197). Pre-
      # fix the per-Sandbox token mint succeeded but /v1/chat/completions
      # returned 404 `channel not found`.
      #
      # 1.4.37 — TBD-V45 (#2115, 2026-05-20): channel-seed Job now
      # also seeds the in-cluster vLLM channel when
      # `defaultChannels.vllm.enabled=true`. The seed gate is now
      # `or qpReady vllmReady` (was `and qp.enabled qpAttReady`),
      # so a fresh Sovereign with vllm-only enabled (no partner
      # commercial contract) still seeds a working Qwen channel.
      # Lockstep with the platform/newapi/chart bump in the same PR.
      #
      # 1.4.41 — chore(privacy): rename the partner-named channel slot
      # to `qwenPartner` and strip partner identifiers from comments /
      # fixtures / Secret names.
      # 1.4.64 — #3373 fix (a): httproute backendRef honors gateway.backendService override.
      # 1.4.67 — #3374: admin-init + SSO-provider seed Job (+ promote CronJob).
      # newapi 0.13.x stored OIDC providers + root user in its DB, not env, so a
      # fresh Sovereign showed the "uninitialized" wizard with no admin. The new
      # DB-direct seed writes the setups row + SSO-only root user + sovereign
      # OIDC provider + promotes the owner to root on first login.
      # 1.4.69 — #3374 admin-tier: stamp managed-by:flux on all 4 hook Jobs so
      # the upgrade's pre-upgrade gate (and post-upgrade seed/channel/db-sync)
      # aren't denied by kyverno flux-managed Enforce → 1.4.68 rolled back to
      # 1.4.66 on hw133, leaving NewAPI uninitialized. Same class as openbao #3434.
      # 1.4.79 — #3374 SSO token-exchange fix: seed.sh upserts
      # options.ServerAddress = https://newapi.<fqdn> so the generic-OAuth
      # token-exchange redirect_uri matches the authorize one; without it the
      # exchange failed `invalid_grant - Incorrect redirect_uri` and the owner
      # never got a session (measured live hw133 2026-06-14, #3475).
      # 1.4.81 — #3482 / Refs #3373 Batch A: newapi→valkey rewire. #3373 Batch A
      # moved bp-valkey INTO the rtz vCluster but MISSED this default-ON
      # consumer; newapi's valkey URL still pointed at the now-NXDOMAIN
      # `valkey-primary.valkey.svc` → FATAL Redis-ping no-such-host →
      # CrashLoopBackOff (live hw133, 10+ restarts). Chart default now targets
      # the syncer-mangled `valkey-primary-x-valkey-x-rtz-vcluster.rtz.svc`
      # (mirrors the Organization VALKEY_ADDR rewire #3476). This slot's valkey block
      # sets no `valkey.url` override, so the chart default IS what newapi uses.
      # 1.4.83 — Refs #3374: NetworkPolicy valkey-egress selector rewire. #3483
      # rewired the connection string to the rtz-synced valkey but LEFT the
      # egress NetworkPolicy rule selecting the now-dead `valkey` namespace, so
      # newapi's egress to valkey:6379 was DENIED → CrashLoop `Redis ping test
      # failed` (keystone #3374 walk, live hw135). The chart now selects the
      # `rtz` namespace (where the synced `valkey-primary-x-valkey-x-rtz-
      # vcluster` Service lives) for the 6379 egress rule. This slot sets no
      # `networkPolicy.egress` override, so the chart default IS what renders.
      # 1.4.89 (#3374): zero-click bridge init page no longer DISCOVERS the
      # authorize endpoint from /api/status (v0.13.2 omits
      # custom_oauth_providers there → it fell through to /login → the SPA
      # bounced to /setup). The chart injects NEWAPI_SSO_AUTHORIZE_URL /
      # NEWAPI_SSO_CLIENT_ID / NEWAPI_SSO_SCOPES so the page redirects
      # deterministically. NOTE: build-bp-newapi-sandbox-bridge.yaml
      # auto-bumps this pin further (-> 1.4.90) when it rebuilds the bridge
      # image on merge, so the slot carries BOTH the env vars AND the new
      # sidecar binary that reads them.
      # 1.4.91 (#3374, 2026-06-15): seed now rollout-restarts NewAPI after the
      # custom-provider upsert so the running pod actually loads the provider
      # (boot-only registry) — fixes the /api/oauth/sovereign "Unknown OAuth
      # provider" callback failure that blocked zero-click SSO on fresh provs.
      # 1.4.93 (#3563, 2026-06-15): idempotent zero-click RE-login — the bare-URL
      # landing page (sandbox-bridge sso_init.go 0.1.17) now checks /api/user/self
      # first (already signed-in → straight to /console) and otherwise clears any
      # stale session via /api/user/logout before re-authenticating, so the
      # callback takes NewAPI's login branch instead of the bind branch that
      # errored "already bound" on every 2nd bare-URL visit (live hw139). NOTE:
      # build-bp-newapi-sandbox-bridge.yaml re-tags the sidecar + may auto-bump
      # this pin further on merge (it rebuilds the bridge that carries this fix).
      # #3648 — lockstep with platform/newapi Chart.yaml + blueprint.yaml 1.4.95.
      # #3374/#3563 — 1.4.97: per-minute CronJob now retries the SSO provider
      # reload until the NewAPI Deployment is restarted (fresh-prov determinism).
      # 1.4.99 (#3687, extends #3370): bootstrap self-registration — the
      # chart renders the canonical apps.openova.io/v1 Application CR for
      # this slot's HelmRelease so the console /apps list, per-app Topology
      # tab + showback resolve newapi (no more "no Application CR").
      # 1.4.102 (#3374, 2026-06-18): bridge landing page (sso_init.go) retries
      # the /api/oauth/state mint (8× / 1.5s backoff) before falling back to
      # /login, so a fresh-prov NewAPI still warming up (DSN-gate + GORM
      # migrate) does not dead-end the first bare-URL visit at /setup (hw159:
      # 1st-hit upstream-connect-error 111, 2nd-hit /setup wizard). Shrinks the
      # human-visible window; the per-minute CronJob (1.4.97) self-heals the
      # underlying convergence race.
      # 1.4.107 (#3374, 2026-06-18): REAL fix for the hw159 1st-hit 111 — the
      # bridge is now a NATIVE sidecar (starts before the DSN gate) behind a
      # dedicated bridge-only Service with publishNotReadyAddresses:true, and
      # the Exact `/` route backendRefs that Service — so the zero-click landing
      # page is REACHABLE on the 1st hit even while `newapi` is NotReady during
      # GORM migrate (a plain-container bridge had its endpoint suppressed by
      # pod-readiness AND-gating → 111 → browser never loaded the page → SPA
      # /setup). The landing page also self-reloads (not /login→/setup) on
      # warm-up retry-exhaustion. The setup wizard stays pre-completed by the
      # admin-sso-seed-job. This slot sets no sandboxBridge/service overrides,
      # so the chart defaults (native sidecar + bridge Service) are what render.
      # 1.4.109 (#3858): seed/promote Job pods no longer carry the workload
      # selector labels, so they stop leaking into the newapi + bridge Service
      # EndpointSlices → no more intermittent "upstream connect error 111".
      # 1.4.111 (#3831, Refs #3642): placement.role render-split. This slot runs
      # placement.role=vcluster-app (stamped via placement.yaml hostBridge.
      # suppress) so ONLY the app workload (Deployment + Service) renders INSIDE
      # vc-mgmt; the CNPG-owner seams render host-side via slot 80a host-seams.
      # database.existingSecret is wired (suppress) to the host-rendered,
      # mirrored-in DSN Secret so the Deployment render-gate resolves at mgmt.
      # 1.4.112: lockstep to the auto-bumped + published upstream-v0.13.2 chart
      # (the auto-bump commit advanced the chart but its Blueprint-Release
      # lockstep step failed, leaving this pin stale at 1.4.111).
      # 1.4.117 (#3858, Refs #3831): the admin-sso-seed Job/CronJob now renders
      # with the APP (renderApp) — this vcluster-app slot is exactly where the
      # seed must run (it polls public.users + rollout-restarts the Deployment,
      # both vcluster-side). Kills the slot-80↔slot-80a circular deadlock. Also
      # absorbs the 1.4.113–1.4.116 deploy-bot upstream-v0.13.2 chart bumps.
      # 1.4.121 (#3948): sql-dsn-gate volume gate symmetry fix.
      # 1.4.122 (#4169): issuer-realm gate on the sovereign-realm newapi-admin
      # AppRegistration (host-side concern; this vcluster-app slot already sets
      # ssoBridgeSync.enabled=false so it never emitted it — pure lockstep bump).
      # 1.4.128 (#4278-followup): DSN-placeholder Secret self-preserves SQL_DSN
      # across re-renders (lookup + resource-policy:keep) so a failed post-hook
      # no longer empties it → kills the wait-for-sql-dsn Init:CrashLoopBackOff.
      # vcluster-app slot (cnpg.enabled=false) renders no CNPG/DSN secret — pure
      # lockstep bump.
      # 1.4.130 — #4347: channel-seed hook Job curl image harbor-proxied so it
      #   clears the host-ns Kyverno harbor-proxy-pull Enforce policy on every
      #   reconcile (post-#4325). Refs #4347 #4325.
      # 1.4.134 — #4477: admin-promote CronJob self-heals a stale OIDC provider
      #   client_secret (resync_provider_secret) so a KC client-secret rotation
      #   no longer wedges newapi token-exchange ("Failed to get token").
      # 1.4.136 — #4477 secondary: catalyst-newapi-admin-token ExternalSecret
      #   remoteRef.key → catalyst/newapi/admin-token (the path catalyst-api's
      #   seedNewapiAdminToken seam writes); fixes the SecretSyncedError that
      #   left unified-rbac's admin-API calls 401'd on a fresh prov.
      # 1.4.141 — #5374 (UAT row 238): chart-owned per-Org CNPG Cluster
      #   resources requests==limits (500m/512Mi) → the postgres instance
      #   pod runs Guaranteed QoS (was Burstable, live on hw288 beta-corp).
      # 1.4.143 — #5375 (UAT M2): region-local admin-token PushSecret seeds
      #   catalyst/newapi/admin-token from the local bridge ADMIN_SECRET so the
      #   ExternalSecret above resolves in region-B too (catalyst-api's #4477
      #   seed is primary-only; each region runs its own OpenBao). Pairs with
      #   bp-openbao 1.2.64 (external-secrets-push policy).
      version: 1.4.146
      sourceRef:
        kind: HelmRepository
        name: bp-newapi
        namespace: flux-system
  # Event-driven install per docs/INVIOLABLE-PRINCIPLES.md #3 (Flux
  # dependsOn is the gate, not Helm timeout). NewAPI itself starts in
  # ~10 s once the Postgres DSN Secret is present; the long pole is
  # waiting for the operator's Crossplane claim to materialise the DB.
  install:
    createNamespace: true  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    timeout: 15m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
  # Per-Sovereign overrides — the operator MUST supply at install time:
  #   - ingress.host           = api.${SOVEREIGN_FQDN}
  #   - ingress.adminHost      = admin.${SOVEREIGN_FQDN}
  #   - auth.adminUI.keycloak.issuer = https://auth.${SOVEREIGN_FQDN}/realms/sovereign (#3374)
  #   - database.existingSecret      = Postgres DSN Secret (from the
  #                                    Crossplane PostgresqlInstance claim)
  #   - credentials.existingSecret   = SESSION_SECRET + CRYPTO_SECRET
  #                                    (rotated via OpenBao)
  #   - catalystIntegration.externalSecret.remoteRef.key
  #                                  = catalyst/newapi/admin-token
  #     (cluster-shared; written by catalyst-api's seedNewapiAdminToken
  #      seam under the writable `secret/catalyst/*` subtree — #4477)
  #   - defaultChannels.vllm.enabled = true (first-otech)
  #   - defaultChannels.vllm.endpoint
  #     + defaultChannels.vllm.attestation.owner
  #
  # Defaults below wire the first-otech provider channel to the
  # operator-supplied customer-managed LLM partner endpoint (Qwen3-
  # family model, `qwen3-coder`); the operator overlay overrides any of
  # these by setting them in this HelmRelease's spec.values.
  values:
    # #4885 / #4892: global.imageRegistry override seam for the step-07 cutover
    # image-registry pivot (imageRegistryPivot.additionalHRs). step-07 patches
    # this HR's spec.values.global.imageRegistry live AND durably sed-edits THIS
    # file — the sed matches `^      imageRegistry:`, so the 6-space indent is
    # REQUIRED. Empty default = verbatim ghcr.io (byte-identical pre-cutover).
    global:
      imageRegistry: ''
    database:
      # #4291 DE-VCLUSTER — newapi OWNS its CNPG natively in host ns `newapi`
      # (cnpg.enabled below), and the chart's own DSN-sync Job writes exactly
      # this `<release>-newapi-db-dsn` Secret, so the app reads its native DSN.
      existingSecret: newapi-bp-newapi-newapi-db-dsn
    placement:
      # #4291 DE-VCLUSTER — `all` (chart DEFAULT) renders EVERYTHING natively in
      # the host `newapi` ns: Deployment + Service + HTTPRoute + CNPG Cluster +
      # DSN-sync + admin-sso-seed + AppRegistration + ExternalSecrets. The
      # #3831 vcluster-app/host-seams render-split COLLAPSES (slot 80a retired).
      role: all
    # ── Bootstrap self-registration (#3687, extends #3370) ──────────────
    # The chart self-registers the Application CR for newapi (the canonical
    # instance representation every console surface reads), marked
    # spec.bootstrap=true so the application-controller ADOPTS this HR's
    # install instead of re-rendering it (zero duplicate HRs).
    bootstrapOwned:
      enabled: true
      helmRelease:
        name: bp-newapi
        namespace: flux-system
    sovereignFQDN: ${SOVEREIGN_FQDN}
    # G87 #2634: multi-region CNPG instances default (1 single-region, 2 multi).
    # #2840-followup (2026-06-03): bp-newapi chart reads
    # `.Values.cnpg.cluster.instances` (templates/cnpg-cluster.yaml:67)
    # NOT `.Values.postgres.cluster.instances`. Pre-fix, the
    # `postgres.cluster.instances` value was set correctly to 2 but
    # silently ignored by the chart → CNPG cluster stayed at instances=1
    # on multi-region Sovereigns despite the substitute firing. Caught
    # live on hw86 2026-06-03 after the SOVEREIGN_CNPG_INSTANCES
    # Kustomization-substitute fix verified 4 of 6 CNPG clusters bumped.
    # Mirror the chart's value path. (Same shape if a future slot
    # chart also reads cnpg.cluster.instances — track separately.)
    cnpg:
      enabled: true  # #4291 DE-VCLUSTER — newapi renders its OWN CNPG Cluster natively in host ns `newapi` (host cnpg-operator reconciles it; was suppressed by the #3831 host-bridge render-split)
      cluster:
        instances: ${SOVEREIGN_CNPG_INSTANCES:=1}
    postgres:
      cluster:
        instances: ${SOVEREIGN_CNPG_INSTANCES:=1}
    ingress:
      host: api.${SOVEREIGN_FQDN}
      # Wave 5.81 (#2412): adminHost dropped — ops-staff admin via
      # console.${SOVEREIGN_FQDN}/bss/* (BSS menu) per founder
      # ruling 2026-05-18.
      tls:
        enabled: true
        issuer: letsencrypt-prod
      # Cilium Gateway HTTPRoute for `newapi.<fqdn>` (TBD-D35d, issue
      # #1778). Sandbox runtimes hit the LLM gateway at the URL the
      # sandbox controller mints into their environment
      # (`NEWAPI_BASE_URL=https://newapi.${SOVEREIGN_FQDN}/v1`). Without
      # this HTTPRoute the marketplace `tenant-wildcard` (hostnames=
      # `*.${SOVEREIGN_FQDN}`) absorbs every newapi.${SOVEREIGN_FQDN}
      # request and forwards to the storefront `console` Service —
      # blocking the entire BYOS Claude Code journey at the LLM gate.
      # An exact-hostname HTTPRoute outranks the wildcard per Gateway
      # API spec, so enabling this on every Sovereign restores LLM
      # reachability without touching the marketplace wildcard.
      httpRoute:
        enabled: true  # #4291 DE-VCLUSTER — newapi renders its OWN HTTPRoute natively in host ns `newapi` (was suppressed by the #3831 host-bridge; the public front door was the host-bridge route)
        host: newapi.${SOVEREIGN_FQDN}
    auth:
      adminUI:
        mode: keycloak
        keycloak:
          ssoBridgeSync:
            enabled: true  # #4291 DE-VCLUSTER — newapi renders its OWN SSO AppRegistration ConfigMap + oidc-sync ExternalSecret natively in host ns `newapi` (host bp-sso-bridge + ESO reconcile them; was suppressed by the #3831 host-bridge render-split)
          # #3374: was realms/ops — a realm that does not exist on any
          # Sovereign (bp-keycloak imports only `sovereign` + per-Org
          # realms; measured live on hw130 2026-06-13). The sovereign
          # realm is where sovereign-admins live and where bp-sso-bridge
          # mints the newapi-admin client (chart sso-app-registration).
          issuer: https://auth.${SOVEREIGN_FQDN}/realms/sovereign
          clientId: newapi-admin
          existingSecret: newapi-oidc
      customerAPI:
        keyIssuer: catalyst
    catalystIntegration:
      enabled: true
      existingSecret: catalyst-newapi-admin-token
      externalSecret:
        enabled: true  # #4291 DE-VCLUSTER — newapi renders its OWN catalyst-newapi-admin-token ExternalSecret natively in host ns `newapi` (host ESO reconciles it; was suppressed by the #3831 host-bridge render-split)
        refreshInterval: "1h"
        secretStoreRef:
          kind: ClusterSecretStore
          name: vault-region1
        remoteRef:
          # OpenBao path WRITTEN by catalyst-api's seedNewapiAdminToken seam
          # (#4477). Under the `vault-region1` store's `secret/` mount the
          # full path is `secret/catalyst/newapi/admin-token`. The
          # `catalyst/` prefix is the ONLY sub-tree a Sovereign's
          # catalyst-api can write (its `catalyst-api-write` OpenBao role is
          # scoped to `secret/{data,metadata}/catalyst/*`; a write to
          # `secret/sovereign/*` 403s), so the producer + read-path share
          # this prefix in lock-step — identical pattern to the anthropic /
          # mcp-bearer seeds. The seed propagates NewAPI's bridge
          # ADMIN_SECRET verbatim so this token MATCHES what the
          # sandbox-bridge validates. Cluster-shared (one path serves the
          # whole Sovereign's unified-rbac), so ${SOVEREIGN_FQDN} is no
          # longer in the path.
          key: catalyst/newapi/admin-token
          property: ADMIN_API_TOKEN
    # Default channels — chart-side composition (channel #1 first).
    #
    # `qwenPartner` (issue #915) is the canonical first channel: a Qwen3-
    # family model (`qwen3-coder` / alias `qwen3.6`) hosted at an operator-
    # supplied customer-managed LLM partner endpoint. Disabled in the
    # template so a fresh Sovereign does not silently wire customers to a
    # third-party endpoint; per-Sovereign overlays
    # (clusters/<sovereign>/bootstrap-kit/80-newapi.yaml) enable this
    # block and supply:
    #   - defaultChannels.qwenPartner.enabled = true
    #   - defaultChannels.qwenPartner.endpoint = <partner-supplied URL>
    #   - defaultChannels.qwenPartner.attestation.accountId   (legal-team-owned)
    #   - defaultChannels.qwenPartner.attestation.contractRef (legal-team-owned)
    #   - the Secret `newapi-channel-qwen-partner` containing the
    #     upstream API key under key `API_KEY` (or an ExternalSecret
    #     pulling from OpenBao at
    #     `sovereign/<sovereign-fqdn>/newapi/channel-qwen-partner`)
    #   - auth.adminUI.masterKeySecret = name of a Secret carrying
    #     `MASTER_KEY` (NewAPI bootstrap admin auth) — required for
    #     the channel-seed Helm hook Job to POST against the admin API
    #     ONCE at install time. Operator may rotate the master key out
    #     post-bootstrap; channels persist in Postgres.
    #
    # When the operator flips `qwenPartner.enabled: true`, the
    # chart's post-install/post-upgrade `channel-seed` Job probes
    # NewAPI's admin API (`/api/channel/?keyword=<name>`) and POSTs
    # the channel definition idempotently. Re-runs after upgrades
    # are no-ops once the channel exists.
    #
    # The legacy `vllm` slot (in-cluster vLLM fallback) remains for
    # operators that run their own bp-vllm + open-weight model in-
    # cluster; it composes after `qwenPartner` and any operator
    # `.Values.channels`.
    # Sandbox Wave 4 (2026-05-18, retry of sandbox-wave4-newapi-sovereign-install):
    # qwenPartner is now gated on `${MARKETPLACE_ENABLED:-false}` — the
    # same envsubst variable bp-catalyst-platform (slot 13) reads to flip
    # marketplace.enabled on the Catalyst control plane. This lets a
    # franchised Sovereign with `MARKETPLACE_ENABLED=true` auto-seed the
    # default partner-hosted Qwen channel without the operator having to
    # supply per-Sovereign overlay values. The endpoint is supplied by
    # `LLM_PARTNER_BASE_URL` (operator-supplied, defaults empty —
    # commercial-contract attestation gate prevents render until set).
    # The upstream API key MUST be present in the Secret
    # `newapi-channel-qwen-partner` under key `API_KEY` — either pre-
    # seeded by cloud-init or pulled from OpenBao via the operator's
    # ExternalSecret at path
    # `sovereign/<fqdn>/newapi/channel-qwen-partner`. Sandbox agents
    # (sandbox-wave4) depend on this channel being live on every Sovereign
    # that opted in to marketplace; without it the agents fall back to
    # mothership newapi, defeating the per-Sovereign sandboxing.
    defaultChannels:
      qwenPartner:
        enabled: ${MARKETPLACE_ENABLED:-false}
        # F1a fix (2026-05-20, TBD-V45 follow-up #2115): row name MUST be
        # `qwen` so it matches the sandbox-controller default
        # AllowedChannels=["qwen"] (envsubst SANDBOX_DEFAULT_CHANNELS:-qwen
        # at clusters/_template/bootstrap-kit/19a-bp-sandbox.yaml:197).
        # Pre-fix: a partner-suffixed row name → per-Sandbox token mint
        # succeeded but /v1/chat/completions returned 404 `channel not
        # found` because the channel-router only matches rows whose `name`
        # is in the token's allowed_channels set.
        name: qwen
        # Operator-supplied — see docs/RUNBOOKS.md §Operator-setup for
        # the canonical Kubernetes Secret schema. Default empty; the
        # chart's `assertChannelAttestation` gate refuses to render the
        # channel until the operator supplies an endpoint + commercial-
        # contract attestation in the per-Sovereign overlay.
        endpoint: ${LLM_PARTNER_BASE_URL:-}
        models:
          - qwen3.6
          - qwen3-coder
        existingSecret: newapi-channel-qwen-partner
        existingSecretKey: API_KEY
        attestation:
          kind: commercial-contract
          accountId: ${LLM_PARTNER_ACCOUNT_ID:-}
          contractRef: ${LLM_PARTNER_CONTRACT_REF:-}
      # TBD-V45 (#2115, 2026-05-20): wired the in-cluster vLLM channel
      # default-ON. Paired with bootstrap-kit slot 39 (bp-vllm) which
      # installs vLLM in-cluster as `vllm-bp-vllm.vllm.svc.cluster.local
      # :8000` serving Qwen2.5-Coder-1.5B-Instruct on CPU by default.
      # This pair gives every fresh Sovereign a zero-cost, no-third-
      # party-contract Qwen channel out of the box — closes the
      # canonical-DoD gap that the only seedable channel was triple-
      # gated on a partner commercial contract.
      #
      # Lockstep with slot 39's `enabled: ${SOVEREIGN_VLLM_ENABLED:-true}`:
      # if the operator opts-OUT of the in-cluster vLLM Deployment
      # (resource-constrained Sovereigns / those bringing a commercial
      # Qwen contract), this channel also opts-OUT — the chart's
      # channel-seed Job suppresses the vLLM POST and the customer-
      # facing channel-router never tries to dial a dead Service.
      #
      # Attestation kind: `in-cluster` — operator owns BOTH the model
      # weights (Apache-2.0 Qwen2.5-Coder, public) and the inference
      # hardware (the Sovereign cluster). No commercial-contract
      # attestation required (no accountId / contractRef).
      vllm:
        # DEFAULT OFF (2026-05-20): canonical Qwen channel is qwenPartner
        # (operator-supplied partner-hosted endpoint). In-cluster vLLM
        # channel is an opt-in fallback. Lockstep with slot 39's enabled
        # default.
        enabled: ${SOVEREIGN_VLLM_ENABLED:-false}
        # Customer-visible channel name. `qwen` matches the canonical
        # sandbox-controller default (`SANDBOX_DEFAULT_CHANNELS=qwen`
        # in slot 19a-bp-sandbox.yaml) so per-Sandbox token mints land
        # on this channel by default — closing the qwen-code → vLLM
        # path end-to-end on a fresh Sovereign with no overlay.
        name: qwen
        # In-cluster Service FQDN of the bp-vllm chart. The chart's
        # Service name resolves to `<release>-<chart>` = `vllm-bp-vllm`
        # (release "vllm" + chart "bp-vllm" per the chart's
        # _helpers.tpl fullname template), and slot 39's HR sets
        # targetNamespace=vllm + releaseName=vllm. Port 8000 matches
        # the chart's service.port.
        # #4325 de-vcluster re-homed bp-vllm to the native HOST namespace
        # `vllm` (placement.yaml slot 39 → vcluster: host); the rtz plane
        # vCluster + its syncer-mangled `vllm-bp-vllm-x-vllm-x-rtz-vcluster.rtz`
        # are gone, so the vLLM Service is the plain host-ns name. This channel
        # is default-OFF (lockstep ${SOVEREIGN_VLLM_ENABLED:-false} with slot
        # 39) — this endpoint applies only when an operator opts in.
        endpoint: "http://vllm-bp-vllm.vllm.svc.cluster.local:8000/v1"
        models:
          - qwen3-coder
          # Underlying upstream model id served by the bp-vllm chart's
          # default `vllm.model` (Qwen/Qwen2.5-Coder-1.5B-Instruct).
          # vLLM exposes the model under its bare HF id; the customer-
          # facing `qwen3-coder` alias maps via the channel-router so
          # callers can use either string interchangeably.
          - Qwen/Qwen2.5-Coder-1.5B-Instruct
        attestation:
          kind: in-cluster
          owner: ${SOVEREIGN_FQDN}
