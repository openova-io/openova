# bp-rtz-vcluster — Catalyst bootstrap-kit Blueprint slot 59.
#
# Per-secondary-region RTZ vCluster — installed ONLY on secondary
# regions. Hosts regional tenant workloads + caches.
#
# Per docs/SOVEREIGN-MULTI-REGION-DOD.md A4 (vCluster topology):
#   primary    region → MGMT  + DMZ  vCluster (slot 58 + slot 54)
#   secondary  region → DMZ   + RTZ  vCluster (slot 54 + this slot)
#
# Cross-vCluster intra-region traffic between RTZ and DMZ stays
# inside the host k3s via Cilium endpoint identity routing. Cross-
# region traffic (RTZ secondary ↔ MGMT primary) goes through the DMZ
# WireGuard hop per DoD A2.
#
# Wrapper chart: platform/bp-rtz-vcluster/chart/
#   Bundles loft-sh/vcluster 0.20.0 as a Helm subchart.
#
# Reconciled by: Flux on every secondary region's k3s control plane.
#
# dependsOn:
#   - bp-cilium       — CNI + Gateway API
#   - bp-cert-manager — TLS for ClusterIssuers
#
# Per-role gating: defaults to DISABLED (rtzVcluster.enabled=false).
# The Sovereign-provisioning tofu module (infra/hetzner/main.tf
# secondary-CP block) flips this to "true" via postBuild.substitute
# on secondary regions only — pending the follow-up substitute PR
# (which adds RTZ_VCLUSTER_ENABLED to the substitute block). Until
# that lands, operators opt in per-Sovereign overlay by patching
# `values.rtzVcluster.enabled: true` on secondary clusters'
# bootstrap-kit slot.

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-rtz-vcluster
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-rtz-vcluster
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "59"
    catalyst.openova.io/vcluster-role: rtz
    catalyst.openova.io/topology: dod-a4
spec:
  interval: 15m
  releaseName: rtz-vcluster
  targetNamespace: rtz
  dependsOn:
    - name: bp-cilium
    - name: bp-cert-manager
  chart:
    spec:
      chart: bp-rtz-vcluster
      # 0.2.6 (#2940 Pillar 5): registry host driven by global.registryMirror
      # + the ${REGISTRY_MIRROR:=harbor.openova.io} subchart substitution below.
      # 0.2.7 (#3373 fix (b)): toHost customResources sync gains HTTPRoute + ExternalSecret.
      # 0.2.8 (#3380-D): k8s distro control-plane images pinned off
      # registry.k8s.io onto Harbor proxy-k8s (harbor-proxy-pull Enforce).
      # 0.2.9 (#3373 Batch A): `sme` carve-out in allowedIngressNamespaces
      # so SME services reach the now-rtz-vCluster bp-valkey synced Service.
      # 0.2.10 (#3373 Batch A): gitea/harbor/catalyst-system/mgmt/velero carve-outs
      # in allowedIngressNamespaces so seaweedfs S3 consumers reach the now-rtz-vCluster synced Service.
      # 0.2.11 (#3373 Batch A): `newapi` carve-out in allowedIngressNamespaces
      # so the LLM gateway reaches the now-rtz-vCluster bp-vllm synced Service.
      # 0.2.12 (#3642 #3736): vcluster subchart 0.21.0 → 0.23.0 LOCKSTEP with
      # bp-mgmt-vcluster + bp-dmz-vcluster (sibling tag parity). The active
      # fromHost.secrets mappings live in bp-mgmt-vcluster; RTZ takes the
      # version bump only.
      # 0.2.13 (#3859): add `org-services` to the valkey isolation allow-list
      # (was only `sme`; the BSS tier was renamed to org-services) — unblocks
      # auth/billing/domain/notification → valkey, the #3376 funnel.
      version: 0.2.13
      sourceRef:
        kind: HelmRepository
        name: bp-rtz-vcluster
        namespace: flux-system
  install:
    timeout: 15m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
  values:
    # #2940 Pillar 5 anti-tether — single source of truth for the registry
    # host the umbrella image guard composes. `${REGISTRY_MIRROR:=harbor.openova.io}`
    # keeps bootstrap on the mothership Harbor; a per-Sovereign overlay (or
    # the bp-self-sovereign-cutover Step-04 pivot) flips it in one place.
    global:
      registryMirror: ${REGISTRY_MIRROR:=harbor.openova.io}
    rtzVcluster:
      # Refs #2537 G9 (2026-05-28): drop the RTZ_VCLUSTER_ENABLED
      # substitute (never landed — same fate as MGMT). Symmetric
      # topology — every region renders MGMT+RTZ+DMZ.
      enabled: true
      hostNamespace: rtz
      vclusterName: rtz
      role: secondary
      nodeSelector:
        regionLabelKey: openova.io/region
        regionLabelValue: ${SOVEREIGN_REGION_CANONICAL_LABEL}
    vcluster:
      controlPlane:
        statefulSet:
          # #2940 Pillar 5: the ACTUAL syncer image registry — single
          # overlay knob for the subchart literal (can't self-template).
          image:
            registry: ${REGISTRY_MIRROR:=harbor.openova.io}
          scheduling:
            nodeSelector:
              openova.io/region: ${SOVEREIGN_REGION_CANONICAL_LABEL}
