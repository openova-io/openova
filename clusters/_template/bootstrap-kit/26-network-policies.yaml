# bp-network-policies — Catalyst bootstrap-kit Blueprint #26
# (W2.K3, Tier 7 — Security/Policy library, zero-trust baseline).
#
# G101 (Refs #2650, 2026-06-01): bp-network-policies was NEVER in
# bootstrap-kit. Chart existed but no Sovereign installed it → ZERO
# zero-trust enforcement on every fresh prov → live finding on hw86:
# only 4 CiliumNetworkPolicies across the entire cluster (catalyst-
# system / external-dns / kube-system / valkey) and ZERO
# CiliumClusterwideNetworkPolicies. Every namespace was implicit-allow
# → A5 (zero-trust default-deny) violated on every Sovereign since
# Sovereign shipped. This slot installs the chart by default so every
# fresh prov has zero-trust from boot.
#
# Reconciled by: Flux on the new Sovereign's k3s control plane, AFTER
# bp-cilium (slot 01) installs the cilium.io CRDs the
# CiliumClusterwideNetworkPolicy template targets.
#
# Ordering: slot 26 runs after slot 01 (bp-cilium). Cross-kind
# dependsOn (HelmRelease → Kustomization) is silently ignored per
# docs/INVIOLABLE-PRINCIPLES.md #14, so the same-kind HR→HR dependsOn
# below is the load-bearing signal; the Kustomization slot ordering is
# the belt-and-suspenders.
#
# Wrapper chart: platform/network-policies/chart/ (pure overlay; no
# upstream subchart — CRDs come from bp-cilium's upstream Cilium chart).

# NOTE: the `catalyst-system` Namespace is declared ONCE by slot 13
# (13-bp-catalyst-platform.yaml) — NOT re-declared here. When this slot was
# first registered in kustomization.yaml (#3188), a duplicate Namespace doc
# here failed the kustomize build ("may not add resource with an already
# registered id: Namespace/catalyst-system"). Slot 13 runs before slot 26,
# so the namespace already exists by the time this HR's targetNamespace is
# resolved. Removing the duplicate is the canonical de-dup (kustomize owns
# resource-id uniqueness across the merged set).
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-network-policies
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  # ghcr-pull authenticates the OCI pull — bp-network-policies is a PRIVATE
  # ghcr package (like every other bp-* chart). Without this secretRef Flux
  # falls back to anonymous auth → 401 Unauthorized → the chart never pulls →
  # the bootstrap-kit Kustomization wedges its health-wait on this one HR and
  # never advances to newer revisions. Mirrors slots 13/16b. Refs #3188.
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-network-policies
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "26"
spec:
  interval: 15m
  releaseName: network-policies
  targetNamespace: catalyst-system
  dependsOn:
    - name: bp-cilium
  chart:
    spec:
      chart: bp-network-policies
      # 1.0.3 (G101 Refs #2650, 2026-06-01): default-deny flipped to
      # mandatory-on; allowSystemNamespaces expanded to 45 control-
      # plane namespaces covering every bootstrap-kit targetNamespace
      # plus the 3 vCluster syncer namespaces.
      # 1.0.4 (Refs #3188, 2026-06-10): allow-system-namespaces now uses
      # the reserved entity `all` (was a bare `{}` rule that didn't cover
      # kube-apiserver/host/world) — fixes control-plane Pods losing the
      # apiserver under default-deny. See the `enabled: false` gate below.
      version: 1.0.4
      sourceRef:
        kind: HelmRepository
        name: bp-network-policies
        namespace: flux-system
  # enabled: false — install the chart (so the HR/HelmChart resolves and
  # the bootstrap-kit Kustomization reaches Ready) but render ZERO Cilium
  # policies. Validated on live hw124 (2026-06-10): the 1.0.4 `all`-entity
  # fix restores kyverno→apiserver under default-deny, BUT the default-deny
  # still 403s the console ingress path — so the zero-trust posture is not
  # yet safe to enforce cluster-wide. Re-enabling (enabled: true) is gated
  # on a dedicated validation prov proving EVERY ingress/egress path
  # (console, marketplace, SSO, tenant Orgs) survives default-deny. Until
  # then this stays off so no fresh prov is severed. Refs #3188.
  values:
    enabled: false
  install:
    timeout: 5m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 5m
    disableWait: true
    remediation:
      retries: 3
