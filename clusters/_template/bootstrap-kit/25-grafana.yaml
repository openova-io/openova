# bp-grafana — Catalyst Blueprint #25 (W2.K2 Observability batch).
# Grafana — visualization layer of the LGTM stack. Pairs with bp-loki
# (logs), bp-mimir (metrics), bp-tempo (traces); CNPG-backed Postgres
# for dashboard/folder/alert state; Keycloak OIDC for SSO.
#
# Wrapper chart:  platform/grafana/chart/
# Reconciled by:  Flux on the new Sovereign's k3s control plane, AFTER
#                 bp-cnpg, bp-loki, bp-mimir, bp-tempo, bp-keycloak are
#                 all Ready.
#
# dependsOn:
#   - bp-cnpg (slot 16)         — Postgres backend for Grafana state.
#   - bp-loki (slot 22)         — datasource for logs.
#   - bp-mimir (slot 23)        — datasource for metrics.
#   - bp-tempo (slot 24)        — datasource for traces.
#   - bp-keycloak (slot 09)     — OIDC IdP for SSO.
#   - bp-postgres-shared-b (16c) — shared-instance hub Secret (#3188).
#
# disableWait: Grafana waits for its CNPG-managed `grafana-app` Secret
# (synthesised by bp-cnpg via the chart's Cluster CR), and for upstream
# datasource endpoints to answer. Helm `--wait` would block on the
# Deployment rollout, which the HelmRelease cannot influence; runtime
# convergence is observed via kubectl rollout status.

---
apiVersion: v1
kind: Namespace
metadata:
  name: grafana
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-grafana
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-grafana
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "25"
spec:
  interval: 15m
  timeout: 15m
  releaseName: grafana
  targetNamespace: grafana
  dependsOn:
    - name: bp-cnpg
    # #2745 (2026-06-12): bp-loki/bp-mimir/bp-tempo HRs re-homed to host
    # ns `mgmt` (mgmt vCluster placement). A bare `name:` resolves in
    # THIS HR's namespace (flux-system) → dangling dep → grafana wedges
    # forever (#3191 shape). Cross-ns dependsOn requires explicit
    # `namespace:`.
    - name: bp-loki
      namespace: mgmt
    - name: bp-mimir
      namespace: mgmt
    - name: bp-tempo
      namespace: mgmt
    # G92.2 #2661 (2026-06-01): bp-keycloak HR moved to host ns `mgmt`.
    - name: bp-keycloak
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    # bp-gateway-api (issue #503): chart ships an HTTPRoute template;
    # gateway.networking.k8s.io/v1 CRDs must be registered first.
    - name: bp-gateway-api
    # bp-postgres-shared-b (#3188 three-instance model): when grafana
    # SHARES the shared-pg-b instance, gate on it so the grafana Database
    # + role + reflector-pushed `grafana-database-env` hub Secret exist
    # before grafana's Deployment references them. Harmless in the
    # default path — bp-postgres-shared-b is an empty Ready release
    # within seconds of bp-cnpg + bp-reflector (same unconditional-edge
    # shape as bp-gitea/bp-harbor → bp-postgres-shared).
    - name: bp-postgres-shared-b
  chart:
    spec:
      chart: bp-grafana
      # 1.0.9 (2026-06-12, founder): zero-click from the app ROOT —
      # oauth_auto_login + generic_oauth.auto_login flipped true.
      # 1.0.10 (founder NS-3 #3263, 2026-06-12): sovereign-admins →
      # GrafanaAdmin (server admin) + allow_assign_grafana_admin=true, so
      # the owner — seeded into sovereign-admins by bp-keycloak 1.4.24 —
      # gets the full Administration nav, not org-Viewer.
      # 1.0.11 (#2745, 2026-06-12): loki/mimir/tempo re-homed into the
      # mgmt vCluster — datasource URLs re-pointed at the syncer-mangled
      # host-side Service names (<svc>-x-<ns>-x-mgmt-vcluster.mgmt.svc).
      version: 1.0.12
      sourceRef:
        kind: HelmRepository
        name: bp-grafana
        namespace: flux-system
  install:
    timeout: 15m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
  # Per-Sovereign overrides — issue #387:
  # Wire the per-Sovereign hostname into the HTTPRoute template
  # (platform/grafana/chart/templates/httproute.yaml). The HTTPRoute
  # attaches to cilium-gateway/kube-system installed by 01-cilium.yaml.
  values:
    gateway:
      host: grafana.${SOVEREIGN_FQDN}
    # G91.grafana (#2658) — wire bp-sso-bridge framework. The chart-side
    # grafana.ini.auth.generic_oauth block computes auth_url / token_url /
    # api_url from sovereignFqdn. Without this envsubst, the Grafana
    # sign-in OAuth attempt errors with empty URLs (clear behaviour, not
    # half-config); with the envsubst SSO works zero-touch on every
    # fresh Sovereign.
    sso:
      sovereignFqdn: ${SOVEREIGN_FQDN}
    # ── Shared-instance flip (#3188 three-instance model) ───────────────
    # The upstream grafana subchart appends this envFrom secretRef to the
    # Deployment. The hub Secret `grafana-database-env` (slot 16c, chart
    # bp-postgres 0.1.5) carries grafana's NATIVE env contract —
    # GF_DATABASE_TYPE/HOST/NAME/USER (reflect.extraData) + the minted
    # GF_DATABASE_PASSWORD (passwordAliases) — and per grafana's config
    # precedence env vars override grafana.ini, so injecting it flips
    # grafana from its sqlite default to the shared-pg-b `grafana`
    # database with ZERO grafana.ini churn. Grafana migrates its own
    # schema on first boot.
    #
    # The `optional` seam is the safety: cloud-init computes it from the
    # SAME enable_shared_pg var as the 16a/16c/16d gates (one-flag
    # contract). Default optional=true → the Secret never exists on a
    # non-sharing prov and the stanza is provably inert (a secretRef
    # marked optional on an absent Secret injects nothing). Shared mode
    # optional=false → kubelet hard-gates the Pod (CreateContainer-
    # ConfigError, auto-retried) until reflector pushes the Secret, so
    # grafana can NEVER silently start on sqlite while the binding is
    # live — the race documented in feedback_netpol_carveouts / #3283 is
    # closed by construction. envFromSecrets (plural) is used because
    # envFromSecret (singular) already carries the SSO credentials.
    grafana:
      envFromSecrets:
        - name: grafana-database-env
          optional: ${SOVEREIGN_GRAFANA_DB_SECRET_OPTIONAL:=true}
