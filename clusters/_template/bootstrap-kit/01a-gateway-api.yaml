# bp-gateway-api — Catalyst bootstrap-kit Blueprint, slot 01a (between
# bp-cilium and every chart that ships HTTPRoute templates). Installs the
# upstream Kubernetes Gateway API CRDs (Standard channel — gatewayclasses,
# gateways, httproutes, grpcroutes, referencegrants).
#
# Why this Blueprint exists (issue #503):
#
#   Cilium 1.16's chart `gatewayAPI.enabled=true` flag (set in
#   platform/cilium/chart/values.yaml) wires up the cilium gateway
#   controller and creates the `cilium` GatewayClass — but it does NOT
#   install the gateway.networking.k8s.io CRDs themselves. Without those
#   CRDs registered on the apiserver, every chart that references
#   HTTPRoute / Gateway / GatewayClass resources fails install with:
#
#     no matches for kind "HTTPRoute" in version "gateway.networking.k8s.io/v1"
#
#   Phase-8a-preflight live deployment otech10 (e1a0cd6662872fcb,
#   2026-05-01) hit exactly this: bp-harbor, bp-openbao, bp-powerdns
#   reconciled to InstallFailed with the message above; the fix is to
#   install the upstream Gateway API CRDs ahead of any chart that uses
#   them. Same pattern as bp-crossplane-claims and
#   bp-external-secrets-stores — split CRD install from CR application
#   so Flux dependsOn can order them.
#
# Wrapper chart: platform/gateway-api/chart/
# Reconciled by: Flux on the new Sovereign's k3s control plane.
#
# G65 #2614 (2026-05-31): dependsOn REVERSED — bp-cilium now
# dependsOn bp-gateway-api (this Blueprint), not the other way around.
# RCA hw72 9d4a5b629fcc38bb (2026-05-30): Cilium operator at slot 01
# starts with `enable-gateway-api=true` config; if gateway-api CRDs
# don't yet exist on the apiserver at that moment, the operator
# SILENTLY skips registering its gateway-controller subsystem and
# never re-discovers them after they land. Result: GatewayClass
# ACCEPTED=Unknown ("Waiting for controller") + Gateway PROGRAMMED=
# Unknown FOREVER. No sovereign-wildcard cert mints, handover never
# fires. Proven on hw72 by `kubectl delete pod cilium-operator-*` —
# new operator pod with CRDs already present came up with
# gateway-controller subsys live → GatewayClass=True + Gateway
# PROGRAMMED=True in 5sec → all HTTPRoutes reconciled.
#
# The fix is structural: CRDs install FIRST (this slot, no deps),
# THEN Cilium operator starts with CRDs already registered. The old
# claim "sequencing CRDs after the CNI ensures pod network for the
# CRD apply" was wrong — CRD apply is a control-plane operation that
# doesn't need pod-network connectivity to flux-system.
#
# Same META-AUDIT 11 class as bp-kyverno-vs-bp-kyverno-policies CRD
# race (issue #2019): operators that read `enable-X-controller=true`
# at startup MUST be ordered AFTER the X-CRD installer.

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-gateway-api
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-gateway-api
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "01a"
spec:
  interval: 15m
  releaseName: gateway-api
  # CRDs are cluster-scoped; targetNamespace is just where the Helm
  # release marker Secret lives. Using flux-system keeps the marker
  # next to every other bootstrap-kit release.
  targetNamespace: flux-system
  # G65 #2614: NO dependsOn — this Blueprint installs the gateway-api
  # CRD schema and must reconcile FIRST so bp-cilium's operator sees
  # the CRDs at startup. See top-of-file comment for full RCA.
  chart:
    spec:
      chart: bp-gateway-api
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: bp-gateway-api
        namespace: flux-system
  # Event-driven install: 5 CRDs apply in a single pass; nothing to wait
  # for beyond apiserver acceptance. Helm Ready is sufficient — every
  # downstream HelmRelease that needs the CRDs declares
  # `dependsOn: bp-gateway-api` so Flux gates them on this release's
  # Ready condition.
  install:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
