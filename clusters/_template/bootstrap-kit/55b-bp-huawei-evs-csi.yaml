# bp-huawei-evs-csi — Catalyst bootstrap-kit Blueprint #55b (#3971 follow-up).
# (Tier 5 — Cloud Integration). The Huawei (HCS / kom4dc) storage sibling of
# slot 55a (bp-hcloud-csi). Installs the open-source huaweicloud-csi-driver
# EVS block-storage plugin (evs.csi.huaweicloud.com) + the durable `evs-ssd`
# default StorageClass so every fresh Huawei Sovereign's PVCs land on real EVS
# block volumes — never ephemeral k3s local-path (which #3992 FORBIDS via
# `--disable=local-storage` + the K23 Kyverno ENFORCE deny).
#
# WHY THIS SLOT EXISTS (the Huawei half of the #3971 P0 blocker)
# =============================================================
# #3992 forbade k3s local-path on ALL providers and wired the stateful root
# slots (bp-cnpg 16 + bp-mgmt-vcluster 58) to `dependsOn: bp-hcloud-csi`. But
# bp-hcloud-csi renders EMPTY on Huawei (enabled=false) — it installs the
# Hetzner Cloud CSI, which obviously cannot run on HCS. So a Huawei prov came
# up with NO StorageClass at all: every stateful PVC (the 3 vCluster
# data-*-vcluster-0, 3 shared-pg, gitea/harbor/guacamole/flow/powerdns PGs)
# sat Pending forever → the vCluster StatefulSets never scheduled → the
# vc-mgmt/rtz/dmz kubeconfig secrets were never created → every in-vCluster
# app failed `could not get KubeConfig secret 'mgmt/vc-mgmt'` → the whole
# bp-catalyst-platform spine froze at ~40/50 HRs. Confirmed live on hw174
# (ea30d1d816f2eee2): `kubectl get sc` + `get csidrivers` → "No resources
# found", 12 PVCs Pending. This slot installs the missing CSI so those PVCs
# bind and the spine resumes.
#
# WHY the open-source huaweicloud-csi-driver, NOT the everest add-on
# =================================================================
# The everest CSI (disk.csi.everest.io) is a CLOSED-SOURCE CCE add-on bound
# to CCE's agency / IAM pod-identity — no public manifests, no portable AK/SK
# cloud-config, infeasible on bare k3s. The open-source
# github.com/huaweicloud/huaweicloud-csi-driver EVS plugin is purpose-built
# for self-managed clusters: portable AK/SK INI cloud-config (which we have)
# + OpenStack-metadata node-identity (no CCM needed). Live-probed on hw174:
# 169.254.169.254/openstack/latest/meta_data.json → uuid + AZ me-east-215a,
# and evs.me-east-215.kom4dc.nationalcloud.om answers (IAM-token gated).
#
# PROVIDER GATING — active-but-empty on Hetzner (the slot-55a pattern)
# ====================================================================
# #892 (Refs #3992 #3971) — this slot is now ACTIVE on BOTH providers (NOT
# suspended), exactly like slot 55a. The chart `enabled` toggle (EVS_CSI_ENABLED)
# decides whether it installs the real EVS driver (Huawei substitutes "true") or
# an EMPTY release that reports Ready immediately (Hetzner substitutes "false" —
# the chart default). Why this changed from the old `suspend:
# ${HUAWEI_HR_SUSPEND:=true}`:
#
#   The stateful root slots bp-cnpg (16) + bp-mgmt-vcluster (58) now ALSO
#   `dependsOn: bp-huawei-evs-csi` — on Huawei this is the slot that actually
#   creates the durable default StorageClass (`evs-ssd`); slot 55a's
#   bp-hcloud-csi renders EMPTY there and goes Ready WITHOUT any default class,
#   so depending on slot 55a alone did NOT guarantee a default class exists
#   before the first CNPG/vCluster PVC binds (the hw182 ordering race — PVCs
#   minted classless before evs-ssd landed, frozen "" forever → gitea/harbor/
#   guacamole-pg Pending 84m+ → console never installs).
#
#   A `dependsOn` on a SUSPENDED HelmRelease blocks FOREVER — Flux never marks a
#   suspended HR Ready. So the old `suspend:` shape would deadlock EVERY Hetzner
#   prov the moment slots 16/58 gate on this HR. Rendering empty (enabled=false)
#   keeps the HR Ready so the dependsOn is satisfied on Hetzner without the
#   suspended-HR deadlock — the SAME proven idiom slot 55a uses on Huawei.
#
# Both CSI slots are now active-but-empty on the OTHER provider, so the stateful
# roots can `dependsOn: [bp-hcloud-csi, bp-huawei-evs-csi]` (list BOTH) and the
# correct one (whichever installs a real default class for this provider) gates
# the PVCs while the empty one is a Ready no-op. No per-provider dependsOn
# templating is needed — see slots 16 + 58.
#
# WHAT IT INSTALLS (Huawei only)
# ==============================
#   - The EVS CSI controller Deployment (provisioner/attacher/resizer/
#     snapshotter sidecars + the evs-csi-plugin) + node DaemonSet + CSIDriver
#     `evs.csi.huaweicloud.com`.
#   - The `evs-ssd` StorageClass — reclaimPolicy Delete (#4350: Retain on the
#     cluster-default class LEAKED EVS volumes — every churned PVC left a
#     Released PV whose backing volume stayed alive + billed + counting against
#     Huawei's project-wide 400-volume hard quota, until kom4dc hit EVS.1034 /
#     413 VolumeLimitExceeded and every new PVC went Pending), volumeBindingMode
#     WaitForFirstConsumer (the volume lands in the consuming Pod's AZ),
#     allowVolumeExpansion true, type SSD (HCS me-east-215 exposes SSD / SAS only).
#   - VolumeSnapshotClass `evs-snapshots` (storage-level DR).
#   - A pre-install/pre-upgrade hook Job (#4350) that reconciles the evs-ssd SC
#     reclaimPolicy: if the live SC still carries the OLD immutable Retain, it
#     DELETES the SC so Helm recreates it with Delete (a values-only flip alone
#     STALLS the HR because reclaimPolicy is immutable). Idempotent — a no-op
#     when already Delete or on a fresh prov; Bound PVs/PVCs are unaffected.
#   - A post-install hook Job that promotes evs-ssd to cluster-default (the
#     provisioner-agnostic flip hook reused from bp-hcloud-csi).
#
# AK/SK wiring:
#   - cloud-init writes `flux-system/cloud-credentials` with huawei-ak /
#     huawei-sk / huawei-project-id / huawei-region.
#   - This HelmRelease lifts those four keys via Flux `valuesFrom` into the
#     chart values; the chart renders the namespace-local `cloud-config` Secret
#     (INI [Global] AK/SK + endpoints) the driver binds for EVS-API auth. The
#     plaintext never lands in this committed manifest.
#
# dependsOn: bp-reflector — the driver image
# (ghcr.io/openova-io/openova/evs-csi-plugin) is a PRIVATE ghcr package whose
# pod spec carries `imagePullSecrets: [ghcr-pull]` (#4037/#4038). That secret is
# NOT created in `huawei-evs-csi` by this slot; it is MIRRORED there by the
# emberstack reflector (slot 05a) from `flux-system/ghcr-pull`. Without a
# dependsOn on bp-reflector this slot raced ahead: the CSI HR installed and
# created its controller/node pods BEFORE the reflector had mirrored the secret,
# so the kubelet pulled `evs-csi-plugin` anonymously → 401 Unauthorized →
# ImagePullBackOff that does NOT self-heal once the secret later lands (a pod in
# pull-backoff is never re-resolved against newly-arrived imagePullSecrets; it
# needs a recreate). Live evidence hw179 (f06e6dd2e8e6dc52, region B,
# 2026-06-21): ghcr-pull reflected into huawei-evs-csi at T+~9m but all three
# CSI pods stayed ImagePullBackOff 11m+ with the last pull attempt 10m stale.
# Gating on bp-reflector guarantees the secret exists before the pods are
# created. (cloud-credentials for AK/SK is still seeded by cloud-init pre-Flux,
# so no Flux dependency there; only the private-image pull secret needs the
# reflector ordering.)

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-huawei-evs-csi
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-huawei-evs-csi
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "55b"
spec:
  # #892 — ACTIVE on BOTH providers (NOT suspended). The chart `enabled` toggle
  # below (EVS_CSI_ENABLED) decides whether this installs the real Huawei EVS CSI
  # + the evs-ssd default StorageClass (Huawei substitutes "true") or an EMPTY
  # release that reports Ready immediately (Hetzner substitutes "false" — the
  # chart default). This MUST stay active on Hetzner now that the stateful root
  # slots bp-cnpg (16) + bp-mgmt-vcluster (58) `dependsOn: bp-huawei-evs-csi`: a
  # `dependsOn` on a SUSPENDED HR blocks forever — Flux never marks a suspended
  # HR Ready — so the old `suspend: ${HUAWEI_HR_SUSPEND}` shape would deadlock
  # EVERY Hetzner prov. Rendering empty (enabled=false) keeps the HR Ready so the
  # dependsOn is satisfied on both clouds (mirrors slot 55a's empty render on
  # Huawei). See the PROVIDER GATING header block.
  #
  # #4038-followup — gate on bp-reflector so the `ghcr-pull` imagePullSecret has
  # been mirrored into `huawei-evs-csi` BEFORE the private-image CSI pods are
  # created (otherwise they ImagePullBackOff 401 and never self-heal; see the
  # dependsOn note in the header). bp-reflector (slot 05a) is Ready early — it
  # only dependsOn bp-cert-manager — so this gate adds no meaningful latency to a
  # slot that already installs after the early foundational tier.
  dependsOn:
    - name: bp-reflector
      namespace: flux-system
  interval: 15m
  releaseName: huawei-evs-csi
  targetNamespace: huawei-evs-csi
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: bp-huawei-evs-csi
      # 1.0.4 (#4350): evs-ssd default reclaimPolicy Retain → Delete to stop the
      # EVS volume-count quota leak (Released PVs kept their EVS volume alive →
      # project hit the 400 hard quota → gitea/harbor/per-Org PVCs Pending →
      # bp-catalyst-platform never converged).
      # 1.0.5 (#4350 follow-up): a pre-install/pre-upgrade hook DELETES + lets
      # Helm RECREATE the evs-ssd SC when its live reclaimPolicy is still the OLD
      # Retain — reclaimPolicy is IMMUTABLE so the 1.0.4 values-flip alone STALLS
      # the HR on a live Sovereign that already had the Retain SC (the kom4dc
      # convergence gate). Idempotent (no-op when already Delete / on fresh prov);
      # existing Bound PVs/PVCs are unaffected.
      # 1.0.6 (#4350 follow-up): the 1.0.5 reclaim-reconcile hook Job carries the
      # `app.kubernetes.io/managed-by: flux` label so the kyverno `flux-managed`
      # Enforce policy admits it on a converged Sovereign — without it the
      # pre-upgrade hook was denied → HR stalled → the whole stateful chain
      # (bp-cnpg → bp-gitea → bp-catalyst-platform → org-controller) stayed gated.
      # 1.0.7 (#4350 follow-up): the POST-upgrade default-class-hook Job carries
      # the same `managed-by: flux` label so the kyverno policy admits BOTH the
      # pre- and post- hooks — without it the 1.0.6 upgrade rolled back on the
      # post-upgrade phase and the HR stayed Stalled.
      # 1.0.8 (#4885): the openova-io EVS driver image honours global.imageRegistry
      # so the step-07 cutover image pivot reaches the controller + node driver
      # Pods (the imageRegistry:'' seam below is what step-07 patches).
      # 1.0.9 (#4973 Refs #3379): the six sig-storage CSI sidecar images ALSO
      # honour global.imageRegistry. 1.0.8 pivoted only the driver; the sidecars
      # stayed on harbor.openova.io/proxy-k8s/*, the MOTHERSHIP Harbor — a residual
      # tether the step-08 deny-egress hold blocks, so a controller/node roll under
      # the hold could not pull them and the EVS attach/provision path broke on any
      # pod restart (live hw237 step-08). Now all images host-swap through the same
      # seam. This HR is already in the step-07 imageRegistryPivot.additionalHRs
      # set, so no cutover-side change is needed.
      version: 1.0.9
      sourceRef:
        kind: HelmRepository
        name: bp-huawei-evs-csi
        namespace: flux-system
  # ── Activation ───────────────────────────────────────────────────────
  # enabled installs the driver + renders the evs-ssd SC + runs the
  # default-class flip hook so evs-ssd is the cluster's ONE default class
  # (local-path is FORBIDDEN by --disable=local-storage).
  #
  # ✅ DEFAULT-ON (EVS_CSI_ENABLED defaults "true") — the HCS IAM auth fix
  # landed and is LIVE-PROVEN on hw174 (2026-06-21). The driver image is the
  # OpenOva-patched fork (platform/huawei-evs-csi/driver-src) carrying the
  # `idc` no-Keystone bypass: when cloud-config idc=true (the chart default)
  # the driver SKIPS the upfront Keystone catalog/token fetch — the calls HCS
  # me-east-215's IAM APIGW returns APIGW.0101 "API does not exist" for, which
  # CrashLooped the off-the-shelf driver — and signs every EVS/ECS request
  # directly with SDK-HMAC-SHA256 AK/SK request signing. The EVS data API works
  # fine with AK/SK (tofu provisions EVS disks the same way).
  #
  # Live proof on hw174 (ea30d1d816f2eee2, region A): the patched controller
  # ran 6/6 with 0 restarts (NO CrashLoop), `Successfully published volume ...
  # to EVS ... Got device path: /dev/vdb` appeared in the driver log (real
  # signed EVS/ECS calls, real project-id f27698137... in the URL, zero
  # APIGW.0101), the evs-ssd default StorageClass + evs.csi.huaweicloud.com
  # CSIDriver registered, and the 12 Pending stateful PVCs (incl.
  # data-mgmt/rtz/dmz-vcluster-0) BOUND to real EVS disks → the 3 vCluster
  # StatefulSet pods scheduled → vc-mgmt/rtz/dmz kubeconfig secrets were
  # created → the spine resumed (HR ready 36 → climbing).
  #
  # Hetzner is unaffected: the slot is now ACTIVE there too (#892) but
  # EVS_CSI_ENABLED=false renders an EMPTY release (Ready immediately, zero EVS
  # resources) so it only satisfies the slot-16/58 dependsOn — the durable
  # default class on Hetzner is hcloud-volumes from slot 55a.
  # Override EVS_CSI_ENABLED="false" only for a deliberate no-storage Huawei
  # smoke prov; a real Huawei prov MUST have it true or the Phase-1
  # storage-durability gate fails it (local-path is FORBIDDEN, never a silent
  # fallback). See #3971 #892.
  values:
    # #4885 / #4892: global.imageRegistry override seam for the step-07 cutover
    # image-registry pivot (imageRegistryPivot.additionalHRs). step-07 patches
    # this HR's spec.values.global.imageRegistry live AND durably sed-edits THIS
    # file — the sed matches `^      imageRegistry:`, so the 6-space indent is
    # REQUIRED. Empty default = verbatim ghcr.io (byte-identical pre-cutover).
    global:
      imageRegistry: ''
    enabled: ${EVS_CSI_ENABLED:=true}
    defaultStorageClass: ${EVS_CSI_ENABLED:=true}
    # idc=true (chart default) engages the no-Keystone AK/SK bypass — REQUIRED
    # on HCS. Exposed as a substitute so a future public-Huawei-Cloud Sovereign
    # (which publishes Keystone) can set it false without a chart change.
    idc: ${HUAWEI_EVS_IDC:=true}
    # HCS API domain + IAM endpoint — substituted from the Huawei cloud-init
    # (HUAWEI_CLOUD_DOMAIN / HUAWEI_AUTH_URL) so the driver derives every EVS
    # service endpoint as https://<svc>.<region>.<cloud>/.
    cloud: ${HUAWEI_CLOUD_DOMAIN:=kom4dc.nationalcloud.om}
    authUrl: ${HUAWEI_AUTH_URL:=https://iam.me-east-215.kom4dc.nationalcloud.om/v3}
    clusterName: ${SOVEREIGN_FQDN_SLUG:=catalyst}
    # #4030: the VolumeSnapshotClass kind needs the snapshot.storage.k8s.io CRDs,
    # which the bootstrap-kit installs nowhere — rendering it fails `helm install`
    # at manifest-build, so the whole EVS-CSI release never installs and evs-ssd
    # never lands (Huawei storage re-wedged zero-touch on hw176 even with the
    # 1.0.1 idc driver). Chart 1.0.2 defaults this false; pinned explicit here.
    volumeSnapshotClass:
      enabled: false
  # ── AK/SK wiring ─────────────────────────────────────────────────────
  # Pull the four Huawei creds from the canonical flux-system/cloud-credentials
  # Secret (cloud-init Phase 0) into the chart values. Flux dereferences
  # valuesFrom at apply time so the plaintext never lands in this manifest.
  #
  # `optional: true` (#892) — now that this HR is ACTIVE on Hetzner too
  # (enabled=false empty render, no longer suspended), Flux applies it on
  # Hetzner — where the cloud-credentials Secret carries `hcloud-token`, NOT the
  # four `huawei-*` keys. Without optional:true Flux would FAIL to apply the HR
  # (cannot dereference a missing valuesKey) → the dependsOn from slots 16/58
  # would never be satisfied → deadlock. optional:true makes Flux SKIP each
  # absent key on the empty Hetzner render (the same idiom slot 55a uses for the
  # absent hcloud-token on Huawei); on Huawei all four keys are present.
  valuesFrom:
    - kind: Secret
      name: cloud-credentials
      valuesKey: huawei-ak
      targetPath: huaweiAccessKey
      optional: true
    - kind: Secret
      name: cloud-credentials
      valuesKey: huawei-sk
      targetPath: huaweiSecretKey
      optional: true
    - kind: Secret
      name: cloud-credentials
      valuesKey: huawei-project-id
      targetPath: huaweiProjectId
      optional: true
    - kind: Secret
      name: cloud-credentials
      valuesKey: huawei-region
      targetPath: huaweiRegion
      optional: true
