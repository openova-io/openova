# bp-postgres (shared instance C) — Catalyst bootstrap-kit Blueprint, slot 16d.
#
# THREE-INSTANCE MODEL (founder NS-2, Refs #3188): instance C of three.
# A third install of the SAME bp-postgres chart (slot 16a header has the
# full model): CNPG Cluster `shared-pg-c` in shared-data carrying the
# Organization microservice mesh (bp-catalyst-platform, slot 13) — READY-TO-ADOPT.
#
# The Organization mesh today bootstraps its own `org-pg` Cluster (products/
# catalyst/chart/templates/org-services/cnpg-cluster.yaml) with the
# primary org_auth database plus org_billing + org_documents via initdb
# postInitApplicationSQL, all owned by ONE role `sme` and gated on
# marketplace.enabled. This slot declares the SAME shape on shared-pg-c
# (three Database CRs, one deduped `sme` role — chart 0.1.5 same-owner
# bindings) so the adoption flip is a per-app follow-up that points the
# Organization services' secret/host values at `org-database-secret` /
# shared-pg-c-rw without re-modelling anything. FerretDB (org_documents)
# rides the same role.
#
# SAFE-BY-DEFAULT: same SOVEREIGN_ENABLE_SHARED_PG gate as 16a/16c — OFF
# renders ZERO resources (empty Ready release). The shared-data
# Namespace + the bp-postgres HelmRepository are declared ONCE in 16a;
# this slot is the HelmRelease only.
#
# Wrapper chart: platform/postgres/chart/
# Reconciled by: Flux on the new Sovereign's k3s control plane.

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # bp-postgres-shared-c is the instance-C data-instance HR. The Organization
  # mesh (bp-catalyst-platform) dependsOn THIS post-adoption, per
  # ADR-0010. releaseName matches instance.name so Cluster + Secrets
  # are named consistently.
  name: bp-postgres-shared-c
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "16d"
    catalyst.openova.io/data-instance: shared-pg-c
spec:
  interval: 15m
  releaseName: shared-pg-c
  targetNamespace: shared-data
  # Same edges as 16a/16c.
  dependsOn:
    - name: bp-cnpg
      namespace: flux-system
    - name: bp-reflector
      namespace: flux-system
  chart:
    spec:
      chart: bp-postgres
      # Pinned in lockstep with 16a/16c — see 16a for the chart
      # changelog. 0.1.5 ships the same-owner binding dedupe + the
      # underscore-sanitized Database CR names this slot relies on.
      # 0.1.6 ships the #3370 bootstrapOwned Application-CR
      # self-registration. 0.1.9 is the pin bump that fires the live
      # upgrade so the CR renders, plus this slot's newapi + openova-flow
      # Context additions below.
      # 0.1.10 (#3375): role-Secret name RFC-1123 sanitization — fixes THIS
      # slot's Stalled upgrade (Secret "shared-pg-c-openova_flow" invalid).
      # 0.2.0 (#3571, Refs #3375 North-Star-4): active-hot-standby = REAL
      # bp-cnpg-pair split-side cross-region shape (shared-pg-c primary keeps
      # its name so the Organization mesh / newapi / openova-flow hosts are unchanged +
      # shared-pg-c-mesh global Service + shared-pg-c-replica follower). Gated
      # by topology.crossRegion below (SOVEREIGN_ENABLE_CNPG_PAIR). Single-
      # region stays a byte-identical singleton. Lockstep bump with 16a/16c.
      # 0.2.1 (#3577, Refs #3572 #3322): consumer-ingress carve-out — the 0.2.0
      # primary NetworkPolicy default-denied every consumer's shared-pg-c-rw:5432
      # (Organization mesh / newapi / openova-flow on hw144). Adds TCP 5432 from any
      # in-cluster Pod; replication/own-cluster/operator carve-outs unchanged.
      # Lockstep bump with 16a/16c.
      # 0.2.4 (#3878): pure lockstep pin bump — shared-c's bindings (Organization mesh /
      # newapi / openova-flow) declare NO reflect.mangledTarget (they are not
      # the 4 vc-mgmt-homed deadlock apps; newapi keeps its `newapi/*` fromHost
      # wildcard per #3876), so this slot renders byte-identical to 0.2.2 on the
      # additive chart. Lockstep with 16a/16c. Refs #3876 #3374 #3737.
      # 0.2.8 (#4460, Refs #4439 #4436 #4275): shared-pg-c's `-mesh`/`-mesh-rw`
      # global Service aliases decoupled from the cnpg-pair flip → render on the
      # multi-region signal so the cross-region Organization-mesh / newapi /
      # openova-flow hosts resolve the moment the mesh peers. Lockstep 16a/16c.
      # 0.2.10 (#4846): identity-based cross-region DR CiliumNetworkPolicy
      # (crossRegionPeerClusters) replaces the inert ipBlock. Lockstep 16a/16c.
      # 0.2.13 (#5224, Refs #5220 #4915): role-secrets side-gate — a region
      # stamped side=secondary NEVER mints role/hub Secrets (incl. the #4460
      # pre-flip window); the pair's password set is single-sourced from
      # region-A. Lockstep with the other 16* bp-postgres slots.
      # 0.2.14 (#5473): replication-source Service selectorType r -> rw —
      # `r` matched every instance, so a standby could serve as DR source.
      # 0.2.18 (#5623): region-B AUTOMATIC DR promotion — ported bp-cnpg-pair
      # dr-promoter + failover-readiness + topology.promoted HR-value seam on the
      # active-hot-standby replica half (autoPromote.hr.name above targets THIS HR,
      # bp-postgres-shared-c). sync-only fence. Lockstep 16a/16c/16d.
      # 0.2.23 (#6149, Refs #6148 #5623 #5245): region-A AUTOMATIC DR FAILBACK — the
      # SYMMETRIC half of 0.2.18's promoter. hw293 G12 (2026-08-11) promoted all four
      # DR pairs and only bp-cnpg-pair could come back (census: 4 promoters / 1
      # failback), leaving shared-pg + shared-pg-b permanently DUAL-WRITABLE on
      # divergent timelines with keycloak on one of them. Both actors now ride ONE
      # side-independent gate (bp-postgres.drPairCapable), so a promoter without a
      # failback is not expressible, and a one-sided operator gate FAILS the render.
      # Carries the #6148 write-guard: on peer-ahead DETECTION the actor applies a
      # CiliumNetworkPolicy denying :5432 to everything but the pair's own Pods and
      # itself, and removes it on every fail-safe path — so the 120s hold no longer
      # accepts consumer writes it is about to discard. Lockstep 16a/16c/16d.
      # 0.2.24 (#6627, Refs #4846 #6106): SINGLETON cross-region shared-consumer
      #   admission CNP. The singleton operator-probe netpol opened :5432 via a
      #   k8s-NetworkPolicy namespaceSelector:{} (LOCAL identities only), so a
      #   region-B keycloak reaching this region-A primary over ClusterMesh was
      #   DROPPED → JDBC acquisition timeout → ~50% of per-app SSO /auth 500 (hw304).
      #   Adds the singleton mirror of #4846's identity CNP. Lockstep 16a/16c/16d.
      # 0.2.25 (#6753, Refs #6149 #3629 #4460): the consumer `-mesh`/`-mesh-rw`
      #   global aliases FOLLOW a #6149 automatic DR promotion — they select the
      #   promoted `shared-pg-c-replica` instead of the demoted `shared-pg-c`, so
      #   THIS slot's region-A consumers (the Organization mesh / newapi /
      #   openova-flow) resolve `shared-pg-c-mesh-rw` to region B's writable
      #   survivor instead of NXDOMAIN-crashlooping post-promote (the shared-pg-b
      #   sibling hit this live on hw305). Steady render byte-identical. Lockstep
      #   16a/16c/16d.
      version: 0.2.25
      sourceRef:
        kind: HelmRepository
        name: bp-postgres
        namespace: flux-system
  install:
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    # Same master gate as 16a/16c — one switch for all three instances.
    enabled: ${SOVEREIGN_ENABLE_SHARED_PG:=false}
    # Bootstrap self-registration (#3370) — see 16a.
    bootstrapOwned:
      enabled: true
      helmRelease:
        name: bp-postgres-shared-c
        namespace: flux-system
    instance:
      name: shared-pg-c
      namespace: shared-data
      storageSize: 10Gi
    # Cross-region active-hot-standby (#3571) — see 16a for the full design.
    # crossRegion rides SOVEREIGN_ENABLE_CNPG_PAIR (catalyst-api post-mesh
    # flip); OFF/single-region renders a byte-identical singleton. side from
    # SOVEREIGN_REGION_ROLE; regions from the canonical node labels. When ON:
    # side=primary → named shared-pg-c Cluster (Organization mesh / newapi / openova-flow
    # host shared-pg-c-rw unchanged) + shared-pg-c-mesh; side=secondary →
    # shared-pg-c-replica follower streaming WAL over the mesh.
    topology:
      mode: singleton
      crossRegion: ${SOVEREIGN_ENABLE_CNPG_PAIR:-false}
      side: ${SOVEREIGN_REGION_ROLE:-primary}
      instances: 1
      primary:
        region: '${SOVEREIGN_PRIMARY_REGION:-}'
      replica:
        region: '${SOVEREIGN_REPLICA_REGION:-}'
      # ── Region-B automatic DR promotion (#5623) ─────────────────────────
      # The side=replica dr-promoter patches THIS instance's HR DESIRED state
      # (spec.values.topology.promoted=true) on a region-A kill, so hr.name MUST
      # be this slot's own HelmRelease (the chart default is bp-postgres-shared).
      autoPromote:
        hr:
          name: bp-postgres-shared-c
      # -- Region-A automatic DR FAILBACK (#6149) ---------------------------
      # THE SYMMETRIC HALF of autoPromote, and not optional relative to it.
      # On the hw293 G12 region-kill (2026-08-11, dep a0077ba47e3720e5) all four
      # DR pairs promoted and exactly ONE could come back: the census was 4
      # dr-promoters in region B against 1 dr-failback in region A
      # (bp-cnpg-pair's). shared-pg-c and its siblings were left DUAL-WRITABLE on
      # divergent timelines -- both sides pg_is_in_recovery()=false, different
      # row counts of the same table, nothing scheduled to ever reconcile them.
      # shared-pg carries keycloak. Chart 0.2.21 makes the two actors ride ONE
      # gate (bp-postgres.drPairCapable), so this block is not an opt-in: it
      # names the seams the region-A actor writes through.
      #
      # hr.name MUST be this slot's own HelmRelease -- the actor renders the
      # demotion onto spec.values.topology.demoted there.
      #
      # demotedSubstituteKey MUST be UNIQUE PER INSTANCE. bp-cnpg-pair (slot
      # 16b) hard-codes SOVEREIGN_CNPG_PAIR_DEMOTED because there is exactly one
      # pair; the three bp-postgres instances share ONE bootstrap-kit
      # Kustomization, so a shared key would demote and re-clone all three the
      # moment any single one of them failed back. Each slot owns its own key,
      # and cloud-init never needs to stamp it -- the substitute is CREATED by
      # the actor's merge patch and consumed by the SAME Kustomization on the
      # next reconcile, exactly as SOVEREIGN_CNPG_PAIR_DEMOTED is for 16b.
      failback:
        hr:
          name: bp-postgres-shared-c
        demotedSubstituteKey: SOVEREIGN_SHARED_PG_C_DEMOTED
      # The DEMOTED (rejoin) seam the failback actor drives. Default false;
      # kustomize renders it true from the substitute above once the actor has
      # proven region-B writable and equal-or-ahead for the full peer-ahead
      # hold, which flips this instance's primary Cluster CR into a
      # pg_basebackup replica of region-B. Flipping it back to false is the
      # sovereign-admin's controlled switchback (RUNBOOKS 6.1).
      demoted: ${SOVEREIGN_SHARED_PG_C_DEMOTED:-false}
      # #4442 — HOST shared-data instance: open 5432 to cross-namespace
      # consumers (the singleton operator-probe NP otherwise default-denies
      # them). See slot 16a for the full rationale.
      networkPolicy:
        sharedConsumers: true
        # crossRegionPeerClusters (#4846) — admit the PEER region's pods to 5432
        # by CLUSTER IDENTITY so region-b consumers (keycloak/grafana/…) + the
        # region-b replica's pg_basebackup reach the primary. k8s-netpol label
        # rules are implicitly local-cluster-scoped, and a k8s `ipBlock` never
        # matches a ClusterMesh remote endpoint (it matches only a CIDR identity,
        # which Cilium assigns solely to NON-endpoint IPs) — so the chart renders
        # an identity-based CiliumNetworkPolicy selecting io.cilium.k8s.policy.
        # cluster instead. SOVEREIGN_PEER_CLUSTERMESH_NAMES is stamped by
        # catalyst-api (enableCNPGPairAfterFullMesh) with the peer region's mesh
        # name(s) at the post-mesh cnpg-pair flip, as a YAML flow-sequence e.g.
        # [hw228-me-east-b]. Only consumed in active-hot-standby; DEFAULT [] →
        # singleton renders NO CiliumNetworkPolicy (byte-identical default).
        crossRegionPeerClusters: ${SOVEREIGN_PEER_CLUSTERMESH_NAMES:-[]}
    # The Organization-mesh bindings: three isolated databases, ONE role `org`
    # (chart 0.1.5 dedupes the role + password Secret across same-owner
    # bindings). Database names mirror orgPostgres.cluster.database +
    # additionalDatabases in products/catalyst/chart/values.yaml so the
    # adoption flip is a host+secret swap, not a rename.
    databases:
      - name: org_auth          # auth service primary DB
        owner: org
        consumer:
          blueprint: bp-catalyst-platform
          mode: shared
        # One hub Secret for the whole mesh — every Organization service
        # shares the `org` credentials and derives its own database name.
        # #3383 (rename sme→org-services): the Organization service mesh ns was
        # renamed `sme`→`org-services` in bp-catalyst-platform 1.4.675
        # (slot-13 orgPostgres.cluster.namespace + ferretdb.namespace +
        # every templates/org-services/* consumer), but this reflect target
        # was left at `[sme]` — so the hub `org-database-secret` was pushed
        # into a namespace that no longer exists while ferretdb (ns
        # org-services, env PG_USER/PG_PASSWORD secretKeyRef
        # org-database-secret, non-optional) hit
        # `secret "org-database-secret" not found` → CreateContainerConfigError
        # (verified live hw163 2026-06-18: ns `sme` NotFound, and
        # org-services/org-database-secret NotFound — the reflector had no
        # live target). Point the reflect target at the post-#3383 mesh
        # namespace so the hub secret lands where ferretdb (and any other
        # org-services Organization consumer) mounts it. Refs #3383.
        reflect:
          secretName: org-database-secret
          namespaces: [org-services]
      - name: org_billing       # billing service primary DB
        owner: org
        consumer:
          blueprint: bp-catalyst-platform
          mode: shared
      - name: org_documents     # FerretDB (MongoDB-wire) backing DB
        owner: org
        consumer:
          blueprint: bp-catalyst-platform
          mode: shared
      # newapi (#3370 §5 target shared-pg-c set): the bp-newapi consumer
      # today embeds its own `newapi-bp-newapi-newapi-pg` Cluster
      # (§4 violation). Declaring its Context here (isolated `newapi`
      # database + `newapi` role + reflected secret into ns newapi) lets
      # bp-newapi adopt shared-pg-c by flipping to externalDatabase mode
      # off `newapi-database-secret` — same one-flag pattern as
      # gitea/harbor/keycloak. READY-TO-ADOPT.
      - name: newapi            # bp-newapi primary DB
        owner: newapi
        consumer:
          blueprint: bp-newapi
          mode: shared
        reflect:
          secretName: newapi-database-secret
          namespaces: [newapi]
      # openova-flow (#3370 §5 target shared-pg-c set): the
      # catalyst-system openova-flow consumer today embeds its own
      # `openova-flow-pg` Cluster (§4 violation). Its Context here
      # (isolated `openova_flow` database + `openova_flow` role +
      # reflected secret into ns catalyst-system) lets it adopt
      # shared-pg-c. READY-TO-ADOPT.
      - name: openova_flow      # openova-flow primary DB
        owner: openova_flow
        consumer:
          blueprint: bp-openova-flow
          mode: shared
        reflect:
          secretName: openova-flow-database-secret
          namespaces: [catalyst-system]
