# bp-oidc-gate — Catalyst bootstrap-kit Blueprint slot 13c
# (#3374 — the ONE generic OIDC gate).
#
# A reusable oauth2-proxy front that brings login-less external apps
# under the Sovereign zero-click SSO contract (fresh browser -> bare URL
# -> Keycloak sovereign realm, silent via catalyst-pin -> signed in).
# One chart, N instances — never N bespoke per-app proxies (#3374 §5).
#
# First gated instance: openova-flow.<sovereign-fqdn>. The flow-server
# route previously served its HTTP+SSE API with NO auth at all
# (measured live on hw130 2026-06-13 — anonymous JSON descriptor).
# Slot-56 intent is preserved: cross-cluster emitters POST FlowMessage
# envelopes over public HTTPS, so the emitter WRITE paths are
# skip-auth-route'd (the pre-existing machine-write surface, unchanged)
# and token-bearing callers pass via --skip-jwt-bearer-tokens; the
# browser-facing READ surface (snapshots, SSE streams, log-lines GETs)
# now requires the operator's Keycloak session. The flow-server's own
# HTTPRoute is disabled in slot 56 (two HTTPRoutes on one hostname is
# undefined routing) — this gate owns the hostname.
#
# dependsOn:
#   - bp-cilium                  — Pod network + the cilium-gateway the
#                                  gate's HTTPRoutes parent to.
#   - bp-keycloak                — sovereign realm (issuer).
#   - bp-external-secrets-stores — ClusterSecretStore vault-region1 the
#                                  per-instance ExternalSecret resolves
#                                  client secrets through.
# (bp-sso-bridge is deliberately NOT a dependsOn: the gate Pod starts
# and serves 302s before the client bundle lands — the ExternalSecret
# converges eventually, the same pattern as every Tier-1/2 SSO app.)
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-oidc-gate
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-oidc-gate
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "13c"
spec:
  interval: 1m
  releaseName: oidc-gate
  targetNamespace: oidc-gate
  dependsOn:
    - name: bp-cilium
    - name: bp-keycloak
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    - name: bp-external-secrets-stores
  chart:
    spec:
      chart: bp-oidc-gate
      # 0.1.3 (#3374, 2026-06-18): rootRedirectPath — the gate 302s ONLY the
      # bare root (Exact `/`) to an app's native OIDC login path. powerdns-admin
      # instance below sets rootRedirectPath:/oidc/login so its bare URL starts
      # PDA's own silent KC round-trip and lands signed-in (hw159: bare URL had
      # been landing on PDA's /login FORM — zero-click FAIL; PDA ships authlib
      # OIDC and ignores oauth2-proxy's X-Auth-Request-* headers).
      # 0.1.4 (#3741/#3852, 2026-06-19): appNativeCallbackPath — register the
      # gated app's OWN native-OIDC callback as a SECOND redirectUri on the KC
      # client. The rootRedirectPath→/oidc/login hop fires PDA's authlib flow
      # which sends redirect_uri=…/oidc/authorized; #3741 had over-stripped that
      # URI → KC 'Invalid parameter: redirect_uri' on hw167 (UAT row 3374-11).
      # powerdns-admin instance below sets appNativeCallbackPath:/oidc/authorized.
      # 0.1.5 (#3844, 2026-06-19): backchannel-via-internal-Service — the gate
      # pods CrashLooped on Huawei/kom4dc because oauth2-proxy's OIDC discovery
      # dialed the PUBLIC issuer EIP (auth.<fqdn>), which the cluster cannot
      # hairpin (i/o timeout → openova-flow + powerdns-admin gates never
      # initialised, hw167 UAT rows 3374-36/37/38). keycloakInternalURL below
      # points the backchannel (discovery-skip + redeem/jwks/userinfo) at the
      # in-cluster keycloak Service; the browser leg stays public.
      # 0.1.6 (#4556, 2026-06-27): spaTokenSeed — TRUE zero-click for a
      # token-paste SPA. The agenity oidc-gate instance below does the FULL KC
      # SSO, but the upstream agenity `/app/` SPA then demands a pasted
      # localStorage bootstrap token even though the daemon runs authMode=none
      # (open API). spaTokenSeed 302s the bare root, post-SSO, to
      # `/app/?token=<sentinel>` so the SPA seeds the token and lands
      # authenticated with NO paste (the durable path — the daemon's `oidc`
      # authMode is a non-functional upstream scaffold, #128).
      version: 0.1.7
      sourceRef:
        kind: HelmRepository
        name: bp-oidc-gate
        namespace: flux-system
  install:
    createNamespace: true
    timeout: 15m
    disableWait: true
    remediation:
      retries: 5
      remediateLastFailure: true
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
  values:
    global:
      # Pillar-5 anti-tether (#2940 pattern): per-Sovereign overlay or
      # the cutover Step-04 registry pivot re-points in one place.
      registryMirror: ${REGISTRY_MIRROR:=harbor.openova.io}
    sovereignFQDN: ${SOVEREIGN_FQDN}
    realm: sovereign
    # #3844 — the gate pods reach Keycloak for the backchannel legs over the
    # in-cluster Service (the public auth.<fqdn> EIP does not hairpin from
    # inside the cluster on Huawei/kom4dc). KC_HOSTNAME is pinned public by
    # bp-keycloak so the token `iss` still matches the public issuer.
    keycloakInternalURL: http://keycloak.keycloak.svc.cluster.local
    instances:
      # openova-flow (#3374 §3 row 9). Upstream is the slot-56 Service
      # in catalyst-system; the gate proxies it at the public hostname.
      - name: openova-flow
        enabled: true
        clientId: openova-flow
        upstream: http://openova-flow-server.catalyst-system.svc.cluster.local:80
        # Token-bearing machine callers (future emitter JWTs) pass.
        skipJwtBearerTokens: true
        skipAuthRoutes:
          # Emitter WRITE paths — the slot-56 cross-cluster machine
          # surface (pre-existing, unchanged by the gate; flagged in
          # #3374 as the emitter-token follow-up).
          - "POST=^/v1/flows/[^/]+/events$"
          - "POST=^/v1/flows/[^/]+/log-lines$"
          # Health endpoints stay probe-able.
          - "GET=^/(healthz|readyz)$"

      # powerdns-admin (#3374 §3-d row 6, Layer A). MOVED to the generic
      # gate from its bespoke root-redirect. The bespoke approach is
      # structurally fragile (§3-a: the pda OIDC callback shares the
      # `/login` path, so the 0.1.10 `/login` redirect looped and was
      # reverted; the 0.1.11 root-only redirect is a hand-tuned
      # exception). oauth2-proxy fronts the WHOLE hostname instead: the
      # gate serves its own /oauth2/callback (never the app's /oidc/*),
      # and an already-valid app session passes straight through —
      # zero-click, no loop, by the SAME mechanism as every other gated
      # app. The hostname matches the per-Sovereign pda route
      # (pdns-admin.<fqdn>); the upstream is the in-cluster pda Service.
      #
      # The pda chart's OWN HTTPRoute (incl. the bespoke root redirect)
      # is suppressed by slot 11a setting `gateway.enabled: false`
      # (two HTTPRoutes on one hostname is undefined routing — the gate
      # now owns pdns-admin.<fqdn>). pda's /oidc/* login + callback paths
      # are reached THROUGH the gate (oauth2-proxy proxies all non-
      # /oauth2 paths to the upstream).
      #
      # #3374 (2026-06-18) — rootRedirectPath FIX. PDA ships its OWN OIDC
      # (authlib), unlike the login-less openova-flow. oauth2-proxy auths
      # the BROWSER at the gate then proxies path-for-path, so a bare-root
      # hit reaches PDA's `/`, whose unauthenticated Flask session 302s to
      # PDA's `/login` FORM with a manual "Sign in using OpenID Connect"
      # button — a zero-click FAIL (measured live hw159: bare URL landed on
      # the `/login` form, NOT signed-in). The gate's X-Auth-Request-*
      # headers don't help; authlib only honours its own /oidc/login→KC
      # round-trip. FIX: redirect ONLY the bare root (Exact `/`) to PDA's
      # native `/oidc/login`, so PDA starts its own silent KC round-trip
      # (kc_idp_hint=catalyst-pin, baked into OIDC_OAUTH_AUTHORIZE_URL) and
      # lands on /dashboard/ signed-in — zero clicks, two silent KC hops.
      # Loop-safe (the pda 0.1.11 lesson): only the Exact bare root is
      # redirected; /oidc/login, /oidc/authorized, /login, /dashboard all
      # flow through untouched and PDA's post-login lands on /dashboard/
      # which never revisits `/`. bp-oidc-gate 0.1.3.
      #
      # #3741/#3852 (2026-06-19, hw167 UAT row 3374-11) — appNativeCallbackPath.
      # rootRedirectPath sends the bare root to PDA's /oidc/login, which fires
      # pda-legacy's OWN authlib OIDC flow (authlib sends
      # redirect_uri=https://pdns-admin.<fqdn>/oidc/authorized). #3741 stripped
      # /oidc/authorized from the KC client on the wrong premise it was 'gated,
      # not native-OIDC' → KC 'Invalid parameter: redirect_uri' on that second
      # hop, so the operator never landed (the /oauth2/callback the gate itself
      # uses was the ONLY registered URI). Declaring the native callback here
      # makes the AppRegistration register BOTH /oauth2/callback AND
      # /oidc/authorized on the powerdns-admin client. bp-oidc-gate 0.1.4.
      - name: powerdns-admin
        enabled: true
        clientId: powerdns-admin
        hostname: "pdns-admin.${SOVEREIGN_FQDN}"
        upstream: http://powerdns-admin-bp-powerdns-admin.powerdns-admin.svc.cluster.local:80
        rootRedirectPath: /oidc/login
        appNativeCallbackPath: /oidc/authorized

      # ── GENERALITY PROOF (#3374 DoD box 10a) ──────────────────────────
      # A brand-new throwaway app gated with ONLY a name + hostname +
      # upstream and NOTHING else — no app-specific redirect, no shim, no
      # per-app chart code. Its bare URL lands zero-click by the generic
      # mechanism alone. Disabled by default (no such upstream exists on
      # a normal Sovereign); flip `enabled: true` + point `upstream` at
      # any ClusterIP Service to demonstrate that adding an app to the
      # zero-click contract is a single `instances:` entry. This is the
      # #3370-bar proof transposed onto interception: the contract is
      # generic across apps, not rebuilt per app.
      - name: sso-generality-probe
        enabled: false
        clientId: sso-generality-probe
        hostname: "sso-probe.${SOVEREIGN_FQDN}"
        upstream: http://example-app.default.svc.cluster.local:80
