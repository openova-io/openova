# bp-continuum — Catalyst bootstrap-kit Blueprint slot 62
# (Customer-facing capability / DR orchestration).
#
# OpenOva Continuum — Disaster-Recovery orchestrator for active-hot-
# standby Applications (EPIC-6, slice K-Cont-1 #1101 onward). Reconciles
# Continuum.dr.openova.io/v1 CRs; per-Continuum-CR goroutine maintains a
# lease (10s renew, 30s TTL), watches CNPG replication metrics, and
# executes the switchover sequence on lease loss + replication health
# drop (drain HTTPRoute → flip lua-record on pool-domain-manager →
# flip CNPG primary via bp-cnpg-pair → audit on NATS).
#
# ─── Pillar-3 unblock (#2065, TBD-V14) ─────────────────────────────────
# Pillar-3 of the canonical end-user DoD ("multi-region BCP — region kill
# zero-data-loss failover") requires THREE pieces:
#   1. bp-cnpg-pair (C-DB-1) — primary + replica CNPG with ReplicaCluster
#      sync over Cilium ClusterMesh on the WG-public-IP DMZ data plane.
#   2. Continuum CR + the per-app HTTPRoute drain hook.
#   3. THIS controller — without bp-continuum deployed, every Continuum
#      CR sits unhandled and the lua-record flip never fires, so a
#      region-kill produces TXN-loss on every transaction in-flight.
#
# Before this slot, the chart existed at products/continuum/chart/ and
# the controller image was built by .github/workflows/build-continuum-
# controller.yaml + SHA-pinned in values.yaml — but no bootstrap-kit
# slot deployed it on a fresh Sovereign. catalyst-platform's QA fixtures
# (slot 13, `qa-continuum-status-seed-job`) reference a Continuum CR
# named `cont-omantel` that no controller is ever spinning up to
# reconcile. This slot closes the loop.
#
# ─── Default-OFF gate ──────────────────────────────────────────────────
# The chart's own values.yaml ships `continuum.enabled: false` (chart
# fail-fasts on empty `image.tag` when enabled=true — Inviolable
# Principle #4a no-`:latest` guard). We surface a CONTINUUM_ENABLED
# envsubst placeholder so per-Sovereign overlays may flip the gate on
# once bp-cnpg-pair + bp-powerdns + lease witness are ready. Default
# `false` so a zero-touch provision lands a non-Continuum Sovereign
# (matches the MARKETPLACE_ENABLED / SANDBOX_ENABLED knob shape).
#
# ─── Placement ─────────────────────────────────────────────────────────
# Continuum is itself a single-region controller — it lives on the
# MANAGEMENT cluster (per docs/EPICS-1-6-unified-design.md §9 + the
# chart's blueprint.yaml placementSchema: modes=[single-region]) and
# observes data-plane regions over Cilium ClusterMesh + the witness.
# The Application CRs it reconciles are active-hot-standby; the
# controller itself is single-region.
#
# ─── dependsOn ─────────────────────────────────────────────────────────
#   - bp-catalyst-platform (slot 13) — owns the
#     `dr.openova.io/v1.Continuum` CRD that the controller watches.
#     Without this edge, Helm render-time Capabilities gate fails the
#     install (no matches for kind "Continuum"). NB: CRD lives at
#     products/catalyst/chart/crds/continuum.yaml.
#   - bp-nats-jetstream (slot 7) — catalyst.audit publish target the
#     controller emits switchover audit events to.
#   - bp-powerdns (slot 11) — the pool-domain-manager Service that
#     fronts PowerDNS is what the controller POSTs lua-record commits
#     to during the flip step of the switchover sequence.
#
# bp-cnpg-pair is intentionally NOT in dependsOn because the chart ships
# default-OFF — the controller installs and waits idle until a per-
# Sovereign overlay flips `continuum.enabled=true`. Operators must
# install bp-cnpg-pair (Pillar 3 audit follow-up #2068) AND configure
# the lease witness BEFORE flipping the gate.
#
# Wrapper chart: products/continuum/chart/
# Catalyst-curated values: products/continuum/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-continuum
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://registry.hw307.omani.works/openova-io
  certSecretRef:
    name: cutover-harbor-ca
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-continuum
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "62"
    catalyst.openova.io/component: continuum-controller
    catalyst.openova.io/region-role: every-region
    openova.io/category: customer-facing-capability
    openova.io/epic: "6"
spec:
  # ADR-0015 D8 (Refs #7067): Continuum runs in EVERY region. Each region's
  # Continuum observes its own region natively and, while it holds a group's
  # Git lease, commits the next phase of a topology transition. It is no
  # longer primary-only (the former `suspend: ${SECONDARY_HR_SUSPEND}`), and
  # it depends on nothing of the platform umbrella: the Continuum CRD ships
  # in its own chart (crds/, CreateReplace below) because a follower region
  # runs no bp-catalyst-platform. No NATS / PowerDNS dependency either —
  # Continuum calls neither.
  interval: 15m
  releaseName: continuum
  # targetNamespace = catalyst-system to colocate with the other
  # catalyst-platform controllers (per slot 13 convention). The chart
  # uses .Release.Namespace for every templated resource.
  targetNamespace: catalyst-system
  chart:
    spec:
      chart: bp-continuum
      # 0.1.2 — TBD-V34 republish. 0.1.1 (PR #2072) was tagged in-tree
      # but never landed in GHCR; Blueprint Release run 26144858280
      # failed the hollow-chart guard at the "Verify upstream subcharts
      # present in working tree" step (Chart.yaml had NO dependencies
      # and lacked the catalyst.openova.io/no-upstream annotation).
      # 0.1.3 (#2922 PR-B, 2026-06-03): adds prerequisite-check
      # initContainer that probes for bp-cnpg-pair (audit ConfigMap
      # label catalyst.openova.io/audit-config=true). If absent it
      # sleeps + exits non-zero with a clear log line so `kubectl
      # logs` surfaces the missing Pillar-3 prerequisite instead of
      # a controller crash. Pairs with PR #2923 cloud-init auto-emit
      # of CONTINUUM_ENABLED on multi-region.
      # 0.1.2 adds the no-upstream opt-out + a fresh version bump to
      # force a re-publish. Pin moves in lockstep per Inviolable
      # Principle #13 (chart-pin bumps must match a GHCR tag that
      # exists — verified post-merge via crane manifest before any
      # fresh-prov walk).
      # 0.1.4 (#3189): prerequisite-check initContainer no longer
      # crashloops on single-region (no cnpg-pair) — exits 0 + idle-Ready.
      # 0.1.7 (#3492): raft-transition promote step CORRECTED to OpenBao OSS
      # peers.json recovery (write single-voter peers.json + restart the
      # survivor Pod) — transition-to-primary is NOT an OSS command (openbao
      # PR #996), the 0.1.6 promoter would have failed on a real region-kill.
      # RBAC adds pods `delete` (the restart). Pin moves in lockstep
      # (Inviolable Principle #13).
      # 0.1.9 (#4257): pure version bump (image still 9c91a7e) to force
      # Flux to re-pull — the 0.1.8 deploy-bot image-tag overwrite did not
      # change the version so the #4254 k8s-lease controller never rolled.
      # 0.1.10 (#4901): controller surfaces a lost REQUIRED synchronous
      # hot-standby on the cnpg-pair Continuum CR status it owns — phase
      # Healthy->Degraded + standbyAvailable/hotStandbyAbsent fields + a
      # StandbyAvailable=False/StandbyUnreachable condition when the
      # pair's replica-role Cluster half is not Ready or readyInstances=0
      # (the G12 region-kill drill posture; before this the CR stayed
      # Healthy/lag=0 through the whole outage). Naming mirrors the
      # catalyst-api DR-panel projection (#4905). Pin moves in lockstep
      # (Inviolable Principle #13).
      # 0.1.11 (#5125 Defect-2): step-8 re-clone-on-divergence — on
      # region-a resume the returning cnpg-pair half's walreceiver can
      # crash-loop with "highest timeline N of the primary is behind
      # recovery timeline N+1"; the per-CR reconcile loop now detects
      # that exact divergence signature (standby un-Ready + TimelineID
      # strictly ahead of the acting primary — never on a healthy
      # rejoin or ordinary catch-up lag) and drives the proven manual
      # heal (delete + re-create the diverged Cluster CR to force a
      # pg_basebackup re-clone), bounded to 3 attempts with linear
      # backoff, failing loud via a continuum-error audit + a False/
      # RejoinRepairBounded condition rather than looping forever. Pin
      # moves in lockstep (Inviolable Principle #13).
      # 0.1.12 (#4901 follow-up): standby-GONE detection + flap-grace —
      # a replica Cluster CR deleted outright (cluster deleted / region
      # wiped) previously read "no determination", preserving the prior
      # StandbyAvailable=True condition forever (false-green). The
      # controller now remembers the last-resolved replica (seeded from
      # status.standbyReplicaCluster across restarts) and degrades with
      # reason StandbyAbsent when it vanishes; present-but-not-Ready
      # keeps StandbyUnreachable. Both are gated behind a continuous-
      # unavailability grace window (spec.standbyGraceSeconds, default
      # 30s) so a flapped probe never flips the CR; recovery surfaces
      # immediately. Pin moves in lockstep (Inviolable Principle #13).
      # 0.1.13: cross-region cnpg-pair planned switchover (bootstrap-kit
      # substitute seam + region-B client via cutover-secondary-kubeconfigs);
      # RBAC adds kustomizations get+patch on resourceNames [bootstrap-kit].
      # Pin moves in lockstep (Inviolable Principle #13).
      # 0.2.0 (ADR-0015 D8, Refs #7067): native topology transitions —
      # phase commits to Git + Git lease + region-loss detection, in every
      # region; the imperative switchover sequencer is deleted. Ships the
      # Continuum CRD in crds/. Pin moves in lockstep (Inviolable Principle #13).
      version: 0.2.1-hw307.1
      sourceRef:
        kind: HelmRepository
        name: bp-continuum
        namespace: flux-system
  install:
    timeout: 10m
    disableWait: true
    # The Continuum CRD rides in the chart's crds/ (byte-identical to
    # bp-catalyst-platform's copy — scripts/check-continuum-crd-lockstep.sh).
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    timeout: 10m
    disableWait: true
    crds: CreateReplace
    remediation:
      retries: 3
  # Per-Sovereign overlay surface.
  #
  # enabled — ${CONTINUUM_ENABLED:-false} (cloud-init emits true on a
  # multi-region Sovereign). region / regionsJson / git.writerRegionID come
  # from the per-region bootstrap-kit substitutes, so the SAME file renders
  # every region's Continuum: region = this region's canonical id; the writer
  # Gitea is the primary region's (reached as gitea-<writer-id> over
  # ClusterMesh from a follower region).
  #
  # Image tag — NOT overridden here. The chart's values.yaml carries the
  # canonical SHA-pinned `continuum.image.tag` (auto-bumped on every push to
  # main by .github/workflows/build-continuum-controller.yaml).
  values:
    # #4885 (Refs #3379): imageRegistry override seam — same pattern as
    # slot 13 bp-catalyst-platform + slot 56 bp-openova-flow-server. Empty
    # literal default at Phase 1 (pre-cutover) → the chart helper's
    # `{{ if ne (.Values.global.imageRegistry | default "") "" }}` (continuum
    # templates/_helpers.tpl `continuum.image`) falls back to the literal
    # ghcr.io repository. Cutover step-07 (#4885, via
    # .Values.imageRegistryPivot.additionalHRs) patches this HR's
    # spec.values.global.imageRegistry live AND durably edits THIS file in
    # local Gitea, replacing the empty string with the local Harbor host so
    # continuum-controller pulls registry.<sov-fqdn>/openova-io/openova/
    # continuum-controller under the deny-egress hold (image native-pushed by
    # cutover step-03). Without this seam the live HR patch is reverted by the
    # next Flux Kustomization reconcile. 6-space indent on `imageRegistry:` is
    # REQUIRED — step-07's sed matches `^      imageRegistry:`.
    global:
      imageRegistry: 'registry.hw307.omani.works'
    continuum:
      enabled: ${CONTINUUM_ENABLED:-false}
      # ADR-0015 D8 — this region, the region registry, the writer Gitea.
      region: '${SOVEREIGN_REGION_CANONICAL_LABEL:-}'
      regionsJson: '${SOVEREIGN_REGIONS_JSON:-[]}'
      git:
        writerRegionID: '${SOVEREIGN_PRIMARY_REGION:-}'
      # ── harbor-proxy-pull compliance (#3195) ──────────────────────────
      # continuum-controller runs in targetNamespace catalyst-system; the
      # kyverno `harbor-proxy-pull` ClusterPolicy (Enforce) requires every
      # container to match `*/proxy-*/*` or `*/openova-io/*`. The controller
      # image is the private `ghcr.io/openova-io/openova/continuum-controller`
      # pulled via the `ghcr-pull` Secret — the same pattern every sibling
      # catalyst-system controller uses. The Pod has no initContainer.
