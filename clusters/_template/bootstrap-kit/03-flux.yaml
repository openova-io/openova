# bp-flux — Catalyst bootstrap-kit Blueprint. Host-level Flux. Per-vcluster Flux is bootstrapped later by environment-controller.
#
# Wrapper chart: platform/flux/chart/
# Catalyst-curated values: platform/flux/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.
#
# DOUBLE-INSTALL SAFETY (omantel.omani.works incident, 2026-04-29)
# ----------------------------------------------------------------
# Cloud-init pre-installs Flux core via
#   curl https://github.com/fluxcd/flux2/releases/download/v2.4.0/install.yaml
# so that this very HelmRelease can be reconciled. helm-controller then
# runs `helm install` for bp-flux on top of the already-running Flux. If
# the chart's subchart `flux2` version disagrees with the cloud-init
# install (different upstream Flux release), CRD `storedVersions`
# mismatches → Helm install fails → rollback → rollback DELETES the
# running Flux controllers → cluster has no GitOps engine and is
# unrecoverable in-place.
#
# Mitigations applied here:
#   1. bp-flux:1.1.3 pins the `flux2` subchart at 2.14.1 (= appVersion
#      2.4.0) which matches cloud-init's v2.4.0 install.yaml.
#   2. spec.upgrade.preserveValues: true — never silently overwrite
#      operator overlays on upgrade.
#      controller adopts the cloud-init-installed objects rather than
#      re-creating, so install is non-destructive when objects already
#      exist with matching apiVersion/kind/name.
# See docs/RUNBOOK-PROVISIONING.md §"bp-flux double-install".
---
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-flux
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-flux
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "03"
spec:
  interval: 15m
  releaseName: flux
  targetNamespace: flux-system
  dependsOn:
    - name: bp-cert-manager
  chart:
    spec:
      chart: bp-flux
      # 1.2.1 (Fix #158): stuckHelmReleaseRecovery image switched from
      # bitnami/kubectl:1.31 (deleted from Docker Hub 2025-08) to
      # bitnamilegacy/kubectl:1.31.4. (Catches up from 1.1.3 → 1.2.1.)
      # 1.2.2 (Fix #163): explicit harbor.openova.io proxy-dockerhub
      # prefix on the kubectl image (MIRROR-EVERYTHING).
      # 1.2.3 (TBD-A66, #1989): stuckHelmReleaseRecovery script gains
      # a SECOND detection branch for `Ready=Unknown +
      # status.history[0].status=deployed` (apiserver-flap on slow
      # secondary CPs). Direct status-subresource patch with audit
      # annotation, RBAC extended for helmreleases/status patch verb.
      # 1.2.4 (TBD-A66-followup, #1995): observability fix — the
      # status-subresource patch in 1.2.3 swallowed stderr via `2>&1`
      # so silent failures looked identical to silent successes.
      # 1.2.4 captures stderr to a temp file and emits structured
      # `[A66]` log lines (detection / success / failure-with-stderr).
      # RBAC was already correct in 1.2.3.
      # 1.2.7 (#3735): all 6 Flux controller images + flux-cli proxied onto
      # harbor.openova.io/proxy-ghcr/fluxcd/*; paired with the postRenderers
      # RollingUpdate patch below that closes the source-controller Recreate
      # serving-gap (Ready 26→7 regression on hw157).
      version: 1.2.7
      sourceRef:
        kind: HelmRepository
        name: bp-flux
        namespace: flux-system
  # Event-driven install: bp-flux adopts the cloud-init-installed Flux
  # controllers; the helm-controller pod that reconciles THIS HR is itself
  # a target of the chart, so blocking on Ready=True is structurally
  # impossible. disableWait avoids the deadlock. Replaces PR #221 timeout.
  install:
    timeout: 15m
    disableWait: true
    # Adopt cloud-init-installed Flux objects rather than fail on
    # ownership conflict (the objects exist before the HelmRelease ever
    # reconciles). Without this, the very first reconcile would error
    # with "object already exists" on every Flux controller Deployment.
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    disableWait: true
    # Keep operator-supplied values (e.g. resource overrides applied via
    # helm-controller out-of-band, or dry-run patches during incident
    # response) on chart upgrades. Without this, every upgrade would
    # reset the chart to default values, masking operator state.
    preserveValues: true
    # Match install behaviour — adopt rather than fail on conflict.
    remediation:
      retries: 3
  # ── #3735 (2026-06-17): source-controller serving-gap fix ─────────────
  # ROOT CAUSE (live on hw157, Ready 26→7 regression): the flux2 2.14.1 chart
  # applies curated resource limits + leader-election args to source-controller
  # (platform/flux/chart/values.yaml). Those differ from the bare cloud-init
  # install.yaml spec, so the FIRST bp-flux reconcile rolls the Deployment. The
  # chart HARDCODES `spec.strategy.type: Recreate` (template-level, no values
  # knob) AND mounts /data as an emptyDir. Recreate kills the old
  # source-controller pod BEFORE the new one is Ready → during the new pod's
  # cold image-pull + cache rebuild there is NO source-controller serving
  # artifacts → every HelmRelease + the bootstrap-kit Kustomization gets
  # `dial tcp …:80: connection refused` / ArtifactFailed and all ~60 HelmCharts
  # must re-fetch → full Ready 26→7 collapse.
  #
  # FIX: post-render-patch source-controller's strategy to RollingUpdate with
  # maxUnavailable:0 (+ maxSurge:1). The OLD pod keeps serving artifacts until
  # the NEW pod passes its /healthz readiness probe, THEN terminates — so there
  # is NO serving gap on the (still one-time) roll. source-controller rebuilds
  # its emptyDir cache lazily per GitRepository/HelmChart reconcile after the
  # cutover, which consumers never observe as a hard `connection refused`.
  #
  # WHY a Flux postRenderer and not a `kubectl patch` in cloud-init: helm-
  # controller owns the source-controller Deployment via the flux2 subchart and
  # re-applies its rendered manifest (strategy:Recreate) on every reconcile,
  # which would REVERT a raw kubectl patch and re-introduce the gap. A
  # postRenderer kustomize patch runs INSIDE helm-controller's own render
  # pipeline, so the patched RollingUpdate strategy IS what helm-controller
  # applies — it can never be reverted. (The image proxying that pairs with this
  # lives in the chart values; the roll-pull then hits Harbor's warm cache.)
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: source-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: source-controller
              spec:
                strategy:
                  type: RollingUpdate
                  rollingUpdate:
                    maxUnavailable: 0
                    maxSurge: 1
                template:
                  spec:
                    containers:
                      # #4849: source-controller default memLimit (384Mi) OOMs
                      # (exit 137) cloning this repo -> each OOM leaves a ~500MB
                      # partial clone in the UNBOUNDED /tmp emptyDir -> /tmp fills
                      # the node disk (91% on hw228) -> node DiskPressure -> the
                      # GitRepository wedges (14h stall, delivery dead). Bump mem
                      # so a full clone fits, and cap the emptyDirs so a clone
                      # loop can never again exhaust the node (it fails its own
                      # pod, not every pod on the node). Patched via postRenderer
                      # because helm-controller owns this Deployment and reverts
                      # a raw kubectl patch.
                      - name: manager
                        resources:
                          limits:
                            memory: 1Gi
                          requests:
                            memory: 256Mi
                    volumes:
                      - name: tmp
                        emptyDir:
                          sizeLimit: 2Gi
                      - name: data
                        emptyDir:
                          sizeLimit: 3Gi
          # ── #6079 (2026-08-11): the four Flux controllers are the ONLY
          # workloads on a node whose image pull carries no credential of its
          # own — so ONE stale node-level registry credential strands the whole
          # GitOps loop, and the controller that would repair it is the one that
          # cannot start.
          #
          # MEASURED, read-only, on the mothership 2026-08-10/11:
          #
          #   Failed to pull ghcr.io/fluxcd/source-controller:v1.8.0: failed to
          #   authorize: failed to fetch oauth token: GET https://ghcr.io/token
          #   ?scope=repository:fluxcd/source-controller:pull -> 403 Forbidden
          #
          # `fluxcd/source-controller` is a PUBLIC repository, and an anonymous
          # token request for that exact scope, egressing from that exact node,
          # returned 200 at the same moment. GHCR answers 401 for "no
          # credentials" and 403 for "credentials I reject", so the 403 is
          # positive evidence that the node presented one. It did not come from
          # k3s: wharfie logs `Using private registry config file at <path>`
          # whenever /etc/rancher/k3s/registries.yaml exists, and that line is
          # absent from the node's k3s start — so the credential came from the
          # kubelet docker keyring (a node-local config.json), which no
          # Kubernetes object shows.
          #
          # kubelet builds that keyring from the pod's imagePullSecrets PLUS the
          # node's own docker-config files, tries every credential that matches
          # the registry, and — the whole defect — NEVER retries anonymously
          # once they have all failed (k8s pkg/kubelet/images/image_manager.go,
          # EnsureImageExists). A public image that would pull fine with NO auth
          # fails BECAUSE auth is configured and stale. There is no anonymous
          # fallback to switch on; the only in-cluster lever is to put a WORKING
          # credential in the pod's keyring, because kubelet returns on the
          # first credential that succeeds.
          #
          # Every other namespace on that node survived the same stale
          # credential for exactly that reason. flux-system did not: `flux
          # install` gives each controller its OWN ServiceAccount
          # (source-/kustomize-/helm-/notification-controller, never `default`),
          # so every default-SA or namespace-level imagePullSecret misses them
          # precisely. Ten days of `deploy:` commits went nowhere.
          #
          # This does NOT make public images require auth, and it does not
          # replace removing the stale node credential — that is the node-side
          # half and is an operator action (runbook on #6079). This half ships
          # in git, is reconciled by helm-controller on every interval, and
          # survives node replacement.
          #
          # WHY a postRenderer, same reason as the patch above: helm-controller
          # owns these ServiceAccounts via the flux2 subchart and re-applies its
          # rendered manifest on every reconcile, so a raw `kubectl patch` would
          # be reverted. The flux2 2.14.1 SA templates expose only
          # `serviceAccount.annotations` — there is no imagePullSecrets value to
          # set — so the render pipeline is the only override point.
          #
          # The `ghcr-pull` Secret already exists in flux-system: cloud-init
          # applies /var/lib/catalyst/ghcr-pull-secret.yaml before Flux
          # bootstraps, and bp-reflector (slot 05a) keeps it mirrored.
          # ServiceAccount imagePullSecrets are injected at POD CREATION, so
          # this takes effect on the next controller pod — which is exactly the
          # re-pull path that failed (image GC, node reboot, controller
          # upgrade), not the first boot.
          #
          # The selector is an ANCHORED regex over every Flux controller
          # ServiceAccount — the four that `flux install` v2.4.0 creates plus
          # image-automation-/image-reflector-controller when an operator
          # enables them, since the exposure is identical for any of them. It
          # deliberately does NOT match the chart's other ServiceAccounts
          # (bp-flux-stuck-hr-recovery, flux-flux-check), which are Job/CronJob
          # identities pulling a Harbor-proxied image on a different path.
          - target:
              kind: ServiceAccount
              name: ^[a-z-]+-controller$
            patch: |
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: flux-controller-pull-credential
              imagePullSecrets:
                - name: ghcr-pull
