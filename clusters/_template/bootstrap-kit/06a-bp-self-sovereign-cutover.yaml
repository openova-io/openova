      retries: 3
  # Per-Sovereign overrides — the chart's values.yaml carries
  # placeholders so smoke renders pass; the real coordinates land
  # here via Flux postBuild ${SOVEREIGN_FQDN} substitution.
  values:
    sovereign:
      fqdn: ${SOVEREIGN_FQDN}
      # #3642/#3926: Harbor runs INSIDE vc-mgmt post-#3642, so harbor-core
      # syncs to the host ONLY as the mangled
      # `harbor-core-x-harbor-x-mgmt-vcluster.mgmt.svc` (the host `harbor` ns
      # holds only the CNPG `harbor-pg-*`). The plain `harbor-core.harbor.svc`
      # NXDOMAIN'd → step-02 (harbor-projects, runs host-side in catalyst ns)
      # wedged the cutover on every post-#3642 prov (root-caused live on hw171,
      # dep 3963e9267c10a90d). bp-mgmt-vcluster (slot 58) now ships a
      # `harbor-core.harbor` ExternalName alias to the mangled name (the proven
      # gitea/keycloak/openbao host-service-aliases mechanism, hw164), so this
      # plain URL resolves again with ZERO change here. Refs #3379 #3926.
      harborInternalURL: http://harbor-core.harbor.svc.cluster.local
      # NB: Harbor HTTPRoute publishes at `registry.<sov>` (see
      # `clusters/_template/bootstrap-kit/19-harbor.yaml` gateway.host),
      # NOT `harbor.<sov>`. Step-06 phase-1 rewrites every HelmRepository
      # to `oci://${harbor_host}/openova-io`, so this MUST be the public
      # hostname that actually answers — `registry.${SOVEREIGN_FQDN}`.
      # Pre-2026-05-18 this said `harbor.${SOVEREIGN_FQDN}`, which no
      # HTTPRoute matched → all post-pivot OCI pulls EOF → bp-sandbox HR
      # never Ready → bootstrap-kit Ks stuck (chicken-and-egg). See
      # t20 debug matrix.
      harborPublicURL: https://registry.${SOVEREIGN_FQDN}
      # #4682 — the registry is now reached via the bare external host on :443
      # through the Gateway-API LoadBalancer Service (cilium-gateway serves :443
      # directly; hostNetwork is OFF, the :30443 NodePort / privileged-bind
      # workaround is GONE). Step-06 pivots every HelmRepository to
      # `oci://registry.${SOVEREIGN_FQDN}/openova-io` (implicit :443, no port
      # append) and both the Flux source-controller pull AND the Phase-3a
      # `helm pull` probe reach it via the external LB host. The former
      # `gatewayHTTPSPort: "30443"` overlay key is removed — no cutover template
      # reads it anymore.
      giteaInternalURL: http://gitea-http.gitea.svc.cluster.local:3000
      giteaPublicURL: https://gitea.${SOVEREIGN_FQDN}
      # G... (#2989, 2026-06-04): Step 07 (catalyst-api-env-patch, Phase 3
      # of PR #3012) pivots CATALYST_PIN_ISSUER + CATALYST_HANDOVER_JWT_
      # ISSUER + the two runtime-config public-URL keys to this value and
      # FATALs ("Pillar 5 independence not met") if it is still the chart
      # default `https://console.example.local`. PR #3012 added that
      # assertion but never added the overlay line here — so the cutover
      # engine FATAL'd at Step 07 on EVERY prov, and since the engine
      # aborts at the first failed step (cutover.go), Steps 08-11 never
      # ran and cutoverComplete stayed false. That leaves the registry
      # tether half-pivoted: Step 06 (cutover-order 6, runs BEFORE 07)
      # already stripped ghcr.io from the ghcr-pull Secret (Phase-0) and
      # rewrote HelmRepository URLs → local Harbor + pushed to local
      # Gitea (Phases 1/2) — but because cutoverComplete never flips
      # true, the Step-01 finalize that SEVERS the gitea mirror (chart
      # 0.1.48) never runs, so the */5 mirror-resync keeps pulling the
      # upstream ghcr.io URLs back from GitHub and reverting Step 06's
      # pivot. Net: ghcr.io creds gone + URLs reverted to ghcr.io → every
      # fresh chart pull 401s "no auth config for ghcr.io". Caught live on
      # hw91. This is the missing lockstep half of #3012; mirror of
      # harbor/giteaPublicURL.
      consolePublicURL: https://console.${SOVEREIGN_FQDN}
    # #4325 de-vcluster re-homed bp-harbor to the native HOST namespace
    # `harbor`; the mgmt plane vCluster + its syncer-mangled
    # `harbor-admin-x-harbor-x-mgmt-vcluster` are gone. bp-harbor mints the
    # plain `harbor-admin` Secret in ns `harbor` and reflects it to the HOST
    # `catalyst` ns (reflector `reflectionAllowedNamespaces: catalyst`,
    # admin-secret.yaml) — where step-02 (harbor-projects) runs. Point the Job's
    # same-namespace secretKeyRef at the host-native name. (HARBOR_ADMIN_USERNAME
    # stays optional → the Job defaults `admin`, matching upstream Harbor's
    # hardcoded admin user.) Refs #3379 #3926.
    harbor:
      adminSecretRef:
        name: harbor-admin
    # #3379 (2026-06-13): enable the REAL 10-minute deny-egress hold for
    # Step-08 (egress-block-test). The chart default
    # (egressTest.enforceCIDRBlock: false, values.yaml) ships the passive
    # assertion-only fallback — it verifies the post-cutover architectural
    # state (local Flux/Harbor URLs) + polls HR/Ks readiness, but it does
    # NOT actually deny egress, so a HIDDEN runtime tether (a Go constant
    # dialing harbor.openova.io, an image pull not routed through a
    # HelmRepository) would pass silently. ADR-0002 + the founder rule are
    # explicit: `cutoverComplete=true` is earned ONLY with the egress-block
    # proof. With this set true, Step-08 resolves github.com / ghcr.io /
    # harbor.openova.io / xpkg.upbound.io → public /32s and applies a
    # cluster-wide CiliumClusterwideNetworkPolicy egressDeny for the
    # survival window (private/loopback IPs are skipped, so intra-cluster
    # traffic is never blocked), then asserts every HelmRelease +
    # Kustomization stays Ready throughout. The Step-08 Job is fail-safe:
    # any resolve/apply error falls back to assertion-only and NEVER wedges
    # the cutover on a tooling failure (see 08-egress-block-test-job.yaml),
    # and the deny policy is torn down on every pass/fail/abort path
    # (inline delete + TERM/EXIT trap). The hold is reversible BY DESIGN
    # (a timed CiliumClusterwideNetworkPolicy, removed at end-of-window) —
    # safe to apply to a converged Sovereign because every blocked host is
    # a tether the preceding steps 01-07 already pivoted off.
    egressTest:
      enforceCIDRBlock: true
      # #5017 keystone (hw242, 2026-07-12): the deny-egress hold must ALLOW
      # the IaaS provider control-plane API so the CSI driver can attach
      # volumes for pods that (re)schedule DURING the hold — step-08's own
      # force-roll guarantees such pods. This was EMPTY on hw242 (the #4596
      # chart comment claimed "cloud-init populates per region" but the
      # population site never existed) → the CCNP omitted the kom4dc API /24
      # (212.72.2.0/24 — ecs/evs/obs/iam/vpc/elb.me-east-215.kom4dc.
      # nationalcloud.om all resolve there) → every EVS attach froze for the
      # whole hold. PROVIDER_API_CIDRS_YAML is an inline-YAML array threaded
      # from infra/providers/<cloud>/variables.tf provider_api_cidrs (Huawei
      # default ["212.72.2.0/24"], Hetzner default []) via the cloud-init
      # postBuild substitute map. Provider API ranges ONLY — the mothership
      # + bastion live in different ranges and stay denied.
      allowProviderCIDRs: ${PROVIDER_API_CIDRS_YAML:=[]}
      # #4975 (Refs #3379 #3695): the Sovereign-local registry host is the FULL
      # `registry.${SOVEREIGN_FQDN}` (bp-harbor's HTTPRoute, see 19-harbor.yaml +
      # harborPublicURL above). The step-08 roll-set classifies a workload as
      # "already local" when its image host contains this substring.
      #   • the chart default `harbor.` was doubly wrong: it EXCLUDED the
      #     harbor.openova.io/proxy-* mothership tether (the DOMINANT tether) from
      #     the roll-set AND did not match the real local host so pivoted refs
      #     were needlessly bounced;
      #   • the former `registry.` (this overlay's prior value) ALSO matched
      #     registry.k8s.io (an EXTERNAL upstream that MUST be rolled).
      # The FULL host classifies correctly. Since chart 0.1.113 step-08 DERIVES
      # this from sovereign.harborPublicURL's host when unset, this override is
      # made explicit for clarity but agrees with the derive.
      localRegistryHostSubstr: "registry.${SOVEREIGN_FQDN}"
    # Wave 5.110 (#2462): bastion mirror endpoint for harbor.openova.io,
    # substituted from cloudinit's flux-system/bastion-mirror Secret
    # (Huawei provider only; Hetzner leaves the var empty → chart skips
    # the mirror entry). The cloudinit-control-plane.tftpl writes the
    # Secret with bastionMirrorEndpoint=http://212.72.24.20:5000 on Huawei
    # provs and empty/missing on Hetzner. Flux's postBuild substituteFrom
    # picks it up at HelmRelease apply time.
    upstream:
      harborProxyMirrorEndpoint: "${HARBOR_PROXY_MIRROR_ENDPOINT:=}"
    # #4885 Defect 1 (Refs #3379 #4061): couple the chart's auto-trigger hook to
    # the operator's fireCutoverOnHandover gate. Before this, the auto-trigger
    # hook Job rendered whenever trigger.auto=true (chart default) and POSTed
    # /api/v1/internal/cutover/trigger — a path gated ONLY by the handover-seal
    # 425, NOT by the operator flag — so an operator setting
    # fireCutoverOnHandover=false (honoured by the catalyst-api reconciler,
    # `[CUTOVER-RECONCILE] dormant: fireCutoverOnHandover=false`, #4061) STILL
    # got an auto-fired cutover. We wire trigger.fireCutoverOnHandover from the
    # SAME ${FIRE_CUTOVER_ON_HANDOVER:-false} Flux postBuild substitution the
    # catalyst-api reads (13-bp-catalyst-platform.yaml catalystApi.
    # fireCutoverOnHandover ← cloud-init FIRE_CUTOVER_ON_HANDOVER), so the hook
    # renders (auto-fires) ONLY on a Sovereign the operator opted in to
    # fire-on-handover. Default false → the cutover fires via the BSS CTA (or the
    # #4669 level-triggered reconciler once the operator flips the flag).
    trigger:
      fireCutoverOnHandover: ${FIRE_CUTOVER_ON_HANDOVER:-false}
    # #5640 (Refs #5265) — POST-CUTOVER artifact delivery. Made explicit here
    # rather than left to the chart default so the posture of every fresh prov
    # is readable in the slot the operator actually reviews.
    #
    # `enabled: true` + `mode: detect` is a ZERO-EGRESS posture: the loop
    # reaches only the local Gitea mirror and the local Harbor, never downloads
    # skopeo and never dials an upstream registry, so the step-08 deny-egress
    # proof and the "no automatic upstream tether" contract are untouched. What
    # it adds is the SIGNAL that hw292 lacked — each cycle publishes the exact
    # set of chart pins and declared images the local Harbor cannot serve to
    # the durable `self-sovereign-cutover-daytwo-missing` ConfigMap (and to the
    # Pod log), which is simultaneously the air-gapped Sovereign's
    # offline-media side-load list.
    #
    # An operator on a managed-update posture flips DAYTWO_RECONCILE_MODE=warm
    # (cloud-init substitution, same seam as FIRE_CUTOVER_ON_HANDOVER above) to
    # turn the signal into delivery: missing charts are helm-pulled/pushed and
    # missing images are skopeo-copied into local Harbor on the operator's own
    # schedule — the exact companion of the Git mirror reaching github.com on
    # that schedule. Private openova-io artifacts additionally need
    # daytwoReconciler.warm.credentialSecret, since step-06 strips the
    # cutover's own ghcr auth by design.
    daytwoReconciler:
      enabled: true
      mode: ${DAYTWO_RECONCILE_MODE:-detect}
