# bp-guacamole — Catalyst bootstrap-kit Blueprint slot 52 (exec
# fan-out, post-W2.K4). Apache Guacamole HTML5 remote-desktop gateway.
# Brokers
# SSH / RDP / VNC sessions AND kubectl-exec sessions through one
# browser-accessible surface. Sessions are authenticated via Keycloak
# SSO, recorded to SeaweedFS for compliance, and reach Pods via the
# per-node bp-k8s-ws-proxy DaemonSet.
#
# Per ADR-0001 §11: ONE Guacamole per Sovereign — no Manara-style
# multi-cluster fan-out (Sovereigns stay self-sufficient).
#
# Wrapper chart: platform/guacamole/chart/
# Catalyst-curated values: platform/guacamole/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.
#
# dependsOn:
#   - bp-cilium                — Pod network + Gateway API for the
#                                operator-facing HTTPRoute.
#   - bp-cert-manager          — TLS for guacamole.<sovereign-fqdn>
#                                via the Cilium Gateway listener.
#   - bp-keycloak              — OIDC issuer + realm-config Job that
#                                consumes the chart's realm-patch
#                                ConfigMap.
#   - bp-sealed-secrets        — OIDC client-secret SealedSecret.
#   - bp-seaweedfs             — RWX-capable PVC for session recordings.
#   - bp-k8s-ws-proxy          — exec tunnelling onto the local-node
#                                kube-apiserver via the DaemonSet.
#
# qa-loop iter-7 Fix #39 (closes the gap surfaced by Fix #36):
# bp-guacamole was previously chart-only, no CI workflow + no
# bootstrap-kit slot, so TC-228/TC-230/TC-245/TC-246 stayed FAIL
# with "deployment NotFound". The CI workflow
# .github/workflows/build-bp-guacamole.yaml mirrors the upstream
# Apache Guacamole images to GHCR, bumps Chart.yaml, dispatches
# blueprint-release; this slot installs the resulting OCI artifact
# on every Sovereign.
#
# install/upgrade.disableWait: true — readiness signalled via Flux
# dependsOn, never via spec.timeout watchdogs.

---
apiVersion: v1
kind: Namespace
metadata:
  name: guacamole
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-guacamole
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-guacamole
  namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  labels:
    catalyst.openova.io/slot: "52"
spec:
  interval: 15m
  releaseName: guacamole
  # Lands in catalyst-system to be co-located with the catalyst-api +
  # k8s-ws-proxy + the rest of the Catalyst control-plane stack. The
  # chart's NetworkPolicies allow cross-namespace egress to keycloak
  # / seaweedfs / nats-jetstream regardless of where it lands.
  targetNamespace: guacamole
  dependsOn:
    - name: bp-cilium
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    - name: bp-cert-manager
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    # G92.2 #2661 (2026-06-01): bp-keycloak HR moved to host ns `mgmt`.
    - name: bp-keycloak
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    - name: bp-sealed-secrets
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    - name: bp-seaweedfs
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    - name: bp-k8s-ws-proxy
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    # #3374 — bp-guacamole now ships a CNPG Cluster CR for its JDBC
    # permission store (admin elevation). bp-cnpg (slot 16) registers the
    # postgresql.cnpg.io/v1 CRD; without this edge the Cluster CR's
    # Capabilities gate would skip on a fresh prov (guacamole installs before
    # cnpg) → no DB → no admin. bp-cnpg before bp-guacamole closes that race.
    - name: bp-cnpg
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  chart:
    spec:
      chart: bp-guacamole
      # 0.1.9 (qa-loop iter-11 Fix #45 Cluster-A): adds the
      # storageClass-migration pre-install/pre-upgrade hook that
      # unwedges Sovereigns where the existing `guacamole-recordings`
      # PVC is bound to a different storageClass than the chart-desired
      # one (live failure on omantel iter-11: PVC bound to local-path,
      # chart wanted seaweedfs-storage, K8s rejected the immutable-spec
      # patch with `cannot patch ... PersistentVolumeClaim ... is
      # invalid: spec: Forbidden: spec is immutable after creation`).
      # 0.1.15 (Fix #158): migrationImage bumped to
      # bitnamilegacy/kubectl:1.30.7 (was 1.29.3); template fallback no
      # longer references bitnami/kubectl (deleted from Docker Hub 2025-08).
      # 0.1.19 (2026-05-12): chart-bump mirror chain caught up — tests/
      # render.sh expect_total realigned from 15 → 19 (Fix #125's
      # bootstrap Job for guacamole-oidc Secret added 4 resources: 1 Job
      # + 1 ServiceAccount + 1 Role + 1 RoleBinding). Prior to the test
      # fix, every Build bp-guacamole run published images but the
      # Blueprint Release dispatched on the bump commit failed render.sh
      # → 0.1.13–0.1.18 were never published to GHCR → bootstrap-kit
      # HRs wedged at "ghcr.io/openova-io/bp-guacamole:0.1.17: not found".
      # 0.1.21 (Refs TBD-G4 / C5-009, 2026-05-18): pulls in PR #1684
      # (guacamole-deployment.yaml mount /home/guacamole instead of
      # /home/guacamole/.guacamole). The official Apache Guacamole
      # image entrypoint runs `rm -rf $GUACAMOLE_HOME` before
      # repopulating the directory on every start; when the emptyDir
      # was mounted directly at /home/guacamole/.guacamole the path
      # was a mount point and `rm` failed with `Read-only file
      # system`, crash-looping the webapp before Tomcat ever booted
      # (observed on t22, 16 restarts). Mounting the parent dir
      # makes .guacamole a regular subdirectory the entrypoint can
      # freely rm and recreate.
      # 0.1.22 (Refs TBD-G6 / C12-004, 2026-05-18): pulls in PR #1692
      # (values default guacamole.httproute.parentRef.namespace
      # gateway-system -> kube-system). The
      # catalyst-system/guacamole-server HTTPRoute on t22 went
      # Accepted=False because gateway-system/cilium-gateway does not
      # exist on any Sovereign — the canonical gateway is
      # kube-system/cilium-gateway installed by 01-cilium.yaml and
      # used by every other Sovereign HTTPRoute.
      # 0.1.23 (Refs TBD-G4 phase 2 / C12-005, 2026-05-18): pulls in
      # PR #1699 (liveness + readiness probe paths flipped from `/`
      # to `/guacamole/`). The Apache Guacamole webapp deploys under
      # Tomcat's context path /guacamole/, not /, so probing `/`
      # made kubelet restart the Pod every ~60s and the kube-system
      # Cilium gateway returned 503 to the public hostname because
      # the Endpoint was never Ready (observed on t22, 5 restarts).
      # 0.1.25 (catch-up for Blueprint Release workflow outage,
      # 2026-05-18 21:04Z → 22:07Z): chart published 0.1.24 → 0.1.25
      # during the YAML scanner break introduced by PR #1858 and fixed
      # by PR #1866. Auto-bump-pin step didn't fire during the outage.
      # Refs #1864.
      # 0.2.0 (G117.5 W3.D1 #2744, 2026-06-02 — BREAKING): SSO
      # consolidation into bp-keycloak 1.4.13 authoritative realm-import.
      # Appends `?kc_idp_hint=catalyst-pin` to OIDC auth endpoint;
      # DELETES the divergent `realm: catalyst` ConfigMap (templates/
      # keycloak-realm-config.yaml); replaces the SealedSecret-with-
      # empty-placeholder path with a chart-managed lookup-or-generate
      # Secret + helm.sh/resource-policy: keep (default ON; opt-out via
      # `guacamole.oidc.chartManagedSecret: false`). Refs #2744.
      # 0.2.2 (#3150, 2026-06-10): default OIDC redirect_uri now carries
      # the `/guacamole/` Tomcat context path (was bare `/` → the
      # implicit-flow id_token fragment landed on a Tomcat 404 ROOT page
      # and silent-SSO never reached the webapp). KC `guacamole` client's
      # `/*` redirectUris wildcard already accepts it.
      # 0.2.3: lockstep with chart bump d232af3f (upstream 1.5.5) — the
      # deploy commit bumped Chart.yaml but the auto-bump pin hook didn't
      # fire, leaving this pin drifted (broke the full lockstep sweep).
      # 0.2.9 — #3374: JDBC permission store + sovereign-admins admin
      # USER_GROUP. The openid extension authenticated SSO users but granted
      # no admin; the new CNPG cluster + schema-seed Job + POSTGRESQL_* env
      # make sovereign-admins members land as guacamole admin on SSO login.
      # 0.2.11 — #3374 admin-tier: un-stall the seed Job (0.2.10 was kyverno-
      # denied → rolled back to 0.2.8). Stamp managed-by:flux on the Job +
      # vendor the schema so it is single-container (no mixed-registry
      # initContainer for harbor-proxy-pull anyPattern to reject).
      # 0.2.17 — #3374 admin group-enrollment: a per-minute admin-enroll CronJob
      # + post-upgrade catch-up write the guacamole_user_group_member row binding
      # SSO users into sovereign-admins → admin DETERMINISTIC. 0.2.16 had the
      # USER_GROUP+ADMINISTER but the membership table stayed empty so the owner
      # got no admin menu (#3475). Proven live on hw133.
      # 0.2.21 — #3642 host-bridge: CNPG Cluster gate honours explicit
      # database.cluster.enabled=false so the placement host-bridge can suppress
      # the in-vCluster Cluster CR (host-rendered instead). Default byte-identical.
      # 0.2.21 (#3687, extends #3370): bootstrap self-registration — the
      # chart renders the canonical apps.openova.io/v1 Application CR for
      # this slot's HelmRelease so the console /apps list, per-app Topology
      # tab + showback resolve guacamole (no more "no Application CR").
      # 0.2.30 (#5358): SSO switched to the DEFAULT sso.mode=header — the
      # slot-13c bp-oidc-gate `guacamole` instance now owns
      # guacamole.<fqdn> and runs the Keycloak authorization-code flow
      # server-side; the webapp consumes the gate's X-Forwarded-Email via
      # guacamole-auth-header. The chart no longer renders its own
      # HTTPRoute (gate owns the hostname) and the native openid implicit
      # flow (fragment-replay "invalid/old nonce" on hw288, UAT rows
      # 35/115) is retired from the canonical path — values below drop
      # httproute + oidc.issuer accordingly.
      # 0.2.34 (#5598): API_SESSION_TIMEOUT=10080 — the webapp REST token
      # previously died on the upstream 60-minute default while the
      # oidc-gate session lives ~168h, so any >60-min revisit reused the
      # dead cached GUAC_AUTH token → 403 PERMISSION_DENIED on every
      # session API call → bare "An error has occurred" page (UAT rows
      # 35/115 on hw292). Session lifetime now matches the gate cookie.
      version: 0.2.35
      sourceRef:
        kind: HelmRepository
        name: bp-guacamole
        namespace: flux-system
  install:
    createNamespace: true  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    timeout: 15m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
  # Per-Sovereign overlay surface. The Sovereign's FQDN is interpolated
  # at Flux apply time via the bootstrap-kit Kustomization's
  # postBuild.substitute env hook (see clusters/_template/README.md +
  # infra/hetzner/cloudinit-control-plane.tftpl) — `${SOVEREIGN_FQDN}`
  # below is replaced with the concrete sovereign FQDN before the HR
  # bytes land in the cluster.
  values:
    # #4885 / #4892: global.imageRegistry override seam for the step-07 cutover
    # image-registry pivot (imageRegistryPivot.additionalHRs). step-07 patches
    # this HR's spec.values.global.imageRegistry live AND durably sed-edits THIS
    # file — the sed matches `^      imageRegistry:`, so the 6-space indent is
    # REQUIRED. Empty default = verbatim ghcr.io (byte-identical pre-cutover).
    global:
      imageRegistry: ''
    # ── Bootstrap self-registration (#3687, extends #3370) ──────────────
    # The chart self-registers the Application CR for guacamole (the
    # canonical instance representation every console surface reads),
    # marked spec.bootstrap=true so the application-controller ADOPTS this
    # HR's install instead of re-rendering it (zero duplicate HRs).
    bootstrapOwned:
      enabled: true
      helmRelease:
        name: bp-guacamole
        namespace: flux-system
    guacamole:
      database:
        cluster:
          enabled: true  # #4291 DE-VCLUSTER — guacamole renders its OWN CNPG Cluster natively in host ns `guacamole` (host cnpg-operator reconciles it; was suppressed by the #3642 host-bridge)
          # #3971 (Refs #3992 #4012) — name the per-provider durable CSI class
          # explicitly so the guacamole-pg PVC is NEVER created classless. An
          # UNSET storageClassName freezes to "" the instant a PVC is created
          # before any default StorageClass exists, permanently stranding it
          # Pending (caught live on hw174: guacamole-pg-1 Pending<empty> → the
          # guacamole DB never came up). A NAMED class keeps the PVC Pending
          # (recoverable) until the class lands, then binds — race-immune.
          # Sourced from cloud-init per-provider env (hcloud-volumes on Hetzner,
          # evs-ssd on Huawei); empty default preserves the legacy
          # omit-when-empty CI `helm template` path.
          storageClass: ${SOVEREIGN_CNPG_STORAGE_CLASS:=}
      # Default-OFF gate flipped ON by the bootstrap-kit slot. Operator
      # opts out per-Sovereign by removing this slot from
      # clusters/<sovereign>/bootstrap-kit/kustomization.yaml.
      enabled: true
      # #5358 — SSO via the slot-13c bp-oidc-gate `guacamole` instance
      # (authorization-code flow at the gate + guacamole-auth-header
      # behind it). The gate's HTTPRoute OWNS guacamole.${SOVEREIGN_FQDN}
      # (see 13c-bp-oidc-gate.yaml), so this chart renders NO HTTPRoute in
      # header mode and the former `oidc.issuer` value is retired (the
      # native guacamole-auth-sso-openid implicit flow replayed its
      # single-use nonce on every SPA route change — "Rejected OpenID
      # token with invalid/old nonce" live on hw288, UAT rows 35/115).
      # `header` is the chart default; pinned here explicitly so the
      # canonical prov path never drifts on a chart-default change.
      sso:
        mode: header
      httproute:
        enabled: false  # #5358 — the slot-13c oidc-gate HTTPRoute owns guacamole.${SOVEREIGN_FQDN}; two HTTPRoutes on one hostname is undefined routing
      recordings:
        # SeaweedFS-CSI is the canonical RWX storageClass for
        # multi-pod session-recording workloads on Sovereigns; see
        # platform/seaweedfs/chart values.yaml for the StorageClass
        # name. Per-Sovereign overlay can override for non-SeaweedFS
        # backends (e.g. hcloud-volumes single-node fallback).
        storageClass: seaweedfs-storage
