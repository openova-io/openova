# bp-cnpg-pair — Catalyst bootstrap-kit Blueprint slot 16b.
# (Pillar-3 cross-region DR primitive — EPIC-6 slice C-DB-1 #1101.)
#
# Active-hot-standby CNPG cluster-pair across two Sovereign regions.
#
# ─── SPLIT-SIDE MODEL (chart 0.2.0) — each cluster renders ITS half ──
# A 2-region Sovereign is TWO SEPARATE k3s clusters joined by Cilium
# ClusterMesh (kom4dc mimics the regions with 2 VPCs) — NOT one
# stretched cluster. So this HR is applied on BOTH control planes and
# `cnpgPair.side` (stamped from the per-region SOVEREIGN_REGION_ROLE
# substitute below) selects which half each cluster renders:
#   side=primary (region-A cluster):
#   - Primary postgresql.cnpg.io/v1.Cluster CR pinned to region A
#   - `<name>-primary-mesh` Service annotated
#     `service.cilium.io/global: "true"` so ClusterMesh publishes the
#     primary's read-replica endpoint across every connected peer
#   - audit-config ConfigMap (label
#     `catalyst.openova.io/audit-config: "true"`) that bp-continuum's
#     prerequisite-check probes to switch from idle to active
#     (bp-continuum slot 62 runs on the primary cluster).
#   side=replica (region-B cluster, SOVEREIGN_REGION_ROLE=secondary —
#   the chart normalizes "secondary" → replica):
#   - Replica Cluster CR pinned to region B (replica.enabled: true +
#     bootstrap.pg_basebackup + externalClusters[] streaming the
#     primary's WAL over Cilium ClusterMesh)
#   - local `-primary-mesh` Service stub (Cilium merges global
#     services by name+namespace across clusters; zero local backends
#     → traffic crosses the mesh to the primary)
#   - failover-readiness probe (its region-B node-affinity now matches
#     the cluster it runs on).
#
# Chart ≤0.1.x declared the whole pair ONCE on the primary cluster
# (this slot suspended on secondaries via SECONDARY_HR_SUSPEND) and
# relied on node-affinity to "schedule each side to its region" — that
# only works on a single stretched cluster. On hw126 the replica-side
# workloads could NEVER schedule: FailedScheduling 0/4 nodes, affinity
# requires openova.io/region=hw-me-east-215-b-rtz-prod while every
# cluster-A node is ...-a-rtz-prod. 0.2.0 removes the suspend and
# splits the render per side.
#
# ─── Why this slot exists (Pillar-3 gap closure, #3195 / Refs #3189) ──
# The DESIGN.md gap analysis (docs/sessions/2026-06-10/pillar3-multi
# region-design/DESIGN.md) found a live 2-region Sovereign is TWO fully-
# independent region stacks with NO cross-region replication link. The
# bootstrap-kit shipped `62-bp-continuum.yaml` but no cnpg-pair slot, so
# a fresh prov never installed the primary/replica pair, the ReplicaCluster,
# or the `*-primary-mesh` global Service — bp-continuum had nothing to
# reconcile (idle forever). This slot closes G1/G2/G4/G5: it deploys the
# bp-cnpg-pair primitive so the cross-region DR layer materialises on a
# multi-region prov. ClusterMesh peering itself (G3) is already auto-
# established by catalyst-api (handler/clustermesh.go AutoEstablishCluster
# Mesh, fired from phase1_watch.go on multi-region) — this slot consumes
# the mesh, it does not set it up.
#
# ─── SAFE-BY-DEFAULT gate — single-region renders ZERO resources ──────
# `cnpgPair.enabled` is wired to ${SOVEREIGN_ENABLE_HOT_STANDBY:-false}.
# The cloud-init substitute SOVEREIGN_ENABLE_HOT_STANDBY is "false" for
# every single-region prov (tofu derives it from var.bcp_topology;
# single-region => "false"). The chart renders ZERO Kubernetes resources
# when cnpgPair.enabled=false (verified: `helm template` of the default
# values emits no manifests) — so a single-region Sovereign is byte-
# identical to today (the HR object exists but installs an empty release).
# This is the same default-OFF knob shape as CONTINUUM_ENABLED (slot 62)
# and MARKETPLACE_ENABLED / SANDBOX_ENABLED. Operators NEVER flip this by
# hand — it auto-flips true only when the Sovereign was provisioned multi-
# region (bcp_topology=active-hotstandby).
#
# ─── Region pinning ──────────────────────────────────────────────────
# primary.region / replica.region are stamped from the cloud-init
# substitutes SOVEREIGN_PRIMARY_REGION / SOVEREIGN_REPLICA_REGION
# (canonical `hw-<code>-rtz-prod` / `hz-<code>-rtz-prod` labels matching
# the openova.io/region node label the Cluster CR node-affinity pins on).
# On single-region SOVEREIGN_REPLICA_REGION is empty — but the chart is
# disabled there anyway, so the empty replica region never reaches a
# render that would trip the chart's `validateRegions` distinct-region
# fail-fast.
#
# ─── Image — harbor-proxy-pull compliance (kyverno Enforce) ───────────
# The CNPG postgres binary image MUST flow through the Sovereign Harbor
# proxy (kyverno `harbor-proxy-pull` ClusterPolicy, Enforce). The cnpg-
# pair namespace (`cnpg`) is NOT in the kyverno complianceDefaultExcludes
# list, so the default chart repo `ghcr.io/cloudnative-pg/postgresql`
# would be DENIED at admission. We override to
# `harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql` — the exact
# prefix bp-harbor + bp-gitea use for their CNPG Clusters (public image,
# proxy-ghcr serves it cred-free pre-cutover; cutover Step-04's containerd
# mirror redirects harbor.openova.io → local Harbor post-handover).
#
# ─── dependsOn ───────────────────────────────────────────────────────
#   - bp-cnpg (slot 16) — owns the postgresql.cnpg.io/v1.Cluster CRD +
#     the mutating webhook the Cluster CR apply gates on. Without this
#     edge the Cluster CR apply fails ("no endpoints available for
#     service cnpg-webhook-service").
#   - bp-cilium (implicit via bootstrap-kit ordering) — provides the
#     ClusterMesh transport the replica's WAL stream rides. Not listed in
#     dependsOn because Cilium is slot 01 (always Ready before this slot).
#
# ─── targetNamespace `cnpg` MUST be pre-created by this slot ───────────
# The HR's targetNamespace is `cnpg` (below). Flux/Helm writes the release
# storage Secret into that namespace on EVERY install — including a gated-
# OFF, zero-resource (empty) release. If the namespace does not exist the
# install fails with `namespaces "cnpg" not found` (caught live on hw124:
# the slot installed but `cnpg` was never created — slot 16/bp-cnpg makes
# `cnpg-system` for the OPERATOR, and every CNPG consumer (gitea/harbor/
# powerdns/sme/newapi) places its Cluster CR in its OWN namespace, so
# nothing ever created `cnpg`). Every sibling slot that targets a fresh
# namespace (16-cnpg → cnpg-system, 16a → shared-data, 17-valkey → valkey)
# declares it here. So this slot must create `cnpg` UNCONDITIONALLY —
# independent of the cnpgPair.enabled gate, because even the empty release
# needs the namespace to land its Helm release Secret.
#
# Wrapper chart: platform/cnpg-pair/chart/
# Catalyst-curated values: platform/cnpg-pair/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.

---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-cnpg-pair
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-cnpg-pair
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "16b"
    catalyst.openova.io/component: cnpg-pair
    openova.io/category: customer-facing-capability
    openova.io/epic: "6"
spec:
  # BOTH-clusters HR (chart 0.2.0 split-side) — every region's control
  # plane applies this HR; `cnpgPair.side` (below) makes each cluster
  # render exactly its own half of the pair. The former
  # SECONDARY_HR_SUSPEND suspend is REMOVED: suspending on secondaries
  # was the ≤0.1.x single-manifest model, under which the replica-side
  # workloads (pinned to region-B node labels) could never schedule on
  # the primary cluster (hw126 FailedScheduling — see header).
  interval: 15m
  releaseName: cnpg-pair
  # targetNamespace = cnpg — same namespace bp-harbor/bp-gitea place their
  # CNPG Cluster CRs in, where the CNPG operator (cluster-wide watch)
  # reconciles them. The chart uses .Release.Namespace for every resource.
  targetNamespace: cnpg
  dependsOn:
    - name: bp-cnpg
  chart:
    spec:
      chart: bp-cnpg-pair
      # 0.1.2 — synchronous replication default (remote_apply +
      # synchronous_standby_names FIRST 1) for Pillar-3 zero-tx-loss.
      # 0.1.3 (#3195) — optional production Continuum CR seed (gated
      # continuum.enabled, default-OFF; not flipped by this slot until
      # the canonical 4-segment region labels are validated on a fresh
      # 2-region prov — Phase-2 acceptance). The primary/replica/audit/
      # probe path is unchanged from 0.1.2.
      # 0.1.4 (Refs #3236 / #2737) — kyverno-Enforce compliance re-cut.
      # The cnpgPair gate flipped TRUE on hw126 (#3238), so the failover-
      # readiness Deployment hit kyverno Enforce admission for the first
      # time and was DENIED on cilium-l7-mtls / probes-present / harbor-
      # proxy-pull / image-tag-pinned. 0.1.4 adds the enforced label, a
      # livenessProbe, and Harbor-proxies the default image. The default
      # image.repository now equals this slot's override, so the inline
      # override below is redundant but kept explicit for clarity.
      # 0.2.0 (Refs #3236 / #3195 / #2737) — split-side topology. New
      # `cnpgPair.side` keyed off SOVEREIGN_REGION_ROLE; this HR now
      # applies on BOTH control planes (suspend removed) and each
      # cluster renders only its own half of the pair. See the slot
      # header + the chart changelog for the full design note.
      # 0.2.1 (Refs #3236 / #3195 / #2737) — both per-side ingress
      # NetworkPolicies now allow the CNPG operator (cnpg-system) to the
      # instance status (8000) + metrics (9187) ports. Without it the
      # Ingress-only policies default-denied the operator's status probe
      # and the Cluster phase stalled at "Instance Status Extraction
      # Error" on hw126 despite the instance being 1/1 Running.
      # 0.2.2 (hw130): replication netpol also allows OWN-cluster 5432 —
      # it default-denied the primary's own instance-2 join (>1h wedge).
      # 0.2.3 (#3195 G6): production Continuum seed flipped ON (real
      # region labels; CRD pattern relaxed in lockstep, catalyst chart).
      # 0.2.5 (#3740): cross-region replica pinned as the synchronous
      # standby (standbyNamesPre + maxStandbyNamesFromCluster:0) → RPO=0.
      # 0.2.6 (#3740): replication-source mesh Service flipped
      # selectorType r→rw so the cross-region replica streams from the
      # PRIMARY's walsender (not a cascaded local standby) → sync_state=sync.
      # 0.2.9 (#4846): identity-based cross-region DR CiliumNetworkPolicy
      # (crossRegionPeerClusters) replaces the inert ipBlock.
      # 0.2.11 (#5133): failover-readiness probe fix — authenticates as
      # streaming_replica (postgres superuser disabled) and measures apply
      # lag via LSN receive-vs-replay so a caught-up SYNCHRONOUS standby is
      # correctly Ready/promotable. Unblocks region-kill DR promotion (P3).
      # 0.2.12 (#5125 Defect-1): replica.enabled follows the
      # cnpgPair.replica.promoted VALUE, so region-kill failover flips the
      # region-B HR desired state (spec.values...promoted=true) instead of a
      # live-object patch flux drift-correction reverted mid-outage (hw256 G12).
      # 0.2.13 (#5137): region-B AUTOMATIC DR promotion — side=replica adds a
      # dr-promoter Deployment (Deployment NOT CronJob, #5157) that patches
      # THIS HR's desired state (spec.values.cnpgPair.replica.promoted=true,
      # the #5125-D1 seam) when the primary's WAL stream has been dead ≥120s
      # AND failover-readiness is Ready — automatic RPO=0 region-kill
      # failover with zero operator action. sync-mode-only (data fence).
      # 0.2.14 (#5178): dr-promoter regression fix — the 0.2.13 promoter
      # false-promoted a healthy replica against a live region-A and its
      # promote was non-durable, running the region-B timeline away on hw266
      # G12 (TL2→TL25). Adds (A) a POSITIVE region-A liveness gate (pg_isready
      # of `-primary-mesh` over the mesh, gated on crossRegionPeerClusters) +
      # startup grace, and (B) a durable SUSPEND latch + anti-flap guard. The
      # existing SOVEREIGN_PEER_CLUSTERMESH_NAMES wiring (below) is what arms
      # the liveness gate — no new substitute.
      version: 0.2.14
      sourceRef:
        kind: HelmRepository
        name: bp-cnpg-pair
        namespace: flux-system
  # Drift detection (hw126 lesson): helm does not re-apply deleted/mutated
  # resources on reconcile, so a removed Cluster CR stays gone until the next
  # chart bump. With drift correction the HR self-heals its rendered set —
  # the zero-touch contract for the DR-critical pair.
  driftDetection:
    mode: enabled
  install:
    timeout: 15m
    # disableWait: the replica ReplicaCluster only reaches Ready once it
    # has streamed a basebackup from the primary over ClusterMesh, which
    # depends on the mesh being established (catalyst-api auto-establishes
    # it AFTER Phase-1 converges). Blocking the HR on full pair readiness
    # would deadlock the bootstrap. Flux re-reconciles to Ready out-of-band.
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
  # ── Per-Sovereign overlay surface ──────────────────────────────────
  values:
    cnpgPair:
      # ── ClusterMesh-gated enable (NOT raw 2-region) ─────────────────
      # SAFE-BY-DEFAULT: false → chart renders ZERO resources → byte-
      # identical to a Sovereign without this slot.
      #
      # 🛑 This gate is DELIBERATELY DECOUPLED from ${SOVEREIGN_ENABLE_HOT_
      # STANDBY}. A 2-region prov flips HOT_STANDBY=true purely because
      # len(req.Regions) >= 2 (provisioner.go bcpTopologyEnableHotStandby),
      # but the cross-region replica only reaches Ready once Cilium
      # ClusterMesh is ACTUALLY established between the regions AND the
      # `*-primary-mesh` global Service is published. On hw124 — a real
      # 2-region prov where ClusterMesh was NOT wired — gating on raw
      # HOT_STANDBY rendered the primary+replica pair, whose replica then
      # could never stream a basebackup (no mesh) → the pair never
      # converged. Worse, the pair tried to install into a `cnpg`
      # namespace nothing created → `namespaces "cnpg" not found` ×7.
      #
      # So this slot gates on its OWN substitute SOVEREIGN_ENABLE_CNPG_
      # PAIR, default-OFF. Unregistered in the provisioner substitute map
      # (same as SOVEREIGN_ENABLE_SHARED_PG / CONTINUUM_ENABLED /
      # NETBIRD_ENABLED) → Flux postBuild applies the inline `:-false`
      # default → every prov (single OR multi-region) renders an empty,
      # Ready release UNTIL an operator confirms ClusterMesh is up and
      # flips SOVEREIGN_ENABLE_CNPG_PAIR=true on the per-Sovereign overlay
      # (alongside SOVEREIGN_PRIMARY_REGION / SOVEREIGN_REPLICA_REGION,
      # which the chart `required`s when enabled=true). This is the
      # canonical "default-OFF until the dependency is truly wired" knob
      # shape — the cnpg-pair is a wire-it-when-the-mesh-is-confirmed
      # primitive, not an auto-fire-on-2-region one.
      #
      # 🛑 NOTE (split-side): because slot 16b now applies on EVERY
      # region's control plane, the post-mesh flip (catalyst-api
      # handler/clustermesh.go enableCNPGPairAfterFullMesh, #3236/#3238)
      # patches SOVEREIGN_ENABLE_CNPG_PAIR=true onto the bootstrap-kit
      # Kustomization of ALL regions — flipping only the primary would
      # activate side=primary while cluster-B keeps rendering an empty
      # release (no replica, no WAL stream).
      enabled: ${SOVEREIGN_ENABLE_CNPG_PAIR:-false}
      # ── Side — WHICH HALF this cluster renders (chart 0.2.0) ───────
      # SOVEREIGN_REGION_ROLE is the per-region cloud-init substitute
      # (infra/providers/_shared/cloudinit-control-plane.tftpl; value
      # domain primary|secondary from each provider's
      # sovereign_region_role — hetzner main.tf stamps the literal,
      # huawei derives it from the region index). The chart normalizes
      # "secondary" → replica. Default "primary" keeps a single-region
      # prov (where the gate is OFF anyway) byte-identical.
      side: ${SOVEREIGN_REGION_ROLE:-primary}
      primary:
        # Canonical region label (matches openova.io/region node label).
        region: '${SOVEREIGN_PRIMARY_REGION:-}'
      replica:
        region: '${SOVEREIGN_REPLICA_REGION:-}'
      networkPolicy:
        # crossRegionPeerClusters (#4846) — admit the PEER region's Pods to the
        # pair's 5432 by CLUSTER IDENTITY. A k8s `ipBlock` (the reverted #4846
        # first attempt) is INERT for ClusterMesh traffic: it matches only a CIDR
        # identity, which Cilium assigns solely to NON-endpoint IPs, so the
        # region-b replica (a known remote endpoint) is `match none` → deny →
        # "Creating a new replica" wedge (proven hw228). The chart renders an
        # identity-based CiliumNetworkPolicy selecting io.cilium.k8s.policy.cluster
        # instead. SOVEREIGN_PEER_CLUSTERMESH_NAMES is stamped by catalyst-api
        # (enableCNPGPairAfterFullMesh) with the peer region's mesh name(s) at the
        # post-mesh flip, as a YAML flow-sequence e.g. [hw228-mesh]. Only consumed
        # when cnpgPair.enabled (AHS); a single-region prov (gate OFF) + the
        # DEFAULT [] render NO CiliumNetworkPolicy (byte-identical).
        crossRegionPeerClusters: ${SOVEREIGN_PEER_CLUSTERMESH_NAMES:-[]}
      # ── Continuum DR contract seed (#3195 G6, flipped 2026-06-12) ──
      # Renders the production Continuum CR so continuum-controller has
      # a real DR contract to reconcile (it was idle on every prov —
      # `kubectl get continuum -A` empty, verified hw130). Gating: the
      # chart renders this ONLY when cnpgPair.enabled is ALSO true, so
      # single-region provs (gate OFF) stay byte-identical. The region
      # labels carry the REAL canonical labels — the Continuum CRD
      # pattern was relaxed in lockstep (products/catalyst/chart/crds/
      # continuum.yaml) to admit digit-bearing codes; the prior
      # letters-only pattern was Hetzner-era and unsatisfiable on
      # kom4dc (me-east-215-*), which is what kept this seed OFF.
      continuum:
        enabled: true
        primaryRegion: '${SOVEREIGN_PRIMARY_REGION:-}'
        hotStandbyRegion: '${SOVEREIGN_REPLICA_REGION:-}'
      image:
        # harbor-proxy-pull compliant prefix (see header). Public CNPG
        # image; proxy-ghcr serves it cred-free pre-cutover.
        repository: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql
        # Concrete pin satisfies the chart's required-tag fail-fast
        # (Inviolable Principle #4a — no :latest). Day-2 digest pivots
        # available via per-Sovereign overlay at .image.tag.
        tag: "16.4-1"
