# bp-postgres (shared instance) — Catalyst bootstrap-kit Blueprint, slot 16a.
#
# ADR-0010 reuse proof: ONE shared CNPG Cluster (`shared-pg`) that BOTH
# bp-harbor and bp-gitea run off, via two ISOLATED databases + two
# per-consumer roles. This is the reusable, shareable backing-services
# model proven live: 2 consumers, 1 engine.
#
# The binding is pure declarative YAML — this HR's values.databases[]
# renders (in platform/postgres/chart):
#   - one CNPG Cluster `shared-pg`
#   - two Database CRs (registry → harbor, gitea → gitea) on it
#   - two managed.roles (harbor, gitea) on it
#   - two hub connection Secrets (harbor-database-secret, gitea-database-
#     secret) in THIS release's namespace (shared-data) carrying reflector
#     auto-push annotations (#3283) so bp-reflector copies a same-named
#     Secret into ns harbor / ns gitea once those namespaces appear — each
#     consumer chart then runs in externalDatabase mode off its own Secret.
#     (The hub Secret lives in shared-data, NOT the consumer namespace,
#     because those namespaces don't exist when this HR installs — creating
#     the Secret there directly was the FATAL deadlock fixed in 0.1.2.)
#
# NO custom controller, NO Crossplane. The CNPG operator (bp-cnpg, slot
# 16) + Flux reconcile everything. bp-harbor (19) and bp-gitea (10) set
# postgres.cluster.enabled=false (their own embedded Cluster is skipped)
# and dependsOn bp-postgres-shared.
#
# Slot ordering: after bp-cnpg (16, the operator + CRDs), before
# bp-harbor (19). bp-gitea (10) gates on this via Flux dependsOn
# regardless of file order.
#
# Wrapper chart: platform/postgres/chart/
# Reconciled by: Flux on the new Sovereign's k3s control plane.

---
apiVersion: v1
kind: Namespace
metadata:
  name: shared-data
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-postgres
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # bp-postgres-shared is the data-instance HR. Consumers dependsOn THIS
  # (not bp-cnpg) per ADR-0010. The release name `shared-pg` matches the
  # instance.name so the Cluster + Secrets are named consistently.
  name: bp-postgres-shared
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "16a"
    catalyst.openova.io/data-instance: shared-pg
spec:
  interval: 15m
  releaseName: shared-pg
  targetNamespace: shared-data
  # The CNPG operator + CRDs (Cluster + Database + managed.roles) must be
  # reconciling before the shared instance applies its Cluster/Database CRs.
  dependsOn:
    - name: bp-cnpg
      namespace: flux-system
    # bp-reflector mirrors the CNPG role Secrets into the consumer
    # namespaces (harbor, gitea).
    - name: bp-reflector
      namespace: flux-system
  chart:
    spec:
      chart: bp-postgres
      # 0.1.1 (#3188): master gate `enabled` (default true) → OFF renders
      # ZERO resources so this HR is an empty Ready release when sharing is
      # disabled (SOVEREIGN_ENABLE_SHARED_PG=false, the safe default).
      # 0.1.2 (#3283): the reflected connection Secrets are now created in
      # shared-data (this HR's own targetNamespace) with reflector auto-push
      # annotations — NOT in the consumer namespaces (gitea/harbor), which
      # don't exist when this HR installs. Breaks the bp-postgres-shared ⟲
      # bp-gitea/bp-harbor circular deadlock (live hw127).
      # 0.1.3 (#3285): the chart MINTS each per-binding role-password Secret
      # (kubernetes.io/basic-auth, stable via lookup-keep) — CNPG never
      # auto-creates managed-role secrets, so the hub reflects: pull had no
      # source and consumers starved on hw130 (CreateContainerConfigError).
      # 0.1.4 (#3285): hub connection Secrets render their data DIRECTLY
      # (same scope + same minted password as the role Secret) — the
      # reflects: pull was dead on two reflector limitations (no retry
      # for late sources; mirrors can't be push sources), proven live
      # hw130. Hub stays the #3283 push source for consumer namespaces.
      version: 0.1.4
      sourceRef:
        kind: HelmRepository
        name: bp-postgres
        namespace: flux-system
  # CNPG: KEEP Helm wait so the Cluster's webhook + the two Database CRs
  # reconcile before the consumers (which dependsOn this HR) proceed.
  install:
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    # ── SAFE-BY-DEFAULT master gate ─────────────────────────────────────
    # OFF → the chart renders ZERO resources → this HR installs an EMPTY
    # (but Ready) release. bp-gitea (slot 10) + bp-harbor (slot 19)
    # dependsOn bp-postgres-shared UNCONDITIONALLY, so this empty-Ready
    # release satisfies the edge WITHOUT deploying an unused shared-pg
    # Cluster. Single-region / non-sharing provs are byte-identical to
    # today (the same default-OFF shape as slot 16b SOVEREIGN_ENABLE_HOT_
    # STANDBY / slot 62 CONTINUUM_ENABLED).
    #
    # TWO-FLAG CONTRACT to actually share a real shared instance: flip
    # BOTH SOVEREIGN_{GITEA,HARBOR}_PG_OWN_CLUSTER=false (consumer skips
    # its own Cluster + points DB host at shared-pg) AND
    # SOVEREIGN_ENABLE_SHARED_PG=true (this slot renders the engine).
    enabled: ${SOVEREIGN_ENABLE_SHARED_PG:=false}
    instance:
      name: shared-pg
      namespace: shared-data
      # Multi-region Sovereigns spread CNPG across regions; single-region
      # falls back to 1. (Same envsubst seam as bp-gitea/bp-harbor.)
      # Topology is singleton here for the Phase-2 reuse proof; flip to
      # active-hot-standby for the Pillar-3 shape.
      storageSize: 10Gi
    topology:
      mode: singleton
      instances: 1
    # The two bindings — the reuse proof. Two isolated databases + two
    # roles on ONE Cluster; each reflected into its consumer's namespace.
    databases:
      - name: registry          # harbor's coreDatabase
        owner: harbor
        consumer:
          blueprint: bp-harbor
          mode: shared
        reflect:
          secretName: harbor-database-secret
          namespaces: [harbor]
      - name: gitea             # gitea's database
        owner: gitea
        consumer:
          blueprint: bp-gitea
          mode: shared
        reflect:
          secretName: gitea-database-secret
          namespaces: [gitea]
