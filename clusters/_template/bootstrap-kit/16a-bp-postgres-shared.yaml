# bp-postgres (shared instance A) — Catalyst bootstrap-kit Blueprint, slot 16a.
#
# ADR-0010 reuse proof: ONE shared CNPG Cluster (`shared-pg`) that
# bp-gitea, bp-harbor AND bp-keycloak run off, via three ISOLATED
# databases + three per-consumer roles. This is the reusable, shareable
# backing-services model proven live (gitea+harbor, hw130) — keycloak
# joins via the same #3283/#3285 hub-secret push pattern.
#
# THREE-INSTANCE MODEL (founder NS-2, Refs #3188): this slot is instance
# A of three. Slots 16c (`shared-pg-b`: grafana + powerdns + powerdns-
# admin) and 16d (`shared-pg-c`: the Organization mesh) are two more installs of
# the SAME bp-postgres chart, all gated on SOVEREIGN_ENABLE_SHARED_PG.
# Three engines, 7 consumer applications, 3+3+1.
#
# The binding is pure declarative YAML — this HR's values.databases[]
# renders (in platform/postgres/chart):
#   - one CNPG Cluster `shared-pg`
#   - three Database CRs (registry → harbor, gitea → gitea,
#     keycloak → keycloak) on it
#   - three managed.roles (harbor, gitea, keycloak) on it
#   - three hub connection Secrets (harbor-database-secret, gitea-
#     database-secret, keycloak-database-secret) in THIS release's
#     namespace (shared-data) carrying reflector auto-push annotations
#     (#3283) so bp-reflector copies a same-named Secret into ns harbor /
#     ns gitea / ns keycloak once those namespaces appear — each consumer
#     chart then runs in externalDatabase mode off its own Secret.
#     (The hub Secret lives in shared-data, NOT the consumer namespace,
#     because those namespaces don't exist when this HR installs — creating
#     the Secret there directly was the FATAL deadlock fixed in 0.1.2.)
#
# NO custom controller, NO Crossplane. The CNPG operator (bp-cnpg, slot
# 16) + Flux reconcile everything. bp-harbor (19) and bp-gitea (10) set
# postgres.cluster.enabled=false (their own embedded Cluster is skipped);
# bp-keycloak (09) sets keycloak.postgresql.enabled=false (bundled
# bitnami postgresql skipped, externalDatabase mode on). All three
# dependsOn bp-postgres-shared.
#
# Slot ordering: after bp-cnpg (16, the operator + CRDs), before
# bp-harbor (19). bp-gitea (10) gates on this via Flux dependsOn
# regardless of file order.
#
# Wrapper chart: platform/postgres/chart/
# Reconciled by: Flux on the new Sovereign's k3s control plane.

---
apiVersion: v1
kind: Namespace
metadata:
  name: shared-data
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-postgres
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # bp-postgres-shared is the data-instance HR. Consumers dependsOn THIS
  # (not bp-cnpg) per ADR-0010. The release name `shared-pg` matches the
  # instance.name so the Cluster + Secrets are named consistently.
  name: bp-postgres-shared
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "16a"
    catalyst.openova.io/data-instance: shared-pg
spec:
  interval: 15m
  releaseName: shared-pg
  targetNamespace: shared-data
  # The CNPG operator + CRDs (Cluster + Database + managed.roles) must be
  # reconciling before the shared instance applies its Cluster/Database CRs.
  dependsOn:
    - name: bp-cnpg
      namespace: flux-system
    # bp-reflector mirrors the CNPG role Secrets into the consumer
    # namespaces (harbor, gitea).
    - name: bp-reflector
      namespace: flux-system
  chart:
    spec:
      chart: bp-postgres
      # 0.1.1 (#3188): master gate `enabled` (default true) → OFF renders
      # ZERO resources so this HR is an empty Ready release when sharing is
      # disabled (SOVEREIGN_ENABLE_SHARED_PG=false, the safe default).
      # 0.1.2 (#3283): the reflected connection Secrets are now created in
      # shared-data (this HR's own targetNamespace) with reflector auto-push
      # annotations — NOT in the consumer namespaces (gitea/harbor), which
      # don't exist when this HR installs. Breaks the bp-postgres-shared ⟲
      # bp-gitea/bp-harbor circular deadlock (live hw127).
      # 0.1.3 (#3285): the chart MINTS each per-binding role-password Secret
      # (kubernetes.io/basic-auth, stable via lookup-keep) — CNPG never
      # auto-creates managed-role secrets, so the hub reflects: pull had no
      # source and consumers starved on hw130 (CreateContainerConfigError).
      # 0.1.4 (#3285): hub connection Secrets render their data DIRECTLY
      # (same scope + same minted password as the role Secret) — the
      # reflects: pull was dead on two reflector limitations (no retry
      # for late sources; mirrors can't be push sources), proven live
      # hw130. Hub stays the #3283 push source for consumer namespaces.
      # 0.1.5 (#3188 three-instance model): same-owner binding dedupe +
      # Database-CR-name underscore sanitize + hub `uri` key +
      # reflect.extraData / reflect.passwordAliases (env-style hub for
      # grafana). Enables slots 16c/16d as additional chart installs.
      # 0.1.6 (#3370 Contexts): bootstrapOwned self-registration — the
      # chart renders the apps.openova.io/v1 Application CR for this
      # instance (canonical G117 representation; adoption-guarded,
      # Capabilities-gated) carrying the databases[] Context
      # declarations in spec.parameters.
      # 0.1.9 (#3370): pin bump — no template change; forces a
      # helm-controller UPGRADE on already-converged Sovereigns so the
      # Capabilities-gated Application CR renders (it was skipped at the
      # bootstrap INSTALL, before the umbrella shipped the CRD).
      # 0.1.10 (#3375): role-Secret name RFC-1123 sanitization (lockstep
      # bump with 16c/16d — underscore-owner fix, see chart changelog).
      # 0.2.0 (#3571, Refs #3375 North-Star-4): active-hot-standby now renders
      # the PROVEN bp-cnpg-pair SPLIT-SIDE cross-region shape (primary Cluster
      # keeps the `shared-pg` name so the consumer host shared-pg-rw is
      # unchanged + ClusterMesh-global shared-pg-mesh Service + native
      # synchronous block; shared-pg-replica follower streams WAL on the
      # secondary cluster) instead of the hw126 stretched-cluster antiAffinity.
      # Gated by topology.crossRegion below (the SOVEREIGN_ENABLE_CNPG_PAIR
      # post-mesh signal) so single-region provs stay byte-identical singletons.
      # 0.2.1 (#3577, Refs #3572 #3322): the 0.2.0 active-hot-standby primary
      # NetworkPolicy (lifted from bp-cnpg-pair, a dedicated cluster) default-
      # denied EVERY consumer's shared-pg-rw:5432 — on hw144 keycloak/gitea/
      # harbor/grafana/catalyst-api all timed out (JDBC Acquisition timeout, the
      # whole SSO chain down) the moment crossRegion flipped. Adds a consumer-
      # ingress rule (TCP 5432 from any in-cluster Pod) so the SHARED engine's
      # consumers reach it again; replication/own-cluster/operator carve-outs
      # unchanged; singleton stays byte-identical. Lockstep bump with 16c/16d.
      # 0.2.4 (#3878, companion to #3876): chart gains reflect.mangledTarget;
      # the keycloak/gitea/harbor bindings below declare it so each DB Secret
      # is delivered natively into vc-mgmt as the syncer-mangled host object
      # (no fromHost mirror of a pod-mounted Secret → no vcluster-0.23.0
      # from-host/to-host deadlock, and no missing credential). Lockstep with
      # 16c/16d. Refs #3876 #3374 #3737.
      # 0.2.8 (#4460, Refs #4439 #4436 #4275): the ClusterMesh-global
      # `shared-pg-mesh`/`-mesh-rw` Service aliases now render on the MULTI-REGION
      # signal (both primary.region + replica.region stamped — cloud-init sets
      # both on every region at boot) instead of gated on the LATE cnpg-pair flip
      # ($ahs/crossRegion). The secondary region's keycloak/gitea/harbor host is
      # baked to `shared-pg-mesh-rw` at cloud-init regardless of the flip, so the
      # alias must exist the moment the mesh peers — else region-B keycloak/gitea/
      # harbor NXDOMAIN'd on a fresh 2-region prov (0 remote clusters ready). The
      # cross-mesh consumer-5432 path is already opened by 0.2.7's sharedConsumers
      # (#4442). Lockstep with 16c/16d.
      # 0.2.10 (#4846): identity-based cross-region DR CiliumNetworkPolicy
      # (crossRegionPeerClusters) replaces the inert ipBlock. Lockstep 16c/16d.
      # 0.2.13 (#5224, Refs #5220 #4915): role-secrets side-gate — a region
      # stamped side=secondary NEVER mints role/hub Secrets (incl. the #4460
      # pre-flip window); the pair's password set is single-sourced from
      # region-A. Lockstep with the other 16* bp-postgres slots.
      # 0.2.14 (#5473): replication-source Service selectorType r -> rw —
      # `r` matched every instance, so a standby could serve as DR source.
      version: 0.2.14
      sourceRef:
        kind: HelmRepository
        name: bp-postgres
        namespace: flux-system
  # CNPG: KEEP Helm wait so the Cluster's webhook + the two Database CRs
  # reconcile before the consumers (which dependsOn this HR) proceed.
  install:
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    # ── SAFE-BY-DEFAULT master gate ─────────────────────────────────────
    # OFF → the chart renders ZERO resources → this HR installs an EMPTY
    # (but Ready) release. bp-gitea (slot 10) + bp-harbor (slot 19)
    # dependsOn bp-postgres-shared UNCONDITIONALLY, so this empty-Ready
    # release satisfies the edge WITHOUT deploying an unused shared-pg
    # Cluster. Single-region / non-sharing provs are byte-identical to
    # today (the same default-OFF shape as slot 16b SOVEREIGN_ENABLE_HOT_
    # STANDBY / slot 62 CONTINUUM_ENABLED).
    #
    # ONE-FLAG CONTRACT (#3285/#3309): cloud-init computes the per-
    # consumer flips (SOVEREIGN_{GITEA,HARBOR,KEYCLOAK}_PG_OWN_CLUSTER=
    # false → consumer skips its own Cluster + points at shared-pg) from
    # the SAME enable_shared_pg tofu var that drives this gate, so
    # SOVEREIGN_ENABLE_SHARED_PG=true is the single switch.
    enabled: ${SOVEREIGN_ENABLE_SHARED_PG:=false}
    # ── Bootstrap self-registration (#3370) ─────────────────────────────
    # The chart self-registers the Application CR for shared-pg (the
    # canonical instance representation every console surface reads),
    # marked spec.bootstrap=true so the application-controller ADOPTS
    # this HR's install instead of re-rendering it (zero duplicate HRs).
    bootstrapOwned:
      enabled: true
      helmRelease:
        name: bp-postgres-shared
        namespace: flux-system
    instance:
      name: shared-pg
      namespace: shared-data
      storageSize: 10Gi
    # ── Topology — cross-region active-hot-standby (#3571, Refs #3375) ───
    # mode stays `singleton` so a single-region prov (or a 2-region prov
    # BEFORE catalyst-api confirms the mesh) renders the byte-identical
    # singleton shared-pg Cluster. crossRegion is wired to the SAME
    # SOVEREIGN_ENABLE_CNPG_PAIR post-mesh-confirm substitute bp-cnpg-pair
    # (slot 16b) rides — catalyst-api patches it true onto EVERY region's
    # bootstrap-kit Kustomization (handler/clustermesh.go) only after
    # ClusterMesh is established + the primary's replica-auth Secrets sync.
    # When it flips true the chart renders the PROVEN bp-cnpg-pair split-side
    # shape: side=primary (region-A) → the named `shared-pg` Cluster (so the
    # keycloak/gitea/harbor host shared-pg-rw is unchanged) + the
    # ClusterMesh-global shared-pg-mesh Service; side=secondary (region-B) →
    # the shared-pg-replica follower streaming WAL over the mesh. side is
    # stamped from the per-region SOVEREIGN_REGION_ROLE (primary|secondary).
    # primary/replica.region carry the canonical openova.io/region node
    # labels. A region-kill then preserves the consumers' data (keycloak
    # realm survives a region-A kill) via bp-continuum's cnpg-pair switchover.
    topology:
      mode: singleton
      crossRegion: ${SOVEREIGN_ENABLE_CNPG_PAIR:-false}
      side: ${SOVEREIGN_REGION_ROLE:-primary}
      # singleton instance count — UNCHANGED at 1 (byte-identical). The pair's
      # per-side instance count is the SEPARATE chart default haInstances (3,
      # the bp-cnpg-pair canonical), so flipping crossRegion never perturbs
      # the singleton render's instances field.
      instances: 1
      primary:
        region: '${SOVEREIGN_PRIMARY_REGION:-}'
      replica:
        region: '${SOVEREIGN_REPLICA_REGION:-}'
      # #4442 — HOST shared-data instance: the singleton operator-probe NP
      # (networkpolicy-singleton-operator-probe.yaml) default-denies 5432 to
      # cross-namespace consumers (keycloak/gitea/harbor in OTHER namespaces,
      # no allow-same-org here). Open 5432 cluster-wide so the SHARED engine's
      # consumers reach it — the singleton analogue of the 0.2.1/#3577
      # active-hot-standby consumer-allow. Live regression on b9f9590b.
      networkPolicy:
        sharedConsumers: true
        # crossRegionPeerClusters (#4846) — admit the PEER region's pods to 5432
        # by CLUSTER IDENTITY so region-b consumers (keycloak/grafana/…) + the
        # region-b replica's pg_basebackup reach the primary. k8s-netpol label
        # rules are implicitly local-cluster-scoped, and a k8s `ipBlock` never
        # matches a ClusterMesh remote endpoint (it matches only a CIDR identity,
        # which Cilium assigns solely to NON-endpoint IPs) — so the chart renders
        # an identity-based CiliumNetworkPolicy selecting io.cilium.k8s.policy.
        # cluster instead. SOVEREIGN_PEER_CLUSTERMESH_NAMES is stamped by
        # catalyst-api (enableCNPGPairAfterFullMesh) with the peer region's mesh
        # name(s) at the post-mesh cnpg-pair flip, as a YAML flow-sequence e.g.
        # [hw228-me-east-b]. Only consumed in active-hot-standby; DEFAULT [] →
        # singleton renders NO CiliumNetworkPolicy (byte-identical default).
        crossRegionPeerClusters: ${SOVEREIGN_PEER_CLUSTERMESH_NAMES:-[]}
    # The three bindings — the reuse proof. Three isolated databases +
    # three roles on ONE Cluster; each reflected into its consumer's
    # namespace.
    databases:
      - name: registry          # harbor's coreDatabase
        owner: harbor
        consumer:
          blueprint: bp-harbor
          mode: shared
        reflect:
          secretName: harbor-database-secret
          namespaces: [harbor]
          # #3878 (companion to #3876): harbor runs INSIDE vc-mgmt (#3642).
          # Deliver harbor-database-secret natively into vc-mgmt by reflecting
          # the vCluster-syncer-mangled host object into ns `mgmt` (the object
          # the in-vc pod mounts). The DB Secret is NOT fromHost-imported, so
          # the from-host/to-host syncers never fight over it (the #3876
          # deadlock) AND the credential is present on a fresh prov.
          mangledTarget:
            vclusterNamespace: harbor
      - name: gitea             # gitea's database
        owner: gitea
        consumer:
          blueprint: bp-gitea
          mode: shared
        reflect:
          secretName: gitea-database-secret
          namespaces: [gitea]
          # #3878: gitea runs INSIDE vc-mgmt — native DB-secret delivery (see
          # harbor binding above for the full rationale).
          mangledTarget:
            vclusterNamespace: gitea
      # keycloak (#3188 three-instance model): the bitnami keycloak
      # subchart flips to externalDatabase mode off this hub Secret —
      # slot 09 gates its bundled keycloak-postgresql StatefulSet on
      # SOVEREIGN_KEYCLOAK_PG_OWN_CLUSTER (computed from enable_shared_pg
      # in cloud-init, same one-flag contract as gitea/harbor). Keycloak
      # runs Liquibase on first boot, so an empty `keycloak` database is
      # the correct starting state — no schema bootstrap needed here.
      - name: keycloak          # keycloak's Liquibase-managed database
        owner: keycloak
        consumer:
          blueprint: bp-keycloak
          mode: shared
        reflect:
          secretName: keycloak-database-secret
          namespaces: [keycloak]
          # #3878: keycloak runs INSIDE vc-mgmt — native DB-secret delivery.
          # This is the durable form of the hw167 hand-fix the cycle-1
          # validation agent applied live (created keycloak-database-secret
          # natively in-vCluster, single toHost owner). #3876 dropped the
          # keycloak/* fromHost wildcard entirely (keycloak has no host SSO
          # Secret); this mangled copy is its ONLY in-vc DB-secret source.
          mangledTarget:
            vclusterNamespace: keycloak
