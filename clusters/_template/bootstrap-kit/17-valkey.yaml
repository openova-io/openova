# bp-valkey — Catalyst bootstrap-kit Blueprint, W2.K1 slot 17.
# Redis-compatible cache (Valkey is the BSD-licensed Redis fork). Used by
# Catalyst control-plane services for ephemeral session/state, and by
# downstream Apps that need a Redis wire-protocol cache.
#
# Per docs/BOOTSTRAP-KIT-EXPANSION-PLAN.md §2.3 (Tier 5 storage+DB
# foundation) — Valkey runs alongside CNPG so Apps can pick the right
# storage shape per workload (relational vs cache).
#
# Wrapper chart: platform/valkey/chart/
# Catalyst-curated values: platform/valkey/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.
#
# ── #3373 Batch A — RTZ vCluster placement (every instance in its
#    vCluster by data) ────────────────────────────────────────────────
# valkey is the clean pure-OSS migration (no HTTPRoute, no
# ExternalSecret, no CNPG Cluster CR — none of the Free-tier
# `customResources` toHost-sync coupling). Its wire is plain Service DNS,
# which the OSS `services` toHost sync already mirrors (proven live by
# nats-jetstream/loki/mimir/tempo). The HR CR lives in host ns `rtz`
# (where bp-rtz-vcluster slot 59 exports the vc-rtz kubeconfig Secret);
# helm-controller resolves spec.kubeConfig.secretRef from the HR's own
# namespace and installs the chart INSIDE the rtz vCluster.
# targetNamespace/storageNamespace = the inner `valkey` namespace inside
# the vCluster (storageNamespace pinned per the hw92 lesson). The
# host-side Namespace YAML is dropped — createNamespace:true provisions
# the inner `valkey` ns inside the vCluster.
#
# Host-side consumer (the Organization control-plane services in host ns `sme`,
# still host-placed in Batch A) re-points to the syncer-mangled Service
# name `valkey-primary-x-valkey-x-rtz-vcluster.rtz.svc.cluster.local:6379`
# — rewired in products/catalyst values (orgServices.valkey.host +
# projector.valkey.addr). The rtz isolation netpol gains a `sme` carve-out
# (bp-rtz-vcluster allowedIngressNamespaces) so that wire is admitted
# after the move (mirrors the #3423 sme→NATS carve-out).

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-valkey
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-valkey
  namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  labels:
    catalyst.openova.io/slot: "17"
spec:
  interval: 15m
  releaseName: valkey
  targetNamespace: valkey
  dependsOn:
    - name: bp-flux
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  chart:
    spec:
      chart: bp-valkey
      # 1.0.2 (TBD-V12 #2003, 2026-05-20): default
      # `valkey.auth.enabled` flips to `false` so bp-newapi's
      # passwordless REDIS_CONN_STRING default stops triggering
      # `NOAUTH Authentication required` on every freshly
      # franchised Sovereign (45× CrashLoopBackOff on t38 sandbox
      # newapi, blocking Pillar 4 / qwen-code / MCP). See
      # platform/valkey/chart/values.yaml `auth` block for the
      # consumer-tolerance + follow-up plan.
      # 1.1.0 (#3370 Contexts): keyspace Context machinery
      # (context-secrets.yaml) + bootstrapOwned Application-CR
      # self-registration — the generality proof of the platform-wide
      # reuse mechanism on a non-database blueprint.
      # 1.1.4 (#4136): Bitnami valkey/os-shell images via the on-Sovereign
      # Harbor proxy-cache (bitnamilegacy, pinned) — bare dockerhub
      # `bitnami/valkey:latest` 404'd the node mirror → ImagePullBackOff →
      # bp-newapi Redis-ping CrashLoop (UAT 37/38/114).
      # 1.1.5 (#5487, hw291 2026-07-29): SECURITY — the rendered
      # NetworkPolicy carried an ingress rule with NO `from:` (upstream
      # `networkPolicy.allowExternal` defaults true), which admits every Pod
      # in the cluster on 6379. With auth off (1.0.2) any container foothold
      # anywhere could FLUSHALL the gateway's rate-limit counters. Ingress is
      # now scoped to the declared consumers — ns `org-services` and ns
      # `newapi`, the same pair bp-plane-isolation (slot 26b) already
      # declares for this namespace.
      version: 1.1.5
      sourceRef:
        kind: HelmRepository
        name: bp-valkey
        namespace: flux-system
  # Event-driven install per docs/INVIOLABLE-PRINCIPLES.md #3.
  install:
    createNamespace: true  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    timeout: 15m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
  values:
    # ── Bootstrap self-registration (#3370) ─────────────────────────
    # The chart self-registers the Application CR for this valkey
    # instance (the canonical representation every console surface
    # reads), marked spec.bootstrap=true so the application-controller
    # ADOPTS this HR's install instead of re-rendering it.
    bootstrapOwned:
      enabled: true
      helmRelease:
        name: bp-valkey
        namespace: flux-system
    # ── Keyspace Contexts (#3370 generality proof on a non-DB blueprint) ─
    # The SAME reuse mechanism as bp-postgres databases[], generalized by
    # declaration only (kind=keyspace, valuesKey=keyspaces). bp-newapi is
    # the canonical Valkey consumer (its REDIS_CONN_STRING) — declaring its
    # keyspace here renders one keyspace/newapi Context (a dedicated logical
    # DB index + a reflected newapi-keyspace-credential Secret pushed into
    # ns newapi) so the instance's Contexts tab shows a populated
    # keyspace/… row, proving the platform-wide mechanism on a cache, not a
    # database. Auth is disabled on this Sovereign (slot changelog 1.0.2),
    # so the reflected uri is redis://valkey:6379/1.
    keyspaces:
      - name: newapi          # bp-newapi's cache keyspace
        index: 1              # dedicated logical DB index (0 = default)
        consumer:
          blueprint: bp-newapi
          mode: shared
        reflect:
          secretName: newapi-keyspace-credential
          namespaces: [newapi]
