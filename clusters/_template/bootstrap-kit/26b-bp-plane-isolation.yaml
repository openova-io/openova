# bp-plane-isolation — Catalyst bootstrap-kit Blueprint slot 26b
# (#4291 Workstream C — Refs #4293 #3642 #3373).
#
# Per-component default-deny + gateway-ingress micro-segmentation for the
# de-vclustered platform planes. When #4291 flips the mgmt/rtz/dmz APP rows
# from `vcluster: mgmt|rtz|dmz` to `vcluster: host` (each component in its
# OWN first-class host namespace), the whole-plane NetworkPolicy +
# gateway-ingress CiliumNetworkPolicy that bp-{mgmt,rtz,dmz}-vcluster shipped
# per syncer-namespace is replaced by THIS chart's PER-COMPONENT policy pair:
# one default-deny NetworkPolicy + (for gateway-fronted components) the
# fromEntities:[ingress,host,remote-node] CiliumNetworkPolicy, in each
# component's own host namespace. The allow-set tightens from coarse
# whole-plane to per-component — the core micro-segmentation win of #4291.
#
# Reconciled by: Flux on the new Sovereign's k3s control plane, AFTER
# bp-cilium (slot 01) installs the cilium.io CRDs the CiliumNetworkPolicy
# template targets, and AFTER the component host namespaces exist (Flux
# applies Namespace kinds + the per-component HRs' createNamespace before
# this HR's policies resolve). The cilium.io/v2 Capabilities gate in the
# chart keeps the CNP out of the render on CRD-less clusters.
#
# Ordering: slot 26b runs after slot 26 (bp-network-policies, the cluster-
# wide baseline) and slot 01 (bp-cilium). The HR→HR dependsOn below is the
# load-bearing signal; the Kustomization slot ordering is belt-and-suspenders.
#
# Wrapper chart: platform/plane-isolation/chart/ (pure overlay; no upstream
# subchart — CRDs come from bp-cilium's upstream Cilium chart).

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-plane-isolation
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  # ghcr-pull authenticates the OCI pull — bp-plane-isolation is a PRIVATE
  # ghcr package (like every other bp-* chart). Without this secretRef Flux
  # falls back to anonymous auth → 401 → the chart never pulls → the
  # bootstrap-kit Kustomization wedges on this HR. Mirrors slots 26/13/16b.
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-plane-isolation
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "26b"
spec:
  interval: 15m
  releaseName: plane-isolation
  targetNamespace: catalyst-system
  dependsOn:
    - name: bp-cilium
    - name: bp-network-policies
  chart:
    spec:
      chart: bp-plane-isolation
      # 0.1.0 (#4291 Workstream C) — per-component default-deny + gateway
      # CNP for the de-vclustered platform planes. CI populates the SHA-pinned
      # OCI digest on tag.
      # 0.1.1 — #4347 (Refs #4325): YAML doc-separator fix so the HR install no
      #   longer fails post-render with `mapping key "apiVersion" already defined`.
      # 0.1.2 — #4360 (Refs #4272 #4307 #4322 #4179): default-deny egress
      #   `ipBlock 0.0.0.0/0` is Cilium world-only → dropped ALL in-cluster dials
      #   (gitea→shared-pg etc.); add a `namespaceSelector {}` egress allow rule.
      # 0.1.3 — #4382 (Refs #4360 #4322 #4297 #4292): add org-services to gitea's
      #   INGRESS allowlist — provisioning (org-services) dials gitea-http:3000 to
      #   validate its bootstrap PAT + bootstrap per-Org gitops repos, but the
      #   0.1.2 allowlist omitted org-services → Cilium dropped the dial → HTTP 000
      #   → funnel Org bootstrap wedged even with gitea Ready + a valid PAT.
      # 0.1.4 — #4325 #4382 comprehensive dial-graph sweep: close EVERY remaining
      #   de-vcluster ingress gap in ONE pass (vs the one-at-a-time #4361/#4380/
      #   #4383 fixes). Added ingress edges: keycloak←{sandbox,newapi,guacamole,
      #   grafana}, gitea←sandbox, nats-system←newapi, seaweedfs←sandbox,
      #   grafana←cnpg-system. Added own-default-deny for the three un-policied
      #   de-vcluster'd host namespaces opentelemetry/alloy/oidc-gate. A contract
      #   test (Case 30) now asserts the known dial graph is fully covered so a
      #   future de-vcluster/re-home can't silently drop an edge.
      # 0.1.5 (#4428 / Refs #4360 #4409): add a per-component kube-apiserver
      #   egress CiliumNetworkPolicy (toEntities:[kube-apiserver]). The 0.1.2
      #   egress union (namespaceSelector:{} + ipBlock 0.0.0.0/0) does not match
      #   the reserved `kube-apiserver` identity the apiserver VIP 10.96.0.1:443
      #   resolves to, so default-denied namespaces dropped all apiserver egress
      #   → newapi CNPG instance-manager hung on `dial 10.96.0.1:443 i/o timeout`
      #   → bp-newapi HR Failed → bootstrap-kit Kustomization stalled (#4409).
      # 0.1.6 (#4448 / Refs #4325 #4382 #4437 #4354): add sso-bridge to openbao's
      #   INGRESS allowlist. The openbao default-deny covered external-secrets-
      #   system + cnpg-system but OMITTED sso-bridge — so bp-sso-bridge dialing
      #   openbao.openbao.svc:8200 each reconciler tick (k8s-auth) was Cilium-
      #   dropped → `curl (28) timeout` → `skipping tick (no OpenBao token)` → NO
      #   secret/sso/* bundle written → grafana-sso-oidc-credentials / hubble-ui-
      #   oauth2-proxy-oidc / gitea-oauth-source-credentials never materialized →
      #   grafana 503 / hubble 503 / gitea 500. Same de-vcluster ingress-gap class
      #   as #4382 (org-services→gitea). Network-only: openbao auth-bootstrap
      #   already binds the sso-bridge SA (#2655). Live: kom4dc b9f9590b558262b6.
      # 0.1.7 (#4442 / Refs #4444 #4325): the per-component default-deny NetworkPolicy
      #   now DEFERS a component whose namespace does not yet exist (lookup-guard)
      #   instead of failing the whole atomic Helm release. On a fresh prov `sandbox`
      #   is created LATE (bp-sandbox, gated behind bp-catalyst-platform) while this
      #   chart installs EARLY → "namespaces sandbox not found" atomic-fail meant NONE
      #   of the per-component policies applied → gitea default-deny never landed →
      #   catalyst-system → gitea blocked → gitea-token-mint CrashLooped →
      #   bp-catalyst-platform hung → bp-sandbox never created `sandbox` → CIRCULAR
      #   DEADLOCK (live b9f9590b, 2026-06-26). Cilium unions every policy +
      #   helm-controller reconciles on interval, so the deferred policy lands on the
      #   NEXT reconcile once the namespace exists.
      # 0.1.8 (#4468 / Refs #4456 #4445): EXTEND the 0.1.7 defer-if-absent guard to the
      #   OTHER two per-component templates it missed — apiserver-egress-cnp.yaml
      #   (added 0.1.5/#4428) and gateway-ingress-cnp.yaml ALSO render `namespace: <ns>`
      #   CNPs per component, so the absent `sandbox` ns STILL atomic-failed the release
      #   ("namespaces sandbox not found") via the apiserver-egress CNP → the SAME
      #   circular deadlock 0.1.7 was meant to break. Live-caught on fresh re-prov
      #   91dc05917e44d1c1 (kom4dc, 2026-06-26): published 0.1.7 HR install STILL FAILED.
      #   All three per-component templates now carry the identical lookup-guard.
      # 0.1.9 (#4468): annotate smoke-render-mode=default-off so the blueprint-release
      #   OCI publish stops wedging — the all-template lookup-guard renders ZERO
      #   resources client-side by design (the gate's short-render trip). Annotation-
      #   only; no policy/behaviour change vs 0.1.8.
      version: 0.1.9
      sourceRef:
        kind: HelmRepository
        name: bp-plane-isolation
        namespace: flux-system
  install:
    timeout: 5m
    # The per-component policies land in namespaces other charts own
    # (keycloak/gitea/…), which may not all be Ready when this HR
    # reconciles. disableWait so the HR reaches Ready on apply (the
    # policies are additive + idempotent — they take effect as each
    # namespace materializes). Mirrors slot 26 (bp-network-policies).
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 5m
    disableWait: true
    remediation:
      retries: 3
