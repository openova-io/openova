# bp-coraza — Catalyst bootstrap-kit Blueprint #35 (W2.K4 — Tier 8: edge).
# OWASP-licensed Web Application Firewall, ModSecurity-rule-compatible.
# Speaks the HAProxy SPOE protocol; sits in front of Cilium Gateway / HAProxy
# fronts to enforce WAF policies on inbound traffic to Sovereign-facing
# services (keycloak, grafana, stalwart, marketplace).
#
# Wrapper chart: platform/coraza/chart/
# Catalyst-curated values: platform/coraza/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.
#
# dependsOn:
#   - bp-cilium — Coraza enforces L7 policy via Cilium L7 proxy / Gateway
#     API; Cilium must be Ready (CNI + Gateway controller) before WAF
#     evaluation hooks become reachable.
#   - bp-cert-manager — Issuers must be reconciled so any TLS-fronted SPOA
#     listeners (per-Sovereign overlays) come up with valid certs.
#
# install/upgrade.disableWait: true — Coraza-spoa Deployment Ready signal
# is event-driven via the Flux dependsOn graph (downstream HRs check
# Ready=True on this HR). Per session-2026-04-30 architectural decision,
# we never use blanket `spec.timeout: Nm` watchdogs.
#
# G92.4 #2663 (2026-06-01): the HelmRelease installs INSIDE the DMZ
# vCluster via Flux v2 spec.kubeConfig.secretRef → vc-dmz (kubeconfig
# Secret exported by bp-dmz-vcluster slot 54). Per docs/SOVEREIGN-MULTI-
# REGION-DOD.md §A4 north-south WAF lives in DMZ alongside Cilium-
# Gateway listeners + HTTPRoutes so the L7 evaluation hook stays
# co-located with the inbound traffic surface (no host hop). The chart
# ships no CNPG Cluster CR + no external state, so the move is a clean
# pivot — the HR CR itself lives in host ns `dmz` so helm-controller
# resolves the kubeConfig Secret from the same namespace (Flux v2
# SecretReference contract).

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-coraza
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-coraza
  # G92.4 #2663: HR lives in host ns `dmz` (where bp-dmz-vcluster
  # exports vc-dmz Secret). helm-controller authenticates against the
  # vCluster apiserver and installs the chart inside the vCluster.
  namespace: dmz
  labels:
    catalyst.openova.io/slot: "35"
    catalyst.openova.io/vcluster: dmz
spec:
  interval: 15m
  releaseName: coraza
  # targetNamespace = inner namespace INSIDE the dmz vCluster.
  targetNamespace: coraza
  # hw92 2026-06-04: storageNamespace MUST be set, else helm-controller
  # defaults it to the HR's own namespace (`dmz`) and tries to store the
  # release secret in a `dmz` namespace INSIDE the vCluster — which
  # createNamespace does NOT create (it only creates the target
  # `coraza`). Result: `Helm install failed ... namespaces "dmz" not
  # found`. This was masked on every prior prov because the vCluster
  # kubeconfig server was never reachable (localhost → SAN-mismatch,
  # #3038/#3043), so bp-coraza never reached the release-store stage.
  # Pin storage to the (created) target namespace = vanilla-helm behaviour.
  storageNamespace: coraza
  # vCluster pivot — helm-controller installs the chart inside dmz
  # vCluster (Flux v2 HelmRelease v2 contract). G92.4 #2663.
  kubeConfig:
    secretRef:
      name: vc-dmz
      key: config
  dependsOn:
    # G92.4 #2663: bp-dmz-vcluster MUST be Ready before this HR tries
    # to install — vc-dmz Secret doesn't exist until then. Cross-ns
    # dependsOn requires explicit `namespace:`.
    - name: bp-dmz-vcluster
      namespace: flux-system
    - name: bp-cilium
      namespace: flux-system
    - name: bp-cert-manager
      namespace: flux-system
  chart:
    spec:
      chart: bp-coraza
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: bp-coraza
        namespace: flux-system
  install:
    # G92.4 #2663: createNamespace=true so helm-controller provisions
    # the inner `coraza` namespace inside the dmz vCluster on first
    # install (no host-side Namespace YAML needed).
    createNamespace: true
    timeout: 15m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
