# bp-axon — bootstrap-kit slot 82, Axon, the simulation back end of the model
# plane (chart products/axon/chart, AIP-106). It serves the model contract on
# port 3000 to the model gateway's meter only and its admin routes on port 3001
# to catalyst-api only (the chart's CiliumNetworkPolicy); ClusterIP, no route.
#
# Every region installs it. The primary region runs one replica; every other
# region runs zero (secondary renders "true" there from SECONDARY_HR_SUSPEND)
# and keeps the Service, published to the mesh: one Axon per login.
#
# The credential is a file mounted from OpenBao, never a Secret object. On a
# fresh install nothing holds it yet, and the OpenBao CSI provider fails a mount
# whose path or key is missing. So this slot asks the birth Job of secrets-lib
# (generatedSecrets below) for the empty placeholder
# mounted/data/axon/sa/axon/model-credential/e1 with key document, create-only;
# each region's Job writes its own (sharedAcrossRegions false: no peer trust is
# needed). The Pod then becomes Ready and reports the credential state absent
# until the real document replaces the placeholder.
#
# dependsOn: bp-openbao (the mounted/ mount, the roles workload and
# axon-credential), bp-secrets-store-csi (the CSI driver of the mount) and
# bp-cilium (the CiliumNetworkPolicy and the global Service), each pinned to
# flux-system. The chart comes through the HelmRepository bp-flux of slot 03
# (the same OCI registry).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-axon
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "82"
    catalyst.openova.io/ring: ai
    catalyst.openova.io/component: axon
spec:
  interval: 15m
  releaseName: axon
  targetNamespace: axon
  dependsOn:
    - name: bp-openbao
      namespace: flux-system
    - name: bp-secrets-store-csi
      namespace: flux-system
    - name: bp-cilium
      namespace: flux-system
  chart:
    spec:
      chart: bp-axon
      version: 0.1.9
      sourceRef:
        kind: HelmRepository
        name: bp-flux
        namespace: flux-system
  # The Pod waits for its CSI mount until the birth Job has written the
  # placeholder; the release does not wait for either.
  install:
    timeout: 10m
    disableWait: true
    remediation:
      retries: 5
  upgrade:
    timeout: 10m
    disableWait: true
    remediation:
      retries: 3
  values:
    secondary: ${SECONDARY_HR_SUSPEND:=false}
    generatedSecrets:
      model-credential:
        delivery: mounted
        epoch: 1
        serviceAccount: axon
        sharedAcrossRegions: false
        key: document
        placeholder: true
