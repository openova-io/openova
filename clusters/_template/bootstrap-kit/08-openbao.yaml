# bp-openbao — Catalyst bootstrap-kit Blueprint. Secret backend. 3-node Raft, region-local. No stretched cluster (per SECURITY.md §5).
#
# Wrapper chart: platform/openbao/chart/
# Catalyst-curated values: platform/openbao/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.
#
# G92.2 #2661 (2026-06-01): the HelmRelease installs INSIDE the MGMT
# vCluster via Flux v2 spec.kubeConfig.secretRef → vc-mgmt (kubeconfig
# Secret exported by bp-mgmt-vcluster slot 58). Per docs/SOVEREIGN-
# MULTI-REGION-DOD.md §A4 the secret backend lives in MGMT so it's
# co-located with catalyst-api / org-services. The HR CR itself lives
# in host ns `mgmt` so helm-controller resolves the kubeConfig Secret
# from the same namespace (Flux v2 SecretReference contract). The
# bp-cnpg-backed audit/storage adjuncts continue to use the host's
# CNPG-operator-reconciled Service via cross-vCluster DNS (vCluster
# CoreDNS forwards unknown queries to host kube-dns).

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-openbao
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-openbao
  # G92.2 #2661: HR lives in host ns `mgmt` (where bp-mgmt-vcluster
  # exports vc-mgmt Secret). helm-controller authenticates against the
  # G105-followup #2697 (2026-06-01): metadata.namespace reverted to
  # flux-system. With G92.x slot-level forcing dropped, the HR no
  # longer needs to colocate with vc-mgmt. Reverting also restores
  # the Helm valuesFrom lookup of secrets like 'object-storage'
  # (cloud-init seeds it in flux-system; lookup is in HR's own ns).
  namespace: mgmt  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  labels:
    catalyst.openova.io/slot: "08"
    catalyst.openova.io/vcluster: mgmt
spec:
  interval: 15m
  releaseName: openbao
  targetNamespace: openbao
  storageNamespace: openbao
  # vCluster pivot — the ONE generic render mechanism (placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix)
  kubeConfig:
    secretRef:
      name: vc-mgmt
      key: config
  # G105-followup #2697 (2026-06-01) — G92.2 #2661 placement REVERTED.
  # Same rationale as 09-keycloak: vCluster lacks ExternalSecret + the
  # mgmt namespace inside itself for Helm release storage. Caught live
  # on hw86 2026-06-01: bp-openbao stuck on `Could not determine release
  # state ... dial tcp localhost:8443: connect: connection refused`.
  # Application-controller G92.1 Blueprint-layer pivot stays; slot-level
  # forcing removed until vCluster CRD sync ships.
  dependsOn:
    # bp-mgmt-vcluster MUST be Ready first — the vc-mgmt
    # Secret doesn't exist until then. placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    - name: bp-mgmt-vcluster
      namespace: flux-system
    # bp-gateway-api (issue #503): chart ships an HTTPRoute template at
    # platform/openbao/chart/templates/httproute.yaml; the
    # gateway.networking.k8s.io/v1 CRDs MUST be registered before this
    # HelmRelease applies or install fails with `no matches for kind
    # HTTPRoute`. G92.2: bp-gateway-api lives on host (flux-system).
    - name: bp-gateway-api
      namespace: flux-system
    # bp-cnpg (issue #512): the OpenBao 3-node Raft post-install init Job
    # (Helm hook weight 5) runs `bao operator init` and seals/unseals via
    # Kubernetes auth; both paths require the cnpg PostgreSQL backing the
    # OpenBao audit/storage adjuncts to be Ready, otherwise the hook
    # blocks until Helm's install timeout (15m) expires. Phase-8a-preflight
    # otech16 (2026-05-02): even with timeout=15m, the hook raced cnpg
    # coming up. Adding the explicit dep makes Flux wait for bp-cnpg
    # Ready=True before starting bp-openbao install. See issue #512.
    # G92.2: bp-cnpg stays host-substrate (G92.6 #2665) so the dep is
    # cross-ns (flux-system).
    - name: bp-cnpg
      namespace: flux-system
  chart:
    spec:
      chart: bp-openbao
      # 1.2.39 (#3374): republish — 1.2.38's OCI artifact NEVER landed (its
      # Blueprint Release run failed at the snapshot-replication-toggle.sh test
      # gate, which #3477 left asserting the pre-move s3 endpoint), wedging
      # `chart pull error: not found` on hw133 + every fresh prov. Test fixed +
      # version bumped so the pinned artifact is fetchable on ghcr.
      # 1.2.41 (#3492): CORRECT the cross-region DR to the real OSS mechanism —
      # region-B joins region-A's raft as a NON-VOTER via retry_join (stretched
      # cluster, holds region-A's live KV) instead of the unbuildable
      # snapshot-restore + transition-to-primary (which is not an OSS command).
      # Adds crossRegion + cross-region mesh Service + ConfigMap; Continuum CR
      # promote step is OSS peers.json recovery. Default-OFF, single-region
      # byte-identical. Pin in lockstep.
      # 1.2.42 (#3562 #3373): unwedge the install — snapshot-replication.yaml
      # defaulted the S3-creds Role/RoleBinding namespace to `seaweedfs`, which
      # #3477 re-homed INTO the rtz vCluster (host ns gone), so `helm install`
      # FAILED `namespaces "seaweedfs" not found` → openbao ✗ → sso-bridge ✗ →
      # gitea hang → catalyst-platform ✗ → console 000 (hw144). $credNs now
      # defaults to the release ns (where the CronJob's secretKeyRef reads the
      # creds anyway). Default-OFF path unchanged; pin in lockstep.
      # 1.2.43 (#3612 #3568): Capabilities-guard the Continuum CR so `helm
      # install bp-openbao` no longer FAILS in the SECONDARY region. The CR
      # (dr.openova.io/v1) renders on role=secondary, but its CRD ships with
      # bp-catalyst-platform (slot 13), which is primary-suspended in region-B
      # → CRD absent → `no matches for kind "Continuum"` (hw145 region-b),
      # cascading into sso-bridge/gitea/harbor/oidc-gate/newapi/powerdns-admin.
      # Render now gated on .Capabilities.APIVersions.Has "dr.openova.io/v1"
      # (gold-standard pattern). Single-region byte-identical; pin in lockstep.
      # 1.2.46 (#3629): the SECONDARY (fetch) snapshot CronJob drops its OpenBao
      # k8s-auth login — the fetch is pure S3 I/O and never reads BAO_TOKEN, but
      # the unconditional login crashlooped it on hw147 region-B (`Could not
      # resolve host openbao-openbao…` → `bao login returned no client_token`)
      # while openbao-0 was Running. Login now PRIMARY/save-only. Single-region
      # byte-identical (snapshotReplication default-OFF); pin in lockstep.
      # 1.2.45 (#3626 + #3629): reconcile two concurrent 1.2.44 bumps — the
      # #3626 console "Open" → /sso/landing repoint AND the #3629 snapshot-
      # replication S3 seeder (independent files; pure version-line union).
      # 1.2.44 (#3626): repoint the console "Open" button's launch-url at the
      # on-origin /sso/landing page (drop ssoShim + the /ui/vault/auth?with=oidc
      # deep-link) so OpenBao lands signed-in instead of the popup-only Vault
      # OIDC callback's window.opener=null error. blueprint.yaml/Chart.yaml
      # lockstep; no chart-template change (landing page already shipped 1.2.35).
      # 1.2.47 (#3687, extends #3370): bootstrap self-registration — the
      # chart renders the canonical apps.openova.io/v1 Application CR for
      # this slot's HelmRelease so the console /apps list, per-app Topology
      # tab + showback resolve openbao (no more "no Application CR").
      version: 1.2.48
      sourceRef:
        kind: HelmRepository
        name: bp-openbao
        namespace: flux-system
  # Event-driven install: OpenBao 3-node Raft cluster goes through a
  # post-install init Job (issue #316) — `bao operator init` runs at
  # Helm hook weight 5 and the Kubernetes-auth bootstrap Job at weight
  # 10. The StatefulSet pods stay sealed for ~30s while the init Job
  # runs, so we keep `disableWait: true` (Helm Ready ≠ OpenBao
  # initialised — the init hook drives that out-of-band). Replaces
  # PR #221 spec.timeout: 15m.
  install:
    # G92.2 #2661: createNamespace=true so helm-controller provisions
    # the inner `openbao` namespace inside the mgmt vCluster on first
    # install.
    createNamespace: true
    disableWait: true
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    timeout: 15m
    remediation:
      retries: 3
  # Per-Sovereign overrides:
  # - gateway.host (issue #387): wires the per-Sovereign hostname into
  #   the HTTPRoute template (platform/openbao/chart/templates/httproute.yaml).
  #   The HTTPRoute attaches to cilium-gateway/kube-system installed by
  #   01-cilium.yaml.
  # - autoUnseal.enabled (issue #316): activates the post-install init
  #   Job + Kubernetes-auth bootstrap Job in the chart. Cloud-init
  #   (infra/hetzner/cloudinit-control-plane.tftpl) writes the seed
  #   Secret `openbao-recovery-seed` in the openbao namespace BEFORE
  #   Flux applies this HelmRelease, so the init Job has the seed it
  #   needs on first reconcile.
  values:
    # ── Bootstrap self-registration (#3687, extends #3370) ──────────────
    # The chart self-registers the Application CR for openbao (the
    # canonical instance representation every console surface reads),
    # marked spec.bootstrap=true so the application-controller ADOPTS this
    # HR's install instead of re-rendering it (zero duplicate HRs).
    bootstrapOwned:
      enabled: true
      helmRelease:
        name: bp-openbao
        namespace: flux-system
    gateway:
      enabled: false  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
      host: bao.${SOVEREIGN_FQDN}
    # G91.openbao (#2655) — wire bp-sso-bridge framework. The chart-side
    # continuous reconciler Deployment computes OIDC discovery + redirect
    # URLs from sovereignFqdn. Empty default leaves the reconciler logging
    # "ESO Secret keys not yet present"; the envsubst below activates it
    # zero-touch on every fresh Sovereign.
    sso:
      sovereignFqdn: ${SOVEREIGN_FQDN}
    autoUnseal:
      enabled: true
      # Issue #517 (cont): the chart's init-job.yaml + auth-bootstrap-job.yaml
      # default baoAddress to `http://<release>-openbao:8200`, but with
      # spec.releaseName=openbao the upstream openbao chart's `fullname`
      # template returns just `openbao` (not `openbao-openbao`) because
      # Release.Name CONTAINS chart name. The rendered Service is
      # `openbao` in the openbao namespace. Override the default so the
      # post-install Jobs can actually reach the server.
      baoAddress: http://openbao.openbao.svc.cluster.local:8200
      # Wave 5.55 (#2295, 2026-05-24 post-hw01 manual unblock): bump the
      # init-Job activeDeadlineSeconds from 600s (10m) to 1200s (20m).
      # On hw01 (Huawei HCS slower storage) the openbao-0 StatefulSet
      # Pod took ~7m to reach Ready (vs ~3m on Hetzner). With the
      # 10m default the Job ran out before init could complete; the
      # founder had to `bao operator init` manually then suspend/resume
      # the HR. 1200s gives the StatefulSet up to 12 minutes for
      # cold-start while leaving 8 minutes for bao status wait + init +
      # unseal + Secret writes. Stays under the parent HR's 15m timeout
      # so failed runs still surface as HR errors, not silent kit
      # timeouts.
      activeDeadlineSeconds: 1200
    # Issue #517 (Phase-8a single-node): openbao upstream chart's
    # 3-replica StatefulSet uses required pod-anti-affinity by hostname.
    # On single-node Phase-8a Sovereigns this leaves 2/3 pods Pending
    # forever, the openbao-init Job's wait-for-Ready loop times out, and
    # the entire HR fails post-install. Drop to 1 replica until the
    # workerCount > 0 path is wired — the autoUnseal flow does not
    # require a quorum to bootstrap (Raft is still enabled, just one
    # voter).
    #
    # CRITICAL — schema nesting (issue #517 root cause): platform/openbao/
    # chart/Chart.yaml declares the upstream openbao chart as a Helm
    # SUBCHART under `dependencies:`. Helm umbrella-chart convention
    # requires subchart values to be nested under the dependency name
    # (`openbao:`). Putting `server.ha.replicas` / `server.affinity` at
    # the top level here is SILENTLY IGNORED — the upstream subchart
    # never sees them and renders 3-replica + pod-anti-affinity.
    openbao:
      server:
        ha:
          replicas: 1
        affinity: ""
    # ── #3492 cross-region DR (the real OSS stretched-raft mechanism) ────────
    # 🛑 SECONDARY raft.config NOTE: the one runtime wiring NOT set here is the
    # secondary's `openbao.server.ha.raft.config` retry_join override (region-B
    # joins region-A as a non-voter). It is NOT inlined in this overlay on
    # purpose: a per-region `raft.config` value can't be conditionally included
    # via Flux postBuild.substitute without either (a) drifting from the upstream
    # chart default and breaking the single-region byte-identical render, or
    # (b) emptying the config on the primary. The EXACT secondary HCL is instead
    # version-controlled + render-tested in the chart, emitted into the
    # `openbao-cross-region-raft-config` ConfigMap (secondary-only) by
    # platform/openbao/chart/templates/cross-region-raft-config.yaml. On a
    # 2-region prov cloud-init copies that ConfigMap's `raft-config.hcl` into
    # the secondary region's `SOVEREIGN_OPENBAO_RAFT_CONFIG` substitute (empty on
    # the primary + single-region → upstream default, byte-identical). That
    # cloud-init substitute is the documented activation step; the chart + engine
    # + the DR-contract values below are all in place and render-/unit-tested.
    # All default-OFF; flipped by the ClusterMesh-ready controller on a
    # 2-region prov the SAME way bp-cnpg-pair is (the multi-region substitutes
    # below are the cnpg-pair ones — SOVEREIGN_REGION_ROLE / _PRIMARY_REGION /
    # _REPLICA_REGION / _ENABLE_HOT_STANDBY — so openbao DR activates in
    # lockstep with the cnpg-pair WAL stream over the same ClusterMesh).
    # A single-region prov has these unset → enabled:false everywhere →
    # byte-identical render.
    crossRegion:
      # region-B joins region-A's raft as a non-voter; region-A renders the
      # leader-target mesh Service. Gate on the same hot-standby flag cnpg-pair
      # uses so both DR halves light up together.
      enabled: ${SOVEREIGN_ENABLE_HOT_STANDBY:-false}
      role: ${SOVEREIGN_REGION_ROLE:-primary}
      # leaderApiAddr — region-B's retry_join target. Empty → the chart helper
      # defaults to the in-namespace ClusterMesh-global Service (resolves
      # cluster-locally, routes across the mesh to region-A's active Pod).
      leaderApiAddr: '${SOVEREIGN_OPENBAO_LEADER_API_ADDR:-}'
    # Cross-cluster snapshot floor (RPO backup + forensic). Default-OFF.
    snapshotReplication:
      enabled: ${SOVEREIGN_ENABLE_HOT_STANDBY:-false}
      role: ${SOVEREIGN_REGION_ROLE:-primary}
    # The Continuum DR contract — bp-continuum reconciles it to drive the
    # region-kill peers.json promotion. Renders only on the secondary
    # (chart-gated on continuum.enabled + snapshotReplication.role=secondary).
    continuum:
      enabled: ${SOVEREIGN_ENABLE_HOT_STANDBY:-false}
      primaryRegion: '${SOVEREIGN_PRIMARY_REGION:-}'
      standbyRegion: '${SOVEREIGN_REPLICA_REGION:-}'
      pdmZone: ${SOVEREIGN_FQDN}

# ── HOST-BRIDGE BEGIN (#3642) — placement-generated host-side route/secret/CNPG; edit placement.yaml hostBridge: + run scripts/render-slot-placement.py fix ──
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: mgmt
  labels:
    catalyst.openova.io/blueprint: bp-openbao
    catalyst.openova.io/component: openbao
    catalyst.openova.io/host-bridge: mgmt
spec:
  parentRefs:
  - name: cilium-gateway
    namespace: kube-system
  hostnames:
  - bao.${SOVEREIGN_FQDN}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /sso/landing
    backendRefs:
    - name: openbao-sso-landing-x-openbao-x-mgmt-vcluster
      namespace: mgmt
      port: 80
  - matches:
    - path:
        type: Exact
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: bao.${SOVEREIGN_FQDN}
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /sso/landing
        statusCode: 302
  - matches:
    - path:
        type: Exact
        value: /ui
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: bao.${SOVEREIGN_FQDN}
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /sso/landing
        statusCode: 302
  - matches:
    - path:
        type: Exact
        value: /ui/
    filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: bao.${SOVEREIGN_FQDN}
        port: 443
        path:
          type: ReplaceFullPath
          replaceFullPath: /sso/landing
        statusCode: 302
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: openbao-x-openbao-x-mgmt-vcluster
      namespace: mgmt
      port: 8200
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openbao-sso-oidc-credentials
  namespace: openbao
  labels:
    catalyst.openova.io/blueprint: bp-openbao
    bp-sso-bridge.openova.io/consumer: bp-openbao
    catalyst.openova.io/host-bridge: mgmt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-region1
    kind: ClusterSecretStore
  target:
    name: openbao-sso-oidc-credentials
    creationPolicy: Owner
  data:
  - secretKey: client_id
    remoteRef:
      key: sso/openbao
      property: client_id
  - secretKey: client_secret
    remoteRef:
      key: sso/openbao
      property: client_secret
  - secretKey: issuer_url
    remoteRef:
      key: sso/openbao
      property: issuer_url
# ── HOST-BRIDGE END (#3642) ──
