# bp-openbao — Catalyst bootstrap-kit Blueprint. Secret backend. 3-node Raft, region-local. No stretched cluster (per SECURITY.md §5).
#
# Wrapper chart: platform/openbao/chart/
# Catalyst-curated values: platform/openbao/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.
#
# G92.2 #2661 (2026-06-01): the HelmRelease installs INSIDE the MGMT
# vCluster via Flux v2 spec.kubeConfig.secretRef → vc-mgmt (kubeconfig
# Secret exported by bp-mgmt-vcluster slot 58). Per docs/SOVEREIGN-
# MULTI-REGION-DOD.md §A4 the secret backend lives in MGMT so it's
# co-located with catalyst-api / org-services. The HR CR itself lives
# in host ns `mgmt` so helm-controller resolves the kubeConfig Secret
# from the same namespace (Flux v2 SecretReference contract). The
# bp-cnpg-backed audit/storage adjuncts continue to use the host's
# CNPG-operator-reconciled Service via cross-vCluster DNS (vCluster
# CoreDNS forwards unknown queries to host kube-dns).

---
# Host namespace for openbao's host-bridge Secret (openbao-sso-oidc-credentials).
# #3642 re-homed openbao into the mgmt vCluster; its host-MINTED SSO Secret lands
# in this HOST `openbao` namespace and the raw ExternalSecret (now in the
# bootstrap-kit-crs tier) targets it. Flux applies Namespace kinds before
# namespaced resources, so declaring it here guarantees it exists before
# bootstrap-kit-crs applies the ExternalSecret — without it bootstrap-kit-crs
# atomic-fails `namespaces "openbao" not found`, blocking ALL its CRs (caught
# live on hw162). grafana/newapi declare theirs in their slots; gitea/harbor were
# fixed in #3806; openbao was the remaining gap (Refs #3642 #3731 #3804).
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bp-openbao
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ${REGISTRY_PULL_SECRET:=ghcr-pull}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-openbao
  # G92.2 #2661: HR lives in host ns `mgmt` (where bp-mgmt-vcluster
  # exports vc-mgmt Secret). helm-controller authenticates against the
  # G105-followup #2697 (2026-06-01): metadata.namespace reverted to
  # flux-system. With G92.x slot-level forcing dropped, the HR no
  # longer needs to colocate with vc-mgmt. Reverting also restores
  # the Helm valuesFrom lookup of secrets like 'object-storage'
  # (cloud-init seeds it in flux-system; lookup is in HR's own ns).
  namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  labels:
    catalyst.openova.io/slot: "08"
    catalyst.openova.io/ring: foundation
spec:
  test:
    enable: true
    ignoreFailures: true
    # The function test waits for the store and for the role external-secrets,
    # which this release's Deployment openbao-config writes, until 60 seconds
    # before its bound T, the install timeout below, stated once as
    # values.functionTest.timeoutSeconds (docs/RUNBOOKS.md section 4.5).
    timeout: 15m
    # SEC-162: the upstream chart's server test mounts the server's volumes,
    # the seal directory among them, on any node. Only the chart's own
    # function test runs (bp-openbao templates/tests/function-test.yaml).
    filters:
      - name: openbao-server-test
        exclude: true
  interval: 15m
  releaseName: openbao
  targetNamespace: openbao
  dependsOn:
    # bp-gateway-api (issue #503): chart ships an HTTPRoute template at
    # platform/openbao/chart/templates/httproute.yaml; the
    # gateway.networking.k8s.io/v1 CRDs MUST be registered before this
    # HelmRelease applies or install fails with `no matches for kind
    # HTTPRoute`. G92.2: bp-gateway-api lives on host (flux-system).
    - name: bp-gateway-api
      namespace: flux-system
    # bp-cnpg (issue #512): the OpenBao 3-node Raft post-install init Job
    # (Helm hook weight 5) runs `bao operator init` and seals/unseals via
    # Kubernetes auth; both paths require the cnpg PostgreSQL backing the
    # OpenBao audit/storage adjuncts to be Ready, otherwise the hook
    # blocks until Helm's install timeout (15m) expires. Phase-8a-preflight
    # otech16 (2026-05-02): even with timeout=15m, the hook raced cnpg
    # coming up. Adding the explicit dep makes Flux wait for bp-cnpg
    # Ready=True before starting bp-openbao install. See issue #512.
    # G92.2: bp-cnpg stays host-substrate (G92.6 #2665) so the dep is
    # cross-ns (flux-system).
    - name: bp-cnpg
      namespace: flux-system
  chart:
    spec:
      chart: bp-openbao
      # 1.2.39 (#3374): republish — 1.2.38's OCI artifact NEVER landed (its
      # Blueprint Release run failed at the snapshot-replication-toggle.sh test
      # gate, which #3477 left asserting the pre-move s3 endpoint), wedging
      # `chart pull error: not found` on hw133 + every fresh prov. Test fixed +
      # version bumped so the pinned artifact is fetchable on ghcr.
      # 1.2.41 (#3492): CORRECT the cross-region DR to the real OSS mechanism —
      # region-B joins region-A's raft as a NON-VOTER via retry_join (stretched
      # cluster, holds region-A's live KV) instead of the unbuildable
      # snapshot-restore + transition-to-primary (which is not an OSS command).
      # Adds crossRegion + cross-region mesh Service + ConfigMap; Continuum CR
      # promote step is OSS peers.json recovery. Default-OFF, single-region
      # byte-identical. Pin in lockstep.
      # 1.2.42 (#3562 #3373): unwedge the install — snapshot-replication.yaml
      # defaulted the S3-creds Role/RoleBinding namespace to `seaweedfs`, which
      # #3477 re-homed INTO the rtz vCluster (host ns gone), so `helm install`
      # FAILED `namespaces "seaweedfs" not found` → openbao ✗ → sso-bridge ✗ →
      # gitea hang → catalyst-platform ✗ → console 000 (hw144). $credNs now
      # defaults to the release ns (where the CronJob's secretKeyRef reads the
      # creds anyway). Default-OFF path unchanged; pin in lockstep.
      # 1.2.43 (#3612 #3568): Capabilities-guard the Continuum CR so `helm
      # install bp-openbao` no longer FAILS in the SECONDARY region. The CR
      # (dr.openova.io/v1) renders on role=secondary, but its CRD ships with
      # bp-catalyst-platform (slot 13), which is primary-suspended in region-B
      # → CRD absent → `no matches for kind "Continuum"` (hw145 region-b),
      # cascading into sso-bridge/gitea/harbor/oidc-gate/newapi/powerdns-admin.
      # Render now gated on .Capabilities.APIVersions.Has "dr.openova.io/v1"
      # (gold-standard pattern). Single-region byte-identical; pin in lockstep.
      # 1.2.46 (#3629): the SECONDARY (fetch) snapshot CronJob drops its OpenBao
      # k8s-auth login — the fetch is pure S3 I/O and never reads BAO_TOKEN, but
      # the unconditional login crashlooped it on hw147 region-B (`Could not
      # resolve host openbao-openbao…` → `bao login returned no client_token`)
      # while openbao-0 was Running. Login now PRIMARY/save-only. Single-region
      # byte-identical (snapshotReplication default-OFF); pin in lockstep.
      # 1.2.45 (#3626 + #3629): reconcile two concurrent 1.2.44 bumps — the
      # #3626 console "Open" → /sso/landing repoint AND the #3629 snapshot-
      # replication S3 seeder (independent files; pure version-line union).
      # 1.2.44 (#3626): repoint the console "Open" button's launch-url at the
      # on-origin /sso/landing page (drop ssoShim + the /ui/vault/auth?with=oidc
      # deep-link) so OpenBao lands signed-in instead of the popup-only Vault
      # OIDC callback's window.opener=null error. blueprint.yaml/Chart.yaml
      # lockstep; no chart-template change (landing page already shipped 1.2.35).
      # 1.2.47 (#3687, extends #3370): bootstrap self-registration — the
      # chart renders the canonical apps.openova.io/v1 Application CR for
      # this slot's HelmRelease so the console /apps list, per-app Topology
      # tab + showback resolve openbao (no more "no Application CR").
      # 1.2.50: #3374 — in-vCluster k8s-auth mount + gateway-decoupled zero-click SSO landing.
      # 1.2.52 — #4212 Seam 3: placementSchema aligned with spec.topology
      #   (modes[] admit active-passive + defaultOnMultiRegion). Chart bumped in lockstep.
      # 1.2.53 — #4343: injector.resources.requests so the agent-injector clears
      #   the host-ns Kyverno resource-requests Enforce policy (post-#4325).
      # 1.2.54 — #4347: probes-present compliance — sso-configure liveness/
      #   readiness EXEC probes + server.livenessProbe ENABLED (sealed-tolerant)
      #   so the StatefulSet + sso-configure Deployment clear the host-ns Kyverno
      #   probes-present Enforce policy (post-#4325). Refs #4347 #4325.
      # 1.2.57 — #4477: sso-configure external-group→policy bind fix
      #   (map_admin_group read canonical id from a nonexistent field on fresh
      #   external groups → sovereign-admins/-ops never bound → openbao UI 403).
      # 1.2.58 — #4519: OIDC role oidc_scopes=["groups"] — explicitly request the
      #   `groups` scope so external-group resolution (sovereign-admins →
      #   sso-operator-admin) never depends on the IdP keeping `groups` a DEFAULT
      #   client scope; otherwise a silent claim-drop re-opens the admin UI 403.
      #   Live-verified on 91dc0591: fresh sovereign-admins login lands
      #   /ui/vault/secrets with [default,sso-operator-admin,sso-operator-read].
      # 1.2.60 — #4879: snapshot-FETCH robustness. The secondary's
      #   openbao-snapshot-fetch CronJob ran list-objects-v2 under `set -eu`, so
      #   a NoSuchBucket (local seaweedfs `openbao-snapshots` bucket not yet
      #   created) aborted the Job every tick. Now a missing bucket is treated
      #   like the empty-bucket case: WARN + exit 0 (skipped tick, not failure).
      # 1.2.61 — #5142: continuous unseal reconciler CronJob so OpenBao
      #   re-unseals automatically after a region-kill restart (the one-shot
      #   init Job never re-runs, so post-region-kill the vault stayed SEALED).
      # 1.2.62 — #5146 hotfix: the 1.2.61 reconciler no-op'd on a SEALED vault —
      #   `if ! bao status; then RC=$?` captured the `!`-negated exit code (0),
      #   not bao's real rc=2, so the "reachable-but-sealed" branch never ran.
      #   Caught by the live region-kill DR proof on hw262 (openbao-0 restarted
      #   sealed, reconciler no-op'd every tick). Now captures rc directly.
      # 1.2.64 — #5375 (UAT M2): auth-bootstrap grants the ESO role the narrow
      #   external-secrets-push policy (create/update on exactly secret/
      #   {data,metadata}/catalyst/newapi/admin-token) so bp-newapi 1.4.141's
      #   region-local admin-token PushSecret can seed every region's vault —
      #   closes the region-B catalyst-newapi-admin-token SecretSyncedError
      #   (path never written in region-B; post-promote DR gap).
      # 1.2.66 — #5829 (UAT row 183): BOTH sso-configure ACL-policy writes now
      #   GATE the tick. They were the only writes in that loop whose failure
      #   was swallowed, so a failed write let the loop proceed to
      #   auth/oidc/role/operator with token_policies naming a policy that does
      #   not exist. OpenBao accepts that role; its tokens carry no
      #   capabilities and 403 on everything incl. sys/internal/ui/mounts, so
      #   the UI renders "Not authorized" on a session that authenticated
      #   perfectly. Ordering — policy BEFORE role — is what the gate protects.
      # 1.2.65 — #5763 (UAT row 183 regression): SSO landing re-entry
      #   re-validates a cached token (auth/token/lookup-self) before
      #   trusting it into /ui/vault/secrets, instead of trusting a
      #   client-side-only tokenExpirationEpoch that can't see a server-side
      #   revoke — closes the "no login form but 403 on mounts" gap.
      version: 1.2.85
      sourceRef:
        kind: HelmRepository
        name: bp-openbao
        namespace: flux-system
  # Event-driven install: OpenBao 3-node Raft cluster goes through a
  # post-install init Job (issue #316) — `bao operator init` runs at
  # Helm hook weight 5 and the Kubernetes-auth bootstrap Job at weight
  # 10. The StatefulSet pods stay sealed for ~30s while the init Job
  # runs, so we keep `disableWait: true` (Helm Ready ≠ OpenBao
  # initialised — the init hook drives that out-of-band). Replaces
  # PR #221 spec.timeout: 15m.
  install:
    # G92.2 #2661: createNamespace=true so helm-controller provisions
    # the inner `openbao` namespace inside the mgmt vCluster on first
    # install.
    createNamespace: true
    disableWait: true
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    timeout: 15m
    remediation:
      retries: 3
  # Per-Sovereign overrides:
  # - gateway.host (issue #387): wires the per-Sovereign hostname into
  #   the HTTPRoute template (platform/openbao/chart/templates/httproute.yaml).
  #   The HTTPRoute attaches to cilium-gateway/kube-system installed by
  #   01-cilium.yaml.
  # - seal.stanza (SEC-162): the seal block of ConfigMap
  #   flux-system/sovereign-seal-profile, which cloud-init applies before
  #   Flux reconciles this HelmRelease (contract
  #   docs/contracts/c8-seal-provider.md). The server reads its key from the
  #   node file the stanza names and initialises itself; there is no init
  #   Job and no unseal-key Secret. Without the ConfigMap this release does
  #   not install, and without a stanza the server does not start.
  valuesFrom:
    - kind: ConfigMap
      name: sovereign-seal-profile
      valuesKey: stanza
      targetPath: seal.stanza
  values:
    # ── Bootstrap self-registration (#3687, extends #3370) ──────────────
    # The chart self-registers the Application CR for openbao (the
    # canonical instance representation every console surface reads),
    # marked spec.bootstrap=true so the application-controller ADOPTS this
    # HR's install instead of re-rendering it (zero duplicate HRs).
    bootstrapOwned:
      enabled: true
      helmRelease:
        name: bp-openbao
        namespace: flux-system
    gateway:
      enabled: true  # #4291 DE-VCLUSTER — openbao renders its OWN HTTPRoute natively in host ns `openbao` (was suppressed by the #3642 host-bridge)
      host: bao.${SOVEREIGN_FQDN}
    # G91.openbao (#2655) — wire bp-sso-bridge framework. The chart-side
    # continuous reconciler Deployment computes OIDC discovery + redirect
    # URLs from sovereignFqdn. Empty default leaves the reconciler logging
    # "ESO Secret keys not yet present"; the envsubst below activates it
    # zero-touch on every fresh Sovereign.
    sso:
      sovereignFqdn: ${SOVEREIGN_FQDN}
    # Issue #517: with spec.releaseName=openbao the upstream openbao chart's
    # `fullname` is just `openbao` (Release.Name contains the chart name), so
    # the Service is `openbao` in the openbao namespace. The chart's own
    # clients (configuration reconciler, sign-on reconciler, function test)
    # dial this address.
    baoAddress: http://openbao.openbao.svc.cluster.local:8200
    # Issue #517 (Phase-8a single-node): openbao upstream chart's
    # 3-replica StatefulSet uses required pod-anti-affinity by hostname.
    # On single-node Phase-8a Sovereigns this leaves 2/3 pods Pending
    # forever and the HR never settles. Drop to 1 replica until the
    # workerCount > 0 path is wired: one member opens itself from the
    # node's seal file and self-initialises (Raft is still enabled, just one
    # voter).
    #
    # CRITICAL — schema nesting (issue #517 root cause): platform/openbao/
    # chart/Chart.yaml declares the upstream openbao chart as a Helm
    # SUBCHART under `dependencies:`. Helm umbrella-chart convention
    # requires subchart values to be nested under the dependency name
    # (`openbao:`). Putting `server.ha.replicas` / `server.affinity` at
    # the top level here is SILENTLY IGNORED — the upstream subchart
    # never sees them and renders 3-replica + pod-anti-affinity.
    #
    # #7922 — one replica carries no disruption budget. At one replica the
    # upstream chart renders the budget `openbao` with maxUnavailable 0
    # (its openbao.pdb.maxUnavailable helper), which refuses every eviction
    # of the one Pod, so no drain of its worker can ever finish (hw307: the
    # Pod sat on a worker no kured restart could take, in both regions).
    # Evicted, the Pod comes back on its PVC and unseals itself from the
    # seal file. A Sovereign that runs 3 replicas sets disruptionBudget
    # back to enabled; the chart default (3 replicas) keeps it.
    openbao:
      server:
        ha:
          replicas: 1
          disruptionBudget:
            enabled: false
        affinity: ""
    # ADR-0015 (Refs #7067) — peer-region trust: every region keeps its own
    # OpenBao; a multi-region Application's primary writes its shared material
    # into each peer's OpenBao over ClusterMesh (bp-openbao values §peerTrust).
    # Both inputs are the region registry substitutes cloud-init emits; a
    # single-region Sovereign (one registry entry) renders nothing new.
    # MUST stay quoted: SOVEREIGN_REGIONS_JSON is a JSON array string.
    peerTrust:
      selfRegion: '${SOVEREIGN_REGION_CANONICAL_LABEL:-}'
      regions: '${SOVEREIGN_REGIONS_JSON:-}'
    functionTest:
      timeoutSeconds: 900  # T = install.timeout (15m)
