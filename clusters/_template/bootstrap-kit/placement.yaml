    - {file: 33-syft-grype.yaml, hr: bp-syft-grype, vcluster: host, target: host,
       namespace: syft-grype, justification: "HOST-MINIMUM §4 — SBOM substrate"}
    - {file: 34-velero.yaml, hr: bp-velero, vcluster: host, target: host,
       namespace: velero, justification: "HOST-MINIMUM §4 — cluster backup substrate"}
    - {file: 34a-bp-velero-hcs.yaml, hr: bp-velero-hcs, vcluster: host, target: host,
       namespace: velero, justification: "HOST-MINIMUM §4 — cluster backup substrate (HCS)"}
    - {file: 49-bp-cert-manager-powerdns-webhook.yaml, hr: bp-cert-manager-powerdns-webhook, vcluster: host, target: host,
       namespace: cert-manager, justification: "HOST-MINIMUM §4 — ACME DNS01 webhook substrate"}
    - {file: 50-cluster-autoscaler.yaml, hr: bp-cluster-autoscaler-hcloud, vcluster: host, target: host,
       namespace: cluster-autoscaler, justification: "HOST-MINIMUM §4 — node autoscaling substrate"}
    - {file: 54-bp-dmz-vcluster.yaml, hr: bp-dmz-vcluster, vcluster: host, target: host,
       namespace: dmz, justification: "HOST-MINIMUM §4 — the DMZ vCluster runtime itself"}
    - {file: 55-bp-hcloud-ccm.yaml, hr: bp-hcloud-ccm, vcluster: host, target: host,
       namespace: kube-system, justification: "HOST-MINIMUM §4 — cloud controller manager"}
    - {file: 58-bp-mgmt-vcluster.yaml, hr: bp-mgmt-vcluster, vcluster: host, target: host,
       namespace: mgmt, justification: "HOST-MINIMUM §4 — the MGMT vCluster runtime itself"}
    - {file: 59-bp-rtz-vcluster.yaml, hr: bp-rtz-vcluster, vcluster: host, target: host,
       namespace: rtz, justification: "HOST-MINIMUM §4 — the RTZ vCluster runtime itself"}
    - {file: 60-bp-vcluster-helmrepo.yaml, hr: bp-vcluster-helmrepo, vcluster: host, target: host,
       namespace: flux-system, justification: "HOST-MINIMUM §4 — vCluster chart source"}
