    # chart's gateway is un-suppressed). Per-component default-deny + gateway-
    # ingress CNP is slot 26b bp-plane-isolation. keycloak (the SSO IdP) is the
    # LAST to migrate live since every app's OIDC depends on it.
    - {file: 09-keycloak.yaml, hr: bp-keycloak, vcluster: host, target: host, namespace: keycloak,
       justification: "#4291 DE-VCLUSTER §C — SSO IdP is a platform plane, not a tenant boundary; native host ns renders its own route/DB + per-component default-deny CNP (Refs #4293)"}
    # extraNamespaces: the umbrella renders the Organization service set into ns
