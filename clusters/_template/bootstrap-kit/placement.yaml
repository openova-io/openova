    # ── #3642 HOST-BRIDGE PROMOTE — grafana into the mgmt vCluster ──────
    # The North-Star-#1 batch-D-first app (least blast radius: depends only
    # on already-mgmt loki/mimir/tempo + shared-pg-b). grafana ships an
    # HTTPRoute + an SSO ExternalSecret (no own CNPG Cluster — it is a
    # shared-pg-b consumer). The host-bridge keeps BOTH host-rendered (the
    # host Cilium Gateway + host external-secrets-operator reconcile them
    # exactly as today) while the grafana Deployment re-homes into mgmt via
    # spec.kubeConfig.secretRef → vc-mgmt. `suppress` turns the chart's OWN
    # in-vCluster route + ES off; `hostDocuments` are the host-side copies,
    # backendRef pre-aliased to the OSS-synced mangled Service
    # grafana-x-grafana-x-mgmt-vcluster. The materialized
    # grafana-sso-oidc-credentials Secret reaches the in-vCluster Pod via the
    # mgmt-vcluster `sync.fromHost.secrets` mapping (values.yaml #3642).
    - file: 25-grafana.yaml
      hr: bp-grafana
      vcluster: mgmt
      target: mgmt
      namespace: grafana
      hostBridge:
        # Chart values stamped into the in-vCluster workload HR: the
        # chart's own HTTPRoute + SSO ExternalSecret do NOT render inside
        # the vCluster (the host-side copies below are authoritative).
        suppress:
          gateway.enabled: false
          sso.enabled: false
        # Host-side route + ExternalSecret, transcribed verbatim into the
        # slot by render-slot-placement.py. Placement is DATA.
        hostDocuments:
          # HTTPRoute in the `mgmt` host ns (same as the mangled backend
          # Service → no ReferenceGrant); attaches to kube-system/
          # cilium-gateway via allowedRoutes.from=All.
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: grafana
              namespace: mgmt
              labels:
                catalyst.openova.io/blueprint: bp-grafana
                catalyst.openova.io/component: grafana
                catalyst.openova.io/host-bridge: "mgmt"
            spec:
              parentRefs:
                - name: cilium-gateway
                  namespace: kube-system
              hostnames:
                - grafana.${SOVEREIGN_FQDN}
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    # OSS sync.toHost.services mangled name (grafana Service
                    # synced out of vc-mgmt to the host mgmt namespace).
                    - name: grafana-x-grafana-x-mgmt-vcluster
                      namespace: mgmt
                      port: 80
          - apiVersion: external-secrets.io/v1beta1
            kind: ExternalSecret
            metadata:
              name: grafana-sso-oidc-credentials
              namespace: grafana
              labels:
                catalyst.openova.io/blueprint: bp-grafana
                bp-sso-bridge.openova.io/consumer: bp-grafana
                catalyst.openova.io/host-bridge: "mgmt"
            spec:
              refreshInterval: 1h
              secretStoreRef:
                name: vault-region1
                kind: ClusterSecretStore
              target:
                name: grafana-sso-oidc-credentials
                creationPolicy: Owner
                template:
                  type: Opaque
                  data:
                    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .client_id }}"
                    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .client_secret }}"
                    GF_AUTH_GENERIC_OAUTH_AUTH_URL: "{{ .authorize_url }}?kc_idp_hint=catalyst-pin"
                    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "{{ .token_url }}"
                    GF_AUTH_GENERIC_OAUTH_API_URL: "{{ .userinfo_url }}"
                    GF_SERVER_ROOT_URL: "https://grafana.${SOVEREIGN_FQDN}/"
              data:
                - secretKey: client_id
                  remoteRef:
                    key: sso/grafana
                    property: client_id
                - secretKey: client_secret
                  remoteRef:
                    key: sso/grafana
                    property: client_secret
                - secretKey: authorize_url
                  remoteRef:
                    key: sso/grafana
                    property: authorize_url
                - secretKey: token_url
                  remoteRef:
                    key: sso/grafana
                    property: token_url
                - secretKey: userinfo_url
                  remoteRef:
                    key: sso/grafana
                    property: userinfo_url
    - {file: 39-bp-vllm.yaml, hr: bp-vllm, vcluster: rtz, target: rtz, namespace: vllm}   # Batch A (#3373) — PROMOTED: pure-OSS clean (no route/secret/CNPG); plain Service DNS via OSS services-sync; vllm + its newapi channel both default-OFF on a fresh prov
    - {file: 51-bp-k8s-ws-proxy.yaml, hr: bp-k8s-ws-proxy, vcluster: host, target: mgmt,
       namespace: catalyst-system}   # recipe proven, draft PR #3350
    # ── #3642 HOST-BRIDGE PROMOTE — guacamole into the mgmt vCluster ────
    # Route + CNPG `Cluster` host-bridge — but NO ExternalSecret: guacamole's
    # OIDC client secret is a chart-managed lookup-or-generate v1/Secret
    # (guacamole-oidc, helm.sh/resource-policy:keep), NOT an ESO ExternalSecret,
    # so it needs no host substrate and keeps rendering INSIDE vc-mgmt where the
    # webapp Pod reads it (same apiserver). `suppress` turns the chart's OWN
    # in-vCluster HTTPRoute (guacamole.httproute.enabled:false) + CNPG Cluster
    # (guacamole.database.cluster.enabled:false) off; the host-side copies below
    # are authoritative. ⚠️ guacamole's targetNamespace is `catalyst-system`
    # (co-located with catalyst-api / k8s-ws-proxy), so its route/CNPG render in
    # `catalyst-system` and the mangled backend suffix uses that inner ns. The
    # webapp Pod reaches the host-reconciled guacamole-pg-rw.catalyst-system.svc
    # cross-cluster via host-DNS forwarding. backendRef → guacamole-server-x-
    # catalyst-system-x-mgmt-vcluster.
    - file: 52-bp-guacamole.yaml
      hr: bp-guacamole
      vcluster: mgmt
      target: mgmt
      namespace: catalyst-system
      hostBridge:
        suppress:
          guacamole.httproute.enabled: false
          guacamole.database.cluster.enabled: false
        hostDocuments:
          # HTTPRoute in the `mgmt` host ns (same ns as the mangled backend
          # Service → no ReferenceGrant): the bare-root 302 into the /guacamole/
          # WAR context (Tomcat serves the webapp there, not at /) + the main
          # backend.
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: guacamole-server
              namespace: mgmt
              labels:
                catalyst.openova.io/blueprint: bp-guacamole
                catalyst.openova.io/component: guacamole
                catalyst.openova.io/host-bridge: "mgmt"
            spec:
              parentRefs:
                - name: cilium-gateway
                  namespace: kube-system
              hostnames:
                - guacamole.${SOVEREIGN_FQDN}
              rules:
                - matches:
                    - path:
                        type: Exact
                        value: /
                  filters:
                    - type: RequestRedirect
                      requestRedirect:
                        port: 443
                        path:
                          type: ReplaceFullPath
                          replaceFullPath: /guacamole/
                        statusCode: 302
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - name: guacamole-server-x-catalyst-system-x-mgmt-vcluster
                      namespace: mgmt
                      port: 80
          # CNPG `Cluster` in the `catalyst-system` host ns (HOST cnpg-operator
          # reconciles it; guacamole-pg-rw.catalyst-system.svc reached
          # cross-cluster). Verbatim copy of the chart cnpg-cluster.yaml default
          # render (db `guacamole_db`, owner `guacamole`, managed.roles
          # passwordSecret guacamole-pg-app; instances=1 single-region).
          - apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: guacamole-pg
              namespace: catalyst-system
              labels:
                catalyst.openova.io/blueprint: bp-guacamole
                catalyst.openova.io/component: guacamole-db
                catalyst.openova.io/host-bridge: "mgmt"
            spec:
              instances: 1
              imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql:16
              bootstrap:
                initdb:
                  database: guacamole_db
                  owner: guacamole
              managed:
                roles:
                  - name: guacamole
                    ensure: present
                    login: true
                    passwordSecret:
                      name: guacamole-pg-app
              postgresql:
                parameters:
                  max_connections: "100"
                  shared_buffers: 64MB
                  effective_cache_size: 192MB
                  work_mem: 4MB
                  maintenance_work_mem: 64MB
                  log_statement: ddl
                  log_min_duration_statement: "1000"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              storage:
                size: 5Gi
                storageClass: local-path
              enableSuperuserAccess: true
              monitoring:
                enablePodMonitor: false
    - {file: 56-bp-openova-flow-server.yaml, hr: bp-openova-flow-server, vcluster: host, target: mgmt, namespace: catalyst-system}
    - {file: 57-bp-openova-flow-emitter.yaml, hr: bp-openova-flow-emitter, vcluster: host, target: mgmt, namespace: catalyst-system}
    # ── #3831 CNPG-OWNER HOST-BRIDGE — newapi re-homed INTO vc-mgmt ──
    # newapi is the ONLY NS#1 app that OWNS a dedicated CNPG cluster
    # (`newapi-bp-newapi-newapi-pg`, cnpg.enabled) rather than CONSUMING a
    # fixed-name shared-pg reflected secret like gitea/harbor/keycloak/openbao.
    # The #3642 host-bridge was built for shared-pg CONSUMERS, so a NAIVE
    # promote (just flipping vcluster: mgmt) dropped newapi's CNPG-owner seams
    # — the database-secret-sync Job, the admin-sso-seed Job/CronJob, the
    # newapi-admin AppRegistration ConfigMap, and the database.existingSecret
    # wiring — so the Deployment render-gate ($effDbSecret empty) skip-rendered
    # (0 Deployment; #3832 reverted it to host on hw165).
    #
    # The #3831 fix mirrors the guacamole host-bridge precedent (#3868) and
    # extends it for a CNPG-OWNER app via a chart `placement.role` render-split
    # (bp-newapi 1.4.111). TWO cooperating HRs share releaseName: newapi +
    # chart bp-newapi (different clusters → no Helm-storage collision, fullname
    # lines up):
    #   - THIS slot 80 (vcluster: mgmt, placement.role=vcluster-app) → the
    #     Deployment + Service run INSIDE vc-mgmt; cnpg + ssoBridgeSync + the
    #     catalyst ExternalSecret are suppressed there + database.existingSecret
    #     is wired to the host-rendered, mirrored-in DSN Secret so $effDbSecret
    #     resolves non-empty → the Deployment RENDERS at mgmt.
    #   - slot 80a (vcluster: host, placement.role=host-seams) → the CNPG
    #     Cluster + DSN-sync Job + admin-sso-seed Job/CronJob + AppRegistration
    #     ConfigMap + both ExternalSecrets render in the HOST `newapi` ns where
    #     cnpg-operator / ESO / OpenBao / bp-sso-bridge reconcile them.
    # The bp-mgmt-vcluster 0.2.23 `newapi/*` secret mirror delivers the DSN/OIDC
    # Secrets into vc-mgmt and its newapi-pg `-rw`/`-ro` replicateServices make
    # the host-style CNPG FQDN resolve inside the vCluster. target == vcluster
    # == mgmt → newapi is no longer staged-for-promotion; NS#1 is 7/7.
    - file: 80-newapi.yaml
      hr: bp-newapi
      vcluster: mgmt
      target: mgmt
      namespace: newapi
      hostBridge:
        suppress:
          # render-split: app workload only inside vc-mgmt
          placement.role: vcluster-app
          # the CNPG Cluster + DSN-sync + admin-seed render host-side (slot 80a)
          cnpg.enabled: false
          # the SSO AppRegistration ConfigMap + oidc-sync ES render host-side
          auth.adminUI.keycloak.ssoBridgeSync.enabled: false
          # the catalyst-newapi-admin-token ES renders host-side
          catalystIntegration.externalSecret.enabled: false
          # the public front door is the host-bridge HTTPRoute below
          ingress.httpRoute.enabled: false
          # wire the Deployment to the host-rendered, mirrored-in DSN Secret so
          # the render-gate $effDbSecret is non-empty even with cnpg suppressed
          database.existingSecret: newapi-bp-newapi-newapi-db-dsn
        hostDocuments:
          # Public front door: HTTPRoute in host ns `mgmt`, backendRefs → the
          # syncer-mangled in-vCluster Services (mirror of guacamole slot 52).
          # Exact `/` → the bridge (zero-click landing page,
          # publishNotReadyAddresses) so the 1st bare-URL hit is reachable
          # during warm-up; PathPrefix `/` → the app Service.
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: newapi-server
              namespace: mgmt
              labels:
                catalyst.openova.io/blueprint: bp-newapi
                catalyst.openova.io/component: newapi
                catalyst.openova.io/host-bridge: "mgmt"
            spec:
              parentRefs:
                - name: cilium-gateway
                  namespace: kube-system
              hostnames:
                - newapi.${SOVEREIGN_FQDN}
              rules:
                - matches:
                    - path:
                        type: Exact
                        value: /
                  backendRefs:
                    - name: newapi-bp-newapi-bridge-x-newapi-x-mgmt-vcluster
                      namespace: mgmt
                      port: 8080
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - name: newapi-bp-newapi-x-newapi-x-mgmt-vcluster
                      namespace: mgmt
                      port: 3000
    # ── #3831 host-seams companion — CNPG-owner seams stay HOST-reconciled ──
    # Renders the CNPG Cluster + DSN-sync Job + admin-sso-seed Job/CronJob +
    # newapi-admin AppRegistration ConfigMap + both ExternalSecrets in the host
    # `newapi` ns (placement.role=host-seams). MUST be host: host cnpg-operator
    # owns <cluster>-app, host bp-sso-bridge watches the AppRegistration CM
    # cluster-wide (vCluster toHost is Pro-gated/INERT on OSS), host ESO +
    # OpenBao ClusterSecretStore vault-region1 back both ExternalSecrets.
    - file: 80a-newapi-host-seams.yaml
      hr: bp-newapi-host-seams
      vcluster: host
      target: host
      namespace: newapi
      justification: >-
        CNPG-owner seams (CNPG Cluster + DSN-sync Job + admin-sso-seed
        Job/CronJob + newapi-admin AppRegistration ConfigMap + both
        ExternalSecrets) are intrinsically HOST-reconciled — host cnpg-operator
        owns the <cluster>-app Secret + DB, host bp-sso-bridge watches the
        AppRegistration ConfigMap (OSS vCluster toHost sync is INERT), and host
        ESO + OpenBao back both ExternalSecrets (vc-mgmt runs no ESO). The app
        Deployment/Service run IN vc-mgmt (slot 80); this is the host seam half.
