    - {file: 15a-external-secrets-stores.yaml, hr: bp-external-secrets-stores, vcluster: host, target: host,
       namespace: external-secrets-system, justification: "HOST-MINIMUM §4 — ESO stores substrate"}
    - {file: 16-cnpg.yaml, hr: bp-cnpg, vcluster: host, target: host,
