# placement.yaml — THE single placement source of truth for every
# bootstrap-kit slot (#3373, founder-ratified law 2026-06-12/13).
#
# Where an application runs stops being decided by scattered
# hand-maintained YAML. Each slot's placement-owned HelmRelease fields
# (metadata.namespace, targetNamespace, storageNamespace,
# spec.kubeConfig, the catalyst.openova.io/vcluster label, the
# bp-<tier>-vcluster dependsOn edge, and dependents' cross-namespace
# edges) are a pure function of THIS file. CI enforces it:
#
#   python3 scripts/render-slot-placement.py check   # drift gate
#   python3 scripts/render-slot-placement.py fix     # regenerate
#
# Hand-editing a slot's placement fields without changing this file
# fails CI — placement is DATA, never code (#3373 DoD-6).
#
# Companion conformance audit (declared == actual, zero undeclared
# host workloads — #3373 DoD-4):
#
#   python3 scripts/audit-placement-conformance.py rendered
#   python3 scripts/audit-placement-conformance.py live --kubeconfig <kc>
#
# Field reference (per slot):
#   file          slot file name (clusters/_template/bootstrap-kit/)
#   hr            HelmRelease metadata.name
#   vcluster      ACTIVE placement this template renders TODAY:
#                 host | mgmt | dmz | rtz. The generator stamps the
#                 slot from this value.
#   target        the founder-ratified §4 TARGET placement. When
#                 vcluster != target the row is migration backlog —
#                 promoting it is a ONE-FIELD data change here +
#                 `render-slot-placement.py fix` (#3373 execution
#                 order: PROMOTE-NOW first, NEEDS-REWORK behind the
#                 coupling fixes, staged per ticket §5).
#   namespace     the app's own namespace: targetNamespace on host
#                 placements; the INNER vCluster namespace otherwise.
#   justification REQUIRED when target == host — the §4 host-minimum
#                 reason ("only the minimums could stay there").
#   values        placement-coupled HR values the generator stamps
#                 (fix (a) backendRef aliases for vCluster-synced
#                 Services: <svc>-x-<innerNs>-x-<vclusterRelease>).
# Typed document (placement.catalyst.openova.io) so the bootstrap-kit
# static-validation harness (tests/e2e/bootstrap-kit
# TestBootstrapKit_TemplateClusterParses) accepts it alongside the Flux
# manifests. NOT registered in kustomization.yaml — kustomize/Flux never
# apply it; it is consumed exclusively by the two placement scripts.
apiVersion: placement.catalyst.openova.io/v1alpha1
kind: PlacementTable
metadata:
  name: bootstrap-kit-placement
spec:
  version: 1

  # #4291 Workstream C (Refs #4293 #3642 #3373) — the platform-plane vCluster
  # runtimes (mgmt/dmz/rtz, slots 54/58/59) are RETIRED. The planes are no
  # longer vClusters: every component runs natively in its OWN host namespace
  # (vcluster: host) with a per-component default-deny + CNP (slot 26b). This
  # map is now EMPTY — no bootstrap-kit slot pivots through a platform-plane
  # vCluster. (A vCluster is the per-Organization boundary ONLY, EPIC #4293;
  # those per-Org vClusters are minted dynamically by the org-controller, NOT
  # declared in this static PlacementTable.) The map key stays present (the
  # renderer + audit both require it) — empty means "no plane vClusters".
  vclusters: {}

  slots:
