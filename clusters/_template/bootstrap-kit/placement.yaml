# placement.yaml — THE single placement source of truth for every
# bootstrap-kit slot (#3373, founder-ratified law 2026-06-12/13).
#
# Where an application runs stops being decided by scattered
# hand-maintained YAML. Each slot's placement-owned HelmRelease fields
# (metadata.namespace, targetNamespace, storageNamespace,
# spec.kubeConfig, the catalyst.openova.io/vcluster label, the
# bp-<tier>-vcluster dependsOn edge, and dependents' cross-namespace
# edges) are a pure function of THIS file. CI enforces it:
#
#   python3 scripts/render-slot-placement.py check   # drift gate
#   python3 scripts/render-slot-placement.py fix     # regenerate
#
# Hand-editing a slot's placement fields without changing this file
# fails CI — placement is DATA, never code (#3373 DoD-6).
#
# Companion conformance audit (declared == actual, zero undeclared
# host workloads — #3373 DoD-4):
#
#   python3 scripts/audit-placement-conformance.py rendered
#   python3 scripts/audit-placement-conformance.py live --kubeconfig <kc>
#
# Field reference (per slot):
#   file          slot file name (clusters/_template/bootstrap-kit/)
#   hr            HelmRelease metadata.name
#   vcluster      ACTIVE placement this template renders TODAY:
#                 host | mgmt | dmz | rtz. The generator stamps the
#                 slot from this value.
#   target        the founder-ratified §4 TARGET placement. When
#                 vcluster != target the row is migration backlog —
#                 promoting it is a ONE-FIELD data change here +
#                 `render-slot-placement.py fix` (#3373 execution
#                 order: PROMOTE-NOW first, NEEDS-REWORK behind the
#                 coupling fixes, staged per ticket §5).
#   namespace     the app's own namespace: targetNamespace on host
#                 placements; the INNER vCluster namespace otherwise.
#   justification REQUIRED when target == host — the §4 host-minimum
#                 reason ("only the minimums could stay there").
#   values        placement-coupled HR values the generator stamps
#                 (fix (a) backendRef aliases for vCluster-synced
#                 Services: <svc>-x-<innerNs>-x-<vclusterRelease>).
# Typed document (placement.catalyst.openova.io) so the bootstrap-kit
# static-validation harness (tests/e2e/bootstrap-kit
# TestBootstrapKit_TemplateClusterParses) accepts it alongside the Flux
# manifests. NOT registered in kustomization.yaml — kustomize/Flux never
# apply it; it is consumed exclusively by the two placement scripts.
apiVersion: placement.catalyst.openova.io/v1alpha1
kind: PlacementTable
metadata:
  name: bootstrap-kit-placement
spec:
  version: 1

  # The vCluster runtimes (slots 54/58/59) — host namespace, exported
  # kubeconfig Secret, runtime HR (the dependsOn anchor), and the
  # syncer name-mangling suffix (= the runtime HR's releaseName).
  vclusters:
    mgmt:
      hostNamespace: mgmt
      kubeconfigSecret: vc-mgmt
      runtimeHR: bp-mgmt-vcluster
      syncSuffix: mgmt-vcluster
    dmz:
      hostNamespace: dmz
      kubeconfigSecret: vc-dmz
      runtimeHR: bp-dmz-vcluster
      syncSuffix: dmz-vcluster
    rtz:
      hostNamespace: rtz
      kubeconfigSecret: vc-rtz
      runtimeHR: bp-rtz-vcluster
      syncSuffix: rtz-vcluster

  slots:
    # ── HOST-MINIMUM (§4: cluster substrate / admission / CNI / the
    #    vCluster runtimes themselves — "only the minimums could stay
    #    there, otherwise nothing stays in host") ─────────────────────
    - {file: 01-cilium.yaml, hr: bp-cilium, vcluster: host, target: host,
       namespace: kube-system, justification: "HOST-MINIMUM §4 — CNI substrate"}
    - {file: 01a-gateway-api.yaml, hr: bp-gateway-api, vcluster: host, target: host,
       namespace: flux-system, justification: "HOST-MINIMUM §4 — Gateway API CRDs (cluster-scoped)"}
    - {file: 02-cert-manager.yaml, hr: bp-cert-manager, vcluster: host, target: host,
       namespace: cert-manager, justification: "HOST-MINIMUM §4 — cluster TLS substrate"}
    - {file: 02a-bp-cert-manager-issuers.yaml, hr: bp-cert-manager-issuers, vcluster: host, target: host,
       namespace: cert-manager, justification: "HOST-MINIMUM §4 — cluster TLS substrate (Let's Encrypt ClusterIssuers, #3734 split)"}
    - {file: 03-flux.yaml, hr: bp-flux, vcluster: host, target: host,
       namespace: flux-system, justification: "HOST-MINIMUM §4 — the GitOps engine itself"}
    - {file: 04-crossplane.yaml, hr: bp-crossplane, vcluster: host, target: host,
       namespace: crossplane-system, justification: "HOST-MINIMUM §4 — day-2 infra plumbing (never a user surface)"}
    - {file: 05-sealed-secrets.yaml, hr: bp-sealed-secrets, vcluster: host, target: host,
       namespace: kube-system, justification: "HOST-MINIMUM §4 — secret decryption substrate"}
    - {file: 05a-reflector.yaml, hr: bp-reflector, vcluster: host, target: host,
       namespace: reflector, justification: "HOST-MINIMUM §4 — canonical cross-namespace Secret mirror"}
    - {file: 06a-bp-self-sovereign-cutover.yaml, hr: bp-self-sovereign-cutover, vcluster: host, target: host,
       namespace: catalyst, justification: "HOST-MINIMUM §4 — host-credential surgery by design (8-tether pivot, ADR-0002)"}
    - {file: 11-powerdns.yaml, hr: bp-powerdns, vcluster: host, target: host,
       namespace: powerdns, justification: "HOST-MINIMUM §4 — authoritative DNS substrate"}
    - {file: 12-external-dns.yaml, hr: bp-external-dns, vcluster: host, target: host,
       namespace: external-dns, justification: "HOST-MINIMUM §4 — DNS reconciler substrate"}
    - {file: 14-crossplane-claims.yaml, hr: bp-crossplane-claims, vcluster: host, target: host,
       namespace: crossplane-system, justification: "HOST-MINIMUM §4 — Crossplane claims plumbing"}
    - {file: 13c-bp-oidc-gate.yaml, hr: bp-oidc-gate, vcluster: host, target: host,
       namespace: oidc-gate, justification: "HOST-MINIMUM §4 — auth proxy fronting host-Gateway routes (hubble/openova-flow zero-click, #3374); must sit on the gateway datapath"}
    - {file: 15-external-secrets.yaml, hr: bp-external-secrets, vcluster: host, target: host,
       namespace: external-secrets-system, justification: "HOST-MINIMUM §4 — ESO substrate (resolves synced ExternalSecret CRs, fix (c))"}
    - {file: 15a-external-secrets-stores.yaml, hr: bp-external-secrets-stores, vcluster: host, target: host,
       namespace: external-secrets-system, justification: "HOST-MINIMUM §4 — ESO stores substrate"}
    - {file: 16-cnpg.yaml, hr: bp-cnpg, vcluster: host, target: host,
       namespace: cnpg-system, justification: "HOST-MINIMUM §4 — CNPG operator substrate (reconciles synced Cluster CRs)"}
    - {file: 19c-opentelemetry-operator.yaml, hr: bp-opentelemetry-operator, vcluster: host, target: host,
       namespace: opentelemetry, justification: "HOST-MINIMUM §4 — observability operator substrate"}
    - {file: 20-opentelemetry.yaml, hr: bp-opentelemetry, vcluster: host, target: host,
       namespace: opentelemetry, justification: "HOST-MINIMUM §4 — observability collector substrate"}
    - {file: 21-alloy.yaml, hr: bp-alloy, vcluster: host, target: host,
       namespace: alloy, justification: "HOST-MINIMUM §4 — node-level telemetry shipper (DaemonSet)"}
    - {file: 26-network-policies.yaml, hr: bp-network-policies, vcluster: host, target: host,
       namespace: catalyst-system, justification: "HOST-MINIMUM §4 — cluster network policy substrate"}
    - {file: 27-kyverno.yaml, hr: bp-kyverno, vcluster: host, target: host,
       namespace: kyverno, justification: "HOST-MINIMUM §4 — admission substrate"}
    - {file: 27a-kyverno-policies.yaml, hr: bp-kyverno-policies, vcluster: host, target: host,
       namespace: kyverno, justification: "HOST-MINIMUM §4 — admission policies"}
    - {file: 28-reloader.yaml, hr: bp-reloader, vcluster: host, target: host,
       namespace: reloader, justification: "HOST-MINIMUM §4 — rollout substrate"}
    - {file: 29-vpa.yaml, hr: bp-vpa, vcluster: host, target: host,
       namespace: vpa, justification: "HOST-MINIMUM §4 — autoscaling substrate"}
    - {file: 30-trivy.yaml, hr: bp-trivy, vcluster: host, target: host,
       namespace: trivy-system, justification: "HOST-MINIMUM §4 — image-scanning substrate"}
    - {file: 31-falco.yaml, hr: bp-falco, vcluster: host, target: host,
       namespace: falco, justification: "HOST-MINIMUM §4 — kernel-level runtime security (node access)"}
    - {file: 32-sigstore.yaml, hr: bp-sigstore, vcluster: host, target: host,
       namespace: sigstore-system, justification: "HOST-MINIMUM §4 — signature verification substrate"}
    - {file: 33-syft-grype.yaml, hr: bp-syft-grype, vcluster: host, target: host,
       namespace: syft-grype, justification: "HOST-MINIMUM §4 — SBOM substrate"}
    - {file: 34-velero.yaml, hr: bp-velero, vcluster: host, target: host,
       namespace: velero, justification: "HOST-MINIMUM §4 — cluster backup substrate"}
    - {file: 34a-bp-velero-hcs.yaml, hr: bp-velero-hcs, vcluster: host, target: host,
       namespace: velero, justification: "HOST-MINIMUM §4 — cluster backup substrate (HCS)"}
    - {file: 49-bp-cert-manager-powerdns-webhook.yaml, hr: bp-cert-manager-powerdns-webhook, vcluster: host, target: host,
       namespace: cert-manager, justification: "HOST-MINIMUM §4 — ACME DNS01 webhook substrate"}
    - {file: 50-cluster-autoscaler.yaml, hr: bp-cluster-autoscaler-hcloud, vcluster: host, target: host,
       namespace: cluster-autoscaler, justification: "HOST-MINIMUM §4 — node autoscaling substrate"}
    - {file: 54-bp-dmz-vcluster.yaml, hr: bp-dmz-vcluster, vcluster: host, target: host,
       namespace: dmz, justification: "HOST-MINIMUM §4 — the DMZ vCluster runtime itself"}
    - {file: 55-bp-hcloud-ccm.yaml, hr: bp-hcloud-ccm, vcluster: host, target: host,
       namespace: kube-system, justification: "HOST-MINIMUM §4 — cloud controller manager"}
    - {file: 58-bp-mgmt-vcluster.yaml, hr: bp-mgmt-vcluster, vcluster: host, target: host,
       namespace: mgmt, justification: "HOST-MINIMUM §4 — the MGMT vCluster runtime itself"}
    - {file: 59-bp-rtz-vcluster.yaml, hr: bp-rtz-vcluster, vcluster: host, target: host,
       namespace: rtz, justification: "HOST-MINIMUM §4 — the RTZ vCluster runtime itself"}
    - {file: 60-bp-vcluster-helmrepo.yaml, hr: bp-vcluster-helmrepo, vcluster: host, target: host,
       namespace: flux-system, justification: "HOST-MINIMUM §4 — vCluster chart source"}
    - {file: 62-bp-continuum.yaml, hr: bp-continuum, vcluster: host, target: host,
       namespace: catalyst-system, justification: "HOST-MINIMUM §4 — DR/switchover controller (host reach by design)"}

    # ── §4 TABLE — current → target (PROMOTE-NOW conversions ACTIVE;
    #    the rest is staged migration backlog per ticket §5 execution
    #    order: NEEDS-REWORK 6 behind coupling fix (a), remainder after) ──

    # PROMOTE-NOW (ticket §5 — clean per the 18-app audit) + the DoD-5
    # coupling-fix proof app (gitea).
    - {file: 07-nats-jetstream.yaml, hr: bp-nats-jetstream, vcluster: mgmt, target: mgmt,
       namespace: nats-system}
    # ── #3642 HOST-BRIDGE PROMOTE — keycloak into the mgmt vCluster ─────
    # The #2697 hw130 revert app: install had failed `no matches for kind
    # HTTPRoute` because the OSS syncer registered 0 sync-set CRDs. The
    # init-manifests deployer (bp-mgmt-vcluster experimental.deploy) now
    # registers the structural HTTPRoute CRD inside vc-mgmt, AND the
    # host-bridge keeps keycloak's HTTPRoute HOST-rendered (the chart's own
    # in-vCluster route is suppressed) so the host Cilium Gateway reconciles
    # it. keycloak ships NO ExternalSecret (pin-broker is a SealedSecret) and
    # runs its OWN bundled bitnami PostgreSQL INSIDE the vCluster on a default
    # prov (postgresql.enabled defaults true) — so it is a pure route-only
    # host-bridge, no cross-cluster DB wiring. backendRef → the OSS-synced
    # mangled Service keycloak-x-keycloak-x-mgmt-vcluster.
    - file: 09-keycloak.yaml
      hr: bp-keycloak
      vcluster: mgmt
      target: mgmt
      namespace: keycloak
      hostBridge:
        suppress:
          gateway.enabled: false
        hostDocuments:
          # The host-bridged HTTPRoute lives in the `mgmt` host namespace
          # (where the syncer-mangled backend Service is projected), so the
          # backendRef is SAME-namespace — no ReferenceGrant needed. It
          # still attaches to kube-system/cilium-gateway: every listener
          # sets allowedRoutes.namespaces.from=All (01-cilium.yaml:481), so
          # a route in any namespace binds. The `mgmt` ns is the vCluster
          # runtime namespace (slot 58) and always exists.
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: keycloak
              namespace: mgmt
              labels:
                catalyst.openova.io/blueprint: bp-keycloak
                catalyst.openova.io/component: keycloak
                catalyst.openova.io/host-bridge: "mgmt"
            spec:
              parentRefs:
                - name: cilium-gateway
                  namespace: kube-system
              hostnames:
                - auth.${SOVEREIGN_FQDN}
              rules:
                # BARE-URL sovereign-admin entry (#3374): the root 302s to
                # the SOVEREIGN realm admin console (silent catalyst-pin),
                # not the master-realm login form. Realm = the per-Sovereign
                # short-name (cloud-init substitutes SOVEREIGN_REALM_NAME).
                - matches:
                    - path:
                        type: Exact
                        value: /
                  filters:
                    - type: RequestRedirect
                      requestRedirect:
                        port: 443
                        path:
                          type: ReplaceFullPath
                          replaceFullPath: /admin/${SOVEREIGN_REALM_NAME:=sovereign}/console/
                        statusCode: 302
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - name: keycloak-x-keycloak-x-mgmt-vcluster
                      namespace: mgmt
                      port: 80
    # extraNamespaces: the umbrella renders the Organization service set into ns
    # `sme` and cutover artifacts into ns `catalyst` alongside its own
    # catalyst-system — declared so the live conformance audit can
    # attribute those workloads (multi-namespace chart, not undeclared).
    - {file: 13-bp-catalyst-platform.yaml, hr: bp-catalyst-platform, vcluster: host, target: mgmt,
       namespace: catalyst-system, extraNamespaces: [sme, catalyst]}
    # ── #3642 HOST-BRIDGE PROMOTE — gitea into the mgmt vCluster ────────
    # Route + SSO ExternalSecret + CNPG `Cluster` host-bridge. `suppress` turns
    # the chart's OWN in-vCluster HTTPRoute (gateway.enabled:false), SSO
    # ExternalSecret (sso.enabled:false), AND CNPG Cluster CR
    # (postgres.cluster.enabled:false) off — all three are host-rendered below
    # so the HOST Cilium Gateway / external-secrets-operator / cnpg-operator
    # reconcile them (they are host-minimum substrate the vCluster apiserver
    # can't expose to). The gitea Pod re-homes into vc-mgmt and reaches the
    # host-reconciled gitea-pg-rw.gitea.svc cross-cluster (vCluster CoreDNS
    # forwards unknown queries to host kube-dns; the slot's DB-host default
    # already targets that name). backendRef → the OSS-synced mangled Service
    # gitea-http-x-gitea-x-mgmt-vcluster.
    - file: 10-gitea.yaml
      hr: bp-gitea
      vcluster: mgmt
      target: mgmt
      namespace: gitea
      hostBridge:
        suppress:
          gateway.enabled: false
          # #3934 (Refs #3642): suppress ONLY the chart's in-vCluster
          # ExternalSecret (the host renders gitea-oauth-source-credentials
          # below) — NOT sso.enabled. The chart's sso-configure Deployment
          # MUST render in-vCluster: it kubectl-exec's the live gitea Pod to
          # seed the `openova-sso` login_source DB row (without it
          # /user/oauth2/openova-sso 500s `oauth2 source not found`). Its creds
          # arrive via bp-mgmt-vcluster sync.fromHost
          # `gitea/gitea-oauth-source-credentials`.
          sso.externalSecret.enabled: false
          postgres.cluster.enabled: false
        hostDocuments:
          # HTTPRoute in the `mgmt` host ns (same ns as the mangled backend
          # Service → no ReferenceGrant); the /user/login → OIDC entry redirect
          # (founder zero-click root-URL) + the main backend.
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: gitea
              namespace: mgmt
              labels:
                catalyst.openova.io/blueprint: bp-gitea
                catalyst.openova.io/component: gitea
                catalyst.openova.io/host-bridge: "mgmt"
            spec:
              parentRefs:
                - name: cilium-gateway
                  namespace: kube-system
              hostnames:
                - gitea.${SOVEREIGN_FQDN}
              rules:
                - matches:
                    - path:
                        type: Exact
                        value: /user/login
                  filters:
                    - type: RequestRedirect
                      requestRedirect:
                        port: 443
                        path:
                          type: ReplaceFullPath
                          replaceFullPath: /user/oauth2/openova-sso
                        statusCode: 302
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - name: gitea-http-x-gitea-x-mgmt-vcluster
                      namespace: mgmt
                      port: 3000
          # SSO OAuth-source ExternalSecret in the `gitea` host ns (HOST ESO
          # reconciles it). Verbatim copy of the chart's default render — the
          # target.template remaps the canonical OpenBao keys into gitea's
          # upstream `key`/`secret` existingSecret schema (+ ?kc_idp_hint=
          # catalyst-pin on authorize_url, the chart default idpHint).
          - apiVersion: external-secrets.io/v1beta1
            kind: ExternalSecret
            metadata:
              name: gitea-oauth-source-credentials
              namespace: gitea
              labels:
                catalyst.openova.io/blueprint: bp-gitea
                bp-sso-bridge.openova.io/consumer: bp-gitea
                catalyst.openova.io/host-bridge: "mgmt"
            spec:
              refreshInterval: 1h
              secretStoreRef:
                name: vault-region1
                kind: ClusterSecretStore
              target:
                name: gitea-oauth-source-credentials
                creationPolicy: Owner
                template:
                  type: Opaque
                  metadata:
                    labels:
                      catalyst.openova.io/blueprint: bp-gitea
                      bp-sso-bridge.openova.io/consumer: bp-gitea
                  data:
                    key: "{{ .client_id }}"
                    secret: "{{ .client_secret }}"
                    issuer_url: "{{ .issuer_url }}"
                    authorize_url: "{{ .authorize_url }}?kc_idp_hint=catalyst-pin"
                    token_url: "{{ .token_url }}"
                    userinfo_url: "{{ .userinfo_url }}"
              data:
                - secretKey: client_id
                  remoteRef:
                    key: sso/gitea
                    property: client_id
                - secretKey: client_secret
                  remoteRef:
                    key: sso/gitea
                    property: client_secret
                - secretKey: issuer_url
                  remoteRef:
                    key: sso/gitea
                    property: issuer_url
                - secretKey: authorize_url
                  remoteRef:
                    key: sso/gitea
                    property: authorize_url
                - secretKey: token_url
                  remoteRef:
                    key: sso/gitea
                    property: token_url
                - secretKey: userinfo_url
                  remoteRef:
                    key: sso/gitea
                    property: userinfo_url
          # CNPG `Cluster` in the `gitea` host ns (HOST cnpg-operator
          # reconciles it; the resulting gitea-pg-rw.gitea.svc is reached by the
          # in-vCluster Pod via host-DNS forwarding). Verbatim copy of the
          # chart's cnpg-cluster.yaml default render (instances=1, single-region
          # — no cross-region affinity block; the multi-region overlay re-adds
          # it the same way the chart does at instances>=2).
          - apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: gitea-pg
              namespace: gitea
              labels:
                catalyst.openova.io/blueprint: bp-gitea
                catalyst.openova.io/component: gitea
                catalyst.openova.io/host-bridge: "mgmt"
            spec:
              instances: 1
              imageName: harbor.openova.io/proxy-ghcr/cloudnative-pg/postgresql:16
              bootstrap:
                initdb:
                  database: gitea
                  owner: gitea
              managed:
                roles:
                  - name: gitea
                    ensure: present
                    login: true
                    passwordSecret:
                      name: gitea-pg-app
              inheritedMetadata:
                annotations:
                  reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
                  reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: gitea
                  reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
                  reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: gitea
              postgresql:
                parameters:
                  max_connections: "100"
                  shared_buffers: 64MB
                  effective_cache_size: 192MB
                  work_mem: 4MB
                  maintenance_work_mem: 64MB
                  log_statement: ddl
                  log_min_duration_statement: "1000"
              storage:
                size: 5Gi
                storageClass: local-path
              enableSuperuserAccess: true
              monitoring:
                enablePodMonitor: false

    # Already inside their vClusters (proven recipe slots).
    - {file: 22-loki.yaml, hr: bp-loki, vcluster: mgmt, target: mgmt, namespace: loki}
    - {file: 23-mimir.yaml, hr: bp-mimir, vcluster: mgmt, target: mgmt, namespace: mimir}
    - {file: 24-tempo.yaml, hr: bp-tempo, vcluster: mgmt, target: mgmt, namespace: tempo}
    - {file: 35-coraza.yaml, hr: bp-coraza, vcluster: dmz, target: dmz, namespace: coraza}
    - {file: 19a-bp-sandbox.yaml, hr: bp-sandbox, vcluster: rtz, target: rtz, namespace: catalyst-system}

    # ── §4 PLACEMENT EXCEPTION — host-staying on the pure-OSS Sovereign
    #    stack (a SOVEREIGNTY decision, NOT an unfinished task) ──────────
    #
    # The rows below carry `target != host` (founder §4 wants them in a
    # vCluster). #3642 lands the OSS-native HOST-BRIDGE (see RESOLUTION
    # below) and MOVES keycloak (09) + grafana (25) into the mgmt vCluster
    # in the first car — those two carry `vcluster: mgmt` with a `hostBridge:`
    # block. The #3642 follow-on car then MOVES the remaining 5 route/secret/
    # CNPG apps the SAME way: openbao (08, route + SSO ES), harbor (19) + gitea
    # (10) + newapi (80) + guacamole (52) (route + secret + host-rendered CNPG
    # Cluster). All seven now carry `vcluster: mgmt` + a `hostBridge:` block.
    # This was NEVER a license requirement; the host-bridge keeps the route/
    # secret/CNPG CRs host-rendered (host Cilium Gateway / external-secrets-
    # operator / cnpg-operator reconcile them) while only the workload re-homes.
    # (Migration plan: docs/sessions/2026-06-14/3373-migration-plan.md
    # §0/§4/§6; host-bridge: #3642.)
    #
    # GOVERNING CONSTRAINT #1 — vCluster CRD-sync is loft.sh Free-tier,
    # NOT pure-OSS:
    #   Re-homing a chart that ships an HTTPRoute, an ExternalSecret, or a
    #   CNPG `Cluster` CR requires the vCluster syncer to register those
    #   CRDs inside the vCluster apiserver and mirror the CRs toHost (so
    #   the host Cilium Gateway / external-secrets-operator / cnpg-operator
    #   — all host-minimum substrate — can reconcile them). That
    #   `sync.toHost.customResources` mechanism is a vCluster **Free-tier**
    #   feature that requires an ONGOING connection to the loft.sh platform
    #   for license validation. It is NOT part of the pure-OSS
    #   (Apache-2.0) build hw133's vClusters run. The block is accepted by
    #   Helm but the OSS syncer never registers the CRDs → 0 sync-set CRDs
    #   → the chart fails to install inside the vCluster (measured live on
    #   vc-mgmt 2026-06-13: keycloak `no matches for kind HTTPRoute`; the
    #   #2697 revert). The rtz/mgmt values DO declare the `customResources`
    #   block (coupling fix (b)) — it is accepted but silently no-ops on
    #   the pure-OSS syncer.
    #
    # WHY NOT just license it (path L)? Two sub-paths, both rejected by
    # Pillar 5 (a Sovereign owns its whole stack, no mothership/vendor
    # tether — Principle #11 + ADR-0002):
    #   - Free-tier platform connection = a PERMANENT outbound tether to
    #     admin.loft.sh for license validation. A franchised/air-gapped
    #     Sovereign cannot carry that and still pass the
    #     bp-self-sovereign-cutover deny-egress hold.
    #   - Air-gapped offline-license-key mode is an ENTERPRISE-only add-on
    #     (Dev/Prod/Scale tiers, contact sales@loft.sh) — NOT available on
    #     the Free tier, and a paid per-Sovereign Enterprise license is
    #     itself a vendor tether + recurring cost the model forbids.
    #   (Verified against vCluster docs 2026-06-14: oss-vs-free +
    #   platform/install/air-gapped. The Free-tier CRD-sync feature has NO
    #   offline activation path that is sovereignty-safe.)
    #
    # GOVERNING CONSTRAINT #2 — a host-rendered Secret CANNOT cross
    # host→vCluster on OSS vcluster 0.21.0 (the deeper blocker the
    # host-bridge alone does NOT solve; #3731 + #3737, re-confirmed by the
    # #3642 chart audit 2026-06-17):
    #   The host-bridge (Constraint-#1 answer) keeps the HTTPRoute /
    #   ExternalSecret / CNPG `Cluster` CR HOST-rendered — but every one of
    #   the 7 NS#1 apps' WORKLOAD Pods then needs a Secret that is MINTED ON
    #   THE HOST delivered INTO the vCluster: a CNPG-operator DB credential
    #   (`<app>-pg-app`, reflected/sync-jobbed into `<app>-database-secret`),
    #   and/or a host-ESO SSO Secret (`<app>-sso-oidc-credentials`). NO OSS
    #   0.21.0 mechanism delivers it:
    #     - `sync.fromHost.secrets` (host→vCluster Secret mirror) does NOT
    #       exist until vcluster 0.23.0 — 0.21.0 rejects the unknown config
    #       key at parse, breaking the syncer.
    #     - an in-vCluster ExternalSecret cannot reconcile: ESO is a
    #       host-minimum substrate (slot 15, host), and toHost custom-
    #       resource sync is Pro-gated/inert on OSS.
    #   So the re-homed Pod hangs on `MountVolume.SetUp … secret "<name>" not
    #   found` (keycloak-0 SHARED_PG, #3737) or boots without its SSO/DB
    #   env (grafana zero-click never lands; harbor/gitea/newapi DB DSN
    #   empty). This is INDEPENDENT of Constraint-#1 — even with a perfect
    #   host-bridge, Constraint-#2 wedges the workload.
    #
    #   ROUTE + ExternalSecret — host-bridge MOVED (#3642):
    #     ✅ keycloak (09, route-only — no ES, bundled PG in-vCluster),
    #     ✅ grafana  (25, route + SSO ExternalSecret, shared-pg-b consumer),
    #     ✅ openbao  (08, route + SSO ES; 2-backend bare-URL landing route).
    #   ROUTE + ExternalSecret — host-bridge READY (same recipe, follow-on
    #   rows):
    #     powerdns-admin (11a), openova-flow-server (56).
    #   ROUTE + ExternalSecret + CNPG `Cluster` — host-bridge + the CNPG
    #   Cluster rendered host-side (§5d); the in-vCluster Pod reaches the
    #   host PG cross-cluster — MOVED (#3642 follow-on):
    #     ✅ gitea (10), ✅ harbor (19), ✅ newapi (80), ✅ guacamole (52).
    #   Still host (control-plane root — LAST):
    #     catalyst-platform (13).
    #   CNPG `Cluster` CR engines (host cnpg-operator reconciles host-side) —
    #   host-bridge the Cluster CR (follow-on) — 4:
    #     postgres-shared (×3: 16a/16c/16d) + cnpg-pair (16b).
    #   Host-adjacent reconcilers / DaemonSet (re-home case-by-case, fold
    #   in with their route-bearing peers) — 3:
    #     sso-bridge, openova-flow-emitter, k8s-ws-proxy (k8s-ws-proxy is
    #     a per-node-host-reach DaemonSet → strongest keep-host case).
    #
    # ── #3642 HOST-BRIDGE PROMOTE — openbao into the mgmt vCluster ──────
    # Route + SSO ExternalSecret host-bridge (NO own CNPG — openbao reaches the
    # host cnpg-backed audit/storage adjuncts via cross-cluster DNS, not its own
    # Cluster CR). `suppress` turns the chart's OWN in-vCluster HTTPRoute off
    # (gateway.enabled:false); the host-side copies below are authoritative.
    # NOTE: sso.enabled is NOT suppressed — it gates BOTH the SSO ExternalSecret
    # AND the in-vCluster bare-URL landing-page + sso-configure Deployments,
    # which must keep rendering inside vc-mgmt (the chart's own in-vCluster ES CR
    # is inert there — no ESO operator in the vCluster — while the host-side ES
    # copy below is the one the HOST external-secrets-operator reconciles; same
    # shape as grafana #3703). The host-bridged HTTPRoute carries openbao's full
    # bare-URL ruleset: the on-origin /sso/landing backend (the openbao-sso-
    # landing nginx, syncer-mangled), the bare-path 302 redirects, and the main
    # /-prefix backend (openbao :8200, syncer-mangled). backendRefs → the
    # OSS-synced mangled Services <svc>-x-openbao-x-mgmt-vcluster.
    - file: 08-openbao.yaml
      hr: bp-openbao
      vcluster: mgmt
      target: mgmt
      namespace: openbao
      hostBridge:
        suppress:
          gateway.enabled: false
        hostDocuments:
          # HTTPRoute in the `mgmt` host ns (same ns as the mangled backend
          # Services → no ReferenceGrant); attaches to kube-system/cilium-
          # gateway via allowedRoutes.from=All.
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: openbao
              namespace: mgmt
              labels:
                catalyst.openova.io/blueprint: bp-openbao
                catalyst.openova.io/component: openbao
                catalyst.openova.io/host-bridge: "mgmt"
            spec:
              parentRefs:
                - name: cilium-gateway
                  namespace: kube-system
              hostnames:
                - bao.${SOVEREIGN_FQDN}
              rules:
                # The on-origin SSO landing page (#3374 bare-URL zero-click):
                # the openbao-sso-landing nginx, synced out of vc-mgmt.
                - matches:
                    - path:
                        type: PathPrefix
                        value: /sso/landing
                  backendRefs:
                    - name: openbao-sso-landing-x-openbao-x-mgmt-vcluster
                      namespace: mgmt
                      port: 80
                # Bare-path entry → 302 to the landing page (TOP-LEVEL window
                # OIDC round-trip; the Vault-UI popup-only callback can't land
                # signed-in on a full-page redirect — hw133 lesson).
                - matches:
                    - path:
                        type: Exact
                        value: /
                  filters:
                    - type: RequestRedirect
                      requestRedirect:
                        hostname: bao.${SOVEREIGN_FQDN}
                        port: 443
                        path:
                          type: ReplaceFullPath
                          replaceFullPath: /sso/landing
                        statusCode: 302
                - matches:
                    - path:
                        type: Exact
                        value: /ui
                  filters:
                    - type: RequestRedirect
                      requestRedirect:
                        hostname: bao.${SOVEREIGN_FQDN}
                        port: 443
                        path:
                          type: ReplaceFullPath
                          replaceFullPath: /sso/landing
                        statusCode: 302
                - matches:
                    - path:
                        type: Exact
                        value: /ui/
                  filters:
                    - type: RequestRedirect
                      requestRedirect:
                        hostname: bao.${SOVEREIGN_FQDN}
                        port: 443
                        path:
                          type: ReplaceFullPath
                          replaceFullPath: /sso/landing
                        statusCode: 302
                # Main backend: the OpenBao server (API /v1/* + UI), synced
                # out of vc-mgmt.
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - name: openbao-x-openbao-x-mgmt-vcluster
                      namespace: mgmt
                      port: 8200
          # SSO OIDC-credentials ExternalSecret in the `openbao` host ns (the
          # HOST external-secrets-operator reconciles it). Verbatim copy of the
          # chart's sso-oauth-source-externalsecret.yaml default render.
          - apiVersion: external-secrets.io/v1beta1
            kind: ExternalSecret
            metadata:
              name: openbao-sso-oidc-credentials
              namespace: openbao
              labels:
                catalyst.openova.io/blueprint: bp-openbao
                bp-sso-bridge.openova.io/consumer: bp-openbao
                catalyst.openova.io/host-bridge: "mgmt"
            spec:
              refreshInterval: 1h
              secretStoreRef:
                name: vault-region1
                kind: ClusterSecretStore
              target:
                name: openbao-sso-oidc-credentials
                creationPolicy: Owner
              data:
                - secretKey: client_id
                  remoteRef:
                    key: sso/openbao
                    property: client_id
                - secretKey: client_secret
                  remoteRef:
                    key: sso/openbao
                    property: client_secret
                - secretKey: issuer_url
                  remoteRef:
                    key: sso/openbao
                    property: issuer_url
          # ── #3825 (Refs #3642) HOST token-reviewer for cross-cluster auth ──
          # openbao now runs in vc-mgmt but must TokenReview the HOST-issued ESO
          # ServiceAccount token (external-secrets/external-secrets-system) to
          # let the `vault-region1` ClusterSecretStore authenticate. The pod's
          # in-cluster `kubernetes.default.svc` is the VC-MGMT apiserver, which
          # cannot review a host token → every ESO login 403s → ALL *-oidc
          # ExternalSecrets (incl. openbao-sso-oidc-credentials ABOVE,
          # oidc-gate-*, hubble-ui-oauth2-proxy, per-app SSO) stay unsynced.
          # These three HOST resources supply OpenBao a HOST token_reviewer_jwt
          # + the HOST CA so it can review against the HOST apiserver
          # (auth/kubernetes/config kubernetes_host=https://10.96.0.1:443,
          # disable_local_ca_jwt=true — bp-openbao 1.x crossClusterTokenReview).
          #
          # Delivery: the token Secret is minted in the HOST `openbao` ns; the
          # bp-mgmt-vcluster `sync.fromHost.secrets` `openbao/*` mapping mirrors
          # it into the vc-mgmt `openbao` ns under the SAME name, where the
          # auth-bootstrap Job mounts it. Plain core resources (no operator
          # CRD) so they are safe in this CRD-dependent CRS tier (they carry no
          # `no matches for kind` risk) and land right after bootstrap-kit.
          #
          # 1. HOST ServiceAccount whose token OpenBao presents as the
          #    token_reviewer_jwt. Distinct from the ESO SA — least-privilege:
          #    its ONLY power is TokenReview (via the auth-delegator CRB below).
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: openbao-host-token-reviewer
              namespace: openbao
              labels:
                catalyst.openova.io/blueprint: bp-openbao
                catalyst.openova.io/component: openbao-host-token-reviewer
                catalyst.openova.io/host-bridge: "mgmt"
          # 2. Bind that HOST SA to system:auth-delegator (create on
          #    tokenreviews.authentication.k8s.io) — the ONLY grant OpenBao's
          #    cross-cluster TokenReview needs against the HOST apiserver.
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: openbao-host-token-reviewer-auth-delegator
              labels:
                catalyst.openova.io/blueprint: bp-openbao
                catalyst.openova.io/component: openbao-host-token-reviewer
                catalyst.openova.io/host-bridge: "mgmt"
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: system:auth-delegator
            subjects:
              - kind: ServiceAccount
                name: openbao-host-token-reviewer
                namespace: openbao
          # 3. Long-lived token Secret for that HOST SA. On k8s 1.24+ SA-token
          #    Secrets are no longer auto-created, but an explicit
          #    kubernetes.io/service-account-token Secret IS still populated by
          #    the token controller with `token` (a non-expiring SA JWT) +
          #    `ca.crt` (the HOST cluster CA) — exactly the two values the Job
          #    needs. A non-expiring token is acceptable here: it is
          #    auth-delegator-only (cannot read secrets / mutate anything) and
          #    is the documented pattern for OpenBao's static token_reviewer_jwt.
          - apiVersion: v1
            kind: Secret
            metadata:
              name: openbao-host-token-reviewer
              namespace: openbao
              labels:
                catalyst.openova.io/blueprint: bp-openbao
                catalyst.openova.io/component: openbao-host-token-reviewer
                catalyst.openova.io/host-bridge: "mgmt"
              annotations:
                kubernetes.io/service-account.name: openbao-host-token-reviewer
            type: kubernetes.io/service-account-token
          # ── #3838 mirror-stable Opaque copy of the token-reviewer ──────────
          # The `kubernetes.io/service-account-token` Secret above CANNOT be
          # fromHost-mirrored into vc-mgmt: vCluster's `from-host-secret`
          # syncer copies it, then the vCluster's OWN token-controller
          # re-stamps the SA-token Secret (the referenced SA does not exist in
          # the vCluster), so every reconcile sees host≠virtual drift and
          # RE-CREATES it — an infinite hot loop (2833 `Create virtual object`
          # per 8000 syncer log lines on hw166) that saturates the syncer +
          # host apiserver and starves the keycloak/harbor DB-secret toHost
          # writes (`context deadline exceeded`) → keycloak-0 hangs Init:0/2 →
          # bp-keycloak 30m install-loop stalls the spine ~49/64 HRs (#3838).
          # This Job copies the SA-token's `token` + `ca.crt` into a PLAIN
          # Opaque Secret with NO `kubernetes.io/service-account.name`
          # annotation, so the vCluster token-controller never touches it and
          # bp-mgmt-vcluster's exact-name fromHost mirror is stable. The
          # auth-bootstrap Job mounts THIS Secret (slot 08 crossClusterToken-
          # Review.tokenReviewerSecret.name = openbao-host-token-reviewer-static).
          # Reconciled by bootstrap-kit-crs (dependsOn bootstrap-kit) — built-in
          # resources only (core + rbac.authorization.k8s.io), no CRD risk.
          # #3842: apiVersion MUST be rbac.authorization.k8s.io/v1 — `Role` does
          # not exist in core `v1`. A `v1` here makes the WHOLE bootstrap-kit-crs
          # atomic server-side dry-run fail `no matches for kind "Role" in
          # version "v1"`, so NONE of slot-08's CRS resources land (SA, SA-token
          # Secret, auth-delegator CRB, export Job, ExternalSecret, HTTPRoute) →
          # the static token-reviewer Secret is never minted → openbao
          # auth-bootstrap loops BackoffLimitExceeded → console 000 (live hw167).
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: openbao-host-token-reviewer-export
              namespace: openbao
              labels:
                catalyst.openova.io/blueprint: bp-openbao
                catalyst.openova.io/component: openbao-host-token-reviewer
                catalyst.openova.io/host-bridge: "mgmt"
            rules:
              # Read the SA-token source Secret; create/update the Opaque copy.
              - apiGroups: [""]
                resources: ["secrets"]
                verbs: ["get", "create", "update", "patch"]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: openbao-host-token-reviewer-export
              namespace: openbao
              labels:
                catalyst.openova.io/blueprint: bp-openbao
                catalyst.openova.io/component: openbao-host-token-reviewer
                catalyst.openova.io/host-bridge: "mgmt"
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: openbao-host-token-reviewer-export
            subjects:
              # Reuse the existing host token-reviewer SA — least-privilege:
              # this Role adds only same-namespace Secret read/write on top of
              # its auth-delegator grant.
              - kind: ServiceAccount
                name: openbao-host-token-reviewer
                namespace: openbao
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: openbao-host-token-reviewer-export
              namespace: openbao
              labels:
                catalyst.openova.io/blueprint: bp-openbao
                catalyst.openova.io/component: openbao-host-token-reviewer
                catalyst.openova.io/host-bridge: "mgmt"
                # kyverno `flux-managed` Enforce DENIES a Job without this.
                app.kubernetes.io/managed-by: flux
            spec:
              backoffLimit: 30
              ttlSecondsAfterFinished: 600
              template:
                metadata:
                  labels:
                    catalyst.openova.io/blueprint: bp-openbao
                    catalyst.openova.io/component: openbao-host-token-reviewer
                    app.kubernetes.io/managed-by: flux
                spec:
                  serviceAccountName: openbao-host-token-reviewer
                  restartPolicy: OnFailure
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65532
                    runAsGroup: 65532
                    fsGroup: 65532
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: export
                      # Tiny curl+sh image via the mothership Harbor proxy-cache
                      # (MIRROR-EVERYTHING). Talks to the k8s API directly with
                      # the pod's projected SA token — no kubectl needed.
                      image: harbor.openova.io/proxy-dockerhub/curlimages/curl:8.10.1
                      imagePullPolicy: IfNotPresent
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: ["ALL"]
                      # #3842: kyverno `requests-pod` Enforce DENIES a pod
                      # whose containers omit resources.requests.
                      resources:
                        requests:
                          cpu: "10m"
                          memory: "32Mi"
                        limits:
                          cpu: "100m"
                          memory: "64Mi"
                      # #3842: the script curl-writes /tmp/src.json + /tmp/dst.json
                      # + /tmp/out.json, but readOnlyRootFilesystem:true makes /tmp
                      # unwritable → curl exit 23 (CURLE_WRITE_ERROR) → `set -eu`
                      # aborts before the token is ever read → the static Secret is
                      # never minted (the SA-token Secret IS populated; the wall was
                      # purely a missing writable scratch dir). Mount an emptyDir.
                      volumeMounts:
                        - name: scratch
                          mountPath: /tmp
                      command:
                        - /bin/sh
                        - -c
                        - |
                          set -eu
                          API="https://kubernetes.default.svc"
                          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                          SRC="openbao-host-token-reviewer"
                          DST="openbao-host-token-reviewer-static"
                          NS="openbao"
                          # The token controller populates the SA-token Secret
                          # ASYNCHRONOUSLY — poll until token + ca.crt are both
                          # present (the Job's backoffLimit covers a cold prov).
                          #
                          # FLUX POSTBUILD SUBSTITUTION (Refs #3642): the
                          # bootstrap-kit-crs Kustomization (cloudinit-control-
                          # plane.tftpl) runs postBuild.substitute (drone/envsubst)
                          # over THIS rendered manifest, replacing every shell-var
                          # reference it sees with the empty string. So each shell
                          # variable below is written with a DOUBLED leading dollar
                          # (the documented escape): envsubst collapses the double
                          # dollar to a single literal one and leaves the brace ref
                          # for /bin/sh to expand at runtime. Same idiom as
                          # sovereign-tls/cilium-envoy-tls-restart-job. Without the
                          # escape the rendered script got a blank --cacert, a blank
                          # bearer token, and an empty-namespace URL, so the export
                          # Job CrashLooped, the immutable Job blocked the whole
                          # bootstrap-kit-crs tier, and the platform spine wedged.
                          # NOTE: keep this comment free of a single-dollar brace
                          # reference — drone/envsubst parses comments too and fails
                          # hard ("unable to parse variable name") on a dollar-brace
                          # that is not a valid identifier.
                          echo "waiting for $${SRC} data keys (token + ca.crt)…"
                          tok=""; ca=""
                          for i in $(seq 1 120); do
                            code=$(curl -s -o /tmp/src.json -w '%{http_code}' --cacert "$${CA}" \
                              -H "Authorization: Bearer $${TOKEN}" \
                              "$${API}/api/v1/namespaces/$${NS}/secrets/$${SRC}")
                            if [ "$${code}" = "200" ]; then
                              tok=$(tr -d '\n' < /tmp/src.json | grep -oE '"token"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
                              ca=$(tr -d '\n' < /tmp/src.json | grep -oE '"ca\.crt"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
                              if [ -n "$${tok}" ] && [ -n "$${ca}" ]; then
                                echo "source populated"; break
                              fi
                            fi
                            if [ "$${i}" = "120" ]; then
                              echo "timeout: $${SRC} token/ca.crt absent after 10m" >&2
                              exit 1
                            fi
                            sleep 5
                          done
                          # Build the Opaque destination Secret. Data values are
                          # the ALREADY-base64 bytes from the source (token/ca.crt
                          # under .data are base64-encoded), so reuse verbatim.
                          cat > /tmp/dst.json <<EOF
                          {"apiVersion":"v1","kind":"Secret","metadata":{"name":"$${DST}","namespace":"$${NS}","labels":{"catalyst.openova.io/blueprint":"bp-openbao","catalyst.openova.io/component":"openbao-host-token-reviewer","app.kubernetes.io/managed-by":"flux"}},"type":"Opaque","data":{"token":"$${tok}","ca.crt":"$${ca}"}}
                          EOF
                          # Create, or update if it already exists (idempotent).
                          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST --cacert "$${CA}" \
                            -H "Authorization: Bearer $${TOKEN}" -H "Content-Type: application/json" \
                            --data @/tmp/dst.json \
                            "$${API}/api/v1/namespaces/$${NS}/secrets")
                          if [ "$${code}" = "409" ]; then
                            echo "$${DST} exists — updating"
                            code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X PUT --cacert "$${CA}" \
                              -H "Authorization: Bearer $${TOKEN}" -H "Content-Type: application/json" \
                              --data @/tmp/dst.json \
                              "$${API}/api/v1/namespaces/$${NS}/secrets/$${DST}")
                          fi
                          case "$${code}" in
                            200|201) echo "wrote $${DST} ($${code})";;
                            *) echo "failed to write $${DST}: HTTP $${code}" >&2; cat /tmp/out.json >&2; exit 1;;
                          esac
                  # #3842: writable scratch for the curl -o targets above
                  # (readOnlyRootFilesystem:true makes the image's own /tmp RO).
                  volumes:
                    - name: scratch
                      emptyDir: {}
    - {file: 11a-bp-powerdns-admin.yaml, hr: bp-powerdns-admin, vcluster: host, target: mgmt,
       namespace: powerdns-admin}   # §4: UI not substrate — DEFAULT mgmt, listed for founder veto
    - {file: 13b-bp-sso-bridge.yaml, hr: bp-sso-bridge, vcluster: host, target: mgmt, namespace: sso-bridge}
    - {file: 16a-bp-postgres-shared.yaml, hr: bp-postgres-shared, vcluster: host, target: rtz, namespace: shared-data}
    - {file: 16b-bp-cnpg-pair.yaml, hr: bp-cnpg-pair, vcluster: host, target: rtz, namespace: cnpg}
    - {file: 16c-bp-postgres-shared-b.yaml, hr: bp-postgres-shared-b, vcluster: host, target: rtz, namespace: shared-data}
    - {file: 16d-bp-postgres-shared-c.yaml, hr: bp-postgres-shared-c, vcluster: host, target: rtz, namespace: shared-data}
    - {file: 17-valkey.yaml, hr: bp-valkey, vcluster: rtz, target: rtz, namespace: valkey}   # Batch A (#3373) — PROMOTED: pure-OSS clean (no route/secret/CNPG); plain Service DNS via OSS services-sync
    - {file: 18-seaweedfs.yaml, hr: bp-seaweedfs, vcluster: rtz, target: rtz, namespace: seaweedfs}   # Batch A (#3373) — PROMOTED: pure-OSS clean (no route/secret/CNPG); S3 wire is plain Service DNS via OSS services-sync; all consumers S3-default-OFF on a fresh prov
    # ── #3642 HOST-BRIDGE PROMOTE — harbor into the mgmt vCluster ───────
    # Route + SSO ExternalSecret + CNPG `Cluster` host-bridge (same shape as
    # gitea). `suppress` turns the chart's OWN in-vCluster HTTPRoute, SSO
    # ExternalSecret, and CNPG Cluster CR off; the host-side copies below are
    # authoritative. The harbor route backendRef points at the OSS-synced
    # mangled Service harbor-x-harbor-x-mgmt-vcluster (the slot's
    # gateway.backendService=harbor → the harbor-nginx front door, NOT harbor-
    # core). The harbor Pod re-homes into vc-mgmt and reaches the host-
    # reconciled harbor-pg-rw.harbor.svc cross-cluster via host-DNS forwarding.
    - file: 19-harbor.yaml
      hr: bp-harbor
      vcluster: mgmt
      target: mgmt
      namespace: harbor
      hostBridge:
        suppress:
          gateway.enabled: false
          # #3934 (Refs #3642): suppress ONLY the chart's in-vCluster
          # ExternalSecret (the host renders harbor-sso-oidc-credentials
          # below) — NOT sso.enabled. The sso-configure Deployment MUST render
          # in-vCluster: it PUTs auth_mode=oidc_auth to harbor-core
          # /api/v2.0/configurations (without it harbor stays db_auth → login
          # form, no SSO auto-land). Its creds arrive via bp-mgmt-vcluster
          # sync.fromHost `harbor/harbor-sso-oidc-credentials`.
          sso.externalSecret.enabled: false
          postgres.cluster.enabled: false
        hostDocuments:
