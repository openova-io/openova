# bp-kyverno-policies — Catalyst bootstrap-kit Blueprint #27a
# (W2.K3, Tier 7 — Security/Policy library).
#
# Compliance policy library: 18-of-20 ClusterPolicy templates default-ON
# in `Audit` mode (permissive — admission still passes, PolicyReport rows
# populate). 2 templates default-OFF: `hubble-flows-seen` (W2 Go evaluator
# does the real check, Kyverno gate is a stub) and `cosign-verified`
# (requires operator-supplied PEM bundle).
#
# Split from bp-kyverno (slot 27) per Issue #2019 to break the CRD
# install-ordering race: when policies and Kyverno CRDs land in the same
# Helm pass, the apiserver RESTMapper has not yet learned
# `kyverno.io/v1.ClusterPolicy` when Helm tries to apply the policy CRs.
# Separating into TWO Blueprints lets the engine (slot 27) install + CRDs
# register first, then this slot reconciles the ClusterPolicy CRs cleanly.
#
# Ordering: this Kustomization slot `dependsOn` the bp-kyverno
# Kustomization slot. Cross-kind `HelmRelease.dependsOn → Kustomization`
# is SILENTLY IGNORED by Flux per docs/INVIOLABLE-PRINCIPLES.md #14, so
# the dependsOn lives on the Kustomization, NOT on the HR. The HR also
# carries `dependsOn: bp-kyverno` (same-kind HR→HR — honored) as a
# belt-and-suspenders signal.
#
# Reconciled by: Flux on the new Sovereign's k3s control plane.
# Wrapper chart: platform/kyverno-policies/chart/ (pure overlay; no
# upstream subchart — CRDs come from bp-kyverno's Kyverno subchart).

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-kyverno-policies
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "27a"
spec:
  interval: 15m
  releaseName: kyverno-policies
  targetNamespace: kyverno
  dependsOn:
    - name: bp-kyverno
  chart:
    spec:
      chart: bp-kyverno-policies
      # 1.0.22 (G60 RETROSPECTIVE #2611, 2026-05-30): META-AUDIT 7 closed.
      # Architectural rewrite of harbor-proxy-pull + image-tag-pinned.
      # 7 prior rounds (G19→G40→G45→G51→G55→G58) all patched
      # regex_match+foreach+element.X expression — never asked the
      # architectural question. ALL hit Kyverno JMESPath nil edge
      # cases somewhere (empty initContainers, sidecar injection,
      # autogen Deployment variant, autogen=none + Pod CREATE).
      # G60 drops that primitive in favor of canonical
      # `validate.pattern` + glob — request.object-direct data,
      # no JMESPath substitution path, no element.X nil race.
      # 1.0.23 (G64 #2613, 2026-05-30): broaden harbor-proxy-pull glob
      # to `*/proxy-*/*` — Sovereigns expose Harbor at `registry.<sov>`
      # subdomain not `harbor.<sov>`. Verified live hw71.
      # 1.0.25 (G84a/G87b #2637, 2026-06-01): add dmz/mgmt/rtz to the
      # default excludeNamespaces so the 6 canonically-Enforce policies
      # don't block upstream loft-sh/vcluster STS Pods that don't meet
      # readOnlyRootFilesystem/runAsNonRoot/probes-present defaults.
      # Without this, every fresh HCS Sovereign has all 3 vClusters
      # Pending forever post-Phase-2b bootstrapMode flip → dashboard
      # vCluster grouping shows only "host" → Pillar 4 (Sandbox) silent
      # broken.
      # 1.0.29 (Refs #2737 #3236, 2026-06-11): FIX the three baseline Enforce
      # policies (probes-present / harbor-proxy-pull / image-tag-pinned) whose
      # validate patterns ALWAYS failed — they had never admitted a workload,
      # so they gated the entire hw126 pipeline once a chart first reached
      # admission. Empirically re-cut + two-directionally verified on a local
      # kind + kyverno v1.18 harness. NOTE the G60 "validate.pattern + glob"
      # claim above was the bug: autogen does NOT path-expand anyPattern, and
      # `(image)`/`{"?{}":...}` anchors never validate; the fix uses explicit
      # per-PATH-SHAPE rules + deny/foreach. See Chart.yaml for the full RCA.
      # 1.0.30 (Refs #2737 #3236 #3248, 2026-06-11): EXCLUDE operator-managed
      # data-plane namespaces (`cnpg`, `shared-data`, `powerdns-admin`) from the
      # `flux-managed` (10) Enforce policy. The CNPG operator creates Services
      # (`<cluster>-r`/`-ro`/`-rw`) + utility Jobs with no flux labels/ownerRefs
      # — definitionally un-Flux-manageable — so flux-managed (the one Enforce
      # policy matching Service) denied "Unable to create required cluster
      # objects" the moment a gated CNPG Cluster reached admission on hw126.
      # Per-policy `extraExcludeNamespaces` (NOT the shared anchor): every other
      # policy stays enforced in those namespaces. Verified two-directionally on
      # the same kind + kyverno v1.18 harness. See Chart.yaml for the full RCA.
      # 1.0.31 (Refs #3268 #3263, 2026-06-11): SYSTEMIC inoculation — NEW MUTATE
      # policy `stamp-cilium-enforced-label` auto-stamps
      # `policy.cilium.io/enforced: "true"` on the Pod template of every always-on
      # workload that lacks it, BEFORE 09-cilium-l7-mtls validates. The apiserver
      # runs mutating webhooks before validating webhooks in one admission request,
      # so the stamp lands → 09 admits — fixing 30 of the 34 charts in #3268 at the
      # owning layer instead of 30 per-chart PRs. The label is INERT on the
      # dataplane (Catalyst-internal marker; WireGuard does east-west mTLS
      # unconditionally; SPIFFE mutual-auth OFF). Verified mutate-before-validate
      # on the same kind + kyverno v1.18 harness. The 26 charts with non-proxy
      # images still need the per-chart 11-harbor-proxy fix (a cluster-wide image-
      # rewrite mutate can't know the per-Sovereign Harbor host without re-tethering
      # to the mothership → Pillar 5 violation). See Chart.yaml for the full RCA.
      # 1.0.33 (2026-06-13): EXCLUDE the `powerdns` namespace from the
      # harbor-proxy-pull (11) Enforce policy (new per-policy
      # harborProxyPull.extraExcludeNamespaces). bp-powerdns 1.2.14 reverted its
      # pdns-auth-50 + dnsdist-19 images to raw docker.io because proxy-docker is
      # not bootstrap-pullable on a fresh prov (#3380-D's reroute wedged hw131 +
      # hw132). powerdns stays subject to every OTHER policy (scoped carve-out).
      version: 1.0.33
      sourceRef:
        kind: HelmRepository
        name: bp-kyverno
        namespace: flux-system
  # Event-driven install: 18-of-20 ClusterPolicy CRs apply against the
  # Kyverno CRDs that the engine chart's upstream subchart has already
  # registered (via slot 27's Helm install). disableWait keeps Ready
  # immediate after apply so downstream HRs don't stall waiting on
  # ClusterPolicy-level health which Kyverno reports asynchronously.
  install:
    timeout: 10m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 10m
    disableWait: true
    remediation:
      retries: 3
