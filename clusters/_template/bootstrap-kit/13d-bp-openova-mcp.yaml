# bp-openova-mcp — Catalyst bootstrap-kit Blueprint slot 13d
# (catalyst-platform cohort / Pillar-4 agent access).
#
# The SOVEREIGN-mode instance of the OpenOva MCP server (#3988 / #5114):
# an RBAC-scoped-per-user THIN facade that exposes the OpenOva product
# surface as MCP tools with UI=MCP parity. Streamable-HTTP Service at
# mcp.${SOVEREIGN_FQDN} (Gateway-API HTTPRoute on the canonical Sovereign
# Gateway — never a Traefik Ingress, never a NodePort, §854). Every data
# tool forwards the CALLER's bearer to the live catalyst-api, whose own
# authz is the final word — the pod carries ZERO k8s RBAC and no token
# mount. Per-Org (organization-mode) instances are NOT this slot: they
# install standalone via the SAME per-Org Application-CR door bp-agenity's
# embedded stdio child already uses (POST /applications / the
# create-instance seed path — products/catalyst/bootstrap/api/internal/
# handler/application_parameters.go stampOpenovaMCPOrgParameters, #5206),
# not an automatic Org-create-time trigger.
#
# Slot 13d — the catalyst-platform cohort (13 umbrella / 13b sso-bridge /
# 13c oidc-gate): the facade is meaningless before catalyst-api exists,
# and the bearers it verifies are minted by catalyst-api's handover
# signer against Keycloak-backed sessions (slot 09). It REPLACES the
# retired Sandbox slot 19a (bp-sandbox — Sandbox concept removed by the
# founder 2026-06-30; see kustomization.yaml tombstone).
#
# dependsOn:
#   - bp-catalyst-platform — catalyst-api is the facade's upstream AND
#     the publisher of the catalyst-handover-jwt Secret (the RS256 verify
#     pubkey the chart's deployment reads, #4114). Installing before it
#     would just CrashLoop-wait; the dep edge keeps bootstrap convergence
#     honest.
#   - bp-keycloak — session identity is Keycloak-backed (the Sovereign
#     realm mints the sessions whose bearers this instance verifies).
#     bp-catalyst-platform already gates on bp-keycloak (slot 13 #512),
#     so this edge is belt-and-suspenders documentation of the real
#     dependency.
#   Namespace-pinned to flux-system on every edge (hw91: a namespace-less
#   dependsOn resolves in the HR's OWN namespace — the #3191 dangling-dep
#   wedge shape).
#
# Post-cutover: the bp-openova-mcp HelmRepository is repointed by the
# step-06 live-discovery union (static names ∪ live openova-io
# HelmRepositories, #4573 F4) and the workload image is pivoted by the
# step-07 Phase-4 comprehensive pod-spec sweep (#4973/#4975/#4961) — the
# chart's image helper ALSO honours global.imageRegistry and this slot
# carries the 6-space `imageRegistry: ''` seam for the durable Gitea edit.

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-openova-mcp
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-openova-mcp
  namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  labels:
    catalyst.openova.io/slot: "13d"
    catalyst.openova.io/component: openova-mcp
    catalyst.openova.io/region-role: primary
spec:
  # #5114 hw256 defect 2: PRIMARY-ONLY HR — the same G2 split (#2574) as
  # its cohort's primary-side siblings (13 bp-catalyst-platform / 06a
  # bp-self-sovereign-cutover / 62 bp-continuum). The facade's upstream
  # (catalyst-api) and its dependsOn edge (bp-catalyst-platform) exist
  # only on the primary — bp-catalyst-platform is suspended on secondary
  # CPs by design, so on a secondary this HR could never leave
  # `dependency 'flux-system/bp-catalyst-platform' is not ready`
  # (permanently-False HR fan-out, hw256 region-b). SECONDARY_HR_SUSPEND
  # renders "true" on every secondary CP's cloud-init
  # (sovereign_region_role != "primary") and "false" on the primary,
  # suspending this HR cluster-side without touching the chart catalog.
  suspend: ${SECONDARY_HR_SUSPEND:=false}
  interval: 1m
  releaseName: openova-mcp
  # Lands in catalyst-system co-located with catalyst-api (its facade
  # upstream + the catalyst-handover-jwt verify-pubkey Secret the
  # deployment's optional secretKeyRef reads — a cross-namespace ref is
  # impossible, so co-location IS the wiring).
  targetNamespace: catalyst-system
  dependsOn:
    - name: bp-catalyst-platform
      namespace: flux-system
    - name: bp-keycloak
      namespace: flux-system
  chart:
    spec:
      chart: bp-openova-mcp
      # 0.1.5 (#5206): appVersion 0.2.5 — this Sovereign-mode instance's
      # internal/identity resolver now REJECTS an Org-scoped caller instead
      # of silently relabelling its context to Sovereign (the live hw270
      # org-scoped-forbidden symptom — an Org-admin token had nowhere else
      # to go before the #5206 per-Org install door existed). Values
      # unchanged: mode=sovereign here still pins full Sovereign scope for
      # genuine sovereign-admin bearers.
      # 0.1.2 (#5114 hw258 CHAIN-BLOCKER): appVersion 0.2.2 — the binary
      # degrades instead of CrashLooping when verify=rs256 but the OPTIONAL
      # pubkey Secret is absent/unparseable. On a Sovereign the PEM Secret
      # `catalyst-handover-jwt` is not created (only the JWK mirror
      # `catalyst-handover-jwt-public`, #4228), so the optional secretKeyRef
      # resolved to unset and the 0.2.1 pod FATALed → the 0/1 Deployment
      # tripped the harbor-prewarm cutover settle-gate (#4982) at step-3.
      # 0.2.2 reaches Ready (empty unauthenticated surface; tools/call 401)
      # so cutover settles.
      # 0.1.1 (#5114 hw256 fixes): numeric runAsUser/runAsGroup 65532
      # beside runAsNonRoot (image 0.2.0's string USER `nonroot` wedged
      # the pod at CreateContainerConfigError on hw256) + appVersion
      # 0.2.1 (numeric USER 65532:65532 in the Containerfile) + this
      # slot goes primary-only via SECONDARY_HR_SUSPEND (defect 2).
      # 0.1.0 (#5114, Refs #3988): first release — Deployment (streamable-
      # HTTP transport) + ClusterIP Service + HTTPRoute mcp.<fqdn> +
      # zero-RBAC ServiceAccount + Cilium ingress/egress CNPs. Lockstep:
      # products/openova-mcp/chart/Chart.yaml + blueprint.yaml +
      # catalog-seed (blueprints.json).
      version: 0.1.6
      sourceRef:
        kind: HelmRepository
        name: bp-openova-mcp
        namespace: flux-system
  # Event-driven install: a single stateless Deployment + Service —
  # manifests apply fast; readiness is signalled via Flux dependsOn,
  # never via spec.timeout watchdogs.
  install:
    timeout: 10m
    disableWait: true
    remediation:
      retries: 5
      remediateLastFailure: true
  upgrade:
    timeout: 10m
    disableWait: true
    remediation:
      retries: 3
  # Per-Sovereign overlay surface. ${SOVEREIGN_FQDN} is interpolated at
  # Flux apply time via the bootstrap-kit Kustomization's
  # postBuild.substitute hook.
  values:
    # #4885 / #4892: global.imageRegistry override seam for the step-07
    # cutover image-registry pivot. step-07 patches this HR's
    # spec.values.global.imageRegistry live AND durably sed-edits THIS
    # file — the sed matches `^      imageRegistry:`, so the 6-space
    # indent is REQUIRED. Empty default = verbatim ghcr.io
    # (byte-identical pre-cutover).
    global:
      imageRegistry: ''
    sovereignFqdn: ${SOVEREIGN_FQDN}
    # #5394 — ARM the #5341 secondary-edge path. The chart has shipped
    # `multiRegion.enabled` since #5341/PR#5342, and its own values.yaml
    # comment says "The bootstrap-kit slot sets this true on multi-region
    # provs (mirrors how bp-catalyst-platform annotates catalyst-api/
    # catalyst-ui, #5289)" — but this slot never set it, so the fix has
    # been INERT on every 2-region prov since it landed.
    #
    # Live hw290 (dep 31106b6aa4a7e8e7): region-b's bp-catalyst-secondary-edge
    # is installed and Ready, waiting to proxy mcp.<fqdn> to region-a — but
    # the region-a Service carries an EMPTY service.cilium.io/global
    # annotation, so there is nothing for it to reach. Result: `mcp` is the
    # ONLY *.<fqdn> hostname asymmetric across regions (4 CEC vhosts in
    # region-a, 0 in region-b, against 4-7/4-7 for every symmetric
    # hostname), and ~50% of requests hit region-b's envoy and get a bare
    # 404 with no x-envoy-upstream-service-time — envoy never forwarded
    # them. On a region-A kill the MCP would be 100% dead, not degraded.
    #
    # openova-mcp is primary-only BY DESIGN (#5114 defect 2 — it dependsOn
    # bp-catalyst-platform, which is SECONDARY_HR_SUSPEND on every
    # secondary CP), so installing it in region-b is NOT the fix and would
    # recreate the hw256 permanently-False HR fan-out. Publishing the
    # region-a Service to ClusterMesh is.
    #
    # Same source var as slot 13 uses for the identical #5289 problem, so
    # single-region provs render byte-identically to today.
    multiRegion:
      enabled: ${SOVEREIGN_ENABLE_HOT_STANDBY:-false}
    # The sovereign-mode topology pin (#3988 §4.3): full surface for
    # sovereign-admin bearers, in-cluster catalyst-api upstream (derived
    # by the chart), HTTPRoute mcp.${SOVEREIGN_FQDN} on the canonical
    # kube-system/cilium-gateway (chart defaults).
    mode: sovereign
