# bp-harbor — Catalyst bootstrap-kit Blueprint, W2.K1 slot 19.
# Per-Sovereign OCI registry. Mirrors blueprint chart artifacts and
# container images so the Sovereign isn't dependent on ghcr.io for
# day-2 image pulls; also hosts Org-private images per Application.
#
# Per ADR-0001 §13 (S3-aware app rule) + docs/omantel-handover-wbs.md
# §3 + §3a, on Hetzner Sovereigns Harbor writes its blob backend
# DIRECTLY to Hetzner Object Storage — NOT SeaweedFS, which is
# reserved as a POSIX→S3 buffer for legacy POSIX-only writers and is
# not in the minimal Sovereign set.
#
# Wrapper chart: platform/harbor/chart/ (umbrella over upstream
# goharbor/harbor chart, Catalyst-curated values under the `harbor:`
# key + a vendor-AGNOSTIC `objectStorage.s3.*` section that ships the
# harbor-namespace credentials Secret in
# REGISTRY_STORAGE_S3_{ACCESSKEY,SECRETKEY} envFrom shape).
# Reconciled by: Flux on the new Sovereign's k3s control plane.
#
# Object Storage credential pattern (issue #371, vendor-agnostic since
# #425, applied to bp-harbor in #383):
#   - cloud-init writes flux-system/object-storage Secret with 5 keys:
#     s3-endpoint / s3-region / s3-bucket / s3-access-key /
#     s3-secret-key (operator-issued in the Hetzner Console; Hetzner
#     exposes no Cloud API to mint S3 credentials. Future AWS / Azure /
#     GCP / OCI Sovereigns provision the same Secret name + same keys
#     via their respective `infra/<provider>/` Tofu modules — the seam
#     is vendor-agnostic by name).
#   - This HelmRelease references that Secret via Flux `valuesFrom`,
#     pulling each key into the appropriate Helm value path. The
#     umbrella chart's templates/objectstorage-credentials.yaml then
#     synthesises a harbor-namespace Secret with
#     REGISTRY_STORAGE_S3_ACCESSKEY / REGISTRY_STORAGE_S3_SECRETKEY
#     keys, referenced via persistence.imageChartStorage.s3.existingSecret.
#
# dependsOn: bp-cnpg + bp-cert-manager. The earlier dependency on
# bp-seaweedfs is REMOVED in 1.1.0 (cloud-direct architecture rule;
# SeaweedFS is no longer a Harbor prerequisite on Sovereigns).
#
# Per docs/BOOTSTRAP-KIT-EXPANSION-PLAN.md §6.7 — Harbor sits in the
# storage cohort (W2.K1) rather than apps cohort because it is a
# consumer of CNPG (registry metadata DB), and its presence gates
# Cosign signing in bp-sigstore (slot 32) and image pinning across
# all later HRs.
#
# G92.3 #2662 (2026-06-01): the HelmRelease installs INSIDE the MGMT
# vCluster via Flux v2 spec.kubeConfig.secretRef → vc-mgmt. Per docs/
# SOVEREIGN-MULTI-REGION-DOD.md §A4 harbor is MGMT-tier (intra-cluster
# HA, primary region only). The chart's CNPG `Cluster` CR
# (templates/cnpg-cluster.yaml) lands in the vCluster apiserver where
# the bp-mgmt-vcluster 0.2.1 sync.toHost.customResources policy mirrors
# it back to the host k3s for the cnpg-operator (G92.6 substrate) to
# reconcile. Object Storage S3 credentials still come from the host's
# flux-system/object-storage Secret via Flux valuesFrom — the
# helm-controller running on host resolves valuesFrom from the HR's
# OWN namespace (now `mgmt`), so the Secret must be mirrored from
# flux-system into mgmt via bp-reflector. That's a separate follow-up;
# this PR ships the pivot pattern only and the existing flux-system
# Secret continues to work via the chart's fallback path.

---
# Host namespace for the harbor host-bridge Secret (harbor-oauth-source-credentials).
# #3642 re-homed harbor into the mgmt vCluster, but its host-MINTED SSO Secret
# still lands in this HOST `harbor` namespace (the raw ExternalSecret below targets
# it). Flux applies Namespace kinds before namespaced resources, so declaring it
# here guarantees it exists in the first pass — without it the ExternalSecret
# dry-run fails `namespaces "harbor" not found`, which fails the ENTIRE bootstrap-kit
# reconcile (0 HRs → fresh-prov wedge). grafana/newapi already declare theirs;
# gitea/harbor were missed in the #3642 relocation (caught live on hw161, Refs #3804).
apiVersion: v1
kind: Namespace
metadata:
  name: harbor
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-harbor
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-harbor
  # G92.3 #2662: HR lives in host ns `mgmt` (where bp-mgmt-vcluster
  # exports vc-mgmt Secret). helm-controller authenticates against the
  # G105-followup #2697 (2026-06-01): metadata.namespace reverted to
  # flux-system. With G92.x slot-level forcing dropped, the HR no
  # longer needs to colocate with vc-mgmt. Reverting also restores
  # the Helm valuesFrom lookup of secrets like 'object-storage'
  # (cloud-init seeds it in flux-system; lookup is in HR's own ns).
  namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  labels:
    catalyst.openova.io/slot: "19"
spec:
  # G50 (Refs #2602, 2026-05-30): interval 15m → 1m so install remediation
  # retries fire within ~5min total (5 × 1m) instead of 45min (3 × 15m).
  # Catches the cnpg-webhook caBundle race (~30-60s clear time) where the
  # MutatingWebhookConfiguration's caBundle is populated by cert-manager-
  # cainjector after a delay. Verified live on hw58 v10 02:00Z:
  # InstallFailed "x509: certificate signed by unknown authority" calling
  # mcluster.cnpg.io webhook; cert was Ready 5min later but no retry fired
  # within the 33min observation window. Same META-AUDIT 1 class as G44.
  interval: 1m
  releaseName: harbor
  targetNamespace: harbor
  dependsOn:
    - name: bp-cnpg
      namespace: flux-system
    - name: bp-cert-manager
      namespace: flux-system
    # bp-gateway-api (issue #503): chart ships an HTTPRoute template;
    # gateway.networking.k8s.io/v1 CRDs must be registered first.
    - name: bp-gateway-api
      namespace: flux-system
    # #3052-followup (2026-06-04, hw95): the chart ships an
    # externalsecret.external-secrets.io resource. Without this dependency
    # Harbor installs BEFORE the external-secrets admission webhook is
    # serving, so the ExternalSecret create fails ("failed calling webhook
    # validate.externalsecret.external-secrets.io: connection refused"),
    # the install retries 6× → Stalled, and Flux uninstall-remediates →
    # the last ~8 HRs never all-ready so bootstrap-kit never holds stable
    # Ready → sovereign-tls never binds → console 000. Gating on
    # bp-external-secrets (the #2988 gold-standard pattern) makes Harbor
    # wait for the webhook to be Ready before it creates the ExternalSecret.
    - name: bp-external-secrets
      namespace: flux-system
    # ADR-0010 reuse proof: harbor dependsOn bp-postgres-shared (slot 16a)
    # UNCONDITIONALLY. Always safe because slot 16a installs an EMPTY (but
    # Ready) release by default (SOVEREIGN_ENABLE_SHARED_PG=false) — the
    # edge just waits for that empty HR to be Ready whether or not harbor
    # is sharing. (#3191 regression: slot 16a authored but never registered
    # in kustomization.yaml → HR never created → this edge dangled → harbor
    # Ready=False. Fixed by registering 16a.)
    #
    # TWO-FLAG CONTRACT to actually SHARE: flip BOTH
    # SOVEREIGN_HARBOR_PG_OWN_CLUSTER=false (harbor skips its OWN harbor-pg
    # Cluster + points its DB host at shared-pg's -rw Service) AND
    # SOVEREIGN_ENABLE_SHARED_PG=true (slot 16a renders the shared engine +
    # provisions harbor's `registry` Database + role + reflected
    # harbor-database-secret). The defaults (own-cluster=true, shared-pg=
    # false) are the byte-identical 1:1 legacy path.
    - name: bp-postgres-shared
      namespace: flux-system
  chart:
    spec:
      chart: bp-harbor
      # 1.2.28: #3285 — SHARED-PG consumer wiring. database-secret-sync-job
      # gated on postgres.cluster.enabled (skipped in SHARED mode, where no
      # harbor-pg-app exists to poll). harbor's externalDatabase already
      # reads harbor-database-secret (key password); the host flips via the
      # SOVEREIGN_HARBOR_PG_HOST seam below. own-cluster render byte-identical.
      # 1.2.26: #3098 — guard the SSO ExternalSecret template with the
      # .Capabilities.APIVersions.Has "external-secrets.io/v1beta1" CRD-check
      # (gold standard, mirrors bp-external-dns + bp-sandbox). The dependsOn:
      # bp-external-secrets below gates HR-Ready but Helm renders the manifest
      # at install time before the webhook is necessarily serving; the
      # Capabilities guard omits the resource until the CRD exists, then
      # re-renders on the next reconcile. Fixes the hw100 harbor→ESO-webhook
      # wedge that held bootstrap-kit convergence (handover never fired).
      # 1.2.15: hot-fix for issue #949 — admin-secret.yaml duplicate
      # label keys (app.kubernetes.io/name, catalyst.openova.io/
      # component) made Helm's strict YAML post-render reject the
      # rendered manifest, blocking the upgrade chain on otech113.
      # Labels in admin-secret.yaml are now inlined verbatim instead
      # of `include "bp-harbor.labels"` + override, eliminating the
      # collision.
      # 1.2.14: Catalyst-curated `harbor-admin` Secret with Reflector
      # mirror annotations into `catalyst` ns so the
      # bp-self-sovereign-cutover Step 02 (harbor-projects) Job in
      # `catalyst` can read HARBOR_ADMIN_PASSWORD via secretKeyRef
      # without the cross-namespace forbiddance K8s enforces. Caught
      # live on otech113 2026-05-05 (issue #935 Bug 1) — Step 02 was
      # in CreateContainerConfigError for 11+ retries, blocking
      # cutover indefinitely.
      # 1.2.29 (#3296): kyverno-Enforce roll landmines — sync-job hook Job
      # labels inlined with app.kubernetes.io/managed-by:flux (the shared
      # labels helper emits managed-by:Helm which the flux-managed policy
      # rejects; hooks bypass helm-controller's OriginLabels); all
      # goharbor/* images (incl. the previously-default nginx-photon)
      # pulled via harbor.openova.io/proxy-dockerhub (bare refs denied by
      # harbor-proxy-pull on any roll — wedged live hw128 on the 1.2.28
      # upgrade, harbor-registry ReplicaSet FailedCreate).
      # 1.2.30 (2026-06-12, founder): primary_auth_mode=true — hitting
      # registry.<fqdn>/ auto-initiates OIDC instead of showing the form.
      # 1.2.31 (#3687, extends #3370): bootstrap self-registration — the
      # chart renders the canonical apps.openova.io/v1 Application CR for
      # this slot's HelmRelease so the console /apps list, per-app Topology
      # tab + showback resolve harbor (no more "no Application CR").
      # 1.2.33: #3855 — durable zero-click SSO (continuous OIDC reconciler + bare-URL redirect).
      # 1.2.34 (#3934 / Refs #3642, 2026-06-20): split-gate — the in-vCluster
      # sso-configure Deployment survives the host-bridge suppress (only the
      # ExternalSecret is suppressed via sso.externalSecret.enabled), so
      # auth_mode=oidc_auth is PUT in the mgmt vCluster placement (caught live
      # hw171: systeminfo auth_mode=db_auth). Refs #3374 #3642.
      # 1.2.36 (#4059 / Refs #3642 #3953): decouple the harbor-pg-app →
      # harbor-database-secret rename bridge onto postgres.databaseSecretSync
      # .enabled (default true), independent of postgres.cluster.enabled (which
      # the #3642 host-bridge ALSO flips false). The renamer was wrongly skipped
      # in the host-bridge path → harbor-core CreateContainerConfigError →
      # registry.<fqdn> 502 / harbor.<fqdn> 404 (hw172/hw173). databaseSecretSync
      # follows SOVEREIGN_HARBOR_PG_OWN_CLUSTER (own-vs-shared), set false only in
      # TRUE shared-pg mode. Non-host-bridged render byte-identical.
      # 1.2.37 — #4212 Seam 3: placementSchema aligned with spec.topology
      #   (modes[] admit active-hot-standby + defaultOnMultiRegion). Chart bumped in lockstep.
      # 1.2.38 — #4343: nginx.resources.requests so harbor-nginx clears the
      #   host-ns Kyverno resource-requests Enforce policy (post-#4325).
      # 1.2.39 — #4347: harbor-sso-configure liveness/readiness EXEC probes so
      #   it clears the host-ns Kyverno probes-present Enforce policy (post-#4325).
      #   Refs #4347 #4325.
      # 1.2.41 — #4913 (hw233): the HTTPRoute now ALSO answers on the app-named
      #   harbor.${SOVEREIGN_FQDN}, not just the canonical registry.${SOVEREIGN_FQDN}
      #   set in gateway.host below. Harbor serves UI+registry+SSO on ONE host
      #   (registry.<fqdn>); harbor.<fqdn> had NO route → bare-envoy 404 for any
      #   operator/tool reaching for it (wildcard DNS resolves it to the gateway VIP
      #   but no route hostname matched). gateway.aliasHarborHost (default true)
      #   auto-adds the harbor.-prefixed alias; the wildcard listener (01-cilium.yaml
      #   *.${SOVEREIGN_FQDN}:443) + wildcard TLS already cover it, so no per-Sovereign
      #   DNS/cert change. externalURL + OIDC redirect_uri stay on registry.<fqdn>.
      # 1.2.42: updateStrategy Recreate — single-replica RWO jobservice
      # deadlocked cutover step-08's forced roll on Multi-Attach (#5022).
      version: 1.2.43
      sourceRef:
        kind: HelmRepository
        name: bp-harbor
        namespace: flux-system
  # Event-driven install per docs/INVIOLABLE-PRINCIPLES.md #3.
  # timeout: 15m — Harbor's post-install hooks (DB migration, job-service
  # init) legitimately need >5m on cold k3s. Same canonical-seam pattern
  # as Fix #127 (cutover), Fix #131 (gitea), Fix #143 (es-stores):
  # explicit HR-level timeout overrides Helm's 5m default which expires
  # before Harbor reaches Ready (prov #24 c776423270f4ae30 04:17 incident).
  install:
    # G92.3 #2662: createNamespace=true so helm-controller provisions
    # the inner `harbor` namespace inside the mgmt vCluster on first
    # install.
    createNamespace: true
    timeout: 15m
    disableWait: true
    remediation:
      retries: 5
      remediateLastFailure: true
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 5
      remediateLastFailure: true
  # ── Vendor-agnostic Object Storage backend wiring (issue #383 / #425) ──
  #
  # Each entry below pulls a single key from the canonical
  # flux-system/object-storage Secret (shipped by cloud-init in
  # infra/<provider>/cloudinit-control-plane.tftpl) into the matching
  # value path in the umbrella chart. Flux dereferences `valuesFrom` at
  # HelmRelease apply time, so plaintext credentials never appear in
  # this committed manifest.
  #
  # NOTE: targetPath uses dot notation; keys are required by default
  # (`optional: false` is the implicit default).
  valuesFrom:
    - kind: Secret
      name: object-storage
      valuesKey: s3-bucket
      targetPath: harbor.persistence.imageChartStorage.s3.bucket
    - kind: Secret
      name: object-storage
      valuesKey: s3-region
      targetPath: harbor.persistence.imageChartStorage.s3.region
    - kind: Secret
      name: object-storage
      valuesKey: s3-endpoint
      targetPath: harbor.persistence.imageChartStorage.s3.regionendpoint
    - kind: Secret
      name: object-storage
      valuesKey: s3-access-key
      targetPath: objectStorage.s3.accessKey
    - kind: Secret
      name: object-storage
      valuesKey: s3-secret-key
      targetPath: objectStorage.s3.secretKey
  # Per-Sovereign overrides — issue #387 + #383:
  # - gateway.host wires the per-Sovereign hostname into the HTTPRoute.
  # - objectStorage.enabled: true engages the cloud-direct S3 backend
  #   (Hetzner Object Storage on Hetzner Sovereigns).
  # - harbor.persistence.imageChartStorage.type: s3 flips upstream chart
  #   off the default filesystem mode.
  # - harbor.persistence.imageChartStorage.s3.existingSecret matches the
  #   credentials Secret name templated by the umbrella chart.
  values:
    # ── Bootstrap self-registration (#3687, extends #3370) ──────────────
    # The chart self-registers the Application CR for harbor (the canonical
    # instance representation every console surface reads), marked
    # spec.bootstrap=true so the application-controller ADOPTS this HR's
    # install instead of re-rendering it (zero duplicate HRs).
    bootstrapOwned:
      enabled: true
      helmRelease:
        name: bp-harbor
        namespace: flux-system
    gateway:
      enabled: true  # #4291 DE-VCLUSTER — harbor renders its OWN HTTPRoute natively in host ns `harbor` (was suppressed by the #3642 host-bridge)
      host: registry.${SOVEREIGN_FQDN}
      # #3150 (2026-06-09): the chart's HTTPRoute backend defaults to
      # `harbor-core`, but harbor-core is the API backend — it returns 404 for
      # the portal SPA paths (`/`, `/account/sign-in`). registry.<sov>/ thus
      # 404'd for every operator. The umbrella `harbor` Service (harbor-nginx
      # front door) fans `/`→portal, `/api`,`/c`,`/service`→core, `/v2`→registry.
      # Repoint the route at it. Verified live on hw124: `/`→200, `/v2/`→401.
      backendService: harbor
    # G91.harbor (#2654) — wire bp-sso-bridge framework. The chart-side
    # post-install Job PUTs /api/v2.0/configurations with
    # auth_mode=oidc_auth + oidc_endpoint computed from sovereignFqdn.
    sso:
      externalSecret:
        enabled: true  # #4291 DE-VCLUSTER — harbor renders its OWN SSO ExternalSecret natively in host ns `harbor` (host ESO reconciles it; was suppressed by the #3642 host-bridge)
      # sso.enabled STAYS true so the sso-configure Deployment PUTs
      # auth_mode=oidc_auth to harbor-core /api/v2.0/configurations.
      enabled: true
      sovereignFqdn: ${SOVEREIGN_FQDN}
    # G87 #2634: multi-region CNPG instances default (1 single-region, 2 multi).
    postgres:
      cluster:
        instances: ${SOVEREIGN_CNPG_INSTANCES:=1}
        # #3971 (Refs #3992 #4012) — name the per-provider durable CSI class
        # explicitly so the harbor-pg PVC is NEVER created classless. An UNSET
        # storageClassName freezes to "" the instant a PVC is created before any
        # default StorageClass exists, permanently stranding it Pending (caught
        # live on hw174: harbor-pg-1 Pending<empty> → Harbor 404). A NAMED class
        # keeps the PVC Pending (recoverable) until the class lands, then binds —
        # race-immune. Sourced from cloud-init per-provider env (hcloud-volumes
        # on Hetzner, evs-ssd on Huawei); empty default preserves the legacy
        # omit-when-empty CI `helm template` path.
        storageClass: ${SOVEREIGN_CNPG_STORAGE_CLASS:=}
        # ADR-0010 SHARING gate. Default true → harbor ships its own
        # harbor-pg Cluster (the 1:1 legacy shape; every existing prov is
        # byte-identical). Set SOVEREIGN_HARBOR_PG_OWN_CLUSTER=false on a
        # Sovereign (e.g. hw124) to make harbor SHARE the bp-postgres
        # `shared-pg` instance — its own embedded Cluster is then skipped
        # and its external DB host points at the shared cluster's -rw
        # Service. The `registry` Database + role + reflected
        # harbor-database-secret are provisioned by the shared bp-postgres
        # instance (slot 16a).
        #
        # #4291 DE-VCLUSTER — restore the env-templated own-cluster default
        # (the #3642 host-bridge had hardcoded false because it rendered the
        # harbor-pg Cluster host-side; native host-ns render owns its CNPG now).
        # The cloud-init var flips false only when enable_shared_pg=true.
        enabled: ${SOVEREIGN_HARBOR_PG_OWN_CLUSTER:=true}
      # #4059: gate the harbor-pg-app → harbor-database-secret rename bridge on
      # whether harbor OWNS a harbor-pg Cluster — true in BOTH the embedded and
      # the #3642 host-bridge paths (both mint harbor-pg-app), false ONLY in
      # TRUE shared-pg mode (bp-postgres mints harbor-database-secret directly,
      # no harbor-pg-app to poll). This follows SOVEREIGN_HARBOR_PG_OWN_CLUSTER
      # (the canonical own-vs-shared switch), NOT cluster.enabled (which the
      # host-bridge also flips false). Default true = own cluster.
      databaseSecretSync:
        enabled: ${SOVEREIGN_HARBOR_PG_OWN_CLUSTER:=true}
    objectStorage:
      enabled: true
      useExistingSecret: false
      credentialsSecretName: harbor-objectstorage-credentials
    harbor:
      # G117.E2E-H12 #2844 (2026-06-03): per-Sovereign externalURL override.
      # Chart default is "https://harbor.example.local" (placeholder for smoke
      # renders). The upstream goharbor/harbor chart writes this value into
      # the harbor-core Deployment's EXT_ENDPOINT env, which Harbor uses as
      # the OIDC redirect_uri base. Without the override here, the per-Org
      # KC OIDC client's redirect_uri matches "harbor.example.local" rather
      # than "registry.<sov-fqdn>" → silent-SSO callback 400s on every
      # operator login. Caught live by H12 Playwright walk on hw86 2026-06-03.
      externalURL: "https://registry.${SOVEREIGN_FQDN}"
      # ADR-0010: when harbor SHARES the bp-postgres `shared-pg` instance,
      # its external DB host points at the shared cluster's -rw Service
      # (in the shared-data namespace). Default points at harbor's OWN
      # cluster (harbor-pg-rw.harbor) so the 1:1 path is byte-identical.
      # harbor consumes the reflected harbor-database-secret either way.
      database:
        external:
          host: ${SOVEREIGN_HARBOR_PG_HOST:=harbor-pg-rw.harbor.svc.cluster.local}
      persistence:
        imageChartStorage:
          # #4573 F2 (Refs #3379): serve registry blobs DIRECTLY from the
          # in-cluster Harbor host — do NOT 302-redirect blob GETs to a
          # presigned cloud Object Storage URL. With redirect ENABLED (the
          # upstream default), a `GET /v2/<repo>/blobs/<digest>` returns a
          # 302 to `https://obs.<region>.<sov>.nationalcloud.om/...` (Huawei
          # OBS) / the S3 endpoint, whose cert is a DIFFERENT host from
          # `registry.<sov-fqdn>`. Every in-cluster TLS-pinned client trusts
          # ONLY the registry host: containerd's certs.d skip_verify (#4557)
          # is host-scoped to `registry.<sov-fqdn>`, skopeo's `--dest/--src-
          # tls-verify` targets the registry host, and a HelmRepository
          # certSecretRef scopes trust to the registry host — NONE trust the
          # OBS host → `tls: failed to verify certificate ... valid for
          # *.obs... not registry.<fqdn>` (live c39f0cd4455b7a46, #4573 F2).
          # That x509 wedges the step-08 fresh-pull proof (containerd blob
          # GET) and any in-cluster blob fetch under the deny-egress hold.
          # `disableRedirect: true` makes harbor-registry stream the blob
          # bytes itself over the already-trusted registry host — the OBS
          # backend is still the durable store (Harbor reads/writes it
          # server-side); only the CLIENT-facing 302 is suppressed.
          disableRedirect: true
          type: s3
          s3:
            existingSecret: harbor-objectstorage-credentials
            v4auth: true
            secure: true
            storageclass: STANDARD
