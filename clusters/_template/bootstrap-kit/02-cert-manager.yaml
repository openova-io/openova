# bp-cert-manager — Catalyst bootstrap-kit Blueprint. TLS for everything below — Lets Encrypt issuer with Dynadot DNS-01 (omani.works pool) or HTTP-01 (BYO domains).
#
# Wrapper chart: platform/cert-manager/chart/
# Catalyst-curated values: platform/cert-manager/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.

---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-cert-manager
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-cert-manager
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "02"
spec:
  interval: 15m
  releaseName: cert-manager
  targetNamespace: cert-manager
  dependsOn:
    - name: bp-cilium
  chart:
    spec:
      chart: bp-cert-manager
      # 1.2.1 (Fix #158): crdGate hook image switched from
      # bitnami/kubectl:1.30.4 (deleted from Docker Hub 2025-08) to
      # bitnamilegacy/kubectl:1.30.7.
      # 1.2.4 (G28-followup Refs #2570, 2026-05-29): upstream
      # cert-manager v1.16.2 → v1.16.5. Latest patch in 1.16.x line.
      # Targets the recurring "secrets ...-z9xlw already exists"
      # next-private-key informer-cache race that blocks Certificate
      # issuance on HCS provs (verified live hw54 15:07Z). Plus
      # CVE-2025-22871/22870/22872 fixes.
      version: 1.2.5
      sourceRef:
        kind: HelmRepository
        name: bp-cert-manager
        namespace: flux-system
  # Event-driven install: cert-manager installs CRDs + 3 deployments
  # (controller, webhook, cainjector). Webhook readiness depends on the
  # cainjector mutating the Secret — multi-minute path on cold start.
  # Helm install completes when manifests apply; subsequent dependsOn
  # checks Ready=True independently. Replaces PR #221 spec.timeout: 15m.
  install:
    timeout: 15m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
  values:
    cert-manager:
      prometheus:
        enabled: false
        servicemonitor:
          enabled: false
