# bp-gitea — Catalyst Blueprint #10 of 11. Per-Sovereign Git server with
# the public Blueprint catalog mirror seeded. Catalyst's catalog-svc reads
# Blueprint metadata from this Gitea (not from the public openova monorepo
# directly) so the Sovereign is air-gap-ready by construction.
#
# Wrapper chart: platform/gitea/chart/
#
# G92.3 #2662 (2026-06-01): the HelmRelease installs INSIDE the MGMT
# vCluster via Flux v2 spec.kubeConfig.secretRef → vc-mgmt. Per docs/
# SOVEREIGN-MULTI-REGION-DOD.md §A4 gitea is MGMT-tier (intra-cluster
# HA, primary region only). The chart's CNPG `Cluster` CR
# (templates/cnpg-cluster.yaml) lands in the vCluster apiserver where
# the bp-mgmt-vcluster 0.2.1 sync.toHost.customResources policy
# (PR alongside this commit) mirrors it back to the host k3s for the
# cnpg-operator (G92.6 substrate) to reconcile. The HR CR itself
# lives in host ns `mgmt` so helm-controller resolves the kubeConfig
# Secret from the same namespace (Flux v2 SecretReference contract).

---
# Host namespace for the gitea host-bridge Secret (gitea-oauth-source-credentials).
# #3642 re-homed gitea into the mgmt vCluster, but its host-MINTED SSO Secret
# still lands in this HOST `gitea` namespace (the raw ExternalSecret below targets
# it). Flux applies Namespace kinds before namespaced resources, so declaring it
# here guarantees it exists in the first pass — without it the ExternalSecret
# dry-run fails `namespaces "gitea" not found`, which fails the ENTIRE bootstrap-kit
# reconcile (0 HRs → fresh-prov wedge). grafana/newapi already declare theirs;
# gitea/harbor were missed in the #3642 relocation (caught live on hw161, Refs #3804).
apiVersion: v1
kind: Namespace
metadata:
  name: gitea
  labels:
    catalyst.openova.io/sovereign: ${SOVEREIGN_FQDN}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-gitea
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-gitea
  # G92.3 #2662: HR lives in host ns `mgmt` (where bp-mgmt-vcluster
  # exports vc-mgmt Secret). helm-controller authenticates against the
  # G105-followup #2697 (2026-06-01): metadata.namespace reverted to
  # flux-system. With G92.x slot-level forcing dropped, the HR no
  # longer needs to colocate with vc-mgmt. Reverting also restores
  # the Helm valuesFrom lookup of secrets like 'object-storage'
  # (cloud-init seeds it in flux-system; lookup is in HR's own ns).
  namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  labels:
    catalyst.openova.io/slot: "10"
spec:
  interval: 15m
  releaseName: gitea
  targetNamespace: gitea
  dependsOn:
    # bp-keycloak now lives in flux-system (G105-followup #2697).
    - name: bp-keycloak
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    # bp-gateway-api (issue #503): chart ships an HTTPRoute template;
    # gateway.networking.k8s.io/v1 CRDs must be registered first.
    - name: bp-gateway-api
      namespace: flux-system
    # bp-cnpg (issue #584): chart ships a CNPG Cluster CR;
    # postgresql.cnpg.io/v1 CRD must be registered before bp-gitea
    # applies so the Capabilities gate in cnpg-cluster.yaml creates
    # the Cluster rather than skipping it silently. bp-cnpg-operator
    # is host substrate (G92.6 #2665) and the CRDs are installed at
    # the HOST k3s apiserver — the vCluster's apiserver inherits the
    # CRD registration via the syncer's fromHost CRD discovery, so
    # the Capabilities gate inside the vCluster apiserver evaluates
    # `true` and the Cluster CR is created (then synced back to host
    # by the customResources policy declared in bp-mgmt-vcluster 0.2.1
    # values.yaml).
    - name: bp-cnpg
      namespace: flux-system
    # ADR-0010 reuse proof: gitea dependsOn bp-postgres-shared (slot 16a)
    # UNCONDITIONALLY. This edge is ALWAYS safe because slot 16a installs
    # an EMPTY (but Ready) release by default (SOVEREIGN_ENABLE_SHARED_PG=
    # false) — so the dependency just waits for that empty HR to be Ready
    # whether or not gitea is actually sharing. (#3191 regression: slot
    # 16a was authored but never registered in kustomization.yaml → the HR
    # was never created → THIS edge dangled forever → bp-gitea Ready=False
    # → bp-catalyst-platform wedged. Fixed by registering 16a; this guard
    # comment documents WHY the edge is unconditional + how the empty-Ready
    # default keeps it safe.)
    #
    # TWO-FLAG CONTRACT to actually SHARE: flip BOTH
    # SOVEREIGN_GITEA_PG_OWN_CLUSTER=false (gitea skips its OWN gitea-pg
    # Cluster + points its DB host at shared-pg's -rw Service) AND
    # SOVEREIGN_ENABLE_SHARED_PG=true (slot 16a renders the shared engine +
    # provisions gitea's Database + role + reflected gitea-database-secret).
    # Flipping only ONE is a misconfig: own-cluster=false + shared-pg=false
    # leaves gitea with no DB at all. The defaults (own-cluster=true,
    # shared-pg=false) are the byte-identical 1:1 legacy path.
    - name: bp-postgres-shared
      namespace: flux-system
  chart:
    spec:
      chart: bp-gitea
      # 1.2.5: gitea-admin-secret carries reflector.v1.k8s.emberstack.com
      # annotations so bp-reflector mirrors it into the catalyst ns where
      # bp-self-sovereign-cutover Step 1 gitea-mirror Job mounts it. K8s
      # forbids cross-namespace secretKeyRef; reflector is the canonical
      # platform-level mirror. Caught live on otech103 2026-05-04.
      # 1.2.24 (#3150): silent-SSO lands the operator logged-in — public
      # discovery URL persisted by the sso-configure Job so gitea 307s the
      # browser to the public KC authorize endpoint (was the unresolvable
      # in-cluster service URL).
      # 1.2.25 (#3188): ADR-0010 reuse proof — postgres.cluster.enabled
      # SHARING gate (SOVEREIGN_GITEA_PG_OWN_CLUSTER) so gitea can SHARE
      # the bp-postgres `shared-pg` data-instance instead of owning its
      # gitea-pg Cluster. Default true → byte-identical 1:1 legacy path.
      # 1.2.26 (#3188): Deployment strategy Recreate (was upstream default
      # RollingUpdate{maxUnavailable:0,maxSurge:100%}). RWO /data + LevelDB
      # lock wedge the surge-pod roll; Recreate releases the PVC + lock
      # before the new Pod starts so the 1.2.x roll completes clean.
      # 1.2.27 (#3285): SHARED-PG consumer wiring — database-secret-sync-job
      # gated on postgres.cluster.enabled (skipped in SHARED mode, where no
      # gitea-pg-app exists to poll). The DB password secret NAME flips via
      # the SOVEREIGN_GITEA_PG_SECRET seam below (own-cluster gitea-pg-app →
      # SHARED gitea-database-secret, the reflected Secret). own-cluster
      # render byte-identical.
      # 1.2.28 (#3296): kyverno-Enforce roll landmines — sync-job hook Job
      # self-labels app.kubernetes.io/managed-by:flux (hooks bypass
      # helm-controller's OriginLabels → flux-managed policy denied the
      # hook); gitea image pulled via harbor.openova.io/proxy-dockerhub
      # (bare gitea/gitea ref denied by harbor-proxy-pull on any roll —
      # wedged live hw128 on the 1.2.27 upgrade).
      # 1.2.29 (2026-06-12, founder): root-URL zero-click — REQUIRE_SIGNIN_VIEW
      # + gateway /user/login -> OIDC entry redirect.
      # 1.2.30: explicit port 443 on the SSO redirect (the #3310 class).
      # 1.2.31: LANDING_PAGE=login — anon root funnels into OIDC.
      # 1.2.35 (#3373 Batch A): objectStorage S3+filer endpoint defaults → rtz-vCluster synced name (seaweedfs moved into rtz).
      # 1.2.36 (#3687, extends #3370): bootstrap self-registration — the
      # chart renders the canonical apps.openova.io/v1 Application CR for
      # this slot's HelmRelease so the console /apps list, per-app Topology
      # tab + showback resolve gitea (no more "no Application CR").
      # 1.2.38 (#3850, 2026-06-19): DURABLE SSO oauth source — the one-shot
      # sso-configure hook Job became a continuously-reconciling Deployment
      # (openbao pattern) that re-asserts the `openova-sso` login source every
      # 60s, so a CNPG DB re-init no longer silently strands gitea's SSO at
      # `oauth2 source not found` 500 (caught live hw167). Refs #3374.
      # 1.2.39 (#3934 / Refs #3642, 2026-06-20): split-gate — the in-vCluster
      # sso-configure Deployment now survives the host-bridge suppress (only
      # the chart ExternalSecret is suppressed via sso.externalSecret.enabled,
      # not sso.enabled), so the login_source row gets seeded in the mgmt
      # vCluster placement (caught live hw171). Refs #3374 #3642.
      # 1.2.41 — #4212 Seam 3: placementSchema aligned with spec.topology
      #   (modes[] admit active-hot-standby + defaultOnMultiRegion). Chart bumped in lockstep.
      # 1.2.42 — #4347: gitea-sso-configure Deployment gains liveness + readiness
      #   probes (heartbeat sentinel) so the host-ns Kyverno `probes-present`
      #   Enforce ClusterPolicy admits it post-#4325 de-vcluster. Refs #4347 #4325 #4340.
      # 1.2.43 — #4354: git-data PRESERVATION guard (pre-install,pre-upgrade hook).
      #   The #4325 vCluster→host re-home via FRESH helm install provisioned a NEW
      #   empty gitea-shared-storage PVC + abandoned the prior PV while the external
      #   CNPG metadata DB survived → catastrophic DB↔disk drift (#4353 P0). The hook
      #   ADOPTS an orphan Released/Available PV (Retain → clear claimRef → pre-bind
      #   the host PVC via volumeName) so the re-home rides the SAME git-data volume,
      #   NO-OPs on a fresh prov, and FAILS LOUD when the DB reports repos but no PV
      #   can be adopted — no silent empty boot. Refs #4354 #4325 #4353 #4352.
      # 1.2.44 — #4369: the 1.2.43 guard Job defaulted its kubectl image to a BARE
      #   docker.io ref → the cluster-wide Kyverno harbor-proxy-pull Enforce policy
      #   (admits `*/proxy-*/*` or `*/openova-io/*`) DENIED the pre-upgrade hook Job
      #   at admission → pre-upgrade gate failed → bp-gitea HR rollback-looped and
      #   stranded bp-catalyst-platform / bp-continuum / bp-sandbox. Fix: default the
      #   guard image to the harbor-proxy form. Refs #4369 #4367 #4354.
      # 1.2.47 — #4885: reloader annotation on the gitea Deployment metadata
      #   (secret.reloader.stakater.com/reload: gitea-admin-secret) so bp-reloader
      #   (slot 28) rolls gitea on any admin-secret change and keepUpdated re-syncs
      #   the DB password — closes the Pillar-5 cutover step-06 demirror 401 gap
      #   (live hw232). Refs #4885 #3379 #830.
      # 1.2.48 — #5262: admin-secret vanish-proof password stickiness — on a
      #   re-render that finds the source Secret absent (#5214 vanish class)
      #   the password is restored from the reflector mirror(s)
      #   (giteaAdmin.mirrorNamespaces) instead of minting a fresh one that
      #   drifts from Gitea's DB (live hw277: cutover step-10 clone 401 /
      #   git exit 128). Refs #5262 #5214 #3379.
      version: 1.2.49
      sourceRef:
        kind: HelmRepository
        name: bp-gitea
        namespace: flux-system
  # Event-driven install: Gitea PostgreSQL DB init + admin user creation +
  # public Blueprint catalog mirror seeding is legitimately multi-minute.
  # Helm install completes when manifests apply; downstream dependsOn
  # checks Ready=True independently. Replaces PR #221 spec.timeout: 15m.
  install:
    # G92.3 #2662: createNamespace=true so helm-controller provisions
    # the inner `gitea` namespace inside the mgmt vCluster on first
    # install.
    createNamespace: true
    disableWait: true
    # 30m (hw91 2026-06-04): with disableWait the budget binds the
    # post-install sso-configure HOOK, which can only finish after the
    # remediation-recreated CNPG cluster bootstraps (~5m: old pods
    # terminate + initdb + replica join), gitea's init rides out up to
    # a 5m CrashLoop backoff, migrations run, and the hook execs.
    # ~12-14m worst case fit 15m only marginally — observed attempts
    # burned out in the teardown+bootstrap phase. Same nesting
    # rationale as the powerdns slot (#3019).
    timeout: 30m
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    # 30m — same hook-window rationale as install.
    timeout: 30m
    remediation:
      retries: 3
  values:
    # ── Bootstrap self-registration (#3687, extends #3370) ──────────────
    # The chart self-registers the Application CR for gitea (the canonical
    # instance representation every console surface reads), marked
    # spec.bootstrap=true so the application-controller ADOPTS this HR's
    # install instead of re-rendering it (zero duplicate HRs).
    bootstrapOwned:
      enabled: true
      helmRelease:
        name: bp-gitea
        namespace: flux-system
    global:
      sovereignFQDN: ${SOVEREIGN_FQDN}
    # G91.gitea (#2653) — wire bp-sso-bridge framework. The chart-side
    # post-install Job needs sovereignFqdn to compute the OIDC
    # autoDiscoverUrl at chart-template time. Empty default in the
    # chart values short-circuits the configure-oauth Job; the envsubst
    # below makes SSO work zero-touch on every fresh Sovereign.
    sso:
      externalSecret:
        enabled: true  # #4291 DE-VCLUSTER — gitea renders its OWN SSO ExternalSecret natively in host ns `gitea` (host ESO reconciles it; was suppressed by the #3642 host-bridge)
      # sso.enabled STAYS true so the sso-configure Deployment seeds the
      # `openova-sso` login_source DB row (kubectl-exec into the live gitea Pod).
      enabled: true
      sovereignFqdn: ${SOVEREIGN_FQDN}
    # G87 #2634 (2026-06-01): multi-region Sovereigns default CNPG
    # instances to 2 so the operator spreads across regions via
    # topology.kubernetes.io/region antiAffinity. Single-region falls
    # back to 1.
    postgres:
      cluster:
        instances: ${SOVEREIGN_CNPG_INSTANCES:=1}
        # #3971 (Refs #3992 #4012) — name the per-provider durable CSI class
        # explicitly so the gitea-pg PVC is NEVER created classless. CNPG's
        # cnpg-cluster.yaml omits storageClass when empty (leaving the PVC's
        # storageClassName UNSET), but an UNSET PVC created BEFORE the default
        # StorageClass exists has "" frozen in permanently → stuck Pending
        # forever (caught live on hw174: gitea-pg-1 Pending<empty> 2h before
        # evs-ssd landed). A NAMED class keeps the PVC Pending (recoverable)
        # until the class exists, then binds — race-immune on BOTH providers.
        # Sourced from the cloud-init per-provider env (hcloud-volumes on
        # Hetzner, evs-ssd on Huawei). Empty default keeps non-Sovereign
        # `helm template` renders (CI) on the legacy omit-when-empty path.
        storageClass: ${SOVEREIGN_CNPG_STORAGE_CLASS:=}
        # ADR-0010 SHARING gate. Default true → gitea ships its own
        # gitea-pg Cluster (the 1:1 legacy shape; every existing prov is
        # byte-identical). Set SOVEREIGN_GITEA_PG_OWN_CLUSTER=false on a
        # Sovereign (e.g. hw124) to make gitea SHARE the bp-postgres
        # `shared-pg` instance — its own embedded Cluster is then skipped
        # and its DB host points at the shared cluster's -rw Service. The
        # `gitea` Database + role + reflected gitea-database-secret are
        # provisioned by the shared bp-postgres instance (slot 16a).
        # #4291 DE-VCLUSTER — restore the env-templated own-cluster default
        # (the #3642 host-bridge had hardcoded false because it rendered the
        # gitea-pg Cluster host-side; native host-ns render owns its CNPG now).
        # The cloud-init var flips false only when enable_shared_pg=true.
        enabled: ${SOVEREIGN_GITEA_PG_OWN_CLUSTER:=true}
    # Per-Sovereign overrides — issue #387:
    # Cilium Gateway HTTPRoute exposes Gitea at gitea.${SOVEREIGN_FQDN}.
    # Upstream chart's own Ingress is disabled (gitea.ingress.enabled=false
    # in platform/gitea/chart/values.yaml) — Sovereigns ingress through
    # cilium-gateway from clusters/_template/bootstrap-kit/01-cilium.yaml.
      host: gitea.${SOVEREIGN_FQDN}
    # Restored 2026-06-13 (same #3373/#3391 shape as slot 09).
    gateway:
      enabled: true  # #4291 DE-VCLUSTER — gitea renders its OWN HTTPRoute natively in host ns `gitea` (was suppressed by the #3642 host-bridge)
      host: gitea.${SOVEREIGN_FQDN}
    # DoD D25 (t129 2026-05-16): override the chart's baked dev hostname
    # `gitea.catalyst.local` so the Gitea Web UI renders the LIVE
    # Sovereign FQDN in pageData.appUrl, clone URLs, and internal links.
    # Without this every Sovereign's Gitea page told the operator to
    # clone from `gitea.catalyst.local` (which public DNS can't resolve),
    # breaking the canonical "Sovereign-local Git server" contract that
    # bp-self-sovereign-cutover relies on.
    gitea:
      gitea:
        config:
          server:
            DOMAIN: gitea.${SOVEREIGN_FQDN}
            ROOT_URL: https://gitea.${SOVEREIGN_FQDN}
          # ADR-0010: when gitea SHARES the bp-postgres `shared-pg`
          # instance, its DB host points at the shared cluster's -rw
          # Service (in the shared-data namespace). Default points at
          # gitea's OWN cluster (gitea-pg-rw.gitea) so the 1:1 path is
          # byte-identical. gitea consumes the reflected
          # gitea-database-secret (provisioned by the shared instance when
          # sharing, by gitea's own cluster otherwise) either way.
          database:
            HOST: ${SOVEREIGN_GITEA_PG_HOST:=gitea-pg-rw.gitea.svc.cluster.local}:5432
        # ADR-0010 SHARED-PG consumer wiring (#3285). The upstream subchart
        # reads GITEA__database__PASSWD from a single secretKeyRef whose
        # NAME flips between modes (the `password` key is identical in both
        # sources). Default `gitea-pg-app` = CNPG's own basic-auth Secret on
        # gitea's OWN gitea-pg Cluster (byte-identical 1:1 path). Set
        # SOVEREIGN_GITEA_PG_SECRET=gitea-database-secret in SHARED mode so
        # gitea reads the reflected Secret bp-postgres-shared pushes into the
        # gitea namespace from the shared engine's `shared-pg-gitea` role
        # Secret (#3284 source-side reflector). This overrides the whole
        # single-element list in platform/gitea/chart/values.yaml — the
        # umbrella chart can NOT template a subchart value (upstream uses
        # `toYaml`, not `tpl`), so the seam lives here. TWO-FLAG CONTRACT:
        # to actually SHARE, pair this with SOVEREIGN_GITEA_PG_OWN_CLUSTER=
        # false (skips gitea's own Cluster) + SOVEREIGN_GITEA_PG_HOST=
        # shared-pg-rw.shared-data.svc.cluster.local (points DB host at the
        # shared engine) + SOVEREIGN_ENABLE_SHARED_PG=true (slot 16a).
        additionalConfigFromEnvs:
          - name: GITEA__database__PASSWD
            valueFrom:
              secretKeyRef:
                name: ${SOVEREIGN_GITEA_PG_SECRET:=gitea-pg-app}
                key: password
