# bp-mgmt-vcluster — Catalyst bootstrap-kit Blueprint slot 58.
#
# Primary-region MGMT vCluster. Hosts catalyst-api, catalyst-ui,
# openova-flow-server, and other Sovereign control-plane workloads.
#
# Per docs/SOVEREIGN-MULTI-REGION-DOD.md A4 (vCluster topology):
#   primary    region → MGMT  + DMZ  vCluster (this slot + slot 54)
#   secondary  region → DMZ   + RTZ  vCluster (slot 54   + slot 59)
#
# Cross-vCluster intra-region traffic between MGMT and DMZ stays
# inside the host k3s via Cilium endpoint identity routing. Inter-
# region traffic goes over the DMZ WireGuard hop per DoD A2.
#
# Wrapper chart: platform/bp-mgmt-vcluster/chart/
#   Bundles loft-sh/vcluster 0.20.0 as a Helm subchart so
#   `helm dependency build` packages it into the OCI artifact.
#
# Reconciled by: Flux on the new Sovereign's k3s control plane.
#
# dependsOn:
#   - bp-cilium       — CNI + Gateway API
#   - bp-cert-manager — TLS for ClusterIssuers (vCluster's exported
#                       kubeconfig needs the cluster's CA chain)
#
# Per-role gating: this slot defaults to DISABLED (mgmtVcluster.
# enabled=${MGMT_VCLUSTER_ENABLED:=false}). The Sovereign-provisioning
# tofu module (infra/hetzner/main.tf primary-CP block) flips this to
# "true" via postBuild.substitute on the PRIMARY region's CP only.
# Secondary regions leave it unset → defaults to false → no resources
# render.
#
# Until the tofu-substitute follow-up PR lands (which adds
# MGMT_VCLUSTER_ENABLED to the substitute block per the v3.2 Gap A
# refactor), operators can opt in per-Sovereign overlay by patching
# `values.mgmtVcluster.enabled: true` on the primary cluster's
# bootstrap-kit slot.

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-mgmt-vcluster
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-mgmt-vcluster
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "58"
    catalyst.openova.io/vcluster-role: mgmt
    catalyst.openova.io/topology: dod-a4
spec:
  interval: 15m
  releaseName: mgmt-vcluster
  # The chart's templates/namespace.yaml creates the host namespace,
  # so we point Flux to install INTO that namespace. The vCluster
  # subchart's StatefulSet + Service + RBAC land here.
  targetNamespace: mgmt
  dependsOn:
    - name: bp-cilium
    - name: bp-cert-manager
  chart:
    spec:
      chart: bp-mgmt-vcluster
      # 0.2.6 (#2940 Pillar 5): registry host driven by global.registryMirror
      # + the ${REGISTRY_MIRROR:=harbor.openova.io} subchart substitution above.
      # 0.2.7 (#3373 fix (b)): toHost customResources sync gains HTTPRoute + ExternalSecret.
      # 0.2.8 (#3380-D): k8s distro control-plane images pinned off
      # registry.k8s.io onto Harbor proxy-k8s (harbor-proxy-pull Enforce).
      # 0.2.9 (#3376): add `sme` to the isolation netpol ingress allow-list
      # — #3373 moved NATS into this vCluster, walling off the host Organization/BSS
      # services that use it as their event bus (funnel back-half was dead).
      # 0.2.10 (#3373): in-vCluster CRD registration via OSS init-manifests
      # (experimental.deploy.vcluster.manifests) — the toHost block alone does NOT
      # register CRDs inside the vCluster on OSS vCluster (Pro-gated). Proven hw130.
      # 0.2.11 (#3642): host-bridge carve-outs (gateway-system/kube-system +
      # catalyst-system/newapi/sso-bridge/oidc-gate) in allowedIngressNamespaces
      # so the host Cilium Gateway + keycloak SSO consumers reach the moved
      # keycloak/grafana through the vCluster isolation netpol.
      # 0.2.12 (#3642 #3736): vcluster subchart 0.21.0 → 0.23.0 +
      # sync.fromHost.secrets.mappings.byName — delivers each re-homed app's
      # host-MINTED DB/SSO Secret INTO vc-mgmt (GOVERNING CONSTRAINT #2; the
      # #3737 keycloak SHARED_PG `secret not found` blocker). OSS-native, no
      # admin.loft.sh tether → cutover deny-egress hold still passes.
      # 0.2.12 (#3642 follow-on): the remaining 5 host→mgmt moves (openbao/
      # harbor/gitea/newapi/guacamole) add harbor/gitea/velero/rtz to
      # allowedIngressNamespaces (their host-bridged CNPG -rw Services + velero
      # registry backup + the cross-vCluster shared-pg wire).
      # 0.2.13 (hw161 converge-readiness, Refs #3760): add the missing
      # `openbao/*` fromHost.secrets.mappings.byName entry — openbao is the 7th
      # NS#1 app re-homed into vc-mgmt but the 0.2.12 mapping shipped only 6 of
      # the 7 namespaces, so the in-vCluster openbao sso-configure Deployment
      # waited forever for the host-minted openbao-sso-oidc-credentials Secret
      # the mirror never delivered (the #3737 secret-not-mirrored class).
      # 0.2.14 (#3737 4th-layer): networking.replicateServices.fromHost mirrors
      # the host shared-pg Services into vc-mgmt so the secret's host FQDN
      # `shared-pg[-b|-c]-rw.shared-data.svc.cluster.local` RESOLVES inside the
      # vCluster — keycloak-0 CrashLooped `no such host` on hw163 without it
      # (the #3642-in-vcluster vs NorthStar-#2 host-shared-pg DNS collision).
      # 0.2.15 (#3642 5th layer): networking.replicateServices.toHost exports the
      # in-vCluster gitea-http back to the host gitea/gitea-http Service so the
      # HOST-side bp-catalyst-platform gitea-token mint hook + catalyst-api
      # resolve gitea-http.gitea.svc.cluster.local — else the console pre-install
      # hook CrashLoops `catalyst-gitea-token not found` and the console never
      # installs (root-caused live hw163).
      # 0.2.16 (#3642 hw164 root-cause): replicateServices.toHost REMOVED — its
      # {from,to} form crash-loops the vcluster 0.23 syncer at runtime (every
      # fresh prov wedged ~42/64, mgmt-vcluster-0 CrashLoop, vc-mgmt never minted,
      # whole spine blocked). Replaced by static host ExternalName aliases
      # (templates/host-service-aliases.yaml) giving keycloak/gitea-http/openbao
      # plain->mangled reachability — verified live on hw164 (persist + resolve,
      # zero syncer crash).
      # 0.2.17 (#2940 FOUNDATIONAL app-plane wedge, hw159-hw165 RCA): adds the
      # gateway-ingress CiliumNetworkPolicy. The -isolation NetworkPolicy
      # default-denied ALL mgmt-pod ingress with a namespaceSelector-only
      # allow-list, which CANNOT match Cilium's reserved:ingress proxy identity
      # → every gateway->app request silently dropped (curl 000/503) on every
      # #3642 env. The new CNP admits fromEntities [ingress,host,remote-node];
      # validated live hw165 (gitea 000/503->303, 7/11 surfaces recovered).
      # 0.2.18 (#3820 #3642): adds `external-secrets-system` to the
      # -isolation NetworkPolicy ingress allow-list. OpenBao moved INTO vc-mgmt
      # (#3642) but the host external-secrets-operator (ESO's ClusterSecretStore
      # vault-region1, the PRIMARY OpenBao consumer) was never allowed in →
      # InvalidProviderConfig (k8s-auth login deadline) → every
      # *-sso-oidc-credentials ExternalSecret SecretSyncedError → per-app SSO
      # 503 on hw165. Orthogonal to the 0.2.17 gateway-ingress CNP; both ship here.
      # 0.2.19 (#3838): replace `openbao/*` fromHost.secrets wildcard with
      # exact-name mappings — the wildcard mirrored the SA-token-typed
      # `openbao-host-token-reviewer` Secret, which the vCluster token-controller
      # re-stamped every reconcile → infinite from-host-secret loop (~35% of
      # syncer work on hw166) → context-deadline-exceeded on the keycloak/harbor
      # DB-secret toHost writes → keycloak-0 Init:0/2 → bp-keycloak 30m
      # install-loop stalling the spine at ~49/64 HRs. Companion: placement.yaml
      # `openbao-host-token-reviewer-export` Job mints the mirror-stable Opaque
      # `openbao-host-token-reviewer-static` Secret.
      # 0.2.20 (#3859): add `org-services` to the NATS isolation allow-list
      # (was only `sme`; the BSS tier was renamed to org-services) — unblocks
      # tenant/provisioning → NATS, the #3376 funnel back-half.
      # 0.2.21 (#3374): mirror `catalyst-system/guacamole-pg-rw` + `-ro` into
      # vc-mgmt via networking.replicateServices.fromHost. The host-bridged
      # (#3642) guacamole-pg Service was NXDOMAIN inside vc-mgmt → the JDBC
      # schema-seed Job (and the webapp) could not reach postgres → seed Job
      # DeadlineExceeded → Helm rollback → no webapp → `guacamole.<fqdn>` edge
      # 500/503 on hw167 (32 installFailures). Same #3737 4th-layer DNS gap, now
      # extended to guacamole's host-rendered CNPG cluster.
      # 0.2.23 (#3374 cycle-1): de-conflict the 4 pod-mounted DB Secrets
      # (keycloak-database-secret / grafana-database-env / gitea-database-secret /
      # harbor-database-secret) from the sync.fromHost.secrets namespace
      # wildcards. On vcluster 0.23.0 a Secret that is BOTH fromHost-imported
      # AND pod-mounted in vc-mgmt makes the from-host + to-host secret syncers
      # fight (delete/recreate → context deadline exceeded → app Init:0/2 20m+),
      # triggered live (hw167) by the #3872 mesh-secret regeneration repointing
      # the DB Secret. Each app ns narrowed `<ns>/*` → EXACT-NAME SSO/OIDC creds
      # only; keycloak drops out (no host non-DB Secret). DB Secret delivered
      # natively in-vCluster (toHost sole owner).
      # 0.2.24 (#3878, companion to #3876 — comment-only chart change): the
      # native in-vCluster DB-secret delivery #3876 promised is now IMPLEMENTED
      # in the sibling slot-16 change (bp-postgres 0.2.4 `reflect.mangledTarget`,
      # slots 16a/16c). The shared-pg reflector materialises the syncer-mangled
      # host object `<secret>-x-<ns>-x-mgmt-vcluster` in host ns `mgmt` (the
      # object the in-vc pod mounts), so the 4 DB Secrets reach keycloak/gitea/
      # harbor/grafana natively without a fromHost mirror. This pin bump only
      # refreshes the fromHost-block RCA comment; sync config byte-identical.
      # Refs #3876 #3374 #3737.
      # 0.2.25 (#3831, Refs #3642): + the newapi-pg `-rw`/`-ro` Service mirror —
      # the SERVICE half for re-homing newapi (the CNPG-OWNER app) into vc-mgmt
      # (slot 80 flips to placement.role=vcluster-app; slot 80a host-renders the
      # CNPG-owner seams). The `newapi/*` secret mapping already delivers the DSN.
      # Cycle-1.5 train combines this with the 0.2.23 DB-secret de-conflict
      # (#3876) + the 0.2.24 RCA-comment refresh (#3878).
      # 0.2.26 (#3926, Refs #3379 #3642): add a `harbor-core.harbor` host→vc-mgmt
      # ExternalName alias so the bp-self-sovereign-cutover step-02
      # (harbor-projects) Job — which runs host-side and dials the PLAIN
      # `harbor-core.harbor.svc` — resolves Harbor again post-#3642 (it now runs
      # INSIDE vc-mgmt; the host name NXDOMAIN'd → cutover wedged at step-02 on
      # hw171). Same proven host-service-aliases mechanism as gitea/keycloak/openbao.
      version: 0.2.28
      sourceRef:
        kind: HelmRepository
        name: bp-mgmt-vcluster
        namespace: flux-system
  install:
    timeout: 15m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
  # Per-Sovereign overlay surface.
  #
  # mgmtVcluster.enabled — flipped on by the primary CP's tofu postBuild
  # substitute (MGMT_VCLUSTER_ENABLED). When the substitute is unset
  # (secondary regions, or pre-substitute-rollout primary), envsubst
  # leaves the placeholder which Flux resolves to the literal
  # "${MGMT_VCLUSTER_ENABLED:=false}" → Helm's YAML parser interprets
  # the rendered string. To prevent that subtlety, the chart's default
  # in values.yaml is already `enabled: false`; this slot ONLY sets it
  # via valuesFrom on the primary CP. The simplest correct shape is to
  # leave the value at chart-default `false` and rely on per-Sovereign
  # overlay patches OR the follow-up tofu substitute (which will add
  # `values.mgmtVcluster.enabled: true` only on the primary CP's
  # cloud-init).
  values:
    # #2940 Pillar 5 anti-tether: single source of truth for the registry
    # host the umbrella's image fail-fast guard composes. Default
    # `harbor.openova.io` (mothership Harbor proxy-cache); a per-Sovereign
    # overlay (or the bp-self-sovereign-cutover Step-04 registry pivot,
    # ADR-0002) re-points to the Sovereign's OWN Harbor in one place.
    global:
      registryMirror: ${REGISTRY_MIRROR:=harbor.openova.io}
    mgmtVcluster:
      # Refs #2537 G9 (2026-05-28): drop the MGMT_VCLUSTER_ENABLED
      # substitute. The "follow-up PR to wire the substitute on primary
      # only" never landed, leaving every Sovereign with mgmt-vcluster
      # SILENTLY OFF for 2 weeks. Founder direction: symmetric topology
      # — every region renders MGMT+RTZ+DMZ. Hardcode true.
      enabled: true
      hostNamespace: mgmt
      vclusterName: mgmt
      role: primary
      nodeSelector:
        regionLabelKey: openova.io/region
        # Canonical region label (hz-<stem>-rtz-prod) — matches the
        # k3s node-label written at install time. See slot 54 + the
        # SOVEREIGN_REGION_CANONICAL_LABEL substitute in
        # infra/hetzner/cloudinit-control-plane.tftpl.
        regionLabelValue: ${SOVEREIGN_REGION_CANONICAL_LABEL}
    # Subchart values overlay — pinned to the per-region canonical label
    # so the upstream vcluster StatefulSet's nodeSelector binds the same
    # CP node as the umbrella's nodeSelector helper.
    vcluster:
      controlPlane:
        statefulSet:
          # #2940 Pillar 5: the ACTUAL vCluster syncer image registry.
          # The subchart values literal can't self-template off
          # global.registryMirror, so the single overlay knob lives HERE —
          # `${REGISTRY_MIRROR:=harbor.openova.io}` keeps the bootstrap pull
          # on the mothership Harbor and lets a per-Sovereign overlay (or
          # the cutover Step-04 pivot) flip it to harbor.<sovereign-fqdn>.
          image:
            registry: ${REGISTRY_MIRROR:=harbor.openova.io}
          scheduling:
            nodeSelector:
              openova.io/region: ${SOVEREIGN_REGION_CANONICAL_LABEL}
