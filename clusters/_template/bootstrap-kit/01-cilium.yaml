# bp-cilium — Catalyst bootstrap-kit Blueprint. CNI must come first; k3s started with --flannel-backend=none precisely so Cilium can take over.
#
# Wrapper chart: platform/cilium/chart/
# Catalyst-curated values: platform/cilium/chart/values.yaml
# Reconciled by: Flux on the new Sovereign's k3s control plane.

---
# kube-system is built into every Kubernetes cluster — never re-declare it.
# Earlier revisions of 01-cilium.yaml AND 05-sealed-secrets.yaml both
# declared it, which collided when kustomize tried to merge the two:
#   "may not add resource with an already registered id:
#    Namespace.v1.[noGrp]/kube-system.[noNs]"
# This Blueprint installs Cilium INTO kube-system; the HelmRelease's
# targetNamespace field below is sufficient.
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-cilium
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-cilium
  namespace: flux-system
  labels:
    catalyst.openova.io/slot: "01"
spec:
  interval: 15m
  releaseName: cilium
  targetNamespace: kube-system
  # G65 #2614 (2026-05-31): bp-gateway-api (slot 01a) installs the
  # gateway.networking.k8s.io CRDs that the Cilium operator reads at
  # startup when `enable-gateway-api=true`. If CRDs aren't registered
  # when the operator boots, it silently skips the gateway-controller
  # subsys and GatewayClass/Gateway stay ACCEPTED=Unknown forever
  # (proven hw72 9d4a5b629fcc38bb, 2026-05-30). Same META-AUDIT 11
  # class as bp-kyverno-vs-bp-kyverno-policies (#2019).
  dependsOn:
    - name: bp-gateway-api
  chart:
    spec:
      chart: bp-cilium
      # 1.3.4 (prov #55, 2026-05-12): flip kubeProxyReplacement false→true
      # in chart defaults so the BPF masquerade datapath (bpf.masquerade:
      # true, already on by default) gets the NodePort it needs at startup.
      # Worker cilium-agent on prov 8d85a64cb8807cdc crashloop'd with
      # "BPF masquerade requires NodePort" → node.cilium.io/agent-not-ready
      # taint persisted → every post-install Job pod (keycloak-config-cli,
      # powerdns, mimir, openbao) stayed Pending → bootstrap-kit chain
      # stalled. Aligns with the cloud-init pre-Flux Cilium install which
      # already used kubeProxyReplacement: true.
      # 1.3.3 (qa-loop iter-16 Fix #70): Hubble UI HTTPRoute defaults
      # corrected — gatewayRef.namespace=kube-system (was the stale
      # cilium-gateway), serviceRef.namespace=kube-system (was the stale
      # cilium), plus chart auto-derives hubble.<sovereignFQDN> when only
      # SOVEREIGN_FQDN is provided. Combined with the bootstrap-kit
      # default flip below (HUBBLE_ENABLED=true, hubble.relay/ui enabled,
      # SOVEREIGN_FQDN forwarded), every Sovereign exposes Hubble UI at
      # https://hubble.<sovereignFQDN>/ out of the box. TC-289 NXDOMAIN
      # is closed because external-dns now sees the HTTPRoute hostname
      # and writes the A record into PowerDNS.
      # 1.3.1 (qa-loop iter-12 Fix #54 Workstream 2): bpf.preallocateMaps=true
      # + socketLB.hostNamespaceOnly=true defaults so fresh worker pods can
      # resolve DNS reliably on first-join (cilium/cilium#28456 mitigation).
      # 1.3.0 (qa-loop iter-12 Fix #53C+D): adds the Hubble UI HTTPRoute
      # overlay (slice H7 #1095) that the catalystOverlay.hubbleUI block
      # below depends on.
      # 1.4.2 (#3374, 2026-06-14): hubble-ui oauth2-proxy client-secret is
      # delivered by bp-sso-bridge (it APPLIES the ExternalSecret from its
      # post-ESO reconciler), not by a chart-rendered ExternalSecret here.
      # Slot 01 (CNI) installs before bp-external-secrets (slot 15) so the
      # in-chart ExternalSecret was capability-guarded out at install and
      # never re-added (helm-controller drift uses the install-time
      # capability snapshot). Without it `hubble-ui-oauth2-proxy-oidc` was
      # never created → oauth2-proxy CreateContainerConfigError → hubble UI
      # 503. The chart's hubble-ui-sso-registration ConfigMap now declares
      # the ExternalSecret target; bp-sso-bridge 0.2.16 applies it. Lockstep
      # with 13b-bp-sso-bridge.yaml → 0.2.16. Refs #3374.
      # 1.4.0 (G117.5 #2744, 2026-06-03): HUBBLE UI OIDC ENFORCEMENT
      # SHIPPED. oauth2-proxy sidecar now sits in front of the Hubble UI
      # Service when auth=oidc, running the OIDC code-flow against the
      # sovereign realm `hubble-ui` client. This slot's HUBBLE_AUTH
      # default is flipped `none` → `oidc` below so a fresh prov is
      # OIDC-gated out of the box (closes the unauthenticated-exposure
      # hole the 1.3.7 decorative-gate removal left open). Refs #2744.
      # 1.3.7 (G117.5 W3.D1 #2744, 2026-06-02): DECORATIVE-GATE REMOVED
      # on Hubble UI HTTPRoute. Dropped the misleading
      # `catalyst.openova.io/hubble-ui-auth: oidc` annotation and flipped
      # default `catalystOverlay.hubbleUI.auth` from `oidc` → `none`
      # (no enforcement filter shipped yet). Refs #2744.
      # 1.4.3 (#3374 admin-tier): oidc-audience-mapper on the hubble-ui
      # AppRegistration client — oauth2-proxy callback was 500ing on hw133
      # (aud=[realm-management account], never hubble-ui). Same fix class as
      # the bp-oidc-gate openova-flow audience-mapper (#3447).
      # 1.4.4 (#4467, Huawei kom4dc fresh prov): pin cilium.MTU=1370 so the
      # VXLAN-tunnel + WireGuard-node-encryption combined overhead is
      # subtracted from the pod-facing devices (cilium_vxlan/cilium_host/
      # lxc*). Auto-MTU left them at 1500 → oversized frames DF-dropped at
      # the 1420 WireGuard MTU → all cross-node pod TCP to large payloads
      # timed out → Phase-1 convergence deadlock. See the MTU value above.
      # 1.4.5 (#4507, omantel.biz UAT row 39): add oauth2-proxy
      # --api-route=^/api/ on the hubble-ui gate so the Hubble UI flow-stream
      # XHR (gRPC-Web /api/v1/...) gets a 401 (not a 302-to-KC-login-HTML the
      # gRPC-Web client can't follow) on a missing/expired session — fixes
      # flows never rendering.
      # 1.4.6 (#4686): [SUPERSEDED by 1.4.7] Sovereign Gateway Service shared
      # the clustermesh CP-node EIP via a Cilium LB-IPAM sharing-key. Removed
      # in 1.4.7 — that EIP is a Huawei 1:1 NAT, externally unreachable.
      # 1.4.7 (#4690 / #4686 foundation-fix): the gateway gets its OWN dedicated
      # LB-IPAM pool (gateway-lb-ipam-pool.yaml restored + wired via
      # cilium.gateway.lbIpam here) and is fronted publicly by the RESTORED
      # Huawei ELB (infra/providers/huawei/main.tf), whose members target the
      # gateway Service's auto-allocated nodePort (discovered + reconciled
      # post-convergence by catalyst-api). The sharing-key annotation is dropped
      # from the clustermesh Service; the two Services no longer share an EIP.
      # 1.4.9 (#4765, 2026-07-05): ZERO NODEPORTS. The 1.4.7 two-pool shape put
      # `clustermesh-apiserver` + `sovereign-gateway` on the SAME CP-node /32 →
      # Conflicting=True → clustermesh Service never got its VIP → forbidden
      # NodePort fallback (hw224 `…mesh.cilium.io:30868`). Merged into ONE
      # `sovereign-vip` pool (no serviceSelector); the clustermesh + powerdns
      # Services co-locate via `lbipam.cilium.io/sharing-key: sovereign-vip`.
      # The gateway rides gatewayAPI.hostNetwork (node:443/:80 direct), so it
      # needs no LB-IPAM pool — cilium.gateway.lbIpam + CILIUM_GATEWAY_LB_IPAM_*
      # are retired. Slot folds both gates into one cilium.lbIpam block +
      # postRenderer that suppresses the clustermesh Service NodePort.
      # 1.4.10 (#4765 follow-up): clustermesh apiserver tls.authMode=legacy —
      # the 1.19.3 default (migration) mounts a helm-managed users CM that the
      # externally-established Catalyst mesh never renders (both hw224 regions
      # wedged Init:0/1 FailedMount on the 1.4.9 roll).
      # 1.4.11 (#4656, 2026-07-05): NATIVE routing (drop VXLAN). VXLAN-over-
      # WireGuard stacked two headers per cross-node pod packet → DF-drops
      # unfixable by any MTU. Chart switches routingMode: native +
      # ipv4NativeRoutingCIDR + autoDirectNodeRoutes; MTU pin above moves
      # 1370 → 1420 (WG-only). Layers on the 1.4.9/1.4.10 zero-nodeport +
      # authMode=legacy work. Cross-region ClusterMesh pod path needs a fresh
      # 2-region prov to verify (datapath change). Refs #4656.
      version: 1.4.15
      sourceRef:
        kind: HelmRepository
        name: bp-cilium
        namespace: flux-system
  # Event-driven install: Helm completes when manifests apply, not when
  # cilium-agent reaches Ready (agent waits for envoyconfig CRDs that the
  # SAME chart installs — legitimate slow-Ready). Replaces blanket
  # spec.timeout: 15m band-aid from PR #221.
  install:
    timeout: 15m
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
  # #4765 — suppress the clustermesh-apiserver Service NodePort. The Service
  # is type=LoadBalancer (rides the sovereign-vip VIP on :2379), but Kubernetes
  # auto-allocates a NodePort for EVERY LoadBalancer Service unless told not to
  # (that is the `…mesh.cilium.io:30868` NodePort the pre-#4765 dial fell back
  # to). The upstream cilium 1.19.3 clustermesh-apiserver Service template does
  # NOT expose allocateLoadBalancerNodePorts, so patch it here via a
  # postRenderer. NodePorts are ABSOLUTELY FORBIDDEN (founder 2026-07-03).
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: clustermesh-apiserver
              namespace: kube-system
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: clustermesh-apiserver
                namespace: kube-system
              spec:
                allocateLoadBalancerNodePorts: false
  values:
    cilium:
      # Multi-region (operator mandate 2026-05-12) — each region's k3s
      # is an INDEPENDENT cluster per NAMING-CONVENTION §1.3, so each
      # region's cilium MUST talk to its OWN local CP, not the primary's
      # 10.0.1.2. Flux postBuild.substitute in
      # cloudinit-control-plane.tftpl renders CILIUM_K8S_SERVICE_HOST to
      # the local CP's private IP per region (10.0.1.2 for primary,
      # 10.0.<10+idx>.2 for secondaries — see main.tf:267
      # secondary_region_cp_ips). Without this, secondary regions'
      # cilium-operator crash-loops with x509 unknown authority (the
      # primary's CA doesn't sign the secondary cluster's API cert).
      # The :=10.0.1.2 fallback preserves single-region (primary-only)
      # provisions where the substitute var would be empty/absent.
      k8sServiceHost: ${CILIUM_K8S_SERVICE_HOST:=10.0.1.2}
      # 1.4.11 (#4656, 2026-07-05): NATIVE routing (drop VXLAN) — the datapath
      # MTU is now WG-only. The old VXLAN-tunnel + WireGuard stack was
      # UNFIXABLE by any MTU (cilium derived cilium_wg0 = MTU−80, so a pod
      # packet + 50B VXLAN header ALWAYS exceeded wg0 → full-size cross-node
      # pod TCP DF-dropped → Phase-1 convergence deadlock; #4467's MTU=1370
      # pin disproven live on hw224). With routingMode: native (chart
      # values.yaml) there is no VXLAN header to stack — WireGuard
      # encapsulates ONCE, so the correct pod MTU is eth0(1500)−80 = 1420.
      # The chart default (platform/cilium/chart/values.yaml `cilium.MTU:
      # 1420`) already carries this; pinned here too so the load-bearing value
      # is visible at the slot. Jumbo-frame / non-1500-eth0 Sovereigns override
      # via ${CILIUM_MTU:=1420} in their per-Sovereign overlay (eth0−80).
      # routingMode: native + ipv4NativeRoutingCIDR (10.42.0.0/15, spanning
      # both per-region k3s pod CIDRs) + autoDirectNodeRoutes live in the chart
      # values.yaml; the slot inherits them (no override needed here).
      MTU: ${CILIUM_MTU:=1420}
      # Phase-8a bug #15 (otech8 deployment 1bfc46347564467b 2026-05-01):
      # cilium-agent waits forever for the operator to register
      # ciliumenvoyconfigs + ciliumclusterwideenvoyconfigs CRDs.
      # Setting `envoy.enabled: true` (chart-level) runs Envoy as a separate
      # daemonset but does NOT register those CRDs — that requires
      # `envoyConfig.enabled: true`, a separate upstream chart toggle.
      # Without it, the agent's node taint `node.cilium.io/agent-not-ready`
      # never lifts and every other HelmRelease (37 of them) blocks on its
      # dependsOn chain.
      envoyConfig:
        enabled: true
      l7Proxy: true
      # Wave 5.127 (#TBD-hw30-apparmor): explicit per-container apparmor
      # annotations on the agent DaemonSet pods. Why this is mandatory on
      # HCS Kom4DC (and likely any host with cri-containerd.apparmor.d in
      # enforce mode + kernel.yama.ptrace_scope=1):
      #
      # The agent's `mount-cgroup` initContainer runs:
      #   nsenter --cgroup=/hostproc/1/ns/cgroup --mount=/hostproc/1/ns/mnt
      # to bootstrap the host-side cgroup v2 mount at /run/cilium/cgroupv2.
      # Opening /proc/1/ns/cgroup requires ptrace_may_access on PID 1.
      # Even with SYS_PTRACE+SYS_ADMIN+SYS_CHROOT in the container's
      # CapEff, the default cri-containerd.apparmor.d profile DENIES the
      # ptrace operation. Result: `nsenter: cannot open
      # /hostproc/1/ns/cgroup: Permission denied` → mount-cgroup
      # Init:CrashLoopBackOff → cilium-agent never starts → cilium-envoy
      # on that node has no xDS source → Gateway listener never binds on
      # that node → the cilium-gateway LoadBalancer Service's :443/:80
      # health target flips that node's member OFFLINE → tail-latency
      # request gets routed to a worker whose envoy isn't serving →
      # connection-refused/timeout on TLS.
      #
      # The upstream chart sets pod-level
      # `spec.securityContext.appArmorProfile.type: Unconfined` (the
      # post-v1.30 modern API). On k3s 1.31 this pod-level field does
      # NOT propagate to init containers. The deprecated per-container
      # annotation (still honored through v1.31) is the only form that
      # works for init containers. Verified live on hw29 cp1 2026-05-27:
      # before the annotations 3 of 8 cilium agents Init:CrashLoopBackOff
      # with the nsenter error; after the annotations all 8 Ready 1/1
      # and HTTPS 200 stable on all ELB members.
      podAnnotations:
        container.apparmor.security.beta.kubernetes.io/cilium-agent: unconfined
        container.apparmor.security.beta.kubernetes.io/config: unconfined
        container.apparmor.security.beta.kubernetes.io/mount-cgroup: unconfined
        container.apparmor.security.beta.kubernetes.io/apply-sysctl-overwrites: unconfined
        container.apparmor.security.beta.kubernetes.io/mount-bpf-fs: unconfined
        container.apparmor.security.beta.kubernetes.io/clean-cilium-state: unconfined
        container.apparmor.security.beta.kubernetes.io/install-cni-binaries: unconfined
      prometheus:
        enabled: false
        serviceMonitor:
          enabled: false
      hubble:
        metrics:
          # `null` (NOT [] and NOT a populated list) suppresses the
          # upstream chart's metrics ServiceMonitor render. Hubble flow
          # collection still works for Hubble Relay/UI without a
          # ServiceMonitor — that pulls the kube-prometheus-stack CRDs
          # which do not exist on a fresh Sovereign at bp-cilium install
          # time. Operators flip metrics on once
          # bp-kube-prometheus-stack is reconciled (issue #182).
          enabled: null
          serviceMonitor:
            enabled: false
        # qa-loop iter-16 Fix #70: default Hubble UI ON for every
        # Sovereign so TC-289 (https://hubble.<fqdn>/) resolves out of
        # the box. Hubble flow telemetry is the canonical L3-L7 visibility
        # surface for the Catalyst control plane (EPIC-5 #1100); shipping
        # it default-OFF made every Sovereign blind by default and
        # required a per-Sovereign overlay touch that nobody remembered
        # to wire. Per-Sovereign overlay can still set HUBBLE_ENABLED=false
        # for fully air-gapped lab Sovereigns where Relay traffic to
        # cilium-agents is not desired.
        relay:
          enabled: ${HUBBLE_ENABLED:=true}
        ui:
          enabled: ${HUBBLE_ENABLED:=true}

      # qa-loop iter-12 Fix #53C: BGP control plane (default off, opt-in
      # via BGP_ENABLED=true). Per ADR-0001 §9 the BGP control plane is the
      # canonical path for Sovereign-to-customer-router prefix advertisement
      # (LoadBalancer VIPs, Pod CIDRs to customer's existing core network).
      bgpControlPlane:
        enabled: ${BGP_ENABLED:=false}

      # ── #4765 — the ONE canonical LB-IPAM pool (sovereign-vip) ─────────
      # bp-cilium 1.4.9's templates/sovereign-vip-lb-ipam-pool.yaml renders a
      # SINGLE CiliumLoadBalancerIPPool `sovereign-vip` (no serviceSelector)
      # when enabled. Every type=LoadBalancer Service that must ride the
      # shared Sovereign EIP — clustermesh-apiserver (:2379), powerdns anycast
      # (:53) — co-locates on this one /32 via the
      # `lbipam.cilium.io/sharing-key: sovereign-vip` annotation. This REPLACES
      # the pre-#4765 TWO pools (clustermesh-apiserver + sovereign-gateway),
      # which claimed the SAME CP-node /32 → the second went Conflicting=True →
      # the clustermesh Service never got its VIP → forbidden NodePort fallback
      # (hw224 `…mesh.cilium.io:30868`). One pool + one CIDR = no overlap.
      #   no-CCM Huawei cloud-init: CILIUM_LB_IPAM_ENABLED=true +
      #     CILIUM_LB_IPAM_CIDRS=<this-region-cp-public-ipv4>/32.
      #   Hetzner leaves both unset → pool CR not rendered → hcloud-ccm
      #     materialises the Service LBs directly (canonical).
      lbIpam:
        enabled: ${CILIUM_LB_IPAM_ENABLED:=false}
        cidrs:
          - ${CILIUM_LB_IPAM_CIDRS:=0.0.0.0/32}

      # #4784 — clustermesh-proxy: hostNetwork TCP-passthrough shim so
      # cross-region peers reach the clustermesh-apiserver etcd on a DEDICATED
      # non-2379 host port. REQUIRED on no-CCM Huawei: the shared Sovereign
      # EIP is the CP-node IP (1:1 NAT) AND the CP node runs k3s' own etcd on
      # host :2379 → <EIP>:2379 lands on k3s etcd, never Cilium's
      # clustermesh-apiserver (proven live hw225, #4784). hostPort MUST equal
      # catalyst-api CLUSTERMESH_APISERVER_DIAL_PORT + infra
      # clustermesh_proxy_port (SG rule). Hetzner leaves it disabled
      # (hcloud-ccm LB IP has no k3s-etcd host collision → canonical :2379).
      clustermeshProxy:
        enabled: ${CILIUM_CLUSTERMESH_PROXY_ENABLED:=false}
        hostPort: ${CILIUM_CLUSTERMESH_PROXY_PORT:=12379}

      # ── Cilium ClusterMesh — multi-region peering ──────────────────
      #
      # Per ADR-0001 §9 + EPIC-6 #1101 (multi-region active-hotstandby DR),
      # ClusterMesh is the canonical inter-region transport for replication
      # and Service-of-type-global traffic between Sovereign peer clusters.
      #
      # cluster.name + cluster.id are PER-SOVEREIGN anchors; per
      # docs/INVIOLABLE-PRINCIPLES.md #4 (never hardcode), they MUST come
      # from the Flux Kustomization's postBuild.substitute block — which
      # in turn flows from infra/hetzner/cloudinit-control-plane.tftpl
      # (CLUSTER_MESH_NAME, CLUSTER_MESH_ID) and ultimately from the
      # operator-supplied request.cluster_mesh_name + cluster_mesh_id at
      # provision time. Mesh registry: docs/CLUSTERMESH-CLUSTER-IDS.md
      # tracks the cluster.id allocation across the OpenOva fleet.
      #
      # Cross-region reachability (#4765 — ZERO NodePorts, ever): peers
      # reach the clustermesh-apiserver etcd (:2379) over the DIRECT
      # LoadBalancer path — never a NodePort. On no-CCM Huawei the single
      # `sovereign-vip` LB-IPAM pool (cilium.lbIpam above) hands the
      # clustermesh-apiserver Service the shared Sovereign EIP via the
      # `lbipam.cilium.io/sharing-key: sovereign-vip` annotation, and the
      # #4784 `clustermeshProxy` hostNetwork shim (hostPort :12379) fronts
      # the etcd where <EIP>:2379 would otherwise collide with the CP
      # node's own k3s etcd. On Hetzner hcloud-ccm allocates a public-IPv4
      # LB per peer region. The retired pre-#4765 `node:32379` NodePort
      # exposure is FORBIDDEN and no longer rendered.
      #
      # A Sovereign that does NOT join a mesh leaves CLUSTER_MESH_NAME
      # empty (Flux envsubst rule: ${VAR:=default} -> "default" when
      # unset/empty). The cilium subchart accepts an empty cluster.name
      # provided cluster.id stays 0; the clustermesh-apiserver Pod still
      # runs but no peer connects (single-cluster no-op).
      cluster:
        name: ${CLUSTER_MESH_NAME:=}
        id: ${CLUSTER_MESH_ID:=0}
      clustermesh:
        useAPIServer: true
        apiserver:
          # #4765 follow-up (hw224 live, 2026-07-05): cilium 1.19.3 defaults
          # tls.authMode=migration, which mounts `etcd-users-config` from
          # ConfigMap `clustermesh-remote-users` — a CM only rendered when
          # helm itself manages the mesh peer list (clustermesh.config.enabled).
          # Catalyst establishes the mesh EXTERNALLY (catalyst-api
          # AutoEstablishClusterMesh distributes CA-signed client certs), so
          # that CM never exists and the 1.4.9 roll wedged BOTH hw224 regions'
          # apiserver pods Init:0/1 on FailedMount -> mesh down. legacy =
          # plain CA-signed client-cert etcd auth, no users CM, matching the
          # external establish flow exactly.
          tls:
            authMode: legacy
          service:
            # #4765 (founder 2026-07-03, "FUCK THE NODEPORTS!!!"): the
            # clustermesh-apiserver Service is LoadBalancer ALWAYS — NodePort
            # is ABSOLUTELY FORBIDDEN (no `type: NodePort`, no `nodePort:`
            # field, no operator escape hatch). The former
            # ${CLUSTERMESH_SERVICE_TYPE}/${CLUSTERMESH_NODE_PORT} substitutes
            # and the per-service `lbIpam` block are RETIRED here.
            #
            # On no-CCM Huawei the single sovereign-vip LB-IPAM pool
            # (cilium.lbIpam below) hands this Service the shared EIP; on
            # Hetzner hcloud-ccm allocates a public-IPv4 LB per peer region.
            # AutoEstablishClusterMesh (handler/clustermesh.go) hard-fails on
            # type != LoadBalancer and reads the LB ingress IP for the peer
            # endpoint (dialing VIP:2379 — never a NodePort). Cilium WG node
            # encryption secures the LB→node→pod path end-to-end.
            type: LoadBalancer
            # Hetzner CCM requires location OR network-zone annotation
            # to allocate the LB. ${HCLOUD_LB_LOCATION} flows from the
            # bootstrap-kit Kustomization substitute, set by the
            # cloud-init template for EVERY region (primary CP renders
            # var.region; secondary CPs render each.value.cloudRegion).
            # No default fallback: a missing substitute is a tofu
            # rendering bug, not a runtime fallback opportunity. The
            # previous `:=hel1` default silently masked the 2026-05-16
            # multi-region rendering regression (t114-omani-works
            # primary=hel1 — fallback APPEARED correct but every
            # secondary also rendered hel1; an explicit empty render
            # would have failed cilium chart admission and surfaced
            # the bug at provision time instead of at clustermesh-
            # apiserver LB allocation time).
            annotations:
              # #4765 — ride the ONE shared Sovereign EIP served by the
              # sovereign-vip LB-IPAM pool (no serviceSelector). Distinct L4
              # port (:2379) makes the share with powerdns :53 collision-free.
              # Load-bearing on no-CCM Huawei; inert on Hetzner (LB-IPAM
              # disabled → hcloud-ccm reads its own annotations below).
              lbipam.cilium.io/sharing-key: sovereign-vip
              load-balancer.hetzner.cloud/location: "${HCLOUD_LB_LOCATION}"
              load-balancer.hetzner.cloud/type: "lb11"
              # use-private-ip: false — LB→backend connection transits
              # the PUBLIC IP. PR #1537 had set this to "true" attempting
              # to bypass the firewall NodePort block; that approach was
              # NOT viable because the per-region Hetzner LB has no
              # private-network attachment by default. CCM rejected:
              #     "ReconcileHCLBTargets: use private ip: missing network id"
              # → LB never allocated → clustermesh apiserver Service
              # stayed `<pending>` → clustermesh orchestrator waited 5min
              # for LB IP then bailed with empty peerEntries.
              #
              # PR #1538's canonical fix opens TCP 30000-32767 in the
              # Hetzner firewall so the public-IP LB health checks pass.
              # This file reverts to use-private-ip=false to align with
              # that approach. Caught on t130 (30463cd0a5a931be, 2026-05-16).
              load-balancer.hetzner.cloud/use-private-ip: "false"
              # 2026-05-16: per-region LB name suffix. Without
              # ${SOVEREIGN_REGION_KEY} interpolated, all 3 regions'
              # clustermesh-apiserver Services adopted the FIRST LB
              # CCM-created (Hetzner LBs are unique by name; second
              # creation just reuses the first). Caught on t121
              # (48d8fe77...): primary + nbg1 both reported external_ip
              # 167.233.14.208 (nbg1 LB), sin stayed <pending>.
              load-balancer.hetzner.cloud/name: "${SOVEREIGN_FQDN_SLUG:=catalyst}-${SOVEREIGN_REGION_KEY:=primary}-clustermesh"
              # #4765 — the sharing-key annotation above co-locates THIS
              # Service on the single sovereign-vip pool CIDR (the CP-node
              # EIP). On no-CCM Huawei that EIP is a 1:1 NAT, but the remote
              # peer reaches the clustermesh VIP over the WG-encrypted node
              # path (NOT via the NAT), so 2379-on-the-VIP is served by
              # Cilium's kube-proxy-replacement LB frontend — no NodePort.
              # The gateway rides its OWN §854-clean path (gateway-api
              # hostNetwork, node:443/:80 direct — see gatewayAPI.hostNetwork
              # below + infra/providers/huawei/main.tf elb_primary members),
              # so it does NOT need its own LB-IPAM pool; the pre-#4765
              # cilium.gateway.lbIpam block + CILIUM_GATEWAY_LB_IPAM_*
              # substitutes are RETIRED (a second pool on the same CIDR was
              # the Conflicting=True defect #4765 eradicated).

      # ── #4706 — gateway-api hostNetwork, PER-PROVIDER ──────────────────
      # cilium 1.19.3 (bp-cilium 1.4.8) fixed the 1.16.x hostNetwork bind
      # bug, so cilium-envoy (already a hostNetwork DaemonSet) binds
      # node:443/:80 directly.
      #   Huawei (no-CCM): cloud-init sets CILIUM_GATEWAY_HOSTNETWORK_
      #     ENABLED="true" — the ONLY §854-clean front door there (the LB
      #     VIP dies at the 1:1-NAT'd EIP, nodePorts are forbidden). The
      #     gateway ELB (infra/providers/huawei/main.tf elb_primary)
      #     targets node:443/:80 — durable ports known at tofu time, so
      #     members are correct from Phase-0 apply.
      #   Hetzner: unset → false — the hcloud-ccm-materialised
      #     LoadBalancer Service stays the front door (hostNetwork ON would
      #     drop the CCM LB and break it).
      gatewayAPI:
        hostNetwork:
          enabled: ${CILIUM_GATEWAY_HOSTNETWORK_ENABLED:=false}

    # ── Catalyst overlay templates (chart/templates/) ────────────────────
    # qa-loop iter-16 Fix #70: Hubble UI HTTPRoute now defaults ON for
    # every Sovereign. The chart auto-derives hostname `hubble.${SOVEREIGN_FQDN}`
    # so the operator only needs the SOVEREIGN_FQDN substitute (already
    # mandatory for every Sovereign — see clusters/_template/bootstrap-kit/
    # 13-bp-catalyst-platform.yaml `host: console.${SOVEREIGN_FQDN}`).
    # Per-Sovereign overlay can still:
    #   - HUBBLE_ENABLED=false  → disable Hubble UI on this Sovereign
    #   - HUBBLE_HOSTNAME=...   → override the auto-derived hostname
    #   - HUBBLE_AUTH=oidc      → enable OIDC enforcement once the
    #                              Keycloak realm wires the hubble-ui client
    catalystOverlay:
      hubbleUI:
        enabled: ${HUBBLE_ENABLED:=true}
        # Explicit override; empty triggers the chart to derive
        # `hubble.${SOVEREIGN_FQDN}` from sovereignFQDN below.
        hostname: ${HUBBLE_HOSTNAME:=}
        sovereignFQDN: ${SOVEREIGN_FQDN}
        gatewayRef:
          # The Sovereign Gateway lives in kube-system — installed by
          # clusters/_template/sovereign-tls/cilium-gateway.yaml. Every
          # other bootstrap-kit HTTPRoute (gitea, auth, grafana, harbor,
          # openbao, powerdns, console/catalyst-platform) attaches to
          # cilium-gateway/kube-system; this overlay matches.
          name: cilium-gateway
          namespace: kube-system
        # G117.5 #2744 (2026-06-03): default flipped `none` → `oidc` now
        # that bp-cilium 1.4.0 ships the oauth2-proxy enforcement sidecar
        # AND bp-keycloak's sovereign realm-import codifies the
        # `hubble-ui` OIDC client (redirect /oauth2/callback). With
        # auth=oidc the chart renders the oauth2-proxy Deployment+Service
        # +Secret and the HTTPRoute targets the proxy, so Hubble UI is
        # OIDC-gated out of the box — silent SSO via the sovereign realm
        # IDR defaultProvider=catalyst-pin (G113 #2725). Operators who
        # explicitly want the legacy UNAUTHENTICATED exposure set
        # HUBBLE_AUTH=none.
        auth: ${HUBBLE_AUTH:=oidc}
        serviceRef:
          name: hubble-ui
          namespace: kube-system
          port: 80
        oauth2Proxy:
          # #5059 — run the oauth2-proxy OIDC discovery + jwks/redeem
          # backchannel against the in-cluster keycloak Service. The default
          # public-issuer discovery hairpins pod->gateway EIP->keycloak, which
          # exceeds the 30s discovery timeout on a freshly-rolled pod under the
          # cutover step-08 deny-egress hold -> CrashLoop -> step-08 sweep
          # restart (hw250 #5059). --oidc-issuer-url + --login-url stay PUBLIC.
          # Verified live: this URL answers the discovery doc 200 in-cluster.
          keycloakInternalURL: http://keycloak.keycloak.svc.cluster.local

      # ── #4656/#4854 — per-node pod-CIDR VPC route reconciler ───────────
      # #4807's whole-/16 pod-CIDR peering routes only carry native-routed
      # pod traffic INTO the peer VPC; with no per-/24 entry in the VPC's
      # OWN table, delivery to the owning node rides Huawei-fabric learning
      # and black-holes PER-NODE (hw228 wab0925: grafana 326× crashloop on
      # the -mesh-rw dial while the sibling node worked — #4854). The
      # bp-cilium CronJob reconciles one `type=ecs` route per node
      # (node.spec.podCIDR -> node ECS id) in this cluster's own VPC route
      # table; podCIDRs are runtime data so tofu cannot own them, and there
      # is deliberately no Huawei CCM/route-controller.
      #   Huawei (no-CCM): cloud-init sets HUAWEI_VPC_ROUTES_ENABLED="true"
      #     and the huawei-* creds below resolve from cloud-credentials.
      #   Hetzner: unset → false — pod routing rides the WireGuard node
      #     mesh; there is no VPC route table to reconcile.
      vpcPodcidrRouteReconciler:
        enabled: ${HUAWEI_VPC_ROUTES_ENABLED:=false}

  # ── #4656 — AK/SK wiring for the route reconciler ────────────────────
  # Pull the four Huawei creds from the canonical flux-system/
  # cloud-credentials Secret (cloud-init Phase 0) into the chart values;
  # the chart renders the namespace-local
  # vpc-podcidr-route-reconciler-credentials Secret from them. Flux
  # dereferences valuesFrom at apply time so the plaintext never lands in
  # this committed manifest. `optional: true` — on Hetzner the Secret
  # carries `hcloud-token`, NOT the huawei-* keys; optional makes Flux
  # SKIP each absent key (same idiom as slots 50/55a/55b), and the
  # reconciler is disabled there anyway.
  valuesFrom:
    - kind: Secret
      name: cloud-credentials
      valuesKey: huawei-ak
      targetPath: catalystOverlay.vpcPodcidrRouteReconciler.huaweiAccessKey
      optional: true
    - kind: Secret
      name: cloud-credentials
      valuesKey: huawei-sk
      targetPath: catalystOverlay.vpcPodcidrRouteReconciler.huaweiSecretKey
      optional: true
    - kind: Secret
      name: cloud-credentials
      valuesKey: huawei-project-id
      targetPath: catalystOverlay.vpcPodcidrRouteReconciler.huaweiProjectId
      optional: true
    - kind: Secret
      name: cloud-credentials
      valuesKey: huawei-region
      targetPath: catalystOverlay.vpcPodcidrRouteReconciler.huaweiRegion
      optional: true
---
# ─── Per-Sovereign Gateway API resources (issue #387) ────────────────────
#
# Cilium owns the GatewayClass (`cilium`) installed by the chart above
# (gatewayAPI.enabled=true, envoy.enabled=true in platform/cilium/chart/
# values.yaml). The single per-Sovereign Gateway listening on
# *.${SOVEREIGN_FQDN}:443 lives here so it boots alongside the CNI
# without needing a new bootstrap-kit slot — every Sovereign HTTP
# blueprint (catalyst-platform, gitea, keycloak, harbor, grafana,
# openbao, powerdns) attaches its HTTPRoute to this Gateway via
# parentRefs.
#
# TLS material: a wildcard Certificate is requested from
# letsencrypt-dns01-prod-powerdns (cert-manager + bp-cert-manager-
# powerdns-webhook from #373; webhook calls contabo's central PowerDNS
# at https://pdns.openova.io). The resulting Secret
# `sovereign-wildcard-tls` is referenced by the Gateway listener.
#
# Cross-namespace HTTPRoute attachment: allowedRoutes.namespaces.from=All
# permits every blueprint namespace (catalyst-system, gitea, keycloak,
# harbor, grafana-system, openbao, powerdns-system) to bind without a
# ReferenceGrant. This matches the Catalyst single-tenant Sovereign
# model — cross-tenant isolation is enforced by per-tenant vClusters
# (bp-vcluster), not by Gateway-level RBAC.
#
# Per ADR-0001 §9.4 and docs/INVIOLABLE-PRINCIPLES.md #4: this resource
# only renders when ${SOVEREIGN_FQDN} is set by Flux envsubst at the
# Sovereign apply time — contabo's bootstrap path does NOT include this
# template, so Traefik continues to serve console.openova.io/nova
# unchanged.
---
# Wave 5.32 (Refs #2204): The actual Gateway resource — was a comment-only
# placeholder for ~20+ days. Every HTTPRoute on a Sovereign attaches to
# parentRef name=cilium-gateway namespace=kube-system; without this Gateway
# the routes have no listener → all *.${SOVEREIGN_FQDN} URLs return HTTP 000.
#
# Wave 5.87 (Refs #2430, #2423 fresh-prov diagnosis): the LEGACY
# `sovereign-wildcard` Certificate that previously lived between the
# Gateway and the comment block above has been REMOVED. Per the
# 2026-05-15 per-name-cert architecture (see
# clusters/_template/sovereign-tls/cilium-gateway-cert.yaml file
# header lines 23-29), the legacy wildcard Cert was superseded by per-
# zone `sovereign-wildcard-tls-${SOVEREIGN_FQDN_DASHED}` issued from
# the sovereign-tls Kustomization (which reconciles AFTER bootstrap-
# kit and overwrites the Gateway listener certificateRefs).
#
# Why removal NOW: leaving the legacy Cert in bootstrap-kit causes
# Flux KSM strict-dry-run validation to fail with `no matches for
# kind "Certificate" in version "cert-manager.io/v1"` on every fresh
# prov BEFORE the bp-cert-manager HelmRelease (also in bootstrap-kit)
# gets a chance to install the CRDs. Flux fails the WHOLE apply on
# any one dry-run-validation failure — deadlocking the entire
# bootstrap-kit including cert-manager itself. Caught live on
# d3c6268c (hw01.omani.works) fresh-prov 2026-05-24T20:00Z:
# bootstrap-kit Kustomization stuck at `ReconciliationFailed` with
# this exact error; ZERO HelmReleases applied; Phase 1 deadlocked.
#
# TLS material for the Gateway listener is now provided exclusively
# by the per-name certs in sovereign-tls. The Gateway listener's
# Secret reference (`sovereign-wildcard-tls` below) is OVERWRITTEN by
# sovereign-tls's cilium-gateway.yaml at reconcile time with the
# per-zone Secret. Pre-overwrite the listener has no TLS Secret —
# harmless; sovereign-tls applies seconds-to-minutes after bootstrap-
# kit Ready, and console.${SOVEREIGN_FQDN} HTTP 200 lights up once
# the per-zone cert lands. Confirmed canonical per the file headers
# in sovereign-tls/cilium-gateway-cert.yaml + cilium-gateway.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gateway
  namespace: kube-system
  annotations:
    # Cilium gateway-controller will provision an Envoy LB exposing
    # this Gateway on the node IPs. The CP EIP is the public address.
    io.cilium/lb-ipam-ips: "${SOVEREIGN_LB_IP}"
spec:
  gatewayClassName: cilium
  listeners:
    # #4682 (2026-07-01): Gateway listeners serve on the standard
    # :443/:80 for ALL providers. hostNetwork is OFF (see
    # platform/cilium/chart/values.yaml gatewayAPI.hostNetwork.enabled:
    # false) so Cilium's gateway-controller provisions the gateway as a
    # Service type=LoadBalancer (`cilium-gateway-<name>` in kube-system);
    # Envoy binds its unprivileged in-pod proxy port and the LB owns the
    # public :443/:80 contract. On Hetzner hcloud-ccm allocates the LB
    # ExternalIP; on Huawei (no CCM) the gateway-lb-ipam-pool.yaml
    # CiliumLoadBalancerIPPool assigns it. No host bind, no NodePort, no
    # :30443/:30080 translation. The ${...:=443}/${...:=80} substitutes
    # remain only as an operator escape hatch for non-standard binds.
    - name: https
      port: ${SOVEREIGN_GATEWAY_HTTPS_PORT:=443}
      protocol: HTTPS
      hostname: "*.${SOVEREIGN_FQDN}"
      tls:
        mode: Terminate
        certificateRefs:
          # G28-followup (Refs #2570, 2026-05-29): per-zone wildcard Secret
          # name is suffixed with the dashed FQDN (chart renders
          # sovereign-wildcard-tls-<SOVEREIGN_FQDN_DASHED>). The Hetzner
          # default substitute SOVEREIGN_FQDN_DASHED is set in
          # cloudinit-control-plane.tftpl; Huawei sets it in its postBuild.
          # Without the dashed suffix the listener references a Secret
          # that doesn't exist (cert-manager creates the dashed one),
          # so Programmed=False/InvalidCertificateRef. Verified live on
          # hw54 14:59Z post-G28.
          - kind: Secret
            name: sovereign-wildcard-tls-${SOVEREIGN_FQDN_DASHED}
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      port: ${SOVEREIGN_GATEWAY_HTTP_PORT:=80}
      protocol: HTTP
      hostname: "*.${SOVEREIGN_FQDN}"
      allowedRoutes:
        namespaces:
          from: All
    - name: apex-https
      port: ${SOVEREIGN_GATEWAY_HTTPS_PORT:=443}
      protocol: HTTPS
      hostname: "${SOVEREIGN_FQDN}"
      tls:
        mode: Terminate
        certificateRefs:
          # G28-followup (Refs #2570, 2026-05-29): per-zone wildcard Secret
          # name is suffixed with the dashed FQDN (chart renders
          # sovereign-wildcard-tls-<SOVEREIGN_FQDN_DASHED>). The Hetzner
          # default substitute SOVEREIGN_FQDN_DASHED is set in
          # cloudinit-control-plane.tftpl; Huawei sets it in its postBuild.
          # Without the dashed suffix the listener references a Secret
          # that doesn't exist (cert-manager creates the dashed one),
          # so Programmed=False/InvalidCertificateRef. Verified live on
          # hw54 14:59Z post-G28.
          - kind: Secret
            name: sovereign-wildcard-tls-${SOVEREIGN_FQDN_DASHED}
      allowedRoutes:
        namespaces:
          from: All
