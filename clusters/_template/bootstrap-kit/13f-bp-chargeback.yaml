# bp-chargeback — Catalyst bootstrap-kit Blueprint slot 13f
# (catalyst-platform cohort / BSS).
#
# The Sovereign BSS placement of the chargeback application (EPIC #6723,
# ADR-0014 D4/D5): usage ledger + rating + statements for the Sovereign's
# Organizations and for external cloud accounts, served at
# chargeback.${SOVEREIGN_FQDN} (Gateway-API HTTPRoute on the canonical
# Sovereign Gateway — never a Traefik Ingress, never a NodePort, §854) and
# linked from the console's BSS menu. Standalone by design: its own CNPG
# Postgres (rendered by the chart in the `chargeback` namespace), its own
# PIN sign-in, its own API and UI; the OpenOva platform collector is an
# adapter (lane D), not a dependency. The same chart also installs
# per-Organization through the catalog (seed entry bp-chargeback) and as a
# central instance — one chart, three placements.
#
# Slot 13f — the catalyst-platform cohort (13 umbrella / 13b sso-bridge /
# 13c oidc-gate / 13d openova-mcp / 13e secondary-edge): the BSS component
# is meaningless before the console it is linked from exists.
#
# dependsOn:
#   - bp-cnpg — the chart renders a postgresql.cnpg.io/v1 Cluster behind a
#     `.Capabilities.APIVersions.Has` gate; installing before the CRD is
#     registered would render NO Cluster, and the post-install DSN sync
#     Job would then poll its full budget for a `<cluster>-app` Secret that
#     never appears and wedge the release.
#   - bp-catalyst-platform — the console this BSS component is linked from,
#     and the catalyst-api the lane-D adapter dials.
#   Namespace-pinned to flux-system on every edge (hw91: a namespace-less
#   dependsOn resolves in the HR's OWN namespace — the #3191 dangling-dep
#   wedge shape).
#
# Post-cutover: the bp-chargeback HelmRepository is repointed by the
# step-06 live-discovery union (#4573 F4) and the workload image is pivoted
# by the step-07 pod-spec sweep (#4973/#4975/#4961) — the chart's image
# helper ALSO honours global.imageRegistry and this slot carries the
# 6-space `imageRegistry: ''` seam for the durable Gitea edit.

---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-chargeback
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-chargeback
  namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
  labels:
    catalyst.openova.io/slot: "13f"
    catalyst.openova.io/component: chargeback
    catalyst.openova.io/region-role: primary
spec:
  # PRIMARY-ONLY HR — the same G2 split (#2574) as its cohort siblings
  # (13 / 13d / 06a / 62): the dependsOn edge bp-catalyst-platform exists
  # only on the primary (suspended on secondary CPs by design), so on a
  # secondary this HR could never leave `dependency not ready`.
  # SECONDARY_HR_SUSPEND renders "true" on every secondary CP's cloud-init
  # and "false" on the primary.
  suspend: ${SECONDARY_HR_SUSPEND:=false}
  interval: 1m
  releaseName: chargeback
  # Its own namespace: the chart renders a private CNPG Cluster + two hook
  # Jobs with namespace-scoped RBAC; co-locating with catalyst-system would
  # widen those Roles onto the umbrella's Secrets.
  targetNamespace: chargeback
  dependsOn:
    - name: bp-cnpg
      namespace: flux-system
    - name: bp-catalyst-platform
      namespace: flux-system
  chart:
    spec:
      chart: bp-chargeback
      # 0.1.0 (#6723, lane B): first release — Deployment + ClusterIP
      # Service + HTTPRoute chargeback.<fqdn> + zero-RBAC ServiceAccount +
      # Cilium ingress/egress CNPs + private CNPG Cluster (placeholder-DSN
      # Secret + post-install sync Job) + create-if-absent
      # APP_ENCRYPTION_KEY Job. Lockstep: products/chargeback/chart/
      # Chart.yaml + blueprint.yaml + catalog-seed (blueprints.yaml).
      # 0.1.3 — #6819: the egress policy gains a dedicated kube-apiserver rule.
      #   Without it the DSN-sync Job's apiserver call was DROPPED (:443 DNATs
      #   to the node's :6443, which the workload rule does not allow), curl
      #   timed out, and the app never left Init:0/1 on hw307.
      version: 0.1.11
      sourceRef:
        kind: HelmRepository
        name: bp-chargeback
        namespace: flux-system
  # Event-driven install: readiness is signalled via Flux dependsOn, never
  # via spec.timeout watchdogs. The hooks (app-key pre-install, db-dsn-sync
  # post-install) are the only blocking steps and complete in seconds once
  # CNPG has minted the `-app` Secret.
  install:
    createNamespace: true
    timeout: 15m
    disableWait: true
    remediation:
      retries: 5
      remediateLastFailure: true
  upgrade:
    timeout: 15m
    disableWait: true
    remediation:
      retries: 3
  # Per-Sovereign overlay surface. ${SOVEREIGN_FQDN} is interpolated at
  # Flux apply time via the bootstrap-kit Kustomization's
  # postBuild.substitute hook.
  values:
    # #4885 / #4892: global.imageRegistry override seam for the step-07
    # cutover image-registry pivot. step-07 patches this HR's
    # spec.values.global.imageRegistry live AND durably sed-edits THIS
    # file — the sed matches `^      imageRegistry:`, so the 6-space
    # indent is REQUIRED. Empty default = verbatim ghcr.io.
    global:
      imageRegistry: ''
    sovereignFqdn: ${SOVEREIGN_FQDN}
    # #6841 — the Sovereign SSO owns sign-in. bp-oidc-gate (slot 13c) holds
    # chargeback.<fqdn> and authenticates the browser against the Keycloak
    # sovereign realm silently (kc_idp_hint=catalyst-pin), then passes the
    # verified address UPSTREAM in X-Forwarded-Email. (X-Auth-Request-* are
    # oauth2-proxy RESPONSE headers for nginx auth_request mode and never
    # reach the upstream — verified from the v7.6.0 binary's own
    # --convert-config-to-alpha output, which lists X-Forwarded-Email under
    # injectRequestHeaders and X-Auth-Request-Email under
    # injectResponseHeaders.) chargeback accepts it instead
    # of prompting for its own PIN, so a user already signed in at the
    # Sovereign is never asked a second time.
    #
    # httpRoute.enabled MUST stay false while this is set: the gate owns the
    # hostname, and a second route on the same host would both be undefined
    # routing AND a public door that bypasses the gate with a spoofable
    # header. The chart refuses to render that combination.
    forwardAuth:
      header: X-Forwarded-Email
    httpRoute:
      enabled: false
    # #6846 — the OpenOva adapter is the WHOLE POINT of the Sovereign
    # placement (ADR-0014 D2 case 1, EPIC #6723 lane D): it syncs this
    # Sovereign's Organizations in as chargeback customers and runs the
    # in-cluster platform collector. The chart defaults it OFF, which is right
    # for the standalone and operator-central profiles that never touch a
    # cluster — but this slot IS the Sovereign profile and never turned it on.
    #
    # Measured on hw307 before this: `"openova adapter off","reason":"no
    # in-cluster Kubernetes configuration"` and `sources:0` on every collect
    # tick. The chart ships the read-only ClusterRole and the ServiceAccount
    # for the adapter, but `automountServiceAccountToken` follows
    # adapter.enabled — so with it false no token is mounted,
    # rest.InClusterConfig() fails, and the binary disables the adapter at
    # INFO level. A signed-in operator sees an app with no customers in it.
    adapter:
      enabled: true
    # #6843 — without this chargeback runs in "dev mode": Mail.Send returns nil,
    # the API answers 200, and the invite link or statement is written to a pod
    # log instead of being delivered. The caller cannot tell that from success.
    #
    # catalyst-api seeds sovereign-smtp-credentials into catalyst-system and
    # bp-reflector mirrors it here (Kubernetes forbids a cross-namespace
    # secretKeyRef). The Secret carries SMTP_* duplicates of its smtp-* keys
    # precisely so this chart's `envFrom.secretRef` works without a per-key map.
    smtp:
      existingSecret: sovereign-smtp-credentials
    config:
      # The Sovereign owner signs in as the operator (spec §4 auth); the
      # bootstrap-kit substitute carries the owner address every Sovereign
      # already knows for its handover mail.
      operatorEmails: ${SOVEREIGN_OWNER_EMAIL:-}
      profile: sovereign
