# bp-powerdns-admin — Catalyst bootstrap-kit slot 11a (post-powerdns).
#
# Deploys the PowerDNS-Admin web UI on a Sovereign so operators can edit
# zones + records without dropping into pdns_control CLI on the bp-powerdns
# Pod. Slot 11a so it sequences after bp-powerdns (slot 11) — the PDA
# container needs PDNS_API_URL reachable + the per-Sovereign
# pdns-api-credentials Secret materialised before it starts.
#
# G91.powerdns-admin (#2656): chart constructed from scratch (no upstream
# Helm chart for ngoduykhanh/powerdns-admin), opts into bp-sso-bridge via
# the standard `sso:` block. Per-Sovereign overlay sets gateway.host
# (pdns-admin.<sovereign-fqdn>) + sso.sovereignFqdn.
#
# #3150 — gateway.host MUST be the single-level `pdns-admin.<sov>` host, NOT
# the former 2-level `admin.dns.<sov>`. Three reasons:
#   1. TLS — the Sovereign wildcard cert is `*.<sov>` (single label). A
#      2-level host `admin.dns.<sov>` is NOT covered → the browser hits a
#      cert-name-mismatch and silent-SSO never even starts (caught live on
#      hw124: `curl admin.dns.hw124.omani.works` → SSL alt-name mismatch).
#   2. OIDC redirect_uri — bp-sso-bridge registers the Keycloak client's
#      redirectUris from the Blueprint endpoint `hostnameTemplate`
#      (`pdns-admin.<sov>`). PowerDNS-Admin (authlib) builds redirect_uri
#      from the live request host, so the served host MUST equal the
#      registered one or Keycloak rejects the callback (invalid_redirect_uri).
#   3. launch-url — the catalog-seed + platform blueprint endpoint emit the
#      launch URL from `pdns-admin.<sov>` + ssoInitPath `/oidc/login`; the
#      served host must match or the console Open lands on a 404.
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: bp-powerdns-admin
  namespace: flux-system
spec:
  type: oci
  interval: 15m
  url: oci://ghcr.io/openova-io
  secretRef:
    name: ghcr-pull
---
apiVersion: v1
kind: Namespace
metadata:
  name: powerdns-admin
  labels:
    catalyst.openova.io/blueprint: bp-powerdns-admin
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bp-powerdns-admin
  namespace: flux-system
spec:
  releaseName: powerdns-admin
  targetNamespace: powerdns-admin
  interval: 15m
  install:
    timeout: 15m
    remediation:
      retries: -1
      remediateLastFailure: true
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      strategy: rollback
      remediateLastFailure: true
    cleanupOnFail: true
  dependsOn:
    - name: bp-powerdns
      namespace: flux-system
    - name: bp-cnpg
      namespace: flux-system
    # bp-postgres-shared-b (#3370 adoption): when PDA SHARES the
    # shared-pg-b instance (SOVEREIGN_PDA_PG_OWN_CLUSTER=false), gate on
    # it so the `pda` Database + role + reflected
    # pda-shared-database-secret exist first. Harmless in the default
    # 1:1 path — bp-postgres-shared-b is an empty Ready release within
    # seconds of bp-cnpg + bp-reflector (the same unconditional-edge
    # shape bp-keycloak slot 09 carries on bp-postgres-shared).
    - name: bp-postgres-shared-b
      namespace: flux-system
    # G92.2 #2661 (2026-06-01): bp-keycloak HR moved to host ns `mgmt`.
    - name: bp-keycloak
      namespace: flux-system  # placement-generated (#3373) — source: placement.yaml; edit THAT file + run scripts/render-slot-placement.py fix
    - name: bp-sso-bridge
      namespace: flux-system
    - name: bp-external-secrets-stores
      namespace: flux-system
    - name: bp-reflector
      namespace: flux-system
    - name: bp-gateway-api
      namespace: flux-system
  chart:
    spec:
      chart: bp-powerdns-admin
      # 0.1.1 (G117.5 W3.D1 #2744, 2026-06-02): append `?kc_idp_hint=catalyst-pin`
      # to OIDC_OAUTH_AUTHORIZE_URL env so PDA's browser-flow auth redirect
      # carries the explicit IdP hint as defense-in-depth alongside the
      # sovereign realm IDR `defaultProvider`. Refs #2744.
      # 0.1.3 (#3150/#3173, 2026-06-10): image repoint
      # ngoduykhanh/powerdns-admin:0.4.2 (dead tag → ImagePullBackOff) →
      # powerdnsadmin/pda-legacy:0.4.2 + drop spurious ghcr-pull pullSecret.
      # 0.1.4 (#3189): wire SQLALCHEMY_DATABASE_URI from the CNPG `uri`
      # secret key so pda-legacy uses pda-pg postgres, not baked-in SQLite.
      # 0.1.5 (#3150, 2026-06-10): silent-SSO logged-in — correct OIDC env-var
      # names (OIDC_OAUTH_USERNAME/_FIRSTNAME/_LAST_NAME/_EMAIL) + name claims
      # point at preferred_username (catalyst-pin carries no given_name).
      # 0.1.7 (#2737, 2026-06-11): add `policy.cilium.io/enforced: "true"` to
      # the Pod template — kyverno cilium-l7-mtls Enforce denied the Deployment
      # on the hw126 fresh prov (first time it reached admission).
      # 0.1.8 (#2737, 2026-06-11): full kyverno-Enforce compliance re-cut.
      # Whole-chart audit vs the live baseline policies confirms every
      # container the chart ships already passes harbor-proxy-pull (proxy
      # glob), image-tag-pinned (0.4.2 / postgresql:16), probes-present
      # (both probes on the app container) and cilium-l7-mtls (enforced
      # label, 0.1.7). Re-cut publishes the corrected chart so the FIX
      # propagates past the stale pre-0.1.7 artifact hw126 first admitted.
      # Adds the bp-gitea/bp-harbor Capabilities guard to the CNPG Cluster
      # template so a cold install can't half-render before bp-cnpg's CRD.
      # 0.1.9 (2026-06-12, founder): root-URL zero-click — /login -> /oidc/login.
      # 0.1.10: explicit port 443 on the SSO redirect (the #3310 class).
      # 0.1.11: REVERT the /login redirect — it intercepted the OIDC
      # post-callback bounce (ERR_TOO_MANY_REDIRECTS -> 500, admin walk).
      # 0.1.12 (#3370): embedded-DB elimination seam —
      # postgres.cluster.enabled gate + databaseSecret.name flip so PDA
      # adopts the shared-pg-b `pda` Context (one-flag enable_shared_pg
      # contract, the gitea/harbor/keycloak shape).
      # 0.1.14 (#3486): embedded path reads the CNPG pda-pg-app Secret
      # directly — retires the racy reflects: pull-mirror that left
      # pda-database-secret empty and looped the install forever (wedged
      # bootstrap-kit -> sovereign-tls -> wildcard cert -> console 000).
      version: 0.1.14
      sourceRef:
        kind: HelmRepository
        name: bp-powerdns-admin
        namespace: flux-system
      interval: 15m
  values:
    # Per-Sovereign overlays supply:
    #   gateway.host           — e.g. pdns-admin.${SOVEREIGN_FQDN}
    #   sso.sovereignFqdn      — e.g. ${SOVEREIGN_FQDN}
    # All other defaults inherit from platform/powerdns-admin/chart/values.yaml.
    gateway:
      # #3150 — single-level host (wildcard-cert-covered + matches the KC
      # client redirectUris + the catalog-seed/blueprint hostnameTemplate).
      host: "pdns-admin.${SOVEREIGN_FQDN}"
    sso:
      sovereignFqdn: "${SOVEREIGN_FQDN}"
    # ── Shared-instance flip (#3370 — the gitea/harbor/keycloak shape) ──
    # Default OWN_CLUSTER=true → the bundled pda-pg CNPG Cluster renders and
    # PDA reads its generated `pda-pg-app` Secret DIRECTLY (same namespace,
    # always present, carries uri/username/password). #3486: the default
    # secret name is now `pda-pg-app`, NOT the retired empty
    # `pda-database-secret` reflector mirror — that same-namespace
    # `reflects:` pull was edge-triggered and raced the HR
    # uninstall/reinstall remediation churn, leaving the mirror empty and
    # looping the install forever (which wedged bootstrap-kit → sovereign-tls
    # → the wildcard cert → console HTTP 000 on hw134). Cloud-init computes
    # OWN_CLUSTER=false + the secret flip from the SAME enable_shared_pg var
    # that turns slot 16c ON: PDA then reads username/password/uri straight
    # from the reflector-PUSHED pda-shared-database-secret hub (shared-pg-b's
    # `pda` Context) — also a direct read, no mirror hop, no reflects: pull.
    postgres:
      cluster:
        enabled: ${SOVEREIGN_PDA_PG_OWN_CLUSTER:=true}
    databaseSecret:
      name: ${SOVEREIGN_PDA_PG_SECRET:=pda-pg-app}
