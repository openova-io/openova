# flux-system/ghcr-pull (SEC-154): the imagePullSecret for ghcr.io/openova-io/*.
# bp-reflector (slot 05a) mirrors it into every workload namespace so the
# catalyst-* and bp-* pods pull cleanly; every kit HelmRelease pulls with it
# (kit key REGISTRY_PULL_SECRET). The value is the seed's
# GHCR_PULL_DOCKERCONFIGJSON: the whole .dockerconfigjson (its login twice,
# as username and password and as auth), base64-encoded, one value under one
# name.
#
# The reflector lists (moved from the first-boot template):
# #3819: the SME service mesh namespace was renamed sme -> org-services in
# #3383; this list was left at the dead sme namespace, so every org-services
# Deployment hit FailedToRetrieveImagePullSecret (ghcr-pull). The lists name
# the post-#3383 mesh namespace.
# #4246/#4328: per-Org workload namespaces are created at run time and cannot
# be listed; their HelmReleases run private ghcr.io/openova-io/openova/*
# images. Reflector entries are full-match regular expressions. #4293/#4295
# named the per-Org namespace after the bare Organization slug, which matched
# neither the static list nor org-.* .
# #4423: the reflector splits each annotation value at commas, so a regular
# expression with a comma breaks. [a-z][a-z0-9-]* is the comma-free form of
# the signup rule [a-z][a-z0-9-]{2,30}; org-.* stays for the legacy
# org-<uuid> namespaces. NEVER put a {m,n} quantifier in a reflector list.
# Refs #3383, #4246, #4293, #4328, #4423.
# Rendered once (ssa IfNotPresent: Flux creates it from the seed, never writes it back) for its writers after first boot: platform/self-sovereign-cutover/chart/templates/06-helmrepository-patches-job.yaml, platform/harbor/chart/templates/pull-robot-job.yaml, scripts/local-pack.sh.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "org-services,catalyst,catalyst-system,gitea,harbor,flux-system,org-.*,[a-z][a-z0-9-]*"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "org-services,catalyst,catalyst-system,gitea,harbor,org-.*,[a-z][a-z0-9-]*"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "${GHCR_PULL_DOCKERCONFIGJSON}"
