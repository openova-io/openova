# The rights of the seed builder (SEC-153, SEC-154): read the bootstrap Secrets
# and the seed by name, create Secrets in flux-system (a create cannot be
# limited to a name; the script creates only bootstrap-seed), and patch the
# seed by name to add the values it lacks. It updates, deletes and patches
# nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bootstrap-seed-build
  namespace: flux-system
  labels:
    catalyst.openova.io/component: bootstrap-seed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-seed-build
  namespace: flux-system
  labels:
    catalyst.openova.io/component: bootstrap-seed
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["bootstrap-seed", "harbor-robot-token", "pdm-basicauth", "sovereign-tls-secrets", "ghcr-pull", "object-storage"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["bootstrap-seed"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bootstrap-seed-build
  namespace: flux-system
  labels:
    catalyst.openova.io/component: bootstrap-seed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bootstrap-seed-build
subjects:
  - kind: ServiceAccount
    name: bootstrap-seed-build
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-seed-build
  namespace: catalyst-system
  labels:
    catalyst.openova.io/component: bootstrap-seed
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["catalyst-handover-jwt-public"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bootstrap-seed-build
  namespace: catalyst-system
  labels:
    catalyst.openova.io/component: bootstrap-seed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bootstrap-seed-build
subjects:
  - kind: ServiceAccount
    name: bootstrap-seed-build
    namespace: flux-system
