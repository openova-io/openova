# flux-system/sovereign-tls-secrets (SOV-130): the Kustomization sovereign-tls
# reads it through postBuild.substituteFrom. Its one key, POWERDNS_API_KEY,
# holds the base64 form of the central DNS-01 API key, which sovereign-tls
# substitutes into data.api-key of cert-manager/powerdns-api-credentials
# (clusters/_template/sovereign-tls/powerdns-api-credentials.yaml). So it is
# stringData: the value of the key is the base64 text the seed carries.
apiVersion: v1
kind: Secret
metadata:
  name: sovereign-tls-secrets
  namespace: flux-system
type: Opaque
stringData:
  POWERDNS_API_KEY: "${POWERDNS_API_KEY}"
