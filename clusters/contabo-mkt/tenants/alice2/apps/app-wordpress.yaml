apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: apps
  labels:
    app: wordpress
    openova.io/tenant: "alice2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
        openova.io/tenant: "alice2"
    spec:
      containers:
        - name: wordpress
          image: wordpress:6-apache
          ports:
            - containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: "mysql"
            - name: WORDPRESS_DB_USER
              value: "app"
            - name: WORDPRESS_DB_PASSWORD
              value: "d990ee01f54d0ffa2c584bc295db8aaa"
            - name: WORDPRESS_DB_NAME
              value: "db_wordpress"
            - name: MYSQL_HOST
              value: "mysql"
            - name: MYSQL_USER
              value: "app"
            - name: MYSQL_PASSWORD
              value: "d990ee01f54d0ffa2c584bc295db8aaa"
            - name: MYSQL_DATABASE
              value: "db_wordpress"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: apps
spec:
  selector:
    app: wordpress
  ports:
    - port: 80
      targetPort: 80
