# use-release-writer: `git push origin` in this checkout pushes with the release-writer deploy key.
# Call it before the first push to main and end that commit's first line with [skip ci]: a key push
# starts push workflows. scripts/check-bot-writers.py checks both. A composite cannot read secrets.
name: use-release-writer
description: Make git push origin in this checkout push with the release-writer deploy key.
inputs:
  key:
    description: The private half of the release-writer deploy key, secrets.RELEASE_WRITER_KEY.
    required: true
runs:
  using: composite
  steps:
    - name: Push with the release-writer key
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        RELEASE_WRITER_KEY: ${{ inputs.key }}
      run: bash scripts/ci/use-release-writer.sh
