name: acceptance-sovereign

# ADR-0015 D9 — function is the acceptance criterion.
#
# Runs tests/acceptance/sovereign (scripts/acceptance-sovereign.sh) against a
# live Sovereign through the same API the console uses: install WordPress
# active-hot-standby across A and B, write a post + upload media, read both
# back, move the Primary to B, verify everything there (actual primary, a
# complete topology-transition Jobs record, DNS, data, a new write), move
# back, delete.
#
# With record=true the JSON record is committed to docs/ledger/acceptance/ —
# PASS or FAIL. That record is what:
#   * scripts/acceptance-gate.py reads to open/close the next deploy-bot bump
#     (catalyst-build.yaml job `acceptance-gate`), and
#   * scripts/check-function-rows-cite-acceptance.py requires a function-clause
#     UAT row to cite (`acceptance:<run_id>`) before it may turn ✅.
#
# Secrets (per repo; base64 of the files):
#   ACCEPTANCE_KUBECONFIG_A  kubeconfig of the region that starts as Primary
#   ACCEPTANCE_KUBECONFIG_B  kubeconfig of the region that starts as Standby
#   ACCEPTANCE_CATALYST_SESSION (optional) an owner catalyst_session value; when
#     absent the run mints one from the Sovereign's own signer (ACCEPT_MINT=1),
#     which the region-A kubeconfig must be allowed to `exec` for.
# The Sovereign apiservers must be reachable from the runner: pass a
# self-hosted runner label in `runner` when GitHub-hosted runners cannot reach
# them.
#
# Refs #7067.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Sovereign env label as named in the UAT header (e.g. hw307)
        required: true
        default: hw307
      journeys:
        description: Journeys to run
        required: false
        default: J1,J2,J3,J4,J5
      record:
        description: Commit the JSON record to docs/ledger/acceptance
        type: boolean
        default: true
      runner:
        description: runs-on label (self-hosted when the apiservers are firewalled)
        required: false
        default: ubuntu-latest
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      journeys:
        type: string
        default: J1,J2,J3,J4,J5
      record:
        type: boolean
        default: true
      runner:
        type: string
        default: ubuntu-latest
    outputs:
      result:
        description: PASS or FAIL
        value: ${{ jobs.live.outputs.result }}
    secrets:
      ACCEPTANCE_KUBECONFIG_A:
        required: true
      ACCEPTANCE_KUBECONFIG_B:
        required: true
      ACCEPTANCE_CATALYST_SESSION:
        required: false
  pull_request:
    paths:
      - 'tests/acceptance/sovereign/**'
      - 'scripts/acceptance-sovereign.sh'
      - 'scripts/acceptance-gate.py'
      - 'scripts/acceptance_record.py'
      - '.github/workflows/acceptance-sovereign.yaml'

concurrency:
  # One live run per Sovereign at a time — two runs would move the same
  # Primary under each other.
  group: acceptance-sovereign-${{ inputs.env || github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    name: suite unit tests + gate self-tests (no cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: go vet + test (proves each assertion helper can FAIL)
        working-directory: tests/acceptance/sovereign
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: deploy gate self-test
        run: python3 scripts/acceptance-gate.py --self-test

  live:
    name: live acceptance on ${{ inputs.env }}
    if: github.event_name != 'pull_request'
    needs: [unit]
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: write   # commit the record
    outputs:
      result: ${{ steps.run.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: azure/setup-kubectl@v4
      - name: Write kubeconfigs (never echoed)
        env:
          KA: ${{ secrets.ACCEPTANCE_KUBECONFIG_A }}
          KB: ${{ secrets.ACCEPTANCE_KUBECONFIG_B }}
        run: |
          set -euo pipefail
          [ -n "$KA" ] && [ -n "$KB" ] || { echo "::error::ACCEPTANCE_KUBECONFIG_A/B secrets are not set"; exit 2; }
          umask 077; mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KA" | base64 -d > "$RUNNER_TEMP/kube/a.yaml"
          printf '%s' "$KB" | base64 -d > "$RUNNER_TEMP/kube/b.yaml"
      - name: Run the suite
        id: run
        env:
          ACCEPT_KUBECONFIG_A: ${{ runner.temp }}/kube/a.yaml
          ACCEPT_KUBECONFIG_B: ${{ runner.temp }}/kube/b.yaml
          ACCEPT_JOURNEYS: ${{ inputs.journeys }}
          CATALYST_SESSION: ${{ secrets.ACCEPTANCE_CATALYST_SESSION }}
          ACCEPT_MINT: ${{ secrets.ACCEPTANCE_CATALYST_SESSION == '' && '1' || '0' }}
          ENV_LABEL: ${{ inputs.env }}
          RECORD: ${{ inputs.record && '--record' || '' }}
        run: |
          set +e
          scripts/acceptance-sovereign.sh "$ENV_LABEL" $RECORD | tee "$RUNNER_TEMP/acceptance.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" = 0 ]; then echo "result=PASS" >> "$GITHUB_OUTPUT"; else echo "result=FAIL" >> "$GITHUB_OUTPUT"; fi
          { echo '### ADR-0015 D9 acceptance'; echo; echo '```'; sed -n '/^ACCEPTANCE /,$p' "$RUNNER_TEMP/acceptance.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Upload record + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ inputs.env }}-${{ github.run_id }}
          path: |
            docs/ledger/acceptance/*.json
            ${{ runner.temp }}/acceptance.log
          if-no-files-found: warn
      - name: Commit the record (PASS or FAIL — a failure is evidence too)
        if: always() && inputs.record
        run: |
          set -euo pipefail
          git config user.name hatiyildiz
          git config user.email 269457768+hatiyildiz@users.noreply.github.com
          git add docs/ledger/acceptance/*.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no record to commit"; exit 0; fi
          git commit -m "docs(acceptance): ${{ inputs.env }} D9 run ${{ steps.run.outputs.result }} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push the acceptance record"; exit 1
      - name: Fail the job on a failed run
        if: steps.run.outputs.rc != '0'
        run: |
          echo "::error::D9 acceptance FAILED on ${{ inputs.env }} — see the step table in the summary"
          exit 1
