# ci-gate.yaml - the one required check: it fails when any other check run of the commit fails.
#
# GitHub requires checks by name, and a workflow with a path filter does not run on every pull
# request, so it cannot be required by name. The ruleset of main (.github/rulesets/main.json)
# requires this job instead. The rules are in scripts/ci-gate.py. The job holds one runner
# while it waits, at most 90 minutes. It runs again on every event that runs a check of the
# pull request again, so its verdict is never older than the checks it stands for.
name: ci-gate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
  merge_group:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: ci-gate-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Self-test of the gate (every rule can fail)
        run: python3 scripts/ci-gate.py --self-test
      - name: Every other check run of the commit finishes, and none fails
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: python3 scripts/ci-gate.py --sha "$HEAD_SHA"
