name: Build bp-guacamole

# bp-guacamole — the access plane (ADR-0033). ACC-102 removed the Guacamole
# web application and guacd from the chart (decision A3); `guacd` arrives
# again with the session image (ACC-106), so its upstream image stays
# mirrored. Per docs/PRINCIPLES.md #4a we never deploy `:latest` — every
# image must be SHA-pinned and traceable to a known-good upstream digest.
#
# This workflow:
#   1. Pulls the configured upstream `guacamole/guacd:<UPSTREAM_VER>` from
#      Docker Hub.
#   2. Resolves it to its repo digest (sha256:...) so we control the
#      supply-chain reference even if the upstream tag is ever moved.
#   3. Re-tags + pushes it into GHCR as
#      `ghcr.io/openova-io/openova/guacd:<UPSTREAM_VER>` so each Sovereign
#      pulls from a registry we own (no Docker Hub rate limits, no upstream
#      availability risk).
#   4. Bumps Chart.yaml `version` patch level and dispatches
#      blueprint-release.yaml so a fresh bp-guacamole:<semver> OCI
#      artifact lands. It writes no value of values.yaml: since ACC-102 the
#      chart names no image.

on:
  push:
    paths:
      - 'platform/guacamole/chart/**'
      - 'platform/guacamole/blueprint.yaml'
      - '.github/workflows/build-bp-guacamole.yaml'
    branches: [main]
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Apache Guacamole upstream version (e.g. 1.5.5).'
        required: false
        default: '1.5.5'

env:
  REGISTRY: ghcr.io
  GUACD_IMAGE: ghcr.io/openova-io/openova/guacd
  CHART_YAML: platform/guacamole/chart/Chart.yaml
  # Apache Guacamole 1.5.5 is the appVersion declared in the chart
  # Chart.yaml. Bump in both places when the upstream is rolled.
  DEFAULT_UPSTREAM_VERSION: '1.5.5'

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
    outputs:
      upstream_version: ${{ steps.vars.outputs.upstream_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream version
        id: vars
        run: |
          set -euo pipefail
          ver="${{ inputs.upstream_version }}"
          ver="${ver:-${DEFAULT_UPSTREAM_VERSION}}"
          echo "upstream_version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Mirroring Apache Guacamole ${ver} to GHCR"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mirror guacamole/guacd → ghcr.io/openova-io/openova/guacd
        env:
          UPSTREAM_VER: ${{ steps.vars.outputs.upstream_version }}
        run: |
          set -euo pipefail
          src="docker.io/guacamole/guacd:${UPSTREAM_VER}"
          dst="${GUACD_IMAGE}:${UPSTREAM_VER}"
          docker pull "${src}"
          # Capture the upstream repo digest so the GHCR tag points at
          # exactly the bytes we tested against, even if upstream re-cuts
          # the tag in future. Stored as an annotation on the GHCR push.
          UPSTREAM_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${src}")
          echo "Upstream digest: ${UPSTREAM_DIGEST}"
          docker tag "${src}" "${GUACD_IMAGE}:latest"
          docker push "${GUACD_IMAGE}:latest"
          # The version tag only through the shared check: a mirrored version
          # that exists is never moved (Refs #7938).
          digest="$(docker buildx imagetools inspect "${GUACD_IMAGE}:latest" --format '{{json .Manifest}}' | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')"
          bash scripts/ci/push-version-tag.sh "${dst}" "${GUACD_IMAGE}@${digest}"
          echo "GUACD_UPSTREAM_DIGEST=${UPSTREAM_DIGEST}" >> "$GITHUB_ENV"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Bump Chart.yaml patch version
        run: |
          set -euo pipefail
          current=$(yq eval '.version' "${CHART_YAML}")
          IFS='.' read -r major minor patch <<<"${current}"
          next="${major}.${minor}.$((patch + 1))"
          yq eval -i ".version = \"${next}\"" "${CHART_YAML}"
          echo "Chart.yaml version: ${current} -> ${next}"
          echo "CHART_NEW_VERSION=${next}" >> "$GITHUB_ENV"

      # TBD-V32 / openova-io/openova#2062 — race-safe push via the shared
      # composite action.
      - name: Commit and push chart bump
        id: deploy_commit
        uses: ./.github/actions/deploy-bump
        with:
          paths: |
            ${{ env.CHART_YAML }}
          commit-message: "deploy: bump bp-guacamole upstream ${{ steps.vars.outputs.upstream_version }} chart ${{ env.CHART_NEW_VERSION }}"
          release-writer-key: ${{ secrets.RELEASE_WRITER_KEY }}

      - name: Trigger blueprint-release for the chart bump
        if: steps.deploy_commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run blueprint-release.yaml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f blueprint=guacamole \
            -f tree=platform
          echo "blueprint-release dispatched for platform/guacamole @ main"
