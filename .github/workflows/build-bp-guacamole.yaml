name: Build bp-guacamole

# bp-guacamole — the access plane (ADR-0033). `guacd` runs in every session
# pod beside the session agent (ACC-106); the chart passes its image to the
# access controller as ACCESS_IMAGE_GUACD. Per docs/PRINCIPLES.md #4a we never
# deploy `:latest` — every image is pinned by digest and traceable to a
# known-good upstream digest.
#
# This workflow:
#   1. Pulls upstream `guacamole/guacd` 1.6.0 from Docker Hub by the digest
#      pinned below (the index digest of tag 1.6.0 that spike ACC-020 ran),
#      never by its tag, so a moved upstream tag changes nothing.
#   2. Pushes it into GHCR as `ghcr.io/openova-io/openova/guacd:1.6.0` so
#      each Sovereign pulls from a registry we own (no Docker Hub rate limits,
#      no upstream availability risk).
#   3. Writes the GHCR digest into access.session.images.guacd.digest of
#      values.yaml, bumps Chart.yaml `version` patch level and dispatches
#      blueprint-release.yaml so a fresh bp-guacamole:<semver> OCI artifact
#      lands.

on:
  push:
    paths:
      - 'platform/guacamole/chart/**'
      - 'platform/guacamole/blueprint.yaml'
      - '.github/workflows/build-bp-guacamole.yaml'
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GUACD_IMAGE: ghcr.io/openova-io/openova/guacd
  CHART_YAML: platform/guacamole/chart/Chart.yaml
  VALUES: platform/guacamole/chart/values.yaml
  # guacd 1.6.0 and its upstream index digest. Change both together.
  GUACD_VERSION: '1.6.0'
  GUACD_UPSTREAM_DIGEST: 'sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f'

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mirror guacamole/guacd → ghcr.io/openova-io/openova/guacd
        run: |
          set -euo pipefail
          src="docker.io/guacamole/guacd@${GUACD_UPSTREAM_DIGEST}"
          dst="${GUACD_IMAGE}:${GUACD_VERSION}"
          docker pull "${src}"
          docker tag "${src}" "${GUACD_IMAGE}:latest"
          docker push "${GUACD_IMAGE}:latest"
          # The version tag only through the shared check: a mirrored version
          # that exists is never moved (Refs #7938). The chart is pinned to
          # the digest that version tag names after the check.
          digest="$(docker buildx imagetools inspect "${GUACD_IMAGE}:latest" --format '{{.Manifest.Digest}}')"
          bash scripts/ci/push-version-tag.sh "${dst}" "${GUACD_IMAGE}@${digest}"
          pinned="$(docker buildx imagetools inspect "${dst}" --format '{{.Manifest.Digest}}')"
          case "${pinned}" in sha256:*) ;; *) echo "::error::${dst} names no digest: '${pinned}'"; exit 1 ;; esac
          echo "GUACD_DIGEST=${pinned}" >> "$GITHUB_ENV"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Write access.session.images.guacd.digest into values.yaml
        run: |
          set -euo pipefail
          yq -i '.access.session.images.guacd.digest = strenv(GUACD_DIGEST)' "${VALUES}"
          got="$(yq '.access.session.images.guacd.digest' "${VALUES}")"
          [ "${got}" = "${GUACD_DIGEST}" ] || { echo "::error::${VALUES} holds '${got}', not ${GUACD_DIGEST}"; exit 1; }

      - name: Bump Chart.yaml patch version
        run: |
          set -euo pipefail
          current=$(yq eval '.version' "${CHART_YAML}")
          IFS='.' read -r major minor patch <<<"${current}"
          next="${major}.${minor}.$((patch + 1))"
          yq eval -i ".version = \"${next}\"" "${CHART_YAML}"
          echo "Chart.yaml version: ${current} -> ${next}"
          echo "CHART_NEW_VERSION=${next}" >> "$GITHUB_ENV"

      # TBD-V32 / openova-io/openova#2062 — race-safe push via the shared
      # composite action.
      - name: Commit and push chart bump
        id: deploy_commit
        uses: ./.github/actions/deploy-bump
        with:
          paths: |
            ${{ env.CHART_YAML }}
            ${{ env.VALUES }}
          commit-message: "deploy: bump bp-guacamole guacd ${{ env.GUACD_VERSION }} chart ${{ env.CHART_NEW_VERSION }}"
          release-writer-key: ${{ secrets.RELEASE_WRITER_KEY }}

      - name: Trigger blueprint-release for the chart bump
        if: steps.deploy_commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run blueprint-release.yaml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f blueprint=guacamole \
            -f tree=platform
          echo "blueprint-release dispatched for platform/guacamole @ main"
