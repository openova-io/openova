# sso-probe.yaml — the static half of the per-app zero-click SSO guard (#3374).
#
# The live half — scripts/sso-zero-click-probe.mjs against a live
# Sovereign: fresh Chromium context -> console session -> every external
# bare URL must land signed in (authenticated-landing marker present, NO
# login-form marker) — runs in the live job of foundation-gate.yaml as
# gate check FND-G07, with a user that job creates for its run. A red row
# is the regression tripwire the #3374 law demands ("a walked-once SSO is
# worthless if the next chart roll silently kills it").
#
# This workflow keeps only the static tripwire: the dead-grant guard needs
# no live env, so it gates every PR touching the SSO chain.
name: sso-zero-click-probe

on:
  # #3374 Layer-C static tripwire — the dead-grant guard needs no live
  # env, so it gates EVERY PR touching the SSO chain (the per-app live
  # walk runs in the live job of foundation-gate.yaml, check FND-G07).
  pull_request:
    paths:
      - "platform/sso-bridge/chart/**"
      - "platform/keycloak/chart/templates/configmap-sovereign-realm.yaml"
      - "scripts/check-no-dead-grant-theater.sh"
      - ".github/workflows/sso-probe.yaml"

permissions:
  contents: read

jobs:
  # Static regression tripwire (#3374 Layer-C / #3685 / DoD box 7): the
  # dead admin-by-default grant theater must stay deleted. Runs on every
  # PR — no live Sovereign needed.
  dead-grant-guard:
    runs-on: ubuntu-24.04  # Playwright has no chromium build for ubuntu-26.04 (ubuntu-latest since 2026-11)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No dead admin-by-default grant theater
        run: bash scripts/check-no-dead-grant-theater.sh

