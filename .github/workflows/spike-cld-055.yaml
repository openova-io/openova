# CLD-055 spike: machine kind and reduced kit for the `local` provider pack.
# Throwaway: runs only on a push to the spike branch, which is never merged.
# Experiments L1-L7 on the hosted runner the repository uses; no cloud account.
name: spike-cld-055

on:
  push:
    branches: [spike/CLD-055]

permissions:
  contents: read
  packages: read   # the job token pulls the private bp-* charts and images

# One group per commit: a later push does not cancel an earlier run's jobs.
concurrency:
  group: spike-cld-055-${{ github.sha }}
  cancel-in-progress: false

# Jobs measured in an earlier run are switched off here, so as not to run
# them twice: L5 passed in run 43357201647; L2 runs in run 43357201647.

env:
  OUT: /tmp/cld055
  # docker.io through Google's public mirror, falling back to docker.io.
  MIRROR: |
    mirrors:
      docker.io:
        endpoint:
          - "https://mirror.gcr.io"

jobs:
  kind-a:
    name: L1 L7 L3 L4 (machine kind A, one region)
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - name: Runner facts and preparation
        run: bash tests/spikes/CLD-055/prepare-runner.sh
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.6
          tofu_wrapper: false
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4
      - name: Render check (the fixture is copied exactly)
        run: bash tests/spikes/CLD-055/render-check.sh
      - name: Build the machine image (kind A)
        run: docker build -f tests/spikes/CLD-055/machine/Containerfile -t cld055-machine:local tests/spikes/CLD-055/machine
      - name: Init the machine module
        run: tofu -chdir=tests/spikes/CLD-055/machines init -input=false -no-color
      - name: L1, L7, L3, L4
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: bash tests/spikes/CLD-055/run-kind-a.sh
      - name: Results
        if: always()
        run: grep '^CLD055-RESULT' "$OUT/results.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cld055-kind-a
          path: /tmp/cld055
          if-no-files-found: warn

  kind-b:
    name: L2 (machine kind B, KVM)
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Runner facts and preparation
        run: bash tests/spikes/CLD-055/prepare-runner.sh
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.6
          tofu_wrapper: false
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4
      - name: Init the VM module
        run: tofu -chdir=tests/spikes/CLD-055/vm init -input=false -no-color
      - name: L2
        run: bash tests/spikes/CLD-055/run-l2.sh
      - name: Results
        if: always()
        run: grep '^CLD055-RESULT' "$OUT/results.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cld055-kind-b
          path: /tmp/cld055
          if-no-files-found: warn

  l5:
    name: L5 (HelmRelease moved between Kustomizations)
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - uses: fluxcd/flux2/action@main
        with:
          version: 2.4.0
      - uses: helm/kind-action@v1
        with:
          cluster_name: cld055-l5
          version: v0.25.0
          node_image: kindest/node:v1.30.6
      - name: Install Flux v2.4.0
        run: flux install --version=v2.4.0 && flux check
      - name: L5
        run: bash tests/spikes/CLD-055/run-l5.sh
      - name: Results
        if: always()
        run: grep '^CLD055-RESULT' "$OUT/results.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cld055-l5
          path: /tmp/cld055
          if-no-files-found: warn

  l6:
    name: L6 (two clusters of kind A plus the console closure)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Runner facts and preparation
        run: bash tests/spikes/CLD-055/prepare-runner.sh
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.6
          tofu_wrapper: false
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4
      - name: Build the machine image (kind A)
        run: docker build -f tests/spikes/CLD-055/machine/Containerfile -t cld055-machine:local tests/spikes/CLD-055/machine
      - name: Init the machine module
        run: tofu -chdir=tests/spikes/CLD-055/machines init -input=false -no-color
      - name: L6
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: bash tests/spikes/CLD-055/run-l6.sh
      - name: Results
        if: always()
        run: grep '^CLD055-RESULT' "$OUT/results.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cld055-l6
          path: /tmp/cld055
          if-no-files-found: warn

  summary:
    name: Result table
    runs-on: ubuntu-latest
    needs: [kind-a, kind-b, l5, l6]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cld055-*
          path: results
      - name: All measured values
        run: |
          for f in results/*/results.txt; do
            echo "== $(basename "$(dirname "$f")")"
            grep '^CLD055-RESULT' "$f" || true
          done | tee -a "$GITHUB_STEP_SUMMARY"
