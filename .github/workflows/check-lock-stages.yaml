# check-lock-stages.yaml - guard G6: a stage of the intent lock never moves back.
#
# scripts/check-lock-stages.py renders the bindings of the intent lock with the
# chart's defaults and the bootstrap kit's intentLock values, and compares each
# stage's action with its line in scripts/baselines/lock-stages.json. A stage
# without a line, a line without a stage, or a stage whose action differs from
# its line fails.
#
# The workflow runs on every pull request and on every merge group. It has no
# path filter on purpose: a required check that a path filter skips never
# reports. The self-test runs first. It shows that every rule can fail.
name: check-lock-stages

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lock-stages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Self-test of the guard
        run: python3 scripts/check-lock-stages.py --self-test
      - name: No stage of the intent lock moves back
        run: python3 scripts/check-lock-stages.py
