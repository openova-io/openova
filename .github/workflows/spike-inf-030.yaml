# INF-030 spike: kured beside the system-upgrade-controller on k3s.
# Runs only on the throwaway branch spike/INF-030, which is never merged.
# Each job starts three Ubuntu 22.04 VMs (KVM) on its own runner and makes them
# k3s servers with embedded etcd, so that kured performs real reboots.
name: spike-inf-030

on:
  push:
    branches: [spike/INF-030]

permissions:
  contents: read

concurrency:
  group: spike-inf-030
  cancel-in-progress: true

jobs:
  reboots:
    name: "Q1 Q2 Q6: serial reboots, lock, server-node reboot"
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          OUT: ${{ github.workspace }}/out
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/spikes/INF-030/job-reboots.sh
      - name: Timeline and events
        if: always()
        run: |
          echo "--- events.log"; cat out/events.log 2>/dev/null || true
          echo "--- steps.log";  cat out/steps.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inf-030-reboots
          path: out/
          retention-days: 30

  window:
    name: "Q3 Q5: upgrade Pod labels, closed Plan window"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          OUT: ${{ github.workspace }}/out
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/spikes/INF-030/job-window.sh
      - name: Logs
        if: always()
        run: |
          echo "--- steps.log"; cat out/steps.log 2>/dev/null || true
          echo "--- jobwatch k3s-server"; cat out/jobwatch-k3s-server.log 2>/dev/null || true
          echo "--- jobwatch window-tail"; cat out/jobwatch-window-tail.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inf-030-window
          path: out/
          retention-days: 30

  overlap:
    name: "Extra: disjoint windows and a rollout that outlives its window"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          OUT: ${{ github.workspace }}/out
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/spikes/INF-030/job-overlap.sh
      - name: Timeline and events
        if: always()
        run: |
          echo "--- events.log"; cat out/events.log 2>/dev/null || true
          echo "--- steps.log";  cat out/steps.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inf-030-overlap
          path: out/
          retention-days: 30

  blocking:
    name: "Q4: kured waits on the node of the upgrade Pod"
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - name: Run
        env:
          OUT: ${{ github.workspace }}/out
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tests/spikes/INF-030/job-blocking.sh
      - name: Timeline and events
        if: always()
        run: |
          echo "--- events.log"; cat out/events.log 2>/dev/null || true
          echo "--- steps.log";  cat out/steps.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inf-030-blocking
          path: out/
          retention-days: 30
