name: Build & Deploy Catalyst Backend Services

on:
  push:
    paths: ['core/services/**']
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/openova-io/openova/services

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # `metering-sidecar` (#798) builds on the same Containerfile
        # convention as the Organization services but its image is consumed by
        # the bp-newapi chart (chart/values.yaml `meteringSidecar.image`),
        # NOT by products/catalyst/chart/templates/org-services. The
        # deploy job below skips it for that reason.
        service: [auth, catalog, gateway, tenant, domain, billing, provisioning, notification, metering-sidecar]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(echo $GITHUB_SHA | head -c 7)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: core/services
          file: core/services/${{ matrix.service }}/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # contents: write — push the SHA + Chart.yaml patch bump back to main.
      contents: write
      # actions: write — required for `gh workflow run` to dispatch
      # blueprint-release.yaml after the deploy commit lands. Without
      # this, the dispatch step returns HTTP 403 "Resource not
      # accessible by integration" and blueprint-release never fires
      # for deploy commits (issues #872, #712 — same root cause as the
      # catalyst-build dispatch fix in PR #720).
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────
      # Helper: bump the Chart.yaml patch version atomically with the
      # SHA-tag rewrite so blueprint-release publishes a single coherent
      # chart that bundles the freshly committed image refs.
      #
      # Why this exists (issue #872): without the bump, the merge commit
      # for a chart-version-bumping PR triggers blueprint-release IN
      # PARALLEL with services-build. blueprint-release packages the
      # working tree at the merge SHA — which still has the OLD image
      # SHA in templates/org-services/*.yaml because services-build has
      # not yet committed its deploy update. The chart at that version
      # ships with stale images, and a manual no-op chart bump PR is
      # the only way to republish (PR #865 chasing PR #864 was the live
      # incident).
      #
      # By having the deploy step bump the patch version itself, the
      # dispatched blueprint-release publishes a NEW chart version that
      # — by construction — was packaged AFTER the SHA rewrite. No race.
      # The manual chart-version field in the PR becomes the floor; the
      # CI auto-bumps from there.
      # ──────────────────────────────────────────────────────────────
      - name: Update deployment manifests
        id: rewrite
        run: |
          SHA=$(echo $GITHUB_SHA | head -c 7)
          DEPLOY_DIR="products/catalyst/chart/templates/org-services"
          VALUES_YAML="products/catalyst/chart/values.yaml"

          # ──────────────────────────────────────────────────────────
          # Issue #953 + #4885: ALL 8 org-services templates (auth
          # included, as of #4885) render their image as
          # `{{ .Values.images.orgTag }}` — the chart's values.yaml
          # `images.orgTag` field is the SINGLE source of truth for
          # those Pods. auth.yaml WAS the last hardcoded holdout (held
          # at the older `image: ghcr.io/...:<sha>` shape because of a
          # historical InvalidImageName quirk); #4885 flipped it to the
          # templated form so the cutover step-07 pivot honours
          # global.imageRegistry, exactly the auth-template flip this
          # workflow always anticipated (see the "Hardcoded form" note
          # below). The literal-sed loop that follows is now a full
          # no-op — retained defensively so a revert stays covered.
          #
          # Pre-#953 this loop only ran a sed against the hardcoded
          # form. The 7 templated services silently no-op'd and the
          # deploy commit reported "update org service images to
          # ${SHA}" while only auth.yaml actually rolled. Result:
          # every fix to catalog/tenant/etc. shipped the merge but
          # the live Pod kept running pre-fix bytes (caught live on
          # otech113 — services-catalog Pod still on 95a06f5 after
          # PR #951's commit `68927688` claimed it deployed).
          #
          # Fix: bump `images.orgTag` in values.yaml. The values.yaml
          # bump now rolls ALL 8 templated services (auth included,
          # post-#4885) on the next chart release. This stays
          # event-driven (the push to main triggers this workflow);
          # cron is intentionally absent per CLAUDE.md (every workflow
          # MUST be event-driven, never scheduled).
          # ──────────────────────────────────────────────────────────

          # Back-compat literal-sed loop — every org-service template
          # is now templated (auth flipped in #4885), so this sed
          # matches nothing and is a documented no-op. Preserved so a
          # revert of any template back to a hardcoded `image:` line
          # stays covered without another workflow edit.
          for svc in auth catalog gateway tenant domain billing provisioning notification; do
            FILE="${DEPLOY_DIR}/${svc}.yaml"
            if [ -f "$FILE" ]; then
              sed -i "s|image: ${IMAGE_BASE}-${svc}:.*|image: ${IMAGE_BASE}-${svc}:${SHA}|" "$FILE"
              echo "Updated ${svc} hardcoded image refs (no-op for templated forms) to SHA ${SHA}"
            fi
          done

          # Templated form — bump `images.orgTag` in values.yaml so
          # the 7 templated services (catalog, gateway, tenant,
          # domain, billing, provisioning, notification) all roll on
          # the next chart release. Match the canonical 2-space
          # indented form `  orgTag: "<sha>"` (with quotes) emitted
          # by the chart's existing values.yaml shape; refuse to
          # auto-bump if the line is missing or shaped differently
          # so a contributor renaming the field does not silently
          # break this workflow's promise.
          if ! grep -Eq '^  orgTag: "[A-Za-z0-9_.-]*"$' "${VALUES_YAML}"; then
            echo "::error title=orgTag field missing or unparseable::Expected '  orgTag: \"<sha>\"' line in ${VALUES_YAML}; refusing to auto-bump."
            exit 1
          fi
          sed -i "s|^  orgTag: \"[A-Za-z0-9_.-]*\"$|  orgTag: \"${SHA}\"|" "${VALUES_YAML}"
          echo "Bumped ${VALUES_YAML} images.orgTag to ${SHA}"

          # #5743: Chart.yaml `version:`/`appVersion:` used to be patch-
          # bumped right here (and again inside this step's own retry
          # closure below) with hand-rolled arithmetic that read ONLY
          # `version:`, never `appVersion:`, into lockstep. catalyst-
          # build.yaml bumped the SAME file with a SEPARATE hand-rolled
          # implementation that routed through the generic `deploy-bump`
          # composite action's last-writer-wins `-X theirs` cherry-pick —
          # correct for an image tag, wrong for a monotonic counter. The
          # two independent implementations racing each other on one field
          # produced the incident: commit b76f3ca7b (catalyst-build.yaml's
          # bump) landed version=1.4.1324 as a direct child of a23de78d9
          # (THIS workflow's bump, version=1.4.1325) — a lower, later-
          # published version number that carried FEWER fixes than the
          # higher, earlier-published one it clobbered.
          #
          # The bump now happens in its own dedicated step below
          # ("Atomically bump Chart.yaml version"), via the SAME two
          # shared scripts catalyst-build.yaml now calls
          # (scripts/bump-chart-version.sh + scripts/push-chart-version-
          # bump.sh) — one implementation, one guard
          # (scripts/check-chart-version-forward.sh), so the two
          # deploy-bots can never diverge on "what is the next version"
          # again.

      - name: Commit and push manifest updates
        id: deploy_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHA=$(echo $GITHUB_SHA | head -c 7)
          DEPLOY_DIR="products/catalyst/chart/templates/org-services"
          VALUES_YAML="products/catalyst/chart/values.yaml"

          # Idempotent reset-and-rewrite. Parallel/back-to-back CI runs
          # both try to update the same `image:` lines — `git pull
          # --rebase` would hit content conflicts. Idempotent reset-to-
          # origin + re-apply is conflict-free by construction.
          #
          # Issue #953: rewrite() must mirror the values.yaml orgTag
          # bump that the rewrite step does — otherwise a retry that
          # reset-to-origin/main would leave values.yaml (the sole
          # source of truth for all 8 templated org-services post-#4885)
          # on the OLD SHA, recreating the original stale-image bug under
          # any push-conflict scenario. The literal-image loop below is a
          # no-op (every template is now templated) but is kept in
          # lockstep with the rewrite step for defensive symmetry.
          rewrite() {
            for svc in auth catalog gateway tenant domain billing provisioning notification; do
              FILE="${DEPLOY_DIR}/${svc}.yaml"
              if [ -f "$FILE" ]; then
                sed -i "s|image: ${IMAGE_BASE}-${svc}:.*|image: ${IMAGE_BASE}-${svc}:${SHA}|" "$FILE"
              fi
            done
            if ! grep -Eq '^  orgTag: "[A-Za-z0-9_.-]*"$' "${VALUES_YAML}"; then
              echo "::error title=orgTag field missing on retry::Expected '  orgTag: \"<sha>\"' line in ${VALUES_YAML}."
              exit 1
            fi
            sed -i "s|^  orgTag: \"[A-Za-z0-9_.-]*\"$|  orgTag: \"${SHA}\"|" "${VALUES_YAML}"
          }

          git add products/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "deploy: update org service images to ${SHA}"

          # TBD-V32 / openova-io/openova#2062 — race-safe push loop.
          # NOTE: this workflow deliberately does NOT use the shared
          # `./.github/actions/deploy-bump` composite action — its
          # `-X theirs` cherry-pick conflict policy is a deliberate
          # last-writer-wins choice, correct for image tags but WRONG for
          # the chart version counter this job used to also carry (#5743);
          # now that Chart.yaml moved to its own step, plain reset-and-
          # reapply is sufficient here again. Bumping the max-attempts
          # ceiling from 3 to 5 matches the composite action default.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt $i failed — resetting to origin/main and re-applying rewrite"
            git fetch origin main
            git reset --hard origin/main
            rewrite
            git add products/
            if git diff --staged --quiet; then
              echo "no changes after re-fetch — another run already shipped this SHA"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "deploy: update org service images to ${SHA}"
            sleep $((i * 2))
          done
          echo "push failed after 5 attempts"
          exit 1

      # ──────────────────────────────────────────────────────────────
      # ATOMIC CHART VERSION BUMP (Refs #5743)
      # ──────────────────────────────────────────────────────────────
      # See the matching step in catalyst-build.yaml for the full
      # rationale. Runs regardless of whether the image-tag commit above
      # actually pushed anything (mirrors this workflow's previous
      # unconditional per-run bump behaviour) — deriving from fresh
      # origin/main on every attempt via scripts/bump-chart-version.sh
      # means a no-op image-tag run still safely advances the chart
      # version by exactly one step, in lockstep, never regressing either
      # field.
      - name: "Atomically bump products/catalyst/chart/Chart.yaml version"
        id: bump_chart_version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEXT="$(scripts/push-chart-version-bump.sh \
            products/catalyst/chart/Chart.yaml \
            "deploy(bp-catalyst-platform): bump chart version")"
          if [ -n "${NEXT}" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "next_version=${NEXT}" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN-authored pushes do NOT re-trigger workflows by
      # design, so a `push` path-trigger on blueprint-release.yaml is
      # not enough on its own — we must explicitly dispatch. Same
      # mechanism catalyst-build.yaml uses (PR #720) to publish the
      # bp-catalyst-platform OCI artifact for the bumped chart.
      #
      # #5743: gated on the CHART VERSION bump's own push outcome, not the
      # image-tag commit's — publishing only makes sense once Chart.yaml's
      # version actually moved.
      - name: Trigger blueprint-release for the chart bump
        if: steps.bump_chart_version.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run blueprint-release.yaml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f blueprint=catalyst \
            -f tree=products
          echo "blueprint-release dispatched for products/catalyst @ main (chart ${{ steps.bump_chart_version.outputs.next_version }})"
