name: check — gateway ELB members of both regions carry the same weight the provider can apply

# Permanent guard on the weights of the reference cloud's gateway and console
# balancer members (scripts/check-gateway-lb-active-standby.sh, the file name
# of #6837's guard, kept).
#
# The ruling (CLD-G12): the cloud's balancer admits BOTH regions' entry points;
# which region serves is decided inside the platform (Gateway API routes, the
# secondary edge of kit slot 13e, ADR-0015 placement), not at the balancer.
# Every member of every region therefore carries the same positive weight.
#
# #6837 set the secondary region's members to weight 0. That never took
# effect: the huaweicloud provider drops a 0 weight (utils.ValueIgnoreEmpty on
# create and update), the cloud applies 1, and every second plan of a fresh
# two-region install showed 24 in-place changes (gate run 44903143049). This
# gate fails on a member without the weight expression, a weight written as 0,
# a secondary default that differs from the primary weight, or a validation
# that admits 0. The hostnames that make both entry points safe (every host the
# primary's edge routes is routed by the secondary's edge too) are held by
# tools/guards/cmd/edge-hosts in tree-guards.yaml.
#
# Per docs/PRINCIPLES.md #4a this workflow reads source only — it does not
# deploy, call cloud APIs, or touch a live cluster.
#
# Refs #6837 #6827 #5244

on:
  push:
    branches: [main]
    paths:
      - 'infra/providers/huawei/**'
      - 'scripts/check-gateway-lb-active-standby.sh'
      - '.github/workflows/check-gateway-lb-active-standby.yaml'
  pull_request:
    paths:
      - 'infra/providers/huawei/**'
      - 'scripts/check-gateway-lb-active-standby.sh'
      - '.github/workflows/check-gateway-lb-active-standby.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-lb-active-standby:
    name: Gateway + console ELB members of both regions carry the same positive weight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run the member-weight gate
        run: bash scripts/check-gateway-lb-active-standby.sh

      - name: Self-test — the gate passes the tree and rejects a 0 default, unequal weights, a 0 weight, a 0-admitting validation and a member without a weight
        run: bash scripts/check-gateway-lb-active-standby.sh --self-test
