name: Build & Deploy Marketplace API

on:
  push:
    paths: ['core/marketplace-api/**']
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/openova-io/openova/marketplace-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The step that signs the image needs a GitHub OIDC token (FND-062).
      id-token: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(echo $GITHUB_SHA | head -c 7)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: core/marketplace-api
          file: core/marketplace-api/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE }}:latest

      # Sign the image and attest its bill of materials through the shared
      # action, before its tag is pinned (FND-062).
      - name: Sign and attest the image
        uses: ./.github/actions/sign-and-attest
        with:
          ref: ${{ env.IMAGE }}
          digest: ${{ steps.push.outputs.digest }}

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump images.marketplaceApi.tag in values.yaml
        # #5451: third instance of the same break. 83ec889f0 (PR #580)
        # templated templates/marketplace-api/deployment.yaml's `image:` line
        # through global.imageRegistry and moved the SHA into values.yaml
        # `images.marketplaceApi.tag`. This step kept sed-ing the template, so
        # it matched nothing and exited 0 — the pin froze at 3c2f7e4
        # (2026-04-28) while GHCR received marketplace-api:0d9531a on
        # 2026-07-09, including #4924's durable sovereign-smtp-credentials
        # seed, which therefore never shipped.
        env:
          SHA_SHORT: ${{ needs.build.outputs.sha_short }}
        run: |
          bash scripts/bump-values-image-tag.sh \
            products/catalyst/chart/values.yaml marketplaceApi "${SHA_SHORT}"

      # TBD-V32 / openova-io/openova#2062 — race-safe push via the shared
      # composite action so concurrent build workflows do not lose the
      # auto-bump commit to `[rejected] main -> main (fetch first)`.
      - name: Commit and push manifest updates
        uses: ./.github/actions/deploy-bump
        with:
          paths: products/catalyst/chart/values.yaml
          commit-message: "deploy: update Catalyst marketplace-api image to ${{ needs.build.outputs.sha_short }}"
          release-writer-key: ${{ secrets.RELEASE_WRITER_KEY }}
