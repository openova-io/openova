# check-pins.yaml - action references and base images may only become more pinned.
#
# scripts/check-pins.py counts the `uses:` lines of workflows and composite actions that are not
# pinned by a 40-character commit hash, and the FROM lines of container files that are not pinned
# by an @sha256: digest. Neither count may rise above docs/ledger/pin-baseline.json, a file that
# is new in a change holds no unpinned reference, and the baseline itself may only fall.
# The self-test runs first. It shows, on trees it builds itself, that every rule can fail.
# The checkout reads two commits, so that the first parent of the tested commit is the base.
# No path filter, on purpose: a required check that a path filter skips never reports.
#
# The second job runs scripts/check-builds-sign.py (FND-062): every step that pushes an image or
# a chart is followed by the shared action .github/actions/sign-and-attest, and no workflow runs
# cosign sign or cosign attest itself. The allowed number of failures is 0.
#
# The third job runs scripts/check-chart-image-tags.py (Refs #7768): no chart values file names an
# image by a signature (sha256-<digest>.sig) or an attestation (.att) instead of its tag, except
# the lines in scripts/chart-image-tags-baseline.tsv, a list that only falls. It also runs the
# self-test of scripts/latest-image-tag.py, the helper that the release jobs use to find the
# newest image tag of a package.
name: check-pins

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  check-pins:
    name: check-pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - name: Self-test of the guard (every rule can fail)
        run: python3 scripts/check-pins.py --self-test
      - name: No more unpinned references than the baseline, none in a new file, no higher baseline
        run: python3 scripts/check-pins.py --base HEAD^1

  check-builds-sign:
    name: check-builds-sign
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Self-test of the guard (every rule can fail)
        run: python3 scripts/check-builds-sign.py --self-test
      - name: Every image and chart push is signed through the shared action
        run: python3 scripts/check-builds-sign.py

  check-chart-image-tags:
    name: check-chart-image-tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - name: Self-test of the newest-image-tag helper
        run: python3 scripts/latest-image-tag.py --self-test
      - name: Self-test of the guard (every rule can fail)
        run: python3 scripts/check-chart-image-tags.py --self-test
      - name: No image tag names a signature or an attestation, the list does not grow
        run: python3 scripts/check-chart-image-tags.py --base HEAD^1
