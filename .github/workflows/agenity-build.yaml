name: Build bp-agenity

# Builds the bp-agenity Application image: the upstream Agenity (chepherd)
# daemon — built from the PUBLIC agenity-org/agenity source — with OpenOva's
# openova-mcp binary baked in (#4010 / #4097). The build context is the repo
# root because the openova-mcp module imports core/services/shared/auth from
# this repo; the agenity daemon source is git-cloned inside the Containerfile.

on:
  push:
    paths:
      - 'products/agenity/**'
      - 'products/openova-mcp/**'
      - 'core/services/shared/auth/**'
    branches: [main]
  workflow_dispatch:
    inputs:
      agenity_ref:
        description: 'agenity-org/agenity source ref to build (tag, branch, or full commit SHA). Defaults to the env pin.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/openova-io/bp-agenity
  # Pin the PUBLIC agenity (chepherd daemon) SOURCE ref the Containerfile
  # builds from. Never floating main: pinned to the #745 merge COMMIT SHA —
  # the NEW agenity dashboard (main HEAD as of 2026-06-22). v0.9.4 (prior
  # pin) predated #745 and served the OLD dashboard. No tag exists for the
  # merge yet; the Containerfile's fetch stage accepts a full SHA. Carries
  # the bp-agenity MCP seam (chepherd #747 / #4010: CHEPHERD_EXTRA_MCP_JSON
  # + CHEPHERD_DEFAULT_MODEL). The old private base image
  # (ghcr.io/agenity-org/chepherd) is GONE — built from source, no private
  # cross-org dep (#4097). Overridable via the workflow_dispatch input.
  AGENITY_REF: bcd38b15816694e82bddbbc9d6385ff3de00e3cf

permissions:
  contents: read
  packages: write

jobs:
  build-bp-agenity:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA + chart appVersion
        id: vars
        run: |
          echo "sha_short=$(echo $GITHUB_SHA | head -c 7)" >> "$GITHUB_OUTPUT"
          # The chart's image helper resolves to repository:<Chart.AppVersion>
          # (agenity.image in _helpers.tpl), so the published image MUST carry
          # that exact tag or the StatefulSet ImagePullBackOffs. Derive it from
          # the chart so the tag can never drift from what the chart references.
          APPVER=$(grep -E '^appVersion:' products/agenity/chart/Chart.yaml | head -1 | sed -E 's/appVersion:[[:space:]]*"?([^"]+)"?/\1/')
          echo "app_version=${APPVER}" >> "$GITHUB_OUTPUT"
          # Effective source ref: the workflow_dispatch input wins when set,
          # else the env pin. Lets a one-off rebuild target a different ref
          # without editing the workflow, while keeping the pinned default.
          REF="${{ inputs.agenity_ref }}"
          REF="${REF:-${AGENITY_REF}}"
          echo "agenity_ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build the image to the LOCAL daemon first (load, no push) ──────────
      # #4118: a Docker-layer-cache MISS can silently ship a stale layer (an
      # agent-less image once shipped under f33be11; an archaic /app dashboard
      # bundle is the same class). The defence is two-fold:
      #   1. `no-cache: true` — the web-UI + agent-runtime layers are rebuilt
      #      from the pinned #745 source on EVERY run, so a poisoned cache
      #      entry can never be served. The agenity build is short (web + two
      #      Go binaries); a clean rebuild is cheap insurance against shipping
      #      the wrong dashboard to a live Sovereign.
      #   2. A post-build SMOKE GATE (next step) inspects the BUILT image
      #      before it is pushed and FAILS the workflow if the agent runtime
      #      or the new-dashboard marker is absent. Build with `load: true`
      #      (not `push`) so the smoke gate runs against the exact bytes that
      #      would be pushed; the push happens only after the gate is green.
      - name: Build image (load, no-cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: products/agenity/Containerfile
          build-args: |
            AGENITY_REF=${{ steps.vars.outputs.agenity_ref }}
            VERSION=${{ steps.vars.outputs.app_version }}
            COMMIT=${{ steps.vars.outputs.sha_short }}
          load: true
          push: false
          no-cache: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.app_version }}
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE }}:latest

      # ── #4118 post-build smoke gate — fail before push if stale/incomplete ─
      # Asserts, against the freshly-BUILT image bytes (not a re-pull):
      #   (a) the agent runtime is present (node + /usr/bin/claude) — the
      #       original #4118 cache-miss shipped an agent-less image GREEN;
      #   (b) the dashboard bundle is the NEW build — the /app/ SPA entry must
      #       reference a hashed Dashboard.*.js AND the dist must carry the
      #       #745-era preview routes (v0.9.4 + v09-stage4-preview), which the
      #       OLD (pre-#745) dashboard did NOT have. A cache-served archaic
      #       /app bundle fails here instead of reaching a live Sovereign.
      - name: Smoke-gate the built image (#4118)
        run: |
          set -euo pipefail
          IMG="${{ env.IMAGE }}:${{ steps.vars.outputs.app_version }}"
          # NOTE: the image ENTRYPOINT is the `chepherd` daemon, so a bare
          # `docker run "$IMG" sh -c …` passes `sh -c …` as ARGS to chepherd
          # ("unknown shorthand flag: 'c'") and the gate crashes on its own
          # invocation before testing anything. Every probe MUST override the
          # entrypoint with `--entrypoint`.
          echo "::group::agent runtime (node + claude-code)"
          docker run --rm --entrypoint sh "$IMG" -c 'node --version && /usr/bin/claude --version'
          echo "::endgroup::"
          echo "::group::dashboard bundle is the NEW (#745) build"
          # The /app/ SPA must mount a content-hashed Dashboard component (a
          # stale/empty web layer would have no such reference) …
          docker run --rm --entrypoint grep "$IMG" \
            -qE '_astro/Dashboard[a-z]*\.[A-Za-z0-9_-]+\.js' /app/web/dist/app/index.html \
            || { echo "FAIL: /app/index.html does not reference a hashed Dashboard bundle — stale/empty web layer"; exit 1; }
          # … and the dist MUST carry the #745-era routes the OLD (pre-#745,
          # archaic) dashboard did NOT have. This is the decisive archaic-vs-new
          # discriminator: a cache-served old web layer fails HERE, before push.
          docker run --rm --entrypoint sh "$IMG" \
            -c 'test -d /app/web/dist/v09-stage4-preview && test -d /app/web/dist/v0.9.4' \
            || { echo "FAIL: built /app dist is missing the #745 dashboard routes (v0.9.4 / v09-stage4-preview) — a cache-served ARCHAIC dashboard layer shipped"; exit 1; }
          echo "::endgroup::"
          echo "smoke gate PASSED — agent runtime present, NEW dashboard bundle confirmed"

      - name: Push image (only after smoke gate is green)
        run: |
          set -euo pipefail
          for TAG in \
            "${{ env.IMAGE }}:${{ steps.vars.outputs.app_version }}" \
            "${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}" \
            "${{ env.IMAGE }}:latest"; do
            echo "pushing $TAG"
            docker push "$TAG"
          done
