# sso-uat-flip.yaml — mechanical UAT-row invalidation (#3374 DoD-8).
#
# THE LAW (#3374 §2.3): a walked-once SSO row is worthless if the next
# roll silently kills it — every merge to main touching the SSO chain
# flips the UAT.md zero-click rows back to UNVERIFIED until re-walked.
# This is the TRUST.md law applied mechanically to the SSO surface.
#
# Path list = the SSO chain: the per-app charts carrying SSO/httproute
# config, the IdP, the bridge, the gate, catalyst-api (handover/session/
# oidc-provider/shim) and the console auth surface.
name: sso-uat-flip

on:
  push:
    branches: [main]
    paths:
      - "platform/openbao/**"
      - "platform/keycloak/**"
      - "platform/gitea/**"
      - "platform/grafana/**"
      - "platform/harbor/**"
      - "platform/powerdns-admin/**"
      - "platform/guacamole/**"
      - "platform/newapi/**"
      - "platform/cilium/**"
      - "platform/sso-bridge/**"
      - "platform/oidc-gate/**"
      - "platform/openova-flow-server/**"
      # #5597 — SCOPED to the catalyst-api SSO/auth-landing surface only, NOT
      # the whole `bootstrap/api/**`. The broad glob fired the SSO-row flip on
      # ANY api change: commit 71c54d8d (the #5535 cutover secondary-kubeconfigs
      # fix, touching cutover_secondary_kubeconfigs.go + jobs.go — zero SSO/auth
      # code) erased six freshly-walked ✅ rows (28/40/41/42/43/45) and pushed
      # the headline 34→28. Only the auth/handover-token/session/PIN/oidc files
      # below can change a zero-click SSO LANDING; the cutover/jobs/deployment
      # and post_handover-* spine plumbing cannot, and must not trip this flip.
      - "products/catalyst/bootstrap/api/internal/auth/**"
      - "products/catalyst/bootstrap/api/internal/handler/auth*.go"
      - "products/catalyst/bootstrap/api/internal/handler/handover.go"
      - "products/catalyst/bootstrap/api/internal/handler/handover_jwt.go"
      - "products/catalyst/bootstrap/api/internal/handler/org_handover.go"
      - "products/catalyst/bootstrap/api/internal/handler/pinstore.go"
      - "products/catalyst/bootstrap/api/internal/handler/openbao_sso_init.go"
      - "products/catalyst/bootstrap/api/cmd/api/oidc_session_validator.go"
      - "core/console/**"
      # SSO-component bootstrap-kit slots ONLY — never the whole kit. The former
      # broad patterns (products/catalyst/chart/** + bootstrap-kit/**) are
      # 4-surface-lockstep shared surfaces: EVERY blueprint version bump touches
      # them, so every merge re-flipped freshly-walked SSO rows (#5106 — a
      # cutover-chart merge wiped 14 wave-2 stamps). Any REAL SSO chart change
      # always also touches its platform/<component>/** (Chart.yaml/blueprint.yaml
      # live there per the lockstep), which the patterns above already catch.
      - "clusters/_template/bootstrap-kit/01-cilium.yaml"
      - "clusters/_template/bootstrap-kit/08-openbao.yaml"
      - "clusters/_template/bootstrap-kit/09-keycloak.yaml"
      - "clusters/_template/bootstrap-kit/10-gitea.yaml"
      - "clusters/_template/bootstrap-kit/11-powerdns.yaml"
      - "clusters/_template/bootstrap-kit/11a-bp-powerdns-admin.yaml"
      - "clusters/_template/bootstrap-kit/13b-bp-sso-bridge.yaml"
      - "clusters/_template/bootstrap-kit/13c-bp-oidc-gate.yaml"
      - "clusters/_template/bootstrap-kit/19-harbor.yaml"
      - "clusters/_template/bootstrap-kit/25-grafana.yaml"
      - "clusters/_template/bootstrap-kit/52-bp-guacamole.yaml"
      - "clusters/_template/bootstrap-kit/56-bp-openova-flow-server.yaml"
      - "clusters/_template/bootstrap-kit/80-newapi.yaml"

      # ── EXCLUSIONS (#5648) — must follow the positive patterns ──────────
      # Same class as the #5106 narrowing above, twice more on 2026-08-04.
      # Both receipts, because the pattern is what matters:
      #
      #   a031424a flipped 5 rows by matching `platform/cilium/**` on
      #   `platform/cilium/README.md`. That whole commit was a CI workflow,
      #   docs/SECURITY.md, a README and two shell scripts — no SSO code, no
      #   chart code, nothing that reaches a running Sovereign.
      #
      #   bee6695e flipped 12 rows by matching
      #   `products/catalyst/bootstrap/api/**` on
      #   `products/catalyst/bootstrap/api/internal/catalog/blueprints.json`.
      #   That file is a CATALOG LOCKSTEP SITE: every `bp-*` chart version bump
      #   in the repo edits it, exactly like the chart/** and bootstrap-kit/**
      #   surfaces #5106 already removed for this reason. bee6695e was the
      #   cutover Flux-source lint (#5652) — it cannot affect an SSO landing.
      #
      # Cost so far: 31 live-walked rows erased in one day; 12 had to be
      # physically re-walked and 7 could not be, because they sit behind a PIN.
      # A row erased by a merge that cannot affect it is not conservatism — it
      # is evidence destruction, and it reads downstream as "the number never
      # moves".
      #
      # The law in the header is unchanged: a real SSO-chain change still
      # flips. Every genuine SSO change touches Go/templates/values under the
      # component paths above, none of which are excluded here.
      - "!**/*.md"
      - "!products/catalyst/bootstrap/api/internal/catalog/**"

permissions:
  contents: write

jobs:
  flip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Flip SSO UAT rows to UNVERIFIED
        run: python3 scripts/uat-sso-flip.py --ref "${GITHUB_SHA::8}"

      - name: Commit flip (if any)
        run: |
          set -euo pipefail
          if git diff --quiet docs/ledger/UAT.md; then
            echo "no rows flipped — nothing to commit"
            exit 0
          fi
          git -c user.name=openova-uat-bot -c user.email=bot@openova.io \
            commit -m "docs(uat): flip SSO rows UNVERIFIED after SSO-chain merge ${GITHUB_SHA::8} (mechanical, Refs #3374)" \
            docs/ledger/UAT.md
          git push origin main
