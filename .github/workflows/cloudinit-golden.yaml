name: cloudinit-golden

# The golden render of the shared cloud-init template (CLD-040).
#
# The render test in infra/providers/_shared/tests renders
# infra/providers/_shared/cloudinit-control-plane.tftpl with two fixtures
# (hetzner and huawei). Its run "golden" compares the SHA-256 of each render,
# comment lines stripped as the provider modules strip them, with the value
# stored in infra/providers/_shared/tests/golden.auto.tfvars.json. So a pull
# request that changes what a node boots with turns the check `golden` red
# until the stored values are updated in the same pull request:
#
#   scripts/update-cloudinit-golden.sh
#
# and the commit message says why the render changed. A pull request that
# only moves or renames things must leave the golden file untouched.
#
# The check name `golden` is the name of the one job below. Other work
# packages cite it; do not rename it.
#
# Event-driven only: pull-request-on-touch and push-on-merge, with
# workflow_dispatch for a run by hand. No schedule. The job provisions
# nothing and calls no cloud API: the render needs no provider.

on:
  push:
    branches: [main]
    paths:
      - 'infra/providers/_shared/**'
      - 'clusters/_template/infrastructure/providers/**'
      - 'scripts/update-cloudinit-golden.sh'
      - '.github/workflows/cloudinit-golden.yaml'
  pull_request:
    paths:
      - 'infra/providers/_shared/**'
      - 'clusters/_template/infrastructure/providers/**'
      - 'scripts/update-cloudinit-golden.sh'
      - '.github/workflows/cloudinit-golden.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    name: golden
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          # Lockstep with cloud-init-size.yaml, preflight-cloudinit-posix.yml,
          # infra-hetzner-tofu.yaml and infra-huawei-tofu.yaml.
          tofu_version: 1.8.5
          # No wrapper: the script below reads `tofu output -raw` and needs
          # the plain output of the binary.
          tofu_wrapper: false

      - name: Render test (the run "golden" must pass)
        run: |
          set -euo pipefail
          cd infra/providers/_shared/tests
          tofu version
          tofu init -input=false -no-color
          tofu test -no-color | tee "$RUNNER_TEMP/render-test.log"
          # The exit code of the test is not enough: a test file without the
          # run "golden" would pass too.
          if ! grep -q -F 'run "golden"... pass' "$RUNNER_TEMP/render-test.log"; then
            echo "::error title=cloudinit-golden::The render test passed, but its output has no line 'run \"golden\"... pass'. The run \"golden\" is missing from infra/providers/_shared/tests/cloudinit_render.tftest.hcl."
            exit 1
          fi

      - name: Self-test (the run "golden" can fail)
        run: bash scripts/update-cloudinit-golden.sh --self-test

      - name: The golden file is what the script writes
        run: |
          set -euo pipefail
          bash scripts/update-cloudinit-golden.sh
          if ! git diff --exit-code -- infra/providers/_shared/tests/golden.auto.tfvars.json; then
            echo "::error title=cloudinit-golden::infra/providers/_shared/tests/golden.auto.tfvars.json differs from what scripts/update-cloudinit-golden.sh writes. Run the script and commit the file."
            exit 1
          fi
