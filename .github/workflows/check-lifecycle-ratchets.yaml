# check-lifecycle-ratchets.yaml - the hand-over machinery may only shrink.
#
# scripts/check-lifecycle-ratchets.sh measures seven numbers: the lines of the cutover chart's
# templates, its kubectl lines that change the cluster, its git push lines, the lines of the
# API's cutover Go files, the places in the API's Go code that build a client for another
# cluster, and the environment variables that only one of the two catalyst-api deployment
# templates sets (one number per side). It compares each number with
# scripts/lifecycle-ratchets-baseline.txt. A number above its baseline fails. A number below
# it passes with a note, and the change lowers the baseline with --write-baseline.
#
# The workflow runs on every pull request and on every merge group. It has no path filter
# on purpose: a required check that a path filter skips never reports.
# The self-test runs first. It shows, on a tree it builds itself, that every rule can fail.
# The last step shows it on the real chart: one kubectl patch line added to a copy must fail
# the guard. That step prints the guard's output only when the guard did not fail. So in a
# green run the guard prints no line that starts with 'check-lifecycle-ratchets: FAIL'.
# A job log also repeats the text of every step, and the text of the last step holds those
# words. Read a failure only from a log line that starts with them, right after its timestamp.
name: check-lifecycle-ratchets

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lifecycle-ratchets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Self-test of the guard
        run: bash scripts/check-lifecycle-ratchets.sh --self-test
      - name: No number of the hand-over machinery is above its baseline
        run: bash scripts/check-lifecycle-ratchets.sh
      - name: One kubectl patch line added to a copy of the cutover chart fails the guard
        run: |
          t="$(mktemp -d)"
          trap 'rm -rf "$t"' EXIT
          ln -s "$PWD/products" "$PWD/scripts" "$t/"
          mkdir -p "$t/platform/self-sovereign-cutover/chart"
          cp -r platform/self-sovereign-cutover/chart/templates "$t/platform/self-sovereign-cutover/chart/templates"
          printf '          kubectl -n x patch deploy y --type merge -p "{}"\n' >> "$t/platform/self-sovereign-cutover/chart/templates/namespace.yaml"
          code=0
          out="$(bash scripts/check-lifecycle-ratchets.sh --root "$t")" || code=$?
          if [ "$code" != 1 ] || ! grep -q -F 'check-lifecycle-ratchets: FAIL chart_mutations: ' <<<"$out"; then
            printf '%s\n' "$out"
            echo "The guard did not fail on the added kubectl patch line (exit code $code)."
            exit 1
          fi
          echo "The guard failed on the added kubectl patch line, as it must."
