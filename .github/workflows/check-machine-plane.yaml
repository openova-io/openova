# check-machine-plane.yaml - the machine plane gains no unsafe pattern.
#
# scripts/check-machine-plane.py counts seven patterns per file and compares the counts with
# scripts/baselines/machine-plane.json. It runs on every pull request and merge group, with no
# path filter: a required check that a path filter skips never reports. PyYAML is installed
# first, because the guard reads YAML with it. The self-test runs before the guard.
name: check-machine-plane

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  check-machine-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Self-test of the guard
        run: python3 scripts/check-machine-plane.py --self-test
      - name: The machine plane gains no unsafe pattern
        run: python3 scripts/check-machine-plane.py
