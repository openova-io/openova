name: Test — Bootstrap API (Go)

# Runs the Go tests for the catalyst-api bootstrap service. This is the
# primary host for several Group L tests:
#   - #146 Dynadot multi-domain DNS write integration test
#   - #145 bootstrap-kit installer integration test (Flux-driven)
#   - #141 Hetzner end-to-end provisioning test (gated on HETZNER_TEST_TOKEN)
#
# The job is fast and runs on every push that touches the bootstrap module.

# TRIGGERS MUST COVER WHAT THE TESTS READ, not only where they live (#6324).
# The #6324 Pod-quota guard in internal/handler derives its assertions from
# files OUTSIDE this module. Scoped to this module's own path, a chart-only PR
# would move a term the guard asserts on and never run the guard — green by
# absence of measurement, the same fail-open shape as the go-test cache trap
# #6235 closes. The added paths are the ones that guard reads:
#   platform/newapi/chart/**                          sidecar + CNPG limits
#   platform/openclaw/chart/**                        the controller's 250m term
#   core/controllers/organization/internal/gitops/**  planQuotaTable["s"] — the cap
#   core/services/provisioning/gitops/**              the OTHER per-Org producer,
#                                                     cross-checked door-to-door
# The test TestSchemasMatchSources of internal/intent reads the definition files
# its schema bundle is built from (CTL-160):
#   products/catalyst/chart/crds/**                   the CRDs and their samples
#   platform/crossplane-claims/chart/templates/crds/** the UserAccess CRD
# The test TestDefaultsAreTheContracts of internal/sovself reads the published
# schema of the variables document (SOV-180):
#   docs/contracts/c5-upstream-variables.schema.json
# The release tests of internal/lifecycle run the kit rewrite and the pin
# extractor of the cutover chart, the lines of step 03 that read the pull
# credential in a follower region (#7938), and check the route against the
# API's ClusterRole (#7922):
#   platform/self-sovereign-cutover/chart/templates/06-helmrepository-patches-job.yaml
#   platform/self-sovereign-cutover/chart/templates/03b-bootstrap-kit-pins.yaml
#   platform/self-sovereign-cutover/chart/templates/03-harbor-prewarm-job.yaml
# and, since a delivery runs the candidate's own mechanism (#7938), the release
# scripts and contract the cutover chart carries, which the tests render with
# helm and read with yq:
#   platform/self-sovereign-cutover/chart/files/release/**
#   products/catalyst/chart/templates/clusterrole-cutover-driver.yaml
# and the RBAC the release scripts run with: every kubectl call of a replayed
# delivery is checked against the runner account's rules as the chart renders
# them, that account read from the pods of step 01 and step 03 (#7938):
#   platform/self-sovereign-cutover/chart/templates/rbac.yaml
#   platform/self-sovereign-cutover/chart/templates/_helpers.tpl
#   platform/self-sovereign-cutover/chart/templates/01-gitea-mirror-job.yaml
# The network-registry tests of internal/lifecycle read the two-region registry
# fixture of the registry guard, and replay the registry's calls against the
# role that the first-boot template binds to parent-bootstrap (#7938; the
# template is under infra/providers/_shared/**):
#   scripts/tests/check-network-registry/valid-two-regions.json
on:
  push:
    paths:
      - 'products/catalyst/bootstrap/api/**'
      # The provisioner tests read the first-boot templates (cloudinit_path_test.go).
      - 'infra/providers/_shared/**'
      - 'platform/newapi/chart/**'
      - 'platform/openclaw/chart/**'
      - 'core/controllers/organization/internal/gitops/**'
      - 'core/services/provisioning/gitops/**'
      - 'products/catalyst/chart/crds/**'
      - 'platform/crossplane-claims/chart/templates/crds/**'
      - 'docs/contracts/c5-upstream-variables.schema.json'
      - 'platform/self-sovereign-cutover/chart/templates/06-helmrepository-patches-job.yaml'
      - 'platform/self-sovereign-cutover/chart/templates/03b-bootstrap-kit-pins.yaml'
      - 'platform/self-sovereign-cutover/chart/templates/03-harbor-prewarm-job.yaml'
      - 'platform/self-sovereign-cutover/chart/files/release/**'
      - 'platform/self-sovereign-cutover/chart/templates/rbac.yaml'
      - 'platform/self-sovereign-cutover/chart/templates/_helpers.tpl'
      - 'platform/self-sovereign-cutover/chart/templates/01-gitea-mirror-job.yaml'
      - 'products/catalyst/chart/templates/clusterrole-cutover-driver.yaml'
      - 'scripts/tests/check-network-registry/valid-two-regions.json'
      - '.github/workflows/test-bootstrap-api.yaml'
    branches: [main]
  pull_request:
    paths:
      - 'products/catalyst/bootstrap/api/**'
      # The provisioner tests read the first-boot templates (cloudinit_path_test.go).
      - 'infra/providers/_shared/**'
      - 'platform/newapi/chart/**'
      - 'platform/openclaw/chart/**'
      - 'core/controllers/organization/internal/gitops/**'
      - 'core/services/provisioning/gitops/**'
      - 'products/catalyst/chart/crds/**'
      - 'platform/crossplane-claims/chart/templates/crds/**'
      - 'docs/contracts/c5-upstream-variables.schema.json'
      - 'platform/self-sovereign-cutover/chart/templates/06-helmrepository-patches-job.yaml'
      - 'platform/self-sovereign-cutover/chart/templates/03b-bootstrap-kit-pins.yaml'
      - 'platform/self-sovereign-cutover/chart/templates/03-harbor-prewarm-job.yaml'
      - 'platform/self-sovereign-cutover/chart/files/release/**'
      - 'platform/self-sovereign-cutover/chart/templates/rbac.yaml'
      - 'platform/self-sovereign-cutover/chart/templates/_helpers.tpl'
      - 'platform/self-sovereign-cutover/chart/templates/01-gitea-mirror-job.yaml'
      - 'products/catalyst/chart/templates/clusterrole-cutover-driver.yaml'
      - 'scripts/tests/check-network-registry/valid-two-regions.json'
      - '.github/workflows/test-bootstrap-api.yaml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/catalyst/bootstrap/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: products/catalyst/bootstrap/api/go.sum

      - name: Download modules
        run: go mod download

      # The release tests render a cutover chart with helm and read the render
      # with yq, as the release Job does (#7938).
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Tools the release tests run
        run: |
          set -euo pipefail
          helm version --short
          yq --version
          jq --version

      - name: Vet
        run: go vet ./...

      - name: Run unit + integration tests
        run: go test -race -count=1 ./...
