name: check — generated catalog is in sync (#5520)

# The committed `blueprints.json`, `catalog.generated.ts` and the catalogue seed
# (products/catalyst/chart/templates/catalog-seed/blueprints.yaml) are GENERATED:
# `python3 scripts/generate-catalog.py` writes them from every
# platform/<name>/blueprint.yaml, products/<name>/blueprint.yaml and
# bootstrap-kit slot, the data files under platform/_catalog/ and a provider's
# own under infra/providers/<provider>/, the register of unpublished seed pins
# and the chart folders. A Blueprint that says lifecycle supported is proven by
# the newest counting gate record (docs/ledger/acceptance/, the pass rule of
# scripts/acceptance-gate.py), which this job hands to the generator with
# --gate-record. The pull request that changes one of those inputs runs
# the generator and commits the three files; nothing edits them by hand. The same
# job checks `docs/generated/components.md`, which
# `python3 scripts/generators/components.py` writes, so that
# scripts/generator_registry.py lists all four.
#
# This gate makes drift impossible to accumulate silently (the 508-line drift
# of #5520): `--check` regenerates in memory and fails when a committed file
# differs. It runs on pull requests, merge groups and every push to main.
#
# Prerequisite that makes this gate meaningful: the generator is DETERMINISTIC.
# `generatedAt` keeps the committed stamp while the content is unchanged, so it
# marks when the catalog CONTENT last changed; the last step proves two runs
# write the same bytes.

on:
  pull_request:
    paths:
      - 'platform/*/blueprint.yaml'
      - 'products/*/blueprint.yaml'
      - 'clusters/_template/bootstrap-kit/**'
      - 'scripts/generate-catalog.py'
      - 'scripts/tests/test_generate_catalog.py'
      - 'products/catalyst/bootstrap/ui/src/shared/constants/catalog.generated.ts'
      - 'products/catalyst/bootstrap/api/internal/catalog/blueprints.json'
      - 'platform/_catalog/**'
      - 'infra/providers/*/pack.yaml'
      - 'infra/providers/*/seed-exclusions.yaml'
      - 'scripts/expected-unpublished-catalog-seed-pins.yaml'
      - 'platform/*/chart/Chart.yaml'
      - 'products/*/chart/Chart.yaml'
      - 'products/catalyst/chart/templates/catalog-seed/blueprints.yaml'
      - 'scripts/generators/components.py'
      - 'docs/generated/components.md'
      - 'tools/guards/cmd/kit-rings/main.go'
      - 'tools/guards/cmd/kit-rings/write.sh'
      - 'products/catalyst/bootstrap/ui/src/pages/wizard/steps/componentGroups.generated.ts'
      - '.github/workflows/check-catalog-generated-drift.yaml'
  merge_group:
  push:
    branches: [main]
    paths:
      - 'platform/*/blueprint.yaml'
      - 'products/*/blueprint.yaml'
      - 'clusters/_template/bootstrap-kit/**'
      - 'scripts/generate-catalog.py'
      - 'products/catalyst/bootstrap/ui/src/shared/constants/catalog.generated.ts'
      - 'products/catalyst/bootstrap/api/internal/catalog/blueprints.json'
      - 'platform/_catalog/**'
      - 'infra/providers/*/pack.yaml'
      - 'infra/providers/*/seed-exclusions.yaml'
      - 'scripts/expected-unpublished-catalog-seed-pins.yaml'
      - 'platform/*/chart/Chart.yaml'
      - 'products/*/chart/Chart.yaml'
      - 'products/catalyst/chart/templates/catalog-seed/blueprints.yaml'
      - 'scripts/generators/components.py'
      - 'docs/generated/components.md'
      - 'tools/guards/cmd/kit-rings/main.go'
      - 'tools/guards/cmd/kit-rings/write.sh'
      - 'products/catalyst/bootstrap/ui/src/pages/wizard/steps/componentGroups.generated.ts'
  workflow_dispatch:

jobs:
  drift:
    name: regenerate and prove no diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pass rule asks Git whether a record's candidate commit is on
          # main and which rc/<candidate> refs exist.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # The seed tests render the generated seed with helm template; Helm is installed on ubuntu-latest.
      - name: Helm
        run: helm version --short

      - name: Test the generator
        run: |
          set -euo pipefail
          python3 scripts/generate-catalog.py --self-test
          python3 scripts/tests/test_generate_catalog.py

      - name: The newest counting gate record (the proof of lifecycle supported)
        id: gate
        run: |
          set -euo pipefail
          git fetch --quiet origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/rc/*:refs/remotes/origin/rc/*'
          record="$(python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("gate", "scripts/acceptance-gate.py")
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          counting = gate.counting_records(gate.load_records("."), gate.GitFacts("."))
          print("docs/ledger/acceptance/" + counting[-1][0] if counting else "")
          PY
          )"
          echo "newest counting gate record: ${record:-none}"
          echo "record=${record}" >> "$GITHUB_OUTPUT"

      - name: Fail if the committed generated files drifted
        env:
          GATE_RECORD: ${{ steps.gate.outputs.record }}
        run: python3 scripts/generate-catalog.py --check ${GATE_RECORD:+--gate-record "$GATE_RECORD"}

      - name: Fail if the components table drifted
        run: python3 scripts/generators/components.py --check

      - name: Set up the Go of tools/guards (the kit ring list)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: tools/guards/go.mod
          cache: false

      - name: Fail if the wizard ring list and the component logos drifted (SVC-230)
        run: sh tools/guards/cmd/kit-rings/write.sh --check

      - name: Prove the generator is deterministic (run it twice)
        run: |
          set -euo pipefail
          python3 scripts/generate-catalog.py --dry-run "$RUNNER_TEMP/first"
          python3 scripts/generate-catalog.py --dry-run "$RUNNER_TEMP/second"
          if ! diff -r "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"; then
            echo "::error::scripts/generate-catalog.py is NOT deterministic — two consecutive runs on identical input produced different output."
            exit 1
          fi
          echo "deterministic: two consecutive runs are byte-identical"
