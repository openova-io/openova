name: check — generated catalog is in sync (#5520)

# The committed `blueprints.json` + `catalog.generated.ts` are GENERATED:
# `python3 scripts/generate-catalog.py` writes them from every
# platform/<name>/blueprint.yaml, products/<name>/blueprint.yaml and
# bootstrap-kit slot. The pull request that changes one of those inputs runs
# the generator and commits both files; nothing edits them by hand. The same
# job checks `docs/generated/components.md`, which
# `python3 scripts/generators/components.py` writes, so that
# scripts/generator_registry.py lists all three.
#
# This gate makes drift impossible to accumulate silently (the 508-line drift
# of #5520): `--check` regenerates in memory and fails when a committed file
# differs. It runs on pull requests, merge groups and every push to main.
#
# Prerequisite that makes this gate meaningful: the generator is DETERMINISTIC.
# `generatedAt` keeps the committed stamp while the content is unchanged, so it
# marks when the catalog CONTENT last changed; the last step proves two runs
# write the same bytes.

on:
  pull_request:
    paths:
      - 'platform/*/blueprint.yaml'
      - 'products/*/blueprint.yaml'
      - 'clusters/_template/bootstrap-kit/**'
      - 'scripts/generate-catalog.py'
      - 'scripts/tests/test_generate_catalog.py'
      - 'products/catalyst/bootstrap/ui/src/shared/constants/catalog.generated.ts'
      - 'products/catalyst/bootstrap/api/internal/catalog/blueprints.json'
      - 'scripts/generators/components.py'
      - 'docs/generated/components.md'
      - '.github/workflows/check-catalog-generated-drift.yaml'
  merge_group:
  push:
    branches: [main]
    paths:
      - 'platform/*/blueprint.yaml'
      - 'products/*/blueprint.yaml'
      - 'clusters/_template/bootstrap-kit/**'
      - 'scripts/generate-catalog.py'
      - 'products/catalyst/bootstrap/ui/src/shared/constants/catalog.generated.ts'
      - 'products/catalyst/bootstrap/api/internal/catalog/blueprints.json'
      - 'scripts/generators/components.py'
      - 'docs/generated/components.md'
  workflow_dispatch:

jobs:
  drift:
    name: regenerate and prove no diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Test the generator
        run: |
          set -euo pipefail
          python3 scripts/generate-catalog.py --self-test
          python3 scripts/tests/test_generate_catalog.py

      - name: Fail if the committed generated files drifted
        run: python3 scripts/generate-catalog.py --check

      - name: Fail if the components table drifted
        run: python3 scripts/generators/components.py --check

      - name: Prove the generator is deterministic (run it twice)
        run: |
          set -euo pipefail
          python3 scripts/generate-catalog.py --dry-run "$RUNNER_TEMP/first"
          python3 scripts/generate-catalog.py --dry-run "$RUNNER_TEMP/second"
          if ! diff -r "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"; then
            echo "::error::scripts/generate-catalog.py is NOT deterministic — two consecutive runs on identical input produced different output."
            exit 1
          fi
          echo "deterministic: two consecutive runs are byte-identical"
