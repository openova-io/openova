# console-lint.yaml - the lint findings of the sovereign-admin console may only fall.
#
# scripts/check-console-lint.py holds the rules. The file
# products/catalyst/bootstrap/ui/eslint-max-warnings.txt holds two numbers: the highest
# number of ESLint warnings and the highest number of ESLint errors the console may have.
#   ratchet   neither number is higher than at the merge base with main
#   lint      ESLint finds no more warnings and no more errors than the two numbers
# The self-test runs first. It shows for every rule that the rule can fail, so a green run
# is never the result of a guard that has stopped looking.
# There is no path filter, on purpose: a check that a path filter skips never reports. The
# job always runs the self-test and the ratchet. It installs the console's packages and
# runs ESLint only when the change can move the lint result: a file of the console folder,
# a workspace file of the repository root, the script or this workflow (command "scope").
# The Node version and the install step are those of the job bootstrap-ui-vitest in
# test-ungated-trees.yaml, so ESLint runs with the packages the console's tests run with.
name: console-lint

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: console-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console-lint:
    name: console-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the merge base with origin/main must be reachable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test of the guard (every rule can fail)
        run: python3 scripts/check-console-lint.py --self-test

      - name: The numbers are not higher than at the merge base
        run: python3 scripts/check-console-lint.py ratchet

      # The step fails when the script cannot tell. ESLint is left out only when the
      # script printed the word false.
      - name: Find out whether this change can move the lint result
        id: scope
        run: |
          set -euo pipefail
          lint="$(python3 scripts/check-console-lint.py scope)"
          echo "::notice::console-lint: ESLint runs on this change: ${lint}"
          echo "lint=${lint}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.lint != 'false'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: products/catalyst/bootstrap/ui/package-lock.json

      - name: Install
        if: steps.scope.outputs.lint != 'false'
        working-directory: products/catalyst/bootstrap/ui
        run: npm ci

      - name: ESLint finds no more warnings and no more errors than the numbers allow
        if: steps.scope.outputs.lint != 'false'
        run: python3 scripts/check-console-lint.py lint
