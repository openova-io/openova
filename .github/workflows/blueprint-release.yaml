# Blueprint release — path-matrix CI fan-out per BLUEPRINT-AUTHORING.md §11.
#
# Pushes to `main` that touch any platform/<name>/chart/** or
# products/<name>/chart/** directory trigger a build of that single Blueprint
# folder; output is a signed OCI artifact at
# ghcr.io/openova-io/bp-<name>:<semver> where <semver> comes from the
# Chart.yaml `version` field.
#
# Tag-based releases (refs/tags/<name>/v<X.Y.Z>) trigger the same build with
# version pinned to the tag, plus cosign signing + Syft SBOM generation.
#
# This workflow is the canonical CI for all 12 bootstrap-kit charts (the
# original 11 plus bp-powerdns added at #167) plus every other Catalyst-
# curated wrapper chart. Application-Blueprint charts (cnpg, valkey, etc.)
# follow the same shape once authored.
#
# ─────────────────────────────────────────────────────────────────────
# Hollow-chart guard (issue #181)
# ─────────────────────────────────────────────────────────────────────
# Every umbrella Blueprint chart MUST declare its upstream chart(s) under
# `dependencies:` in Chart.yaml so `helm dependency build` pulls the
# upstream payload into the OCI artifact at publish time. Earlier in this
# cycle, bp-cert-manager:1.0.0 shipped as a "hollow chart" — only an
# overlay (ClusterIssuer template) with no upstream cert-manager subchart
# bytes — and Phase 1 broke on every Sovereign because cert-manager
# itself was never installed. See docs/RUNBOOKS.md
# §"Umbrella shape".
#
# This workflow now structurally verifies the upstream payload is present
# at every stage of the publish pipeline:
#
#   1. After `helm dependency build` — assert the working-tree
#      chart/charts/<dep>-<ver>.tgz (or unpacked chart/charts/<dep>/) exists
#      for every entry in Chart.yaml `dependencies:`.
#   2. After `helm package` — `tar -tzf` the produced .tgz and assert
#      every declared dep is inside the package's charts/ directory.
#   3. After `helm push` — `helm pull` the artifact back from GHCR and
#      re-verify the deps survived the round-trip.
#   4. `helm template` smoke render — chart MUST render with default
#      values; rendered manifests are uploaded as a workflow artifact for
#      forensics.
#
# Any one of those steps failing fails the whole build — hollow charts
# can never reach a Sovereign.

name: Blueprint Release

on:
  push:
    paths:
      - 'platform/*/chart/**'
      - 'products/*/chart/**'
      - 'platform/*/blueprint.yaml'
      - 'products/*/blueprint.yaml'
    branches: [main]
  workflow_dispatch:
    inputs:
      blueprint:
        description: 'Blueprint name (e.g. cilium, openbao, catalyst). Empty = build all changed.'
        required: false
        type: string
      tree:
        description: 'Source tree: platform (leaf) or products (umbrella).'
        required: false
        type: choice
        default: platform
        options:
          - platform
          - products

permissions:
  # contents: write — the auto-bump-pin step (added 2026-05-18, TBD-A6
  # meta-fix) writes back the `version:` line in
  # clusters/_template/bootstrap-kit/<NN>-<chart>.yaml so the bootstrap-
  # kit pin moves in lockstep with the published OCI artifact. Before
  # this, every chart bump required a SEPARATE manual collector PR to
  # bump the pin (PRs #1666, #1687, #1695, #1698, #1707 in the
  # 2026-05-17/18 wave alone). The bot-author commit does NOT re-trigger
  # workflows (GITHUB_TOKEN convention), so we can safely push without
  # looping the publish pipeline.
  contents: write
  packages: write
  id-token: write              # for cosign keyless signing

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # G47 #2599: fetch full history so we can diff against the
          # `github.event.before` base of the push, not just HEAD~1.
          # HEAD~1 undercounts when a single push lands a stacked set of
          # commits — only the tip's diff is inspected, every chart bump
          # in earlier commits in the same push gets skipped.
          fetch-depth: 0

      - name: Detect changed Blueprints
        id: changed
        run: |
          set -e
          if [ -n "${{ inputs.blueprint }}" ]; then
            tree="${{ inputs.tree }}"
            tree="${tree:-platform}"
            echo "matrix={\"include\":[{\"path\":\"${tree}/${{ inputs.blueprint }}\"}]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # G47 #2599: diff against the base of the push (covers stacked
          # commits), not against HEAD~1 (which only inspects the tip).
          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.sha }}'
          ZERO=0000000000000000000000000000000000000000
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            # workflow_dispatch / initial push / branch-create — no
            # meaningful `before` exists. Fall back to single-commit diff.
            BASE=HEAD~1
          else
            BASE="$BEFORE"
          fi
          echo "Diffing $BASE..$AFTER"
          changed=$(git diff --name-only "$BASE" "$AFTER" | grep -E '^(platform|products)/[^/]+/(chart/|blueprint\.yaml)' | awk -F/ '{print $1"/"$2}' | sort -u)
          echo "Changed blueprints:"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            include=$(echo "$changed" | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({path: .})')
            echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Install yq (declared-deps parser)
        run: |
          # We need a streaming YAML parser to read Chart.yaml's dependencies:
          # block reliably; awk/grep on YAML is fragile and would let a
          # subtly malformed Chart.yaml slip past the hollow-chart guard.
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read chart metadata
        id: chart
        run: |
          set -e
          path="${{ matrix.path }}"
          chart_yaml="$path/chart/Chart.yaml"
          if [ ! -f "$chart_yaml" ]; then
            echo "No chart at $path/chart/ — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Authoritative chart name comes from Chart.yaml `name:` field
          # (e.g. `bp-cilium`, `bp-catalyst-platform`). Folder basename and
          # chart name are not always identical — the umbrella at
          # products/catalyst/chart packages as bp-catalyst-platform.
          chart_name=$(awk '/^name:/{print $2; exit}' "$chart_yaml" | tr -d '"')
          version=$(awk '/^version:/{print $2; exit}' "$chart_yaml" | tr -d '"')
          echo "name=$chart_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Helm registry login (for OCI dependencies)
        if: steps.chart.outputs.skip != 'true'
        run: |
          # `helm dependency build` resolves `oci://ghcr.io/openova-io/bp-*`
          # dependencies — needs an authenticated helm registry login,
          # not just a docker login.
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      # ──────────────────────────────────────────────────────────────
      # Helm dependency build — bundle the upstream subchart (#2935)
      # ──────────────────────────────────────────────────────────────
      # UAT Wave-2 ATTACK#4 found 24/34 charts fail `helm template`
      # because their declared upstream subchart was never bundled into
      # chart/charts/. `helm dependency build` resolves every entry in
      # Chart.yaml `dependencies:` and writes the .tgz into chart/charts/
      # BEFORE the package/render guards below run. PR #2955 (first half
      # of #2935) annotated the default-off charts so the hollow-chart
      # smoke guard stops false-passing them; this step is the other half
      # — without the build, GUARD 1 / GUARD 2 / smoke-render all fail.
      #
      # Guarded on the presence of a `dependencies:` block: a chart that
      # legitimately ships only Catalyst-authored CRs (no-upstream:true)
      # has nothing to resolve, and `helm dependency build` is a clean
      # no-op there (exit 0). We skip it explicitly so the build log
      # reads cleanly and a future `helm dependency build` behaviour
      # change on no-deps charts can't surprise the pipeline. For charts
      # that DO declare dependencies, real resolution failures surface
      # loudly (no `|| true`) — a chart that can't pull its subchart must
      # NOT proceed to publish as a hollow artifact.
      - name: Helm dependency build
        if: steps.chart.outputs.skip != 'true'
        run: |
          set -euo pipefail
          chart_dir="${{ matrix.path }}/chart"
          dep_count=$(yq '.dependencies | length // 0' "$chart_dir/Chart.yaml")
          if [ "$dep_count" -eq 0 ]; then
            echo "Chart $chart_dir declares no dependencies — skipping helm dependency build."
            exit 0
          fi
          echo "Resolving $dep_count declared dependency/dependencies for $chart_dir"
          helm dependency build "$chart_dir"

      # ──────────────────────────────────────────────────────────────
      # GUARD 1 — hollow-chart check on the working tree
      # ──────────────────────────────────────────────────────────────
      # After `helm dependency build`, every entry in Chart.yaml's
      # `dependencies:` block MUST have a corresponding artifact under
      # chart/charts/. Helm accepts either form:
      #   chart/charts/<dep-name>-<dep-version>.tgz       (packed)
      #   chart/charts/<dep-name>/Chart.yaml              (unpacked vendored)
      # Either is fine; ZERO of them is a hollow chart and we fail loudly.
      - name: "Verify upstream subcharts present in working tree (post-dependency-build)"
        if: steps.chart.outputs.skip != 'true'
        id: verify_workdir
        run: |
          set -euo pipefail
          chart_dir="${{ matrix.path }}/chart"
          chart_yaml="$chart_dir/Chart.yaml"
          # Some Blueprints legitimately ship NO upstream subchart — their
          # entire payload is Catalyst-authored CRs (e.g.
          # bp-crossplane-claims, which carries only XRDs + Compositions
          # for the compose.openova.io/v1alpha1 family). Those charts opt
          # out of the dependencies-required rule by setting the
          # annotation:
          #   annotations:
          #     catalyst.openova.io/no-upstream: "true"
          # in their Chart.yaml. The hollow-chart rule remains in force
          # for every other umbrella chart — the original failure
          # (bp-cert-manager:1.0.0 silently shipping without cert-manager)
          # cannot recur unless an author explicitly adds the annotation.
          no_upstream=$(yq '.annotations["catalyst.openova.io/no-upstream"] // ""' "$chart_yaml")
          dep_count=$(yq '.dependencies | length // 0' "$chart_yaml")
          echo "Declared dependencies: $dep_count"
          echo "no-upstream annotation: '$no_upstream'"
          if [ "$dep_count" -eq 0 ]; then
            if [ "$no_upstream" = "true" ]; then
              echo "Chart marked catalyst.openova.io/no-upstream=true — skipping upstream-subchart presence check."
              exit 0
            fi
            echo "::error title=Hollow chart::Chart $chart_yaml declares NO dependencies. Every Blueprint umbrella chart at platform/<name>/chart/ MUST declare its upstream chart under \`dependencies:\` per docs/RUNBOOKS.md §11.1 Umbrella shape. See issue #181. (To opt out for charts that legitimately ship only Catalyst-authored CRs, set annotations.catalyst.openova.io/no-upstream: \"true\".)"
            exit 1
          fi
          missing=0
          for i in $(seq 0 $((dep_count - 1))); do
            dep_name=$(yq ".dependencies[$i].name"       "$chart_yaml")
            dep_ver=$(yq  ".dependencies[$i].version"    "$chart_yaml")
            dep_repo=$(yq ".dependencies[$i].repository" "$chart_yaml")
            packed="$chart_dir/charts/${dep_name}-${dep_ver}.tgz"
            unpacked="$chart_dir/charts/${dep_name}/Chart.yaml"
            if [ -f "$packed" ]; then
              echo "  ✓ ${dep_name} ${dep_ver}  →  $packed"
            elif [ -f "$unpacked" ]; then
              echo "  ✓ ${dep_name} ${dep_ver}  →  $unpacked (unpacked)"
            else
              echo "::error title=Subchart not pulled::Declared dependency '${dep_name}' (version='${dep_ver}', repo='${dep_repo}') was not pulled by \`helm dependency build\`. Expected $packed OR $unpacked. Investigate the dependency repository / Chart.lock; do NOT publish a hollow chart."
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            exit 1
          fi
          echo "All $dep_count declared upstream subcharts present in working tree."

      - name: Helm package
        if: steps.chart.outputs.skip != 'true'
        run: |
          mkdir -p /tmp/charts
          helm package "${{ matrix.path }}/chart" --destination /tmp/charts

      # ──────────────────────────────────────────────────────────────
      # GUARD 2 — hollow-chart check inside the packaged tgz
      # ──────────────────────────────────────────────────────────────
      # `helm package` builds the OCI payload from the working tree, but
      # we don't trust transitive bugs / .helmignore mishaps to leave
      # chart/charts/ behind. Crack the produced .tgz and assert every
      # declared dep is inside <chart_name>/charts/ in the package.
      - name: "Verify upstream subcharts present in packaged tgz (post-helm-package)"
        if: steps.chart.outputs.skip != 'true'
        id: verify_package
        run: |
          set -euo pipefail
          chart_yaml="${{ matrix.path }}/chart/Chart.yaml"
          name="${{ steps.chart.outputs.name }}"
          version="${{ steps.chart.outputs.version }}"
          tgz="/tmp/charts/${name}-${version}.tgz"
          if [ ! -f "$tgz" ]; then
            echo "::error title=Package missing::Expected $tgz from helm package."
            exit 1
          fi
          echo "Inspecting $tgz"
          listing="/tmp/${name}-${version}.listing.txt"
          tar -tzf "$tgz" > "$listing"
          echo "  total entries: $(wc -l < "$listing")"
          dep_count=$(yq '.dependencies | length // 0' "$chart_yaml")
          missing=0
          for i in $(seq 0 $((dep_count - 1))); do
            dep_name=$(yq ".dependencies[$i].name"    "$chart_yaml")
            dep_ver=$(yq  ".dependencies[$i].version" "$chart_yaml")
            packed_in_tgz="${name}/charts/${dep_name}-${dep_ver}.tgz"
            unpacked_in_tgz="${name}/charts/${dep_name}/Chart.yaml"
            if grep -qx "$packed_in_tgz" "$listing"; then
              echo "  ✓ ${dep_name} ${dep_ver}  →  $packed_in_tgz"
            elif grep -qx "$unpacked_in_tgz" "$listing"; then
              echo "  ✓ ${dep_name} ${dep_ver}  →  $unpacked_in_tgz (unpacked)"
            else
              echo "::error title=Hollow package::Packaged tgz $tgz does NOT contain upstream subchart '${dep_name}' (version='${dep_ver}'). Refusing to publish a hollow chart."
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "── package listing (first 200 lines) ──"
            head -200 "$listing"
            exit 1
          fi
          echo "All $dep_count declared upstream subcharts present inside packaged tgz."

      # ──────────────────────────────────────────────────────────────
      # SMOKE — `helm template` must render with default values
      # ──────────────────────────────────────────────────────────────
      # A chart can be structurally complete but render-broken (bad
      # template, missing required value, schema violation). Render the
      # packaged chart with defaults; on render failure the build dies
      # and the rendered output (if any) ships as a workflow artifact
      # for forensics.
      #
      # Empty-render rule: a working umbrella with an upstream subchart
      # should produce many resources, so `<5 lines` is suspicious AND
      # blocks publish. EXCEPTION: charts that are both `no-upstream:
      # true` AND default-OFF (e.g. bp-cnpg-pair, products/continuum)
      # legitimately render zero resources at default values — they
      # ship a `cnpgPair.enabled: true` (or equivalent) flip-on path
      # that overlays activate per-Sovereign. Those charts opt into the
      # exception via the `catalyst.openova.io/smoke-render-mode:
      # default-off` annotation; their unit-tests under chart/tests/*.sh
      # cover the enabled-render path. Without the annotation the
      # `<5 lines` rule still fires.
      - name: "Helm template smoke render (default values)"
        if: steps.chart.outputs.skip != 'true'
        id: smoke
        run: |
          set -euo pipefail
          name="${{ steps.chart.outputs.name }}"
          version="${{ steps.chart.outputs.version }}"
          chart_yaml="${{ matrix.path }}/chart/Chart.yaml"
          tgz="/tmp/charts/${name}-${version}.tgz"
          mkdir -p /tmp/render
          render_out="/tmp/render/${name}-${version}.default.yaml"
          # `helm template` against the packaged tgz exercises the same
          # bytes Flux will install at runtime — including subchart
          # rendering. A leaf umbrella with the upstream subchart
          # present should produce upstream resources here.
          if ! helm template "smoke-${name}" "$tgz" \
                --namespace "smoke-${name}" \
                > "$render_out" 2> /tmp/render/stderr.log; then
            echo "::error title=helm template failed::Default-values render of $tgz failed; see uploaded artifact and stderr below."
            cat /tmp/render/stderr.log >&2
            exit 1
          fi
          lines=$(wc -l < "$render_out")
          echo "Rendered $lines lines to $render_out"
          smoke_mode=$(yq '.annotations["catalyst.openova.io/smoke-render-mode"] // ""' "$chart_yaml")
          if [ "$lines" -lt 5 ]; then
            if [ "$smoke_mode" = "default-off" ]; then
              echo "Chart marked catalyst.openova.io/smoke-render-mode=default-off — short default render is expected; chart/tests/*.sh covers the enabled-render path."
            else
              echo "::error title=Empty render::Rendered output is suspiciously short ($lines lines). A working umbrella with an upstream subchart should produce many more resources. (For charts that are intentionally default-off, set annotations.catalyst.openova.io/smoke-render-mode: \"default-off\" in Chart.yaml.)"
              exit 1
            fi
          fi

      - name: "Upload smoke render as workflow artifact"
        if: ${{ always() && steps.chart.outputs.skip != 'true' && steps.smoke.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: blueprint-smoke-render-${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}
          path: /tmp/render/
          if-no-files-found: warn
          retention-days: 30

      # ──────────────────────────────────────────────────────────────
      # GATE — Per-chart integration tests under chart/tests/*.sh
      # ──────────────────────────────────────────────────────────────
      # Every chart under platform/<name>/chart/tests/ that ships a *.sh
      # script gets executed here against the working-tree chart. Tests
      # SHOULD be self-contained `helm template` assertions (no kind
      # cluster); kind-based tests live in a separate workflow that we
      # don't gate publish on.
      #
      # Canonical example: tests/observability-toggle.sh — verifies the
      # docs/RUNBOOKS.md §11.2 rule (observability toggles
      # default false). A chart authoring regression that re-introduces
      # a hardcoded `serviceMonitor.enabled: true` fails this gate and
      # the publish job dies BEFORE the OCI artifact is pushed (issue
      # #182).
      - name: "Run chart integration tests (chart/tests/*.sh)"
        if: steps.chart.outputs.skip != 'true'
        id: chart_tests
        run: |
          set -euo pipefail
          chart_dir="${{ matrix.path }}/chart"
          tests_dir="$chart_dir/tests"
          if [ ! -d "$tests_dir" ]; then
            echo "No tests/ directory at $tests_dir — skipping chart tests."
            exit 0
          fi
          shopt -s nullglob
          scripts=( "$tests_dir"/*.sh )
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "tests/ directory present at $tests_dir but no *.sh scripts — skipping."
            exit 0
          fi
          echo "Running ${#scripts[@]} chart-test script(s) under $tests_dir:"
          for s in "${scripts[@]}"; do
            echo "  → $s"
          done
          for s in "${scripts[@]}"; do
            echo "── $(basename "$s") ──"
            bash "$s" "$chart_dir"
          done
          echo "All chart-test scripts passed."

      - name: Helm push to GHCR
        if: steps.chart.outputs.skip != 'true'
        id: push
        run: |
          # pipefail: without it the awk tail eats `helm push`'s exit code
          # and a FAILED push reports green — the job "succeeds", the tag
          # never lands on GHCR, and the failure surfaces minutes later as
          # a Sovereign-side HelmChart "chart pull error: not found"
          # (issue #2859's whole confusion class; bit live twice on
          # 2026-06-11/12: bp-gitea 1.2.28 + bp-postgres 0.1.4).
          set -eo pipefail
          name="${{ steps.chart.outputs.name }}"
          version="${{ steps.chart.outputs.version }}"
          # `helm package` writes <chart_name>-<version>.tgz; the chart name
          # already carries the `bp-` prefix per BLUEPRINT-AUTHORING.md §3.
          file="/tmp/charts/${name}-${version}.tgz"
          digest=$(helm push "$file" oci://ghcr.io/openova-io 2>&1 | tee /dev/stderr | awk '/Digest:/{print $2}')
          # Belt-and-braces: a push that "succeeded" without printing a
          # digest is also a failure (registry half-write).
          if [ -z "$digest" ]; then
            echo "::error::helm push produced no digest for ${name}:${version} — treating as failed publish"
            exit 1
          fi
          echo "ref=ghcr.io/openova-io/${name}:${version}" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────────────────────
      # GUARD 3 — hollow-chart check after round-trip through GHCR
      # ──────────────────────────────────────────────────────────────
      # Pull the just-pushed artifact back from GHCR and re-verify deps
      # survived. This catches any registry-side stripping, manifest
      # rewriting, or path mangling — and proves end consumers (Flux
      # helm-controller on every Sovereign) will see the upstream
      # subchart bytes.
      - name: "Verify upstream subcharts present in pulled OCI artifact (post-helm-push)"
        if: steps.chart.outputs.skip != 'true'
        id: verify_pull
        run: |
          set -euo pipefail
          name="${{ steps.chart.outputs.name }}"
          version="${{ steps.chart.outputs.version }}"
          # `chart_yaml` is referenced relative to $GITHUB_WORKSPACE — DO NOT
          # cd elsewhere before reading it. We pin `helm pull` output via
          # --destination so the read of the source-tree Chart.yaml stays
          # rooted at the checked-out repo root.
          chart_yaml="${GITHUB_WORKSPACE}/${{ matrix.path }}/chart/Chart.yaml"
          mkdir -p /tmp/pulled
          helm pull "oci://ghcr.io/openova-io/${name}" --version "${version}" \
            --destination /tmp/pulled
          pulled_tgz="/tmp/pulled/${name}-${version}.tgz"
          if [ ! -f "$pulled_tgz" ]; then
            echo "::error title=Pull failed::helm pull did not produce $pulled_tgz; cannot verify GHCR contents."
            ls -la /tmp/pulled
            exit 1
          fi
          listing="/tmp/pulled/${name}-${version}.pulled.listing.txt"
          tar -tzf "$pulled_tgz" > "$listing"
          echo "  pulled entries: $(wc -l < "$listing")"
          dep_count=$(yq '.dependencies | length // 0' "$chart_yaml")
          missing=0
          for i in $(seq 0 $((dep_count - 1))); do
            dep_name=$(yq ".dependencies[$i].name"    "$chart_yaml")
            dep_ver=$(yq  ".dependencies[$i].version" "$chart_yaml")
            packed_in_tgz="${name}/charts/${dep_name}-${dep_ver}.tgz"
            unpacked_in_tgz="${name}/charts/${dep_name}/Chart.yaml"
            if grep -qx "$packed_in_tgz" "$listing"; then
              echo "  ✓ ${dep_name} ${dep_ver}  →  $packed_in_tgz (in GHCR artifact)"
            elif grep -qx "$unpacked_in_tgz" "$listing"; then
              echo "  ✓ ${dep_name} ${dep_ver}  →  $unpacked_in_tgz (in GHCR artifact, unpacked)"
            else
              echo "::error title=Hollow OCI artifact::GHCR-pulled $pulled_tgz does NOT contain upstream subchart '${dep_name}' (version='${dep_ver}'). The artifact at ghcr.io/openova-io/${name}:${version} is hollow — Flux will install it but the upstream payload will be missing on every Sovereign. Refusing to leave this published."
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "── pulled-artifact listing (first 200 lines) ──"
            head -200 "$listing"
            exit 1
          fi
          echo "All $dep_count declared upstream subcharts present in pulled GHCR artifact."

      - name: Cosign keyless sign
        if: steps.chart.outputs.skip != 'true'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes "${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}"

      - name: Generate SBOM via Syft
        if: steps.chart.outputs.skip != 'true'
        run: |
          # Scan the local .tgz file rather than the published OCI artifact so
          # we don't need containerd permissions on the runner. The .tgz
          # carries everything we'd want to inventory anyway (values.yaml +
          # Chart.yaml + templates + blueprint.yaml + the upstream-chart
          # reference metadata).
          mkdir -p /tmp/sbom
          name="${{ steps.chart.outputs.name }}"
          version="${{ steps.chart.outputs.version }}"
          # Chart name already includes `bp-` prefix (read from Chart.yaml).
          syft "file:/tmp/charts/${name}-${version}.tgz" -o spdx-json="/tmp/sbom/sbom.spdx.json"

      - name: Attest SBOM via cosign
        if: steps.chart.outputs.skip != 'true'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign attest --yes --predicate /tmp/sbom/sbom.spdx.json --type spdxjson \
            "${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}"

      # ──────────────────────────────────────────────────────────────
      # AUTO-BUMP — clusters/_template/bootstrap-kit/<NN>-<chart>.yaml
      # ──────────────────────────────────────────────────────────────
      # TBD-A6 meta-fix (2026-05-18): every chart-publishing wave in this
      # session required a SEPARATE manual collector PR to bump the
      # bootstrap-kit pin so Sovereigns would actually install the new
      # OCI artifact. Without the pin bump, the chart at e.g.
      # bp-catalyst-platform:1.4.166 gets published to GHCR but
      # clusters/_template/bootstrap-kit/13-bp-catalyst-platform.yaml
      # still pins `version: 1.4.165` and fresh Sovereigns silently
      # install the OLD artifact.
      #
      # Manual collector PRs from this session ALONE (eliminated by
      # this hook):
      #   - #1676 chart 1.4.162→1.4.163 — Wave 16 collector
      #   - #1687 chart 1.4.163→1.4.164 — Wave 17 collector
      #   - #1694 bp-guacamole 0.1.21 → 0.1.22 (TBD-G6)
      #   - #1695 chart 1.4.164→1.4.165 — Wave 18 collector
      #   - #1698 chart 1.4.165→1.4.166 (TBD-E8)
      #   - #1700 bp-guacamole 0.1.22 → 0.1.23 (TBD-G4 phase 2)
      #   - #1706 self-sovereign-cutover 0.1.29→0.1.30 (TBD-C18)
      #   - #1707 chart 1.4.166→1.4.167 — Wave 24 collector
      #
      # Mechanism: the canonical chart name comes from Chart.yaml `name:`
      # (already read into ${{ steps.chart.outputs.name }} above). The
      # corresponding bootstrap-kit pin file is identified by grepping
      # for `^      chart: <name>$` (6-space indent matches the
      # HelmRelease.spec.chart.spec.chart shape in every existing slot).
      # If no pin file matches, the chart is NOT in the bootstrap kit
      # (e.g. it's an optional Application Blueprint that Sovereigns
      # opt into via overlay) — this is a graceful no-op, NOT a failure.
      #
      # The bot-author commit does NOT re-trigger blueprint-release per
      # the GITHUB_TOKEN convention. So this hook converges in ONE pass:
      # publish → bump pin → push. The next Sovereign provisioned will
      # pick up the new pin via the standard Flux reconciliation.
      #
      # Idempotent reset-and-rewrite: parallel matrix jobs (multiple
      # changed Blueprints in the same push) could race on the same
      # branch. Retry up to 3 times with `git fetch + reset --hard
      # origin/main + re-sed` so concurrent runs produce strictly
      # ordered commits instead of clobbering each other.
      - name: "Auto-bump bootstrap-kit pin for ${{ steps.chart.outputs.name }}"
        if: steps.chart.outputs.skip != 'true'
        id: bump_pin
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail

          # Locate the bootstrap-kit slot pinning this chart, if any.
          # The 6-space indent matches every existing slot's chart
          # directive:
          #
          #     spec:
          #       chart:
          #         spec:
          #           chart: bp-<name>        ← 6 spaces
          #           version: <semver>       ← 6 spaces, same scope
          pin_file=$(grep -lE "^      chart: ${CHART_NAME}\$" \
            clusters/_template/bootstrap-kit/*.yaml 2>/dev/null || true)

          if [ -z "$pin_file" ]; then
            # TBD-A6 hardening (2026-05-18): before declaring "not in the
            # kit", check whether a slot pins this chart at a DIFFERENT
            # indent than the canonical 6 spaces. If so, the auto-bump
            # would silently no-op forever and the chart-pin pair would
            # drift undetected. Fail loudly so the slot author re-indents
            # to the canonical shape before publishing.
            wrong_indent=$(grep -lE "^[[:space:]]+chart: ${CHART_NAME}\$" \
              clusters/_template/bootstrap-kit/*.yaml 2>/dev/null || true)
            if [ -n "$wrong_indent" ]; then
              echo "::error title=Bootstrap-kit slot indent drift::Slot file(s) pin ${CHART_NAME} but at a non-6-space indent: $wrong_indent. The auto-bump hook keys on \`^      chart: <name>\$\` (exactly 6 spaces). Re-indent the slot's \`chart:\` and \`version:\` lines under HelmRelease.spec.chart.spec to 6 spaces, matching every other slot. The pin-sync audit (scripts/check-bootstrap-kit-pin-sync.sh) keys on the same regex and would also miss this slot — drift would be undetected."
              exit 1
            fi
            echo "INFO: no bootstrap-kit slot pins ${CHART_NAME} — graceful no-op (chart is an opt-in Application Blueprint, not part of the kit)."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Multiple slots MAY pin the same chart — the #3188 three-
          # instance model installs bp-postgres at slots 16a/16c/16d
          # (three data instances of one chart). The lockstep bump
          # applies to EVERY slot file pinning the chart; the pin-sync
          # audit (scripts/check-bootstrap-kit-pin-sync.sh) asserts the
          # same all-pins contract.
          bumped=false
          bumped_files=""
          prev_versions=""
          for f in $pin_file; do
            # Read current pin. The HelmRelease.spec.chart.spec.version
            # is at exactly 6 spaces of indent in every slot (audited
            # 2026-05-18 across all 51 files). If the shape ever changes
            # we fail loudly rather than write the wrong line.
            current=$(awk '/^      version:/{print $2; exit}' "$f" | tr -d '"')
            if [ -z "$current" ]; then
              echo "::error title=Unparseable bootstrap-kit pin::No '      version:' line at 6-space indent in $f. The HelmRelease.spec.chart.spec.version shape changed under TBD-A6's auto-bump hook; refusing to write."
              exit 1
            fi

            if [ "$current" = "$CHART_VERSION" ]; then
              echo "INFO: ${f} already pins ${CHART_NAME}=${CHART_VERSION} — no-op."
              continue
            fi

            echo "Bumping ${f}: ${CHART_NAME} ${current} → ${CHART_VERSION}"
            # sed targets the single 6-space `      version:` line at the
            # chart-pin scope. There is exactly one such line per slot
            # (audited 2026-05-18); the regex is anchored to start-of-line
            # so a deeper-indented `version:` (e.g. inside .values.xxx)
            # cannot accidentally match.
            sed -i -E "s|^      version: .*\$|      version: ${CHART_VERSION}|" "$f"

            # Verify the sed actually flipped the line — defence against
            # a future indent change shipping silently.
            new=$(awk '/^      version:/{print $2; exit}' "$f" | tr -d '"')
            if [ "$new" != "$CHART_VERSION" ]; then
              echo "::error title=sed failed::After rewrite, ${f} still pins '${new}', expected '${CHART_VERSION}'."
              exit 1
            fi

            bumped=true
            bumped_files="${bumped_files:+${bumped_files} }${f}"
            prev_versions="${prev_versions:+${prev_versions} }${current}"
          done

          if [ "$bumped" != "true" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "pin_file=${bumped_files}" >> "$GITHUB_OUTPUT"
          echo "prev_version=${prev_versions}" >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────────────────────
      # LOCKSTEP — platform/<bp>/blueprint.yaml `spec.version`
      # ──────────────────────────────────────────────────────────────
      # TBD-A20 (issue #1856, 2026-05-18): the auto-bump hook above only
      # touched clusters/_template/bootstrap-kit/*.yaml. The upstream
      # blueprint manifest (platform/<bp>/blueprint.yaml) ALSO carries
      # a `spec.version` field that must equal the Chart.yaml `version`
      # by convergence contract:
      #
      #   TestBootstrapKit_BlueprintCardsHaveRequiredFields
      #     (tests/e2e/bootstrap-kit/main_test.go)
      #
      # asserts `Chart.yaml.version == blueprint.yaml.spec.version` for
      # every kit blueprint. Six blueprints (cilium, cert-manager, flux,
      # openbao, keycloak, gitea) silently drifted between Chart.yaml
      # and blueprint.yaml until the test started failing — A17 (#1855)
      # hot-patched the six drifts; this lockstep step removes the
      # structural recurrence pattern.
      #
      # Location convention:
      #   - Leaf platform blueprints live at  ${matrix.path}/blueprint.yaml
      #     (e.g. platform/cilium/blueprint.yaml)
      #   - Umbrella product blueprints live at ${matrix.path}/chart/blueprint.yaml
      #     (e.g. products/continuum/chart/blueprint.yaml)
      #
      # Some charts have no blueprint.yaml at all (e.g. products/catalyst —
      # the chart-only umbrella for bp-catalyst-platform). This is fine —
      # the lockstep is a graceful no-op when no blueprint.yaml exists.
      #
      # The `spec.version` line is at exactly 2-space indent in every
      # blueprint.yaml (audited 2026-05-18 across all 71 files in
      # platform/ + products/). We key on `^  version:` with a defensive
      # parse + post-write verify.
      - name: "Lockstep-bump blueprint.yaml spec.version for ${{ steps.chart.outputs.name }}"
        if: steps.chart.outputs.skip != 'true'
        id: bump_blueprint
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          CHART_PATH: ${{ matrix.path }}
        run: |
          set -euo pipefail

          # Try the two canonical blueprint.yaml locations in order.
          # Each Blueprint folder uses exactly one shape; never both.
          bp_file=""
          for candidate in "${CHART_PATH}/blueprint.yaml" "${CHART_PATH}/chart/blueprint.yaml"; do
            if [ -f "$candidate" ]; then
              bp_file="$candidate"
              break
            fi
          done

          if [ -z "$bp_file" ]; then
            echo "INFO: no blueprint.yaml at ${CHART_PATH}/blueprint.yaml or ${CHART_PATH}/chart/blueprint.yaml — graceful no-op (chart has no Blueprint manifest, e.g. the products/catalyst umbrella)."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Sanity: this file must actually be a Blueprint manifest (kind:
          # Blueprint), not some other YAML co-located in the folder.
          # Without this guard, a stray non-Blueprint blueprint.yaml (the
          # CRD definition file we saw at products/catalyst/chart/crds/
          # is an example of a generic name-collision) would be rewritten
          # incorrectly.
          bp_kind=$(awk '/^kind:/{print $2; exit}' "$bp_file" | tr -d '"')
          if [ "$bp_kind" != "Blueprint" ]; then
            echo "INFO: ${bp_file} kind='${bp_kind}' — not a Blueprint manifest, graceful no-op."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Read current spec.version. The blueprint.yaml convention is:
          #
          #   spec:
          #     version: <semver>     ← 2 spaces, single `version:` line
          #
          # The 2-space indent is anchored start-of-line so any deeper-
          # indented `version:` (inside spec.upgrades.from[], etc.) cannot
          # accidentally match.
          current=$(awk '/^  version:/{print $2; exit}' "$bp_file" | tr -d '"')
          if [ -z "$current" ]; then
            echo "::error title=Unparseable blueprint.yaml spec.version::No '  version:' line at 2-space indent in $bp_file. The Blueprint manifest shape changed under TBD-A20's lockstep hook; refusing to write."
            exit 1
          fi

          if [ "$current" = "$CHART_VERSION" ]; then
            echo "INFO: ${bp_file} already at spec.version=${CHART_VERSION} — no-op."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            # Still emit the path so downstream steps know about it.
            echo "bp_file=${bp_file}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Lockstep-bumping ${bp_file}: spec.version ${current} → ${CHART_VERSION}"
          sed -i -E "s|^  version: .*\$|  version: ${CHART_VERSION}|" "$bp_file"

          # Verify the sed actually flipped the line.
          new=$(awk '/^  version:/{print $2; exit}' "$bp_file" | tr -d '"')
          if [ "$new" != "$CHART_VERSION" ]; then
            echo "::error title=blueprint.yaml sed failed::After rewrite, ${bp_file} still has spec.version='${new}', expected '${CHART_VERSION}'."
            exit 1
          fi

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "bp_file=${bp_file}" >> "$GITHUB_OUTPUT"
          echo "prev_version=${current}" >> "$GITHUB_OUTPUT"

      - name: "Commit + push bootstrap-kit pin bump + blueprint.yaml lockstep"
        # Run if either side has staged changes — usually they bump in
        # tandem, but a kit-only chart (no blueprint.yaml) or a non-kit
        # leaf (no pin file) might bump only one. Either is sufficient
        # to commit.
        if: steps.chart.outputs.skip != 'true' && (steps.bump_pin.outputs.bumped == 'true' || steps.bump_blueprint.outputs.bumped == 'true')
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          PIN_FILE: ${{ steps.bump_pin.outputs.pin_file }}
          PREV_VERSION: ${{ steps.bump_pin.outputs.prev_version }}
          BP_FILE: ${{ steps.bump_blueprint.outputs.bp_file }}
          BP_PREV_VERSION: ${{ steps.bump_blueprint.outputs.prev_version }}
          PIN_BUMPED: ${{ steps.bump_pin.outputs.bumped }}
          BP_BUMPED: ${{ steps.bump_blueprint.outputs.bumped }}
        run: |
          set -euo pipefail
          git config user.name "hatiyildiz"
          git config user.email "hatiyildiz@users.noreply.github.com"

          # Idempotent reset-and-rewrite on push conflict — parallel
          # matrix jobs (multiple Blueprints bumped in one push) can race
          # on the same branch. On conflict we re-fetch, re-sed against
          # whatever state is currently on origin/main, and re-commit.
          # The operation is convergent: every retry produces the same
          # final state (pin=CHART_VERSION, blueprint=CHART_VERSION).
          rewrite_pin() {
            local pf="$1"
            local cur
            cur=$(awk '/^      version:/{print $2; exit}' "$pf" | tr -d '"')
            if [ "$cur" = "${CHART_VERSION}" ]; then
              return 1  # already there
            fi
            sed -i -E "s|^      version: .*\$|      version: ${CHART_VERSION}|" "$pf"
            return 0
          }
          rewrite_blueprint() {
            local bp="$1"
            local cur
            cur=$(awk '/^  version:/{print $2; exit}' "$bp" | tr -d '"')
            if [ "$cur" = "${CHART_VERSION}" ]; then
              return 1
            fi
            sed -i -E "s|^  version: .*\$|  version: ${CHART_VERSION}|" "$bp"
            return 0
          }

          # Stage whichever files were rewritten.
          if [ "${PIN_BUMPED}" = "true" ] && [ -n "${PIN_FILE}" ]; then
            git add "${PIN_FILE}"
          fi
          if [ "${BP_BUMPED}" = "true" ] && [ -n "${BP_FILE}" ]; then
            git add "${BP_FILE}"
          fi

          if git diff --staged --quiet; then
            echo "no staged changes — already in sync"
            exit 0
          fi

          # Compose commit message. Pin bump remains the primary subject
          # (preserves the existing `deploy(<chart>): bump bootstrap-kit
          # pin X -> Y (auto, Refs TBD-A6)` shape used by every existing
          # automation). The blueprint.yaml lockstep is mentioned as a
          # secondary line so consumers parsing recent log subjects
          # don't see a format change. When ONLY blueprint.yaml bumps
          # (chart not in the kit), the subject acknowledges TBD-A20.
          #
          # IMPORTANT YAML/SHELL SEAM (TBD-A23 root cause, issue #1864):
          # The bash multi-line string MUST NOT span literal newlines in
          # this `run: |` block-scalar. The previous shape used a real
          # newline inside `msg="..."` with the continuation line at
          # column 1, which YAML interpreted as the END of the block
          # scalar — every push since cf35b4a (PR #1858) failed with
          # `startup_failure / jobs: []` until the workflow was reverted
          # to a parseable shape. Use printf with `\n` escapes so the
          # multi-line commit message body is built at shell time
          # without disturbing the surrounding YAML indent.
          if [ "${PIN_BUMPED}" = "true" ] && [ "${BP_BUMPED}" = "true" ]; then
            msg=$(printf 'deploy(%s): bump bootstrap-kit pin %s -> %s (auto, Refs TBD-A6)\n\nAlso locksteps platform blueprint.yaml spec.version %s -> %s (Refs TBD-A20, #1856).' \
              "${CHART_NAME}" "${PREV_VERSION}" "${CHART_VERSION}" "${BP_PREV_VERSION}" "${CHART_VERSION}")
          elif [ "${PIN_BUMPED}" = "true" ]; then
            msg="deploy(${CHART_NAME}): bump bootstrap-kit pin ${PREV_VERSION} -> ${CHART_VERSION} (auto, Refs TBD-A6)"
          else
            # Only blueprint.yaml moved — chart is not in the bootstrap kit
            # (e.g. an opt-in Application Blueprint like bp-velero, bp-vllm).
            msg="deploy(${CHART_NAME}): lockstep blueprint.yaml spec.version ${BP_PREV_VERSION} -> ${CHART_VERSION} (auto, Refs TBD-A20, #1856)"
          fi
          git commit -m "${msg}"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed lockstep bump for ${CHART_NAME}=${CHART_VERSION} (pin=${PIN_BUMPED}, blueprint=${BP_BUMPED})"
              exit 0
            fi
            echo "push attempt $i failed — re-fetching origin/main and re-applying lockstep"
            git fetch origin main
            git reset --hard origin/main

            did_pin=0
            did_bp=0
            if [ "${PIN_BUMPED}" = "true" ] && [ -n "${PIN_FILE}" ]; then
              if rewrite_pin "${PIN_FILE}"; then
                git add "${PIN_FILE}"
                did_pin=1
              fi
            fi
            if [ "${BP_BUMPED}" = "true" ] && [ -n "${BP_FILE}" ]; then
              if rewrite_blueprint "${BP_FILE}"; then
                git add "${BP_FILE}"
                did_bp=1
              fi
            fi
            if [ "$did_pin" -eq 0 ] && [ "$did_bp" -eq 0 ]; then
              echo "origin/main already at ${CHART_VERSION} — nothing to push"
              exit 0
            fi
            if git diff --staged --quiet; then
              echo "no changes after re-fetch — already at ${CHART_VERSION} on origin/main"
              exit 0
            fi
            if [ "$did_pin" -eq 1 ] && [ "$did_bp" -eq 1 ]; then
              git commit -m "deploy(${CHART_NAME}): bump bootstrap-kit pin -> ${CHART_VERSION} + blueprint.yaml lockstep (auto, Refs TBD-A6 + TBD-A20, retry $i)"
            elif [ "$did_pin" -eq 1 ]; then
              git commit -m "deploy(${CHART_NAME}): bump bootstrap-kit pin -> ${CHART_VERSION} (auto, Refs TBD-A6, retry $i)"
            else
              git commit -m "deploy(${CHART_NAME}): lockstep blueprint.yaml spec.version -> ${CHART_VERSION} (auto, Refs TBD-A20, retry $i)"
            fi
          done
          echo "::error title=Lockstep push failed::3 attempts exhausted for ${CHART_NAME}=${CHART_VERSION}."
          exit 1

      - name: Summary
        if: steps.chart.outputs.skip != 'true'
        run: |
          echo "✓ Blueprint published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Name:** ${{ steps.chart.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${{ steps.chart.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **OCI ref:** \`${{ steps.push.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest:** \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cosigned:** ✓ (keyless via GitHub OIDC)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SBOM attested:** ✓ (SPDX-JSON)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Subchart guards:** ✓ working tree, ✓ packaged tgz, ✓ pulled OCI artifact, ✓ helm template smoke" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.bump_pin.outputs.bumped }}" = "true" ]; then
            echo "- **Bootstrap-kit pin:** ✓ auto-bumped \`${{ steps.bump_pin.outputs.pin_file }}\` ${{ steps.bump_pin.outputs.prev_version }} → ${{ steps.chart.outputs.version }} (TBD-A6 meta-fix)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Bootstrap-kit pin:** (chart is not in the kit — opt-in Application Blueprint, no pin to bump)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.bump_blueprint.outputs.bumped }}" = "true" ]; then
            echo "- **Blueprint.yaml lockstep:** ✓ auto-bumped \`${{ steps.bump_blueprint.outputs.bp_file }}\` spec.version ${{ steps.bump_blueprint.outputs.prev_version }} → ${{ steps.chart.outputs.version }} (TBD-A20, #1856)" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ steps.bump_blueprint.outputs.bp_file }}" ]; then
            echo "- **Blueprint.yaml lockstep:** (already at ${{ steps.chart.outputs.version }}, no-op)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Blueprint.yaml lockstep:** (chart has no platform/<bp>/blueprint.yaml — e.g. products/catalyst umbrella)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # #4049 — BASTION HARBOR WARMUP for COMPONENT images. After any bp-* chart
  # publishes here (every `platform/<name>/chart/**` or `products/<name>/chart/**`
  # push to main — including the wordpress-tenant chart re-pin that carries a
  # freshly-built private `wordpress-tenant-pg` runtime tag), re-warm the bastion
  # Harbor's hosted `openova-io` project with the FULL private image set. Without
  # this, a private component tag bumped outside catalyst-build's trigger paths
  # was never pushed to the bastion → the node cold-pulled it DIRECT from ghcr on
  # a fresh prov (2.3 MB/s, frequent reset) → 20+ minute pulls (live on the
  # omantel.biz demo Org's pg-driver). The warmup is DATA-DRIVEN over every
  # pinned `platform/**`/`products/**` values.yaml image, so it covers whichever
  # component just published — no per-blueprint wiring needed. No catalyst_sha is
  # passed (this is the component path, not a catalyst build); the chart render +
  # component extraction cover everything. continue-on-error lives in the
  # reusable workflow's job, so a partial warmup never fails the release.
  #
  # `if: always() && matrix non-empty` so the warmup still runs the broad re-warm
  # even if one matrix `build` leg failed (fail-fast is off) — it warms whatever
  # DID land. It is skipped only when nothing changed (empty matrix).
  warmup-bastion-harbor:
    needs: [detect, build]
    if: ${{ always() && needs.detect.outputs.matrix != '{"include":[]}' }}
    uses: ./.github/workflows/warmup-bastion-harbor.yaml
    secrets:
      bastion_harbor_robot_token: ${{ secrets.BASTION_HARBOR_ROBOT_TOKEN }}
