# cut-release-candidate.yaml - cut the release candidate rc/<id> from one commit of main.
#
# The rules are in scripts/release-candidate.sh. A pull request that changes the tool, its
# test, the chart-content check it calls (scripts/check-chart-content-after-version.py and its
# allow list) or this file runs the test only. A run started by hand runs the test, then
# "release-candidate.sh cut", and writes the candidate into the job summary. The cut needs the
# whole history of main (fetch-depth: 0): the chart-content check reads it.
#
# The cut pushes rc/<id> with the release-writer deploy key (the secret RELEASE_WRITER_KEY,
# through .github/actions/use-release-writer), never with the workflow token: the ruleset
# .github/rulesets/rc.json lets only a deploy key create a ref under rc/. A run with dry_run
# set to true runs every check of the cut and pushes nothing.
#
# Check 5 of the coherence script reads the origin's hosted project (every first-party image the
# kit pins must be there with the digest ghcr has) as the warmup's robot, robot$openova-warmup
# (the secret BASTION_HARBOR_ROBOT_TOKEN, the same one .github/workflows/warmup-bastion-harbor.yaml
# pushes with), and ghcr with the workflow token. Without them the cut is "could not be measured".
name: cut-release-candidate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit of main to cut. Empty means the head of main.
        required: false
        default: ''
        type: string
      dry_run:
        description: Run every check of the cut and push nothing.
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'scripts/release-candidate.sh'
      - 'scripts/test-release-candidate.sh'
      - 'scripts/check-chart-content-after-version.py'
      - 'scripts/chart-content-after-version.allow'
      - '.github/workflows/cut-release-candidate.yaml'

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: release-candidate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Every exit code of the tool is proven
        run: bash scripts/test-release-candidate.sh

  cut:
    name: cut
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up the Go of tools/guards (the image list and the registry walk)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tools/guards/go.mod
          cache: false
      - name: Install PyYAML and yq
        run: |
          set -e
          pip install --quiet pyyaml
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
          helm version --short
      - name: Push access for rc/<id>
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/use-release-writer
        with:
          key: ${{ secrets.RELEASE_WRITER_KEY }}
      - name: Cut
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_USER: 'robot$openova-warmup'
          ORIGIN_TOKEN: ${{ secrets.BASTION_HARBOR_ROBOT_TOKEN }}
          COMMIT: ${{ inputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(cut)
          if [ -n "$COMMIT" ]; then args+=(--commit "$COMMIT"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          rc=0
          id="$(bash scripts/release-candidate.sh "${args[@]}")" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "No candidate: release-candidate.sh cut exited $rc. The log of this step says why." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: rc/$id would be cut. Nothing was pushed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Candidate: rc/$id" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
