name: fingate — vet, test and generated code (PRD-106)

# The pull-request gate of the open-banking product, products/fingate.
#
#   go vet ./...            finds nothing;
#   go test -count=1 ./...  passes, and at least one test function ran;
#   go generate ./...       run in every Go module under products/fingate,
#                           changes no file and adds no file;
#   go test with PostgreSQL every test passes against a real database, no test
#                           or subtest is skipped, and the PostgreSQL store's
#                           port tests ran (TestPostgresPassesThePortTests).
#
# The third rule keeps generated code honest: a generated file is never edited
# by hand, and a change to a generator input commits the regenerated output in
# the same pull request. While the folder has no go:generate directive the rule
# holds trivially; the job prints how many directives the folder holds.
#
# Each job first proves on throw-away modules that its check can fail, one case
# per rule, and that it passes a clean module. Then it checks the product.
#
# The module's tests also run in the go-modules matrix of test-ungated-trees.yaml.

on:
  pull_request:
    paths:
      - 'products/fingate/**'
      - '.github/workflows/fingate-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'products/fingate/**'
      - '.github/workflows/fingate-ci.yaml'

permissions:
  contents: read

concurrency:
  group: fingate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet-test:
    name: go vet and go test — products/fingate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: products/fingate/go.mod
          cache-dependency-path: products/fingate/go.sum

      - name: go vet and go test, after a self-test
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # check <module folder>: fails on a vet finding, a failed test, or no test that ran.
          check() {
            ( cd "$1" && go vet ./... ) || { echo "::error::$1: go vet found a problem"; return 1; }
            out="$(mktemp -p "$tmp")"
            rc=0
            ( cd "$1" && go test -count=1 -v ./... ) > "$out" 2>&1 || rc=$?
            cat "$out"
            n="$(grep -c '^--- PASS' "$out" || true)"
            echo "::notice::$1 ran ${n} test functions"
            if [ "$rc" -ne 0 ]; then echo "::error::$1: the tests failed, exit code ${rc}"; return 1; fi
            if [ "$n" -eq 0 ]; then echo "::error::$1: no test function ran"; return 1; fi
          }
          go_line="$(grep -m1 '^go ' products/fingate/go.mod)"
          # fixture <want>: a throw-away module whose test expects Two() to be <want>; no test file when <want> is empty.
          fixture() {
            d="$(mktemp -d -p "$tmp")"
            printf 'module example.invalid/selftest\n\n%s\n' "$go_line" > "$d/go.mod"
            printf 'package selftest\n\nfunc Two() int { return 2 }\n' > "$d/two.go"
            if [ -n "$1" ]; then
              printf 'package selftest\n\nimport "testing"\n\nfunc TestTwo(t *testing.T) {\n\tif Two() != %s {\n\t\tt.Fatal("two")\n\t}\n}\n' "$1" > "$d/two_test.go"
            fi
            echo "$d"
          }
          log="$(mktemp -p "$tmp")"
          check "$(fixture 2)" > "$log" 2>&1 || { cat "$log"; echo "::error::self-test: a clean module failed"; exit 1; }
          vet="$(fixture 2)"
          printf 'package selftest\n\nimport "fmt"\n\nfunc Show() { fmt.Printf("%%d\\n", "two") }\n' > "$vet/show.go"
          for d in "$vet" "$(fixture 3)" "$(fixture '')"; do
            if check "$d" > "$log" 2>&1; then cat "$log"; echo "::error::self-test: ${d} passed and must fail"; exit 1; fi
          done
          echo "self-test: a clean module passes; a vet finding, a failed test and a module without tests fail"
          check products/fingate

  postgres:
    name: go test with PostgreSQL — products/fingate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fingate
          POSTGRES_PASSWORD: fingate
          POSTGRES_DB: fingate_test
        options: >-
          --health-cmd "pg_isready -U fingate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      # The tests of the PostgreSQL store skip without this address; here a skip fails the job.
      FINGATE_TEST_DATABASE_URL: postgres://fingate:fingate@localhost:5432/fingate_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: products/fingate/go.mod
          cache-dependency-path: products/fingate/go.sum

      - name: go test against PostgreSQL with no skipped test, after a self-test
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # check <module folder> <test>: fails on a failed test, on a skipped test or subtest,
          # and when the top-level test <test> did not pass.
          check() {
            out="$(mktemp -p "$tmp")"
            rc=0
            ( cd "$1" && go test -count=1 -v ./... ) > "$out" 2>&1 || rc=$?
            cat "$out"
            s="$(grep -c -E '^ *--- SKIP' "$out" || true)"
            echo "::notice::$1 skipped ${s} tests"
            if [ "$rc" -ne 0 ]; then echo "::error::$1: the tests failed, exit code ${rc}"; return 1; fi
            if [ "$s" -ne 0 ]; then
              grep -E '^ *--- SKIP' "$out" | sed 's/^ */::error::skipped: /'
              echo "::error::$1: ${s} tests were skipped; with a database every test must run"
              return 1
            fi
            if ! grep -q -E "^--- PASS: $2 " "$out"; then echo "::error::$1: the test $2 did not pass"; return 1; fi
          }
          go_line="$(grep -m1 '^go ' products/fingate/go.mod)"
          # fixture <statement>: a throw-away module whose one test TestDB runs <statement>.
          fixture() {
            d="$(mktemp -d -p "$tmp")"
            printf 'module example.invalid/selftest\n\n%s\n' "$go_line" > "$d/go.mod"
            printf 'package selftest\n\nimport "testing"\n\nfunc TestDB(t *testing.T) {\n\t%s\n}\n' "$1" > "$d/db_test.go"
            echo "$d"
          }
          log="$(mktemp -p "$tmp")"
          check "$(fixture 't.Log("ran")')" TestDB > "$log" 2>&1 || { cat "$log"; echo "::error::self-test: a clean module failed"; exit 1; }
          for d in "$(fixture 't.Skip("no database")')" "$(fixture 't.Run("sub", func(t *testing.T) { t.Skip("no database") })')" "$(fixture 't.Fatal("broken")')"; do
            if check "$d" TestDB > "$log" 2>&1; then cat "$log"; echo "::error::self-test: ${d} passed and must fail"; exit 1; fi
          done
          if check "$(fixture 't.Log("ran")')" TestOther > "$log" 2>&1; then cat "$log"; echo "::error::self-test: a module without the named test passed"; exit 1; fi
          echo "self-test: a clean module passes; a skipped test, a skipped subtest, a failed test and a missing named test fail"
          check products/fingate TestPostgresPassesThePortTests

  generate:
    name: go generate changes nothing — products/fingate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: products/fingate/go.mod
          cache-dependency-path: products/fingate/go.sum

      - name: go generate leaves the folder unchanged, after a self-test
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # drift <repository> <folder>: run go generate ./... in every Go module under <folder>,
          # then fail when a file under <folder> changed or appeared.
          drift() {
            mods="$(cd "$1" && git ls-files -- "$2/go.mod" "$2/*/go.mod" | xargs -r -n1 dirname | sort -u)"
            if [ -z "$mods" ]; then echo "::error::no Go module under $2"; return 1; fi
            for m in $mods; do
              echo "go generate ./... in $m"
              ( cd "$1/$m" && go generate ./... ) || { echo "::error::go generate failed in $m"; return 1; }
            done
            changed="$(cd "$1" && git status --porcelain --untracked-files=all -- "$2")"
            if [ -n "$changed" ]; then
              printf '%s\n' "$changed"
              ( cd "$1" && git --no-pager diff -- "$2" )
              echo "::error::go generate changed the files above. Run go generate ./... in each Go module under $2 and commit the result."
              return 1
            fi
          }
          go_line="$(grep -m1 '^go ' products/fingate/go.mod)"
          # repo <committed out.txt>: a throw-away repository whose module generates out.txt with the text "generated";
          # out.txt is committed with the given text, or not at all when it is empty.
          repo() {
            r="$(mktemp -d -p "$tmp")"
            mkdir "$r/p"
            printf 'module example.invalid/selftest\n\n%s\n' "$go_line" > "$r/p/go.mod"
            printf 'package selftest\n\n//go:generate sh -c "echo generated > out.txt"\n' > "$r/p/gen.go"
            if [ -n "$1" ]; then printf '%s\n' "$1" > "$r/p/out.txt"; fi
            git -C "$r" -c init.defaultBranch=main init -q
            git -C "$r" add .
            git -C "$r" -c user.name=self-test -c user.email=self-test@example.invalid commit -q -m base
            echo "$r"
          }
          log="$(mktemp -p "$tmp")"
          drift "$(repo generated)" p > "$log" 2>&1 || { cat "$log"; echo "::error::self-test: an up-to-date module failed"; exit 1; }
          for r in "$(repo stale)" "$(repo '')"; do
            if drift "$r" p > "$log" 2>&1; then cat "$log"; echo "::error::self-test: ${r} passed and must fail"; exit 1; fi
          done
          echo "self-test: up-to-date output passes; changed output and new output fail"
          n="$( (git grep -h '^//go:generate ' -- 'products/fingate/*.go' || true) | wc -l)"
          echo "::notice::products/fingate holds ${n} go:generate directives"
          drift . products/fingate
