name: cortex — vet, test and the store against PostgreSQL (PRD-202)

# The pull-request gate of the AI hub's document search, products/cortex.
#
#   go vet and go test      go vet finds nothing; go test -count=1 ./... passes and at
#                           least one test function ran (the store's database tests skip
#                           here: no database);
#   go test with PostgreSQL every test passes against the platform's own PostgreSQL image
#                           (platform/postgres/chart/values.yaml: instance.imageName, tag
#                           16, pinned here by digest; it carries the vector extension),
#                           no test or subtest is skipped, and the store's test
#                           TestPostgresStore passed.
#
# The image has no entry point that creates a database, so the job starts it with initdb
# and postgres on the runner's loopback address (host network, nothing published), the way
# spikes PRD-060 and PRD-061 ran it. Each job first proves on throw-away modules that its
# check can fail, one case per rule, and that it passes a clean module.

on:
  pull_request:
    paths:
      - 'products/cortex/**'
      - '.github/workflows/cortex-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'products/cortex/**'
      - '.github/workflows/cortex-ci.yaml'

permissions:
  contents: read

concurrency:
  group: cortex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet-test:
    name: go vet and go test — products/cortex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: products/cortex/go.mod
          cache-dependency-path: products/cortex/go.sum

      - name: go vet and go test, after a self-test
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # check <module folder>: fails on a vet finding, a failed test, or no test that ran.
          check() {
            ( cd "$1" && go vet ./... ) || { echo "::error::$1: go vet found a problem"; return 1; }
            out="$(mktemp -p "$tmp")"
            rc=0
            ( cd "$1" && go test -count=1 -v ./... ) > "$out" 2>&1 || rc=$?
            cat "$out"
            n="$(grep -c '^--- PASS' "$out" || true)"
            echo "::notice::$1 ran ${n} test functions"
            if [ "$rc" -ne 0 ]; then echo "::error::$1: the tests failed, exit code ${rc}"; return 1; fi
            if [ "$n" -eq 0 ]; then echo "::error::$1: no test function ran"; return 1; fi
          }
          go_line="$(grep -m1 '^go ' products/cortex/go.mod)"
          # fixture <want>: a throw-away module whose test expects Two() to be <want>; no test file when <want> is empty.
          fixture() {
            d="$(mktemp -d -p "$tmp")"
            printf 'module example.invalid/selftest\n\n%s\n' "$go_line" > "$d/go.mod"
            printf 'package selftest\n\nfunc Two() int { return 2 }\n' > "$d/two.go"
            if [ -n "$1" ]; then
              printf 'package selftest\n\nimport "testing"\n\nfunc TestTwo(t *testing.T) {\n\tif Two() != %s {\n\t\tt.Fatal("two")\n\t}\n}\n' "$1" > "$d/two_test.go"
            fi
            echo "$d"
          }
          log="$(mktemp -p "$tmp")"
          check "$(fixture 2)" > "$log" 2>&1 || { cat "$log"; echo "::error::self-test: a clean module failed"; exit 1; }
          vet="$(fixture 2)"
          printf 'package selftest\n\nimport "fmt"\n\nfunc Show() { fmt.Printf("%%d\\n", "two") }\n' > "$vet/show.go"
          for d in "$vet" "$(fixture 3)" "$(fixture '')"; do
            if check "$d" > "$log" 2>&1; then cat "$log"; echo "::error::self-test: ${d} passed and must fail"; exit 1; fi
          done
          echo "self-test: a clean module passes; a vet finding, a failed test and a module without tests fail"
          check products/cortex

  postgres:
    name: go test with PostgreSQL — products/cortex
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The platform's PostgreSQL image, tag 16, pinned by digest (PostgreSQL 16.15, vector 0.8.6).
      PG_IMAGE: ghcr.io/cloudnative-pg/postgresql@sha256:34cd4159d07b3410a1b29da35072e2e927a0905e717a61afa3814624a2e8859a
      # The store's tests skip without this address; here a skip fails the job.
      CORTEX_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: products/cortex/go.mod
          cache-dependency-path: products/cortex/go.sum

      - name: Start PostgreSQL with the vector extension on 127.0.0.1:5432
        run: |
          set -euo pipefail
          docker pull --quiet "$PG_IMAGE"
          docker run -d --name pg --network host --entrypoint bash "$PG_IMAGE" -c \
            'set -e; bin="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
             "$bin/initdb" -D /tmp/pgdata -U postgres --auth=trust --encoding=UTF8 --no-locale >/dev/null
             exec "$bin/postgres" -D /tmp/pgdata -c listen_addresses=127.0.0.1 -c port=5432 -c unix_socket_directories=/tmp'
          for _ in $(seq 1 60); do
            if docker exec pg bash -c '"$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)/pg_isready" -h 127.0.0.1 -p 5432 -q'; then
              docker exec pg bash -c '"$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)/postgres" --version'
              exit 0
            fi
            sleep 1
          done
          docker logs pg 2>&1 | tail -50
          echo "::error::PostgreSQL did not become ready"
          exit 1

      - name: go test against PostgreSQL with no skipped test, after a self-test
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # check <module folder> <test>: fails on a failed test, on a skipped test or subtest,
          # and when the top-level test <test> did not pass.
          check() {
            out="$(mktemp -p "$tmp")"
            rc=0
            ( cd "$1" && go test -count=1 -v ./... ) > "$out" 2>&1 || rc=$?
            cat "$out"
            s="$(grep -c -E '^ *--- SKIP' "$out" || true)"
            echo "::notice::$1 skipped ${s} tests"
            if [ "$rc" -ne 0 ]; then echo "::error::$1: the tests failed, exit code ${rc}"; return 1; fi
            if [ "$s" -ne 0 ]; then
              grep -E '^ *--- SKIP' "$out" | sed 's/^ */::error::skipped: /'
              echo "::error::$1: ${s} tests were skipped; with a database every test must run"
              return 1
            fi
            if ! grep -q -E "^--- PASS: $2 " "$out"; then echo "::error::$1: the test $2 did not pass"; return 1; fi
          }
          go_line="$(grep -m1 '^go ' products/cortex/go.mod)"
          # fixture <statement>: a throw-away module whose one test TestDB runs <statement>.
          fixture() {
            d="$(mktemp -d -p "$tmp")"
            printf 'module example.invalid/selftest\n\n%s\n' "$go_line" > "$d/go.mod"
            printf 'package selftest\n\nimport "testing"\n\nfunc TestDB(t *testing.T) {\n\t%s\n}\n' "$1" > "$d/db_test.go"
            echo "$d"
          }
          log="$(mktemp -p "$tmp")"
          check "$(fixture 't.Log("ran")')" TestDB > "$log" 2>&1 || { cat "$log"; echo "::error::self-test: a clean module failed"; exit 1; }
          for d in "$(fixture 't.Skip("no database")')" "$(fixture 't.Run("sub", func(t *testing.T) { t.Skip("no database") })')" "$(fixture 't.Fatal("broken")')"; do
            if check "$d" TestDB > "$log" 2>&1; then cat "$log"; echo "::error::self-test: ${d} passed and must fail"; exit 1; fi
          done
          if check "$(fixture 't.Log("ran")')" TestOther > "$log" 2>&1; then cat "$log"; echo "::error::self-test: a module without the named test passed"; exit 1; fi
          echo "self-test: a clean module passes; a skipped test, a skipped subtest, a failed test and a missing named test fail"
          check products/cortex TestPostgresStore

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f pg >/dev/null 2>&1 || true
