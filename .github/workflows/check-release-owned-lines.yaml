name: check-release-owned-lines

# CI is the only writer of chart versions and the pins that follow them
# (FND-011). After a merge, the release writer in blueprint-release.yaml bumps
# a changed chart's version and moves its blueprint.yaml, its catalog-seed
# entry, the generated catalog and its bootstrap-kit pin in one commit. A pull
# request may add or delete a whole chart, Blueprint, seed entry or slot file;
# it may not change a version value of one that exists before and after it.
# The rules are in the head of scripts/check-release-owned-lines.py.
#
# The job `push` stays idle until the repository variable RELEASE_WRITER_LOGIN
# exists. It is set when the rulesets are applied and the merge queue is
# switched on; its value is not compared. The one bypass actor of the ruleset
# is the release-writer deploy key, and a push with a deploy key carries the
# login of the person who added the key. So the job judges what a push that did
# not come from the queue changes: only release-owned lines and new gate
# records (rules P1 and P2 in the head of the script, FND-025). A push whose
# head commit holds [skip ci] starts no run, and every release-writer commit
# holds it; so each run also judges, commit by commit, every commit after the
# head of the previous run (rule P3). The API read of that run needs
# actions: read.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr:
    name: no release-owned value changes in a pull request
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove the guard can fail
        run: python3 scripts/check-release-owned-lines.py --self-test

      - name: No release-owned value changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check-release-owned-lines.py pr --base "$BASE_SHA" --head "$HEAD_SHA"

  push:
    name: a push to main outside the merge queue changes only release-owned lines
    if: github.event_name == 'push' && vars.RELEASE_WRITER_LOGIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove the guard can fail
        run: python3 scripts/check-release-owned-lines.py --self-test

      - name: What the push changed, and every push since the previous run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_ACTOR: ${{ github.actor }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          SINCE_SHA="$(python3 scripts/check-release-owned-lines.py previous-run --run-id "$GITHUB_RUN_ID")"
          python3 scripts/check-release-owned-lines.py push --actor "$PUSH_ACTOR" --since "$SINCE_SHA" --before "$BEFORE_SHA" --after "$AFTER_SHA"
