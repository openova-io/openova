# Spike PRD-070 (lab test, never merged): does the pinned chat interface
# forward the signed-in user's access token to a custom OpenAI-compatible
# endpoint?
#
# Runs only on a push to the spike branch. Everything happens in containers
# inside this job: no cloud account, no secret, no cluster outside CI.
# Arm "pinned" runs the LibreChat image that platform/librechat pins today.
# Arm "newest" runs the newest upstream release, for contrast. Both use the
# same configuration, a test realm on the Keycloak version bp-keycloak pins,
# a stub endpoint that prints the Authorization header, and a real browser.
name: spike-prd-070

on:
  push:
    branches: [spike/PRD-070]

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.arm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The image bp-librechat pins (read from the chart below).
          - arm: pinned
            reuse: "true"
          # The newest upstream release. Upstream moved from danny-avila to
          # LibreChat-AI; new tags are published under the new owner only.
          - arm: newest
            image: ghcr.io/librechat-ai/librechat:v0.8.8
            reuse: "true"
          # Same newest image without OPENID_REUSE_TOKENS: is the flag needed?
          - arm: newest-no-reuse
            image: ghcr.io/librechat-ai/librechat:v0.8.8
            reuse: "false"
    env:
      MONGO_IMAGE: mongo:7.0.14
      STUB_IMAGE: python:3.12.7-slim
      PLAYWRIGHT_VERSION: 1.49.1
      EXPIRY_WAIT: "100"
      OUT: ${{ github.workspace }}/out
      PW_DIR: /tmp/pw-spike-prd-070
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read the platform pins
        run: |
          set -euo pipefail
          LC_PINNED="$(yq '.librechat.image.repository' platform/librechat/chart/values.yaml):$(yq '.librechat.image.tag' platform/librechat/chart/values.yaml)"
          KC_TAG=$(yq '.keycloak.image.tag' platform/keycloak/chart/values.yaml)
          KC_VERSION=${KC_TAG%%-*}
          IMAGE="${{ matrix.image }}"
          if [ -z "$IMAGE" ]; then IMAGE=$LC_PINNED; fi
          case "${IMAGE##*:}" in
            v0.7.*) CONFIG_VERSION=1.1.7 ;;
            *) CONFIG_VERSION=1.3.17 ;;
          esac
          echo "bp-librechat pins $LC_PINNED; this arm runs $IMAGE (config version $CONFIG_VERSION, OPENID_REUSE_TOKENS=${{ matrix.reuse }})"
          echo "bp-keycloak pins keycloak $KC_TAG; the test realm runs quay.io/keycloak/keycloak:$KC_VERSION"
          {
            echo "LC_IMAGE=$IMAGE"
            echo "CONFIG_VERSION=$CONFIG_VERSION"
            echo "KC_VERSION=$KC_VERSION"
          } >> "$GITHUB_ENV"

      - name: Registry facts (which tags exist under each image path)
        if: matrix.arm == 'pinned'
        continue-on-error: true
        run: python3 tests/spikes/PRD-070/tags.py danny-avila/librechat librechat-ai/librechat

      - name: Install tools
        run: |
          set -euo pipefail
          python -m pip install --quiet "pyjwt[crypto]==2.9.0"
          mkdir -p "$PW_DIR"
          cd "$PW_DIR"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --silent "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium >/dev/null
          echo "docker $(docker version --format '{{.Server.Version}}'); node $(node --version); python $(python --version); playwright $(npx playwright --version); pyjwt $(python -c 'import jwt; print(jwt.__version__)')"

      - name: Run the experiment
        run: bash tests/spikes/PRD-070/run.sh "${{ matrix.arm }}" "$LC_IMAGE" "$CONFIG_VERSION" "$KC_VERSION" "${{ matrix.reuse }}"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd-070-${{ matrix.arm }}
          path: |
            out/result.json
            out/summary.md
            out/api-config.json
            out/discovery.json
            out/captured-redacted.jsonl
            out/librechat-redacted.log
            out/cfg/
            out/shots/
          if-no-files-found: warn
