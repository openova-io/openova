# conformance-local.yaml - the local provider pack, brought up on the runner with two regions,
# and the gate suite run on it.
#
# The local pack (infra/providers/local) starts each region's control-plane machine as a
# privileged container on the runner's own Docker and boots it with the shared template; Flux
# then installs the reduced kit clusters/_template/providers/local/kit from the commit under
# test. scripts/local-pack.sh does the work:
#   up         two regions; exit 0 only when the kit core is Ready in both, the console
#              runs in the primary region and answers on the address of the env file, an
#              owner session is minted, and the runner reaches both API servers with the
#              kubeconfigs it writes;
#   discovery  the suite tests/acceptance/sovereign passes its discovery steps D0.1 and D0.2
#              on the pack;
#   claim      a claim of 1 GiB binds on the default storage class of each region (gate
#              check CLD-G11);
#   down       removes every machine, volume and network, also when an earlier step failed.
# Then discovery runs once more: it starts the port forward of the console again when that
# has stopped, and the suite reaches the console through it. Then the gate suite runs on the
# pack through scripts/acceptance-sovereign.sh: --run-in local selects every check of
# docs/ledger/gates.yaml that is expected-fail or required, lists local in runs_in and is a Go
# file of the suite; --journeys '' requests no journey, so the discovery leaves out the steps
# that only the journeys need; --nodes-requested names the nodes that up asked for in each
# region, and check FND-G03 compares them with the Ready nodes. The record is checked with
# scripts/acceptance-gate.py validate-record and uploaded as the artifact
# conformance-local-record; it is never committed. The job fails when the record's result is
# not PASS: a discovery step or a required check that does not pass.
# Then the run in self (FND-155): a Job in the primary region runs the suite image with
# --run-in self, as the conformance Job of a Sovereign does, once the run in local has passed.
# A pull request has no pushed image, so the job builds it from the commit under test, with the
# build context of build-conformance.yaml and tests/acceptance/sovereign/Containerfile, and the
# step of the run loads it into every machine of the primary region and reads its digest there.
# The Job names the image by that digest and never pulls it. It runs under the ServiceAccount
# catalyst-system/catalyst-conformance, whose ClusterRole holds get, list and watch on
# helmreleases, pods, services and nodes, get and list on namespaces, get on the
# CustomResourceDefinitions of the two policy kinds and the policy forbid-nodeport-service of
# either kind (what scripts/check-live-nodeports.sh of check FND-G05 reads besides the Services;
# the legacy ClusterPolicy until the published chart of the ValidatingPolicy reaches the pack),
# and get, create, update and patch on clusterpolicyreports: no pods/exec and no
# Secrets. After the Job the step asks the API server with kubectl auth can-i: the account has
# the Kyverno reads, the namespace read and the report write, and no other
# CustomResourceDefinition or policy, no Secret and no pods/exec. The suite writes the
# ClusterPolicyReport conformance and prints its record into the log of the Job. The step
# passes when the Job completed; the record is valid, ran in self and names this Job as its
# producer, the digest its pod ran and the commit under test; the report carries the record's
# run id and one result per check of the record; and the record's result is PASS. The report,
# the record, the Job, its pod and its log are uploaded as the artifact conformance-self.
# On a failure the evidence of every machine is uploaded as the artifact local-pack-evidence.
# Nothing publishes a port and nothing uses a node port.
#
# No path filter, on purpose: the ruleset of main (.github/rulesets/main.json) requires the
# job by its name, conformance-local, so it must run and pass on every pull request and every
# merge group; a check that did not run is not green.
# One exception, decided inside the job: when every path a pull request or merge group changes
# is docs/ledger/plan.yaml or a file under docs/ledger/plan/ (plan data: tickets, done markers,
# spike records), the step "Decide whether the pack runs" says so in one line and every later
# step is skipped, so the job ends green under the same name in about a minute. Any other path,
# an empty list, or a list that cannot be made runs the job in full.
# Images come from ghcr.io at the versions the kit pins; the job token pulls them. So do the
# kit's charts (bash scripts/local-pack.sh charts lists each release, its chart and its source),
# except the charts of this change: on a pull request or a merge group the same list of changed
# paths goes to up as --changed, and every kit release whose chart folder (platform/<name>/chart,
# products/<name>/chart) or a file:// dependency of it holds a changed path takes its chart from
# the tree of the commit under test instead (the GitRepository flux-system/openova, which
# source-controller packages from that folder); up passes only when each of those is installed
# from the tree (Ready where the region's kit core needs it). The summary of the job names the
# charts that came from the tree and the verdict of each in each region. A pull request or merge
# group whose changed paths could not be listed stops at Up: which charts it changes is unknown.
# A change of the tree path itself (scripts/local-pack.sh or this file) also lists
# platform/kyverno-policies/chart/Chart.yaml, so its own run installs bp-kyverno-policies, a
# release of the kit core, from the tree in both regions: a change of the path is proven by a run
# of it. The HelmChart of a release is read by its full name helmcharts.source.toolkit.fluxcd.io:
# on k3s the short name helmchart names the HelmChart kind of helm.cattle.io instead.
# The console's API, catalyst-api, runs the image the chart of the console release names, the
# one main published, except when the change touches a path that image is built from (the
# Containerfile products/catalyst/bootstrap/api/Containerfile and every source it copies, as
# catalyst-build.yaml builds it; bash scripts/local-pack.sh charts names the source of the image
# on its last line): then Up builds the image from this tree (about three minutes on the runner),
# never pushes it, loads it into the containerd of k3s on every machine of the pack, gives the
# console release its tag, and passes only when every pod of catalyst-api in the primary region
# runs it, by digest. The summary of the job names the image the API ran and its digest. A change
# of that path itself (scripts/local-pack.sh or this file) also lists the Containerfile, so its
# own run builds and runs the catalyst-api image of the tree.
name: conformance-local

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: conformance-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance-local:
    name: conformance-local
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The suite image of the run in self. It is built here and never pushed.
      SELF_IMAGE: ghcr.io/openova-io/openova/conformance:local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The changed paths are listed the way policy-chart-tests.yaml lists them: the base commit
      # is fetched and its tree compared with HEAD, here with --no-renames so that a file moved
      # into docs/ledger/plan/ also lists the path it left. scripts/check-plan-only-change.sh
      # decides (its self-test runs in tree-guards.yaml); any exit code but 0 runs the job in
      # full. Every later step holds steps.decide.outputs.run == 'true' in its if.
      - name: Decide whether the pack runs
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          TREE_PROBE: platform/kyverno-policies/chart/Chart.yaml
          API_PROBE: products/catalyst/bootstrap/api/Containerfile
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ] && [ "$EVENT_NAME" != merge_group ]; then
            echo "Event $EVENT_NAME: the job runs in full."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || ! git fetch --no-tags --depth=1 origin "$BASE_SHA" || ! changed="$(git diff --no-renames --name-only "$BASE_SHA" HEAD)"; then
            echo "The changed paths could not be listed: the job runs in full."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif reason="$(printf '%s\n' "$changed" | bash scripts/check-plan-only-change.sh)"; then
            echo "::notice title=conformance-local::Pack and suite skipped, $reason."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "${reason:-full run: the decision script failed}: the job runs in full."
            echo "run=true" >> "$GITHUB_OUTPUT"
            # The kit charts of this change (Up, --changed).
            printf '%s\n' "$changed" > "$RUNNER_TEMP/changed-paths.txt"
            # A change of the tree path itself is proven by its own run on one chart of the kit core.
            if grep -q -x -F -e scripts/local-pack.sh -e .github/workflows/conformance-local.yaml <<< "$changed"; then
              echo "$TREE_PROBE" >> "$RUNNER_TEMP/changed-paths.txt"
              echo "::notice title=conformance-local::This change touches the tree path of the local pack: the list of changed paths also names $TREE_PROBE, so bp-kyverno-policies is installed from the tree."
            fi
            # A change of the API image path itself is proven by its own run on the catalyst-api image of the tree.
            if grep -q -x -F -e scripts/local-pack.sh -e .github/workflows/conformance-local.yaml <<< "$changed"; then
              echo "$API_PROBE" >> "$RUNNER_TEMP/changed-paths.txt"
              echo "::notice title=conformance-local::This change touches the API image path of the local pack: the list of changed paths also names $API_PROBE, so catalyst-api runs the image built from the tree."
            fi
          fi

      - name: Free disk (toolchains this job does not use)
        if: steps.decide.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install OpenTofu
        if: steps.decide.outputs.run == 'true'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.6
          tofu_wrapper: false

      - name: Install kubectl
        if: steps.decide.outputs.run == 'true'
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4

      - name: Install Go (the suite's session minter and discovery)
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tests/acceptance/sovereign/go.mod
          cache: false

      - name: Install PyYAML (the manifest export)
        if: steps.decide.outputs.run == 'true'
        run: python3 -m pip install --quiet pyyaml

      # The kit chart plan of the script reads the kit with yq: the version blueprint-release.yaml
      # installs, so that it reads the files as the release's own steps do.
      - name: Install yq (the release's version)
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version | grep -F v4.44.3

      - name: Self-test of the script
        if: steps.decide.outputs.run == 'true'
        run: bash scripts/local-pack.sh --self-test

      # The machine image, built once for this job with every build step and its time in the log,
      # each attempt bounded and retried (scripts/local-pack.sh image). The additive plan below and
      # Up both run the module with it as machine_image, so the module builds no image: its own
      # build prints nothing and, when a download inside it stalled, held the apply for the
      # provider's whole 20 minutes before it failed.
      - name: Machine image of the pack (built once, used by every apply of this job)
        id: image
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          ref="$(bash scripts/local-pack.sh image)" || { echo "::error::machine image: the build did not finish (see the attempts above)"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Adding a region plans only additions (module contract version 1). OpenTofu applies the
      # local module with the one region of the contract fixture single-region.tfvars.json, then
      # plans the fixture two-region.tfvars.json, which holds the same inputs and one more region,
      # against that state; apply, plan and destroy pass the machine image of the step above, the
      # way Up runs the module. scripts/check-plan-additive.py fails the job when that plan does
      # anything but create resources and leave the others unchanged. These machines use a state
      # of their own under $RUNNER_TEMP/plan-additive and are destroyed before the pack comes up,
      # also after a failure. Each failure of these steps is marked "additive plan:" in the log.
      # Nothing publishes a port and nothing uses a node port.
      - name: Self-test of the additive-plan check
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 scripts/check-plan-additive.py --self-test || { echo "::error::additive plan: the self-test of the check failed"; exit 1; }

      - name: Additive plan, apply one region
        if: steps.decide.outputs.run == 'true'
        env:
          MACHINE_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/plan-additive"
          mkdir -p "$d"
          export TF_DATA_DIR="$d/tofu-data"
          tofu -chdir=infra/providers/local init -input=false -no-color || { echo "::error::additive plan: tofu init failed"; exit 1; }
          tofu -chdir=infra/providers/local apply -input=false -auto-approve -no-color \
            -var-file="$GITHUB_WORKSPACE/infra/providers/_contract/fixtures/single-region.tfvars.json" \
            -var "machine_image=$MACHINE_IMAGE" \
            -state="$d/terraform.tfstate" || { echo "::error::additive plan: tofu apply of one region failed"; exit 1; }

      - name: Additive plan, plan two regions against that state
        if: steps.decide.outputs.run == 'true'
        env:
          MACHINE_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/plan-additive"
          export TF_DATA_DIR="$d/tofu-data"
          tofu -chdir=infra/providers/local plan -input=false -no-color \
            -var-file="$GITHUB_WORKSPACE/infra/providers/_contract/fixtures/two-region.tfvars.json" \
            -var "machine_image=$MACHINE_IMAGE" \
            -state="$d/terraform.tfstate" -out="$d/two-regions.tfplan" || { echo "::error::additive plan: tofu plan of two regions failed"; exit 1; }
          tofu -chdir=infra/providers/local show -json "$d/two-regions.tfplan" > "$d/two-regions.json" || { echo "::error::additive plan: tofu show of the plan failed"; exit 1; }

      - name: Additive plan, the plan of two regions only adds
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 scripts/check-plan-additive.py "$RUNNER_TEMP/plan-additive/two-regions.json" || { echo "::error::additive plan: the plan of two regions does more than add (see the lines NOT ADDITIVE above)"; exit 1; }

      - name: Additive plan, destroy
        if: always() && steps.decide.outputs.run == 'true'
        env:
          MACHINE_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/plan-additive"
          if [ ! -f "$d/terraform.tfstate" ]; then
            echo "nothing was applied"
            exit 0
          fi
          export TF_DATA_DIR="$d/tofu-data"
          tofu -chdir=infra/providers/local destroy -input=false -auto-approve -no-color \
            -var-file="$GITHUB_WORKSPACE/infra/providers/_contract/fixtures/single-region.tfvars.json" \
            -var "machine_image=$MACHINE_IMAGE" \
            -state="$d/terraform.tfstate" || { echo "::error::additive plan: tofu destroy failed"; exit 1; }

      - name: Up (two regions)
        if: steps.decide.outputs.run == 'true'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # The changed paths of a pull request or merge group (step decide): the kit charts they
          # touch come from the tree. A start by hand has none: every chart is the published one.
          changed=()
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; then
            changed=(--changed "$RUNNER_TEMP/changed-paths.txt")
          fi
          bash scripts/local-pack.sh up --regions 2 --branch "$BRANCH" --commit "$COMMIT" "${changed[@]}"

      - name: Kit charts of this run (summary)
        if: always() && steps.decide.outputs.run == 'true'
        run: |
          f="$RUNNER_TEMP/local-pack/kit-charts.txt"
          {
            echo '### Kit charts of the local pack'
            echo
            echo '```'
            if [ -f "$f" ]; then cat "$f"; else echo "Up wrote no chart plan: see the log of the step Up."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: catalyst-api image of this run (summary)
        if: always() && steps.decide.outputs.run == 'true'
        run: |
          f="$RUNNER_TEMP/local-pack/api-image.txt"
          { echo '### catalyst-api image of the local pack'; echo; echo '```'; if [ -f "$f" ]; then cat "$f"; else echo "Up wrote no catalyst-api image plan: see the log of the step Up."; fi; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Discovery steps D0.1 and D0.2 of the suite
        if: steps.decide.outputs.run == 'true'
        run: bash scripts/local-pack.sh discovery

      - name: Claim of 1 GiB on the default storage class (CLD-G11)
        if: steps.decide.outputs.run == 'true'
        run: bash scripts/local-pack.sh claim

      - name: Console address before the suite (discovery again starts a stopped port forward)
        if: steps.decide.outputs.run == 'true'
        run: bash scripts/local-pack.sh discovery

      - name: Gate suite on the pack (run in local, no journey)
        id: suite
        if: steps.decide.outputs.run == 'true'
        run: |
          set +e
          set -uo pipefail
          # The step writes the suite's table into the summary before it fails, so errexit is off.
          d="$RUNNER_TEMP/local-pack"
          # The env file of up: CONSOLE_URL, DEPLOYMENT_ID, REGION_A, REGION_B, SESSION_TOKEN_FILE.
          # shellcheck disable=SC1091
          . "$d/env"
          export ACCEPT_CONSOLE="$CONSOLE_URL" ACCEPT_DEPLOYMENT_ID="$DEPLOYMENT_ID"
          export ACCEPT_KUBECONFIG_A="$d/$REGION_A.kubeconfig" ACCEPT_KUBECONFIG_B="$d/$REGION_B.kubeconfig"
          # The session is read from its file and never printed.
          CATALYST_SESSION="$(cat "$SESSION_TOKEN_FILE")"
          export CATALYST_SESSION
          # The nodes that up asked for: one control-plane machine in each region and one worker
          # in the primary region, which is region A. The id of a region in its cluster is
          # local-<region code>-rtz-prod (infra/providers/local/main.tf).
          nodes="local-$REGION_A-rtz-prod=2,local-$REGION_B-rtz-prod=1"
          python3 scripts/acceptance-gate.py export > "$RUNNER_TEMP/gates.json" || exit 1
          mkdir -p "$RUNNER_TEMP/acceptance"
          bash scripts/acceptance-sovereign.sh local-pack --record --record-dir "$RUNNER_TEMP/acceptance" \
            --run-in local --manifest "$RUNNER_TEMP/gates.json" --repo-root . \
            --capabilities multi-region --nodes-requested "$nodes" --journeys '' | tee "$RUNNER_TEMP/acceptance.log"
          rc=${PIPESTATUS[0]}
          { echo '### Gate suite on the local pack'; echo; echo '```'; sed -n '/^ACCEPTANCE /,$p' "$RUNNER_TEMP/acceptance.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "suite exit code: $rc"
          exit "$rc"

      - name: Validate the record; its result must be PASS
        if: always() && steps.decide.outputs.run == 'true' && steps.suite.outcome != 'skipped'
        run: |
          set -euo pipefail
          n="$(find "$RUNNER_TEMP/acceptance" -maxdepth 1 -name '*.json' | wc -l)"
          if [ "$n" != 1 ]; then echo "::error::The suite wrote $n records, not 1."; exit 1; fi
          rec="$(find "$RUNNER_TEMP/acceptance" -maxdepth 1 -name '*.json')"
          python3 scripts/acceptance-gate.py validate-record "$rec"
          result="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("result", "FAIL"))' "$rec")"
          echo "record $(basename "$rec"): result $result"
          if [ "$result" != PASS ]; then echo "::error::The record's result is $result, not PASS."; exit 1; fi

      - name: Upload the record
        if: always() && steps.decide.outputs.run == 'true' && steps.suite.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-local-record
          path: |
            ${{ runner.temp }}/acceptance/*.json
            ${{ runner.temp }}/acceptance.log
          if-no-files-found: warn

      # The run in self (see the top of this file) runs only after the run in local passed. Its
      # image is built as build-conformance.yaml builds it, from the commit this job checked out:
      # the suite program, the NodePort script and the gate manifest.
      - name: Suite image for the run in self
        if: steps.suite.outcome == 'success'
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/conformance"
          mkdir -p "$ctx/scripts"
          (cd tests/acceptance/sovereign && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$ctx/sovereign-acceptance" ./cmd/sovereign-acceptance)
          cp scripts/check-live-nodeports.sh "$ctx/scripts/check-live-nodeports.sh"
          python3 scripts/acceptance-gate.py export > "$ctx/gates.json"
          docker build --provenance=false --sbom=false --file tests/acceptance/sovereign/Containerfile \
            --build-arg SUITE_GIT_SHA="$(git rev-parse HEAD)" --tag "$SELF_IMAGE" "$ctx"

      # Each failure of this step is marked "run in self:" in the log.
      - name: Run in self (a Job in the primary region runs the suite image)
        id: self
        if: steps.suite.outcome == 'success'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/local-pack"
          # The env file of up: CONSOLE_URL, DEPLOYMENT_ID, REGION_A, REGION_B, SESSION_TOKEN_FILE.
          # shellcheck disable=SC1091
          . "$d/env"
          out="$RUNNER_TEMP/conformance-self"
          mkdir -p "$out"
          fail() { echo "::error::run in self: $*"; exit 1; }
          k() { kubectl --kubeconfig "$d/$REGION_A.kubeconfig" --request-timeout=30s "$@"; }
          region="local-$REGION_A-rtz-prod"
          repo="${SELF_IMAGE%:*}"
          k get crd clusterpolicyreports.wgpolicyk8s.io > /dev/null || fail "the kind ClusterPolicyReport is not installed in $region"
          # The image goes into every machine of the region; each must hold it under one digest.
          # The reference by digest is made with ctr images tag: the import's own --digests makes
          # none for a named image in the containerd of k3s v1.31.8.
          digest=""
          for node in $(k get nodes -o jsonpath='{.items[*].metadata.name}'); do
            m="$(docker ps --format '{{.Names}}' | grep -x -- ".*-$node" || true)"
            if [ -z "$m" ] || [ "$(printf '%s\n' "$m" | wc -l)" != 1 ]; then fail "node $node is not one machine of the pack: '$m'"; fi
            docker save "$SELF_IMAGE" | docker exec -i "$m" /usr/local/bin/k3s ctr -n k8s.io images import --all-platforms --base-name "$repo" - \
              || fail "$m did not import the image"
            got="$(docker exec "$m" /usr/local/bin/k3s ctr -n k8s.io images ls "name==$SELF_IMAGE" | awk -v ref="$SELF_IMAGE" '$1 == ref {print $3}')"
            [[ "$got" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "$m holds no digest for $SELF_IMAGE: '$got'"
            if [ -n "$digest" ] && [ "$digest" != "$got" ]; then fail "$m holds $SELF_IMAGE as $got, another machine as $digest"; fi
            docker exec "$m" /usr/local/bin/k3s ctr -n k8s.io images tag --force "$SELF_IMAGE" "$repo@$got" > /dev/null \
              || fail "$m could not tag $SELF_IMAGE as $repo@$got"
            refs="$(docker exec "$m" /usr/local/bin/k3s ctr -n k8s.io images ls -q | grep -F -- "$repo" || true)"
            [ "$(printf '%s\n' "$refs" | grep -c -x -F -- "$repo@$got")" = 1 ] || fail "$m has no reference $repo@$got, only: '${refs//$'\n'/ }'"
            digest="$got"
            echo "$node ($m): $repo@$digest"
          done
          [ -n "$digest" ] || fail "no node was found in $region"
          # The ServiceAccount, its rules and the Job. The suite exits 0 when it ran, whatever its
          # checks gave; the Job fails only when the suite could not run. The record goes into the
          # log of the Job, between the lines "--- record <file>" and "--- end of record".
          SELF_REPO="$repo" SELF_DIGEST="$digest" SELF_REGION="$region" python3 - > "$out/manifest.json" <<'PY'
          import json, os, shlex
          repo, digest, region = os.environ["SELF_REPO"], os.environ["SELF_DIGEST"], os.environ["SELF_REGION"]
          ns, name = "catalyst-system", "catalyst-conformance"
          labels = {"app.kubernetes.io/name": name}
          run = ("sovereign-acceptance run --run-in self --env local-pack --region-a %s --suite-image-digest %s"
                 " --report-name conformance --manifest /opt/conformance/gates.json --repo-root /opt/conformance"
                 " --wait-for-release 10 --record --record-dir /tmp/record" % (shlex.quote(region), shlex.quote(digest)))
          script = (run + '; rc=$?; for f in /tmp/record/*.json; do [ -f "$f" ] || continue; '
                    'echo "--- record $f"; cat "$f"; echo "--- end of record"; done; exit $rc')
          def field(name, path):
              return {"name": name, "valueFrom": {"fieldRef": {"fieldPath": path}}}
          rules = [
              {"apiGroups": ["helm.toolkit.fluxcd.io"], "resources": ["helmreleases"], "verbs": ["get", "list", "watch"]},
              {"apiGroups": [""], "resources": ["pods", "services", "nodes"], "verbs": ["get", "list", "watch"]},
              {"apiGroups": [""], "resources": ["namespaces"], "verbs": ["get", "list"]},
              {"apiGroups": ["apiextensions.k8s.io"], "resources": ["customresourcedefinitions"],
               "resourceNames": ["clusterpolicies.kyverno.io", "validatingpolicies.policies.kyverno.io"], "verbs": ["get"]},
              {"apiGroups": ["kyverno.io", "policies.kyverno.io"], "resources": ["clusterpolicies", "validatingpolicies"], "resourceNames": ["forbid-nodeport-service"], "verbs": ["get"]},
              {"apiGroups": ["wgpolicyk8s.io"], "resources": ["clusterpolicyreports"], "verbs": ["get", "create", "update", "patch"]},
          ]
          container = {
              "name": "conformance", "image": repo + "@" + digest, "imagePullPolicy": "Never",
              "command": ["/bin/sh", "-c", script],
              "env": [{"name": "HOME", "value": "/tmp"},
                      field("ACCEPT_JOB_NAMESPACE", "metadata.namespace"),
                      field("ACCEPT_JOB_NAME", "metadata.labels['batch.kubernetes.io/job-name']"),
                      field("ACCEPT_JOB_UID", "metadata.labels['batch.kubernetes.io/controller-uid']")],
              "resources": {"requests": {"cpu": "50m", "memory": "64Mi"}, "limits": {"memory": "512Mi"}},
              "securityContext": {"allowPrivilegeEscalation": False, "readOnlyRootFilesystem": True,
                                  "capabilities": {"drop": ["ALL"]}},
              "volumeMounts": [{"name": "tmp", "mountPath": "/tmp"}],
          }
          pod = {"serviceAccountName": name, "restartPolicy": "Never", "containers": [container],
                 "securityContext": {"runAsNonRoot": True, "runAsUser": 65534, "runAsGroup": 65534,
                                     "seccompProfile": {"type": "RuntimeDefault"}},
                 "volumes": [{"name": "tmp", "emptyDir": {}}]}
          items = [
              {"apiVersion": "v1", "kind": "ServiceAccount", "metadata": {"name": name, "namespace": ns, "labels": labels}},
              {"apiVersion": "rbac.authorization.k8s.io/v1", "kind": "ClusterRole",
               "metadata": {"name": name, "labels": labels}, "rules": rules},
              {"apiVersion": "rbac.authorization.k8s.io/v1", "kind": "ClusterRoleBinding",
               "metadata": {"name": name, "labels": labels},
               "roleRef": {"apiGroup": "rbac.authorization.k8s.io", "kind": "ClusterRole", "name": name},
               "subjects": [{"kind": "ServiceAccount", "name": name, "namespace": ns}]},
              {"apiVersion": "batch/v1", "kind": "Job", "metadata": {"name": name, "namespace": ns, "labels": labels},
               "spec": {"backoffLimit": 0, "activeDeadlineSeconds": 1200,
                        "template": {"metadata": {"labels": labels}, "spec": pod}}},
          ]
          print(json.dumps({"apiVersion": "v1", "kind": "List", "items": items}, indent=2))
          PY
          k apply -f "$out/manifest.json"
          sel="batch.kubernetes.io/job-name=catalyst-conformance"
          t0=$(date +%s)
          while :; do
            ok="$(k -n catalyst-system get job catalyst-conformance -o jsonpath='{.status.succeeded}' || true)"
            bad="$(k -n catalyst-system get job catalyst-conformance -o jsonpath='{.status.failed}' || true)"
            why="$(k -n catalyst-system get pod -l "$sel" -o jsonpath='{.items[*].status.containerStatuses[*].state.waiting.reason}' || true)"
            pods="$(k -n catalyst-system get pod -l "$sel" -o name || true)"
            if [ "${ok:-0}" -ge 1 ] || [ "${bad:-0}" -ge 1 ]; then break; fi
            case " $why " in *" ErrImageNeverPull "* | *" InvalidImageName "* | *" CreateContainerConfigError "* | *" CreateContainerError "*) break ;; esac
            if [ -z "$pods" ] && [ $(( $(date +%s) - t0 )) -ge 180 ]; then break; fi
            if [ $(( $(date +%s) - t0 )) -ge 1500 ]; then break; fi
            sleep 10
          done
          echo "the Job ended its wait after $(( $(date +%s) - t0 ))s: succeeded=${ok:-0} failed=${bad:-0} waiting=${why:-none}"
          k -n catalyst-system get job catalyst-conformance -o json > "$out/job.json" || true
          k -n catalyst-system get pod -l "$sel" -o json > "$out/pods.json" || true
          k -n catalyst-system describe pod -l "$sel" > "$out/pods-describe.txt" 2>&1 || true
          k -n catalyst-system logs "job/catalyst-conformance" > "$out/job.log" 2>&1 || true
          k get clusterpolicyreport conformance -o json > "$out/clusterpolicyreport.json" || true
          cat "$out/job.log"
          { echo '### Run in self on the local pack'; echo; echo '```'; awk '/^ACCEPTANCE /{p=1} /^--- record /{p=0} p' "$out/job.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # The API server answers for the account: the reads of its checks and its own report,
          # and nothing more (no other object of the two kinds of Kyverno, no Secrets, no pods/exec).
          sa="system:serviceaccount:catalyst-system:catalyst-conformance"
          can() {
            want="$1"; shift
            got="$(k auth can-i "$@" --as "$sa" 2>/dev/null || true)"
            [ "${got%% *}" = "$want" ] || fail "can-i $* for $sa: '$got', not $want"
            echo "can-i $*: $want" | tee -a "$out/can-i.txt"
          }
          can yes get customresourcedefinitions.apiextensions.k8s.io/clusterpolicies.kyverno.io
          can yes get clusterpolicies.kyverno.io/forbid-nodeport-service
          can yes get customresourcedefinitions.apiextensions.k8s.io/validatingpolicies.policies.kyverno.io
          can yes get validatingpolicies.policies.kyverno.io/forbid-nodeport-service
          can yes list namespaces
          can yes patch clusterpolicyreports.wgpolicyk8s.io
          can no get customresourcedefinitions.apiextensions.k8s.io/clusterpolicyreports.wgpolicyk8s.io
          can no list clusterpolicies.kyverno.io
          can no list validatingpolicies.policies.kyverno.io
          can no get secrets --all-namespaces
          can no create pods --subresource=exec --all-namespaces
          python3 - "$out" "$digest" "$(git rev-parse HEAD)" <<'PY'
          import json, os, subprocess, sys
          out, digest, head = sys.argv[1:4]
          fails = []
          def load(name):
              try:
                  with open(os.path.join(out, name), encoding="utf-8") as f:
                      return json.load(f)
              except (OSError, ValueError) as e:
                  fails.append("%s: %s" % (name, e))
                  return {}
          job, pods, report = load("job.json"), load("pods.json"), load("clusterpolicyreport.json")
          if job.get("status", {}).get("succeeded") != 1:
              fails.append("the Job did not complete: status %s" % json.dumps(job.get("status", {})))
          body, count, inside = [], 0, False
          with open(os.path.join(out, "job.log"), encoding="utf-8", errors="replace") as f:
              for line in f.read().splitlines():
                  if line.startswith("--- record "):
                      inside, count = True, count + 1
                  elif line == "--- end of record":
                      inside = False
                  elif inside:
                      body.append(line)
          rec = {}
          if count != 1:
              fails.append("the log of the Job holds %d records, not 1" % count)
          else:
              try:
                  rec = json.loads("\n".join(body))
              except ValueError as e:
                  fails.append("the record in the log is not JSON: %s" % e)
          if rec:
              os.makedirs(os.path.join(out, "record"), exist_ok=True)
              path = os.path.join(out, "record", "%s-%s.json" % (rec.get("env"), rec.get("run_id")))
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(rec, f, indent=2)
              v = subprocess.run([sys.executable, "scripts/acceptance-gate.py", "validate-record", path])
              if v.returncode != 0:
                  fails.append("validate-record exits %d on %s" % (v.returncode, os.path.basename(path)))
              meta = job.get("metadata", {})
              want = {"kind": "job", "job": {"namespace": meta.get("namespace"), "name": meta.get("name"), "uid": meta.get("uid")}}
              if rec.get("producer") != want:
                  fails.append("the producer is %s, not %s" % (json.dumps(rec.get("producer")), json.dumps(want)))
              if rec.get("run_in") != "self":
                  fails.append("run_in is %s, not self" % rec.get("run_in"))
              if rec.get("suite_image_digest") != digest:
                  fails.append("suite_image_digest is %s, not %s" % (rec.get("suite_image_digest"), digest))
              if rec.get("suite_git_sha") != head:
                  fails.append("suite_git_sha is %s, not the commit %s" % (rec.get("suite_git_sha"), head))
              ran = [c.get("imageID", "") for p in pods.get("items", []) for c in p.get("status", {}).get("containerStatuses", [])]
              if not ran or any(not i.endswith("@" + digest) for i in ran):
                  fails.append("the pod ran %s, not the digest %s" % (ran, digest))
              labels = report.get("metadata", {}).get("labels", {})
              if labels.get("catalyst.openova.io/run-id") != rec.get("run_id"):
                  fails.append("the report has the run id %s, the record %s" % (labels.get("catalyst.openova.io/run-id"), rec.get("run_id")))
              if labels.get("app.kubernetes.io/managed-by") != "catalyst-conformance":
                  fails.append("the report is not managed by catalyst-conformance: %s" % labels)
              results = sorted(r.get("policy", "") for r in report.get("results", []))
              checks = sorted(c.get("id", "") for c in rec.get("checks", []))
              if results != checks:
                  fails.append("the report has results for %s, the record checks %s" % (results, checks))
              if rec.get("result") != "PASS":
                  fails.append("the record's result is %s, not PASS" % rec.get("result"))
              print("record %s: run in self by Job %s/%s (uid %s), image %s, %d checks (%s), result %s"
                    % (os.path.basename(path), meta.get("namespace"), meta.get("name"), meta.get("uid"), digest,
                       len(checks), ", ".join(checks) or "none", rec.get("result")))
          for f in fails:
              print("::error::run in self: " + f)
          sys.exit(1 if fails else 0)
          PY

      - name: Upload the evidence of the run in self
        if: always() && steps.self.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-self
          path: ${{ runner.temp }}/conformance-self
          if-no-files-found: warn

      - name: Collect evidence
        if: failure() && steps.decide.outputs.run == 'true'
        run: bash scripts/local-pack.sh collect

      - name: Upload evidence
        if: failure() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: local-pack-evidence
          path: ${{ runner.temp }}/local-pack/evidence
          if-no-files-found: warn

      - name: Down
        if: always() && steps.decide.outputs.run == 'true'
        run: bash scripts/local-pack.sh down
