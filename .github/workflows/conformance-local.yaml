# conformance-local.yaml - the local provider pack, brought up on the runner with two regions.
#
# The local pack (infra/providers/local) starts each region's control-plane machine as a
# privileged container on the runner's own Docker and boots it with the shared template; Flux
# then installs the reduced kit clusters/_template/providers/local/kit from the commit of the
# pull request. scripts/local-pack.sh does the work:
#   up     two regions; exit 0 only when the kit core is Ready in both and the runner reaches
#          both API servers with the kubeconfigs it writes;
#   claim  a claim of 1 GiB binds on the default storage class of each region (gate check
#          CLD-G11);
#   down   removes every machine, volume and network, also when an earlier step failed.
# On a failure the evidence of every machine is uploaded as the artifact local-pack-evidence.
# Nothing publishes a port and nothing uses a node port.
#
# It runs on pull requests that change what the run reads from the commit: the boot template,
# the module contract, the local module, the cluster templates, the script and this file.
# Charts and images come from ghcr.io at the versions the kit pins; the job token pulls them.
name: conformance-local

on:
  pull_request:
    paths:
      - 'infra/providers/_shared/**'
      - 'infra/providers/_contract/**'
      - 'infra/providers/local/**'
      - 'clusters/_template/**'
      - 'scripts/local-pack.sh'
      - '.github/workflows/conformance-local.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: conformance-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance-local:
    name: conformance-local
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk (toolchains this job does not use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.6
          tofu_wrapper: false

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.31.4

      - name: Self-test of the script
        run: bash scripts/local-pack.sh --self-test

      - name: Up (two regions)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/local-pack.sh up --regions 2 --branch "$BRANCH" --commit "$COMMIT"

      - name: Claim of 1 GiB on the default storage class (CLD-G11)
        run: bash scripts/local-pack.sh claim

      - name: Collect evidence
        if: failure()
        run: bash scripts/local-pack.sh collect

      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-pack-evidence
          path: ${{ runner.temp }}/local-pack/evidence
          if-no-files-found: warn

      - name: Down
        if: always()
        run: bash scripts/local-pack.sh down
