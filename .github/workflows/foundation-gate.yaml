name: foundation-gate

# The gate workflow: it runs the acceptance suite (scripts/acceptance-sovereign.sh) against a live
# Sovereign and commits the record to docs/ledger/acceptance/ on main, PASS or FAIL.
#   unit       suite unit tests and gate tool self-tests, no cluster; also before every live run.
#   candidate  with candidate_id only: scripts/release-candidate.sh verify; live needs it green.
#   live       environment gate, runner label from the input runner (default foundation-gate).
#              Checks out this workflow's commit (the tools; the record is committed from here) and,
#              in candidate/, the commit under test: the candidate's, or else the one the run was
#              started from (that record has an empty candidate.id and certifies nothing). Waits up
#              to 180 minutes until the hand-over chain has ended (region A's ConfigMap
#              catalyst/self-sovereign-cutover-status), runs the suite with --run-in cloud --record,
#              commits the record only if acceptance-gate.py validate-record accepts it, then lets
#              scripts/gate-run-outcome.py judge the run on this environment.
#              Between the suite and the validation it runs gate check FND-G07: it creates the user
#              gate-<run id>@<env>.omani.works in the realm sovereign of region A (kcadm.sh in the Pod
#              keycloak/keycloak-0), mints its session with the Sovereign's own signer, runs
#              scripts/sso-zero-click-probe.mjs as that user, deletes the user in a step that always
#              runs, and adds the result to the record with acceptance-gate.py merge-check.
# Secrets of the environment gate: ACCEPTANCE_KUBECONFIG_A and ACCEPTANCE_KUBECONFIG_B (base64 of
# the kubeconfigs of the regions that start as Primary and as Standby), ACCEPTANCE_CATALYST_SESSION
# (optional owner session; when empty the run mints one from the Sovereign's own signer).

on:
  workflow_dispatch:
    inputs:
      env:
        description: The environment label, such as hw307
        required: true
      deployment_id:
        description: The deployment id. Empty means the one the console reports.
        default: ''
      candidate_id:
        description: The candidate rc/<id> under test. Empty means the commit this run was started from; such a record certifies nothing.
        default: ''
      previous_deployment_id:
        description: The deployment whose wipe this fresh installation follows. Give it with previous_wipe_orphans.
        default: ''
      previous_wipe_orphans:
        description: The number of that deployment's resources the cloud account still listed after the wipe.
        default: ''
      nodes_requested:
        description: "The nodes the deployment request asked for, per region id: <regionA>=6,<regionB>=6"
        default: ''
      capabilities:
        description: Further capability flags this environment has, comma separated. multi-region is always declared.
        default: ''
      runner:
        description: The runs-on label of the runner that reaches every region
        default: foundation-gate
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      deployment_id:
        type: string
        default: ''
      candidate_id:
        type: string
        default: ''
      previous_deployment_id:
        type: string
        default: ''
      previous_wipe_orphans:
        type: string
        default: ''
      nodes_requested:
        type: string
        default: ''
      capabilities:
        type: string
        default: ''
      runner:
        type: string
        default: foundation-gate
    outputs:
      result:
        description: The result of the record, PASS or FAIL; FAIL when no valid record was written
        value: ${{ jobs.live.outputs.result }}
    secrets:
      ACCEPTANCE_KUBECONFIG_A:
        required: false
      ACCEPTANCE_KUBECONFIG_B:
        required: false
      ACCEPTANCE_CATALYST_SESSION:
        required: false
      RELEASE_WRITER_KEY:
        required: false
  pull_request:
    paths:
      - 'tests/acceptance/sovereign/**'
      - 'scripts/acceptance-sovereign.sh'
      - 'scripts/acceptance-gate.py'
      - 'scripts/acceptance_record.py'
      - 'scripts/intent-lock-report.py'
      - 'scripts/gate-run-outcome.py'
      - '.github/workflows/foundation-gate.yaml'
  merge_group:

permissions:
  contents: read

jobs:
  unit:
    name: suite unit tests + gate self-tests (no cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'
      - name: go vet + test (proves each assertion helper can FAIL)
        working-directory: tests/acceptance/sovereign
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: deploy gate self-test
        run: python3 scripts/acceptance-gate.py --self-test
      - name: gate run outcome self-test
        run: python3 scripts/gate-run-outcome.py --self-test

  candidate:
    name: verify the candidate
    if: inputs.candidate_id != '' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install PyYAML and yq
        run: |
          set -e
          pip install --quiet pyyaml
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
          helm version --short
      - name: release-candidate.sh verify
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          commit="$(bash scripts/release-candidate.sh verify "$CANDIDATE_ID")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::verify printed no commit"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Candidate rc/$CANDIDATE_ID verified at commit $commit" >> "$GITHUB_STEP_SUMMARY"

  live:
    name: live gate run on ${{ inputs.env }}
    needs: [unit, candidate]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' &&
      needs.unit.result == 'success' &&
      (needs.candidate.result == 'success' || (inputs.candidate_id == '' && needs.candidate.result == 'skipped')) }}
    runs-on: ${{ inputs.runner }}
    environment: gate
    timeout-minutes: 330
    concurrency: # one live run per Sovereign: two would move the same Primary under each other
      group: foundation-gate-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      result: ${{ steps.record.outputs.result || 'FAIL' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check out the commit under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate.outputs.commit || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Write kubeconfigs (never echoed)
        env:
          KA: ${{ secrets.ACCEPTANCE_KUBECONFIG_A }}
          KB: ${{ secrets.ACCEPTANCE_KUBECONFIG_B }}
        run: |
          set -euo pipefail
          if [ -z "$KA" ] || [ -z "$KB" ]; then echo "::error::ACCEPTANCE_KUBECONFIG_A/B secrets are not set"; exit 2; fi
          umask 077; mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KA" | base64 -d > "$RUNNER_TEMP/kube/a.yaml"
          printf '%s' "$KB" | base64 -d > "$RUNNER_TEMP/kube/b.yaml"
      - name: Wait until the hand-over chain has ended
        env:
          KA: ${{ runner.temp }}/kube/a.yaml
        run: |
          set -uo pipefail
          # The chain has ended when cutoverComplete is true (completed) or failedStep is set (failed).
          deadline=$(( $(date +%s) + 180 * 60 ))
          last="nothing was read"
          while :; do
            if s="$(kubectl --kubeconfig "$KA" -n catalyst get configmap self-sovereign-cutover-status \
                  -o jsonpath='{.data.cutoverComplete}|{.data.failedStep}|{.data.currentStep}' 2>&1)"; then
              IFS='|' read -r complete failed current <<<"$s"
              if [ "$complete" = true ]; then chain="completed"; break; fi
              if [ -n "$failed" ]; then chain="failed at step $failed"; break; fi
              last="not ended, current step: ${current:-none}"
            else
              last="the status ConfigMap could not be read: $s"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Hand-over chain: did not end within 180 minutes; last observed: $last" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::The hand-over chain did not end within 180 minutes; last observed: $last. The suite was not run."
              exit 1
            fi
            sleep 30
          done
          echo "Hand-over chain: $chain" >> "$GITHUB_STEP_SUMMARY"
          if [ "$chain" != completed ]; then
            err="$(kubectl --kubeconfig "$KA" -n catalyst get configmap self-sovereign-cutover-status -o jsonpath='{.data.lastError}' 2>&1 || true)"
            echo "Hand-over error: $err" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: When the environment was created
        id: born
        run: |
          set -uo pipefail
          # The earliest creation of kube-system in the two regions. Unread: the last step fails.
          born=""
          for r in a b; do
            t="$(kubectl --kubeconfig "$RUNNER_TEMP/kube/$r.yaml" get namespace kube-system -o jsonpath='{.metadata.creationTimestamp}')"
            if [[ ! "$t" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              echo "::warning::The creation time of region $r could not be read."
              born=""; break
            fi
            if [ -z "$born" ] || [[ "$t" < "$born" ]]; then born="$t"; fi
          done
          echo "born=$born" >> "$GITHUB_OUTPUT"
          echo "Environment created at: ${born:-not read}" >> "$GITHUB_STEP_SUMMARY"
      - name: Export the manifest of the commit under test
        working-directory: candidate
        run: python3 scripts/acceptance-gate.py export > "$RUNNER_TEMP/gates.json"
      - name: Run the suite
        id: run
        working-directory: candidate
        env:
          ACCEPT_KUBECONFIG_A: ${{ runner.temp }}/kube/a.yaml
          ACCEPT_KUBECONFIG_B: ${{ runner.temp }}/kube/b.yaml
          CATALYST_SESSION: ${{ secrets.ACCEPTANCE_CATALYST_SESSION }}
          ACCEPT_MINT: ${{ secrets.ACCEPTANCE_CATALYST_SESSION == '' && '1' || '0' }}
          ACCEPT_MANIFEST: ${{ runner.temp }}/gates.json
          ACCEPT_RUN_IN: cloud
          ACCEPT_CANDIDATE_ID: ${{ inputs.candidate_id }}
          ACCEPT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          ACCEPT_PREVIOUS_DEPLOYMENT_ID: ${{ inputs.previous_deployment_id }}
          ACCEPT_PREVIOUS_WIPE_ORPHANS: ${{ inputs.previous_wipe_orphans }}
          ACCEPT_NODES_REQUESTED: ${{ inputs.nodes_requested }}
          MORE_CAPABILITIES: ${{ inputs.capabilities }}
          ENV_LABEL: ${{ inputs.env }}
        run: |
          set +e
          caps=multi-region # the suite always drives two regions
          if [ -n "$ACCEPT_PREVIOUS_DEPLOYMENT_ID" ]; then caps="$caps,previous-wipe"; fi
          if [ -n "$MORE_CAPABILITIES" ]; then caps="$caps,$MORE_CAPABILITIES"; fi
          export ACCEPT_CAPABILITIES="$caps"
          # The suite reads the commit it was built from from GITHUB_SHA: make it this checkout's commit.
          GITHUB_SHA="$(git rev-parse HEAD)"
          export GITHUB_SHA
          bash scripts/acceptance-sovereign.sh "$ENV_LABEL" --record | tee "$RUNNER_TEMP/acceptance.log"
          rc=${PIPESTATUS[0]}
          set -e
          { echo '### Gate run'; echo; echo '```'; sed -n '/^ACCEPTANCE /,$p' "$RUNNER_TEMP/acceptance.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "suite exit code: $rc"
      - name: "Sign-in check FND-G07: Node for the probe"
        continue-on-error: true # without Node the next step records no result, and FND-G07 is a FAIL
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: "Sign-in check FND-G07: a user of this run signs in through the identity provider"
        id: sso
        env:
          KA: ${{ runner.temp }}/kube/a.yaml
          ENV_LABEL: ${{ inputs.env }}
          GATE_RUN: ${{ github.run_id }}
        run: |
          set +e
          set -uo pipefail
          # This step never fails the job. When a part cannot be done it writes why into the summary
          # and leaves no result file; the step "add the result" then records FND-G07 as FAIL.
          d="$RUNNER_TEMP/sso"
          mkdir -p "$d"
          rm -f "$d/result.json" "$d/session"
          fqdn="$ENV_LABEL.omani.works" # the console the suite drives: https://console.<env>.omani.works
          user="gate-$GATE_RUN@$fqdn"
          # kcadm.sh inside region A's identity provider. The administrator password is read from the
          # Pod's own mount of Secret keycloak/keycloak-admin and never leaves the Pod.
          kc() {
            kubectl --kubeconfig "$KA" -n keycloak exec keycloak-0 -c keycloak -- sh -c '
              c=/tmp/kcadm-gate.config; k=/opt/bitnami/keycloak/bin/kcadm.sh
              "$k" config credentials --config "$c" --server http://localhost:8080 --realm master --user admin \
                --password "$(cat /opt/bitnami/keycloak/secrets/admin-password)" >/dev/null || exit 1
              exec "$k" "$@" --config "$c"' sh "$@"
          }
          stop() {
            echo "::error::Sign-in check FND-G07: $1"
            echo "Sign-in check FND-G07: not run, $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          # 1. Delete every user an earlier run left: gate-<run id>@<fqdn>.
          kc get users -r sovereign -q search=gate- --limit 1000 --fields id,username > "$d/users.json" \
            || stop "the users of the realm sovereign could not be listed"
          ids="$(python3 -c 'import json, re, sys; p = re.compile(r"^gate-[0-9]+@" + re.escape(sys.argv[2]) + "$", re.I); print(" ".join(u["id"] for u in json.load(open(sys.argv[1])) if p.match(u.get("username", ""))))' "$d/users.json" "$fqdn")" \
            || stop "the list of users could not be read"
          for id in $ids; do
            kc delete "users/$id" -r sovereign || stop "the user $id that an earlier run left could not be deleted"
          done
          # 2. Create the user of this run, in the groups /sovereign-admins and /sovereign-viewers.
          uid="$(kc create users -r sovereign -s "username=$user" -s "email=$user" -s enabled=true -s emailVerified=true -i)" \
            || stop "the user $user could not be created"
          [[ "$uid" =~ ^[0-9a-f-]{36}$ ]] || stop "creating the user $user printed no id"
          kc get groups -r sovereign -q search=sovereign- --limit 1000 --fields id,name > "$d/groups.json" \
            || stop "the groups of the realm sovereign could not be listed"
          for g in sovereign-admins sovereign-viewers; do
            gid="$(python3 -c 'import json, sys; print(next(x["id"] for x in json.load(open(sys.argv[1])) if x.get("name") == sys.argv[2]))' "$d/groups.json" "$g")" \
              || stop "the group /$g is not in the realm sovereign"
            kc update "users/$uid/groups/$gid" -r sovereign -s realm=sovereign -s "userId=$uid" -s "groupId=$gid" -n \
              || stop "the user $user could not join the group /$g"
          done
          kc get "users/$uid/groups" -r sovereign --fields name > "$d/member.json" \
            || stop "the groups of the user $user could not be read"
          python3 -c 'import json, sys; n = {x.get("name") for x in json.load(open(sys.argv[1]))}; sys.exit(0 if {"sovereign-admins", "sovereign-viewers"} <= n else 1)' "$d/member.json" \
            || stop "the user $user is not in both groups /sovereign-admins and /sovereign-viewers"
          # 3. Mint the user's console session with the Sovereign's own signer, as scripts/acceptance-sovereign.sh does.
          bin="$d/sovereign-acceptance"
          ( cd "$GITHUB_WORKSPACE/tests/acceptance/sovereign" && go build -o "$bin" ./cmd/sovereign-acceptance ) \
            || stop "the session minter could not be built"
          issuer="$(kubectl --kubeconfig "$KA" -n catalyst-system get deploy catalyst-api \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="CATALYST_PIN_ISSUER")].value}')"
          issuer="${issuer:-https://console.$fqdn}"
          signer="$(kubectl --kubeconfig "$KA" -n catalyst-system get deploy catalyst-api \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="CATALYST_HANDOVER_SIGNER_PATH")].value}')"
          signer="${signer:-/var/lib/catalyst/handover-jwt-private.pem}"
          ( umask 077; kubectl --kubeconfig "$KA" -n catalyst-system exec deploy/catalyst-api -- cat "$signer" \
              | "$bin" mint-session --key - --issuer "$issuer" --email "$user" --ttl 1h > "$d/session" ) \
            || stop "the session of $user could not be minted"
          [ -s "$d/session" ] || stop "the session of $user is empty"
          # 4. Run the probe with that session. It writes the result file, PASS or FAIL.
          command -v node > /dev/null || stop "node is not on the PATH"
          cd "$d" || stop "the folder $d cannot be entered"
          printf '{"private": true}\n' > "$d/package.json"
          npm install --no-audit --no-fund playwright@1.46.0 || stop "playwright could not be installed"
          bash "$GITHUB_WORKSPACE/scripts/playwright-chromium-install.sh" || stop "Chromium could not be installed"
          cp "$GITHUB_WORKSPACE/scripts/sso-zero-click-probe.mjs" "$d/probe.mjs"
          node "$d/probe.mjs" --fqdn "$fqdn" --session-file "$d/session" --result-file "$d/result.json" | tee "$d/probe.log"
          rc=${PIPESTATUS[0]}
          { echo "### Sign-in check FND-G07 as $user (probe exit code $rc)"; echo; echo '```'; cat "$d/probe.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: "Sign-in check FND-G07: delete the user of this run"
        if: always() && steps.sso.outcome != 'skipped'
        env:
          KA: ${{ runner.temp }}/kube/a.yaml
          ENV_LABEL: ${{ inputs.env }}
          GATE_RUN: ${{ github.run_id }}
        run: |
          set +e
          set -uo pipefail
          # Runs whenever the step before it ran, whatever it did. It never fails the job: a user it
          # cannot delete is deleted by the next run's first step.
          d="$RUNNER_TEMP/sso"
          rm -f "$d/session"
          user="gate-$GATE_RUN@$ENV_LABEL.omani.works"
          kc() {
            kubectl --kubeconfig "$KA" -n keycloak exec keycloak-0 -c keycloak -- sh -c '
              c=/tmp/kcadm-gate.config; k=/opt/bitnami/keycloak/bin/kcadm.sh
              "$k" config credentials --config "$c" --server http://localhost:8080 --realm master --user admin \
                --password "$(cat /opt/bitnami/keycloak/secrets/admin-password)" >/dev/null || exit 1
              exec "$k" "$@" --config "$c"' sh "$@"
          }
          if ! kc get users -r sovereign -q search=gate- --limit 1000 --fields id,username > "$d/left.json"; then
            echo "::warning::Sign-in check FND-G07: the users could not be listed; the next run deletes $user."
            exit 0
          fi
          ids="$(python3 -c 'import json, sys; print(" ".join(u["id"] for u in json.load(open(sys.argv[1])) if u.get("username", "").lower() == sys.argv[2].lower()))' "$d/left.json" "$user")"
          for id in $ids; do
            kc delete "users/$id" -r sovereign || echo "::warning::Sign-in check FND-G07: $user could not be deleted; the next run deletes it."
          done
          echo "Sign-in check FND-G07: the user $user is deleted." >> "$GITHUB_STEP_SUMMARY"
      - name: "Sign-in check FND-G07: add the result to the record"
        run: |
          set +e
          set -uo pipefail
          files="$(git -C candidate ls-files --others --exclude-standard -- docs/ledger/acceptance/)"
          n="$(printf '%s' "$files" | grep -c .)"
          if [ "$n" != 1 ]; then
            echo "::warning::The suite wrote $n records, not 1, so the sign-in result is not added. The next step fails on it."
            exit 0
          fi
          python3 scripts/acceptance-gate.py merge-check "candidate/$files" "$RUNNER_TEMP/sso/result.json" --check FND-G07
      - name: Validate the record
        id: record
        run: |
          set -uo pipefail
          files="$(git -C candidate ls-files --others --exclude-standard -- docs/ledger/acceptance/)"
          n="$(printf '%s' "$files" | grep -c .)"
          if [ "$n" != 1 ]; then echo "::error::The suite wrote $n records, not 1."; exit 1; fi
          rec="docs/ledger/acceptance/$(basename "$files")"
          cp "candidate/$files" "$rec"
          echo "file=$rec" >> "$GITHUB_OUTPUT"
          echo "result=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("result", "FAIL"))' "$rec")" >> "$GITHUB_OUTPUT"
          if ! python3 scripts/acceptance-gate.py validate-record "$rec"; then
            echo "::error::The record is not valid. It is not committed; it is kept as an artifact of this run."
            exit 1
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"
      - name: Upload record + log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-${{ inputs.env }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/docs/ledger/acceptance/*.json
            ${{ runner.temp }}/acceptance.log
          if-no-files-found: warn
      - name: "Release writer: push with the release-writer key"
        if: always() && steps.record.outputs.valid == 'true'
        uses: ./.github/actions/use-release-writer
        with:
          key: ${{ secrets.RELEASE_WRITER_KEY }}
      - name: Commit the record (PASS or FAIL, a failure is evidence too)
        if: always() && steps.record.outputs.valid == 'true'
        env:
          REC: ${{ steps.record.outputs.file }}
          RESULT: ${{ steps.record.outputs.result }}
          ENV_LABEL: ${{ inputs.env }}
        run: |
          set -euo pipefail
          git config user.name hatiyildiz
          git config user.email 269457768+hatiyildiz@users.noreply.github.com
          git add -- "$REC"
          git commit -m "docs(acceptance): $ENV_LABEL gate run $RESULT [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push the gate record"; exit 1
      - name: Judge the run on this environment
        if: always() && steps.record.outputs.valid == 'true'
        working-directory: candidate
        env:
          REC: ${{ steps.record.outputs.file }}
          BORN: ${{ steps.born.outputs.born }}
        run: |
          set -uo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/gate-run-outcome.py" --record "$GITHUB_WORKSPACE/$REC" --born "$BORN" | tee "$RUNNER_TEMP/outcome.txt"
          rc=${PIPESTATUS[0]}
          { echo '### Outcome on this environment'; echo; echo '```'; cat "$RUNNER_TEMP/outcome.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
