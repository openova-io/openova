name: secret-guards

# The secret guards G1 to G7 and G9 (SEC-090). Each guard scans the whole tree
# of tracked files at the commit under test, never only the diff. Seven of
# them compare what they find with their allow-list under
# scripts/secret-guard-baselines/, one "path:count" line per file: a rise or a
# new path fails, a fall passes and prints the line to change or delete. The
# allow-lists may only shrink. G9 has no allow-list and fails on any finding.
#
# The scan for secret VALUES (keys, tokens) in every file is the workflow
# security-scan (Trivy, new findings only). These guards cover what a value
# scanner cannot judge: Secret manifests in Git and in chart templates,
# secrets that charts generate or derive, Secret writers in Go, the reflector
# scope, the legacy cluster-wide store, the OpenBao unseal material and the
# delivery lint.
#
# Each guard first runs its self-test, which proves on fixtures that each of
# its rules can fail. The last step proves the same on the real tree: one
# randAlphaNum added to a real chart template turns G2 red.
#
# No path filter: every pull request, every merge group, every push to main.
# No cluster, no credential, no cloud call.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-guards:
    name: secret-guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: G1 self-test
        run: bash scripts/check-no-secret-values-in-git.sh --self-test
      - name: G1 no Secret manifest under clusters/
        run: bash scripts/check-no-secret-values-in-git.sh

      - name: G2 self-test
        run: bash scripts/check-no-chart-random-secrets.sh --self-test
      - name: G2 no new generated secret in a chart template
        run: bash scripts/check-no-chart-random-secrets.sh

      - name: G3 self-test
        run: bash scripts/check-no-plain-secret-manifests.sh --self-test
      - name: G3 no new Secret manifest in a chart template
        run: bash scripts/check-no-plain-secret-manifests.sh

      - name: G4 self-test
        run: bash scripts/check-no-derived-credentials.sh --self-test
      - name: G4 no new derived credential in a chart template
        run: bash scripts/check-no-derived-credentials.sh

      - name: G5 self-test
        run: bash scripts/check-no-secret-writers.sh --self-test
      - name: G5 no new Secret writer in Go code
        run: bash scripts/check-no-secret-writers.sh

      - name: G6 self-test
        run: bash scripts/check-reflector-scope.sh --self-test
      - name: G6 no new wide reflector scope or legacy store use
        run: bash scripts/check-reflector-scope.sh

      - name: G7 self-test
        run: bash scripts/check-openbao-no-unseal-secret.sh --self-test
      - name: G7 no new reference to the OpenBao unseal material
        run: bash scripts/check-openbao-no-unseal-secret.sh

      - name: G9 self-test
        run: bash scripts/check-secret-delivery-lint.sh --self-test
      - name: G9 delivery lint
        run: bash scripts/check-secret-delivery-lint.sh

      - name: a randAlphaNum added to a real chart template fails G2
        run: |
          f="$(git ls-files 'platform/*/chart/templates/*.yaml' | awk 'NR==1')"
          test -n "$f"
          printf '%s\n' 'probe: {{ randAlphaNum 8 }}' >> "$f"
          if bash scripts/check-no-chart-random-secrets.sh > "$RUNNER_TEMP/g2-probe.txt"; then
            echo "::error::G2 passed with a randAlphaNum added to $f"
            exit 1
          fi
          grep -F "$f" "$RUNNER_TEMP/g2-probe.txt"
          git checkout -- "$f"
