# check-ruleset-drift.yaml - the live rulesets equal .github/rulesets/main.json and rc.json, and
# the write deploy keys equal .github/rulesets/deploy-keys.json.
#
# The rules are in scripts/check-ruleset-drift.py. It reads the live rulesets and the deploy keys
# with the token in the secret RULESET_READ_TOKEN and fails when the token is absent: it never
# passes on a read that did not happen. Both reads need the right to read the administration of
# the repository. Started by hand only. No schedule is added: until the repository has an
# application identity, the architect's own scheduled job runs the same script with an
# administrator's credential.
name: check-ruleset-drift

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruleset-drift:
    name: ruleset-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Self-test of the comparison (every rule can fail)
        run: python3 scripts/check-ruleset-drift.py --self-test
      - name: The live rulesets equal the files
        env:
          RULESET_READ_TOKEN: ${{ secrets.RULESET_READ_TOKEN }}
        run: python3 scripts/check-ruleset-drift.py
