# #4049 — BASTION HARBOR WARMUP (reusable). Every image Huawei→Huawei.
#
# The kom4dc RCA (hw182, 2026-06-21): fresh 2-region provs fail the 15-min
# helmwatch FirstSeenTimeout because nodes COLD-fetch PRIVATE
# `ghcr.io/openova-io/openova/*` images DIRECT from ghcr over the throttled
# Huawei→ghcr NAT egress (2.3 MB/s). Harbor's anonymous proxy-ghcr proxy-cache
# 404s those private images (the github-ghcr adapter can't do ghcr's 2-step
# bearer-token flow), so they never warm. The fix routes them through the
# bastion HOSTED project `openova-io` (registries.yaml rewrite in
# infra/providers/huawei/main.tf) — but the hosted project only serves what has
# been PUSHED into it. This workflow NATIVE-PUSHES the current private image set
# into that bastion project. After it lands, every kom4dc node pulls those
# images bastion-local (28 MB/s) with ZERO internet egress.
#
# WHY REUSABLE (#4049 follow-up — the bp-* COMPONENT hole): the warmup used to
# be an inlined job inside catalyst-build.yaml, which only triggers on catalyst
# source paths (core/console, products/catalyst/**, infra/providers/**). A
# PRIVATE bp-* COMPONENT image (e.g. `wordpress-tenant-pg`, the pg4wp WordPress
# runtime) is rebuilt by its own build-bp-*.yaml + re-pinned by
# blueprint-release.yaml on `platform/<name>/chart/**` — NEITHER of which is in
# catalyst-build's trigger set. So a freshly-bumped component tag was NEVER
# warmed → it cold-pulled DIRECT from ghcr on a fresh prov. This was live on the
# omantel.biz demo Org: the `wordpress-tenant-pg` driver image took 20+ minutes
# to pull. Making the warmup a `workflow_call` lets BOTH catalyst-build AND
# blueprint-release (i.e. EVERY chart publish) re-warm the full private set, so
# no private component tag can reach a Sovereign cold.
#
# The image list is fully DATA-DRIVEN from every `repository:`/`tag:` pinned in
# a `platform/**` or `products/**` values.yaml (plus the catalyst chart render
# + the optional just-pushed catalyst SHA tags passed by catalyst-build). It is
# NOT a hardcoded list that rots — the deploy-bot / blueprint-release bump these
# tags, this tracks them.
#
# Mirrors the sovereignty-cutover 03-harbor-prewarm Job's skopeo flags + retry
# discipline (--insecure-policy, --retry-times 5, --command-timeout, parallel
# fan-out, OUTER per-image retry).
#
# PREREQUISITES (PROVISIONED 2026-06-22, #4049 — already live):
#   - CI secret `BASTION_HARBOR_ROBOT_TOKEN` — the secret for the dedicated PUSH
#     robot `robot$openova-warmup` (system-level, push+pull on openova-io/**,
#     never-expiring). SET on this repo. (NOT robot$openova-bot, which is
#     pull-only and cannot push.) Passed by the caller as a `secrets:` input.
#   - The HOSTED project `openova-io` exists on the bastion Harbor (created;
#     this workflow also ensures-creates it idempotently via the Harbor API).
#   - The node-pull robot `robot$openova-bot` was granted openova-io:pull
#     ADDITIVELY so kom4dc nodes can pull the warmed private images.

name: Warmup Bastion Harbor (#4049)

on:
  workflow_call:
    inputs:
      # Optional catalyst image SHA. When catalyst-build invokes this it passes
      # its just-pushed short SHA so the warmup also covers the rolling
      # catalyst-api/ui :<SHA> + :latest tags (the chart's values.yaml is not
      # bumped to ${SHA} until the parallel deploy job, so the rendered tags may
      # still be the PREVIOUS SHA). Empty (the default — e.g. blueprint-release
      # callers) skips the catalyst-SHA extras; the chart render + component
      # extraction still cover everything else.
      catalyst_sha:
        description: 'Short SHA of the just-pushed catalyst-api/ui images (catalyst-build only). Empty = skip the catalyst-SHA extras.'
        required: false
        type: string
        default: ''
    secrets:
      # The dedicated PUSH robot secret. Callers pass
      # secrets.BASTION_HARBOR_ROBOT_TOKEN. Marked required:false so a caller in
      # a fork / a repo without the secret degrades to a non-fatal skip (the
      # Guard step below emits a ::warning and exits clean) instead of a hard
      # workflow error.
      bastion_harbor_robot_token:
        required: false

jobs:
  warmup-bastion-harbor:
    runs-on: ubuntu-latest
    # Non-blocking: a warmup failure must NOT block the caller's deploy /
    # chart-publish path (kubelet still pulls on demand; the worst case is the
    # OLD #4049 slow-cold-pull, not a broken deploy). Callers MUST NOT make
    # downstream jobs `needs:` this one.
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      # The bastion Harbor front door. harbor.openova.io resolves to the bastion
      # EIP 212.72.24.20 publicly; from the kom4dc nodes the SAME Harbor is
      # reached over the local EIP (NAT-bypass) per registries.yaml.
      HARBOR_HOST: harbor.openova.io
      # Hosted project the registries.yaml `openova-io/openova/(.*)` rewrite
      # points the nodes at. skopeo pushes `harbor.openova.io/openova-io/...`.
      HARBOR_PROJECT: openova-io
      # PUSH robot (#4049). The node-pull `robot$openova-bot` is PULL-ONLY, so it
      # CANNOT push. The warmup authenticates as the dedicated
      # `robot$openova-warmup` system robot (push+pull on openova-io/**,
      # never-expiring). Nodes still PULL warmed images as robot$openova-bot via
      # the infra/providers/huawei/main.tf configs.auth.
      HARBOR_USERNAME: 'robot$openova-warmup'
      HARBOR_PASSWORD: ${{ secrets.bastion_harbor_robot_token }}
      # ghcr source creds — this workflow runs in the same repo context, so
      # github.actor + GITHUB_TOKEN has read on the private
      # openova-io/openova/* packages.
      GHCR_USER: ${{ github.actor }}
      GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
      CATALYST_SHA: ${{ inputs.catalyst_sha }}
      # Mirror the cutover prewarm tunables.
      PREWARM_PARALLELISM: '6'
      PREWARM_COPY_ATTEMPTS: '3'
      PREWARM_SKOPEO_TIMEOUT: '1200s'
    steps:
      - name: Checkout openova (public source — the catalyst + component charts)
        uses: actions/checkout@v7
        with:
          repository: openova-io/openova
          path: openova-src

      - name: Install skopeo + helm
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          skopeo --version
          helm version --short

      - name: Guard — warmup secret present
        run: |
          if [ -z "${HARBOR_PASSWORD}" ]; then
            echo "::warning title=#4049 warmup skipped::secrets.BASTION_HARBOR_ROBOT_TOKEN is not set — the bastion Harbor warmup cannot run. Provision the robot token + the hosted 'openova-io' project (see workflow comment). Skipping (non-fatal; nodes fall back to slow cold-pull)."
            echo "WARMUP_SKIP=1" >> "$GITHUB_ENV"
          else
            echo "WARMUP_SKIP=0" >> "$GITHUB_ENV"
          fi

      - name: Ensure hosted project exists on the bastion Harbor
        if: env.WARMUP_SKIP == '0'
        run: |
          set -euo pipefail
          API="https://${HARBOR_HOST}/api/v2.0"
          # Idempotent project-create. 201 = created, 409 = already exists (both
          # success). Any other code → warn but continue (the push will surface a
          # real auth/project error if the project is truly absent).
          code=$(curl -sS -o /tmp/proj.out -w '%{http_code}' \
            -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            -X POST "${API}/projects" \
            -H 'Content-Type: application/json' \
            -d "{\"project_name\":\"${HARBOR_PROJECT}\",\"public\":false}" || echo "000")
          echo "Harbor project ensure: HTTP ${code}"
          cat /tmp/proj.out 2>/dev/null || true
          case "${code}" in
            201) echo "Created hosted project ${HARBOR_PROJECT}." ;;
            409) echo "Hosted project ${HARBOR_PROJECT} already exists — OK." ;;
            *)   echo "::warning::Unexpected HTTP ${code} ensuring project ${HARBOR_PROJECT}; proceeding (push step is authoritative)." ;;
          esac

      - name: Render image set + warmup-push into the bastion (skopeo)
        if: env.WARMUP_SKIP == '0'
        run: |
          set -euo pipefail
          chart="openova-src/products/catalyst/chart"

          # DATA-DRIVEN catalyst image list — UNION of the bare + marketplace-on
          # renders, so we cover the core (catalyst-api/ui + controllers) AND the
          # sme mesh (services-*, marketplace-api/console/admin). The flat chart
          # renders standalone (no `helm dependency build`).
          images="$( { helm template catalyst "${chart}"; \
                       helm template catalyst "${chart}" --set ingress.marketplace.enabled=true; } 2>/dev/null \
            | grep -oE "ghcr\.io/openova-io/openova/[A-Za-z0-9._/-]+:[A-Za-z0-9._-]+" \
            | sort -u || true)"

          # When a catalyst SHA was passed (catalyst-build caller only), ALSO warm
          # the just-pushed catalyst-api/ui at this build's SHA + the rolling
          # :latest. The chart's values.yaml is not bumped to ${CATALYST_SHA}
          # until the parallel deploy job, so the rendered tags above may still be
          # the PREVIOUS SHA. The node pulls whatever the bumped chart pins — that's
          # ${CATALYST_SHA} after deploy — so it MUST be warm. Include :latest too.
          extra=""
          if [ -n "${CATALYST_SHA}" ]; then
            extra="$(printf '%s\n' \
              "ghcr.io/openova-io/openova/catalyst-api:${CATALYST_SHA}" \
              "ghcr.io/openova-io/openova/catalyst-ui:${CATALYST_SHA}" \
              "ghcr.io/openova-io/openova/catalyst-api:latest" \
              "ghcr.io/openova-io/openova/catalyst-ui:latest")"
          fi

          # #4049 ROOT-CAUSE #2 — the bootstrap-kit COMPONENT charts' PRIVATE
          # images (k8s-ws-proxy, openova-flow-server, openova-flow-adapter-flux,
          # evs-csi-plugin, wordpress-tenant-pg, …) are NOT in
          # products/catalyst/chart, so the render above never warms them → they
          # ImagePullBackOff / cold-pull on fresh kom4dc provs (anon proxy-ghcr
          # 404s private packages → node cold-pulls DIRECT from ghcr → 15-min
          # FirstSeenTimeout, and the live omantel.biz pg-driver 20-min stall).
          # Warm them too, DATA-DRIVEN from each component chart's pinned
          # `repository:`/`tag:` (NOT a hardcoded list that rots — the deploy-bot /
          # blueprint-release bump these tags, this tracks them). For every
          # `repository: ghcr.io/openova-io/openova/X` we take the FIRST `tag:`
          # that follows it in the same image block; empty / "latest" /
          # *placeholder* tags are skipped (unwarmable / non-pinned).
          compfile="$(mktemp)"
          for f in $(grep -rlE "repository:[[:space:]]*ghcr\.io/openova-io/openova/" openova-src/platform openova-src/products --include=values.yaml 2>/dev/null | sort -u); do
            awk 'match($0, /repository:[[:space:]]*ghcr\.io\/openova-io\/openova\/[A-Za-z0-9._\/-]+/) { line=substr($0, RSTART, RLENGTH); sub(/^.*repository:[[:space:]]*/, "", line); repo=line; have=1; next } have && match($0, /^[[:space:]]*tag:[[:space:]]*/) { t=$0; sub(/^[[:space:]]*tag:[[:space:]]*/, "", t); gsub(/["'"'"']/, "", t); sub(/[[:space:]]*#.*$/, "", t); gsub(/[[:space:]]/, "", t); if (t != "" && t != "latest" && t !~ /placeholder/) { print repo ":" t } have=0 }' "$f" >>"${compfile}"
          done
          components="$(cat "${compfile}"; rm -f "${compfile}")"

          # Union + dedup; strip any leading/trailing whitespace and blank lines
          # so every line is a clean `docker://`-able ref.
          images="$(printf '%s\n%s\n%s\n' "${images}" "${extra}" "${components}" \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' \
            | sort -u)"

          count=$(printf '%s\n' "${images}" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "${count}" -eq 0 ]; then
            echo "::warning::No openova-io images resolved from chart render — nothing to warm."
            exit 0
          fi
          echo "[warmup] ${count} image(s) to push into ${HARBOR_HOST}/${HARBOR_PROJECT}:"
          printf '%s\n' "${images}"

          cpdir="/tmp/warmup-copies"; rm -rf "${cpdir}"; mkdir -p "${cpdir}"

          # copy_one — mirrors the cutover 03-harbor-prewarm copy_one EXACTLY:
          # ghcr.io/openova-io/openova/X:tag → HARBOR_HOST/openova-io/openova/X:tag
          # (drop the `ghcr.io/` prefix, keep the rest identical → lands under the
          # hosted `openova-io` project the registries.yaml rewrite targets). OUTER
          # per-image retry loop (PREWARM_COPY_ATTEMPTS) wraps the inner
          # --retry-times 5, with a global --command-timeout so a stalled
          # connection can't hang forever. Branch on skopeo's REAL exit status.
          copy_one() {
            up="$1"
            lref="${HARBOR_HOST}/${up#ghcr.io/}"
            slug=$(printf '%s' "${up}" | tr -c 'A-Za-z0-9._-' '_')
            attempt=1; rc=1; : >"${cpdir}/${slug}.log"
            while [ "${attempt}" -le "${PREWARM_COPY_ATTEMPTS}" ]; do
              echo "[warmup] copy ${up} attempt ${attempt}/${PREWARM_COPY_ATTEMPTS}" >>"${cpdir}/${slug}.log"
              if skopeo --command-timeout "${PREWARM_SKOPEO_TIMEOUT}" copy \
                --insecure-policy \
                --retry-times 5 \
                --src-creds="${GHCR_USER}:${GHCR_PAT}" \
                --dest-creds="${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
                --dest-tls-verify=true \
                --src-tls-verify=true \
                "docker://${up}" "docker://${lref}" >>"${cpdir}/${slug}.log" 2>&1; then
                rc=0; break
              else
                rc=$?
              fi
              echo "[warmup] copy ${up} attempt ${attempt} failed (exit=${rc}); retry after backoff" >>"${cpdir}/${slug}.log"
              attempt=$((attempt+1))
              [ "${attempt}" -le "${PREWARM_COPY_ATTEMPTS}" ] && sleep 5
            done
            if [ "${rc}" -eq 0 ]; then printf '%s' "${up}" >"${cpdir}/${slug}.ok"
            else printf '%s exit=%s' "${up}" "${rc}" >"${cpdir}/${slug}.fail"; fi
          }

          # Parallel fan-out throttled to PREWARM_PARALLELISM live workers (kill -0
          # polling — `jobs -p` is unreliable non-interactively).
          pids=""
          for up in ${images}; do
            echo "[warmup] queue ${up} → ${HARBOR_HOST}/${up#ghcr.io/}"
            copy_one "${up}" &
            pids="${pids} $!"
            while : ; do
              live=0; newpids=""
              for p in ${pids}; do
                if kill -0 "${p}" 2>/dev/null; then live=$((live+1)); newpids="${newpids} ${p}"; fi
              done
              pids="${newpids}"
              [ "${live}" -lt "${PREWARM_PARALLELISM}" ] && break
              sleep 2
            done
          done
          wait

          ok=0; fail=0
          for f in "${cpdir}"/*.ok;   do [ -e "${f}" ] && { ok=$((ok+1)); echo "[warmup] OK   $(cat "${f}")"; }; done
          for f in "${cpdir}"/*.fail; do [ -e "${f}" ] && { fail=$((fail+1)); echo "[warmup] FAIL $(cat "${f}")"; echo "---"; cat "${cpdir}/$(basename "${f}" .fail).log" 2>/dev/null | tail -20; echo "---"; }; done
          echo "[warmup] pushed ${ok} ok, ${fail} failed (of ${count})."
          # Non-fatal even on partial failure: the workflow is continue-on-error
          # and must not block the caller. A FAIL count surfaces in the log + the
          # step's own non-zero exit so an operator sees it, but the pipeline
          # proceeds (kubelet on-demand pull is the safety net).
          if [ "${fail}" -gt 0 ]; then
            echo "::warning title=#4049 warmup partial::${fail}/${count} image(s) failed to warm the bastion — nodes may cold-pull those (see logs above)."
          fi
