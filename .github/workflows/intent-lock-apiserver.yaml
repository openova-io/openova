# intent-lock-apiserver.yaml - the intent lock on a real API server.
#
# A render test cannot see whether the API server accepts the policy: lab
# test CTL-050 (docs/ledger/plan/spikes/CTL-050.md) found an expression that
# the Kubernetes API server refuses and a render passes. So this workflow
# starts one k3s v1.31.8+k3s1 server as a container, the release the
# Sovereigns run, and runs the chart test of the lock in its --apiserver
# mode: the policy and the eight bindings are accepted; audit admits a create
# with a warning and counts it in the audit series; deny refuses a create and
# lets a label change pass. The test reaches the API server with the kubectl
# inside the container. No port is published and no Service is created.
name: intent-lock-apiserver

on:
  pull_request:
    paths:
      - 'products/catalyst/chart/templates/intent-lock/**'
      - 'products/catalyst/chart/values.yaml'
      - 'products/catalyst/chart/tests/intent-lock.sh'
      - 'products/catalyst/chart/crds/application.yaml'
      - '.github/workflows/intent-lock-apiserver.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apiserver:
    name: intent lock on a real API server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Start one k3s server as a container
        run: |
          set -euo pipefail
          docker run -d --name lock-k3s --hostname lock-k3s --privileged \
            --tmpfs /run --tmpfs /var/run --ulimit nofile=65535:65535 \
            docker.io/rancher/k3s:v1.31.8-k3s1 server \
            --disable=traefik --disable=servicelb --disable=local-storage --disable=metrics-server \
            --kube-proxy-arg=conntrack-max-per-core=0
          for _ in $(seq 1 100); do
            docker exec lock-k3s kubectl get --raw /readyz > /dev/null 2>&1 && break
            sleep 3
          done
          docker exec lock-k3s kubectl get --raw /readyz
          docker exec lock-k3s kubectl version

      - name: The chart test of the lock, render and API server
        env:
          KUBECTL: docker exec -i lock-k3s kubectl
        run: bash products/catalyst/chart/tests/intent-lock.sh products/catalyst/chart --apiserver

      - name: The last log lines of k3s
        if: failure()
        run: docker logs --tail 60 lock-k3s 2>&1 | cut -c1-300
