# uat-drift-guard.yaml — block UAT walk-evidence that cites a PREDECESSOR env.
#
# THE LAW (founder 2026-06-14, the "fake snapshots" rebuke): each new env
# flushes ALL prior evidence — a ✅ UAT row that still links a wiped env's
# screenshot is a fabricated snapshot. `scripts/reset-uat.py` clears that
# evidence on a fresh fire; THIS guard is the CI backstop that fails the build
# if a ledger slips through with a ✅ row whose proof artifact references an
# `hwNNN` env that is not the current env (resolved from the UAT.md H1 header,
# or $UAT_CURRENT_ENV / --env).
#
# READ-ONLY: this guard never edits the ledger (verification stays read-only —
# memory L7/L8). It only reports. The fix for a violation is a live re-walk on
# the current env (the evidence half), or `python3 scripts/reset-uat.py <env>`.
#
# Self-test runs on every trigger so the guard's own logic is continuously
# protected (clean tree -> 0, stale fixture -> 1, env-agnostic predecessor
# detection both directions).
name: uat-drift-guard

on:
  pull_request:
    paths:
      - "docs/ledger/UAT.md"
      - "docs/ledger/uat-walkthrough/**"
      - "docs/ledger/uat-testcases.csv"
      - "docs/ledger/uat-retirements.csv"
      - "scripts/uat-drift-guard.py"
      - "scripts/test_uat_table_shape.py"
      - "scripts/test_uat_clause_identity.py"
      - "scripts/reset-uat.py"
      - ".github/workflows/uat-drift-guard.yaml"
  push:
    branches: [main]
    paths:
      - "docs/ledger/UAT.md"
      - "docs/ledger/uat-walkthrough/**"
      - "docs/ledger/uat-testcases.csv"
      - "docs/ledger/uat-retirements.csv"
      - "scripts/uat-drift-guard.py"
      - "scripts/test_uat_table_shape.py"
      - "scripts/test_uat_clause_identity.py"
      - "scripts/reset-uat.py"
      - ".github/workflows/uat-drift-guard.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-guard:
    name: UAT predecessor-env drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Self-test the guard (clean -> 0, stale -> 1, both directions)
        run: python3 scripts/uat-drift-guard.py --self-test

      - name: Guard the live UAT ledger against predecessor-env evidence
        # Current env is auto-derived from the `on \`hwNNN\`` token in the UAT.md
        # H1 header. Override in an ad-hoc run with UAT_CURRENT_ENV=hwNNN.
        run: python3 scripts/uat-drift-guard.py

  table-shape:
    name: UAT table shape (no unescaped pipes, Result column populated)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Vacuity control, run BEFORE the real check. Every assertion in the guard
      # has the form "no row is bad", which is trivially true on an empty parse.
      # A drifted row regex would therefore make it pass LOUDEST at the moment it
      # had stopped checking anything. Break the regex on a scratch copy and
      # require a non-zero exit; only then trust the green below.
      # Vacuity control, run BEFORE the real check. Every assertion in the guard
      # has the form "no row is bad", which is trivially true on an empty parse.
      # A drifted row regex would therefore make it pass LOUDEST at the moment it
      # had stopped checking anything. Break the regex on a scratch copy and
      # require it to fail FOR THAT REASON.
      #
      # The mutant is written into scripts/ on purpose. The guard resolves the
      # ledger as parent.parent of its own __file__, so a copy in /tmp looks for
      # /docs/ledger/UAT.md and dies with FileNotFoundError. The first cut did
      # exactly that and the control reported success on a crash that had nothing
      # to do with the regex — a vacuity check that was itself vacuous. Hence
      # both the sibling-directory placement AND the assertion on the message.
      - name: Prove the guard can go red (vacuity control)
        run: |
          set -u
          python3 - <<'MUT'
          import re, pathlib
          src = pathlib.Path("scripts/test_uat_table_shape.py").read_text()
          out, n = re.subn(r'^ROW = re\.compile\(.*$',
                           'ROW = re.compile(r"^NEVERMATCHES")',
                           src, count=1, flags=re.M)
          assert n == 1, "mutation did not apply — the control below would prove nothing"
          pathlib.Path("scripts/.shape_mutant.py").write_text(out)
          MUT

          set +e
          OUT="$(python3 scripts/.shape_mutant.py 2>&1)"; RC=$?
          set -e
          rm -f scripts/.shape_mutant.py

          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "::error::the guard PASSED with a regex matching no rows — it is not checking the ledger."
            exit 1
          fi
          case "$OUT" in
            *"rows matched the row regex"*)
              echo "OK — guard goes red, and for the right reason." ;;
            *)
              echo "::error::the mutant failed, but NOT via the row-count assertion."
              echo "::error::A crash would satisfy a naive exit-code check while proving nothing."
              exit 1 ;;
          esac

      - name: Guard the UAT table shape
        run: python3 scripts/test_uat_table_shape.py

  clause-identity:
    name: UAT ledger identity (286 frozen, bijective, clause-identical, retirements recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The self-test IS the vacuity control, and it runs FIRST. Legs B/C/D all
      # have the shape "no row is bad", which an empty parse satisfies — so a
      # drifted row regex would make this guard loudest at the moment it stopped
      # checking anything. The self-test mutates an in-memory copy once per leg
      # (a stripped backtick, a vanished canon row, a hollowed retirement ground,
      # an unreadable table) and requires each mutant to fail BY NAME, not merely
      # to exit non-zero — a crash satisfies a naive exit-code check while proving
      # nothing. It also prints whether the real ledger is currently clean, so a
      # red tree cannot hide behind four green mutants.
      - name: Prove the guard goes red on each leg (self-test)
        run: python3 scripts/test_uat_clause_identity.py --self-test

      - name: Guard the ledger's ROW-184 identity invariant
        run: python3 scripts/test_uat_clause_identity.py
