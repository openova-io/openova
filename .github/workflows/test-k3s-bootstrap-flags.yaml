name: test-k3s-bootstrap-flags

# SEC-125. Proves on a runner that k3s v1.31.8+k3s1 starts with the bootstrap
# flags the shared boot template is to carry: etcd encryption with the
# secretbox provider, a server token, and a separate agent token.
#
# tests/e2e/k3s-bootstrap-flags.sh starts three servers and one agent as
# containers and makes four assertions: (1) four nodes are Ready; (2) every
# server reports encryption enabled; (3) the value of a canary Secret is not
# readable in the etcd files; (4) a fourth server that holds only the agent
# token is refused.
#
# The containers talk to each other on a container network of the runner. No
# port of a node is published and no Service is created.
#
# A pull request that changes the shared boot template runs this proof again.

on:
  pull_request:
    paths:
      - 'infra/providers/_shared/**'
      - 'tests/e2e/k3s-bootstrap-flags.sh'
      - '.github/workflows/test-k3s-bootstrap-flags.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k3s-bootstrap-flags:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Self-test (each of the four assertions can fail)
        run: bash tests/e2e/k3s-bootstrap-flags.sh --self-test

      # Four kubelets and three API servers share the file-watch limits of one
      # runner. The defaults are sized for one.
      - name: Raise the file-watch limits of the runner
        run: sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288

      - name: Three servers and one agent with the bootstrap flags
        timeout-minutes: 20
        run: bash tests/e2e/k3s-bootstrap-flags.sh
