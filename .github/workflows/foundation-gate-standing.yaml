name: foundation-gate-standing

# The gate against the standing environment: it updates the environment in place to a candidate
# through the product's release route, then gates it twice. It wipes and installs nothing. Inputs:
# candidate_id, env, execution (as in foundation-gate.yaml: hosted, the default, or parent; it
# selects where the job regions works, and the job update always works on the parent). Every job
# runs on ubuntu-latest.
#   test       scripts/standing-gate.py --self-test and scripts/standing-update.sh --self-test (also
#              on pull requests that change them).
#   candidate  scripts/release-candidate.sh verify: the candidate's commit.
#   update     in a Job on the parent (scripts/gate-parent-job.sh run --mode update), after the
#              images of the Job are built or found: scripts/standing-update.sh delivers the candidate
#              through the release route PUT /api/v1/sovereign/release, one region per request,
#              region b then region a, with the OpenBao snapshot of each region taken and read back
#              first, and a rollback request for each region it moved when a region does not converge
#              or compares worse than its state before (FND-076). When both regions run the candidate
#              and the route reports it delivered, it sends nothing. A refusal of the route (a stage
#              conflict, a route installed before SOV-521) is named and stops the run; the update
#              never works around it. Every wait reads once a minute.
#   regions    with the kubeconfigs of the environment gate: `standing-gate.py source` for region b,
#              then a (Flux applied the candidate commit or a descendant, read in the region's own
#              Gitea), then `standing-gate.py converge` for both (every HelmRelease that is not
#              suspended is Ready, within 60 minutes per region). Its failure stops the run early.
#              In parent execution these run in a Job on the parent (scripts/gate-parent-job.sh),
#              after the images of the Job are built or found.
#   gate-1     the first run of foundation-gate.yaml; records-1: one valid record of this run on main.
#   gate-2     the second run, only when records-1 passed; records-2: two valid records of this run.
# A record of this run has producer.run_id equal to this run's id (a called workflow runs under the
# caller's run). Start a new run instead of re-running jobs: a re-run adds records.

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: The candidate rc/<id> to update the standing environment to and gate
        required: true
      env:
        description: The environment label of the standing environment
        required: true
      execution:
        description: "Where the work that dials the Sovereign's API port runs: hosted (the job's machine) or parent (a Job on the parent cluster)"
        type: choice
        options: [hosted, parent]
        default: hosted
  pull_request:
    paths:
      - 'scripts/standing-gate.py'
      - 'scripts/standing-update.sh'
      - 'scripts/standing-update/**'
      - '.github/workflows/foundation-gate-standing.yaml'

permissions:
  contents: read

concurrency:
  group: foundation-gate-standing-${{ inputs.env || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: standing gate self-test (no cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: standing-gate.py self-test
        run: python3 scripts/standing-gate.py --self-test
      - name: standing-update.sh self-test
        run: bash scripts/standing-update.sh --self-test

  candidate:
    name: verify the candidate
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install PyYAML and yq
        run: |
          set -e
          pip install --quiet pyyaml
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
          helm version --short
      - name: release-candidate.sh verify
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          commit="$(bash scripts/release-candidate.sh verify "$CANDIDATE_ID")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::verify printed no commit"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Candidate rc/$CANDIDATE_ID verified at commit $commit" >> "$GITHUB_STEP_SUMMARY"

  update:
    name: update the regions through the release route
    needs: candidate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: gate
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out the commit under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'
          cache: false
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: The images of the Job, by digest
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          bash scripts/gate-parent-job.sh image --candidate candidate --commit "$COMMIT" --output "$RUNNER_TEMP/images"
          cat "$RUNNER_TEMP/images" >> "$GITHUB_OUTPUT"
          { echo '### Images of the Job'; echo; echo '```'; cat "$RUNNER_TEMP/images"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The parent kubeconfig (never echoed)
        env:
          KP: ${{ secrets.ACCEPTANCE_PARENT_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KP" ]; then echo "::error::the secret ACCEPTANCE_PARENT_KUBECONFIG of the environment gate is not set"; exit 2; fi
          umask 077; mkdir -p "$RUNNER_TEMP/parent"
          printf '%s' "$KP" | base64 -d > "$RUNNER_TEMP/parent/parent.yaml"
      - name: Write kubeconfigs (never echoed)
        env:
          KA: ${{ secrets.ACCEPTANCE_KUBECONFIG_A }}
          KB: ${{ secrets.ACCEPTANCE_KUBECONFIG_B }}
        run: |
          set -euo pipefail
          if [ -z "$KA" ] || [ -z "$KB" ]; then echo "::error::ACCEPTANCE_KUBECONFIG_A/B secrets are not set"; exit 2; fi
          umask 077; mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KA" | base64 -d > "$RUNNER_TEMP/kube/a.yaml"
          printf '%s' "$KB" | base64 -d > "$RUNNER_TEMP/kube/b.yaml"
      - name: Deliver the candidate through the release route, in a Job on the parent
        env:
          COMMIT: ${{ needs.candidate.outputs.commit }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          ENV_LABEL: ${{ inputs.env }}
          JOB_IMAGE: ${{ steps.images.outputs.job }}
          GH_TOKEN: ${{ github.token }}
          GATE_RESOURCES: ${{ vars.GATE_PARENT_RESOURCES }} # empty: the defaults of scripts/gate-parent-job.sh
        run: |
          set -euo pipefail
          o="$RUNNER_TEMP/parent-update"
          # The install's addresses, read here (kubeconfigs and DNS): the Job's Pods may reach these only.
          targets="$(GATE_KUBECONFIG_A="$RUNNER_TEMP/kube/a.yaml" GATE_KUBECONFIG_B="$RUNNER_TEMP/kube/b.yaml" \
            bash scripts/gate-parent-job.sh targets --env "$ENV_LABEL")"
          GATE_PARENT_KUBECONFIG="$RUNNER_TEMP/parent/parent.yaml" GATE_KUBECONFIG_A="$RUNNER_TEMP/kube/a.yaml" \
            GATE_KUBECONFIG_B="$RUNNER_TEMP/kube/b.yaml" GATE_PULL_USER="$GITHUB_ACTOR" GATE_PULL_TOKEN="$GH_TOKEN" \
            GATE_RUN="$GITHUB_RUN_ID" CANDIDATE_COMMIT="$COMMIT" CANDIDATE_ID="$CANDIDATE_ID" ENV_LABEL="$ENV_LABEL" \
            bash scripts/gate-parent-job.sh run --mode update --out "$o" --targets "$targets" --job-image "$JOB_IMAGE"
          grep -qx 'rc=0' "$o/outputs" || { echo "::error::The update of the standing environment failed; the Job's log above names the step."; exit 1; }
      - name: Delete the Job and its Secrets
        if: always()
        run: |
          set -uo pipefail
          p="$RUNNER_TEMP/parent/parent.yaml"
          if [ -r "$p" ]; then
            GATE_PARENT_KUBECONFIG="$p" bash scripts/gate-parent-job.sh cleanup --out "$RUNNER_TEMP/parent-update" \
              || echo "::warning::The Job of this run or its Secrets could not be deleted; the Job deletes itself an hour after it ended."
          fi
          rm -f "$p"

  regions:
    name: the regions carry the candidate and have converged
    needs: [candidate, update]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: gate
    timeout-minutes: 190
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Where the cluster work runs
        id: mode
        env:
          EXECUTION: ${{ inputs.execution }}
        run: |
          set -euo pipefail
          e="$(bash scripts/gate-parent-job.sh execution "$EXECUTION")"
          echo "execution=$e" >> "$GITHUB_OUTPUT"
          echo "Execution: $e" >> "$GITHUB_STEP_SUMMARY"
      - name: "Parent execution: check out the commit under test"
        if: steps.mode.outputs.execution == 'parent'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          path: candidate
          persist-credentials: false
      - if: steps.mode.outputs.execution == 'parent'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'
          cache: false
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: "Parent execution: the images of the Job, by digest"
        id: images
        if: steps.mode.outputs.execution == 'parent'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          bash scripts/gate-parent-job.sh image --candidate candidate --commit "$COMMIT" --output "$RUNNER_TEMP/images"
          cat "$RUNNER_TEMP/images" >> "$GITHUB_OUTPUT"
          { echo '### Images of the Job'; echo; echo '```'; cat "$RUNNER_TEMP/images"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: "Parent execution: the parent kubeconfig (never echoed)"
        if: steps.mode.outputs.execution == 'parent'
        env:
          KP: ${{ secrets.ACCEPTANCE_PARENT_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KP" ]; then echo "::error::the secret ACCEPTANCE_PARENT_KUBECONFIG of the environment gate is not set"; exit 2; fi
          umask 077; mkdir -p "$RUNNER_TEMP/parent"
          printf '%s' "$KP" | base64 -d > "$RUNNER_TEMP/parent/parent.yaml"
      - name: Write kubeconfigs (never echoed)
        env:
          KA: ${{ secrets.ACCEPTANCE_KUBECONFIG_A }}
          KB: ${{ secrets.ACCEPTANCE_KUBECONFIG_B }}
        run: |
          set -euo pipefail
          if [ -z "$KA" ] || [ -z "$KB" ]; then echo "::error::ACCEPTANCE_KUBECONFIG_A/B secrets are not set"; exit 2; fi
          umask 077; mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KA" | base64 -d > "$RUNNER_TEMP/kube/a.yaml"
          printf '%s' "$KB" | base64 -d > "$RUNNER_TEMP/kube/b.yaml"
      - name: Flux of each region applied the candidate commit or a descendant
        if: steps.mode.outputs.execution == 'hosted'
        env:
          COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          set -euo pipefail
          for r in b a; do
            python3 scripts/standing-gate.py source --kubeconfig "$RUNNER_TEMP/kube/$r.yaml" --region "$r" --candidate "$COMMIT"
          done
      - name: Every HelmRelease of each region is Ready
        if: steps.mode.outputs.execution == 'hosted'
        run: |
          set -euo pipefail
          for r in b a; do
            python3 scripts/standing-gate.py converge --kubeconfig "$RUNNER_TEMP/kube/$r.yaml" --region "$r" --minutes 60 --interval 30
          done
      - name: "Parent execution: the regions carry the candidate and have converged, read in a Job on the parent"
        if: steps.mode.outputs.execution == 'parent'
        env:
          COMMIT: ${{ needs.candidate.outputs.commit }}
          JOB_IMAGE: ${{ steps.images.outputs.job }}
          GH_TOKEN: ${{ github.token }}
          GATE_RESOURCES: ${{ vars.GATE_PARENT_RESOURCES }} # empty: the defaults of scripts/gate-parent-job.sh
          ENV_LABEL: ${{ inputs.env }}
        run: |
          set -euo pipefail
          o="$RUNNER_TEMP/parent-regions"
          # The install's addresses, read here (kubeconfigs and DNS): the Job's Pods may reach these only.
          targets="$(GATE_KUBECONFIG_A="$RUNNER_TEMP/kube/a.yaml" GATE_KUBECONFIG_B="$RUNNER_TEMP/kube/b.yaml" \
            bash scripts/gate-parent-job.sh targets --env "$ENV_LABEL")"
          GATE_PARENT_KUBECONFIG="$RUNNER_TEMP/parent/parent.yaml" GATE_KUBECONFIG_A="$RUNNER_TEMP/kube/a.yaml" \
            GATE_KUBECONFIG_B="$RUNNER_TEMP/kube/b.yaml" GATE_PULL_USER="$GITHUB_ACTOR" GATE_PULL_TOKEN="$GH_TOKEN" \
            GATE_RUN="$GITHUB_RUN_ID" CANDIDATE_COMMIT="$COMMIT" \
            bash scripts/gate-parent-job.sh run --mode regions --out "$o" --targets "$targets" --job-image "$JOB_IMAGE"
          grep -qx 'rc=0' "$o/outputs" || { echo "::error::The regions do not carry the candidate or have not converged; the Job's log is above."; exit 1; }
      - name: "Parent execution: delete the Job and its Secrets"
        if: always() && steps.mode.outputs.execution == 'parent'
        run: |
          set -uo pipefail
          p="$RUNNER_TEMP/parent/parent.yaml"
          if [ -r "$p" ]; then
            GATE_PARENT_KUBECONFIG="$p" bash scripts/gate-parent-job.sh cleanup --out "$RUNNER_TEMP/parent-regions" \
              || echo "::warning::The Job of this run or its Secrets could not be deleted; the Job deletes itself an hour after it ended."
          fi
          rm -f "$p"

  gate-1:
    name: gate run 1
    needs: regions
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
    uses: ./.github/workflows/foundation-gate.yaml
    with:
      env: ${{ inputs.env }}
      candidate_id: ${{ inputs.candidate_id }}
      execution: ${{ inputs.execution }}
    secrets: inherit

  records-1:
    name: gate run 1 wrote a valid record
    needs: [regions, gate-1]
    if: ${{ !cancelled() && needs.regions.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: One valid record of this run
        env:
          ENV_LABEL: ${{ inputs.env }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          RUN: ${{ github.run_id }}
        run: python3 scripts/standing-gate.py records --dir docs/ledger/acceptance --env "$ENV_LABEL" --candidate-id "$CANDIDATE_ID" --run-id "$RUN" --expect 1

  gate-2:
    name: gate run 2
    needs: [records-1]
    if: ${{ !cancelled() && needs.records-1.result == 'success' }}
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
    uses: ./.github/workflows/foundation-gate.yaml
    with:
      env: ${{ inputs.env }}
      candidate_id: ${{ inputs.candidate_id }}
      execution: ${{ inputs.execution }}
    secrets: inherit

  records-2:
    name: both gate runs wrote a valid record
    needs: [records-1, gate-2]
    if: ${{ !cancelled() && needs.records-1.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Two valid records of this run
        env:
          ENV_LABEL: ${{ inputs.env }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          RUN: ${{ github.run_id }}
        run: python3 scripts/standing-gate.py records --dir docs/ledger/acceptance --env "$ENV_LABEL" --candidate-id "$CANDIDATE_ID" --run-id "$RUN" --expect 2
