name: foundation-gate-standing

# The gate against the standing environment, after it was updated in place to a candidate. It
# updates, wipes and installs nothing. Inputs: candidate_id, env, runner (as in foundation-gate.yaml).
#   test       scripts/standing-gate.py --self-test (also on pull requests that change it).
#   candidate  scripts/release-candidate.sh verify: the candidate's commit.
#   regions    with the kubeconfigs of the environment gate: `standing-gate.py source` for region b,
#              then a (Flux applied the candidate commit or a descendant, read in the region's own
#              Gitea), then `standing-gate.py converge` for both (every HelmRelease that is not
#              suspended is Ready, within 60 minutes per region). Its failure stops the run early.
#   gate-1     the first run of foundation-gate.yaml; records-1: one valid record of this run on main.
#   gate-2     the second run, only when records-1 passed; records-2: two valid records of this run.
# A record of this run has producer.run_id equal to this run's id (a called workflow runs under the
# caller's run). Start a new run instead of re-running jobs: a re-run adds records.

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: The candidate rc/<id> that the standing environment was updated to
        required: true
      env:
        description: The environment label of the standing environment
        required: true
      runner:
        description: The runs-on label of the runner that reaches every region
        default: foundation-gate
  pull_request:
    paths:
      - 'scripts/standing-gate.py'
      - '.github/workflows/foundation-gate-standing.yaml'

permissions:
  contents: read

concurrency:
  group: foundation-gate-standing-${{ inputs.env || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: standing gate self-test (no cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: standing-gate.py self-test
        run: python3 scripts/standing-gate.py --self-test

  candidate:
    name: verify the candidate
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install PyYAML and yq
        run: |
          set -e
          pip install --quiet pyyaml
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
          helm version --short
      - name: release-candidate.sh verify
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          commit="$(bash scripts/release-candidate.sh verify "$CANDIDATE_ID")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::verify printed no commit"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Candidate rc/$CANDIDATE_ID verified at commit $commit" >> "$GITHUB_STEP_SUMMARY"

  regions:
    name: the regions carry the candidate and have converged
    needs: candidate
    runs-on: ${{ inputs.runner }}
    environment: gate
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Write kubeconfigs (never echoed)
        env:
          KA: ${{ secrets.ACCEPTANCE_KUBECONFIG_A }}
          KB: ${{ secrets.ACCEPTANCE_KUBECONFIG_B }}
        run: |
          set -euo pipefail
          if [ -z "$KA" ] || [ -z "$KB" ]; then echo "::error::ACCEPTANCE_KUBECONFIG_A/B secrets are not set"; exit 2; fi
          umask 077; mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KA" | base64 -d > "$RUNNER_TEMP/kube/a.yaml"
          printf '%s' "$KB" | base64 -d > "$RUNNER_TEMP/kube/b.yaml"
      - name: Flux of each region applied the candidate commit or a descendant
        env:
          COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          set -euo pipefail
          for r in b a; do
            python3 scripts/standing-gate.py source --kubeconfig "$RUNNER_TEMP/kube/$r.yaml" --region "$r" --candidate "$COMMIT"
          done
      - name: Every HelmRelease of each region is Ready
        run: |
          set -euo pipefail
          for r in b a; do
            python3 scripts/standing-gate.py converge --kubeconfig "$RUNNER_TEMP/kube/$r.yaml" --region "$r" --minutes 60 --interval 30
          done

  gate-1:
    name: gate run 1
    needs: regions
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/foundation-gate.yaml
    with:
      env: ${{ inputs.env }}
      candidate_id: ${{ inputs.candidate_id }}
      runner: ${{ inputs.runner }}
    secrets: inherit

  records-1:
    name: gate run 1 wrote a valid record
    needs: [regions, gate-1]
    if: ${{ !cancelled() && needs.regions.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: One valid record of this run
        env:
          ENV_LABEL: ${{ inputs.env }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          RUN: ${{ github.run_id }}
        run: python3 scripts/standing-gate.py records --dir docs/ledger/acceptance --env "$ENV_LABEL" --candidate-id "$CANDIDATE_ID" --run-id "$RUN" --expect 1

  gate-2:
    name: gate run 2
    needs: [records-1]
    if: ${{ !cancelled() && needs.records-1.result == 'success' }}
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/foundation-gate.yaml
    with:
      env: ${{ inputs.env }}
      candidate_id: ${{ inputs.candidate_id }}
      runner: ${{ inputs.runner }}
    secrets: inherit

  records-2:
    name: both gate runs wrote a valid record
    needs: [records-1, gate-2]
    if: ${{ !cancelled() && needs.records-1.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Two valid records of this run
        env:
          ENV_LABEL: ${{ inputs.env }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          RUN: ${{ github.run_id }}
        run: python3 scripts/standing-gate.py records --dir docs/ledger/acceptance --env "$ENV_LABEL" --candidate-id "$CANDIDATE_ID" --run-id "$RUN" --expect 2
