name: spike-aip-020
# Throwaway lab test (spike AIP-020). Runs on pushes to its own branch only and is never merged.
# The agent kit is driven against a scripted model endpoint inside a container with no network.
on:
  push:
    branches: [spike/AIP-020]
permissions:
  contents: read
concurrency:
  group: spike-aip-020
  cancel-in-progress: false
jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: node:22.17.0-bookworm-slim
    defaults:
      run:
        working-directory: tests/spikes/AIP-020
    steps:
      - uses: actions/checkout@v4
      - name: Install the kit at the pinned version (network on)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/w" -w /w "$IMAGE" \
            npm install --no-audit --no-fund
          grep -h '"version"\|claudeCodeVersion' node_modules/@anthropic-ai/claude-agent-sdk/package.json
          ls node_modules/@anthropic-ai/
          du -sh node_modules/@anthropic-ai/* || true
      - name: Run the tests (container network none, child sees only the scripted endpoint)
        run: |
          mkdir -p out
          set -o pipefail
          docker run --rm --network none --shm-size=1g --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/w" -w /w "$IMAGE" timeout 2100 node run.mjs 2>&1 | tee out/run.log
      - name: Debug log tails
        if: always()
        run: |
          noise='temp file|Temp file|Renaming|written atomically|Preserving file permissions|Applied original permissions'
          for f in out/debug-*.log; do echo "=== $f"; grep -Ev "$noise" "$f" | grep -v '^\s*$' | tail -n 60 | cut -c1-400; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aip-020-evidence
          path: tests/spikes/AIP-020/out/
          retention-days: 30
