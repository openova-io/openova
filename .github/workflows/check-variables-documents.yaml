name: check-variables-documents

# Guard G8 of contract C5, the variables document. Every variables.yaml under
# clusters/ and tests/ passes the schema and the cross-field rules of
# docs/contracts/c5-upstream-variables.schema.json, and the Go package
# core/controllers/pkg/upstream holds exact copies of the two contract files.
# Its rules are at the head of scripts/check-variables-documents.sh.
# No path filter: a variables document may be added anywhere under clusters/
# or tests/, and the check is cheap.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  variables-documents:
    name: variables-documents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/controllers/go.mod
          cache-dependency-path: core/controllers/go.sum
      - name: Tests of the package upstream
        working-directory: core/controllers
        run: go test -count=1 ./pkg/upstream/...
      - name: Self-test (each rule can fail)
        run: bash scripts/check-variables-documents.sh --self-test
      - name: Guard G8
        run: bash scripts/check-variables-documents.sh
