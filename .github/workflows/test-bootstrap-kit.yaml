name: Test — Bootstrap Kit (kind cluster + Flux)

# Closes #145 — integration test that the 11-component bootstrap kit's
# Flux Kustomizations are well-formed and accepted by a real K8s API
# server. Spins up a kind cluster, installs Flux, and asserts that all
# 11 Kustomizations get registered. Does NOT wait for full reconciliation
# (chart pulls + cloud creds belong to #141 Hetzner E2E).

on:
  push:
    paths:
      - 'tests/e2e/bootstrap-kit/**'
      - 'platform/**/blueprint.yaml'
      - 'platform/**/chart/**'
      - 'products/**/chart/**'
      - 'clusters/**'
      - 'infra/providers/_shared/cloudinit-control-plane.tftpl'
      - 'scripts/check-bootstrap-deps.sh'
      - 'scripts/check-bootstrap-kit-pin-sync.sh'
      - 'scripts/check-umbrella-republish-gate.py'
      - 'scripts/sync-catalog-seed-pin.py'
      - 'scripts/check-cloudinit-kustomization-deps.sh'
      - 'scripts/expected-bootstrap-deps.yaml'
      - 'scripts/expected-cloudinit-kustomization-deps.yaml'
      - 'scripts/render-slot-placement.py'
      - 'scripts/tests/render_slot_placement_hostbridge_test.py'
      - 'scripts/audit-placement-conformance.py'
      - '.github/workflows/test-bootstrap-kit.yaml'
    branches: [main]
  pull_request:
    paths:
      - 'tests/e2e/bootstrap-kit/**'
      - 'platform/**/blueprint.yaml'
      - 'platform/**/chart/**'
      - 'products/**/chart/**'
      - 'clusters/**'
      - 'infra/providers/_shared/cloudinit-control-plane.tftpl'
      - 'scripts/check-bootstrap-deps.sh'
      - 'scripts/check-bootstrap-kit-pin-sync.sh'
      - 'scripts/check-umbrella-republish-gate.py'
      - 'scripts/sync-catalog-seed-pin.py'
      - 'scripts/check-cloudinit-kustomization-deps.sh'
      - 'scripts/expected-bootstrap-deps.yaml'
      - 'scripts/expected-cloudinit-kustomization-deps.yaml'
      - 'scripts/render-slot-placement.py'
      - 'scripts/tests/render_slot_placement_hostbridge_test.py'
      - 'scripts/audit-placement-conformance.py'
      - '.github/workflows/test-bootstrap-kit.yaml'
  workflow_dispatch:
  # #4409 — periodic pin-propagation safety-net. The slot-pin auto-bump
  # runs in a SEPARATE async workflow (blueprint-release.yaml, TBD-A6)
  # that the deploy-bot dispatches per chart bump. When that dispatch
  # fails, leapfrogs a version, or the OCI publish fails, the slot pin is
  # left permanently lagging (or pinned-at-a-never-published tag) and the
  # push-mode audit that saw the transient drift already passed green
  # (continue-on-error) and never re-runs — so the permanent drift rides
  # silently until the NEXT bump of that chart happens to heal it.
  # Concrete failure observed 2026-06-26: bp-catalyst-platform 1.4.867 +
  # 1.4.861 advanced in Chart.yaml but were never published to ghcr while
  # the slot pin leapfrogged past them. This hourly full-sweep +
  # --check-ghcr run catches any such residual drift (lag OR
  # pinned-but-unpublished) within the hour and fails LOUD (the scheduled
  # event is excluded from the continue-on-error umbrella below — by then
  # there is no auto-bump race to excuse the drift).
  schedule:
    - cron: '17 * * * *'

jobs:
  dependency-graph-audit:
    # Audit the bootstrap-kit dependency graph against the expected DAG declared
    # in scripts/expected-bootstrap-deps.yaml. Mechanically verifies every HR's
    # spec.dependsOn matches the design contract in
    # docs/ARCHITECTURE.md §2 + §3, and detects cycles. Runs on
    # every PR that touches a bootstrap-kit HR or the audit data files. Owned by
    # W2.K0; consumed by W2.K1-K4 PRs to validate slot 15-48 additions.
    runs-on: ubuntu-latest
    # The hourly #4409 cron exists solely to re-run the pin-propagation
    # safety-net (pin-sync-audit). The DAG/manifest audits below are
    # change-driven and don't need an hourly cadence — skip them on schedule.
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install kustomize
        # Phase-2.5b of check-bootstrap-deps.sh runs a `kustomize build` of
        # the bootstrap-kit so duplicate-resource / merge errors (a slot
        # registered but colliding with another, e.g. the same Namespace
        # declared twice) are caught at PR time, not at fresh-prov reconcile.
        # The script warn-skips if kustomize is absent; install it so the
        # check is enforcing in CI.
        uses: imranismail/setup-kustomize@v3

      - name: Run bootstrap-kit dependency audit
        run: bash scripts/check-bootstrap-deps.sh

      - name: Cloud-init Kustomization dependsOn drift guard (#3380 row D)
        # The bootstrap-kit audit above only covers HelmReleases INSIDE the
        # kit. The three top-level Flux Kustomizations cloud-init creates
        # (bootstrap-kit / sovereign-tls / infrastructure-config) had no
        # guard — so the sovereign-tls→bootstrap-kit edge (the ~75-min TLS
        # serialization on hw130) could be narrowed and then silently drift
        # back. This pins them to scripts/expected-cloudinit-kustomization-
        # deps.yaml; any drift fails here.
        run: bash scripts/check-cloudinit-kustomization-deps.sh

      - name: Placement-as-data drift gate (#3373 DoD-6)
        # placement.yaml is THE single placement source of truth; a
        # hand-edited placement field in any slot (metadata.namespace,
        # targetNamespace/storageNamespace, kubeConfig pivot, vcluster
        # label, runtime dependsOn edge, dependents' cross-ns edges)
        # fails here. Fix path: edit placement.yaml + run
        # `python3 scripts/render-slot-placement.py fix`.
        run: |
          pip install pyyaml --quiet 2>/dev/null || true
          python3 scripts/render-slot-placement.py check

      - name: Host-bridge generator render-test (#3642)
        # Pure-function unit checks of the host-bridge logic
        # (effective_values/suppress, hostbridge_block transcription,
        # extract/strip round-trip, lowercase booleans). Guards the
        # generic mechanism that re-homes route/secret/CNPG apps into a
        # vCluster while keeping their host-reaching CRs host-rendered.
        run: python3 scripts/tests/render_slot_placement_hostbridge_test.py

      - name: Placement conformance audit — rendered (#3373 DoD-4)
        # actual==declared at render level + §4 host-minimum
        # justification discipline + the migration-gap report. The
        # live-cluster sweep (zero undeclared host workloads) is the
        # operator-walk companion:
        #   python3 scripts/audit-placement-conformance.py live --kubeconfig <kc>
        run: python3 scripts/audit-placement-conformance.py rendered

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: newapi session-secret carrier active in the SHIPPING slot (#5612)
        # #5612 ("newapi session expires in under an hour") is not a TTL —
        # upstream NewAPI v0.13.2 seals sessions in a gorilla cookie store with
        # MaxAge 2592000 (30 days). It was two newapi instances behind one
        # fanned `newapi.<fqdn>` VIP holding DIFFERENT SESSION_SECRETs, so a
        # cookie sealed by one region was rejected by the other and the SPA
        # bounced the user to /login?expired=true. #5466/#5480 closed it by
        # moving SESSION_SECRET/CRYPTO_SECRET onto the bp-sso-bridge → OpenBao
        # → ExternalSecret carrier.
        #
        # That fix is GATED (bp-newapi.credsBridgeSynced): drop any one leg —
        # placement.role, adminUI keycloak mode, ssoBridgeSync, sovereignFQDN,
        # the sovereign-realm issuer, or a credentials.existingSecret override —
        # and the chart silently falls back to the per-region `randAlphaNum 64`
        # generator, reintroducing the split. Every chart-level test hand-sets
        # those legs itself, so slot drift could never turn them red.
        #
        # This guard renders bp-newapi from the REAL bootstrap-kit slot 80 and
        # asserts the carrier is active in what a Sovereign actually installs.
        # It lives in THIS workflow (not only the chart-release gate) because
        # the drift it exists to catch can land in clusters/** with no chart
        # change at all, and the chart-release job would never run.
        run: |
          pip install pyyaml --quiet 2>/dev/null || true
          bash platform/newapi/chart/tests/5612-slot80-session-carrier-render.sh

  pin-sync-audit:
    # TBD-A6 regression test. Asserts every Chart.yaml in platform/* or
    # products/* whose chart is pinned in clusters/_template/bootstrap-
    # kit/ has the SAME version on both sides.
    #
    # On `pull_request` we use --changed-only --base <base-ref> so a PR
    # is only blocked on chart→pin pairs IT modified. This keeps the
    # gate effective (every new chart bump must update the pin) without
    # forcing pre-existing drifts (13 charts as of 2026-05-18) to be
    # fixed before any unrelated PR can land. The auto-bump hook in
    # blueprint-release.yaml will heal those drifts on the next bump
    # of each lagging chart.
    #
    # On `push` to main and `workflow_dispatch` we run the FULL sweep
    # so post-merge drift is observable on the run summary even if the
    # PR gate let it through.
    #
    # TBD-A17 mitigation (#1849, 2026-05-18): the full sweep on `push`
    # to main races with the blueprint-release auto-bump hook. When a
    # PR bumps a Chart.yaml version, the merge commit (which is what
    # this push event sees) does NOT yet contain the matching
    # bootstrap-kit pin bump — the auto-bump hook runs in a DIFFERENT
    # workflow (blueprint-release.yaml) and pushes the pin bump as a
    # follow-up bot commit, which (per GITHUB_TOKEN convention) does
    # NOT retrigger this workflow. So the FIRST run on every chart-
    # bumping merge sees `chart=N pin=N-1` drift and would block.
    # The actual desired-state is that the follow-up bot commit heals
    # the drift within ~60s. Push-mode is therefore observational, not
    # blocking; we use `continue-on-error: true` so the workflow stays
    # green while the drift is still visible on the run summary.
    #
    # TBD-A26 (issue #1872, 2026-05-19): full-sweep mode ALSO runs the
    # `--check-ghcr` phase, which verifies every pinned chart version
    # exists as a tag on ghcr.io/openova-io/<chart>. Catches the
    # "chart bumped but never published" failure mode that TBD-A6 +
    # TBD-A20 cannot see (e.g. blueprint-release.yaml failed with
    # startup_failure, race against TBD-A20 lockstep). Stays under the
    # same continue-on-error umbrella — observational on push/dispatch,
    # so a transient GHCR API blip doesn't red-flag every chart bump.
    # The job summary surfaces the missing-tag list for any operator
    # who notices the warning.
    runs-on: ubuntu-latest
    # push/dispatch are observational (they race the auto-bump hook, #4409
    # comment in `on.schedule` above). The `schedule` event is NOT excused:
    # by the time the hourly run fires there is no auto-bump race, so any
    # residual drift (lagging slot pin or pinned-but-unpublished tag) is a
    # genuine propagation failure and MUST fail the run loudly.
    continue-on-error: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      # `gh api /orgs/<org>/packages/container/<chart>/versions` needs
      # the read:packages scope for private package metadata. The
      # workflow GITHUB_TOKEN inherits this from the `packages: read`
      # block when explicitly requested.
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history back to the PR base for the --changed-only diff.
          fetch-depth: 0

      - name: Run pin-sync audit (changed-only on PR, full sweep + --check-ghcr otherwise)
        env:
          # `gh` defers to GH_TOKEN when running on a runner; pass the
          # workflow token explicitly so the package-listing API call
          # picks up the `packages: read` scope granted above.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            echo "Running --changed-only against base ${base}"
            bash scripts/check-bootstrap-kit-pin-sync.sh --changed-only --base "${base}"
          else
            # push / workflow_dispatch / schedule all run the full sweep +
            # --check-ghcr. On `schedule` (#4409) this is fail-loud — the
            # job-level continue-on-error does NOT cover the schedule event,
            # so residual propagation drift turns the hourly run red.
            echo "Running full sweep + --check-ghcr (event=${{ github.event_name }})"
            bash scripts/check-bootstrap-kit-pin-sync.sh --check-ghcr
          fi

      - name: Umbrella-republish gate (#5734)
        # #5734: check-release-lockstep-writer.py's `umbrella` case proves
        # (correctly) that a platform/products chart bump is a legitimate
        # NO-OP for bp-catalyst-platform's own self-referential seed card —
        # but nothing asserted the opposite-shaped requirement: when a
        # chart bump moves a DIFFERENT Blueprint's catalog-seed pin
        # (products/catalyst/chart/templates/catalog-seed/blueprints.yaml),
        # the umbrella chart that template renders INSIDE
        # (products/catalyst/chart/Chart.yaml) must also be re-bumped, or
        # the new pin never reaches a published bp-catalyst-platform OCI
        # artifact. On a pre-cutover Sovereign (Gitea `catalog`/
        # `catalog-sovereign` Orgs empty until post-handover cutover) this
        # in-cluster seed is the ONLY functioning install-time catalog
        # source (chainedCatalogClient falls straight through to it) — so
        # this is a real delivery gap, not a cosmetic one.
        #
        # No `--base` plumbing needed (unlike the pin-sync audit above):
        # per catalog-seed pin, blame finds the commit that last wrote it,
        # and the umbrella's version VALUE right before that commit is
        # compared against the umbrella's version VALUE now. Runs the same
        # way on every event — PR-time (blocking), push (observational,
        # same continue-on-error umbrella as the audit above), and the
        # #4409 hourly schedule sweep (fail-loud, not excused).
        run: python3 scripts/check-umbrella-republish-gate.py --ref HEAD

  manifest-validation:
    # Static-only validation: blueprint.yaml + chart Chart.yaml + clusters/_template
    # parsing + dependency order check. Runs on every push.
    runs-on: ubuntu-latest
    # Change-driven; not part of the #4409 hourly pin-propagation cron.
    if: github.event_name != 'schedule'
    needs: dependency-graph-audit
    defaults:
      run:
        working-directory: tests/e2e/bootstrap-kit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: tests/e2e/bootstrap-kit/go.sum

      - name: Run static validation
        run: go test -v -count=1

  kind-reconciliation:
    # Kind-cluster reconciliation: brings up kubernetes-in-docker, installs
    # Flux, and verifies the API server accepts our 11 bootstrap-kit
    # Kustomizations. Runs only on main to keep PRs fast — the ticket calls
    # for "all 11 phases install in sequence on a kind cluster (CI)" so this
    # is the long-form gate.
    runs-on: ubuntu-latest
    needs: manifest-validation
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: tests/e2e/bootstrap-kit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: tests/e2e/bootstrap-kit/go.sum

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          cluster_name: bootstrap-kit-test
          version: v0.25.0
          node_image: kindest/node:v1.30.6

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Run kind-reconciliation test
        env:
          BOOTSTRAP_KIT_KIND_TEST: '1'
          BOOTSTRAP_KIT_GIT_URL: https://github.com/${{ github.repository }}
        run: go test -v -count=1 -run TestBootstrapKit_KindReconciliation -timeout 10m
