name: Build access-session-agent

# The agent beside guacd in every session pod of the access plane (ADR-0033):
# configuration, handshake, relay and recording shipper. The shape of
# build-k8s-ws-proxy.yaml: test on every change; on main build the static
# binary on its distroless base, sign and attest the image, then write its
# digest into access.session.images.agent of bp-guacamole's values (the chart
# passes it to the access controller as ACCESS_IMAGE_AGENT, by digest only)
# and dispatch blueprint-release for the chart, as access-controller-build.yaml
# does for the controller's image.

on:
  push:
    branches: [main]
    paths:
      - 'core/cmd/access-session-agent/**'
      - '.github/workflows/build-access-session-agent.yaml'
  pull_request:
    paths:
      - 'core/cmd/access-session-agent/**'
      - '.github/workflows/build-access-session-agent.yaml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/openova-io/openova/access-session-agent
  VALUES: platform/guacamole/chart/values.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'
          cache-dependency-path: core/cmd/access-session-agent/go.sum
      - name: go vet
        working-directory: core/cmd/access-session-agent
        run: go vet ./...
      - name: go test (race + count=1)
        working-directory: core/cmd/access-session-agent
        run: go test -count=1 -race ./...

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the deploy step pushes the digest into the values
      packages: write
      id-token: write
      actions: write # the dispatch of blueprint-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: core/cmd/access-session-agent/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/openova-io/openova
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=access-session-agent
          # containerd 1.7 cannot pull an image whose index holds an attestation
          # manifest; the signing action attests the bill of materials.
          provenance: false
      # Signed and attested before its digest is pinned (FND-062).
      - name: Sign and attest the image
        uses: ./.github/actions/sign-and-attest
        with:
          ref: ${{ env.IMAGE }}
          digest: ${{ steps.build.outputs.digest }}
          release-key: ${{ secrets.RELEASE_COSIGN_KEY }}
          release-key-password: ${{ secrets.RELEASE_COSIGN_PASSWORD }}
      - name: Write access.session.images.agent.digest into values.yaml
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          case "${DIGEST}" in sha256:*) ;; *) echo "::error::the build gave no digest: '${DIGEST}'"; exit 1 ;; esac
          yq -i '.access.session.images.agent.digest = strenv(DIGEST)' "${VALUES}"
          got="$(yq '.access.session.images.agent.digest' "${VALUES}")"
          [ "${got}" = "${DIGEST}" ] || { echo "::error::${VALUES} holds '${got}', not ${DIGEST}"; exit 1; }
      - name: Commit and push values.yaml bump
        id: deploy_commit
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/deploy-bump
        with:
          paths: ${{ env.VALUES }}
          commit-message: "deploy: bump access-session-agent image to ${{ steps.vars.outputs.sha_short }}"
          release-writer-key: ${{ secrets.RELEASE_WRITER_KEY }}
      # The bump commit starts no workflow ([skip ci]): this dispatch publishes the chart.
      - name: Dispatch blueprint-release for chart re-publish
        if: github.ref == 'refs/heads/main' && steps.deploy_commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run blueprint-release.yaml --repo "${GITHUB_REPOSITORY}" --ref main -f blueprint=guacamole -f tree=platform
