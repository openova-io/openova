# Provider names in shared code may only fall (scripts/check-provider-leaks.py, baseline
# scripts/provider-leak-baseline.tsv). known-answer: the scanner must reproduce the totals of a
# fixed commit, measured by a separate implementation of the same rules. Fix the scanner, never
# the number. No path filter, on purpose: a check that a path filter skips never reports.
name: check-provider-leaks
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-provider-leaks.py --self-test
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-provider-leaks.py --check
  known-answer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 2c1f5b0c0c7a80453b2b687ce6ccba0be8b2e0f0
          path: known-answer
      - run: |
          python3 scripts/check-provider-leaks.py --report --repo known-answer > "$RUNNER_TEMP/report.txt"
          want='shared_lines=2083 shared_files=338 legacy_lines=157 legacy_files=18 allow_lines=1225 allow_files=82 shared_comment_lines=3105'
          got="$(head -n 1 "$RUNNER_TEMP/report.txt")"
          echo "want: $want"; echo "got:  $got"
          test "$got" = "$want"
