# Lab test PRD-080 (never merged): which upstream images serve embeddings with
# rerank, document conversion and transcription on CPU within the serving rules
# (image by digest, model pinned to a commit, non-root, read-only root file
# system, all capabilities dropped, no route out), and how fast on four cores?
#
# Runs only on a push to the spike branch. Everything happens inside these jobs:
# Docker on the hosted runner, public images, public models and public data
# (FLEURS, CC-BY-4.0). No cloud account, no secret, no cluster.
name: spike-prd-080

on:
  push:
    branches: [spike/PRD-080]

permissions:
  contents: read

jobs:
  lab:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        task: [embeddings, conversion, transcription]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      OUT: ${{ github.workspace }}/out
      SPIKE: tests/spikes/PRD-080
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Runner facts
        run: |
          echo "nproc=$(nproc)"
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket' || true
          echo "avx2=$(grep -c ' avx2 ' /proc/cpuinfo) avx512f=$(grep -c ' avx512f ' /proc/cpuinfo) amx=$(grep -c ' amx_tile ' /proc/cpuinfo)"
          free -g
          df -h / /mnt || true
          echo "docker=$(docker version --format '{{.Server.Version}}')"
          google-chrome --version || true
          uname -r

      - name: Free disk and pick the data disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          avail=$(df --output=avail -B1G /mnt 2>/dev/null | tail -1 | tr -d ' ' || echo 0)
          if [ "${avail:-0}" -ge 40 ]; then root=/mnt/prd080; else root=/home/runner/prd080; fi
          sudo mkdir -p "$root" && sudo chmod 777 "$root"
          echo "DATA=$root" >> "$GITHUB_ENV"
          df -h / "$root"

      - name: System packages
        run: |
          case "${{ matrix.task }}" in
            conversion)
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends poppler-utils fonts-noto-core ;;
            transcription)
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends ffmpeg ;;
          esac

      - name: Python packages
        run: |
          python -m pip install --quiet huggingface_hub==0.26.2 pyarrow==18.1.0 numpy==2.1.3 \
            tokenizers==0.20.3 rapidfuzz==3.10.1 pillow==11.0.0 img2pdf==0.5.1
          python -m pip freeze | grep -iE '^(huggingface.hub|pyarrow|numpy|tokenizers|rapidfuzz|pillow|img2pdf)='

      - name: Run the lab test
        run: python "$SPIKE/spike.py" "${{ matrix.task }}"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd-080-${{ matrix.task }}
          path: out/
          retention-days: 30
