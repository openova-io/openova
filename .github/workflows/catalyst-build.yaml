name: Build & Deploy Catalyst

# Event-driven only. Cron is forbidden — the OpenOva architecture is
# event-driven end to end (Flux dependsOn, NATS JetStream, SSE,
# Helm post-install hooks). `push` on the relevant paths is the
# canonical trigger; `workflow_dispatch` exists for ad-hoc re-runs
# without a code change.
on:
  push:
    branches: [main]
    paths:
      - 'core/console/**'
      - 'core/admin/**'
      - 'core/marketplace/**'
      - 'core/marketplace-api/**'
      - 'products/catalyst/bootstrap/**'
      - 'products/catalyst/chart/**'
      - 'infra/providers/**'
      - '.github/workflows/catalyst-build.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  UI_IMAGE: ghcr.io/openova-io/openova/catalyst-ui
  API_IMAGE: ghcr.io/openova-io/openova/catalyst-api

jobs:
  build-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout openova-private
        uses: actions/checkout@v4

      - name: Checkout openova (public source)
        uses: actions/checkout@v4
        with:
          repository: openova-io/openova
          path: openova-src

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(echo $GITHUB_SHA | head -c 7)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # G110-followup #2706 (2026-06-01): vitest gate. The Vite-built UI
      # image bundles src/ as compiled JS; vitest unit tests on src/
      # (e.g. urls.test.ts regression cases for G110 host-aware topology)
      # never ran in CI before this — the Containerfile only invoked
      # `npm run build`. Now we run `vitest` BEFORE the docker build so
      # any regression on src/shared/config/urls.ts (or any other unit-
      # tested file) fails CI at PR time, not at operator-walk time on
      # a fresh prov. Reviewer-agent on PR #2709 flagged this gap.
      - name: Set up Node for vitest
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: openova-src/products/catalyst/bootstrap/ui/package-lock.json

      - name: Install UI dependencies
        run: |
          cd openova-src/products/catalyst/bootstrap/ui
          npm ci

      - name: G110-followup vitest gate — run UI unit tests
        run: |
          cd openova-src/products/catalyst/bootstrap/ui
          # The 2026-06-02 G114-followup emergency unblock ran
          # `npm test || echo "WARN: ..."`, which ALWAYS exits 0. A step
          # named "vitest gate" therefore could never fail a build.
          #
          # Its three named reasons (PinInput6 disabled prop; AppsPage /
          # ProvisionPage missing QueryClientProvider) are all fixed — the
          # suite now runs 730 pass / 1 fail. The unblock outlived its
          # emergency by two months and kept swallowing everything, which is
          # why SettingsPage.test.tsx has been red since a7fb48245 with
          # nobody noticing. Its own comment says the assertion "has never
          # run green".
          #
          # Ratcheted: the gate FAILS on any failing test file except those
          # explicitly allowlisted below. A new red test breaks the build.
          #
          # KNOWN_RED — each entry needs an owning issue and a reason.
          # Currently EMPTY: the suite is fully green.
          #
          # The last entry was SettingsPage.test.tsx (the Members link
          # rendered bare `/users` instead of `/provision/$id/users`). It is
          # fixed — SettingsPage picks the link form from the presence of
          # the `:deploymentId` path param, so the mothership route gets the
          # scoped target and the chroot Sovereign keeps the root-relative
          # one. Do not re-add an entry to make a red file pass; an
          # allowlisted file is a file nothing is watching.
          #
          # The value is used as a `case` glob, and an empty glob is a bash
          # syntax error — so "allowlist nothing" is spelled as a sentinel
          # that can never equal a basename, not as an empty string.
          KNOWN_RED='__no_known_red__'

          set +e
          npm test 2>&1 | tee /tmp/vitest-out.txt
          NPM_RC=${PIPESTATUS[0]}
          set -e

          # Vitest prints one ` FAIL  <path> > <test>` line per failure — but
          # wraps FAIL in ANSI color codes (\e[41m\e[1m FAIL \e[22m\e[49m ...),
          # so a bare `^ *FAIL` grep matches NOTHING vitest emits and the
          # allowlist logic never engages (#5589 — this fail-open admitted the
          # #5579 onBack regression). Strip ANSI escapes BEFORE parsing; the
          # captured live line from run 30788994174 proves old=[] / new=[path].
          sed -e 's/\x1b\[[0-9;]*m//g' /tmp/vitest-out.txt > /tmp/vitest-plain.txt
          FAILED_FILES=$(grep -oE '^ *FAIL +[^ ]+\.test\.tsx?' /tmp/vitest-plain.txt \
                          | awk '{print $2}' | sort -u || true)

          # Vacuity guard on the PARSER itself (#5589 lead 2, the backstop
          # question): if vitest reported a non-zero "Failed Tests N" summary
          # but the per-file parse extracted nothing, the format drifted again
          # — fail closed with the evidence instead of green-through.
          SUMMARY_FAILS=$(grep -oE 'Failed Tests [0-9]+' /tmp/vitest-plain.txt | grep -oE '[0-9]+' | head -1 || true)
          if [ -n "${SUMMARY_FAILS}" ] && [ "${SUMMARY_FAILS}" -gt 0 ] && [ -z "${FAILED_FILES}" ]; then
            echo "FAIL: vitest summary says ${SUMMARY_FAILS} failed test(s) but the per-file parser extracted none — output format drifted again (#5589). Failing closed."
            exit 1
          fi

          # Backstop against the parser itself failing open: if vitest exited
          # non-zero but the grep above extracted NO failing files (config
          # crash, changed output format, bad flag — a `--reporter=basic`
          # crash was observed live 2026-08-02), that is an UNPARSEABLE
          # failure, not a pass. A gate that greens on a suite crash is the
          # exact declared-vs-actual defect this change removes.
          if [ "${NPM_RC}" -ne 0 ] && [ -z "${FAILED_FILES}" ]; then
            echo "FAIL: npm test exited ${NPM_RC} but no ' FAIL <file>' lines were parsed."
            echo "The suite crashed or vitest changed its output format — failing closed."
            exit 1
          fi

          UNEXPECTED=""
          for f in ${FAILED_FILES}; do
            case "$(basename "$f")" in
              ${KNOWN_RED}) echo "KNOWN-RED (tracked): $f" ;;
              *)            UNEXPECTED="${UNEXPECTED} $f" ;;
            esac
          done

          if [ -n "${UNEXPECTED}" ]; then
            echo "───────────────────────────────────────────────────────────"
            echo "FAIL: UI unit test failure outside the KNOWN_RED allowlist:"
            for f in ${UNEXPECTED}; do echo "  $f"; done
            echo ""
            echo "This gate used to swallow every failure via '|| echo WARN'."
            echo "It no longer does. Fix the test, or add it to KNOWN_RED"
            echo "above WITH an owning issue and a reason — never silently."
            echo "───────────────────────────────────────────────────────────"
            exit 1
          fi
          echo "G110-followup gate: catalyst-ui unit tests pass (KNOWN_RED entries excepted)."

      - name: Build UI image (test)
        uses: docker/build-push-action@v6
        with:
          # Build context is the repo root so the Vite prebuild script can
          # walk platform/, products/, clusters/_template/bootstrap-kit/ to
          # populate the catalog + BOOTSTRAP_KIT. The Containerfile fails
          # the build if any of those dirs is missing.
          context: openova-src
          file: openova-src/products/catalyst/bootstrap/ui/Containerfile
          push: false
          load: true
          tags: ${{ env.UI_IMAGE }}:test
          build-args: VITE_APP_MODE=selfhosted

      - name: Smoke test UI
        run: |
          docker run -d --name smoke-ui -p 8080:8080 ${{ env.UI_IMAGE }}:test
          sleep 3
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: expected 200 from /, got $STATUS"
            docker stop smoke-ui
            exit 1
          fi
          echo "Smoke test (root) passed: HTTP $STATUS"

          # Logo path regression guard (#173): the wizard's StepComponents
          # references `${BASE}component-logos/<id>.<ext>` where BASE is the
          # Vite base and the extension is whatever the upstream brand mark
          # is published as (some are SVG, some are PNG — we use the canonical
          # upstream asset rather than auto-converting). Inside the catalyst-
          # ui pod nginx serves the file at /component-logos/<id>.<ext>
          # (Traefik strips /sovereign before proxying — see nginx.conf
          # comment). We list every logo path that componentGroups.ts
          # references, so a missing or mis-cased asset fails the build,
          # not the user.
          for path in \
              component-logos/cilium.svg \
              component-logos/flux.svg \
              component-logos/harbor.svg \
              component-logos/grafana.svg \
              component-logos/keycloak.svg \
              component-logos/openbao.svg \
              component-logos/langfuse.png \
              component-logos/vllm.png \
              component-logos/temporal.svg \
              component-logos/stalwart.svg \
              component-logos/cnpg.svg \
              component-logos/loki.png \
              component-logos/mimir.png \
              component-logos/tempo.svg \
              component-logos/ntfy.svg \
              component-logos/ferretdb.png \
              component-logos/openmeter.png \
              component-logos/coraza.png \
              component-logos/external-dns.png \
              component-logos/netbird.png \
              component-logos/strongswan.png \
              component-logos/trivy.png \
              component-logos/syft-grype.png ; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              "http://localhost:8080/${path}")
            if [ "$CODE" != "200" ]; then
              echo "Logo smoke FAILED: /${path} returned $CODE"
              docker stop smoke-ui
              exit 1
            fi
            echo "Logo smoke OK: /${path} HTTP $CODE"
          done

          # Bootstrap-kit regression guard: the Provision page reads
          # BOOTSTRAP_KIT from the bundled catalog.generated.ts to render
          # the per-Blueprint bubbles. An earlier revision shipped with a
          # docker context that didn't include clusters/_template/bootstrap-kit/
          # so the prebuild script silently produced an empty array — the
          # page rendered only the 2 supernodes. Asserting the bundle
          # contains every bp-* id makes that regression impossible.
          #
          # Implementation note: we extract the entire bundle once via
          # `tar c -C ... --transform`, then grep locally. Earlier we ran
          # `grep` inside docker run -c "..." and the nested quote escaping
          # produced false negatives (bp-cilium was in the bundle but the
          # grep argument matched a literal `"bp-cilium"` whose surrounding
          # quotes were eaten by shell expansion). Local grep on the
          # extracted file removes that whole class of escaping bugs.
          BUNDLE_TMP=$(mktemp)
          docker run --rm --entrypoint sh ${{ env.UI_IMAGE }}:test \
            -c 'cat $(find /usr/share/nginx/html/assets -name "index-*.js" | head -1)' \
            > "$BUNDLE_TMP"
          BUNDLE_BYTES=$(wc -c < "$BUNDLE_TMP")
          echo "Bundle size: $BUNDLE_BYTES bytes"
          if [ "$BUNDLE_BYTES" -lt 100000 ]; then
            echo "Bootstrap-kit smoke FAILED: bundle suspiciously small ($BUNDLE_BYTES bytes)"
            docker stop smoke-ui
            exit 1
          fi
          for bp in bp-cilium bp-cert-manager bp-flux bp-crossplane bp-sealed-secrets \
                    bp-spire bp-nats-jetstream bp-openbao bp-keycloak bp-gitea ; do
            if ! grep -q -F "$bp" "$BUNDLE_TMP" ; then
              echo "Bootstrap-kit smoke FAILED: ${bp} missing from bundle"
              docker stop smoke-ui
              exit 1
            fi
            echo "Bootstrap-kit smoke OK: ${bp}"
          done
          rm -f "$BUNDLE_TMP"

          docker stop smoke-ui
          echo "All smoke tests passed."

      - name: Push UI image
        uses: docker/build-push-action@v6
        with:
          # Build context is the repo root so the Vite prebuild script can
          # walk platform/, products/, clusters/_template/bootstrap-kit/ to
          # populate the catalog + BOOTSTRAP_KIT. The Containerfile fails
          # the build if any of those dirs is missing.
          context: openova-src
          file: openova-src/products/catalyst/bootstrap/ui/Containerfile
          push: true
          tags: |
            ${{ env.UI_IMAGE }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.UI_IMAGE }}:latest
          build-args: VITE_APP_MODE=selfhosted

  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout openova-private
        uses: actions/checkout@v4

      - name: Checkout openova (public source)
        uses: actions/checkout@v4
        with:
          repository: openova-io/openova
          path: openova-src

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(echo $GITHUB_SHA | head -c 7)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the public openova repo root (openova-src/), not just
      # products/catalyst/bootstrap/api/, because the runtime image bundles the
      # canonical OpenTofu module from infra/hetzner/. The Containerfile's
      # COPY paths are written relative to the repo root accordingly. Without
      # this, /infra/hetzner/ is missing inside the image and every Launch
      # fails with `stage tofu module: open /infra/hetzner: no such file or
      # directory`.
      - name: Build API image (test)
        uses: docker/build-push-action@v6
        with:
          context: openova-src
          file: openova-src/products/catalyst/bootstrap/api/Containerfile
          push: false
          load: true
          tags: ${{ env.API_IMAGE }}:test

      # Smoke test — the catalyst-api Pod is the OpenTofu runner, so the .tf
      # sources MUST be present inside the image. After the providers/
      # refactor (Wave 2, Issue #1841) the canonical path is
      # /infra/providers/hetzner/; /infra/hetzner is a backward-compat
      # symlink for callers that still set CATALYST_TOFU_MODULE_PATH to
      # the old value. We verify both paths so the smoke test catches a
      # regression on either.
      - name: Smoke test API — verify infra/providers/{hetzner,huawei}/ is bundled
        run: |
          set -euo pipefail
          # Hetzner canonical path. #3145: the control-plane cloud-init is now
          # the ONE cloud-agnostic template at /infra/providers/_shared/; each
          # provider dir keeps only main.tf/variables.tf/outputs.tf/versions.tf
          # + the still-per-provider cloudinit-worker.tftpl.
          LISTING=$(docker run --rm --entrypoint sh ${{ env.API_IMAGE }}:test \
            -c 'ls -la /infra/providers/hetzner/')
          echo "$LISTING"
          for f in main.tf variables.tf outputs.tf versions.tf \
                   cloudinit-worker.tftpl ; do
            if ! echo "$LISTING" | grep -q " ${f}\$"; then
              echo "Smoke test FAILED: /infra/providers/hetzner/${f} missing from image"
              exit 1
            fi
            echo "Smoke test OK: /infra/providers/hetzner/${f} present"
          done
          # Huawei (Wave 3 / Issue #2140) canonical path.
          HUAWEI=$(docker run --rm --entrypoint sh ${{ env.API_IMAGE }}:test \
            -c 'ls -la /infra/providers/huawei/')
          echo "$HUAWEI"
          for f in main.tf variables.tf outputs.tf versions.tf \
                   cloudinit-worker.tftpl ; do
            if ! echo "$HUAWEI" | grep -q " ${f}\$"; then
              echo "Smoke test FAILED: /infra/providers/huawei/${f} missing from image"
              exit 1
            fi
            echo "Smoke test OK: /infra/providers/huawei/${f} present"
          done
          # #3145: the shared cloud-agnostic control-plane template MUST be
          # bundled — every provider's main.tf renders ../_shared/cloudinit-
          # control-plane.tftpl, so a missing _shared dir breaks `tofu apply`.
          SHARED=$(docker run --rm --entrypoint sh ${{ env.API_IMAGE }}:test \
            -c 'ls -la /infra/providers/_shared/')
          echo "$SHARED"
          if ! echo "$SHARED" | grep -q " cloudinit-control-plane.tftpl\$"; then
            echo "Smoke test FAILED: /infra/providers/_shared/cloudinit-control-plane.tftpl missing from image"
            exit 1
          fi
          echo "Smoke test OK: /infra/providers/_shared/cloudinit-control-plane.tftpl present"
          # Legacy-compat symlink — same files via /infra/hetzner.
          LEGACY=$(docker run --rm --entrypoint sh ${{ env.API_IMAGE }}:test \
            -c 'ls -la /infra/hetzner/main.tf')
          echo "$LEGACY"
          echo "$LEGACY" | grep -q 'main.tf' || (echo "Legacy symlink missing"; exit 1)
          echo "All API smoke tests passed."

      # tofu CLI smoke test — the runtime image bundles the OpenTofu CLI
      # because internal/provisioner execs `tofu init / plan / apply` (see
      # internal/provisioner/provisioner.go runTofu()). Without the binary
      # every Launch SSE stream returns:
      #   tofu init: exec: "tofu": executable file not found in $PATH
      # We assert (a) `tofu version` succeeds inside the image and (b) the
      # output matches the EXPECTED_TOFU_VERSION pinned here, which must
      # stay in lockstep with the TOFU_VERSION ARG in the Containerfile.
      # When you bump the version in the Containerfile, bump it here too.
      - name: Smoke test API — verify OpenTofu CLI is installed
        env:
          EXPECTED_TOFU_VERSION: 1.11.6
        run: |
          set -euo pipefail
          OUT=$(docker run --rm --entrypoint sh ${{ env.API_IMAGE }}:test \
            -c 'tofu version')
          echo "$OUT"
          if ! echo "$OUT" | grep -q "^OpenTofu v${EXPECTED_TOFU_VERSION}\$"; then
            echo "Smoke test FAILED: expected 'OpenTofu v${EXPECTED_TOFU_VERSION}', got:"
            echo "$OUT"
            exit 1
          fi
          echo "Smoke test OK: OpenTofu v${EXPECTED_TOFU_VERSION} present on PATH."

          # Re-assert the binary is executable for the actual runtime UID
          # (65534, set in api-deployment.yaml securityContext.runAsUser).
          # `--user` overrides the image USER directive, simulating the K8s
          # securityContext: a missing exec bit or wrong owner here would
          # surface as a Launch failure in production, never in CI, so we
          # gate it at build time.
          docker run --rm --user 65534:65534 --entrypoint sh \
            ${{ env.API_IMAGE }}:test -c 'tofu version | head -1'
          echo "Smoke test OK: tofu executable as UID 65534."

      # G36 #2591: gate the push on `tofu test` against both providers'
      # `multi_region.tftest.hcl` fixtures. `tofu test` plans the module
      # under mocked providers, which forces `templatefile()` evaluation
      # on every reference in main.tf — catching the G29 incident class
      # (bash `${i}` or `${...:=...}` envsubst-default tokens inside a
      # `.tftpl` that crash the templatefile parser) BEFORE the image
      # ships. Pre-G36, those errors only surfaced mid-prov at
      # `tofu apply` time, after the new catalyst-api image was already
      # live (G29 / hw55 v1 / 2026-05-29 16:40Z).
      - name: Install OpenTofu CLI on runner
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.6

      - name: G36 — tofu test against tftpl fixtures (catches G29-class parse bugs)
        run: |
          set -euo pipefail
          # G36 #2591 — tofu test gate against BOTH providers' tftpl
          # fixtures. Catches G29-class templatefile-render bugs at
          # build time. G107 #2702 (PR #2710, 2026-06-01) unblocked
          # hetzner by stripping 1202 lines of comment bloat from
          # cloudinit-control-plane.tftpl + wrapping the guardrail
          # error_message in nonsensitive() + removing an invalid
          # `bucket` override in the tftest fixture. With those fixes
          # `tofu test` passes 10/10 on hetzner — re-adding it to the
          # gate so the catalyst-build pipeline blocks any future
          # cloud-init regression at PR time on BOTH providers.
          for provider in hetzner huawei; do
            echo "=== tofu test: infra/providers/${provider} ==="
            (
              cd openova-src/infra/providers/${provider}
              tofu init -backend=false -input=false -no-color
              tofu test -no-color
            )
            echo "=== ${provider}: PASS ==="
          done
          echo "G36 gate OK: every templatefile() in huawei parses + renders."

      # #3724 — LOUD main-push failure. The G36 `tofu test` step is what froze
      # "Build & Deploy Catalyst" for hours on PR #3715 (the rendered cloud-init
      # blew past the 32256-byte Hetzner user_data cap) — and the freeze was
      # SILENT: no image built, the mothership silently stayed commits behind
      # main. This step fires ONLY when G36 (or any prior step in this job)
      # failed; it annotates the run with ::error:: + writes a prominent job
      # summary so a red build on main is impossible to miss, rather than a
      # quiet stall. It does NOT change the build outcome (the job already
      # failed) — it only makes the failure loud.
      - name: Loud failure notice (G36 / cloud-init regression on main)
        if: failure()
        run: |
          set -eu
          MSG="Build & Deploy Catalyst FAILED before pushing the catalyst-api image. The most common cause is a cloud-init regression that trips the G36 'tofu test' guardrail (rendered user_data over the 32256-byte Hetzner cap — see #3715/#3724). The mothership will NOT receive a new image until this is green. The 'cloud-init-size / {hetzner,huawei}' PR gate should have caught an oversized cloud-init before merge — verify it was a required check on the offending PR."
          echo "::error title=catalyst-build FAILED on main (mothership now stalled)::${MSG}"
          {
            echo '## :rotating_light: Build & Deploy Catalyst FAILED'
            echo ''
            echo "${MSG}"
            echo ''
            echo 'Refs #3724 (silent-freeze regression class).'
          } >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Push API image
        uses: docker/build-push-action@v6
        with:
          context: openova-src
          file: openova-src/products/catalyst/bootstrap/api/Containerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.API_IMAGE }}:latest

  # #4049 — BASTION HARBOR WARMUP (every image Huawei→Huawei, incl. PRIVATE
  # catalyst). Delegated to the reusable .github/workflows/warmup-bastion-harbor.yaml
  # so the SAME warmup also fires from blueprint-release.yaml (every bp-* chart
  # publish) — closing the COMPONENT-image hole that left a freshly-bumped
  # private bp-* tag (e.g. the wordpress-tenant-pg pg4wp runtime) un-warmed,
  # cold-pulling DIRECT from ghcr on a fresh prov (live: the omantel.biz demo
  # Org's pg-driver image took 20+ min to pull). Here we pass the just-pushed
  # catalyst SHA so the warmup ALSO covers the rolling catalyst-api/ui :<SHA>
  # tags the parallel deploy job is about to pin. continue-on-error lives in the
  # reusable workflow's job; the deploy job does NOT `needs:` this, so the deploy
  # proceeds in parallel regardless of warmup outcome.
  warmup-bastion-harbor:
    needs: [build-ui]
    uses: ./.github/workflows/warmup-bastion-harbor.yaml
    with:
      catalyst_sha: ${{ needs.build-ui.outputs.sha_short }}
    secrets:
      bastion_harbor_robot_token: ${{ secrets.BASTION_HARBOR_ROBOT_TOKEN }}

  deploy:
    needs: [build-ui, build-api]
    runs-on: ubuntu-latest
    permissions:
      # contents: write — push the values.yaml SHA bump back to main
      contents: write
      # actions: write — required for `gh workflow run` to dispatch
      # blueprint-release.yaml after the deploy commit lands. Without
      # this, the dispatch step (added in PR #720 to close the
      # bot-deploy-doesn't-trigger-workflows gap from #712) returns
      # HTTP 403 "Resource not accessible by integration", the
      # blueprint-release fires NEVER, and the bp-catalyst-platform
      # OCI artifact stays stuck on the PREVIOUS deploy's image SHA.
      # Caught live 2026-05-04 — PR #722–727 all built green but
      # blueprint-release was never dispatched, leaving Sovereigns
      # provisioned afterwards on the pre-fix chart.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # In-flight provisioning guard — t13/t17/t21 incident, 2026-05-17.
      #
      # The mothership catalyst-api Pod is single-replica and is rolled
      # by Flux whenever this workflow bumps the image SHA. The OpenTofu
      # workdir lives on a /tmp emptyDir that dies with the Pod, so any
      # in-flight `tofu apply` is killed mid-resource. The on-disk
      # deployment record is rewritten to status=failed on the new Pod's
      # restoreFromStore (deployments.go:413), but the Hetzner resources
      # tagged with the abandoned deployment-id remain orphans that
      # require manual `hcloud` cleanup. Three consecutive provs
      # (t13/t17/t21) died this way during 2026-05-17, each costing
      # ~15 minutes of provisioning time plus cleanup overhead.
      #
      # This step polls the public, read-only in-flight-count endpoint
      # on the mothership catalyst-api (added in this PR, served at
      # console.openova.io/api/v1/deployments/in-flight-count). The
      # endpoint counts ONLY Phase-0 in-flight statuses (pending /
      # provisioning / tofu-applying / flux-bootstrapping) — Phase-1 is
      # observational and resumes across Pod restarts, so it does not
      # block. When count==0 we proceed with the values.yaml bump.
      #
      # Timeout policy: cap at MAX_WAIT_SECONDS (default 30 minutes —
      # the upper bound on a healthy multi-region prov). If a prov is
      # still in flight after the cap, we proceed anyway and log a
      # WARNING. Blocking deploys indefinitely on a stuck prov would
      # mean an operator can never ship a fix for whatever is causing
      # the stuck prov (the worst possible failure mode for a CI gate).
      #
      # Endpoint outage policy: if the curl fails for any reason
      # (network blip, mothership down, endpoint not yet deployed on
      # the live SHA), we proceed with the bump after logging. Same
      # rationale — a broken gate must not block all future deploys.
      # First-time-rollout consideration: the endpoint does not exist
      # on the LIVE mothership until THIS PR's image lands, so the
      # first run after merge will fall through the "endpoint not
      # found" branch and proceed normally. Subsequent runs benefit
      # from the gate.
      - name: Wait for in-flight provisioning to drain
        env:
          # Override-able via repo variables/secrets if a different
          # mothership URL is in play (Sovereign chroot self-deploy,
          # staging, etc.). Default targets the production mothership.
          CATALYST_API_URL: ${{ vars.CATALYST_API_URL || 'https://console.openova.io' }}
          MAX_WAIT_SECONDS: '1800'   # 30 min hard cap
          POLL_INTERVAL_SECONDS: '20'
        run: |
          set -u
          ENDPOINT="${CATALYST_API_URL%/}/api/v1/deployments/in-flight-count"
          echo "Polling ${ENDPOINT} every ${POLL_INTERVAL_SECONDS}s (cap ${MAX_WAIT_SECONDS}s)"

          START=$(date +%s)
          ATTEMPT=0
          while : ; do
            ATTEMPT=$((ATTEMPT + 1))
            HTTP_CODE=$(curl -fsSL --max-time 10 -o /tmp/inflight.json -w '%{http_code}' \
              "${ENDPOINT}" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "000" ]; then
              # Network failure (DNS, connect refused, timeout). Do NOT
              # block the deploy — fail-open per "broken gate must not
              # halt all deploys" rule above. Log + proceed.
              echo "WARN: ${ENDPOINT} unreachable on attempt ${ATTEMPT} (curl failed). Proceeding without gate."
              break
            fi

            if [ "$HTTP_CODE" = "404" ]; then
              # First-rollout case — the endpoint is not yet present on
              # the LIVE catalyst-api. Once this PR merges, subsequent
              # runs will see the endpoint and start gating properly.
              echo "INFO: ${ENDPOINT} returned 404 — endpoint not yet deployed on live mothership. Proceeding (first-rollout fall-through)."
              break
            fi

            if [ "$HTTP_CODE" != "200" ]; then
              # Any other non-2xx: log + proceed (fail-open).
              echo "WARN: ${ENDPOINT} returned HTTP ${HTTP_CODE} on attempt ${ATTEMPT}. Body:"
              cat /tmp/inflight.json 2>/dev/null || true
              echo
              echo "Proceeding without gate (fail-open)."
              break
            fi

            COUNT=$(jq -r '.count // 0' /tmp/inflight.json 2>/dev/null || echo "0")
            IDS=$(jq -r '.ids // [] | join(",")' /tmp/inflight.json 2>/dev/null || echo "")

            if [ "$COUNT" -eq 0 ] 2>/dev/null; then
              echo "OK: 0 deployments in-flight. Safe to bump catalyst-api image."
              break
            fi

            ELAPSED=$(($(date +%s) - START))
            if [ "$ELAPSED" -ge "$MAX_WAIT_SECONDS" ]; then
              echo "WARN: ${COUNT} deployment(s) still in-flight after ${ELAPSED}s (cap ${MAX_WAIT_SECONDS}s)."
              echo "WARN: in-flight ids: ${IDS}"
              echo "WARN: proceeding with image bump anyway — stuck provs must not block all future deploys."
              break
            fi

            echo "WAIT: attempt ${ATTEMPT} — ${COUNT} deployment(s) in-flight (ids: ${IDS}); elapsed=${ELAPSED}s. Sleeping ${POLL_INTERVAL_SECONDS}s."
            sleep "${POLL_INTERVAL_SECONDS}"
          done

      - name: Update SHA tags in values.yaml and deployment manifests
        # The catalyst-ui and catalyst-api images are referenced in two places:
        #
        # 1. products/catalyst/chart/values.yaml — used by the Helm chart path
        #    (bp-catalyst-platform OCI chart on Sovereign clusters). Helm template
        #    expressions ({{ .Values.images.catalystUi.tag }}) are rendered at
        #    `helm install` time by Flux's helm-controller. We use awk to replace
        #    the `tag:` line that immediately follows the catalystUi/catalystApi key.
        #
        # 2. products/catalyst/chart/templates/{api,ui}-deployment.yaml — used by
        #    the Kustomize path (catalyst-platform Kustomization on contabo-mkt).
        #    These files are applied as raw manifests by Flux kustomize-controller;
        #    Helm template syntax is NOT rendered. A literal image ref is required.
        #    Bug history: feat/global-imageRegistry (#580) converted the literal
        #    image ref to a Helm template without updating this deploy step, causing
        #    InvalidImageName on the contabo-mkt Kustomize path. Fixed here by also
        #    sed-patching the literal image refs in those two deployment files.
        env:
          SHA_SHORT: ${{ needs.build-ui.outputs.sha_short }}
        run: |
          VALUES="products/catalyst/chart/values.yaml"
          awk -v sha="${SHA_SHORT}" '
            /^  catalystApi:/ { print; in_api=1; next }
            /^  catalystUi:/  { print; in_ui=1; next }
            in_api && /^ *tag:/ { sub(/"[^"]*"/, "\"" sha "\""); in_api=0 }
            in_ui  && /^ *tag:/ { sub(/"[^"]*"/, "\"" sha "\""); in_ui=0 }
            { print }
          ' "${VALUES}" > "${VALUES}.tmp" && mv "${VALUES}.tmp" "${VALUES}"
          echo "values.yaml after update:"
          grep -A2 "catalystUi\|catalystApi" "${VALUES}" | head -10

          # ALSO bump the literal image refs in the chart templates.
          # Sovereigns Helm-install this chart and contabo applies it
          # via Kustomize — both consume the literal directly because
          # kustomize-controller can't render Helm templates. Without
          # this auto-bump, every Sovereign provisioned after 2026-05-06
          # was installing :2122fb8 (frozen at PR #1040's chart-touch),
          # so PRs #1051..#1059 never reached anyone except via manual
          # `kubectl set image` patches on omantel.
          API_TPL="products/catalyst/chart/templates/api-deployment.yaml"
          # G29-followup (2026-05-31): kustomize-controller can't render Helm
          # templates, so contabo-mkt's catalyst-platform Kustomization
          # actually consumes api-deployment-kustomize.yaml (literal image),
          # NOT api-deployment.yaml (Helm template). The deploy bump
          # previously sed-patched only api-deployment.yaml whose image
          # field is a `{{ ... }}` directive that no sed could match —
          # net: contabo-mkt catalyst-api stayed pinned on the LAST manually-
          # bumped SHA for days/weeks while every deploy commit pushed
          # green. Caught live hw86 walk 2026-05-31: catalyst-api stuck at
          # fd378e3 while ui rolled to 8a6536c. Now sed both files.
          API_KUST_TPL="products/catalyst/chart/templates/api-deployment-kustomize.yaml"
          # #4563: catalyst-ui got the same dual-file split as catalyst-api —
          # ui-deployment.yaml is now Helm-templated ({{ .Values.global.
          # imageRegistry }}, no sed-matchable literal) and the contabo-mkt
          # Kustomize path consumes ui-deployment-kustomize.yaml (literal).
          # Sed the kustomize sibling so contabo rolls; Sovereigns roll via
          # the values.yaml catalystUi.tag awk-bump above.
          UI_KUST_TPL="products/catalyst/chart/templates/ui-deployment-kustomize.yaml"
          sed -i -E "s|(image: \"ghcr\.io/openova-io/openova/catalyst-api:)[^\"]*\"|\1${SHA_SHORT}\"|" "${API_TPL}" "${API_KUST_TPL}"
          sed -i -E "s|(image: \"ghcr\.io/openova-io/openova/catalyst-ui:)[^\"]*\"|\1${SHA_SHORT}\"|"  "${UI_KUST_TPL}"
          # qa-loop iter-3 Fix #18 — also bump the CATALYST_BUILD_SHA env
          # literal in the api-deployment so /api/v1/version returns the
          # SHA the Pod is actually running. Without this, the env stays
          # frozen at whatever value was committed manually and the live
          # version probe lies. The env block uses literal values (not
          # Helm directives) per the dual-mode contract — this sed
          # targets the literal directly. Pattern: 6-12 hex chars in
          # double-quotes immediately after `name: CATALYST_BUILD_SHA`
          # + newline + `              value:`.
          sed -i -E "/name: CATALYST_BUILD_SHA/{n;s|(value: )\"[a-f0-9]+\"|\1\"${SHA_SHORT}\"|;}" "${API_TPL}"
          echo "templates after update:"
          grep -E "image: \".*catalyst-(api|ui):" "${API_KUST_TPL}" "${UI_KUST_TPL}"
          grep -A1 "CATALYST_BUILD_SHA" "${API_TPL}" | head -2

          # Wave 5.48 (#2272) — bump bp-catalyst-platform Chart.yaml patch
          # version so Blueprint Release re-publishes the OCI artifact
          # pointing at the bumped image SHAs. Without this bump, Blueprint
          # Release skips re-publish (it only triggers on chart-content
          # changes per blueprint-release.yaml:617-639) → Flux on every
          # Sovereign sees the same chart version → no roll → Wave 5.44/
          # 5.47 stuck on hw01 for 25+ minutes after merge before being
          # surfaced. Surfaced live on hw01 2026-05-24T05:48Z.
          CHART_YAML="products/catalyst/chart/Chart.yaml"
          CUR_VER=$(grep -E '^version: 1\.4\.[0-9]+$' "${CHART_YAML}" | head -1 | awk '{print $2}')
          if [ -z "${CUR_VER}" ]; then
            echo "::error title=Wave 5.48 chart-bump failed::Could not parse version: from ${CHART_YAML}"
            exit 1
          fi
          CUR_PATCH="${CUR_VER##*.}"
          NEXT_PATCH=$((CUR_PATCH + 1))
          NEXT_VER="1.4.${NEXT_PATCH}"
          sed -i -E "s|^version: 1\.4\.[0-9]+\$|version: ${NEXT_VER}|" "${CHART_YAML}"
          echo "Chart.yaml version bump: ${CUR_VER} -> ${NEXT_VER}"

          # contabo's catalyst-platform Kustomization at
          # ./products/catalyst/chart/templates reconciles every 10 min
          # — it will pick up the bumped literal on the next interval.
          # If the new image breaks contabo, an operator can revert the
          # template SHA via a follow-up PR; the previous "freeze"
          # behaviour was masking real bugs (contabo silently ran an
          # old image while the Sovereign provisioning churned through
          # the same SHA being fixed downstream).

      # #2851 (2026-06-03) — controller-image freshness sweep.
      #
      # Background: each of the 5 Group C controllers (application /
      # blueprint / environment / organization / useraccess) has its
      # OWN build workflow that auto-bumps its OWN values.yaml tag on
      # push-to-main. In theory the chart converges. In practice the
      # H9 walk on 2026-06-03 caught 4 of 5 controllers pinned to
      # `8d01e2f` (G93.2-era, pre-G117.6) for weeks — every per-
      # controller auto-bump that fired between G93.2 and G117.6
      # silently dropped: bot-author push race against parallel deploy
      # commits, dispatch step skipped because the controller's PR
      # also touched core/console/ (so the catalyst-build path filter
      # fired first), Chart.yaml bump landing on a non-image commit
      # that masked the controller bump, etc. Result: chart shipped a
      # binary BEFORE G117.6 PR #2790 → application-controller had
      # NO topology fan-out + NO multi-instance fields. Same root
      # class as PR #2854/#2865 PIN-login outage (catalyst-api shipping
      # at `2ae493f` — a SHA BEFORE PR #2854's env rename).
      #
      # Defense: every catalyst-build deploy step now ALSO sweeps the
      # 5 controller pins by resolving the LATEST pushed SHA tag from
      # GHCR for each controller package and stamping it into
      # values.yaml. This is belt-and-braces — controllers also retain
      # their own auto-bump, but the catalyst-build sweep guarantees
      # that *every* time the catalyst chart re-publishes, controller
      # pins are at most as stale as the latest pushed image. Since
      # blueprint-release fires from this same job, the chart and the
      # controller pins re-sync on every catalyst-build run.
      #
      # GHCR API: `/orgs/openova-io/packages/container/<name>/versions`
      # — pattern already used by scripts/check-bootstrap-kit-pin-
      # sync.sh:332. Returns versions sorted by created_at desc.
      # `updated_at` of the topmost non-`sha256-` tag = latest pushed
      # image. We extract its short-SHA tag (7-hex) and stamp it.
      - name: '#2851 — Sweep controller image tags from latest GHCR pushes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VALUES="products/catalyst/chart/values.yaml"

          # Per-controller mapping: values-key (under `controllers:`)
          # → GHCR package name. Add new controllers here when they
          # land in core/controllers/ and have a build-*-controller
          # workflow registered in scripts/check-controller-workflow-
          # uniformity.sh.
          declare -A CTRL_PKG=(
            [application]=application-controller
            [blueprint]=blueprint-controller
            [environment]=environment-controller
            [organization]=organization-controller
            [useraccess]=useraccess-controller
          )

          bumped=0
          for key in "${!CTRL_PKG[@]}"; do
            pkg="${CTRL_PKG[$key]}"
            # Query GHCR for the most-recently-pushed tag. We filter
            # out cosign signature artifacts (sha256-…) and the
            # rolling `latest` tag (which is just an alias, not a
            # SHA-pinnable target per Principle #4a). The remaining
            # entries are 7-hex short SHAs stamped by the per-
            # controller build workflow. Take the first 7-hex hit on
            # the highest-`updated_at` version → that's the latest
            # main-HEAD push.
            # #2851-followup (2026-06-03): GHCR package names for the
            # 5 controllers carry the `openova/` prefix (e.g.
            # `openova/application-controller`) — must URL-encode the
            # slash as %2F per github.com/cli/cli docs. Without this
            # the API returns 404 and every controller sweep silently
            # skips, defeating the entire #2851 defense. Caught live
            # 2026-06-03 walking the sweep step locally:
            # `gh api /orgs/openova-io/packages/container/application-controller`
            # → 404; `openova%2Fapplication-controller` → real versions list.
            tag=$(gh api "/orgs/openova-io/packages/container/openova%2F${pkg}/versions" --paginate 2>/dev/null \
              | jq -r '[.[] | {u:.updated_at, tags:(.metadata.container.tags // [])}]
                       | sort_by(.u) | reverse
                       | .[].tags[]?' 2>/dev/null \
              | grep -vE '^(sha256-|latest$)' \
              | grep -E '^[0-9a-f]{7}$' \
              | head -1 || true)

            if [ -z "${tag}" ]; then
              echo "WARN: GHCR returned no 7-hex tag for ${pkg} — skipping controller bump (chart will keep current pin)."
              continue
            fi

            # Read the current pin from values.yaml so we can no-op
            # if already in sync (avoids needless commits).
            cur=$(awk -v k="${key}" '
              /^controllers:/ { in_c=1 }
              in_c && $0 ~ "^  " k ":" { in_k=1; next }
              in_c && /^  [a-z]/ && !($0 ~ "^  " k ":") { in_k=0 }
              in_k && /^      tag:/ {
                match($0, /"[^"]*"/); print substr($0, RSTART+1, RLENGTH-2); exit
              }
            ' "${VALUES}")

            if [ "${cur}" = "${tag}" ]; then
              echo "OK: controllers.${key}.image.tag already at ${tag}"
              continue
            fi

            # Awk patch mirrors the per-controller workflow's bump
            # (build-organization-controller.yaml lines 170-176 et
            # al.) so chart-side semantics stay identical.
            awk -v k="${key}" -v sha="${tag}" '
              /^controllers:/ { in_c=1 }
              in_c && $0 ~ "^  " k ":" { print; in_k=1; next }
              in_c && /^  [a-z]/ && !($0 ~ "^  " k ":") { in_k=0 }
              in_k && /^      tag:/ { sub(/"[^"]*"/, "\"" sha "\""); in_k=0 }
              { print }
            ' "${VALUES}" > "${VALUES}.tmp" && mv "${VALUES}.tmp" "${VALUES}"
            echo "BUMPED: controllers.${key}.image.tag ${cur} -> ${tag}"
            bumped=$((bumped + 1))
          done
          echo "#2851 sweep: bumped ${bumped}/5 controller pin(s) to latest GHCR."

      # values.yaml + the literal-image Kustomize-sibling templates
      # (api-deployment-kustomize, ui-deployment-kustomize) are bumped
      # together so:
      #   - Sovereigns get the new SHA via the next OCI chart publish
      #     (blueprint-release fires below).
      #   - contabo's Kustomize-path Flux reconciles the bumped literal
      #     within 10 min.
      # Both surfaces converge on the same SHA on every push.
      #
      # TBD-V32 / openova-io/openova#2062: the previous bare `git push`
      # silently lost the deploy commit when a parallel build workflow
      # raced this push. PR #2050 (V16 admin-token wiring) shipped the
      # catalyst-api image to GHCR at 829474a but the values.yaml /
      # template pins never landed because of this race. The
      # `./.github/actions/deploy-bump` composite action centralises a
      # 5-attempt `pull --rebase` retry loop so every deploy job
      # converges instead of dropping the bump on the floor.
      - name: Commit and push manifest updates
        id: deploy_commit
        uses: ./.github/actions/deploy-bump
        with:
          paths: |
            products/catalyst/chart/values.yaml
            products/catalyst/chart/templates/api-deployment.yaml
            products/catalyst/chart/templates/api-deployment-kustomize.yaml
            products/catalyst/chart/templates/ui-deployment.yaml
            products/catalyst/chart/templates/ui-deployment-kustomize.yaml
            products/catalyst/chart/Chart.yaml
          commit-message: "deploy: update catalyst images to ${{ needs.build-ui.outputs.sha_short }} (+ #2851 controller sweep)"

      # Closes #712. The push above is made by GITHUB_TOKEN; per GitHub
      # Actions design, commits authored by GITHUB_TOKEN do NOT re-trigger
      # workflows. Without this dispatch step, blueprint-release.yaml
      # never fires for deploy commits and the bp-catalyst-platform OCI
      # artifact stays stuck on whatever catalyst-api SHA was current at
      # the last manual chart-touching PR (e.g. otech62-66, 2026-05-03,
      # were stuck installing catalyst-api:74d08eb six PRs after that
      # SHA was superseded). Explicit workflow_dispatch reliably re-runs
      # blueprint-release on every deploy commit, picking up the new
      # values.yaml SHA tags.
      - name: Trigger blueprint-release for the chart bump
        if: steps.deploy_commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run blueprint-release.yaml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f blueprint=catalyst \
            -f tree=products
          echo "blueprint-release dispatched for products/catalyst @ main"
