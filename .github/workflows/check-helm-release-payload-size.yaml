# check-helm-release-payload-size.yaml — no chart may outgrow the 1 MiB Helm
# release Secret.
#
# #6004: bp-self-sovereign-cutover@0.1.177 could not be installed on ANY
# Sovereign. Helm stores a release as base64(gzip(json(release))) in a Secret,
# Kubernetes caps Secret data at 1048576 bytes, and the chart had grown past it
# — so Phase 1 failed 10 times on hw293 and Pillar 5 became unprovable. Nothing
# in CI measured that number; the first place it was observable was a fresh
# Sovereign's install.
#
# The sweep measures every chart before a merge (FND-208): a chart that declares
# `dependencies:` is measured after `helm dependency update`, and a chart that
# cannot be measured is an ERROR, never a pass. The two charts that cannot render
# at their default values are named in scripts/baselines/payload-sweep.json, each
# with the value it asks for, its reason and its day; the Go command payload-sweep
# (tools/guards) runs the sweep without them, fails when a listed chart renders
# again or the list holds a chart that is not on it at the first parent (the list
# only shrinks: two commits are checked out), and blueprint-release.yaml still runs
# the same check on each chart before `helm push`.
#
# --self-test runs first and always: it builds one over-budget and one
# under-budget chart and asserts the gate returns 1 and 0 respectively. A size
# check nobody has seen fail is not a check.
name: check-helm-release-payload-size

on:
  pull_request:
    paths:
      - "platform/*/chart/**"
      - "products/*/chart/**"
      - "products/*/charts/*/**"
      - "scripts/check-helm-release-payload-size.py"
      - "scripts/baselines/payload-sweep.json"
      - "tools/guards/cmd/payload-sweep/**"
      - ".github/workflows/check-helm-release-payload-size.yaml"
  push:
    branches: [main]
    paths:
      - "platform/*/chart/**"
      - "products/*/chart/**"
      - "products/*/charts/*/**"
      - "scripts/check-helm-release-payload-size.py"
      - "scripts/baselines/payload-sweep.json"
      - "tools/guards/cmd/payload-sweep/**"
      - ".github/workflows/check-helm-release-payload-size.yaml"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: azure/setup-helm@v4
        with:
          # Same version blueprint-release.yaml publishes with, so the sweep
          # measures the bytes that workflow would actually push.
          version: v3.18.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tools/guards/go.mod
          cache: false
      - name: Self-test — the gate must go red over budget and green under it
        run: python3 scripts/check-helm-release-payload-size.py --self-test
      - name: Tests of payload-sweep (a listed chart that renders, a list that grows, an unlisted chart that cannot be measured each fail)
        run: cd tools/guards && go test -count=1 ./cmd/payload-sweep
      - name: Every chart stays under the 1 MiB ceiling; only the listed charts may not render, and the list only shrinks
        run: cd tools/guards && go run ./cmd/payload-sweep --base HEAD^1
