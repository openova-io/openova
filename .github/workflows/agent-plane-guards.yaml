# agent-plane-guards.yaml - the agent-plane guard keeps what the model plane leaves behind from spreading.
#
# scripts/check-agent-plane.py holds the rules G1 to G7: the vendor's hosts, the subscription
# credential document, the token endpoint's client identifier, identity headers set by the
# caller, model base-URL settings that bypass the model gateway, the long-lived tool bearer, and
# the agent definitions (no stored model key, no forbidden tool, an evaluation set per agent).
# The counted rules compare with scripts/agent-plane-baseline.yaml; a count may only fall.
#
# The guard runs with --base HEAD^1: on a pull request the checkout is the merge commit and its
# first parent is the base branch, so a stored number that rose in the change fails. The
# checkout fetches two commits for that. There is no path filter, on purpose: a check that a
# path filter skips never reports. The self-test runs first and shows that every rule can fail.
name: agent-plane-guards

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  agent-plane-guards:
    name: agent-plane-guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Self-test of the guard (every rule can fail)
        run: python3 scripts/check-agent-plane.py --self-test
      - name: The agent-plane rules hold and no stored number rose
        run: python3 scripts/check-agent-plane.py --base HEAD^1
