name: Build sovereign-ops

# sovereign-ops (core/cmd/sovereign-ops) runs the life-cycle actions of a
# Sovereign as Kubernetes Jobs. On a pull request this workflow runs the
# module's tests and builds the image without pushing it, so a broken
# Containerfile turns the pull request red. On main it also pushes the image
# as ghcr.io/openova-io/openova/sovereign-ops:<short SHA> and signs it with
# cosign (keyless). CI writes the tag; no file in the repository pins it yet.

on:
  push:
    branches: [main]
    paths:
      - 'core/cmd/sovereign-ops/**'
      - '.github/workflows/build-sovereign-ops.yaml'
  pull_request:
    paths:
      - 'core/cmd/sovereign-ops/**'
      - '.github/workflows/build-sovereign-ops.yaml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/openova-io/openova/sovereign-ops

jobs:
  build:
    name: build sovereign-ops
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # cosign keyless signing (Sigstore) needs the OIDC token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/cmd/sovereign-ops/go.mod
          cache: false

      - name: Unit tests
        working-directory: core/cmd/sovereign-ops
        run: go test -count=1 -race ./...

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(echo "$GITHUB_SHA" | head -c 7)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image, and push it on main
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/cmd/sovereign-ops/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=https://github.com/openova-io/openova
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=sovereign-ops
          # containerd 1.7 on k3s cannot pull an image index that carries an
          # attestation manifest.
          provenance: false
          sbom: false

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
