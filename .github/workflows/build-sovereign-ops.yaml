name: Build sovereign-ops

# sovereign-ops (core/cmd/sovereign-ops) runs the life-cycle actions of a
# Sovereign as Kubernetes Jobs. On a pull request this workflow runs the
# module's tests and builds the image without pushing it, so a broken
# Containerfile turns the pull request red. On main it also pushes the image
# as ghcr.io/openova-io/openova/sovereign-ops:<short SHA> and signs it with
# cosign (keyless). Then it writes that tag into the one pin of the image,
# the images entry of the Kustomization sovereign-object in
# clusters/_template/bootstrap-kit/12b-sovereign-object.yaml (SOV-175), and
# pushes the pin to main with the release-writer key.

on:
  push:
    branches: [main]
    paths:
      - 'core/cmd/sovereign-ops/**'
      - 'core/controllers/go.mod'
      - 'core/controllers/go.sum'
      - 'core/controllers/pkg/gitea/**'
      - 'core/controllers/pkg/gitwrite/**'
      - 'core/controllers/pkg/upstream/**'
      - '.github/workflows/build-sovereign-ops.yaml'
  pull_request:
    paths:
      - 'core/cmd/sovereign-ops/**'
      - 'core/controllers/go.mod'
      - 'core/controllers/go.sum'
      - 'core/controllers/pkg/gitea/**'
      - 'core/controllers/pkg/gitwrite/**'
      - 'core/controllers/pkg/upstream/**'
      - '.github/workflows/build-sovereign-ops.yaml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/openova-io/openova/sovereign-ops

jobs:
  build:
    name: build sovereign-ops
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # cosign keyless signing (Sigstore) needs the OIDC token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/cmd/sovereign-ops/go.mod
          cache: false

      - name: Unit tests
        working-directory: core/cmd/sovereign-ops
        run: go test -count=1 -race ./...

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(echo "$GITHUB_SHA" | head -c 7)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image, and push it on main
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/cmd/sovereign-ops/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=https://github.com/openova-io/openova
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=sovereign-ops
          # containerd 1.7 on k3s cannot pull an image index that carries an
          # attestation manifest.
          provenance: false
          sbom: false

      # Sign the image and attest its bill of materials through the shared
      # action, before its tag is pinned (FND-062).
      - name: Sign and attest the image
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/sign-and-attest
        with:
          ref: ${{ env.IMAGE }}
          digest: ${{ steps.build.outputs.digest }}
          release-key: ${{ secrets.RELEASE_COSIGN_KEY }}
          release-key-password: ${{ secrets.RELEASE_COSIGN_PASSWORD }}

      # SOV-175: the writer of the Sovereign object runs this image in every
      # region. The slot holds exactly one newTag line; a pin that is not found
      # fails the job instead of pushing nothing.
      - name: Pin the image in the slot of the Sovereign object writer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
        run: |
          set -euo pipefail
          f=clusters/_template/bootstrap-kit/12b-sovereign-object.yaml
          test "$(grep -c '^      newTag: [0-9a-f]\{7,40\}$' "$f")" = 1
          sed -i "s/^      newTag: [0-9a-f]\{7,40\}\$/      newTag: ${SHA_SHORT}/" "$f"
          grep -x "      newTag: ${SHA_SHORT}" "$f"

      - name: Push the pin
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/deploy-bump
        with:
          paths: clusters/_template/bootstrap-kit/12b-sovereign-object.yaml
          commit-message: "deploy: pin sovereign-ops ${{ steps.vars.outputs.sha_short }} in the Sovereign object writer (Refs SOV-175)"
          release-writer-key: ${{ secrets.RELEASE_WRITER_KEY }}
