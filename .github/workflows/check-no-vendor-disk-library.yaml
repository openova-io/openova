# check-no-vendor-disk-library.yaml - the vendor disk library never enters the repository.
#
# The rules are in scripts/check-no-vendor-disk-library.sh. No path filter, on purpose: the
# library can arrive under any path. The ruleset of main (.github/rulesets/main.json) requires
# the job by its name, vendor-disk-library, so the check must run and pass on every pull
# request and every merge group; a check that did not run is not green.
name: check-no-vendor-disk-library

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  vendor-disk-library:
    name: vendor-disk-library
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Self-test (every rule can fail)
        run: bash scripts/check-no-vendor-disk-library.sh --self-test
      - name: No tracked file is the vendor disk library
        run: bash scripts/check-no-vendor-disk-library.sh --repo
