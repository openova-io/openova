name: Build Axon

on:
  push:
    paths: ['products/axon/**']
    branches: [main]
  pull_request:
    paths: ['products/axon/**', '.github/workflows/axon-build.yaml']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/openova-io/openova/axon

permissions:
  contents: read
  packages: write
  # The step that signs the image needs a GitHub OIDC token (FND-062).
  id-token: write

jobs:
  build-axon:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build and test
        working-directory: products/axon
        run: |
          npm ci
          npm run build
          npm test

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(echo $GITHUB_SHA | head -c 7)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: products/axon
          file: products/axon/Containerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:test

      - name: Smoke test
        run: |
          # Verify container starts without crashing: the process stays
          # alive (no import/build errors) without Claude auth.
          docker run -d --name smoke \
            -e AXON_API_KEYS=sk-smoke-test \
            ${{ env.IMAGE }}:test
          sleep 5

          if ! docker ps --filter "name=smoke" --filter "status=running" -q | grep -q .; then
            echo "Container crashed:"
            docker logs smoke
            exit 1
          fi
          echo "Smoke test passed: container running"
          docker stop smoke

      - name: Push image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: products/axon
          file: products/axon/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE }}:latest

      # Sign the image and attest its bill of materials through the shared
      # action, before its tag is pinned (FND-062).
      - name: Sign and attest the image
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/sign-and-attest
        with:
          ref: ${{ env.IMAGE }}
          digest: ${{ steps.push.outputs.digest }}
          release-key: ${{ secrets.RELEASE_COSIGN_KEY }}
          release-key-password: ${{ secrets.RELEASE_COSIGN_PASSWORD }}
