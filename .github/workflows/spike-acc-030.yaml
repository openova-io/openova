# ACC-030 lab test (never merged): per-session credentials through the
# Secrets Store CSI mount (OpenBao provider), an Organization virtual cluster's
# identity, the exec proxy's trust file, SeaweedFS object lock, transit ed25519,
# and the behaviour of the mounted files under the driver's rotation.
# Runs only on pushes to its own branch, on throwaway kind clusters.
name: spike-acc-030

on:
  push:
    branches: [spike/ACC-030]

permissions:
  contents: read

jobs:
  items:
    name: items a to h
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (k8s-ws-proxy build)
        uses: actions/setup-go@v5
        with:
          go-version-file: core/cmd/k8s-ws-proxy/go.mod
          cache-dependency-path: core/cmd/k8s-ws-proxy/go.sum

      - name: Set up helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Set up kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: acc030
          version: v0.27.0
          node_image: kindest/node:v1.31.6@sha256:28b7cbb993dfe093c76641a0c95807637213c9109b761f1d422c2400e22b8e87
          kubectl_version: v1.31.6
          wait: 120s

      - name: Run items a to h
        env:
          OUT: ${{ github.workspace }}/out
        run: bash tests/spikes/ACC-030/items.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-030-items
          path: out/
          if-no-files-found: warn

  rotation:
    name: item i, rotation ${{ matrix.interval }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        interval: [3600s, 120s]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Set up kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: acc030rot
          version: v0.27.0
          node_image: kindest/node:v1.31.6@sha256:28b7cbb993dfe093c76641a0c95807637213c9109b761f1d422c2400e22b8e87
          kubectl_version: v1.31.6
          wait: 120s

      - name: Run item i
        env:
          OUT: ${{ github.workspace }}/out
          INTERVAL: ${{ matrix.interval }}
        run: bash tests/spikes/ACC-030/rotation.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acc-030-rotation-${{ matrix.interval }}
          path: out/
          if-no-files-found: warn
