name: Build catalyst-catalog

# catalyst-catalog — multi-source Blueprint catalog HTTP REST service
# (EPIC-2 Slice L of #1097). REPLACES the per-Organization catalog per
# ADR-0001 §4.3.
#
# Per docs/PRINCIPLES.md #4a "GitHub Actions is the only
# build path" — this workflow is the canonical (and only) way to
# produce a `ghcr.io/openova-io/openova/catalyst-catalog:<sha>` image.
#
# Trigger model is event-driven per the openova-private CLAUDE.md
# coupled rule: push-on-main is the canonical trigger; workflow_dispatch
# is the manual override for ad-hoc rebuilds. NO cron.
#
# Path filter watches:
#   - core/services/catalyst-catalog/**       (the service itself)
#   - core/controllers/pkg/gitea/**           (the imported Gitea client)
#   - core/controllers/go.mod                 (replaced module)
#   - core/controllers/go.sum                 (replaced module)
#   - .github/workflows/catalyst-catalog-build.yaml (this file)

on:
  push:
    paths:
      - 'core/services/catalyst-catalog/**'
      - 'core/controllers/pkg/gitea/**'
      - 'core/controllers/go.mod'
      - 'core/controllers/go.sum'
      - '.github/workflows/catalyst-catalog-build.yaml'
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/services/catalyst-catalog/**'
      - 'core/controllers/pkg/gitea/**'
      - 'core/controllers/go.mod'
      - 'core/controllers/go.sum'
      - '.github/workflows/catalyst-catalog-build.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/openova-io/openova/catalyst-catalog

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: |
            core/services/catalyst-catalog/go.sum
            core/controllers/go.sum

      - name: go vet (catalog service)
        working-directory: core/services/catalyst-catalog
        run: go vet ./...

      - name: go test (catalog service, race + count=1)
        working-directory: core/services/catalyst-catalog
        # Race + count=1 catches flakes that a cached run would hide.
        # Tests use httptest fakes (no real Gitea required).
        run: go test -count=1 -race ./...

      - name: go vet (gitea client — promoted to pkg/)
        working-directory: core/controllers
        # The Gitea client lives in core/controllers/pkg/gitea — exercising
        # vet here ensures the promotion path stays linkable.
        run: go vet ./pkg/gitea/...

      - name: go test (gitea client)
        working-directory: core/controllers
        run: go test -count=1 -race ./pkg/gitea/...

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # contents: write - the deploy step below pushes the tag bump to main.
      contents: write
      packages: write
      id-token: write
      # actions: write - `gh workflow run` dispatches the chart re-publish.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(echo $GITHUB_SHA | head -c 7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          # Build context is the repository root so the Containerfile's
          # COPY paths can reach BOTH core/services/catalyst-catalog/
          # AND core/controllers/pkg/gitea/ (the replaced module that
          # supplies the unified Gitea client).
          context: .
          file: core/services/catalyst-catalog/Containerfile
          push: true
          # SHA-pinned tags. Two emitted:
          #   :<short-sha>   — what cluster manifests reference
          #   :<full-sha>    — long form for audit trails
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE }}:${{ github.sha }}
          provenance: false

      # Sign the image and attest its bill of materials through the shared
      # action, before its tag is pinned (FND-062).
      - name: Sign and attest the image
        uses: ./.github/actions/sign-and-attest
        with:
          ref: ${{ env.IMAGE }}
          digest: ${{ steps.build.outputs.digest }}
          release-key: ${{ secrets.RELEASE_COSIGN_KEY }}
          release-key-password: ${{ secrets.RELEASE_COSIGN_PASSWORD }}

      # Bump services.catalog.image.tag so the next chart release carries this
      # image, as useraccess-controller-build.yaml does for its controller. A
      # job "notify" stood here before: it sent a repository dispatch that the
      # job token was refused, and no workflow received that event (FND-028).
      - name: Bump services.catalog.image.tag in values.yaml
        if: github.ref == 'refs/heads/main'
        env:
          SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
        run: |
          VALUES="products/catalyst/chart/values.yaml"
          # awk: the first `      tag:` (image.tag) of `  catalog:` under the
          # top-level `services:`; no other tag moves.
          awk -v sha="${SHA_SHORT}" '
            /^[^ #]/ { in_svc = ($0 ~ /^services:/); in_cat = 0 }
            in_svc && /^  [a-zA-Z]/ { in_cat = ($0 ~ /^  catalog:/) }
            in_cat && /^      tag:/ { sub(/"[^"]*"/, "\"" sha "\""); in_cat = 0 }
            { print }
          ' "${VALUES}" > "${VALUES}.tmp" && mv "${VALUES}.tmp" "${VALUES}"
          # Read the value back: a bump that matched nothing fails here.
          got="$(awk '
            /^[^ #]/ { in_svc = ($0 ~ /^services:/); in_cat = 0 }
            in_svc && /^  [a-zA-Z]/ { in_cat = ($0 ~ /^  catalog:/) }
            in_cat && /^      tag:/ { gsub(/"/, "", $2); print $2; exit }
          ' "${VALUES}")"
          echo "services.catalog.image.tag after the bump: ${got}"
          test "${got}" = "${SHA_SHORT}"

      - name: Commit and push values.yaml bump
        id: deploy_commit
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/deploy-bump
        with:
          paths: products/catalyst/chart/values.yaml
          commit-message: "deploy: bump catalyst-catalog image to ${{ steps.vars.outputs.sha_short }}"
          release-writer-key: ${{ secrets.RELEASE_WRITER_KEY }}

      # A push made with the release-writer key starts no workflow ([skip ci]),
      # so the chart re-publish is dispatched here.
      - name: Dispatch blueprint-release for chart re-publish
        if: github.ref == 'refs/heads/main' && steps.deploy_commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run blueprint-release.yaml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f blueprint=catalyst \
            -f tree=products
