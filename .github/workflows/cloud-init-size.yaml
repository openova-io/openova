name: cloud-init-size

# REQUIRED-ABLE PR gate against the #3715-class regression (Refs #3724): a
# cloud-init change that pushes the rendered `user_data` past Hetzner's HARD
# 32768-byte cap. The repo already enforces a 32256 B (CP) / 30720 B (worker)
# guardrail via `precondition` blocks in infra/providers/hetzner/main.tf, but
# those only fire inside `tofu test`/`tofu plan`. On PR #3715 the `tofu test` PR
# check DID go red — but it was (a) not a required/blocking check and (b) shared
# the ambiguous name `validate + fmt + test` with the passing huawei job, so the
# red was overlooked and the PR merged, silently freezing "Build & Deploy
# Catalyst" (G36 tofu test) on every subsequent main commit for hours.
#
# This workflow has ONE uniquely-named status check, `cloud-init-size / packs`,
# that will NEVER collide with another job's name. It finds the provider packs
# by directory (CLD-090: every folder of infra/providers whose name does not
# start with "_"; no list of provider names) and runs the size script for each
# pack the script has a fixture for. It renders the REAL templates, applies
# the SAME comment-strip the provider applies to user_data, and asserts the byte
# size against the limit a real installation meets. A pack without a fixture
# passes only when its profile.yaml states that it has no boot-data limit
# (userDataLimitBytes: 0); with a limit and no fixture the check fails.
#
# #7893: the gate is the WORST-CASE render (scripts/cloudinit-size-check.py),
# made from the provider module's own expressions with the longest values a
# real installation can carry, for the primary and the secondary region. The
# short reference values passed a render that the Huawei ECS API then refused
# on a real two-region installation (32,931 bytes against 32,768). The limits:
# huawei 32768 (the API); hetzner 32576 primary / 32256 secondary / 30720
# worker (the module's preconditions, under the API's 32768).
#
# Per CLAUDE.md "every workflow MUST be event-driven, NEVER scheduled": this is
# pull-request-on-touch + push-on-merge; ad-hoc reruns go through
# workflow_dispatch. There is no `schedule:` trigger. It does NOT provision
# anything, touch the network, or modify any template.

on:
  push:
    branches: [main]
    paths:
      - 'infra/providers/**'
      - 'products/catalyst/bootstrap/**'
      - 'scripts/cloudinit-size-check.sh'
      - 'scripts/cloudinit-size-check.py'
      - '.github/workflows/cloud-init-size.yaml'
  pull_request:
    paths:
      - 'infra/providers/**'
      - 'products/catalyst/bootstrap/**'
      - 'scripts/cloudinit-size-check.sh'
      - 'scripts/cloudinit-size-check.py'
      - '.github/workflows/cloud-init-size.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size:
    # IMPORTANT: the `name:` below is what surfaces as the status-check name
    # (`cloud-init-size / packs`). Do NOT genericise it.
    name: packs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SEC-154: the comparison step renders the base of the pull request,
          # the first parent of its merge commit.
          fetch-depth: 2

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          # CLD-090 — 1.11.6, the version infra-hetzner-tofu.yaml,
          # infra-huawei-tofu.yaml and catalyst-build.yaml use. Bump in
          # lockstep with those two module workflows.
          tofu_version: 1.11.6

      - name: Pin runner deps (python3)
        run: |
          set -eu
          echo "python3: $(python3 --version)"
          echo "tofu:    $(tofu version | head -1)"

      - name: Render + assert cloud-init user_data byte size (every provider pack)
        run: |
          set -eu
          chmod +x scripts/cloudinit-size-check.sh
          # For every pack with a fixture: renders the worst-case control plane
          # and worker of the primary and the secondary region, applies the
          # SAME comment-strip the provider applies to user_data, and FAILS
          # (exit 1 + ::error::) if any surface exceeds its limit. Emits a
          # ::warning:: when a surface is within 1024 B of its limit so the
          # cliff is visible BEFORE a PR trips it, and a ::notice:: with the
          # exact byte count and margin otherwise.
          checked=0
          for d in infra/providers/*/; do
            pack="$(basename "$d")"
            case "$pack" in _*) continue ;; esac
            if grep -q "^fixture_cp_${pack}()" scripts/cloudinit-size-check.sh; then
              ./scripts/cloudinit-size-check.sh "$pack"
              checked=$((checked + 1))
            elif grep -Eq 'userDataLimitBytes: *0([^0-9]|$)' "$d/profile.yaml"; then
              echo "::notice title=cloud-init-size ${pack}::pack ${pack} has no boot-data limit (profile.yaml: userDataLimitBytes 0) and the size script has no fixture for it: nothing to check"
            else
              echo "::error title=cloud-init-size ${pack}::pack ${pack} has a boot-data limit in profile.yaml and scripts/cloudinit-size-check.sh has no fixture for it"
              exit 1
            fi
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error title=cloud-init-size::no provider pack was checked"
            exit 1
          fi

      # SEC-154: every surface of the pull request against its base (the first
      # parent of the merge commit), both measured by their own size script. A
      # record, not a gate on growth: a surface that grows prints a warning, and
      # a story whose acceptance asks for smaller start-up data is judged on
      # these lines. It fails when a tree cannot be measured or the two trees
      # do not render the same surfaces.
      - name: Compare every surface with the base of the pull request
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          git worktree add --detach -q "$RUNNER_TEMP/base" HEAD^1
          for t in base head; do
            d=.; [ "$t" = base ] && d="$RUNNER_TEMP/base"
            rc=0
            ( cd "$d" && NO_COLOR=1 bash scripts/cloudinit-size-check.sh both ) > "$RUNNER_TEMP/$t.log" 2>&1 || rc=$?
            if [ "$rc" -gt 1 ]; then cat "$RUNNER_TEMP/$t.log"; echo "::error title=cloud-init-size::the $t tree cannot be measured (exit $rc)"; exit 1; fi
            sed -n -E 's/^ +(PASS|WARN|FAIL) (.+) \(worst case\): ([0-9]+) bytes, limit ([0-9]+).*$/\2|\3|\4/p' "$RUNNER_TEMP/$t.log" | LC_ALL=C sort > "$RUNNER_TEMP/$t.txt"
          done
          if [ ! -s "$RUNNER_TEMP/base.txt" ] || [ "$(cut -d'|' -f1 "$RUNNER_TEMP/base.txt")" != "$(cut -d'|' -f1 "$RUNNER_TEMP/head.txt")" ]; then
            cat "$RUNNER_TEMP/base.log" "$RUNNER_TEMP/head.log"
            echo "::error title=cloud-init-size::the base and the head do not render the same surfaces"
            exit 1
          fi
          printf '%-50s %7s %7s %7s\n' surface base head change
          LC_ALL=C join -t'|' "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" | while IFS='|' read -r s b _ h _; do
            printf '%-50s %7d %7d %+7d\n' "$s" "$b" "$h" "$((h - b))"
            if [ "$h" -gt "$b" ]; then echo "::warning title=cloud-init-size::$s grows by $((h - b)) bytes against the base ($b to $h)"; fi
          done

      - name: Self-test the gate (pad the template oversized, prove it FAILS, then restore)
        if: always()
        run: |
          set -eu
          TPL=infra/providers/_shared/cloudinit-control-plane.tftpl
          cp "$TPL" "${TPL}.orig"
          # Inject ~20 KB of OPERATIVE (non-comment) padding so the comment-strip
          # cannot remove it — the rendered surface must blow past its limit.
          # (python3 -c, NOT a heredoc, to avoid YAML/heredoc-indentation traps.)
          python3 -c 'import sys; p=sys.argv[1]; s=open(p).read(); i=s.find(chr(10)); pad=(chr(10)+"  CLOUDINIT_SIZE_SELFTEST_PADDING_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"+chr(10))*280; open(p,"w").write(s[:i+1]+pad+s[i+1:])' "$TPL"
          # Every pack with a fixture must fail by itself.
          missed=""
          caught=0
          : >/tmp/selftest.log
          for d in infra/providers/*/; do
            pack="$(basename "$d")"
            case "$pack" in _*) continue ;; esac
            grep -q "^fixture_cp_${pack}()" scripts/cloudinit-size-check.sh || continue
            set +e
            ./scripts/cloudinit-size-check.sh "$pack" >>/tmp/selftest.log 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then missed="${missed} ${pack}"; else caught=$((caught + 1)); fi
          done
          mv "${TPL}.orig" "$TPL"
          echo "--- self-test output (oversized padding injected) ---"
          cat /tmp/selftest.log
          if [ -n "$missed" ] || [ "$caught" -eq 0 ]; then
            echo "SELF-TEST FAILED: gate did NOT catch the oversized cloud-init for:${missed:- any pack}"
            exit 1
          fi
          echo "SELF-TEST PASSED: gate caught the oversized cloud-init for ${caught} pack(s); template restored"

      - name: Summary
        if: always()
        run: |
          {
            echo "## cloud-init-size / packs"
            echo ''
            echo "Rendered the cloud-init of every provider pack with worst-case values"
            echo '(control plane and worker of the primary and the secondary region),'
            echo 'applied the same comment-strip the provider applies to `user_data`,'
            echo 'and asserted each surface is within the limit a real installation'
            echo 'meets (huawei 32768; hetzner 32576 primary, 32256 secondary, 30720'
            echo 'worker). A surface over its limit fails this required check; a'
            echo 'surface within 1024 B of it emits a low-margin warning.'
          } >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
