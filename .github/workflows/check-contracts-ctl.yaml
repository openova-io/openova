name: check-contracts-ctl

# The contracts of the control-plane area. Job event-subjects is guard G4 of
# contract C3: every event subject the Go code names is in
# docs/contracts/C3-event-subjects.yaml, and the calls that create a JetStream
# stream may not rise. Its rules are at the head of scripts/check-event-subjects.py.
# No path filter: a change to any Go file can break the guard.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  event-subjects:
    name: event-subjects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Self-test (each rule can fail)
        run: python3 scripts/check-event-subjects.py --self-test
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Guard G4
        run: python3 scripts/check-event-subjects.py
